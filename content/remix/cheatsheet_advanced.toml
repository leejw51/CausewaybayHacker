# REMIX LAND — CHEATSHEET ADVANCED. The sharp end of the Go · Rust · Python
# live-coding cheatsheet (~/vivid/Cheatsheet, go_rust_python_cheatsheet.html),
# asked the same way as the BASIC road: four lines, one right, nothing typed
# and nothing compiled — the pick is the submission, and the server judges it
# against the quiz (SPEC §0). The road walks ten ideas three times each, one
# language per node, so neighbouring nodes ask the SAME thing in Go, then
# Rust, then Python: a channel handoff, a mutex-guarded counter, waiting for
# N workers, interface / trait / Protocol, a bounded generic, a closure that
# keeps state, custom errors and wrapping, iterators and generators, JSON in
# and out of a struct, and pattern matching. Each quest names its language in
# the brief and in `lang`; the wrong lines are the near-miss in the right
# language (a missing `move`, a lock released a line early, a list where a
# tuple is wanted) and the other two languages' spellings of the same idea.
#
# Toolchains: Go 1.22+ (1.23 where the brief says so), Rust stable 2024
# edition with std only, Python 3.12 with std only. Every right line was run,
# and the wrong lines were checked against the real toolchain.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "remix.cheatsheet_advanced"
land = "remix"
category = "cheatsheet_advanced"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "remix.cheatsheet_advanced.01.handoff-go"
node        = 1
title       = "HAND IT OVER"
difficulty  = 3
lang        = "go"
story       = "06:50, Jardine's Bazaar. Mei asks the kiosk for one number and the kiosk waits for her to take it before it has even made it."
concepts    = ["channels", "concurrency", "deadlock"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
In **Go**, `main` has `ch := make(chan int)` — **unbuffered** — and later
does `x := <-ch`. `compute()` returns an `int`. Which line, placed between
those two, delivers `compute()`'s result into `x` without `main` deadlocking?
'''
solution    = 'go func() { ch <- compute() }()'
hints = [
  "An unbuffered send blocks until someone receives. The sender has to be a different goroutine from the receiver.",
]

[quest.quiz]
choices = [
  'go func() { ch <- compute() }()',
  'ch <- compute()',
  'go ch <- compute()',
  'go func() { compute() <- ch }()',
]
answer  = 0

# ---------------------------------------------------------------- 02
