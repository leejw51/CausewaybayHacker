map         = { x = 0.60, y = 0.10, kind = "quest" }
brief       = '''
In **Go**,

```
type C struct {
    mu sync.Mutex
    n  int
}

func (c *C) Inc() {
    // ____
    c.n++
}
```

Two goroutines each call `Inc` 1000 times. Which line makes `c.n` exactly
2000 on every run, clean under `go test -race`, and never leaves the mutex
held?
'''
solution    = 'c.mu.Lock(); defer c.mu.Unlock()'
hints = [
  "The increment itself has to happen while the lock is held, and the unlock has to be scheduled for when the method returns.",
]

[quest.quiz]
choices = [
  'c.mu.Lock(); c.mu.Unlock()',
  'defer c.mu.Lock(); c.mu.Unlock()',
  '*c.lock().unwrap() += 1;',
  'c.mu.Lock(); defer c.mu.Unlock()',
]
answer  = 3

