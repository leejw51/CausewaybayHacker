between the two, starts a thread that delivers `compute()`'s result to `v`
— and compiles?
'''
solution    = 'thread::spawn(move || tx.send(compute()).unwrap());'
hints = [
  "A spawned closure may outlive main's stack frame, so it cannot borrow the sender; it has to own it.",
]

[quest.quiz]
choices = [
  'thread::spawn(|| tx.send(compute()).unwrap());',
  'thread::spawn(move || rx.send(compute()).unwrap());',
  'thread::spawn(move || tx.send(compute()).unwrap());',
  'go func() { ch <- compute() }()',
]
answer  = 2

