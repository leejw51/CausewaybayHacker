[[quest]]
id          = "remix.cheatsheet_advanced.04.counter-go"
node        = 4
title       = "ONE AT A TIME"
difficulty  = 3
lang        = "go"
story       = "Chef Bo's order counter at Lucky Mac: two cooks, a thousand ticks each, and the board must say exactly two thousand."
