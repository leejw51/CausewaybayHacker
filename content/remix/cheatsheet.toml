# REMIX LAND — CHEATSHEET. The grammar off the page, asked: one question per
# row of the Go · Rust · Python live-coding cheatsheet (~/vivid/Cheatsheet,
# go_rust_python_cheatsheet.html), four lines, one right. Nothing is typed and
# nothing is compiled — the pick is the submission, and the server judges it
# against the quiz (SPEC §0). Each quest names its language in the brief and
# in `lang`; the wrong lines are mostly the other two languages' spellings of
# the same idea, plus the near-miss in the right language.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "remix.cheatsheet"
land = "remix"
category = "cheatsheet"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "remix.cheatsheet.01.flush"
node        = 1
title       = "THE FLUSH"
difficulty  = 1
lang        = "go"
story       = "06:30, Jardine's Bazaar. The kiosk printed every answer into a buffer, and the screen stayed blank."
concepts    = ["io", "functions"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
In **Go**, `main` starts with

```
in := bufio.NewReader(os.Stdin)
out := bufio.NewWriter(os.Stdout)
// ____
```

Which line, right there, makes sure everything written to `out` reaches the
screen when `main` returns?
'''
solution    = 'defer out.Flush()'
hints = [
  "A buffered writer only writes when flushed. Schedule the flush for the moment main returns.",
]

[quest.quiz]
choices = [
  'out.Close()',
  'defer out.Flush()',
  'drop(out);',
  'sys.stdout.flush()',
]
answer  = 1

