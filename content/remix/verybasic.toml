solution    = '''
import queue
import sys
import threading


def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    q = queue.Queue()
    tallies = [0] * 3
    counts = [0] * 3

    def consume(i):
        while True:
            x = q.get()
            if x is None:
                break
            tallies[i] += x
            counts[i] += 1

    threads = [threading.Thread(target=consume, args=(i,)) for i in range(3)]
    for t in threads:
        t.start()
    for x in nums:
        q.put(x)
    for _ in threads:
        # FILL: send every number, then one None per consumer
        q.put(None)
    for t in threads:
        t.join()

    print(sum(tallies))
    print(sum(counts))


main()
