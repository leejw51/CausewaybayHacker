solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var a, b int64
	fmt.Fscan(reader, &a, &b)

	fmt.Println(a + b)
	q := a / b
	r := a % b
	// FILL: quotient, remainder, and the exact share as a float64
	f := float64(a) / float64(b)
	fmt.Println(q, r)
	fmt.Printf("%.2f\n", f)
}
'''
