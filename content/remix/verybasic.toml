Rust spells it `while cond { }`, and the increment is `steps += 1;` — there is no `++`. The `if` inside is an expression too, which is why `n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };` would also work.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  6
output: 8
        16
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut n: i64 = input.trim().parse().unwrap();

    let mut steps = 0;
    let mut peak = n;
    // FILL: loop until n is 1, counting each step
        steps += 1;
        if n % 2 == 0 {
            n /= 2;
        } else {
            n = 3 * n + 1;
        }
        if n > peak {
            peak = n;
        }
    }
