package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int64
	fmt.Fscan(reader, &n)

	steps := 0
	peak := n
	// FILL: loop until n is 1, counting each step
	for n != 1 {
		steps++
		if n%2 == 0 {
			n /= 2
		} else {
			n = 3*n + 1
		}
		if n > peak {
			peak = n
		}
	}
	fmt.Println(steps)
	fmt.Println(peak)
}
'''
