use std::io::Read;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();
    let size = (nums.len() + 2) / 3;

    let mut handles = Vec::new();
    for chunk in nums.chunks(size) {
        let chunk = chunk.to_vec();
        // FILL: own the chunk, then spawn a thread that sums it
        handles.push(thread::spawn(move || chunk.iter().sum::<i64>()));
    }
    let mut total = 0;
    for h in handles {
        let s = h.join().unwrap();
        print!("{} ", s);
        total += s;
    }
    println!();
    println!("{}", total);
}
