solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func search(grid [][]byte, r, c int, word []byte, at int) bool {
	if grid[r][c] != word[at] {
		return false
	}
	if at+1 == len(word) {
		return true
	}

	here := grid[r][c]
	grid[r][c] = '#'
	defer func() { grid[r][c] = here }()

	rows, cols := len(grid), len(grid[0])
	if r > 0 && search(grid, r-1, c, word, at+1) {
		return true
	}
	if r+1 < rows && search(grid, r+1, c, word, at+1) {
		return true
	}
	if c > 0 && search(grid, r, c-1, word, at+1) {
		return true
	}
	if c+1 < cols && search(grid, r, c+1, word, at+1) {
		return true
	}
	return false
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var rows, cols int
	fmt.Fscan(reader, &rows, &cols)
	grid := make([][]byte, rows)
	for i := range grid {
		var line string
		fmt.Fscan(reader, &line)
		grid[i] = []byte(line)
	}
	var word string
	fmt.Fscan(reader, &word)
	letters := []byte(word)

	starts := 0
	for r := 0; r < rows; r++ {
		for c := 0; c < cols; c++ {
			if grid[r][c] == letters[0] {
				starts++
			}
		}
	}

	found := false
	for r := 0; r < rows && !found; r++ {
		for c := 0; c < cols && !found; c++ {
			if search(grid, r, c, letters, 0) {
				found = true
			}
		}
	}

	if found {
		fmt.Println("FOUND")
	} else {
		fmt.Println("ABSENT")
	}
	fmt.Printf("STARTS %d\n", starts)
}
'''
hints = [
