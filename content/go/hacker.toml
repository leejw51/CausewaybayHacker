solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	var target int64
	fmt.Fscan(reader, &n, &target)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	lo, hi := 0, n-1
	for lo < hi {
		mid := lo + (hi-lo)/2
		if nums[mid] > nums[hi] {
			lo = mid + 1
		} else {
			hi = mid
		}
	}
	pivot := lo

	search := func(lo, hi int) int {
		for lo <= hi {
			mid := lo + (hi-lo)/2
			switch {
			case nums[mid] == target:
				return mid
			case nums[mid] < target:
				lo = mid + 1
			default:
				hi = mid - 1
			}
		}
		return -1
	}

	found := search(pivot, n-1)
	if found < 0 {
		found = search(0, pivot-1)
	}

	if found < 0 {
		fmt.Println(-1)
	} else {
		fmt.Println(found + 1)
	}
	fmt.Printf("PIVOT %d\n", pivot+1)
}
'''
hints = [
  "The pivot is the only place where a value is greater than the one after it — compare mid against hi, not against lo.",
  "After the pivot loop, lo == hi and that is the smallest value's index; a list that was not rotated gives 0.",
  "Each half is plain sorted, so the second search is an ordinary binary search run at most twice.",
]

