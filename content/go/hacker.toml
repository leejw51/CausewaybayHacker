solution     = '''
package main

import (
	"bufio"
	"container/list"
	"fmt"
	"os"
	"strconv"
	"strings"
)

type pair struct {
	key   int64
	value int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var capacity, q int
	fmt.Fscan(reader, &capacity, &q)

	recent := list.New() // front is the most recently used
	where := map[int64]*list.Element{}
	evicted := 0

	for i := 0; i < q; i++ {
		var op string
		var key int64
		fmt.Fscan(reader, &op, &key)

		if op == "GET" {
			element, ok := where[key]
			if !ok {
				fmt.Println(-1)
				continue
			}
			recent.MoveToFront(element)
			fmt.Println(element.Value.(*pair).value)
			continue
		}

		var value int64
		fmt.Fscan(reader, &value)

		if element, ok := where[key]; ok {
			element.Value.(*pair).value = value
			recent.MoveToFront(element)
			continue
		}
		if recent.Len() == capacity {
			oldest := recent.Back()
			delete(where, oldest.Value.(*pair).key)
			recent.Remove(oldest)
			evicted++
		}
		where[key] = recent.PushFront(&pair{key: key, value: value})
	}

	if recent.Len() == 0 {
		fmt.Println("-")
	} else {
		keys := make([]string, 0, recent.Len())
		for element := recent.Front(); element != nil; element = element.Next() {
			keys = append(keys, strconv.FormatInt(element.Value.(*pair).key, 10))
		}
		fmt.Println(strings.Join(keys, " "))
	}
	fmt.Printf("EVICTED %d\n", evicted)
}
'''
