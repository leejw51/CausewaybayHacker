solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func present(tree []int64, i int) bool {
	return i < len(tree) && tree[i] != -1
}

func walk(tree []int64, i, order int, out *[]int64) {
	if !present(tree, i) {
		return
	}
	if order == 0 {
		*out = append(*out, tree[i])
	}
	walk(tree, 2*i+1, order, out)
	if order == 1 {
		*out = append(*out, tree[i])
	}
	walk(tree, 2*i+2, order, out)
	if order == 2 {
		*out = append(*out, tree[i])
	}
}

func depth(tree []int64, i int) int {
	if !present(tree, i) {
		return 0
	}
	left := depth(tree, 2*i+1)
	right := depth(tree, 2*i+2)
	if left > right {
		return 1 + left
	}
	return 1 + right
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	tree := make([]int64, n)
	for i := range tree {
		fmt.Fscan(reader, &tree[i])
	}

	for order := 0; order < 3; order++ {
		out := make([]int64, 0, n)
		walk(tree, 0, order, &out)
		fmt.Println(join(out))
	}
	fmt.Printf("DEPTH %d\n", depth(tree, 0))
}

func join(values []int64) string {
	s := ""
	for i, v := range values {
		if i > 0 {
			s += " "
		}
		s += fmt.Sprint(v)
	}
	return s
}
'''
