id           = "go.hacker.29.dijkstra"
node         = 28
title        = "NOT EVERY STREET IS THE SAME LENGTH"
difficulty   = 5
time_limit_s = 1500
story        = "Every map you have cleared so far counted hops. The tram does not care how many stops there are; it cares how long they take."
concepts     = ["graphs", "heaps", "complexity"]
requires     = ["go.hacker.27.commands"]
map          = { x = 0.122, y = 0.670, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops, `m` undirected weighted edges. Build
the graph yourself, with **exactly** this generator, in `uint64` (which wraps
in Go without any ceremony):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Print the sum of the shortest distances from stop `0` to every reachable stop
(including `0` itself, which is `0`), then `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**The complexity here is enforced.** One hidden case is `n = 100000`,
`m = 200000`. Dijkstra is the right algorithm either way; what the clock
decides is the priority queue. Scanning every unvisited node for the minimum
is `O(V²)` — `10^10` comparisons, and it takes sixteen seconds against a five
second run limit. A binary heap makes it `O((V + E) log V)` and the same case
comes back in forty-four milliseconds. Both measured on this machine, with the
two programs that ship in this quest: the starter is the scanning version, and
it gets the right answer — just three times too late.

`container/heap` over a slice of `{dist, node}`, ordered by `dist`. There is
no decrease-key and you do not need one: push the improved distance as a new
entry and skip any entry you pop whose distance is already worse than the one
you have recorded. That stale-entry skip is the line people forget.
'''
starter      = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type rng struct{ x uint64 }

func (r *rng) next() uint64 {
	r.x = r.x*6364136223846793005 + 1442695040888963407
	return r.x >> 33
}

type edge struct {
	to int
	w  int64
}

func build(n, m int, seed uint64) [][]edge {
	r := &rng{seed}
	g := make([][]edge, n)
	add := func(a, b int, w int64) {
