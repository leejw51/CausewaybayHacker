  "The pairs cancel themselves out whatever order they arrive in, so one fold over the slice is enough.",
  "Counting bits by clearing the lowest one each time runs once per set bit, not once per bit width.",
  "A power of two has exactly one bit set, so clearing the lowest leaves zero — and zero itself has to be excluded by hand.",
]

