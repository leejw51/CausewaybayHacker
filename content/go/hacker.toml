solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func find(parent []int, x int) int {
	root := x
	for parent[root] != root {
		root = parent[root]
	}
	// path compression: point everything we walked over straight at the root
	for parent[x] != root {
		next := parent[x]
		parent[x] = root
		x = next
	}
	return root
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, m int
	fmt.Fscan(reader, &n, &m)

	parent := make([]int, n)
	size := make([]int, n)
	for i := range parent {
		parent[i] = i
		size[i] = 1
	}
	groups := n
	redundant := 0

	for e := 0; e < m; e++ {
		var a, b int
		fmt.Fscan(reader, &a, &b)
		ra, rb := find(parent, a), find(parent, b)
		if ra == rb {
			redundant++
			continue
		}
		// hang the smaller tree under the bigger one
		if size[ra] < size[rb] {
			ra, rb = rb, ra
		}
		parent[rb] = ra
		size[ra] += size[rb]
		groups--
	}

	largest := 0
	for i := 0; i < n; i++ {
		if parent[i] == i && size[i] > largest {
			largest = size[i]
		}
	}

	fmt.Println(groups)
	fmt.Println(largest)
	fmt.Printf("REDUNDANT %d\n", redundant)
}
'''
hints = [
  "Start with every stop as its own parent and n groups; each successful union drops the count by one.",
  "An edge whose two ends already have the same root is the redundant one — count it and move on.",
  "Only a root's size entry is meaningful, so read the largest off the roots, not off every index.",
]

