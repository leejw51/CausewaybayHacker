package main

import (
	"bufio"
	"fmt"
	"math"
	"os"
)

func present(tree []int64, i int) bool {
	return i < len(tree) && tree[i] != -1
}

func valid(tree []int64, i int, low, high int64) bool {
	if !present(tree, i) {
		return true
	}
	value := tree[i]
	if value <= low || value >= high {
		return false
	}
	return valid(tree, 2*i+1, low, value) && valid(tree, 2*i+2, value, high)
}

func find(tree []int64, target int64) int {
	i, depth := 0, 1
	for present(tree, i) {
		if tree[i] == target {
			return depth
		}
		if target < tree[i] {
			i = 2*i + 1
		} else {
			i = 2*i + 2
		}
		depth++
	}
	return -1
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, q int
	fmt.Fscan(reader, &n, &q)
	tree := make([]int64, n)
	for i := range tree {
		fmt.Fscan(reader, &tree[i])
	}
	queries := make([]int64, q)
	for i := range queries {
		fmt.Fscan(reader, &queries[i])
	}

	if valid(tree, 0, math.MinInt64, math.MaxInt64) {
		fmt.Println("VALID")
	} else {
		fmt.Println("INVALID")
	}
	for _, target := range queries {
		if depth := find(tree, target); depth > 0 {
			fmt.Printf("%d FOUND %d\n", target, depth)
		} else {
			fmt.Printf("%d ABSENT\n", target)
		}
	}
}
'''
hints = [
  "Pass an open interval down. The root gets the whole int64 range; a left child gets (low, node), a right child gets (node, high).",
  "A missing node is vacuously valid — the base case returns true.",
  "The lookup is the binary search: smaller goes left, otherwise right, and the depth is how many hops it took.",
]

