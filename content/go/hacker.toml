solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type rng struct{ x uint64 }

func (r *rng) next() uint64 {
	r.x = r.x*6364136223846793005 + 1442695040888963407
	return r.x >> 33
}

// Fenwick tree, 1-based internally. Add and Prefix are both O(log n).
type Fenwick struct {
	tree []int64
}

func NewFenwick(n int) *Fenwick {
	return &Fenwick{tree: make([]int64, n+1)}
}

func (f *Fenwick) Add(index int, delta int64) {
	for i := index + 1; i < len(f.tree); i += i & -i {
		f.tree[i] += delta
	}
}

func (f *Fenwick) Prefix(upto int) int64 {
	var sum int64
	for i := upto; i > 0; i -= i & -i {
		sum += f.tree[i]
	}
	return sum
}

func (f *Fenwick) Range(l, r int) int64 {
	return f.Prefix(r+1) - f.Prefix(l)
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, q int
	var seed uint64
	fmt.Fscan(reader, &n, &q, &seed)

	r := &rng{seed}
	fen := NewFenwick(n)
	for i := 0; i < n; i++ {
		fen.Add(i, int64(r.next()%1000))
	}

	var total int64
	updates := 0
	for k := 0; k < q; k++ {
		a, b, c := r.next(), r.next(), r.next()
		if a%2 == 0 {
			fen.Add(int(b)%n, int64(c%1000+1))
			updates++
			continue
		}
		l, rr := int(b)%n, int(c)%n
		if l > rr {
			l, rr = rr, l
		}
		total += fen.Range(l, rr)
	}

	fmt.Println(total)
	fmt.Printf("UPDATES %d\n", updates)
}
'''
