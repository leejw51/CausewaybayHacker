solution     = '''
package main

import (
	"bufio"
	"container/heap"
	"fmt"
	"os"
)

type minHeap []int64

func (h minHeap) Len() int           { return len(h) }
func (h minHeap) Less(i, j int) bool { return h[i] < h[j] }
func (h minHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }

func (h *minHeap) Push(x any) {
	*h = append(*h, x.(int64))
}

func (h *minHeap) Pop() any {
	old := *h
	last := len(old) - 1
	value := old[last]
	*h = old[:last]
	return value
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, k int
	fmt.Fscan(reader, &n, &k)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	h := &minHeap{}
	heap.Init(h)
	for _, v := range nums {
		heap.Push(h, v)
		if h.Len() > k {
			heap.Pop(h)
		}
	}

	fmt.Println((*h)[0])
	fmt.Printf("HEAP %d\n", h.Len())
}
'''
hints = [
  "Push and Pop are the raw slice operations — append and chop the tail. heap.Push and heap.Pop are the ones that sift.",
  "Never call h.Push directly; call heap.Push(h, v), or the heap invariant is not restored.",
  "After the loop the smallest of the k largest is at index 0, and that is the k-th largest overall.",
]

