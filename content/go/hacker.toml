solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strings"
)

func key(word string) string {
	letters := []byte(word)
	sort.Slice(letters, func(i, j int) bool { return letters[i] < letters[j] })
	return string(letters)
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)
