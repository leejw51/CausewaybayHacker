solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	var s int64
	fmt.Fscan(reader, &n, &s)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	bestLen, bestStart := 0, 0
	left := 0
	var sum int64

	for right := 0; right < n; right++ {
		sum += nums[right]
		for left < right && sum-nums[left] >= s {
			sum -= nums[left]
			left++
		}
		if sum >= s {
			length := right - left + 1
			if bestLen == 0 || length < bestLen {
				bestLen = length
				bestStart = left + 1
			}
		}
	}

	fmt.Println(bestLen)
	fmt.Println(bestStart)
}
'''
hints = [
  "Keep a running sum. Add nums[right] once per step and never recompute it.",
  "Shrink from the left while dropping the leftmost element would still leave the window at or above s.",
  "Record a new best only on a strictly shorter run, so the leftmost of each length is the one you keep.",
]

