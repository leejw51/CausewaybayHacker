		b := int(r.next()) % n
		w := int64(r.next()%1000 + 1)
		add(a, b, w)
	}
	return g
}

type item struct {
	dist int64
	node int
}

type pq []item

func (p pq) Len() int            { return len(p) }
func (p pq) Less(i, j int) bool  { return p[i].dist < p[j].dist }
func (p pq) Swap(i, j int)       { p[i], p[j] = p[j], p[i] }
func (p *pq) Push(x any)         { *p = append(*p, x.(item)) }
func (p *pq) Pop() any {
	old := *p
	last := len(old) - 1
	v := old[last]
	*p = old[:last]
	return v
}

const inf = int64(1) << 62

func main() {
