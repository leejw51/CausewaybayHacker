solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strconv"
	"strings"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, m int
	fmt.Fscan(reader, &n, &m)

	after := make([][]int, n)
	waiting := make([]int, n)
	for e := 0; e < m; e++ {
		var a, b int
		fmt.Fscan(reader, &a, &b)
		after[a] = append(after[a], b)
		waiting[b]++
	}

	ready := make([]int, 0, n)
	for task := 0; task < n; task++ {
		if waiting[task] == 0 {
			ready = append(ready, task)
		}
	}

	order := make([]int, 0, n)
	for len(ready) > 0 {
		sort.Ints(ready)
		task := ready[0]
		ready = ready[1:]
		order = append(order, task)
		for _, next := range after[task] {
			waiting[next]--
			if waiting[next] == 0 {
				ready = append(ready, next)
			}
		}
	}

	if len(order) < n {
		fmt.Println("CYCLE")
	} else {
		parts := make([]string, len(order))
		for i, task := range order {
			parts[i] = strconv.Itoa(task)
		}
		fmt.Println(strings.Join(parts, " "))
	}
	fmt.Printf("DONE %d\n", len(order))
}
'''
