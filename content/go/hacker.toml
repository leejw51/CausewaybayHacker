solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
	"strings"
)

type Node struct {
	Value int64
	Next  *Node
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	values := make([]int64, n)
	for i := range values {
		fmt.Fscan(reader, &values[i])
	}

	// build back to front, so each new node points at what we had
	var head *Node
	for i := len(values) - 1; i >= 0; i-- {
		head = &Node{Value: values[i], Next: head}
	}

	length := 0
	for walk := head; walk != nil; walk = walk.Next {
		length++
	}

	slow, fast := head, head
	for fast != nil && fast.Next != nil {
		slow = slow.Next
		fast = fast.Next.Next
	}
	var middle int64
	if slow != nil {
		middle = slow.Value
	}

	// reverse by moving nodes off the front of one list onto the front of another
	var reversed *Node
	for cursor := head; cursor != nil; {
		next := cursor.Next
		cursor.Next = reversed
		reversed = cursor
		cursor = next
	}

	out := make([]string, 0, length)
	for walk := reversed; walk != nil; walk = walk.Next {
		out = append(out, strconv.FormatInt(walk.Value, 10))
	}

	fmt.Println(strings.Join(out, " "))
	fmt.Println(middle)
	fmt.Printf("LEN %d\n", length)
}
'''
