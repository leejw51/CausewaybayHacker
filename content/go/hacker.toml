solution     = '''
package main

import (
	"bufio"
	"fmt"
	"math"
	"os"
	"sort"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	values := make([]int64, n)
	for i := range values {
		fmt.Fscan(reader, &values[i])
	}

	var sum int64
	for _, v := range values {
		sum += v
	}
	mean := float64(sum) / float64(n)

	variance := 0.0
	for _, v := range values {
		delta := float64(v) - mean
		variance += delta * delta
	}
	variance /= float64(n)

	sort.Slice(values, func(i, j int) bool { return values[i] < values[j] })
	middle := n / 2
	var median float64
	if n%2 == 1 {
		median = float64(values[middle])
	} else {
		median = (float64(values[middle-1]) + float64(values[middle])) / 2.0
	}

	fmt.Printf("%.6f\n", mean)
	fmt.Printf("%.6f\n", math.Sqrt(variance))
	fmt.Printf("%.6f\n", median)
}
'''
