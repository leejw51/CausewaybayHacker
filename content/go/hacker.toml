Line one is `cap q`. The next `q` lines are `PUT <key> <value>` or
`GET <key>`.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key.

For each `GET` print the value, or `-1` if it is absent. At the end print the
surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The textbook answer is a hash map into a **doubly linked list**, and Go has
one in the standard library: `container/list`. `PushFront`, `MoveToFront`,
`Back` and `Remove` are all O(1), so every operation here is O(1) and you can
say so without hedging. The map holds `*list.Element`; the element's `Value`
holds the key as well as the value, because eviction starts from the list and
has to know which map entry to delete.
