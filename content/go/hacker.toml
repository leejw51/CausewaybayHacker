solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strings"
)

func key(word string) string {
	letters := []byte(word)
	sort.Slice(letters, func(i, j int) bool { return letters[i] < letters[j] })
	return string(letters)
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)
	sc.Scan()
	var n int
	fmt.Sscan(sc.Text(), &n)
	words := make([]string, 0, n)
	for i := 0; i < n; i++ {
		sc.Scan()
		words = append(words, sc.Text())
	}

	groups := map[string][]string{}
	for _, word := range words {
		k := key(word)
		groups[k] = append(groups[k], word)
	}

	lines := make([]string, 0, len(groups))
	for _, members := range groups {
		sort.Strings(members)
		lines = append(lines, strings.Join(members, " "))
	}
	sort.Strings(lines)

	for _, line := range lines {
		fmt.Println(line)
	}
	fmt.Printf("GROUPS %d\n", len(lines))
}
'''
hints = [
  "sort.Slice over []byte(word) then string(...) back gives you the key.",
  "Appending to groups[k] works on a missing key: the zero value of a slice is nil and append handles nil.",
  "Sorting the joined lines sorts by first word, because the first word is where each line starts.",
]

