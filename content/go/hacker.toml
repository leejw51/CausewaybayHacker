package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
	"strings"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	original := make([][]int64, n)
	for r := range original {
		original[r] = make([]int64, n)
		for c := range original[r] {
			fmt.Fscan(reader, &original[r][c])
		}
	}

	grid := make([][]int64, n)
	for r := range grid {
		grid[r] = append([]int64(nil), original[r]...)
	}
	for r := 0; r < n; r++ {
		for c := r + 1; c < n; c++ {
			grid[r][c], grid[c][r] = grid[c][r], grid[r][c]
		}
	}
	for r := range grid {
		for i, j := 0, n-1; i < j; i, j = i+1, j-1 {
			grid[r][i], grid[r][j] = grid[r][j], grid[r][i]
		}
	}
	for _, row := range grid {
		parts := make([]string, n)
		for i, v := range row {
			parts[i] = strconv.FormatInt(v, 10)
		}
		fmt.Println(strings.Join(parts, " "))
	}

	spiral := make([]string, 0, n*n)
	top, bottom, left, right := 0, n-1, 0, n-1
	for top <= bottom && left <= right {
		for c := left; c <= right; c++ {
			spiral = append(spiral, strconv.FormatInt(original[top][c], 10))
		}
		top++
		for r := top; r <= bottom; r++ {
			spiral = append(spiral, strconv.FormatInt(original[r][right], 10))
		}
		right--
		if top <= bottom {
			for c := right; c >= left; c-- {
				spiral = append(spiral, strconv.FormatInt(original[bottom][c], 10))
			}
			bottom--
		}
		if left <= right {
			for r := bottom; r >= top; r-- {
				spiral = append(spiral, strconv.FormatInt(original[r][left], 10))
			}
			left++
		}
	}
	fmt.Println(strings.Join(spiral, " "))
}
'''
