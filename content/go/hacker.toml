package main

import (
	"bufio"
	"fmt"
	"os"
)

func min3(a, b, c int) int {
	if b < a {
		a = b
	}
	if c < a {
		a = c
	}
	return a
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var first, second string
	fmt.Fscan(reader, &first)
	fmt.Fscan(reader, &second)
	a, b := []byte(first), []byte(second)

	edit := make([][]int, len(a)+1)
	lcs := make([][]int, len(a)+1)
	for i := range edit {
		edit[i] = make([]int, len(b)+1)
		lcs[i] = make([]int, len(b)+1)
	}
	for i := 0; i <= len(a); i++ {
		edit[i][0] = i
	}
	for j := 0; j <= len(b); j++ {
		edit[0][j] = j
	}

	for i := 1; i <= len(a); i++ {
		for j := 1; j <= len(b); j++ {
			if a[i-1] == b[j-1] {
				edit[i][j] = edit[i-1][j-1]
				lcs[i][j] = lcs[i-1][j-1] + 1
				continue
			}
			edit[i][j] = 1 + min3(edit[i-1][j-1], edit[i-1][j], edit[i][j-1])
			if lcs[i-1][j] > lcs[i][j-1] {
				lcs[i][j] = lcs[i-1][j]
			} else {
				lcs[i][j] = lcs[i][j-1]
			}
		}
	}

	fmt.Println(edit[len(a)][len(b)])
	fmt.Printf("LCS %d\n", lcs[len(a)][len(b)])
}
'''
