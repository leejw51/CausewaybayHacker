  "The element's Value has to carry the key, or eviction from the back cannot find the map entry to delete.",
  "Overwriting a key that is already present is not an eviction — check the map before you decide the cache is full.",
  "Walking Front to Back is already most-recent-first, so the last line needs no sort.",
]

