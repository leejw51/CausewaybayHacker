  "out is a *[]int64 because append may reallocate — a plain []int64 parameter would lose the writes.",
  "The base case is both conditions at once: past the end of the slice, or sitting on a -1.",
  "Depth is 1 + the deeper child, and 0 for a missing node.",
]

