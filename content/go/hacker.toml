solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	// tails[i] = the smallest value an increasing subsequence of length i+1
	// can end on. It is sorted, always.
	tails := make([]int64, 0, n)
	for _, value := range nums {
		low, high := 0, len(tails)
		for low < high {
			mid := low + (high-low)/2
			if tails[mid] < value {
				low = mid + 1
			} else {
				high = mid
			}
		}
		if low == len(tails) {
			tails = append(tails, value)
		} else {
			tails[low] = value
		}
	}

	fmt.Println(len(tails))
	fmt.Printf("TAILS %d\n", len(tails))
}
'''
