package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, target int
	fmt.Fscan(reader, &n, &target)
	coins := make([]int, n)
	for i := range coins {
		fmt.Fscan(reader, &coins[i])
	}

	const unreachable = 1 << 30
	best := make([]int, target+1)
	for i := range best {
		best[i] = unreachable
	}
	best[0] = 0

	for amount := 1; amount <= target; amount++ {
		for _, coin := range coins {
			if coin <= amount && best[amount-coin] != unreachable {
				if candidate := best[amount-coin] + 1; candidate < best[amount] {
					best[amount] = candidate
				}
			}
		}
	}

	reach := 0
	for _, v := range best {
		if v != unreachable {
			reach++
		}
	}

	if best[target] == unreachable {
		fmt.Println(-1)
	} else {
		fmt.Println(best[target])
	}
	fmt.Printf("REACH %d\n", reach)
}
