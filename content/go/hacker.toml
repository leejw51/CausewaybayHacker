solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	var target int64
	fmt.Fscan(reader, &n, &target)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	seen := make(map[int64]int, n)
	for j, x := range nums {
		if i, ok := seen[target-x]; ok {
			fmt.Printf("%d %d\n", i+1, j+1)
			return
		}
		if _, ok := seen[x]; !ok {
			seen[x] = j
		}
	}
	fmt.Println(-1)
}
'''
hints = [
  "One pass. For each value ask the map whether target minus it has already been seen.",
  "Only record the first index of a repeated value — that is the tie-break the statement asks for.",
  "The comma-ok form is the whole idiom: i, ok := seen[k].",
]

