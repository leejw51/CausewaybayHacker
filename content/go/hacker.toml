solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]uint64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	var alone uint64
	for _, value := range nums {
		alone ^= value
	}

	bits := 0
	for walk := alone; walk != 0; walk &= walk - 1 {
		bits++
	}

	powerOfTwo := alone != 0 && alone&(alone-1) == 0
	var cleared uint64
	if alone != 0 {
		cleared = alone & (alone - 1)
	}

	fmt.Println(alone)
	fmt.Println(bits)
	if powerOfTwo {
		fmt.Println("POW2 YES")
	} else {
		fmt.Println("POW2 NO")
	}
	fmt.Println(cleared)
}
'''
