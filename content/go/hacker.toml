solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

const P int64 = 1000000007

type rng struct{ x uint64 }

func (r *rng) next() uint64 {
	r.x = r.x*6364136223846793005 + 1442695040888963407
	return r.x >> 33
}

// base^exp mod P, by repeated squaring: about 30 steps for a 30-bit exponent.
func power(base, exp int64) int64 {
	result := int64(1)
	base %= P
	for exp > 0 {
		if exp&1 == 1 {
			result = result * base % P
		}
		base = base * base % P
		exp >>= 1
	}
	return result
}

// P is prime, so Fermat gives v^(P-2) as the inverse of v.
func inverse(v int64) int64 {
	return power(v, P-2)
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, q int
	var seed uint64
	fmt.Fscan(reader, &n, &q, &seed)

	// one shared factorial table for every query
	factorial := make([]int64, n+1)
	factorial[0] = 1
	for i := 1; i <= n; i++ {
		factorial[i] = factorial[i-1] * int64(i) % P
	}

	r := &rng{seed}
	var sum, last int64
	for k := 0; k < q; k++ {
		a := int(r.next()) % (n + 1)
		b := int(r.next()) % (a + 1)

		value := factorial[a] * inverse(factorial[b]) % P * inverse(factorial[a-b]) % P

		sum = (sum + value) % P
		last = value
	}

	fmt.Println(sum)
	fmt.Printf("LAST %d\n", last)
}
'''
