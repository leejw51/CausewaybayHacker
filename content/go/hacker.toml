solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
	"strings"
)

func build(nums []int64, used []bool, chosen []int64, out *[]string) {
	if len(chosen) == len(nums) {
		parts := make([]string, len(chosen))
		for i, v := range chosen {
			parts[i] = strconv.FormatInt(v, 10)
		}
		*out = append(*out, strings.Join(parts, " "))
		return
	}
	for i := range nums {
		if used[i] {
			continue
		}
		used[i] = true
		build(nums, used, append(chosen, nums[i]), out)
		used[i] = false
	}
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	out := make([]string, 0)
	build(nums, make([]bool, n), make([]int64, 0, n), &out)

	for _, line := range out {
		fmt.Println(line)
	}
	fmt.Printf("PERMS %d\n", len(out))
}
