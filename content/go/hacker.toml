solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func generate(n int, seed uint64) []int64 {
	x := seed
	values := make([]int64, n)
	for i := 0; i < n; i++ {
		x = x*6364136223846793005 + 1442695040888963407
		values[i] = int64((x >> 33) % 1000000007)
	}
	return values
}

// Merge sort over values[lo:hi], returning how many inversions it removed.
func sortCount(values, scratch []int64, lo, hi int) int64 {
	if hi-lo < 2 {
		return 0
	}
	mid := (lo + hi) / 2
	inversions := sortCount(values, scratch, lo, mid) + sortCount(values, scratch, mid, hi)

	left, right, out := lo, mid, lo
	for left < mid && right < hi {
		if values[left] <= values[right] {
			scratch[out] = values[left]
			left++
		} else {
			// values[left:mid] are all greater than values[right]
			inversions += int64(mid - left)
			scratch[out] = values[right]
			right++
		}
		out++
	}
	for left < mid {
		scratch[out] = values[left]
		left++
		out++
	}
	for right < hi {
		scratch[out] = values[right]
		right++
		out++
	}
	copy(values[lo:hi], scratch[lo:hi])
	return inversions
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	var seed uint64
	fmt.Fscan(reader, &n, &seed)

	values := generate(n, seed)
	var max int64
	for _, v := range values {
		if v > max {
			max = v
		}
	}

	scratch := make([]int64, n)
	inversions := sortCount(values, scratch, 0, n)

	fmt.Println(inversions)
	fmt.Printf("MAX %d\n", max)
}
'''
