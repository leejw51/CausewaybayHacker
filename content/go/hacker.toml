solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type cell struct {
	r int
	c int
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var rows, cols int
	fmt.Fscan(reader, &rows, &cols)
	grid := make([]string, rows)
	for i := range grid {
		fmt.Fscan(reader, &grid[i])
	}

	seen := make([][]bool, rows)
	for i := range seen {
		seen[i] = make([]bool, cols)
	}

	blocks, largest := 0, 0
	steps := []cell{{-1, 0}, {1, 0}, {0, -1}, {0, 1}}

	for r := 0; r < rows; r++ {
		for c := 0; c < cols; c++ {
			if grid[r][c] != '#' || seen[r][c] {
				continue
			}
			blocks++
			size := 0
			queue := []cell{{r, c}}
			seen[r][c] = true
			for len(queue) > 0 {
				here := queue[0]
				queue = queue[1:]
				size++
				for _, s := range steps {
					nr, nc := here.r+s.r, here.c+s.c
					if nr < 0 || nr >= rows || nc < 0 || nc >= cols {
						continue
					}
					if grid[nr][nc] != '#' || seen[nr][nc] {
						continue
					}
					seen[nr][nc] = true
					queue = append(queue, cell{nr, nc})
				}
			}
			if size > largest {
				largest = size
			}
		}
	}

	fmt.Println(blocks)
	fmt.Println(largest)
}
'''
hints = [
  "Mark a cell seen when you push it, not when you pop it, or it lands in the queue several times.",
  "queue = queue[1:] is a fine dequeue here — the backing array is dropped once the whole block is done.",
  "grid[r][c] indexes a string, so it is a byte: compare against '#', not \"#\".",
]

