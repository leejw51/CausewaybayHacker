  { name = "single",  stdin = "1 1\n7\n",                   expect = "7\nHEAP 1\n", visible = false },
  { name = "all-k",   stdin = "5 5\n9 9 9 9 9\n",           expect = "9\nHEAP 5\n", visible = false },
