solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

const P int64 = 1000000007

type rng struct{ x uint64 }

func (r *rng) next() uint64 {
	r.x = r.x*6364136223846793005 + 1442695040888963407
	return r.x >> 33
}

const inf = int64(1) << 62

func main() {
	reader := bufio.NewReader(os.Stdin)
	var rows, cols int
	var pct, seed uint64
	fmt.Fscan(reader, &rows, &cols, &pct, &seed)

	r := &rng{seed}
	open := make([][]bool, rows)
	cost := make([][]int64, rows)
	for i := 0; i < rows; i++ {
		open[i] = make([]bool, cols)
		cost[i] = make([]int64, cols)
		for j := 0; j < cols; j++ {
			a := r.next()
			b := r.next()
			corner := (i == 0 && j == 0) || (i == rows-1 && j == cols-1)
			open[i][j] = corner || a%100 >= pct
			cost[i][j] = int64(b%9 + 1)
		}
	}

	ways := make([][]int64, rows)
	best := make([][]int64, rows)
	for i := range ways {
		ways[i] = make([]int64, cols)
		best[i] = make([]int64, cols)
		for j := range best[i] {
			best[i][j] = inf
		}
	}

	for i := 0; i < rows; i++ {
		for j := 0; j < cols; j++ {
			if !open[i][j] {
				continue
			}
			if i == 0 && j == 0 {
				ways[0][0] = 1
				best[0][0] = cost[0][0]
				continue
			}
			var routes int64
			cheapest := inf
			if i > 0 && open[i-1][j] {
				routes = (routes + ways[i-1][j]) % P
				if best[i-1][j] < cheapest {
					cheapest = best[i-1][j]
				}
			}
			if j > 0 && open[i][j-1] {
				routes = (routes + ways[i][j-1]) % P
				if best[i][j-1] < cheapest {
					cheapest = best[i][j-1]
				}
			}
			ways[i][j] = routes
			if cheapest == inf {
				best[i][j] = inf
			} else {
				best[i][j] = cheapest + cost[i][j]
			}
		}
	}

	fmt.Printf("PATHS %d\n", ways[rows-1][cols-1])
	if best[rows-1][cols-1] == inf {
		fmt.Println("MIN -1")
	} else {
		fmt.Printf("MIN %d\n", best[rows-1][cols-1])
	}
}
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
