package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
)

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)
	next := func() string {
		sc.Scan()
		return sc.Text()
	}

	commands, _ := strconv.Atoi(next())
	items := make([]int64, 0)

	for i := 0; i < commands; i++ {
		switch next() {
		case "ADD":
			// the argument is a second token of the same command
			cents, _ := strconv.ParseInt(next(), 10, 64)
			items = append(items, cents)
		case "VOID":
			if len(items) > 0 {
				items = items[:len(items)-1]
			}
		case "TOTAL":
			var sum int64
			for _, v := range items {
				sum += v
			}
			fmt.Println(sum)
		case "CLEAR":
			items = items[:0]
		}
	}

	fmt.Printf("COMMANDS %d\n", commands)
	fmt.Printf("ITEMS %d\n", len(items))
}
'''
