package main

import (
	"bufio"
	"fmt"
	"os"
)

type node struct {
	children [26]int
	through  int
	terminal bool
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, q int
	fmt.Fscan(reader, &n, &q)

	// index 0 is the root; 0 in `children` means "no child", since the root
	// can never be a child
	nodes := []node{{}}

	for i := 0; i < n; i++ {
		var word string
		fmt.Fscan(reader, &word)
		at := 0
		for j := 0; j < len(word); j++ {
			slot := word[j] - 'a'
			next := nodes[at].children[slot]
			if next == 0 {
				nodes = append(nodes, node{})
				next = len(nodes) - 1
				nodes[at].children[slot] = next
			}
			nodes[next].through++
			at = next
		}
		nodes[at].terminal = true
	}

	for i := 0; i < q; i++ {
		var kind, text string
		fmt.Fscan(reader, &kind, &text)

		at, alive := 0, true
		for j := 0; j < len(text) && alive; j++ {
			next := nodes[at].children[text[j]-'a']
			if next == 0 {
				alive = false
				break
			}
			at = next
		}

		if kind == "WORD" {
			if alive && nodes[at].terminal {
				fmt.Println("YES")
			} else {
				fmt.Println("NO")
			}
			continue
		}
		if alive {
			fmt.Println(nodes[at].through)
		} else {
			fmt.Println(0)
		}
	}

	fmt.Printf("NODES %d\n", len(nodes))
}
'''
