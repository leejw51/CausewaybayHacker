solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	line, _ := reader.ReadString('\n')
	line = strings.TrimRight(line, "\r\n")

	opener := map[byte]byte{')': '(', ']': '[', '}': '{'}
	var stack []int

	fail := func(index int) {
		fmt.Println("INVALID")
		fmt.Println(index + 1)
	}

	for i := 0; i < len(line); i++ {
		c := line[i]
		if c == '(' || c == '[' || c == '{' {
			stack = append(stack, i)
			continue
		}
		want, isCloser := opener[c]
		if !isCloser {
			fail(i)
			return
		}
		if len(stack) == 0 || line[stack[len(stack)-1]] != want {
			fail(i)
			return
		}
		stack = stack[:len(stack)-1]
	}

	if len(stack) > 0 {
		fail(stack[len(stack)-1])
		return
	}

	fmt.Println("VALID")
	fmt.Println(0)
}
'''
hints = [
  "Push the index of each opener, not the character — you need the index to report it.",
  "A closer is wrong when the stack is empty, or when the character at the top index is not its partner.",
  "If the loop finishes with anything left on the stack, the top of it is the last unclosed bracket.",
]

