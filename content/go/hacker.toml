Line one is `n`. Line two is `n` lowercase words separated by spaces.

Group the words that are anagrams of each other. Print each group on one line,
its words sorted ascending and joined by single spaces. Order the groups by
their first word, ascending. Then print `GROUPS <k>`.

A repeated word stays in its group twice.

```
input:  6
        eat tea tan ate nat bat
output: ate eat tea
        bat
        nat tan
        GROUPS 3
```

The key is the word with its letters sorted. Two words are anagrams exactly
when their keys are equal, and that is a map lookup rather than a comparison
against everything seen so far.
'''
