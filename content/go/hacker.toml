package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	best, bestStart, bestEnd := nums[0], 0, 0
	current, currentStart := nums[0], 0
	for i := 1; i < n; i++ {
		if current < 0 {
			current = nums[i]
			currentStart = i
		} else {
			current += nums[i]
		}
		if current > best {
			best = current
			bestStart = currentStart
			bestEnd = i
		}
	}

	seen := map[int64]int{0: 1}
	var prefix int64
	zero := 0
	for _, value := range nums {
		prefix += value
		zero += seen[prefix]
		seen[prefix]++
	}

	fmt.Println(best)
	fmt.Printf("AT %d %d\n", bestStart+1, bestEnd+1)
	fmt.Printf("ZERO %d\n", zero)
}
'''
