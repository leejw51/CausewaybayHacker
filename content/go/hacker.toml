package main

import (
	"bufio"
	"container/heap"
	"fmt"
	"os"
	"strconv"
	"strings"
)

type entry struct {
	value int64
	which int
	at    int
}

type minHeap []entry

func (h minHeap) Len() int           { return len(h) }
func (h minHeap) Less(i, j int) bool { return h[i].value < h[j].value }
func (h minHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }

func (h *minHeap) Push(x any) {
	*h = append(*h, x.(entry))
}

func (h *minHeap) Pop() any {
	old := *h
	last := len(old) - 1
	value := old[last]
	*h = old[:last]
	return value
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var k int
	fmt.Fscan(reader, &k)
	lists := make([][]int64, k)
	total := 0
	for i := range lists {
		var count int
		fmt.Fscan(reader, &count)
		lists[i] = make([]int64, count)
		for j := range lists[i] {
			fmt.Fscan(reader, &lists[i][j])
		}
		total += count
	}

	h := &minHeap{}
	heap.Init(h)
	for which, list := range lists {
		if len(list) > 0 {
			heap.Push(h, entry{value: list[0], which: which, at: 0})
		}
	}

	out := make([]string, 0, total)
	for h.Len() > 0 {
		next := heap.Pop(h).(entry)
		out = append(out, strconv.FormatInt(next.value, 10))
		if next.at+1 < len(lists[next.which]) {
			heap.Push(h, entry{
				value: lists[next.which][next.at+1],
				which: next.which,
				at:    next.at + 1,
			})
		}
	}

	fmt.Println(strings.Join(out, " "))
	fmt.Printf("POPS %d\n", len(out))
}
'''
