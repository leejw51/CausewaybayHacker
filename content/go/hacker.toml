solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strconv"
	"strings"
)

type rng struct{ x uint64 }

func (r *rng) next() uint64 {
	r.x = r.x*6364136223846793005 + 1442695040888963407
	return r.x >> 33
}

type rider struct {
	score int64
	index int
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	var buckets, seed uint64
	fmt.Fscan(reader, &n, &buckets, &seed)

	r := &rng{seed}
	riders := make([]rider, n)
	for i := range riders {
		riders[i] = rider{int64(r.next() % buckets), i}
	}

	// SliceStable keeps equal scores in the order they arrived in.
	// The equally correct alternative is sort.Slice with a total comparison:
	//     if riders[i].score != riders[j].score { return ... > ... }
	//     return riders[i].index < riders[j].index
	sort.SliceStable(riders, func(i, j int) bool { return riders[i].score > riders[j].score })

	order := make([]string, n)
	for i, x := range riders {
		order[i] = strconv.Itoa(x.index)
	}
	ties := 0
	for i := 1; i < n; i++ {
		if riders[i-1].score == riders[i].score {
			ties++
		}
	}
	fmt.Println(strings.Join(order, " "))
	fmt.Printf("TIES %d\n", ties)
}
'''
