solution     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
)

type span struct {
	start int64
	end   int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	spans := make([]span, n)
	for i := range spans {
		fmt.Fscan(reader, &spans[i].start, &spans[i].end)
	}

	sort.Slice(spans, func(i, j int) bool {
		if spans[i].start != spans[j].start {
			return spans[i].start < spans[j].start
		}
		return spans[i].end < spans[j].end
	})

	merged := make([]span, 0, n)
	for _, s := range spans {
		last := len(merged) - 1
		if last >= 0 && s.start <= merged[last].end {
			if s.end > merged[last].end {
				merged[last].end = s.end
			}
			continue
		}
		merged = append(merged, s)
	}

	for _, s := range merged {
		fmt.Printf("%d %d\n", s.start, s.end)
	}
	fmt.Printf("COUNT %d\n", len(merged))
}
'''
hints = [
  "Sort by start first. After that one left-to-right pass is enough.",
  "merged[last].end is addressable because merged is a slice of structs, not of pointers — assign straight into it.",
  "Extend to the larger of the two ends; a short interval inside a long one must not shrink it.",
]

