A worker pool. Each worker calls `wg.Done()` when `jobs` runs dry, and
`jobs` is closed by the producer. Which line makes the final `range`
end once every worker is finished — with no deadlock and no panic?

```
results := make(chan int) // unbuffered
for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
solution    = 'go func() { wg.Wait(); close(results) }()'
hints = [
  "The waiting has to happen beside the reader, not before it: the workers block on an unbuffered send until `main` reads.",
]

[quest.quiz]
choices = [
  'wg.Wait(); close(results)',
  'go func() { wg.Wait(); close(results) }()',
  'close(results)',
  'defer close(results)',
]
answer  = 1

