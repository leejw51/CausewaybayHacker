# GO LAND — CHEATSHEET. The grammar off the page, asked: one question per
# section of the Go live-coding cheatsheet (~/vivid/Cheatsheet,
# go_cheatsheet.html), four lines, one right. Nothing is typed and nothing
# is compiled — the pick is the submission, and the server judges it against
# the quiz (SPEC §0). The three wrong lines are near-misses: another
# language's spelling, a result thrown away, a copy where a pointer was meant.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "go.cheatsheet"
land = "go"
category = "cheatsheet"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "go.cheatsheet.01.flush"
node        = 1
title       = "FLUSH OR NOTHING"
difficulty  = 1
story       = "06:30, Jardine's Bazaar. The kiosk printed all night into a buffer, and nobody ever saw a line."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
Output goes through a buffered writer. Which line makes sure everything
written to `out` actually reaches the screen when `main` returns?

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
solution    = 'defer out.Flush()'
hints = [
  "A `bufio.Writer` holds bytes until it is flushed, and `defer` needs a call, with the parentheses.",
]

[quest.quiz]
choices = [
  'defer out.Close()',
  'defer out.Flush',
  'defer out.Flush()',
  'defer os.Stdout.Sync()',
]
answer  = 2

