solution    = 'r := ((x % m) + m) % m'
hints = [
  "In Go the sign of `%` follows the dividend, and a single add only rescues values down to `-m`.",
]

[quest.quiz]
choices = [
  'r := x % m',
  'r := ((x % m) + m) % m',
  'r := (x + m) % m',
  'r := math.Mod(x, m)',
]
answer  = 1
