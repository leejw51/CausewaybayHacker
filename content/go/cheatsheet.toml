  "Only `select` waits on two things at once, and each of its cases must be a send or a receive — `Done()` gives you a channel.",
]

[quest.quiz]
choices = [
  'select { case out <- v: case <-ctx.Done(): return ctx.Err() }',
  'out <- v; if ctx.Err() != nil { return ctx.Err() }',
  'select { case out <- v: case ctx.Done(): return ctx.Err() }',
  'select { case out <- v: default: return ctx.Err() }',
]
answer  = 0

