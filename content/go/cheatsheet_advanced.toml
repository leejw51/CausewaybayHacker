brief       = '''
`go.mod` says `go 1.22`, so each iteration has its own `i`. Launch
`work(i)` for every `i` in a goroutine, and make sure the final `Wait`
really waits for all `n` of them — nothing may race the counter.

```
var wg sync.WaitGroup
for i := range n {
    // ____
}
