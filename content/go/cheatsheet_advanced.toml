  'wg.Add(1); go func() { defer wg.Done(); work(i) }()',
  'go func() { wg.Add(1); defer wg.Done(); work(i) }()',
  'wg.Add(1); go func() { work(i); wg.Done }()',
  'wg.Add(1); go work(i); wg.Done()',
]
answer  = 0

