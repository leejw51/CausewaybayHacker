[[quest]]
id          = "go.cheatsheet_advanced.08.mutex-inc"
node        = 8
title       = "WRITE LOCK, NOT READ LOCK"
difficulty  = 3
story       = "Fifty gates at Causeway Bay interchange count passengers into one number, and the number comes out short by an amount nobody can reproduce."
concepts    = ["shared-state", "data-races", "structs"]
requires    = ["go.cheatsheet_advanced.07.defer-cancel"]
map         = { x = 0.76, y = 0.29, kind = "quest" }
brief       = '''
Fifty goroutines call `Inc` a thousand times each; afterwards `Get`
must return `50000`.

```
type Ctr struct {
    mu sync.RWMutex
    n  int
}
func (c *Ctr) Get() int { c.mu.RLock(); defer c.mu.RUnlock(); return c.n }
// ____
```
'''
solution    = 'func (c *Ctr) Inc() { c.mu.Lock(); defer c.mu.Unlock(); c.n++ }'
hints = [
  "A write needs the exclusive lock, not the shared one; a value receiver copies the struct, lock and all, so the real `n` never moves.",
]

[quest.quiz]
choices = [
  'func (c Ctr) Inc() { c.mu.Lock(); defer c.mu.Unlock(); c.n++ }',
  'func (c *Ctr) Inc() { c.mu.RLock(); defer c.mu.RUnlock(); c.n++ }',
  'func (c *Ctr) Inc() { defer c.mu.Lock(); c.n++; c.mu.Unlock() }',
  'func (c *Ctr) Inc() { c.mu.Lock(); defer c.mu.Unlock(); c.n++ }',
]
answer  = 3

