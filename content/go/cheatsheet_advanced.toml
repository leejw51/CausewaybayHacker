# GO LAND — CHEATSHEET ADVANCED. The second road off the page: the patterns
# an interviewer uses to tell a fluent Go candidate from one who knows the
# grammar. Channels and what closes them, select with a way out, context and
# the cancel that must be deferred, WaitGroup placement, mutex vs RWMutex vs
# atomic, Once, fan-in, the error channel that stands in for errgroup,
# generics and their constraints, errors.As with a custom type, recover that
# actually recovers, defer's early arguments, struct tags, the Builder that
# must not be copied, the Scanner that chokes on a long line, stable sorts,
# heap.Pop vs h.Pop, iota, Duration arithmetic, struct keys. Four lines, one
# right. Nothing is typed and nothing is compiled — the pick is the
# submission, and the server judges it against the quiz (SPEC §0). The three
# wrong lines are near-misses: a reversed arrow, a copied lock, a Done that
# was never deferred, a constraint one tilde short.
#
# Toolchain: Go 1.22, std only. Where the loop-variable or `range n` rules
# matter, the brief says so.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "go.cheatsheet_advanced"
land     = "go"
category = "cheatsheet_advanced"
version  = 1

