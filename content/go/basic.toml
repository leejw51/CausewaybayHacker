solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func makeCounter() func(int) int {
	total := 0
	return func(delta int) int {
		total += delta
		if total < 0 {
			total = 0
		}
		return total
	}
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	var n int
	fmt.Sscan(sc.Text(), &n)

	count := makeCounter()
	last := 0
	defer func() {
		fmt.Printf("CLOSED %d\n", last)
	}()

	for i := 0; i < n; i++ {
		sc.Scan()
		if sc.Text() == "IN" {
			last = count(1)
		} else {
			last = count(-1)
		}
		fmt.Println(last)
	}
}
'''
