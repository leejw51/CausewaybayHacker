brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```

Ranging over a Go map is deliberately in random order. Collect before you
print.
'''
starter     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)

	counts := map[string]int{}
	for sc.Scan() {
		_ = sc.Text()
	}

	// rank the counts and print them
	_ = counts
	_ = fmt.Sprint
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
)

type row struct {
	word  string
	count int
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)

	counts := map[string]int{}
	for sc.Scan() {
		counts[sc.Text()]++
	}

	rows := make([]row, 0, len(counts))
	for word, count := range counts {
		rows = append(rows, row{word: word, count: count})
	}
	sort.Slice(rows, func(i, j int) bool {
		if rows[i].count != rows[j].count {
			return rows[i].count > rows[j].count
		}
		return rows[i].word < rows[j].word
	})

	for _, r := range rows {
		fmt.Printf("%s %d\n", r.word, r.count)
	}
}
'''
hints = [
  "counts[word]++ works on a missing key: the zero value of int is 0.",
  "sort.Slice takes a less function — return true when i must come before j.",
  "The tie-break is a second comparison inside that same function.",
]

