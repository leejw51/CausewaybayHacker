		}
	}
	return out
}

func mapInts(xs []int, f func(int) int) []int {
	out := make([]int, len(xs))
	for i, x := range xs {
		out[i] = f(x)
	}
	return out
}

func main() {
	var xs []int
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		xs = append(xs, v)
	}

	evens := filter(xs, func(x int) bool { return x%2 == 0 })
	squares := mapInts(evens, func(x int) int { return x * x })

	sum := 0
	for _, s := range squares {
