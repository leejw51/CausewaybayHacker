brief       = '''
Standard input is a count `n`, then `n` lines. Each is either
`<NAME> <CENTS>` or a single `-`, which means the order never arrived: a nil
`*Order` in the slice.

Print the real orders sorted by cents **descending**, ties by name ascending,
as `<NAME> <CENTS>`. Then print `NIL <count>` — how many were missing.

```
input:  4
        SET 2800
        -
        PIE 900
        TEA 1200
output: SET 2800
        TEA 1200
        PIE 900
        NIL 1
```

Every nil has to be found before anything dereferences it, including the
comparison function you hand to `sort.Slice`. That is the whole boss.
'''
starter     = '''
