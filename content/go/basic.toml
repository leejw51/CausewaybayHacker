brief       = '''
A decimal number is a `float64` unless you say otherwise; `float32` is
half the width and keeps about seven digits. `strconv.ParseFloat` reads
one from text (the `64` is the width to parse into), and `float32(x)`
copies it into the narrower type, rounding as it goes. `%.10f` prints ten
places, which is where the two start to differ.

```
x, _ := strconv.ParseFloat(s, 64)
y := float32(x)
```

`s` is the text from stdin. Type the parse into `x` and the conversion
into `y`, in place of the two placeholders; both are printed for you.

```
input:  3.14159265358979
output: 3.1415926536
        3.1415927410
```
'''
starter     = '''
package main

import (
	"fmt"
	"strconv"
)

func main() {
	var s string
	fmt.Scan(&s)

	// FILL: parse s into a float64 named x
	// ANSWER: x, _ := strconv.ParseFloat(s, 64)
	x, _ := strconv.ParseFloat("0", 64)
	// FILL: copy x into a float32 named y
	// ANSWER: y := float32(x)
	y := float32(0)
	_ = s

	fmt.Printf("%.10f\n", x)
	fmt.Printf("%.10f\n", y)
}
'''
solution    = '''
package main

import (
	"fmt"
	"strconv"
)

func main() {
	var s string
	fmt.Scan(&s)

	x, _ := strconv.ParseFloat(s, 64)
	y := float32(x)
	_ = s

	fmt.Printf("%.10f\n", x)
	fmt.Printf("%.10f\n", y)
}
'''
