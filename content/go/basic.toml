# GO LAND — BASIC. The grammar road: Tin Hau down the Island Line to the
# Lucky Mac front till, one construct per node. Grammar practice, not a quiz:
# each brief says what the construct is and shows how it is written, the
# starter is the whole program, and the player fills a hole of one or two
# lines — variables, conversion, integer widths, a thirty-two-byte number,
# float32 and float64, strings, string, int and byte slices with copy and
# append, a for loop, a function, a struct, iota constants, append, a linked
# list, a map, a map as a hash table, a map as a set, a slice as a stack and
# a queue, sort, reverse, sort.Slice, a closure, function literals as
# arguments, a goroutine with a WaitGroup, and a binary search tree at the
# boss. Nothing
# here is timed, and verify_pack refuses a basic solution that adds more than
# two lines over its starter.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tools/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "go.basic"
land = "go"
category = "basic"
version = 2

