solution    = '''
package main

import (
	"fmt"
	"strings"
	"sync"
)

func main() {
	var xs []int
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		xs = append(xs, v)
	}

	results := make([]int, len(xs))
	var wg sync.WaitGroup
	for i, x := range xs {
		wg.Add(1)
		go func(i, x int) {
			defer wg.Done()
			results[i] = x * x
		}(i, x)
	}
	wg.Wait()

	total := 0
	var out []string
	for _, r := range results {
		total += r
		out = append(out, fmt.Sprint(r))
	}
	fmt.Println(strings.Join(out, " "))
	fmt.Println(total)
}
'''
