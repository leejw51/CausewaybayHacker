package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	line, _ := reader.ReadString('\n')
	line = strings.TrimRight(line, "\r\n")

	fmt.Println(len(line))

	runes := []rune(line)
	fmt.Println(len(runes))

	for i, j := 0, len(runes)-1; i < j; i, j = i+1, j-1 {
