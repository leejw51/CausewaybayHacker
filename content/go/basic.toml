[[quest]]
id          = "go.basic.04.strings"
node        = 7
title       = "THE STATION NAME"
difficulty  = 1
story       = "The platform sign at Causeway Bay shows the station name once, then a blank where the capitals go, then a blank where it runs backwards for the mirror side."
concepts    = ["strings", "iteration"]
requires    = ["go.basic.06.floats"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
A `string` is a read-only slice of bytes. `len(s)` is its length in bytes,
the `strings` package holds the everyday transformations, and to walk it
character by character you convert it to `[]rune`. The `reverse` helper
below does that walk; you only have to call it.

```
fmt.Println(strings.ToUpper(line))
fmt.Println(reverse(line))
```

The length is printed. Write the next two lines: the name in capitals, then
the name reversed.

```
input:  causeway bay
output: 12
        CAUSEWAY BAY
        yab yawesuac
```
'''
starter     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
)

func reverse(s string) string {
	r := []rune(s)
	for i, j := 0, len(r)-1; i < j; i, j = i+1, j-1 {
		r[i], r[j] = r[j], r[i]
	}
	return string(r)
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	line := sc.Text()

	fmt.Println(len(line))
	// FILL: print line in capitals, then line reversed
	// ANSWER: fmt.Println(strings.ToUpper(line))
	// ANSWER: fmt.Println(reverse(line))
	_ = strings.ToUpper
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
)

func reverse(s string) string {
	r := []rune(s)
	for i, j := 0, len(r)-1; i < j; i, j = i+1, j-1 {
		r[i], r[j] = r[j], r[i]
	}
	return string(r)
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	line := sc.Text()

	fmt.Println(len(line))
	fmt.Println(strings.ToUpper(line))
	fmt.Println(reverse(line))
}
'''
hints = [
  "fmt.Println(strings.ToUpper(line)) and then fmt.Println(reverse(line)).",
  "The _ = strings.ToUpper line only kept the import used; delete it once you call strings.ToUpper for real.",
]

