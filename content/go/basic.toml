[[quest]]
id          = "go.basic.03.types"
node        = 3
title       = "THE FARE SPLIT"
difficulty  = 1
story       = "Two riders split one Lucky Mac bill at the Tin Hau counter and the receipt prints the share as a whole number, a remainder, and then the real figure."
concepts    = ["types", "io"]
requires    = ["go.basic.02.vars"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Go never converts a number for you. `a / b` on two integers is integer
division (it rounds toward zero) and `a % b` is the remainder. To get a real
quotient you convert both sides with `float64(...)` first, and `fmt.Printf`
with `%.2f` prints a float with exactly two digits after the point.

```
fmt.Printf("%.2f\n", float64(a)/float64(b))
```

The whole-number share and the remainder are printed. Write the third line:
the real share, two decimals.

```
input:  7 2
output: 3
        1
        3.50
```
'''
starter     = '''
package main

import (
	"fmt"
)

func main() {
	var a, b int64
	fmt.Scan(&a, &b)

	fmt.Println(a / b)
	fmt.Println(a % b)
	// FILL: the real quotient with two decimals
	// ANSWER: fmt.Printf("%.2f\n", float64(a)/float64(b))
	fmt.Printf("%.2f\n", 0.0)
}
'''
solution    = '''
package main

import (
	"fmt"
)

func main() {
	var a, b int64
	fmt.Scan(&a, &b)

	fmt.Println(a / b)
	fmt.Println(a % b)
	fmt.Printf("%.2f\n", float64(a)/float64(b))
}
'''
hints = [
  "fmt.Printf(\"%.2f\\n\", float64(a)/float64(b))",
  "Convert both sides: float64(a) / b does not compile, because a float64 and an int64 cannot be divided.",
]

