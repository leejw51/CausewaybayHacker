  "total lives in makeCounter's frame and the returned function keeps it alive. That is the closure.",
  "defer func(){ ... }() runs at return, and the closure reads `last` then — not when the defer was written.",
  "A defer that took an argument would capture the value at defer time instead. Try both and watch it change.",
]

