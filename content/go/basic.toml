solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
	"strings"
)

type Number interface {
	~int64 | ~float64
}

func MapSlice[T any, U any](xs []T, f func(T) U) []U {
	out := make([]U, 0, len(xs))
	for _, x := range xs {
		out = append(out, f(x))
	}
	return out
}

func Sum[T Number](xs []T) T {
	var total T
	for _, x := range xs {
		total += x
	}
	return total
}

func Count[T any](xs []T, pred func(T) bool) int {
	n := 0
	for _, x := range xs {
		if pred(x) {
			n++
		}
	}
	return n
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Split(bufio.ScanWords)
	var nums []int64
	for sc.Scan() {
		v, err := strconv.ParseInt(sc.Text(), 10, 64)
		if err != nil {
			continue
		}
		nums = append(nums, v)
	}

	doubled := MapSlice(nums, func(n int64) string {
		return strconv.FormatInt(n*2, 10)
	})
	fmt.Println(strings.Join(doubled, " "))
	fmt.Println(Sum(nums))
	fmt.Println(Count(nums, func(n int64) bool { return n > 10 }))
}
'''
hints = [
  "MapSlice changes the element type, so it needs two type parameters, not one.",
  "The call sites infer T and U from the slice and the function — you do not write MapSlice[int64, string].",
  "~int64 means int64 and anything whose underlying type is int64, which is what lets a named type through.",
]

