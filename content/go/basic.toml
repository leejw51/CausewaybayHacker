A binary search tree is a `struct` whose two children are pointers to the
same struct, and an empty tree is `nil`. Inserting is recursive: a `nil`
subtree becomes a new node, otherwise the value goes into the left or the
right subtree — and because the recursion returns the subtree's new root,
you assign that back into the child field. Follow `n.Left` when `n` is
`nil` and the program dies; the `nil` check comes first, always.

```
type Node struct {
	Val         int
	Left, Right *Node
}
if v < n.Val {
	n.Left = insert(n.Left, v)
} else {
	n.Right = insert(n.Right, v)
}
```

