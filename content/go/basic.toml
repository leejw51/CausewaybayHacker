brief       = '''
A string can be sliced like anything else: `s[0:4]` is its first four
bytes. A string never changes, so slicing copies nothing and breaks
nothing — the new value `t` is its own string, and `s` stays whole.
Appending is `+=`: it builds a new string from the old one and the piece.

```
t := s[0:4]
t += "_bay"
```

`s` is the word from stdin. Type the slice into `t` and the append, in
place of the two placeholders; `t` and then the untouched `s` are printed.

```
input:  causeway
output: caus_bay
        causeway
```
'''
starter     = '''
package main

import (
	"fmt"
)

func main() {
	var s string
	fmt.Scan(&s)

	// FILL: the first four bytes of s, as a new string t
	// ANSWER: t := s[0:4]
	t := s[0:0]
	// FILL: append _bay to t
	// ANSWER: t += "_bay"
	t += ""

	fmt.Println(t)
	fmt.Println(s)
}
'''
solution    = '''
