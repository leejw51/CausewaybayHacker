map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Print exactly:

```
hello, causewaybay
```

The starter has no imports. Adding the one you need is the quest — in Go an
import you do not use is a compile error, and an import you need and do not
have is `undefined`.
'''
starter     = '''
package main

func main() {
	// your code here
	// ANSWER: import "fmt"
	// ANSWER: fmt.Println("hello, causewaybay")
}
'''
