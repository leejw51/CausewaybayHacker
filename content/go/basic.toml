solution    = '''
package main

import (
	"fmt"
	"strings"
)

type Node struct {
	Val         int
	Left, Right *Node
}

// insert puts v into the tree rooted at n and returns that tree's root.
func insert(n *Node, v int) *Node {
	if n == nil {
		return &Node{Val: v}
	}
	if v < n.Val {
		n.Left = insert(n.Left, v)
	} else {
		n.Right = insert(n.Right, v)
	}
	return n
}

func inorder(n *Node, out *[]string) {
	if n == nil {
		return
	}
	inorder(n.Left, out)
	*out = append(*out, fmt.Sprint(n.Val))
	inorder(n.Right, out)
}

func height(n *Node) int {
	if n == nil {
		return 0
	}
	l, r := height(n.Left), height(n.Right)
	if r > l {
		return 1 + r
	}
	return 1 + l
}

func main() {
	var root *Node
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		root = insert(root, v)
	}

	var out []string
	inorder(root, &out)
	fmt.Println(strings.Join(out, " "))
	fmt.Println(height(root))
}
'''
