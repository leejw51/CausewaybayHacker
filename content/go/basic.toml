solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type Sign interface {
	Render() string
}

type Shop struct {
	Name  string
	Floor int
}

type Stop struct {
	Route string
}

func (s Shop) Render() string {
	return fmt.Sprintf("%s / F%d", s.Name, s.Floor)
}

func (s Stop) Render() string {
	return "TRAM " + s.Route
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	var signs []Sign
	for i := 0; i < n; i++ {
		var kind string
		fmt.Fscan(reader, &kind)
		if kind == "SHOP" {
			var name string
			var floor int
			fmt.Fscan(reader, &name, &floor)
			signs = append(signs, Shop{Name: name, Floor: floor})
		} else {
			var route string
			fmt.Fscan(reader, &route)
			signs = append(signs, Stop{Route: route})
		}
	}

	shops := 0
	for _, sign := range signs {
		fmt.Println(sign.Render())
		switch sign.(type) {
		case Shop:
			shops++
		}
	}
	fmt.Printf("SIGNS %d\n", len(signs))
	fmt.Printf("SHOPS %d\n", shops)
}
'''
hints = [
  "There is no `implements` keyword. Give each struct a Render() string method and it satisfies Sign.",
  "Append the concrete value into []Sign — Go wraps it for you.",
  "switch sign.(type) { case Shop: } is the type switch; the value form is switch v := sign.(type).",
]

