func main() {
	var xs []int
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		xs = append(xs, v)
	}

	var stack []int
	for _, v := range xs {
		stack = append(stack, v)
	}
	stack = stack[:len(stack)-1]
	stack[len(stack)-1] = 99

	var plates []string
	for _, x := range stack {
		plates = append(plates, strconv.Itoa(x))
	}
	fmt.Println(strings.Join(plates, " "))

	queue := append([]int(nil), xs...)
	var front []string
	for i := 0; i < 2; i++ {
		head := queue[0]
		queue = queue[1:]
		front = append(front, strconv.Itoa(head))
	}
	fmt.Println(strings.Join(front, " "))
}
