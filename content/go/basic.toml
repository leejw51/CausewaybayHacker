solution    = '''
package main

import (
	"bufio"
	"encoding/json"
	"fmt"
	"os"
	"strings"
)

type Order struct {
	Item  string `json:"item"`
	Cents int64  `json:"cents"`
}

type Summary struct {
	Count int   `json:"count"`
	Total int64 `json:"total"`
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	line, _ := reader.ReadString('\n')
	line = strings.TrimRight(line, "\r\n")

	var orders []Order
	if err := json.Unmarshal([]byte(line), &orders); err != nil {
		fmt.Println("BAD JSON")
		return
	}

	summary := Summary{Count: len(orders)}
	for _, order := range orders {
		fmt.Printf("%s %d\n", order.Item, order.Cents)
		summary.Total += order.Cents
	}

	encoded, err := json.Marshal(summary)
	if err != nil {
		fmt.Println("BAD JSON")
		return
	}
	fmt.Println(string(encoded))
}
'''
hints = [
  "The tag goes in backticks after the type: Item string `json:\"item\"`.",
  "Unmarshal takes a pointer to the destination — &orders, not orders — or it has nothing to fill in.",
  "Check the error from Unmarshal. On bad input orders is left empty and a program that ignores the error prints a cheerful zero summary.",
]

