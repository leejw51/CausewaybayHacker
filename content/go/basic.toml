  { name = "all-missing", stdin = "2\n-\n-\n", expect = "NIL 2\n", visible = false },
  { name = "ties",        stdin = "3\nA 500\nB 500\n-\n", expect = "A 500\nB 500\nNIL 1\n", visible = false },
