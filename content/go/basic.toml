`go f()` starts `f` on its own goroutine and does not wait. A
`sync.WaitGroup` is how `main` waits for all of them: `Add(1)` before each
start, `Done()` inside each one when it finishes — deferred, so it runs
however the function exits — and `Wait()` blocks until the count is back
to zero. Each goroutine here writes only its own `results[i]`, so nothing
is shared.

```
