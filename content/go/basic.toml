brief       = '''
Standard input is one line: a JSON array of orders, each with an `item` string
and a `cents` number.

Unmarshal it, print one line per order as `<ITEM> <CENTS>`, then marshal and
print a summary object with exactly the keys `count` and `total`, in that
order. If the input is not valid JSON, print `BAD JSON` and nothing else.

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

A field has to be **exported** for `encoding/json` to see it at all — a
lowercase field is invisible to the marshaller, silently. The struct tag then
says what it is called on the wire. `Marshal` writes the fields in declaration
order, so the summary's key order is yours to decide, not the map's.
'''
