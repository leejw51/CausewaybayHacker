[[quest]]
id          = "go.basic.04.int-types"
node        = 4
title       = "THE WIDTH OF A NUMBER"
difficulty  = 1
story       = "The Octopus reader at Tin Hau stores the fare in a 32-bit cell and the day's total in a 64-bit one, and today it prints the same zero for both."
concepts    = ["types", "bindings"]
requires    = ["go.basic.03.types"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''
Go's integers come in widths: `int32` and `int64` are signed, `uint32`
and `uint64` cannot go below zero. Nothing converts on its own — you write
the target type like a function, `uint64(a)`, and the value is copied into
the wider cell. The `math` package names the edges: `math.MaxInt32` is the
largest `int32`, `math.MaxUint64` the largest `uint64`.

```
b := uint64(a)
fmt.Println(math.MaxInt32)
```

`a` is read as an `int32`. Type the conversion into `b` and the
`math.MaxInt32` print, in place of the two placeholders; the other two
lines are printed for you.

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
starter     = '''
package main

import (
	"fmt"
	"math"
)

func main() {
	var a int32
	fmt.Scan(&a)

	// FILL: copy a into a uint64 named b
	// ANSWER: b := uint64(a)
	b := uint64(0)
	fmt.Println(b)
	// FILL: print the largest int32
	// ANSWER: fmt.Println(math.MaxInt32)
	fmt.Println(0)
	fmt.Println(uint64(math.MaxUint64))
}
'''
solution    = '''
package main

import (
	"fmt"
	"math"
)

func main() {
	var a int32
	fmt.Scan(&a)

	b := uint64(a)
	fmt.Println(b)
	fmt.Println(math.MaxInt32)
	fmt.Println(uint64(math.MaxUint64))
}
'''
hints = [
  "b := uint64(a) — the type name is the conversion; then fmt.Println(math.MaxInt32).",
  "A width is part of the type: an int32 and an int64 never mix without a conversion written out.",
]

