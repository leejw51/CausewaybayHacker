solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strconv"
	"strings"
)

type Order struct {
	Name  string
	Cents int64
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	n, _ := strconv.Atoi(strings.TrimSpace(sc.Text()))

	orders := make([]*Order, 0, n)
	for i := 0; i < n; i++ {
		sc.Scan()
		fields := strings.Fields(sc.Text())
		if len(fields) < 2 {
			orders = append(orders, nil)
			continue
		}
		cents, err := strconv.ParseInt(fields[1], 10, 64)
		if err != nil {
			orders = append(orders, nil)
			continue
		}
		orders = append(orders, &Order{Name: fields[0], Cents: cents})
	}

	real := make([]*Order, 0, len(orders))
	missing := 0
	for _, order := range orders {
		if order == nil {
			missing++
			continue
		}
		real = append(real, order)
	}

	sort.Slice(real, func(i, j int) bool {
		if real[i].Cents != real[j].Cents {
			return real[i].Cents > real[j].Cents
		}
		return real[i].Name < real[j].Name
	})

	for _, order := range real {
		fmt.Printf("%s %d\n", order.Name, order.Cents)
	}
	fmt.Printf("NIL %d\n", missing)
}
'''
hints = [
  "A nil *Order in a slice is fine until something reads a field off it. Filter first, sort second.",
  "strings.Fields on \"-\" gives one field, so len(fields) < 2 is your missing-order test.",
  "Descending is the > in the less function; the tie-break is a second comparison after it.",
]

