brief       = '''
`xs[1:3]` is a window onto the second and third elements — the same
memory, not a copy. `copy(dst, src)` moves the values into a slice you
made with `make`, so `dst` is its own; and `append` grows it. Change
`dst` afterwards and `xs` does not move.

```
copy(dst, xs[1:3])
dst = append(dst, 99)
```

`xs` is read from stdin and `dst` is a `make([]int, 2)`. Type the copy
and the append, in place of the two placeholders; `dst` and the untouched
`xs` are printed.

```
input:  1 2 3 4 5
output: [2 3 99]
        [1 2 3 4 5]
```
'''
starter     = '''
package main

import (
	"fmt"
)

func main() {
	var xs []int
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		xs = append(xs, v)
	}
	dst := make([]int, 2)

	// FILL: copy the second and third elements of xs into dst
	// ANSWER: copy(dst, xs[1:3])
	copy(dst, xs[:0])
	// FILL: append 99 to dst
	// ANSWER: dst = append(dst, 99)
	dst = append(dst)

	fmt.Println(dst)
	fmt.Println(xs)
}
'''
solution    = '''
package main

import (
	"fmt"
)

func main() {
	var xs []int
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		xs = append(xs, v)
	}
	dst := make([]int, 2)

	copy(dst, xs[1:3])
	dst = append(dst, 99)

	fmt.Println(dst)
	fmt.Println(xs)
}
'''
