func double(text string) (int64, error) {
	value, err := strconv.ParseInt(strings.TrimSpace(text), 10, 64)
	if err != nil {
		return 0, fmt.Errorf("double %q: %w", text, ErrNotANumber)
	}
	return value * 2, nil
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	var n int
	fmt.Sscan(sc.Text(), &n)

	var sum int64
	for i := 0; i < n; i++ {
		sc.Scan()
		line := sc.Text()
		value, err := double(line)
		if errors.Is(err, ErrNotANumber) {
			fmt.Printf("BAD %s\n", strings.TrimSpace(line))
			continue
		}
		fmt.Println(value)
		sum += value
	}
	fmt.Printf("SUM %d\n", sum)
}
