# language's own machinery — slices, maps, strings, structs, interfaces,
# errors, closures, generics, defer/panic/recover, zero values, embedding,
# JSON, testing — and then 12:30 at the interchange, when everything happens
# at once: goroutines, WaitGroup, channels, select, mutexes, context, worker
# pools, and THE RACE on platform 2. The grammar drills live on the BASIC
# road now.
#
# Every quest here has a deterministic answer on purpose: results are joined in
# order, collected and sorted, or piped. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

