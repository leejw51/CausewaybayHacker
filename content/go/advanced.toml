	tramCh := make(chan int)
	mtrCh := make(chan int)

	go func() {
		for i := 0; i < a; i++ {
			tramCh <- i
		}
		close(tramCh)
	}()
	go func() {
		for i := 0; i < b; i++ {
			mtrCh <- i
		}
		close(mtrCh)
	}()

	tram, mtr := 0, 0

	// one select loop that drains both channels, switching an arm off
	// by setting its channel variable to nil when it closes

	fmt.Printf("TRAM %d\n", tram)
	fmt.Printf("MTR %d\n", mtr)
	fmt.Printf("TOTAL %d\n", tram+mtr)
