solution    = '''
package main

import (
	"bufio"
	"context"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, k int
	fmt.Fscan(reader, &n, &k)

	ctx, cancel := context.WithCancel(context.Background())
	defer cancel()

	ch := make(chan int)
	sent := make(chan int)

	go func() {
		count := 0
		for i := 1; i <= n; i++ {
			select {
			case <-ctx.Done():
				sent <- count
				return
			case ch <- i:
				count++
			}
		}
		sent <- count
	}()

	for i := 0; i < k; i++ {
		fmt.Println(<-ch)
	}
	cancel()
	fmt.Println("CANCELLED")
	fmt.Printf("SENT %d\n", <-sent)
}
'''
