solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strconv"
	"strings"
)

type parsed struct {
	index int
	line  string
	value int64
	err   error
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	n, _ := strconv.Atoi(strings.TrimSpace(sc.Text()))
	lines := make([]string, 0, n)
	for i := 0; i < n; i++ {
		sc.Scan()
		lines = append(lines, sc.Text())
	}

	ch := make(chan parsed, n)
	for i, line := range lines {
		go func(index int, text string) {
			value, err := strconv.ParseInt(strings.TrimSpace(text), 10, 64)
			ch <- parsed{index: index, line: text, value: value * 2, err: err}
		}(i, line)
	}

	got := make([]parsed, 0, n)
	for i := 0; i < n; i++ {
		got = append(got, <-ch)
	}
	sort.Slice(got, func(a, b int) bool { return got[a].index < got[b].index })

	var sum int64
	bad := 0
	for _, p := range got {
		if p.err != nil {
			fmt.Printf("BAD %s\n", strings.TrimSpace(p.line))
			bad++
			continue
		}
		fmt.Println(p.value)
		sum += p.value
	}
	fmt.Printf("SUM %d\n", sum)
	fmt.Printf("ERRORS %d\n", bad)
}
'''
