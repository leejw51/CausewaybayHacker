brief       = '''
Standard input is a count `n` and then `n` integers.

Start one goroutine per value. Each sends `{index, value * value}` on one
channel. Collect all `n` results, sort them by index, print `<index> <value>`
one per line, then `GOROUTINES <n>`.

```
input:  3
        2 3 4
output: 0 4
        1 9
        2 16
        GOROUTINES 3
```

The results arrive in whatever order the scheduler feels like. Carrying the
index is what makes the program's answer the same every run.
'''
starter     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type result struct {
	index int
	value int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	ch := make(chan result, n)

	// one goroutine per value, sending {index, value*value};
	// then receive n of them, sort by index, print, then GOROUTINES <n>
	_ = nums
	_ = ch
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
)

type result struct {
	index int
	value int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	ch := make(chan result, n)
	for i, v := range nums {
		go func(index int, value int64) {
			ch <- result{index: index, value: value * value}
		}(i, v)
	}

	got := make([]result, 0, n)
	for i := 0; i < n; i++ {
		got = append(got, <-ch)
	}
	sort.Slice(got, func(a, b int) bool { return got[a].index < got[b].index })

	for _, r := range got {
		fmt.Printf("%d %d\n", r.index, r.value)
	}
	fmt.Printf("GOROUTINES %d\n", n)
}
'''
hints = [
  "A buffered channel of capacity n means no sender ever blocks, so no goroutine leaks if you stop early.",
  "Receive exactly n times. There is no other way to know they are all done here.",
  "sort.Slice on the index restores the order the scheduler took away.",
]

