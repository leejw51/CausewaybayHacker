package main

import (
	"bufio"
	"fmt"
	"os"
)

func total(values ...int64) (sum int64, count int) {
	for _, v := range values {
		sum += v
	}
	count = len(values)
	return
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	list := make([]int64, n)
	for i := range list {
		fmt.Fscan(reader, &list[i])
	}

	sum, count := total(list...)
	fmt.Printf("ALL %d %d\n", sum, count)

	sum, count = total()
	fmt.Printf("NONE %d %d\n", sum, count)

	// passed individually — the form the spread exists to contrast with
	switch len(list) {
	case 0:
		sum, count = total()
	case 1:
		sum, count = total(list[0])
	default:
		sum, count = total(list[0], list[1])
	}
	fmt.Printf("TWO %d %d\n", sum, count)
}
