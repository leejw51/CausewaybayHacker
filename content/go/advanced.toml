solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
)

type Named interface {
	Name() string
}

type Ordered interface {
	~string | ~int64
}

type Stop struct {
	Label string
}

func (s Stop) Name() string {
	return s.Label
}

func Names[T Named](xs []T) []string {
	out := make([]string, 0, len(xs))
	for _, x := range xs {
		out = append(out, x.Name())
	}
	return out
}

func Max[T Ordered](xs []T) T {
	var best T
	for i, x := range xs {
		if i == 0 || x > best {
			best = x
		}
	}
	return best
}

func Distinct[T comparable](xs []T) int {
	seen := make(map[T]struct{}, len(xs))
	for _, x := range xs {
		seen[x] = struct{}{}
	}
	return len(seen)
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	words := make([]string, n)
	stops := make([]Stop, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
		stops[i] = Stop{Label: words[i]}
	}

	fmt.Println(strings.Join(Names(stops), " "))
	fmt.Printf("MAX %s\n", Max(words))
	fmt.Printf("DISTINCT %d\n", Distinct(words))
}
'''
hints = [
  "In Names, x.Name() type-checks because the constraint promised the method — that is what a method constraint buys.",
  "Max can use > only because Ordered is a type set of types that support it; `any` would not compile.",
  "map[T]struct{} needs T to be comparable, which is exactly the constraint, and struct{} is the zero-width value that says `set, not map`.",
]

