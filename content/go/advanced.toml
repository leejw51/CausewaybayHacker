solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	// 1. the send is the edge: the write to `published` happens before it
	published := 0
	ready := make(chan struct{})
	go func() {
		published = 42
		close(ready)
	}()
	<-ready
	fmt.Printf("CHAN %d\n", published)

	// 2. Once.Do returns only after the one call has finished
	var once sync.Once
	runs := 0
	var wgOnce sync.WaitGroup
	for i := 0; i < n; i++ {
		wgOnce.Add(1)
		go func() {
			defer wgOnce.Done()
			once.Do(func() { runs++ })
		}()
	}
	wgOnce.Wait()
	fmt.Printf("ONCE %d\n", runs)

	// 3. an unlock happens before the next lock
	var mu sync.Mutex
	counter := 0
	var wgMutex sync.WaitGroup
	for i := 0; i < n; i++ {
		wgMutex.Add(1)
		go func() {
			defer wgMutex.Done()
			mu.Lock()
			counter++
			mu.Unlock()
		}()
	}
	wgMutex.Wait()
	fmt.Printf("MUTEX %d\n", counter)

	// 4. Wait returns only after every matching Done
	slots := make([]int, n)
	var wgSlots sync.WaitGroup
	for i := 0; i < n; i++ {
		wgSlots.Add(1)
		go func(slot int) {
			defer wgSlots.Done()
			slots[slot] = 1
		}(i)
	}
	wgSlots.Wait()
	written := 0
	for _, v := range slots {
		written += v
	}
	fmt.Printf("WG %d\n", written)
}
'''
