solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type Describer interface {
	Describe() string
}

type Stop struct {
	Name string
}

func (s Stop) Describe() string {
	return s.Name
}

type Terminus struct {
	Stop
	Lines int
}

func (t Terminus) Describe() string {
	return fmt.Sprintf("%s (%d lines)", t.Stop.Describe(), t.Lines)
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	all := make([]Describer, 0, n)
	for i := 0; i < n; i++ {
		var kind, name string
		fmt.Fscan(reader, &kind, &name)
		if kind == "TERM" {
			var lines int
			fmt.Fscan(reader, &lines)
			all = append(all, Terminus{Stop: Stop{Name: name}, Lines: lines})
			continue
		}
		all = append(all, Stop{Name: name})
	}

	termini := 0
	for _, d := range all {
		fmt.Println(d.Describe())
		if _, ok := d.(Terminus); ok {
			termini++
		}
	}
	fmt.Printf("TERMINI %d\n", termini)
}
'''
