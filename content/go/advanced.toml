solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

type Counter struct {
	mu    sync.Mutex
	total int64
	hits  int
}

func (c *Counter) Add(v int64) {
	c.mu.Lock()
	defer c.mu.Unlock()
	c.total += v
	c.hits++
}

func (c *Counter) Snapshot() (int64, int) {
	c.mu.Lock()
	defer c.mu.Unlock()
	return c.total, c.hits
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	var counter Counter
	var wg sync.WaitGroup
	for _, v := range nums {
		wg.Add(1)
		go func(value int64) {
			defer wg.Done()
			counter.Add(value)
		}(v)
	}
	wg.Wait()

	total, hits := counter.Snapshot()
	fmt.Printf("TOTAL %d\n", total)
	fmt.Printf("HITS %d\n", hits)
}
'''
hints = [
  "c.mu.Lock() then defer c.mu.Unlock() is the whole pattern, and the defer survives an early return.",
  "Snapshot reads two fields; reading them under one lock is what makes the pair consistent.",
  "Both methods need a pointer receiver, or each call locks a copy of the mutex and guards nothing.",
]

