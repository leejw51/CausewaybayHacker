	fmt.Fscan(reader, &n)

	var once sync.Once
	var mu sync.Mutex
	var wg sync.WaitGroup

	// 1. write a plain int in a goroutine, publish it with a channel send
	// 2. n goroutines, one sync.Once, count the runs
	// 3. n goroutines, one counter, one mutex
	// 4. n goroutines, one slot each, wg.Wait before reading
	_ = once
	_ = mu
	_ = wg

	fmt.Println("CHAN 0")
	fmt.Println("ONCE 0")
	fmt.Println("MUTEX 0")
	fmt.Println("WG 0")
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	// 1. the send is the edge: the write to `published` happens before it
	published := 0
	ready := make(chan struct{})
	go func() {
		published = 42
		close(ready)
	}()
	<-ready
	fmt.Printf("CHAN %d\n", published)

	// 2. Once.Do returns only after the one call has finished
	var once sync.Once
	runs := 0
	var wgOnce sync.WaitGroup
	for i := 0; i < n; i++ {
		wgOnce.Add(1)
		go func() {
			defer wgOnce.Done()
			once.Do(func() { runs++ })
		}()
	}
	wgOnce.Wait()
	fmt.Printf("ONCE %d\n", runs)

	// 3. an unlock happens before the next lock
	var mu sync.Mutex
	counter := 0
	var wgMutex sync.WaitGroup
	for i := 0; i < n; i++ {
		wgMutex.Add(1)
		go func() {
			defer wgMutex.Done()
			mu.Lock()
			counter++
			mu.Unlock()
		}()
	}
	wgMutex.Wait()
	fmt.Printf("MUTEX %d\n", counter)

	// 4. Wait returns only after every matching Done
	slots := make([]int, n)
	var wgSlots sync.WaitGroup
	for i := 0; i < n; i++ {
		wgSlots.Add(1)
		go func(slot int) {
			defer wgSlots.Done()
			slots[slot] = 1
		}(i)
	}
	wgSlots.Wait()
	written := 0
	for _, v := range slots {
		written += v
	}
	fmt.Printf("WG %d\n", written)
}
'''
hints = [
  "close(ready) then <-ready is the cheapest publication edge in Go, and it carries every write the goroutine made before it.",
  "runs++ inside once.Do needs no lock of its own — Once already guarantees it happens exactly once and before every other Do returns.",
  "Each goroutine owns one slot, so no two ever touch the same memory; the only edge needed is the Wait before reading them all.",
]

