	return "ok"
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	words := make([]string, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
	}

	var empty map[string]int
	fmt.Printf("READ %d\n", empty["missing"])

	var list []string
	for _, word := range words {
		list = append(list, word)
	}
	fmt.Printf("LEN %d\n", len(list))

	fmt.Printf("WRITE %s\n", writeToNil(empty))

	seeded := map[string]int{"a": 1, "b": 2}
	found := 0
	for _, word := range words {
		if _, ok := seeded[word]; ok {
			found++
		}
	}
	fmt.Printf("FOUND %d\n", found)
}
