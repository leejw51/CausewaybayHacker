brief       = '''
Standard input is one integer `n`.

Build four correctly synchronised things and print what each one produced:

1. `CHAN <v>` — a goroutine writes a plain `int` and **then** sends on a
   channel; the receive is what makes the write visible. Write `42`.
2. `ONCE <k>` — `n` goroutines all call one `sync.Once`; `k` is how many times
   the function actually ran.
3. `MUTEX <k>` — `n` goroutines increment a counter under a `sync.Mutex`.
4. `WG <k>` — `n` goroutines each write their own slot of a slice, and
   `wg.Wait()` is what makes all `n` writes visible to the reader.

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

Every one of these is a *happens-before* edge, and they are the only four
shapes you need: a send happens before the corresponding receive completes;
`Once.Do` returns only after the one call has finished; an unlock happens
before the next lock; `wg.Wait` returns only after the matching `Done` calls.

Nothing here is safe because of timing. Take any one edge away and `-race`
finds it, on a machine that never once produced the wrong number.
'''
