solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strconv"
	"strings"
)

func run(text string) (out string) {
	defer func() {
		if r := recover(); r != nil {
			out = fmt.Sprintf("RECOVERED %v", r)
		}
	}()

	text = strings.TrimSpace(text)
	if text == "BOOM" {
		panic("boom")
	}
	value, err := strconv.ParseInt(text, 10, 64)
	if err != nil {
		return "BAD " + text
	}
	return strconv.FormatInt(value*2, 10)
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	n, _ := strconv.Atoi(strings.TrimSpace(sc.Text()))

	done := 0
	defer func() {
		fmt.Printf("CLOSED %d\n", done)
	}()

	for i := 0; i < n; i++ {
		sc.Scan()
		fmt.Println(run(sc.Text()))
		done++
	}
}
'''
