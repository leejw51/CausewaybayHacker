Standard input is one integer `n`.

Make a parent context with `context.WithCancel`. Derive `n` children from it:
the **even**-numbered ones with `context.WithCancel(parent)`, the
**odd**-numbered ones with `context.WithDeadline(parent, <one hour ago>)`.

