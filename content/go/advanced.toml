# ---------------------------------------------------------------- 32
[[quest]]
id          = "go.advanced.16.gotchas"
node        = 32
title       = "THREE THINGS THAT ARE NOT WHAT THEY LOOK LIKE"
difficulty  = 4
story       = "Not an algorithm question. Three snippets, and the interviewer only wants to know what each one prints."
concepts    = ["slices", "interfaces", "zero-values", "functions"]
requires    = ["go.advanced.15.generic-constraints"]
map          = { x = 0.538, y = 0.857, kind = "quest" }
brief       = '''
Standard input is a count `n` (at least 4) and then `n` integers.

Build `a := make([]int, n, n+4)` and fill it. Then produce exactly four lines:

1. `ALIAS <a[2]>` — after `b := a[:2]` and `b = append(b, 99)`.
2. `NILIFACE <bool>` — assign a **nil `*Thing`** into a `Fooer` interface
   variable and report whether that variable `!= nil`.
3. `DEFER_CLOSURE <v>` — from `defer func(){ ... }()` reading `x`.
4. `DEFER_ARG <v>` — from `defer fmt.Printf(..., x)`.

Set `x := a[0]` **before** both defers are registered, and `x = a[n-1]` at the
very end of `main`. (`n` is at least 4 so that `a[n-1]` is never the cell the
aliasing step overwrites — which it would be at `n = 3`, and that is a fourth
surprise this quest is deliberately keeping out of the way.)

```
input:  4
        1 2 3 4
output: ALIAS 99
        NILIFACE true
        DEFER_CLOSURE 4
        DEFER_ARG 1
```

All three answers surprise people, and all three have the same cause: Go
evaluates something earlier or later than it looks.

**Aliasing.** `a[:2]` shares `a`'s backing array and keeps its capacity, so
the `append` has room and writes into `a[2]` rather than allocating. Slicing
is not copying. `a[:2:2]` — the three-index form — caps the capacity and is
how you stop this.

**Typed nil.** An interface value is a (type, value) pair. Putting a nil
`*Thing` into it gives you `(*Thing, nil)`, which is not the nil *interface*.
This is why `if err != nil` fires on a function that returned a nil concrete
error pointer, and it is the most expensive two lines in Go.

**Defer.** The arguments to a deferred call are evaluated **when the `defer`
runs**, not when the call does. A deferred closure taking no arguments reads
its variables at call time instead. Both defers see the same `x`; they
disagree because one of them already made a copy. And they run LIFO, so the
one written second prints first.
'''
starter     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type Fooer interface {
	Foo() string
}

type Thing struct {
	Label string
}

func (t *Thing) Foo() string {
	return t.Label
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	a := make([]int, n, n+4)
	for i := range a {
		fmt.Fscan(reader, &a[i])
	}

	x := a[0]
	// register the two defers here, then do the aliasing and the interface
	_ = x

	fmt.Println("ALIAS 0")
	fmt.Println("NILIFACE false")

	x = a[n-1]
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type Fooer interface {
	Foo() string
}

type Thing struct {
	Label string
}

func (t *Thing) Foo() string {
	return t.Label
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	a := make([]int, n, n+4)
	for i := range a {
		fmt.Fscan(reader, &a[i])
	}

	x := a[0]
	// the argument is evaluated now, so this one is frozen at a[0]
	defer fmt.Printf("DEFER_ARG %d\n", x)
	// the closure reads x when it runs, which is after x has changed
	defer func() {
		fmt.Printf("DEFER_CLOSURE %d\n", x)
	}()

	// b shares a's backing array and inherits its capacity, so append writes
	// into a[2] instead of allocating
	b := a[:2]
	b = append(b, 99)
	fmt.Printf("ALIAS %d\n", a[2])

	// a nil *Thing inside an interface is not a nil interface
	var p *Thing
	var boxed Fooer = p
	fmt.Printf("NILIFACE %t\n", boxed != nil)

	x = a[n-1]
}
'''
hints = [
  "Register both defers before anything changes x, and remember they run last-in-first-out.",
  "cap(a[:2]) is cap(a), not 2 — that is the whole aliasing answer. Try a[:2:2] afterwards and watch ALIAS become the original value.",
  "boxed holds (*Thing, nil). Comparing it against nil compares the pair, and the type half is not nil.",
]

