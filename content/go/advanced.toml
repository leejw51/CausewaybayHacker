solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

type Directory struct {
	mu    sync.RWMutex
	slots map[string]int
}

func NewDirectory() *Directory {
	return &Directory{slots: map[string]int{}}
}

func (d *Directory) Set(word string, index int) {
	d.mu.Lock()
	defer d.mu.Unlock()
	d.slots[word] = index
}

func (d *Directory) Get(word string) (int, bool) {
	d.mu.RLock()
	defer d.mu.RUnlock()
	index, ok := d.slots[word]
	return index, ok
}

func (d *Directory) Size() int {
	d.mu.RLock()
	defer d.mu.RUnlock()
	return len(d.slots)
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, q int
	fmt.Fscan(reader, &n, &q)
	words := make([]string, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
	}
	queries := make([]string, q)
	for i := range queries {
		fmt.Fscan(reader, &queries[i])
	}

	dir := NewDirectory()
	for i, word := range words {
		dir.Set(word, i)
	}

	answers := make([]string, q)
	var wg sync.WaitGroup
	for i, word := range queries {
		wg.Add(1)
		go func(slot int, target string) {
			defer wg.Done()
			if index, ok := dir.Get(target); ok {
				answers[slot] = fmt.Sprintf("%s %d", target, index)
				return
			}
			answers[slot] = fmt.Sprintf("%s MISSING", target)
		}(i, word)
	}
	wg.Wait()

	for _, line := range answers {
		fmt.Println(line)
	}
	fmt.Printf("SIZE %d\n", dir.Size())
}
'''
hints = [
  "RLock/RUnlock for the readers, Lock/Unlock for the writer. Mixing them up compiles and quietly removes the benefit.",
  "Each goroutine writes answers[slot] and no two share a slot, so the slice needs no lock of its own.",
  "The comma-ok form of a map read is what separates `missing` from `present and zero`.",
]

