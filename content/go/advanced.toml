Standard input is two integers, `n` and `k`.

Start a producer goroutine that would send `1..n` on an **unbuffered**
channel, one at a time, but which stops the moment its `context` is cancelled
and reports how many it actually managed to send.

`main` receives exactly `k` values and prints them, calls `cancel()`, prints
`CANCELLED`, then prints `SENT <count>` from the producer.

```
input:  5 3
output: 1
        2
        3
        CANCELLED
        SENT 3
```

The producer's loop body is a `select` with two arms: `<-ctx.Done()` and the
send. Once nobody is receiving, the send is never ready, so cancellation is
the only thing that can fire. That is what makes this deterministic instead of
lucky.
