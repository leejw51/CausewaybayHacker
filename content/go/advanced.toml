map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, the sum of the values you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Define a sentinel `var ErrNotANumber = errors.New(...)`, wrap it with
`fmt.Errorf("...: %w", ErrNotANumber)`, and recognise it in `main` with
`errors.Is`. An error is a value; this is what that buys you.
'''
starter     = '''
package main

import (
	"bufio"
	"errors"
	"fmt"
	"os"
	"strings"
)

var ErrNotANumber = errors.New("not a number")

func double(text string) (int64, error) {
	_ = strings.TrimSpace(text)
	return 0, ErrNotANumber
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	var n int
	fmt.Sscan(sc.Text(), &n)

	var sum int64
	for i := 0; i < n; i++ {
		sc.Scan()
		line := sc.Text()
		_ = line
		// print the doubled value or BAD <line>, and keep a running total
	}
	fmt.Printf("SUM %d\n", sum)
}
'''
solution    = '''
package main

import (
	"bufio"
	"errors"
	"fmt"
	"os"
	"strconv"
	"strings"
)

var ErrNotANumber = errors.New("not a number")

func double(text string) (int64, error) {
	value, err := strconv.ParseInt(strings.TrimSpace(text), 10, 64)
	if err != nil {
		return 0, fmt.Errorf("double %q: %w", text, ErrNotANumber)
	}
	return value * 2, nil
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	var n int
	fmt.Sscan(sc.Text(), &n)

	var sum int64
	for i := 0; i < n; i++ {
		sc.Scan()
		line := sc.Text()
		value, err := double(line)
		if errors.Is(err, ErrNotANumber) {
			fmt.Printf("BAD %s\n", strings.TrimSpace(line))
			continue
		}
		fmt.Println(value)
		sum += value
	}
	fmt.Printf("SUM %d\n", sum)
}
'''
hints = [
  "strconv.ParseInt(s, 10, 64) returns (int64, error) — the second value is not optional to look at.",
  "%w in fmt.Errorf keeps the wrapped error findable; %v would flatten it to text.",
  "errors.Is walks the wrap chain, so it still matches after the message was decorated.",
]

