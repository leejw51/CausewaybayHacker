solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"strconv"
	"strings"
)

type Order struct {
	Name  string
	Cents int64
}

func main() {
	sc := bufio.NewScanner(os.Stdin)
	sc.Scan()
	n, _ := strconv.Atoi(strings.TrimSpace(sc.Text()))

	orders := make([]*Order, 0, n)
	for i := 0; i < n; i++ {
		sc.Scan()
		fields := strings.Fields(sc.Text())
		if len(fields) < 2 {
			orders = append(orders, nil)
			continue
		}
		cents, err := strconv.ParseInt(fields[1], 10, 64)
		if err != nil {
			orders = append(orders, nil)
			continue
		}
		orders = append(orders, &Order{Name: fields[0], Cents: cents})
	}

	present := make([]*Order, 0, len(orders))
	missing := 0
	for _, order := range orders {
		if order == nil {
			missing++
			continue
		}
		present = append(present, order)
	}

	sort.Slice(present, func(i, j int) bool {
		if present[i].Cents != present[j].Cents {
			return present[i].Cents > present[j].Cents
		}
		return present[i].Name < present[j].Name
	})

	for _, order := range present {
		fmt.Printf("%s %d\n", order.Name, order.Cents)
	}
	fmt.Printf("NIL %d\n", missing)
}
'''
