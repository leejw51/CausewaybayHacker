solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

type Item struct {
	Name  string
	Cents int64
}

type Till struct {
	Items []Item
}

func (t *Till) Add(name string, cents int64) {
	t.Items = append(t.Items, Item{Name: name, Cents: cents})
}

func (t *Till) Total() int64 {
	var total int64
	for _, item := range t.Items {
		total += item.Cents
	}
	return total
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	var till Till
	for i := 0; i < n; i++ {
		var name string
		var cents int64
		fmt.Fscan(reader, &name, &cents)
		till.Add(name, cents)
	}

	for _, item := range till.Items {
		fmt.Printf("%s %d\n", item.Name, item.Cents)
	}
	fmt.Printf("TOTAL %d\n", till.Total())
}
'''
hints = [
  "func (t *Till) Add — a pointer receiver mutates the till the caller holds.",
  "till.Add(...) still works unchanged; Go takes the address for you because till is addressable.",
  "Total only reads, but keep the receivers consistent on one type.",
]

