solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
	"sync"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	words := make([]string, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
	}

	var wg sync.WaitGroup
	out := make([]string, n)
	for i, word := range words {
		wg.Add(1)
		go func(index int, w string) {
			defer wg.Done()
			out[index] = strings.ToUpper(w)
		}(i, word)
	}
	wg.Wait()

	for _, w := range out {
		fmt.Println(w)
	}
	fmt.Printf("WAITED %d\n", n)
}
'''
