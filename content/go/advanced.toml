brief       = '''
Standard input is two integers `a` and `b`.

One goroutine sends `a` values on the tram channel and closes it; another
sends `b` on the MTR channel and closes it. `main` drains **both** with one
`select` loop and counts what came from where.

Print `TRAM <a>`, `MTR <b>`, `TOTAL <a+b>`.

```
input:  3 2
output: TRAM 3
        MTR 2
        TOTAL 5
```

A receive on a closed channel returns immediately, forever — so a `select`
that keeps that arm spins. The trick: `v, ok := <-ch`, and when `ok` is false
set that channel variable to `nil`. A receive on a **nil** channel blocks
forever, which in a `select` means the arm is simply switched off. Loop while
either is still non-nil.
'''
