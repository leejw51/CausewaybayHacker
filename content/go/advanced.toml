solution    = '''
package main

import (
	"bufio"
	"context"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n, k int
	fmt.Fscan(reader, &n, &k)

	ctx, cancel := context.WithCancel(context.Background())
	defer cancel()

	ch := make(chan int)
	sent := make(chan int)

	go func() {
		count := 0
		for i := 1; i <= n; i++ {
			select {
			case <-ctx.Done():
				sent <- count
				return
			case ch <- i:
				count++
			}
		}
		sent <- count
	}()

	for i := 0; i < k; i++ {
		fmt.Println(<-ch)
	}
	cancel()
	fmt.Println("CANCELLED")
	fmt.Printf("SENT %d\n", <-sent)
}
'''
hints = [
  "ctx.Done() is a channel that is closed when cancel is called, so a receive on it is a select arm like any other.",
  "The producer must report on both paths: the cancelled return and the end of the loop.",
  "defer cancel() in main is not optional even when you call cancel yourself — it is what releases the context.",
]

