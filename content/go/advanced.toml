'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
	"sync"
)

type job struct {
	index int
	value int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var w, n int
	fmt.Fscan(reader, &w, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	jobs := make(chan job)
	results := make(chan job)
	var wg sync.WaitGroup

	for i := 0; i < w; i++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			for j := range jobs {
				results <- job{index: j.index, value: j.value * j.value}
			}
		}()
	}

	go func() {
		for i, v := range nums {
			jobs <- job{index: i, value: v}
		}
		close(jobs)
	}()

	go func() {
		wg.Wait()
		close(results)
	}()

	out := make([]job, 0, n)
	for r := range results {
		out = append(out, r)
	}
	sort.Slice(out, func(a, b int) bool { return out[a].index < out[b].index })

	for _, r := range out {
		fmt.Printf("%d %d\n", r.index, r.value)
	}
	fmt.Printf("WORKERS %d\n", w)
}
'''
hints = [
  "The workers do not need an index of their own; the job carries it.",
  "close(results) cannot happen in a worker — there are w of them and only one close is legal.",
  "That is what the extra goroutine is for: wg.Wait() then close(results), while main is still draining.",
]

