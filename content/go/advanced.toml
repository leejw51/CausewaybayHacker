brief       = '''
Standard input is a count `n`, then `n` words.

Start one goroutine per word that writes the word uppercased into `out[i]` —
its own index, so no two goroutines touch the same element. Wait for all of
them with a `sync.WaitGroup`, then print `out` in order and `WAITED <n>`.

```
input:  2
        lucky
        mac
output: LUCKY
        MAC
        WAITED 2
```

`wg.Add(1)` before the `go`, `defer wg.Done()` first thing inside it,
`wg.Wait()` before you read anything. Adding inside the goroutine is a race
against `Wait` itself.
'''
starter     = '''
