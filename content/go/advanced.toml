brief       = '''
Standard input is one integer `n`.

Make a parent context with `context.WithCancel`. Derive `n` children from it:
the **even**-numbered ones with `context.WithCancel(parent)`, the
**odd**-numbered ones with `context.WithDeadline(parent, <one hour ago>)`.

Start one goroutine per child that waits on `<-child.Done()` and reports its
index and `child.Err().Error()`. Cancel the parent, collect all `n` reports,
print them sorted by index. Then print the parent's own error and
`IS_CANCELED YES` if `errors.Is(parent.Err(), context.Canceled)`.

```
input:  3
output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

Cancellation flows **down** a context tree and never up. A child whose
deadline has already passed is dead the moment it is made, whatever the parent
does — which is why the odd ones report a different error and why the output
is the same on every run rather than a race.

`defer cancel()` on every context you create is not politeness. A context you
never cancel keeps its parent's child list growing, and that is a leak with no
goroutine in it.
'''
starter     = '''
package main

import (
	"bufio"
	"context"
	"fmt"
	"os"
	"time"
)

type report struct {
	index int
	err   string
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	parent, cancel := context.WithCancel(context.Background())
	done := make(chan report, n)

	// derive n children: even ones WithCancel, odd ones WithDeadline in the past
	// one goroutine each, waiting on Done and reporting Err
	_ = done
	_ = time.Hour

	cancel()
	fmt.Println("PARENT ?")
	fmt.Println("IS_CANCELED NO")
	_ = parent
}
