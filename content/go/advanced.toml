import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	words := make([]string, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
	}

	var wg sync.WaitGroup
	out := make([]string, n)

	// Add, go, Done, Wait — then print out in order and WAITED <n>
	_ = wg
	_ = out
	_ = words
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"strings"
	"sync"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	words := make([]string, n)
	for i := range words {
		fmt.Fscan(reader, &words[i])
	}

	var wg sync.WaitGroup
	out := make([]string, n)
	for i, word := range words {
		wg.Add(1)
		go func(index int, w string) {
			defer wg.Done()
			out[index] = strings.ToUpper(w)
		}(i, word)
	}
	wg.Wait()

	for _, w := range out {
		fmt.Println(w)
	}
	fmt.Printf("WAITED %d\n", n)
}
'''
hints = [
  "Writing out[i] from many goroutines is safe because every i is written by exactly one of them.",
  "defer wg.Done() as the first line of the goroutine, so a panic still releases the wait.",
  "wg.Add(1) goes in the loop, before the go statement — not inside the goroutine.",
]

