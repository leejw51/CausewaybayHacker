'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	for i := 1; i <= n; i++ {
		switch {
		case i%15 == 0:
			fmt.Println("TRAMMTR")
		case i%3 == 0:
			fmt.Println("TRAM")
		case i%5 == 0:
			fmt.Println("MTR")
		default:
			fmt.Println(i)
		}
	}
}
'''
