[[quest]]
id          = "go.advanced.10.race"
node        = 10
title       = "THE RACE"
difficulty  = 5
story       = "Causeway Bay interchange, platform 2. Two counters, one number, and the number is wrong by an amount nobody can reproduce twice."
concepts    = ["data-races", "shared-state", "concurrency", "control-flow"]
requires    = ["go.advanced.09.errors-in-flight", "go.advanced.05.mutex"]
map         = { x = 0.76, y = 0.80, kind = "boss" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<IN|OUT> <K>`.

Start one goroutine per line. Each one increments its counter `K` times, one
at a time — not `+= K`, one at a time, because that is what a turnstile does.
Wait for them all, then print `IN <a>`, `OUT <b>`, `NET <a-b>`.

```
input:  2
        IN 3
        OUT 1
output: IN 3
        OUT 1
        NET 2
```

`K` reaches six figures in the hidden cases, which is the point: a plain
`in++` from several goroutines does not merely *risk* losing counts at that
size, it loses them, every run, a different number of them. `in++` is a load,
an add and a store, and nothing holds those three together.

Use `sync/atomic` (or a `sync.Mutex`) and verify it the way the real answer is
verified: `go test -race` / `go run -race`, which reports the unsynchronized
access itself rather than the wrong total it produced.
'''
starter     = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
)

type cmd struct {
	dir string
	k   int
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	cmds := make([]cmd, n)
	for i := range cmds {
		fmt.Fscan(reader, &cmds[i].dir, &cmds[i].k)
	}

	in, out := 0, 0
	var wg sync.WaitGroup
	for _, c := range cmds {
		wg.Add(1)
		go func(c cmd) {
			defer wg.Done()
			// increment the right counter c.k times — safely
			_ = c
		}(c)
	}
	wg.Wait()

	fmt.Printf("IN %d\n", in)
	fmt.Printf("OUT %d\n", out)
	fmt.Printf("NET %d\n", in-out)
}
'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
	"sync/atomic"
)

type cmd struct {
	dir string
	k   int
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	cmds := make([]cmd, n)
	for i := range cmds {
		fmt.Fscan(reader, &cmds[i].dir, &cmds[i].k)
	}

	var in, out atomic.Int64
	var wg sync.WaitGroup
	for _, c := range cmds {
		wg.Add(1)
		go func(c cmd) {
			defer wg.Done()
			for i := 0; i < c.k; i++ {
				if c.dir == "IN" {
					in.Add(1)
				} else {
					out.Add(1)
				}
			}
		}(c)
	}
	wg.Wait()

	fmt.Printf("IN %d\n", in.Load())
	fmt.Printf("OUT %d\n", out.Load())
	fmt.Printf("NET %d\n", in.Load()-out.Load())
}
'''
hints = [
  "atomic.Int64 with Add(1) is the smallest change that makes this correct.",
  "A sync.Mutex around both counters also works and is slower; taking it once per increment is the honest comparison.",
  "Read both counters after Wait, not during — a snapshot taken mid-flight is a different kind of wrong.",
]

