solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sort"
)

type result struct {
	index int
	value int64
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	ch := make(chan result, n)
	for i, v := range nums {
		go func(index int, value int64) {
			ch <- result{index: index, value: value * value}
		}(i, v)
	}

	got := make([]result, 0, n)
	for i := 0; i < n; i++ {
		got = append(got, <-ch)
	}
	sort.Slice(got, func(a, b int) bool { return got[a].index < got[b].index })

	for _, r := range got {
		fmt.Printf("%d %d\n", r.index, r.value)
	}
	fmt.Printf("GOROUTINES %d\n", n)
}
'''
