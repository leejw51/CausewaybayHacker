package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var b, n int
	fmt.Fscan(reader, &b, &n)

	ch := make(chan int, b)
	sent, dropped, got := 0, 0, 0

	for i := 1; i <= n; i++ {
		select {
		case ch <- i:
			sent++
		default:
			dropped++
		}
	}

	draining := true
	for draining {
		select {
		case <-ch:
			got++
		default:
			draining = false
		}
	}

	empty := "no"
	select {
	case <-ch:
	default:
		empty = "yes"
	}

	fmt.Printf("SENT %d\n", sent)
	fmt.Printf("DROPPED %d\n", dropped)
	fmt.Printf("GOT %d\n", got)
	fmt.Printf("EMPTY %s\n", empty)
}
'''
