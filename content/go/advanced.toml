'''
solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var a, b int
	fmt.Fscan(reader, &a, &b)

	tramCh := make(chan int)
	mtrCh := make(chan int)

	go func() {
		for i := 0; i < a; i++ {
			tramCh <- i
		}
		close(tramCh)
	}()
	go func() {
		for i := 0; i < b; i++ {
			mtrCh <- i
		}
		close(mtrCh)
	}()

	tram, mtr := 0, 0
	for tramCh != nil || mtrCh != nil {
		select {
		case _, ok := <-tramCh:
			if !ok {
				tramCh = nil
				continue
			}
			tram++
		case _, ok := <-mtrCh:
			if !ok {
				mtrCh = nil
				continue
			}
			mtr++
		}
	}

	fmt.Printf("TRAM %d\n", tram)
	fmt.Printf("MTR %d\n", mtr)
	fmt.Printf("TOTAL %d\n", tram+mtr)
}
'''
hints = [
  "v, ok := <-ch inside a select case: ok is false exactly once the channel is closed and drained.",
  "Setting the channel variable to nil disables that case. A nil channel never becomes ready.",
  "The loop condition is `tramCh != nil || mtrCh != nil`, so it ends when both arms are off.",
]

