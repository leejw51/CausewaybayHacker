  "A select with a default and one case is the whole non-blocking idiom; there is no TrySend function.",
  "Drain with the same shape: receive while a value is ready, and let default end the loop.",
  "Do not close the channel to test emptiness — a receive on a closed channel is always ready and would report `no`.",
]

