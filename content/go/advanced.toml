input:  3
output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

Cancellation flows **down** a context tree and never up. A child whose
deadline has already passed is dead the moment it is made, whatever the parent
does — which is why the odd ones report a different error and why the output
is the same on every run rather than a race.

`defer cancel()` on every context you create is not politeness. A context you
never cancel keeps its parent's child list growing, and that is a leak with no
goroutine in it.
