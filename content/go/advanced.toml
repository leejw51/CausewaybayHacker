solution    = '''
package main

import (
	"bufio"
	"context"
	"errors"
	"fmt"
	"os"
	"sort"
	"time"
)

type report struct {
	index int
	err   string
}

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)

	parent, cancel := context.WithCancel(context.Background())
	done := make(chan report, n)

	for i := 0; i < n; i++ {
		var child context.Context
		var stop context.CancelFunc
		if i%2 == 0 {
			child, stop = context.WithCancel(parent)
		} else {
			child, stop = context.WithDeadline(parent, time.Now().Add(-time.Hour))
		}
		defer stop()

		go func(index int, ctx context.Context) {
			<-ctx.Done()
			done <- report{index: index, err: ctx.Err().Error()}
		}(i, child)
	}

	cancel()

	got := make([]report, 0, n)
	for i := 0; i < n; i++ {
		got = append(got, <-done)
	}
	sort.Slice(got, func(a, b int) bool { return got[a].index < got[b].index })
	for _, r := range got {
		fmt.Printf("%d %s\n", r.index, r.err)
	}

	fmt.Printf("PARENT %s\n", parent.Err().Error())
	if errors.Is(parent.Err(), context.Canceled) {
		fmt.Println("IS_CANCELED YES")
	} else {
		fmt.Println("IS_CANCELED NO")
	}
}
'''
