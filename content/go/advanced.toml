solution    = '''
package main

import (
	"bufio"
	"fmt"
	"os"
	"sync"
	"sync/atomic"
)

func main() {
	reader := bufio.NewReader(os.Stdin)
	var n int
	fmt.Fscan(reader, &n)
	nums := make([]int64, n)
	for i := range nums {
		fmt.Fscan(reader, &nums[i])
	}

	var once sync.Once
	var total atomic.Int64
	var count atomic.Int64
	var wg sync.WaitGroup

	for _, v := range nums {
		wg.Add(1)
		go func(value int64) {
			defer wg.Done()
			once.Do(func() {
				fmt.Println("INIT")
			})
			total.Add(value)
			count.Add(1)
		}(v)
	}
	wg.Wait()

	fmt.Printf("TOTAL %d\n", total.Load())
	fmt.Printf("COUNT %d\n", count.Load())
}
'''
hints = [
  "once.Do(func(){ ... }) runs its argument the first time and blocks the others until it has finished.",
  "atomic.Int64 has Add and Load methods — no address-of, no mutex.",
  "INIT always lands before TOTAL because the printing happens inside the goroutines and TOTAL happens after Wait.",
]

