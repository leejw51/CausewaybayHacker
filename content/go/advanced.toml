Read one integer `n`. For every `i` from `1` to `n`, print one line:

* `TRAMMTR` if `i` divides by both 3 and 5
* `TRAM` if `i` divides by 3
* `MTR` if `i` divides by 5
* otherwise `i` itself

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

Go's `switch` with no subject takes a boolean case per arm and does not fall
through. Use it.
'''
