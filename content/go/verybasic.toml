func (h IntHeap) Swap(i, j int)      { h[i], h[j] = h[j], h[i] }
func (h *IntHeap) Push(x any)        { *h = append(*h, x.(int)) }
func (h *IntHeap) Pop() any {
	old := *h
	n := len(old)
	x := old[n-1]
	*h = old[:n-1]
	return x
}

func main() {
	h := &IntHeap{}
	heap.Init(h)
	var v int
	for {
		if _, err := fmt.Scan(&v); err != nil {
			break
		}
		// FILL: v into the heap
		heap.Push(h, v)
	}
	var out []string
	for h.Len() > 0 {
		out = append(out, fmt.Sprint(heap.Pop(h).(int)))
	}
	fmt.Println(strings.Join(out, " "))
}
