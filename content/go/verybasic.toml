# GO LAND — VERY BASIC. The grammar asked as a question first. Tin Hau at
# 06:00, before the Island Line opens: every node shows a whole program with
# one hole and four lines that might fill it — one right, three that will not
# compile, will crash, or will print the wrong thing. Pick the line, then type
# it. Types, containers, a stack, a queue, a heap, a struct, a goroutine, a
# mutex, and a binary search tree at the boss: the grammar a live coding test
# leans on, one line at a time. Nothing here is timed; verify_pack refuses a
# very-basic solution that adds more than one line, and it swaps every wrong
# choice into the solution to prove it fails.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tools/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "go.verybasic"
land = "go"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "go.verybasic.01.print"
node        = 1
title       = "THE FIRST LINE"
difficulty  = 1
story       = "Tin Hau, 06:00, the shutter half up. The screen on the ticket machine is meant to greet and prints an empty line instead."
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
A program that says one thing needs one call from `fmt`: the one that prints its argument and ends the line.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  
output: hello, causewaybay
```
'''
starter     = '''
package main

import "fmt"

func main() {
	// FILL: print the greeting, and end the line
	fmt.Print("")
}
'''
solution    = '''
package main

import "fmt"

func main() {
	// FILL: print the greeting, and end the line
	fmt.Println("hello, causewaybay")
}
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — the string in double quotes, lowercase, one comma.",
  "print without fmt writes to stderr, and Print without ln does not end the line.",
]

[quest.quiz]
choices = [
  "fmt.Println(hello, causewaybay)",
  "fmt.Println(\"hello, causewaybay\")",
  "print(\"hello, causewaybay\")",
  "fmt.Println(\"Hello, Causewaybay\")",
]
answer  = 1

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
  { name = "again", stdin = "", expect = "hello, causewaybay\n", visible = false },
  { name = "still", stdin = "", expect = "hello, causewaybay\n", visible = false },
]

