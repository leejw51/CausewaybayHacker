import sys
import torch
import torch.nn as nn


def main():
    data = sys.stdin.read().split()
    n, c, eps = int(data[0]), int(data[1]), float(data[2])
    x = torch.tensor([float(t) for t in data[3:3 + n * c]]).reshape(n, c)
    y = torch.tensor([int(t) for t in data[3 + n * c:3 + n * c + n]])
    logp = torch.log_softmax(x, dim=1)
    nll = -logp.gather(1, y.unsqueeze(1)).squeeze(1)
    smooth = -logp.mean(dim=1)
    mine = ((1.0 - eps) * nll + eps * smooth).mean()
    ref = nn.CrossEntropyLoss(label_smoothing=eps)(x, y)
    print(round(mine.item(), 5), bool(torch.allclose(mine, ref, atol=1e-5)))


main()
'''
