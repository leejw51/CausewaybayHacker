solution     = '''
import sys
import torch
import torch.nn as nn
import torch.nn.functional as F


def main():
    t, d, h, seed = (int(v) for v in sys.stdin.read().split()[:4])
    torch.manual_seed(seed)
    ln1, ln2 = nn.LayerNorm(d), nn.LayerNorm(d)
    qkv, proj = nn.Linear(d, 3 * d), nn.Linear(d, d)
    mlp = nn.Sequential(nn.Linear(d, 4 * d), nn.GELU(), nn.Linear(4 * d, d))

    def attend(x):
        q, k, v = qkv(ln1(x)).split(d, dim=-1)
        q = q.view(t, h, d // h).transpose(0, 1)
        k = k.view(t, h, d // h).transpose(0, 1)
        v = v.view(t, h, d // h).transpose(0, 1)
        att = (q @ k.transpose(-2, -1)) / (d // h) ** 0.5
        mask = torch.tril(torch.ones(t, t))
        att = att.masked_fill(mask == 0, float("-inf")).softmax(dim=-1)
        y = att @ v
        return y.transpose(0, 1).reshape(t, d)

    def block(x):
        x = x + proj(attend(x))
        x = x + mlp(ln2(x))
        return x

    x = torch.randn(t, d)
    with torch.no_grad():
        out = block(x)
        q, k, v = qkv(ln1(x)).split(d, dim=-1)
        q = q.view(t, h, d // h).transpose(0, 1)
        k = k.view(t, h, d // h).transpose(0, 1)
        v = v.view(t, h, d // h).transpose(0, 1)
        ref = F.scaled_dot_product_attention(q, k, v, is_causal=True)
        ref = ref.transpose(0, 1).reshape(t, d)
        poked = x.clone()
        poked[-1] += 100.0
        out2 = block(poked)
    print(tuple(out.shape),
          bool(torch.allclose(attend(x), ref, atol=1e-5)),
          bool(torch.allclose(out[:-1], out2[:-1], atol=1e-5)),
          bool(torch.isfinite(out).all()))


main()
'''
hints = [
  "attend: scale by sqrt(d // h) — the head dimension — then masked_fill with the lower-triangular mask, then softmax, then @ v.",
  "block is two residuals: x = x + proj(attend(x)) and then x = x + mlp(ln2(x)). Pre-norm means the LayerNorm is inside each branch, never on the residual itself.",
  "If the causality check fails, the mask is missing or applied after the softmax; if the reference check fails, the scale is d rather than d // h.",
]

