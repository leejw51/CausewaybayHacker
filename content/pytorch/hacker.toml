solution     = '''
import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, c, k = int(data[0]), int(data[1]), int(data[2])
    logits = torch.tensor([float(t) for t in data[3:3 + n * c]]).reshape(n, c)
    want = torch.tensor([int(t) for t in data[3 + n * c:3 + n * c + n]])
    idx = logits.topk(k, dim=1).indices
    top1 = (idx[:, 0] == want).float().mean().item()
    topk = (idx == want.unsqueeze(1)).any(dim=1).float().mean().item()
    print(round(top1, 4), round(topk, 4))


main()
'''
