import sys
import torch


def main():
    data = sys.stdin.read().split()
    steps, lr, mu, wd = int(data[0]), float(data[1]), float(data[2]), float(data[3])
    gs = [float(t) for t in data[4:4 + steps]]

    w, b = 1.0, 0.0
    for t, g in enumerate(gs):
        d = g + wd * w
        b = mu * b + d if t > 0 else d
        w = w - lr * b

    p = torch.tensor(1.0, requires_grad=True)
    opt = torch.optim.SGD([p], lr=lr, momentum=mu, weight_decay=wd)
    for g in gs:
        opt.zero_grad()
        p.grad = torch.tensor(g)
        opt.step()
    print(round(w, 6), round(p.item(), 6), abs(w - p.item()) < 1e-6)


main()
'''
