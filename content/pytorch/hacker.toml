import sys
import torch


def main():
    data = sys.stdin.read().split()
    t, d = int(data[0]), int(data[1])
    x = torch.tensor([float(u) for u in data[2:2 + t * d]]).reshape(t, d)
    scores = x @ x.t() / d ** 0.5
    mask = torch.tril(torch.ones(t, t))
    full = (torch.softmax(scores.masked_fill(mask == 0, float("-inf")), dim=-1) @ x)[-1]
    q = x[-1:]
    k_cache, v_cache = x, x
    cached = (torch.softmax(q @ k_cache.t() / d ** 0.5, dim=-1) @ v_cache)[0]
    print(bool(torch.allclose(full, cached, atol=1e-5)),
          " ".join(str(round(u, 4)) for u in cached.tolist()))


main()
