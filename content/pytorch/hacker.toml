solution     = '''
import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, thr = int(data[0]), float(data[1])
    b = torch.tensor([float(t) for t in data[2:2 + n * 5]]).reshape(n, 5)
    boxes, scores = b[:, :4], b[:, 4]
    area = (boxes[:, 2] - boxes[:, 0]) * (boxes[:, 3] - boxes[:, 1])
    order = scores.argsort(descending=True).tolist()
    keep = []
    while order:
        i = order.pop(0)
        keep.append(i)
        rest = []
        for j in order:
            lt = torch.maximum(boxes[i, :2], boxes[j, :2])
            rb = torch.minimum(boxes[i, 2:], boxes[j, 2:])
            wh = (rb - lt).clamp(min=0)
            inter = (wh[0] * wh[1]).item()
            iou = inter / (area[i].item() + area[j].item() - inter)
            if iou <= thr:
                rest.append(j)
        order = rest
    print(" ".join(str(i) for i in keep))


main()
'''
