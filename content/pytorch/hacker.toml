import sys
import torch
import torch.nn as nn


def main():
    data = sys.stdin.read().split()
    n, c, lam = int(data[0]), int(data[1]), float(data[2])
    p = 3 + n * c
    x = torch.tensor([float(v) for v in data[3:p]]).reshape(n, c)
    y = torch.tensor([int(v) for v in data[p:p + n]])
    perm = torch.tensor([int(v) for v in data[p + n:p + 2 * n]])
    ce = nn.CrossEntropyLoss()
    logp = torch.log_softmax(x, dim=1)
    hot = torch.zeros(n, c).scatter_(1, y.unsqueeze(1), 1.0)
    mixed_target = lam * hot + (1 - lam) * hot[perm]
    ref = -(mixed_target * logp).sum(dim=1).mean()
    loss = lam * ce(x, y) + (1 - lam) * ce(x, y[perm])
    print(round(loss.item(), 5), bool(torch.allclose(loss, ref, atol=1e-5)))


