solution     = '''
import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, m = int(data[0]), int(data[1])
    nums = [float(t) for t in data[2:2 + (n + m) * 4]]
    a = torch.tensor(nums[:n * 4]).reshape(n, 4)
    b = torch.tensor(nums[n * 4:]).reshape(m, 4)
    lt = torch.maximum(a[:, None, :2], b[None, :, :2])
    rb = torch.minimum(a[:, None, 2:], b[None, :, 2:])
    wh = (rb - lt).clamp(min=0)
    inter = wh[..., 0] * wh[..., 1]
    area_a = (a[:, 2] - a[:, 0]) * (a[:, 3] - a[:, 1])
    area_b = (b[:, 2] - b[:, 0]) * (b[:, 3] - b[:, 1])
    iou = inter / (area_a[:, None] + area_b[None, :] - inter)
    for row in iou.tolist():
        print(" ".join(str(round(v, 4)) for v in row))


main()
'''
