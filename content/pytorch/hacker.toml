import sys
import torch


def main():
    data = sys.stdin.read().split()
    steps, lr = int(data[0]), float(data[1])
    gs = [float(t) for t in data[2:2 + steps]]

    w, m, v = 0.0, 0.0, 0.0
    b1, b2, eps = 0.9, 0.999, 1e-8
    for t, g in enumerate(gs, start=1):
        m = b1 * m + (1 - b1) * g
        v = b2 * v + (1 - b2) * g * g
        mh = m / (1 - b1 ** t)
        vh = v / (1 - b2 ** t)
        w = w - lr * mh / (vh ** 0.5 + eps)

    p = torch.tensor(0.0, requires_grad=True)
    opt = torch.optim.Adam([p], lr=lr, betas=(b1, b2), eps=eps)
    for g in gs:
        opt.zero_grad()
        p.grad = torch.tensor(g)
        opt.step()
    print(round(w, 6), round(p.item(), 6), abs(w - p.item()) < 1e-6)


main()
