import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, p, seed = int(data[0]), float(data[1]), int(data[2])
    g = torch.Generator().manual_seed(seed)
    x = torch.ones(n)
    keep = (torch.rand(n, generator=g) >= p).float()
    out = x * keep / (1.0 - p)
    print(round(keep.mean().item(), 1), round(out.mean().item(), 1),
          abs(out.mean().item() - 1.0) < 0.05)


main()
