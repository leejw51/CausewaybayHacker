solution     = '''
import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, k, d = int(data[0]), int(data[1]), int(data[2])
    nums = [float(t) for t in data[3:3 + (n + k) * d]]
    x = torch.tensor(nums[:n * d]).reshape(n, d)
    c = torch.tensor(nums[n * d:]).reshape(k, d)
    dist = (x.unsqueeze(1) - c.unsqueeze(0)).pow(2).sum(dim=-1)
    assign = dist.argmin(dim=1)
    new_c = c.clone()
    for j in range(k):
        mask = assign == j
        if mask.any():
            new_c[j] = x[mask].mean(dim=0)
    print(" ".join(str(v) for v in assign.tolist()))
    for row in new_c.tolist():
        print(" ".join(str(round(v, 4)) for v in row))


main()
'''
hints = [
  "(x.unsqueeze(1) - c.unsqueeze(0)) is (n, k, d); square, sum the last axis, argmin over k.",
  "An empty cluster has no mean — guard it, or the centroid becomes nan and never recovers.",
]

