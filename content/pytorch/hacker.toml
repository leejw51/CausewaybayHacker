solution     = '''
import sys
import torch
import torch.nn as nn


def main():
    data = sys.stdin.read().split()
    n, c = int(data[0]), int(data[1])
    x = torch.tensor([float(t) for t in data[2:2 + n * c]]).reshape(n, c)
    y = torch.tensor([int(t) for t in data[2 + n * c:2 + n * c + n]])
    logp = torch.log_softmax(x, dim=1)
    mine = -logp.gather(1, y.unsqueeze(1)).squeeze(1).mean()
    ref = nn.CrossEntropyLoss()(x, y)
    print(round(mine.item(), 5), bool(torch.allclose(mine, ref, atol=1e-5)))


main()
'''
hints = [
  "log_softmax first, then gather the true class, then negate and take the mean.",
  "The default reduction is the mean over the batch, not the sum — that is the other half of matching the library.",
]

