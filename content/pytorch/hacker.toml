solution     = '''
import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, m, d = int(data[0]), int(data[1]), int(data[2])
    nums = [float(t) for t in data[3:3 + (n + m) * d]]
    q = torch.tensor(nums[:n * d]).reshape(n, d)
    k = torch.tensor(nums[n * d:]).reshape(m, d)
    qn = q / q.norm(dim=1, keepdim=True)
    kn = k / k.norm(dim=1, keepdim=True)
    sim = qn @ kn.t()
    for row in sim.tolist():
        print(" ".join(str(round(v, 4)) for v in row))


main()
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) — keepdim is what makes the division broadcast down the rows.",
  "Then one matmul: qn @ kn.t(). A zero vector would divide by zero, which is what the eps in F.normalize is for.",
]

