# PYTORCH LAND — HACKER. The fifth interview. HKU, Chow Yei Ching Building,
# Room 7-32, a clock on the wall, and the subject is the rack in the basement
# two floors down.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
# See docs/decisions.md, 2026-09-11, for where that key lives in the TOML.
#
# The other four hacker packs mirror each other node for node, because the
# same algorithm question can be sat in any of those four languages. This one
# does not mirror them and is not meant to: it is the live-coding knowledge
# base for a machine-learning role — write softmax so it does not overflow,
# write cross-entropy so it matches the library, write Adam so it matches the
# library, mask a padded batch, cache the keys and values, and build a
# transformer block that agrees with a reference implementation to 1e-5.
# Every answer is a tensor program, and a Python loop over the batch is the
# thing these questions exist to weed out.
#
# Nothing is downloaded and nothing is random unless it is seeded. Every
# expected output is a shape, a count, a flag or a rounded number.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

