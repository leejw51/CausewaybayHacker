import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, bs = int(data[0]), int(data[1])
    x = torch.tensor([float(v) for v in data[2:2 + n]])
    count, total, sq = 0, 0.0, 0.0
    for i in range(0, n, bs):
        chunk = x[i:i + bs]
        count += chunk.numel()
        total += chunk.sum().item()
        sq += chunk.pow(2).sum().item()
    mean = total / count
    var = sq / count - mean * mean
    ok = (abs(mean - x.mean().item()) < 1e-4
          and abs(var - x.var(unbiased=False).item()) < 1e-4)
    print(round(mean, 5), round(var, 5), ok)


main()
'''
