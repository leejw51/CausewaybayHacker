Print the `n × m` cosine similarity matrix, rounded to four places, one row per line.

Cosine similarity is the dot product of the **normalised** vectors. Normalising first and then multiplying is the answer that stays one matmul; dividing afterwards needs an outer product of norms and is where people lose the thread.

```
