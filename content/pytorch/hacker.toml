import sys
import torch


def main():
    data = sys.stdin.read().split()
    steps, v, beam = int(data[0]), int(data[1]), int(data[2])
    lp = torch.tensor([float(t) for t in data[3:3 + steps * v]]).reshape(steps, v)
    live = [([], 0.0)]
    for s in range(steps):
        cand = []
        for seq, score in live:
            for tok in range(v):
                cand.append((seq + [tok], score + lp[s, tok].item()))
        cand.sort(key=lambda p: -p[1])
        live = cand[:beam]
    best = live[0]
    print(" ".join(str(t) for t in best[0]))
    print(round(best[1], 4))


main()
