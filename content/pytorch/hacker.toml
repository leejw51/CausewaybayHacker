import sys
import torch


def main():
    data = sys.stdin.read().split()
    t, d, ln = int(data[0]), int(data[1]), int(data[2])
    x = torch.tensor([float(v) for v in data[3:3 + t * d]]).reshape(t, d)
    scores = x @ x.t() / d ** 0.5
    keep = torch.arange(t) < ln
    scores = scores.masked_fill(~keep.unsqueeze(0), float("-inf"))
    att = torch.softmax(scores, dim=-1)
    print(" ".join(str(round(v, 4)) for v in att[0].tolist()),
          bool(torch.allclose(att.sum(dim=-1), torch.ones(t), atol=1e-5)))


main()
'''
