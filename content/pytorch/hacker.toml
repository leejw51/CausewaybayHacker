import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, gamma = int(data[0]), float(data[1])
    x = torch.tensor([float(t) for t in data[2:2 + n]])
    y = torch.tensor([float(t) for t in data[2 + n:2 + 2 * n]])
    p = torch.sigmoid(x)
    pt = torch.where(y > 0.5, p, 1.0 - p)
    focal = (-(1.0 - pt) ** gamma * torch.log(pt)).mean()
    bce = (-torch.log(pt)).mean()
    print(f"{focal.item():.5f} {bce.item():.5f}")


main()
