import sys
import torch


def main():
    data = sys.stdin.read().split()
    n, t = int(data[0]), int(data[1])
    cache = torch.tensor([float(v) for v in data[2:2 + n * t]]).reshape(n, t)
    parents = torch.tensor([int(v) for v in data[2 + n * t:2 + n * t + n]])
