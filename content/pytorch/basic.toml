brief       = '''
A linear layer is a matrix multiply and a bias add, and nothing else. For a batch `x` of shape `(batch, in)` and a weight `W` of shape `(out, in)` — the shape torch stores it in — the output is `x @ W.t() + b`.

`W.t()` is `(in, out)`, so the inner dimensions agree, and `b` of shape `(out,)` broadcasts across the batch.

Write it out and print the shape and the rounded result.

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
starter     = '''
