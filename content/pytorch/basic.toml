    for _ in range(200):
        loss = loss_fn(model(x_tr), y_tr)
        opt.zero_grad()
        loss.backward()
        opt.step()
    model.eval()
    with torch.no_grad():
        acc = (model(x_te).argmax(dim=1) == y_te).float().mean().item()
    print(tuple(x_tr.shape), tuple(x_te.shape), round(acc, 4))


main()
