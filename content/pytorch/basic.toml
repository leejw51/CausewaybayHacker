brief       = '''
One line of whitespace-separated numbers arrives on standard input. Turn it into a **float** tensor and print its shape as a tuple and its total.

`input().split()` gives a list of strings; `float(t)` converts one. A list comprehension over the two of them is the whole conversion, and `torch.tensor` takes the list.

The total is printed with `.item()`, which pulls the Python number out of a 0-dimensional tensor, rounded to four places so a repeating decimal cannot disagree with itself.

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
starter     = '''
import torch


def main():
    x = None  # your code here
    # ANSWER: x = torch.tensor([float(t) for t in input().split()])
    print(tuple(x.shape), round(x.sum().item(), 4))


main()
'''
solution    = '''
import torch


def main():
    x = torch.tensor([float(t) for t in input().split()])
    print(tuple(x.shape), round(x.sum().item(), 4))


main()
'''
