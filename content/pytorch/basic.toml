def main():
    x = torch.tensor([[1.0, 0.0], [1.0, 2.0]])
    W = torch.tensor([[1.0, 1.0], [2.0, 2.0]])
    b = torch.tensor([0.0, 0.0])
    out = None  # your code here
    # ANSWER: out = x @ W.t() + b
    print(tuple(out.shape), [[round(v, 4) for v in row] for row in out.tolist()])


main()
'''
solution    = '''
import torch


def main():
    x = torch.tensor([[1.0, 0.0], [1.0, 2.0]])
    W = torch.tensor([[1.0, 1.0], [2.0, 2.0]])
    b = torch.tensor([0.0, 0.0])
    out = x @ W.t() + b
    print(tuple(out.shape), [[round(v, 4) for v in row] for row in out.tolist()])


main()
'''
