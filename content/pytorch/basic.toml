    print([round(v, 4) for v in z.mean(dim=0).tolist()],
          [round(v, 4) for v in z.std(dim=0).tolist()])


main()
'''
solution    = '''
import torch


def main():
    x = torch.tensor([float(t) for t in input().split()]).reshape(-1, 2)
    z = (x - x.mean(dim=0)) / x.std(dim=0)
    print([round(v, 4) for v in z.mean(dim=0).tolist()],
          [round(v, 4) for v in z.std(dim=0).tolist()])


main()
