# PYTORCH LAND — BASIC. The grammar road: the teaching cluster in the
# basement of the Chow Yei Ching Building, from the night shift's first
# tensor to a network that learns XOR. This is grammar practice, not a quiz:
# the brief explains one thing and shows how it is written, the starter is
# the whole program, and the player types the one to four lines that use it —
# a tensor off stdin, a reshape, a normalisation, a layer written out by
# hand, relu, sigmoid, softmax, argmax, one-hot, accuracy, a loss, a
# gradient, zero_grad, a step by hand, an optimiser, a fitted line,
# Sequential, a Module of one's own, the loop, eval, a state dict, batching,
# a DataLoader, a held-out split, and the hidden layer for the boss. Nothing
# here is timed, and verify_pack refuses a basic solution that adds more than
# four lines over its starter.
#
# Every program is one main.py, run as `python3 -I main.py`, torch only —
# no torchvision, no network, no downloads. Every model is seeded, and every
# expected output is a shape, a count, a flag or a rounded number, because a
# raw float from a training run is not the same on two machines.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "pytorch.basic"
land = "pytorch"
category = "basic"
