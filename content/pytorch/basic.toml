import torch
import torch.nn as nn


def main():
    torch.manual_seed(0)
    x = torch.cat([torch.randn(20, 2) - 3, torch.randn(20, 2) + 3])
    y = torch.cat([torch.zeros(20, dtype=torch.long), torch.ones(20, dtype=torch.long)])
    perm = torch.randperm(40)
    x, y = x[perm], y[perm]
    x_tr, y_tr = x[:30], y[:30]
