# PYTORCH LAND — CHEATSHEET. The lines a machine-learning live coding test
# expects from memory, asked: a tensor, its dtype and device, its shape, a
# broadcast, a gradient, the optimiser's order, a module, a loss, a loader —
# four lines, one right. Nothing is typed and nothing is run — the pick is the
# submission, and the server judges it against the quiz (SPEC §0). The three
# wrong lines are near-misses: NumPy's spelling, the wrong `dim`, a call whose
# result is thrown away, a method that does not exist.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "pytorch.cheatsheet"
