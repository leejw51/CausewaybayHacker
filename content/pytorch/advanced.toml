    print(tuple(plain.shape), tuple(kept.shape),
          [round(v, 4) for v in shifted.max(dim=1).values.tolist()])


main()
'''
solution    = '''
import torch


def main():
    x = torch.tensor([[1.0, 5.0, 3.0], [9.0, 2.0, 4.0]])
    plain = x.max(dim=1).values
    kept = x.max(dim=1, keepdim=True).values
    shifted = x - kept
    print(tuple(plain.shape), tuple(kept.shape),
          [round(v, 4) for v in shifted.max(dim=1).values.tolist()])


main()
'''
