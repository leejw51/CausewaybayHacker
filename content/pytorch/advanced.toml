id          = "pytorch.advanced.10.retain-graph"
node        = 10
title       = "TRYING TO BACKWARD TWICE"
difficulty  = 3
story       = "Two losses on one forward pass, and the second backward raises about the buffers having already been freed."
concepts    = ["autograd", "optimizers"]
requires    = ["pytorch.advanced.09.stop-gradient"]
map          = { x = 0.671, y = 0.280, kind = "quest" }
brief       = '''
`backward()` frees the graph as it walks it. A second `backward()` over the same forward pass therefore raises — the buffers are gone — and `retain_graph=True` is what keeps them.

The honest fix is usually to add the losses and call `backward()` once; `retain_graph` is for when you genuinely need two separate passes, and it costs memory.

Run the second pass with the graph retained and print the accumulated gradient: `d(w²)/dw + d(3w)/dw` at `w = 2` is `4 + 3`.

```
output: caught 7.0
```
'''
starter     = '''
import torch


def main():
    w = torch.tensor(2.0, requires_grad=True)
    a = w * w
    a.backward()
    try:
        a.backward()
        note = "no error"
    except RuntimeError:
        note = "caught"

    w.grad = None
    v = torch.tensor(2.0, requires_grad=True)
    first = v * v
    second = 3 * v
    pass
    second.backward()
    print(note, round(v.grad.item(), 4))


main()
'''
solution    = '''
import torch


def main():
    w = torch.tensor(2.0, requires_grad=True)
    a = w * w
    a.backward()
    try:
        a.backward()
        note = "no error"
    except RuntimeError:
        note = "caught"

    w.grad = None
    v = torch.tensor(2.0, requires_grad=True)
    first = v * v
    second = 3 * v
    first.backward(retain_graph=True)
    second.backward()
    print(note, round(v.grad.item(), 4))


main()
'''
