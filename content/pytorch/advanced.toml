id          = "pytorch.advanced.08.batched-matmul"
node        = 8
title       = "ONE MULTIPLY PER HEAD"
difficulty  = 3
story       = "Four attention heads, and the code loops over them in Python. The profiler says the loop is the model."
concepts    = ["tensors", "attention"]
requires    = ["pytorch.advanced.07.keepdim"]
map          = { x = 0.953, y = 0.263, kind = "quest" }
brief       = '''
`@` on tensors with more than two dimensions is a **batched** matmul: the last two axes are the matrix, everything in front is batch, and the batch axes broadcast.

`(B, H, T, d) @ (B, H, d, T)` gives `(B, H, T, T)` — which is exactly the attention score tensor, every head of every sequence at once, with no loop.

Build it and print the shape and whether it matches the looped answer.

```
output: (2, 4, 5, 5) True
```
'''
starter     = '''
import torch


def main():
    torch.manual_seed(0)
    q = torch.randn(2, 4, 5, 8)
    k = torch.randn(2, 4, 5, 8)
    att = None
    loop = torch.stack([torch.stack([q[b, h] @ k[b, h].t() for h in range(4)])
                        for b in range(2)])
    print(tuple(att.shape), torch.allclose(att, loop, atol=1e-5))


main()
'''
solution    = '''
import torch


def main():
    torch.manual_seed(0)
    q = torch.randn(2, 4, 5, 8)
    k = torch.randn(2, 4, 5, 8)
    att = q @ k.transpose(-2, -1)
    loop = torch.stack([torch.stack([q[b, h] @ k[b, h].t() for h in range(4)])
                        for b in range(2)])
    print(tuple(att.shape), torch.allclose(att, loop, atol=1e-5))


main()
'''
hints = [
  "q @ k.transpose(-2, -1) — negative axes, so the same line works whatever the batch rank is.",
  "k.t() only works on a 2-D tensor and raises on a 4-D one.",
]

