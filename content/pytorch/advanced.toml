[[quest]]
id          = "pytorch.advanced.01.view-contiguous"
node        = 1
title       = "THE VIEW THAT REFUSED"
difficulty  = 3
story       = "The batch is transposed on the way in and the flatten that has worked for a year raises about contiguity."
concepts    = ["tensors", "broadcasting"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
`view` demands that the tensor's memory already be laid out the way the new shape needs. A transpose does not move any memory — it only changes the strides — so `view` on a transposed tensor raises `RuntimeError`, and it is one of the two or three errors a PyTorch interview always asks about.

`reshape` copies when it has to and works either way. `contiguous()` does the copy explicitly, which makes `view` legal again.

Print `view` failing on the transposed tensor, and then both ways of getting the flatten anyway.

```
output: RuntimeError True True
```
'''
starter     = '''
import torch


def main():
    x = torch.arange(6).reshape(2, 3).t()
    try:
        x.view(6)
        why = "ok"
    except RuntimeError:
        why = "RuntimeError"
    a = None
    b = None
    print(why, a.tolist() == [0, 3, 1, 4, 2, 5], b.tolist() == [0, 3, 1, 4, 2, 5])


main()
'''
solution    = '''
import torch


def main():
    x = torch.arange(6).reshape(2, 3).t()
    try:
        x.view(6)
        why = "ok"
    except RuntimeError:
        why = "RuntimeError"
    a = x.reshape(6)
    b = x.contiguous().view(6)
    print(why, a.tolist() == [0, 3, 1, 4, 2, 5], b.tolist() == [0, 3, 1, 4, 2, 5])


main()
'''
hints = [
  "x.reshape(6) copies if it must; x.contiguous().view(6) does the copy first and then views.",
  "A transpose changes strides, not memory — which is exactly what view cannot tolerate.",
]

