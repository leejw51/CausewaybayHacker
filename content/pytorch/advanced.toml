  "The scores are (q @ k.transpose(-2, -1)) / (D // H) ** 0.5 — the scale is the head dimension, not the model dimension.",
  "Then att.masked_fill(mask == 0, float(\"-inf\")).softmax(dim=-1), in that order.",
  "Greedy generation reads the last position only: model(torch.tensor([out]))[0, -1].argmax().item().",
]

