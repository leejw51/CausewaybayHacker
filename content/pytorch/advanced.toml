[[quest]]
id          = "pytorch.advanced.03.detach-clone"
node        = 3
title       = "A COPY, AND A CUT"
difficulty  = 3
story       = "The logging code kept the loss tensor instead of its number, and four hours of graphs are still in memory at 04:00."
concepts    = ["autograd", "tensors"]
requires    = ["pytorch.advanced.02.in-place"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
`clone()` copies the data and **stays in the graph** — gradients flow through it. `detach()` shares the data and **leaves the graph** — nothing flows back. They are not alternatives; they answer different questions.

`x.detach().clone()` is the one you want for a snapshot: new memory, no graph.

Print, for each of the three, whether it requires grad and whether it shares storage with the original.

```
output: clone True False detach False True snapshot False False
```
'''
starter     = '''
import torch


def main():
    x = (torch.ones(3, requires_grad=True) * 2)
    a = None
    b = None
    c = None
    def shares(t):
        return t.data_ptr() == x.data_ptr()
    print("clone", a.requires_grad, shares(a),
          "detach", b.requires_grad, shares(b),
          "snapshot", c.requires_grad, shares(c))


main()
'''
solution    = '''
import torch


def main():
    x = (torch.ones(3, requires_grad=True) * 2)
    a = x.clone()
    b = x.detach()
    c = x.detach().clone()
    def shares(t):
        return t.data_ptr() == x.data_ptr()
    print("clone", a.requires_grad, shares(a),
          "detach", b.requires_grad, shares(b),
          "snapshot", c.requires_grad, shares(c))


main()
'''
hints = [
  "x.clone(), x.detach(), x.detach().clone() — in that order.",
  "detach shares the same memory, so writing to it writes to the original too.",
]

