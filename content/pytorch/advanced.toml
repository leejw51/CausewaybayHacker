import torch
import torch.nn as nn


def main():
    w = torch.tensor([0.0, 0.0], requires_grad=True)
    loss = (w * torch.tensor([3.0, 4.0])).sum()
    loss.backward()
    seen = nn.utils.clip_grad_norm_([w], max_norm=1.0)
    after = w.grad.norm().item()
    print(round(seen.item(), 4), round(after, 4),
          [round(v, 4) for v in w.grad.tolist()])


main()
'''
