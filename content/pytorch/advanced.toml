[[quest]]
id          = "pytorch.advanced.02.in-place"
node        = 2
title       = "THE UNDERSCORE"
difficulty  = 3
story       = "Someone saved memory by adding an underscore, and the backward pass now raises about a variable needed for the gradient having been modified."
concepts    = ["autograd", "tensors"]
requires    = ["pytorch.advanced.01.view-contiguous"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
A trailing underscore means *in place*: `relu_`, `add_`, `mul_`. In-place saves an allocation and destroys the value the backward pass was going to need, and autograd catches it — at `backward()` time, far from the line that caused it.

Do the same arithmetic out of place so the backward pass survives, and print the gradient.

`y = w * 2`, then `y = y + 1`, then `loss = y.sum()`: the gradient of the loss with respect to `w` is `2` for every element.

```
output: [2.0, 2.0, 2.0] caught
```
'''
starter     = '''
import torch


def main():
    w = torch.ones(3, requires_grad=True)
    y = w * 2
    y = None
    y.sum().backward()

    v = torch.ones(3, requires_grad=True)
    z = v.sigmoid()
    try:
        z.add_(1)
        z.sum().backward()
        note = "no error"
    except RuntimeError:
        note = "caught"
    print(w.grad.tolist(), note)


main()
'''
solution    = '''
import torch


def main():
    w = torch.ones(3, requires_grad=True)
    y = w * 2
    y = y + 1
    y.sum().backward()

    v = torch.ones(3, requires_grad=True)
    z = v.sigmoid()
    try:
        z.add_(1)
        z.sum().backward()
        note = "no error"
    except RuntimeError:
        note = "caught"
    print(w.grad.tolist(), note)


main()
'''
hints = [
  "y = y + 1 rebinds the name to a new tensor; y += 1 would modify in place and break the graph.",
  "Adding a constant does not change the gradient — d(2w + 1)/dw is still 2.",
]

