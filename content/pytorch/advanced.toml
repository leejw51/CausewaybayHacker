# PYTORCH LAND — ADVANCED. The road where the shapes stop being polite: the
# teaching cluster under the Chow Yei Ching Building, the fan wall, the cold
# aisle, and the rack that is the thing itself. Views and contiguity,
# in-place ops against autograd, detach, gather, masked_fill, keepdim,
# batched matmuls, stop-gradients, retain_graph, frozen parameters, clipping,
# a custom autograd.Function, log-sum-exp stability, initialisation,
# BatchNorm's two modes, LayerNorm by hand, schedulers, weight decay,
# momentum, early stopping, checkpoint resume, seeding, class weights — then
# MNIST, in the shape MNIST really is, and then GPT-2, built out of its own
# parts, ending in a model that completes a sequence it was taught.
#
# Nothing here is downloaded. There is no network in the runner (SPEC §1)
# and there is no torchvision, so the digits are generated and the corpus is
# eight tokens long. Every expected output is a shape, a count, a flag or a
# rounded number, and every model is seeded.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
