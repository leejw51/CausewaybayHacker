A reduction removes the axis it reduced. `x.max(dim=1).values` on a `(2, 3)` gives a `(2,)`, and subtracting that from the `(2, 3)` broadcasts along the **wrong** axis — it lines the 2 up against the 3's place and, when the numbers happen to match, silently computes nonsense.

