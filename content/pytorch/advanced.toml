solution    = '''
import torch
import torch.nn as nn
import copy


def step(model, opt):
    loss = model(torch.ones(1, 2)).sum()
    opt.zero_grad()
    loss.backward()
    opt.step()


def main():
    torch.manual_seed(0)
    model = nn.Linear(2, 1)
    opt = torch.optim.Adam(model.parameters(), lr=0.1)
    step(model, opt)
    ckpt = {"model": copy.deepcopy(model.state_dict()),
            "opt": copy.deepcopy(opt.state_dict())}

    uninterrupted = copy.deepcopy(model)
    uninterrupted_opt = torch.optim.Adam(uninterrupted.parameters(), lr=0.1)
    uninterrupted_opt.load_state_dict(copy.deepcopy(opt.state_dict()))
    step(uninterrupted, uninterrupted_opt)

    resumed = nn.Linear(2, 1)
    resumed_opt = torch.optim.Adam(resumed.parameters(), lr=0.1)
    resumed.load_state_dict(ckpt["model"])
    resumed_opt.load_state_dict(ckpt["opt"])
    step(resumed, resumed_opt)
    print(torch.allclose(resumed.weight, uninterrupted.weight, atol=1e-6),
          torch.allclose(resumed.bias, uninterrupted.bias, atol=1e-6))


main()
