solution    = '''
import torch
import torch.nn as nn

V, D, H, T = 16, 32, 4, 8


class GPT(nn.Module):
    def __init__(self):
        super().__init__()
        self.tok = nn.Embedding(V, D)
        self.pos = nn.Embedding(T, D)
        self.ln1 = nn.LayerNorm(D)
        self.ln2 = nn.LayerNorm(D)
        self.attn = nn.Linear(D, 3 * D)
        self.proj = nn.Linear(D, D)
        self.mlp = nn.Sequential(nn.Linear(D, 4 * D), nn.GELU(), nn.Linear(4 * D, D))
        self.head = nn.Linear(D, V)

    def forward(self, idx):
        B, t = idx.shape
        x = self.tok(idx) + self.pos(torch.arange(t))
        q, k, v = self.attn(self.ln1(x)).split(D, dim=2)
        q = q.view(B, t, H, D // H).transpose(1, 2)
        k = k.view(B, t, H, D // H).transpose(1, 2)
        v = v.view(B, t, H, D // H).transpose(1, 2)
        att = (q @ k.transpose(-2, -1)) / (D // H) ** 0.5
        mask = torch.tril(torch.ones(t, t)).view(1, 1, t, t)
        att = att.masked_fill(mask == 0, float("-inf")).softmax(dim=-1)
        y = (att @ v).transpose(1, 2).reshape(B, t, D)
        x = x + self.proj(y)
        x = x + self.mlp(self.ln2(x))
        return self.head(x)


def main():
    torch.manual_seed(0)
    seq = torch.tensor([[1, 2, 3, 4, 5, 6, 7, 8]])
    model = GPT()
    opt = torch.optim.Adam(model.parameters(), lr=0.01)
    loss_fn = nn.CrossEntropyLoss()
    for _ in range(300):
        logits = model(seq[:, :-1])
        loss = loss_fn(logits.reshape(-1, V), seq[:, 1:].reshape(-1))
        opt.zero_grad()
        loss.backward()
        opt.step()
    model.eval()
    out = [1, 2]
    with torch.no_grad():
        for _ in range(6):
            out.append(model(torch.tensor([out]))[0, -1].argmax().item())
    print(sum(p.numel() for p in model.parameters()), out, loss.item() < 0.01)


main()
'''
