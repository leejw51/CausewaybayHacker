# PYTORCH LAND — VERY BASIC. The grammar of a tensor asked as a question
# first: four lines, one of them right, and then that line typed. A shape, a
# dtype, an index, a broadcast, a matmul, a gradient, a layer, a loss, a step
# — the constructs a live coding test on a machine-learning team leans on,
# one per node, in the basement of the Chow Yei Ching Building from the
# 23:00 cold aisle to the first optimiser step. Every quest carries a
# [quest.quiz]: the choices are code and never translated; the question is
# the brief. verify_pack swaps each wrong choice into the solution and
# refuses the quest if it passes, so the quiz has one right answer.
#
# Every program is one main.py, run as `python3 -I main.py`, torch only —
# no torchvision, no network, no downloads. MNIST and GPT-2 appear on the
# later roads as the shapes they really are, generated in the program.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "pytorch.verybasic"
land = "pytorch"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "pytorch.verybasic.01.first-tensor"
node        = 1
title       = "THE FIRST TENSOR"
difficulty  = 1
story       = "23:00 in the machine room under the Chow Yei Ching Building. The console is open, torch is imported, and nothing has been made yet."
concepts    = ["tensors", "io"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
A tensor is the one value this land is built out of. `torch.tensor` builds one from a Python list, keeping the order it was given.

Pick the line that builds the tensor `1 2 3`, then type it where the `# FILL` comment is.

```
output: [1, 2, 3]
```
'''
starter     = '''
import torch


def main():
    x = None  # FILL: a tensor of 1, 2, 3
    print(x.tolist())


main()
'''
solution    = '''
import torch


def main():
    x = torch.tensor([1, 2, 3])
    print(x.tolist())


main()
'''
hints = [
  "torch.tensor takes one argument — the list — not three numbers.",
  "The order of the list is the order of the tensor; nothing is sorted for you.",
]

