# PYTORCH LAND — CHEATSHEET ADVANCED. The lines that tell a fluent PyTorch
# candidate from one who knows the basics, asked the same way: four lines,
# one right, nothing typed and nothing run — the pick is the submission and
# the server judges it against the quiz (SPEC §0). The questions are the
# ones an interviewer reaches for after the warm-up: the functional gradient
# API, in-place writes on a leaf, what registers with a module and what does
# not, the shapes each loss insists on, decoupled weight decay, the scaler's
# three calls, loading a CUDA checkpoint on a laptop, samplers on a multi-GPU
# box, strides that break `view`, splitting `qkv`, gathering a log-prob,
# the two spellings of a causal mask, einsum, activation checkpointing, and
# the one attention module whose boolean mask means the opposite. The three
# wrong lines are near-misses: a keyword that does not exist, the method
# that works on a tensor but not on a module, the call that runs and gives
# the wrong shape, the tuple nobody unpacked.
#
# Checked against torch 2.14.1 (CPU). The answer is never in the brief.
# `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "pytorch.cheatsheet_advanced"
land     = "pytorch"
category = "cheatsheet_advanced"
