id          = "pytorch.cheatsheet_advanced.23.permute-contiguous"
node        = 23
title       = "STRIDES DO NOT LIE"
difficulty  = 4
story       = "Channels-first off the rack, time-first into the head. The view refuses until the memory is laid out the way the shape says."
concepts    = ["tensors", "matrix"]
requires    = ["pytorch.cheatsheet_advanced.22.expand"]
map         = { x = 0.24, y = 0.72, kind = "quest" }
brief       = '''
`x` has shape `(B, C, T)` and is contiguous. Make `y` of shape
`(B, T*C)` in which, within each row, **time runs slowest** — all `C`
channels of step 0, then all `C` of step 1, and so on — using `view`.
'''
solution    = 'y = x.permute(0, 2, 1).contiguous().view(B, -1)'
hints = [
  "After a permute the strides no longer match memory and `view` refuses; a copy into fresh memory first makes the view legal. A view straight off `x` keeps channels slowest, and the row count must be `B`.",
]

[quest.quiz]
choices = [
  'y = x.permute(0, 2, 1).view(B, -1)',
  'y = x.permute(0, 2, 1).contiguous().view(B, -1)',
  'y = x.view(B, -1)',
  'y = x.permute(0, 2, 1).contiguous().view(-1, B)',
]
answer  = 1

