  'h = checkpoint(block(h), use_reentrant=False)',
  'h = checkpoint(block, h, use_reentrant=False)',
  'h = torch.utils.checkpoint(block, h)',
  'h = checkpoint(block, use_reentrant=False)(h)',
]
answer  = 1

