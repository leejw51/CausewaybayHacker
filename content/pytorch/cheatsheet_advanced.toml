[[quest]]
id          = "pytorch.cheatsheet_advanced.05.modulelist"
node        = 5
title       = "ON THE REGISTER"
difficulty  = 3
story       = "A tower of identical floors above Jardine's Bazaar. The landlord only collects rent from floors on the register."
