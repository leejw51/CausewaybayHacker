    # ____
```

Fill the blank so the learning-rate schedule **advances once per epoch**.
'''
solution    = 'sched.step()'
hints = [
  "The scheduler has a step of its own, called after the optimiser's — here once per epoch. Reading the current rate advances nothing, and the optimiser does not own the scheduler.",
]

[quest.quiz]
choices = [
  'opt.step()',
  'sched.step()',
  'sched.get_last_lr()',
  'opt.sched.step()',
]
