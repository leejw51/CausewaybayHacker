id          = "pytorch.cheatsheet_advanced.22.expand"
node        = 22
title       = "SAME MEMORY, MORE ROWS"
difficulty  = 4
story       = "One positional table for every row in the batch. Copying it per row would fill the card for nothing."
concepts    = ["broadcasting", "tensors", "embeddings"]
requires    = ["pytorch.cheatsheet_advanced.21.compile"]
map         = { x = 0.44, y = 0.67, kind = "quest" }
brief       = '''
`pos` is a positional table of shape `(T, D)` and `x` has shape
`(B, T, D)`. Make `pe` of shape `(B, T, D)` that **shares memory** with
`pos` — a view, no copy — so that `x + pe` adds the same table to every
row.
'''
solution    = 'pe = pos.unsqueeze(0).expand(B, -1, -1)'
hints = [
  "One method materialises copies, the other strides over the same memory. `-1` means keep that size, and only the striding one accepts it; the copying one wants a positive count on every axis.",
]

[quest.quiz]
choices = [
  'pe = pos.unsqueeze(0).repeat(B, -1, -1)',
  'pe = pos.unsqueeze(0).repeat(B, 1, 1)',
  'pe = pos.unsqueeze(0).expand(B, -1, -1)',
  'pe = pos.expand(B)',
]
answer  = 2

