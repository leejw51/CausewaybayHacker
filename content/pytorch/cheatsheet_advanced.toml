```
from torch.utils.checkpoint import checkpoint

def forward(self, h):
    for block in self.blocks:
        # ____
    return h
```

Fill the blank so each block's activations are **not stored** in the
forward pass but recomputed during backward — the **non-reentrant**
variant.
'''
solution    = 'h = checkpoint(block, h, use_reentrant=False)'
hints = [
  "The checkpoint function takes the callable and its inputs as separate arguments and calls it for you. Passing the block's output means the forward already ran, and the module is not callable.",
]

