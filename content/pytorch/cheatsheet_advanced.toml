[[quest]]
id          = "pytorch.cheatsheet_advanced.01.autograd-grad"
node        = 1
title       = "THE SLOPE, WITHOUT THE PAPERWORK"
difficulty  = 3
story       = "Back in the basement of the Chow Yei Ching Building. The console on the trolley wants a derivative, not a side effect."
concepts    = ["autograd", "tensors"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
```
x = torch.tensor([1.0, 2.0], requires_grad=True)
y = (x ** 3).sum()
```

Make `g` the gradient dy/dx as a **tensor** of shape `(2,)` — and
`x.grad` must still be `None` afterwards.
'''
solution    = 'g, = torch.autograd.grad(y, x)'
hints = [
  "The functional API returns one gradient per input, packed in a tuple, so unpack it; the method on `y` writes into `.grad` instead of returning anything.",
]

[quest.quiz]
choices = [
  'g = torch.autograd.grad(y, x)',
  'y.backward(); g = x.grad',
  'g, = torch.autograd.grad(y, x)',
  'g = torch.autograd.grad(x, y)',
]
answer  = 2

