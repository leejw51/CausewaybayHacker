[[quest]]
id          = "pytorch.cheatsheet_advanced.16.grad-scaler"
node        = 16
title       = "SCALE, STEP, UPDATE"
difficulty  = 4
story       = "Half precision on the card in rack 3: the small gradients underflow unless the loss is blown up first and the step knows it."
concepts    = ["training-loop", "optimizers", "types"]
requires    = ["pytorch.cheatsheet_advanced.15.scheduler-step"]
map         = { x = 0.58, y = 0.53, kind = "quest" }
brief       = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
    with torch.autocast(device_type="cuda", dtype=torch.float16):
        loss = loss_fn(model(xb), yb)
    # ____
```

Mixed precision in `float16` on CUDA. Fill the blank with the three calls
of one training step, so that backward runs on a loss the scaler has
grown, the optimiser **never applies still-scaled gradients** (and a step
whose gradients hold an inf is skipped), and the scale factor is
adjusted only after that step.
'''
solution    = 'scaler.scale(loss).backward(); scaler.step(opt); scaler.update()'
hints = [
  "All three calls go through the scaler. Stepping the optimiser directly leaves the gradients scaled; the scaler refuses to step a loss it never scaled, and refuses to update before it has stepped.",
]

[quest.quiz]
choices = [
  'loss.backward(); scaler.step(opt); scaler.update()',
  'scaler.scale(loss).backward(); opt.step(); scaler.update()',
  'scaler.scale(loss).backward(); scaler.update(); scaler.step(opt)',
  'scaler.scale(loss).backward(); scaler.step(opt); scaler.update()',
]
answer  = 3

