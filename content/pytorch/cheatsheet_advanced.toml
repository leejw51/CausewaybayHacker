```
class Tower(nn.Module):
    def __init__(self, depth):
        super().__init__()
        blocks = [nn.Linear(64, 64) for _ in range(depth)]
        # ____

    def forward(self, x):
        for layer in self.layers:
            x = torch.relu(layer(x))
        return x
```

Fill the blank so that every layer's weights show up in
`model.parameters()` and in `model.state_dict()`.
'''
solution    = 'self.layers = nn.ModuleList(blocks)'
hints = [
  "A plain Python container hides its contents from the module registry. The registering container takes the list whole; Sequential wants the layers unpacked, not a list.",
]

[quest.quiz]
choices = [
  'self.layers = nn.ModuleList(blocks)',
  'self.layers = blocks',
  'self.layers = nn.Sequential(blocks)',
  'self.layers = tuple(blocks)',
]
answer  = 0

