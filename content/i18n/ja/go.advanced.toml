output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

キャンセルは context の木を **下へ** 流れ、決して上へは流れません。期限が
すでに過ぎている子は、親が何をしようと、作られた瞬間に死んでいます — だから
奇数番は別のエラーを報告し、出力は競合ではなく毎回同じになるのです。

作ったすべての context に `defer cancel()` するのは礼儀ではありません。決して
キャンセルされない context は親の子リストを膨らませ続け、それはゴルーチンの
いない漏れです。
'''
hints = [
  "`done` に n のバッファを持たせ、期限のすでに過ぎた子が受信側を待たずに報告できるようにしてください。",
  "集め始める前に親をキャンセルしてください。さもないとチャネルでブロックしたとき、偶数番の子はまだ待っています。",
  "ctx.Err() は context.Canceled か context.DeadlineExceeded で、文字列を比べるのではなく errors.Is で見分けます。",
]

