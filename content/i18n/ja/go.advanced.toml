# GO LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/go/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.advanced.01.goroutines"
title = "四十人の配達員"
story = "12:30。バイク八台、注文四十件、そして配車係はまだ一件ずつ読み上げている。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとにゴルーチンをひとつ起動してください。それぞれがひとつのチャネルに
`{index, value * value}` を送ります。`n` 個の結果をすべて集め、インデックスで
並べ替え、一行に一つ `<index> <value>` を出力し、次に `GOROUTINES <n>` を
出力します。

```
input:  3
        2 3 4
output: 0 4
        1 9
        2 16
        GOROUTINES 3
```

結果はスケジューラの気分次第の順序で届きます。インデックスを一緒に運ぶことが、
プログラムの答えを毎回同じにするものです。

このパックのすべてのゴルーチンは、ループ変数を **引数** として受け取ります。
Go 1.22 以降 — かつ `go` ディレクティブが `1.22` 以降を指すモジュールの中でだけ —
`for` ループは反復ごとに固有の `i` と `v` を与えるので、そこでは直接捕捉しても
安全です。それ以外の場所では、それを捕捉することは Go でいちばんありふれた
バグです。引数として渡せばどのバージョンでも正しく、ゴルーチンが見てよいものを
シグネチャに正確に名指しできます。
'''
hints = [
  "容量 n のバッファ付きチャネルなら送信側は決してブロックしないので、途中でやめてもゴルーチンは漏れません。",
  "ちょうど n 回受信してください。ここで全部終わったと知る方法は他にありません。",
  "インデックスで sort.Slice すれば、スケジューラが奪った順序が戻ります。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.advanced.02.waitgroup"
title = "誰も先に帰らない"
story = "配車係は最後の配達員がチェックインする前にボードを読み、ボードは半分空っぽだ。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の単語です。

単語ごとにゴルーチンをひとつ起動し、その単語を大文字にして `out[i]` に書き込んで
ください — 自分のインデックスなので、同じ要素に触るゴルーチンは二つとありません。
`sync.WaitGroup` で全員を待ち、それから `out` を順に出力し、`WAITED <n>` を出力
します。

```
input:  2
        lucky
        mac
output: LUCKY
        MAC
        WAITED 2
```

`go` の前に `wg.Add(1)`、ゴルーチンの中の最初に `defer wg.Done()`、何かを読む前に
`wg.Wait()`。ゴルーチンの中で Add するのは `Wait` そのものとの競合です。
'''
hints = [
  "多くのゴルーチンから out[i] に書いても安全なのは、どの i もちょうど一つのゴルーチンが書くからです。",
  "defer wg.Done() をゴルーチンの一行目に。panic しても待ちが解放されます。",
  "wg.Add(1) はループの中、go 文の前に置きます — ゴルーチンの中ではありません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.advanced.03.close"
title = "誰がハッチを閉めるのか"
story = "最後の注文のあとも厨房のハッチは開いたままで、カウンターはもう一件を待ってそこに立ち尽くしている。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

ひとつのゴルーチンが各値を十倍して送り、そのあとチャネルを **close** します。
`main` はチャネルを range して各値を出力しながら合計を保ち、それから
`SUM <total>` と `CLOSED` を出力します。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

チャネルの `range` はチャネルが close されたときに終わり、それより前には
終わりません。`close` を忘れると、Go ランタイムが何が起きたかを正確に教えて
くれます: *all goroutines are asleep — deadlock!*

閉じるのは送信側です。受信側は決して閉じません。
'''
hints = [
  "一行、送信するゴルーチンの末尾に。",
  "ゴルーチンの先頭の defer close(ch) も同じ仕事をし、早期 return にも耐えます。",
  "受信側から閉じると、送信側が送信時に panic します — 送信側が閉じるという規則はそのためです。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.advanced.04.select"
title = "ふたつのホーム"
story = "1 番ホームと 2 番ホームは同じコンコースのカウンターに流れ込み、カウンターは一度にどちらか一方しか見られない。"
brief = '''
標準入力は二つの整数 `a` と `b` です。

ひとつのゴルーチンが tram チャネルに `a` 個の値を送って閉じ、もうひとつが
MTR チャネルに `b` 個を送って閉じます。`main` はひとつの `select` ループで
**両方** を飲み干し、どちらから何個来たかを数えます。

`TRAM <a>`、`MTR <b>`、`TOTAL <a+b>` を出力してください。

```
input:  3 2
output: TRAM 3
        MTR 2
        TOTAL 5
```

閉じたチャネルからの受信は、いつまでも即座に返ります — なのでそのアームを
持ち続ける `select` は空回りします。コツ: `v, ok := <-ch` とし、`ok` が false に
なったらそのチャネル変数を `nil` にします。**nil** チャネルからの受信は永遠に
ブロックし、`select` の中ではそのアームがただ切られたことになります。どちらかが
まだ nil でないあいだループしてください。
'''
hints = [
  "select の case の中の v, ok := <-ch: ok が false になるのは、チャネルが閉じられて飲み干されたそのときです。",
  "チャネル変数を nil にするとその case は無効になります。nil チャネルは決して準備完了になりません。",
  "ループ条件は `tramCh != nil || mtrCh != nil` で、両方のアームが切れたときに終わります。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.advanced.05.mutex"
title = "ひとつの引き出しに八本の手"
story = "二台のレジが同じ引き出しから現金を取り、閉店時には引き出しがどちらの計算とも食い違っている。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

`Counter` を仕上げてください: `Add` はロックを取り、合計に足し、ヒット数を
増やします。`Snapshot` はロックを取り、両方を返します。値ごとにゴルーチンを
ひとつ起動し、それらを待ってから `TOTAL <sum>` と `HITS <n>` を出力します。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

ミューテックスは守る対象の構造体の **中** に、守るフィールドの隣に住み、それらに
触るすべてのメソッドがそれを取ります。ポインタレシーバを忘れた瞬間に `Counter` は
値としてコピーされます — `go vet` がそう言ってくれます。
'''
hints = [
  "c.mu.Lock() のあと defer c.mu.Unlock() がパターンのすべてで、defer は早期 return にも耐えます。",
  "Snapshot は二つのフィールドを読みます。ひとつのロックの下で読むことが、その組を一貫させます。",
  "両方のメソッドにポインタレシーバが要ります。さもないと呼び出しごとにミューテックスのコピーをロックし、何も守れません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.advanced.06.atomic"
title = "一度きり"
story = "配達員のアプリはどれも起動時に車庫への接続を開き、車庫にはいま四十本の接続とひとつのソケットがある。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとにゴルーチンをひとつ起動してください。そのすべてが同じ `sync.Once` を
呼び、それが `INIT` を出力します — だからどのゴルーチンが最初に着いても、
`INIT` はちょうど一度だけ現れます。それぞれはそのあと自分の値を
`atomic.Int64` の合計に足し、`atomic.Int64` の個数を増やします。

全部終わったら `TOTAL <sum>` と `COUNT <n>` を出力します。

```
input:  4
        1 2 3 4
output: INIT
        TOTAL 10
        COUNT 4
```

アトミックなカウンターは安上がりなミューテックスではありません — まさにこの
ため、つまり一語の read-modify-write を、クリティカルセクションなしで行う
別の道具です。一語より広いものにはやはりミューテックスが要ります。
'''
hints = [
  "once.Do(func(){ ... }) は最初の一回だけ引数を実行し、終わるまで他をブロックします。",
  "atomic.Int64 には Add と Load メソッドがあります — アドレス取得もミューテックスも要りません。",
  "INIT が必ず TOTAL より前に来るのは、出力がゴルーチンの中で起き、TOTAL は Wait のあとに起きるからです。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.advanced.07.context"
title = "送るのをやめろ"
story = "客は三本前の通りでアプリを閉じたのに、厨房はまだその注文を作っている。"
brief = '''
標準入力は二つの整数 `n` と `k` です。

**バッファなし** のチャネルに `1..n` を一つずつ送ろうとするプロデューサーの
ゴルーチンを起動してください。ただし、自分の `context` がキャンセルされた瞬間に
止まり、実際に送れた個数を報告します。

`main` はちょうど `k` 個の値を受信して出力し、`cancel()` を呼び、`CANCELLED` を
出力し、それからプロデューサーからの `SENT <count>` を出力します。

```
input:  5 3
output: 1
        2
        3
        CANCELLED
        SENT 3
```

プロデューサーのループ本体は、`<-ctx.Done()` と送信の二つのアームを持つ
`select` です。誰も受信しなくなれば送信は決して準備完了にならないので、
発火できるのはキャンセルだけです。それがこれを運任せではなく決定的にする
ものです。
'''
hints = [
  "ctx.Done() は cancel が呼ばれたときに閉じられるチャネルなので、そこからの受信は他と同じ select のアームです。",
  "プロデューサーは両方の経路で報告しなければなりません: キャンセルされての return と、ループの終わりと。",
  "main の defer cancel() は、自分で cancel を呼ぶときでも省けません — context を解放するのはそれです。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.advanced.08.worker-pool"
title = "八台のバイク"
story = "注文四十件にバイク八台。誰も四十台は望んでいない。八台が決して止まらないことを望んでいる。"
brief = '''
標準入力は二つの整数 `w` と `n`、続いて `n` 個の値です。

ワーカープールを作ってください: `w` 個のワーカーが `jobs` チャネルを range し、
それぞれ `{index, value * value}` を `results` チャネルに押し込みます。ひとつの
ゴルーチンがジョブを流し込んで `jobs` を閉じ、もうひとつがワーカーを待って
`results` を閉じます。`main` は `results` が閉じるまで range し、インデックスで
並べ替え、`<index> <value>` を出力し、次に `WORKERS <w>` を出力します。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

三つの close を、うまくいく唯一の順序で: 供給側が `jobs` を閉じてワーカーの
`range` が終わる。ワーカーが終わって `WaitGroup` が解放される。待っていた者が
`results` を閉じて `main` の `range` が終わる。
'''
hints = [
  "ワーカーに固有のインデックスは要りません。ジョブがそれを運びます。",
  "close(results) をワーカーの中で行うことはできません — ワーカーは w 個あり、合法な close は一回だけです。",
  "余分なゴルーチンはそのためにあります: main がまだ飲み干している最中に、wg.Wait() してから close(results) します。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.advanced.09.errors-in-flight"
title = "誰かの昼食の注文"
story = "四十枚の伝票を一度に解析していて、そのうち一枚はお粥についての手書きのメモだ。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は整数のはずです。

それらを **並行に** 解析してください — 一行につきゴルーチンひとつ — そして
ひとつのチャネルに `{index, value, err}` を送ります。`n` 個すべてを集め、
インデックスで並べ替え、それぞれについて値の二倍か `BAD <line>` を出力します。
次に出力したものの `SUM <total>` と、`ERRORS <count>` を出力します。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
        ERRORS 1
```

ゴルーチンからのエラーは、他の結果と同じように運ばれなければなりません。
`go` 文からの `return err` は存在せず、不正な行で panic するゴルーチンは
プログラム全体を道連れにします。
'''
hints = [
  "エラーは結果構造体のフィールドです。それが考え方のすべて: エラーは値と一緒に運ばれます。",
  "解析に失敗したときも送ってください — main はちょうど n 回の受信を数えていて、さもないと一つ足りずに固まります。",
  "出力する前にインデックスで並べ替えてください。さもないと出力はスケジューラの決めた順になります。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.advanced.10.context-tree"
title = "下へ伝わるキャンセル"
story = "ひとりの客がアプリを閉じても、上流の九つのものはまだ調理し、配車し、課金している。"
brief = '''
標準入力は整数 `n` ひとつです。

`context.WithCancel` で親 context を作ってください。そこから `n` 個の子を
派生させます: **偶数** 番は `context.WithCancel(parent)` で、**奇数** 番は
`context.WithDeadline(parent, <一時間前>)` で。

子ごとにゴルーチンをひとつ起動し、`<-child.Done()` を待って、自分のインデックスと
`child.Err().Error()` を報告させます。親をキャンセルし、`n` 個の報告をすべて集め、
インデックス順に出力してください。それから親自身のエラーと、
`errors.Is(parent.Err(), context.Canceled)` なら `IS_CANCELED YES` を出力します。

```
input:  3
output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

キャンセルは context の木を **下へ** 流れ、決して上へは流れません。期限が
すでに過ぎている子は、親が何をしようと、作られた瞬間に死んでいます — だから
奇数番は別のエラーを報告し、出力は競合ではなく毎回同じになるのです。

作ったすべての context に `defer cancel()` するのは礼儀ではありません。決して
キャンセルされない context は親の子リストを膨らませ続け、それはゴルーチンの
いない漏れです。
'''
hints = [
  "`done` に n のバッファを持たせ、期限のすでに過ぎた子が受信側を待たずに報告できるようにしてください。",
  "集め始める前に親をキャンセルしてください。さもないとチャネルでブロックしたとき、偶数番の子はまだ待っています。",
  "ctx.Err() は context.Canceled か context.DeadlineExceeded で、文字列を比べるのではなく errors.Is で見分けます。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.advanced.11.rwmutex"
title = "三百人の読み手"
story = "ヒサンの案内板は一分に三百回読まれ、一日に二回書き換えられる。ただの Mutex では読み手が無意味に互いの後ろに並ぶ。"
brief = '''
一行目は `n q` です。次の行は保存する `n` 個の単語、その次は検索する `q` 個の
単語です。

`map[string]int` と `sync.RWMutex` を包んだ `Directory` を作ってください。`Set` は
書き込みロックを取り、`Get` と `Size` は **読み取り** ロックを取ります。各単語を
その位置に対して、順番に保存します — あとの重複が先のものを上書きします。
それから `q` 個の検索をすべて **並行に** 走らせ、集めて、問い合わせ順に
`<word> <index>` か `<word> MISSING` を出力し、次に `SIZE <k>` を出力します。

```
input:  3 2
        tram bus mtr
        bus zzz
output: bus 1
        zzz MISSING
        SIZE 3
```

`RLock` はいくつもの読み手が同時に保持でき、書き手に対してだけブロックします。
それが存在理由のすべてであり、読み手が `Lock` を取ったらまったく価値がありません。

書き込みが順番なのは意図的です: 同じ単語に対する並行の `Set` では、保存される
インデックスがたまたま最後に走ったゴルーチンのものになり、スケジューラ次第の
答えを持つ課題はランダムに落ちる課題です。
'''
hints = [
  "読み手には RLock/RUnlock、書き手には Lock/Unlock。取り違えてもコンパイルは通り、黙って利点が消えます。",
  "各ゴルーチンは answers[slot] に書き、スロットを共有する二つはないので、スライス自体にロックは要りません。",
  "マップ読み取りの comma-ok 形式が、`無い` と `あってゼロ` を分けるものです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.advanced.12.chan-directions"
title = "どちら向きに流れるのか"
story = "プロデューサーは一週間、自分の出力チャネルから受信していた。それでもコンパイルは通った。誰も矢印を書いていなかったから。"
brief = '''
一行目は `n b` で、`b` は `n` 以上です。

バッファ `b` のチャネルを作ってください。`produce(out chan<- int, n int)` は
`0..n-1` を送って閉じます。`consume(in <-chan int) int` は range して合計を
返します。出力するのは:

```
input:  3 5
output: CAP 5
        LEN 3
        SUM 3
        LEN_AFTER 0
```

`CAP` と `LEN` は、生産の **あと** で消費の前に取った `cap(ch)` と `len(ch)` です:
`cap` はバッファの大きさ、`len` はそこに溜まっている量です。

スターターはコンパイルが通りません。`consume` は `<-chan int` — 受信専用 — を
受け取り、そこへ送信しようとしています。向きは **型** の一部で、コンパイル時に
検査され、双方向チャネルから片方向への変換は無料で一方通行です。これはこの
言語でいちばん安いドキュメントです: この関数がパイプのどちらの端を握って
いるかを語るシグネチャです。
'''
hints = [
  "エラーが正確に名指ししています: invalid operation, cannot send to receive-only channel。その行を消してください。",
  "ここで produce を main のゴルーチンで走らせられるのは、バッファが全部を収められる大きさだからに過ぎません。b < n なら永遠にブロックします。",
  "閉じられて飲み干されたチャネルの range は終わります — produce がそれを閉じることが、consume がそもそも return できる理由です。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.advanced.13.select-default"
title = "試して、待たない"
story = "メトリクスのチャネルは満杯で、レジはそれを待つために客をさばくのをやめたりしない。"
brief = '''
一行目は `b n` です: バッファ `b` のチャネルと、そこへ差し出す `n` 個の値。

`1..n` を **ノンブロッキング** の送信で差し出してください — 待つ代わりに諦める
`default` を持つ `select` です。それからノンブロッキングの受信で飲み干し、
そのあともう一度試します。出力するのは:

```
input:  2 5
output: SENT 2
        DROPPED 3
        GOT 2
        EMPTY yes
```

`default` を持つ `select` は決してブロックしません: この瞬間に他の case が
準備完了でなければ、`default` が走ります。それが「送る」を「送ってみる」に
変え、メトリクスやログのチャネルはそう振る舞うべきです — 満杯なら捨てる、
止まらない。

`b = 0` で誰も受信していなければ、**すべて** の送信が捨てられます。バッファなしの
送信は、受信側がすでに待っているときにだけ準備完了になるからです。
'''
hints = [
  "default と case ひとつの select がノンブロッキングのイディオムのすべてです。TrySend 関数はありません。",
  "同じ形で飲み干してください: 値が準備できているあいだ受信し、default にループを終わらせます。",
  "空かどうかを調べるためにチャネルを閉じてはいけません — 閉じたチャネルからの受信は常に準備完了で、`no` と報告してしまいます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.advanced.14.happens-before"
title = "なぜこれは安全なのか"
story = "ホワイトボードに四つの断片。三つは正しく同期されていて一つはそうでなく、レース検出器もそう言っている。"
brief = '''
標準入力は整数 `n` ひとつです。

正しく同期された四つのものを作り、それぞれが生み出したものを出力してください:

1. `CHAN <v>` — ゴルーチンが普通の `int` を書き、**そのあと** チャネルに送ります。
   受信がその書き込みを見えるようにするものです。`42` を書いてください。
2. `ONCE <k>` — `n` 個のゴルーチンがすべてひとつの `sync.Once` を呼びます。`k` は
   その関数が実際に走った回数です。
3. `MUTEX <k>` — `n` 個のゴルーチンが `sync.Mutex` の下でカウンターを増やします。
4. `WG <k>` — `n` 個のゴルーチンがそれぞれスライスの自分のスロットに書き、
   `wg.Wait()` が `n` 個の書き込みすべてを読み手に見えるようにするものです。

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

これらはどれも *happens-before* の辺で、必要な形はこの四つだけです: 送信は
対応する受信の完了より前に起きる。`Once.Do` はその一回の呼び出しが終わった
あとにだけ返る。unlock は次の lock より前に起きる。`wg.Wait` は対応する `Done` の
呼び出しのあとにだけ返る。

ここに、タイミングのおかげで安全なものは何もありません。どれかひとつの辺を
取り去れば `-race` がそれを見つけます。一度も間違った数を出したことのない
マシンの上でも。
'''
hints = [
  "close(ready) してから <-ready が Go でいちばん安い公開の辺で、ゴルーチンがその前に行ったすべての書き込みを運びます。",
  "once.Do の中の runs++ に固有のロックは要りません — Once がすでに、ちょうど一度だけ、他のどの Do が返るよりも前に起きることを保証しています。",
  "各ゴルーチンはひとつのスロットを所有し、同じメモリに触る二つは決してありません。必要な辺は、全部を読む前の Wait だけです。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.advanced.15.generic-constraints"
title = "型が約束すべきこと"
story = "三つのヘルパー、三つの異なる約束。そのうち型に何ができるかを気にするのは一つだけ。"
brief = '''
一行目は `n` です。二行目は `n` 個の小文字の単語です。

ジェネリックなヘルパーを三つ、それぞれ異なる種類の制約で書いてください:

* `Names[T Named](xs []T) []string` — **メソッド** を持つ制約
* `Max[T Ordered](xs []T) T` — **型集合** である制約、`~string | ~int64`
* `Distinct[T comparable](xs []T) int` — 組み込みの制約

各単語を `Name() string` メソッドを持つ `Stop` で包みます。名前をスペースで
つないで出力し、次に `MAX <w>` (辞書順で最大の単語) と `DISTINCT <k>` を
出力してください。

```
input:  3
        tram bus mtr
output: tram bus mtr
        MAX tram
        DISTINCT 3
```

制約とは型パラメータの位置で使われるインターフェースで、普通のインターフェースには
持てない二つのものを持てます: **型集合** (`~string` は基底型が `string` である
あらゆる型に一致します) と、事前宣言された `comparable` です。

`interface{ Name() string }` の **引数** との違いは、口に出して言う価値のある
ものです: `Names[T Named]` は単相化され、呼び出しは静的で、ボクシングが要りません。
`func Names(xs []Named)` なら、呼び出し箇所ごとに手で別のスライスを組み立てる
必要があったでしょう。
'''
hints = [
  "Names の中で x.Name() の型検査が通るのは、制約がそのメソッドを約束したからです — メソッド制約が買ってくれるのはそれです。",
  "Max が > を使えるのは、Ordered がそれを支える型の型集合だからに過ぎません。`any` ではコンパイルが通りません。",
  "map[T]struct{} には T が comparable であることが要り、それがまさにこの制約です。struct{} は `マップではなく集合` と語る幅ゼロの値です。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.advanced.16.gotchas"
title = "見かけどおりでない三つのこと"
story = "アルゴリズムの問題ではない。三つの断片があり、面接官はそれぞれが何を出力するかだけを知りたがっている。"
brief = '''
標準入力は個数 `n` (`4` 以上)、続いて `n` 個の整数です。

`a := make([]int, n, n+4)` を作って埋めてください。それからちょうど四行を作ります:

1. `ALIAS <a[2]>` — `b := a[:2]` と `b = append(b, 99)` のあとで。
2. `NILIFACE <bool>` — **nil な `*Thing`** を `Fooer` インターフェース変数に代入し、
   その変数が `!= nil` かどうかを報告します。
3. `DEFER_CLOSURE <v>` — `x` を読む `defer func(){ ... }()` から。
4. `DEFER_ARG <v>` — `defer fmt.Printf(..., x)` から。

両方の defer が登録される **前** に `x := a[0]` を置き、`main` のいちばん最後で
`x = a[n-1]` とします。(`n` が `4` 以上なのは、`a[n-1]` がエイリアシングの段階で
上書きされるセルに決してならないためです — `n = 3` ならそうなり、それはこの
課題が意図的に脇へどけている四つ目の驚きです。)

```
input:  4
        1 2 3 4
output: ALIAS 99
        NILIFACE true
        DEFER_CLOSURE 4
        DEFER_ARG 1
```

三つの答えはどれも人を驚かせ、三つとも原因は同じです: Go は何かを、見かけより
早く、あるいは遅く評価します。

**エイリアシング。** `a[:2]` は `a` の背後の配列を共有し、その容量を保つので、
`append` には余地があり、割り当てるのではなく `a[2]` に書き込みます。スライスは
コピーではありません。`a[:2:2]` — 三添字形式 — は容量に蓋をし、これを止める方法です。

**型付き nil。** インターフェース値は (型, 値) の組です。そこに nil な `*Thing` を
入れると `(*Thing, nil)` になり、それは nil な *インターフェース* ではありません。
nil の具象エラーポインタを返した関数に対して `if err != nil` が発火するのはこの
ためで、Go でいちばん高くつく二行です。

**Defer。** defer された呼び出しの引数は、呼び出しが走るときではなく、**`defer` が
走るとき** に評価されます。引数を取らない defer されたクロージャは、代わりに
呼ばれる時点で変数を読みます。両方の defer は同じ `x` を見ています。食い違うのは、
一方がすでにコピーを取っていたからです。そして LIFO で走るので、二番目に書いた
方が先に出力します。
'''
hints = [
  "x が変わる前に両方の defer を登録し、後入れ先出しで走ることを覚えておいてください。",
  "cap(a[:2]) は 2 ではなく cap(a) です — それがエイリアシングの答えのすべてです。あとで a[:2:2] を試し、ALIAS が元の値になるのを見てください。",
  "boxed は (*Thing, nil) を保持しています。nil と比べるのはその組を比べることで、型の側は nil ではありません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.advanced.17.race"
title = "レース"
story = "コーズウェイベイ乗換駅、2 番ホーム。二つのカウンター、ひとつの数字。その数字は、誰も二度と再現できない量だけ狂っている。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<IN|OUT> <K>` です。

一行につきゴルーチンをひとつ起動してください。それぞれが自分のカウンターを
`K` 回、一回ずつ増やします — `+= K` ではなく、一回ずつです。改札機とはそういう
ものだからです。全員を待ち、それから `IN <a>`、`OUT <b>`、`NET <a-b>` を出力します。

```
input:  2
        IN 3
        OUT 1
output: IN 3
        OUT 1
        NET 2
```

隠しケースでは `K` は六桁に達し、それが要点です: 複数のゴルーチンからの
素の `in++` は、その規模ではカウントを失う *恐れがある* どころか、実際に失います。
毎回、毎回違う数だけ。`in++` はロード、加算、ストアであり、その三つを束ねて
おくものは何もありません。

`sync/atomic` (または `sync.Mutex`) を使い、本物の答えが検証されるのと同じ
やり方で検証してください: `go test -race` / `go run -race` は、間違った合計では
なく、同期されていないアクセスそのものを報告します。
'''
hints = [
  "Add(1) を持つ atomic.Int64 が、これを正しくする最小の変更です。",
  "両方のカウンターを囲む sync.Mutex でも動き、そして遅くなります。増分ごとに一回取るのが誠実な比較です。",
  "両方のカウンターは Wait のあとに読んでください。途中ではなく — 飛行中に取ったスナップショットは別の種類の間違いです。",
]
