hints = [
  "エラーが正確に名指ししています: invalid operation, cannot send to receive-only channel。その行を消してください。",
  "ここで produce を main のゴルーチンで走らせられるのは、バッファが全部を収められる大きさだからに過ぎません。b < n なら永遠にブロックします。",
  "閉じられて飲み干されたチャネルの range は終わります — produce がそれを閉じることが、consume がそもそも return できる理由です。",
]

