[[quest]]
id    = "go.advanced.15.generic-constraints"
title = "型が約束すべきこと"
story = "三つのヘルパー、三つの異なる約束。そのうち型に何ができるかを気にするのは一つだけ。"
brief = '''
一行目は `n` です。二行目は `n` 個の小文字の単語です。

ジェネリックなヘルパーを三つ、それぞれ異なる種類の制約で書いてください:

* `Names[T Named](xs []T) []string` — **メソッド** を持つ制約
* `Max[T Ordered](xs []T) T` — **型集合** である制約、`~string | ~int64`
* `Distinct[T comparable](xs []T) int` — 組み込みの制約

各単語を `Name() string` メソッドを持つ `Stop` で包みます。名前をスペースで
つないで出力し、次に `MAX <w>` (辞書順で最大の単語) と `DISTINCT <k>` を
出力してください。

```
input:  3
        tram bus mtr
output: tram bus mtr
        MAX tram
        DISTINCT 3
```

制約とは型パラメータの位置で使われるインターフェースで、普通のインターフェースには
持てない二つのものを持てます: **型集合** (`~string` は基底型が `string` である
あらゆる型に一致します) と、事前宣言された `comparable` です。

`interface{ Name() string }` の **引数** との違いは、口に出して言う価値のある
ものです: `Names[T Named]` は単相化され、呼び出しは静的で、ボクシングが要りません。
`func Names(xs []Named)` なら、呼び出し箇所ごとに手で別のスライスを組み立てる
必要があったでしょう。
'''
hints = [
  "Names の中で x.Name() の型検査が通るのは、制約がそのメソッドを約束したからです — メソッド制約が買ってくれるのはそれです。",
  "Max が > を使えるのは、Ordered がそれを支える型の型集合だからに過ぎません。`any` ではコンパイルが通りません。",
  "map[T]struct{} には T が comparable であることが要り、それがまさにこの制約です。struct{} は `マップではなく集合` と語る幅ゼロの値です。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "go.advanced.16.gotchas"
title = "見かけどおりでない三つのこと"
story = "アルゴリズムの問題ではない。三つの断片があり、面接官はそれぞれが何を出力するかだけを知りたがっている。"
brief = '''
標準入力は個数 `n` (`4` 以上)、続いて `n` 個の整数です。

`a := make([]int, n, n+4)` を作って埋めてください。それからちょうど四行を作ります:

1. `ALIAS <a[2]>` — `b := a[:2]` と `b = append(b, 99)` のあとで。
2. `NILIFACE <bool>` — **nil な `*Thing`** を `Fooer` インターフェース変数に代入し、
   その変数が `!= nil` かどうかを報告します。
3. `DEFER_CLOSURE <v>` — `x` を読む `defer func(){ ... }()` から。
4. `DEFER_ARG <v>` — `defer fmt.Printf(..., x)` から。

両方の defer が登録される **前** に `x := a[0]` を置き、`main` のいちばん最後で
`x = a[n-1]` とします。(`n` が `4` 以上なのは、`a[n-1]` がエイリアシングの段階で
上書きされるセルに決してならないためです — `n = 3` ならそうなり、それはこの
課題が意図的に脇へどけている四つ目の驚きです。)

```
input:  4
        1 2 3 4
output: ALIAS 99
        NILIFACE true
        DEFER_CLOSURE 4
        DEFER_ARG 1
```

三つの答えはどれも人を驚かせ、三つとも原因は同じです: Go は何かを、見かけより
早く、あるいは遅く評価します。

**エイリアシング。** `a[:2]` は `a` の背後の配列を共有し、その容量を保つので、
`append` には余地があり、割り当てるのではなく `a[2]` に書き込みます。スライスは
コピーではありません。`a[:2:2]` — 三添字形式 — は容量に蓋をし、これを止める方法です。

**型付き nil。** インターフェース値は (型, 値) の組です。そこに nil な `*Thing` を
入れると `(*Thing, nil)` になり、それは nil な *インターフェース* ではありません。
nil の具象エラーポインタを返した関数に対して `if err != nil` が発火するのはこの
ためで、Go でいちばん高くつく二行です。

**Defer。** defer された呼び出しの引数は、呼び出しが走るときではなく、**`defer` が
走るとき** に評価されます。引数を取らない defer されたクロージャは、代わりに
呼ばれる時点で変数を読みます。両方の defer は同じ `x` を見ています。食い違うのは、
一方がすでにコピーを取っていたからです。そして LIFO で走るので、二番目に書いた
方が先に出力します。
'''
hints = [
  "x が変わる前に両方の defer を登録し、後入れ先出しで走ることを覚えておいてください。",
  "cap(a[:2]) は 2 ではなく cap(a) です — それがエイリアシングの答えのすべてです。あとで a[:2:2] を試し、ALIAS が元の値になるのを見てください。",
  "boxed は (*Thing, nil) を保持しています。nil と比べるのはその組を比べることで、型の側は nil ではありません。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "go.advanced.17.race"
title = "レース"
story = "コーズウェイベイ乗換駅、2 番ホーム。二つのカウンター、ひとつの数字。その数字は、誰も二度と再現できない量だけ狂っている。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<IN|OUT> <K>` です。

一行につきゴルーチンをひとつ起動してください。それぞれが自分のカウンターを
`K` 回、一回ずつ増やします — `+= K` ではなく、一回ずつです。改札機とはそういう
ものだからです。全員を待ち、それから `IN <a>`、`OUT <b>`、`NET <a-b>` を出力します。

```
input:  2
        IN 3
        OUT 1
output: IN 3
        OUT 1
        NET 2
```

隠しケースでは `K` は六桁に達し、それが要点です: 複数のゴルーチンからの
素の `in++` は、その規模ではカウントを失う *恐れがある* どころか、実際に失います。
毎回、毎回違う数だけ。`in++` はロード、加算、ストアであり、その三つを束ねて
おくものは何もありません。

`sync/atomic` (または `sync.Mutex`) を使い、本物の答えが検証されるのと同じ
やり方で検証してください: `go test -race` / `go run -race` は、間違った合計では
なく、同期されていないアクセスそのものを報告します。
'''
hints = [
  "Add(1) を持つ atomic.Int64 が、これを正しくする最小の変更です。",
  "両方のカウンターを囲む sync.Mutex でも動き、そして遅くなります。増分ごとに一回取るのが誠実な比較です。",
  "両方のカウンターは Wait のあとに読んでください。途中ではなく — 飛行中に取ったスナップショットは別の種類の間違いです。",
]
