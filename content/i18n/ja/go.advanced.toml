# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.advanced.14.happens-before"
title = "なぜこれは安全なのか"
story = "ホワイトボードに四つの断片。三つは正しく同期されていて一つはそうでなく、レース検出器もそう言っている。"
brief = '''
標準入力は整数 `n` ひとつです。

正しく同期された四つのものを作り、それぞれが生み出したものを出力してください:

1. `CHAN <v>` — ゴルーチンが普通の `int` を書き、**そのあと** チャネルに送ります。
   受信がその書き込みを見えるようにするものです。`42` を書いてください。
2. `ONCE <k>` — `n` 個のゴルーチンがすべてひとつの `sync.Once` を呼びます。`k` は
   その関数が実際に走った回数です。
3. `MUTEX <k>` — `n` 個のゴルーチンが `sync.Mutex` の下でカウンターを増やします。
4. `WG <k>` — `n` 個のゴルーチンがそれぞれスライスの自分のスロットに書き、
   `wg.Wait()` が `n` 個の書き込みすべてを読み手に見えるようにするものです。

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

これらはどれも *happens-before* の辺で、必要な形はこの四つだけです: 送信は
対応する受信の完了より前に起きる。`Once.Do` はその一回の呼び出しが終わった
あとにだけ返る。unlock は次の lock より前に起きる。`wg.Wait` は対応する `Done` の
呼び出しのあとにだけ返る。

ここに、タイミングのおかげで安全なものは何もありません。どれかひとつの辺を
取り去れば `-race` がそれを見つけます。一度も間違った数を出したことのない
マシンの上でも。
'''
hints = [
  "close(ready) してから <-ready が Go でいちばん安い公開の辺で、ゴルーチンがその前に行ったすべての書き込みを運びます。",
  "once.Do の中の runs++ に固有のロックは要りません — Once がすでに、ちょうど一度だけ、他のどの Do が返るよりも前に起きることを保証しています。",
  "各ゴルーチンはひとつのスロットを所有し、同じメモリに触る二つは決してありません。必要な辺は、全部を読む前の Wait だけです。",
]

