        GOT 2
        EMPTY yes
```

`default` を持つ `select` は決してブロックしません: この瞬間に他の case が
準備完了でなければ、`default` が走ります。それが「送る」を「送ってみる」に
変え、メトリクスやログのチャネルはそう振る舞うべきです — 満杯なら捨てる、
止まらない。

`b = 0` で誰も受信していなければ、**すべて** の送信が捨てられます。バッファなしの
送信は、受信側がすでに待っているときにだけ準備完了になるからです。
'''
