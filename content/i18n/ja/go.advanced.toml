# GO LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/go/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.advanced.01.control-flow"
title = "トラムか MTR か"
story = "コーズウェイベイ駅コンコースの掲示板は、次にどちらの便が来るかを示すはずだった。毎分、代わりにその分の数字を出している。"
brief = '''
整数 `n` をひとつ読み取ってください。`1` から `n` までの各 `i` について、一行ずつ出力します:

* `i` が 3 でも 5 でも割り切れるなら `TRAMMTR`
* `i` が 3 で割り切れるなら `TRAM`
* `i` が 5 で割り切れるなら `MTR`
* それ以外は `i` そのもの

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

Go の `switch` は対象を省くと、各アームがブール式の case になり、フォールスルー
しません。それを使ってください。
'''
hints = [
  "両方の場合を先に判定してください。さもないとその分岐は一度も通りません。",
  "switch { case cond: } には対象が要らず、break も要りません。",
  "3 と 5 で割り切れることは、15 で割り切れることと同じです。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.advanced.02.slices"
title = "車両の真ん中"
story = "2 番ホームは最初に乗る人と最後に乗る人を数え、そのあいだの全員を取りこぼす。"
brief = '''
標準入力は、一行目に個数 `n`、二行目にスペース区切りの `n` 個の整数です。
`n` は `1` 以上です。

三行を出力します: 最初の値、最後の値、そしてその二つに厳密に挟まれた値すべての
合計。値が三つ未満のときその合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1:len(nums)-1] は同じ背後の配列を共有します — ビューであって、コピーではありません。",
  "値が一つか二つのとき、そのスライス式は空か不正になります。if で守ってください。",
  "スライスの range はインデックスと値を返します。インデックスは _ で捨てられます。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.advanced.03.maps"
title = "コンコースが叫ぶもの"
story = "九時のコーズウェイベイ乗換駅。案内板は順位を出したがっているのに、マップには順序がない。"
brief = '''
標準入力を全部読み取り、空白で分割してください。

相異なる単語をそれぞれ一度だけ `<word> <count>` の形で出力します。順序は
出現回数の降順、同数なら単語の昇順です。

```
input:  tram tram bus
output: tram 2
        bus 1
```

Go のマップの range は、意図的にランダムな順序になります。出力する前に
集めてください。
'''
hints = [
  "counts[word]++ は無いキーに対しても動きます。int のゼロ値は 0 です。",
  "sort.Slice は less 関数を受け取ります — i が j より前に来るべきとき true を返してください。",
  "同数のときの決着は、その同じ関数の中の二つ目の比較です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.advanced.04.strings"
title = "バイトは文字ではない"
story = "B 出口の案内板は 銅鑼灣 を三で切り詰め、一文字半と疑問符を出す。"
brief = '''
一行を読み取ってください。三行を出力します:

1. その **バイト** 数
2. その **ルーン** 数
3. ルーン単位で逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII の外の文字が含まれることがあり、そのとき最初の二つの数は一致しません。
`len(s)` はバイト数です。昔からそうでした。
'''
hints = [
  "len(line) はバイト数で、[]rune(line) がデコードしたものです。",
  "バイトのスライスを逆順にすると、マルチバイト文字が真っ二つになります。",
  "両端から歩み寄る二つのインデックスで、進みながら入れ替える。それが逆順の全部です。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.advanced.05.structs"
title = "レジ"
story = "ラッキーマックのカウンターは注文に一行を加えるが、次の一行のときにはもう消えている。メソッドがコピーを受け取っていた。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<ITEM> <CENTS>` です。

品目を `Till` に集め、それから各品目を到着順に `<ITEM> <CENTS>` として出力し、
最後に `TOTAL <sum>` を出力してください。

```
input:  2
        HASHBROWN 600
        SET 2800
output: HASHBROWN 600
        SET 2800
        TOTAL 3400
```

`n` は `0` のこともあり、そのとき唯一の行は `TOTAL 0` です。

値レシーバのメソッドはレジのコピーを受け取ります。`Add` は本物を変えなければ
なりません。
'''
hints = [
  "func (t *Till) Add — ポインタレシーバは呼び出し側が持つレジそのものを変更します。",
  "till.Add(...) はそのままで動きます。till はアドレス可能なので、Go が代わりにアドレスを取ります。",
  "Total は読むだけですが、ひとつの型のレシーバは揃えておいてください。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.advanced.06.interfaces"
title = "ひとつのリストにふたつのもの"
story = "ヒサン・プレイスの案内板と、その外のトラム停留所は別々のプログラムが描いていて、どちらも相手のリストには収まらない。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は次のどちらかです

* `SHOP <NAME> <FLOOR>` — `<NAME> / F<FLOOR>` として描画する
* `STOP <ROUTE>` — `TRAM <ROUTE>` として描画する

すべての看板を順に描画して出力し、次に `SIGNS <n>`、次に `SHOPS <k>` を出力して
ください。`k` はそのうち店だったものの数で、解析中に持っていたフラグではなく
**型スイッチ** で数えます。

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        SIGNS 3
        SHOPS 2
```
'''
hints = [
  "`implements` キーワードはありません。各構造体に Render() string メソッドを与えれば Sign を満たします。",
  "具体的な値をそのまま []Sign に append してください — Go が包んでくれます。",
  "switch sign.(type) { case Shop: } が型スイッチです。値を受ける形は switch v := sign.(type) です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.advanced.07.errors"
title = "数字ではない行"
story = "車庫から戻ってきた乗務員記録の列の真ん中に、誰かの昼食の注文が挟まっている。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数のはずです。

各行について、値の二倍か、解析できなければ `BAD <line>` を出力してください。
最後に `SUM <total>`、つまり出力した値の合計を出力します。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

番兵 `var ErrNotANumber = errors.New(...)` を定義し、
`fmt.Errorf("...: %w", ErrNotANumber)` で包み、`main` で `errors.Is` を使って
見分けてください。エラーは値です。それで手に入るのがこれです。
'''
hints = [
  "strconv.ParseInt(s, 10, 64) は (int64, error) を返します — 二つ目の値を見るのは任意ではありません。",
  "fmt.Errorf の %w は包んだエラーを見つけられる形で保ちます。%v だとただの文字列に潰れます。",
  "errors.Is は包みの連鎖をたどるので、メッセージが飾られたあとでも一致します。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.advanced.08.closures"
title = "入口の人数"
story = "ラッキーマックは入った人と出た人を数えていて、店長は途中で何が起きようと閉店時の数字を知りたがっている。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は `IN` か `OUT` です。

決してゼロを下回らない累計を保ってください。各コマンドのあとにそれを出力します。
`main` が戻るときに `CLOSED <final>` を出力してください — 関数の末尾からではなく、
`defer` からです。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        CLOSED 2
```

カウンター自体はクロージャです: 関数を返す関数で、合計はその二つのあいだに
捕捉されます。答えにパッケージレベルの変数はありません。
'''
hints = [
  "total は makeCounter のフレームに住み、返された関数がそれを生かし続けます。それがクロージャです。",
  "defer func(){ ... }() は戻るときに走り、クロージャはそのときに `last` を読みます — defer を書いた時点ではありません。",
  "引数を取る defer なら、defer した時点の値を捕捉していたはずです。両方試して、変わるのを見てください。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.advanced.09.generics"
title = "ひとつの関数でどんなリストも"
story = "アレックスは Sum を四回書いた — 注文用、配達員用、分用、セント用 — そして五つ目の締め切りが来ている。"
brief = '''
標準入力はスペース区切りの整数が並んだ一行です。

三行を出力します:

1. 各値の二倍を、単一スペースでつないだもの
2. 元の値の合計
3. そのうち `10` より大きいものの個数

```
input:  1 2 3 4 12
output: 2 4 6 8 24
        22
        1
```

ジェネリックなヘルパーを三つ書いて使ってください: `MapSlice[T, U any]`、
`~int64 | ~float64` 制約の上の `Sum[T Number]`、そして述語を受け取る
`Count[T any]` です。
'''
hints = [
  "MapSlice は要素の型を変えるので、型パラメータは一つではなく二つ必要です。",
  "呼び出し側はスライスと関数から T と U を推論します — MapSlice[int64, string] とは書きません。",
  "~int64 は int64 と、基底型が int64 であるすべてを意味します。名前付きの型を通せるのはそのためです。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.advanced.10.defer-panic-recover"
title = "倒れて、起き上がった"
story = "以前は一枚の不正な伝票がレジ全体を落とし、そのシフトごと失っていた。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数、`BOOM` という語、または
それ以外の何かです。

`run(text string) (out string)` を書いてください。値の二倍を返すか、解析できなければ
`BAD <text>` を返し — `BOOM` では **panic** して、defer した関数の中で recover し、
呼び出し側が死んだプログラムの代わりに `RECOVERED boom` を受け取るようにします。
入力一つにつき一行を出力し、最後に `main` の `defer` から `CLOSED <n>` を出力して
ください。

```
input:  4
        21
        BOOM
        xx
        -4
output: 42
        RECOVERED boom
        BAD xx
        -8
        CLOSED 4
```

三つの事実があり、その三つすべてが問いです: `recover` は defer した関数の中で
しか何もしない。**名前付き** 戻り値があるからこそ、defer した関数は panic のあとに
返されるものを変えられる。そして `main` の `defer` は戻るときに走るので、ループが
どう進もうと `CLOSED` は最後になる。
'''
hints = [
  "戻り値には名前が要ります — out string — さもないと defer した関数には代入する先がありません。",
  "panic が無かったとき recover() は nil を返すので、その if が二つの経路を見分ける方法です。",
  "main の defer したクロージャは、書かれたときではなく走るときに `done` を読むので、最終的な個数が見えます。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.advanced.11.zero-values"
title = "無は無ではない"
story = "当番表のマップは一度も作られておらず、コードは午前中ずっとそこから読み続け、一度も文句を言わなかった。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の単語です。

四行を順に出力します:

1. `READ <v>` — **nil** マップが、持っていないキーに対して返すもの
2. `LEN <k>` — **nil** スライスに `n` 個の単語をすべて append したあとの長さ
3. `WRITE <ok|panic>` — その nil マップへの代入が panic したかどうか
   (recover してください。プログラムを死なせてはいけません)
4. `FOUND <k>` — `a` と `b` を入れて *初期化した* マップのキーである単語の個数

```
input:  3
        a b c
output: READ 0
        LEN 3
        WRITE panic
        FOUND 2
```

nil マップと nil スライスは同じ種類の無ではありません。nil マップの読み取りは
合法で、値の型のゼロ値を返します。書き込みは panic します。書き込む先の表が
ないからです。nil スライスへの `append` は合法で、割り当てを行います —
だから `var s []T` は慣用的な空スライスであり、`var m map[K]V` は慣用的な
空マップではないのです。
'''
hints = [
  "nil マップに対する empty[\"missing\"] はエラーではありません — int のゼロ値、つまり 0 です。",
  "append は nil スライスを扱えます。最初の背後の配列を割り当ててくれるので、始めるためだけに make() が要ることはありません。",
  "書き込みは、defer した recover を持つ関数の中で行わなければなりません。さもないと四行目の前に panic がプログラムを終わらせます。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.advanced.12.embedding"
title = "何も継承していない"
story = "終点は停留所におまけが付いたものだ。アレックスはそれを二度書いた。一度多い。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は `STOP <NAME>` か
`TERM <NAME> <LINES>` です。

`Stop` に、その名前を返す `Describe() string` を与えてください。`Terminus` に
`Stop` を **埋め込み**、`Lines int` を加え、埋め込まれた方を呼んで
`(<lines> lines)` を付け足す独自の `Describe` を与えてください。

それぞれの `Describe()` を出力し、次に `[]Describer` に対する型スイッチで数えた
`TERMINI <k>` を出力します。

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

埋め込みは継承ではありません。`Terminus` は `Stop` に *なる* のではなく、ひとつ
含んでいるのです。含まれた値のメソッドは、外側の型が自前のものを宣言しない限り、
外側の型に **昇格** されます。`t.Stop.Describe()` が、覆い隠した方に届く方法で、
`super` はありません。
'''
hints = [
  "埋め込まれたフィールドに固有の名前はありません — リテラルの中でも t.Stop.Describe() の中でも `Stop` と綴ります。",
  "Terminus は自前の Describe があるから Describer を満たします。無ければ、昇格した Stop のメソッドを通して満たしていたはずです。",
  "comma-ok 形式の d.(Terminus) が型アサーションです。二つより多いときは型スイッチが同じ仕事をします。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.advanced.13.variadics"
title = "いくつあっても"
story = "二つの注文のときもあれば、棚ごと丸ごとのときもある。関数はそれを気にするべきではない。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

`total(values ...int64) (sum int64, count int)` を書いてください — 可変長引数で、
名前付き戻り値です — そして三通りの方法で呼びます。出力するのは:

1. `ALL <sum> <count>` — スライス全体を `...` で展開して
2. `NONE <sum> <count>` — 引数をまったく渡さずに
3. `TWO <sum> <count>` — 最初の二つの値を個別に渡して、あるいはある分だけ

```
input:  4
        1 2 3 4
output: ALL 10 4
        NONE 0 0
        TWO 3 2
```

関数の中では `values` はただの `[]int64` で、引数が無ければ `nil` です —
`range` も `len` も特別扱いなしにそれを扱えます。`total(list...)` は既存の
スライスを新しいものにコピーせずに渡します。`total(list)` はコンパイルが通らず、
なぜ通らないかを知ることが問いです。
'''
hints = [
  "名前付き戻り値での裸の `return` は、そのとき sum と count が持っている値を返します。",
  "total(list...) は展開します。total(list) は []int64 を単一の int64 として渡そうとして、コンパイルが通りません。",
  "引数が無ければ values は nil で、len(nil スライス) は 0 です — ガードは要りません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.advanced.14.json"
title = "タグが契約書"
story = "車庫の API は小文字のキーを送り、Go は大文字のフィールドをエクスポートし、一週間のあいだ誰も注文がすべて空になる理由を見つけられなかった。"
brief = '''
標準入力は一行: 注文の JSON 配列で、各注文は `item` 文字列と `cents` 数値を
持ちます。

Unmarshal して、注文ごとに一行 `<ITEM> <CENTS>` を出力し、次に `count` と
`total` というちょうど二つのキーをこの順に持つ要約オブジェクトを marshal して
出力してください。入力が正しい JSON でなければ、`BAD JSON` だけを出力し、
他には何も出力しません。

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

`encoding/json` に見えるためには、フィールドは **エクスポート** されていなければ
なりません — 小文字のフィールドは marshaller から見えず、しかも黙って無視されます。
そのうえで構造体タグが、ワイヤー上での名前を決めます。`Marshal` はフィールドを
宣言順に書くので、要約のキー順はマップのものではなく、あなたが決めるものです。
'''
hints = [
  "タグは型のあとにバッククォートで書きます: Item string `json:\"item\"`。",
  "Unmarshal は出力先へのポインタを受け取ります — orders ではなく &orders です — さもないと埋める先がありません。",
  "Unmarshal のエラーを確認してください。不正な入力では orders は空のままで、エラーを無視するプログラムは能天気にゼロの要約を出力します。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.advanced.15.testing"
title = "自分で証明する"
story = "06:40 に誰かがこれを確認してくれることはない。表はすぐそこにある。緑にすること。"
brief = '''
このプログラムは正しいと分かっている `(km, fare)` の組を四つ持つ表を保持し、
`fare` をそのすべてと照合して `<name> ok` か
`<name> FAIL got <g> want <w>` を出力し、次に `PASSED <k>/4` を出力します。最後に
標準入力から距離をひとつ読み取り、`FARE <x>` を出力します。

`fare(km)` は `500 + 100 * km` であるべきです。スターターのものは間違っていて、
表がそれを捕まえます — それこそが要点です。

```
input:  4
output: zero ok
        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

表には触れないでください。それが仕様です。これは Go のテーブル駆動テスト
**そのもの** で、ハーネスを省いただけです: 本物のパッケージでは
`func TestFare(t *testing.T)` に `for _, c := range cases` と
`t.Run(c.name, ...)` があり、`go test` がそれを走らせます。表はどちらでも同じです。
'''
hints = [
  "表が仕様です。間違っているのは関数の方です。",
  "四つのうち三つが失敗し、通る一つは km = 0 です。テストケースが一つでは何も証明できない理由がまさにそれです。",
  "パッケージの中ではこれは func TestFare(t *testing.T) と t.Run(c.name, func(t *testing.T){ ... }) になり、失敗が自分の名前を名乗ります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.advanced.16.nil-and-order"
title = "フロントのレジ"
story = "11:55、ラッキーマックの表のレジ。すべての注文が通っていき、そのうちいくつかは存在しないのに、レジはそれも読んでしまう。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は `<NAME> <CENTS>` か、単独の `-`
で、後者は注文が届かなかったことを意味します: スライスの中の nil な `*Order`
です。

本物の注文を cents の **降順**、同額なら名前の昇順に並べ、`<NAME> <CENTS>` として
出力してください。そのあと `NIL <count>` — 欠けていた個数を出力します。

```
input:  4
        SET 2800
        -
        PIE 900
        TEA 1200
output: SET 2800
        TEA 1200
        PIE 900
        NIL 1
```

`sort.Slice` に渡す比較関数も含めて、何かがデリファレンスする前に、すべての nil を
見つけておかなければなりません。それがこのボスのすべてです。
'''
hints = [
  "スライスの中の nil な *Order は、何かがそのフィールドを読むまでは無害です。先にふるい落とし、それから並べ替えてください。",
  "\"-\" に対する strings.Fields はフィールドを一つ返すので、len(fields) < 2 が欠けた注文の判定です。",
  "降順は less 関数の中の > です。同額の決着はその後の二つ目の比較です。",
]

