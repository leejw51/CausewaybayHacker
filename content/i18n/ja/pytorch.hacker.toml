[[quest]]
id    = "pytorch.hacker.18.adam"
title = "Adam を書け"
story = "Adam を記憶から書き、三ステップ後にライブラリと一致させよ。問われているのはバイアス補正だ。"
brief = '''
一行目は `steps lr` です。二行目は `steps` 個の勾配で、ステップごとに一つ、`0` から始まるスカラーのパラメータに適用されます。

ステップ後のあなたのパラメータを小数点以下六桁に丸めて出力し、次に torch のものを、それから `1e-6` まで一致すれば `True` を出力してください。

`β₁ = 0.9`、`β₂ = 0.999`、`eps = 1e-8` の Adam:

```
m = b1*m + (1-b1)*g
v = b2*v + (1-b2)*g*g
mh = m / (1 - b1**t)
vh = v / (1 - b2**t)
w = w - lr * mh / (sqrt(vh) + eps)
```

`t` は **1** から数えます。バイアス補正がないと、`m` と `v` がゼロから始まるので、最初のステップは小さすぎます。

```
input:  3 0.1
        1 1 1
output: -0.3 -0.3 True
```
'''
hints = [
  "t は 1 から始まるので enumerate(gs, start=1) です — t が 0 だと、最初の補正でいきなりゼロで割ります。",
  "勾配が一定なら補正した mh/sqrt(vh) はほぼちょうど 1 なので、各ステップはおよそ lr だけ動きます。",
]

