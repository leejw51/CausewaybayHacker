```
g = g + wd * w
b = mu * b + g
w = w - lr * b
```

モーメンタムの後で減衰させたり、勾配ではなく重みを直接減衰させたりすると、別の軌跡になります — その違いこそ AdamW が扱うものです。

```
input:  3 0.1 0.9 0.1
        1 1 1
output: 0.388169 0.388169 True
```
'''
hints = [
  "先に d = g + wd * w、それからバッファ、それからステップ。",
  "torch はモーメンタムのバッファを mu * 0 + g ではなく最初の減衰した勾配で初期化します — ここでは同じことですが、それが特別な場合だと知っておく価値があります。",
]

