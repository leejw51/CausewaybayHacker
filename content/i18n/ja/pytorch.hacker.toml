  "x.view(b, t, h, d // h).transpose(1, 2) — 特徴量の軸を分割し、それから時間とヘッドを入れ替えます。",
  "統合は heads.transpose(1, 2).reshape(b, t, d) です。そこで view は例外を出します。transpose が連続性を壊したからです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "pytorch.hacker.33.reorder-beams"
title = "キャッシュはビームに従う"
story = "ビーム三は刈り込まれ、ビーム一は二つに分岐し、キーバリューキャッシュはまだそのどちらも起きる前のままに並んでいる。"
brief = '''
一行目は `n t` です。続いて `t` 個の浮動小数点数からなるキャッシュの行が `n` 行。最後の行は `n` 個の親インデックスで、新しい各ビームがどの古いビームから来たかを言います。

並べ替えたキャッシュを、一行に一つの行、小数点以下四桁に丸めて出力してください。

`cache.index_select(0, parents)` が操作のすべてで、繰り返された親 — 一つのビームが二つに分岐すること — も扱います。それはまさに、その場の代入を使った `for` ループが間違えるものです。

```
input:  3 2
        1 1
        2 2
        3 3
        2 0 0
output: 3.0 3.0
        1.0 1.0
        1.0 1.0
```
'''
hints = [
  "cache.index_select(0, parents) — あるいは同等の cache[parents] で、こちらのほうが読みやすいです。",
  "index_select はコピーするので、分岐した親は一つのもののビュー二つではなく、独立した二つの行になります。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "pytorch.hacker.34.teaching-cluster"
title = "教育用クラスタ"
story = "ルーム 7-32、最後の問題、そしてそれは二階下にあるものだ。そのブロックを一つ作り、それが未来を読めないことを証明せよ。"
brief = '''
一行目は `t d h seed` です。

**プレノルムの因果的トランスフォーマーブロック** 一つの順伝播を書いてください: LayerNorm、マルチヘッドの因果的セルフアテンション、残差、LayerNorm、GELU の MLP、残差。すべての重みは与えられていて、欠けているのは `forward` だけです。

四つのことを出力してください: 出力の形、アテンションの核が `F.scaled_dot_product_attention(..., is_causal=True)` と `1e-5` まで一致すれば `True`、ブロックが因果的なら — **最後の** トークンを変えても、それより前の出力行がすべて手つかずのままでなければなりません — `True`、そして出力が有限なら `True`。

因果性は性質であって、コードではありません。形の確認を通ってこれに落ちるブロックは、完璧な損失まで訓練されてノイズを生成するバグです。

```
input:  6 16 4 0
output: (6, 16) True True True
```
'''
hints = [
  "attend: sqrt(d // h) — ヘッドの次元 — でスケールし、それから下三角のマスクで masked_fill、それからソフトマックス、それから @ v。",
  "block は残差二つです: x = x + proj(attend(x))、それから x = x + mlp(ln2(x))。プレノルムとは、LayerNorm が各分岐の中にあり、残差そのものには決してかからないという意味です。",
  "因果性の確認に落ちるなら、マスクがないかソフトマックスの後にかかっています。参照の確認に落ちるなら、スケールが d // h ではなく d になっています。",
]
