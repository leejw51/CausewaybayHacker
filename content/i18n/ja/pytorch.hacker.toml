# PYTORCH LAND — HACKER, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/hacker.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.hacker"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.hacker.01.pairwise"
title = "すべての組、ループなし"
story = "ルーム 7-32、五回目。最初の問題は誰もが出されるもので、時計は部屋に入る途中で動き出す。"
brief = '''
一行目は `n d` です。続いて `d` 個の浮動小数点数からなる行が `n` 行。

ユークリッド距離の `n × n` 行列を、それぞれ小数点以下三桁に丸め、一行に一つの行、値は空白一つで区切って出力してください。

彼らが求めている答えには Python のループがありません。`(n, 1, d)` を `(1, n, d)` に対してブロードキャストすると、すべての差が一度に得られます。

```
input:  3 2
        0 0
        3 4
        0 4
output: 0.0 5.0 4.0
        5.0 0.0 3.0
        4.0 3.0 0.0
```
'''
hints = [
  "(x.unsqueeze(1) - x.unsqueeze(0)) の形は (n, n, d) — すべての組のすべての差です。",
  "torch.cdist(x, x) はライブラリの答えです。面接ではたいてい、ブロードキャストを書き下したものが求められます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.hacker.02.topk-accuracy"
title = "上位五つの中に"
story = "論文は top-5 を謳い、コードは top-1 を計算している。査読者がその数字を求めるまで誰も気づかなかった。"
brief = '''
一行目は `n c k` です。続いて `c` 個のロジットからなる行が `n` 行。最後の行は `n` 個の整数ラベルです。

top-1 正解率と top-`k` 正解率を、それぞれ小数点以下四桁に丸め、空白で区切って出力してください。サンプルは、そのラベルが自分の行の `k` 個の最大のロジットの中にあれば top-`k` に数えます。

`topk` は値とインデックスを返します。この問題で大事なのはインデックスのほうです。

```
input:  3 4 2
        1 2 3 0
        5 1 0 2
        0 1 4 3
        2 0 3
output: 0.6667 1.0
```
'''
hints = [
  "logits.topk(k, dim=1).indices は (n, k) で、すでに良い順に並んでいるので、列 0 が top-1 の予測です。",
  "(idx == want.unsqueeze(1)).any(dim=1) — ラベルを k 個の列にわたってブロードキャストさせるのが unsqueeze です。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.hacker.03.cosine"
title = "長さではなく角度"
story = "検索は内積で順位を付け、何を言っていようと最も長いベクトルがすべてのクエリで勝つ。"
brief = '''
一行目は `n m d` です。続いて `d` 個の浮動小数点数からなるクエリの行が `n` 行、それから `d` 個の浮動小数点数からなる文書の行が `m` 行。

`n × m` のコサイン類似度行列を、小数点以下四桁に丸め、一行に一つの行で出力してください。

コサイン類似度は **正規化した** ベクトルの内積です。先に正規化してから掛けるのが、行列積一回で済む答えです。後で割るにはノルムの外積が要り、そこで人は筋道を見失います。

```
input:  2 2 2
        1 0
        0 2
        1 0
        1 1
output: 1.0 0.7071
        0.0 0.7071
```
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) — 割り算を行方向にブロードキャストさせるのが keepdim です。",
  "それから行列積一回: qn @ kn.t()。ゼロベクトルはゼロで割ることになり、F.normalize の eps はそのためにあります。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.hacker.04.stable-softmax"
title = "ソフトマックスを書け"
story = "ソフトマックスを書け。それが最初に聞かれることで、彼らが耳を澄ませている答えは、誰も最初の一回では書かない引き算だ。"
brief = '''
一行目は `n c` です。続いて `c` 個のロジットからなる行が `n` 行。

各行について、`torch.softmax` を **使わずに** 計算したソフトマックスを、小数点以下四桁に丸めて出力してください。

大きなロジットの `exp` は `inf` にオーバーフローし、行は `nan` になります。先に各行の最大値を引くことは、数学的には何も変えず、数値的にはすべてを変えます。最大の指数が `exp(0)` になるからです。

```
input:  2 3
        1 2 3
        1000 1000 1000
output: 0.09 0.2447 0.6652
        0.3333 0.3333 0.3333
```
'''
hints = [
  "x - x.max(dim=1, keepdim=True).values、それから exp、それから行の合計で割ります。",
  "max(dim=...) は値とインデックスを返します。欲しい半分は .values で、keepdim がブロードキャストを正直に保ちます。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.hacker.05.cross-entropy"
title = "交差エントロピーを書け"
story = "次は損失を書き、渡されたバッチでライブラリと小数点以下五桁まで一致させよ。"
brief = '''
一行目は `n c` です。続いて `c` 個のロジットからなる行が `n` 行、それから `n` 個のラベルの行。

あなたの交差エントロピーを小数点以下五桁に丸めて出力し、それから `nn.CrossEntropyLoss` と `1e-5` まで一致すれば `True` を出力してください。

バッチの交差エントロピーは、行についての `-log_softmax(logits)[row, label]` の平均です。そう書けば安定で、`gather` 一回で済み、それが彼らの欲しい答えです。`-log(softmax(x))` と書けば、隠しケースで `inf` を返す答えになります。

```
input:  2 3
        1 2 3
        3 1 0
        2 0
output: 0.28873 True
```
'''
hints = [
  "先に log_softmax、それから真のクラスを gather し、符号を反転して平均を取ります。",
  "デフォルトの reduction はバッチについての合計ではなく平均です — それがライブラリに一致させるもう半分です。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.hacker.06.one-hot"
title = "ヘルパーなしで"
story = "`F.one_hot` はなし、と面接官は言う。やり方は二つ、そして彼らが待っているのは scatter のほうだ。"
brief = '''
一行目は `n c` です。二行目は `n` 個のラベルです。

`n × c` の one-hot 行列を整数として、一行に一つの行で出力してください。

`zeros(n, c).scatter_(1, labels.unsqueeze(1), 1.0)` は各行のラベルの列に 1 を書き込みます。比較の形 — `labels.unsqueeze(1) == arange(c)` — はもう一つの認められる答えで、口頭で説明するならこちらのほうが楽です。

```
input:  3 4
        2 0 3
output: 0 0 1 0
        1 0 0 0
        0 0 0 1
```
'''
hints = [
  "torch.zeros(n, c).scatter_(1, y.unsqueeze(1), 1.0) — dim 1、インデックスは元と同じ形にします。",
  "y.unsqueeze(1) == torch.arange(c) は同じ行列を真偽値として返し、面接ではこちらのほうが読みやすいです。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.hacker.07.normal-equations"
title = "勾配降下法なし"
story = "訓練せずに直線を当てはめよ。最小二乗法には閉じた形があり、彼らはあなたがそれを知っているかを知りたい。"
brief = '''
一行目は `n d` です。続いて `d` 個の特徴量からなる行が `n` 行、それから `n` 個のターゲットの行。

`d + 1` 個の最小二乗係数 — `d` 個の重み、それから切片 — を、それぞれ小数点以下四桁に丸めて一行で出力してください。

切片は 1 の列を追加することから来て、解は `(XᵀX)⁻¹Xᵀy` です。逆行列を作らずにそれを行う `torch.linalg.lstsq` を使ってください。バイアスの列がある限り、面接官はどちらでも受け入れます。

```
input:  3 1
        0
        1
        2
        1 3 5
output: 2.0 1.0
```
'''
hints = [
  "torch.cat([x, torch.ones(n, 1)], dim=1) で 1 の列を追加します — その列が切片です。",
  "torch.linalg.lstsq(xb, y.unsqueeze(1)).solution — 右辺には行列を欲しがります。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.hacker.08.kmeans-step"
title = "一回の反復"
story = "割り当て、平均し、何が変わったかを言え。彼らが欲しいのはライブラリではなくループの本体だ。"
brief = '''
一行目は `n k d` です。続いて `d` 個の浮動小数点数からなる点が `n` 個、それから `d` 個の浮動小数点数からなるセントロイドの行が `k` 行。

一行目に各点の割り当てを出力し、それから更新した `k` 個のセントロイドを、一行に一つ、小数点以下四桁に丸めて出力してください。点を持たないセントロイドは古い位置のままです。

一回の反復とは: ブロードキャストによる距離、割り当てのための `argmin`、そしてクラスタごとのマスク付き平均です。

```
input:  4 2 1
        0
        1
        10
        11
        0
        10
output: 0 0 1 1
        0.5
        10.5
```
'''
hints = [
  "(x.unsqueeze(1) - c.unsqueeze(0)) は (n, k, d) です。二乗し、最後の軸を足し、k について argmin を取ります。",
  "空のクラスタには平均がありません — それを守らないと、セントロイドは nan になって二度と回復しません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.hacker.09.iou"
title = "どれだけ重なっているか"
story = "検出ボックスと、予測が数に入るかどうかを決める指標。ゼロでのクランプは、人が忘れる行だ。"
brief = '''
一行目は `n m` です。続いて `n` 個のボックスと `m` 個のボックスが、それぞれ `x1 y1 x2 y2` として並びます。

`n × m` の IoU 行列を、小数点以下四桁に丸め、一行に一つの行で出力してください。

共通部分は各軸での二つの区間の重なりで、**ゼロでクランプ** します — 触れていない二つのボックスは負の幅を返し、クランプがないと負と負の積が正で出てきて、指標はそこにない重なりを黙って報告します。

```
input:  2 1
        0 0 2 2
        1 1 3 3
        0 0 2 2
output: 1.0
        0.1429
```
'''
hints = [
  "左上は二つの角の要素ごとの最大値、右下は最小値です。それから (rb - lt).clamp(min=0)。",
  "和集合は areaA + areaB - intersection です — それを引かないと、すべての重なりが過小に評価されます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.hacker.10.nms"
title = "一つのものに一つだけ"
story = "ラックの扉一枚にボックスが九つ、そして検出器はラックの扉が九枚あると確信している。"
brief = '''
一行目は `n thr` です。続いて `x1 y1 x2 y2 score` の行が `n` 行。

非最大値抑制で残ったインデックスを、残った順に、空白区切りで出力してください。何も残らなければ空の行を出力します。

NMS は貪欲です: スコアが最も高いボックスを取り、それを残し、それとの IoU が `thr` **より大きい** 残りのボックスをすべて落とし、繰り返します。ちょうどしきい値のボックスは生き残ります。

```
input:  3 0.5
        0 0 2 2 0.9
        0 0 2 2 0.8
        5 5 7 7 0.7
output: 0 2
```
'''
hints = [
  "スコアの降順に並べ、最良のものを取り出し、残りをそれとの IoU で絞り込み、繰り返します。",
  "抑制の比較はしきい値より厳密に大きいかどうかなので、ちょうど thr のボックスは残ります。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "pytorch.hacker.11.dropout"
title = "ドロップアウトを書け"
story = "ドロップアウトを書け、と彼らは言い、それから: 推論時には何をする? 本当の問いは二つ目だ。"
brief = '''
一行目は `n p seed` で、`p` は落とす確率です。

生き残った割合と出力の平均を、それぞれ小数点以下 **一** 桁に丸めて出力し、期待値が保たれていれば — つまり、生き残った要素が `1/(1-p)` でスケールされていれば — `True` を出力してください。

一桁なのは、正確な抽選は生成器の都合であって問題の都合ではないからです: 確かめているのは、割合 `p` を捨てた後でも出力の平均がやはり 1 であることです。

これは **逆** ドロップアウトで、どのフレームワークも実装しているものです: スケーリングは訓練中に行われるので、推論はただの恒等写像で、覚えておくことも切ることも何もありません。

```
input:  1000 0.5 0
output: 0.5 1.0 True
```
'''
hints = [
  "訓練の経路で (1 - p) で割ります。それがドロップアウトと、ただゼロにすることとの違いのすべてです。",
  "スケーリングがないと活性は (1 - p) 倍に縮み、推論時には下流のすべての層が間違ったスケールを見ます。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "pytorch.hacker.12.gelu"
title = "トランスフォーマーの中のもの"
story = "ブロックの中の MLP は ReLU もシグモイドも使っておらず、候補者は実際に使っているものを書くよう求められる。"
brief = '''
一行目は `n` です。二行目は `n` 個の浮動小数点数です。

あなたの厳密な GELU を小数点以下四桁に丸めて出力し、それから `nn.GELU()` と `1e-5` まで一致すれば `True` を出力してください。

厳密な GELU は `x · Φ(x)` で、`Φ` は標準正規分布の CDF です: `0.5 · (1 + erf(x/√2))`。`tanh` の形は近似で、デフォルトとは `1e-5` まで一致 **しません**。それがこの問題の罠です。

```
input:  3
        -1 0 1
output: -0.1587 0.0 0.8413 True
```
'''
hints = [
  "x * 0.5 * (1 + torch.erf(x / 2 ** 0.5)) — torch.erf は誤差関数です。",
  'nn.GELU(approximate="tanh") はもう一つのほうです。デフォルトは厳密なもので、一致させなければならないのはそちらです。',
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "pytorch.hacker.13.rmsnorm"
title = "平均はまったくなし"
story = "新しいモデルは中心化の手順を落とし、より少ない算術で同じ結果を得た。彼らが残したほうを書け。"
brief = '''
一行目は `n d` です。続いて `d` 個の浮動小数点数からなる行が `n` 行。

正規化した各行を、小数点以下四桁に丸め、一行に一つずつ出力してください。

RMSNorm は行の二乗平均平方根で割り、平均を引くことは **しません**: `x / sqrt(mean(x²) + eps)`。`eps = 1e-6` を使ってください。それが LayerNorm との違いのすべてで、だからこちらのほうが安いのです。

```
input:  2 4
        1 1 1 1
        0 0 0 2
output: 1.0 1.0 1.0 1.0
        0.0 0.0 0.0 2.0
```
'''
hints = [
  "x.pow(2).mean(dim=-1, keepdim=True)、それから sqrt — keepdim なので、行全体に向けてブロードキャストし直されます。",
  "平均の引き算もバイアスもありません。すべて 1 の行は、すべて 1 の行として出てきます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.hacker.14.sinusoidal"
title = "パラメータなしの位置"
story = "元の論文の位置エンコーディング: 表なし、訓練なし、そして誰かが見せた最長の系列を越えても伸びていく。"
brief = '''
一行目は `t d` で、`d` は偶数です。

`t × d` の正弦波位置エンコーディングを、小数点以下四桁に丸め、一行に一つの行で出力してください。

偶数列は `sin(pos / 10000^(2i/d))`、奇数列は同じ引数の `cos` で、`i` は組のインデックスです。したがって位置 0 は `sin(0), cos(0), sin(0), cos(0), …` — ゼロと一が交互に並ぶ行で、最初にやっておく価値のある確認です。

```
input:  2 4
output: 0.0 1.0 0.0 1.0
        0.8415 0.5403 0.01 0.9999
```
'''
hints = [
  "周波数は arange(0, d, 2) の i について 1 / 10000 ** (i / d) です — 列ごとではなく、組ごとに一つ。",
  "pe[:, 0::2] と pe[:, 1::2] が偶数列と奇数列です。どちらも同じ (t, d/2) の引数を取ります。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.hacker.15.label-smoothing"
title = "決して完全には確信しない"
story = "モデルは正しく、とてつもなく自信過剰で、較正プロットは崖になっている。"
brief = '''
一行目は `n c eps` です。続いて `c` 個のロジットからなる行が `n` 行、それから `n` 個のラベルの行。

平滑化したあなたの損失を小数点以下五桁に丸めて出力し、それから `nn.CrossEntropyLoss(label_smoothing=eps)` と `1e-5` まで一致すれば `True` を出力してください。

ラベル平滑化は one-hot のターゲットを、真のクラスに `1 - eps`、そして **すべての** `c` クラスに広げた `eps / c` で置き換えます — 真のクラスも含めて。それが、あなたの数がライブラリのものと一致するかどうかを決める細部です。

```
input:  2 3 0.1
        1 2 3
        3 1 0
        2 0
output: 0.42206 True
```
'''
hints = [
  "(1 - eps) * nll + eps * (-logp.mean(dim=1)) — 二つ目の項が一様な部分で、すべてのクラスにわたります。",
  "すべての c クラスに広げた eps / c は、まさに行全体の -log_softmax の平均です。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.hacker.16.focal"
title = "簡単なものは数えなくなる"
story = "背景のパッチが一万、本物が四十、そして損失は、モデルがもう正解している背景だけでできている。"
brief = '''
一行目は `n gamma` です。二行目は二値問題の `n` 個のロジットです。三行目は `n` 個のラベルで、それぞれ 0 か 1 です。

平均フォーカル損失を小数点以下五桁に丸めたものと、ただの二値交差エントロピーの平均を小数点以下五桁に丸めたものを出力してください。

フォーカル損失は `-(1 - p_t)^γ · log(p_t)` で、`p_t` はモデルが **真の** ラベルに与えた確率です。確信を持った正しい予測は `p_t` が 1 に近いので、`(1 - p_t)^γ` はゼロに近く、寄与しなくなります。

```
input:  2 2.0
        4 -4
        1 0
output: 0.00001 0.01815
```
'''
hints = [
  "torch.where(y > 0.5, p, 1 - p) が p_t — どちらであれ真のラベルの確率です。",
  "gamma = 0 だとフォーカル損失はただの BCE に戻ります。最初に走らせるべき確認です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.hacker.17.grad-accumulation"
title = "収まらないバッチ"
story = "論文のバッチサイズは 512 で、カードに収まるのは 128。答えは逆伝播四回とステップ一回、そして誰もが忘れる割り算だ。"
brief = '''
`k` 個のマイクロバッチにわたって勾配を蓄積し、一回ステップするのは、一つの大きなバッチと等価です — 各マイクロバッチの損失を先に `k` で割る **ならば**。割り算がないと勾配は `k` 倍大きすぎ、実効的な学習率が黙って何倍にもなります。

一行目は `n k` です。続いて `n` 個の浮動小数点数で、それぞれ一つのサンプルです。

蓄積した勾配とバッチ全体の勾配を、それぞれ小数点以下六桁に丸めて出力し、`1e-6` まで一致すれば `True` を出力してください。

```
input:  4 2
        1 2 3 4
output: 2.5 2.5 True
```
'''
hints = [
  "各マイクロバッチの損失を、その逆伝播の前に k で割ります。",
  "これが成り立つのはマイクロバッチが同じ大きさだからです。最後のバッチが短ければ、サンプル数で重み付けしなければなりません。",
]

