[[quest]]
id    = "go.hacker.06.rotated"
title = "折り返す路線"
story = "港島線の時刻表は間違った駅から始まって折り返している。それでも対数時間の検索を求められる。"
brief = '''
一行目は `n target` です。二行目は `n` 個の相異なる整数: 昇順に並べたあと、
ある量だけ (ゼロかもしれません) 左に回転させたリストです。

`target` の **1 始まり** のインデックスを出力し、なければ `-1` を出力してください。
次に `PIVOT <p>`、最小値の 1 始まりのインデックスを出力します。

```
input:  7 0
        4 5 6 7 0 1 2
output: 5
        PIVOT 5
```

二分探索を二回、あるいは巧妙なものを一回。どちらにせよ、線形走査は別の問題の
答えです。
'''
hints = [
