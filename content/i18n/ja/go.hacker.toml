# ---------------------------------------------------------------- 20
[[quest]]
id    = "go.hacker.20.lis"
title = "最長の上り"
story = "また一年分の日々の売上。今度は改善が続く最長の日の並びを求めていて、連続している必要はない。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **正確に** この
生成器で、`uint64` の算術で自分で作ります。Go では何の儀式もなくラップします:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007
```

**狭義に増加する** 最長の部分列の長さを出力してください — 順序は保ちますが、隣り
合っている必要はありません。次に `TAILS <k>`、山の数から読み取った同じ数を出力します。

```
input:  8 1
output: 3
        TAILS 3
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
で、その中の `93944146 392341189 822192870` が最長の登りのひとつです。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 200000` です。
`O(n²)` の表 — どの値についても、それより前の値をすべて見返す — は、そらで書けるように
しておくべきものであり、スターターがまさにそれです: `2 × 10^10` 回の比較、五秒の実行
制限に対して三十九秒。山のやり方は、各長さについて、その長さの部分列が終われる最小の
値を保ちます — 常にソートされたスライスなので、新しい値の置き場所は二分探索です。
これは `O(n log n)` で、同じケースを十一ミリ秒で返します。このマシンで、この課題の
二つのプログラムで測りました。

そのケースの答えは `881`、だいたい `2√n` です。ランダムな値のリストにおける最長の
登りとはそういうものであり、部屋に持ち込む価値があります: 面接官に言われる前に、
自分の出力が出鱈目でないと分かる方法だからです。
'''
hints = [
  "tails は部分列ではありません。その長さが答えで、中身は最良の末尾の値に過ぎません。",
  "狭義増加とは、value 以上である最初の tail を置き換えることなので、探索条件は tails[mid] < value です。",
  "tails の終端を越えたら、この値はこれまでの最長の並びを伸ばします — append してください。",
]

