[[quest]]
id    = "go.hacker.07.anagrams"
title = "同じ文字"
story = "文字を揺すってばらばらにした停留所名のページ。同じ名前のものをまとめる。"
brief = '''
一行目は `n` です。二行目はスペース区切りの `n` 個の小文字の単語です。

互いにアナグラムである単語をグループにまとめてください。各グループを一行に、
単語を昇順に並べて単一スペースでつないで出力します。グループはその先頭の単語の
昇順に並べます。次に `GROUPS <k>` を出力します。

繰り返された単語は、そのグループに二回入ったままです。

```
input:  6
        eat tea tan ate nat bat
output: ate eat tea
        bat
        nat tan
        GROUPS 3
```

キーは文字を並べ替えた単語です。二つの単語がアナグラムであるのはキーが等しいとき
にほかならず、それはこれまで見たすべてとの比較ではなく、マップの検索です。
'''
hints = [
  "[]byte(word) を sort.Slice して string(...) に戻せばキーになります。",
  "groups[k] への append は無いキーでも動きます: スライスのゼロ値は nil で、append は nil を扱えます。",
  "つないだ行を並べ替えれば先頭の単語で並びます。各行は先頭の単語で始まるからです。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.hacker.08.kth-largest"
title = "k 番目に大きいもの"
story = "ウォームアップの回。それでもソートではなくヒープを求めてくる。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力にリストはありません — **正確に** この
生成器で、`uint64` の算術で自分で作ります。Go では何の儀式もなくラップします:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

k = n / 2 + 1
```

この割り算は整数除算なので、`n` がどれだけ小さくても `1 <= k <= n` です。

`k` 番目に大きい **値** を出力してください — 重複も数えるので、`3 3 1` では 2 番目に
大きい値は `3` です。次に `HEAP <size>`、終わった時点で保持していた要素数を出力します。

```
input:  8 1
output: 189567123
        HEAP 5
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
で、`k` は `5` です。大きい方から五つは
`908834774 822192870 708211027 392341189 189567123` なので、答えはその最後の値で、
止まった時点で五つの値を保持しています。

**大きいケースが強制するもの、そしてしないもの。** 隠しケースのひとつは
`n = 200000` で、そこでの `k` は `100001` です。これはリスト全体を `k` 回走査して
最大値を取り続ける答えを拒否します: それは `O(nk)`、`2 × 10^10` 回の比較、五秒の実行
制限に対して四十五秒であり、スターターがやっていることです。一方で、リスト全体を
ソートする答えは拒否**しません** — `n log n` は速く、ソートでも余裕で通ります。
ソートを書いたならそう口に出して言ってください。時計が拒否したふりをするより
ずっとましです。

面接官が聞きたい答えは **サイズ k の最小ヒープ** です: 各値を push し、ヒープが `k`
を超えたら pop する。最後に根が答えです。これは `O(n log k)` で、`n` ではなく `k` 個の
値だけを保持し、大きいケースを二十五ミリ秒で返します。どちらの数字も、このマシンで、
この課題の二つのプログラムで測りました。

`container/heap` はスライス型に対する五つのメソッドです: `Len`、`Less`、`Swap`、
`Push`、`Pop`。`Push` と `Pop` はポインタレシーバを取り、他の三つは取りません。その
非対称性こそ、時計の下で誰もが間違えるところです。
'''
hints = [
  "Push と Pop は生のスライス操作です — append と末尾の切り落とし。ふるい分けるのは heap.Push と heap.Pop の方です。",
  "h.Push を直接呼んではいけません。heap.Push(h, v) を呼んでください。さもないとヒープの不変条件が回復しません。",
  "ループのあと、上位 k 個のうち最小のものがインデックス 0 にあり、それが全体の k 番目に大きいものです。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.hacker.09.linked-list"
title = "鎖"
story = "スライスなしで書けと言われる。ノードがノードを指す形。この問題が本当に問うているのはその形だから。"
brief = '''
一行目は `n` です。二行目は `n` 個の整数で、順番どおりです。

それらから `*Node` の単方向連結リストを作り — 答えにスライスは使いません —
それから三行を出力してください:

1. リストを逆順に、スペース区切りで
2. 真ん中のノードの値 (`n` が偶数なら、二つのうち後の方)
3. リストを歩いて数えた `LEN <n>`

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

真ん中はランナーで見つけます: 一歩ずつ進むポインタと二歩ずつ進むポインタ。速い方が
尽きたとき、遅い方がそこにいます。一回の走査で、しかも同じ二つのポインタが、
もし尋ねられれば循環も検出します。
'''
hints = [
  "後ろから前へ組み立てるのが楽な向きです: 新しいノードはそれぞれ古い head を自分の Next にします。",
  "上書きする前に cursor.Next を保存してください。さもないとリストの残りが消えます。",
  "fast が二歩進むごとに slow を一歩進めます。fast か fast.Next が nil になったら止めます。",
]

