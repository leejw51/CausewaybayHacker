[[quest]]
id    = "go.hacker.05.brackets"
title = "どこで壊れたか"
story = "プロジェクターに設定ファイルが映り、面接官は壊れているかではなく、どの文字が壊したのかを尋ねる。"
brief = '''
`(`、`)`、`[`、`]`、`{`、`}` だけからなる一行です。

すべての括弧が正しい順序で同じ種類のもので閉じられていれば、`VALID` と、その次に
`0` を出力してください。

そうでなければ `INVALID` と、その次に問題の文字の **1 始まりのインデックス** を
出力します:

* 開いているものと一致しない閉じ括弧 — その閉じ括弧自身のインデックス
* 何も開いていないのに現れた閉じ括弧 — その閉じ括弧自身のインデックス
* 行の終わりでまだ開いているもの — 最後まで開いたままの括弧のインデックス

```
input:  ([]{})
output: VALID
        0
```
'''
hints = [
  "各開き括弧は文字ではなくインデックスを push してください — 報告するのに必要なのはインデックスです。",
  "閉じ括弧が間違いなのは、スタックが空のとき、あるいは先頭のインデックスにある文字がその相方でないときです。",
  "ループが終わってスタックに何か残っていれば、その先頭が最後の閉じられていない括弧です。",
]

