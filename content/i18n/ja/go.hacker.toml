[[quest]]
id    = "go.hacker.03.intervals"
title = "シフトの当番表"
story = "またラッキーマックの当番表。問いは相変わらず、実際にどの時間帯が埋まっているか。"
brief = '''
一行目は `n` です。続く `n` 行は `<start> <end>` で、`start <= end` です。

重なるか接する組をすべて併合し、結果を昇順に、一行に `<start> <end>` ひとつずつ
出力し、次に `COUNT <k>` を出力してください。

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

接するものは重なるものとして扱います: `1 4` と `4 5` は `1 5` に併合されます。
'''
hints = [
  "まず start で並べ替えてください。そのあとは左から右への一回の走査で足ります。",
  "merged[last].end がアドレス可能なのは、merged がポインタではなく構造体のスライスだからです — 直接代入してください。",
  "二つの end の大きい方まで伸ばしてください。長い区間の内側の短い区間が、それを縮めてはいけません。",
]

