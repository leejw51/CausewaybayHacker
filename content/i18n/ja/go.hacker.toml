[[quest]]
id    = "go.hacker.10.tree-walk"
title = "木をめぐる三つの道"
story = "ホワイトボードに木がひとつ。二度と考え込むべきでない問い: 三つの順序を名指しせよ。"
brief = '''
一行目は `n` です。二行目は **レベル順** の `n` 個の値で、`-1` は「ここにノードなし」を
意味します — つまり木はヒープと同じ方法で格納され、インデックス `i` の子は `2i+1` と
`2i+2` です。

四行を出力してください: **行きがけ順**、**通りがけ順**、**帰りがけ順** の走査を
それぞれスペース区切りで、次に `DEPTH <d>` — 根から葉までの最長経路上のノード数です。

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

行きがけ順はノード、左、右。通りがけ順は左、ノード、右。帰りがけ順は左、右、
ノード。ひとつの再帰関数が三つすべてをこなし、動くのは append の位置だけです。
'''
hints = [
  "out が *[]int64 なのは append が再割り当てするかもしれないからです — ただの []int64 引数では書き込みが失われます。",
  "基底ケースは二つの条件を同時に見ます: スライスの終わりを越えたか、-1 の上にいるか。",
  "深さは 1 + 深い方の子で、無いノードは 0 です。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.hacker.11.bst"
title = "本当に BST か"
story = "続きの問題。誰もが二つの子だけを確かめ、誰もが最初は間違える。"
brief = '''
前の課題と同じレベル順のエンコーディングです: `-1` は無いノード、`i` の子は `2i+1` と
`2i+2` です。

一行目は `n q` です。二行目は `n` 個の木の値です。三行目は `q` 個の問い合わせの
値です。

`VALID` か `INVALID` を出力してください — 左部分木のすべての値がノードより厳密に
小さく、右のすべての値が厳密に大きいこと。次に問い合わせごとに一行:
根を深さ 1 として `<value> FOUND <depth>`、または `<value> ABSENT`。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

各ノードで `left < node < right` を確かめるだけでは **足りません** — 左部分木の
深いところにある値が、先祖より大きいことはありえます。代わりに開区間を下へ
運んでください。

検索は **BST の降下** であって、木全体の探索ではありません: 根から始めて、目標が
小さければ左へ、大きければ右へ進み、落ちたら止まります。`INVALID` な木では、
その降下は配列の中に確かにある値の横をまっすぐ通り過ぎることがあります — それでも
`ABSENT` と報告しなければなりません。BST の検索に許されるコストは降下だけだからです。
隠しケースのひとつがまさにその木です。
'''
hints = [
  "開区間を下へ渡してください。根は int64 の全範囲を受け取り、左の子は (low, node)、右の子は (node, high) を受け取ります。",
  "無いノードは空虚に妥当です — 基底ケースは true を返します。",
  "検索は二分探索です: 小さければ左、そうでなければ右、深さはたどったホップ数です。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.hacker.12.heap"
title = "k 本の整列済みキュー"
story = "ラッキーマックの各支店は伝票を整列済みで送ってくる。全部をもう一度並べ替えずに、一本の列に併合する。"
brief = '''
一行目は `k` です。続いて `k` 行で、各行は個数と、それに続くその個数の整数で、
すでに昇順に並んでいます。

すべてを一本の昇順の行に併合してスペース区切りで出力し、次に `POPS <total count>`
を出力してください。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

ヒープは要素ごとではなくリストごとにひとつのエントリを保持するので、リストが
どれだけ長くてもサイズ `k` のままです。各エントリはどのリストから来たかを覚えて
いなければなりません。さもないと pop したあとに補充できません。

`container/heap` はスライス型に対する五つのメソッドです。`Len`、`Less`、`Swap` は
値レシーバを取り、`Push` と `Pop` は長さを変えるのでポインタレシーバを取ります。
'''
hints = [
  "heap.Pop は any を返すので、entry への型アサーションはイディオムの一部です。",
  "種を入れるとき空のリストは飛ばしてください。さもないと最初の pop がどれかの終端を越えて読みます。",
  "リストの次の要素を push するのは、そのリストの要素をひとつ pop したときだけです — それがヒープを k に保ちます。",
]

