```

配達員をスコアの **降順** に並べ替えてください。同じスコアの配達員は到着した順序を
保たなければなりません。そのインデックスをスペース区切りで出力し、次に `TIES <k>` —
並べ替えた順序で隣り合う組のうちスコアが等しいものの数を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ完全に同点の扱いで決まります。

**これは自分がどのソートを握っているかを知る課題です。** `sort.SliceStable` は
安定です — 等しい要素は相対順序を保ちます。`sort.Slice` は安定 **ではなく**、本物の
入力では目に見えてそうなります: これは pattern-defeating quicksort で、たいてい速く、
同点について何の約束もしません。スターターはそれを使っていて、隠しケースはそれが
実証的にかき混ぜるほど大きいです。(`n = 8` ではたまたまそうならず — だから小さな
テストでは何も証明できなかったはずで、だからここでは小さなケースが判定するものでは
なく *見える* ものになっているのです。)

正しい答えは二つあり、両方を言えるべきです。`sort.SliceStable` を使う。**あるいは**
`sort.Slice` のまま比較を **全順序** にする — スコアが等しいときはインデックスを比べ、
等しいと比較される二つの要素が決してないようにして、安定性が問題でなくなるように
します。既定で手を伸ばすべきは二つ目です。順序が完全に指定されているなら、不安定な
ソートに証明すべきことは何もありません。

現代的な綴りは `slices.SortFunc` と `slices.SortStableFunc` で、その比較は `bool` の
代わりに負の数、ゼロ、正の数を返します — ちょうど `-1`、`0`、`1` をくれるのが
`cmp.Compare` です。リフレクションではなくジェネリックなので速く、同じ安定性の
区別が同じ二つの名前で当てはまります。両方知っておいてください — このパックが `sort`
と書くのは、あなたが渡されるたいていの Go で読むことになるのがそれだからです。
'''
hints = [
  "一語: sort.Slice を sort.SliceStable にする。それが安定な答えです。",
  "もう一つの答えは sort.Slice のまま、スコアが等しいときにインデックスを比べます — 全順序なので、不安定になりうる同点が残りません。",
  "TIES は完成した順序で隣り合う等しいスコアを数え、その数は二つのどちらを書いても同じです — 正体を明かすのはインデックスの順序の方です。",
]

