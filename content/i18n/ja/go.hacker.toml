[[quest]]
id    = "go.hacker.28.lru"
title = "時計"
story = "同じ部屋、最後の問題。壁の時計は、彼らがより短いものに取り替えた方だ。"
brief = '''
一行目は `cap q` です。続く `q` 行は `PUT <key> <value>` か `GET <key>` です。

満杯のときに **最も長く使われていない** エントリを追い出す、固定容量のキャッシュを
実装してください。`GET` も `PUT` もキーを使ったことに数えます。

各 `GET` について値を出力し、なければ `-1` を出力します。最後に生き残ったキーを、
最近使われたものから順にスペース区切りで — キャッシュが空なら `-` を — 出力し、
次に `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルをたどってください: `GET 1` が `1` を再び最近のものにするので、`PUT 3` が
場所を必要とするときに出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たり、
`3` を最も最近のものにします。だから生き残りは `3 1` と出力されるのです。

教科書の答えはハッシュマップから **双方向連結リスト** へで、Go は標準ライブラリに
それを持っています: `container/list` です。`PushFront`、`MoveToFront`、`Back`、
`Remove` はすべて O(1) なので、ここでのすべての操作は O(1) で、濁さずにそう言えます。
マップは `*list.Element` を保持し、要素の `Value` は値だけでなくキーも保持します。
追い出しはリストから始まり、どのマップエントリを削除するかを知らなければならない
からです。
'''
hints = [
  "要素の Value はキーを運ばなければなりません。さもないと末尾からの追い出しが削除すべきマップエントリを見つけられません。",
  "すでにあるキーの上書きは追い出しではありません — キャッシュが満杯だと判断する前にマップを確認してください。",
  "Front から Back へ歩けばすでに最近のものが先なので、最後の行に並べ替えは要りません。",
]
