title = "街区はいくつ"
story = "ホワイトボードに近所の図面。街区を数え、それからどれがいちばん大きいかを答える。"
brief = '''
一行目は `r c` です。続く `r` 行が図面で、`#` は建物、`.` は通りです。

二つの `#` のマスは、上下左右で接していれば同じ街区です — 斜めは含みません。

街区がいくつあるか、次にいちばん大きい街区が何マスかを出力してください。
空の図面は `0` と `0` です。

```
input:  4 5
        ##...
        ##...
        ..#..
        ...##
output: 3
        4
```

すべてのマスを一度ずつ歩いてください。未訪問の `#` を見つけたら、そこからキューで
街区全体を塗りつぶし、歩きながら数えます。
