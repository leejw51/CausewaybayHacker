# GO LAND — HACKER, in Japanese. A translation pack (SPEC §12.1): the prose of
# `content/go/hacker.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.hacker"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.hacker.01.two-sum"
title = "ふたつの運賃"
story = "同じ部屋、同じ最初の問題。今回は Go で書けと言われる。"
brief = '''
一行目は `n target` です。二行目は `n` 個の整数です。

合計が `target` になる、相異なる二つの要素の **1 始まり** のインデックス `i j` を、
`i < j` となる `i j` の形で出力してください。複数の組が該当するなら、二つ目の
インデックスが最小のものを選びます。それでも同点なら、一つ目のインデックスが
最小のものです。該当する組がなければ `-1` を出力します。

```
input:  4 9
        2 7 11 15
output: 1 2
```

ここの隠しケースは小さく、速さではなく同点の決着と答えなしの場合を検査します。
それでも問題は線形のものです — 一回の走査、ひとつのハッシュマップ — 本物の `n` は
200000 で、二重ループこそがこの問題がふるい落とすために存在するものだからです。
たまたまこの四つのケースを通る答えではなく、問題が求めている答えを書いてください。
'''
hints = [
  "一回の走査。各値について、target からそれを引いたものがすでに見えたかをマップに尋ねます。",
  "繰り返し現れる値は最初のインデックスだけを記録してください — それが問題文の求める同点の決着です。",
  "comma-ok 形式がイディオムのすべてです: i, ok := seen[k]。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.hacker.02.window"
title = "最短の区間"
story = "何駅連続で乗ればその距離を超えるか。求められているのは駅の数、そしてどこから始まるか。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **正確に** この
生成器で、`uint64` の算術で自分で作ります。Go では何の儀式もなくラップします:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

s = (sum of all n values) / 2
```

この割り算は整数除算です。そして答えが必ず存在する理由でもあります — 配列全体は
作り方からして `s` に届くからです。

合計が `s` 以上になる最短の連続区間を見つけてください。その長さ、次にその
1 始まりの開始インデックスを出力します。同じ長さの区間が複数あれば、いちばん左の
ものを取ります。

```
input:  8 1
output: 3
        3
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
です。合計は `3330417819` なので `s` は `1665208909` で、インデックス `3` から
始まる三つの値がそこに届く最短の区間です。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 500000` です。
スターターは正直な二乗の答え — どの開始位置からも合計が `s` に届くまで前に歩く —
で、`s` は合計の半分ですから、その歩きはどれも約 `n / 2` 要素分あります。`10^11` 回
規模の加算で、五秒の実行制限に対して三十八秒かかります。両端が右にしか動かない
やり方は `O(n)` — 各要素は一度足され、一度取り除かれます — で、同じケースが七ミリ秒で
返ってきます。このマシンで、この課題の二つのプログラムで測りました。

ケースが `200000` ではなく `n = 500000` なのは、内側のループが早期脱出つきの加算
ひとつで、コンパイラがまさにそれを得意とするからです。`200000` では二乗の答えでも
まだ六秒に収まってしまい、関門にするには制限に近すぎます。

合計はそのサイズで `2.5 × 10^14` 前後になります。`int64` で足し込んでください。この
64 ビットビルドでは Go の `int` は 64 ビットなので素の `int` でも切り抜けられます。
だからこそ、その習慣はコンパイラではなく自分から出てこなければなりません。
'''
hints = [
  "累計を保ってください。nums[right] は一歩につき一度だけ足し、決して計算し直しません。",
  "いちばん左の要素を落としてもウィンドウが s 以上のままであるあいだ、左から縮めてください。",
  "厳密に短い区間のときだけ新しい最良を記録してください。そうすれば各長さについていちばん左のものが残ります。",
]

