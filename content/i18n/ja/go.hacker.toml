# ---------------------------------------------------------------- 29
[[quest]]
id    = "go.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまでクリアしたマップはどれもホップ数を数えていた。トラムは停留所がいくつあるかは気にしない。どれだけ時間がかかるかを気にする。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所、`m` 本の無向の重み付き辺。グラフは
**正確に** この生成器で、`uint64` (Go では何の儀式もなくラップします) で自分で
作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達可能なすべての停留所への最短距離の合計 (`0` 自身も含み、それは
`0` です) を出力し、次に `MAX <そのうち最大のもの>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 100000`、`m = 200000`
です。どちらにせよ Dijkstra が正しいアルゴリズムで、時計が決めるのは優先度付き
キューです。未訪問のノードすべてを走査して最小を探すのは `O(V²)` — `10^10` 回の
比較で、五秒の実行制限に対して十六秒かかります。二分ヒープなら `O((V + E) log V)`
になり、同じケースが四十四ミリ秒で返ってきます。どちらもこのマシンで、この課題に
入っている二つのプログラムで測りました: スターターは走査版で、正しい答えを出します —
ただ三倍遅すぎるだけです。

`{dist, node}` のスライスに対する `container/heap` を、`dist` で順序付けます。
decrease-key はなく、要りません: 改善された距離を新しいエントリとして push し、
pop したエントリの距離が記録済みのものよりすでに悪ければ飛ばします。その古い
エントリの読み飛ばしが、人が忘れる一行です。
'''
hints = [
  "Less が dist を比べるので、container/heap はそのまま最小ヒープを与えます — Rust の BinaryHeap と違って Reverse は要りません。",
  "`if cur.dist > dist[cur.node] { continue }` が古いエントリの読み飛ばしです。無くてもアルゴリズムは正しいままですが、ヒープが陳腐なエントリで膨れます。",
  "生成器の全域木の半分がすべてのノードの到達可能性を保証するので、inf のフィルタは何も取り除きません — それでも残してください。到達不能ノード版が続きの問いだからです。",
]

