hints = [
  "マスは pop したときではなく push したときに訪問済みにしてください。さもないと同じマスが何度もキューに入ります。",
  "ここでは queue = queue[1:] で十分な dequeue です — 街区がひとつ終われば背後の配列は捨てられます。",
  "grid[r][c] は文字列へのインデックスなのでバイトです: \"#\" ではなく '#' と比べてください。",
]

