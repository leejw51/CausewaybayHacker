[[quest]]
id    = "go.hacker.30.range-queries"
title = "変わり続ける合計"
story = "チェーン全体の一日分、四百万件のレジ操作。半分は訂正で、誰かが累計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の操作を走らせ
ます。すべて同じ生成器からです:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r] inclusive) to a running total
```

すべての問い合わせの答えの累計を出力し、次に `UPDATES <k>` を出力してください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制されます。そしてそれには手間がかかりました。** 素朴な答え —
問い合わせごとに範囲をループする — は問い合わせあたり `O(n)` で、コンパイラは
そのループを驚くほど速いものに変えます。小さなケースでは捕まえられません。だから
大きな隠しケースは `n = 500000, q = 4000000` で、そこでは素朴な答えは `10^11` の
オーダーの要素に触れ、五秒の実行制限の中では終わりません。一方 Fenwick 木は
全体を十分の一秒ほどでこなします。どちらも、この課題の二つのプログラムで測りました。

*一点更新、範囲和* は Fenwick 木がそのために存在するまさにその形です。短い三つの
メソッド — add、prefix、そして二つの prefix の差としての range — で、`i & -i` が
最下位の立っているビット分だけ進む方法です。
'''
hints = [
  "初期値ごとに Add を一回呼んで木を作ってください。O(n) のボトムアップ構築はきれいな最適化ですが、時計が試しているのはそれではありません。",
  "i & -i は最下位の立っているビットを取り出します。それを足せば木を上へ、引けば下へ歩きます。",
  "Range(l, r) は Prefix(r+1) - Prefix(l) で、そのオフバイワンの組を正しくすることがデバッグの大半です。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "go.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "上位二十に入る問題で、たいていの選考で何らかの形で出され、そして多くの人が一度は書いて、一度も理解していない問題。"
brief = '''
標準入力は `n alphabet seed` です。文字列は自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` — その長さのうち
**いちばん左** のものの 0 始まりの開始位置を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心から広げます。中心は `n` 個ではなく `2n - 1` 個です: すべての文字が奇数長の
回文の中心で、二文字のあいだのすべての隙間が偶数長のものの中心です。隙間を忘れる
ことが、正しそうに見える解が `abba` に `1` を返す理由です。

**テストが何を強制し、何を強制しないか**、はっきりと。仕事をする隠しケースは
**一** 文字のアルファベット上の `n = 20000` です。これは中心拡張法の最悪ケースで —
すべての中心が文字列の終わりまで走ります — だから正しい答えはそこで `O(n²)` を
まるごとこなし、それでも十分の一秒ほどで終わります。これはまた、`O(n³)` の答え、
すべての部分文字列を調べて一つずつ検査するやり方を退けるものでもあります: そちらは
五秒の制限に対して二十秒経ってもまだ走っています。

もうひとつの大きなケース、二文字のアルファベット上の `n = 20000` は **正しさ** の
ケースで、速さのケースではありません。ランダムなバイナリ文字列では回文の検査は
一、二文字で失敗するので、三乗の答えでさえ一秒未満で通ります。これはあなたの
生成器といちばん左のインデックスの決着が、大規模でも私たちのものと一致することを
確かめます。速かったかは確かめません。どちらの数字もこのマシンで測りました。

つまり: テストは三乗を退け、二乗を受け入れます。`O(n)` の答えである Manacher の
アルゴリズムは要求 **しません**。存在は知っておいてください。「で、二乗より速く
できる?」が、この問題がたいてい仕込みとして出される続きの問いだからです。
'''
hints = [
  "中心ごとに二回呼びます: 奇数長には (c, c)、偶数長には (c, c+1)。スターターには二つ目がありません。",
  "ループが止まったとき、i と j はどちらも回文の一つ外に動いています — だから開始は i+1 で、長さは j-i-1 です。",
  "厳密に長い回文のときだけ更新し、各長さについていちばん左のものを残してください。それが AT の求めるものです。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "go.hacker.32.modular"
title = "十億七を法として"
story = "問題文のいちばん下にその句があり、部屋の半分はそれが何をしろと言っているのか分からない。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを生成します:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて二項係数 `C(a, b)` を **1000000007 を法として** 計算して
ください。`q` 個の答えすべての合計を、それ自体も `1000000007` を法として出力し、
次に `LAST <最後の問い合わせの答え>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は数十万桁になるので、計算してから縮めることは決して
ありません — 掛け算のたびにその場で縮めます。問題は割り算です: `a! / (b! (a-b)!)`
は剰余算術では意味を持ちません。それに代わるのが **モジュラ逆元** で、`1000000007`
が素数なので、Fermat の小定理がそれをくれます: `inverse(v) = v^(p-2) mod p`、
三十回ほどの二乗による高速冪乗で計算します。

つまり: `factorial[0..n]` を一度だけ前計算し、各問い合わせには
`f[a] * inv(f[b]) * inv(f[a-b])` で答えます。

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 200000`、`q = 200000`
です。各係数を独立に計算する — `b` 個の項を掛け、`b` 個の項で割り、それぞれに
モジュラ逆元をひとつ — やり方は五秒の実行制限の中では終わりません。それが
スターターです。共有する階乗表ひとつなら、一秒をゆうに下回って終わります。
どちらもこのマシンで測りました。

すべての中間値は `2^30` 未満の二つの値の積なので、`int64` に収まり、何も
オーバーフローしません。ここでは Go の `int` は 64 ビットですが、`int64` と書き、
そう意図してください — どこか別の場所で走るこの問題の版は、そこまで寛大では
ないでしょう。
'''
hints = [
  "掛け算のたびに縮めてください。最後にではなく。int64 は P 未満の二つの値の積を保持できますが、階乗は保持できません。",
  "inverse(v) は power(v, P-2) で、P が素数だからこそ動きます — ここでの Fermat の小定理の中身はそれがすべてです。",
  "逆階乗も inverse(factorial[n]) から逆向きに前計算しておけば、問い合わせごとの二回の power 呼び出しがなくなります。通るのに必要ではありませんが、口に出して言う価値があります。",
]

