[[quest]]
id    = "go.hacker.33.grid-paths"
title = "街区を横切って、決して戻らない"
story = "竹の足場で三本の通りが閉じた配達グリッド。渡る道は何通りあり、どれがいちばん安いか。"
brief = '''
標準入力は `r c pct seed` です。グリッドは行優先の順序で、各セルにつき **二つ** の
値を引いて自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

開いたセルを通って **右** か **下** にだけ動きます。出力するのは:

1. `PATHS <k>` — `(0,0)` から `(r-1,c-1)` への相異なる経路の数、`1000000007` を
   法として
2. `MIN <cost>` — 両端を含めた経路の最小の総コスト、経路がなければ `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

行優先の順序での一回の走査が両方をこなします: セルの経路数は上と左からそこへ入る
経路数の和で、最良コストは自分のコストにその二つの安い方を足したものです。右か下に
しか動かないので、必要な二つのセルは常にもう終わっています — 再帰も、訪問済み集合も
要りません。

`PATHS` の数がいつもの理由で `1000000007` を法とするのは: `1000 × 1000` の隠し
ケースでは真の数は六百桁を超えるからです。足しながら縮めてください。

**大きなケースが強制するもの:** 経路を列挙する答えはすべて退けます。経路は部屋の
中の原子より多いのです。ボトムアップの表とメモ化再帰は区別しません — どちらもセル数に
対して線形で、どちらも余裕で通ります。
'''
hints = [
  "二つの角も含めて、すべてのセルで両方の値を引いてください — 生成器はそれらを飛ばすのではなく、塞ぐのを拒むだけです。",
  "上にも左にも開いた隣がない開いたセルは、ゼロ通りの経路で到達でき、最良コストを持ちません。inf を `到達不能` の意味に保ち、足し算を守ってください。",
  "目的地は開いていながら到達不能でありえて、それがまさに PATHS が 0 で MIN が -1 のときです。隠しケースのひとつがそれです。",
]

