[[quest]]
id    = "lua.basic.18.binary-tree"
title = "nil"
story = "廟の提灯の板の 23:59: 提灯の番号の木は下に何もない根が一つだけで、最初の引き当てが attempt to index a nil value (field 'left') で死ぬ。"
brief = '''
二分探索木は、小さい値をノードの左の部分木に、大きい値を右に持ちます。挿入は再帰です: 空の部分木（`nil`）は新しい `Node` になり、そうでなければ値は片側を下り、返ってきたものをもう一度その子として保存します。子はついさっきまで `nil` だったかもしれないからです — 無いキーは nil で、nil は辿られるまではエラーではありません。`nil` の `.left` を辿るのが、この道全体の名前の由来のクラッシュです。`nil` の検査が先で、それは書いてあります。

```
if v < n.val then
  n.left = insert(n.left, v)
else
  n.right = insert(n.right, v)
end
```

`Node`、`insert` の `nil` の場合とその `if v < n.val then` / `else` の骨組み、`inorder`、`height`、そして `main` は書いてあります。二つのプレースホルダーの代わりに、二つの再帰の行を示したとおりに打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if の下に n.left = insert(n.left, v)、else の下に n.right = insert(n.right, v)。",
  "代入こそが肝心です: insert は部分木の根を返し、子が nil だったときにはそれはまったく新しい Node です。新しい Node には left や right のキーがまったくありません — それを読めば nil で、その中を添字で引くまでは問題ありません。",
]
