[[quest]]
id    = "lua.basic.17.threads"
title = "十二の使い走りが一度に"
story = "太鼓の最初の連打で、龍に沿ったどの線香の使い走りも廟の帳面のために自分の節の数を同時に二乗するのに、誰も終わるのを待たなかったので、帳面はすべてゼロで返ってくる。"
brief = '''
LuaJIT にスレッドはありません。コルーチンがいちばん近いもので — 自分のスタックを持ち、resume されると走り、`yield` のたびに止まる関数です。`coroutine.create(f)` はそれを作り、何も走らせません。`coroutine.resume(co)` はそれを開始するか、最後の yield から続け、再び yield するか終わると戻ります。`coroutine.status(co)` は終わると `"dead"` になるので、join とはそうなるまで resume し続けることです。まずすべての使い走りを開始し、それからすべての使い走りを終わらせます — 開始のループの中で終わらせると、一人ずつ走らせることになります。

```
for _, co in ipairs(workers) do
  coroutine.resume(co)
end
for _, co in ipairs(workers) do
  while coroutine.status(co) ~= "dead" do coroutine.resume(co) end
end
```

`square(i)` は一度 yield してから `results[i]` を埋め、ワーカーのリストは作ってあり、二つの print は二つ目のループの後に走ります。一つ目のループの本体として `resume` を、二つ目のものとして `while` の行を、示したとおりに打ってください。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "一つ目のループで coroutine.resume(co)、二つ目で while coroutine.status(co) ~= \"dead\" do coroutine.resume(co) end。",
  "一度も resume しないコルーチンは決して走りません。一度だけ resume したものは、二乗をまだ書かないまま yield で止まります。どちらなのかは status が教えてくれます。",
]

