# RUST LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/rust/verybasic.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and live in the
# English pack only. Code blocks, identifiers, sample input and output and
# the exact strings a program must print are copied verbatim, never
# translated.

pack   = "rust.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.verybasic.01.print"
title = "最初の灯り"
story = "06:40、ジャーディンズ・バザールの上。キオスクは客の名前を知っているのに、誰にも挨拶しない。"
brief = '''
一行、名前を読み込みます。`hello, ` と名前を一行に出力してください。
`println!` は一行を出力するマクロで、`{}` が値の入る場所です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  mei
output: hello, mei
```
'''
hints = [
  "println!(\"hello, {}\", name); — マクロは ! を保ち、{} に name が入ります。",
  "! がなければ存在しない関数、引数がなければ {} に出力するものがありません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.verybasic.02.int-types"
title = "広い方のレジ"
story = "パーシバル・ストリートのレジは i32 で数え、一日の合計は u64 を欲しがる。キャストの行が空白だ。"
brief = '''
非負整数 `a` を `i32` として読み込みます。同じ値を `u64` にした `b` を作ると、プログラムは `b + 1` を出力します。
`as` が整数の幅を変換します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  12
output: 13
```
'''
hints = [
  "let b: u64 = a as u64; — as がキャストで、左の型が何になるかを言います。",
  "i32 は勝手に u64 にはなりません。u8 を経由するキャストは 255 より上をすべて失います。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.verybasic.03.floats"
title = "小数の秤"
story = "バウリントン・ロードの秤は小数十桁を印字するのに、読んだ数を間違った幅で持っている。"
brief = '''
小数を一つ、広い浮動小数点数 `f64` として `x` に読み込むと、プログラムは小数十桁で出力します。
`parse` はテキストから数を読み、`trim` は先に改行を取ります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3.14159265
output: 3.1415926500
```
'''
hints = [
  "let x: f64 = input.trim().parse().unwrap(); — 広いのは f64。f32 は桁が変わります。",
  "トリムしていないテキストへの parse は改行で失敗します。&str は数ではありません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.verybasic.04.strings"
title = "店の看板"
story = "イーウー・ストリートの看板屋は店名を小文字で持っていて、看板は叫ばなければならない。"
brief = '''
一行を読み込み、大文字で出力してください。
`String` には大文字のコピーを返すメソッドがあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  jardines bazaar
output: JARDINES BAZAAR
```
'''
hints = [
  "let upper = line.to_uppercase(); — Rust での名前は to_uppercase です。",
  "to_upper や toUpperCase は他の言語のもの。to_lowercase は逆方向です。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.verybasic.05.bool-if"
title = "偶数か奇数か"
story = "トラムのドアは乗客を数えるのに、偶数か奇数かを示すランプが変わらない。"
brief = '''
整数 `n` を読み込みます。`n` が偶数のとき true になる `bool` を `even` に入れると、プログラムはそこから `even` か `odd` を出力します。
`%` は剰余、`==` は比較です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "let even = n % 2 == 0; — 剰余ゼロが偶数で、== がそれを bool にします。",
  "剰余だけでは整数のまま。if は bool を求めます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.verybasic.06.loops"
title = "トラムの集計"
story = "ハイサン・プレイスの停留所は 1 から夜の最終トラムまでの運賃を数えるのに、合計はゼロのままだ。"
brief = '''
`n` を読み込みます。1 から `n` までの整数を（`n` を含めて）すべて `total` に足すと、プログラムがそれを出力します。
範囲に対する `for` がそれをします。`..=` は終端を含みます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: 10
```
'''
hints = [
  "for i in 1..=n { total += i; } — ..= は n まで届き、.. は一つ手前で止まります。",
  "三つのドットは Rust ではありません。+= i の代わりの = i は最後の一つしか残しません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.verybasic.07.functions"
title = "倍の運賃"
story = "タイムズ・スクエアのキオスクは深夜に倍額を取るのに、倍にする関数が運賃をそのまま返す。"
brief = '''
`double` を書きます: `i64` を受け取り、その二倍を返す関数です。プログラムは `n` を読んで `double(n)` を出力します。
関数の最後の式は、セミコロンなしで、その戻り値になります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
output: 10
```
'''
hints = [
  "fn double(x: i64) -> i64 { x * 2 } — -> が戻り値の型を名指し、裸の x * 2 が返るものです。",
  "末尾のセミコロンは値を無にします。-> がなければ関数は何も返しません。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.verybasic.08.structs"
title = "屋台のカード"
story = "バウリントン・ロードのどの屋台にも名前と値段のカードがあるのに、それを入れる型がない。"
brief = '''
`Stall` を宣言します: `String` の `name` と `i64` の `price` を持つ構造体です。プログラムは両方を読み、一つ組み立てて出力します。
`struct` が型を名指し、フィールドを型付きで列挙します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 38
output: fish: 38
```
'''
hints = [
  "struct Stall { name: String, price: i64 } — 波括弧、フィールド: 型、カンマ、セミコロンなし。",
  "str はサイズ不定で単独のフィールドにはなれません。タプル構造体には組み立てに使うフィールド名がありません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.verybasic.09.struct-method"
title = "屋台の合計"
story = "屋台のカードは値段と数量を知っているのに、その行がいくらになるかを言えない。"
brief = '''
`Stall` に `price * qty` を返すメソッド `total` を与えます。プログラムは `stall.total()` を呼びます。
メソッドは `impl` ブロックの中に置き、`&self` を受け取ります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  38 3
output: 114
```
'''
hints = [
  "impl Stall { fn total(&self) -> i64 { self.price * self.qty } } — &self がメソッドからフィールドに届く道です。",
  "&self がなければ self はなく、self. がなければ price と qty という名前は存在しません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.verybasic.10.enums"
title = "路線の色"
story = "タイムズ・スクエア地下の MTR 標識は三路線を知っているのに、荃湾線には何の色も塗らない。"
brief = '''
`Line` に対する `match` には `Island` と `KwunTong` のアームがあります。色が `red` の `TsuenWan` のアームを足してください。
アームは `Type::Variant => value,` です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "Line::TsuenWan => \"red\", — 列挙型を前に付けたバリアント、太い矢印、値、カンマ。",
  "裸の名前はバリアントではなく何にでも当たる束縛です。-> はアームではありません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.verybasic.11.vector"
title = "ハイサンの行列"
story = "ハイサン・プレイスの行列カウンターは人が並ぶたびに伸びるリストを必要とするのに、リストが作られない。"
brief = '''
`v` を作ります: ループが push できる、空で伸びる `i64` のベクタです。プログラムはその長さと合計を出力します。
ベクタは `Vec::new()` で作り、伸ばすには `mut` が要ります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 6
```
'''
hints = [
  "let mut v: Vec<i64> = Vec::new(); — 括弧付きの new()、そして push を許す mut。",
  "() のない Vec::new は関数そのもので呼び出しではありません。vec![0] はゼロが一つ入った状態で始まります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.verybasic.12.vector-edit"
title = "最初に抜ける人"
story = "ハイサン・プレイスの行列の先頭が案内されたのに、リストはまだ先頭にその人を表示している。"
brief = '''
`v` はその行の整数を持っています。インデックス 0 の値を取り除くと、プログラムは残りを出力します。
ベクタはインデックスで取り除きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4 5 6 7
output: 5 6 7
```
'''
hints = [
  "v.remove(0); — remove はインデックスを受け取り、残りを前に詰めます。",
  "pop は最後を取ります。インデックス 1 は二番目。delete は Vec のメソッドではありません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.verybasic.13.list"
title = "皿の山"
story = "点心カウンターは新しい皿をレールの先頭に置くのに、レールは来た順に見せている。"
brief = '''
`list` は `LinkedList<i64>` です。各 `x` を先頭に置くと、プログラムは値を逆順に出力します。
連結リストはどちらの端にも push できます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "list.push_front(x); — 先頭側。push_back はもう一方の端です。",
  "LinkedList には push も、インデックス指定の insert もありません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.verybasic.14.maps"
title = "注文帳"
story = "ラッキーマックの注文帳はどの料理が何回呼ばれたかを数えなければならないのに、どの料理も一と出る。"
brief = '''
`count` は `BTreeMap<String, i64>` です。各単語 `w` について、その数に一を足します — 新しい単語はゼロから始まります。プログラムは `word count` を一行ずつ、整列して出力します。
`entry` がスロットを見つけるか作り、`or_insert` が初期値を与えます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "*count.entry(w.to_string()).or_insert(0) += 1; — or_insert は参照を返し、* が += に必要なものです。",
  "insert は毎回 1 で上書きします。get は足せない共有参照を返します。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.verybasic.15.hashtable"
title = "順不同の集計"
story = "ラッキーマックのハッシュ集計は、印字するたびに違う順番で出てくる。"
brief = '''
`counts` は `HashMap` で、キーを決まった順では巡りません。`keys` はそのキーを `Vec` に持っています。集計が毎回同じに印字されるよう `keys` を整列してください。
`Vec` はその場で整列します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  f e d c b a f
output: a 1
        b 1
        c 1
        d 1
        e 1
        f 2
```
'''
hints = [
  "keys.sort(); — その場で、昇順に。",
  "sorted() は Vec にはありません。reverse は元のランダムな順を裏返すだけ。b.cmp(a) は降順です。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.verybasic.16.sets"
title = "スタンプ帳"
story = "トラムのスタンプ帳は、同じトラムが何度通ってもスタンプを一度しか押さない。"
brief = '''
`seen` は `BTreeSet<i64>` です。各 `x` を足します。すでに集合にある値は二度は足されません。プログラムは相異なる値の数と、順に並べた値を出力します。
集合は insert します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "seen.insert(x); — 集合は insert し、重複は何も変えません。",
  "push と add は集合のメソッドではありません。x * 2 は別の値です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.verybasic.17.stack"
title = "後入れ先出し"
story = "点心カウンターの洗い上がりの皿は山の上から取られるのに、山を下から読んでいる。"
brief = '''
`stack` はスタックとして使う `Vec<i64>` です。空になるまで値を pop し、それぞれを `out` に push すると、プログラムはそれを出力します — 後入れ先出しです。
`pop` は `Option` を返すので、ループは `while let` です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while let Some(v) = stack.pop() { out.push(v.to_string()); } — pop が None でループが終わるまで上から取ります。",
  "Vec に pop_front はありません。前から巡ったり 0 に挿入したりすると元の順に戻ります。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.verybasic.18.queue"
title = "先入れ先出し"
story = "SOGO のカウンターの整理券は列の先頭から呼ばれるのに、画面は最後尾を呼ぶ。"
brief = '''
`queue` は `VecDeque<i64>` です。先頭から最初の値を `first` に取り出すと、プログラムは二つ目を取って両方を出力します。
デックはどちらの端からも pop できます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1 2
```
'''
hints = [
  "let first = queue.pop_front().unwrap(); — 先頭側を、取り除いて。",
  "pop_back はもう一方の端。front() は取り除かずに見るだけなので二つ目が同じ値になります。pop は VecDeque にはありません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.verybasic.19.heap"
title = "小さい順に"
story = "ビクトリア・パークの給水待ちは番号の小さい札から捌くのに、ヒープは一番大きいのを渡し続ける。"
brief = '''
`heap` は `BinaryHeap<Reverse<i64>>` です — すべての値を `Reverse` で包むことで最大ヒープを最小ヒープに変えたものです。各 `x` を push すると、プログラムは小さい順に取り出します。
入れるものは包まれていなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(std::cmp::Reverse(x)); — ヒープは Reverse<i64> を持つので、push するのもそれです。",
  "裸の x は型違い。-x は最大を符号反転して先に出します。insert はヒープのメソッドではありません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.verybasic.20.sorting"
title = "値段の梯子"
story = "SOGO の価格板は打ち込んだ順に値段を並べ、客は一番安いのを一番上に欲しがる。"
brief = '''
`v` はその行の整数を持っています。その場で昇順に整列すると、プログラムがそれを出力します。
`Vec` にはそのためのメソッドがあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "v.sort(); — その場で、昇順に、括弧を付けて。",
  "b.cmp(a) は降順。sorted() は Vec のメソッドではありません。() がなければ何も呼ばれません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.verybasic.21.sort-by-key"
title = "リーダーボード"
story = "ハイサン・プレイスのゲームセンターの掲示板は最高得点を先頭に、同点は名前順に欲しがるのに、名前順だけで並んでいる。"
brief = '''
`rows` は名前と得点の `Vec<(String, i64)>` です。得点の降順、次に名前の昇順で整列すると、プログラムは `name score` を一行ずつ出力します。
`sort_by_key` はキーで整列し、`Reverse` はその一部を裏返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
        mei 90
        alex 95
        bo 90
output: alex 95
        bo 90
        mei 90
```
'''
hints = [
  "rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone())); — タプルのキー: 裏返した得点、そして名前。",
  "r.1 だけでは昇順。clone のない r.0 は借用から String を移動してしまいます。素の sort() は名前順です。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.verybasic.22.reverse"
title = "後ろから前へ"
story = "サンパンの名前は船尾に逆向きに描かれるのに、塗装屋は前向きの写ししか持っていない。"
brief = '''
一行を読み込みます。同じテキストの文字を逆順にした `rev` を作ると、プログラムがそれを出力します。
文字は `chars()` から来て、イテレータは逆走でき、文字のイテレータは `String` に collect できます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "let rev: String = s.chars().rev().collect(); — イテレータに rev()、String に collect()。",
  "reverse は Vec のメソッドで、イテレータや str のものではありません。to_string は前向きのままコピーします。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.verybasic.23.closures"
title = "サービス料"
story = "フードコートのプリンタはどの行にも同じ料金を足すのに、最初の行の前に料金を忘れた。"
brief = '''
`k` を読み、次に整数の行を読みます。`add` を作ります: `i64` を受け取り、それに `k` を足して返すクロージャです。プログラムはそれをすべての数に適用します。
クロージャは `|args| body` で、外側の `k` を使えます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "let add = |x: i64| x + k; — 縦棒が引数を挟み、本体が続き、k は捕捉されます。",
  "クロージャの本体の前に -> はなく、fn とも書きません。x - k は違う和です。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "rust.verybasic.24.lambdas"
title = "偶数番のテーブル"
story = "SOGO のフードホールは偶数番のテーブルにその番号の二乗を課すのに、レジのチェーンには何も入っていない。"
brief = '''
`nums` はその行の整数を持っています。`total` を作ります: 偶数の二乗の和を、一本のイテレータチェーンで。
`filter` は残し、`map` は変換し、`sum` は足します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum(); — &&x が filter の渡す二重参照をほどきます。",
  "x % 2 == 1 は奇数を残します。& のパターンがなければ参照の剰余を取ることになります。filter がなければ全部が二乗されます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.verybasic.25.threads"
title = "四つのレジ"
story = "ジャーディンズ・バザールはレシート一枚につきレジを一台開けるのに、レジが一つも動き出さない。"
brief = '''
各 `x` について `x * x` を計算するスレッドを spawn し、そのハンドルを `handles` に push します。プログラムは順に join して二乗を出力します。
`thread::spawn` はクロージャを受け取り、`move` がスレッドに `x` 自身のコピーを与えます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 1 4 9
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — move、引数なし、値として x * x。",
  "move がなければスレッドは自分より先に消えるかもしれないループ変数を借ります。spawn のクロージャは引数を取りません。x + x は二倍です。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.verybasic.26.mutex"
title = "一つのカウンター、多くの手"
story = "ジャーディンズ・バザールのどのレジも売上を同時に一つのカウンターに足すのに、カウンターはゼロを指す。"
brief = '''
`c` は各スレッド内の `Arc<Mutex<i64>>` のクローンです。ミューテックスの中の数に `x` を足してください。プログラムはすべてのスレッドを join して合計を出力します。
`lock()` はガードを返し、`*` で数に届きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 6
```
'''
hints = [
  "*c.lock().unwrap() += x; — lock、ガードを unwrap、* で i64 へ、そして足す。",
  "ガード自体には足せません。lock() は unwrap すべき Result を返します。= x は足す代わりに上書きします。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.verybasic.27.binary-tree"
title = "オートコンプリート"
story = "パーシバル・ストリートの電話キオスク。ゴーストテキストが前に見た木を携えて戻ってきた。値がどちら側へ行くかを決めるその一行だけは、補完を持っていない。"
brief = '''
`insert` は `n` の下の木に `value` を入れます: 小さい値は左の部分木へ、大きい値は右へ行き、部分木は代入し戻されます。その一行を書いてください。プログラムは中順走査と高さを出力します。
`take()` は子を持ち上げて、再帰呼び出しに渡せるようにします。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if value < n.value { n.left = insert(n.left.take(), value); } else { n.right = insert(n.right.take(), value); } — take、再帰、代入し戻し、比較が選んだ側で。",
  "代入し戻さないと部分木を失います。> は値を逆側へ送ります。&n.right は関数が Option そのものを求める所に参照を渡します。",
]
