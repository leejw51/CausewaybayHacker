標準入力は三行です: 単語の行、すでに **昇順にソートされた** 整数の行、
そして整数 `x` がひとつ。

四行を出力してください:

1. `TOP <word> <count>` — 最も多い単語、同数なら単語の昇順 —
   `collections.Counter` から
2. `BISECT <l> <r>` — ソート済み整数における `x` の `bisect_left` と
   `bisect_right`
3. `SMALLEST3` の後に最小の整数三つ — `heapq.nsmallest` — 三つ未満なら
   あるだけ
4. `GROUPS` の後に単語の頭文字ごとの `<letter>:<k>` を、文字の昇順で —
   頭文字をキーにした `collections.defaultdict(list)`

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
