brief = '''
標準入力は個数 `n`、続いて `n` 行の `<STALL> <CENTS>` — 開いている屋台 —
次に個数 `q` と、調べる屋台名 `q` 個です。

各問い合わせについて `<STALL> <cents>` を、その屋台が開いていなければ
