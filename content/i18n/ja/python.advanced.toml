[[quest]]
id    = "python.advanced.13.dataclasses"
title = "誰が買うのか"
story = "SOGO 地下の米売り場はどのカードにも全額を請求します。大人ではないカードにも、カードですらないものにも。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<TYPE> <KG>` です。

基本価格は `500 + 100 * KG` セントです。各行について次のいずれかを出力してください:

* `ADULT` — 基本価格
* `STUDENT` — 基本価格の半分、整数除算で
* `SENIOR` — 常に `200`
* それ以外 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

行を frozen な `@dataclass` — `Order(kind: str, kg: int)` — としてモデル化し、
値段はその注文に対する **ひとつ** の `match` で決めてください。`match` は
dataclass をキーワードで分解でき — `case Order(kind="ADULT", kg=kg):` —
最後のアーム `case Order(kind=other):` はマッチしなかったものを束縛します。

スターターの `match` はアームがひとつ、その後にフォールスルーの `case _:` が
あって、知っているはずの三種類も含めてすべてに `UNKNOWN` を出力します。
アームは順に試され、最初にマッチしたものが勝つので、ワイルドカードは最後に
置き、ワイルドカードはそれひとつでなければなりません。
'''
hints = [
  "種類ごとに case をひとつ: case Order(kind=\"STUDENT\"): など。dataclass はフィールド名でマッチします。",
  "// が整数除算です。/ だと 450.0 になり、テストが求めるのは 450 です。",
  "case Order(kind=other): はキャプチャパターンです — 常にマッチしてタグを束縛します — だから最後に置きます。Rust の match の `other =>` アームとまったく同じです。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "python.advanced.14.generators"
title = "自分の for ループ"
story = "魚屋のティッカーは始値から一定の刻みで値段をすべて並べますが、そのリストはどこにも持っていません。"
brief = '''
標準入力は三つの整数です: `start`、`step`、`count`。

`start` から始まり `step` ずつ進む値を `count` 個 yield する **ジェネレータ**
`ticker(start, step, count)` を書いてください。各値を一行ずつ出力し、次に
二つ目のティッカーを `sum` に渡して計算した `SUM <total>` を出力します。

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

最後の行は `type(ticker(...)).__name__` で、スターターの `main` がそのまま
出力します。いまは `list` と言っています。

`yield` を含む関数は、呼んでも実行されません。ジェネレータを返し、何かが次の値を
求めるたびに本体が一歩ずつ進みます。だから `for` が使え、`sum` が使え、百万個の
リストが一度も存在しないまま百万個の値を生み出せるのです。

スターターはリストを作って返しています。それは正しいのですが、問われている
ことではありません。リストは全部の値を一度に、ジェネレータは求められたときに
一つずつです。`append` を `yield` に変えて、リストを消してください。
'''
hints = [
  "出力の最後の行は型の名前で、テストが求めるのは `generator` です。yield を含む def が返すのがそれです。",
  "yield value、それから進めます。関数は yield で止まり、次に求められたときにその後から再開します。",
  "ジェネレータは一度しか消費できません。だから main は、ループが使い切ったものを再利用せず、sum のために新しいティッカーを作っています。",
]

