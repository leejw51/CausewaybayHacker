メッセージはハンドラではなくクラスに住んでいます。

`raise NotANumber() from err` は `ValueError` を原因として記録します。ここでは
何もそれを出力しませんが、トレースバックなら両方を上下に並べ、*The above exception
was the direct cause of the following exception* という言葉を添えて表示します。
その連鎖が `from` を書く理由です。
