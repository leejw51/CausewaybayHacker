        MISSING 1
        CHEAPEST WONG
```

スターターは `CHAN` で落ちます:

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

この行がボスです。これはバグを指しません。`None` が最終的に *使われた* 場所を
指しているだけで、それは `None` が *作られた* 場所からどれだけ離れていても
おかしくありません — そしてスターターでは、作られた場所がふたつあります。
`lookup` は存在しない屋台に対して設計どおり `None` を返し、呼び出し側は確かめずに
その `.cents` を読んでいます。さらに `cheapest` は一方の経路に `return` がなく、
**暗黙に** `None` を返し、呼び出し側はそれにも同じことをしています。

Python の関数はすべて何かを返します。末尾まで落ちた関数は `None` を返します。
デフォルトなしの `dict.get` は `None` を返します。どちらもその時点では
エラーではなく、どちらも後でエラーになります。直し方はどちらも同じです:
`None` を受け取りうるコードが、属性に触れる前に `is None` で確かめます。
`== None` ではなく、`if not stall` でもありません — 値段が `0` の屋台は本物の
屋台であり、`not` はそれを捨ててしまいます。

`lookup` と `cheapest` が **意図的に** `Optional[Stall]` を返すようにし、
アノテーションでそう宣言し、`None` が届く場所で処理してください。
'''
hints = [
  "トレースバックは下から読みます: AttributeError は print の行ですが、None はその一行前の lookup から、さらにその前の board.get から出てきています。",
  "if stall is None: が確認の仕方です。`is` を使うのは、None が単一のオブジェクトで、同一性が正直な比較だからです。`==` は上書きされうるし、`not stall` は偽と評価されるが本物の値に対して間違っています。",
  "cheapest には経路がふたつあって、return があるのは片方だけです。Python はそれを警告しません。呼び出し側に None を渡して、呼び出し側に気づかせます。空の場合に明示的な `return None` を書いて、意図したものだと読み手に見えるようにしてください。",
  "アノテーションの Optional[Stall] はインタプリタには強制されません。読み手と型チェッカーへの覚え書きであり、時計に追われているのは読み手のほうです。",
]

