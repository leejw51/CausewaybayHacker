  "クラス本体の __init__ の前に __slots__ = (\"count\",)。末尾のコンマに注意: (\"count\") はタプルではなく文字列です。",
  "TOTAL は元のセントの合計で、それが成り立つのは代入が失敗したからです。スターターではその時点でどの価格も 0 になっていて TOTAL は 0 です — 変更は許されただけでなく、通ってしまっていました。",
