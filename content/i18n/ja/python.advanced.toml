  "dict やリストはその場で変更されるので、`drawer[\"total\"] += value` は全スレッドが共有するひとつのオブジェクトを変えます。`nonlocal total` でも動き、それがもうひとつの正直な答えです。",
  "main で一度 threading.Lock() を作り、読み・変更・書きの周りを `with lock:` で囲みます。GIL はあなたのデータのロックではなく、インタプリタのロックです。",
