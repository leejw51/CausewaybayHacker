brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は kg 単位の重さのはずです。

例外の階層を定義してください: 基底の `PriceError(Exception)` と、
`NotANumber(PriceError)`、`Negative(PriceError)` です。`Negative` は重さを持ち、
そのメッセージは `negative weight: <kg>`。`NotANumber` のメッセージは
`not a number` です。`price(text)` はテキストを変換し、捕まえた `ValueError`
**から** `NotANumber` を送出し、負の重さを拒否し、それ以外は `500 + 100 * kg`
