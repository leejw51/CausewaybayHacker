# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.threads"
title = "十二の屋台、ひとつのフロア"
story = "12:30、SOGO の地下。十二の屋台が同時に注文を受け、合計を集める係が、どの屋台も書き込む前にボードを読んでいます。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとに `threading.Thread` をひとつ起動し、その二乗を計算して `results[i]` —
自分専用のスロット — に格納してください。こうすれば同じ場所に書くスレッドは
ふたつとありません。すべてのスレッドを `join` し、結果を **インデックス順** に
一行ずつ出力し、次に `THREADS <n>` を出力します。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

スレッドは何も返しません。`Thread(target=f)` は `f` を実行して戻り値を捨てます。
だから結果は、`join` の後にメインスレッドが読める場所に書かなければなりません。
スレッドごとのスロットを持つリストが、その最も単純な形です: 各インデックスに
書くスレッドはちょうどひとつなので、ロックするものがありません。

スターターのスレッドは始まった瞬間にすべて落ちますが、プログラムはそれでも
終了して出力します。`args=` のない `target=square` は `square()` を引数なしで
呼び、`TypeError` はスレッドの中で起きて標準エラーに出力され、`results` は
`None` だらけのままです。死んだスレッドが道連れにするのは自分だけです —
stderr を読んでください。さもないと、永遠に気づきません。
'''
hints = [
  "Thread に args=(i, v)。target は square(*args) として呼ばれ、スターターは何も渡していません。",
  "全部を start してから、全部を join します。同じループの反復で start と join をすると正しくは動きますが、一つずつ順番に実行されます。",
  "results は main のローカルなリストに対するクロージャです。入れ子の関数は同じリストを見ているので、join の後に書き込みが見えます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.lock"
title = "ひとつの引き出し、八つの手"
story = "地下のどの屋台もフードホール事務所のひとつの現金引き出しに払い込みますが、閉店時に引き出しは空で、どの屋台も払ったと言い張ります。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとにスレッドをひとつ起動し、それを **ひとつの共有合計** に足して、共有の
ヒット数を増やしてください。すべてを join し、`TOTAL <sum>` と `HITS <n>` を
出力します。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

スターターは決定的に `TOTAL 0` を出力し、各ワーカーからのトレースバックが
stderr に出ます。ワーカーの中の `total += value` は main の `total` に触れて
いません: `int` はイミュータブルで、それへの `+=` は名前を束縛し直し、関数の
中で代入された名前は `nonlocal` と言わないかぎりその関数の **ローカル** です。
各ワーカーは自分の `total` を作り、足し、捨てました。

直し方は、ワーカーがその場で変更するコンテナ — 一要素のリストか小さなクラス —
**と `Lock`** です。後半は省略できません。GIL が保証するのはバイトコードが
一度にひとつ実行されることだけです。`drawer[0] += value` は三つのバイトコード
(load、add、store) で、load と store のあいだのスレッド切り替えは更新をひとつ
失わせます。四つのスレッドが四つの数を足すあいだには起きません。四十で、
午前二時に起きます。

`with lock:` はロックを取り、出るときに解放します。例外で出るときも含めて。
'''
hints = [
  "スターターを実行してください: UnboundLocalError で死にます。`total += value` が total を pay のローカルにし、存在する前に読むからです。そのエラーが診断のすべてです。",
  "dict やリストはその場で変更されるので、`drawer[\"total\"] += value` は全スレッドが共有するひとつのオブジェクトを変えます。`nonlocal total` でも動き、それがもうひとつの正直な答えです。",
  "main で一度 threading.Lock() を作り、読み・変更・書きの周りを `with lock:` で囲みます。GIL はあなたのデータのロックではなく、インタプリタのロックです。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.queue"
title = "誰がハッチを閉めるのか"
story = "ローストグース売り場は注文をすべてハッチ越しに厨房へ渡し、最後の一件のあと、厨房は決して来ない次の注文を立ったまま待っています。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

ひとつのプロデューサースレッドが各値を十倍して `queue.Queue` に put し、
最後に **番兵** を put します。メインスレッドは番兵を見るまでキューから取り出し、
各値を出力しつつ合計を保ち、それから `SUM <total>` と `CLOSED` を出力します。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

`queue.Queue` に `close` はありません。キューの何もコンシューマにもう来ないと
伝えられないので、それはアイテムでなければならず、`None` がその定番です。
スターターはそれを一度も送らないので、`get()` は待つものが何もないまま永遠に
ブロックし、ランナーが制限時間でプログラムを殺します。Python にデッドロック
検出器はありません。プログラムはただ応答しなくなり、それが外から見た「ハング」
です。

番兵を送るのはプロデューサーです。コンシューマではありません — ストリームの
終わりを知っている側が、終わらせる側です。
'''
hints = [
  "kitchen の末尾に一行: hatch.put(None)。",
  "コンシューマはすでに `is None` を確認しています。プロデューサーが送らなかったものを待っていたのです。",
  "値として None が正当にありうるなら、番兵は非公開のオブジェクトにします: SENTINEL = object() を `is` で比較します。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.thread-pool"
title = "八人の運搬係"
story = "SOGO の搬入口に木箱が四十個、運搬係が八人。誰も四十人の運搬係は望んでいません。八人が一度も手を止めないことを望んでいます。"
brief = '''
標準入力は整数 `w` と `n`、続いて `n` 個の値です。

ワーカー数 `w` の `ThreadPoolExecutor` を開き、値ごとに `(index, value * value)`
を返すジョブを `submit` し、結果を `as_completed` で集めてください。インデックスで
ソートし、`<index> <value>` を一行ずつ出力し、次に `WORKERS <w>` を出力します。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

`submit` が返すのは結果ではなく `Future` です。`as_completed` は Future を
**終わった** 順に返します。それはプールの気分次第の順序です。値を取り出すのは
`future.result()` で — あるいはジョブが死んだときの例外を再送出します。それが
これを呼ぶもうひとつの理由です。

スターターは Future そのものを出力しています。結果にインデックスを持たせるのが、
出力を毎回同じにするものです。それでソートするのは答えの最後の行であって、
最初の行ではありません。
'''
hints = [
  "スターターは Future の展開で死にます: `for index, value in sorted(results)` はタプルでないオブジェクトを展開できません。タプルは future.result() の中にあります。",
  "as_completed はジョブが終わるたびに yield します。結果の中のインデックスが、それぞれどこから来たかの唯一の記録です。",
  "with ThreadPoolExecutor(...) as pool: は出るときに submit したすべてのジョブを待つので、出力するときに動いているものはありません。pool.map もここでは使え、順序も保ってくれますが、as_completed を学べないという代償があります。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.asyncio"
title = "async は実際どこで動くのか"
story = "メイは四年間 `async def` を書いてきて、それを動かしているものを一度も見たことがありません。地下の注文ボードにはループがひとつあり、どの屋台もそこで順番を待ちます。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

イベントループに一度だけ制御を返し — `await asyncio.sleep(0)` — 値の二倍を
返す `async def double(value)` を書いてください。`n` 個すべてを `asyncio.gather`
で実行し、各結果を入力順に出力し、次に `SUM <total>` と `TASKS <n>` を出力します。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`async def` を呼んでも実行されません。**コルーチンオブジェクト** を組み立てて
返すだけで、何かが await するまで中身は何も起きません。スターターのリストは
await されていない三つのコルーチンで、Python は stderr にそう言います —
`RuntimeWarning: coroutine 'double' was never awaited` — 一方で出力は
`<coroutine object double at 0x...>` が三行です。

`gather` はコルーチンを受け取り、ひとつのループにすべてスケジュールし、
どの順で終わろうと **渡した順に** 結果を返します。手書きの `await` ループより
これを選ぶ理由はそれだけです: ループでも正しく動きますが逐次で、`gather` は
正しく動いて交互に進みます。

ここにあるスレッドはちょうどひとつです。`await` は、コルーチンがスレッドを
ループに返してほかのものが使えるようにする地点です。何も並列には動きません。
止まれると宣言した場所で、**順番に** 動きます。
'''
hints = [
  "await asyncio.gather(*coroutines) — 星がリストを引数に展開し、await が実行します。",
  "asyncio.run(...) が実行器です: ループを作り、コルーチンをひとつ完了まで走らせ、ループを閉じます。これはプログラムに一つ、いちばん上にあります。",
  "gather は引数の順に結果を返します。終わった順に欲しいなら asyncio.as_completed で、そのときはスレッドプールとまったく同じように自分でインデックスを持ち回ります。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "python.advanced.06.async-queue"
title = "済んだと誰が言うのか"
story = "三人の係が地下の注文キューを片付け、フロアマネージャーはキューが空だと言うのを待っています。誰も伝票が済んだと伝えていないので、いつまでも言いません。"
brief = '''
標準入力は整数 `w` と `n`、続いて `n` 個の値です。

`(index, value)` の組を `asyncio.Queue` に put してください。`w` 個のコンシューマ
タスクを起動し、それぞれ永遠にループして組を取り、`value * 10` を `results[index]`
に書き、`task_done()` を呼びます。メインコルーチンは `queue.join()` を await し、
次にコンシューマをキャンセルし、それから結果をインデックス順に、そして
`CONSUMERS <w>` を出力します。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`queue.join()` は、これまで `put` されたすべてのアイテムに対応する `task_done()`
が呼ばれたときに返ります。スターターのコンシューマはそれを一度も呼ばないので
`join` は永遠に待ち、ループにはほかに実行できるものがなく、ランナーが殺すまで
プログラムはハングします。スレッドの課題と同じハングの別の綴りで — 直し方は
やはり一行、コンシューマ側です。

コンシューマは `while True` ループです。join の後に main がキャンセルするから
終わります。`queue.get()` で止まっているタスクをキャンセルするのが、タスクを
止める普通の、意図された方法です。キャンセルしたタスクを
`gather(..., return_exceptions=True)` で await して、キャンセルが報告されずに
回収されるようにしてください。
'''
hints = [
  "アイテムを処理するたびに queue.task_done()。join は put と task_done の数を突き合わせるだけで、ほかは見ません。",
  "create_task はコンシューマを await せずにスケジュールします。ループがそれを動かすのは次に main が何かを await したときで、それが join です。",
  "get() を await 中にキャンセルされたタスクは、その中で CancelledError が送出され、while True が終わります。return_exceptions=True は gather がそれをあなたに再送出しないようにします。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "python.advanced.07.context-managers"
title = "それでもシャッターは下りる"
story = "地下のある屋台は注文のたびにシャッターを開け、その後に閉めます。12:40 に悪い注文を受けた屋台はそれ以来開いたままです。閉める処理が、失敗した行の後にあったからです。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<STALL> <CENTS>` で、`CENTS` は整数の
はずです。

`contextlib.contextmanager` を使って、入るときに `OPEN <STALL>`、出るときに
`SHUT <STALL>` を出力するコンテキストマネージャ `opened(stall)` を書いてください —
**本体が例外を送出したかどうかに関わらず** です。その中でセントを解析して合計に
足します。セントが解析できない行は、シャッターが閉まった後に `BAD <STALL>` として
報告します。最後に `TOTAL <sum>` と `REJECTED <k>` を出力します。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager` はジェネレータをコンテキストマネージャにします: `yield` の
前がすべて `__enter__`、後がすべて `__exit__` です。本体が例外を送出すると、
その例外は **ジェネレータの `yield` の位置に投げ込まれる** ので、その後のコードは
`yield` が `try`/`finally` の中にあるときだけ実行されます。スターターには
`finally` がなく、`WONG` のシャッターは閉まりません。

クラスで書く形 — `__enter__` と `__exit__(self, exc_type, exc, tb)` — は同じ
仕事をより多くの行でこなし、`True` を返せば例外を飲み込めます。ここでは飲み込まない
でください: 呼び出し側は `BAD` を出力したいのです。
'''
hints = [
  "try: yield / finally: print(SHUT)。finally が、どの経路でも実行される __exit__ です。",
  "例外はジェネレータを通り抜けて with 文の外に出るので、main の except にも見えます — だから BAD は SHUT の後に出力されます。",
  "with opened(stall) as x: はジェネレータが yield したものを束縛します。ここでは何も yield しておらず、それで構いません。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "python.advanced.08.pipeline"
title = "ラインの料理人"
story = "地下厨房のボー料理長のライン: ひとつの持ち場が注文を二乗し、次の持ち場が累計を取り、誰もバッチ全体を待ちません。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

**ジェネレータ** による二段のパイプラインを組んでください:

1. `squares(values)` は各値の二乗を yield する
2. `running(stream)` は数の任意のイテラブルを受け取り、累計を保ち、
   `(value, total)` の組を yield する

`main` は各組を `<square> <total>` として出力し、次に `PIPE <n>` を出力します。

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

どちらの段もリストを作りません。各 `yield` はアイテムをひとつ次の段に渡して
止まります。`main` が引き、`running` が `squares` から引き、`squares` が入力から
引きます。求められる前には何も計算されず、パイプライン全体で処理中のアイテムは
ひとつです。それが、同じ三つの関数が一億行のファイルでも動く理由です。

スターターの二段目は `yield` であるべき場所に `return` があるので、最終合計 —
`int` — を返すただの関数になっていて、`main` はそれをイテレートしようとします。
'''
hints = [
  "エラーは TypeError: cannot unpack non-iterable int object — running が組を yield する代わりに数を返しました。",
  "ループの中で yield value, total。どこかに yield がある関数はジェネレータで、その戻り値は呼び出し側には見えません。",
  "running(squares(nums)) が合成できるのは、ジェネレータがイテラブルだからです。running は入力が別のジェネレータであることを知りもしないし気にもしません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "python.advanced.09.itertools"
title = "棚の上の道具箱"
story = "地下の事務所には誰も開けない道具の棚があり、係員は毎日午後、同じ伝票の連続を手で数えています。"
brief = '''
標準入力は整数一行です。

三行を出力してください。それぞれ `itertools` で組み立て、手書きのものは使いません:

1. `SUMS` の後に累積和 — `accumulate`
2. `RUNS` の後に **隣接する** 等しい値の連続それぞれを `<v>x<k>` として —
   `groupby`
3. `PAIRS <k>`: **異なる** 値の順序なしの組がいくつあるか — ソートした異なる
   値に対する `combinations`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

`groupby` は **隣接する** 等しい要素だけをまとめます。`Counter` ではなく、
サンプルはふたつが食い違うように選んであります: `1` は四回現れますが、連続は
ふたつです。スターターは二行目に回数の dict を使っていて、まさにその入力で
間違えます。

これらはどれも遅延イテレータを返します。特に `groupby` のグループは次の
グループに進むまでしか有効でないので、進む前にそれぞれを読み切ってください —
ループの中で `len(list(group))` であって、後で使うために保存したグループの
リストではありません。
'''
hints = [
  "accumulate(nums) は各要素の後の累計を yield します。最後のものが合計です。",
  "for value, group in groupby(nums): の group はその連続に対するイテレータで、一度しか消費できません。len(list(group)) がその長さです。",
  "combinations(distinct, 2) は順序なしの組をそれぞれ一度ずつ yield します。その数は n*(n-1)/2 で、手で確かめれば正しい n を持っているかがわかります。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "python.advanced.10.functools"
title = "計算したものを覚えておく"
story = "豆腐屋は同じ二つの数から同じ当日価格を、昼までに一万一千回、毎回ゼロから計算しています。"
brief = '''
標準入力は `n k bits` です: 整数ふたつと、二進数字の文字列。

四行を出力してください:

1. `FIB <fib(n)>` — `functools.lru_cache` でメモ化した **再帰的な** `fib` から
2. `PRODUCT <k!>` — `1..k` に対する `operator.mul` の `functools.reduce`、
   `k = 0` で `1` になるよう初期値付きで
3. `BIN <value>` — `base=2` を固定した `int` の `functools.partial` で解析した
   `bits`
4. `MISSES <m>` — `fib.cache_info().misses`、再帰が実際に本体を実行した回数

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` は最大 `400` なので、再帰は Python のフレーム上限に収まります。キャッシュ
なしでは `fib(35)` は約三千万回の呼び出しで、`fib(90)` は終わりません。
キャッシュがあれば各 `fib(i)` は一度だけ実行され、`MISSES` は `n + 1` です。
`lru_cache` はデコレータで、引数がハッシュ可能だから動きます — リストの引数は
最初の呼び出しで `TypeError` を送出します。

`partial` は関数の引数の一部を固定して新しい関数をくれます。`reduce` は
二引数の関数をシーケンスに畳み込みます。どちらも賢いものではありません。
どちらも面接で聞かれます。
'''
hints = [
  "def fib の上に @functools.lru_cache(maxsize=None)。スターターは最後の行で死にます。ただの関数には cache_info がないからです。",
  "functools.reduce(operator.mul, range(1, k + 1), 1) — 三つ目の引数が開始値で、これが空の range で 1 を返させます。",
  "functools.partial(int, base=2) は文字列を受け取り、base=2 を自分で補う呼び出し可能オブジェクトです。functools.cache は 3.9 以降で lru_cache(maxsize=None) と同じで、どちらの名前でも構いません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "python.advanced.11.protocol"
title = "描ければそれでいい"
story = "SOGO 地下の案内板は屋台とカウンターを並べていて、それぞれ別のプログラムが印字しています。板が知りたいのは、それぞれが自分を描けるかどうかだけです。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は次のいずれかです

* `STALL <NAME> <AISLE>` — `<NAME> / A<AISLE>` として描画される
* `COUNTER <NUMBER>` — `COUNTER <NUMBER>` として描画される

メソッド `render()` をひとつ持つ `typing.Protocol` の `Sign` を宣言してください。
`Stall` と `Counter` をただのクラスとして — **`Sign` を継承せずに** — 書き、
描画結果を出力する関数 `show(sign: Sign)` をひとつ書きます。すべての看板を
出力し、次に `isinstance(x, Sign)` で数えた `SIGNS <n>`、次に `isinstance(x, Stall)`
で数えた `STALLS <k>` を出力します。

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

`Protocol` は **構造的** な型です: クラスはそう宣言することではなく、メソッドを
持つことでそれを満たします。型チェッカーが読める名前の付いたダックタイピングです。
実行時には、`@runtime_checkable` が付いていないかぎりプロトコルは何もしません。
付いていれば `isinstance` がメソッドを名前で確認します。スターターの `Sign` には
そのデコレータがなく、その `isinstance` は送出します:

```
TypeError: Instance and class checks can only be used with @runtime_checkable protocols
```

`show` は実行時に属性検索でディスパッチします — `sign.render()` はそのオブジェクトが
持つ `render` を見つけます。代わりに選べる静的ディスパッチはありません。Python の
仕組みはひとつで、これがそれです。
'''
hints = [
  "class Sign(Protocol) の上に、typing からインポートした @runtime_checkable。それで修正は完了です。",
  "Stall も Counter も Sign にはどこにも触れません。render() を持つことで満たします。構造的とはそういう意味です。",
  "runtime_checkable なプロトコルに対する isinstance はメソッドの存在だけを確認し、シグネチャや戻り値の型は見ません。それらを確認するのは型チェッカーで、インタプリタは決して確認しません。",
]

