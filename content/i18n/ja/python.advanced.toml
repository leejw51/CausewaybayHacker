# ---------------------------------------------------------------- 22
[[quest]]
id    = "python.advanced.05.asyncio"
title = "async は実際どこで動くのか"
story = "メイは四年間 `async def` を書いてきて、それを動かしているものを一度も見たことがありません。地下の注文ボードにはループがひとつあり、どの屋台もそこで順番を待ちます。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

イベントループに一度だけ制御を返し — `await asyncio.sleep(0)` — 値の二倍を
返す `async def double(value)` を書いてください。`n` 個すべてを `asyncio.gather`
で実行し、各結果を入力順に出力し、次に `SUM <total>` と `TASKS <n>` を出力します。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`async def` を呼んでも実行されません。**コルーチンオブジェクト** を組み立てて
返すだけで、何かが await するまで中身は何も起きません。スターターのリストは
await されていない三つのコルーチンで、Python は stderr にそう言います —
`RuntimeWarning: coroutine 'double' was never awaited` — 一方で出力は
`<coroutine object double at 0x...>` が三行です。

`gather` はコルーチンを受け取り、ひとつのループにすべてスケジュールし、
どの順で終わろうと **渡した順に** 結果を返します。手書きの `await` ループより
これを選ぶ理由はそれだけです: ループでも正しく動きますが逐次で、`gather` は
正しく動いて交互に進みます。

ここにあるスレッドはちょうどひとつです。`await` は、コルーチンがスレッドを
ループに返してほかのものが使えるようにする地点です。何も並列には動きません。
止まれると宣言した場所で、**順番に** 動きます。
'''
hints = [
  "await asyncio.gather(*coroutines) — 星がリストを引数に展開し、await が実行します。",
  "asyncio.run(...) が実行器です: ループを作り、コルーチンをひとつ完了まで走らせ、ループを閉じます。これはプログラムに一つ、いちばん上にあります。",
  "gather は引数の順に結果を返します。終わった順に欲しいなら asyncio.as_completed で、そのときはスレッドプールとまったく同じように自分でインデックスを持ち回ります。",
]

