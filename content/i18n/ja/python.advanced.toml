`__slots__` はもうひとつの種類の固定された形です: インスタンスは名前を挙げた
属性だけを持ち、`__dict__` を持たないので、属性名のタイプミスは誰も読まない
新しいフィールドが黙って生えるのではなく、代入の時点で `AttributeError` になります。
すべてのインスタンスが小さくもなるので、「これが一千万個ある」への答えでもあります。
