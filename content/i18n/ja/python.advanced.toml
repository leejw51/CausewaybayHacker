`bisect` は「これはどこに入るか」にループなしで答えます: `bisect_left` は `x`
より小さくない最初の位置、`bisect_right` は `x` より大きい最初の位置で、その差が
`x` の個数です。`heapq.nsmallest` は `k` が小さく `n` が小さくないときの正しい
選択です。先頭の三つを読むためにリスト全体をソートするのは、まさにそれが
避けるために存在するものです。
'''
hints = [
  "min(counts.items(), key=lambda item: (-item[1], item[0])) が、同数の扱いを明記した最頻の単語です。同じキーでソートして [0] を取っても同じ答えです。",
  "bisect_left と bisect_right は決して送出しません。list.index は x がないと ValueError を送出し、隠しケースのひとつがまさにそれです。",
