id    = "python.advanced.16.timeouts"
title = "待つのをやめる"
story = "注文ボードは各屋台に待ち時間を問い合わせますが、カードリーダーが壊れた屋台は決して答えないので、ボードは決して描き直されません。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<STALL> <SECONDS>` で、`SECONDS` は
すぐに答える屋台なら `0`、時間内に答えない屋台なら `1` です。

各屋台について、その `fetch(stall, seconds)` — その秒数だけ sleep する — を
**0.2 秒** のタイムアウト付き `asyncio.wait_for` の下で `await` し、入力順に
`<STALL> OK` か `<STALL> TIMEOUT` を出力してください。次に永遠にループする
`watch()` タスクを起動し、キャンセルし、await して、その
`except asyncio.CancelledError` から `CANCELLED` を、`finally` から `CLEANUP` を
出力させます。最後に `TIMEOUTS <k>` を出力します。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` は awaitable を期限付きで実行し、期限が過ぎると内側のタスクを
**キャンセル** して `asyncio.TimeoutError` をあなたに送出します。その名前を
捕まえてください — 3.11 以降では組み込みの `TimeoutError` ですが 3.10 では
違い、`asyncio.TimeoutError` はどちらでも正しいです。

スターターは `fetch` を直接 await するので、`WONG` はまる一秒かかってから `OK`
を出力します。また `watch` を await せずにキャンセルするので、ループが閉じる前に
タスクの `except` と `finally` が実行される機会がありません。キャンセルされた
タスクは、次にスケジュールされて中で `CancelledError` が届けられるまで止まって
いません。await することがその順番を与えます。処理した後は `CancelledError` を
再送出してください — 飲み込むと、そのタスクはキャンセルできなくなります。
'''
hints = [
  "try の中で asyncio.wait_for(fetch(stall, seconds), timeout=0.2)、except asyncio.TimeoutError で受けます。",
  "watcher.cancel() はキャンセルを要求するだけです。`await watcher` がタスクに except と finally を実行させます。それはあなたに CancelledError を再送出するので、それも捕まえてください。",
  "create_task の後の await asyncio.sleep(0) は、watcher に実際に始まるための一巡を与えます。そうすれば、ただスケジュールされただけではなく、動いているタスクをキャンセルできます。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "python.advanced.17.gil"
title = "GIL"
story = "SOGO の地下、十二の屋台、フロア全体にロックがひとつ。同時に起きるはずだったことがすべて一つずつ起き、合計は何も返ってきませんでした。"
brief = '''
標準入力は整数 `k` と `n` です。

`1..n` を `k` 個の連続したチャンクに分け — チャンク `i` は `n*i//k + 1` から
`n*(i+1)//k` まで (両端を含む) — 各チャンクをそれぞれのスレッドに渡してください。
スレッドはその範囲の二乗の和を求めます: CPU バウンドなループで、ライブラリ呼び出し
なしです。各スレッドは結果をロックの下で **ひとつの共有合計** に足し、自分の
スロットにも記録します。すべてを join します。チャンクごとにインデックス順で
`CHUNK <i> <sum>` を出力し、次に `TOTAL <sum>`、次に `THREADS <k>` を出力します。

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

スターターが失敗する理由はタイミングとは無関係です。`work` は和を返し、`main`
は `t.join()` を集めていますが、`join` は target が何を返そうと `None` を返します
— スレッドに戻り値はありません。最初の `+=` が `TypeError` です。それが小さい
ほうのバグです。ロックの課題と同じやり方で直してください: 共有コンテナ、更新の
周りの `with lock:`、そしてちょうど一つのスレッドが書くチャンクごとのスロットです。

大きいほうがボスで、それは直せるバグではありません。`k = 4`、`n = 4000000` で
実行して時間を計り、次に `k = 1` で実行してください。同じ時間がかかります。
CPython には **グローバルインタプリタロック** があります: どの瞬間にも Python
バイトコードを実行するスレッドはひとつで、CPU バウンドなスレッドは数ミリ秒ごとに
ロックを手放してほかに順番を譲ります。四つのコアの四つのスレッドは、一つのコアで
交代に二乗を足し、切り替えのコストを上乗せします。Python のスレッドは待つため
のものです — ソケット、ファイル、`sleep` を待つあいだはロックが解放され、
並行性は本物です。CPU 仕事への答えは `multiprocessing` か
`concurrent.futures.ProcessPoolExecutor` で、別々のロックを持つ別々の
インタプリタを動かし、引数のコピーでその代価を払います。

出力が決定的なのは、チャンクをインデックス順に出力し、合計がスレッドの終わった
順ではなくチャンクの和だからです。`TOTAL` はスロットの合計ではなく、ロックした
合計から出力してください — ロックがこのマップの主題で、ふたつは一致しなければ
なりません。
'''
hints = [
  "join() は None を返します。work にインデックスと書き込むスロット、それと足し込むロック付きの dict を渡してください。それがスレッドから値を出す方法です。",
  "全部 start、全部 join、それから出力。スレッドの中で出力すると交互に混ざります。join の後にスロットから出力すれば混ざりようがありません。",
  "n*(n+1)*(2n+1)/6 が合計の閉じた式です。TOTAL を一度これと照らせば、チャンクの境界が正しいとわかります。",
  "大きな n で k=1 と k=4 の時間を比べてください。一致したら、GIL に出会ったのです。それはこの課題のバグではなく、このプログラムの次の版が ProcessPoolExecutor になる理由です。",
]
