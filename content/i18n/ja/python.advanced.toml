# prose of `content/python/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "python.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.conversions"
title = "三つの姿、ひとつの名前"
story = "魚屋のノートには値段が文字として、数として、ドルとして書いてあり、三つとも price と呼ばれています。"
brief = '''
一行を読みます: セント単位の金額で、数字だけです。

三行を出力してください:

1. 前後の空白を除いた文字列の文字数
2. 金額を数として
3. 金額をドルとして、小数点以下ちょうど二桁で

```
input:  1234
output: 4
        1234
        12.34
```

金額は非負です。**ひとつの名前** を三回束縛し直して書いてください —
`str`、次に `int`、そしてまた `str` です。Python では名前は何でも保持でき、
途中で気を変えられます。その代償として、いま `cents` が何なのかは、上に
書かれたコードを読む以外に知る手立てがありません。

ドルの計算に `float` を経由しないでください。`1234 / 100` は今日は `12.34`
ですが、`0.1 + 0.2` は毎日 `0.30000000000000004` です。整数除算と剰余なら
ふたつの半分が正確に得られ、`f"{cents % 100:02d}"` が後半をゼロ埋めします。
'''
hints = [
  "cents がまだ文字列のうちに len(cents) を取ったものが一行目です。",
  "cents = int(cents) はその場での変換ではありません。古い名前に新しい値を束縛しているだけです。その後、文字列は消えています。",
  "f 文字列の中の :02d は、幅二、ゼロ埋め、十進です。5 セントは 0.05 であって 0.5 ではありません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.control-flow"
title = "どの通路"
story = "市場の通路番号は床にペンキで書かれ、入口の看板は各通路が何を売っているかを示すはずです。それが毎回、番号を示しています。"
brief = '''
整数 `n` をひとつ読みます。`1` から `n` までの各 `i` について、一行を出力してください:

* `i` が 3 でも 5 でも割り切れるなら `FISHVEG`
* `i` が 3 で割り切れるなら `FISH`
* `i` が 5 で割り切れるなら `VEG`
* それ以外は `i` そのもの

そのあと、`0` を読むまで一行に一つずつ整数を読み続け、`SKIPPED <k>` を
出力してください。`k` はそこまでに読んだ 0 でない行の数です。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

ループはふたつ、種類もふたつです。最初のループは始まる前に何回回るかを
知っています: `for i in range(1, n + 1)`。二つ目は知りません: `while True`
と `break` です。回数は読んだ内容で決まるからです。Python の `range` は終端の
**手前** で止まります。`range(1, n)` は、ここで誰もが一度は書くオフバイワンです。
'''
hints = [
  "両方に割り切れる場合を先に判定してください。さもないと一度も当たりません。3 と 5 で割り切れるとは 15 で割り切れることです。",
  "range(1, n) は n - 1 で止まります。スターターにはそのバグがあり、サンプル出力より一行早く終わります。",
  "while True と break が、出口が途中にあるループの Python 流の書き方です。do-while はありません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.lists"
title = "列の真ん中"
story = "SOGO 地下のローストグース売り場に四十人が並んでいます。カウンターから見えるのは列の先頭と最後尾だけで、あいだは何も見えません。"
brief = '''
標準入力は、一行目に個数 `n`、二行目にスペース区切りの整数 `n` 個です。

三行を出力してください: 最初の値、最後の値、そしてそのあいだ (両端を含まない)
にある値すべての合計。値が三つ未満なら、その合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` が真ん中です。これはスライスで、**新しいリスト** です — Rust の
スライスや Go のサブスライスと違い、Python はスライスでコピーします。
`nums[-1]` は最後の要素で、負のインデックスがあるからこそ Python では
`nums[len(nums) - 1]` と書くことがないのです。

値がひとつのとき `nums[1:-1]` は空で、その `sum` は `0` です。ほかの言語で
必要なガードがここではただで手に入ります。知っておく価値があり、思い込むより
確かめる価値があります。
'''
hints = [
  "nums[-1] は最後の要素、nums[-2] はその一つ前です。",
  "nums[1:-1] は最初と最後を除いたすべてで、空のスライスの合計はそのまま 0 になります。",
  "sys.stdin.read().split() は全部を一度に読んで任意の空白で分割するので、改行の位置は関係なくなります。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.strings"
title = "バイトは文字ではない"
story = "SOGO 地下の案内板は 銅鑼灣 を三バイトで切り、一文字と疑問符を表示しています。"
brief = '''
一行を読みます。三行を出力してください:

1. UTF-8 でエンコードしたときの **バイト** 数
2. **文字** 数
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII の外の文字が含まれることがあり、そのときは最初のふたつの数が
一致しません。Python の `str` はコードポイントの列なので `len` は文字数です。
バイトが欲しければ `.encode("utf-8")` で明示的に求め、**その** `len` が
もうひとつの数になります。

`s[::-1]` は文字列を反転します。ステップ `-1` のスライスで、どんなシーケンス
にも使えます。
'''
hints = [
  "len(line) は文字数。len(line.encode(\"utf-8\")) はバイト数。スターターは間違ったほうを先に出力しています。",
  "line[::-1] で反転は終わりです。str をスライスすると str が返ります。",
  "バイト列を反転するとマルチバイト文字が真っ二つになります。str の反転ではそうなりません。str にはバイトが入っていないからです。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.dicts"
title = "市場の呼び声"
story = "七時のボーリントン・ロード。どの屋台も何かを叫んでいて、キャナル・ロード側の掲示板はその順位を欲しがっています。"
brief = '''
標準入力を丸ごと読み、空白で分割します。

異なる単語をそれぞれ一度ずつ `<word> <count>` として出力してください。順序は
回数の降順、同数なら単語の昇順です。

```
input:  tram tram bus
output: tram 2
        bus 1
```

dict は挿入順を覚えていますが、それは求められている順序ではありません。
タプルを返す `key` を渡した `sorted` は、最初の要素で並べ、同じなら二番目で
決めます。回数を負にするのが、片方を降順にしつつもう片方を昇順のままにする
方法です。
'''
hints = [
  "スターターは最初の単語で KeyError で死にます: counts[word] += 1 は書く前に読みますが、読むものがありません。counts.get(word, 0) がゼロを補います。",
  "sorted(counts.items(), key=...) が (word, count) の組を求めた順序で返します。dict 自体は挿入順のままです。",
  "key=lambda item: (-item[1], item[0]) — 回数の降順、次に単語の昇順を、タプルひとつで。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "python.advanced.06.sets"
title = "両方の屋台にあるもの"
story = "通路を挟んで向かい合う野菜屋がふたつ。濡れた床を二度も渡らずに、どちらからでも買えるものを知りたい客がいます。"
brief = '''
標準入力は二行で、それぞれ屋台の品物をスペース区切りで並べたものです。
同じ品物が二回書かれていることもありますが、一回と数えます。

三行を出力してください:

1. `BOTH` の後に両方のリストにあるものすべてを、ソートしてスペース区切りで —
   何もなければ `BOTH -`
2. `ONLY_A <k>`: 最初のリストにあって二番目にないものの数
3. `ALL <k>`: どちらかのリストにある異なる品物の数

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set` には重複がなく、順序もありません。`&`、`-`、`|` が三つの演算です。
set に `sorted` をかけるとリストになり、それが決まった順序で出力する
唯一の方法です。
'''
hints = [
  "set(input().split()) でトークンから直接 set を作れます。重複した tofu は入る途中で消えます。",
  "a & b は積集合、a - b は差集合、a | b は和集合です。それぞれの len が数です。",
  "\" \".join(sorted(both)) には文字列が必要で — これはもう文字列です — `if both else \"-\"` が空の場合をひとつの式で片付けます。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "python.advanced.07.functions"
title = "一斤あたり"
story = "ボーリントン・ロードの値札は特に書いていなければ一斤あたりですが、値札プリンターは毎回それを言われないと動きません。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<NAME> <CENTS>` または
`<NAME> <CENTS> <UNIT>` です。

`<NAME> $<dollars>/<unit>` を小数点以下二桁で返す `tag(name, cents, unit="catty")`
を書き、一行に一つずつタグを出力してください。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

スターターの `tag` にはデフォルトがないので、トークンが二つの行で落ちます:
`TypeError: tag() missing 1 required positional argument`。デフォルト引数は
関数の契約の一部です — 呼び出し側が何を省略でき、省略したら何になるかを
表しています。

行を `.split()` で分け、セントを変換したうえで `tag(*parts)` として渡して
ください。`*` はリストを位置引数に展開するので、二要素のリストも三要素の
リストも同じシグネチャに収まります。
'''
hints = [
  "def の行に unit=\"catty\"。それで修正は完了です。",
  "デフォルトはデフォルトのないパラメータの後に置きます — def tag(name, cents, unit=\"catty\") — そして、リストや dict をデフォルトにすると呼び出し間で共有されます。それが次に聞かれる質問です。",
  "tag(*parts) はリストを展開します。要素が二つなら三つ目はデフォルトが埋めます。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "python.advanced.08.exceptions"
title = "数字ではない行"
story = "魚屋の秤が重さの列を印字しますが、その真ん中に誰かの電話番号が混ざっています。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数のはずです。

各行について、値の二倍か、解析できなければ `BAD <line>` を出力してください。
最後に `SUM <total>` を出力します。`total` は出力した値の合計です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")` は `ValueError` を送出します。Python が変換の失敗を伝える方法は
それだけです — `Result` も `(value, ok)` もありません。失敗は例外であり、
数を期待していたコードが `try`/`except ValueError` でどうするかを言わなければ
なりません。

`Exception` ではなく **`ValueError`** を捕まえてください。裸の `except:` は
`KeyboardInterrupt` も自分のコードのタイプミスも飲み込みます。プログラムが
静かに失敗するようになるのはそういう経緯です。
'''
hints = [
  "スターターは xx で ValueError: invalid literal for int() with base 10 で死にます。そのメッセージが、捕まえるべき例外です。",
  "try ブロックは小さく: 失敗しうる呼び出しだけを中に入れ、print と合計はその後に置きます。",
  "except の中の continue はその行のループ本体の残りを飛ばすので、悪い行は何も足しません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "python.advanced.09.comprehensions"
title = "ボーリントン・ロードを一往復"
story = "アレックスは for ループ三つでできると言います。通路は人ひとり分の幅で床は濡れています。通れるのは一回だけです。"
brief = '''
標準入力はスペース区切りの整数一行です。

三行を出力してください:

1. 偶数の値の合計 (なければ `0`)
2. `10` より大きい値をすべて二倍にし、順序どおりにスペース一つで結合したもの —
   なければ `-`
3. 異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

インデックスのループではなく内包表記を使ってください: `sum` の中にジェネレータ式、
二行目には `if` 付きのリスト内包表記、三行目には集合内包表記です。`if` は末尾に
置いてフィルタし、先頭の式が変換します。

`" ".join(...)` は文字列を要求するので、二つ目の内包表記は `v * 2` ではなく
`str(v * 2)` を作らなければなりません。`TypeError: sequence item 0: expected str
instance, int found` は、この行で誰もが出会うエラーです。
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — ジェネレータ式は唯一の引数であれば余分な括弧は要りません。",
  "[str(v * 2) for v in nums if v > 10] — 先頭で変換、末尾でフィルタ。",
  "{v for v in nums} は集合内包表記です。set(nums) と同じもので、ここではどちらでも構いません。",
]

