# REMIX LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/remix/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and live in the
# English pack only. Code blocks and identifiers are copied verbatim, never
# translated.

pack   = "remix.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet.01.flush"
title = "フラッシュ"
story = "06:30、ジャーディンズ・バザール。キオスクは答えをすべてバッファに書いたのに、画面は真っ白のままだった。"
brief = '''
**Go** で、`main` は次のように始まります。

```
in := bufio.NewReader(os.Stdin)
out := bufio.NewWriter(os.Stdout)
// ____
```

まさにその場所に置いて、`main` が戻るときに `out` へ書いたものがすべて画面に届くようにする行はどれですか？
'''
hints = [
  "バッファ付きライターはフラッシュしたときにしか書き出しません。main が戻る瞬間にフラッシュを予約しましょう。",
]

