# RUST LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/rust/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.advanced.01.shadowing"
title = "三つの名前、ひとつの名前"
story = "そごう前の交差点のキオスクは、価格を文字列として、数値として、金額として持っていて、その三つすべてを price と呼んでいる。"
brief = '''
一行読み込みます: セント単位の金額で、数字だけです。

三行出力してください:

1. トリムした文字列が何文字あるか
2. その金額を数値として
3. その金額をドルで、小数点以下ちょうど二桁で

```
input:  1234
output: 4
        1234
        12.34
```

金額は非負で `i64` に収まります。ひとつの名前を二回シャドウイングして
やってください — `&str`、次に `i64`、次に `String` です。
'''
hints = [
  "二つ目の `let cents = ...` は代入ではありません。古いものを隠す新しい束縛を作り、型が違っていても構いません。",
  "だからシャドウイングは `mut` ではないのです: `mut` は型を保ちますが、シャドウイングは保ちません。",
  "先頭ゼロ付きの二桁は {:02} の幅フラグです。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.advanced.02.the-move"
title = "レシート一枚"
story = "ラッキー・マックのレジはレシートを印字したあと、お礼が言えない。名前を紙と一緒に渡してしまったからだ。"
brief = '''
一行読み込みます: 客の名前です。二行出力してください:

```
input:  MEI
output: RECEIPT: MEI
        THANK YOU, MEI
```

スターターはコンパイルできません。`receipt` は名前を**値で**受け取るので、
呼び出しのあと `main` はもうそれを所有しておらず、再び出力できません。

`receipt` が名前を取るのではなく*見る*だけにして直してください。clone は
使わないこと。
'''
hints = [
  "エラーは E0382: borrow of moved value です。ムーブは出力の時点ではなく、呼び出しの時点で起きています。",
  "&str 型の引数は借用し、String 型の引数は奪います。",
  "まずシグネチャを変えてください。すると呼び出し側に & が必要になります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.advanced.03.slices"
title = "行列の真ん中"
story = "ヒサン・プレイスの外に四十人。カウンターからは列の先頭と末尾が見えて、その間は何も見えない。"
brief = '''
標準入力は一行目が個数 `n`、二行目が空白区切りの整数 `n` 個です。

三行出力してください: 最初の値、最後の値、そしてその二つに厳密に挟まれた
値すべての合計。値が三つ未満なら、その合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1..nums.len() - 1] は Vec のスライスであって、コピーではありません。",
  "値が一つか二つだと、その範囲は空か逆向きになります。添字を使う前に if で守ってください。",
  "&i64 のイテレータはそのまま i64 に合計できます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.advanced.04.strings"
title = "バイトは文字ではない"
story = "タイムズスクエアの案内板は 銅鑼灣 を三文字で切り詰めて、一文字半しか得られない。"
brief = '''
一行読み込みます。三行出力してください:

1. その**バイト**数
2. その**文字**数
3. その行を文字単位で逆順にしたもの

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII の外の文字が含まれることがあり、そのとき最初の二つの数は
一致しません。それが要点です。
'''
hints = [
  "str::len はバイト長です。昔からそうです。",
  "chars() はスカラー値を辿るので、chars().count() がもう一方の数です。",
  "chars().rev().collect::<String>() は安全に逆順にします。バイトを逆順にするのは安全ではありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.advanced.05.structs"
title = "レジ"
story = "ラッキー・マックのカウンターは注文の全行をひとつの場所にまとめていた。提案が struct をコメントに置き換える前までは。"
brief = '''
標準入力は個数 `n`、次に `<ITEM> <CENTS>` 形式の行が `n` 行です。

品目を集める `Till` を作り、各品目を届いた順に `<ITEM> <CENTS>` として
一行ずつ出力し、最後に `TOTAL <sum>` を出力してください。

```
input:  2
        HASHBROWN 600
        SET 2800
output: HASHBROWN 600
        SET 2800
        TOTAL 3400
```

`n` は `0` のこともあり、そのときは `TOTAL 0` の一行だけです。
'''
hints = [
  "(String, i64) の Vec で足ります。struct があるのは、レジが自分の行を自分で所有するためです。",
  "add はレジを変更するので &mut self を取ります。total は読むだけなので &self を取ります。",
  "&till.items をイテレートすると借用になります。それが望みどおりです — 出力してもレジが空になってはいけません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.advanced.06.enums"
title = "誰が乗っているのか"
story = "コーズウェイベイの改札はどのカードにも大人運賃を請求する。大人ではないカードにも、カードですらないものにも。"
brief = '''
標準入力は個数 `n`、次に `<TYPE> <KM>` 形式の行が `n` 行です。

基本運賃は `500 + 100 * KM` セントです。各行について次のいずれかを出力
してください:

* `ADULT` — 基本運賃
* `STUDENT` — 基本運賃の半分、整数除算
* `SENIOR` — 常に `200`
* それ以外 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

乗客を四つのバリアントを持つ `enum` として表し、そのうちひとつには
認識できなかったタグを持たせ、運賃はひとつの `match` で決めてください。
'''
hints = [
  "バリアントはデータを持てます: Other(String) が一致しなかったタグを保持します。",
  "&str に対する match の最後のアームは残り全部を束縛します: `other => ...`。",
  "&Rider に対して match すると、Other のアームでは &String が得られます — format! はそれで問題ありません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.advanced.07.maps"
title = "バザーの叫び"
story = "九時のジャーディンズ・バザー: どの屋台も何かを叫んでいて、看板はその順位を欲しがっている。"
brief = '''
標準入力を全部読み込み、空白で分割します。

異なる単語をそれぞれ一回ずつ `<word> <count>` として出力してください。
出現回数の降順に並べ、同数なら単語の昇順で決めます。

```
input:  tram tram bus
output: tram 2
        bus 1
```
'''
hints = [
  "*counts.entry(word).or_insert(0) += 1 が数え上げループの全部です。",
  "HashMap に順序はありません。出力する前に Vec に collect してください。",
  "Ordering::then で同点処理を繋げます: 回数の降順、次に単語の昇順です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.advanced.08.errors"
title = "数字ではない行"
story = "ビクトリア・パークの検針員が提出した数字の列の真ん中に、誰かの昼食の注文が混じっている。"
brief = '''
標準入力は個数 `n`、次に `n` 行です。各行は整数のはずです。

各行について、値を二倍したものか、パースできなければ `BAD <line>` を
出力してください。最後に `SUM <total>` を出力します。total はあなたが
出力した値の合計です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`?` を使う `fn double(text: &str) -> Result<i64, ParseIntError>` を書き、
二つの結果を `main` の `match` で処理してください。
'''
hints = [
  "Result に対する `?` は、エラーを関数の外へ代わりに返してくれます。なので double の本体は二行です。",
  "match double(line) のアームはちょうど二つ、Ok(value) と Err(_) です。",
  "SUM は出力したものの合計です — 元の値ではなく、二倍した値です。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.advanced.09.iterators"
title = "怡和街を一回で"
story = "アレックスは for ループ三つでできると言う。あなたは怡和街の渋滞を知っている。通れるのは一回だけだ。"
brief = '''
標準入力は空白区切りの整数が一行です。

三行出力してください:

1. 偶数の値の合計（なければ `0`）
2. `10` より大きい値すべてを二倍にして、順番どおりに空白ひとつで
   繋いだもの — なければ `-`
3. 異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

添字ループではなく、イテレータアダプタ — `filter`、`map`、`sum`、
`collect` — を使ってください。
'''
hints = [
  "nums.iter() は &i64 を返し、filter はクロージャにそれへの参照を渡すので、引数は &&i64 です。本体に星をいくつ付けるか当てずっぽうにするのではなく、パターンで分解してください — |&&n| n % 2 == 0。",
  "join には文字列が必要なので、Vec<String> に collect する前に各数値を to_string() で map してください。",
  "イテレータから直接作った HashSet の len() が異なる値の個数です。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.str-and-string"
title = "最初の質問"
story = "香港の Rust の面接はどれもこの質問で始まり、メイは二度、うまく答えられなかった。"
brief = '''
一行読み込みます。三行出力してください:

1. 空白で区切った最初の単語を、**借用した** `&str` として — アロケーション
   なし、`to_string()` なし
2. その単語を大文字にしたもの。これは所有された `String` でなければ
   なりません。大文字版はすでに存在する何かのスライスではないからです
3. 二つが等しければ `SAME YES`、そうでなければ `SAME NO`

```
input:  lucky mac
output: lucky
        LUCKY
        SAME NO
```

`&str` は他の誰かが所有するテキストへのビューです。`String` は伸ばせる
バッファを所有します。`first_word` はビューを返すので、戻り値の型は引数
から借用し、何もアロケートしません — それが、彼らが本当に訊いている
質問への答えのすべてです。
'''
hints = [
  "split_whitespace().next() は Option<&str> を返し、それに unwrap_or を付ければ空行は空の単語になります。",
  "to_uppercase は &str ではなく String を返します — 結果は入力の一部ではないので、アロケートするしかありません。",
  "&str と String は直接比較できます。標準ライブラリが両者の等価性を実装しているので、as_str() は要りません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.combinators"
title = "unwrap をひとつも使わずに"
story = "アレックスは Rust のやつは unwrap だらけだと言い続けている。失敗しうる部分に unwrap を一切使わず、列の読み取りをもう一度書く。"
brief = '''
標準入力は個数 `n`、次に `n` 行で、各行は整数のはずです。

各行について、値を二倍したものか、パースできなければ `-1` を出力して
ください。次に `SOME <k>`（パースできた個数）と、`FIRST <v>` — パース
できた最初の値 — または `FIRST NONE` を出力します。

```
input:  3
        21
        xx
        -4
output: 42
        -1
        -8
        SOME 2
        FIRST 21
```

コンビネータでやってください: `.ok()` は `Result` を `Option` に変え、
`.map(|v| v * 2)` はそこにある値にだけ作用し、`.unwrap_or(-1)` はない
ときの答えを与えます。`find_map` なら最後の行が一回の走査で出ます。

`unwrap()` もパースできる行では「動き」ますが、`xx` でプログラム全体を
落とします。`unwrap_or` はパニックしえません。どちらがどちらかを知る
ことが、この課題です。
'''
hints = [
  "ここでは parse::<i64>() にターボフィッシュが必要です。下流に型をコンパイラに固定するものが何もないからです。",
  ".ok() はわざとエラーを捨てます — なぜ失敗したかではなく、失敗したことだけを報告するのです。",
  "find_map はどれかが Some を返すまでクロージャを実行するので、パースできた最初の行で止まります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.advanced.12.matching"
title = "ものの形"
story = "配達アプリは四つのコマンドを受け付け、古いコードはそれを九段のネストした if で調べていた。"
brief = '''
標準入力は個数 `n`、次に `n` 行で、各行は `<COMMAND>` か
`<COMMAND> <ARG>` です。

各行について出力してください:

* `GO <n>` で `n` がゼロより大きければ `FORWARD <n>`
* `GO <n>` で `n` がゼロ以下なら `STAY`
* `STOP` なら `HALT`
* それ以外なら `UNKNOWN <COMMAND>`

次に `MOVED <total>`、前進した量の合計を出力します。

```
input:  4
        GO 3
        GO -1
        STOP
        JUMP 9
output: FORWARD 3
        STAY
        HALT
        UNKNOWN JUMP
        MOVED 3
```

分割した行に対する `match` はひとつ、`GO` のアームに**ガード**を付けて、
二つ目の分岐なしに二つの場合を分けます。スライスパターン —
`["GO", arg]` — でマッチすれば、行の要素数が手書きの長さチェックでは
なくパターンの一部になります。
'''
hints = [
  "parts.as_slice() が、Vec をスライスパターンでマッチできるものに変えます。",
  "パターンの後の `if` はマッチガードです — 同じ形を共有する二つのアームを分けます。",
  "`[command, ..]` は最初の要素を束縛して残りを無視します。`[]` は空行で、これもカバーしなければなりません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.modules"
title = "誰に見せてよいのか"
story = "運賃表は三つのファイルに漏れ出し、そのうち二つで書き換えられた。扉の内側に置く。"
brief = '''
標準入力は個数 `n`、次に km 単位の距離が `n` 個です。

運賃のロジックをモジュールに整理してください:

* `mod fares` に、**公開**の `adult(km) -> i64` と、`adult` が呼ぶ
  **非公開**の `base(km)` — `500 + 100 * km`
* ネストした `mod fares::pass` に、`50000` を返す公開の `monthly() -> i64`

距離ごとに大人運賃を一行ずつ出力し、次に `MONTHLY <x>` を出力します。

```
input:  3
        1 2 3
output: 600
        700
        800
        MONTHLY 50000
```

スターターはコンパイルできません: 項目は存在しますが何も `pub` ではなく、
モジュールの中身は既定でそのモジュールに閉じています。この既定こそが
機能です — `base` はインターフェースの一部ではなく、それを保つのは
コンパイラです。ネストしたモジュールは、中の関数だけでなく `mod` の行
にも自身の `pub` が必要です。
'''
hints = [
  "エラーは E0603: 項目は存在し、ただ非公開なだけです。pub キーワード三つでファイル全体が直ります。",
  "base はわざと非公開のままにします — ここで唯一、他の誰にも関係のないものだからです。",
  "関数を公開しても扉は公開になりません: `mod pass` にも pub が必要です。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.advanced.14.smart-pointers"
title = "コンパイラが言えるサイズ"
story = "ラッキー・マックの伝票刺し: どの伝票も下の一枚に留められ、カウンターまでずっと続いている。"
brief = '''
標準入力は個数 `n`、次にセント単位の金額が `n` 個です。

届いた順に、金額ひとつにつきノードひとつの連鎖で保持してください:

```
struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}
```

三行出力してください:

1. 金額を順番どおり空白区切りで、なければ `-`
2. `SUM <total>`、連鎖に対する**再帰**関数から求めたもの
3. `LAST <cents>` — 最後のノードの金額 — または `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

スターターはコンパイルできず、そのエラーこそ `Box` が存在する理由です。
`next: Option<Entry>` と書くと、コンパイラは `Entry` をメモリ上に配置
しなければなりません: `cents` の `8` バイトに加えて `Entry` の大きさぶん
— それがまさに今計算しようとしているものです。E0072、*recursive type
has infinite size*。

`Box<Entry>` はヒープ上の割り当てへのポインタで、ポインタのサイズは
コンパイラがすでに知っています。指す先を所有します: 所有者はちょうど
ひとり、`Box` がドロップされたときに解放され、カウントもなく共有も
ありません。`Option<Box<Entry>>` は連鎖の終端でもありその中のノードでも
あり、それがポインタひとつぶんの値に収まります — `None` は余分なタグ
バイトではなくヌルアドレスとして格納されるので、`Box` 単体より何も
余計にかかりません。
'''
hints = [
  "コンパイルエラーは一語で直ります: Option<Entry> を Option<Box<Entry>> にして、コンストラクタに Box::new を足します。",
  "後ろから前へ組み立ててください — 金額を逆順にイテレートし、新しいノードそれぞれに、すでにある連鎖を next として渡します。前から後ろへ組むには末尾へのカーソルが要り、それはまだ要らない借用の争いです。",
  "消費せずに辿るには Option<&Box<Entry>> を持ちます: 始めは head.as_ref()、進むには entry.next.as_ref() です。.as_ref() は &Option<T> を Option<&T> に変え、これが連鎖を壊さずに済む手です。",
  "再帰の合計に mut もループも要りません: Some(entry) => entry.cents + sum(&entry.next)、None => 0。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.advanced.15.testing"
title = "自分で証明する"
story = "06:40 に誰かが代わりに確かめてくれることはない。表はすぐそこにある。緑にする。"
brief = '''
プログラムは正しいと分かっている `(km, fare)` の組を四つ持つ表を保持し、
そのすべてに対して `fare` を確かめ、`<name> ok` か
`<name> FAIL got <g> want <w>` を出力し、次に `PASSED <k>/4` を出力します。
最後に標準入力から距離をひとつ読み込み、`FARE <x>` を出力します。

`fare(km)` は `500 + 100 * km` であるべきです。スターターのものは間違って
いて、表がそれを捕まえます — それがまさに要点です。

```
input:  4
output: zero ok
        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

表には触らないでください。それが仕様です。実際のクレートでは
`#[cfg(test)] mod tests` の中にあり、`cargo test` がそれを走らせます。表は
どちらでも同じです — 変わるのはハーネスだけで、読める表は読めない
ハーネスより価値があります。
'''
hints = [
  "表が仕様です。間違っているのは関数の方です。",
  "四つのうち三つが失敗し、通るのは km = 0 のひとつだけです。テストケースひとつでは何も証明できない理由がまさにそれです。",
  "クレートではこれは #[cfg(test)] mod tests の中の #[test] fn fares() と assert_eq!(fare(arg), want) です。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.traits"
title = "彼女だけのトレイト"
story = "パーシバル・ストリートの携帯キオスクは、あなたが書く前にどの行も完成させてしまう。あなたが自分で名付けたトレイトには、補完がひとつもない。"
brief = '''
標準入力は個数 `n`、次に `n` 行で、各行は次のどちらかです

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` — `ROUTE` は数値

看板ごとに `<tag> <rendering>` を一行出力し、次に `SIGNS <n>` を出力します:

* `Shop` は `<NAME> / F<FLOOR>` として描画され、タグは `SIGN`
* `Stop` は路線番号として描画され、タグは `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

トレイトをひとつ宣言し、二つの異なる struct に実装してください:

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` は**デフォルトメソッド**です。`Shop` は何も言わずに `SIGN` を得て、
`Stop` は自分のものを書いて `TRAM` を得ます。これが面接で忘れられがちな
トレイトの半分です: トレイトはシグネチャの一覧であるだけでなく振る舞い
を持てて、上書きは任意です。

出力は**ひとつ**の関数 `fn show<T: Sign>(sign: &T)` を通してください。
境界が契約です — `show` は `Shop` も `Stop` も知らず、渡されたものに
`render` と `tag` があることだけを知っています。コンパイラは具象型ごとに
`show` のコピーをひとつ生成し、呼び出しは直接です。

スターターはコンパイルできません。トレイトは宣言され struct も存在し
ますが、それだけでは何も得られません: `show(&Shop { .. })` は E0277、
*the trait bound `Shop: Sign` is not satisfied* です。トレイトを宣言する
ことと実装することは別々の行為で、Rust では二つ目は必ず書き出します。

両方の看板をひとつの `Vec` に入れるのは別の仕組みです — `Box<dyn Sign>`、
ポインタと vtable で、実行時に引かれます。ここでは要りません。どの
呼び出し箇所でも具象型がまだ見えているからです。それは次のマップの
問いで、自分が持っているのが二つのどちらかを知ることが、そこで訊かれる
ことです。
'''
hints = [
  "impl Sign for Shop は struct の外に書きます。トレイトは何をするかを言い、impl はどうやるかを言います。コンパイラは前者から後者を推論しません。",
  "Shop の impl から tag を完全に外せば、トレイトの版が使われます。Stop の impl に書けば Stop のものが勝ちます。それがデフォルトメソッドのすべてです。",
  "show<T: Sign>(sign: &T) はジェネリックなので、呼び出す場所で型が分かっていなければなりません — それは match のアームの中、作ったばかりのものがまだ見えているところです。",
  "両方を持つひとつの Vec には Box<dyn Sign> が必要で、それは実行時の引きを伴う別の仕組みです。それは求められていませんし、ここでそれに手を伸ばすのはトレイトについての問いへの間違った答えです。",
]

