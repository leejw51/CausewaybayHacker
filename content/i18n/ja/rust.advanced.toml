# RUST LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/rust/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.advanced.01.threads"
title = "レジ二台、カウンターひとつ"
story = "タイムズスクエア店は正午に二台目のレジを開け、行列がようやく動き出す。店のほかは何も変わっていない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

値ごとにスレッドをひとつ spawn して、その二乗を計算させます。**spawn した
順に** join し、各結果を一行ずつ出力し、次に `THREADS <n>` を出力して
ください。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

順に join することで、出力が毎回同じになります。スレッドが自分で出力
すると、そうはなりません。
'''
hints = [
  "thread::spawn は JoinHandle<T> を返します。T はクロージャが返すものです。",
  "join() は Result<T, _> を返します — Err はパニックで、ここでは unwrap が正直な選択です。",
  "個数はループの前に取っておいてください。Vec は値でイテレートすると消費されます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.advanced.02.move"
title = "持って行け"
story = "アレックスは配達員に、唯一の伝票に書かれた住所を渡し、それからカウンターにそれを読み上げてくれと頼む。"
brief = '''
標準入力は個数 `n`、次にテキストが `n` 行です。

行ごとにスレッドをひとつ spawn して、その行を大文字にして返させます。
順に join し、それぞれ出力し、次に `DONE` を出力してください。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

スターターはコンパイルできません: クロージャが `line` を借用しており、
`thread::spawn` にはスレッドがどれだけ走るか分からないので、借用がそれ
より長生きすると証明できません。ビューではなく、文字列そのものを
スレッドに渡してください。
'''
hints = [
  "エラーは E0373: closure may outlive the current function です。",
  "クロージャの前にキーワードをひとつ置くと、借用から所有に変わります。",
  "line は反復ごとにすでに新しい String なので、渡してしまっても何も損はありません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.advanced.03.channels"
title = "窓口ひとつ、配達員多数"
story = "四十人の配達員、タイムズスクエアの厨房の裏にある受け渡し口はひとつ。すべてがそこを通り、そこは決して詰まらない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

値ごとにスレッドをひとつ spawn します。各スレッドは `(index, value * 10)`
をひとつの `mpsc` チャネルに送ります。メインスレッドはそれをすべて
受け取り、index でソートし、`<index> <value>` を一行ずつ出力し、次に
`RECV <n>` を出力します。

```
input:  3
        1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```

`rx` をイテレートして受信すると、**すべての**送信側がドロップされた
ときに終わります — そして `main` がまだ握っているものも数に入ります。
ドロップしなければ、プログラムは永遠に終わりません。
'''
hints = [
  "各スレッドに自分の Sender が必要です: move クロージャの前に tx.clone() します。",
  "ループの後に drop(tx) します。それがないと、受信側は main に居座っている送信側を永遠に待ちます。",
  "rx.iter() はチャネルが閉じるまで値を返すので、collect() が受信ループの全部です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.advanced.04.mutex"
title = "引き出しひとつ、手が八本"
story = "二台のレジが同じ引き出しから現金を取り、閉店時に引き出しはそのどちらとも計算が合わない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

値ごとにスレッドをひとつ spawn して、**ひとつの共有された合計**に値を
足させます。すべて join してから、`TOTAL <sum>` と `THREADS <n>` を出力
してください。

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

スターターはコンパイルできますが間違っています: `i64` は `Copy` なので、
各 `move` クロージャは自分専用の合計を手に入れて捨てていました。ひとつを
共有し、ロックしてください。
'''
hints = [
  "Arc が共有所有で、Mutex が排他アクセスです。両方をこの順で: Arc<Mutex<i64>>。",
  "ループの中、move クロージャの前に Arc::clone(&total) します — 各スレッドが取るのはそのクローンです。",
  "lock() のガードは値に deref します。*guard += value とし、ガードはスコープを抜けるとアンロックします。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.advanced.05.rwlock"
title = "読む者は多く、書く者はひとり"
story = "ヒサン・プレイスの案内板は一分に三百回読まれ、一日に二回書き換えられるが、ロックはその違いを知らない。"
brief = '''
標準入力は個数 `n`、次に単語 `n` 個です。

`Arc<RwLock<HashMap<String, i64>>>` を保持します。単語ごとにスレッドを
ひとつ spawn して、**write** ロックを取り、その単語のカウントを増やさせ
ます。すべて join してから、**read** ロックをひとつ取り、`<word> <count>`
を単語順にソートして出力し、次に `TOTAL <sum>` を出力してください。

```
input:  3
        tram
        bus
        tram
output: bus 1
        tram 2
        TOTAL 3
```

スターターはコンパイルできません。read ロックを取ってそれを通して書こう
としていますが、`RwLockReadGuard` は `&mut` を与えてくれません。
'''
hints = [
  "write() は &mut に deref するガードを返します。read() は & にしか deref しないガードを返します。",
  "Vec<(&String, &i64)> をソートすると、まず単語でソートされます。それが出力の求めるものです。",
  "read ガードはイテレートしている間、束縛に保持してください。さもないと一時値は使い終わる前にドロップされます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.advanced.06.lifetimes"
title = "それはいつまで有効か"
story = "出発案内板は時刻表のコピーではなくビューを持っていて、時刻表がいつ捨てられるのかは誰も書き留めていない。"
brief = '''
標準入力は個数 `n`、次に `n` 行です。

入力の**借用した** `&str` スライスを保持する `Board` を作ってください —
`String` なし、コピーなし — そして `longest()`（同じ長さなら先の行が
勝ち）と `bytes()` を与えます。

最も長い行、次に行数、次にその合計バイト長を出力します。

```
input:  3
        tram
        percival street
        mtr
output: percival street
        3
        22
```

スターターはコンパイルできません: 参照を保持する struct は、その参照が
いつまで有効かを言わなければなりません。それが E0106 で、直すには struct、
`impl`、そして `longest` の戻り値にライフタイムパラメータを付けます。
'''
hints = [
  "struct Board<'a> { lines: Vec<&'a str> } — struct はライフタイムに対してジェネリックになりました。",
  "impl<'a> Board<'a> — 型パラメータと同じく、使う前に宣言します。",
  "longest は &str ではなく &'a str を返します: 答えは self の借用より長生きし、入力に属しています。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.advanced.07.generics"
title = "一度だけ書く"
story = "アレックスは largest を四回書いた — 運賃用、分用、配達員用、停留所名用 — そして五つ目がシフトの終わりまでに要る。"
brief = '''
標準入力は二行: 一行目が整数、二行目が単語です。

両方に使える `largest` を**ひとつ**書き、`larger()` と `smaller()` を持つ
ジェネリックな `Pair<T>` を書いてください。

最大の整数、最大の単語、次に最初の二つの整数からなる `Pair` について
`PAIR <larger> <smaller>` を出力します。同じ値なら `a` が larger と
みなします。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

スターターはコンパイルできません: `largest` が `i64` に釘付けなので、
単語を渡すと E0308 です。
'''
hints = [
  "largest<T: PartialOrd + Copy> — 比較のための PartialOrd、そしてループがスライスから値を取り出すので Copy です。",
  "&str は Copy かつ PartialOrd なので、同じ関数が単語のリストをそのまま受け取ります。",
  "境界は struct ではなく impl ブロックに置きます: impl<T: PartialOrd> Pair<T>。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.advanced.08.iterator"
title = "自分だけの for ループ"
story = "トラムは筲箕湾からケネディタウンまでのすべての停留所を挙げるが、その一覧をどこにも持っていない。"
brief = '''
標準入力は整数三つ: `start`、`step`、`count` です。

`Stops` に `Iterator` を実装して、`start` から始まり `step` ずつ進む値を
`count` 個返すようにしてください。各値を一行ずつ出力し、次にイテレータ
自身の `sum()` で計算した `SUM <total>` を出力します。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

`next` さえあれば、`for`、`sum`、`map`、`take` とその他が無料で手に入り
ます。それがトレイトを実装して得られるものです。
'''
hints = [
  "next は残りがないとき None を返し、その None が for ループを終わらせます。",
  "進める前に、返そうとしている値を保存してください。さもないと一歩ずれます。",
  "left がカウントダウンです。値を渡すたびに減らしてください。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.advanced.09.pipeline"
title = "ラインの料理人"
story = "ボー料理長の夜の厨房はラインで動く: ひとつの持ち場が注文を二乗し、次の持ち場が累計を持ち、誰もバッチ全体を待たない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

`mpsc` チャネル二つとスレッド二つで二段のパイプラインを組んでください:

1. 一段目は各値を二乗して送る
2. 二段目はそれを受け取り、累計を持ち、`(square, total)` を送る

`main` は受け取った組を `<square> <total>` として出力し、次に `PIPE <n>`
を出力します。

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

各段の送信側はそのスレッドに**ムーブされる**ので、スレッドが終わると
ドロップされ、次の段の `for` ループが終わります。どこかにコピーを残すと、
プログラムはハングします。
'''
hints = [
  "nums を最初のスレッドにムーブする前に個数を取っておいてください。",
  "二つ目のスレッドの中の for square in rx1 は受信ループで、一段目が tx1 をドロップすると終わります。",
  "main の rx2 に対するループは二つ目のスレッドが終わると終わります。だからその後の join はハングしません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.async"
title = "async は実際どこで動くのか"
story = "メイは async の Rust を四年書いてきて、それを駆動しているものを一度も見たことがない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

ここにランタイムはありません — tokio も、クレートも一切なし。エグゼキュータ
を書いてください。

`block_on` を完成させます。フューチャを `Ready` になるまでポーリングし、
値**と何回ポーリングしたか**を返します。それから、各値について順に
`double(v)` を await して結果をそれぞれ出力する `async` ブロックを
`block_on` し、`SUM <total>` と `POLLS <k>` を出力してください。

`double` は返る前に一度 yield するので、値ごとに余分なポーリングが一回
かかります: `POLLS` は `n + 1` です。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        POLLS 4
```

`async fn` は `Future` を実装する状態機械で、`.await` は「内側をポーリング
する。`Pending` なら `Pending` を返し、どこまで来たかを覚えておく」です。
何かがポーリングするまで何も動きません。その何かは三十行で、一度書く
ことは五度読むことより価値があります。
'''
hints = [
  "Box::pin は unsafe なしで Pin<Box<F>> を与え、.as_mut() がそれを poll の求める Pin<&mut F> に変えます。",
  "Context::from_waker(&waker) が儀式の全部です — Waker は本物のランタイムがあなたを再スケジュールするのに使うものです。",
  "このエグゼキュータは Pending でビジーループします。本物なら waker が起きるまでスレッドを park します。それが唯一の興味深い違いです。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.send-sync"
title = "なぜ渡れないのか"
story = "同じコード、同じ Vec、違う単語はひとつ、そして二つのうち片方はコンパイルできない。どの単語か、なぜかを言う。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

ひとつの共有された合計を通して二つのスレッドで合計し、次を出力して
ください:

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

最後の二行は、`assert_send` と `assert_sync` がハンドルを受け入れた場合に
だけ出力されます — そしてその二つの関数は実行時には何もしません。
`fn assert_send<T: Send>(_: &T) {}` です: 検査は境界そのもので、コンパイル
時に起きるか、まったく起きないかです。

スターターはコンパイルできず、そのエラーが教訓です。`Rc` は `Send` では
ありません。参照カウントがアトミックでないただの整数だからです — 二つの
スレッドがひとつの `Rc` をクローンすると競合するので、コンパイラは `Rc`
がスレッド境界を越えることを一切拒みます。`Arc` は同じものをアトミックな
カウントにしたもので、`Send` です。

`Sync` はもう半分です: `&T` が `Send` のとき `T` は `Sync` です。
`Mutex<T>` は任意の `T: Send` について `Sync` です。ロックこそが共有
アクセスを安全にするものだからです。
'''
hints = [
  "エラーは E0277: `Rc<Mutex<i64>>` cannot be sent between threads safely です。型名がひとつ変わり、それに伴って import がひとつ変わります。",
  "Rc の参照カウントはただの usize で、Arc のは AtomicUsize です。その一点の違いが、片方が Send でもう片方がそうでない理由のすべてです。",
  "assert_sync(&*total) は周りの Arc ではなく Mutex そのものについて訊きます — Mutex<T> は T が Send であれば Sync です。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.advanced.12.dispatch"
title = "今か、あとか"
story = "同じ二つの店構え、同じ描画、そして面接官は両方の綴りを同時にボードに書けと言う。"
brief = '''
標準入力は個数 `n`、次に `SHOP <NAME> <FLOOR>` か `STOP <ROUTE>` の行が
`n` 行です。

すべての看板を**二回**描画してください: 一度は
`render_static<T: Sign>(sign: &T)` を通して、一度は
`render_dynamic(sign: &dyn Sign)` を通して、この順で — static のもの全部、
次に dynamic のもの全部。次に `DYNAMIC <k>`、`Vec<Box<dyn Sign>>` の長さを
出力します。

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        HYSAN / F4
        TRAM 2
        SOGO / F1
        DYNAMIC 3
```

二つは同一のテキストを生み、同じものではありません。`render_static` は
単相化されます: コンパイラは具象型ごとにコピーをひとつ生成し、呼び出しは
直接でインライン化できます — ただし型は**呼び出し箇所で**分かっていなけれ
ばならず、だから static の描画は、作ったものがまだ分かっているパース
の分岐の中でやらなければなりません。

`render_dynamic` はファットポインタ — データと vtable — を取り、メソッドを
実行時に引き、何を持っているかを気にしません。ひとつの `Vec` に両方を
入れられる唯一の理由がそれです。
'''
hints = [
  "render_static は具象型がまだ見えているところで呼ばなければなりません — match のアームの中、値を box に入れる前です。",
  "sign.as_ref() は &Box<dyn Sign> を &dyn Sign に変えます。box 自体を渡すには二段目の deref が要ります。",
  "二つの関数の本体は同じ一行です。違いはすべてシグネチャにあり、すべてメソッドの引き当てがどこで起きるかにあります。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.interior-mutability"
title = "共有参照越しの変更"
story = "扉のカウンターは、四つの別々のコードがそれを見ているだけの間に、増えなければならない。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

四行出力してください:

1. `CELL <k>` — 値ごとに一回増やした `Cell<usize>` を `.get()` で読み
   戻したもの。すべてただの `&` 参照を通して
2. `REF <sum>` — 値で満たした台帳を合計したもの
3. `RC <k>` — 台帳は `Rc<RefCell<Vec<i64>>>` で、そのハンドルを**二つ**
   持ちます。両方が生きている間に `Rc::strong_count` を出力
4. `DOUBLE panic` — 同じ `RefCell` に対して `borrow_mut()` を同時に二つ、
   わざと取り、そのパニックを `std::panic::catch_unwind` で捕まえる

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T` は普通、誰も変更できないという意味です。`Cell` と `RefCell` は公認の
例外で、その代価を別々の通貨で払います: `Cell` は値をまるごと出し入れ
するだけなので、検査がまったく要りません。`RefCell` は本物の参照を配る
ので借用規則を強制しなければならず — コンパイル時のエラーではなく、
実行時のパニックで。

`Rc<RefCell<T>>` は誰もが結局手を伸ばす組み合わせで、それぞれの半分が
何をするか言えるだけの価値があります。`Rc` は値に複数の所有者を与えます
— 非アトミックな参照カウントなので `Send` ではなく、スレッドを越えません
（それが `send-sync` のマップでした）。`RefCell` はその所有者たちに変更
する権利を与えます。どちらも `Mutex` ではありません。共有**かつ**可変は
まさに借用チェッカがコンパイル時に拒むもので、このパターンはそれを
実行時に買い戻し、間違えたときにパニックを請求します。

そのパニックはこの課題のバグではありません。それが代価で、一度見ること
が要点です。
'''
hints = [
  "Cell に borrow() はありません: get() でコピーを取り出し、set() で値をまるごと入れます。だから実行時の記録が要らないのです。",
  "ledger.borrow_mut().push(v) をひとつの文にすると、ガードはセミコロンでドロップされ、それがループを合法に保ちます。",
  "catch_unwind はクロージャが &RefCell を捕捉するので、その周りに AssertUnwindSafe が必要です。パニックのメッセージは stderr に出ますが、テストはそれを読みません。",
  "Rc::clone(&ledger) を .clone() ではなくこう綴るのは、読む人がそれが Vec ではなくハンドルをコピーすると分かるためです。Rc::strong_count は両方のハンドルが生きている間は 2 を返し、パニックのテストでの二つの borrow_mut() は各ハンドルから一つずつでも構いません — 同じ RefCell で、まとめて数えられます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.advanced.14.custom-error"
title = "自分のエラー"
story = "運賃サービスの四つの層がそれぞれ独自の失敗型を作り出し、どれも互いに変換できない。"
brief = '''
標準入力は個数 `n`、次に `n` 行で、各行は km 単位の距離のはずです。

`enum FareError { NotANumber, Negative(i64) }` を定義し、それに `Display`
と `std::error::Error` を実装し、`?` が自分で変換できるように
`From<std::num::ParseIntError> for FareError` を実装してください。

`fare(text) -> Result<i64, FareError>` は `?` でパースし、負の距離を拒み、
それ以外は `500 + 100 * km` を返します。各結果かエラーの `Display` テキスト
を出力し、次に `ERRORS <k>` を出力します。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

スターターはコンパイルできません。`?` は単に伝播するだけではなく — 出て
いく途中で `From::from` を呼び、その impl がなければ `ParseIntError` から
あなたの型への経路がありません。`From` を実装することが、`?` を層の境界
を越えて働かせるもので、エラー enum を持つ価値がある理由のすべてです。

`map_err` は答えのもう半分で、型を変換するのではなく文脈を付けたいとき
のものです。訊かれたら触れてください。ここでは要りません。
'''
hints = [
  "エラーは `?` の上の E0277: the trait From<ParseIntError> is not implemented for FareError です。",
  "六行: impl From<ParseIntError> for FareError に、FareError::NotANumber を返す fn from です。",
  "Display は {} が出力するもの、Debug は {:?} が出力するもの、Error トレイトは Box<dyn Error> に入れられるようにするものです。三つとも持つ価値がありますが、ここで必要なのはひとつだけです。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.advanced.15.atomics"
title = "一語、ロックなし"
story = "改札のカウントにロックは要らない。機械室のそれ以外にはすべて要る。その区別をつけるのが仕事だ。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個です。

値ごとにスレッドをひとつ spawn します。各スレッドは共有の `AtomicI64` に
自分の値を足し、共有の `AtomicUsize` を一つ増やします — `Mutex` はどこにも
使いません。すべて join して `TOTAL <sum>` と `HITS <n>` を出力してください。

それから: `main` の**先頭**で `first` と `second` という名前の `Guard` 値を
二つ宣言し、その `Drop` が `DROP <name>` を出力するようにします。それらは
`main` の終わり、他のすべてが済んだ後に、宣言の逆順で走ります。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
        DROP second
        DROP first
```

アトミックは安い mutex ではありません。一命令で読み・変更・書き込みされる
機械語一語のための、別の道具です。二つのフィールドが互いに整合している
必要が出た瞬間、ロックが戻ってきます — 「この二つを、一緒に」のための
アトミックはありません。

ここでは `Ordering::Relaxed` で十分です。これらの増分が他のどの書き込み
に対して*いつ*見えるようになるかには何も依存せず、ひとつも失われない
ことだけが要るからです。その一文が追加の質問で、`Relaxed` の意味の
すべてです。
'''
hints = [
  "fetch_add は前の値を返し、加算をアトミックに適用します。ロックもガードもありません。",
  "Arc はやはり必要です — アトミックが安全にするのは*アクセス*であって、*共有*ではありません。",
  "Drop は宣言の逆順で走るので、`second` が先です。_first と _second として束縛すれば main の終わりまで生かせます。裸の `_` では即座にドロップされます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.closure-kinds"
title = "三種類のクロージャ"
story = "面接官はボードに `Fn`、`FnMut`、`FnOnce` と書き、コールバックはどれであるべきかと訊く。正解はある。"
brief = '''
標準入力は個数 `n`、次に整数 `n` 個で、`n` は一以上です。

各種類のクロージャをひとつずつ使ってください:

* `apply_fn<F: Fn(i64) -> i64>` — 最初の値をコピーで捕捉し、すべての値に
  足します。各結果を出力します。
* `apply_fn_mut<F: FnMut(i64)>` — `main` にあるカウンタを増やします。
  `SEEN <k>` を出力します。
* `apply_once<F: FnOnce() -> String>` — 捕捉した `String` を**ムーブして**
  取り出し、返します。`TAKEN <s>` を出力します。文字列は `<n> items` です。

```
input:  3
        10 20 30
output: 20
        30
        40
        SEEN 3
        TAKEN 3 items
```

三つのトレイトはメニューではなく階層です: すべての `Fn` は `FnMut` で、
すべての `FnMut` は `FnOnce` です。クロージャが何を実装するかは、捕捉
したものを*どうする*かで決まります — 読む（`Fn`）、変更する（`FnMut`）、
消費する（`FnOnce`）— そして `move` はどう捕捉するかを変えるのであって、
どのトレイトになるかを変えるのではありません。

スターターはコンパイルできません。`apply_once` は `Fn` を求めていますが、
`String` を渡してしまうクロージャは一度しか呼べないので `FnOnce` であり、
それ以上ではありません。呼び出し側が我慢できる最も弱い境界を取ってくだ
さい: 一度しか呼ばないなら `FnOnce` を求めれば、他のすべてのクロージャを
理由なく締め出さずに済みます。
'''
hints = [
  "エラーは E0525: expected a closure implementing Fn, but this one only implements FnOnce です。",
  "変わるのは一語: apply_once の境界です。クロージャはすでに正しいです。",
  "apply_fn_mut は `mut f: F` を取ります — クロージャが自分の捕捉を変更するには、引数そのものが可変でなければなりません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.advanced.17.deadlock"
title = "デッドロック"
story = "タイムズスクエアの機械室、二階下。ロック二つ、スレッド二つ、そして両方のエスカレーターが同じ秒に止まった。"
brief = '''
口座が二つ、`A` と `B`、それぞれ `Arc<Mutex<i64>>` です。

標準入力は一行目が初期残高、二行目が個数 `n`、次に `<FROM> <TO> <AMOUNT>`
が `n` 行で、`FROM`/`TO` は `{A, B}` のいずれかです。

すべての送金をそれぞれ自分のスレッドで実行し、すべて join してから
`A <balance>`、`B <balance>`、`MOVED <n>` を出力してください。

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

スターターには間違いが二つあり、出力に現れるのはそのうちひとつだけです。
送金元から引いて送金先に足していません — それが見える方のバグです。
もうひとつは形です: *送金元を先に*ロックすると、逆向きの送金二つが
それぞれロックをひとつ握って相手を待つ、永遠に。

両方のロックを、**常に同じ全体順序で** — 金の向きがどちらであれ `A` 次に
`B` — 取れば、循環はできません。
'''
hints = [
  "どちらの残高にも触る前に両方の口座をロックし、常に同じ順序で。",
  "どのガードにマイナスが付くかを決めるのは金の向きで、どのロックを先に取ったかではありません。",
  "二つのガードは transfer の終わりに逆順でドロップされ、それで構いません — 重要なのは取得の順序です。",
]
