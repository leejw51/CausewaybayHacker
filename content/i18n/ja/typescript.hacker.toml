'''
hints = [
  "edit[i][0] = i と edit[0][j] = j: 接頭辞を空にするコストは一文字ごとに削除一回です。",
  "一致する文字はコストなしで斜めに進みます。不一致はコスト一で、三つの隣のうち最も安いものを取ります。",
  "LCS は min の代わりに max を使う同じ歩きで、不一致では斜めに進みません。そして配列で `fill` するのではなく、必ず関数付きの `Array.from` を — `fill` はすべての枠に同じオブジェクトを入れます。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.hacker.19.knapsack"
title = "かばんに入るもの"
story = "ライダーが一人、かばんが一つ、そして重さとチップの付いた注文の板。貪欲法は間違ったものを選ぶ。"
brief = '''
一行目は `n cap` です。続く `n` 行は `<weight> <value>` です。各品物は多くても**一度**しか取れません。

`cap` に収まる最良の合計価値を出力し、次に `GREEDY <v>` を出力してください: まだ収まる品物のうち重さあたりの価値が最良のものを繰り返し取ったときに得られる値です。重さあたりの価値が等しければ、軽い品物が先です。

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

二つの数が違うことがこの課題の要点のすべてで、サンプルがそれを示しています: 重さあたりの価値が最良なのは `1.67` の `6 10` の品物で、それを取ると四単位の空きが残り、そこには何も収まりません。それを見送って `5 7` の品物を両方取れば `14` になります。隠しケースは小さいので、検査するのは表が速いかではなく、両方の数を正しく出したかです。

比率は正確に比べてください。ここに分数の型はなく、`value /
weight` は倍精度です: 紙の上で等しい二つの比率が二進では少しずれることがあり、そうなると同点の決着は決して走りません。代わりにたすき掛けしてください — `a.value * b.weight` 対 `b.value * a.weight` — 積が `2^53` 未満にとどまる限り、整数で正確です。
'''
hints = [
  "容量は下向きに歩いてください — `for (let room = cap; room >= weight; room--)` — それが無制限ではなく 0/1 にするものです。上向きだと同じ品物を再利用できてしまいます。",
  "比較関数 `(a, b) => b.value * a.weight - a.value * b.weight || a.weight - b.weight` は、割り算をどこにも使わずに最良の比率を先に、同点なら軽い品物を先に置きます。",
  "貪欲の走査は整列した品物の上のまっすぐなループです — 後戻りなし。まさにそれが間違っている理由です。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.hacker.20.bits"
title = "ひとりぼっちの一つ"
story = "伝票はどれも二回スキャンされる、一枚を除いて。Map は使わせてくれないし、ソートもさせてくれない。"
brief = '''
一行目は `n` です。二行目は `n` 個の非負整数で、一つを除くすべての値がちょうど二回現れます。

四行を出力してください:

1. 一回だけ現れる値。**xor** と定数の追加領域で見つけます
2. その中で立っている `1` のビットの数
3. 二の冪なら `POW2 YES`、そうでなければ `POW2 NO`（`0` は違います）
4. 最下位の立っているビットを消した値。立っているビットがなければ `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` で `x ^ 0 == x`、そして xor はどんな順で起きても気にしません。それが一行目のすべてです。`x & (x - 1)` は最下位の立っているビットを消し、それで三行目と四行目がただで手に入ります。

ここのビット演算子はどれも、まずオペランドを **32 ビット符号付き**整数に変換します。これらのケースの値は小さいので何のコストもありません — しかし `2 ** 31 | 0` は `-2147483648` で、`2^31` 以上の値は一言もなく負になるか切り詰められて出てきます。その線を越えたら、`bigint` には幅のまったくない同じ演算子があります。面接官が尋ねる前に、その線がどこにあるかを知っておいてください。

ここの四つのケースは多くても数が五つで、時計はそこで速さを測っていません: 数を数える `Map` でもすべて通り、ソートでも通るでしょう。大きいケースでも変わりません。この問題が設ける基準は**領域** — 累積変数一つ、それ以外は何もなし — で、どんな実行制限も定数領域の答えと `Map` を見分けられないからです。それはあなたの誠実さと、尋ねてくる面接官に委ねられています。
'''
hints = [
  "組はどんな順で来ても互いに打ち消し合うので、配列の上を一回畳み込めば足ります。`nums.reduce((acc, v) => acc ^ v, 0)` は同じループを一行にしたものです。",
  "毎回最下位のビットを消してビットを数えると、ビット幅ごとではなく立っているビットごとに一回走ります。",
  "二の冪はちょうど一つのビットが立っているので、最下位のものを消すとゼロが残ります — そしてゼロ自身は手で除外しなければなりません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.hacker.21.matrix"
title = "間取り図を回す"
story = "図面は上下が逆で、机にはもう一部を広げる場所がない。"
brief = '''
一行目は `n` です。続く `n` 行は整数の `n × n` グリッドです。

**時計回りに 90°** 回したグリッドを、スペース区切りの値の `n` 行で出力してください。次にその値を**渦巻き順** — 外周を左上から時計回りに、内側へ — で一行に出力します。

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

回転はその場でするものです: 転置してから各行を逆にします。それを声に出して言うことが問題の半分です。`row.reverse()` はその場で逆にして同じ配列を返します。ここではそれが望むことで、元を残すつもりだった場所ではどこでも驚きになります。

渦巻きは元のままのグリッドを欲しがるので、回す前にコピーしてください: 各行のコピー、`grid.map((row) => row.slice())`。`[...grid]` は外側の配列をコピーし、すべての行を元と共有するので、回転は両方に書き込みます。
'''
hints = [
  "対角線より上だけを交換して転置してください — c は r + 1 から — さもないと全部を元に戻してしまいます。`[g[r][c], g[c][r]] = [g[c][r], g[r][c]]` は一時変数なしで交換します。",
  "数のグリッドには `grid.map((row) => row.slice())` で十分深いコピーです。`grid.slice()` と `[...grid]` は一段足りません。",
  "渦巻きのループの中の二つの `if` のガードが、中央の一行や一列が二度歩かれるのを止めます。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.hacker.22.trie"
title = "接頭辞の箱"
story = "トラム停留所の案内板のためのオートコンプリート — 正直な種類の、実際にリストにあるものだけを補完するもの。"
brief = '''
一行目は `n q` です。続く `n` 行は挿入する小文字の単語です。その次の `q` 行は問い合わせで、それぞれ `WORD <s>` か `PREFIX <s>` です。

トライ — 各ノードが文字から子へのマップを持つノードの木 — を作り、答えてください:

* `WORD <s>` → `s` が挿入されていれば `YES`、そうでなければ `NO`
* `PREFIX <s>` → 挿入された `n` 個の単語のうち `s` で始まるものの数

`n` 個の単語が相異なるとは約束されておらず、`PREFIX` が数えるのは異なる単語ではなく**挿入**です: `tram` を二回挿入すれば `PREFIX tram` は `2` です。`NODES` はノードを数えるので、二回目の挿入は何も加えません。

次に `NODES <k>`、根を含むトライのノードの数を出力します。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

各ノードに、そこを通る挿入された単語の数を持たせておけば、`PREFIX` は最後に数えることのない歩きです。ノードは小さなクラスで、子は文字をキーにした `Map<string, TrieNode>` です。ただの `{}` でも一文字なら持ちこたえますが、問題はその習慣です: 単語全体をキーにすると `"constructor" in {}` はすでに `true` で、一度も挿入していないプロトタイプが答えています。`Map` には引っかかる継承されたキーがありません。
'''
hints = [
  "`children.get(letter)` はない子に undefined を返し、undefined は挿入では作る合図、探索では止まる合図の両方です。",
  "`through` は踏み*込んだ*ノードで増やすので、根は自分自身を数えません。",
  "トライから落ちた問い合わせはカーソルを `undefined` のままにし、`TrieNode | undefined` は、その場合の NO と 0 がどうなるかを tsc に尋ねさせます。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.hacker.23.prefix-sums"
title = "目標に当たる道は何通り"
story = "一日の売上と、監査役が見たい数が一つ。連続する時間の並びのうち、ちょうどそれになるのはいくつか。"
brief = '''
一行目は `n k` です。二行目は `n` 個の整数で、負のこともあります。

合計がちょうど `k` になる連続した並びがいくつあるかを出力し、次に `RANGE <s>` を出力してください。リスト全体の合計で、もう一度足すのではなく最後の累積和から読みます。

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

負の値はスライディングウィンドウを殺します — 大きすぎるウィンドウは縮めても直せません。生き残るのは累積和です: 並び `i..j` の合計がちょうど `k` になるのは `prefix[j] - prefix[i] == k` のときなので、`prefix[j] - k` に等しい以前の累積和がいくつあるかを数えます。先頭から始まる並びのために、マップを `0 → 1` で初期化してください。

キーは `Map<number, number>` で。ただのオブジェクトも累積和をキーとして受け取りますが、それを**文字列**として返します: `{ [-2]: 1 }` の `Object.keys` は `["-2"]` です。型は `number` と言いました。実行時はそれを保ちませんでした。

ここの四つのケースは多くても数が五つで、時計はそこで速さを測っていません: すべての開始とすべての終わりにわたる `O(n²)` の二重ループも四つとも通ります。基準は本物です — 一日の売上ではその二重ループは何分もかかります — そしてそれはこれらのケースが検査するものではありません。検査するのは間違えやすい部分です: `0 → 1` の初期値と、記録する前に探すことです。
'''
hints = [
  "今の累積和を記録する*前に*以前の累積和を探してください。さもないと k が 0 のとき、長さ零の並びが自分自身を数えます。",
  "最初に `new Map([[0, 1]])` を置くことが、インデックス 0 から始まる並びをそもそも見つけられるようにします。",
  "`seen.get(prefix - k) ?? 0` — `||` ではなく `??`。`||` もここでは正しいのですが、置き換える数がたまたま 0 だという偶然によるだけです。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.hacker.24.inversions"
title = "時計が捕まえるもの"
story = "午後の回の最初の問題。素朴な答えは正しく、そしてそれは間違った答えだ。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **正確に**この生成器で、ラップする 64 ビットの算術で自分で作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

**反転**を数えてください: `a[i] > a[j]` となる組 `i < j` です。数を出力し、次に `MAX <largest value>` を出力します。

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
です。

**この課題は計算量を強制します。そしてそれができるのはこの種類だけです。** 隠しケースのひとつは `n = 200000` です。`O(n²)` の二重ループ — スターターはそれです — は `2 × 10^10` 回の比較で、十秒の実行制限に対してこのマシンで**四十二秒**かかりました。マージソートの途中で反転を数えるのは `O(n log n)` で、約十分の一秒で終わります。このマシンで、この二つのプログラムで測りました。

この言語が違う決め方をすることが三つあります。生成器の状態は `number` に収まりません — 倍精度で、正確なのは `2^53` までです — なので `bigint` にして、一歩ごとに `BigInt.asUintN(64, …)` でラップします。答えの `9990744366` は 32 ビット整数に収まりません。`number` はそれを正確に保ち、何も `| 0` や `>>` を適用しない限り正確なままです。そして `Math.max(...values)` は二十万個の引数をコールスタックに展開し、このマシンでは答えになる前に `RangeError` になります: 最大値はループで取ってください。
'''
hints = [
  "ソートする前にループで最大値を取るか、コピーをソートしてください: その場で動くマージソートは元の配列を並べ替えたままにします。そして 200000 個の値を `Math.max` に展開しないでください。",
  "併合で右側の値が勝ったとき、左半分の残りの要素はすべてそれより大きい — それは一度に `mid - i` 個の反転で、それが仕掛けのすべてです。",
  "再帰は log2(200000)、約十八フレームの深さです — 制限にはほど遠い。各階層で新しい配列を slice するのではなく、一度だけ確保した作業用バッファ一つを通して併合してください。圧縮した値の上の Fenwick 木はもう一つの O(n log n) の答えで、部屋で名前を挙げる価値があります。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.hacker.25.test-cases"
title = "続いて T 個のテストケース"
story = "どの選考も使う形と、どの候補者も少なくとも一度は書くバグ: 二つ目のケースが一つ目を覚えている。"
brief = '''
一行目は `T`、独立したテストケースの数です。各ケースは `n` の行、次に `n` 個の整数の行です — そして `n` が `0` のとき、その二つ目の行は空です。

各ケースについて、**異なる値の中で二番目に大きい**ものを、異なる値が二つより少なければ `NONE` を出力してください。すべての後に `CASES <T>` を出力します。

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

これは競技形式の選考の標準の枠組みで、候補者を落とす理由は一つです: ケースごとであるべき状態がループの前で宣言されていた。すべての累積変数、すべての `Set`、すべての `best` は `for` の**中**に入ります。

行ではなく空白区切りのトークンで読めば、`n = 0` の空行はそもそも特別な場合ではなくなります — それがこの形の教える二つ目のことです。

そして異なる値は比較関数を付けてソートしてください。`[...distinct].sort()` はそれらを文字列としてソートするので、`[9, 10]` は `[10, 9]` で返ってきて、二番目に大きいのは綴りがたまたま小さいほうの数になります。
'''
hints = [
  "`Set` をループの中に移してください。それが修正のすべてで、課題のすべてです。",
  "`Set` が重複を除き、`[...distinct].sort((a, b) => a - b)` がそれを並べるので、`ranked[ranked.length - 2]` が異なる値の中で二番目に大きい値です。",
  "要素一つの配列では `ranked[ranked.length - 2]` はエラーではなく `undefined` で、`console.log` は `undefined` という単語を出力してしまいます — だから長さの検査が先です。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.hacker.26.statistics"
title = "小数点以下六桁"
story = "数は、あなたの言語がたまたま出力するやり方ではなく、仕様の言うやり方で丸めてほしい。"
brief = '''
一行目は `n` です。二行目は `n` 個の整数です。

三行を、それぞれ**小数点以下六桁**で出力してください: 平均、**母集団**標準偏差（`n - 1` ではなく `n` で割ります）、そして中央値 — `n` が偶数なら真ん中の二つの値の平均です。

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

この課題は `match = "float:1e-6"` で判定されるので、比較は数値的です: `3.8` も `3.800000` も通り、`1e-7` ずれた値も通ります。それは意図的です — 要点はあなたの整形ではなく、`Math.floor(sum / n)` が `3` を返すこと、そして偶数長の中央値が時計の下で皆が間違える境界だということです。

標本ではなく母集団です。ここに統計モジュールはないので、式はあなたが書きます: 偏差の二乗の平均、それから `Math.sqrt`。`n - 1` で割ると標本偏差になり、本物の選考では両者の違いが提出のすべてです。`x.toFixed(6)` が小数点以下六桁です。

中央値のために値はソートしなければならず、**数として**ソートしなければなりません: 比較関数のない `values.sort()` は `10` を `9` より前に置きます。
'''
hints = [
  "二つの数に対する `/` はすでに本当の割り算です — うっかり落ちる整数除算はありません。スターターは `Math.floor` でわざとそうして、小数を捨てたのです。",
  "母集団偏差: `Math.sqrt(sum of (v - mean) ** 2 / n)`。n - 1 で割るのは標本のもので、ここでは間違いです。",
  "個数が偶数なら中央値は `values[n / 2 - 1]` と `values[n / 2]` の平均で、その引き算に off-by-one が潜んでいます。まず `(a, b) => a - b` でソートしてください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.hacker.27.commands"
title = "入力こそが問題"
story = "トラム停留所の案内板のログは八十桁で折り返されて機械から出てくる。そして先頭の数は単語の数ではなくコマンドの数だ。"
brief = '''
一行目は `k`、続く**コマンド**の数です。コマンドは空白で区切られたトークンで、たまたま折り返されたとおりに残りの行に詰め込まれています — 一行にいくつでも、間隔はどれだけでも、末尾に空行があるかもしれません。

| コマンド | トークン | 効果 |
| --- | --- | --- |
| `ADD <cents>` | 二つ | 品物を一つ push する |
| `VOID` | 一つ | 最後の品物を取り除く。なければ何もしない |
| `TOTAL` | 一つ | 現在の合計を出力する |
| `CLEAR` | 一つ | すべてを取り除く |

`k` 個のコマンドの後に、`COMMANDS <k>` と `ITEMS <how many are left>` を出力してください。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` はコマンドを数え、`ADD` は二つのトークンでできた一つのコマンドです — だから `k` 回走って一回に一トークン読むループは間違った場所で止まります。`k` 個のコマンドを読み、コマンドに引数があるときだけそれを引き出してください: トークン配列への添字 `tokens[at++]` がカーソルで、`tokens[at++] ?? ""` は入力の終わりを `undefined` ではなく値にします。

空のレジでの `VOID` も、何か足される前の `TOTAL` も、どちらも動かなければなりません。それが起きないと言う行は問題文にありません。そして本物の選考では、その沈黙こそが仕様です。この言語ではその端で違うふるまいをするものが二つあります: 空の配列の `items.pop()` は例外を投げず `undefined` を返します — ここでは無害ですが、それで算術をした瞬間に `NaN` です — そして初期値のない `items.reduce((a, b) => a + b)` は空の配列で例外を**投げます**。`reduce` には `0` を与えてください。
'''
hints = [
  "`input.split(/\\s+/).filter((t) => t !== \"\")` はスペース、タブ、改行の連なりをすべてまとめるので、行を読むのをやめた瞬間にファイルの折り返しは関係なくなります。",
  "ADD の引数は ADD の分岐の中で、同じカーソルから引き出してください。ループカウンターが数えるのはトークンではなくコマンドです。",
  "`items.reduce((sum, v) => sum + v, 0)` — `0` があるから、空のレジでの TOTAL は `Reduce of empty array with no initial value` を投げずに 0 を出力します。",
]

