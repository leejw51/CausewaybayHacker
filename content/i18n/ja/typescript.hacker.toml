[[quest]]
id    = "typescript.hacker.32.modular"
title = "十億七を法として"
story = "その言い回しは問題文の最後に現れ、部屋の半分はそれが何をしろと言っているのかわからない。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを、ラップする 64 ビットの算術で生成します（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて、二項係数 `C(a, b)` を **1000000007 を法として**計算してください。`q` 個すべての答えの合計を、それ自体も `1000000007` を法として出力し、次に `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は何十万桁もあるので、掛け算はどれも進みながら剰余を取ります。問題は割り算です: `a! / (b! (a-b)!)` は剰余算術では意味を持ちません。代わりになるのは**モジュラ逆数**で、`1000000007` は素数なので、フェルマーの小定理がそれを与えてくれます: 繰り返し二乗法による `inverse(v) = v^(p-2) mod p` です。

つまり: `factorial[0..n]` を一度だけ前計算し、各問い合わせに `f[a] * inv(f[b]) * inv(f[a-b])` として答えます。

**そしてこの言語が加える罠がこれです。** 二つの因数はどちらも `2^30` 未満なので、積は `2^60` 未満です — そして `number` は倍精度で、正確なのは `2^53` までです。ただの数での `a * b % P` はあふれず、例外も投げず、そして間違っています: それだとサンプルさえ `504334178` になります。掛け算を `bigint` でするか、一方の因数を 15 ビットの半分二つに分けて途中の値が `2^46` を超えないようにしてください — スターターはすでにその `mulmod` を持っていて、それを導けるようになる価値があります。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 200000`、`q = 200000` です。係数を一つずつ独立に計算する — `b` 項を掛け、`b` 項で割り、それぞれにモジュラ逆数を一つ — のは、十秒の実行制限に対してここで三十秒経っても終わっていませんでした。それがスターターです。共有する階乗の表一つなら約十分の一秒で終わります。どちらもこのマシンで測りました。
'''
hints = [
  "掛け算のたびに剰余を取り、二つの剰余を裸の `*` で掛けることは決してしないでください: 2^53 を超えると倍精度は上位のビットを保って下位のビットを落とし、答えは下位のビットです。",
  "`powmod(v, P - 2)` がモジュラ逆数で、それが動くのは P が素数だからにすぎません — それがここでのフェルマーの小定理の中身のすべてです。",
  "逆階乗も前計算すれば — `inverse[n] = powmod(factorial[n], P - 2)`、それから下へ歩いて `inverse[i - 1] = inverse[i] * i` — どの問い合わせからも pow が両方なくなります。残るのは問い合わせ一回あたり `mulmod` 二つだけです。",
]

