```

Kahn のアルゴリズム: 各タスクがいくつのものを待っているかを数え、何も待っていないものから始め、タスクを取ったらそれに依存するものを減らします。タスクが残ったまま終わったら、それらのタスクが循環です。準備済みの集合はタスク番号の最小ヒープなので、「番号の最も小さい」は走査ではなく `log n` で済みます — 併合の課題と同じ二十数行を、今回はただの数の上で。
