[[quest]]
id    = "typescript.hacker.13.backtracking"
title = "すべての組み合わせ"
story = "店の配置になりうるものをすべて挙げよ。全部を、決まった順で、同じものを二度出力せずに。"
brief = '''
一行目は `n` です。二行目は**すでに昇順に並んだ** `n` 個の相異なる整数です。

すべての部分集合を一行に一つ、値をスペース区切りで出力し、空の部分集合は `-` とします。順番は素直な再帰が生み出すとおりにします: 各位置で、まず要素を**取る**枝、次にそれを飛ばす枝です。次に `SUBSETS <2^n>` を出力します。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

push、再帰、**pop**。pop は皆が抜かす部分で、症状は最初の行より後のすべての行が長すぎることです。共有する一つの `chosen` 配列こそが要点です: 毎回の呼び出しで `[...chosen, x]` としても正しいのですが、それは一行書くのを避けるためにすべての階層で選択全体をコピーします。ここの順番は再帰そのものの順番で、それが検査されています。

`2^n` について、`1 << n` は 32 ビットのシフトで、`n = 31` から間違います。どのみち、出力した行の数が正直な数です。
'''
hints = [
  "要素ごとに再帰呼び出しを二つ: 一つはそれを push して、一つはなしで。取るほうを先にすれば、サンプルの順番が自然に出てきます。",
  "`chosen.pop()` は二つの呼び出しのあいだに入ります。それが try-recurse-undo の `undo` です。",
  "基底ケースは `at === nums.length` で、そこでの空の選択は空の部分集合で、それも数に入ります。空の配列の `chosen.join(\" \")` は空文字列なので、`-` はあなたが書くものです。",
]

