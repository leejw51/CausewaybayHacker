入るときに使ったセルに印を付け、**出るときに印を外して**ください。失敗した枝の後も印が付いたままのセルは、グリッドにはない理由で後の枝を失敗させます。`string` はその場で印を付けられません — 不変で、文字列のインデックスシグネチャは読み取り専用なので tsc は `row[c] = "#"` を拒みます — だから、まずグリッドを `line.split("")` で `string[][]` にしなければなりません。
