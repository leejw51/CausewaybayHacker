同じ二つの文字列の上に表が二つで、どちらも同じ三行の漸化式で、同点の決着が違うだけです。一行ずつ埋めてください。答えは向かいの角です。編集の表では行 `0` と列 `0` はゼロではありません — すべてを削除するか挿入するコストです。

一行目が空だと、`input.trim().split(/\s+/)` は二つ目の単語を一つ目として渡してしまいます。この課題ではトークンではなく行で読んでください — `input.split("\n")`。

