[[quest]]
id    = "typescript.hacker.33.grid-paths"
title = "街区を横切る、決して戻らずに"
story = "竹の足場で三本の通りが閉鎖された配達のグリッド。横切る道は何通りあり、どれがいちばん安いか。"
brief = '''
標準入力は `r c pct seed` です。グリッドは行優先の順で、セルごとに**二つ**の値を引いて、ラップする 64 ビットの算術で自分で作ります（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

通れるセルだけを通り、**右**か**下**にだけ動きます。出力してください:

1. `PATHS <k>` — `(0,0)` から `(r-1,c-1)` への異なる経路の数、`1000000007` を法として
2. `MIN <cost>` — 経路の最小の合計コスト、両端を含む。経路がなければ `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

行優先の順での一回の走査で両方ができます: セルへの経路の数は上からと左からそこへ入る経路の数の合計で、その最良のコストは自分のコストにその二つの安いほうを足したものです。右か下にしか動かないので、必要な二つのセルは常にすでに終わっています — だからこれには再帰も訪問済み集合も要りません。メモ化した再帰もセルの数に対して線形ですが、`1000 × 1000` のケースでは二千フレームの深さになります。node のスタックはそれに耐えますが、それが答えだということとは別です: ループには深さがまったくなく、`2000 × 2000` の続きの質問はすぐそこです。

`PATHS` の数はいつもの理由で `1000000007` を法として取ります: `1000 × 1000` の隠しケースでは本当の数は六百桁を超えます。ここではそれはスタイルの問題ではありません。`number` は最初の数十行のうちに `2^53` を超えて正確でなくなり、それから黙って間違った剰余を出力するので、足しながら剰余を取ってください — `1000000007` 未満の二つの剰余の和は `2^31` 未満で、それは正確です。

**大きなケースが強制すること:** 経路を列挙する答えはすべて拒みます。経路は部屋の中の原子より多くあります。

`number[][]` の百万個のセルは千個の配列の中の百万個の箱詰めの枠です。`i * c + j` で添字を引く平らな `Float64Array(r * c)` はメモリの一つの塊で、コードは同じです。
'''
hints = [
  "二つの角も含め、すべてのセルについて両方の値を引いてください — 生成器はそれらを飛ばさず、塞ぐのを拒むだけです。",
  "上にも左にも到達可能な隣がない通れるセルは、経路の数ゼロで到達でき、最良のコストはありません。`Infinity` が正直な「到達不能」です: `Math.min` はそれを無視し、`Infinity + cost` はやはり `Infinity` です。",
  "目的地は通れても到達不能なことがあり、それがまさに PATHS が 0 で MIN が -1 のときです。隠しケースのひとつがそれです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.hacker.34.stable-sort"
title = "同点は場所を保つ"
story = "二人のライダーが同じスコアで終わり、タイムズスクエアのスクリーンのリーダーボードは描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。`n` 人のライダーを作ります。ライダー `i` はインデックス `i` とスコアを持ち、ラップする 64 ビットの算術で作ります（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

ライダーをスコアの**降順**で並べ替えてください。同じスコアのライダーは到着した順を保たなければなりません。インデックスをスペース区切りで出力し、次に `TIES <k>` — 並べ替えた順で隣り合う組のうちスコアが等しいものの数 — を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ完全に、同点に何が起きるかで決まります。

**これは、自分がどのソートを手にしているかを知る課題です。** `Array.prototype.sort` は ES2019 から**安定**であることが要求されていて、V8 は 2018 年からその約束を守っています。安定で*ない*のは、昇順に並べ替えてから `.reverse()` を呼ぶことです: それは他のすべてと一緒に同点も逆にし、スターターがしているのがそれです。サンプルでは目に見えて同点をかき乱します。本物の入力では必ずそうなります。

正しい答えは二つあり、両方を挙げられるべきです。比較関数 — `(a, b) => b.score - a.score` — で降順に並べ替え、残りは安定性に任せる。**あるいは**比較を**全順序**にする — `b.score - a.score || a.index - b.index` — そうすればどの二つの要素も等しいと比較されることはなく、安定性は問題でなくなります。既定で手を伸ばすべきは二つ目です。全順序には証明すべきことが何もありません。約束より古いエンジンでもです。

そして比較関数は省けません。比較関数のない `sort()` はライダーを `toString` が与える文字列として比べ、オブジェクトのそれはどれも `[object Object]` です。

ここで時計は速さを測っておらず、測るものもありません: どちらを書いても `sort` は `sort` です。この四つのケースは、同点に何が起きるかだけで決まります。これは自分のソートが何を約束するかを知る課題であって、その約束をどれだけ速く守るかの課題ではありません。
