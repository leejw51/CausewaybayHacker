[[quest]]
id    = "typescript.hacker.30.range-queries"
title = "変わり続ける合計"
story = "チェーン全体の一日分、四百万件のレジ操作。その半分は訂正で、誰かが途中の合計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の操作を実行します。すべて同じ生成器から、ラップする 64 ビットの算術で（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

すべての問い合わせの答えの累計を出力し、次に `UPDATES <k>` を出力してください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**この課題は計算量を強制します。** 素朴な答え — 問い合わせごとに `values[l..r]` を足し上げる — は問い合わせ一回あたり `O(n)` で、詰まった配列の上のきついループは、小さなものなら何でも騙されるほど速いのです。だから大きな隠しケースは `n = 500000, q = 4000000` で、Rust、Go、C++ が走らせるのと同じ大きさです。三十万回の操作 — この課題の Python 版が使う大きさ — で、素朴なループはここで**十七秒**かかり、すでに十秒の実行制限を超えていて、大きなケースにはその十三倍の操作があります。Fenwick 木は四百万全部を**半秒**未満で処理します。どちらも、この課題の二つのプログラムで測りました。

教訓は面接官が釣り上げようとしているものです: *点の更新、区間の合計*は、まさに Fenwick 木が存在するための形です。短い関数が三つ — add、prefix、そして二つの prefix の差としての range — で、`i & -i` が最下位の立っているビットずつ進む方法です。それは 32 ビットの演算で、ここではすべてのインデックスが `2^31` 未満なので正確です。合計はそうではありません: 大きなケースでは `2^32` を超え、`number` がそれを正確に保つのは `2^53` 未満にとどまるからにすぎません。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ってください。O(n) のボトムアップ構築は良い最適化ですが、時計が試しているものではありません。",
  "`i & -i` は最下位の立っているビットを取り出します。それを足すと木を上り、引くと下ります。",
  "`range(l, r)` は `prefix(r + 1) - prefix(l)` で、その一対の off-by-one を正しくすることがデバッグの大半です。木のための `Float64Array(n + 1)` は合計を正確に保ち、型の混ざった配列には決してなりません。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "トップ二十に入る問題で、たいていの選考で何らかの形で出され、たいていの人が一度書いたことがあって一度も理解していないもの。"
brief = '''
標準入力は `n alphabet seed` です。文字列は、ラップする 64 ビットの算術で自分で作ります（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` — その長さのもののうち**いちばん左**のものの 0 始まりの開始位置 — を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心の周りで広げてください。中心は `n` 個ではなく `2n - 1` 個です: どの文字も奇数長の回文の中心で、二つの文字のあいだのどの隙間も偶数長の回文の中心です。隙間を忘れることが、正しく見える解が `abba` で `1` を返す理由です — そしてスターターがしているのがそれです。

**テストが強制することとしないこと**を、率直に。仕事をする隠しケースは、**一**文字のアルファベットでの `n = 8000` です。それは中心から広げる方法の最悪のケースです — どの中心も文字列の端まで走ります — なので正しい答えはそこで `O(n²)` を丸ごとこなし、三千二百万回の文字比較で、このマシンで約十分の一秒で終わります。それはまた、すべての部分文字列をそれぞれ検査するやり方も拒みます。それは三乗で、この大きさで `10^11` 回程度の比較、十秒の制限に対してです。

もう一つの大きなケース、二文字のアルファベットでの `n = 20000` は、速さではなく**正しさ**のケースです: ランダムな二値の文字列では、回文の検査は一、二文字で失敗します。それが検査するのは、あなたの生成器といちばん左のインデックスの決着が、大きな規模でこちらのものと一致するかです。

つまり: テストは三乗を拒み、二乗を受け入れます。`O(n)` の答えである Manacher のアルゴリズムは**要求しません**。それが存在することと何をするかは知っておいてください。「二乗よりうまくできますか?」は、この問題がたいてい仕込むために出される続きの質問だからです。
'''
hints = [
  "中心ごとに広げるのは二回: 奇数長には (c, c)、偶数長には (c, c + 1)。スターターには二つ目がありません。",
  "ループが止まったとき、i と j はどちらも回文を一つ越えています — なので開始は i + 1、長さは j - i - 1 です。",
  "真に長い回文のときだけ更新すれば、各長さのいちばん左のものが残ります。そしてここでは境界の検査は省けません: 両端を同時に越えると `s[i]` も `s[j]` も `undefined` で、`undefined === undefined` は true で、一文字の文字列ではループが決して止まりません。",
]

