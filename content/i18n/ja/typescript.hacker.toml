title = "消去"
story = "六回目の面接、ルーム 7-32。実行時に型は消えていて、時計は消えていない。"
brief = '''
一行目は `cap q` で、その後に `q` 行の操作が続きます。それぞれ `PUT <key> <value>` か `GET <key>` です — あるいは、一行目が**三つ目**の数 `seed` を持つときは、それ以上の行はまったくなく、`q` 個の操作は下の生成器から来ます。

満杯のときに**最も長く使われていない**要素を追い出す、容量固定のキャッシュを実装してください。`GET` も `PUT` もキーを使ったことに数えます。キャッシュがすでに持っているキーの `PUT` は値を置き換え、それを最新にします — 要素は増えないので、キャッシュがどれだけ満杯でも何も追い出しません。

各 `GET` について値を、なければ `-1` を出力してください。最後に生き残ったキーを、最も最近使われたものから順にスペース区切りで — キャッシュが空なら `-` を — 出力し、次に `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルを追ってみてください: `GET 1` が `1` をまた最近のものにするので、`PUT 3` が場所を必要としたとき、出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たって `3` を最新にし、だから生き残りは `3 1` と出力されます。

生成される形は、ラップする 64 ビットの算術で（`bigint` を `BigInt.asUintN(64, …)` でラップします）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**スターターは `strict` のもとできれいにコンパイルでき、そして間違っています。** キャッシュを `Record<number, number>` に持ち、誰もが半分覚えている事実に頼っています: オブジェクトはキーを挿入順に保つ。だから触れることは削除して挿入し直すことで、いちばん冷えた要素は `Object.keys(cache)[0]` です。サンプルで走らせると、`GET 2` は `20` を出力します。

それがボスです。型はキーが `number` だと言い、実行時に型は消えています: オブジェクトのキーは**文字列**で、`Object.keys` はそれを `"1"` と `"2"` として返し、挿入順の規則には、まさにこういうキーのために言語に書き込まれた例外があります — **整数のようなキーは、どこで挿入されたかに関係なく、数値の昇順で先に来ます**。`1` を削除して戻しても、どこに並ぶかは何も変わりません。追い出しはいちばん冷えたキーではなく最小のキーを取り除き、tsc はそれについて一言も言えません。プログラムの中に型の誤りは何もないからです。tsc が検査したことはすべて、検査したときには本当でした。

直し方は、スターターが仮定していたことを意味する構造です: `Map` です。そのキーは `number` のままで、反復の順は例外なしの挿入順です。`delete` と `set` が触れることで、`cache.keys().next().value` が冷えた端、`[...cache.keys()].reverse()` が最新から順 — そしてそのすべてが操作一回あたり `O(1)` です。ほかの言語ではハッシュマップから双方向連結リストへの組み合わせが与えるもので、ここではポインターを隠したまま `Map` が与えてくれます。

（この面接の Python 版ではボスは再帰の上限で、二千操作の隠しケースはここにもまだあります。node のスタックは一万フレーム程度の深さなので、先頭を処理して残りに再帰する版でも通り抜けるでしょう — それはこの入力についての事実であって、そう書く理由ではありません。操作の並びは `for` ループです。）
'''
