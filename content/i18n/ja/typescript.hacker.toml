[[quest]]
id    = "typescript.hacker.15.topo-sort"
title = "どの順でビルドするか"
story = "看板のコントロールルームのビルドの裏に十一のパッケージと依存グラフ。インストールの順を挙げよ。さもなくば、順がないことを意味する循環を挙げよ。"
brief = '''
一行目は `n m` です: `0..n-1` の番号の `n` 個のタスクと `m` 本の辺。続く `m` 行は `<a> <b>` で、`a` を `b` より先にビルドしなければならないという意味です。

ビルドの順を一行にスペース区切りで出力してください。複数のタスクが同時に準備できたときは**番号の最も小さい**ものを取るので、答えは一意です。順が存在しなければ、代わりに `CYCLE` を出力します。次に `DONE <how many you ordered>` を出力します。

```
input:  4 4
