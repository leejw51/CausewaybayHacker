# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.hacker.16.union-find"
title = "誰が誰とつながっているか"
story = "トラム網、MTR、ミニバスの路線が一枚の紙に。本当はいくつの別々の網があるのか。"
brief = '''
標準入力は `n m seed` です: `0..n-1` の番号の `n` 個の停留所と、`m` 本の無向のつながり。入力につながりはありません — **正確に**この生成器で、ラップする 64 ビットの算術で自分で作ります（`number` では保てません — `bigint` と `BigInt.asUintN(64, …)` を使ってください）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

三行を出力してください: 別々の網がいくつあるか、最大のものの大きさ、そして `REDUNDANT <k>` — すでにつながっていた二つの停留所を結んだつながりがいくつあったかです。停留所から自分自身へのつながりもその一つです。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1` の場合、五本のつながりは `6—1`、`4—6`、`2—3`、`2—6`、`1—2` です。最後のものはすでに同じ網にある二つの停留所を結ぶので、それが冗長なもので、残るのは `{1,2,3,4,6}` と、単独の停留所 `0`、`5`、`7` です。

この言語がまず噛みつくのは生成器です。`number` は倍精度で、正確なのは `2^53` までで、`x * 6364136223846793005` はそれをはるかに超えています: `number` の算術では状態は最初の一歩から、黙って間違っています。`bigint` なら正確で、`BigInt.asUintN(64, …)` がラップで、`x >> 33n` は `2^31` 未満なので、`Number(x >> 33n)` は残りのすべてのためにそれを正確な `number` として戻します。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 200000`、つながり `m = 200000` 本です。union-find でない素直な答え — つながりごとに `a` から網を歩いて、`b` がすでにその中にあるかを見る — は正しく、つながり一本あたり `O(n)`、合計で `O(n·m)` です: このマシンでは十秒の実行制限に対して**一分**経っても終わっていませんでした。スターターはそれです。経路圧縮とサイズによる併合をした union-find は同じ 200000 本を約**十分の一秒**で処理します。この課題に同梱の解答で、ここで測りました。

はっきり見ておく価値があります。時間制限付きの選考で落ちる最もよくある形だからです: **スターターは間違っていません。** サンプルでも小さい隠しケース二つでも、正確に正しい答えを出力します。拒まれるのは、あまりにも遅れて着くからだけです。

union-find: どの停留所も親を指し、`find` は根まで歩き、`union` は一方の根をもう一方に向けます。`find` から戻る途中で経路を圧縮すれば、全体は問い合わせ一回あたり実質的に定数時間です。

`find` はループで書いてください。再帰のものは教科書版で、一万ほどの長さの鎖で `RangeError: Maximum call stack size exceeded` になります — それはまさにサイズによる併合が防ぐために存在する形で、最初の `find` が圧縮する前に敵対的な入力が持っている形そのものです。
'''
hints = [
  "つながりのリストを先に作るのではなく、進みながら両端を引いてください — それぞれ生成器を一歩、この順で。ここでつながりが二度必要になることはありません。",
  "どの停留所も自分自身を親とし、グループ n 個から始めます。併合が成功するたびに数が一つ減ります。親のための `Int32Array` はこれ以上ないほど速く、何を持つかを語ります。",
  "両端がすでに同じ根を持つつながりが冗長なものです — 数えて先へ進みます。自己ループ a === b は、その検査で自然に出てきます。",
  "意味があるのは根のサイズの値だけなので、最大値はすべてのインデックスからではなく根から読んでください。",
  "bigint の行のリテラルにはすべて `n` の接尾辞が付きます — `6364136223846793005n` — そして一つの式で `bigint` と `number` を混ぜるのは変換ではなくコンパイルエラーです。そのエラーは tsc が仕事をしている証です。",
]

