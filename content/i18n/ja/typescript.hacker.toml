[[quest]]
id    = "typescript.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまで片付けた地図はどれも歩数を数えていた。トラムは停留所がいくつあるかを気にしない。どれだけ時間がかかるかを気にする。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所、`m` 本の重み付き無向辺。グラフは**正確に**この生成器で、ラップする 64 ビットの算術で自分で作ります（`bigint` を `BigInt.asUintN(64, …)` でラップします — `number` では状態を保てません）:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達できるすべての停留所への最短距離の合計（`0` 自身も含み、それは `0` です）を出力し、次に `MAX <the largest of them>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 100000`、`m = 200000` です。どちらにしても正しいアルゴリズムは Dijkstra で、時計が決めるのは優先度付きキューです。最小を求めて未訪問のノードをすべて走査するのは `O(V²)` — `10^10` 歩で、このマシンでは十秒の実行制限に対して**二十六秒**かかりました。二分ヒープにすれば `O((V + E) log V)` で、約四分の一秒で終わります。どちらもこのマシンで、この課題に同梱の二つのプログラムで測りました: スターターは走査するほうの版です。

はっきり見ておく価値があります。時間制限付きの選考で落ちる最もよくある形だからです: **スターターは間違っていません。** 正確に正しい答えを出力します。拒まれるのは、あまりにも遅れて着くからだけです。

標準ライブラリに優先度付きキューはありません。ヒープはあなたが書くもので、併合の課題と同じもの、要素は距離で順序付けた `[distance, node]` です。decrease-key は要りません: 改善した距離を新しい要素として push し、pop した要素の距離が記録済みのものよりすでに悪ければ飛ばします。その「古い要素」の読み飛ばしこそ皆が忘れる行で、それがないとヒープは際限なく大きくなります。
'''
hints = [
  "`[distance, node]` の要素を、距離だけで比べます。`Float64Array(n).fill(Infinity)` が距離の表で、Infinity が正直な「未到達」です。",
  "`if (d > dist[u]) continue;` が古い要素の読み飛ばしです。それがなくてもアルゴリズムは正しいままですが、ヒープは古くなった要素で埋まります。",
  "生成器の全域木の半分が、どのノードも到達可能であることを保証するので、最後に Infinity を除外しても何も取り除かれません — それでも残しておいてください。到達できないノードのある版のこの問題が、続きの質問だからです。",
]

