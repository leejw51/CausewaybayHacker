[[quest]]
id    = "rust.basic.33.worker-pool"
title = "ハッチ"
story = "12:30、タイムズスクエア。注文票の束がひとつ、料理人が三人、パスへ戻るハッチがひとつ。束はロックの下で共有され、料理人がそれを持つのは伝票を一枚ちぎる間だけだ。束が空になると料理人は帰り、パスは皿を数える。"
brief = '''
ワーカープールはチャネル二つとロック一つです。仕事は `job_tx` を下っていきます。
ワーカーは `Arc<Mutex<…>>` の奥にある一つの `job_rx` を共有し、それぞれ
`job_rx.lock().unwrap().recv()` で仕事を取ります — ロックは一時値なので、その文の
終わりで解放され、調理はその **外** で行われます。`recv()` はすべての `job_tx` が
drop されると `Err` を返し、それでワーカーは止まるべきだと知ります。結果は `done_tx`
で戻り、パスはすべての `done_tx` — ワーカーの clone *と* main 自身のもの — が
なくなるまで集めます。

```
let job = job_rx.lock().unwrap().recv();
drop(job_tx);
drop(done_tx);
```

プール、ループ、回収は書いてあります。`// FILL` コメントのところに、ワーカーの中の
ロックした受信と、`main` の中の二つの drop を書いてください。どちらの drop が欠けても
デッドロックです。

```
input:  1 2 3
output: 0 2
        1 5
        2 10
```
'''
hints = [
  "ワーカーの中で let job = job_rx.lock().unwrap().recv();、送信の後で drop(job_tx); と drop(done_tx); です。",
  "lock() のガードはその let の中の一時値なので、セミコロンで drop され、このワーカーが調理している間にほかのワーカーが次の仕事を取れます。cook() をまたいで持ち続けると、プールが直列になってしまいます。",
  "drop(job_tx) が、ワーカーの recv() を Err に変えるものです。drop(done_tx) が、ワーカーが自分のものを drop した後に done_rx.iter() を終わらせるものです。どちらかを忘れると、プログラムは永遠に待ちます。",
]
