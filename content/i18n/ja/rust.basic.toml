]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.basic.07.structs"
title = "レジ"
story = "ラッキー・マックのカウンターは注文の全行をひとつの場所にまとめていた。提案が struct をコメントに置き換える前までは。"
