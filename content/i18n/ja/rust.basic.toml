hints = [
  "(String, i64) の Vec で足ります。struct があるのは、レジが自分の行を自分で所有するためです。",
  "add はレジを変更するので &mut self を取ります。total は読むだけなので &self を取ります。",
  "&till.items をイテレートすると借用になります。それが望みどおりです — 出力してもレジが空になってはいけません。",
