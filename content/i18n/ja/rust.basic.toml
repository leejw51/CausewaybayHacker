[[quest]]
id    = "rust.basic.11.iterators"
title = "怡和街を一回で"
story = "アレックスは for ループ三つでできると言う。あなたは怡和街の渋滞を知っている。通れるのは一回だけだ。"
brief = '''
標準入力は空白区切りの整数が一行です。

三行出力してください:

1. 偶数の値の合計（なければ `0`）
