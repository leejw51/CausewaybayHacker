検索は一回で、先に `contains_key` をする必要はありません。

```
*counts.entry(w.to_string()).or_insert(0) += 1;
```

マップ、ループ、ソート、出力は書いてあります。`// FILL` コメントのところにエントリの
行を書いてください。

```
input:  a b a c b a
output: a 3
        b 2
        c 1
```
'''
hints = [
  "*counts.entry(w.to_string()).or_insert(0) += 1;",
  "キーは String なので、w (&str) を to_string() で String にします。前のスターは or_insert が返す &mut usize を参照外しします。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.basic.15.sort-by"
title = "順位表"
story = "タイムズスクエアのゲームセンターがその日の結果を貼り出す: 最高得点が先、二人が同点なら名前が先に来るほう。二枚目のボードは名前の長さ順だ。"
brief = '''
`sort_by` は `Ordering` を返す比較クロージャを受け取ります。`b.cmp(&a)` は降順です。
`.then_with(|| …)` は二つ目の比較で同点を決着させます。`sort_by_key` はクロージャが
取り出すもので昇順にソートし、どちらも **安定** です: 等しいキーは順序を保ちます。
`cmp` を持たない浮動小数点数では `a.partial_cmp(b).unwrap()` です。

```
rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));
by_len.sort_by_key(|r| r.0.len());
```

`// FILL` コメントのところに二つのソートを書いてください。`by_len` は最初のソートの
前に作った clone なので、同点は入力順です。

```
input:  MEI 90
        BO 95
        ALEX 90
output: BO ALEX MEI
        BO MEI ALEX
```
'''
hints = [
  "rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0))); と by_len.sort_by_key(|r| r.0.len()); です。",
  "cmp で b を a より前にすることが降順にします。cmp は参照を取るので &a.1 です。then_with は最初の比較が Equal のときだけ実行されます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.heap-reverse"
title = "小さいものから"
story = "タイムズスクエアの点心の窓口は、いちばん小さい番号の整理券から呼ぶ。束はヒープで、Rust のヒープは、そうしないよう言われない限りいちばん大きいものを渡す。"
brief = '''
`BinaryHeap` は最大ヒープです: `pop()` は最大のものを返します。各値を
`std::cmp::Reverse` で包むと順序が反転するので、`BinaryHeap<Reverse<i64>>` は
最小のものを pop します — あらゆる最短経路問題や k 個の最小値問題が求める最小
ヒープです。`while let Some(Reverse(x)) = heap.pop()` は取り出しながらほどきます。

```
heap.push(Reverse(x));
while let Some(Reverse(x)) = heap.pop() { out.push(x); }
```

`// FILL` コメントのところに push と取り出しを書いてください。

```
input:  5 1 9 3
output: 1 3 5 9
```
'''
hints = [
  "heap.push(Reverse(x)); そして while let Some(Reverse(x)) = heap.pop() { out.push(x); } です。",
