# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.basic.18.binary-tree"
title = "オートコンプリート"
story = "パーシバル・ストリートの電話キオスク、そしてゴーストテキストが戻ってきて、千回見た木を差し出す。自分でノードごとに育てる木には補完がなく、育てるまで木は空のままだ。"
brief = '''
二分探索木は、値と省略可能な二つの子 `Option<Box<Node>>` を持つ `Node` です:
`None` は空の部分木、`Some(Box::new(…))` は実在する部分木。挿入は再帰的です —
空の部分木は新しい葉になり、実在する部分木は値を属する側へ渡し、戻ってきた
部分木を格納します。`.take()` は子を `Option` から取り出して再帰呼び出しに
渡せるようにし、あとで戻します。

```
if value < n.value {
    n.left = insert(n.left.take(), value);
} else {
    n.right = insert(n.right.take(), value);
}
```

`Node`、`inorder`、`height`、`main`、そして `insert` の骨組みは、その
`if … else` まで書いてあります。`// FILL` コメントの場所に二つの代入行を
打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left.take(), value); — そして n.right = insert(n.right.take(), value);",
  "`take()` は `None` を残して子を渡してくれます。呼び出しの結果を代入することで、育った部分木が戻ります。",
]
