[[quest]]
id    = "rust.basic.13.fold-zip-windows"
title = "組と連なりと累計"
story = "パーシバル・ストリートのトラムのカウンターが一日の数を読む: 前の時間より増えた時間がいくつあるか、全部の積、そしてそれぞれに時刻を添えたもの。"
brief = '''
画面が繰り返し求めるアダプタが三つあります。スライスの `.windows(2)` は、隣り合う
組をすべて二要素のスライスとして生みます。`.fold(start, |acc, x| …)` は一つの
アキュムレータを列全体に通します。`.zip(…)` は二つの列を並べてたどり、
`(0..).zip(&nums)` は手で綴った `enumerate` です。

```
let ups = nums.windows(2).filter(|w| w[1] > w[0]).count();
let product = nums.iter().fold(1i64, |acc, &x| acc * x);
let pairs: Vec<String> = (0..).zip(&nums).map(|(i, x)| format!("{}:{}", i, x)).collect();
```

`// FILL` コメントのところに三行を書いてください。

```
input:  1 3 2 5
output: 2
        30
        0:1 1:3 2:2 3:5
```
'''
hints = [
  "windows(2).filter(|w| w[1] > w[0]).count() — fold(1i64, |acc, &x| acc * x) — (0..).zip(&nums).map(|(i, x)| format!(\"{}:{}\", i, x)).collect()",
  "windows はスライスのメソッドなので、nums.iter() ではなく nums に直接付けます。fold の 1i64 がアキュムレータの型を決めます。ただの 1 では曖昧になります。",
]

