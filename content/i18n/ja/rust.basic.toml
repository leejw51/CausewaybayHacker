# RUST LAND — BASIC, in Japanese. A translation pack (SPEC §12.1): the prose of
# `content/rust/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "rust.basic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.first-light"
title = "最初の灯り"
story = "06:40、ジャーディンズ・バザーの上階。カーソルだけがそこにあり、灰色の文字は消えた。まだ記憶から打てるものは、すべてあなたのものです。"
brief = '''
正確に次のとおり出力してください:

```
hello, causewaybay
```

小文字、カンマひとつ、空白ひとつ、一行。それ以外は何も出力しません。
'''
hints = [
  "println! はマクロなので、感嘆符が付いたままです。",
  "文字列は正確に: 小文字、カンマひとつ、その後に空白ひとつです。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.bindings"
title = "運賃表"
story = "パーシバル・ストリートのトラム停留所の掲示板には数字がひとつだけ残り、日額と月額があった場所は二つとも空白になっている。"
brief = '''
標準入力から整数 `n` をひとつ読み込みます。

三行出力してください: `n`、次に `n` の二倍、次に `n` に `n` を掛けたもの。

`n` は `i64` に収まり、負になることもあります。

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "読み込みは済んでいます。_n からアンダースコアを外して使ってください。",
  "println! は書式文字列を取ります: println!(\"{}\", n)。",
  "負の n を二乗すると正になります。テストはそれを知っています。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.basic.03.shadowing"
title = "三つの名前、ひとつの名前"
story = "そごう前の交差点のキオスクは、価格を文字列として、数値として、金額として持っていて、その三つすべてを price と呼んでいる。"
brief = '''
一行読み込みます: セント単位の金額で、数字だけです。

三行出力してください:

1. トリムした文字列が何文字あるか
2. その金額を数値として
3. その金額をドルで、小数点以下ちょうど二桁で

```
input:  1234
output: 4
        1234
        12.34
```

金額は非負で `i64` に収まります。ひとつの名前を二回シャドウイングして
やってください — `&str`、次に `i64`、次に `String` です。
'''
hints = [
  "二つ目の `let cents = ...` は代入ではありません。古いものを隠す新しい束縛を作り、型が違っていても構いません。",
  "だからシャドウイングは `mut` ではないのです: `mut` は型を保ちますが、シャドウイングは保ちません。",
  "先頭ゼロ付きの二桁は {:02} の幅フラグです。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.the-move"
title = "レシート一枚"
story = "ラッキー・マックのレジはレシートを印字したあと、お礼が言えない。名前を紙と一緒に渡してしまったからだ。"
