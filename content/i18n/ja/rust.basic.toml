3. 異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

添字ループではなく、イテレータアダプタ — `filter`、`map`、`sum`、
`collect` — を使ってください。
'''
hints = [
  "nums.iter() は &i64 を返し、filter はクロージャにそれへの参照を渡すので、引数は &&i64 です。本体に星をいくつ付けるか当てずっぽうにするのではなく、パターンで分解してください — |&&n| n % 2 == 0。",
  "join には文字列が必要なので、Vec<String> に collect する前に各数値を to_string() で map してください。",
