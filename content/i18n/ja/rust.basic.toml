# RUST LAND — BASIC, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/rust/basic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.basic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.the-move"
title = "持ち主はひとり"
story = "06:40、ジャーディンズ・バザールの上。カウンターにレシートが一枚あり、そこには通り全体の決まりが書いてある: ものの持ち主はひとりで、手渡すとは手放すことだ。"
brief = '''
`String` の持ち主はちょうどひとりです。`let kept = receipt;` はそれをコピーしません:
**ムーブ** します。その行から先、`receipt` はもう使える名前ではなく、コンパイラは
E0382, borrow of moved value で拒否します。値は移った先に、新しい名前で存在します。

```
let kept = receipt;
```

レシートは作ってあり、二つの `println!` も書いてあります。`// FILL` コメントの
ところにムーブを書いて、`kept` がその文字列を所有するようにしてください。

```
output: one receipt, one owner
        22
```
'''
hints = [
  "let kept = receipt; — 右側に古い名前を置いた let です。",
  "clone はしません: 文字列はコピーされず、持ち主が変わるだけです。この行の後で receipt を使うと E0382 です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.borrow"
title = "見るだけ"
story = "パーシバル・ストリートのトラム停留所。車掌はリストの名前をすべて読み上げ、そのままリストを返す。それを所有したことがあるのは事務所だけだ。"
brief = '''
`&` は貸します。`name: &str` を受け取る関数は文字列を *見る* だけで、呼び出し側は
それを持ち続け、後でも使えます。`&names[i]` は要素一つの借用で、`&String` は
呼び出しのところでひとりでに `&str` になります。

```
total += width(&names[i]);
```

`width` と二つの `println!` は書いてあります。`// FILL` コメントのところに、各名前を
`&` で貸す呼び出しを書いてください。二行目は、ループの後も名前がまだ自分のものである
ことの証明です。

```
input:  MEI
        BO
        ALEX
output: 9
        MEI,BO,ALEX
```
'''
hints = [
  "total += width(&names[i]); — アンパサンドは引数に付けます。",
  "width は &str を求めます。&String は呼び出しのところで &str に型強制されるので、&names[i] で足ります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.basic.03.mut-borrow"
title = "変えるために貸す"
story = "ラッキー・マックのキオスクが、ボードの値段をすべて同じ額だけ上げる。ボードは壁から離れない。書き換える手のほうが借りものだ。"
brief = '''
`&mut` は変更のために貸します。`prices: &mut Vec<i64>` を受け取る関数は呼び出し側の
ベクタをその場で変えられます。呼び出し側は呼び出しで `&mut prices` と書き、`prices`
自体は `let mut` でなければなりません。中では `iter_mut()` が `&mut i64` を渡し、
`*p` はその先にある数です。

```
*p += by;
bump(&mut prices, by);
```

`bump` と出力は書いてあります。`// FILL` コメントのところに二行を書いてください:
`bump` の中の変更と、ベクタを貸す呼び出しです。

```
input:  3
        10 20 30
output: 13 23 33
```
'''
hints = [
  "ループの中で *p += by;、そして main で bump(&mut prices, by); です。",
  "p は &mut i64 です: スターがその先に届きます。呼び出しには & ではなく &mut が要り、prices はまさにそのために mut で宣言してあります。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.clone"
title = "二つ目の写し"
story = "ハイサン・プレイスのリストは二つ。ドア係が到着順に持つものと、マネージャーが並べ替えるもの。マネージャーのほうを並べ替えても、ドア係のほうに触れてはならない。"
brief = '''
ムーブの後に残る持ち主はひとりです。二人必要なら、`.clone()` が深いコピーを作り、
そこから先は両者は独立です。小さな素朴な値 — `i64`、`bool`、`char`、`f64`、
それらのタプル — は `Copy` です: `let b = a;` はそれらをコピーし、clone なしでも
`a` は使えるままです。

```
let mut sorted = names.clone();
```

名前は読み込み済みで、`sorted.sort()` と二つの `println!` は書いてあります。
`// FILL` コメントのところに clone を書いて、元の順序が残るようにしてください。

```
input:  MEI BO ALEX
output: MEI BO ALEX
        ALEX BO MEI
```
'''
hints = [
  "let mut sorted = names.clone(); — sort() はその場で変更するので mut です。",
  "let mut sorted = names; でもコンパイルは通りますが、そうすると names はなくなり、最初の println! が E0382 になります。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.exchange"
title = "入れ替え"
story = "ジャーディンズ・バザールの二台のレジが、交代の時にドロワーを交換する。古いドロワーは持ち上げられ、代わりに空のものが置かれる。何もコピーされない。ものの持ち主が変わるだけだ。"
brief = '''
`std::mem` は値をコピーせずに交換します。`swap(&mut a, &mut b)` は二つの名前が
持つものを取り替えます。`take(&mut a)` は値をムーブして取り出し、その型の
デフォルト — 空の `String`、空の `Vec`、`0` — を残すので、`&mut` の中にあるものを
所有できます。`replace(&mut a, v)` は同じことを、自分で選んだ値を残して行います。

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

二行が `a` と `b` に読み込まれます。`// FILL` コメントのところに swap と take を
書いてください。

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
hints = [
  "std::mem::swap(&mut a, &mut b); そして let taken = std::mem::take(&mut a); です。",
  "どちらも &mut を取ります: 値はその場に留まり、中身だけが動きます。take の後の a はムーブされた後のものではなく空の String で、まだ使えます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.slices"
title = "列の真ん中"
story = "ハイサン・プレイスの列から、最初と最後を除いたもの: 本当に待っている人たちだ。"
brief = '''
`&v[a..b]` はスライスです: `Vec` の一部を覗く借用の窓で、`a` から `b` の手前まで、
コピーは作られません。型は `&[i64]` で、`&[i64]` を受け取る関数はベクタ全体
(`&nums`) もその一部の窓も同じように受け取ります。`..` だけならすべて、`a..` は
末尾までです。

```
let middle = &nums[1..nums.len() - 1];
```

`total` と三つの `println!` は書いてあります。`// FILL` コメントのところにスライスを
書いてください。

```
input:  5 1 2 3 9
output: 6
        20
        3
```
'''
hints = [
  "let middle = &nums[1..nums.len() - 1];",
  "範囲の終わりは含まれないので、len() - 1 は最後の要素のすぐ手前で止まります。前の & が、ベクタからのムーブではなく借用にしています。",
]

