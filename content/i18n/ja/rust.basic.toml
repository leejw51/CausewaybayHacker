brief = '''
*mpsc* は複数生産者です: `tx.clone()` は各スレッドに一つのチャネルへの自分の送信側を
与えます。受信ループが終わるのは **すべての** 送信側がなくなったときだけです —
そして元の `tx` はまだ `main` に残っています。`drop(tx)` がそれを置きます。その行が
なければプログラムは終わりません。

```
let tx = tx.clone();
drop(tx);
```

`// FILL` コメントのところに、`spawn` の前の clone と、ループの後の drop を書いて
ください。結果はインデックス順にソートされるので、スレッドが走る順序は関係ありません。

```
input:  1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```
'''
hints = [
  "ループの中で let tx = tx.clone();、その後で drop(tx); です。",
  "clone がなければ、move は一つしかない送信側を最初のスレッドに持っていき、ループの二回目は E0382 です。drop がなければ rx.iter() は main 自身の送信側を永遠に待ちます — 実行は失敗するのではなくタイムアウトします。",
]

