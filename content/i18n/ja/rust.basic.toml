# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.basic.08.enums"
title = "誰が乗っているのか"
story = "コーズウェイベイの改札はどのカードにも大人運賃を請求する。大人ではないカードにも、カードですらないものにも。"
brief = '''
標準入力は個数 `n`、次に `<TYPE> <KM>` 形式の行が `n` 行です。

基本運賃は `500 + 100 * KM` セントです。各行について次のいずれかを出力
