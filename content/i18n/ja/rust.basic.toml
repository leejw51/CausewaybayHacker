```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`?` を使う `fn double(text: &str) -> Result<i64, ParseIntError>` を書き、
二つの結果を `main` の `match` で処理してください。
'''
hints = [
  "Result に対する `?` は、エラーを関数の外へ代わりに返してくれます。なので double の本体は二行です。",
  "match double(line) のアームはちょうど二つ、Ok(value) と Err(_) です。",
  "SUM は出力したものの合計です — 元の値ではなく、二倍した値です。",
