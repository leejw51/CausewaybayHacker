id    = "rust.basic.11.sets"
title = "スタンプ帳"
story = "パーシバル・ストリートのキオスクのポイント帳は来店ごとにスタンプが押され、同じ屋台が二度押している。店員は屋台が何種類あるか、その番号を順に知りたい。"
brief = '''
集合は各値を一度だけ持ち、`BTreeSet` はそれを自分で整列して保つので、呼ぶ
