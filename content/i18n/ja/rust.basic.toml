id    = "rust.basic.12.stack-queue"
title = "皿の山"
story = "ボウリントン・ロードの点心カウンターでは皿が積み上がって上から取られ、整理券の番号は列の先頭から取られる。どちらの山も手つかずのままだ。"
brief = '''
`Vec` はスタックです。`.push(x)` は上に積み、`.pop()` は一番上を取り除き
（`Option` として）、`.last_mut()` は一番上への可変参照で、その場で編集する
ためのものです。`VecDeque` はキューです。`.push_back(x)` が後ろに並び、
`.pop_front()` が前から出ます — その側はもう書いてあります。

```
stack.push(42);
stack.pop();
*stack.last_mut().unwrap() = 0;
```

両方のコンテナが行の整数を持ちます。`// FILL` コメントの場所に、この順で
スタックの三行を打ってください。スタックは下から上へ出力され、次の行に
キューの先頭が出ます。

```
input:  1 2 3 4
output: 1 2 3 0
        1
```
'''
hints = [
  "stack.push(42); 次に stack.pop(); 次に *stack.last_mut().unwrap() = 0;",
  "pop は 42 をすぐ戻してしまうので、編集は前に一番上だった値に当たります — 後入れ先出しです。",
]

