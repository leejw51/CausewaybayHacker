```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1..nums.len() - 1] は Vec のスライスであって、コピーではありません。",
  "値が一つか二つだと、その範囲は空か逆向きになります。添字を使う前に if で守ってください。",
  "&i64 のイテレータはそのまま i64 に合計できます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.strings"
title = "バイトは文字ではない"
story = "タイムズスクエアの案内板は 銅鑼灣 を三文字で切り詰めて、一文字半しか得られない。"
brief = '''
一行読み込みます。三行出力してください:

1. その**バイト**数
