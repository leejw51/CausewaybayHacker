```
seen.insert(100);
seen.remove(&1);
if seen.remove(&2) { seen.insert(20); }
```

`seen` はすでに行の相異なる整数を持ち、その大きさと中身が出力されます。
`// FILL` コメントの場所に、この順で三行を打ってください。

```
