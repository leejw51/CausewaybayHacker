```
'''
hints = [
  "seen.insert(100); 次に seen.remove(&1); 次に if seen.remove(&2) { seen.insert(20); }",
  "remove は参照 (&1) を取り、値があれば true を返します — if が使うのはそれで、2 のない集合はそのままです。",
]

