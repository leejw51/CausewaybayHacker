[[quest]]
id    = "rust.basic.07.string-str"
title = "所有するテキストと借りるテキスト"
story = "ジャーディンズ・バザールの店の看板は一度描かれ、店が所有している。読む人はみなそれを借りている。その日のために作る横断幕は新しいものだ。"
brief = '''
`String` は自分のテキストを所有し、伸ばせます。`&str` はどこか別の場所にある
テキストを借ります。読むだけの関数は `&str` を受け取り、新しいテキストを作る関数は
`String` を返します。`format!` は `println!` が一行を作るのと同じように `String` を
作り、`&name` (または `name.as_str()`) は `String` を `&str` として貸します。

```
format!("** {} **", name)
let line = banner(&name);
```

`// FILL` コメントのところに二行を書いてください: `banner` の本体と、`main` の中の
呼び出しです。

```
input:  mei
output: ** mei **
        9
```
'''
hints = [
  "セミコロンなしの format!(\"** {} **\", name) が関数の値です。main では let line = banner(&name); です。",
  "& なしの banner(name) は &str が求められるところに String を渡そうとします: E0308 です。アンパサンドがこのレッスンのすべてです。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.basic.08.chars-bytes"
title = "文字と数字"
story = "ビクトリア・パークのロッカーの暗証番号: 文字と数字が混ざっている。係員は数字を足し合わせ、最初の文字を叫ぶ。"
brief = '''
`&str` はバイト列です。`.chars()` はそれを文字として、`.bytes()` /
`.as_bytes()` は `u8` としてたどります。`c.to_digit(10)` は数字の文字を
`Some(number)` に、それ以外を `None` にするので、`filter_map` は数字だけを残します。
バイトは数です: `b'a'` は 97 で、文字の算術は `(byte - b'a' + b'A') as char` です。

```
let digits: Vec<u32> = code.chars().filter_map(|c| c.to_digit(10)).collect();
let first = (code.as_bytes()[0] - b'a' + b'A') as char;
```

`// FILL` コメントのところに二行を書いてください。暗証番号は必ず小文字で始まります。

```
input:  a1b2c3
output: 6
        A
```
'''
hints = [
  "code.chars().filter_map(|c| c.to_digit(10)).collect() — そして (code.as_bytes()[0] - b'a' + b'A') as char です。",
  "to_digit は Option<u32> を返し、filter_map は None を落とします。バイトから b'a' を引くと a なら 0 で、b'A' を足すと大文字に着地します。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.option"
title = "何もないかもしれない"
story = "静かな朝のタイムズスクエアの掲示板。最高値の入札はないかもしれないし、偶数の整理券もないかもしれない。掲示板は推測せずにそう言わなければならない。"
brief = '''
`Option<T>` は `Some(value)` か `None` で、コンパイラは `None` のときにどうするかを
言わせます。`if let Some(m) = …` は値があるときだけブロックを実行します。
`.unwrap_or(0)` はデフォルトを与えます。`.find(…)` は最初の一致を `Option<&T>`
として返し、`.copied()` は `Option<&i64>` を `Option<i64>` にします。

```
if let Some(m) = nums.iter().max() { println!("MAX {}", m); }
let even = nums.iter().find(|&&x| x % 2 == 0).copied().unwrap_or(0);
```

`// FILL` コメントのところに二行を書いてください。入力が空なら、一つ目は何も出力せず、
二つ目は `0` です。

```
input:  3 5 8 1
output: MAX 8
        8
```
'''
hints = [
  "if let Some(m) = nums.iter().max() { println!(\"MAX {}\", m); }、そして find(...).copied().unwrap_or(0) です。",
  "空のイテレータの max() は None で、if let はただ飛ばします。find は Option<&i64> を返します。copied() がそれを Option<i64> にするので unwrap_or(0) の型が合います。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.basic.10.result"
title = "数字ではない行"
story = "パーシバル・ストリートのレジが値段の行を受け取る。その一つが単語だ。レジは落ちない。どの行が悪く、なぜなのかを言う。"
brief = '''
`Result<T, E>` は `Ok(value)` か `Err(error)` です。`Result` を返す関数の中では、
`?` 演算子が `Ok` をほどき、`Err` はその場で呼び出し側に **返します** — `match`
の代わりに一文字です。`"12".parse::<i64>()` は `Result<i64, ParseIntError>` です。

```
out.push(tok.parse::<i64>()?);
```

`parse_all` はベクタか最初のエラーを返し、`main` はそれに match します。`// FILL`
コメントのところに `?` の付いた行を書いてください。

```
input:  1 2 3
output: 6
```
'''
hints = [
  "out.push(tok.parse::<i64>()?);",
  "? が使えるのは、戻り値の型が、エラー型の合う Result (または Option) である関数の中だけです — ここでは ParseIntError で、まさに parse が返すものです。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.basic.11.match"
title = "数のかたち"
story = "ビクトリア・パークのゲートが整理券番号を振り分ける: ゼロ、一桁、偶数、奇数。腕は四本で、こぼれ落ちるものはない。"
brief = '''
`match` はすべての場合を網羅しなければならず、腕はパターンです: リテラル、範囲
`1..=9`、ガード付きの束縛 `x if x % 2 == 0`、そして残りには `_`。最初に当てはまる
腕が勝つので、順序が大事です。これは式です: 各腕の値が `match` 全体の値になります。

```
0 => "ZERO",
1..=9 => "ONE DIGIT",
x if x % 2 == 0 => "EVEN",
_ => "ODD",
```

`match` は開いてあり、`TODO` と言う腕が一本あります。それをこの四本の腕に、この順で
置き換えてください。

```
input:  12
output: EVEN
```
'''
hints = [
  "0 => \"ZERO\", 1..=9 => \"ONE DIGIT\", x if x % 2 == 0 => \"EVEN\", _ => \"ODD\",",
  "ガードの腕は _ より前に置かないと決して実行されません。1..=9 は両端を含みます。1..9 だと 9 がガードに回ります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.basic.12.iterator-chain"
title = "怡和街を一往復"
story = "怡和街を一度だけ歩く: 偶数の店先を残し、その番号を二乗し、十より大きいものを全部足す。インデックスもなく、二つ目のループもない。"
brief = '''
イテレータの連鎖は左から右へ読みます: `.iter()` がベクタをたどり、
`.filter(|&&x| …)` はクロージャがはいと言うものを残し、`.map(|x| …)` は変換し、
最後の `.collect()` か `.sum()` がそれを値にします。その最後の呼び出しまで何も
実行されません。`iter()` は `&i64` を生み、`filter` にはさらにその参照が見えるので、
数に届くのが `&&x` のパターンです。

```
let squares: Vec<i64> = nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect();
let big: i64 = nums.iter().filter(|&&x| x > 10).sum();
```

`// FILL` コメントのところに二行を書いてください。

```
input:  1 2 3 4 11 20
output: 4 16 400
        31
```
'''
hints = [
  "nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect() — 二つ目は .filter(|&&x| x > 10).sum() です。",
  "let に付いた型が、collect() と sum() に何を作るかを教えます。Vec<i64> と i64 がなければ、コンパイラはそれらを推論できません。",
]

