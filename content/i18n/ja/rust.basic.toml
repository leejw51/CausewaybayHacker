```

数は読み込み済みで、`total` は出力されます。プレースホルダーの
`let total: i64 = 0;` の代わりにその行を打ってください。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();",
