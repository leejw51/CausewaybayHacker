[[quest]]
id    = "zig.cheatsheet_advanced.20.split-keeps-empties"
title = "空の列も数える"
story = "料金エクスポートはコンマ区切りで、欠けた列は空のフィールドであって、最初からなかったフィールドではない。`a,,b` は三列だ。"
brief = '''
`line` は `[]const u8` です。`it` を `line` のコンマ区切りフィールドに対するイテレータ
にして、`while (it.next()) |f| n += 1;` が `"a,,b"` を **3** フィールド、`"a"` を 1
と数えるようにしてください。
'''
hints = [
  "std.mem の二つのイテレータが単一バイトの区切りを取ります。tokenizer は区切りの連続を飲み込んで二つと数え、splitter はその間の空フィールドを生みます。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.cheatsheet_advanced.21.sort-context"
title = "他人の数字で並べ替える"
story = "レーンの添字は別のテーブルの重みで並べ替えられる。Zig にはテーブルをキャプチャするクロージャがないので、ソートにそれを渡す。"
brief = '''
`idx` は `[]usize`、`keys` は `[]const i64` です。この比較関数を使って `idx` を
`keys[i]` の昇順に並べ替えてください:

```
fn byKey(keys: []const i64, a: usize, b: usize) bool {
    return keys[a] < keys[b];
}
```
'''
hints = [
  "第三引数は比較関数が最初のパラメータとして受け取るコンテキストです。比較関数の型はそれに正確に一致しなければならないので、`{}` は `void` コンテキストにしか合いません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.cheatsheet_advanced.22.truncate"
title = "下位バイトだけ"
story = "車軸センサーは四つの読みを u32 に詰める。ブースは最下位バイトが欲しく、残りがゼロでなくてもパニックしてはならない。"
brief = '''
`x` は `0x1234` を持つ実行時の `u32` です。`lo` を `0x34` — 下位 8 ビット — を持つ
`u8` に、Debug モードで安全性パニックを起こさずにしてください。
'''
hints = [
  "値が収まるか検査するキャストは 0x1234 でパニックします。上位ビットを落とすものは引数を一つ取り、幅は束縛から得ます。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.cheatsheet_advanced.23.wrapping"
title = "回り込め、止まるな"
story = "プレートのハッシュは一晩に何千回もオーバーフローするように作られている。Debug モードでは頼んでいないオーバーフローはパニックで、閉じたバリアだ。"
brief = '''
`h` は `std.math.maxInt(u32)` の近くから始まる `u32` で、`c` は `u8` です。ハッシュの
一歩 `h = h * 31 + c` を、2^32 を法として **回り込む** ように書いてください —
パニックでもなく、最大値での飽和でもなく。
'''
hints = [
  "素の演算子は Debug でオーバーフロー時にパニックし、後からマスクをかけても手遅れです — 掛け算はすでにオーバーフローしています。Zig には接尾辞付き演算子の族が二つあります: 一方は最大値で飽和し、他方は回り込みます。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.cheatsheet_advanced.24.expect-equal"
title = "運賃を証明せよ"
story = "面接官が走らせる前に、候補者は料金表と平均に `zig test` を走らせ、テストは何を期待するかを言う。"
brief = '''
`fare(3)` は 7 であるべき `i64` を返します。テストブロックの中でそれをアサート
してください — 値が間違っていればテストは失敗しなければならず、コンパイルできなければ
なりません。

```
fn avg(sum: i64, n: i64) f64 {
    return @as(f64, @floatFromInt(sum)) / @as(f64, @floatFromInt(n));
}

test "fare" {
    // ____
    try std.testing.expect(avg(5, 2) == 2.5);
}
```
'''
hints = [
  "比較はエラーユニオンを返すので `try` しなければならず、さもないとコンパイラは無視を拒みます。一引数の `expect` は bool を取ります。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet_advanced.25.main-init"
title = "ランタイムが入ってくるところ"
story = "Zig 0.16 は main に I/O ランタイムとアロケータを一つの構造体で渡す。古いシグネチャはどちらも使わない限りまだコンパイルできる。"
brief = '''
Zig 0.16。下の本体がコンパイルできるように `main` を開いてください: パラメータから
`io` と `gpa` を読み、`try` を使います。

```
// ____
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
}
```
'''
hints = [
  "エントリポイントは `pub` でなければならず、`try` のためにエラーを返せなければならず、本体がフィールドを読む std.process の型のパラメータを一つ取ります。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet_advanced.26.stdin-lines"
title = "一度に一行"
story = "プレートのフィードは果てしなく、管制室はフィードが閉じるまで 0.16 のリーダーを通して一行ずつ読む。"
brief = '''
Zig 0.16。`r` は `&stdin.interface`、バッファ付き stdin に対する `*std.Io.Reader`
です。各行を（改行なしで）`line` に束縛し、読み取りの失敗を呼び出し側へ渡し、入力の
終わりできれいに終わるループを開いてください。
'''
hints = [
  "0.16 のリーダーには区切りまで取る呼び出しがあり、optional スライスを包むエラーユニオンを返します: ストリームの終わりで null なので、`try` してからキャプチャ。その Exclusive の兄弟は optional ではなく、終わりでエラーになります。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.cheatsheet_advanced.27.spawn"
title = "自分のスレッドを持つブース"
story = "ブース 5 は自分のスレッドでカウントを二乗し、答えを管制室のスロットに書く。管制室は読む前に join する。"
brief = '''
`fn worker(out: *i64, n: i64) void` で、`total` は `var i64` です。`worker` を
`&total` と `5` で新しいスレッドで始め、次の行で `t.join();` がコンパイルできるように
ハンドルを `t` として保持してください。
'''
hints = [
  "spawn は設定、関数、そしてその引数を一つのタプルとして取ります。失敗しうるので、ハンドルはエラーを外して初めて存在します。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet_advanced.28.io-mutex"
title = "一つのトレイ、二つの手"
story = "二つのブースが一つの現金合計に足す。その周りのロックは 0.16 では I/O ランタイムのもので、std.Thread.Mutex はなくなった。"
brief = '''
Zig 0.16。`m` は `*std.Io.Mutex`、`io` は `std.Io` です。加算の前にロックを取って
ください。下の `defer` がそれを返します。`add` は `void` を返し、エラーを伝播
できません。

```
fn add(io: std.Io, m: *std.Io.Mutex, total: *i64, value: i64) void {
    // ____
    defer m.unlock(io);
    total.* += value;
}
```
'''
hints = [
  "0.16 のミューテックスの素の `lock` は `io` を取り `error.Canceled` を返しうるので、`void` 関数では `try` できません。キャンセルできない兄弟は何も返しません。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.cheatsheet_advanced.29.atomic"
title = "一ワード、ロックなし"
story = "高架下のヒットカウンタはマシンワード一つで、すべてのレーンから同時に増やされる。一回の加算の周りにミューテックスなど誰も欲しくない。"
brief = '''
`hits` は複数のスレッドで共有される `*std.atomic.Value(u32)` です。古い値を必要と
しない `void` 関数の中で、relaxed（monotonic）順序でアトミックに 1 を足してください。
'''
hints = [
  "read-modify-write は以前の値を返し、Zig は void でない結果を黙って捨てさせません。順序は 0.16 では小文字の enum リテラルです。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.cheatsheet_advanced.30.packed-bitcast"
title = "一バイトに八つのフラグ"
story = "バリア制御装置は車一台につき一バイトを取る: 支払済み、フラグ付き、3 ビットのレーン、予備 3 ビット。構造体はビット単位で配置され、そのバイトとして送られる。"
brief = '''
`Flags` は `packed struct(u8)` です — C と同じ配置になる `extern struct` と違い、
`@sizeOf(Flags)` は 1 です。`f` は `Flags` です。`bits` を、ビットパターンが `f` の
ものである `u8` にして、配線に送り出せるようにしてください。

```
const Flags = packed struct(u8) {
    paid: bool,
    flagged: bool,
    lane: u3,
    _pad: u3 = 0,
};
```
'''
hints = [
  "整数キャストは入力に整数を欲しがります。packed struct は、引数を一つ取り目標を束縛から得るキャストでビット単位に再解釈されます。",
]
