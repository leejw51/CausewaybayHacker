[[quest]]
id    = "python.basic.06.strings"
title = "バイトは文字ではない"
story = "SOGO 地下の案内板は 銅鑼灣 を三バイトで切り、一文字と疑問符を表示しています。"
brief = '''
一行を読みます。三行を出力してください:

1. UTF-8 でエンコードしたときの **バイト** 数
2. **文字** 数
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII の外の文字が含まれることがあり、そのときは最初のふたつの数が
一致しません。Python の `str` はコードポイントの列なので `len` は文字数です。
バイトが欲しければ `.encode("utf-8")` で明示的に求め、**その** `len` が
もうひとつの数になります。

`s[::-1]` は文字列を反転します。ステップ `-1` のスライスで、どんなシーケンス
にも使えます。
'''
hints = [
  "len(line) は文字数。len(line.encode(\"utf-8\")) はバイト数。スターターは間違ったほうを先に出力しています。",
  "line[::-1] で反転は終わりです。str をスライスすると str が返ります。",
  "バイト列を反転するとマルチバイト文字が真っ二つになります。str の反転ではそうなりません。str にはバイトが入っていないからです。",
]

