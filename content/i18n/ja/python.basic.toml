[[quest]]
id    = "python.basic.16.list"
title = "注文の鎖"
story = "フードホールのランナーは各注文を鎖の末尾に留め、それから整理券番号を先頭に留める。鎖は空のまま掛かっている。"
brief = '''
`collections.deque` は両端の鎖で、両端で編集されます。`.appendleft(x)` は
