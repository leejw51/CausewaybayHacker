置き換えます — deque はリストのように添字で参照できます。deque に `.sort()`
はありません。整列するには `sorted(chain)` から新しい deque を作ります。
それが四行目です。

```
chain.appendleft(0)
chain.pop()
chain[0] = 9
chain = deque(sorted(chain))
```

`chain` は行の整数を持ち、各ステップの後に出力されます。四つの `# FILL`
プレースホルダーの代わりに、この順で四行を打ってください。

```
input:  3 1 2
output: 0 3 1 2
        0 3 1
        9 3 1
        1 3 9
```
'''
hints = [
  "chain.appendleft(0)、次に chain.pop()、次に chain[0] = 9、次に chain = deque(sorted(chain)) — プレースホルダー一つに一行、この順で。",
  "sorted() はリストを返します。deque() で包むとまた deque になります。chain.sort() はありません。",
]

