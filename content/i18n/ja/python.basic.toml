[[quest]]
id    = "python.basic.09.functions"
title = "一斤あたり"
story = "ボーリントン・ロードの値札は特に書いていなければ一斤あたりですが、値札プリンターは毎回それを言われないと動きません。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<NAME> <CENTS>` または
`<NAME> <CENTS> <UNIT>` です。

`<NAME> $<dollars>/<unit>` を小数点以下二桁で返す `tag(name, cents, unit="catty")`
を書き、一行に一つずつタグを出力してください。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

スターターの `tag` にはデフォルトがないので、トークンが二つの行で落ちます:
`TypeError: tag() missing 1 required positional argument`。デフォルト引数は
関数の契約の一部です — 呼び出し側が何を省略でき、省略したら何になるかを
表しています。

行を `.split()` で分け、セントを変換したうえで `tag(*parts)` として渡して
ください。`*` はリストを位置引数に展開するので、二要素のリストも三要素の
リストも同じシグネチャに収まります。
'''
hints = [
  "def の行に unit=\"catty\"。それで修正は完了です。",
  "デフォルトはデフォルトのないパラメータの後に置きます — def tag(name, cents, unit=\"catty\") — そして、リストや dict をデフォルトにすると呼び出し間で共有されます。それが次に聞かれる質問です。",
  "tag(*parts) はリストを展開します。要素が二つなら三つ目はデフォルトが埋めます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "python.basic.10.exceptions"
title = "数字ではない行"
story = "魚屋の秤が重さの列を印字しますが、その真ん中に誰かの電話番号が混ざっています。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数のはずです。

各行について、値の二倍か、解析できなければ `BAD <line>` を出力してください。
最後に `SUM <total>` を出力します。`total` は出力した値の合計です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")` は `ValueError` を送出します。Python が変換の失敗を伝える方法は
それだけです — `Result` も `(value, ok)` もありません。失敗は例外であり、
数を期待していたコードが `try`/`except ValueError` でどうするかを言わなければ
なりません。

`Exception` ではなく **`ValueError`** を捕まえてください。裸の `except:` は
`KeyboardInterrupt` も自分のコードのタイプミスも飲み込みます。プログラムが
静かに失敗するようになるのはそういう経緯です。
'''
hints = [
  "スターターは xx で ValueError: invalid literal for int() with base 10 で死にます。そのメッセージが、捕まえるべき例外です。",
  "try ブロックは小さく: 失敗しうる呼び出しだけを中に入れ、print と合計はその後に置きます。",
  "except の中の continue はその行のループ本体の残りを飛ばすので、悪い行は何も足しません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "python.basic.11.comprehensions"
title = "ボーリントン・ロードを一往復"
story = "アレックスは for ループ三つでできると言います。通路は人ひとり分の幅で床は濡れています。通れるのは一回だけです。"
brief = '''
標準入力はスペース区切りの整数一行です。

三行を出力してください:

1. 偶数の値の合計 (なければ `0`)
2. `10` より大きい値をすべて二倍にし、順序どおりにスペース一つで結合したもの —
   なければ `-`
3. 異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

インデックスのループではなく内包表記を使ってください: `sum` の中にジェネレータ式、
二行目には `if` 付きのリスト内包表記、三行目には集合内包表記です。`if` は末尾に
置いてフィルタし、先頭の式が変換します。

`" ".join(...)` は文字列を要求するので、二つ目の内包表記は `v * 2` ではなく
`str(v * 2)` を作らなければなりません。`TypeError: sequence item 0: expected str
instance, int found` は、この行で誰もが出会うエラーです。
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — ジェネレータ式は唯一の引数であれば余分な括弧は要りません。",
  "[str(v * 2) for v in nums if v > 10] — 先頭で変換、末尾でフィルタ。",
  "{v for v in nums} は集合内包表記です。set(nums) と同じもので、ここではどちらでも構いません。",
]

