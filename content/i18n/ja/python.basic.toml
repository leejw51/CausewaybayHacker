[[quest]]
id    = "python.basic.07.structs"
title = "屋台ひとつ、フィールド三つ"
story = "豆腐屋のカードには名前、値段、個数が書いてあり、レジはそのカードを三つのばらばらな単語として読んで何も足し上げない。"
brief = '''
`class` はフィールドと、それを扱う関数をまとめます。`__init__` はオブジェクトが
作られるときに走り、フィールドを `self` に格納します。他のメソッドは `self` を
