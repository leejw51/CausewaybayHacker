オブジェクトはパラメータリストの最初の名前です。

```
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        return self.price * self.qty
```

`Stall` とその `__init__` は書いてあります。`total` の `return` の行を
示したとおりに打ってください。

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty — フィールドは self にあるので、メソッドの中では self.price と self.qty です。",
  "total() の中で price だけでは名前になりません。渡されるのは self だけです。",
]

