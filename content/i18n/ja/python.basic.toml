[[quest]]
id    = "python.basic.10.maps"
title = "集計ノート"
story = "野菜屋の売上はすべて単語としてノートに入り、09:00 に屋台主は野菜ごとに個数付きで一行ずつ欲しがるのに、ページは叫ばれた順の単語だけだ。"
brief = '''
dict はキーで編集されます。`counts[k] = v` はキーの下に値を格納し — 新しい
キーは追加され、あるキーは上書きされます — `del counts[k]` はキーとその値を
取り除き、`counts[k] += n` はキーの下の値を読み、変え、書き戻します。dict は
挿入順を保ちます。`sorted(counts)` はそのキーの昇順で、その順に出力する
ループのためのものです。集計は書いてあります。この四行がそれを変え、
そして整列します。

```
counts["tofu"] = 1
del counts[first]
counts["tofu"] += 4
for k in sorted(counts):
```

`counts` は単語ごとの数を持ち、`first` は行の最初の単語で、`show(counts)` は
各編集の後に集計を挿入順で出力します。三つの `# FILL` プレースホルダーの
代わりに三つの編集を打ち、最後のループのヘッダを整列したものに置き換えて
ください。

```
