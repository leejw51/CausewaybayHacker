[[quest]]
id    = "python.basic.13.classes"
title = "屋台のノート"
story = "ボーリントン・ロードの屋台はどこも自分のノートにその日の売上をつけていますが、豆腐屋のノートは全部の行が中ではなく表紙に書かれています。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<ITEM> <CENTS>` です。

品物を集める `Notebook` クラスを作り、各品物を届いた順に `<ITEM> <CENTS>` として
出力し、次に `TOTAL <sum>`、最後に `print(book)` でノート自体を出力してください —
その `__repr__` は `Notebook(items=<n>, total=<sum>)` を生成しなければなりません。

```
input:  2
        TOFU 600
        SET 2800
output: TOFU 600
        SET 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n` は `0` のこともあり、そのときの行は `TOTAL 0` と
`Notebook(items=0, total=0)` です。

スターターには、この課題の名前の由来になったバグがあります: `items = []` が
**クラス本体** にあるので、これから作られるすべての `Notebook` が共有する
ひとつのリストであって、ノートごとのリストではありません。`__init__` の中で
`self` を通して作ったものはインスタンスのもの、クラス本体にあるものはクラスの
ものです。ミュータブルなクラス属性は、コードレビューを最もよくすり抜ける
Python のバグです。ふたつ目ができるまでは、プログラムが正しく動くからです。
'''
hints = [
  "スターターを実行して出力の一行目を見てください: PENCIL 0 — 誰も書き込んでいないノートから出てきています。それが共有リストです。",
  "def __init__(self): self.items = [] — インスタンスごとに、コンストラクタの中で、self を通して作ります。",
  "__str__ がなければ print(book) は repr(book) を呼ぶので、書くメソッドは __repr__ ひとつです。それを再構築するコンストラクタ呼び出しのような見た目にしてください。それが慣習です。",
]

