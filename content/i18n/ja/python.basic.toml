id    = "python.basic.15.generators"
title = "自分の for ループ"
story = "魚屋のティッカーは始値から一定の刻みで値段をすべて並べますが、そのリストはどこにも持っていません。"
brief = '''
標準入力は三つの整数です: `start`、`step`、`count`。

`start` から始まり `step` ずつ進む値を `count` 個 yield する **ジェネレータ**
`ticker(start, step, count)` を書いてください。各値を一行ずつ出力し、次に
二つ目のティッカーを `sum` に渡して計算した `SUM <total>` を出力します。

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

最後の行は `type(ticker(...)).__name__` で、スターターの `main` がそのまま
出力します。いまは `list` と言っています。

`yield` を含む関数は、呼んでも実行されません。ジェネレータを返し、何かが次の値を
求めるたびに本体が一歩ずつ進みます。だから `for` が使え、`sum` が使え、百万個の
リストが一度も存在しないまま百万個の値を生み出せるのです。

スターターはリストを作って返しています。それは正しいのですが、問われている
ことではありません。リストは全部の値を一度に、ジェネレータは求められたときに
一つずつです。`append` を `yield` に変えて、リストを消してください。
'''
hints = [
  "出力の最後の行は型の名前で、テストが求めるのは `generator` です。yield を含む def が返すのがそれです。",
  "yield value、それから進めます。関数は yield で止まり、次に求められたときにその後から再開します。",
  "ジェネレータは一度しか消費できません。だから main は、ループが使い切ったものを再利用せず、sum のために新しいティッカーを作っています。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "python.basic.16.decorators"
title = "包まれて"
story = "市場事務所は価格関数が今日何回呼ばれたかを知りたがっていて、関数のほうは見張られていることを知りたくありません。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の kg 単位の重さです。

`price(kg)` は `500 + 100 * kg` です。`@counted` でデコレートして、`price` に
知られることなく毎回の呼び出しが数えられるようにしてください。重さごとに値段を
一行ずつ出力し、次に `CALLS <n>`、次に `NAME <price.__name__>` — これは今も
`price` と言わなければなりません。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

デコレータとは、関数を受け取って関数を返す関数です。返す関数はたいてい
`wrapper` というクロージャで、何かをしてから元の関数を呼びます — そして、
何も言わなければ `wrapper` が、`__name__` まで含めて `price` という名前の
指すものになります。`functools.wraps` が元の名前と docstring をラッパーに
写します。スターターはそれを忘れていて、最後の行は `NAME wrapper` と言っています。

回数はどこに置くか。グローバルではありません。ラッパーに付けます —
`wrapper.calls = 0` — そして後で `price.calls` を読みます。関数はオブジェクト
であり、ほかのものと同じように属性を持てます。
'''
hints = [
  "def wrapper の一行上に @functools.wraps(func)。デコレータの中にデコレータをひとつ。",
  "def price の上の @counted は、その後に price = counted(price) と書くのと同じです。名前は counted が返したものに束縛し直されます。",
  "*args, **kwargs は、ラッパーがシグネチャを知らないままどんなシグネチャでも転送する方法で、それがデコレータを再利用可能にしています。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "python.basic.17.duck-typing"
title = "アヒルのように鳴くなら"
story = "卵屋のビニール袋。それが何かは誰も聞きません。いくつ入っているか、アヒルの卵は入っているか、一つずつ見せてほしい、とだけ聞きます。"
brief = '''
標準入力はスペース区切りの品物一行、続いて探す単語一つの行です。

品物を `Bag` に入れて、次を出力してください:

1. `LEN <k>` — `len(bag)` から
2. 品物を一行ずつ — `for item in bag` から
3. `HAS <WORD> YES` または `HAS <WORD> NO` — `word in bag` から
4. `LONGEST <item>` — `max(bag, key=len)` から、同じ長さなら最初のもの

```
input:  egg duckegg tofu
        duckegg
output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag` は `list` を継承しませんし、その必要もありません。`len` は `__len__` を、
`for` は `__iter__` を、`in` は `__contains__` を呼び、`max` は `__iter__` だけ
あれば足ります。Python はそれが何 *である* かを決して問いません。必要になった
その瞬間に、そのメソッドがあるかを問うだけです。スターターにはどれもなく、
最初のエラーは `TypeError: object of type 'Bag' has no len()` です。

`__contains__` は省略できます: なければ `in` はイテレートして比較する方法に
戻ります。正しいですが遅いです。それでも書いてください。面接官が「コンテナに
してください」と言うとき、意味しているのはそれだからです。
'''
hints = [
  "def __len__(self): return len(self._goods) — 一行のメソッドが三つ。",
  "__iter__ は iter(self._goods) を返せば十分です。ジェネレータである必要はありませんが、`yield from self._goods` でも動きます。",
  "max(bag, key=len) は同じ長さの要素のうち最初のものを保つので、サンプルは後のものではなく duckegg と言っています。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "python.basic.18.none"
title = "None"
story = "05:59、ボーリントン・ロード。値札ボードがまだ開いていない屋台のことをノートに尋ね、ノートは無で答え、ボードはその無の値段を印字します。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<STALL> <CENTS>` — 開いている屋台 —
次に個数 `q` と、調べる屋台名 `q` 個です。

各問い合わせについて `<STALL> <cents>` を、その屋台が開いていなければ
`<STALL> NONE` を出力してください。そのあと `MISSING <k>` と、
`CHEAPEST <STALL>` — 開いている屋台のうち最も安いもの、同額なら名前順 —
または何も開いていなければ `CHEAPEST NONE` を出力します。

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

スターターは `CHAN` で落ちます:

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

この行がボスです。これはバグを指しません。`None` が最終的に *使われた* 場所を
指しているだけで、それは `None` が *作られた* 場所からどれだけ離れていても
おかしくありません — そしてスターターでは、作られた場所がふたつあります。
`lookup` は存在しない屋台に対して設計どおり `None` を返し、呼び出し側は確かめずに
その `.cents` を読んでいます。さらに `cheapest` は一方の経路に `return` がなく、
**暗黙に** `None` を返し、呼び出し側はそれにも同じことをしています。

Python の関数はすべて何かを返します。末尾まで落ちた関数は `None` を返します。
デフォルトなしの `dict.get` は `None` を返します。どちらもその時点では
エラーではなく、どちらも後でエラーになります。直し方はどちらも同じです:
`None` を受け取りうるコードが、属性に触れる前に `is None` で確かめます。
`== None` ではなく、`if not stall` でもありません — 値段が `0` の屋台は本物の
屋台であり、`not` はそれを捨ててしまいます。

`lookup` と `cheapest` が **意図的に** `Optional[Stall]` を返すようにし、
アノテーションでそう宣言し、`None` が届く場所で処理してください。
'''
hints = [
  "トレースバックは下から読みます: AttributeError は print の行ですが、None はその一行前の lookup から、さらにその前の board.get から出てきています。",
  "if stall is None: が確認の仕方です。`is` を使うのは、None が単一のオブジェクトで、同一性が正直な比較だからです。`==` は上書きされうるし、`not stall` は偽と評価されるが本物の値に対して間違っています。",
  "cheapest には経路がふたつあって、return があるのは片方だけです。Python はそれを警告しません。呼び出し側に None を渡して、呼び出し側に気づかせます。空の場合に明示的な `return None` を書いて、意図したものだと読み手に見えるようにしてください。",
  "アノテーションの Optional[Stall] はインタプリタには強制されません。読み手と型チェッカーへの覚え書きであり、時計に追われているのは読み手のほうです。",
]
