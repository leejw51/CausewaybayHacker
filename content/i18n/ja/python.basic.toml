# ---------------------------------------------------------------- 06
[[quest]]
id    = "python.basic.06.floats"
title = "小数点以下三桁"
story = "秤は三桁まで読み、隣の安物は単精度しか持たず、帳面には同じ数が二度、どちらも間違って書いてある。"
brief = '''
Python の `float` は64ビットの倍精度 — 他の土地でいう `f64` です。32
ビットの float 型はありませんが、見ることはできます: `struct.pack("f", x)`
は `x` を単精度の四バイトとして書き、`struct.unpack("f", ...)` が読み戻し、
戻ってくるのは最も近い `f32` に丸められた `x` です。f-string の `:.3f` は
小数三桁を出力し、`:.10f` は丸めが見えるだけの桁を出力します。

```
x = float(s)
y = struct.unpack("f", struct.pack("f", x))[0]
```

`s` は読み込み済みで、二つの print は書いてあります。二つのプレースホルダー
の代わりに上の二行を打ってください。

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
hints = [
  "x = float(s)、それから y = struct.unpack(\"f\", struct.pack(\"f\", x))[0] — unpack はタプルを返すので [0] を取ります。",
  "\"f\" が単精度の書式です。\"d\" なら倍精度で、何も変わりません。",
]

