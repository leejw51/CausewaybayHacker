[[quest]]
id    = "python.basic.03.types"
title = "割り勘"
story = "ボウリントン・ロードの門で屋台主二人が卵一箱を分け合い、ノートには取り分、余り、一個の値段があるべき場所に同じ数が三回書いてある。"
