[[quest]]
id    = "python.basic.02.price-board"
title = "値札ボード"
story = "豆腐屋のボードには数字がひとつだけ。二丁の値段と、平方の値段があった場所はふたつとも空欄です。"
brief = '''
標準入力から整数 `n` をひとつ読みます。

三行を出力してください: `n`、次に `n` の二倍、次に `n` を `n` 倍したもの。

`n` は負の数かもしれません。Python の整数には幅がないので、どんな大きさでも
収まります。

```
input:  12
output: 12
        24
        144
```

`input()` が返すのは **文字列** です。`"12" * 2` は `"1212"` で、`"12" * "12"`
は `TypeError` です。先に変換してください。
'''
hints = [
  "スターターは三つ目の print で落ちます: TypeError, can't multiply sequence by non-int of type 'str'。メッセージを読んでください。n が何なのかを教えてくれています。",
  "int(input()) で読みながら変換します。int() は空白も取り除いてくれます。",
  "負の n の二乗は正の数です。テストはそれを知っています。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.basic.03.conversions"
title = "三つの姿、ひとつの名前"
story = "魚屋のノートには値段が文字として、数として、ドルとして書いてあり、三つとも price と呼ばれています。"
brief = '''
一行を読みます: セント単位の金額で、数字だけです。

三行を出力してください:

1. 前後の空白を除いた文字列の文字数
2. 金額を数として
3. 金額をドルとして、小数点以下ちょうど二桁で

```
input:  1234
output: 4
        1234
        12.34
```

金額は非負です。**ひとつの名前** を三回束縛し直して書いてください —
`str`、次に `int`、そしてまた `str` です。Python では名前は何でも保持でき、
途中で気を変えられます。その代償として、いま `cents` が何なのかは、上に
書かれたコードを読む以外に知る手立てがありません。

ドルの計算に `float` を経由しないでください。`1234 / 100` は今日は `12.34`
ですが、`0.1 + 0.2` は毎日 `0.30000000000000004` です。整数除算と剰余なら
ふたつの半分が正確に得られ、`f"{cents % 100:02d}"` が後半をゼロ埋めします。
'''
hints = [
  "cents がまだ文字列のうちに len(cents) を取ったものが一行目です。",
  "cents = int(cents) はその場での変換ではありません。古い名前に新しい値を束縛しているだけです。その後、文字列は消えています。",
  "f 文字列の中の :02d は、幅二、ゼロ埋め、十進です。5 セントは 0.05 であって 0.5 ではありません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.basic.04.control-flow"
title = "どの通路"
story = "市場の通路番号は床にペンキで書かれ、入口の看板は各通路が何を売っているかを示すはずです。それが毎回、番号を示しています。"
brief = '''
整数 `n` をひとつ読みます。`1` から `n` までの各 `i` について、一行を出力してください:

* `i` が 3 でも 5 でも割り切れるなら `FISHVEG`
* `i` が 3 で割り切れるなら `FISH`
* `i` が 5 で割り切れるなら `VEG`
* それ以外は `i` そのもの

そのあと、`0` を読むまで一行に一つずつ整数を読み続け、`SKIPPED <k>` を
出力してください。`k` はそこまでに読んだ 0 でない行の数です。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

ループはふたつ、種類もふたつです。最初のループは始まる前に何回回るかを
知っています: `for i in range(1, n + 1)`。二つ目は知りません: `while True`
と `break` です。回数は読んだ内容で決まるからです。Python の `range` は終端の
**手前** で止まります。`range(1, n)` は、ここで誰もが一度は書くオフバイワンです。
'''
hints = [
  "両方に割り切れる場合を先に判定してください。さもないと一度も当たりません。3 と 5 で割り切れるとは 15 で割り切れることです。",
  "range(1, n) は n - 1 で止まります。スターターにはそのバグがあり、サンプル出力より一行早く終わります。",
  "while True と break が、出口が途中にあるループの Python 流の書き方です。do-while はありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.basic.05.lists"
title = "列の真ん中"
story = "SOGO 地下のローストグース売り場に四十人が並んでいます。カウンターから見えるのは列の先頭と最後尾だけで、あいだは何も見えません。"
brief = '''
標準入力は、一行目に個数 `n`、二行目にスペース区切りの整数 `n` 個です。

三行を出力してください: 最初の値、最後の値、そしてそのあいだ (両端を含まない)
にある値すべての合計。値が三つ未満なら、その合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` が真ん中です。これはスライスで、**新しいリスト** です — Rust の
スライスや Go のサブスライスと違い、Python はスライスでコピーします。
`nums[-1]` は最後の要素で、負のインデックスがあるからこそ Python では
`nums[len(nums) - 1]` と書くことがないのです。

値がひとつのとき `nums[1:-1]` は空で、その `sum` は `0` です。ほかの言語で
必要なガードがここではただで手に入ります。知っておく価値があり、思い込むより
確かめる価値があります。
'''
hints = [
  "nums[-1] は最後の要素、nums[-2] はその一つ前です。",
  "nums[1:-1] は最初と最後を除いたすべてで、空のスライスの合計はそのまま 0 になります。",
  "sys.stdin.read().split() は全部を一度に読んで任意の空白で分割するので、改行の位置は関係なくなります。",
]

