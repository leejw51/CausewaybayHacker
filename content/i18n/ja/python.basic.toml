[[quest]]
id    = "python.basic.08.sets"
title = "両方の屋台にあるもの"
story = "通路を挟んで向かい合う野菜屋がふたつ。濡れた床を二度も渡らずに、どちらからでも買えるものを知りたい客がいます。"
brief = '''
標準入力は二行で、それぞれ屋台の品物をスペース区切りで並べたものです。
同じ品物が二回書かれていることもありますが、一回と数えます。

三行を出力してください:

1. `BOTH` の後に両方のリストにあるものすべてを、ソートしてスペース区切りで —
   何もなければ `BOTH -`
2. `ONLY_A <k>`: 最初のリストにあって二番目にないものの数
3. `ALL <k>`: どちらかのリストにある異なる品物の数

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set` には重複がなく、順序もありません。`&`、`-`、`|` が三つの演算です。
set に `sorted` をかけるとリストになり、それが決まった順序で出力する
唯一の方法です。
'''
hints = [
  "set(input().split()) でトークンから直接 set を作れます。重複した tofu は入る途中で消えます。",
  "a & b は積集合、a - b は差集合、a | b は和集合です。それぞれの len が数です。",
  "\" \".join(sorted(both)) には文字列が必要で — これはもう文字列です — `if both else \"-\"` が空の場合をひとつの式で片付けます。",
]

