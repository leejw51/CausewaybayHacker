```

`n` は読み込み済み、`total` と `threes` は `0` から始まり、ループ本体は書いて
あります。本体の上に `for` の行を示したとおりに打ってください。

```
input:  10
output: 55
        3
```
'''
hints = [
  "for i in range(1, n + 1): — range は第二引数の手前で止まるので、n + 1 で n が最後の値になります。",
  "range(n) は 0 から n - 1 を数えます。合計は n だけ足りなくなります。",
]

