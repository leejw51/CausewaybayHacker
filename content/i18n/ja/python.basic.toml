[[quest]]
id    = "python.basic.07.dicts"
title = "市場の呼び声"
story = "七時のボーリントン・ロード。どの屋台も何かを叫んでいて、キャナル・ロード側の掲示板はその順位を欲しがっています。"
brief = '''
標準入力を丸ごと読み、空白で分割します。

異なる単語をそれぞれ一度ずつ `<word> <count>` として出力してください。順序は
回数の降順、同数なら単語の昇順です。

```
input:  tram tram bus
output: tram 2
        bus 1
```

dict は挿入順を覚えていますが、それは求められている順序ではありません。
タプルを返す `key` を渡した `sorted` は、最初の要素で並べ、同じなら二番目で
決めます。回数を負にするのが、片方を降順にしつつもう片方を昇順のままにする
方法です。
'''
hints = [
  "スターターは最初の単語で KeyError で死にます: counts[word] += 1 は書く前に読みますが、読むものがありません。counts.get(word, 0) がゼロを補います。",
  "sorted(counts.items(), key=...) が (word, count) の組を求めた順序で返します。dict 自体は挿入順のままです。",
  "key=lambda item: (-item[1], item[0]) — 回数の降順、次に単語の昇順を、タプルひとつで。",
]

