追記の仕方です。

```
head = s[:n]
head += "!"
```

`s` と `n` は読み込み済みで、二つの print は書いてあります。二つのプレース
ホルダーの代わりに上の二行を打ってください。

```
input:  causeway bay
        8
output: causeway!
        causeway bay
```
'''
hints = [
  "head = s[:n]、それから head += \"!\" — スライスはコピー、+= はもう一つ作ります。",
  "s[:n] は s[0:n] と同じです。始点を省くと先頭からになります。",
]

