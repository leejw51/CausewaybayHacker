id    = "python.basic.05.loops"
title = "袋を数える"
story = "袋屋は毎朝ビニール袋に 1 から n の番号を振る。何枚出たか、どれが無料の三枚目だったかの集計は、番号の下の空白行だ。"
brief = '''
`for` ループはシーケンスを歩き、`range` がそれをその場で作ります。
