id    = "python.basic.08.string-slices"
title = "最初の数文字"
story = "ラベル印字機は短いタグ用に屋台の名前の最初の数文字を取り、印を足し、看板の正式名はそのまま残さなければならない。"
brief = '''
`s[:n]` はスライスです: `s` の最初の `n` 文字を新しい文字列として。文字列
は変えられないので、スライスは常にコピーです — 断片に何をしても `s` は手つ
