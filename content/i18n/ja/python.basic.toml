[[quest]]
id    = "python.basic.12.sorting"
title = "順位表"
story = "市場事務所は毎朝いちばん安いチョイサムを貼り出し、係員はリストふたつと鉛筆で屋台の順位を手作業でつけています。"
brief = '''
標準入力は二行です: 一行目は屋台の名前、二行目は同じ順序でセント単位の値段です。

屋台を安い順に `<rank>. <NAME> <cents>` として出力してください。順位は `1` から
始まり、同額なら名前の昇順です。そのあと `CHEAPEST <NAME>` を出力します。

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
```

`zip` がふたつのリストを組にし、`key` 付きの `sorted` が組を並べ、
`enumerate(..., start=1)` が番号を振ります。組み込み三つで、インデックス計算は
どこにもありません — `for i in range(len(names))` で書いた版は、三つ目の屋台で
同額の扱いを間違えます。
'''
hints = [
  "zip(names, prices) は屋台ごとに (name, price) のタプルを一つずつ返し、短いほうのリストで止まります。",
  "key=lambda pair: (pair[1], pair[0]) は値段、次に名前で並べます。sorted は安定ですが、キーが全順序ならそれに頼る必要はありません。",
  "enumerate(ranked, start=1) は (rank, (name, price)) を返し、入れ子のタプルは for の行で展開できます。",
]

