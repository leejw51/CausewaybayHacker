[[quest]]
id    = "python.basic.04.int-types"
title = "四バイト幅"
story = "魚屋の秤は重さを四バイトで持ち、脇に収まる最大の数を印字する。帳面にはどちらもない。"
brief = '''
Python の `int` には幅がありません: 数が要るだけ育ちます。幅はそれでも
端に、バイトのあるところに存在します — `n.to_bytes(4, "big",
signed=True)` は `n` を符号付き32ビット整数、四バイト、最上位から順に書き、
`.hex()` がそれを見せます。符号付き32ビット整数に収まる最大は
`(1 << 31) - 1`、符号なし64ビットでは `(1 << 64) - 1` です。

```
print(n.to_bytes(4, "big", signed=True).hex())
print((1 << 31) - 1)
```

`n` は読み込み済みで、64ビットの最大値は最後に出力されます。二つの `# FILL`
マーカーの代わりに上の二行を打ってください。

```
input:  7
output: 00000007
        2147483647
        18446744073709551615
```
'''
hints = [
  "print(n.to_bytes(4, \"big\", signed=True).hex()) — 四バイト、ビッグエンディアン、符号付き、それから十六進で表示。",
  "(1 << 31) - 1 は 2147483647 です: 1 を左に31桁ずらして一つ引く。",
]

