id    = "python.basic.01.six-oclock"
title = "六時"
story = "06:00、ボーリントン・ロード。シャッターが上がり、床はもう濡れていて、今日最初の値札ボードはまだ白紙です。"
brief = '''
正確に次を出力してください:

```
hello, causewaybay
```

小文字、コンマひとつ、スペースひとつ、一行。それ以外は何も出力しません。

`print` は改行を付けてくれます。引数と引数のあいだにはスペースも入れます。
これが `print` で最初につまずく点です: `print("hello,",
"causewaybay")` は問題ありませんが、`print("hello, ", "causewaybay")` には
スペースがふたつ入ります。
'''
hints = [
  "print(\"hello, causewaybay\") でプログラム全体です。",
  "文字列は正確に: 小文字、コンマひとつ、その後にスペースひとつ。",
  "いちばん下の `main()` の呼び出しは残してください。呼ばれない関数は何も出力しません。スターターはまさにその状態です。",
]

