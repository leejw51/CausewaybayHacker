[[quest]]
id    = "python.hacker.16.union-find"
title = "誰が誰とつながっているか"
story = "トラム網、MTR、ミニバスの路線が一枚の紙に。本当はいくつの別々の網があるのか。"
brief = '''
標準入力は `n m seed` です: `0..n-1` と番号の付いた `n` 個の停留所と、`m` 本の無向のつながりです。入力につながりはありません — あなたが作ります。**ちょうど** この生成器で、回り込む 64 ビット算術で (手でマスクしてください — Python の int はしてくれません):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

三行を出力してください: 別々の網がいくつあるか、最大のものの大きさ、そして `REDUNDANT <k>` — つながりのうち、すでに接続されていた二つの停留所を結んだものがいくつあるかです。停留所から自分自身へのつながりもその一つです。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1` では五本のつながりは `6—1`、`4—6`、`2—3`、`2—6`、`1—2` です。最後のものはすでに同じ網にある二つの停留所を結ぶので冗長なもので、残るのは `{1,2,3,4,6}` と、単独の停留所 `0`、`5`、`7` です。

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 200000` で、つながりが `m = 200000` 本です。union-find ではない素直な答え — つながりごとに `a` から網をたどって `b` がすでにその中にあるかを見る — は正しく、つながり一本あたり `O(n)`、全体で `O(n·m)` です: このマシンでは、十秒の実行時間制限に対して **二分** 経っても終わりませんでした。それがスターターです。経路圧縮とサイズによる併合をした union-find は同じ 200000 本を **0.24 秒** で処理します。このクエストに同梱の解答でここで測ったものです。

はっきり見ておく価値があります。時間制限付きの選考で落ちる最もよくある形だからです: **スターターは間違っていません。** サンプルでも二つの小さな隠しケースでも、ちょうど正しい答えを出力します。拒否されるのは、あまりに遅く着くことだけが理由です。

union-find: どの停留所も親を指し、`find` は根までたどり、`union` は一方の根をもう一方に向けます。`find` から戻る途中で経路を圧縮すれば、全体は問い合わせごとに事実上定数時間です。

`find` はループとして書いてください。再帰のものは教科書の版で、長さ千の鎖で `RecursionError` になります — それはまさにサイズによる併合が防ぐために存在する形であり、まさに最初の `find` が圧縮する前の悪意ある入力が持つ形です。
'''
hints = [
  "つながりのリストを先に作るのではなく、進みながら両端を引いてください — それぞれ生成器を一歩、この順で。ここでつながりが二度必要になることはありません。",
  "すべての停留所を自分自身の親とし、グループ n 個から始めます。併合が成功するたびに数は一つ減ります。",
  "両端がすでに同じ根を持つつながりが冗長なものです — 数えて次へ進みます。自己へのつながり a == b は、その検査からひとりでに出てきます。",
  "意味があるのは根のサイズの項目だけなので、最大はすべてのインデックスからではなく根から読み取ってください。max(..., default=0) は特別扱いなしで n = 0 を扱えます。",
  "parent[x], x = root, parent[x] は一行で圧縮します: 右辺はどちらの代入が起きるより前に全部評価されるので、古い parent[x] は上書きされる前に読まれます。",
]

