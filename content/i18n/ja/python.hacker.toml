```

`8 1` では配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902` です。

**このクエストは計算量を強制します。そして強制できるのはこの種類だけです。** 隠しケースのひとつは `n = 200000` です。`O(n²)` の二重ループ — それがスターターです — は `2 × 10^10` 回の比較で、十秒の実行時間制限の中では終わりません。Python では一時間の中でも終わらないでしょう。マージソートの途中で転倒を数えるのは `O(n log n)` で、約三分の一秒で終わります。このマシンで、この二つのプログラムで測ったものです。

この言語が違うふうに決めることが二つあります。Python の整数は回り込みません — 大きくなります — なので、生成器は手でマスクしなければなりません: 毎ステップの後に `& 0xFFFFFFFFFFFFFFFF` です。さもないと「64 ビット」の状態は黙って 128 ビットのものになり、最初より後のすべての値が間違います。そして答えの `9990744366` は、ほかのどの言語でも 32 ビットの `int` には収まりません。ここではそれは心配ではなく、*なぜ* 心配でないかを言うことが答えの一部です。
