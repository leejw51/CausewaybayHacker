[[quest]]
id    = "python.hacker.30.range-queries"
title = "変わり続ける合計"
story = "チェーン全体の一日分のレジ操作が三十万件、その半分は訂正で、誰かが累計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の操作を実行します。すべて同じ生成器から、回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

すべての問い合わせの答えの累計を出力し、次に `UPDATES <k>` を出力してください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制されます。** 素朴な答え — 問い合わせごとに `sum(values[l:r+1])` — は問い合わせ一回あたり `O(n)` で、スライスも sum も C で走るので、小さなものでは見かけ上速く見えます。なので大きな隠しケースは `n = 500000, q = 300000` で、そこでは素朴な答えは `2 × 10^10` 程度の要素に触れ、このマシンで十秒の実行時間制限に対して **三分以上** かかりました。Fenwick 木は全部を一秒未満でこなします。どちらもこのクエストの二つのプログラムで測ったものです。

(このクエストの Rust 版と Go 版は四百万回の操作を実行します。Python は三十万回です。Python の正しい Fenwick 木でも、どんな正直な制限の中でも四百万回は通らないからです — そして要点は、正しい構造と間違った構造を分けることであって、Python と C を分けることではありません。)

教訓は面接官が引き出そうとしているものです: *一点更新、区間和* はまさに Fenwick 木が存在するための形です。短い関数三つ — add、prefix、そして二つの prefix の差としての range — で、`i & -i` が最下位の立っているビットで進む方法であり、それは Python の int でも二の補数のものとまったく同じように動きます。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ってください。O(n) のボトムアップ構築は良い最適化ですが、時計が試しているものではありません。",
  "i & -i は最下位の立っているビットを取り出します — Python の負の int はビット演算では二の補数であるかのように振る舞うので、wrapping_neg は要りません。それを足すと木を上り、引くと下ります。",
  "range(l, r) は prefix(r + 1) - prefix(l) で、その一つずれの組を正しくすることがデバッグの大半です。ループの中で self.tree をローカル変数に束縛するのは CPython では本当に速くなり、このクエストに必要な唯一の細かい最適化です。",
]

