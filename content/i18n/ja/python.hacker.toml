story = "トップ二十に入る問題で、たいていの選考で何らかの形で出され、たいていの人が一度書いたことがあって一度も理解していないもの。"
brief = '''
標準入力は `n alphabet seed` です。文字列は自分で作ってください。回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` — その長さのうち **いちばん左** のものの 0 始まりの開始位置 — を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心の周りに広げます。中心は `n` 個ではなく `2n - 1` 個あります: どの文字も奇数長の回文の中心で、二文字の間のどの隙間も偶数長の回文の中心です。隙間を忘れることが、正しそうに見える解が `abba` で `1` を返す理由です — そしてそれがスターターのすることです。

**テストが強制することとしないこと** を、はっきりと。仕事をする隠しケースは、**一** 文字のアルファベットの上の `n = 8000` です。それは中心から広げる方法の最悪の場合で — どの中心も文字列の端まで走ります — なので正しい答えはそこで `O(n²)` を全部こなし、Python のループで三千二百万回の文字の比較をして、約 **1.3 秒** で終わります。それはすべての部分文字列を調べてそれぞれを検査する方法も拒否します: `s[i:j] == s[i:j][::-1]` は C で走り、それこそがその三乗のループが小さな入力で速く感じられる理由ですが、`n = 8000` では十秒の制限に対してそれでも約 **四十秒** かかります。

(Rust はこのケースを `n = 20000` で実行します。Python は `8000` です。Python のループの二乗の答えは Rust の大きさでは八秒かかり、正しいプログラムがかろうじて通る制限は制限ではないからです。)

もう一つの大きなケース、二文字のアルファベットの上の `n = 20000` は、速さではなく **正しさ** のケースです: ランダムな二進の文字列では、回文の検査は一、二文字で失敗します。それは、大きな規模であなたの生成器といちばん左のインデックスの同点の決着がこちらのものと一致するかを検査します。

つまり: テストは三乗を拒否し、二乗を受け入れます。`O(n)` の答えである Manacher のアルゴリズムは **要求しません**。それが存在し、何をするかは知っておいてください。「で、二乗より良くできますか?」が、この問題がたいてい準備するために出される続きの問いだからです。
'''
hints = [
  "中心ごとに広げるのは二回: 奇数長には (c, c)、偶数長には (c, c + 1)。スターターには二つ目がありません。",
  "ループが止まったとき、i と j はどちらも回文を一つ越えています — なので開始は i + 1、長さは j - i - 1 です。",
  "真に長い回文のときだけ更新すれば、各長さのいちばん左のものが残り、それが AT の求めるものです。そして `i >= 0` は手で検査しなければなりません: Python では s[-1] は有効なインデックスで、それは間違った文字です。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "python.hacker.32.modular"
title = "十億七を法として"
story = "その言い回しは問題文の最後に現れ、部屋の半分はそれが何をしろと言っているのかわからない。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを生成してください。回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて二項係数 `C(a, b)` を **1000000007 を法として** 計算してください。`q` 個の答えすべての合計を、それ自体も `1000000007` を法として出力し、次に `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は何十万桁もあります。Python は実際にそれを計算してしまいます — `math.comb(200000, 100000)` は存在し、全部を返します — そしてそれがこの言語での罠です: それは正しく、問い合わせ一回あたり何十ミリ秒もかかり、そして「素数を法として」の意味するものではありません。掛け算はすべて進みながら簡約します。問題は割り算です: `a! / (b! (a-b)!)` は剰余算術では意味を持ちません。それに代わるのは **モジュラ逆数** で、`1000000007` は素数なので、フェルマーの小定理がそれを与えてくれます: `inverse(v) = v^(p-2) mod p`。Python の三引数の `pow(v, p - 2, p)` がそれで、C で、一回の呼び出しです。

つまり: `factorial[0..n]` を一度だけ前計算し、各問い合わせに `f[a] * inv(f[b]) * inv(f[a-b])` として答えます。

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 200000`、`q = 200000` です。各係数を独立に計算する — `b` 個の項を掛け、`b` 個の項で割り、それぞれにモジュラ逆数を一つ — のは十秒の実行時間制限の中で終わりません。それがスターターです。共有の階乗の表一つなら約半秒で終わります。どちらもこのマシンで測ったものです。

途中の値はすべて `2^30` 未満の二つの値の積なので、`i64` に収まります。Python ではどのみち何もオーバーフローせず、掛け算のたびに簡約する理由は正しさではなく速さです。32 ビットの `int` を持つ言語では両方で、それがこの問題が出されるもう半分の理由です。
'''
hints = [
  "掛け算のたびに簡約してください。Python はオーバーフローしませんが、二十万桁の途中の値は掛けるのが遅く、% P がすべての数を 2^30 未満に保ちます。",
  "pow(v, P - 2, P) がモジュラ逆数で、P が素数だからこそ成り立ちます — それがここでのフェルマーの小定理の中身のすべてです。Python 3.8 以降は pow(v, -1, P) も受け付け、それは同じことを直接言ったものです。",
  "逆階乗も inverse(factorial[n]) から逆向きに前計算すれば、問い合わせごとの二回の pow() 呼び出しがなくなります。通るのに必要ではありませんが、声に出して言う価値があります。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "python.hacker.33.grid-paths"
title = "街区を横切る、決して戻らずに"
story = "竹の足場で三本の通りが閉鎖された配達のグリッド。横切る道は何通りあり、どれがいちばん安いか。"
brief = '''
標準入力は `r c pct seed` です。グリッドは自分で、行優先の順に作ってください。各セルについて **二つ** の値を引き、回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

通れるセルを通って **右** か **下** にだけ動きます。出力してください:

1. `PATHS <k>` — `(0,0)` から `(r-1,c-1)` への異なる経路の数を `1000000007` を法として
2. `MIN <cost>` — 両端も数えた、経路の最小の合計コスト。経路がなければ `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

行優先の順の一回の走査で両方ができます: セルの経路の数は上から入る経路と左から入る経路の合計で、その最良のコストは自分自身のコストに、その二つのうち安いほうを足したものです。右か下にしか動かないので、必要な二つのセルは常にすでに仕上がっています — だからこれには再帰も訪問済み集合も要りません。メモ化した再帰もセルの数に線形ですが、`1000 × 1000` のケースでは二千フレームの深さにもなり、それは Python の上限の二倍です。ここではいつもの理由に加えてその理由でも、ループが答えです。

`PATHS` の数はいつもの理由で `1000000007` を法として取ります: `1000 × 1000` の隠しケースでは本当の数は六百桁を超えます。Python ならそれを保持できるでしょう。それでも足しながら簡約してください。問題文がそう言っていて、簡約していない数は間違った答えです。

**大きなケースが強制すること:** 経路を列挙する答えはすべて拒否されます。経路は部屋の中の原子より多くあります。
'''
hints = [
  "二つの角も含め、すべてのセルについて両方の値を引いてください — 生成器はそれらを飛ばさず、塞ぐのを拒むだけです。",
  "上にも左にも通れる隣がない通れるセルには、経路は零通りで、最良のコストもありません。None が正直な `unreachable` で、比べたり足したりする前のガードは `is not None` です。",
  "目的地は通れても到達不能なことがあり、それがまさに PATHS が 0 で MIN が -1 のときです。隠しケースのひとつがそれです。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "python.hacker.34.stable-sort"
title = "同点は場所を保つ"
story = "二人のライダーが同じ得点で終わり、順位表は描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。`n` 人のライダーを作ってください。ライダー `i` はインデックス `i` と得点を持ちます。回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

ライダーを得点の **降順** にソートしてください。同じ得点のライダーは到着した順を保たなければなりません。そのインデックスをスペース区切りで出力し、次に `TIES <k>` — ソートした順で隣り合う組のうち得点が等しいものの数 — を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ完全に同点がどう扱われるかで決まります。

**これは、自分が手にしているのがどのソートかを知るためのクエストです。** Python の `sorted` と `list.sort` は常に **安定** です — Timsort がそれを約束します — そして `reverse=True` はその約束を守ると文書化されています: ソートが逆順でも、等しい要素は元の順序のままです。安定で *ない* のは、昇順にソートしてから `[::-1]` でリストをひっくり返すことです: それはほかのすべてと一緒に同点も反転させ、それがスターターのすることです。サンプルでは目に見えて同点をかき混ぜ、本物の入力では必ずそうなります。

正しい答えは二つあり、両方を挙げられるべきです。`reverse=True` か符号を反転したキーで降順にソートし、残りは安定性に任せる。**あるいは** 比較を **全順序** にする — `(-score, index)` でソートすれば、どの二つの要素も等しいと比較されることはなく、安定性はもはや問題になりません。デフォルトで手を伸ばすべきは二つ目です。全順序には証明すべきことが何もありません。

時計はここで速さを測っておらず、測るものもありません: どちらを書いても `sorted` は `sorted` です。この四つのケースは、同点がどう扱われるかだけで完全に決まります。これは、ソートが約束を守る速さではなく、ソートが何を約束するかを知ることについてのクエストです。
'''
hints = [
  "[::-1] を消して reverse=True を加えてください。それが安定な答えで、文書がそれを約束しています: reverse=True は同点を反転させません。",
  "もう一つの答えは key=lambda r: (-r[0], r[1]) でソートします — 全順序なので、安定かどうかを気にすべき同点が残りません。タプルを素のままソートしないでください: (score, index) は同点ではインデックスを昇順で比べ、あなたが欲しかったのは得点の降順とインデックスの昇順です。",
  "TIES は完成した順で隣り合う等しいスコアを数え、その数はどちらを書いても同じです — ばれるのはインデックスの順です。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "python.hacker.28.lru"
title = "再帰の上限"
story = "ルーム 7-32、最後の問題、四回目。面接官はモニターを消し、ホワイトボードの言語は千フレームで止まる言語だ。"
brief = '''
一行目は `cap q` で、その後に `q` 行の操作が続きます。それぞれ `PUT <key> <value>` か `GET <key>` です — あるいは、一行目が **三つ目** の数 `seed` を持つときは、それ以上の行はまったくなく、`q` 個の操作は下の生成器から来ます。

満杯のときに **最も長く使われていない** 要素を追い出す、容量固定のキャッシュを実装してください。`GET` も `PUT` もキーを使ったことに数えます。キャッシュがすでに持っているキーの `PUT` は値を置き換え、それを最新にします — 要素は増えないので、キャッシュがどれだけ満杯でも何も追い出しません。

各 `GET` について値を、なければ `-1` を出力してください。最後に生き残ったキーを、最も最近使われたものから順にスペース区切りで — キャッシュが空なら `-` を — 出力し、次に `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルを追ってみてください: `GET 1` が `1` をまた最近のものにするので、`PUT 3` が場所を必要としたとき、出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たって `3` を最新にし、だから生き残りは `3 1` と出力されます。

生成される形は、回り込む 64 ビット算術で (手でマスクしてください):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**スターターは正しいです。** サンプルでも、打ち込めるどのケースでも走らせてみれば、毎回正しいです。それは関数型言語がするように操作を処理します — 最初の一つを扱い、残りに再帰する — そして Python は関数型言語ではありません。末尾呼び出しの除去はなく、どの呼び出しも本物のフレームで、`sys.getrecursionlimit()` は `1000` です。生成される隠しケースには二千の操作があり、スターターはそこで次のように死にます:

```
RecursionError: maximum recursion depth exceeded
```

それがボスです。`sys.setrecursionlimit(10000)` でそれは消えますが、それは間違った答えです: 上限があるのはインタプリタの下の C スタックが有限だからで、十分に高く上げると、きれいな例外がセグメンテーション違反に変わります。再帰はそもそもこの問題の形ではありませんでした。操作は並びであり、並びは `for` ループです。(そして毎回の呼び出しでの `ops[1:]` はリストの残りをコピーするので、再帰の版は二乗でもありましたが、それが問題になるほど先まで進まなかったので誰も気づきませんでした。)

それからキャッシュ自体です。教科書の答えはハッシュマップから双方向連結リストへの組み合わせで、Python にはポインタを隠したものが標準ライブラリにあります: `collections.OrderedDict` です。`move_to_end(key)` が「触れる」ことで、`popitem(last=False)` が冷えた端からの追い出しで、どちらも `O(1)` なので、ここのすべての操作は `O(1)` で、ためらわずにそう言えます。(ただの `dict` も 3.7 以降は挿入順で、欠けているのは `move_to_end` だけです。キーを削除して挿入し直すのが、同じ仕掛けを手で綴ったものです。) スターターのキャッシュは `(value, stamp)` の組の dict で、追い出しのときに最古のスタンプを走査するので `O(cap)` です — 正しく、そして直すべき二つ目のものです。
'''
hints = [
  "トレースバックを読んでください: RecursionError で終わり、同じ関数の千行です。その半分の修正は ops の上の for ループで、ほかは何も変わりません。",
  "OrderedDict: 当たりと上書きのたびに `move_to_end(key)`、満杯のキャッシュに新しいキーが来たら `popitem(last=False)`。すでにあるキーの上書きは追い出しではありません — キャッシュが満杯だと判断する前に、含まれているかを確かめてください。",
  "生き残りは熱い端から読んだ OrderedDict です: reversed(cache) が最新から順なので、最後の行にソートもスタンプも要りません。",
  "sys.setrecursionlimit は修正ではなく、なぜそうなのかを知ることが彼らの求める答えです: それは上限を動かすだけで取り除きはせず、ある点を越えるとインタプリタは例外を送出するのをやめてクラッシュし始めます。",
]
