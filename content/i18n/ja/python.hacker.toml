[[quest]]
id    = "python.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまで片付けた地図はどれも歩数を数えていた。トラムは停留所がいくつあるかを気にしない。どれだけ時間がかかるかを気にする。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所と、`m` 本の重み付きの無向辺です。グラフは自分で作ってください。**ちょうど** この生成器で、回り込む 64 ビット算術で (手でマスクしてください — Python の int はしてくれません):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達できるすべての停留所 (`0` 自身も含み、それは `0` です) への最短距離の合計を出力し、次に `MAX <the largest of them>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 100000`、`m = 200000` です。どちらにしてもダイクストラが正しいアルゴリズムで、時計が決めるのは優先度付きキューです。最小を求めて未訪問のノードをすべて走査するのは `O(V²)` — `10^10` ステップで、Python ではそれは十六秒ではなく午後いっぱいです — 対して実行時間制限は十秒です。`heapq` なら `O((V + E) log V)` になり、約三分の一秒で終わります。どちらもこのマシンで、このクエストに同梱の二つのプログラムで測ったものです: スターターは走査する版です。

はっきり見ておく価値があります。時間制限付きの選考で落ちる最もよくある形だからです: **スターターは間違っていません。** ちょうど正しい答えを出力します。拒否されるのは、あまりに遅く着くことだけが理由です。

`heapq` は最小ヒープなので、`(distance, node)` を push すれば、あとはタプルの順序がやってくれます。decrease-key はありませんが、要りません: 改善した距離を新しい項目として push し、pop した項目の距離が記録済みのものよりすでに悪ければ飛ばします。その「古い項目」を飛ばす行は人が忘れる行で、それがなければヒープは際限なく大きくなります。
'''
hints = [
  "heapq の中の (distance, node) のタプル: 距離が先にあることが項目を並べ、heapq はすでに最小ヒープです。",
  "`if d > dist[u]: continue` が古い項目を飛ばすものです。それがなくてもアルゴリズムは正しいままですが、ヒープは用済みの項目で埋まります。",
  "float(\"inf\") が正直な `unreached` です: どの int よりも大きいと比較され、緩和で None の検査が要りません。生成器の全域木の部分がすべてのノードの到達可能性を保証するので、最後のフィルタは何も取り除きません — それでも残しておいてください。到達できないノードのある版が続きの問いだからです。",
]

