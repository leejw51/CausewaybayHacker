```

負の値はスライディングウィンドウを殺します — 大きすぎるウィンドウは、縮めても直せません。生き残るのは累積和です: 並び `i..j` の合計が `k` になるのはちょうど `prefix[j] - prefix[i] == k` のときなので、以前の累積和のうち `prefix[j] - k` に等しいものがいくつあるかを数えます。先頭から始まる並びのために、写像に `0 → 1` の種をまいておきます。

ここの四つのケースは多くても数が五つで、時計はそこで速さを測っていません: すべての開始とすべての終わりの上の `O(n²)` の二重ループでも四つとも通ります。基準は本物です — 一日の売上ではその二重ループは何分もかかります — が、それはこのケースが検査するものではありません。検査するのは間違えやすい部分です: `{0: 1}` の種と、記録する前に探すことです。
'''
hints = [
  "今の累積和を記録する*前に*以前の累積和を探してください。さもないと k が 0 のとき、長さ零の並びが自分自身を数えます。",
  "最初に seen = {0: 1} とすることで、インデックス 0 から始まる並びがそもそも見つかるようになります。",
