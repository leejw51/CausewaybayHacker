# ZIG LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/zig/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks and identifiers are copied
# verbatim.

pack   = "zig.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet.01.print"
title = "料金表示板"
story = "06:00、海底トンネルの銅鑼湾側入口。1番ブースの表示板は、誰かが書き込んで初めて料金を映す。"
brief = '''
`w` は stdout 上のバッファ付き writer です。`n` を10進数で出力し、改行してください。

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

どの行でしょう？
'''
hints = [
  "引数はタプル `.{ ... }` に入れます。print は失敗し得るので `try` を付けます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet.02.parse-int"
title = "硬貨を数に"
story = "2番ブースの硬貨トレイは文字で数える。レジが欲しいのは整数だ。"
brief = '''
`tok` は `"42"` を持つ `[]const u8` です。`n` を10進の `i64` にし、不正な
トークンのエラーは呼び出し元に渡してください。
'''
hints = [
  "型が先、次に文字列、最後に基数。エラー共用体を返すので `try` を付けます。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.cheatsheet.03.for-index"
title = "車線番号"
story = "車軸カウンターは、車ごとに通った車線を0から数えて記録する。"
brief = '''
`xs` は `[]const i64` です。各要素を `x`、そのインデックスを `i` として
ループしてください。
'''
hints = [
  "for ループは二つを同時に回せます。スライスと、0から始まる開いた範囲。キャプチャも一つずつ。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet.04.div-trunc"
title = "売上を分ける"
story = "一晩の売上をブースで分ける。帳簿はマイナスにもなる。"
brief = '''
`a` と `b` は実行時の `i64` で、どちらも負になり得ます。`q` を、C と同じく
**ゼロ方向**に丸めた商にしてください。
'''
hints = [
  "符号付きの実行時整数にただの `/` はコンパイルできません。Zig は丸め方を明示させます。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.cheatsheet.05.eql"
title = "同じナンバー"
story = "高架のナンバー読み取り機が、一台ずつ手配リストのナンバーと照合する。"
brief = '''
`a` と `b` はどちらも `[]const u8` です。同じバイト列のとき真になる `if` を
開いてください。
'''
hints = [
  "スライスに `==` はありません。std.mem の比較関数は要素型を最初に取ります。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet.06.orelse"
title = "記録なし"
story = "集計表が一度も見たことのないナンバーにも数はある。その数はゼロだ。"
brief = '''
`counts` は `std.StringHashMap(i64)` で、`get` は `?i64` を返します。`c` を
キー `k` の数に、`k` がなければ0にしてください。
'''
hints = [
  "オプショナルは `orelse` でデフォルト値付きで外します。`catch` はエラー共用体用です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.cheatsheet.07.append"
title = "もう一台"
story = "3番ブースの列が一台伸びる。その1バイトずつが支払い済みだ。"
brief = '''
リストの末尾に `x` を追加してください。

```
var xs: std.ArrayList(i64) = .empty;
defer xs.deinit(gpa);
// ____
```
'''
hints = [
  "リストはアロケータを覚えていません。伸びる可能性のある呼び出しごとに `gpa` を渡し、結果に `try` を付けます。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet.08.sort-desc"
title = "重い順"
story = "カナル・ロード下の計量台は、一番重いトラックを一番上に載せる。"
brief = '''
`xs` は `std.ArrayList(i64)` です。その items を**降順**に、その場で並べ替えて
ください。
'''
hints = [
  "std.mem.sort は型、スライス、コンテキスト、比較関数を取ります。std.sort には向きごとに一つずつあります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.cheatsheet.09.catch-default"
title = "にじんだ券"
story = "発券機の券がにじんでいる。ブースはゼロとして数え、車を通す。"
brief = '''
`tok` は数でないかもしれません。10進の `i64` として `n` にパースし、失敗したら
エラーを返さずに0を使ってください。
'''
hints = [
  "エラー共用体は `catch` でデフォルト値を与えます。`orelse` はオプショナル用です。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.cheatsheet.10.comptime-type"
title = "どんな積荷でも"
story = "入口のコンテナ置き場は、トラックが何を運んでも受け取る。コンパイル時に何かを教えさえすれば。"
brief = '''
`Stack` は要素型を受け取り、それで組み立てた struct 型を返す関数です。どの行で
始めますか？

```
// ____
    return struct {
        items: []T,
    };
}
```
'''
hints = [
  "型はコンパイル時に決まる値なので、その引数にそう印を付けます。関数は `type` を返します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.cheatsheet.11.self-ptr"
title = "集計ボックス"
story = "4番ブースにボルト留めされたカウンターは、一台ごとにカチリと鳴る。そのコピーは独りで鳴るだけだ。"
brief = '''
呼ばれたそのカウンターに1を足すメソッド `inc`：

```
const Counter = struct {
    n: i64 = 0,
    // ____
        self.n += 1;
    }
};
```
'''
hints = [
  "引数は定数のコピーです。呼び出し元の struct を変えるには、それへのポインタを受け取ります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet.12.errdefer"
title = "失敗したときだけ"
story = "トンネル入口の遮断機は、料金が通れば車を送り、通らなければ券を取り戻す。"
brief = '''
`fill` が失敗したら `buf` を解放し、成功したらそのまま呼び出し元に渡して
ください。

```
fn load(gpa: std.mem.Allocator, n: usize) ![]u8 {
    const buf = try gpa.alloc(u8, n);
    // ____
    try fill(buf);
    return buf;
}
```
'''
hints = [
  "ただの `defer` は成功も含めてすべての出口で実行されます。エラーで戻るときだけ実行される形があります。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.cheatsheet.13.slice"
title = "真ん中の車線"
story = "入口の五車線のうち、今夜カメラの下にあるのは真ん中の二つだ。"
brief = '''
`xs` は要素五つの `[]const i64` です。`mid` を、インデックス1と2の要素への
ビューにしてください — ちょうど二つ、コピーなしで。
'''
hints = [
  "サブスライスは `[start..end]` で、end は含まれません。end をまるごと省けば `xs.len` まで続きます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.cheatsheet.14.while-step"
title = "ブースを数える"
story = "検査官はブースをゼロから最後まで歩き、確認のたびに一歩進む。"
brief = '''
`i` と `n` は `usize` で、`i` は0から始まります。本体を `i = 0, 1, …, n-1` で
実行するループを開いてください。ステップは本体の末尾ではなく、ループの
ヘッダに書きます。
'''
hints = [
  "Zig に C 風の `for` はありません。コロンの後に継続式を置く `while` で、`++` もありません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.cheatsheet.15.switch-range"
title = "重量クラス"
story = "計量台は読み取ったトン数で車両をクラスに振り分ける。一番重いクラスには上限がない。"
brief = '''
`t` は `i64` です。0から9まで（9を含む）のすべての値が `"light"` になる
プロングはどれですか？

```
const class = switch (t) {
    // ____
    10...99 => "medium",
    else => "heavy",
};
```
'''
hints = [
  "switch の範囲は両端を含み、スライスの範囲よりドットが一つ多く書かれます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.cheatsheet.16.error-union"
title = "失敗し得ると、書いてある"
story = "5番ブースの券読み取り機は数を返すか、券を読めなかったと認めるかのどちらかで、そのラベルは両方を語っている。"
brief = '''
`parse` はトークンを `i64` に変え、パースの失敗は呼び出し元に渡します。
これを開く行はどれですか？

```
// ____
    return try std.fmt.parseInt(i64, s, 10);
}
```
'''
hints = [
  "関数の中の `try` は、戻り値の型がエラーを運べるときにしかコンパイルできません。推論されるエラー集合は型の前の一文字で書きます。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.cheatsheet.17.if-capture"
title = "ナンバーがあれば"
story = "3番車線の上のカメラはナンバーを読めたかもしれないし、読めなかったかもしれない。集計が動くのは読めたときだけだ。"
brief = '''
`maybe` は `?i64` です。`maybe` が値を持つときだけ本体が実行され、その値が
本体の中で `v` に束縛される `if` を開いてください。
'''
hints = [
  "条件は比較ではなくオプショナルそのもので、その後のキャプチャが外された値です。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.cheatsheet.18.hashmap-count"
title = "それをもう一つ"
story = "管制室のナンバー集計は車一台ごとに一つ増え、見たことのないナンバーはゼロから始まる。"
brief = '''
キー `x` の下に保存された数に1を足してください。まだないキーは0として
扱います。

```
var counts: std.AutoHashMap(i64, i64) = .init(gpa);
defer counts.deinit();
// ____
```
'''
hints = [
  "`get` はオプショナルを返すので、算術の前にデフォルト値が要ります。このマップはアロケータを覚えているので、保存の呼び出しはそれを取りません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.cheatsheet.19.intcast"
title = "符号付きの車線番号"
story = "車線番号は符号付き整数として回線から届いた。車線表はサイズしか受け取らない。"
brief = '''
`k` は非負で範囲内と分かっている実行時の `i64` です。`xs[idx]` がコンパイル
できるように、`idx` を同じ値を持つ `usize` にしてください。
'''
hints = [
  "このキャストは引数を一つ取り、変換先の幅は着地する束縛から来ます。だから束縛が型を言わなければなりません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.cheatsheet.20.labeled-break"
title = "両方のループから出る"
story = "盗まれた一枚のナンバーの捜索は車線ごと、車ごとに進み、見つかった瞬間に捜索全体が止まる。"
brief = '''
`grid` は行のスライスです。目標が見つかったら**両方**のループを一度に抜けて
ください — 外側のループが次の行に進んではいけません。

```
outer: for (grid) |row| {
    for (row) |c| {
        if (c == target) {
            found = c;
            // ____
        }
    }
}
```
'''
hints = [
  "ラベル付きループは、キーワードの後にラベル名を、名前の前にコロンを付けて抜けます。もう一つのラベル付きジャンプは次の行へ飛ぶだけです。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.cheatsheet.21.var-typed"
title = "累計"
story = "1番ブースの夜勤の帳簿はゼロから始まり、ループが渡す運賃をすべて受け取る。"
brief = '''
`xs` は `[]const i64` です。下のループが足し込めるように、`total` を 0 から始まる
`i64` として宣言してください。

```
// ____
for (xs) |x| total += x;
```
'''
hints = [
  "ループが書き込む束縛には可変のキーワードが要り、裸の整数リテラルは自分の実行時の型を持ちません — 宣言が型を言わなければなりません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.cheatsheet.22.range-for"
title = "十回まわる"
story = "検査官は見回りで十のブースを一つずつ試す。10番ブースも含めて。"
brief = '''
本体を **十** 回実行し、`i` が順に 1, 2, …, 10 の値を取る `for` を開いてください —
最後の回は `i == 10` を見なければなりません。
'''
hints = [
  "範囲に対する for は上限を含みません。スライス `[a..b]` とまったく同じです。だから上限は欲しい最後の値の一つ先です。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.cheatsheet.23.bool-and"
title = "両方の信号が青"
story = "2番車線の遮断機は、券が読めて料金が通ったときだけ上がる。"
brief = '''
`ready` と `valid` は実行時の `bool` です。両方が true のときだけ本体が実行される
`if` を開いてください。
'''
hints = [
  "Zig は論理演算子を二重の記号ではなくキーワードで綴ります — C の綴りはここではコンパイルエラーです — そして条件にはやはり括弧が要ります。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.cheatsheet.24.float-from-int"
title = "半額の運賃"
story = "夜間の半額運賃: 看板の料金は整数で、割引はそうではない。"
brief = '''
`n` は実行時の `i64` です。`f / 2.0` がコンパイルできるように、`f` を同じ値を持つ
`f64` にしてください。
'''
hints = [
  "整数から float への暗黙の変換はなく、それを行う組み込み関数は値だけを取ります — 変換先の型は束縛から来るので、束縛が型を名指ししなければなりません。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet.25.abs"
title = "どれだけずれたか"
story = "4番ブースの車軸カウンターが一晩でずれた。管制室が知りたいのはどれだけかで、どちら向きかではない。"
brief = '''
`x` は負かもしれない実行時の `i64` です。`a` をその絶対値にしてください — そして
結果は **符号なし**（`u64`）であることを忘れずに。
'''
hints = [
  "0.12 以降これは std.math の関数ではなく組み込み関数で、入力の型の符号なしの双子を返します — 符号付きの束縛はそれを受け取れません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet.26.reverse"
title = "来た道を戻る"
story = "レッカー車は列をトンネルの入口から、入ってきたのと逆の順でバックさせる。"
brief = '''
`xs` は `std.ArrayList(i64)` です。その項目をその場で逆順にしてください。
'''
hints = [
  "スライスにメソッドはありません。std.mem のヘルパーは sort や eql と同じように、要素の型を最初に取ります。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.cheatsheet.27.dupe"
title = "記録用のコピー"
story = "シフトのナンバーのリストは銅鑼湾の記録事務所へ上がり、事務所は自分のコピーを保管する。"
brief = '''
`xs` は `[]const i64` です。`c` を `gpa` が所有する独立したヒープ上のコピーにして
ください — 呼び出し側が後で `gpa.free(c)` で解放します。
'''
hints = [
  "コピーは std.mem ではなくアロケータのメソッドで、スライスの前に要素の型を教えます。確保は失敗することがあります。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet.28.items-len"
title = "列はどれだけ長いか"
story = "入口の表示板は3番ブースで何台が待っているかを見せる。"
brief = '''
`xs` は `std.ArrayList(i64)` です。`n` をそれが持つ要素の数にしてください。
'''
hints = [
  "リスト自身には長さがありません。要素はスライスのフィールドに住んでいて、スライスの長さは呼び出しではなくフィールドです。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.cheatsheet.29.return-error"
title = "何が悪かったか言え"
story = "5番ブースが一台もいない列の先頭の車を求め、読み取り機はそう言わなければならない。"
brief = '''
スライスに何もないとき、呼び出し側に `Empty` という名前のエラーを渡してください。

```
fn first(xs: []const i64) !i64 {
    if (xs.len == 0) {
        // ____
    }
    return xs[0];
}
```
'''
hints = [
  "エラーは値で、ほかの値と同じように返します。新しいものは小文字の名前空間からドットで綴り — 関数のように呼び出すのではありません — 宣言は要りません。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.cheatsheet.30.mod"
title = "残ったもの"
story = "一晩の売上を三等分し、余った硬貨はチップの瓶へ — 決して負の一握りにはならない。"
brief = '''
`a` と `b` は実行時の `i64` です。`b` は正で、`a` は負かもしれません。`r` を
**決して負にならない** 余りにしてください: `a = -7`、`b = 3` なら `r` は `2` で
なければなりません。
'''
hints = [
  "`/` と同じく、`%` 記号は符号付きの実行時オペランドを拒み、組み込み関数を選ばせます: 一つは被除数の符号に従い、もう一つは除数の符号に従います。",
]
