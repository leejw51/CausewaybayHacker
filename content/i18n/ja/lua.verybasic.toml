# LUA LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/lua/verybasic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "lua.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.verybasic.01.print"
title = "最初の提灯"
story = "浣紗街の 21:00。龍の小屋の上の提灯の板は暗く、その夜最初の一行を打つのはメイだ。"
brief = '''
プログラムは `hello, causewaybay` をちょうど一行に出力しなければなりません。組み込み一つが、引数と改行を標準出力に書きます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 括弧、そして文字列の中のカンマ。",
  "print \"hello causewaybay\" は正しい Lua です — 文字列リテラルは括弧なしで呼び出しに続けられます — が、カンマが抜けています。io.write は改行を書かず、puts は Lua の知らない名前です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.verybasic.02.int-types"
title = "線香の分け前"
story = "蓮花宮の門で線香の束が龍の節に分けられる。帳面は一節あたり何束で余りが何束かを言わねばならないのに、何も言わない。"
brief = '''
`a` と `b` は整数です。プログラムは整数の商と剰余を、スペース一つ区切りで一行に出力しなければなりません。LuaJIT には数の型が一つしかなく、整数除算の演算子もありません: `/` は小数を返し、`math.floor` がそれを切り捨て、`%` が剰余です。`print` は引数のあいだにタブを入れるので、二つはまず `..` で一つの文字列にします。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — 割り算を切り捨て、スペースでつなぎます。",
  "a / b は 3 ではなく 3.5 です。// は LuaJIT の演算子ではありません。そして print(x, y) はスペースではなくタブで区切ります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.verybasic.03.floats"
title = "正確な重さ"
story = "書館街の小屋の秤は担ぎ手一人あたりの龍の重さを小数三桁で示し、刷り物のプログラムは二桁を欲しがる。プログラムのその行は白紙だ。"
brief = '''
`x` と `y` は数です。プログラムは `x / y` を小数点以下ちょうど二桁で出力しなければなりません。`string.format` は C 風の書式指定を受け取ります: `f` は固定小数点の数で、ドットの後の数字が小数の桁数です。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(string.format(\"%.2f\", x / y)) — 2 の前のドットが小数の桁です。",
  "math.floor(x / y * 100) / 100 はやはり数で、数は 3.50 ではなく 3.5 と出力されます。%d は整数用です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.verybasic.04.strings"
title = "道順の看板"
story = "蓮花街の入口の道順の看板は大文字で描かれ、担ぎ手の名簿では小文字である。看板屋はそれを叫び返してほしい。"
brief = '''
`s` は一行のテキストです。その長さの後に、プログラムは `s` を大文字で出力しなければなりません。ある文字列メソッドが、すべての文字を大文字にしたコピーを返します。メソッドはコロンで呼び、文字列が自分自身を渡します。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "print(s:upper()) — コロンが s を最初の引数として渡します。",
  "ドットの s.upper() は何も渡さず、upper は文字列を受け取っていないと文句を言います。toUpperCase は JavaScript です。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.verybasic.05.bool-if"
title = "偶数か奇数か"
story = "龍の節は左側を偶数番が、右側を奇数番が担ぐ。浣紗街の担ぎ手は自分の番号を持っていて、自分の側を知る必要がある。"
brief = '''
`n` は正の整数です。プログラムは `n` が二で割り切れれば `even`、そうでなければ `odd` を出力しなければなりません。条件は剰余をゼロと比べる `if` のヘッダで、`then` で終わります。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "if n % 2 == 0 then — 等号二つは比較、一つは代入。",
  "n / 2 は小数で、正の n では決してゼロになりません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.verybasic.06.loops"
title = "集計"
story = "その夜の線香の数は一足す二足す三と最後の節まで続くのに、小屋の集計板はゼロを示す。"
brief = '''
`n` は正の整数です。ループは 1 から `n` まで（`n` を含めて）のすべての整数を訪れ、それぞれを `total` に足さなければなりません。数値の `for` は開始と終了を受け取り、終了は含まれます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  4
output: 10
```
'''
hints = [
  "for i = 1, n do — 終了は含まれるので、n そのものです。",
  "for i in ... はもう一方のループで、イテレータ関数を受け取るものです。数はイテレータ関数ではありません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.verybasic.07.functions"
title = "担ぎ手の料率"
story = "浣紗街の最初の十周は担ぎ手に一周五ずつ払い、それ以降の周はどれも三ずつ払う。支払いの関数は何も返さない。"
brief = '''
`pay(laps)` は支払額を返さなければなりません: 最初の十周は一周 5、十周目より後の周は一周 3 です。関数はキーワード一つで値を返します。出力するだけの関数は `nil` を返します。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3
output: 15
```
'''
hints = [
  "return math.min(laps, 10) * 5 + math.max(laps - 10, 0) * 3",
  "引数一つの math.max はその引数そのものです: max(laps - 10) は短い夜には負になります。そして pay の中の print では、呼び出し側は nil を出力することになります。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.verybasic.08.structs"
title = "一つの屋台、二つのフィールド"
story = "ビクトリア・パークの提灯市の屋台はどれも、札に名前と値段がある。札の値段は決して保存されず、ラベルは屋台の半分しか出力しない。"
brief = '''
`Stall.new(name, price)` は `Stall` をメタテーブルに持つテーブルを作ります — Lua のクラスです。`name` と同じやり方で `price` をオブジェクトに保存し、`s.price` がそれを読み返せるようにしなければなりません。フィールドは `self` に書きます。裸の名前はローカル変数です。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "self.price = price — self はテーブルで、裸の名前は引数です。",
  "等号二つは比較で、比較だけでは Lua が受け付ける文になりません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.verybasic.09.struct-method"
title = "行の合計"
story = "値段かける数量は提灯市の麺の屋台のどの注文にもある一行で、それを言うはずのメソッドが何も言わない。"
brief = '''
`Stall:total()` は値段かける数量を返さなければなりません。コロンで宣言したメソッドには隠れた最初の引数 `self` があり、オブジェクトのフィールドはそれを通して届きます。`price` だけでは、一度も設定されていないグローバル変数です。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return self.price * self.qty — 両方のフィールドを self 経由で。",
  "price だけではグローバル変数で nil であり、nil には掛け算ができません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.verybasic.10.enums"
title = "路線の色"
story = "ティンハウ出口の MTR の路線図には三つの路線の名前がある。担ぎ手たちはその語を持っていて、それが表す定数が必要だ。"
brief = '''
`word` は `island`、`tsuenwan`、`kwuntong` のどれかです。Lua には列挙型がありません: `Line` は名前付きの数のテーブルで、それがいちばん近いものであり、`COLOUR` はその数をキーにしています。プログラムは `word` を対応する `Line` のメンバーに変えなければなりません。テーブルはキーで引き、ここのキーは大文字です。テーブルは呼び出せず、`Line.word` は `word` と綴られたキーを探します。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 角括弧は名前でキーを引き、名前は大文字です。",
  "小文字の語のままの Line[word] はキーを見つけられず nil を返し、COLOUR[nil] も nil です: 板は nil を出力します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.verybasic.11.vector"
title = "節のリスト"
story = "大坑道のトラックから降ろされる節は、どれも来た順にリストに載るはずなのに、リストは空のままだ。"
brief = '''
`xs` は空のテーブルとして始まり、Lua のリストはキーが 1, 2, 3, ... のテーブルです。ループで読んだ各整数 `x` を末尾に加え、入力の順を保たなければなりません。`table` ライブラリにはそのための関数があります。引数二つなら末尾に追加し、三つなら真ん中が位置です。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "table.insert(xs, x) — テーブルが先、値が一つ、末尾に。",
  "xs[#xs] = x はテーブルが空のあいだは添字 0 に書き、#xs は 0 のままです。位置 1 を付けると一つずつ先頭に入り、順が逆になります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.verybasic.12.vector-edit"
title = "頭が外れる"
story = "リストの最初の節は頭で、頭は自分の竿で別に担がれる。それをリストから外し、後ろのものをすべて一つ詰めなければならない。"
brief = '''
`xs` はその行の整数を添字 1 から持っています。プログラムは添字 1 の要素を取り除き、残りを前に詰めなければなりません。`table.remove` は位置を受け取り、後ろのものを詰めます。枠に `nil` を入れると穴が残るだけで、リストは短くなりません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "table.remove(xs, 1) — 位置は二番目の引数です。",
  "位置なしの table.remove(xs) は最後のものを取ります。xs[1] = nil はリストに nil を残し、table.concat はそれを拒みます。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.verybasic.13.list"
title = "鎖の先頭"
story = "提灯の鎖は浣紗街いっぱいに吊るされ、いちばん新しい提灯は先頭に付く。担ぎ手たちは後ろに付け続ける。"
brief = '''
`chain` はリストとして使うテーブルです。Lua には両端キューがありません。位置付きの `table.insert` がいちばん近いもので、その位置より後ろのものをすべて一つずらします。ループで読んだ各 `x` を先頭に加え、最後に読んだものが最初に来るようにしなければなりません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "table.insert(chain, 1, x) — 引数三つ: テーブル、位置、値。",
  "引数二つだと末尾に追加します。chain[1] = x は先頭を押し出さずに上書きします。ただのテーブルにはコロンで呼べる insert メソッドがありません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.verybasic.14.maps"
title = "線香の帳面"
story = "通りごとに帳面が一冊、担ぎ手たちが焚く品ごとに一行、それぞれに数。ある品が初めて出たとき、足す行がない。"
brief = '''
`counts` は語をキーにしたテーブルです。各語 `w` について、プログラムはその数に一を足さなければなりません。初めてのときはゼロから始めます。無いキーは `nil` として読め、`nil` には足せません。`or` が既定値を補いますが、`+` より結合が弱いので、既定値には括弧が要ります。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts[w] = (counts[w] or 0) + 1 — 括弧があるので、足し算の前に既定値が効きます。",
  "括弧がないと counts[w] or 0 + 1 は counts[w] or 1 です: 初めてなら 1、その後もずっと 1 のままです。無いキーでの counts[w] + 1 は nil の算術です。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.verybasic.15.hashtable"
title = "引き当て"
story = "提灯市の屋台表は名前を番号に対応させ、無い屋台を尋ねたら板を白紙にせず -1 と言うべきだ。"
brief = '''
`stalls` は名前を屋台番号に対応させます。語 `w` について、プログラムはその番号を出力し、`w` がテーブルに無ければ `-1` を出力しなければなりません。無いキーはエラーではなく `nil` で、`or` が `nil` を既定値に変えます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "print(stalls[w] or -1) — or の右側が既定値です。",
  "stalls[w] だけでは無い名前に nil を出力します。stalls.w は文字どおり w という名前の屋台を探します。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.verybasic.16.sets"
title = "相異なる値段"
story = "提灯の屋台が六つ、値段は三通り。板は値段が何通りあるかを欲しがり、六と出力する。"
brief = '''
`xs` はその行の整数を持っています。プログラムは相異なる値がいくつあるかを出力しなければなりません。Lua には集合がありません: 値をキーにしたテーブルがいちばん近いもので — 二度保存したキーも一つのキーです — 数えるループはすでに `pairs` でキーを歩いています。`#` は 1 からの枠しか数えないからです。各 `x` を `seen` にキーとして記さなければなりません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "seen[x] = true — x がキーで、true は nil でない何かというだけです。",
  "seen.x は x と綴られたキーで、すべてに対して一つのキーです。table.insert は末尾に追加して重複を残します。seen[x] + 1 は初回には nil の算術です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.verybasic.17.stack"
title = "線香の山"
story = "線香の束は小屋の戸口の山に積まれ、上から取られる。使い走りは下から一つ取り続ける。"
brief = '''
`stack` はスタックとして使うテーブルです。プログラムは一番上（最後）の要素を取り出して `top` に入れなければなりません。`table.remove` は要素を取り除いて返し、位置がなければ最後のものを取ります。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4
        1 2 3
```
'''
hints = [
  "local top = table.remove(stack) — 位置なしは最後のものです。",
  "stack[#stack] は一番上を読みますが山に残したままです。位置 1 は一番下を取ります。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.verybasic.18.queue"
title = "担ぎ手の列"
story = "担ぎ手たちは小屋で受付をした順に龍へ呼ばれる。係はいちばん新しい名前を呼び続ける。"
brief = '''
`q` は担ぎ手を順に持つテーブルです。Lua には両端キューがありません。位置付きの `table.remove` がいちばん近いもので、その位置より後ろのものがすべて前に詰まります。プログラムは最初の一人を取り出して `first` に入れなければなりません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1
        2 3 4
```
'''
hints = [
  "local first = table.remove(q, 1) — 位置 1、そして残りが前に詰まります。",
  "位置なしの table.remove(q) は後ろから取ります。q[1] は取り除かずに読むだけです。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.verybasic.19.heap"
title = "一番小さい番号を先に"
story = "節の番号は路地から順不同で届き、係は毎回いちばん小さいものを次に欲しがる。番号を置いておく山は、それがどれかをまるで知らない。"
brief = '''
Lua の標準ライブラリにはヒープがないので、スターターは小さな `MinHeap` クラスを持っています: `push` は値を加えて上へふるい上げ、`pop` はいちばん小さいものを取ります。各 `x` はヒープ自身のメソッドを通して、ヒープが自分自身を渡すようにコロンで呼んで入れなければなりません。そうすれば後で `pop` がいちばん小さいものから返します。`items` に直接書くとふるい上げが飛ばされ、順が壊れます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap:push(x) — コロンがヒープを self として渡し、push は x をあるべき場所までふるい上げます。",
  "ドットの heap.push(x) は x を self にしてしまい、数には items がありません。table.insert(heap.items, x) は x を末尾に置いてふるい上げを飛ばします。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.verybasic.20.sorting"
title = "提灯のはしご"
story = "市の板の提灯の値段は屋台が開いた順に並び、客は一番安いのを先に欲しがる。"
brief = '''
`xs` はその行の整数を持っています。プログラムは出力の前に `xs` をその場で昇順に並べ替えなければなりません。`table` ライブラリにそれをする関数があり、既定で昇順です。二番目の引数は比較関数になります。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "table.sort(xs) — ライブラリの関数に、テーブルを引数として。",
  "a > b を返す比較は降順に並べます。ただのテーブルには sort メソッドがなく、sort だけではグローバル変数ではありません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.verybasic.21.sort-by-key"
title = "リーダーボード"
story = "小屋の壁の担ぎ手の板は周回数の多い順で、同じ数の二人は名前順。板は受付順になっている。"
brief = '''
`rows` は `name` と `score` を持つテーブルのリストです。スコアの降順、次に名前の昇順で並べ替えなければなりません。`table.sort` は `a` が `b` の前に来るかどうかを答える比較関数を受け取ります。二つが等しくない限りスコアが決め、等しければ名前が決めます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "table.sort(rows, function(a, b) if a.score ~= b.score then return a.score > b.score end return a.name < b.name end) — 降順にするためスコアは大なり、名前は同点のときだけ。",
  "スコアだけの比較では、同点はソートがたまたま訪れた順のままになります。table.sort は安定ではありません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.verybasic.22.reverse"
title = "後ろから前へ"
story = "龍の名前は尾の幟に逆向きに描かれ、向こう側から正しく読める。プログラムもその向きを欲しがる。"
brief = '''
`s` は一行のテキストです。プログラムはそれを逆にして出力しなければなりません。文字列ライブラリにはまさにそのためのメソッドがあり、コロンで呼びます。`sub` は一部を切り出すだけで、向きを変えはしません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "print(s:reverse()) — メソッド名を全部、コロン付きで。",
  "s:sub(-1, 1) は最後の文字から最初の文字までの部分を求めるもので、一文字より長ければ空です。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.verybasic.23.closures"
title = "上乗せ"
story = "提灯の屋台はどの卸値にも同じ上乗せを足すのに、上乗せを覚えているはずの関数がそれを忘れる。"
brief = '''
`make_adder(k)` は `x + k` を返す内側の関数 `add` を定義します。その内側の関数そのものを返さなければなりません — 関数もほかと同じ値です — そうすれば後で `k` を覚えたまま `add(x)` を呼べます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add — 裸の名前で、括弧なし。",
  "add() は x なしで呼んで nil を足します。k を返すと数が返り、数は呼び出せません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.verybasic.24.lambdas"
title = "偶数の二乗"
story = "偶数番の節はその番号の二乗で払い、奇数番は何も払わない。小屋の台帳は合計一つを欲しがる。"
brief = '''
`xs` はその行の整数を持っています。Lua には `map` も `filter` も組み込まれていないので、スターターは `map(f, xs)`、`filter(f, xs)`、`sum(xs)` を持っています。`total` は偶数の値の二乗の合計でなければならず、その三つと無名関数二つで組み立てます — `function(x) ... end` が Lua のラムダです。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs)))",
  "filter は関数が true を返すものを残し、map は変換します。関数の外の裸の x * x はグローバル変数 x、つまり nil の掛け算です。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.verybasic.25.threads"
title = "全部の節を同時に"
story = "どの節の線香の使い走りも自分のコルーチンで自分の数を二乗するのに、集計はどれかが最初の yield を越える前に出力される。"
brief = '''
ここにスレッドはありません: コルーチンがいちばん近いもので、resume されているあいだだけ走り、`yield` で制御を返す関数です。`workers` のどのワーカーも開始されています — 一度 resume され、最初の yield まで進んでいます — が、どれもまだ結果を書いていません。結果を出力する前に、メインプログラムは各 `co` を最後まで走らせなければなりません。`coroutine` ライブラリの関数の一つが、コルーチンを yield したところから続けます。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "coroutine.resume(co) — 開始したのと同じ呼び出しで、yield から続きます。",
  "coroutine.status(co) は尋ねるだけです。メインプログラムからの yield は yield する先がないのでエラーです。コルーチンはテーブルではなく、メソッドを持ちません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.verybasic.26.mutex"
title = "一つのカウンター、四つの手"
story = "四人の線香の使い走りが、小屋の壁にチョークで書いた一つのカウンターに、順番にチョークを取って足していく。カウンターにはロックがあるのに、誰も読む前に取らない。"
brief = '''
一度に走るコルーチンは一つなのに、それでも競合です: 各ワーカーは `counter` を読み、yield し、書き戻し、その隙にほかの三つが走ります。Lua にはミューテックスがありません。`lock` は小さな協調的なもので、その `acquire` はロックが空くまで yield してから取ります。読む前に、各ワーカーはそのメソッドを通してロックを取らなければなりません — ロックが自分自身を渡すようにコロンで。解放は書き込みの後にもう書いてあります。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  1000
output: 4000
```
'''
hints = [
  "lock:acquire() — それから読みと書き、そしてもうそこにある解放。",
  "ドットの lock.acquire() は self を渡さず、見るべき held がありません。誰も持っていないロックの解放は、設計上エラーです。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.verybasic.27.binary-tree"
title = "ゼロ"
story = "浣紗街の龍の頭、21:00: 節の番号は木に入り、節は 1 から始まり、`segments[0]` は `nil` だ — 頭はどこにもなく、木の左の枝も同じどこでもない場所で、舞は二つ目の提灯から始まる。"
brief = '''
節の番号は `segments` に読み込まれ、それはどの Lua のリストとも同じく 1 から始まります — `segments[0]` は `nil` で、まだ無い子もそうです。どちらも辿られるまではエラーではありません。`insert(n, v)` は `v` を入れた木の根を返します。`nil` の場合と右側は書いてあります。小さい `v` については、左の子をそこへ挿入した結果で置き換え、`nil` の子がノードになるようにしなければなりません。

それをする行を選び、`-- FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — 再帰は部分木の新しい根を返します。それを保存してください。",
  "結果を保存せずに insert を呼ぶと nil はそのまま残り、何も文句を言いません: nil は辿られるまではエラーではありません。v を付け忘れると nil の値が挿入され、次のそれとの比較がエラーになります。",
]
