**取る**分岐、次にそれを飛ばす分岐です。次に `SUBSETS <2^n>` を出力します。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

積んで、再帰して、**取り出す**。取り出しが人の書き忘れる部分で、その症状は
最初の行以降のすべての行が長すぎることです。
'''
hints = [
  "要素ごとに二つの再帰呼び出し: 積んだもの一つ、積まないもの一つ。取るほうを先にすれば、サンプルの順が出てきます。",
  "chosen.pop_back() は二つの呼び出しの間に入ります。それが試す・再帰する・戻すの戻すです。",
  "基底ケースは at == nums.size() で、そこでの空の選択は空の部分集合であり、それも数に入ります。",
]

