# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.hacker.17.lis"
title = "最長の上り"
story = "日々の売上、言いたいだけの数、それをシードから自分で作る。求められているのは売上が伸び続けた最長の期間で、日が連続している必要はない。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **正確に** この
生成器で、定義上ラップする `std::uint64_t` の算術で、自分で作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

最長の**狭義単調増加部分列**の長さを出力してください — 値は順番を保ちますが、
隣り合っている必要はありません。次に `TAILS <k>` を出力します。`k` は同じ長さで、
ペイシェンスソートの山の数から読み取ったものです。

```
input:  8 1
output: 3
        TAILS 3
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
で、その中の最長の上りは `93944146 392341189 822192870` です。アルゴリズムの
バグを探しに行く前に、生成器をその行と照らし合わせてください。

**このクエストは計算量を強制します。** スターターは `O(n²)` の表です —
何も見ずに書けるべき答えで、間違ってはいません。`n = 200000` では速い版と同じ
`881` を出力します。それを出力するのは開始から **32.6 s** 後で、実行制限は
五秒なので、見えるのは間違った答えではなくタイムアウトです。それこそがこの問いが
生み出すために存在する失敗です。

`O(n log n)` のものは、各長さについて、その長さの部分列が終わり得る最小の値を
保ちます — 常にソートされたリストなので、新しい値の位置は二分探索で、
`std::lower_bound` がその探索です。それは `n = 200000` を **0.006 s** でこなします。
どちらも、このクエストに同梱の二つのプログラムで、このマシンで測ったものです。

幅について一言。それがこの問いに C++ が付け加える半分だからです。生成される値は
どれも `2^30` 未満で、答えは高々 `n` なので、`int` で両方を保持できます — しかし
生成器の `x` は `std::uint64_t` でなければならず、他のものではいけません。符号なしの
オーバーフローは定義上ラップします。**符号付き**のオーバーフローは未定義動作なので、
そこを `long long` にするとコンパイラは何をしてもよいことになり、それに対する
`>> 33` はこの生成器が意味する論理シフトではなく算術シフトになります。符号なしで
生成し、剰余の後で変換してください。
'''
hints = [
  "tails は部分列ではありません。その長さが答えで、その中身は最良の終わりの値にすぎません。",
  "狭義単調増加とは、value 以上の最初の tail を置き換えることで、それはまさに std::lower_bound が返すものです。",
  "大きなケースがタイムアウトしても、答えは何も間違っていません — ここではループの形こそが答えです。200000 個の値に対する二重ループは 2 x 10^10 回の比較です。",
]

