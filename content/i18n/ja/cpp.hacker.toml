# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.hacker.22.trie"
title = "接頭辞の箱"
story = "停留所ボードのための自動補完 — 実際にリストにあるものだけを補完する、正直な種類のもの。"
brief = '''
一行目は `n q` です。続く `n` 行は挿入する小文字の単語です。その次の `q` 行は
問い合わせで、それぞれ `WORD <s>` か `PREFIX <s>` です。

トライ — 各ノードが最大 26 個の子を持つノードの木 — を作り、答えてください:

* `WORD <s>` → `s` が挿入されていれば `YES`、そうでなければ `NO`
* `PREFIX <s>` → 挿入された `n` 個の単語のうち `s` で始まるものの数

`n` 個の単語が相異なるとは約束されておらず、`PREFIX` は相異なる単語ではなく
**挿入**を数えます: `tram` を二回挿入すれば `PREFIX tram` は `2` です。`NODES` は
ノードを数えるので、二回目の挿入は何も足しません。

次に `NODES <k>`、根を含むトライのノードの数を出力します。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

各ノードに、そこを通る挿入された単語の数を保てば、`PREFIX` は最後に数える
ことのない歩みです。ノードは一つの `std::vector` に格納し、子にはインデックスを
持たせてください — なければ `-1` — ノードごとに二十六個の `unique_ptr` を持たせる
のではなく。そのほうが小さく、速く、そしてベクタの中へのポインタと違って、
インデックスは伸長で無効になることがありません。
'''
hints = [
  "ノードは一つのベクタに格納し、子にはインデックスを持たせてください。push_back の前に取ったベクタの中への参照は、前のマップのイテレータ無効化のバグが帽子をかぶったものです。",
