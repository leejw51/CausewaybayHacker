# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.hacker.23.prefix-sums"
title = "目標に届く方法はいくつ"
story = "一日の売上と、監査役が見たがっている数。連続した何時間の組がちょうどそれになるか。"
brief = '''
一行目は `n k` です。二行目は `n` 個の整数で、負のこともあります。

合計がちょうど `k` になる連続した区間の数を出力し、次に `RANGE <s>` を出力して
ください。リスト全体の合計で、もう一度足すのではなく最後の累積和から読み取ります。

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

負の値はスライディングウィンドウを殺します — 大きすぎるウィンドウを縮めて直す
ことはできません。生き残るのは累積和です: 区間 `i..j` の合計がちょうど `k` に
なるのは `prefix[j] - prefix[i] == k` のときなので、`prefix[j] - k` に等しいそれ
以前の累積和がいくつあるかを数えます。先頭から始まる区間のために、マップに
`0 → 1` を最初に入れておきます。

ここのケースは小さく、時計は速さを測っていません。そして `O(n²)` の二重ループを
弾くケースはここにはありません — 本物の `n` ならあるでしょう。200000 個の値に
対する同じ二重ループは `2 × 10^10` 回の足し算で、このマシンで約六秒かかります。
実行制限は五秒で、ハッシュマップの一回の走査はその百分の一です。この四つが
確かめるのは負の値と先頭から始まる区間で、それがこの答えが実際に間違う二つの
場所です。計算量はあなたの良心に任されています。
'''
hints = [
  "現在のものを記録する前にそれ以前の累積和を引いてください。そうしないと k が 0 のとき長さゼロの区間が自分自身を数えます。",
  "最初に seen[0] = 1 とすることが、インデックス 0 から始まる区間をそもそも見つけられるようにします。",
  "最後の累積和が合計なので、二行目には何の追加コストもかかりません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.hacker.24.inversions"
title = "時計に捕まるもの"
story = "午後の回の最初の問題。素朴な答えは正しく、そして間違った答えだ — しかもこの言語では、小さいテストを欺けるほど速い。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **正確に** この
生成器で、定義上ラップする `std::uint64_t` の算術で、自分で作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

**転倒**を数えてください: `a[i] > a[j]` となる組 `i < j` です。その数を出力し、
次に `MAX <largest value>` を出力します。

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1` の場合、配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
です。

**このクエストは計算量を強制し、それができるのはこの種類だけです。**
スターターは `O(n²)` の二重ループで、C++ ではひねりのある罠です: `-O2` で、
邪魔をする境界チェックもないので、コンパイラはそれをベクトル化し、Rust 版と
Go 版のこの面接が使う大きさ `n = 200000` では **1.5 s** で終わり、五秒の実行制限に
収まります。だから C++ の隠しケースは `n = 1000000` です。そこでは二重ループは
`5 × 10^11` 回の比較で、**38 s** かかります。マージソートの間に転倒を数えるのは
`O(n log n)` で、**0.05 s** です。このマシンで、この二つのプログラムで測りました。

大きなケースがあなたの代わりに決めることがあと二つあります。`n = 1000000` の答えは
`250046540838` で、`int` に収まりません — 幅の間違ったアキュムレータは遅いのでは
なく、黙って間違います。そして生成器はオーバーフローではなくラップしなければ
なりません: `std::uint64_t` は定義上ラップし、符号付きの `long long` なら未定義
動作で、コンパイラはそれに対して何をしてもよいことになります。
'''
hints = [
  "ソートの前に最大値を取るか、コピーをソートしてください。マージソートは足元で配列を並べ替えます。",
  "マージで右側の値が勝つとき、左半分の残りの要素はどれもそれより大きい — それが一度に mid - left 個の転倒で、それが仕掛けのすべてです。",
  "圧縮した値に対する Fenwick 木がもう一つの O(n log n) の答えで、面接の場で名前を挙げる価値があります。時計の下ではマージソートのほうがコードが少なくて済みます。",
]

