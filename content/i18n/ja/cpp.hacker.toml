input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

これは競技形式の選考の標準的な包みで、候補者を落とす理由は一つです: ケースごとで
あるべき状態がループの前で宣言されていた。すべてのアキュムレータ、すべての
セット、すべての `best` は `for` の**中に**入ります。

行ではなく `>>` で空白区切りのトークンごとに読めば、`n = 0` の空行はもはや特別な
場合ではなくなります — それがこの形が教える二つ目のことです。
'''
hints = [
