# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.hacker.20.bits"
title = "ひとりぼっちのもの"
story = "どの伝票も二回読み取られる。一枚を除いて。ハッシュマップは使わせてもらえず、ソートもさせてもらえない。"
brief = '''
一行目は `n` です。二行目は `n` 個の非負整数で、一つを除くすべての値がちょうど
二回ずつ現れます。

四行を出力してください:

1. 一回だけ現れる値。**xor** と定数の追加領域で見つけます
2. その中で立っている `1` のビットの数
3. 二の累乗なら `POW2 YES`、そうでなければ `POW2 NO`(`0` は違います)
4. 最下位の立っているビットを消した値。立っているビットがなければ `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` かつ `x ^ 0 == x` で、xor はどの順で起きても気にしません。それが
一行目のすべてです。`x & (x - 1)` は最下位の立っているビットを消し、それが三行目と
四行目をただでくれます。全部を `unsigned long
long` でやってください: 符号付きの型でのシフトと引き算には端の場合があり、問いは
それについてではありません。

ここのケースは小さく、時計は速さを測っていません。大きな隠しケースはなく、この
パックが作るやり方では作ることもできません: 組と一つからなる配列は生成されるの
ではなく*構築*されるもので、二つのランドがそれを構築しても同じ配列にはなりません。
だからこれらのケースは四つの行とその端を確かめます — `0` は二の累乗ではなく、
立っているビットのない値は最下位のものを消しても `0` のままです。それでも xor が
答えです。二重ループで出現回数を数えるのは `O(n²)` で、本物の `n` では死にます。
'''
hints = [
  "組はどの順で届いても互いに打ち消し合うので、リストに対する一回の畳み込みで足ります。",
  "毎回最下位のビットを消してビットを数えると、ビット幅ごとにではなく立っているビットごとに一回回ります。<bit> の std::popcount が C++20 の一行です。",
  "二の累乗はちょうど一つのビットが立っているので、最下位のものを消すとゼロが残ります — そしてゼロ自身は手で除外しなければなりません。",
]

