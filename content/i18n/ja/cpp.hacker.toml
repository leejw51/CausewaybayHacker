# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまで片付けたマップはどれもホップを数えていた。トラムは停留所がいくつあるかを気にしない。それにどれだけ時間がかかるかを気にする。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所と、`m` 本の重み付きの無向辺。グラフは
**正確に** この生成器で、`std::uint64_t` で、自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達できるすべての停留所への最短距離の合計(`0` 自身を含み、それは
`0` です)を出力し、次に `MAX <the largest of them>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースは `n = 200000`、`m = 400000` です —
Rust と Go の面接が使う大きさの二倍です。C++ は間違った答えを十分速く走らせるので、
`n = 100000` ではちょうど五秒の線上に乗り、通るか落ちるかがその日の天気次第に
なってしまうからです。どちらにしても正しいアルゴリズムはダイクストラで、時計が
決めるのは優先度付きキューです。未訪問のノードをすべて走査して最小を探すのは
`O(V²)` で、`n = 200000` では五秒の実行制限に対して **35 s** かかります。二分ヒープ
ならそれは `O((V + E) log V)` になり、**0.09 s** で終わります。どちらも、この
クエストに同梱の二つのプログラムで、このマシンで測ったものです: スターターは
走査する版です。

はっきり見ておく価値があります。時間制限のある選考で落ちるいちばんよくある形
だからです: **スターターは間違っていません。**まさに正しい答えを出力します。
七倍遅れて届くことだけを理由に弾かれるのです。

`std::priority_queue` は最大ヒープなので、`(distance, node)` のペアに対して
`std::greater` 付きで宣言してください。decrease-key はなく、要りもしません: 改善した
距離を新しい項目として積み、取り出した項目の距離がすでに記録したものより悪ければ
飛ばします。その「古い項目」を飛ばす行が人の忘れる行で、それがないとヒープは
際限なく大きくなります。
'''
hints = [
  "Entry = pair<distance, node> として std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>>: ペアはまず距離で順序付けされ、greater が最大ヒープをひっくり返します。",
  "if (d > dist[u]) continue; が古い項目を飛ばす行です。それがなくてもアルゴリズムは正しいままで、ヒープが古くなった項目で埋まります。",
  "生成器の全域木の半分が、すべてのノードが到達可能であることを保証するので、INF によるフィルタが実際に何かを取り除くことはありません — それでも残してください。到達不能なノードのあるこの問いの版が続きの質問だからです。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.hacker.30.range-queries"
title = "変わり続ける合計"
story = "チェーン全体の一日分、四百万件のレジ操作、その半分は訂正。そして誰かが累計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 回の操作を
走らせます。すべて同じ生成器で、`std::uint64_t` で:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

すべての問い合わせの答えの累計を出力し、次に `UPDATES <k>` を出力してください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制され、それには少々手間がかかりました。** 素朴な答え —
問い合わせのたびに範囲をループする — は問い合わせごとに `O(n)` で、コンパイラは
それを驚くほど速いものにベクトル化します。小さなケースでは捕まりません。だから
大きな隠しケースは `n = 500000, q = 4000000` で、そこでは素朴な答えは `10^11` 程度の
要素に触れて五秒の実行制限内に終わらず、Fenwick 木は全体を一秒をゆうに切って
こなします。どちらも、このクエストの二つのプログラムで測りました。

教訓は面接官が引き出そうとしているものです: *点の更新、範囲の合計*は、まさに
Fenwick 木がそのために存在する形です。三つの短い関数 — add、prefix、そして二つの
prefix の差としての range — と、最下位の立っているビットずつ進む方法である
`i & -i`。その式のためにインデックスは符号付きのままにしてください。符号なしの型
では `-i` はラップで、たまたま同じビットになりますが、面接の場で説明しなければ
ならないようなものではありません。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ってください。O(n) のボトムアップ構築は良い最適化ですが、時計が試しているものではありません。",
  "i & -i は最下位の立っているビットを取り出します。それを足すと木を上り、引くと下ります。",
  "range(l, r) は prefix(r + 1) - prefix(l) で、その二つの一つずれを正しくすることがデバッグの大半です。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "トップ二十に入る問題で、たいていの選考で何らかの形で出され、ほとんどの人が一度は書いたことがあって一度も理解したことのないもの。"
brief = '''
標準入力は `n alphabet seed` です。文字列は自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` を出力してください — その
長さのうち**いちばん左**のものの 0 始まりの開始位置です。

```
input:  12 3 5
output: 5
        AT 1
```

各中心の周りに広げます。中心は `n` 個ではなく `2n - 1` 個あります: どの文字も
奇数長の回文の中心で、二つの文字の間のどの隙間も偶数長の回文の中心です。
隙間を忘れることが、正しく見える解が `abba` で `1` を返す理由で、スターターが
しているのがそれです。

**テストが強制するものとしないもの**を、はっきりと。仕事をする隠しケースは
**一**文字のアルファベットでの `n = 20000` です。それは中心から広げる方法の最悪の
場合です — どの中心も文字列の終わりまで走ります — だから正しい答えはそこで
完全な `O(n²)` をこなし、それでも百分の数秒で終わります。それはまた、すべての
部分文字列を調べてそれぞれを判定するやり方も弾きます。それは三乗で、五秒以内に
戻ってきません。

もう一つの大きなケース、二文字のアルファベットでの `n = 20000` は、速さではなく
**正しさ**のケースです。ランダムな二進の文字列では回文の判定は一、二文字で
失敗するので、三乗の答えでさえ通ります。それは、大きさがあっても生成器と
いちばん左のインデックスという同点の決着がこちらと一致することを確かめます。

正直な但し書きを一つ。面接官が突っ込んでくる種類のことだからです: 一文字の
ケースが弾くのは*すべての*部分文字列を調べるやり方です。それまでに見つけた最良
より長くない部分文字列を飛ばす一行を足せば、同じ三乗のループが両方の大きな
ケースを通ります — この入力ではその枝刈りがそれを `O(n²)` に潰します。だから
テストが弾くのは素朴な三乗であって、最悪の場合に三乗になるすべてのプログラム
ではありません。

つまり: テストは三乗を弾き、二乗を受け入れます。`O(n)` の答えである Manacher の
アルゴリズムは要求**しません**。それが存在することと何をするかは知っておいて
ください。「で、二乗より良くできますか?」こそ、この問いが普段その前振りとして
出される続きの質問だからです。
'''
hints = [
  "中心ごとに二回の呼び出し: 奇数長には (c, c)、偶数長には (c, c + 1)。スターターには二つ目が欠けています。",
  "ループが止まったとき、i と j はどちらも回文の一つ外に動いています — だから開始は i + 1 で、長さは j - i - 1 です。",
  "厳密に長い回文のときだけ更新すれば、各長さのいちばん左のものが残り、それが AT の求めるものです。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "cpp.hacker.32.modular"
title = "十億七を法として"
story = "その言い回しは問題文の最後に現れ、部屋の半分はそれが何をしろと言っているのか分からない。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを `std::uint64_t` で生成します:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて二項係数 `C(a, b)` を **1000000007 を法として**計算して
ください。`q` 個すべての答えの合計を、それ自体も `1000000007` を法として出力し、
次に `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は何十万桁にもなるので、計算してから還元することは決して
ありません — すべての掛け算を進みながら還元します。問題は割り算です:
`a! / (b! (a-b)!)` は剰余算術では意味を持ちません。代わりになるのは**モジュラー
逆元**で、`1000000007` は素数なので、フェルマーの小定理がそれをくれます:
`inverse(v) = v^(p-2) mod p` で、約三十回の二乗による高速べき乗で計算します。

つまり: `factorial[0..=n]` を一度だけ前計算し、各問い合わせには
`f[a] * inv(f[b]) * inv(f[a-b])` として答えます。

**ここでは計算量が強制されます。** 隠しケースの一つは `n = 200000`、
`q = 200000` です。各係数を独立に計算する — `b` 個の項を掛け、`b` 個の項で割り、
それぞれにモジュラー逆元一つ — のは五秒の実行制限内に終わりません。それが
スターターです。共有の階乗表一つなら一秒をゆうに切って終わります。どちらも
このマシンで測りました。

途中の値はどれも `2^30` 未満の二つの値の積なので、`long long` に収まり、何も
オーバーフローしません。`int` では収まりません — ここでは `int` は 32 ビットです —
そしてそれが、この問いが出されるもう半分の理由です。
'''
hints = [
  "最後ではなく、掛け算のたびに還元してください。long long は P 未満の二つの値の積を保持できますが、階乗は保持できません。",
  "inverse(v) は power(v, P - 2) で、P が素数だからこそ成り立ちます — ここでのフェルマーの小定理の中身はそれですべてです。",
  "inverse(factorial[n]) から逆向きに逆階乗も前計算すれば、問い合わせごとの二回の power() 呼び出しがなくなります。通るのに必要ではありませんが、口に出して言う価値があります。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "cpp.hacker.33.grid-paths"
title = "街区を横切って、決して戻らない"
story = "竹の足場で三本の通りが閉鎖された配達グリッド。横切る道は何通りあり、どの道がいちばん安いか。"
brief = '''
標準入力は `r c pct seed` です。グリッドは行優先の順で自分で作り、各マスについて
**二つ**の値を引きます:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

**右**か**下**にだけ、通れるマスを通って動きます。出力してください:

1. `PATHS <k>` — `(0,0)` から `(r-1,c-1)` への相異なる経路の数、
   `1000000007` を法として
2. `MIN <cost>` — 経路の最小の合計コスト、両端を含めて数えます。経路がなければ
   `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

行優先の順の一回の走査で両方ができます: マスへの経路の数は上からと左からそこに
入る経路の数の和で、その最良のコストは自分のコストにその二つの安いほうを足した
ものです。右か下にしか動かないので、必要な二つのマスは常にすでに終わっています
— だから再帰も訪問済みの集合も要らないのです。

`PATHS` の数はいつもの理由で `1000000007` を法として取ります: `1000 × 1000` の
隠しケースでは本当の数は六百桁を超えます。足しながら還元してください。

**大きなケースが強制するもの:** 経路を列挙する答えをすべて弾きます。経路は
部屋の中の原子より多くあります。ボトムアップの表とメモ化した再帰は区別しません
— どちらもマスの数に対して線形で、どちらも余裕で通ります。
'''
hints = [
  "二つの角も含め、すべてのマスについて両方の値を引いてください — 生成器はそれを飛ばさず、塞ぐのを拒むだけです。",
  "上にも左にも通れる隣のない通れるマスは、経路ゼロで到達でき、最良のコストはありません。INF を到達不能の意味に保ち、足し算を守ってください。INF に何かを足すのは符号付きのオーバーフローだからです。",
  "目的地は通れても到達不能なことがあり、それがまさに PATHS が 0 で MIN が -1 のときです。隠しケースの一つがそれです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "cpp.hacker.34.stable-sort"
title = "同点は席を守る"
story = "二人のライダーが同じスコアで終わり、順位表は描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。`n` 人のライダーを作ります。ライダー `i` は
インデックス `i` とスコアを持ちます:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

ライダーをスコアの**降順**でソートしてください。同じスコアのライダーは届いた順を
保たなければなりません。インデックスをスペース区切りで出力し、次に `TIES <k>` —
ソートした順で隣り合う組のうちスコアが等しいものの数 — を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ完全にそれらに何が
起きるかで決まります。

**これは、自分が手にしているのがどのソートかを知るクエストです。** `std::sort` は
**安定ではありません** — 等しい要素の順について何も約束せず、本物の入力では
目に見えてそれを保ちません: それはイントロソートで、その分割の段階は当然のように
等しい要素をピボットの向こう側へ交換します。`std::stable_sort` は安定で、
マージソートで、その約束のためにいくらかのメモリを使います。スターターはスコア
だけを見る比較子で `std::sort` を使い、隠しケースは、それが明らかにかき混ぜて
しまうほど大きいものです。(`n = 8` ではライブラリは挿入ソートに切り替わり、
たまたま順を保ちます — だから小さなテストは何も証明しなかったでしょうし、だから
ここの小さなケースは判定するものではなく*見える*ものなのです。)

正しい答えは二つあり、両方を出せるべきです。`std::stable_sort` を使う。**あるいは**
`std::sort` のまま比較を**全順序**にする — スコアの降順、次にインデックスの昇順 —
そうすれば二つの要素が等しいと比較されることはなく、安定性は問題でなくなります。
既定で手を伸ばすべきは二つ目です。順序が完全に規定されていれば、不安定なソートに
証明すべきことは何もありません。
'''
hints = [
  "一語: std::sort を std::stable_sort にします。それが安定な答えです。",
  "もう一つの答えは std::sort のまま (スコアの降順、次にインデックスの昇順) で比較します — 全順序なので、不安定になる余地のある同点はもう残りません。",
  "TIES は完成した順で隣り合う等しいスコアを数え、その数は二つのどちらを書いても同じです — あなたを見抜くのはインデックスの順です。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.hacker.28.lru"
title = "リンカ"
story = "7-32 号室、三回目の面接、最後の質問。安全網のない言語、より短い時計、そして正しいものを追い出さなければならないキャッシュ。"
brief = '''
一行目は `cap q` です。続く `q` 行は `PUT <key> <value>` か `GET <key>` です。

いっぱいになったら**最も長く使われていない**項目を追い出す、固定容量の
キャッシュを実装してください。`GET` も `PUT` も、キーを使ったことに数えます。

各 `GET` について値を出力し、なければ `-1` を出力してください。最後に、生き残った
キーを最近使った順にスペース区切りで出力し — キャッシュが空なら `-` —
次に `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルをたどってください: `GET 1` が `1` を再び最近のものにするので、`PUT 3` が
場所を必要としたとき出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たって
`3` を最も最近のものにし、だから生き残りは `3 1` と出力されるのです。

教科書どおりの答えは**双方向連結リスト**を指すハッシュマップで、C++ には本物が
あります: `std::list` で、そのイテレータは他の要素が挿入、削除、splice されても
有効なままです — `std::vector` にはできない唯一の保証で、マップが値として
`std::list::iterator` を持てる理由のすべてです。`push_front`、先頭への `splice`、
`back` と `pop_back` はすべて O(1) なので、ここでのどの操作も O(1) で、言葉を
濁さずにそう言えます。

Rust の面接では求められなかった、正しくすべきことが二つあります。リストのノードは
値に**加えて**キーを持ちます。追い出しはリストから始まり、どのマップの項目を
消すかを知らなければならないからです。そして二つの削除の順が大事です: まず
`back()` からキーを読み、それをマップから消し、*それから* `pop_back` します —
逆だと、もう存在しないノードへのイテレータを通した読み取りになり、それこそが
ヌーンデイガン以来このランドの主題だったものです。

ここのケースは小さく、時計は速さを測っていません: 四つの操作では `std::list` と
先頭から走査する `std::vector` を見分けられません。上の段落の `O(1)` は面接の場で
口に出す文なので、たまたま四つのケースを通ったコードではなく、あなたが書いた
コードについて本当でなければなりません。
'''
hints = [
  "recent.splice(recent.begin(), recent, it) は it が指すノードを O(1) で先頭に移し、その後も it は同じノードを指しています。それが設計全体の拠り所となる操作です。",
  "すでにあるキーの上書きは追い出しではありません — キャッシュがいっぱいだと決める前にマップを確認してください。",
  "追い出し: back().first を取り、そのキーをマップから消し、それから pop_back。pop_back の後ではマップが持っていたイテレータはダングリングなので、マップの項目を先に消さなければなりません。",
  "リストを先頭から末尾へ歩けばすでに最近使った順なので、最後の行にソートは要りません。",
]
