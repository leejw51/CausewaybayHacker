ここのケースは小さく、時計は速さを測っていません — 圧縮せずに歩く `find` でも
四つすべてを通り、問い合わせごとに配列全体を走査し直しても通ります。それでも
圧縮してください。上の段落は十万の停留所と十万のつながりについての主張で、
この四行ではなくその主張こそ、あなたが守るよう求められるものです。
'''
hints = [
