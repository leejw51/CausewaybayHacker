        B A 10
output: A 80
        B 120
        MOVED 2
```

スターターには間違いが二つあり、出力に現れるのは一つだけです。移送元から引いて
移送先に決して足しません — それが見えるバグです。もう一つは形です: *移送元を先に*
ロックすると、逆向きの二つの移送がそれぞれ一つのロックを握って相手を永遠に
待つことがあります。それがデッドロックで、テストには現れず、火曜日の 12:00 に
現れます。

両方のロックを**一つの全体的な順序**で取れば、循環はできません。C++17 はその順序を
ただでくれます: `std::scoped_lock lock(a_mutex, b_mutex)` はデッドロックを避ける
アルゴリズムで任意の数のミューテックスを取得し、デストラクタでそのすべてを
解放します。常に `A`、次に `B` の順で取る二つの `lock_guard` は、同じ答えを手で
書いたものです。
'''
hints = [
  "どちらの水位に触れる前にも両方のタンクをロックしてください。std::scoped_lock lock(a.mutex, b.mutex); は一行で、安全な順序でそれをします。",
  "どの水位がマイナスになるかを決めるのは水の向きで、どのロックを先に取るかではありません。",
  "常に A のミューテックス、次に B のものを取る二つの std::lock_guard オブジェクトも同じ答えです。規則は、すべてのスレッドが順序に合意することです。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.advanced.06.condition-variable"
title = "ハッチ"
story = "一台のポンプがタンクを満たし一台が抜き、抜く側は 11:40 から空のタンクをポーリングし続けています。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

生産者スレッドは各値をミューテックスで守られた `std::queue` に積み、消費者
スレッドはそれを一つずつ取り出して二倍にして出力します。生産者は全部を積んだら
`done` を設定して消費者を起こし、消費者はキューが空で**かつ** `done` が設定されて
いるときに止まります。両方を join し、次に `CONSUMED <n>` を出力してください。

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

キューは FIFO なので、スケジューラが何をしようと順序は入力の順です。
`std::condition_variable` は、消費者がロックの上で空回りする代わりに、やることが
できるまで眠る方法です: `cv.wait(lock, predicate)` はミューテックスを解放して
眠り、起こされるたびに述語を確認し直します — それが見せかけの目覚めを処理して
くれ、だから述語付きの形が書くべき唯一の形なのです。

スターターは固まります。生産者は全部を積んで、`done` を設定することも通知する
こともなく戻るので、消費者は最後の値で目覚め、キューを空にし、来ることのない
合図を待ちます。どの生産者と消費者の組にも*もう来ない*と言う方法が要ります —
それが `done` です。
'''
hints = [
  "生産者のループの後で: ロックし、done = true を設定し、アンロックし、cv.notify_all()。四行で、プログラムは終了します。",
  "done は wait の述語の中でミューテックスの下で読まれるので、書き込みもミューテックスの下でなければなりません — ロックなしで書かれたフラグはデータ競合です。",
  "cv.wait は lock_guard ではなく std::unique_lock を取ります。wait はそれをアンロックして再ロックしなければならないからです。述語は目覚めるたびに確認し直されます。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.advanced.07.atomic"
title = "一ワード、ロックなし"
story = "回転ゲートの数にはロックが要りません。ポンプ室のそれ以外のすべてには要り、その見分けが仕事です。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値ごとに一本のスレッドを起動してください。各スレッドは共有された
`std::atomic<long long>` に自分の値を足し、共有された `std::atomic<int>` を一つ
増やします — ミューテックスはどこにもありません。全部を join し、`TOTAL <sum>` と
`HITS <n>` を出力します。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

スターターはコンパイルできません: ラムダが二つの atomic を**値で**キャプチャし、
`std::atomic` にはコピーコンストラクタがありません。それは意図的です。atomic は
複数のスレッドが一命令ずつ更新することに合意した場所で、そのコピーは別の場所に
なり、共有は失われます。参照でキャプチャしてください。

atomic は安いミューテックスではありません。別の道具で、一命令で読んで変更して
書く一つのマシンワードのためのものです。`fetch_add` がその命令です。二つの
フィールドが互いに一致しなければならなくなった瞬間、ロックが戻ってきます —
「この二つを一緒に」のための atomic はなく、だから前のクエストの `Counter` には
ミューテックスがあり、これにはないのです。

ここでは `std::memory_order_relaxed` で十分です。これらの増加が他の書き込みに
対して*いつ*見えるようになるかには何も依存せず、一つも失われないことだけが
大事だからです。その一文が続きの質問です。
'''
hints = [
  "エラーは std::atomic のコピーコンストラクタが削除されていると言っています。[&total, &hits, value] をキャプチャし、mutable を外してください。",
  "fetch_add は以前の値を返し、足し算を不可分に適用します。ロックもガードもありません。",
  "atomic に対する total += value も不可分で問題ありません。total = total + value はそうではありません — それは間に隙間のあるロードとストアです。",
]

