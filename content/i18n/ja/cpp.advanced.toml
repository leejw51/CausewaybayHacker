# ---------------------------------------------------------------- 31
[[quest]]
id    = "cpp.advanced.14.invalidation"
title = "歩きながら消す"
story = "港長は係留リストを読み下しながらサンパンに線を引いて消し、消すたびにその次の一隻を飛ばします。"
brief = '''
一行目は `n t` です。二行目は `n` 個の整数です。

ベクタから `t` 未満の値をすべて**その場で**取り除き、残ったものを一行に出力し
(何もなければ `-`)、次に `REMOVED <k>` を出力してください。

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

スターターは誰もが一度は書くバグです: インデックスで走査し、`i` で erase し、
それから `++i` をします — そして枠 `i` に滑り込んだ要素は一度も見られません。
小さな値が二つ隣り合うと、二つ目が生き残ります。そのバグは少なくとも定義された
動作です。そのイテレータ版の双子はそうではありません: `erase(it)` は `it` と
その後のすべてのイテレータを無効にするので、中に `erase` のある
`for (auto it = v.begin(); ...; ++it)` は**未定義動作**です — たいていは終わりを
越えて走り、ときには動くように見え、そのほうが悪いのです。

`erase` は取り除いたものの次の要素へのイテレータを返します。それを使ってください:
当たりなら `it = v.erase(it)`、外れなら `++it`、決して両方ではなく。C++20 には
`std::erase_if(v, predicate)` もあり、一回の呼び出しで仕事全体をします。それが
最初に出す答えで、ループは `erase_if` が何をするのかと聞かれたときに出す答えです。
'''
hints = [
  "for の見出しからインクリメントを外してください。++it で進むのは erase しなかった分岐だけです。もう一方の分岐では it = erase(it) がすでに進めています。",
  "インデックス版も直せます — erase の後に ++i しない — が、知っておくべきはイテレータの形です。std::list でも std::map でも同じだからです。",
  "std::erase_if(vector, pred) は取り除いた数を返し、それがまさに REMOVED の行です。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "cpp.advanced.15.undefined-behaviour"
title = "コンパイラは仮定した"
story = "ポンプ室のリットル計は int で、2147483647 リットルに達したとき、コンパイラはそこに決して届かないとすでに仮定していました。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数で、それぞれ `long long` に収まります。
その累計も `long long` に収まります。

二行を出力してください: 途中のすべての累計が 32 ビットの `int` に収まるなら
`INT32 OK`、そうでなければそれをはみ出させることになる最初の値の 0 始まりの
インデックスを付けて `INT32 OVERFLOW <i>`。次に `INT64 <total>` です。

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

スターターは合計を `int` に保ち、何が起きても `INT32 OK` を出力します。それは
分かりやすい確認 — `if (total + v < total)` — を足しても直せません。その確認は
探しているオーバーフローそのものを使って書かれていて、**符号付きの
オーバーフローは未定義動作**だからです。コンパイラは UB が起きないと仮定して
よいので、正の `v` での `total + v < total` はコンパイラから見れば*常に偽*で、
`-O2` では gcc も clang もその判定を削除します。間違った数はオプティマイザの
バグではありません。それが契約です。

このランドが従う規則: 未定義動作は「何かの値」ではありません。コンパイラが
あることを不可能と仮定し、そこから推論することです。だからオーバーフローを
起こしてそれを検出することは決してしません。足し算の*前に*、より広い型で、
あるいは限界 — `std::numeric_limits<int>` — と比べて検出します。そしてこの
プログラムの期待する出力は未定義のものに何も依存しません。
'''
hints = [
  "合計を long long に保ち、足すたびに std::numeric_limits<int>::min() と max() と比べてください。int の算術は一度も起きません。",
  "範囲を出た最初のインデックスだけを記録してください。後の値が合計を範囲内に戻すこともあり、問いは最初にどこで出たかです。",
  "どうしても二つの int を足し、それが安全か知りたいなら: 足した後の和の符号ではなく、足す前に v > INT_MAX - total を確認してください。前者は定義されていて、後者はコンパイラが削除するものです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "cpp.advanced.16.jthread"
title = "言われたら止まる"
story = "夜のポンプは誰かが止めろと言うまで動き、この勤務まで誰もそれを言えませんでした。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

`std::jthread` を二本起動してください。一本目は値を合計して結果を格納します。
二本目は `std::stop_token` を受け取り、フラグを設定する `std::stop_callback` を
それに登録し、それから `stop_requested()` になるまでループします。`main` から
二本目のスレッドに `request_stop()` を呼び、両方を join し、出力します:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std::jthread` は二つのものを足した `std::thread` で、その両方が RAII です。
デストラクタが **join する**ので、スターターの abort — joinable なまま破棄された
`std::thread` — は起こり得ません。そして `std::stop_source` を持っています:
スレッド関数が最初の引数として `std::stop_token` を取るなら `jthread` がそれを
渡し、`request_stop()` がそれを切り替え、デストラクタは join の前に
`request_stop()` を呼びます。自分のトークンを確認するスレッドはいつでも
止められるスレッドで、確認しないスレッドがスターターです。

`stop_callback` はブロックしたスレッドが知る方法です — 停止が要求された瞬間に、
要求したスレッドの上で走り、その普段の仕事はワーカーが眠っている条件変数を
起こすことです。
'''
hints = [
  "summer の std::thread を std::jthread に変えれば join を足す前から abort は消えます — それでも sum を読む前に join してください。",
  "最初の引数が std::stop_token のラムダは、それを走らせる jthread から自動的にそれを受け取ります。それが接続のすべてです。",
  "std::stop_callback on_stop(token, fn) はオブジェクトです: コンストラクタで登録し、デストラクタで登録を解除するので、ループの間だけ生き、それ以上は生きません。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.advanced.17.dangling"
title = "ダングリング"
story = "ビクトリア・パークのポンプ室、噴水の二階下。ポンプのスレッドが、勤務の終わりに部屋が解放したバッファをまだ読んでいます。"
brief = '''
一行目は `w n` です: `w` 台のポンプと `n` 個の読み値。二行目は読み値です。

`pump(w, buffer)` は `w` 本のスレッドを起動します。スレッド `i` は `i * n / w`
から `(i + 1) * n / w` までの読み値を合計して `partial[i]` に入れ、`pump` は
部分和を返します。`main` は各々について `PUMP <i> <sum>` を、`TOTAL <sum>` を、
そしてすべてが終わった時点でバッファが解放されていれば `FREED yes` を出力します
— `std::weak_ptr` を通して観察します。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

スターターは abort します。`pump` はスレッドをローカルのベクタに作り、それが
まだ joinable なうちに戻るので、ベクタのデストラクタが `std::terminate` を
呼びます。代わりに、それが何をしようとしていたかを読んでください: それらの
スレッドは `buffer` への**参照**を持ち、`pump` の呼び出し側は `buffer` を死なせ
ようとしています。デストラクタが走った後のベクタを読むスレッドは、解放済みの
メモリを読んでいます。古い数を得ることもあります。次の割り当てを得ることも
あります。アロケータがすでにページを返していて segfault することもあります。
それは未定義動作で、しかもいちばん高くつく種類です。間違いのある場所で失敗
しないからです。

症状ではなく所有を直してください。バッファは
`std::shared_ptr<const std::vector<long long>>` で、どのスレッドも**自分用の
ハンドルのコピー**をキャプチャし、バッファはそれを持つ最後のスレッドとちょうど
同じだけ生きます — `pump` がどう戻っても、スレッドがどんな順で終わっても。
戻る前に join してください。`main` は `weak_ptr` を持ち、`pump` が戻って自分の
ハンドルを手放した後、`expired()` が証拠です: 読み値は、最後に終わったポンプに
よって、一度だけ解放され、誰もまだ読んではいませんでした。

それがこのランドのすべてを一つのプログラムにしたものです。何もあなたを確認
しませんでした。あなたが寿命を使い方に合わせたのであり、それをする道具 —
数える賢いポインタ、待つ join — は基礎の道で出会ったのと同じ RAII です。
'''
hints = [
  "pump の変更は二つ: 読み値を参照でではなく buffer(shared_ptr)を値でキャプチャし、return の前にすべてのスレッドを join します — 専用のブロックの中の std::vector<std::jthread> が閉じ括弧で join してくれます。",
  "ベクタを生かしておくのはラムダの持つ shared_ptr のコピーです。それが解放されるのはスレッド関数が戻るときで、pump が戻るときではありません。それが参照と所有者の違いです。",
  "partial はまだ参照でキャプチャされていて、それで正しいのです: pump がそれを所有し、pump はそれを返す前に join し、各スレッドは自分の枠にだけ書きます。",
  "main は自分のハンドルをわざと pump にムーブしています。もし一つ持ち続けていたら FREED は no になります — main がまだ持っていたからバッファは生きていたわけで、それを説明できることもこのボスが受け入れるもう一つの答えです。",
]
