`Docket` は自分のコピーとムーブを数えます: コピーコンストラクタが一つのグローバル
を、ムーブコンストラクタがもう一つを増やします。両方のベクタは前もって `reserve`
されているので、再確保で何かがコピーやムーブされることはありません — 起きる
コピーとムーブは、あなたが書いたものだけです。

スターターは `COPIES 2` と報告します。左辺値での `sent.push_back(d)` は伝票を
文字列ごとコピーします。`sent.push_back(std::move(d))` は `d` を**右辺値**に
