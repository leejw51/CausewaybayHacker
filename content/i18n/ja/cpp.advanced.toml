hints = [
  "std::async(std::launch::async, lambda) はラムダが返すものの std::future を返します。それをベクタに積んでください。",
  "get() は future ごとにちょうど一回呼べ、値が来るまでブロックします。ベクタを順に走査すれば出力が順序どおりになります。",
  "promise はスレッドにムーブするか参照で渡し、そこで set_value(n) が呼ばれ、main の ready.get() がそれを待ちます。main が戻る前にスレッドを join してください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.advanced.10.unique-ptr"
title = "コンパイラが言える大きさ"
story = "避風塘の係留チェーン: どの環も次の環を保持し、錨までずっと続き、同じ環を二度保持する者はいません。"
brief = '''
標準入力は数 `n`、その後セント単位の `n` 個の金額です。

それを、届いた順に金額ごとに一つのノードでチェーンに保持してください:

```
struct Entry {
    long long cents;
    std::unique_ptr<Entry> next;
};
```

三行を出力してください:

1. 金額を順に、スペース区切りで、なければ `-`
2. チェーンに対する**再帰**関数による `SUM <total>`
3. `LAST <cents>` — 最後のノードの金額 — または `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

スターターはコンパイルできず、そのエラーこそがポインタの存在理由です。
`Entry next;` と書くと、コンパイラは `Entry` をメモリに配置しなければなりません:
`cents` の八バイトと `Entry` の大きさ分 — それはまさに求めようとしているもの
です。*Field has incomplete type.*

`std::unique_ptr<Entry>` はポインタで、ポインタはコンパイラがすでに知っている
大きさを持ちます。それは指す先を**所有します**: 所有者はちょうど一人、
デストラクタで `delete` され、コピーできず、ムーブできます。生の `Entry*` は
もう一種類のポインタです — 見るだけで何も所有しません — そしてチェーンを
たどって出力することこそ生のポインタの用途です。`nullptr` はチェーンの終わりで
あり空のチェーンでもあるので、どこにも別の空の場合はありません。
'''
hints = [
  "一行でコンパイルエラーが直ります: std::unique_ptr<Entry> next; — これで構造体は、何を指していても十六バイトです。",
  "後ろから前へ作ってください: head = std::make_unique<Entry>(Entry{value, std::move(head)})。std::move は必須です。unique_ptr はコピーできず、手渡すことしかできません。",
  "head.get() からの const Entry* でたどり、walk->next.get() へ進みます。生のポインタは借りるだけで、unique_ptr が所有したままなので、何も二度解放されません。",
  "再帰の合計は二行です: nullptr なら 0、そうでなければ cents と残りの合計の和。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.advanced.11.shared-ptr"
title = "他に誰がこれを持っているか"
story = "二つの計器が一本のパイプで同じタンクを読み、パイプは最後の計器がなくなるまで残り、それより一秒も長く残ってはなりません。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値を `std::shared_ptr` が所有する `std::vector<long long>` に入れ、同じベクタへの
**二つ目**の `shared_ptr` と、それを見張る `std::weak_ptr` を取ってください。
四行を出力します:

1. `REF <sum>` — 二つ目のハンドルを通して読んだ合計
2. `SHARED <k>` — 両方のハンドルが生きている間の `use_count()`
3. `ALIVE yes` — その間の `!watch.expired()`
4. `ALIVE no` — 両方のハンドルが `reset()` された後

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

`unique_ptr` は所有者一人でした。`shared_ptr` はオブジェクトの隣に保たれる所有者の
数で、数がゼロになるとオブジェクトは解放されます — たまたま最後になった
ハンドルによって。ハンドルをコピーすると数が増え、reset したり破棄したりすると
数が減ります。数は atomic なので二本のスレッドがそれぞれ安全にハンドルを持て
ますが、それで*オブジェクト*がスレッド安全になるわけではなく、それに触れるには
これまでのマップのミューテックスがやはり要ります。

`weak_ptr` は数に**入らない**ハンドルです。オブジェクトがまだあるかを確かめられ、
あれば `lock()` で `shared_ptr` に昇格できますが、オブジェクトを生かしておくことは
できません。それが循環を断ち切るものです — 互いに `shared_ptr` を持つ二つの
オブジェクトは決してゼロにならない — そしてそれがこの道の最後のマップの主題です。
'''
hints = [
  "std::shared_ptr<...> mirror = ledger; はハンドルをコピーし、数を 2 に増やします。mirror->begin() は同じベクタに届きます。",
  "weak_ptr は shared_ptr から直接構築され、決して数を変えません。expired() がそれに尋ねる問いのすべてです。",
  "両方のハンドルに reset() すると数はゼロになります。最初の reset だけでは何も解放されず、部屋のヒントの一つはその理由を言うことです。",
]

