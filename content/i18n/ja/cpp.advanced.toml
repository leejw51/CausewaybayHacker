# C++ LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/cpp/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "cpp.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.advanced.01.getline"
title = "サンパンの記録"
story = "避風塘の港長はサンパンを一隻一行で記録します: 名前、それから揚げたもの、それがいくつの数になろうとも。"
brief = '''
一行目は数 `n` です。続く `n` 行はそれぞれ船名と、その後にスペース区切りの
ゼロ個以上の整数です。

船ごとに一行 `<NAME> <how many numbers> <their sum>` を出力し、最後に
`BOATS <n>` を出力してください。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

ここでの単位はトークンではなく行です。`std::cin >> x` は空白で止まり、改行を
気にしないので、ある船がどこで終わり次の船がどこで始まるかを教えられません。
`std::getline` は行全体をくれます。その行の上の `std::istringstream` がまた `>>`
をくれますが、その行の中だけです。

誰もが一度は噛まれることがあります: `std::cin >> n` の後、その一行目の終わりの
改行はまだストリームで待っていて、最初の `getline` はそれを空行として読みます。
'''
hints = [
  "n を読んだ後に std::getline(std::cin, junk) を一回呼べば、>> が残した改行を捨てられます。",
  "std::istringstream fields(line); fields >> name; そして while (fields >> value) が残りを走査します — 解析するものがなくなるとループは終わります。",
  "名前は行の最初のトークンで、名前だけの行は 0 0 になります。特別扱いは要りません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.advanced.02.references"
title = "コピーは本物ではない"
story = "ヨットクラブの船台のウインチ係は荷を一つずつ用紙のコピーに書き込み、壁の用紙は決して変わりません。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

関数 `load` を通してすべての値を一つの `std::vector<long long>` に積み、三行を
出力してください: `LOADED <how many>`、読むだけの関数 `total` による
`TOTAL <sum>`、そして `FIRST <value>` — 何もなければ `FIRST NONE` です。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

スターターはコンパイルでき、`LOADED 0` を出力します。`load` はベクタを**値で**
受け取るので、呼び出しのたびに自分のコピーを得て、それに積み、戻るときに
捨てます。C++ は、そうしないと言わない限りコピーします。

そうしないと言うのが `&` です: `std::vector<long long>&` 型の引数は呼び出し側の
ベクタへの参照で、そのコピーではありません。`total` は
`const std::vector<long long>&` を受け取るべきです — 見る必要はあっても触る
必要はなく、`const` はシグネチャでそれを言う方法で、コンパイラがそれを守らせます。

`FIRST` はポインタです: `long long* first` は最初の要素のアドレスか `nullptr` の
どちらかで、`nullptr` はたどる前に必ず確認しなければならない唯一の値です。
これがこのランドのすべてを一行にしたものです。
'''
hints = [
  "load は一文字で直ります: std::vector<long long>& sheet。呼び出し側は変わりません。参照は書かれたとおりの引数に束縛されます。",
  "total は const std::vector<long long>& を受け取るべきです — const は約束で、コンパイラがそれを確かめます。",
  "&sheet.front() は最初の要素のアドレスで、要素があるときにしか意味がありません。*first と書く前に nullptr を確認してください。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.advanced.03.vector"
title = "船団の真ん中"
story = "避風塘に横付けで連なった四十隻のサンパン。港長には一番外側と一番内側が見え、その間は何も見えません。"
brief = '''
標準入力は一行目に数 `n`、二行目にスペース区切りの `n` 個の整数です。`n` は
`1` 以上です。

三行を出力してください: 最初の値、最後の値、そしてその二つの厳密に間にある
すべての値の合計です。値が三つ未満ならその合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector` がシーケンスです。`front()` と `back()` が両端で、`begin() + 1` から
`end() - 1` までが真ん中、その範囲に対する `std::accumulate` が合計です — 渡す
初期値が `long long` である限りは。`std::accumulate(first, last, 0)` は `int` で
合計します。`0` が `int` だからで、隠しケースの一つには収まらない真ん中があります。
'''
hints = [
  "nums.begin() + 1 と nums.end() - 1 はイテレータで、イテレータの組は <numeric> と <algorithm> が範囲を名指しする方法です。",
  "値が一つか二つだとその範囲は空か逆向きです — 作る前に nums.size() の if で守ってください。",
  "0LL が大事です: accumulate は結果の型を初期値から推論し、ただの 0 は int です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.advanced.04.strings"
title = "バイトは文字ではない"
story = "避風塘の掲示板は 銅鑼灣 を三バイトで切り詰め、一文字になります。"
brief = '''
一行を読みます。三行を出力してください:

1. その長さを**バイト**で
2. その長さを**文字**で — UTF-8 のコードポイント
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII 以外の文字が含まれることがあり、そのとき最初の二つの数は同じに
なりません。`std::string::size()` はバイトです。ずっとそうでした。`std::string`
はエンコーディングについて何も知りません。`char` のシーケンスで、`char` は
バイトです。

UTF-8 はデコードせずに数えるのが簡単です: どのコードポイントも `10xxxxxx` の形
**ではない**バイトで始まり、継続バイトはどれもその形です。だからバイト `c` が
文字の始まりなのは、ちょうど `(c & 0xC0) != 0x80` のときです。バイトではなく
文字を逆順にしてください — 文字列そのものへの `std::reverse` は `銅` を三つに
切り、それを逆向きに出力してしまいます。
'''
hints = [
  "バイトを unsigned char としてループしてください。ただの char は符号付きかもしれず、そうだと 0x7F より上のもののビット判定が狂います。",
  "各文字をそれぞれ小さな std::string として集め、そのベクタを逆順にして、つなげます。",
  "(c & 0xC0) != 0x80 となるバイトを数えれば、何もデコードせずに文字数になります。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.advanced.05.classes"
title = "船台の台帳"
story = "ヨットクラブの船台は陸揚げのたびに料金を取り、明細を一か所にまとめています — あるいは、提案がクラスをコメントに置き換えるまではそうでした。"
brief = '''
一行目は `<BOAT> <n>` です。続く `n` 行は `<ITEM> <CENTS>` です。

その船のために項目を集める `Ledger` を作り、各項目を届いた順に
`<ITEM> <CENTS>` として出力し、次に `TOTAL <sum>`、次に
`BOAT <name> <count>` を出力してください。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` は `0` のこともあり、そのとき出力は最後の二行だけです。

`class` は、`public:` と言わない限りメンバが private になる `struct` です。
コンストラクタは本体より先に動くので、メンバは**初期化子リスト**で設定します
— `Ledger(std::string boat) : boat_(std::move(boat)) {}` — 波括弧の中の代入では
ありません。`total()` は何も変えないので `const` と宣言します。それが
`const Ledger&` に対して呼べる唯一の理由です。
'''
hints = [
  "std::vector<std::pair<std::string, long long>> で十分です。クラスがあるのは台帳が自分の明細を所有するためです。",
  "初期化子リスト — : boat_(std::move(boat)) — は構築と同時にメンバを設定します。波括弧の中で代入すると、まず空の文字列を作ってから上書きします。",
  "main がベクタをコピーせずに走査できるよう項目を const 参照で返し、台帳を変更しないメソッドはすべて const にしてください。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.advanced.06.enum-class"
title = "舵を取るのは誰か"
story = "ヨットクラブのゲートはどのカードにも会員料金を課します。会員でないカードにも、カードでないものにも。"
brief = '''
標準入力は数 `n`、その後 `<TYPE> <HOURS>` の `n` 行です。

基本料金は `500 + 100 * HOURS` セントです。各行について次のいずれかを出力して
ください:

* `MEMBER` — 基本料金
* `CREW` — 基本料金の半分、整数除算
* `JUNIOR` — 常に `200`
* それ以外 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

カードを四つの値を持つ `enum class Card` としてモデル化し、その一つを `Other`
にします。`enum class` の値は陰で `int` に変換されず、名前を外側のスコープに
漏らしません — ただの `enum` はその両方をし、その両方がこちらを書くべき理由です。

C++ の enum はペイロードを持てないので、認識できなかったタグはその横を運ばれます:
小さな `struct Tag { Card card; std::string raw; }` です。料金は `switch` 一つで
決めてください。すべての列挙子を網羅すればコンパイラには警告することがなく、
一つ抜かせば `-Wall` がどれかを教えます。
'''
hints = [
  "Card::Other が四つ目の列挙子です。それが認識しなかった文字列は隣の Tag::raw にあります。",
  "switch (tag.card) で列挙子ごとに case を書き、各 case の中から return します — どの分岐も return するなら break は要りません。",
  "std::to_string は数を std::string にします。UNKNOWN の行は + による文字列の連結です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.advanced.07.maps"
title = "避風塘の呼び声"
story = "正午の避風塘: どのサンパンも何かを呼ばわり、港長はその順位を欲しがっています。"
brief = '''
標準入力全体を読み、空白で分割します。

相異なる各単語を一回ずつ `<word> <count>` として、回数の降順、同数なら単語の
昇順で出力してください。

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std::map<std::string, long long>` はキー順、`std::unordered_map` は何の順でも
なく、どちらも回数順ではありません — だから順位付けは別の手順です: 項目を
ペアの `std::vector` に写し、比較子付きで `std::sort` します。ないキーへの
`counts[word]++` はまず値 `0` でそれを挿入し、それはまさに数えるループが
望むことです。
'''
hints = [
  "while (std::cin >> word) は入力が終わるまで空白区切りのトークンをすべて読みます。counts[word]++ が数えるループのすべてです。",
  "ベクタはマップの begin() と end() から直接作れます。各要素は std::pair<const std::string, long long> です。",
  "比較子は a が b より前に来るべきときに true を返すラムダです: まず回数の降順、同数なら単語の昇順。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.advanced.08.hashtable"
title = "順序などまったくない"
story = "避風塘の点呼はアルファベット順で返ってきて、港長は船が実際に応答した順で欲しがっています。"
brief = '''
標準入力は数 `n`、その後一行に一つの船名で `n` 行です。`n` は `1` 以上で、
名前は空白を含まない文字の一続きです。同じ名前が複数回現れることがあります。

相異なる各名前を一回ずつ `<name> <count>` として、**その名前が最初に現れた順に**
出力してください。次に `DISTINCT <k>` を出力します。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

どちらのコンテナも単独ではこれをくれません。それがこのクエストのすべてです。

`std::map` は木です: 走査すると名前は**ソートされて**返ってきて、それは応答した
順ではありません。`std::unordered_map` はハッシュテーブルです: 検索は O(log n)
ではなく平均 O(1) ですが、走査すると**まったく規定されていない順**で返って
きます — ソート順でも挿入順でもなく、二回同じ順だとも限りません。標準は何も
約束しないので、`unordered_map` を走査して出力するプログラムは、出力が
ビルドに使ったライブラリ次第のプログラムです。スターターはまさにそれをしていて、
相異なる名前が一つだけのケースは通りさえします — それこそが兆候です: 順序の
違いを見分けられないテストは、順序が正しい証拠ではありません。

二つの仕事は二つのコンテナに分けてください: `std::vector<std::string>` が名前を
最初に見た順を覚え、`std::unordered_map<std::string, long
long>` が数えます。出力はベクタを走査して行います。
'''
hints = [
  "ハッシュテーブルは速く引くためのもの。ベクタは順序を覚えるためのもの。両方が要ります。",
  "`count[name]++ == 0` は名前ごとにちょうど一回 — 挿入のとき — true になります。operator[] が値を 0 にデフォルト構築するからです。",
  "出力はベクタを走査し、各回数をマップに尋ねて行います。マップを走査して出力しては決していけません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.advanced.09.set-and-pair"
title = "どこに誰が舫っているか"
story = "係留ボードは同じサンパンを同じ停泊所に二回載せていて、どの行が重複なのか誰にも言えません。"
brief = '''
標準入力は数 `n`、その後 `<BERTH> <NAME>` の `n` 行です。

相異なる `<BERTH> <NAME>` の組をそれぞれ一回ずつ、停泊所順、次に名前順で出力し、
次に `DISTINCT <k>` と `DUPES <n - k>` を出力してください。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

`std::set<std::pair<int, std::string>>` は三つの仕事を一度にします: すでに
入っているものの二つ目を拒み、自分をソートされた状態に保ち、そして `std::pair` は
すでに出力が望むとおりに比較します — 一つ目の要素、次に二つ目。範囲 `for` で
走査し、各ペアは `.first` と `.second` ではなく**構造化束縛**
`const auto& [berth, name]` で分解してください。
'''
hints = [
  "コンテナを変えてください: std::set<std::pair<int, std::string>>。重複の挿入はエラーではなく、何もしない操作です。",
  "セットは要素型の operator< でソートされ、std::pair は一つ目、次に二つ目を比較します — それが出力の望む停泊所、次に名前の順です。",
  "for (const auto& [berth, name] : moorings) は各ペアを二つの名前に分解します。n からセットの大きさを引いたものが重複の数です。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.advanced.10.algorithms"
title = "船台を一回で下る"
story = "ウインチの記録は荷の列です。アレックスは for ループ三つだと言います。メイは標準ライブラリがもう書いてあると言います。"
brief = '''
標準入力はスペース区切りの整数の一行です。

四行を出力してください:

1. 偶数の値の合計(なければ `0`)
2. `10` より大きいすべての値を二倍にして、順に、スペース一つで区切ったもの —
   なければ `-`
3. 相異なる値がいくつあるか
4. `FIRST_BIG <i>` — `10` より大きい最初の値の 0 始まりのインデックス、
   または `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

インデックスのループではなく `<algorithm>` と `<numeric>` を使ってください:
一行目はラムダ付きの `std::accumulate`、二行目は `std::copy_if` と `std::transform`、
三行目は `std::sort` の後に `std::unique`、四行目は `std::find_if` です。どれも
イテレータの組を取り、判断が要るところではラムダを取ります。要点はループが
書きにくいことではなく、名前がそのループの目的を言うことです。
'''
hints = [
  "accumulate の四つ目の引数は二項関数 (acc, x) -> acc です。x が偶数のときだけ x を足すようにしてください。",
  "copy_if には書き込む先が要ります — std::back_inserter(big) が進みながらベクタを伸ばします。transform は同じ範囲に書き戻せます。",
  "std::unique は重複を後ろへ移し、それが始まる場所へのイテレータを返します。begin() からの距離が相異なる数です。隣り合った重複しか見ないので、先にコピーをソートしてください。",
  "find_if は見つからないと end() を返し、見つかればイテレータから begin() を引いたものがインデックスです。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.advanced.11.templates"
title = "一度だけ書く"
story = "ポンプ室の計器盤には largest が四回書かれています — リットル用、分用、ポンプ用、ポンプ名用 — そして五つ目が潮の変わる前に要ります。"
brief = '''
標準入力は二行です: 一行目に整数、二行目に単語。

両方で動く `largest` を**一つ**書き、`larger()` と `smaller()` を持つクラス
テンプレート `Pair<T>` を書いてください。

最大の整数、最大の単語を出力し、次に最初の二つの整数の `Pair` について
`PAIR <larger> <smaller>` を出力します。同じなら `a` を大きいほうとします。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

スターターはコンパイルできません: `largest` は `long long` に釘付けなので、単語を
渡すと *no matching function* です。**関数テンプレート**
`template <typename T> T largest(const std::vector<T>& xs)` は呼ばれた型ごとに
一回ずつ打ち出されます — `T` は引数から推論され、本体が `T` に求めるのは
`>` が使えることだけです。

`Pair<T>` はクラスについての同じ考えです。そのメソッドは読むだけで書かないので
`const` で、呼び出し側は見たいだけなのでコピーではなく `const T&` を返します。
どちらのシグネチャも約束することを言い、コンパイラがそれを守らせます。
'''
hints = [
  "largest の前に template <typename T>、中の long long をすべて T に。呼び出しは変わりません。T は推論されます。",
  "std::string にはもう operator> があるので、同じテンプレート本体が何も足さずに単語でもコンパイルできます。",
  "Pair<T> はクラステンプレートです。使う場所で型を名指しし — Pair<long long> — メソッドは比較するだけなので const です。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.advanced.12.lambdas"
title = "扉の人数"
story = "ヨットクラブの回転ゲートは入る人と出る人を数え、支配人は途中で何があっても閉店時の人数を欲しがっています。"
brief = '''
標準入力は数 `n`、その後それぞれ `IN` か `OUT` の `n` 行です。

決してゼロを下回らない累計を保ち、各コマンドの後にそれを出力してください。
次に `INS <k>` — `IN` だったコマンドの数を `std::count_if` とラムダで数えたもの —
と `CLOSED <final>` を出力します。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

カウンタはクロージャです: `make_counter` は自分の合計を所有するラムダを返します。
ラムダは既定でコピーでキャプチャし、コピーは本体の中では `const` です —
引数リストの後の `mutable` が、キャプチャした合計を呼び出しの間で変えられるように
します。**初期化キャプチャ** `[total = 0LL]` は、キャプチャする変数を外側の
スコープではなくその場の角括弧の中で宣言するので、ラムダの外には誰かが触れる
ものが何もありません。

もう一つのキャプチャ `[&]` はすべてを参照で取ります。このクエストでは両方を
書きます。どちらのつもりだったかを分かっていることこそ、面接官が耳を傾けている
点です。
'''
hints = [
  "[total = 0LL](long long delta) mutable { ... } — 初期化キャプチャが total を宣言し、mutable が本体からそれに代入できるようにします。",
  "mutable がないと本体はクロージャ型の const メンバ関数で、total += delta は黙って何もしないのではなくコンパイルエラーです。",
  "std::count_if(begin, end, predicate) は述語が受け入れた要素の数を返します。述語はコマンドを一つ受け取るラムダです。",
]

