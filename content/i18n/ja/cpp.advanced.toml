  "ムーブコンストラクタはわざと noexcept になっています: std::vector は再確保の間、ムーブが例外を投げ得ないときだけ要素をムーブし、そうでなければ例外安全のためにコピーします。",
  "両方のベクタへの reserve(n) が数を正確にします。それがないと再確保がすでに入っているすべての要素をムーブ(あるいはコピー)し、数は伸長の方針次第になります。",
