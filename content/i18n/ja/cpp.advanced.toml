[[quest]]
id    = "cpp.advanced.09.async"
title = "数を約束して"
story = "ウインチ係は少年を送って数字を一つずつ取ってこさせ、そこに立って待ったりはしません。数字は戻ってくるときに戻ってきます。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値ごとに `std::launch::async` 付きの `std::async` タスクを一つ起動し、値の二乗を
返させてください。`std::future` をベクタに集め、それを**順に** `get()` して
それぞれ出力します。次に `std::promise<int>` をもう一本のスレッドに渡してそれを
`n` に設定させ、対応する future から `READY <n>` を出力します。

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

future はまだここにない値です。`std::async` は関数の戻り値のためにそれを一つ
くれます。`get()` はそれができるまでブロックし、それから一回だけ渡します。
future を順に呼ぶことが出力を順序どおりにします — タスク自体はいつ終わっても
構いません。

`std::promise` は同じパイプのもう一方の端で、包む戻り値がないときのためのものです:
一方が `set_value` を呼び、もう一方がそれを `get` します。スレッドがミューテックスも
キューもフラグもなしに一つの結果を報告する方法です。

`std::launch::async` ははっきり言ってください。それがないと実装は `deferred` を
選ぶことがあり、それはタスクを呼び出し側のスレッドで `get()` の中で遅延実行
します — ここではそれでも正しいですが、`async` を読む人が期待するものでは
ありません。
