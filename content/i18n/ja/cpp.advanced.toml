  "スレッドの中のローカルな合計と、最後の partial[i] への一回の書き込みで、共有ベクタへの接触はスレッドごとにちょうど一回になります。",
  "k > n だと塊の一部は空になり — begin == end — ループは単に回りません。特別扱いは要りません。",
]

