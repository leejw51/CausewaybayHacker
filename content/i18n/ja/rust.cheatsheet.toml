# RUST LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the prose of
# `content/rust/cheatsheet.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "rust.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet.01.read-all"
title = "テープまるごと"
story = "06:30、ジャーディンズ・バザール。キオスクの入力は一度にまとめて届き、キオスクはその全部を欲しがる。"
brief = '''
stdin の中身を **すべて** 、一回の呼び出しで `s` に読み込んでください。

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

どの行でしょう?
'''
hints = [
  "`read_to_string` は `&mut String` を受け取って埋めます。Result を返すので unwrap しましょう。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.cheatsheet.02.read-line"
title = "改行は残る"
story = "注文票には 42 と書いてある。レジは改行がついたままそれを読む。"
brief = '''
`read_line` が `line` に `"42\n"` を残しました。パニックせずにこれを `usize` にする行はどれでしょう?
'''
hints = [
  "`read_line` は `\\n` を残します。parse はそれで失敗するので、先に trim しましょう。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet.03.width"
title = "右揃え"
story = "市場の値札板は、数字をすべて右端に揃えて並べる。"
brief = '''
`x` を、幅 5 文字の欄の中で右揃えにして出力してください。
'''
hints = [
  "波括弧の中では、揃えが幅より先に来ます。`<` は左、`^` は中央、`>` は右です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.cheatsheet.04.usize"
title = "添字は usize"
story = "銅鑼湾駅の 7 番ロッカー。番号は i32 で届いた。"
brief = '''
`i` は `i32`、`v` は `Vec<u8>` です。`i` 番目の要素を読む行はどれでしょう?
'''
hints = [
  "Vec は `usize` でしか添字を取れません。`as` がキャストです。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet.05.inclusive"
title = "1 から 10 まで"
story = "トラムの停留所は 1 番から 10 番まで。みんな最後の一つを忘れがちだ。"
brief = '''
1, 2, … 10 を順に回してください。10 も含みます。
'''
hints = [
  "`a..b` は `b` の手前で止まります。`a..=b` は `b` を含みます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet.06.guard"
title = "ガード"
story = "ロックハート・ロードの用心棒は、名簿の名前のほかにもう一つだけ確かめる。"
brief = '''
`match x { … }` の中で、負の数すべてを受けるアーム:

```
match x {
    0 => "zero",
    // ____
    _ => "pos",
}
```
'''
hints = [
  "ガードは `pattern if condition =>` の形です。まず値に名前を束縛しましょう。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.cheatsheet.07.fnmut"
title = "カチカチ"
story = "ドアマンの手持ちカウンター。押すたびに、持っている数が変わる。"
brief = '''
`let mut cnt = 0;` — 呼ぶたびに `cnt` に 1 を足すクロージャ `inc` を作り、`inc(); inc();` がコンパイルできるようにしてください。
'''
hints = [
  "キャプチャした値を変えるクロージャは `FnMut` で、呼ぶには `mut` の束縛が要ります。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.cheatsheet.08.desc"
title = "大きい順"
story = "SOGO 地下のゲームセンターのランキング。ハイスコアが一番上。"
brief = '''
`v: Vec<i32>` を **降順** に、その場で並べ替えてください。
'''
hints = [
  "`sort_by` は比較関数を取ります。オペランドを入れ替えると順序が逆になります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.cheatsheet.09.count"
title = "集計"
story = "大排檔は料理ごとに注文を数え、新しい料理はゼロから始まる。"
brief = '''
`m: HashMap<String, i32>`。キー `k` のカウントに 1 を足してください。まだなければ 0 から始めます。
'''
hints = [
  "`entry(k).or_insert(0)` は `&mut i32` を返します。参照を外して足しましょう。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.cheatsheet.10.min-heap"
title = "小さいものが上"
story = "ミニバスの待ち行列は、いちばん短い行程から乗せる。BinaryHeap は大きいものを上に置くことしか知らない。"
brief = '''
`h` は `BinaryHeap<i32>` です。`h.pop()` が **最小** のものから返すように `x` を push してください。
'''
hints = [
  "BinaryHeap は最大ヒープです。値を包んで順序を反転させましょう。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.cheatsheet.11.clone"
title = "コピー二枚"
story = "タイムズスクエアのオフィスのコピー機。原本はガラスの上に残る。"
brief = '''
`let a = String::from("x");` — `b` を独立した `String` にして、あとでも `a` を使えるようにしてください。
'''
hints = [
  "`let b = a;` は String をムーブします。ディープコピーは明示的に書きます。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.cheatsheet.12.ok-or"
title = "消えた行"
story = "7-32 号室の台帳には抜けがある。Result を返す関数は、理由を言わなければならない。"
brief = '''
`fn … -> Result<i32, &'static str>` の中で、`o` は `Option<i32>` です。値を取り出すか、さもなければエラー `"missing"` を返してください。
'''
hints = [
  "Result を返す関数の中で Option に `?` は使えません。まず Option を Result に変えましょう。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.cheatsheet.13.filter-map-sum"
title = "選んでから二乗"
story = "ビクトリア・パークのトラックの歩数計は、電池が弱るとマイナスを記録する。メイが欲しいのは本物の周回の二乗を足し合わせたものだ。"
brief = '''
`v: Vec<i64>` には正の数 **と負の数** が入っています。`s` は正の数だけの二乗の合計です。

```
let s: i64 = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "二乗する前に負の数を落としましょう — 二乗には符号がありません。`.iter()` の上では filter のクロージャに `&&i64` が渡ります。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.cheatsheet.14.iter-mut"
title = "その場で"
story = "怡和街のセブンイレブンは棚のすべての値札に 1 ドル上乗せする。そのあとも棚はそこになければならない。"
brief = '''
`let mut v: Vec<i32> = …;` — **`v` 自身のすべての要素** に 1 を足してください。`v` は次の行でもまだ使われます。
'''
hints = [
  "Vec を回る方法は三つ: 借りる、排他的に借りる、持っていく。`x` を通して書き込めて、しかも `v` を手放さないのは一つだけです。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.cheatsheet.15.windows"
title = "隣どうし"
story = "ヘネシー・ロードを下るトラムの時刻表。メイは各停留所とその次との間隔を知りたい。"
brief = '''
`v: Vec<i64>` は要素が三つ以上あります。`d` はすべての `i` について `v[i+1] - v[i]` を持つので、`v` よりちょうど一つ短くなります。

```
let d: Vec<i64> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "重なり合うペアであって、互いに素なペアではありません — そして各ペアはタプルではなくスライスとして届きます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.cheatsheet.16.reverse-string"
title = "後ろから前へ"
story = "窓拭きはパーシバル・ストリートのネオンを向こう端から読む。メイは彼の順番で文字を並べたい。"
brief = '''
`s: &str` には非 ASCII 文字が含まれるかもしれません。`r` は `s` の文字を逆順に並べた新しい `String` です。
'''
hints = [
  "文字を順にたどり(バイトではなく — マルチバイト文字が壊れて出てきます)、その歩みを逆向きにして、String に集めましょう。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.cheatsheet.17.concat"
title = "つないで、ムーブせず"
story = "タイムズスクエアのエスカレーターの足元で二つの列が合流する。それぞれの名簿はメイに貸されたのであって、渡されたのではない。"
brief = '''
`a: Vec<i32>` と `b: Vec<i32>`。`c` は `a` の要素のあとに `b` の要素が続く **新しい** `Vec<i32>` です — そして `a` も `b` もそのあとでまだ使われます。
'''
hints = [
  "二つの Vec を値でつなぐとムーブされます。代わりに借りた二つのスライスをつなぎましょう。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.cheatsheet.18.derive-hash"
title = "セットに入れる資格"
story = "Ferris は銅鑼湾の碁盤の目で訪れた角をすべてセットにピン留めする。コンパイラは二つのピンをどう比べるのかを知りたがる。"
brief = '''
`struct P { x: i32, y: i32 }` を `HashSet<P>` に入れなければなりません。struct の上に置く derive 行のうち、`set.insert(p)` がコンパイルできるのに **十分な** ものはどれでしょう?
'''
hints = [
  "ハッシュセットは値をハッシュし、二つの値を完全な等価性で比べる必要があります — そして完全な等価性は部分的な等価性の上に築かれます。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "最後に出る者"
story = "ロックハート・ロードの配達員四人が一つの無線に報告を入れる。配送係は最後の一人がいつ通信を終えたかを知らなければならない。"
brief = '''
生産者が四つ、消費者が一つ。`for` ループは四つのメッセージが届いたら終わらなければなりません。

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

空欄に入る行はどれでしょう?
'''
hints = [
  "ループはすべての送信者がいなくなって初めて終わります。四つのクローンはスレッドと一緒に消えますが — 送信者が一つ、まだ `main` に居座っています。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "レール一本、料理人四人"
story = "Lucky Mac の夜の厨房: 注文票のレールは一本、料理人は四人、そして一度に読めるのは一人だけ。"
brief = '''
`rx: Receiver<u64>` がジョブキューです。`move` で生成した四つのワーカースレッドすべてが、この **一つの** 受信側からジョブを取らなければなりません。すべてのワーカーにハンドルをクローンして渡せるように `rx` を包む行はどれでしょう?
'''
hints = [
  "Receiver は Sync ではないので、スレッド間で共有するにはロックが要ります — そしてそのロックにはシングルスレッド用ではなく、スレッド安全な持ち主が必要です。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.cheatsheet.21.from-str"
title = "回線から"
story = "グロスター・ロードのフィンテックから顧客レコードが JSON で回線を流れてくる。メイはそれを struct として欲しい。"
brief = '''
`s: &str` は JSON オブジェクトを一つ持っています。`User` は `Deserialize` を derive し、`name: String` フィールドを持ちます。これがコンパイルできるように空欄を埋めてください:

```
fn name_of(s: &str) -> Result<String, serde_json::Error> {
    // ____
    Ok(u.name)
}
```
'''
hints = [
  "次の行の `u.name` は何も確定させません: serde は目的の型を推測できないので、束縛に型名を書きましょう。入力はテキストであって `Value` ではありません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.cheatsheet.22.lower-bound"
title = "下回らない最初の一つ"
story = "SOGO の価格板は並べ替え済み。メイは少なくとも `t` の値段がする最初の品がどこから始まるかを知りたい。"
brief = '''
`v: Vec<i64>` は昇順に並び、重複を含むかもしれません。`t: i64` はその中にあるかもしれないし、ないかもしれません。`i` は **`t` 以上の最初の要素** の添字です(なければ `v.len()`) — 古典的な lower bound を O(log n) で、パニックなしに。
'''
hints = [
  "スライスは述語が成り立つ部分と成り立たない部分に分かれ、返ってくる添字は成り立たなくなる最初の要素です。`t` *より下* のすべてで真になる述語を選びましょう。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.cheatsheet.23.pow"
title = "べき乗"
story = "銅鑼湾の階段ビルの複利家賃: 底のべき乗、そして指数は違う幅で届いた。"
brief = '''
`x: u64` と `e: u64` で、結果は収まります。`p` は `x` の `e` 乗です。
'''
hints = [
  "`^` は XOR であって、べき乗ではありません。整数のべき乗メソッドは指数を一つの決まった幅で取り、それは `u64` ではありません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "rust.cheatsheet.24.read-vec"
title = "一行まるごと"
story = "ジャーディンズ・バザールの最後のレジが、空白区切りの数の一行を改行ごと渡してくる。上流のすべてがこの一回のパースにかかっている。"
brief = '''
`line` は `read_line` から来たので、`\n` がまだ付いています。数と数の間は **空白が二つ以上** あるかもしれません。整った行ではパニックせずに、これを `Vec<i64>` にしてください。

```
let v: Vec<i64> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "空白の連なりで分割し(改行もそれで食われます)、各トークンをパースして unwrap し、集めましょう — Vec<i64> は Result からは集められません。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.cheatsheet.25.let-mut"
title = "カウンターは十から"
story = "ジャーディンズ・バザールのエッグワッフルの屋台は注文数の累計をつけていて、その数は変えられなければならない。"
brief = '''
`y` を 10 を持つ **符号なし 64 ビット** 整数として宣言し、次の行がコンパイル
できるようにしてください:

```
// ____
y += 1;
```

どの行でしょう?
'''
hints = [
  "正しくすべきことは二つ: 束縛は変更できなければならず、束縛は比較ではなく一つの `=` で設定します。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.cheatsheet.26.fn-add"
title = "最後の一文字"
story = "メイはジャーディンズ・バザールの上のレジで一番小さな関数を書き、コンパイラは最後の一文字について文句を言う。"
brief = '''
二つの `i32` 値を受け取ってその和を返す関数 `add` で、`println!("{}", add(2, 3));`
が `5` を印字するようにしてください。関数全体を一行で。
'''
hints = [
  "引数には型が付き、戻り値の型は矢印の後に書き、セミコロンで終わる本体は `()` を返します。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.cheatsheet.27.sub-slice"
title = "真ん中の二つ"
story = "パーシバル・ストリート脇の車庫にトラムが五台。メイが見たいのは二台目と三台目だけで、車庫は五台とも手放さない。"
brief = '''
`v: Vec<i32>` には少なくとも四つの要素があります。`w` は、インデックス 1 と 2 の
要素を **ちょうど** 借用する `&[i32]` です — 二要素、コピーなし。

```
let w: &[i32] = ____;
```

空欄に入る式はどれでしょう?
'''
hints = [
  "Vec を範囲でインデックスするとスライスになり、スライスは借用しなければ持てません。`a..b` の終端は含まれず、`a..=b` の終端は含まれます。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.cheatsheet.28.unwrap-or"
title = "さもなくばゼロ"
story = "銅鑼湾駅のロッカー板には、ある番号の項目がないかもしれない。それでも表示は何かを見せなければならない。"
brief = '''
`o: Option<i32>`。`n` は `i32` で、`o` の中の値、`o` が `None` なら 0 です — そして
この行は **決してパニックしてはいけません**。
'''
hints = [
  "代替値付きで unwrap するメソッドがあります。代替値は別の Option ではなく、中身の型の素の値です。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.cheatsheet.29.pop-front"
title = "次の人"
story = "銅鑼湾の碁盤の目を巡る BFS は、見つけた順に停留所を取る — 怡和街のミニバスの列であって、皿の山ではない。"
brief = '''
`q: VecDeque<usize>` がキューです。ループは毎回先頭の要素を **取り除き**、キューが
空になったら終わります:

```
while let Some(u) = ____ {
```

空欄に入る式はどれでしょう?
'''
hints = [
  "VecDeque には両端があり、メソッド名でその両方を名指しします。先頭を取らずに覗くだけだと永遠に回り続けます。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.cheatsheet.30.char-count"
title = "ネオンを数える"
story = "ロックハート・ロードの上の看板は 銅鑼灣 と三文字で読めるのに、メイの最初の数え上げははるかに大きすぎた。"
brief = '''
`s: &str` には漢字が含まれています。`n` は `s` の **文字** 数です — つまり
`"銅鑼灣"` なら 9 ではなく 3 です。

```
let n = ____;
```

空欄に入る式はどれでしょう?
'''
hints = [
  "`&str` は自分をバイトで測り、漢字は一文字三バイトです。バイトではなく文字を測ってください — そして文字のイテレータは長さを前もって報告できず、何歩進んだかしか言えません。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.cheatsheet.31.option-map"
title = "倍か、何もなしか"
story = "茶餐廳のハッピーアワーではポイントカードのスタンプが倍になる。カードがあれば、の話だ。カードがなければスタンプもなく、レジが落ちることもない。"
brief = '''
`o: Option<i32>`。`d` は `o` の中の値を 2 倍にしたもので、包まれたままです:
`Some(21)` は `Some(42)` になり、`None` はパニックせずに `None` のままです。

```
let d: Option<i32> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "Option の中身だけを変えて箱はそのままにするメソッドがひとつあります。クロージャは素の値を受け取り素の値を返し、`None` はクロージャに届きもしません。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.cheatsheet.32.and-then"
title = "箱はひとつ、ふたつではない"
story = "注文票は白紙かもしれないし、白紙でなくてもアレックスがテーブル番号の欄に \"tea\" と書いているかもしれない。"
brief = '''
`s: Option<&str>`。`n` は `s` に書かれた数です: `Some("42")` は `Some(42)` に、
`Some("tea")` と `None` はどちらも `None` になります。パース自体も失敗しうるので、
クロージャは自分自身の Option を作り出します。

```
let n: Option<i32> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "クロージャがすでに Option を返すとき、中身を変換するだけでは `Option<Option<i32>>` が残ります。クロージャ自身の Option をそのまま結果にするメソッドが必要です — そしてクロージャは Result ではなく Option を返さなければなりません。",
]

