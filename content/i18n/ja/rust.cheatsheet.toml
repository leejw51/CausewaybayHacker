title = "数えて、十人超え"
story = "タイムズ・スクエアのミニバスは、運転手が人数を数えていて、それが十人を超えたときだけ出発する。"
brief = '''
`seats` は `Option<u32>` です。`go` は `seats` が `Some(n)` で `n > 10` の
ときだけ `true`、`None` なら `false` でなければなりません。

```
let go: bool = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "`map` は答えを Option の中に残します。残る二つの検査のうち、一つは `None` に `true` を、もう一つは `false` を返します。クロージャが受け取るのは参照ではなく `u32` そのものです。",
]

# ---------------------------------------------------------------- 58
[[quest]]
id    = "rust.cheatsheet.58.transpose"
title = "包みを裏返す"
story = "湾仔の免許事務所の書類では、年齢欄は任意だ。空欄は構わないが、「十二歳くらい」と書かれた欄はだめだ。"
brief = '''
`fn … -> Result<Option<u32>, ParseIntError>` の中で、`age` は `Option<&str>` です。
欄が空なら `a` は `None`、パースできれば `Some(n)` で——不正な数は `?` で
関数を抜けなければなりません。

```
let a: Option<u32> = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "`map` は `Option<Result<u32, _>>` を返しますが、`?` は Result が外側にある必要があります。`transpose` が二層を入れ替えます：`Some(Err(e))` は `Err(e)` に、`None` は `Ok(None)` になります。`.ok()` でエラーを `None` にすると、不正な欄がそのまま通ってしまいます。",
]

# ---------------------------------------------------------------- 59
[[quest]]
id    = "rust.cheatsheet.59.map-collect"
title = "頼まれるまで何もしない"
story = "メイは祭りのために糖街のメニューボードの値段を全部二倍にする。ルールを書き留めるのと、ボードを塗り直すのは別のことだ。"
brief = '''
`v` は `vec![1, 2, 3]` です。`d` は `[2, 4, 6]` を持つ新しい `Vec` でなければなりません。

```
let d: Vec<i32> = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "イテレータアダプタはレシピです——`map` だけでは何も作られません。最後に何かが値を引っぱり出して `Vec` に集める必要があります。",
]

# ---------------------------------------------------------------- 60
[[quest]]
id    = "rust.cheatsheet.60.fold-sum"
title = "積み上げ合計"
story = "銅鑼湾の街市のレジ係は頭の中に数を一つだけ置き、カゴが来るたびにそれに足していく。"
brief = '''
`v` は `Vec<i32>` です。`fold` で合計してください：`0` から始め、各ステップは
新しい合計を返します。

```
let total: i32 = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "初期値が先、クロージャが二番目です。クロージャは合計をその場で書き換えるのではなく、次の合計を返します——その戻り値が次のステップの `acc` になります。",
]

# ---------------------------------------------------------------- 61
[[quest]]
id    = "rust.cheatsheet.61.fold-max"
title = "氷点下"
story = "寶靈頓道の市場の地下にある冷蔵庫は、一晩中マイナスの温度を記録する。アレックスが欲しいのは一番暖かい値だ。"
brief = '''
`t` は `vec![-8, -3, -12]` です。`hi` は最大値 `-3` でなければならず、
`fold` で求めます。

```
let hi: i32 = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "初期値も本物の候補です：`0` から始めると、氷点下の値は決して勝てません。`.iter()` では要素は `&i32` で、`max` は数そのものを欲しがります。",
]

# ---------------------------------------------------------------- 62
[[quest]]
id    = "rust.cheatsheet.62.fold-tuple"
title = "合計と個数"
story = "希慎廣場のエレベーターのカウンターは平均の乗車人数が欲しい。だから一回なめる間に二つの数を持ち歩く：ここまでの人数と、ここまでの運行回数。"
brief = '''
`v` は `vec![4, 6, 2]` です。**一回**の `fold` で合計と個数を一緒に
求めてください：`(12, 3)`。

```
let (s, c): (i32, i32) = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "`fold` が持ち運ぶアキュムレータはちょうど一つなので、タプルにします。クロージャの引数はやはり二つ——その場で分解したタプルと要素です。そして個数は要素の分ではなく、一つずつ増えます。",
]

# ---------------------------------------------------------------- 63
[[quest]]
id    = "rust.cheatsheet.63.parse-fold"
title = "ひとつに全部"
story = "軒尼詩道の最終トラム。車掌は数字として読める切符の半券ごとに運賃を足し、破れたものは数に入れない。"
brief = '''
`stubs` は `vec!["5", "torn", "7"]` です。`total` は `12` でなければなりません：
半券ごとにパースし、失敗したものは飛ばし、残りを fold してください。

```
let total: i32 = ____;
```

空欄に入る式はどれでしょう？
'''
hints = [
  "`filter_map` は Option を返してほしいのです——`Some` は残し、`None` は捨てます。だからパースの Result を先に Option にしなければなりません。最初の破れた半券で止まるのは、それを飛ばすのとは違います。",
]
