# C++ LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/cpp/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks, identifiers and printed
# strings are copied verbatim.

pack   = "cpp.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet.01.fast-io"
title = "水門を開けろ"
story = "06:00、避風塘。魚の相場が百万行まとめて届くが、標準のストリームは律儀すぎて追いつかない。"
brief = '''
`main` の最初、どの入出力よりも前に: `cin`/`cout` が C の stdio と同期しないようにし、`cin` を `cout` から切り離して、読むたびに出力が flush されないようにしてください。

どの行でしょう?
'''
hints = [
  "同期を切る値は `false`。`tie` は flush するストリームへのポインタを取り、`nullptr` は「なし」の意味です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.cheatsheet.02.getline"
title = "空白ごと"
story = "配達伝票の住所は 'Flat 7, 32 Percival Street' — その中の空白ひとつひとつに意味がある。"
brief = '''
`std::string line;` — 入力の**一行まるごと**を、空白も含めてここに読み込んでください。
'''
hints = [
  "`>>` は最初の空白で止まります。フリー関数はストリームが先、文字列が二番目です。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.cheatsheet.03.fixed"
title = "小数第二位"
story = "軒尼詩道の両替所は、どのレートもきっちり小数第二位まで表示する。"
brief = '''
`double x = 3.14159;` で、`<iomanip>` はインクルード済みです。`3.14` を出力してください — **小数点以下**ちょうど二桁。
'''
hints = [
  "`setprecision` 単独では有効数字を数えます。`std::fixed` を付けると小数の桁数を数えます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.cheatsheet.04.long-long"
title = "広い積"
story = "銅鑼湾のオークションハウスで、十億ドルの入札を二つ掛け合わせる。int には答えが入らない。"
brief = '''
`int a, b;` はそれぞれ最大 10^9。`a` かける `b` をオーバーフローさせずに `p` に格納してください。
'''
hints = [
  "掛け算はオペランドの型で行われます。`*` の後ではなく、前でどちらかを広げてください。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.cheatsheet.05.range-for"
title = "書き戻せ"
story = "そごうのゲームセンターのダブルポイントナイト。変えるべきはスコアボードの点数そのもので、コピーではない。"
brief = '''
`std::vector<int> v` のすべての要素を**その場で** 2 倍にしてください。
'''
hints = [
  "`auto x` は各要素のコピーです。ベクタ自体を変えるには参照で受けてください。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.cheatsheet.06.grid"
title = "フロアマップ"
story = "ウィンザーハウス、階ごと店ごと: すべての区画が空いている n×m の図面。"
brief = '''
`n` と `m` は実行時に読み込みます。`int` の `n`×`m` グリッド `g` を作り、すべてのマスを `0` にし、`g[i][j]` でアクセスできるようにしてください。
'''
hints = [
  "コンストラクタの二番目の引数は `n` 個の各行の初期値です — だから行をまるごと渡してください。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.cheatsheet.07.desc"
title = "大きい順"
story = "百德新街の賃料ボードは、いちばん高い店舗をいちばん上に載せる。"
brief = '''
`std::vector<int> v` には順不同の数が入っています。これを**降順**にソートしてください。
'''
hints = [
  "既定は昇順です。`sort` の第3引数で順序をひっくり返します — 後から反転するのは余計なもう一巡です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.cheatsheet.08.count"
title = "集計"
story = "茶餐廳はテーブルごとにミルクティーを数え、新しいテーブルはゼロから始まる。"
brief = '''
`std::unordered_map<std::string, int> cnt;` — 単語 `w` のカウントに 1 を足してください。まだ見ていない単語は 0 から始まります。
'''
hints = [
  "`operator[]` は存在しないキーを値初期化された `int`、つまり 0 で挿入します。`at` は代わりに例外を投げます。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.cheatsheet.09.find"
title = "見るだけ"
story = "利園のロビーの警備員は来客リストを確認する。そこに書き込むことは許されていない。"
brief = '''
`m` は `std::map<std::string, int>` です。キー `k` があるかどうかを調べてください — マップに**追加せずに**。
'''
hints = [
  "`m[k]` はキーがないとデフォルト値を挿入してしまいます。`find` は代わりに `end()` を返します。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.cheatsheet.10.min-heap"
title = "小さいものが上"
story = "登龍街のミニバス乗り場は、いちばん短い便から出す。priority_queue は最大のものを上に置くことしか知らない。"
brief = '''
`std::priority_queue` はデフォルトで**最大**のものから取り出します。`pq.top()` が**最小**の `int` になるように `pq` を宣言してください。
'''
hints = [
  "テンプレート引数は三つ: 型、コンテナ、そして比較子。真ん中は省略できません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.cheatsheet.11.erase-remove"
title = "ゼロを掃き出せ"
story = "渣甸坊の屋台の店じまい。空き箱は片付けられ、列は短くなる。"
brief = '''
`std::vector<int> v` からすべての `0` を削除し、`v.size()` が縮むようにしてください。
'''
hints = [
  "`std::remove` は残す要素を前に詰めて新しい末尾を返すだけです。そこから元の末尾までを `erase` してください。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.cheatsheet.12.stoi"
title = "壊れた数字"
story = "7-32 号室の台帳に 'abc' と書かれたセルがある。パーサは例外を投げ、誰かがそれを捕まえなければならない。"
brief = '''
`std::string s` は `"abc"` かもしれず、そのとき `std::stoi` は例外を投げます。`int n` をパースした値に、`s` が数でなければ `-1` に設定してください。
'''
hints = [
  "`catch` は投げられた型にしか一致しません。`stoi` は数がないとき `std::invalid_argument` を投げます。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.cheatsheet.13.words"
title = "一語ずつ"
story = "午砲のログの行には 'fired   12:00  Jardine' とある — 単語の間の隙間はいつも空白一つとは限らない。"
brief = '''
`std::string line` には**一つ以上**の空白で区切られた単語が入っています。`<sstream>` はインクルード済みで、`std::string w;` と `std::vector<std::string> words;` は宣言済みです。すべての単語を順番どおりに `words` に push し、空文字列が混ざらないようにしてください。
'''
hints = [
  "文字列ストリームの `>>` は各単語の前の空白の連なりを読み飛ばし、次の空白で止まります — 区切り文字ベースの読み取りは何も読み飛ばしません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.cheatsheet.14.capture"
title = "累計"
story = "避風塘のサンパンの渡しには料金箱が一つだけあり、乗船のたびにその箱に入らなければならない — そのコピーではなく。"
brief = '''
`int total = 0;` は `main` のローカル変数です。`add(5);` が**まさにその `total`** に `5` を足すように `add` を定義してください — その後 `total` は `5` になります。
'''
hints = [
  "ラムダは角括弧で言わない限り外側のものを何も見ません。コピーキャプチャは頼まなければ読み取り専用で — 頼んでもコピーにすぎません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.cheatsheet.15.bindings"
title = "キーと値を、名前で"
story = "怡和街の賃料改定: 台帳のすべての店が 1 ずつ上がる。変わらなければならないのは台帳そのものだ。"
brief = '''
`std::map<std::string, int> m;` — **`m` に格納されたすべての値**に `1` を足してください。ループのヘッダでキーを `k`、値を `v` と名付けて(`.first` や `.second` は使わずに)。
'''
hints = [
  "角括弧は各ペアを二つの名前に分解します。その名前がマップ自身のペアを指すのか、そのコピーを指すのかは、その前に何を書くかで決まります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.cheatsheet.16.sort-by"
title = "second が先"
story = "ヨットクラブの船台ウインチのログは船体番号と船長の名前を組にしている。港長はそれを船長名のアルファベット順で欲しがっている。"
brief = '''
`std::vector<std::pair<int, std::string>> v;` — 以下の行は `std::sort(v.begin(), v.end(), …)` の第3引数です。`v` を**文字列**で A から Z の順に並べるものを選んでください。
'''
hints = [
  "比較子はただ一つの問いに答えます — `a` は `b` より前か? — 関心のあるメンバについて、厳密な `<` で。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.cheatsheet.17.ordering"
title = "セットの中の席"
story = "避風塘のサンパンはどれも (row, column) の係留位置で、港湾事務所はそれを std::set で管理している — 順序をつけられないものは受け付けない。"
brief = '''
```cpp
struct Pt { int r, c; };
std::set<Pt> taken;
```

これはまだコンパイルできません。`Pt` の中に**メンバを一つ**足して、`taken` が動き、`r` で順序づけ、同点なら `c` で決めるようにしてください。C++20 で、`<tuple>` はインクルード済みです。
'''
hints = [
  "set は `const` な要素を比べます。そして辞書式順序では、二番目のフィールドは一番目が同点のときにしか意味を持ちません。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.cheatsheet.18.optional"
title = "数かもしれない"
story = "ビクトリア・パークの噴水の下のポンプ室は圧力の読みを報告するか、センサーが抜けているときは何も報告しない — そして表示板は何もないときに決してクラッシュしてはならない。"
brief = '''
`std::optional<int> r = read_sensor();` — `int n` を読み取り値に、`r` が空なら `-1` に設定してください。何も投げてはいけません。
'''
hints = [
  "optional は数ではないので、`?:` の中で数と並べることはできません。メンバの一つが代替値を引数に取ります。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.cheatsheet.19.lower-bound"
title = "入るべき場所"
story = "怡和街のトラム停留所の掲示板には発車の分が順に並び、問題は次のトラムがどの枠に入るかだ。"
brief = '''
`std::vector<int> v` は昇順に並んでいて、`int x` が与えられます。`int i` を **`x` 未満でない最初の要素**のインデックスに設定してください — すべての要素が小さければ `i` は `v.size()` に等しく、`x` が含まれていれば `x` の最初のインデックスになります。
'''
hints = [
  "このアルゴリズムが返すのは数ではなくイテレータです。イテレータから先頭を引けば距離になります。そしてどちらの bound かに注意: もう一方はすべての `x` を飛び越えます。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.cheatsheet.20.wide-sum"
title = "あふれた合計"
story = "正午、砲が鳴り、トンネルの料金レジは最大十億ずつの通行料二十万件を足し上げる — どんな int にも収まったことのない合計だ。"
brief = '''
`std::vector<int> v` には 2·10^5 個の要素があり、それぞれ最大 10^9 で、`<numeric>` はインクルード済みです。**正確な**合計を `long long s` に格納してください。
'''
hints = [
  "累計の型は `s` の型ではなく、初期値の型です — どの加算も、何かが格納される前にその型で行われます。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.cheatsheet.21.push-back"
title = "山にもう一つ"
story = "渣甸坊の屋台の奥に新しい木箱が届き、木箱の列は一つ分伸びなければならない vector だ。"
brief = '''
`std::vector<int> v;` と `int x;` — `x` を `v` の **末尾** に加え、`v.size()` が一つ増えて `v.back()` が `x` になるようにしてください。
'''
hints = [
  "vector は一方の端でしか伸びず、それをするメンバはどちらの端かを名前で言っています — 単独の `append` や `push` は他の言語の言葉です。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.cheatsheet.22.queue-pop"
title = "次の人"
story = "登龍街のミニバスの列: 先頭の人が乗り込み、列は一人分短くなる。"
brief = '''
`std::queue<int> q;` は空ではありません。**先頭** の要素を `int x` に格納し、**かつ** `q` から取り除いて、`q.size()` が一つ減るようにしてください。
'''
hints = [
  "標準コンテナでは、取り除くことと読むことは別々のメンバです — 取り除く方は何も返しません。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.cheatsheet.23.reverse"
title = "後ろから前へ"
story = "トラムは銅鑼湾の終点で向きを変え、今通ってきた停留所のリストは逆向きに読まなければならない。"
brief = '''
`std::vector<int> v` には `3, 1, 2` が入っています。**その場で** 逆順にして `2, 1, 3` と読めるようにしてください。`<algorithm>` はインクルード済みです。
'''
hints = [
  "`vector` にそのためのメンバはなく、アルゴリズムはイテレータの組を取ります。そして逆イテレータでソートするのはソートです — 順序を回すことにはなりません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.cheatsheet.24.copy"
title = "コピーであって窓ではない"
story = "利園のロビーは夜警のために来客リストをもう一枚印刷し、夜警が自分のに書き込んだものが日勤のリストに現れてはならない。"
brief = '''
`std::vector<int> a{1, 2};` — `b` を `a` の **独立した** コピーにして、`b.push_back(3);` の後も vector `a` は 2 要素のまま、`b` は 3 要素になるようにしてください。
'''
hints = [
  "vector は素の代入で自分をコピーします。宣言の `&` は同じ vector の二つ目の名前を作り、`std::move` は移動元を空にします。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.cheatsheet.25.digit"
title = "char の裏の数字"
story = "ウィンザーハウスのドアに描かれた店番号は '7' で、エレベーターの制御装置が欲しいのはグリフのコードではなく数の七だ。"
brief = '''
`char c = '7';` — `int d` を数の `7` に設定してください（`55` ではなく。それは文字のコードです）。
'''
hints = [
  "char はもともと小さな整数なので、キャストはコードの名前を変えるだけです。数字は表の中で隣り合って並んでいます — 始まりの一つを引いてください。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "cpp.cheatsheet.26.real-division"
title = "半ドル"
story = "軒尼詩道の両替所で七ドルを二人で分ければ三ドル五十 — レジが int のように割らなければ。"
brief = '''
`int a = 7, b = 2;` — `double q` を `3.5` に設定してください。
'''
hints = [
  "除算はオペランドの型で、何かが格納されたり変換されたりする前に行われます。結果ではなくオペランドを広げてください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.cheatsheet.27.max-mixed"
title = "二種類のうちの大きい方"
story = "百德新街の賃料ボードは一軒を丸ドルで、次の一軒を半ドル付きで載せている — そして二つのうち高い方を欲しがる。"
brief = '''
`int a = 2; double b = 2.5;` — `double m` を二つのうち大きい方に設定して、`m` が `2.5` になるようにしてください。`<algorithm>` はインクルード済みです。
'''
hints = [
  "`std::max` は型引数一つのテンプレートで、二つの引数が食い違うと推測を拒みます。型を教えてください — 半分を保てる方の型を。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet.28.enum-class"
title = "どの路線"
story = "銅鑼湾駅の MTR の表示板は路線に名前を付けていて、ホームのコードはそのうちの一つについて、数字で綴らずに尋ねたい。"
brief = '''
```cpp
enum class Line { Island, TsuenWan };
Line l = read_line();
```

`l` が enum の最初の case であるときにちょうど入る `if` を開いてください。
'''
hints = [
  "スコープ付き enum はその名前を enum の中に置き、ひとりでに `int` や文字列になることはありません。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet.29.substr"
title = "真ん中の単語"
story = "配達伝票の住所は 'Causeway Bay, HK' で、配達員が欲しいのは十文字目から始まる単語だけだ。"
brief = '''
`std::string s = "Causeway Bay, HK";` — `std::string t` を `"Bay"` に、つまりインデックス `9` から始まる三文字に設定してください。
'''
hints = [
  "二番目の引数は切れ端の終わりの位置ではありません。終端のインデックスを渡すと文の終わりまで全部が返ってきます。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet.30.positive-mod"
title = "負になった折り返し"
story = "午砲のリングバッファには枠が三つあり、枠ゼロから七つ戻れば枠二に着かなければならない — カモノハシが朝からずっと座っている枠マイナス一ではなく。"
brief = '''
`int x, m;` で `m > 0`。`x` は `-7` や `-100` を含む **任意の** `int` です。`int r` を `x` を `m` で割った余りで `0..m-1` の範囲のものに設定してください — `x = -7, m = 3` なら `2` です。
'''
hints = [
  "C++ では `%` の符号は被除数に従うので、負の `x` は負の余りを与えます — 正しい枠の一歩手前です。`m` を一度足すだけでは全ての `x` に足りません。足して、もう一度縮めてください。",
]
