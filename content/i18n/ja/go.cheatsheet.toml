// ____
m["a"]++
```
'''
hints = [
  "宣言しただけで make していないマップは nil です: 読むとゼロ値、書くとパニック。そして `:=` は同じブロックで `m` を再宣言できません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
