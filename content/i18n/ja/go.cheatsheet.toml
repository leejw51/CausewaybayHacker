story = "開平道の配達員が無線で荷物の数を伝えてくる。荷物ゼロも本物の報告だ。シャッターが下りたときだけが一日の終わりを意味する。"
brief = '''
`ch` は `chan int` です。送信側は本物の値として `0` を送ることも十分あり、
終わったら `ch` を閉じます。`v` に受信し、`ch` が閉じられて空になったときに
だけ `ok` が false になるようにしてください。
'''
hints = [
  "受信式には、マップの検索と同じように二値の形があります。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.cheatsheet.17.cancel-send"
title = "閉店時間"
story = "勿地臣街の夜の厨房は皿を列の先へ渡していく。店長が閉店を告げたら、料理人は皿を置く — 受け取る者が誰もいなくても。"
brief = '''
パイプラインの一段、
`func send(ctx context.Context, out chan<- int, v int) error` の中です。
`out` に `v` を送りますが、`ctx` がキャンセルされた瞬間にあきらめてコンテキストの
エラーを返してください — 誰も `out` を読んでいなくても。
'''
hints = [
  "二つを同時に待てるのは `select` だけで、その各 case は送信か受信でなければなりません — `Done()` はチャネルをくれます。",
]

