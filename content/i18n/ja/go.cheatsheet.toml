story = "利園ホテルのフロントに予約が JSON で届く。埋めるべきはカウンターの上の用紙そのものだ — そのコピーではなく。"
brief = '''
`s` は JSON を持つ `string` で、`var u User` は普通の値です。エラーを `err` に
残しつつ、`s` から `u` を埋めてください。
'''
hints = [
  "デコーダはバイト列を取り、コピーではなく `u` そのものに書き込めなければなりません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "go.cheatsheet.19.bfs-queue"
title = "古いものから"
story = "タイムズ・スクエア地下の駐車場に、雨水が排水口から外へ一区画ずつ広がっていく。"
brief = '''
グリッドの BFS です。探索が幅優先のままで — しかもループがちゃんと終わるように —
キューから次の点を取り出す行はどれですか？

```
q := []pt{{sr, sc}}
for len(q) > 0 {
    // ____
    for _, d := range dirs {
        nr, nc := cur.r+d.r, cur.c+d.c
        if !okCell(nr, nc) { continue }
        q = append(q, pt{nr, nc})
    }
}
```
'''
hints = [
  "幅優先とは一番古い要素が先に出ることです。ループ本体の中の `:=` は新しい `q` を作り、外側のものは決して縮みません。",
]

