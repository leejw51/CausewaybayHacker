hints = [
  "インデックスベースの比較関数は「`i` は `j` より前に来るべきか？」に答えます — 大きい順なら、大きい方が前です。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.cheatsheet.15.nil-map"
title = "まだページがない"
story = "渣甸坊の屋台の新しい集計帳にはまだページがない。最初の一画が表紙をまっすぐ突き破る。"
brief = '''
三行はすべて `main` の中、同じブロックに並んでいます。インクリメントがパニック
