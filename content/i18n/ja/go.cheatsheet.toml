[[quest]]
id    = "go.cheatsheet.03.zero-pad"
title = "五桁"
story = "ハイサン・プレイスの窓口の番号札はいつも五桁で、前はゼロで埋まっている。"
brief = '''
`n` は `42` です。これを `00042` と出力し、改行してください。
'''
