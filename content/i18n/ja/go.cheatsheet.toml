```
n, err := strconv.Atoi(s)
if err != nil {
    // ____
}
```
'''
hints = [
  "`errors.Is` が中まで見通せるようにエラーを包む書式動詞は一つだけです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.cheatsheet.12.close-results"
title = "最後の一人が出たら"
story = "パーシバル・ストリートの奥の部屋で、配達員四人が夜通し働く。最後の一人が戻ったあとに誰かが鍵を掛けなければならない — その前ではなく。"
brief = '''
ワーカープールです。各ワーカーは `jobs` が尽きると `wg.Done()` を呼び、`jobs` は
生産者が閉じます。すべてのワーカーが終わったら最後の `range` が終わるようにする
— デッドロックもパニックもなく — 行はどれですか？

```
results := make(chan int) // unbuffered
for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
hints = [
  "待つのは読み手より前ではなく、読み手と並んでです。ワーカーは `main` が読むまでバッファなしの送信で止まっています。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.cheatsheet.13.concat"
title = "まっさらな裏付け"
story = "そごうの交差点で二つの列が合流する。係員が欲しいのは真新しい名簿だ — 最初の列のクリップボードに書き足したものではなく。"
brief = '''
`a` と `b` は `[]int` です。`a` の要素のあとに `b` の要素が続く一つのスライス `c` を
作ってください。あとで `c[0] = 9` としても `a` が変わらないように — `a` に余った
容量があるときでも。
'''
hints = [
  "`append` は最初の引数の裏付け配列に余裕があればそれを使い回します。Go 1.22 で、常に新しい配列を確保する関数が加わりました。",
]

