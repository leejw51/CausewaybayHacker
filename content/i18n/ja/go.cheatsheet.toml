# GO LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/go/cheatsheet.toml`, quest by quest, and nothing else. The
# four choices are code, live in the English pack, and are never translated.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "go.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet.01.flush"
title = "フラッシュしなければ無"
story = "06:30、ジャーディンズ・バザール。キオスクは一晩中バッファに出力したが、誰も一行も目にしなかった。"
brief = '''
出力はバッファ付きの writer を通ります。`main` が戻るとき、`out` に書いたものが
すべて実際に画面に届くようにする行はどれですか？

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
hints = [
  "`bufio.Writer` はフラッシュされるまでバイトを抱えたままです。そして `defer` には括弧付きの呼び出しが必要です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet.02.fields"
title = "ゆるい空白"
story = "茶餐廳の注文票には、急いだ店員が打った 3   5 と書かれている。"
brief = '''
`sc.Scan()` がたった今 `"3   5"` という行（間に空白がいくつも）を読みました。
これを二つのトークン `["3", "5"]` にする行はどれですか？
'''
hints = [
  "空白一つで分けると、連続した空白の間に空文字列が残ります。空白の連なり全体で分ける関数があります。",
]

