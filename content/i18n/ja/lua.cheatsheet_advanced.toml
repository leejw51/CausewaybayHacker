# LUA LAND — CHEATSHEET ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/lua/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks and identifiers are copied
# verbatim.

pack   = "lua.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet_advanced.01.class-index"
title = "答えるテーブル"
story = "21:00、浣紗街。龍の節はどれもテーブルで、メイはメソッドを一か所にまとめておきたい。"
brief = '''
`Dragon` はメソッドのテーブル（`Dragon.length`、…）で、コンストラクタはすでに
書かれています:

```
function Dragon.new(n)
  return setmetatable({n = n}, Dragon)
end
```

コンストラクタの前に置いて、`Dragon.new(3):length()` が `Dragon.length` を
見つけるようにする一行を書いてください。
'''
hints = [
  "インスタンスのメタテーブルは `Dragon` です。見つからないキーは、そのメタテーブルの検索フィールドが指す先で探されます — そしてそれはクラス自身を指せます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet_advanced.02.inherit"
title = "提灯の下の節"
story = "提灯は上に炎が乗った節だ。自分でできないことは、下の節がやる。"
brief = '''
`Segment` は自前のメタテーブルフィールドを持たない、関数の素のテーブル
（`Segment.burn`、…）です。`Lantern` はいつものパターンのクラスです
（`Lantern.__index = Lantern`、インスタンスは `setmetatable({}, Lantern)` で作成）。
`Lantern` が定義しないどんなメソッドでも提灯が `Segment` にフォールバックするように
する一行を — `Lantern` 自身のメソッドは保ったまま — 書いてください。
'''
hints = [
  "クラス自身にメタテーブルが要ります。`Segment` には検索フィールドがないので、そのままではそのメタテーブルになれません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.cheatsheet_advanced.03.lt-sort"
title = "自分で並ぶ"
story = "太鼓チームに点が付く。係員は毎回比較関数を書かずに並べ替えたい。"
brief = '''
`Score` はクラス（`Score.__index = Score`）で、各インスタンスは数値フィールド `v` を
持ちます。`scores` はそのリストです。`table.sort(scores)` — **比較関数なし** — が
`v` の小さい順に並べるように、メタメソッドの行を書いてください。
'''
hints = [
  "比較関数がなければ sort は `<` で比較し、二つのテーブルに対する `<` はメタテーブルに特定の一つのフィールドを尋ねます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.cheatsheet_advanced.04.eq"
title = "同じ点、二つのテーブル"
story = "二人の走者が大坑道の同じ地点を二つの別々のテーブルに記し、地図はそれらを等しいと呼ばなければならない。"
brief = '''
`P` はクラス（`P.__index = P`）で、そのインスタンスは数値フィールド `x` と `y` を
持ちます。`a` と `b` は等しいフィールドを持つ二つの **異なる** インスタンスです。
`a == b` を true にするメタメソッドの行を書いてください。
'''
hints = [
  "メタメソッドの中で二つのテーブルに `a == b` をすると、またメタメソッドが呼ばれます。テーブルではなくフィールドを比較しましょう。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.cheatsheet_advanced.05.call"
title = "クラスそのものを呼ぶ"
story = "メイは `Pad(5)` を、机の上の LÖVE コードのようにコンストラクタとして読めるようにしたい。"
brief = '''
`Pad` は `Pad.__index = Pad` とコンストラクタ `Pad.new(n)` を持つクラスです。`mt` は
**`Pad` 自身の** メタテーブルとしてすでに設置されたテーブルです（`setmetatable(Pad, mt)`）。
`Pad(5)` が `Pad.new(5)` として振る舞うようにする行を書いてください。
'''
hints = [
  "`Pad` を呼ぶと `Pad` のメタテーブルが参照されます。`Pad` 自身ではありません — そしてハンドラは呼ばれたテーブルを最初の引数として受け取ります。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet_advanced.06.newindex-rawset"
title = "書き留めてから、しまえ"
story = "線香台帳の新しい記入はまず記録される。その後も台帳はそれを持っていなければならない。"
brief = '''
`log` はリストです。`t` は空のテーブルで、そのメタテーブルは次を持ちます:

```
__newindex = function(t, k, v)
  log[#log + 1] = k
  -- ____
end
```

値が本当に `t` に格納され（後の `t[k]` がそれを読み返す）、**かつ** このハンドラが
二度目に走らないように空欄を埋めてください。
'''
hints = [
  "ハンドラが走る時点でキーはまだ存在しないので、素の代入はハンドラを永遠に再び発火させます。格納はメタテーブルを素通りしなければなりません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet_advanced.07.rawget-default"
title = "書かれたことはあるか"
story = "カウントテーブルはどんな名前にもゼロと答える。係員はどの名前が実際に入力されたか知りたい。"
brief = '''
`counts` は

```
local counts = setmetatable({}, {__index = function() return 0 end})
```

として作られたので、存在しないキーはどれも `0` と読めます。`k` が `counts` に
**本当に** 格納されているときだけ true になる `if` を開いてください — 格納された
`0` は格納済みと数え、一度も書かれていないキーは数えません。
'''
hints = [
  "普通の読み取りはデフォルトを通ります。メタテーブルを飛ばす読み取りはメソッドではなくグローバル関数です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.cheatsheet_advanced.08.len-trap"
title = "スタックの長さは"
story = "予備の線香のスタックには、5.2 のマニュアルを読んだ誰かが長さのメタメソッドを与えた。"
brief = '''
`Stack` は値を `s.items`（リスト）に保持します。そのメタテーブルは `#s.items` を
返す `__len` を定義した非公開テーブルで、`len` メソッドはありません。この land の
LuaJIT で、`n` をスタック `s` の値の数にしてください。
'''
hints = [
  "LuaJIT は Lua 5.1 です: 長さのメタメソッドは userdata にしか効かないので、オブジェクトへの `#` は空テーブルの生の長さ — 0 を返します。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.cheatsheet_advanced.09.loop-closure"
title = "提灯ごとに自分の番号"
story = "ヴィクトリア・パークの三つの提灯。それぞれにボタンがあり、後で押されたら自分の番号を言わなければならない。"
brief = '''
`fns` は空のテーブルです。`fns[1]()`、`fns[2]()`、`fns[3]()` が `1`、`2`、`3` を返す
ように三つの関数で埋めてください — 各クロージャが自分の番号を保ちます。
'''
hints = [
  "数値 `for` は反復ごとに新しいローカルを作ります。それを一つの外側の変数にコピーすると、すべてのクロージャが同じ最終値を持ちます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.cheatsheet_advanced.10.false-default"
title = "false も答えのうち"
story = "クルーはわざとキャッシュを切れる。それでも設定がオンと読めた夜、メイは理由を突き止めた。"
brief = '''
`given` は呼び出し側が渡したままのオプションです: `true`、`false`、または不在
（`nil`）。`default` は `true` です。`cache` を与えられた値 — **`false` も含めて** —
にし、何も与えられなかったときだけ `default` にしてください。一行で。
'''
hints = [
  "`x and y or z` も `x or z` も `false` を `nil` と同じに扱います。`nil` との明示的な比較だけが二つを区別します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.cheatsheet_advanced.11.select-n"
title = "二番目の叫び"
story = "点呼は来るがままに来る。係員は最初の担ぎ手が何も言わなくても二番目の答えが欲しい。"
brief = '''
`f` は任意個の引数を取ります（`function f(...)`）。その中で、`second` を正確に二番目の
引数にしてください — 最初が `nil` のときも、後にもっと続くときも。
'''
hints = [
  "可変長引数リストはある位置で切れます。結果を一つのローカルに代入すると、残った最初の値だけが保持されます。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.cheatsheet_advanced.12.unpack-range"
title = "一つ残らず、穴も込みで"
story = "名前は叫ばれたとおりに、隙間も含めて龍を下って、数える節へと渡される。"
brief = '''
`t` は `{...}` で `n` は `select("#", ...)` なので、`t` には `nil` の穴があるかも
しれません（`t = {1, nil, nil}`、`n = 3`）。`g` を `n` 個の値 **すべて** で、穴も
含めて呼んでください。
'''
hints = [
  "穴のあるテーブルへの `#` は境界であって個数ではありません。アンパッカーは明示的な最初と最後の添字を取り、LuaJIT ではグローバルです。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.cheatsheet_advanced.13.truncate"
title = "最初のものだけ"
story = "`f` は値と状態を報告する。プログラムが欲しいのは値だけが入ったリストだ。"
brief = '''
`f()` は二つの値 `1, 2` を返します。`t` を **ちょうど一つ** の要素、最初の値を持つ
リストにしてください — 一時変数なしで。
'''
hints = [
  "コンストラクタの最後の位置の呼び出しはすべての結果を展開します。呼び出しを包むと一つの値に調整されます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.cheatsheet_advanced.14.wrap"
title = "呼べる走者"
story = "節ごとに線香の走者が一人: 係員はそれぞれを関数のように呼んで、次の提灯番号を得たい。"
brief = '''
`producer` は値を何度も yield する関数です（ループ内の `coroutine.yield(i)`）。
`gen` を素の **関数** にしてください: 各 `gen()` は次に yield された値を返し、
`for v in gen do` で直接動きます。
'''
hints = [
  "コルーチンを作ると thread 値になり、それは呼べません。ライブラリには代わりに関数を返す二つ目のコンストラクタがあります。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.cheatsheet_advanced.15.resume-value"
title = "走者が持ち帰るもの"
story = "走者は数を龍の上へ渡し、終える前に一つ降りてくるのを待つ。"
brief = '''
```
local co = coroutine.create(function(a)
  local b = coroutine.yield(a * 2)
  return b + 1
end)
```

`co` は `5` で一度始められました。その呼び出しは `true, 10` を返し、
`coroutine.status(co)` は今 `"suspended"` です。`ok, v` が `true, 8` になり、
コルーチンが終わる（`"dead"`）ように次の行を書いてください。
'''
hints = [
  "二回目の resume の引数が、保留中の yield の結果になります — 引数そのもので、それ以上はありません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.cheatsheet_advanced.16.error-table"
title = "構造化された失敗"
story = "失敗した検索はどのコードで失敗したかを言うべきで、呼び出し側にパースすべき文章を渡すべきではない。"
brief = '''
`lookup` は、呼び出し側が

```
local ok, e = pcall(lookup, id)
if not ok then print(e.code) end   -- 404
```

とできるように失敗しなければなりません。`lookup` の中でその失敗を送出する行を
書いてください。
'''
hints = [
  "エラー値は文字列だけでなくどんな Lua の値でも構いません。送出する代わりに返すと `ok` は true のままです。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.cheatsheet_advanced.17.xpcall"
title = "どこで壊れたか"
story = "龍は四十番目の節で止まった。メイはメッセージだけでなく、メッセージとその上のフレームが欲しい。"
brief = '''
`f` を保護モードで呼んでください。失敗時には `err` は裸のメッセージではなく、
**スタックトレースバック** を付け加えたメッセージを持たなければなりません。
'''
hints = [
  "メッセージハンドラを取る保護呼び出しはハンドラを関数値として欲しがります。そこで呼び出してしまうと文字列を渡すことになり、拒否されます。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.cheatsheet_advanced.18.gmatch-pairs"
title = "キー、イコール、値"
story = "太鼓チームの設定は、奥士比街で `name=value` ペアの一行として届く。"
brief = '''
`s` は `"a=1 bb=22 c=3"` です。各ペアを、`k` を名前、`v` を数字として、どちらも
文字列で訪れるループを開いてください — `a`/`1`、`bb`/`22`、`c`/`3`。
'''
hints = [
  "パターンの各キャプチャがループ変数一つになります。キャプチャがなければループは一致全体を受け取り、それ以外は何も受け取りません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.cheatsheet_advanced.19.gsub-table"
title = "空欄を埋めろ"
story = "プログラムのテンプレートには `$name` の穴がある。クルー名簿がそれを埋め、プリンタはいくつ埋めたか知りたい。"
brief = '''
`vars` は `{name = "Mei", st = "Tai Hang"}` で、`s` は `"hi $name of $st"` です。
**すべての** `$word` を `vars[word]` で置き換え、`n` を置き換えた数にしてください —
一回の呼び出し、ループなし。
'''
hints = [
  "テーブルを置換に使うと、最初のキャプチャが検索されるキーになります。個数は呼び出しの二つ目の結果です。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.cheatsheet_advanced.20.frontier"
title = "単語まるごと"
story = "プログラムノートの `the` を数えていて、メイは `there` と `thesis` まで捕まえ続けた。"
brief = '''
`s` は `"the thesis there; the other, the."` です。`n` を `the` が **単語として
まるごと** 現れる回数にしてください — ここでは `6` ではなく `3`。（`out` は未使用です。）
'''
hints = [
  "Lua のパターンに `\\b` はありません。frontier 項目は文字クラスへの出入りの空の遷移に一致し、文字列の両端も含みます。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.cheatsheet_advanced.21.format-widths"
title = "プログラムのための列"
story = "蓮花宮の屋台の価格板は列をそろえて並び、審判はそれをバイト単位で diff する。"
brief = '''
`name` は `"tea"`、`price` は `3.5`、`n` は `7` です。正確に

```
tea       | 3.50|007
```

と出力してください — 名前は 10 桁で左揃え、価格は 5 桁で小数二桁、数は 3 桁に
ゼロ埋め。
'''
hints = [
  "幅のマイナス記号は左揃え、先頭のゼロはゼロ埋め、そして浮動小数点の幅は `3.50` 全体を数えます。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.cheatsheet_advanced.22.sort-strict"
title = "クラッシュしない同点"
story = "四十の太鼓チーム、ほとんどが同点で、ソートは審判の目の前で `invalid order function` を出した。"
brief = '''
`t` は数値フィールド `score` を持つレコードのリストで、**多くが同点** です。LuaJIT が
`invalid order function for sorting` を出さないように、スコアの高い順に並べ替えて
ください。
'''
hints = [
  "比較関数は厳密な順序でなければなりません: 等しい要素には false、そして数ではなく boolean。（ソートは安定ではなく、同点のレコードはどんな順でも出てきます。）",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet_advanced.23.next-empty"
title = "台帳に何もない"
story = "台帳は担ぎ手の名前をキーにしている。`#` は空でも一杯でもゼロと言う。"
brief = '''
`t` は担ぎ手の名前をキーにしています — 文字列キーのみ — なので、何か入っていようと
いまいと `#t` は `0` です。`t` にエントリが **一つもない** ときだけ true になる `if` を
開いてください。
'''
hints = [
  "`pairs` の裏にあるイテレータのプリミティブはテーブルの最初のキーを返し、なければ `nil` を返します。テーブルはどれも自分自身の値なので、`{}` は何とも等しくありません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet_advanced.24.big-digits"
title = "すべての桁"
story = "提灯の数が十六桁に達し、印刷が指数表記で返ってきた。"
brief = '''
`n` は `2^50` — 数 `1125899906842624` です。すべての桁を、指数なしで出力してください
（LuaJIT の `print` は `1.1258999068426e+15` を表示します）。
'''
hints = [
  "ここではすべての数が double で、デフォルトの変換は `%.14g` です。`format` の整数変換は十六桁すべてを書きます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet_advanced.25.bit-test"
title = "フラグは立っているか"
story = "各節の状態はフラグの数一つ。係員は `lit` の一ビットを確かめる。"
brief = '''
`flags` はビットの並びとして使われる数で、`i` は `0` から数えたビット位置です。
LuaJIT の `bit` ライブラリは `bit` として読み込まれています。`flags` のビット `i` が
立っているときにちょうど true になる `if` を開いてください。
'''
hints = [
  "LuaJIT にはこのための演算子がありません — ライブラリ呼び出し二つです — そして Lua では `0` は true なので、結果はやはり比較しなければなりません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet_advanced.26.goto-continue"
title = "これは飛ばせ"
story = "偶数番の節はこの周は休み。ループは本体全部を `if` に入れ子にせずに、それらを通り過ぎて歩く。"
brief = '''
```
for _, v in ipairs(t) do
  -- ____
  io.write(v, " ")
  ::continue::
end
```

偶数の値が飛ばされてループが続くように空欄を埋めてください（LuaJIT 2.1）。
'''
hints = [
  "Lua に `continue` キーワードはありません。LuaJIT には 5.2 のジャンプ文があり、本体の末尾のラベルがその飛び先です。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.cheatsheet_advanced.27.local-function"
title = "自分の名前を知っている関数"
story = "書院街の階乗はローカルで、再帰的で、二回目の呼び出しでクラッシュした — `attempt to call global 'fact'`。"
brief = '''
`fact` を、本体が

```
  if n <= 1 then return 1 end
  return n * fact(n - 1)
```

である **ローカル** 関数として、再帰呼び出しがそれを見つけられるように宣言して
ください（`fact` という名前のグローバルは存在しません）。開始行を書いてください。
'''
hints = [
  "`local x = <expr>` では、名前は式の後まではスコープにありません。そのやり方で代入された関数値は自分自身を見られません。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet_advanced.28.ffi-array"
title = "本物の C 配列"
story = "LÖVE クライアントの下のウォレットバインディングは C と話す。渡すバッファは Lua のテーブルではなく C の配列でなければならない。"
brief = '''
`ffi` は `require("ffi")` で、`n` は実行時にしか分からない数です。`buf` を `n` 個の
`int` の C 配列にしてください — ゼロ埋めで、`0` から添字付けされ、サイズは `n`。
'''
hints = [
  "C の型文字列に Lua の変数は入れられません。可変長配列はプレースホルダで宣言し、個数は次の引数で受け取ります。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet_advanced.29.weak-cache"
title = "手放すキャッシュ"
story = "レンダリングキャッシュは提灯オブジェクトをキーにしている。燃え尽きた提灯が自分のキャッシュエントリのせいで生かされ続けてはならない。"
brief = '''
`cache` はオブジェクト（キーとして使われるテーブル）を計算済みの値に対応付けます。
他の何からも参照されないオブジェクトが回収でき — そのエントリも一緒に消え — 一方で
生きているオブジェクトに格納された値は残るようにしてください。
'''
hints = [
  "弱さは文字列を持つメタテーブルのフィールドです。どの文字が入っているかで、キーが弱いか、値が弱いか、両方かが決まります。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet_advanced.30.sandbox"
title = "月のためのサンドボックス"
story = "真夜中。最後の挑戦は見知らぬ人が打ち込んだ Lua の一行で、`x` 以外に何もない部屋で走る。"
brief = '''
`src` は Lua の文字列 `"return x * 2"` で、`env` は `{x = 10}` です。グローバルが
`env` **だけ** である関数 `f` にコンパイルしてください — `f()` は `20` を返し、
中から `print` は見えません。一行で、LuaJIT。
'''
hints = [
  "文字列をコンパイルすると関数になります（または nil とメッセージ — だからアサーション）。関数のグローバルテーブルを差し替える 5.1 の呼び出しはその同じ関数を返します。",
]
