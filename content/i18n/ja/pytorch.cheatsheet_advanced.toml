id    = "pytorch.cheatsheet_advanced.19.collate-fn"
title = "でこぼこの行、一つのテンソル"
story = "中央図書館の端末からの文はあらゆる長さで届く。ローダのデフォルトのスタッカーは全部同じ長さを欲しがる。"
