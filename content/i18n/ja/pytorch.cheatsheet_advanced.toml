[[quest]]
id    = "pytorch.cheatsheet_advanced.05.modulelist"
title = "登記簿に載せろ"
story = "ジャーディンズ・バザールの上に建つ同じ階の塔。大家は登記簿に載った階からしか家賃を取らない。"
brief = '''
```
class Tower(nn.Module):
    def __init__(self, depth):
        super().__init__()
        blocks = [nn.Linear(64, 64) for _ in range(depth)]
        # ____

    def forward(self, x):
        for layer in self.layers:
            x = torch.relu(layer(x))
        return x
```

すべての層の重みが `model.parameters()` と `model.state_dict()` に現れるように
空欄を埋めてください。
'''
hints = [
  "素の Python コンテナは中身をモジュールの登記から隠します。登録するコンテナはリストをまるごと取ります。Sequential はリストではなくアンパックした層を欲しがります。",
]

