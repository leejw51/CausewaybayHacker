id    = "pytorch.cheatsheet_advanced.13.token-loss"
title = "パディング以外のすべてのトークン"
story = "ラックの系列モデルはすべてのバッチ行のすべての位置にスコアを付ける。短い行の末尾のパディングは数えてはならない。"
