id    = "pytorch.cheatsheet_advanced.06.parameter"
title = "オプティマイザが回せるダイヤル"
story = "コンソール上のスカラー一つが softmax の鋭さを決める。ラックの他のすべてと同じく、学習すべきだ。"
brief = '''
`__init__` の中、`super().__init__()` の後で: モジュールに初期値 `1.0` の
**学習可能な** スカラー `self.temperature` を与え、`model.parameters()` に現れて
オプティマイザが更新するようにしてください。
'''
hints = [
  "テンソルをパラメータクラスで包むことが、モジュールに登録させるものです。勾配をオンにした裸のテンソルはオプティマイザから見えず、ラッパーは float ではなくテンソルを欲しがります。",
]

