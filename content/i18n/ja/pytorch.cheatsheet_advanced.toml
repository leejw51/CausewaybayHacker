# the prose of `content/pytorch/cheatsheet_advanced.toml`, quest by quest, and nothing
# else. The question is the brief; the four choices are code and live in the
# English pack only. Code blocks and identifiers are copied verbatim, never
# translated.

pack   = "pytorch.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.cheatsheet_advanced.01.autograd-grad"
title = "書類仕事なしの傾き"
story = "再び周亦卿楼の地下室。台車の上のコンソールが欲しいのは副作用ではなく微分だ。"
brief = '''
```
x = torch.tensor([1.0, 2.0], requires_grad=True)
y = (x ** 3).sum()
```

`g` を勾配 dy/dx の形状 `(2,)` の **テンソル** にしてください — そしてその後も
`x.grad` は `None` のままでなければなりません。
'''
hints = [
  "関数型 API は入力ごとに一つの勾配をタプルに詰めて返すので、アンパックしましょう。`y` のメソッドは何も返さず `.grad` に書き込みます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.cheatsheet_advanced.02.detach-clone"
title = "何も負わないコピー"
story = "ラック通路はすべての重みの下書きコピーを持っている。そこへの走り書きは決して原本に届いてはならない。"
brief = '''
`x` は `requires_grad=True` で、グラフ上にある形状 `(3,)` の float テンソルです。
`y` を `x` と **メモリを共有せず**、**グラフから切り離された** コピーにして、
後の `y.add_(1.0)` が `x` も、`x` が逆伝播するものも変えないようにしてください。
'''
hints = [
  "メソッドが二つ、仕事が一つずつ: 一方はグラフを切るがストレージは保ち、他方はストレージをコピーするがグラフは保ちます。両方が、この順で要ります。",
]

