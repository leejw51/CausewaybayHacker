[[quest]]
id    = "pytorch.cheatsheet_advanced.14.adamw"
title = "減衰、分離して"
story = "7-32 号室の面接官は、勾配に折り込んだ L2 ではない weight decay を求める。そのためのクラスがある。"
brief = '''
`params = model.parameters()`。学習率 `3e-4` と `0.01` の **分離された** weight
