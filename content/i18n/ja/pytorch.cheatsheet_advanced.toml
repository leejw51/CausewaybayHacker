[[quest]]
id    = "pytorch.cheatsheet_advanced.11.functional-dropout"
title = "今が何時か知っている dropout"
story = "コンソール上の関数型 dropout は、モデルが静かになったと誰かが伝えない限り、検証でもユニットを落とす。"
brief = '''
```
def forward(self, x):
    x = torch.relu(self.fc1(x))
    # ____
    return self.fc2(x)
```

`F` は `torch.nn.functional` です。空欄を `p=0.1` の **関数型** dropout で埋めて、
訓練中はユニットを落とし、`model.eval()` が呼ばれたら **落とすのをやめる** ように
してください。
'''
hints = [
  "関数型の形はモジュール自身の bool フラグを渡さない限り、モジュールがどのモードにあるか知りません。デフォルトは落とすほうです。forward の中で新しく作った層は常に訓練モードです。",
]

