[[quest]]
id    = "pytorch.cheatsheet_advanced.24.chunk-qkv"
title = "一つの射影から三つ"
story = "ラックの一つの Linear が query、key、value を横並びで生む。attention ブロックはそれらを別々に必要とする。"
brief = '''
`qkv` は `B = 8`、`D = 64` で形状 `(B, T, 3*D)` です: query、key、value の射影が
**最後の** 軸に沿って連結されています。それぞれ形状 `(B, T, D)` の `q`、`k`、`v`
を与える行はどれでしょう?
'''
hints = [
  "二つの分割器の一方は個数を数え、他方は各片のサイズを数えます — そして軸のデフォルトは最初の軸で、そこで八行を三つに切るとエラーなしに間違った形状が出ます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "pytorch.cheatsheet_advanced.25.gather"
title = "行ごとに一つ選べ"
story = "対数確率の六十四行、十クラス。手計算の損失には行ごとにちょうど一つの数が要る: 正解クラスのものだ。"
brief = '''
`logp` は `N = 64`、`C = 10` で形状 `(N, C)` — 対数確率で、dim 1 に沿って
`log_softmax` 適用済み — で、`y` は形状 `(N,)`、`int64` のクラス index です。
形状 `(N,)` の `lp` を作ってください: 各行について、その行の **正解** クラスの
対数確率です。
'''
hints = [
  "index テンソルは元と同じ次元数が要ります — 末尾の軸を与えましょう — そして選択は行の軸ではなくクラスの軸に沿って走ります。`y` だけで添字を取ると行全体が選ばれます。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "pytorch.cheatsheet_advanced.26.masked-fill"
title = "未来にはマイナス無限大"
story = "地下室のブロックは先を読んではいけない。対角線より上のスコアはすべて、softmax が見る前にマイナス無限大になる。"
brief = '''
`scores` は形状 `(B, T, T)` で、`mask = torch.tril(torch.ones(T, T))` — **float**
テンソルで、注意してよいところが `1.`、対角線より上が `0.` です。禁止された
スコアをすべてマイナス無限大に置き換え、続く softmax がそれらの位置に重み 0 を
与えるようにする行はどれでしょう?
'''
hints = [
  "fill は穴の位置が True の bool マスクを欲しがります — float マスクを比較して作りましょう — そしてマイナス無限大には Python の float を。テンソルの `where` は条件が True のところの値を保ちます。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "pytorch.cheatsheet_advanced.27.sdpa"
title = "一回の呼び出し、覗き見なし"
story = "カード上の融合 attention カーネルはスコア、マスク、softmax を一度のパスでこなす — フラグの綴りが正しければ。"
brief = '''
`q`、`k`、`v` はそれぞれ形状 `(B, H, T, Dh)` で、`F` は `torch.nn.functional` です。
各位置が自分自身と過去にだけ注意するように、**融合** カーネルで attention を
計算する行はどれでしょう?
'''
hints = [
  "融合呼び出しには因果マスク用の bool キーワードがあり、その綴りは素の `causal` ではありません。後から出力をマスクするのは間違ったテンソルをマスクすることで、フラグを省くとあらゆる場所に注意します。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "pytorch.cheatsheet_advanced.28.einsum"
title = "軸に文字を"
story = "7-32 号室の面接官はホワイトボードに積を添字で書き、バッチの文字が生き残るのを待つ。"
brief = '''
`a` は形状 `(B, 3, 4)`、`b` は形状 `(B, 4, 5)` です。`einsum` を使って、形状
`(B, 3, 5)` の `c` を作ってください: **バッチ行列積**、バッチ行ごとに一つの
`(3, 4) @ (4, 5)` です。
'''
hints = [
  "入力の各軸に文字が付き、共有される文字は和を取って消え、バッチの文字は出力に現れなければ同じく和を取られます。文字は軸の順に読まれるので、二つを入れ替えるとどのサイズが一致すべきかが変わります。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "pytorch.cheatsheet_advanced.29.checkpoint"
title = "今は忘れ、後で再計算"
story = "一万四千のパラメータはノート PC に収まる。すべてのブロックの活性化は収まらない。ブロックごとに計算とメモリを交換する。"
brief = '''
```
from torch.utils.checkpoint import checkpoint

def forward(self, h):
    for block in self.blocks:
        # ____
    return h
```

各ブロックの活性化が順伝播で **保存されず**、backward の間に再計算されるように
空欄を埋めてください — **非リエントラント** 版で。
'''
hints = [
  "checkpoint 関数は呼び出し可能オブジェクトとその入力を別々の引数として取り、代わりに呼んでくれます。ブロックの出力を渡すとすでに順伝播が走ってしまっていて、モジュール自体は呼び出し可能ではありません。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "pytorch.cheatsheet_advanced.30.multihead-attention"
title = "逆の意味のマスク"
story = "地下室の最後のブロックはライブラリ自身の attention モジュールで、その bool マスクは True を禁止と読む。メイは符号を二度確かめる。"
brief = '''
```
attn = nn.MultiheadAttention(embed_dim=64, num_heads=4, batch_first=True)
causal = torch.triu(torch.ones(T, T, dtype=torch.bool), diagonal=1)
```

`x` は形状 `(B, T, 64)` です。このモジュールでは bool の `attn_mask` は attention が
**禁止** のところで `True` で、`causal` は対角線の厳密に上で `True` です。
どのトークンも先を読まない、形状 `(B, T, 64)` の self-attention 出力 `out` を
与える行はどれでしょう?
'''
hints = [
  "モジュールは query、key、value を三つの位置引数のテンソルとして欲しがり、ペアを返します — アンパックしましょう。マスクは作ったとおりに渡します。ここでは True がすでにブロックの意味だからです。反転すると、すべてのトークンが未来だけを読みます。",
]
