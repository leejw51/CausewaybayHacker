[[quest]]
id    = "pytorch.cheatsheet_advanced.03.inplace-leaf"
title = "誰も見ていない間に触れ"
story = "二回の実行の間に、オペレータはファン壁のダイヤルを少し動かす。その間レコーダーは切っておかなければならない。"
