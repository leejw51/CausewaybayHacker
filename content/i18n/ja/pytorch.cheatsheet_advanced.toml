'''
hints = [
  "Adam の `weight_decay` は勾配に折り込まれた L2 です。分離型はそれ自身のオプティマイザクラスです。どちらもモジュールではなくパラメータのイテラブルを欲しがり、キーワードは省略せずに綴ります。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.cheatsheet_advanced.15.scheduler-step"
title = "一周ごとに冷ます"
story = "ラックでのコサインアニーリング: 学習率はエポックごとに少し緩む。オプティマイザが自分の番を終えた後で。"
brief = '''
```
sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=epochs)
for epoch in range(epochs):
    for xb, yb in loader:
        opt.zero_grad()
        loss = loss_fn(model(xb), yb)
        loss.backward()
        opt.step()
    # ____
```

学習率スケジュールが **エポックごとに一回進む** ように空欄を埋めてください。
'''
hints = [
  "スケジューラには自分の step があり、オプティマイザの後に呼びます — ここではエポックごとに一回。現在のレートを読んでも何も進まず、オプティマイザはスケジューラを所有していません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.cheatsheet_advanced.16.grad-scaler"
title = "スケール、ステップ、更新"
story = "ラック 3 のカードで半精度: 先に損失を膨らませ、step がそれを知っていなければ、小さな勾配はアンダーフローする。"
brief = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
    with torch.autocast(device_type="cuda", dtype=torch.float16):
        loss = loss_fn(model(xb), yb)
    # ____
```

CUDA 上の `float16` での混合精度。空欄を一訓練ステップの三つの呼び出しで埋めて
ください: backward がスケーラの膨らませた損失に対して走り、オプティマイザが
**スケールされたままの勾配を決して適用せず**（勾配に inf を含むステップは飛ばされ
ます）、スケール係数はそのステップの後にだけ調整されるように。
'''
hints = [
  "三つの呼び出しはすべてスケーラを通します。オプティマイザを直接 step すると勾配はスケールされたままです。スケーラは自分がスケールしていない損失の step を拒否し、step する前の update を拒否します。",
]

