`model.parameters()` に現れたりしては **決して** いけません。
'''
hints = [
  "パラメータではない状態のための登記があります: モジュールと一緒に移動し保存されます。下三角のヘルパーがマスクを作り、上三角の兄弟は間違ったものを作ります。",
]

