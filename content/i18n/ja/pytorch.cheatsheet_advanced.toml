ノート PC で dict `sd` として、ローダが **任意のオブジェクトの unpickle を拒否**
するように読み込んでください。
'''
hints = [
  "デバイスの再マップはローダのキーワードであって、返ってきたもののメソッドではありません。安全な unpickle のスイッチはもう一つのキーワードです。結果は dict そのもので、周りにキーはありません。",
]

