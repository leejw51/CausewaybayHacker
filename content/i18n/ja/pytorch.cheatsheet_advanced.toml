[[quest]]
id    = "pytorch.cheatsheet_advanced.04.set-grad-enabled"
title = "一つのスイッチ、どちら向きにも"
story = "同じコンソールスクリプトが訓練パスと検証パスを走らせる。テープが回るかどうかは一つのフラグが決める。"
brief = '''
`train` は Python の `bool` です。一つのブロックが両方のフェーズの順伝播を走らせ、
グラフは **`train` が `True` のときだけ** 記録されなければなりません。
ブロックを開く行はどれでしょう?

```
# ____
    out = model(xb)
```
'''
hints = [
  "あるコンテキストはフラグそのものを引数に取ります。no-grad のものは引数を一切取らず、inference のものは逆の意味のフラグを取ります。",
]

