エントロピーの行はどれでしょう?
'''
hints = [
  "両方を `(N, V)` と `(N,)` に平坦化し — 損失はまさにそれを受け取ります — どのクラス index を飛ばすかをキーワードで伝えましょう。そのキーワードがないとパディングは他のトークンと同じにスコア付けされます。",
]

