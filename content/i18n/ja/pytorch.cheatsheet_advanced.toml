[[quest]]
id    = "pytorch.cheatsheet_advanced.07.register-buffer"
title = "ラックと旅をし、何も学ばない"
story = "因果マスクはモデルがカードへ移るときに一緒に乗り、一緒に保存される。三角形を訓練する者はいない。"
brief = '''
`__init__` の中、`super().__init__()` の後で: `T` × `T` の因果マスク — 対角線上と
その **下** が 1、上が 0 — を `self.mask` として格納してください。`model.to(device)`
