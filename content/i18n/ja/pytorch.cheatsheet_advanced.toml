[[quest]]
id    = "pytorch.cheatsheet_advanced.17.map-location"
title = "カードはここにない"
story = "チェックポイントはクラスタの GPU で書かれた。読むのはラッキー・マックにある、カードなど一枚もないノート PC だ。"
