[[quest]]
id    = "pytorch.cheatsheet_advanced.18.random-split"
title = "八対二、毎回同じ切り方で"
story = "地下室のカメラからのラベル付きフレーム千枚。検証用の五分の一は明日も同じ五分の一でなければならない。"
