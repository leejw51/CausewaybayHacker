[[quest]]
id    = "lua.hacker.27.commands"
title = "入力こそが問題"
story = "線香の屋台のレジのログは八十桁で折り返されて機械から出てくる。そして先頭の数は単語の数ではなくコマンドの数だ。"
brief = '''
一行目は `k`、続く **コマンド** の数です。コマンドは空白区切りのトークンで、残りの行にたまたま折り返されたとおりに詰め込まれています — 一行にいくつでも、空白の量もいくらでも、末尾に空行があるかもしれません。

| コマンド | トークン | 効果 |
| --- | --- | --- |
| `ADD <cents>` | 二つ | 品物を一つ積む |
| `VOID` | 一つ | 最後の品物を取り除く。なければ何もしない |
| `TOTAL` | 一つ | 現在の合計を出力する |
| `CLEAR` | 一つ | すべてを取り除く |

`k` 個のコマンドの後に、`COMMANDS <k>` と `ITEMS <how many are left>` を出力してください。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` はコマンドを数え、`ADD` は二つのトークンからなる一つのコマンドです — なので `k` 回回って一回に一トークン読むループは間違った場所で止まります。`k` 個のコマンドを読み、引数はコマンドが引数を持つときだけ引き出してください — そして「頼んだときに次のトークンを引き出す」ための道具は `gmatch` が返す **イテレータ** です: `local next_token = input:gmatch("%S+")`、そしてどの `next_token()` もトークンをもう一つ、入力が尽きれば `nil` を返すので、入力の終わりはエラーではなく値です。

空のレジでの `VOID` も、何も足される前の `TOTAL` も、どちらも動かなければなりません。問題文にそれが起きないと言う行はなく、本物の選考ではその沈黙が仕様です。空のテーブルに対する `items[#items] = nil` は `items[0] = nil` を書き、それは何もしません — ほかの言語が例外を投げるところで Lua は寛容です — そしてそうだと知っていて、そう言えることが、聞かれたときの答えです。
'''
hints = [
  "gmatch(\"%S+\") はスペース、タブ、改行の連なりのたびに分割するので、行を読むのをやめた瞬間にファイルの中の折り返しは問題でなくなります。",
  "ADD の引数は ADD の分岐の中で、同じイテレータから引き出してください。ループのカウンターが数えるのはトークンではなくコマンドです。",
  "`if #items > 0 then items[#items] = nil end` がガード付きの pop です — Lua ではガードはただですが、それでも書くことは、その場合を見たと言うことです。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまで片付けた地図はどれも歩数を数えていた。トラムは停留所がいくつあるかを気にしない。どれだけ時間がかかるかを気にする — そして今夜は大坑のどの路地も、いつもより時間がかかる。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所と、重み付きの無向の辺 `m` 本。グラフは **まさに** この生成器で、あふれて回り込む 64 ビット演算（ノード 16 と同じく `0ULL + seed`）によって、自分で作ってください:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達できるすべての停留所への最短距離の合計（`0` 自身も含み、それは `0` です）を出力し、次に `MAX <the largest of them>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースの一つは `n = 100000`、`m = 200000` です。どちらにしても正しいアルゴリズムは Dijkstra で、時計が決めるのは優先度付きキューです。スターターは未訪問の停留所を集合 — 停留所をキーにしたテーブル — に持ち、`pairs` で集合を歩いていちばん近いものを見つけます。それはステップごとに `O(V)`、全体で `O(V²)` です: このマシンでは、十秒の実行制限に対して **32 秒**。二分ヒープにすれば `O((V + E) log V)` になり、約六分の一秒で終わります。どちらもこのマシンで、この課題に同梱の二つのプログラムで計測したものです。

はっきり見ておく価値があります。時間制限付きの選考で落ちるいちばんよくあるやり方だからです: **スターターは間違っていません。** まさに正しい答えを出力します。拒まれるのは、あまりに遅れて着くからだけです。

ここに `heapq` はありません: ヒープはノード 12 で渡されたもので、`{ distance, stop }` の項目を持ち、距離で比較します。今回はあなたが書くものです。decrease-key はなく、それは要りません: 改善した距離を新しい項目として push し、pop した項目の距離が記録済みのものよりすでに悪ければ飛ばします。その「古い項目」を飛ばす行こそ人が忘れる行で、それがないとヒープは際限なく膨らみます。`math.huge` が正直な「未到達」です: どの数よりも大きいと比較され、緩和で `nil` の検査を必要としません。
'''
hints = [
  "最初のフィールドをキーにした最小ヒープの中の { distance, stop } の項目: `less` を [1] の比較にまで削った、ノード 12 のヒープです。",
  "距離が dist[u] より大きい項目を飛ばすのが、古い項目の飛ばしです。それがなくてもアルゴリズムは正しいままで、ヒープが廃れた項目で埋まります。",
  "math.huge が正直な「未到達」です: どの数よりも大きいと比較され、緩和で nil の検査を必要としません。生成器の全域木の半分がすべての停留所が到達可能であることを保証するので、最後のフィルタは何も取り除きません — それでも残しておいてください。到達できない停留所のある版が続きの質問だからです。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.hacker.30.range-queries"
title = "変わり続ける合計"
story = "公園じゅうの屋台の一晩分、三十万件のレジ操作。その半分は訂正で、誰かが途中の合計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の操作を実行します。すべて同じ生成器から、あふれて回り込む 64 ビット演算（`0ULL + seed`）で:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

すべての問い合わせの答えの累計を出力し、次に `UPDATES <k>` を出力してください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制されます。** 大きな隠しケースは `n = 500000, q = 300000` です。スターターはノード 23 の答えです: 累積和のテーブルで、それはどの問い合わせも `O(1)` にします — そしてどの更新もそれを壊すので、スターターはそれを作り直します。更新ごとに `O(n)` を、十五万回。このマシンではそれに、十秒の実行制限に対して **57 秒** かかりました。（代わりにただのループで範囲を足しても、種類としては少しも良くなく、実際にも少し良くなるだけです: 更新ごとではなく *問い合わせ* ごとに `O(n)` で、ここでは約 14 秒かかりました。）フェニック木なら全体を百分の数秒でこなします。すべて、この課題のプログラムで計測したものです。

（この課題の Rust 版と Go 版は四百万の操作を実行します。このランドは Python の三十万を保っています。ケースは参照実装のものだからです — そして要点は、正しい構造と間違った構造を分けることで、ある実行環境と別の実行環境を分けることではありません。）

教訓は面接官が釣り上げようとしているものです: *点の更新、範囲の合計* は、まさにフェニック木が存在する理由の形です。短い関数三つ — add、prefix、そして二つの prefix の差としての range — そして `bit.band(i, -i)` がいちばん下の立っているビットで歩を進めるやり方です: `bit` ライブラリは `-i` を 2 の補数の 32 ビット整数として扱い、それがこの技を効かせるものです。

累計は `10^13` を超えます。Lua の数は `2^53` までのすべての整数を正確に保持し、`print` はその十四桁すべてを示します。それがあなたの持つ余裕で、それを知っていることも答えの一部です。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ってください。O(n) の下からの構築は良い最適化ですが、時計が試しているのはそれではありません。",
  "bit.band(i, -i) はいちばん下の立っているビットを取り出します — bit ライブラリは -i を 2 の補数として見ます。それを足すと木を上り、引くと下ります。",
  "range(l, r) は prefix(r + 1) - prefix(l) で、その一つずれの組を正しくするのがデバッグの大半です。bit.band をローカル変数に束縛するのが、この課題に要る唯一の微小最適化で、LuaJIT はそれすらほとんど必要としません。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "トップ二十に入る問題で、たいていの選考で何らかの形で出され、たいていの人が一度書いたことがあって一度も理解していないもの。龍は尾から読んでも同じだ、と面接官は言い、笑わない。"
brief = '''
標準入力は `n alphabet seed` です。文字列は、あふれて回り込む 64 ビット演算（`0ULL + seed`）で自分で作ってください:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` — その長さのもののうち **いちばん左** のものの 0 始まりの開始位置 — を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心の周りに広げます。中心は `n` 個ではなく `2n - 1` 個です: どの文字も奇数長の回文の中心で、二つの文字のあいだのどの隙間も偶数長の回文の中心です。隙間を忘れることが、正しく見える解答が `abba` で `1` を返す理由です — そしてスターターがしているのがそれです。

文字列を文字列として必要とすることは決してありません。引いた値を小さな数のテーブル — `s[i] = next() % alphabet` — に持ち、数を比べてください。二万個の一文字の文字列に対する `..` は、まず二万個の文字列を作ります。テーブルは 1 始まりで問題文の `AT` は 0 始まりなので、出力するインデックスは見つけたインデックスより一つ小さいものです。

**テストが強制するものとしないもの** を、はっきりと。仕事をする隠しケースは、**一** 文字のアルファベットでの `n = 8000` です。それは中心から広げる方法の最悪の場合です — どの中心も文字列の端まで走ります — なので正しい答えはそこで `O(n²)` を全部こなし、三千二百万回の比較で、LuaJIT はそれを百分の数秒でこなします。それはまた、すべての部分文字列を調べてそれぞれを判定するやり方も拒みます。それは三乗で — ここでは `10^11` 回程度の比較 — 十秒の制限のはるか外です。

もう一つの大きなケース、二文字のアルファベットでの `n = 20000` は、速さではなく **正しさ** のケースです: ランダムな二進文字列では、回文の判定は一文字か二文字で失敗します。それはあなたの生成器といちばん左のインデックスでの同点の決着が、大きな規模でこちらのものと一致するかを検査します。

つまり: テストは三乗を拒み、二乗を受け入れます。`O(n)` の答えである Manacher のアルゴリズムは **要求しません**。それが存在することと何をするかは知っておいてください。「で、二乗より良くできますか?」こそ、この問題が通常その前振りとして出される続きの質問だからです。
'''
hints = [
  "中心ごとに広げるのを二回: 奇数長には (c, c)、偶数長には (c, c + 1)。スターターには二つ目が欠けています。",
  "ループが止まったとき、i と j はどちらも回文の一つ外側まで動いています — なので長さは j - i - 1 で、1 始まりのテーブルでは i がすでに 0 始まりの開始位置です。",
  "厳密に長い回文のときだけ更新すれば、各長さのいちばん左のものが保たれ、それが AT の求めるものです。s[0] は回り込んだ文字ではなく nil で、nil == s[j] はただ偽です — それでも `i >= 1` の検査は、書くべき正直なものです。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "lua.hacker.32.modular"
title = "十億七を法として"
story = "その言い回しは問題文の最後に現れ、部屋の半分はそれが何をしろと言っているのかわからない。この部屋ではもう一つ求めている: 五十三ビットを保持する数を、二回掛けること。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを、あふれて回り込む 64 ビット演算（`0ULL + seed`）で生成してください:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて、二項係数 `C(a, b)` を **1000000007 を法として** 計算してください。`q` 個すべての答えの合計を、それ自体も `1000000007` を法として出力し、次に `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は何十万桁もあり、Lua のどれもそれを保持できません。どの掛け算も進みながら縮約します。問題は割り算です: `a! / (b! (a-b)!)` はモジュラー演算では意味を持ちません。代わりになるのは **モジュラー逆元** で、`1000000007` は素数なので、フェルマーの小定理がそれをくれます: 繰り返し二乗法による `inverse(v) = v^(p-2) mod p` — ここでの `^` は浮動小数点のべき乗でそれはできないので、ループはあなたのものです。

つまり: `factorial[0..n]` を一度だけ前計算し、各問い合わせに `f[a] * inv(f[b]) * inv(f[a-b])` として答えます。

**そしてこの言語では、掛け算そのものが罠です。** 二つの剰余はそれぞれ `2^30` 未満で、その積は `2^60` 未満で、Lua の数は `2^53` を保持する double です。`(a * b) % P` はそこを越えると間違います — エラーでもオーバーフローでもなく、ただ下位ビットが消えて、剰余が少しずれるだけです。正直な `mulmod` は一方の因数を上位と下位の 16 ビットの半分に分けて、それぞれの部分積を `2^46` 未満に保ち、半分のあいだで縮約します。それは五行でスターターが持っています。このノードのどの積もそれを通ります。

**ここでは計算量が強制されます。** 隠しケースの一つは `n = 200000`、`q = 200000` です。各係数を独立に計算する — `b` 項を掛け、`b` 項で割り、それぞれモジュラー逆元一つ — のは、十秒の実行制限に対して **25 秒** 経っても終わっていませんでした。それがスターターです。共有された階乗のテーブル一つと、一回の `powmod` から後ろ向きに前計算した逆階乗があれば、どの問い合わせにも `mulmod` 二回で答え、百分の数秒で終わります。どちらもこのマシンで計測したものです。
'''
hints = [
  "掛け算のたびに縮約し、掛けるのは mulmod を通してだけにしてください: 二つの剰余のただの a * b は 2^53 を越えて、黙って間違います。",
  "powmod(v, P - 2) がモジュラー逆元で、それが効くのは P が素数だからにすぎません — それがここでのフェルマーの小定理の中身のすべてです。",
  "逆階乗も、powmod(factorial[n], P - 2) から後ろ向きに前計算してください: inv_factorial[i - 1] = inv_factorial[i] * i。そうすれば問い合わせは mulmod 二回で、powmod はまったく要りません。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "lua.hacker.33.grid-paths"
title = "街区を横切る、決して戻らずに"
story = "龍のために三本の路地が閉鎖された大坑のグリッド。横切る道は何通りあり、どれがいちばん安いか。"
brief = '''
標準入力は `r c pct seed` です。グリッドは行優先の順で、各セルについて **二つ** の値を引き、あふれて回り込む 64 ビット演算（`0ULL + seed`）で自分で作ってください:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

通れるセルを通って、**右** か **下** にだけ動きます。出力してください:

1. `PATHS <k>` — `(0,0)` から `(r-1,c-1)` への相異なる経路がいくつあるか、`1000000007` を法として
2. `MIN <cost>` — 経路の合計コストの最小値、両端を数えて。経路がなければ `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

行優先の順の一回の走査で両方ができます: あるセルの経路数は上からと左からそこに入る経路数の和で、その最良コストは自分のコストにその二つの安いほうを足したものです。右か下にしか動かないので、必要な二つのセルは常にもう終わっています — だからこれには再帰も訪問済み集合も要りません。メモ化した再帰もセルに対して線形ですが、`1000 × 1000` のケースでは二千フレームの深さにもなります — たまたま LuaJIT の天井の下ですが、ここではいつもの理由でループが答えです: 問題の形が、順に埋めるテーブルだからです。

`PATHS` の数がいつもの理由で `1000000007` を法として取られるのは: `1000 × 1000` の隠しケースでは本当の数は六百桁を超え、double ならとっくに `inf` にしていたでしょう。足しながら縮約してください — 二つの剰余を足しても `2^31` 未満に収まるので、ここはこの道でただの `+` と `%` で足りる唯一の場所です。

到達できないセルには最良コストが **ありません**: `nil` で、`nil` は何かを足したり比べたりする前に `~= nil` で検査します。`1000 × 1000` のテーブルのテーブルは百万個の項目で、LuaJIT は気にしません。

**大きなケースが強制するもの:** 経路を列挙するどんな答えも拒みます。経路は公園の提灯の数より多くあります。
'''
hints = [
  "両隅も含め、すべてのセルについて両方の値を引いてください — 生成器は隅を飛ばさず、ふさぐのを拒むだけです。",
  "上にも左にも通れる隣がない通れるセルは、零通りの経路で到達でき、最良コストを持ちません。nil が正直な「到達不能」で、`~= nil` が比べたり足したりする前のガードです。",
  "目的地は通れても到達できないことがあり、それこそ PATHS が 0 で MIN が -1 になるときです。隠しケースの一つがそれです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "lua.hacker.34.stable-sort"
title = "同点は場所を保つ"
story = "二人の使い走りが龍の巡回を同じスコアで終え、リーダーボードは描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。`n` 人のライダーを作ってください。ライダー `i` はインデックス `i` とスコアを持ち、あふれて回り込む 64 ビット演算（`0ULL + seed`）で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

ライダーをスコアの **降順** に並べ替えてください。同じスコアのライダーは到着した順を保たなければなりません。インデックスをスペース区切りで出力し、次に `TIES <k>` — 並べ替えた順で隣り合う組のうちスコアが等しいものがいくつあるか — を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ全面的に、それらに何が起きるかで決まります。

**これは、自分がどのソートを手にしているかを知ることについての課題です。** `table.sort` は **安定ではありません**。クイックソートで、等しいと比較される要素の順については何も約束せず、その約束しないことを守ります: サンプルをただの `a.score > b.score` で並べ替えると、同点は `5 1 6 0 4 3 2 7` と出てきます — それがスターターのすることです。何も例外を投げません。答えはただ、この入力では違う答えで、本物の入力ではいつもそうなるでしょう。

ここには正しい答えが一つあり、それはどの言語でもまず手を伸ばすべきものです: 比較を **全順序** にすること。`(-score, index)` — スコアの降順、次にインデックスの昇順 — で並べ替えれば、二人のライダーが等しいと比較されることは決してなく、安定性はもはや問題でなくなります。全順序には証明すべきものが何もありません。（Python の面接が受け入れるもう一つの答え、「ソートは安定だから、それに頼る」は、この部屋では使えません。そしてそれを知っていることが要点です。）

時計はここで速さを測っておらず、測るものもありません: どの比較関数を渡しても `table.sort` は `table.sort` です。この四つのケースは、同点に何が起きるかだけで決まります。
'''
hints = [
  "比較関数に後半を足してください: スコアが等しいときは a.index < b.index を返す。それが直すことのすべてです。",
  "`<=` と言ったり、どちら向きにも true を返したりする比較関数は決して書かないでください — `invalid order function for sorting` は、その順序が順序ではないと table.sort が言っているのです。",
  "TIES は出来上がった順で隣り合う等しいスコアを数え、その数はどの比較関数を書いても同じです — 馬脚を現すのはインデックスの順です。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.hacker.28.lru"
title = "月"
story = "ルーム 7-32、最後の問題、八回目。面接官がモニターを消し、ホワイトボードを照らすのは窓から差す月の光だけ: あらゆる構造にテーブル型が一つ、そして時計。"
brief = '''
一行目は `cap q` で、続いて `q` 行の操作があり、それぞれ `PUT <key> <value>` か `GET <key>` です — あるいは、一行目が **三つ目** の数 `seed` を持つときは、それ以上の行はまったくなく、`q` 個の操作は下の生成器から来ます。

満杯のときに **最も長く使われていない** 項目を追い出す、固定容量のキャッシュを実装してください。`GET` も `PUT` もキーを使ったことに数えます。キャッシュがすでに持っているキーへの `PUT` はその値を置き換えて最新にします — 項目を足さないので、キャッシュがどれだけ満杯でも何も追い出しません。

各 `GET` について値を、なければ `-1` を出力してください。最後に、生き残ったキーを最近使った順にスペース区切りで — キャッシュが空なら `-` を — 出力し、次に `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルを追ってください: `GET 1` は `1` を再び最新にするので、`PUT 3` が場所を必要としたとき出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たって `3` を最新にし、だから生き残りは `3 1` と出力されます。

生成される形は、あふれて回り込む 64 ビット演算（`0ULL + seed`）で:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**スターターは間違っていて、サンプルがそれを示しています。** スターターはキャッシュを二つのテーブル — 値のための `cache[key]` と、古い順のキーの列である `order` — に持ち、`order[1]` を追い出します。新しいキーの `PUT` は `order` に追加します。`GET` は `cache[key]` を読み、ほかには何もしません。テーブルを読んでもその中の何も動かないからです: テーブルはキーに何があるかを覚えていて、最後にいつ見たかは覚えていません。だからキャッシュは **最も長く使われていない** ものではなく **最初に** 入ってきたキーを追い出し、サンプルでは `GET 2` が `20` を出力します。

それがボスです。このランドではすべてがテーブルで、テーブルには読まれた記憶がありません。最近さは *書かなければならない* ものです — 挿入のときだけでなく、当たるたび、上書きするたびに — そしてその書き込みを `O(1)` にする構造は教科書のものです: 双方向連結リストへのハッシュテーブル。ポインタを隠した `OrderedDict` はありません。ここではポインタはフィールドです: ノードは `{ key = k, value = v, prev = p, next = n }` で、`nodes[key]` がそれを見つけ、それを外して熱い端に付け直すのは代入四つで、冷たい端は `head.next` です。両端の番兵のテーブル二つがあれば、リストのコードのどこにも `nil` の検査は要りません。どの操作も `O(1)` で、ためらわずにそう言えます。

スターターの `table.remove(order, 1)` は間違っているうえに `O(cap)` で、その `order` が正体を明かしています: 列は誰が先に来たかは言えますが、触れるたびにキーを末尾へ移すのは探索とずらしで、連結リストこそ、自分で作ったときの「定数時間で末尾へ移す」の姿です。

（この面接の Python 版ではボスは再帰の上限で、二千操作の隠しケースはここにもまだあります。スターターは操作を再帰で歩き — `step` の最後で `return step(i + 1)` — それを通り抜けます。それは **真の末尾呼び出し** だからです: Lua はフレームを使い回し、末尾呼び出しはいくつあってもコストがかかりません。末尾でないフレームが二万個ほどのところに `stack overflow` が住んでいます。両方の事実を知っておいてください。再帰は決してこの問題の形ではなく、操作の列は `for` ループです。）
'''
hints = [
  "スターターでサンプルを追ってください: GET 1 は cache[1] を読み、order はまだ { 1, 2 } なので、PUT 3 は 1 を追い出し、GET 2 は 20 を見つけます。触れたらキーを動かさなければならず、GET は触れることです。",
  "ノードは { key, value, prev, next } です。外すのは代入二つ、熱い端に付けるのは四つ。先頭と末尾の番兵があれば、どちらの端にも nil はなく、空のリストの特別な場合もありません。",
  "すでにあるキーの上書きは挿入ではなく、触れることです — キャッシュが満杯だと決める前に nodes[key] を検査してください。さもないと上書きの場合に、追い出すべきでないものを追い出します。",
  "生き残りは熱い端から読んだリストです: tail.prev から head まで戻って歩きます。ソートなし、印なし、そして決して pairs は使わない — pairs には渡せる順がありません。",
]
