id    = "pytorch.cheatsheet.11.cross-entropy"
title = "生のスコア"
story = "地下の分類器が出すのは確率ではなく生のスコアだ。審判はどちらなのかを知っていなければならない。"
brief = '''
`logits` の形は `(B, C)` で、正規化されていない生のスコアです。`target` の形は `(B,)` で、クラスの添字を持ちます。正しい分類の損失はどの行ですか？
'''
hints = [
  "この中の一つの損失は自分で log-softmax をかけます。生のスコアを、手を加えずに渡しましょう。",
]

