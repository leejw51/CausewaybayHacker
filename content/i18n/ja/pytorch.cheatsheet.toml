# PYTORCH LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1):
# the prose of `content/pytorch/cheatsheet.toml`, quest by quest, and nothing
# else. The question is the brief; the four choices are code and live in the
# English pack only. Code blocks and identifiers are copied verbatim, never
# translated.

pack   = "pytorch.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.cheatsheet.01.zeros"
title = "まっさらな板"
story = "23:00、周亦卿樓の地下のマシンルーム。今夜最初のテンソルは全部ゼロだ。"
brief = '''
`import torch` は済んでいます。形が `(2, 3)` のゼロの **torch** テンソル `x` を作ってください。
'''
hints = [
  "サイズは呼び出しの引数に入れます。NumPy の関数では tensor ではなく ndarray が返ってきます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.cheatsheet.02.to-device"
title = "float にして、カードへ"
story = "ラベルは CPU 上の整数で届いた。ラック 3 の GPU は float を欲しがっている。"
brief = '''
`x = torch.tensor([1, 2, 3])` は CPU 上の `int64` で、`device = "cuda" if torch.cuda.is_available() else "cpu"` です。`x` を `device` 上の `float32` テンソルにする行はどれですか？
'''
hints = [
  "`.to` は新しいテンソルを返し、元のものはそのままです。返ってきたものを取っておきましょう。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.cheatsheet.03.eval-mode"
title = "照明を落として"
story = "中央図書館の端末で試験の夜。本番の問題では Dropout は当て推量をやめる。"
brief = '''
`model` には `Dropout` 層と `BatchNorm` 層があります。テストセットを採点する前に、それらの層を推論時の動作に切り替える行はどれですか？
'''
hints = [
  "どの nn.Module も training フラグを持っています。メソッドを一つ呼べば、そのモジュールと子すべてでオフになります。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.cheatsheet.04.view"
title = "四つずつ三列"
story = "シュガー・ストリートの倉庫に荷物が十二個一列に並び、棚は三段だ。"
brief = '''
`x = torch.arange(12)` の形は `(12,)` です。同じ数で **3 行 4 列**の `y` を作ってください。
'''
hints = [
  "新しいサイズは行から順に並べ、その積は要素数と等しくなければなりません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.cheatsheet.05.argmax"
title = "勝ったクラス"
story = "天后のトラム停留所の数字読み取り機は、一行ごとに十クラスを採点する。一行に一つの数が勝たなければならない。"
brief = '''
`logits` の形は `(batch, classes)` です。各行で最良のクラスの添字を、形 `(batch,)` の `pred` として返す行はどれですか？
'''
hints = [
  "`dim` は縮約されて消える軸を指します。クラスは dim 1 に沿って並んでいます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.cheatsheet.06.unsqueeze"
title = "行ではなく列"
story = "ラッセル・ストリートの店の家賃が三つ、手数料が四か月分。すべての組が出会わなければならない。"
brief = '''
`x` の形は `(3,)`、`y` の形は `(4,)` です。`x + y` が形 `(3, 4)` にブロードキャストされるように `x` の形を変える行はどれですか？
'''
hints = [
  "ブロードキャストは右から形をそろえます。`x` には自分の軸の後ろに、サイズ 1 の新しい軸が必要です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.cheatsheet.07.backward"
title = "傾き"
story = "利舞臺へ上がるエスカレーターには傾きがある。グラフはそれを知っている。誰かが尋ねなければならない。"
brief = '''
```
w = torch.tensor(2.0, requires_grad=True)
y = w * w
```

`w.grad` を dy/dw、つまり 4 で埋める行はどれですか？
'''
hints = [
  "勾配は出力から逆向きに流れるので、呼び出すのは葉ではなく結果に対してです。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.cheatsheet.08.no-grad"
title = "今夜はグラフなし"
story = "夜勤はメーターを読むだけ。数字がどう作られたかの記録は誰もいらない。"
brief = '''
autograd のための**グラフを記録せずに**、検証バッチでモデルを実行してください。ブロックを開く行はどれですか？

```
# ____
    out = model(xb)
```
'''
hints = [
  "これはコンテキストマネージャーです。その下にインデントされたブロックは勾配の追跡がオフの状態で動きます。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.cheatsheet.09.step-order"
title = "ものごとの順番"
story = "台を片付け、品物を量り、それからお釣りを渡す。街市の順番は決して変わらない。"
brief = '''
`loss` はこのバッチから計算したばかりで、`opt` はオプティマイザーです。三つの呼び出しのどの順番が、正しい一回の学習ステップですか？
'''
hints = [
  "勾配は累積するので、古いものを消し、新しいものを計算し、それから使いましょう。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.cheatsheet.10.super-init"
title = "まず親から"
story = "コーズウェイ・ベイの新しい屋台は、看板を掛ける前に大家の書類が要る。"
brief = '''
```
class Net(nn.Module):
    def __init__(self):
        # ____
        self.fc = nn.Linear(4, 2)

    def forward(self, x):
        return self.fc(x)
```

`__init__` の最初に来なければならず、なければ `self.fc` への代入が失敗する行はどれですか？
'''
hints = [
  "nn.Module は自分のコンストラクタで層の登録簿を準備します。層を足す前にそれを実行しましょう。",
]

