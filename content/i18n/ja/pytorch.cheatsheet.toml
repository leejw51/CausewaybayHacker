brief = '''
`x` の形は `(5, 3)` です。ブロードキャストは形を右からそろえるので、`(5, 1)` は `(5, 3)` を行ごとに割ります。`x / s` が各行を正規化するように、形 `(5, 1)` の行の和 `s` を作る行はどれですか？
