`ds` は `TensorDataset` で、`DataLoader` は `torch.utils.data` からインポート済みです。`loader` が 32 個ずつのバッチを**エポックごとに新しいランダムな順番で**返すようにする行はどれですか？
'''
hints = [
  "シャッフルは頼まない限りオフで、バッチサイズのキーワードは省略せずに書きます。",
]

