# ---------------------------------------------------------------- 26
[[quest]]
id    = "remix.cheatsheet_advanced.26.json-rust"
title = "波括弧を二重に"
story = "ラッキー・マックのノート PC にクレートはない。だからフェリスは JSON を手で書き、フォーマット文字列が彼の波括弧を食う。"
brief = '''
**Rust** で、std のみ — serde なし。`p.name` は `String` の `"Mei"` で、`p.age` は
