title = "ボス: 位置パターン"
story = "最後のノード、タイムズスクエア。ニシキヘビの素のクラスは、どの属性がどの順で数えられるかを言うまで、位置では一致しない。"
brief = '''
**Python** 3.12 で、`Pt` は素のクラスです — dataclass では **ありません**:

