        # ____
```

呼び出し側は `__cause__` が元の `KeyError` **そのもの** である `NotFound` を捕まえ
なければなりません。穴に入る行はどれでしょう?
'''
hints = [
  "except ブロックの中で送出すると context は自動的に記録されます。cause は明示的に名指ししなければならず、cause に `None` を指定すると黙らせます。",
]

