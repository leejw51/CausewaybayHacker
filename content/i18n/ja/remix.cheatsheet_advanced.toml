# REMIX LAND — CHEATSHEET ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/remix/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and live in the
# English pack only. Code blocks and identifiers are copied verbatim, never
# translated.

pack   = "remix.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet_advanced.01.handoff-go"
title = "引き渡せ"
story = "06:50、ジャーディンズ・バザール。メイはキオスクに数を一つ頼み、キオスクはまだ作ってもいないのに彼女が受け取るのを待つ。"
brief = '''
**Go** で、`main` には `ch := make(chan int)` — **バッファなし** — があり、後で
`x := <-ch` をします。`compute()` は `int` を返します。その二つの間に置いて、
`main` をデッドロックさせずに `compute()` の結果を `x` に届ける行はどれでしょう?
'''
hints = [
  "バッファなしの送信は誰かが受信するまでブロックします。送信側は受信側とは別のゴルーチンでなければなりません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.cheatsheet_advanced.02.handoff-rust"
title = "引き渡せ、フェリス"
story = "フェリスは同じ数をラッキー・マックのカウンター越しに運び、カウンターはトレイを借りさせてくれない。"
brief = '''
**Rust** で、`let (tx, rx) = mpsc::channel::<i32>();` があり、`main` は
`let v = rx.recv().unwrap();` で終わります。`compute()` は `i32` を返します。
その二つの間で、`compute()` の結果を `v` に届けるスレッドを始める — そして
コンパイルできる — 行はどれでしょう?
'''
hints = [
  "spawn されたクロージャは main のスタックフレームより長生きするかもしれないので、送信側を借用できません。所有しなければなりません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "remix.cheatsheet_advanced.03.handoff-python"
title = "引き渡せ、ゆっくりと"
story = "街市の価格板のニシキヘビは同じ数を三度目に、スレッドで受け取る。今度は本当に始めなければならない。"
brief = '''
**Python** で、`q = queue.Queue()` があり、`main` は `v = q.get()` で終わります。
`compute()` は `int` を返します。その二つの間で、`compute()` を **新しいスレッド** で
走らせてその結果を `v` に届ける — `q.get()` が永遠に待たずに返るようにする — 行は
どれでしょう?
'''
hints = [
  "`target` は引数なしで呼べるものを欲しがります。作られただけで start されない Thread は何もしません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.cheatsheet_advanced.04.counter-go"
title = "一度に一つ"
story = "ラッキー・マックのシェフ・ボーの注文カウンタ: コック二人、それぞれ千回の刻み、板はちょうど二千と言わなければならない。"
brief = '''
**Go** で、

```
type C struct {
    mu sync.Mutex
    n  int
}

func (c *C) Inc() {
    // ____
    c.n++
}
```

二つのゴルーチンがそれぞれ `Inc` を 1000 回呼びます。どの実行でも `c.n` が
ちょうど 2000 になり、`go test -race` でもクリーンで、ミューテックスを保持したままに
決してしない行はどれでしょう?
'''
hints = [
  "インクリメント自体はロックを保持している間に起きなければならず、アンロックはメソッドが戻るときに予約されなければなりません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.cheatsheet_advanced.05.counter-rust"
title = "一度に一つ、フェリス"
story = "四匹のカニ、一つの集計、怡和街。フェリスはハサミにガードを持っていて、それでも足せない。"
brief = '''
**Rust** で、`let counter = Arc::new(Mutex::new(0));` があり、spawn された各スレッドは
`let c = Arc::clone(&counter);` を持ちます。スレッドのループの中で、共有された数に
1 を足す — そしてコンパイルできる — 行はどれでしょう?
'''
hints = [
  "ロックは Result を返します。その中にガードがあり、算術の前にガードを参照外ししなければなりません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.cheatsheet_advanced.06.counter-python"
title = "一度に一つ、と GIL は言った"
story = "7-32 号室は夜勤のチケットを四つのスレッドで数える。GIL は `+=` について何も約束しない。"
brief = '''
**Python** で、`lock = threading.Lock()` はすべてのスレッドが共有する唯一のロックで、
`n = 0` はグローバルです:

```
def work():
    global n
    for _ in range(100_000):
        # ____
            n += 1
```

四つのスレッドが `work` を走らせます。どの実行でも `n` がちょうど 400000 になる —
すべてのスレッドが **同じ** ロックで順番を待つ — 行はどれでしょう?
'''
hints = [
  "ロックオブジェクトはそれ自体がコンテキストマネージャです。acquire() が返すものはそうではありません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "remix.cheatsheet_advanced.07.wait-go"
title = "四人とも戻った"
story = "四人の配達員が糖街の集配所を出る。ドアは全員がサインインし直して初めて施錠される。"
brief = '''
**Go**（1.22 なので `i` は反復ごとに新しい）で:

```
var wg sync.WaitGroup
for i := 0; i < 4; i++ {
    wg.Add(1)
    // ____
}
wg.Wait()
```

`work(i)` を自分のゴルーチンで始め、四つの `work` 呼び出しがすべて **終わった**
ちょうどそのときに `wg.Wait()` が戻る — デッドロックなし、早すぎる return なし —
行はどれでしょう?
'''
hints = [
  "work が戻った後に、その仕事をしたゴルーチンの上で何かが Done を呼ばなければなりません。そして go 文には呼び出しが要ります。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "remix.cheatsheet_advanced.08.wait-rust"
title = "四人とも戻った、フェリス"
story = "フェリスは屋台自身の価格表を三人のヘルパーに同時に貸し出し、シャッターが下りる前に、箱に入れずに返してほしい。"
brief = '''
**Rust** で、`let v = vec![1, 2, 3];` と `fn work(x: &i32) -> i32`:

```
thread::scope(|s| {
    for x in &v {
        // ____
    }
});
```

要素ごとに一つ、`v` を直接借用する — `Arc` なし、`'static` なし — スレッドを始め、
スコープが終わるときに join される行はどれでしょう?
'''
hints = [
  "フリー関数ではなくスコープのハンドルを通して spawn し、値ではなくクロージャを渡しましょう。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "remix.cheatsheet_advanced.09.wait-python"
title = "四人とも戻った、順番どおりに"
story = "ニシキヘビは市場の運搬人に四つの仕事を渡し、仕事が出ていった順でレシートを返してほしい。"
brief = '''
**Python** で、`jobs` はリストで `work(j)` は `int` を返します:

```
with ThreadPoolExecutor(4) as ex:
    # ____
print(out[0], len(out))
```

プールのスレッドで `jobs` に対して `work` を走らせ、`out` を仕事の順の **結果の
リスト** にして `print` が動くようにする行はどれでしょう?
'''
hints = [
  "executor 自身の map は順序を保ちますが、遅延イテレータを返します。submit は future を返します。どちらも添字で引けません。",
]

