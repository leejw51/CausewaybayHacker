'''
hints = [
  "フォーマット文字列のリテラルの波括弧は二つ重ねて書きます。一つだけだとプレースホルダが開きます。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "remix.cheatsheet_advanced.27.json-python"
title = "入れ子の dataclass"
story = "メイの住所は dataclass の中の dataclass で、`json` は助けなしにはどちらの中も見ようとしない。"
brief = '''
**Python** で、

```
@dataclass
class Addr:
    street: str
    floor: int

@dataclass
class P:
    name: str
    addr: Addr
```

`p = P("Mei", Addr("Jardine's Bazaar", 5))`。`s` に JSON テキスト
`{"name": "Mei", "addr": {"street": "Jardine's Bazaar", "floor": 5}}` — 二重引用符、
入れ子のオブジェクト、すべて込み — を与える行はどれでしょう?
'''
hints = [
  "`json` は dict とリストしか知りません。dataclasses モジュールには入れ子の dataclass に再帰する変換器があり、`vars` は最初の一段で止まります。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "remix.cheatsheet_advanced.28.match-go"
title = "case ごとに一つの型"
story = "アレックスは一行節約しようと一つの case に二つの整数型を列挙し、`v` は彼の手元でインタフェースに戻ってしまう。"
brief = '''
**Go** で、

```
func describe(x any) string {
    switch v := x.(type) {
    // ____
        return strconv.Itoa(v * 2)
    case string:
        return v
    }
    return "?"
}
```

`describe(21)` が `"42"` を返す — そしてコンパイルできる — case の行はどれでしょう?
'''
hints = [
  "`v` は case がちょうど一つの型を名指しするときだけその case の型になります。二つ名指しすると `v` はまだ `any` で、掛け算できません。",
]

