# ---------------------------------------------------------------- 18
[[quest]]
id    = "remix.cheatsheet_advanced.18.closure-python"
title = "整理券の機械、入れ子"
story = "ニシキヘビの機械はずっと整理券 1 番を印字し続ける。内側の関数がこっそり自分の `c` を作ってしまったからだ。"
brief = '''
**Python** で、

```
def counter():
    c = 0
    def nxt():
        # ____
        c += 1
        return c
    return nxt
```

`n = counter(); n(); n()` は 1、次に 2 を返さなければならず、モジュールレベルの `c` は
ありません。穴に入る行はどれでしょう?
'''
hints = [
  "代入は、どの外側のスコープのものか言わない限り、名前を最も内側の関数のローカルにします — そしてモジュールはそのスコープではありません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "remix.cheatsheet_advanced.19.error-go"
title = "どのキーがなかったか"
story = "アレックスに届くエラーはパーシヴァル・ストリートのキャッシュから上がってくる途中で二度包まれた。それでも彼はキーが欲しい。"
brief = '''
**Go** で、

```
type NotFound struct{ Key string }

func (e *NotFound) Error() string { return e.Key + " not found" }

func load(k string) error {
    return fmt.Errorf("load: %w", &NotFound{Key: k})
}
```

`err := load("tea")`。`err` の中の `*NotFound` に届いて `nf.Key` を出力できるように
する — panic なしで — 行はどれでしょう?
'''
hints = [
  "素の型アサーションは外側の包みしか見ません。*型*のためのアンラップヘルパーはその型の変数へのポインタが要ります。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "remix.cheatsheet_advanced.20.error-rust"
title = "どのキーがなかったか、フェリス"
story = "フェリスはラッキー・マックのナプキンにエラーの Display を手で書いた。`?` はまだそれを Box に入れてくれない。"
brief = '''
**Rust** で、std のみ — クレートなし:

```
#[derive(Debug)]
struct NotFound(String);

impl fmt::Display for NotFound { /* "<key> not found" */ }

// ____

fn load(k: &str) -> Result<i32, Box<dyn Error>> {
    Err(Box::new(NotFound(k.into())))
}
```

穴に入れて `load` をコンパイルさせ、呼び出し側が `?` を使えるようにする行は
どれでしょう?
'''
hints = [
  "Debug と Display がそろっていれば、エラートレイトにはもう求めるものがありません — しかし、それでも空の本体で実装しなければなりません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "remix.cheatsheet_advanced.21.error-python"
title = "どのキーがなかったか、そしてなぜ"
story = "ニシキヘビは市場の KeyError を自分のものとして送出し直す。トレースバックはそれでも、どこで始まったかを示さなければならない。"
brief = '''
**Python** で、`class NotFound(KeyError): pass` と

```
def load(k):
    try:
        return d[k]
