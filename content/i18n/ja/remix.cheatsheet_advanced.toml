[[quest]]
id    = "remix.cheatsheet_advanced.10.shape-go"
title = "誰が Shape か"
story = "パーシヴァル・ストリートのアレックスはタイムズスクエアの平面図から正方形を切り出し、コンパイラはそれは shape ではないと言う。"
brief = '''
**Go** で、

```
type Shape interface{ Area() float64 }

type Sq struct{ s float64 }

func (q *Sq) Area() float64    { return q.s * q.s }
func (q *Sq) Scale(k float64)  { q.s *= k }
```

2×2 の正方形を `s` に入れる — そしてコンパイルできる — 行はどれでしょう?
'''
hints = [
  "レシーバを見ましょう。メソッド集合はそれが宣言された型のもので、Sq の値はその型ではありません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "remix.cheatsheet_advanced.11.shape-rust"
title = "誰が Shape か、フェリス"
story = "フェリスはラッキー・マックのナプキンにトレイトを書いた。正方形はそれに署名すればいいだけだ。"
brief = '''
**Rust** で、

```
trait Shape {
    fn area(&self) -> f64;
    fn describe(&self) -> String { format!("{:.1}", self.area()) }
}

struct Sq { s: f64 }
// ____
```

`Sq { s: 2.0 }.describe()` が `"4.0"` を返すようにする行はどれでしょう?
'''
hints = [
  "トレイトは型に対して実装します。逆向きは決してありません。そしてメソッドのレシーバはトレイトのものと正確に一致しなければなりません。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.cheatsheet_advanced.12.shape-python"
title = "誰が Shape か、アヒルの鳴き声"
story = "ニシキヘビは正方形が何を継承しているかは気にせず、`area` に応えるかだけを気にする — そして `isinstance` はそれを書面で欲しがる。"
brief = '''
**Python** 3.12 で、`Sq` は `area(self) -> float` メソッドを持ち基底クラスのない
素のクラスです:

```
# ____
class Shape(Protocol):
    def area(self) -> float: ...
```

import は示していません。`isinstance(Sq(2), Shape)` が `TypeError` を出す代わりに
`True` と答えるように、穴に入る行はどれでしょう?
'''
hints = [
  "Protocol は、インタプリタが実行時に検査してよいものだと印を付けない限り静的な約束です。その印は `typing` にあります。",
]

