# ---------------------------------------------------------------- 15
[[quest]]
id    = "remix.cheatsheet_advanced.15.generic-python"
title = "どの二つでも大きいほう、境界付きで"
story = "ニシキヘビの型チェッカは、二つの価格を通す前に `<` が何を意味するか知りたがる。"
brief = '''
**Python** 3.12 で、`Comparable` は `__lt__` を持つ `Protocol` です:

```
from typing import TypeVar

# ____

def smallest(a: T, b: T) -> T:
    return a if a < b else b
```

`Comparable` である型だけが使えるように `T` を宣言し — そしてモジュールの import 時に
例外を出さない行はどれでしょう?
'''
hints = [
  "TypeVar は名前を最初に取ります。その後、上限の型一つはキーワードに入り、裸の位置引数の型は制約で、少なくとも二つ必要です。",
]

