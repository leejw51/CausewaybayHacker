# C++ LAND — CHEATSHEET ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/cpp/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks, identifiers and printed
# strings are copied verbatim.

pack   = "cpp.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet_advanced.01.auto-params"
title = "どの二つでも"
story = "ヘネシー・ロードの両替商はドルの運賃にセントのチップを足す。型の組み合わせごとに別の関数は書きたくない。"
brief = '''
`add` を **一つ** の定義で、`add(1, 2.5)` がコンパイルできて `3.5` を返し、
`add(std::string("a"), "b")` もコンパイルできるように定義してください。C++20。
'''
hints = [
  "C++20 からは、パラメータリストのプレースホルダがそれだけで関数をテンプレートにします — そして各プレースホルダはそれぞれ別の型です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.cheatsheet_advanced.02.constrained-member"
title = "箱の外へ"
story = "SOGO の棚卸しは整数個の品だけの累計を持つ — そしてそれを報告するメンバは .cpp の中、クラスの外で定義されている。"
brief = '''
```cpp
template <std::integral T>
struct Stat {
  T s = 0;
  void add(T x) { s += x; }
  T sum() const;
};
```

`sum` を構造体の **外** で定義してください。`<concepts>` は include 済みです。
'''
hints = [
  "クラステンプレートのクラス外メンバはテンプレートヘッダを繰り返します — そしてそれは制約も含めて同じヘッダでなければなりません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.cheatsheet_advanced.03.mutable-capture"
title = "整理券の機械"
story = "ラッキー・マックのカウンターの整理券機は 0、1、2 と配る — 自分で数を持ち、外にはカウンタ変数が一つもない。"
brief = '''
`next` を、続けて呼ぶと `0`、次に `1`、次に `2` を返す呼び出し可能オブジェクトに
してください。**ラムダの外には `n` という名前の変数は存在しません。**
'''
hints = [
  "キャプチャは角括弧の中でそのまま初期化できます。ラムダの呼び出し演算子は、そう言わない限り `const` です — そして後置と前置のインクリメントの違いに注意。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.cheatsheet_advanced.04.this-capture"
title = "私も数えて"
story = "銅鑼湾駅の改札はクリッカーを配る。クリックはどれも改札自身の集計に載らなければならず、そのコピーに載ってはいけない。"
brief = '''
```cpp
struct Counter {
  int count = 0;
  std::function<void()> ticker();
};
```

`ticker` の中でラムダを返してください。それを二回呼ぶと、**このオブジェクトの**
`count` が `2` になっていなければなりません。
'''
hints = [
  "データメンバは変数ではないので、名前でキャプチャリストに置けません。オブジェクトをキャプチャしましょう — ポインタで、本物が変わるように。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.cheatsheet_advanced.05.recursive-lambda"
title = "自分を呼ぶ"
story = "ジャーディンズ・バザールのパン屋の菓子職人は、エッグタルトの集計を自分自身を呼ぶ関数として書く — main の中で、名前付き関数はどこにもなしに。"
brief = '''
`fib` を **自分自身を呼ぶ** ローカルなラムダとして、`fib(10)` が `55` を返すように
定義してください。`<functional>` は include 済みです。
'''
hints = [
  "`auto` 変数は自分の初期化子の中に現れることができません。呼び出し可能な型を宣言した変数ならできます — そしてラムダはそれをキャプチャしなければなりません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.cheatsheet_advanced.06.if-constexpr"
title = "一つの分岐だけ"
story = "台風シェルターの桟橋の計量台は木箱の数かラベルを受け取る — そして渡されたものに意味をなさない分岐のコンパイルを拒む。"
brief = '''
```cpp
template <typename T>
auto weigh(const T& x) {
  // one line here
}
```

`T` が整数型なら `x * 2` を、そうでなければ `x.size()` を返してください。
`weigh(21)` と `weigh(std::string("abc"))` の両方がコンパイルできなければ
なりません。`<type_traits>` は include 済みです。
'''
hints = [
  "素の `if` はどの `T` でも両方の分岐をコンパイルします。条件はトレイトの型ではなく値でなければなりません — そして `else` こそがもう一方の分岐を締め出すものです。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.cheatsheet_advanced.07.static-assert"
title = "実行ではなくビルドを落とせ"
story = "ヌーンデイ・ガンの砲手は砲に弾を込める前に装薬の二乗を確かめる — 計算が狂っていれば、何も出荷されない。"
brief = '''
`constexpr int sq(int x) { return x * x; }` が宣言されています。**名前空間
スコープ** で、`sq(12)` が `144` でなければ **コンパイル** が失敗するように
してください — 実行時に検査されるものがあってはいけません。
'''
hints = [
  "`constexpr` の呼び出しはコンパイラが評価でき、コンパイル時に生きるアサーションがあります。C++17 からメッセージは省略可能ですが、与えるなら文字列でなければなりません。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.cheatsheet_advanced.08.enum-class"
title = "数字が路線になる"
story = "銅鑼湾の MTR 案内板は配線から路線番号を読み取り、それをきちんとスコープ付きの 1 バイト路線コードに変えなければならない。"
brief = '''
```cpp
enum class Line : std::uint8_t { Island, TsuenWan, KwunTong };
```

`int n` は入力から読まれ、`0`、`1`、`2` のいずれかです。対応する列挙子を持つ
`Line l` を宣言してください。
'''
hints = [
  "スコープ付き enum はどちらの向きにも暗黙変換しません。波括弧初期化は実行時の `int` の縮小変換を拒みます。名前付きキャストの一つが仕事をします。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.cheatsheet_advanced.09.spaceship"
title = "一つの値段で六つ"
story = "港湾事務所は今やすべての停泊地をあらゆる向きで比較したい — より小さい、等しい、以上 — そして六つの演算子を手で書くのを拒む。"
brief = '''
`struct Pt { int r, c; };` — **メンバを一つ** 足して、`a < b`、`a == b`、`a >= b`
がすべてコンパイルでき、`r` で、次に `c` で順序付けられるようにしてください。
C++20、`<compare>` は include 済みです。
'''
hints = [
  "default 化した三方比較演算子一つで `==` も手に入ります。戻り値型は順序カテゴリです — コンパイラに推論させましょう — そして default 化した比較は `const` でなければなりません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.cheatsheet_advanced.10.dynamic-cast"
title = "本当に円か"
story = "ジャフィ・ロードの看板屋はすべての注文を基底ポインタで持つ。丸看板の機械には本当に円のものだけが渡らなければならない。"
brief = '''
```cpp
struct Shape { virtual double area() const = 0; virtual ~Shape() = default; };
struct Circle : Shape { double r; double area() const override { return 3.14 * r * r; } };
struct Square : Shape { double s; double area() const override { return s * s; } };
```

`Shape* s` は何かの形を指しています。それが本当に `Circle` のときは `c` をそれを
**`Circle` として** 指すように、そうでなければ `nullptr` に設定してください。
'''
hints = [
  "実行時にオブジェクトに何者かを尋ねるキャストは一つだけです。他はポインタを再解釈するだけで、決して null を生みません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.cheatsheet_advanced.11.move-unique"
title = "引き渡し"
story = "パーシヴァル・ストリートの集配所の荷物には所有者がちょうど一人。バンに載せたら、配達員はもう持っていない。"
brief = '''
`auto p = std::make_unique<Node>(5);` と
`std::vector<std::unique_ptr<Node>> v;` — `p` が所有するノードを `v` に入れて
ください。その後 `p` は **空** でなければならず、`Node` がコピーされてはいけません。
'''
hints = [
  "unique ポインタはコピーできず、生ポインタが黙って unique ポインタになることもありません。所有権そのものを渡しましょう。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.cheatsheet_advanced.12.weak-lock"
title = "まだいる?"
story = "ジャーディンズ・バザール上階のコンシェルジュは 7 号室の住人の非所有のメモを持ち、まだ住んでいるか確かめなければならない — そして話している間はロビーに引き止めておく。"
brief = '''
`std::weak_ptr<Room> wp;` — **部屋がまだ存在するときだけ** 部屋の `n` を出力し、
その間は生かしたままにしてください。
'''
hints = [
  "weak ポインタは直接参照外しも検査もできません。強いポインタを返してくれて、オブジェクトが消えていればそれは空です。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.cheatsheet_advanced.13.move-ctor"
title = "鍵を取り、何も残すな"
story = "怡和街の質屋はロッカーの中身を引き継ぐ。古い札は何も指さないままにしておかなければならない。さもないとロッカーは二度空にされる。"
brief = '''
```cpp
struct Buf {
  int* data; int n;
  explicit Buf(int n) : data(new int[n]), n(n) {}
  ~Buf() { delete[] data; }
  Buf(const Buf&) = delete;
  Buf& operator=(const Buf&) = delete;
  // the move constructor goes here
};
```

ムーブコンストラクタを足してください: `Buf b(std::move(a));` は `a` の配列を
引き継ぎ、ムーブ後の `a` は **安全に破棄できる** 状態でなければなりません。
`<utility>` は include 済みです。
'''
hints = [
  "パラメータは右辺値参照で、空にするつもりなら `const` にはできません。あるユーティリティは一つの式で新しい値を格納し古い値を返してくれます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.cheatsheet_advanced.14.try-emplace"
title = "新しいときだけ"
story = "トラム車庫の台帳は新しい車両番号を一度だけ受け付ける。重複は古いエントリに触れずに、そう告げなければならない。"
brief = '''
`std::map<std::string, int> m;` と `std::string k; int v;` — **`k` がないときだけ**
`k → v` を挿入し、同じ行で `ok` を入ったかどうかに束縛してください。
'''
hints = [
  "決して上書きしない挿入はペアを返します。構造化束縛は角括弧を使います。上書きするいとこもペアを返すのが罠です。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.cheatsheet_advanced.15.optional-view"
title = "どんなテキストからも、数字か、無か"
story = "トンネルの料金所は届いたテキストが何であれパースする — リーダーからの std::string でも、テストからのリテラルでも — そして運賃か無で答える。"
brief = '''
`parse` を宣言してください: `int` **か無** を返し（例外なし、ポインタなし）、
`std::string` **と** リテラル `"7"` の両方で、テキストをコピーせずに呼べなければ
なりません。
'''
hints = [
  "非所有の文字列型は `std::string` もリテラルも値で受け取ります。それへの参照はどちらにも束縛できません。戻り値型にはテンプレート引数が要ります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.cheatsheet_advanced.16.visit"
title = "どちらであれ"
story = "タイムズスクエアの映画館のチケットは座席番号か、ゲストリストの名前か。案内係は持っているほうを印字する。"
brief = '''
```cpp
template <class... Ts> struct overloaded : Ts... { using Ts::operator()...; };
std::variant<int, std::string> v = ...;
auto pr = overloaded{ [](int i) { std::cout << i; },
                      [](const std::string& s) { std::cout << s; } };
```

`pr` を使って、`v` が持っているほうの選択肢を出力してください。
'''
hints = [
  "ディスパッチャはメンバではなくフリー関数です: 呼び出し可能オブジェクトが先、variant が後です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.cheatsheet_advanced.17.span"
title = "どんな数字の並びでも"
story = "ヴィクトリア・パークのセンサーハブは const な vector、std::array、素の C 配列で届く測定値を合計する — 関数は一つ、コピーはなし。"
brief = '''
**三つすべて** の呼び出しが要素を一つもコピーせずにコンパイルできるように `total` を
宣言してください: `v` が `const std::vector<int>` のときの `total(v)`、`a` が
`std::array<int, 3>` のときの `total(a)`、`c` が `int c[3]` のときの `total(c)`。
C++20。
'''
hints = [
  "非所有のビュー一つであらゆる連続した列をカバーできます — ただし可変要素のビューは `const` な vector を受け付けません。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.cheatsheet_advanced.18.views-pipeline"
title = "怠惰なパイプライン"
story = "SOGO のゲームセンターのスコアボードは最初の三つの偶数スコアの二乗が欲しい。板がそこまでスクロールしたときに初めて計算される。"
brief = '''
```cpp
namespace views = std::views;
std::vector<int> v = {9, 2, 7, 4, 6, 1, 8, 10};
std::ranges::sort(v);
auto even = [](int x) { return x % 2 == 0; };
auto sq   = [](int x) { return x * x; };
```

要素が `4 16 36` — **最初の三つの偶数** の二乗 — である遅延レンジ `r` を組み立てて
ください。`<ranges>` は include 済みです。
'''
hints = [
  "アダプタは `|` で合成され、左から右へ適用されます: フィルタの前に三つ取ると間違った三つを取り、先に reverse すると遠い端から取ります。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.cheatsheet_advanced.19.multiset-erase-one"
title = "そのうちの一つだけ"
story = "台風シェルターの三隻のサンパンは同じ喫水の読みを共有している。一隻が出ていくとき、ソート済みのログは三つ全部ではなく、ちょうど一つのエントリを落とさなければならない。"
brief = '''
`std::multiset<int> ms = {3, 5, 5, 5, 8};` と `int x = 5;` — **ちょうど一つ** の
`5` を取り除いて `3 5 5 8` を残してください。O(log n) で。
'''
hints = [
  "値で消すとすべてのコピーが消えます。イテレータで消すと一つです。メンバの検索は対数時間 — フリーのアルゴリズムは歩きます。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.cheatsheet_advanced.20.pair-hash"
title = "二つの半分からなるキー"
story = "銅鑼湾の格子は (行, 列) で訪問され、訪問済みセルのハッシュ集合には標準が同梱しなかったハッシャが要る。"
brief = '''
```cpp
struct PairHash {
  // one line here
    return std::hash<long long>()(((long long)p.first << 32) ^ (unsigned)p.second);
  }
};
std::unordered_map<std::pair<int,int>, int, PairHash> seen;
```

`seen` がコンパイルできるように、ハッシャの開始行を書いてください。
'''
hints = [
  "ハッシャはキーを一つ取って `size_t` を返す呼び出し演算子です — そしてコンテナはそれを `const` なオブジェクトに対して呼びます。キー二つと `bool` は比較器であって、ハッシュではありません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.cheatsheet_advanced.21.heap-comparator"
title = "一番早い仕事を上に"
story = "ラッキー・マックの夜の厨房にあるシェフ・ボーのチケットレールは、締め切りが一番早い注文を上に置く — そしてレールはチケットにとって「小さい」が何を意味するか知らない。"
brief = '''
```cpp
struct Job { int d; std::string name; };   // no comparison operators
std::priority_queue<Job, std::vector<Job>, decltype(cmp)> pq(cmp);
```

`pq.top()` が常に **最小** の `d` を持つ仕事になるように、（キューの前に）`cmp` を
定義してください。
'''
hints = [
  "比較器は誰が沈むかを言います: キューは他のどれよりも「小さく」ない要素を上に置きます。最小を上にするには、「小さい」が大きいを意味しなければなりません — そして本物の bool を返さなければなりません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.cheatsheet_advanced.22.getline-delim"
title = "コンマで分割"
story = "配達の積荷目録は「Jaffe Road,7,Sogo」と読める — 三つのフィールド、そのうち一つは中に空白があり、分割はコンマだけで。"
brief = '''
`std::istringstream ss(line); std::string tok; std::vector<std::string> parts;`
— `line` が `Jaffe Road,7,Sogo` のとき、`parts` を **三つ** のフィールドで埋めて
ください。最初のものは `Jaffe Road` です。
'''
hints = [
  "`>>` は空白で分割するので、通りの名前が二つに切れます。行リーダーは省略可能な区切り文字を取ります — 一文字で、三番目の引数として。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.cheatsheet_advanced.23.erase-if"
title = "奇数を落とせ"
story = "SOGO のゲームセンターは瓶から奇数番号のトークンをすべて一掃する — 一行で、途中でイテレータが古くなることなく。"
brief = '''
`std::vector<int> v = {1, 3, 5, 2, 4, 7, 9};` — **奇数** の要素をすべて取り除き、
`v` が `{2, 4}` で `v.size() == 2` になるようにしてください。C++20、`<algorithm>`
と `<vector>` は include 済みです。
'''
hints = [
  "古典的なアルゴリズムは並べ替えるだけで決して縮めません。`++it` ループの中で消すのは、消した直後に無効化されたイテレータを使うことです。C++20 はその一連の手順を全部やってくれるフリー関数を足しました。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.cheatsheet_advanced.24.popcount"
title = "灯りのついた窓を数えろ"
story = "ヘネシー・ロードのタワーに六十四戸、一戸につき 1 ビット。夜警は灯りのついた戸を数える — 下半分だけでなく、六十四戸すべてを。"
brief = '''
`std::uint64_t x = 0xF0000000F0000001;` — `int c` を `x` の **立っているビット** の
数に設定してください。それは `9` です。`<bit>` と `<bitset>` は include 済みです。
'''
hints = [
  "このうち二つは 64 ビット値の 32 ビットしか見ません。一つは全部ではなく末尾の 1 を数えます。C++20 のものはどんな符号なし型もそのまま受け取ります。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.cheatsheet_advanced.25.stopwatch"
title = "どれだけかかった"
story = "メイは号砲から最後のキー入力までの解答時間を計り、答えを整数のミリ秒で欲しがる — ナノ秒でもなく、コンパイルエラーでもなく。"
brief = '''
```cpp
using namespace std::chrono;
auto t0 = steady_clock::now();
solve();
auto t1 = steady_clock::now();
```

`ms` を、経過時間を整数の **ミリ秒** で表したものに設定してください。
'''
hints = [
  "二つの時点の差はクロック自身の単位の duration です。より粗い単位への変換は精度を失うので、明示的に求めなければなりません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "cpp.cheatsheet_advanced.26.jthread"
title = "出がけに自分で join"
story = "パーシヴァル・ストリートのアレックスは夜間バッチを二つ目のスレッドで始め、スコープが終わるときに待ってほしい — 忘れるかもしれない一行なしで。"
brief = '''
`void work();` — `work` を新しいスレッド `t` で始め、`t` がスコープを出るときに
**自動的に join** されるようにしてください。C++20、`<thread>` は include 済みです。
'''
hints = [
  "破棄時にまだ join 可能な素のスレッドはプログラムを終了させます。detach すると決して join しません。C++20 はデストラクタが join するスレッドを足しました — そのコンストラクタは explicit なので `=` は使えません。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.cheatsheet_advanced.27.async"
title = "今始めて、後で回収"
story = "両替所は客が来た瞬間にレートの検索を別の係員に投げ、必要になったときに数字を回収する。"
brief = '''
`int work(int x);` — `work(5)` を **直ちに別のスレッドで** 始め、後で
`int r = f.get();` が結果を返すようなハンドル `f` を得てください。
`<future>` は include 済みです。
'''
hints = [
  "呼び出し可能オブジェクトと引数は別々に渡しましょう — 自分で呼ぶとその場で走ります。deferred ポリシーは `get` まで何も始めません。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet_advanced.28.scoped-lock"
title = "二つのロック、デッドロックなし"
story = "グロスター・ロード近くのフィンテック企業の二人の窓口係が同じ二つの口座の間で逆向きに送金し、支店は決して固まってはならない。"
brief = '''
```cpp
struct Acct { std::mutex m; int bal; };
void transfer(Acct& from, Acct& to, int amt) {
  // one line here
  from.bal -= amt; to.bal += amt;
}
```

関数の残りの間、**両方** の口座をロックしてください。あるスレッドが
`transfer(a, b, 1)` をループで走らせ、別のスレッドが `transfer(b, a, 1)` を
走らせます。プログラムは決してデッドロックしてはいけません。
'''
hints = [
  "二つのロックを引数の順に一つずつ取るのは、まさに二つのスレッドが永遠に待ち合う方法です。C++17 のあるガードは任意個のミューテックスを取り、デッドロックなしで獲得します。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet_advanced.29.fetch-add"
title = "私の前の数"
story = "銅鑼湾駅の八つの改札が一つのカウンタを共有する。各ゲートは自分のクリックの直前のカウントが必要で、クリックは一つも失われてはならない。"
brief = '''
`std::atomic<int> hits{0};` が八つのスレッドから同時にインクリメントされます。
各スレッドで `1` を足し、`int before` を **このスレッドのインクリメントの直前** の
値に設定してください。インクリメントが失われてはいけません。
'''
hints = [
  "値を読んでから新しい値を格納するのは二つの別々のアトミックな段階で、その間に別のスレッドが入り込めます。前置インクリメントはアトミックですが、返すのは後の値です。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet_advanced.30.condition-variable"
title = "何かが来るまで待て"
story = "正午、号砲が鳴り、ラッキー・マックの受け渡し窓: ランナーは皿が本当にそこにあるまで眠り、それ以外では起きず、早めに置かれた皿を見逃すこともない。"
brief = '''
`std::mutex m; std::condition_variable cv; std::queue<int> q;` — 消費側の冒頭で
ロックを取り、**`q` が空でなくなるまでブロック** してください。生産側がここに
来る前にすでに push して notify していても正しく、偽の起床にも頑健に。
その後もロックは保持されたままです。
'''
hints = [
  "wait には解放して再獲得できるロックが要るので、単純なガードでも、裸のミューテックスでもありません。述語を取るオーバーロードは起きるたびに再検査し、すでに成り立っていればすぐに戻ります。",
]
