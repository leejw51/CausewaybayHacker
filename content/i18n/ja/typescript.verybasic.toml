# TYPESCRIPT LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1):
# the prose of `content/typescript/verybasic.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code and live
# in the English pack only. Code blocks, identifiers, sample input and output
# and the exact strings a program must print are copied verbatim, never
# translated.

pack   = "typescript.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.verybasic.01.print"
title = "最初の画面"
story = "19:00、タイムズスクエアの上。大スクリーンが黒く点り、今夜最初の一行は手で打たなければならない。"
brief = '''
プログラムは一行で正確に `hello, causewaybay` を出力しなければなりません。グローバルな `console` のメソッドの一つが、標準出力に一行を書きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
output: hello, causewaybay
```
'''
hints = [
  "console.log(\"hello, causewaybay\"); — 括弧、そして文字列の中のカンマ。",
  "ここに print() はありません。tsc は見たことのない名前に、何かが走る前に TS2304 で答えます。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.verybasic.02.int-types"
title = "分かれたプレイリスト"
story = "ハイサン・プレイスの LED ウォールは今夜のクリップをパネルに分ける。スケジューラーは各パネルに何本、余りが何本かを言うはずが、何も言わない。"
brief = '''
`a` と `b` は整数です。プログラムは整数の商と余りを、スペース一つで区切って一行に出力しなければなりません。TypeScript の数値型は `number` 一つだけで、整数除算の演算子はありません: `/` は常に小数を返し、`Math.trunc` がそれを切り捨て、`%` が余りです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); — console.log は引数と引数のあいだにスペースを入れます。",
  "a / b は 3 ではなく 3.5 です: どの数も倍精度です。そして // はここでは演算子ではなく、コメントの始まりです。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.verybasic.03.floats"
title = "待ち時間"
story = "怡和街のトラム案内板は二か所までの待ち時間を出す。今夜は 3.5 と出て、最後の桁の場所が空いている。"
brief = '''
`x` と `y` は数です。プログラムは `x / y` を小数点以下ちょうど二桁で出力しなければなりません。数には、決まった桁数の小数で整形して文字列を返すメソッドがあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "console.log((x / y).toFixed(2)); — 括弧で割り算を先にします。",
  "Math.round(x / y * 100) / 100 はまだ数で、数は 3.50 ではなく 3.5 と出力されます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.verybasic.04.strings"
title = "バナー"
story = "リー・ガーデンアプリのバナーはマーケティングから小文字で届き、ブランドガイドは大文字を求める。バナーは打たれたとおりに掲げられる。"
brief = '''
`s` は一行のテキストです。長さの後に、プログラムは `s` を大文字で出力しなければなりません。文字列のメソッドの一つが、すべての文字を大文字にしたコピーを返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "console.log(s.toUpperCase()); — キャメルケースで、括弧を付けて呼びます。",
  "s.upper() は Python です。文字列型にそんなメソッドはなく、tsc がそう言います。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.verybasic.05.bool-if"
title = "東か西か"
story = "怡和街の到着案内板は、偶数の停留所では東を、奇数では西を向く。はしごの上の設置係は停留所番号を持っていて、向きを知りたい。"
brief = '''
`n` は正の整数です。プログラムは `n` が二で割り切れるとき `even` を、そうでないとき `odd` を出力しなければなりません。条件は、余りを三文字の厳密等価演算子で零と比べる `if` です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "if (n % 2 === 0) { — イコール三つは比較、一つは代入です。",
  "n % 2 は数で、tsc は数と文字列 \"0\" の比較を拒みます: 型に重なりがありません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.verybasic.06.loops"
title = "合計"
story = "三十階のコントロールルームはラックの上から一足す二足す三と画面を数えていくのに、コンソールの合計はゼロと出る。"
brief = '''
`n` は正の整数です。ループは 1 から `n` まで（`n` を含む）すべての整数を訪れ、それぞれを `total` に足さなければなりません。`for` のヘッダーには、開始、毎回の前に調べる条件、そして一歩があります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: 10
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — 小なりイコールなので、n 自身も訪れます。",
  "for...in はオブジェクトのキーを歩きます。数にはキーがなく、tsc は試させてもくれません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.verybasic.07.functions"
title = "枠の料金"
story = "タイムズスクエアのスクリーンは今夜の広告枠を、最初の十枠は一つ五、それ以降は一つ三で請求する。請求関数は数を約束していて、tsc はそれをビルドしない。"
brief = '''
`fare(rides)` は料金を返さなければなりません: 最初の十回は一回 5、十回目より後は一回 3 です。シグネチャが `: number` と言っているので、何も返さない本体はコンパイルできません。関数は一つのキーワードで値を返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
output: 15
```
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "`: number` と型付けされた関数が返さずに出力するとコンパイルできません: tsc は値を返さなければならないと言います。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.verybasic.08.structs"
title = "カード一枚、フィールド二つ"
story = "リー・ガーデンアプリの商品カードにはどれも名前と値段がある。コンストラクターは値段を設定せず、ビルドは値段を約束した行で止まる。"
brief = '''
`Stall` のコンストラクターは `name` と `price` を受け取ります。クラスは `price: number` を宣言していて、`strict` のもとでは宣言したフィールドはすべてコンストラクターで代入しなければなりません。`name` と同じやり方で `price` をオブジェクトに格納し、`s.price` で読み戻せるようにしてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "this.price = price; — this はオブジェクト、裸の名前は引数です。",
  "this.price = name; はコンパイルできません: name は文字列で、フィールドは数です。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.verybasic.09.struct-method"
title = "かごの一行"
story = "値段かける数量は、リー・ガーデンアプリのどのかごにもある一行だ。それを言うはずのメソッドは数を約束して、何も返さない。"
brief = '''
`Stall.total()` は値段かける数量を返さなければなりません。コンストラクターの `public` 引数はフィールドを宣言し、同時に格納します。メソッドの中では、オブジェクトのフィールドには `this` を通して届きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return this.price * this.qty; — 両方のフィールドを this を通して。",
  "メソッドの中の裸の price はフィールドではありません。クラスの外で入力から読んだ price、つまり文字列で、tsc は文字列の掛け算をさせません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.verybasic.10.enums"
title = "路線の色"
story = "ハイサン・プレイスの壁の銅鑼湾出口の上にある MTR パネルは三つの路線を示す。フィードは単語を送り、パネルはそれが表す enum のメンバーを必要とする。"
brief = '''
`word` は `island`、`tsuenwan`、`kwuntong` のどれかです。プログラムはそれを対応する `Line` のメンバーに変えなければなりません。enum はメンバーの名前で添字を引けますが、tsc がその名前の一つだと知っているキーでだけです: `keyof typeof Line` がその名前の集合で、`as` は文字列がその一つだと tsc に告げます。このアサーションは実行時には消えます — 何も検査しないので、文字列は一致していたほうがいい。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line = Line[word.toUpperCase() as keyof typeof Line]; — 名前は大文字です。",
  "Line[word as keyof typeof Line] はコンパイルできます。`as` は tsc が信用で受け取る約束だからです。実行時、Line[\"tsuenwan\"] は undefined です。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.verybasic.11.vector"
title = "プレイリスト"
story = "コントロールルームが受け取るクリップはどれも、届いた順に今夜のプレイリストに載る。なのにプレイリストは空のままだ。"
brief = '''
`xs` は空で始まる `number[]` です。ループで読んだ各整数 `x` を、入力の順を保って末尾に加えなければなりません。配列にはそのためのメソッドが一つあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs.push(x); — 値一つを、末尾に。",
  "unshift(x) は先頭に置き、順番を逆にします。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.verybasic.12.vector-edit"
title = "外されたクリップ"
story = "ハイサン・プレイスのプレイリストの最初のクリップは放映前に外された。それは消えなければならず、後ろのものはすべて一つ前に詰める。"
brief = '''
`xs` には行の整数が入っています。プログラムはインデックス 0 の要素を取り除き、残りを一つずつ前に詰めなければなりません。配列のメソッドの一つが、開始インデックスと個数で取り除きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "xs.splice(0, 1); — インデックス 0 から、要素一つ。",
  "delete xs[0] は要素のあった場所に穴を残します。長さは変わりません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.verybasic.13.list"
title = "ティッカーの先頭"
story = "速報はタイムズスクエアのスクリーンの下のティッカーの先頭に載る。なのに最新の項目がいつも末尾に着く。"
brief = '''
`chain` は `number[]` です。TypeScript に deque はなく、配列が両端をこなします。ループで読んだ各 `x` を**先頭**に加え、最後に読んだものが最初に来るようにしなければなりません。配列にはその端のためのメソッドがあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "chain.unshift(x); — push の先頭側の双子です。",
  "push(x) は末尾に付きます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.verybasic.14.maps"
title = "タップの数"
story = "リー・ガーデンアプリは商品ごとに一行ずつタップを数える。どの商品でも最初のタップは、足す先の行を見つけられない。"
brief = '''
`counts` は `Map<string, number>` です。各単語 `w` について、プログラムはその数に一を足さなければなりません。最初はゼロから始めます。`get` はキーがないかもしれないので `number | undefined` と型付けされていて、`??` がないときに使う値を与えます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts.set(w, (counts.get(w) ?? 0) + 1); — 既定値を括弧に入れてから、足します。",
  "counts.get(w)! + 1 はコンパイルできます — ! は値があると tsc に告げます — そして実行時、undefined + 1 は NaN です。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.verybasic.15.hashtable"
title = "引き当て"
story = "コントロールルームの表は停留所名を案内板の番号に対応させる。ない停留所を尋ねたら、怡和街の案内板を空白にするのではなく -1 と言うべきだ。"
brief = '''
`table` は名前を案内板の番号に対応させ、番号は 0 のこともあります。単語 `w` について、プログラムはその番号を、`w` が表になければ `-1` を出力しなければなりません。`get` はないキーに `undefined` を返します。ちょうど `null` と `undefined` だけを置き換え、ほかは何も置き換えない演算子が一つあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "console.log(table.get(w) ?? -1); — ?? が割って入るのは undefined か null のときだけです。",
  "|| はすべての偽値で割って入り、0 は偽値です: 番号 0 の案内板が -1 と読まれます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.verybasic.16.sets"
title = "異なる広告主"
story = "タイムズスクエアのローテーションに六枠、異なる広告主は三社。請求書は何社かを求めていて、六と言っている。"
brief = '''
`xs` には行の整数が入っています。プログラムは**異なる**値がいくつあるかを出力しなければなりません。`Set` は同じものを一つずつ持ち、数えるのは `length` ではなくプロパティです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "console.log(new Set(xs).size); — new で集合を作り、size で数えます。",
  "new のない Set は呼び出せません。tsc は new を付けるつもりだったかと尋ねます。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.verybasic.17.stack"
title = "オーバーレイの山"
story = "ハイサン・プレイスの壁ではオーバーレイが積み重なり、上から外れていく。レンダラーはいつもいちばん下を剥がしている。"
brief = '''
`stack` はスタックとして使う配列です。プログラムは**いちばん上**（最後）の要素を取り出して `top` に入れなければなりません。配列のメソッドの一つが最後の項目を取り除いて返します。スタックが空だったかもしれないので、`number | undefined` と型付けされています。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4
        1 2 3
```
'''
hints = [
  "const top = stack.pop(); — 引数なし。いつも最後の一つです。",
  "stack[stack.length - 1] はいちばん上を読みますが、山に残したままです。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.verybasic.18.queue"
title = "ポップアップの列"
story = "リー・ガーデンのポップアップストアの列は並んだ順に案内される。なのにアプリはいつも最新の整理券を呼ぶ。"
brief = '''
`q` は整理券を順に持つ配列です。プログラムは**最初の**一枚を取り出して `first` に入れなければなりません。配列は一つのメソッドで先頭から取り除きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1
        2 3 4
```
'''
hints = [
  "const first = q.shift(); — shift は先頭から、pop は末尾から取ります。",
  "q[0] は最初の整理券を取り除かずに読みます。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.verybasic.19.heap"
title = "いちばん急ぎを先に"
story = "障害はどんな順でもコントロールルームに届き、壁は毎回いちばん急ぎのものを次に出すべきだ。それを置いておくリストは、どれがそうかを何も知らない。"
brief = '''
TypeScript の標準ライブラリにヒープはないので、スターターは小さな `MinHeap` を持っています: `push` は値を加えて上へふるい上げ、`pop` は最小のものを取ります。各 `x` はヒープ自身のメソッドを通して入れなければならず、そうすれば後で `pop` が最小のものから返します。`items` に直接書くとふるい上げを飛ばし、順序が壊れます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(x); — ヒープのメソッドで、x を収まるべき場所までふるい上げます。",
  "heap.items.push(x) は x を配列の末尾に置き、ふるい上げを飛ばします。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.verybasic.20.sorting"
title = "運賃のはしご"
story = "怡和街の案内板の運賃は路線が加わった順に並び、案内板はそれをテキストとして並べ替える: 10 が 9 より前。"
brief = '''
`xs` には行の整数が入っています。プログラムは出力の前に `xs` をその場で昇順に並べ替えなければなりません。配列の `sort` は比較関数を取ります: 負なら第一引数を先に置きます。比較関数がないと、`sort` は数を文字列として比べます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "xs.sort((a, b) => a - b); — a 引く b が昇順です。",
  "比較関数のない xs.sort() は 10 を 9 より前に置きます。\"1\" が \"9\" より前に来るからです。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.verybasic.21.sort-by-key"
title = "リーダーボード"
story = "タイムズスクエアのスクリーンのタップゲームのリーダーボードは、スコアの高い順、同点は名前順のはずなのに、参加した順を出している。"
brief = '''
`rows` は `[string, number][]` です: 型付きタプルの配列で、名前、そしてスコアです。スコアの降順、次に名前の昇順で並べ替えなければなりません。比較関数はアロー関数です。`||` は最初の比較が 0 を返したときだけ二つ目の比較に進み、`byName` は二つの文字列を比べます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "rows.sort((a, b) => b[1] - a[1] || byName(a[0], b[0])); — スコアの降順には b を a より先に。",
  "タプルの要素 1 が数、要素 0 が文字列です。tsc はどちらがどちらかを知っていて、byName(a[1], b[1]) はコンパイルできません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.verybasic.22.reverse"
title = "後ろから前へ"
story = "ハイサン・プレイスの壁は文字を右から左へ流す。オペレーターは掲げる前に文字列を逆順で保存したい。"
brief = '''
`s` は一行のテキストです。プログラムはそれを逆順で出力しなければなりません。文字列自身に reverse はありません: 文字の配列に展開し、配列を逆にし、つなげて文字列に戻してください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "console.log([...s].reverse().join(\"\")); — 展開、逆順、あいだに何も入れずに join。",
  "join がないと、console.log は配列そのものを、角括弧も引用符も込みで出力します。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.verybasic.23.closures"
title = "サービス料"
story = "リー・ガーデンアプリのどの値段にも同じサービス料が足される。その料金を覚えておくはずの関数は、それを忘れる。"
brief = '''
`makeAdder(k)` は `x + k` を返す内側の関数 `add` を定義します。その戻り値の型 `(x: number) => number` は、関数を返さなければならないと言っています — 内側の関数そのものを返せば、`k` を覚えたまま後で `add(x)` を呼べます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add; — 裸の名前、括弧なし。",
  "return add(); はそれを引数なしで呼び、シグネチャが関数を約束した場所に数を返します。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.verybasic.24.lambdas"
title = "偶数の階"
story = "駐車場の偶数階のスクリーンは階数の二乗の賃料を払い、地下階も含む。奇数階は何も払わない。台帳は合計を一つ欲しがっている。"
brief = '''
`xs` には行の整数が入っています。`total` は**偶数**の値の二乗の合計でなければならず、`filter`、`map`、`reduce` と三つのアロー関数で作ります。`reduce` には初期値が要ります。さもないと空の配列には始める値がありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "const total = xs.filter((x) => x % 2 === 0).map((x) => x * x).reduce((a, b) => a + b, 0);",
  "0 のない reduce は空の配列で TypeError を投げます: 値がすべて奇数で、足すものが何もなかったのです。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.verybasic.25.threads"
title = "全パネルを同時に"
story = "ハイサン・プレイスの壁のパネルはそれぞれ自分のフレームを描く。そして壁は、どれかが描き終わる前に点灯する。"
brief = '''
ここにスレッドはありません: イベントループが一つ、そして `square` は眠っているあいだそれを返します。すべての呼び出しは開始済みで、その promise は `tasks` に入っています。結果を出力する前に、`main` はそれらすべてが決着するのを**待た**なければなりません。`Promise` には promise の配列を一つにする関数があり、`await` がそれを待ちます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "await Promise.all(tasks); — 全部のための promise を一つ、そしてそれを await します。",
  "await のない Promise.all(tasks) は promise を作ってそのまま素通りします。tasks.join() は配列のメソッドで、何もつなぎません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.verybasic.26.mutex"
title = "カウンター一つ、フィード四つ"
story = "四つの売上フィードがコントロールルームのコンソールの一つのカウンターに足していく。ロックはあるのに、誰も読む前にそれを待たない。"
brief = '''
スレッドは一つ、それでも競合はあります: 各ワーカーは `counter` を読み、`await` し、書き戻します。その隙間にほかのワーカーが走ります。`lock` は小さな非同期ロックです。読む前に、各ワーカーはロックを**取り**、手に入るまで待たなければなりません。解放は書き込みの後にすでに書いてあります。`acquire` は、ロックが自分のものになったときに決着する promise を返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1000
output: 4000
```
'''
hints = [
  "await lock.acquire(); — それから読み、書き、そしてすでにある解放です。",
  "await のない lock.acquire() はロックを求めておきながら、手に入る前にカウンターを読んでしまいます。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.verybasic.27.binary-tree"
title = "ANY"
story = "23:59、三十階のコントロールルーム。フィードは `any` と型付けされて届き、すべての検査が通り、タイムズスクエアのスクリーンは十二メートルの文字で `undefined` を映す。注釈一つで捕まえられたはずだった。"
brief = '''
スクリーンの id は二分探索木に入り、子はどれも `any` ではなく `TreeNode | null` と注釈されているので、tsc は空の場合を一つのケースとして扱わせます。`insert(n, v)` は `v` を入れた木の根を返します。`null` の場合と右側は書いてあります。小さい `v` については、左の子をそこへ挿入した結果で置き換えなければなりません。そうすれば `null` の子がノードになります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v); — 再帰は部分木の新しい根を返します。それを格納してください。",
  "insert を呼んで結果を格納しないと、null は元の場所に残ります。そして tsc にはそれが見えません: 型はすべて合っています。",
]
