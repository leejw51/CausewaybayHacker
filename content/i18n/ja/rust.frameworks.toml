デッキ `M01 M02 ... Mnn`(二桁、ゼロ埋め)を作り、シードから初期化した
**ひとつ**の乱数生成器で:

1. デッキを一度、その場でシャッフルし、`DECK <ids joined by one space>` を出力する;
2. `k` 個の整数を、それぞれ `1..=100` の一様分布で `u32` として引き、順に
   それぞれ `DRAW <x>` を出力する;
3. `CHECK <first id of the shuffled deck>` を出力する。

生成器は `SeedableRng::seed_from_u64` で作った `rand::rngs::StdRng` で、正確に
その順に消費します — シャッフルが先、抽選が後 — ので、同じシードは常に同じ行を
出力します。シードが `u64` でなければ、`ERROR: bad seed <text>`(トリム済み)を
出力し、他には何も出力しません。

```
input:  20261006
        6 3
output: DECK M06 M02 M05 M01 M03 M04
        DRAW 4
        DRAW 26
        DRAW 79
        CHECK M06
```

シャッフルは `rand::seq::SliceRandom::shuffle`、抽選は
`rand::RngExt::random_range` — どちらもトレイトで、どちらも import します。
スターターは OS から初期化されたスレッドローカルの生成器 `rand::rng()` を使い、
実行するたびに違う標本を出力します。
'''
hints = [
  "`use rand::rngs::StdRng; use rand::{RngExt, SeedableRng}; use rand::seq::SliceRandom;` — rand 0.10 ではメソッドは `RngExt` と `SliceRandom` にあり、`seed_from_u64` は `SeedableRng` にあります。",
  "`let mut rng = StdRng::seed_from_u64(seed);` が修正のすべてです: 生成器ひとつ、シードから作り、引くものすべてに `&mut rng` として渡します。",
  "`deck.shuffle(&mut rng);` 次に `let draw: u32 = rng.random_range(1..=100);` — 型注釈がストリームからどの整数が出るかを決めるので、`u32` でなければなりません。",
