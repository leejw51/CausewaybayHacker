  "`counts.get_index(0)` は `Option<(&K, &V)>`: 最初に挿入された店です。覚えておくための二つ目の変数は要りません。",
  "`TOP` には、`&counts` を順に歩いて `*count > best` のときだけ最良を置き換えます — 厳密に大きいとき、なので同数のうち最初のものが残ります。`max_by_key` は*最後*の最大値を返すので、ここでは間違った方です。",
