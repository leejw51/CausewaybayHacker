ください:

* プライマリ: `fast` は 10 ms、`slow` は 3 s
* バックアップ: `fast` は 100 ms、`slow` は 3 s

先に答えた方が勝ちです: 二つの future に対する `tokio::select!`。レース全体を
**一秒**の `tokio::time::timeout` で包みます。行は一度に一つ、順に処理し、
