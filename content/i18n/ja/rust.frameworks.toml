```

`timeout(dur, fut).await` は `Ok(value)` か `Err(Elapsed)` です。`Err` のときは
中の future はドロップされています、スリープも含めて — 3 s を待ち切ることは
決してありません。スターターはプライマリだけをタイムアウトなしで await し、
バックアップには決して訊きません。
