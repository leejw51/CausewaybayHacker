id    = "rust.frameworks.10.chrono-settlement"
title = "次の営業日"
story = "タイムズスクエアの端末からの金曜のカードバッチが、土曜の日付でグロスター・ロードの銀行へ行った。銀行は土曜日に開いていない。決済カレンダーは手書きの月表で、そこでは二月が毎年 28 日だ。"
brief = '''
標準入力の各行は `YYYY-MM-DD` 形式の取引日です。空行は無視します。各日付に
ついて一行出力してください:

```
<value date> -> <settlement date> +<days>
```

ここで決済日とは取引日より**後**の最初の月曜から金曜の日(金曜は月曜に、土曜は
月曜に、日曜は月曜に決済します)、`<days>` は二つの間の暦日数、そして両方の
日付は `%d %b %Y %a` で出力します — `03 Oct 2026 Sat`。

その形式の実在する日付でない行 — `2026-13-01`、`2026-02-29`、`2026-04-31`、
`yesterday` — は、行のテキストをトリムして `ERROR: bad date <line>` を出力し、
プログラムは次の行へ進みます。

```
input:  2026-10-02
        2026-10-03
        2026-10-07
        2026-13-01
output: 02 Oct 2026 Fri -> 05 Oct 2026 Mon +3
        03 Oct 2026 Sat -> 05 Oct 2026 Mon +2
        07 Oct 2026 Wed -> 08 Oct 2026 Thu +1
        ERROR: bad date 2026-13-01
```

`chrono::NaiveDate` を使ってください: 読むのは `parse_from_str`、判定は
`weekday()`、進めるのは `checked_add_days`、差は
`signed_duration_since(...).num_days()`、出力は `format` です。決して時計を
読まないこと。スターターは自前の月表と自前の曜日の式を持っていて、その
どちらかが閏年で間違っています。
'''
hints = [
  "`use chrono::{Datelike, Days, NaiveDate, Weekday};` — `weekday()` は `Datelike` トレイトから来るので、その import がないと存在しません。",
  "`NaiveDate::parse_from_str(text, \"%Y-%m-%d\")` は `Result` です。`yesterday` と同じく `2026-02-29` や `2026-04-31` でも `Err` なので、`match` ひとつがすべての悪い行を扱います。",
  "`!matches!(day.weekday(), Weekday::Sat | Weekday::Sun)` になるまで `date.checked_add_days(Days::new(1)).unwrap()` で進めます。差は `settles.signed_duration_since(value).num_days()` です。",
  "`value.format(\"%d %b %Y %a\")` は `02 Oct 2026 Fri` をそのまま `println!` に出力します — `%a` は曜日の三文字名です。",
]

