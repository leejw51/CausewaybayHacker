# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.frameworks.09.regex-captures"
title = "文章の中のドル"
story = "サポートデスクは顧客のメールを返金チケットに貼り付け、金額は文章の中に埋まっている。それを取り出すスキャナは最初のカンマで止まるので、SOGO で HK$1,234.50 を請求された顧客に一ドルの返金が提示されていた。"
brief = '''
標準入力は自由なテキストで、一行がチケット一行です。その中の香港ドルの金額を
すべて見つけてください。金額とは、`HK$` の直後に整数ドル部と、省略可能な
セント部が続くものです:

* 整数ドル: 素の数字(`80`、`1234`)か、カンマで三桁ずつ区切った数字
  (`1,234`、`12,345,678` — 一桁から三桁、その後に `,ddd` のグループが一つ以上);
* セント: `.` とちょうど二桁(`.50`)。後ろに二桁が続かない `.` は金額の一部では
  ありません(`HK$38.` は 38 ドルです)。

それ以外 — `US$9.99`、裸の `HK$` — は金額ではありません。

すべての金額について、読む順に `<line> <text> <cents>` を出力してください:
1 始まりの行番号、テキストに現れたとおりの金額、そしてその値を整数のセントで。
最後の行のあとに `TOTAL <cents>` を出力してください。金額のないチケットは合計
だけを出力し、空の入力は `TOTAL 0` を出力します。

```
input:  Charged HK$1,234.50 twice at SOGO; the second HK$1,234.50 is a duplicate.
        Refund HK$80 and the HK$12.05 fee. The US$9.99 line is not ours.
output: 1 HK$1,234.50 123450
        1 HK$1,234.50 123450
        2 HK$80 8000
        2 HK$12.05 1205
        TOTAL 256105
```

ドルとセントの名前付きグループを持つ `regex::Regex` をひとつ作り、ループの
前に**一度だけ**コンパイルし(コンパイルが高価な部分です。ループ本体の中の
`Regex` は古典的な間違いです)、各行を `captures_iter` で歩いてください。整数の
セントで計算すること: `f64` のドルに 100 を掛けると、`HK$0.29` が 28 セントに
なります。スターターは手でスキャンし、最初のカンマで止まり、浮動小数を掛けて
います。
'''
hints = [
  "`use regex::Regex;` と `let re = Regex::new(r\"...\").unwrap();` をループの上で一度だけ。`re.captures_iter(line)` はマッチごとに `Captures` をひとつ、左から右へ返します。",
  "名前付きグループ: `(?P<dollars>...)` と `(?P<cents>...)`。パターンの中で `\\$` はリテラルのドル記号で、カンマ区切りの形は選択の先頭に、カンマグループには `+` を付けて置かなければなりません。さもないと `HK$1234.50` は `HK$123` としてマッチします — regex クレートは最長ではなく、最初にマッチした選択肢を取ります。",
  "パターン: `HK\\$(?P<dollars>\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.(?P<cents>\\d{2}))?`。`&caps[0]` がマッチ全体、`caps[\"dollars\"]` がグループのテキスト、`caps.name(\"cents\")` はそのグループが参加していないこともあるので `Option<Match>` です。",
  "`let dollars: i64 = caps[\"dollars\"].replace(',', \"\").parse().unwrap();` 次に `let cents: i64 = caps.name(\"cents\").map_or(0, |m| m.as_str().parse().unwrap());` で、金額は `dollars * 100 + cents` です。",
]

