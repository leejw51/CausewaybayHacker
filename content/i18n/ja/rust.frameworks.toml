hints = [
  "`std::sync::Mutex` の代わりに `use parking_lot::Mutex;`。`ledger.lock()` がガードです — その後の `.unwrap()` はすべて削り、`into_inner()` はマップそのものです。",
  "`HashMap::extend` はすでにあるキーを*置き換え*ます。レジ 0 のあとにレジ 1 が `luckymac` を書くと、レジ 0 の合計は消えます。それがスターターのバグで、二つのレジが両方見たどの店にも現れます。",
