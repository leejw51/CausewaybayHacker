hints = [
  "`use tokio::time::{sleep, timeout};` — `timeout(Duration::from_secs(1), fut).await` は `Result<T, Elapsed>` を与え、中の future をドロップすることがキャンセルそのものです。",
  "`tokio::select! { a = fut_a => ..., b = fut_b => ... }` は両方をポーリングし、先に終わった方のアームを実行します。もう一方の future はその場でドロップされます。",
