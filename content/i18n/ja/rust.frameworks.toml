# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.frameworks.16.crossbeam-hatch"
title = "受け渡し口が閉まる"
story = "怡和街の三台の端末がグロスター・ロードのオフィスのひとつの受け渡し口に記帳するが、端末が帰ったことを受け渡し口に告げるものは何もない。夜間バッチは朝六時になってもまだ待っている。"
brief = '''
一行目は `<PRODUCERS>`、`1 <= PRODUCERS <= 8` です。それ以降の各行は支払い伝票、
`<CARD> <CENTS>` です。伝票 `i`(0 始まり、伝票だけ)はプロデューサー
`i % PRODUCERS` に属します。ちょうど二つのフィールドでない伝票、またはセントが
`i64` でない伝票は不良伝票です: プロデューサーはそれを飛ばし、何も送りません。

各プロデューサーはスレッドで、自分の良い伝票を、一枚につきメッセージ一つで、
**ひとつ**の `crossbeam::channel::bounded(4)` チャネルに送ります。ひとつの
コンシューマー — メインスレッド — が `for msg in rx` ですべての送信者がいなく
なるまでチャネルを読み、それから出力します:

* `MESSAGES <n>` — 受け取ったメッセージ数
* `TOTAL <sum of cents>`
* `LARGEST <CARD> <CENTS>` — 最大の伝票一枚。同額なら小さい方のカード ID
  (文字列順)。メッセージがなければ `LARGEST -`。

```
input:  3
        K1 1200
        K2 350
        K3 oops
        K4 1200
        K5 90
output: MESSAGES 4
        TOTAL 2840
        LARGEST K1 1200
```

`for msg in rx` は**最後**の `Sender` がドロップされたときにだけ終わります。各
プロデューサーは `tx.clone()` を受け取り、それらはスレッドが終わるとドロップ
されます — しかし元の `tx` はまだ `main` に座っているので、ループは決して
終わらず、実行はタイムアウトになります。読み始める前にそれをドロップして
ください。スターターはしていません。
'''
hints = [
  "`use crossbeam::channel::bounded;` — `bounded(4)` は `(Sender, Receiver)` を返します。`Sender` は `Clone` で、`Receiver` はチャネルが閉じると終わるイテレータです。",
  "チャネルは*すべて*の `Sender` がドロップされたときに閉じます。数えてください: プロデューサーごとにクローン一つ、それに `bounded` があなたに渡した一つ。それは `main` が `for slip in rx` に座っている間もまだ持っています。",
  "コンシューマーはプロデューサーが spawn される前に走ってはいけません(クローンが要るからです)し、元のものはコンシューマーが始まる前に消えていなければなりません: spawn、次に `drop(tx);`、次にループです。",
  "`for p in 0..producers` ループの直後、`thread::scope` のクロージャの中で `drop(tx);`。他は何も変わりません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.frameworks.17.crossbeam-select-timeout"
title = "三百ミリ秒"
story = "グロスター・ロードのゲートウェイの向こうにいるあるカード発行会社が 11:52 に答えなくなった。SOGO の端末は二時まで PLEASE WAIT を表示していた。ゲートウェイも待っていたからだ。"
brief = '''
標準入力はゼロ行以上の `<CARD> <MS>` で、多くとも二十行です: カード ID と、
そのカードの発行会社が答えるのにかかる時間、ミリ秒単位。`MS` は**3 以下**
(生きている発行会社)か**3000 以上**(そうでないもの)のどちらかで、一回の実行で
遅い種類は多くとも三行です。

カードを順に取ります。それぞれについて、`MS` ミリ秒スリープしてからカード ID を
チャネルで送り返すワーカースレッドを始めてください。答えを**多くとも 300 ms**
待ちます: 来たら `<CARD> APPROVED`、来なかったら `<CARD> TIMEOUT` を出力し、
すぐに次のカードへ進みます。最後のカードのあとに `APPROVED <a> TIMEOUT <t>` を
出力してください。

```
input:  V1 0
        V2 3000
        V3 2
output: V1 APPROVED
        V2 TIMEOUT
        V3 APPROVED
        APPROVED 2 TIMEOUT 1
```

待つのは二つのレシーバーに対する `crossbeam::channel::select!` です: ワーカーの
ものと、時間が来たときにメッセージを一つ届けるチャネル
`after(Duration::from_millis(300))`。**各カードに自分の** `bounded(1)` チャネルを
与えて、遅い発行会社の答えが三秒遅れて届いても次のカードのものと間違われない
ようにしてください。ワーカーは `let _ = tx.send(..)` で送ります: その時点では
誰も聞いていないかもしれず、それでかまいません。ワーカーは `std::thread::spawn`
で spawn し、決して join しないこと — `main` が返ればプロセスは終わり、眠って
いるワーカーも一緒です。スターターはタイムアウトなしの `rx.recv()` を呼んで
三秒丸ごと待ち、それからカードを承認しています。
'''
hints = [
  "`use crossbeam::channel::{after, bounded, select};` — `after(d)` は今から `d` 後にちょうど一つメッセージを受け取る `Receiver<Instant>` です。他と同じチャネルで、だから `select!` がそれを待てます。",
  "`select!` は `recv(rx) -> msg => { .. }` のアームを取り、先に準備のできたレシーバーの方を実行します。ワーカーのレシーバーを一方のアームに、`after` のレシーバーをもう一方に置いてください。",
  "`recv(rx) -> answer` は `Result` を与えます: ワーカーからの `Ok(card)` です。タイムアウトのアームのメッセージは要らない `Instant` です: `recv(after(Duration::from_millis(300))) -> _ => { .. }`。",
  "`select! { recv(rx) -> answer => { approved += 1; println!(\"{} APPROVED\", answer.unwrap()); } recv(after(Duration::from_millis(300))) -> _ => { timed_out += 1; println!(\"{card} TIMEOUT\"); } }`",
]

