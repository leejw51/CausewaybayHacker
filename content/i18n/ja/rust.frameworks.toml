# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.frameworks.22.log-trait"
title = "フロアに聞こえるもの"
story = "グロスター・ロードの決済サービスは、積み重なった if の裏で素の print でログを出す。誰かがパーシバル・ストリートの展開のために warn に設定し、エラーが出なくなった一方でデバッグ行は出続けた。"
brief = '''
一行目はレベルの単語で、大文字小文字は問いません: `off`、`error`、`warn`、
`info`、`debug`、`trace` のいずれかです。それ以外の単語は `unknown level <word>`
を出力し、他には何も出力しません。以降の各行は `<ACCOUNT> <AMOUNT>` です。

行を 1 から番号を付けながら歩き、`log` クレートのマクロで、それぞれ明示的な
target を付けてログを出してください:

* `trace!(target: "io", "read {raw:?}")` — 生の行、`Debug` で引用符付き
* `error!(target: "settle", "line {n}: not a number: {amount}")` — 金額が `i64`
  でないとき。その行は飛ばします
* `info!(target: "settle", "line {n}: {account} {cents}")`
* `warn!(target: "settle", "line {n}: large amount {cents}")` — `cents > 100000`
  のとき、`info!` のあとに
* `debug!(target: "settle", "total so far {total}")` — 足したあとに

それから、レベルが何であれ、`println!("TOTAL {total}")`。

レコードは**標準出力**に `[LEVEL] target: message` として出力され、それはその
レベルが選ばれたレベル以上のときだけです — `error` が最上位、`trace` が最下位、
`off` は合計以外何も出力しません。

```
input:  info
        A 100
        B 250000
        C 7x
        D 1
output: [INFO] settle: line 1: A 100
        [INFO] settle: line 2: B 250000
        [WARN] settle: line 2: large amount 250000
        [ERROR] settle: line 3: not a number: 7x
        [INFO] settle: line 4: D 1
        TOTAL 250101
```

ユニット struct に `log::Log` を実装してください — `enabled` はレコードのレベル
を `log::max_level()` と比較し、`log` は enabled のとき出力し、`flush` は stdout
をフラッシュします — それを `static LOGGER` に置き、`log::set_logger(&LOGGER)`、
そして単語を `LevelFilter` として解析して `log::set_max_level` です。スターター
は自前のレベル表を持ち、それを逆向きに比較しています。
'''
hints = [
  "`use log::{Log, Metadata, Record, LevelFilter};` — `impl Log for YourStruct` はメソッド三つです: `enabled`、`log`、`flush`。`\"warn\".parse::<LevelFilter>()` が単語を、大文字小文字を問わず読みます。",
  "`static LOGGER: StdoutLogger = StdoutLogger; log::set_logger(&LOGGER).unwrap(); log::set_max_level(level);` — `set_logger` は `&'static dyn Log` を欲しがります。それが `let` ではなく `static` である理由です。",
  "`Level` の順序は `Error < Warn < Info < Debug < Trace` なので、レコードが欲しいのは `record.level() <= log::max_level()` のときです。マクロはあなたを呼ぶ前にすでに `max_level()` を調べています。",
  "`println!(\"[{}] {}: {}\", record.level(), record.target(), record.args())` — `Level` は `ERROR`、`WARN`、... と表示されます。各マクロで渡す `target:` が `record.target()` の返すものです。",
]

