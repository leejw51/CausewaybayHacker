brief = '''
標準入力は送金で、一行にひとつ、`<ACCOUNT> <CENTS>` です — 口座は空白を含まない
トークンひとつ、セントは非負の整数です。空行は無視します。ひとつの口座の送金は
入力のどこに現れてもかまいません。

口座ごとに一行、口座を文字列の昇順で、`<ACCOUNT> <a>+<b>+...=<sum>` として
出力してください — 金額は入力に現れた順に `+` で結び、次に `=` とその合計です
(送金ひとつなら `C-031 80=80` と出力します)。その後にフッター一行、
`<k> accounts, <total> cents` を、異なる口座の数とすべての合計で出力します。
空の入力は `0 accounts, 0 cents` だけを出力します。

```
input:  B-204 500
        A-117 1200
        B-204 250
        C-031 80
        A-117 60
output: A-117 1200+60=1260
        B-204 500+250=750
        C-031 80=80
        3 accounts, 2090 cents
```

これは `itertools::Itertools` です: 各口座の送金を寄せ集めるのに `sorted_by_key`
(安定ソートなので、金額は入力順を保ちます)、連を歩くのに `chunk_by`、出力に
`join`、口座を数えるのに `unique`。`chunk_by` は*隣接する*等しいキーしか
まとめません — それがソートを先にする理由のすべてです。スターターはソート
していない入力に対して、隣接のまとめを手でやっています。
'''
hints = [
  "`use itertools::Itertools;` が `sorted_by_key`、`chunk_by`、`join`、`unique` をすべてのイテレータに載せます。",
  "`transfers.iter().sorted_by_key(|(account, _)| *account)` はソート済みの要素のイテレータを返し — 安定なので、ひとつの口座の二つの送金は順序を保ちます — その上の `.chunk_by(|(account, _)| *account)` が連をまとめます。",
  "`ChunkBy` は参照でイテレートします: `let grouped = ...chunk_by(...); for (account, group) in &grouped { ... }`。`group` はその口座の送金のイテレータです。",
  "ループの中: `let amounts: Vec<i64> = group.map(|(_, cents)| *cents).collect();` 次に `println!(\"{account} {}={}\", amounts.iter().join(\"+\"), amounts.iter().sum::<i64>())`。",
]

