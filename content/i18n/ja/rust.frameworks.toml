# RUST LAND — FRAMEWORKS, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/rust/frameworks.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.
# Crate names (anyhow, serde, tokio, clap…) are names and stay as they are.

pack   = "rust.frameworks"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.frameworks.01.anyhow-context"
title = "疑問符ひとつ"
story = "決済パスに戻って最初の朝。グロスター・ロード裏の決済リーダーが四千行のファイルの三行目で落ちて、言うのは「invalid digit found in string」だけだ。"
brief = '''
標準入力から `<ACCOUNT> <CENTS>` の行を読み込み、合計をセント単位で
`TOTAL <n>` として出力してください。

行が二つのフィールドでない、またはセントが `i64` として解析できない場合は、
代わりに次の一行を出力して正常終了してください:

```
ERROR: line 3: invalid digit found in string
```

これは `anyhow` 自身による、一層のコンテキストを持つエラーの表示です:
`format!("{:#}", err)` はコンテキスト、コロン、原因の順に出力します。
コンテキストは `line <n>`(1 始まり)です。エラーの場合、それ以外は何も
出力しません。

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

実際の処理をする関数の戻り値型に `anyhow::Result` を使い、`?` で伝播し、
`.with_context(|| ...)` でどの行かを言ってください。スターターは unwrap して
パニックし、スタックトレースを出して 101 で終了します — フロアの誰にも
読めるメッセージではありません。
'''
hints = [
  "`use anyhow::{Context, Result};` — `Result<T>` は `Result<T, anyhow::Error>` で、`?` はどんな `std::error::Error` でもそれに変換します。",
  "`.with_context(|| format!(\"line {n}\"))` は `Result` にも `Option` にも使えます(`Option` はそのメッセージを持つエラーになります)。`?` の前に付けてください。",
  "`anyhow::Error` に対する `{:#}` は `context: cause` を一行で出力します。素の `{}` は最も外側のコンテキストだけです。",
  "欠けたフィールドは `None` であって解析エラーではありません: `.ok_or_else(|| anyhow!(\"missing amount\"))` でエラーにし、同じ `line n` のコンテキストを付けてください。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.frameworks.02.thiserror-enum"
title = "名前のあるエラー"
story = "送金サービスはどの拒否にも同じ文字列「bad transfer」で答え、二階上のサポートデスクはどの種類なのかを訊くためにエンジニアへ電話をかけ始めた。"
brief = '''
二つの口座 `A` と `B` は、一行目の残高から始まります。次に二行目に `n`、
その後に `n` 件の送金 `<FROM> <TO> <CENTS>` が続きます。

順番に適用してください。各件について `OK <FROM> <TO> <CENTS>` か、エラーを
出力します — エラーは三つのバリアントを持つ `thiserror` の enum で、その
`Display` は正確に次のとおりです:

* `unknown account X` — `FROM` か `TO` が `A` でも `B` でもない(`FROM` を先に調べる)
* `insufficient funds in A: need 300, have 100`
* `nothing to move` — 金額がゼロか負

送金のあとに `A <balance>` と `B <balance>` を出力してください。

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

enum を `#[derive(Debug, thiserror::Error)]` で定義し、各メッセージをその
`#[error("...")]` 属性に、フィールドを補間して置いてください — タプル
バリアントには `{0}`、名前付きフィールドには `{need}` です。`transfer` は
`Result<(), TransferError>` を返し、`main` は `{}` で出力します。スターターには
ロジックがあり、すべてに `bad transfer` を出力します。
'''
hints = [
  "enum に `#[derive(Debug, thiserror::Error)]`、各バリアントに `#[error(\"...\")]` — それが `impl Display` と `impl std::error::Error` のすべてです。",
  "属性の中の `{0}` はタプルバリアントの最初のフィールド、`{need}` と `{have}` は構造体バリアントの名前付きフィールドです。",
  "金額より先に二つの口座名を、そして `TO` より先に `FROM` を調べてください: 隠れたケースは `C B 0` を送ってきて、どのエラーが勝つかは課題文が言っています。",
  "シグネチャは `Result<(), TransferError>` に変わり、`main` の `println!(\"{e}\")` が属性のテキストを出力します。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.frameworks.03.serde-derive"
title = "ワイヤーの形"
story = "怡和街のカード端末は注文を JSON で送ってくる。古いリーダーはカンマを数えて金額を見つけていて、名前にカンマのある店は間違った列で支払いを受けていた。"
brief = '''
標準入力は注文の JSON 配列ひとつです。各注文は `"id"`(数値)、`"merchant"`
(文字列)、`"cents"`(数値)を持つオブジェクトです。

注文ごとに一行、届いた順に `<id> <merchant> <cents>` を出力し、その後に
`TOTAL <sum of cents>` を出力してください。

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

その三つのフィールドを持つ `struct Order` を定義して `#[derive(Deserialize)]`
を付け、読み取りは `serde_json::from_str::<Vec<Order>>` に任せてください。
スターターはカンマで分割しています。オブジェクトのキーはどの順でも、空白は
いくらあってもよく、文字列にはカンマが含まれうる — それが要点です。
'''
hints = [
  "`use serde::Deserialize;` と struct への `#[derive(Deserialize)]` — フィールド名が JSON のキーで、型がそれぞれ何であるべきかを言います。",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` — 左側の型が、serde に何を組み立てるかを教えます。",
  "キーの順序と空白は JSON の問題であって、あなたの問題ではありません。serde はその三つのキーを持つどんなオブジェクトでも読みます。出力は前と同じループです。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.frameworks.04.serde-attributes"
title = "銀行が読むもの"
story = "銀行は怡和街の決済ファイルを週に二度はね返す: 承認されなかったカードはすべて `\"authCode\":null` として出ていき、手数料を送らない一台の端末が、ファイルが書かれる前にリーダーを止めてしまう。"
brief = '''
標準入力は端末からの決済レコードの JSON 配列ひとつです。各レコードは
`"terminalId"`(文字列)、`"merchant"`(文字列)、`"amountCents"`(数値)を持ち、
`"feeCents"`(数値)と `"authCode"`(文字列)は持つことも持たないこともあります。
キーはどの順で来てもかまいません。

レコードごとに一行、入力順に出力してください: 銀行が望む形のレコード、
`serde_json::to_string` によるコンパクトな JSON で、キーはこの順、綴りも正確に
このとおり — `terminalId`、`merchant`、`amountCents`、`feeCents`、`authCode`。
欠けた `feeCents` は `0` と書き、欠けた `authCode` は**省く**こと、決して
`null` と書かないこと。その後に `NET <sum of amountCents minus feeCents>` を
出力してください。

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

ひとつの struct が両方向を担います: snake_case のフィールドに
`#[derive(Serialize, Deserialize)]`、struct に `#[serde(rename_all = "camelCase")]`、
`fee_cents` に `#[serde(default)]`、そして `auth_code: Option<String>` に
`#[serde(skip_serializing_if = "Option::is_none")]` です。`to_string` は struct が
宣言した順にフィールドを書くので、出力は正確になります。スターターはすべての
フィールドを手で rename し、手数料のないレコードを読めず、`null` を書きます。
'''
hints = [
  "`use serde::{Deserialize, Serialize};` — struct ひとつ、derive 二つ。struct への `#[serde(rename_all = \"camelCase\")]` が、フィールドごとの `rename` をすべて置き換えます。",
  "`fee_cents: i64` への `#[serde(default)]` は、欠けたキーを `i64::default()`、つまり `0` で埋めます。これがないと手数料のないレコードはデシリアライズエラーです。",
  "`Option<String>` は欠けたキーをすでに `None` として読みます。`#[serde(skip_serializing_if = \"Option::is_none\")]` が要るのは*書く*側で、なければ `null` としてシリアライズされます。",
  "`serde_json::to_string(record)` は struct のフィールド順でコンパクトな JSON を返します。それを `println!` で、レコードごとに一行ずつ。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.frameworks.05.json-value-walk"
title = "葉ごとに一行"
story = "パーシバル・ストリートの新しい端末ベンダーが、誰も struct を書いていないネストしたオブジェクトを送ってくる。サポートデスクは中身を今日見たいのであって、struct ができてからではない。"
brief = '''
標準入力は、トップレベルがオブジェクトか配列である JSON 文書ひとつです。
すべての葉の値を `<path> = <value>` として、一行にひとつずつ出力してください。

* オブジェクトのキーは**ソート順**(キーのバイト順 — `serde_json::Value::Object`
  がイテレートする順です)で訪れ、配列の要素は添字順で訪れます。
* パスはキーを `.` で結んだもので、配列の添字は `[i]` です: `terminal.id`、
  `orders[0].cents`、ルート配列の中の配列なら `[1][0]`。キーにドットや角括弧は
  含まれません。
* 文字列は引用符なしで出力します。数値、`true`、`false`、`null` は JSON が書く
  とおりに出力します(`1.5` は `1.5` のまま、`null` は `null` という語)。
* 空のオブジェクトや空の配列には葉がなく、何も出力しません。

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

`serde_json::from_str::<serde_json::Value>` で解析し、`Value::Object`、
`Value::Array`、そしてそれ以外にマッチする再帰的な
`walk(path: &str, value: &Value)` を書いてください。スターターはトップレベル
だけを歩いてそこにあるものをそのまま出力するので、ネストしたオブジェクトは
JSON 一行として出てきて、ルート配列はパニックになります。
'''
hints = [
  "`use serde_json::Value;` と `let doc: Value = serde_json::from_str(&input)?;` — `Value` は enum です: `Null`、`Bool`、`Number`、`String`、`Array(Vec<Value>)`、`Object(Map<String, Value>)`。",
  "再帰がパスを運びます: `fn walk(path: &str, value: &Value)`。オブジェクトでは `for (key, child) in map` がすでにキーのソート順で、配列では `iter().enumerate()` が添字を与えます。",
  "パスは一段につき一片ずつ伸びます: `path` が空でなければ `format!(\"{path}.{key}\")`(空ならキーだけ)、添字には `format!(\"{path}[{i}]\")` です。",
  "`Value::String(s) => println!(\"{path} = {s}\")` が文字列を裸で出力し、`other => println!(\"{path} = {other}\")` は `Value` 自身の `Display` を使います。それはコンパクトな JSON です — `null`、`true`、`1.5`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.frameworks.06.toml-config"
title = "サービスの設定ファイル"
story = "グロスター・ロードの決済サービスは設定テーブルを手で添字参照していて、二つ目の `[[upstream]]` が一つ目を上書きした。火曜日以来、すべての決済がフォールバックに行っている。"
brief = '''
標準入力は TOML のサービス設定です:

* トップレベル: `name`(文字列、必須)、`port`(整数、デフォルト `8080`)
* テーブル `[limits]`(必須): `max_cents`(整数、必須)、`retries`(整数、
  デフォルト `3`)
* テーブルの配列 `[[upstream]]`、ゼロ個以上、それぞれ `name` と `url`(文字列、
  必須)と `timeout_ms`(整数、デフォルト `1000`)

サマリーを出力してください — `SERVICE` 行ひとつ、`LIMIT` 行ひとつ、そして
テーブルごとにファイル順で `UPSTREAM` 行ひとつ:

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

入力が有効な TOML でない、またはその形をしていない(必須キーの欠落、型の違う
値)場合は、唯一の行として正確に `ERROR: config rejected` を出力し、正常終了
してください。toml 自身のメッセージは出力しないこと。

形を struct で記述してください — `Config`、`Limits`、`Upstream`、それぞれ
`#[derive(Deserialize)]`、デフォルトは `#[serde(default)]` か
`#[serde(default = "fn_name")]` で — そして `toml::from_str::<Config>(&input)`
で読み、`Result` に対して match してください。スターターは `toml::Table` を
読んで添字参照しており、完全なファイルには動きますが、それ以外のすべてで
パニックします。
'''
hints = [
  "`use serde::Deserialize;` — toml は serde_json と同じく serde のフォーマットなので、`toml::from_str::<Config>(&input)` は同じ種類の derive した struct を組み立てます。`[table]` は struct のフィールド、`[[array_of_tables]]` は `Vec<Struct>` のフィールドです。",
  "型の `Default` ではないデフォルトは関数です: `#[serde(default = \"default_port\")]` と `fn default_port() -> u16 { 8080 }`。`Vec` への素の `#[serde(default)]` は、欠けた `[[upstream]]` を空のリストにします。",
  "`toml::from_str` は `Result<Config, toml::de::Error>` を返します。必須キーの欠落、型違い、構文エラーのすべてが `Err` に落ちます。それに対して match して自分の行を出力してください — エラーを `{}` しないこと。",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.frameworks.07.clap-derive"
title = "フラグの一行"
story = "決済ボックスの運用ツールは `--limit` を取る。グロスター・ロードのデスクの誰かが `--limti 50` と打ち、ツールはそれをバッチ名と受け取って、全バッチに対して実行した。"
brief = '''
`settle` は次を持つコマンドラインツールです:

* 必須の位置引数 `BATCH` ひとつ(文字列)
* `--limit <N>`、符号なし整数、デフォルト `100`
* `--dry-run`、フラグ

ハーネスは引数を渡さないので、コマンドラインは標準入力から来ます: 空でない
各行がコマンドライン一本で、空白で分割します(ツール自身の名前は行にあり
ません)。各行について一行出力してください:

* 成功なら `batch=<BATCH> limit=<N> dry-run=<true|false>`
* 失敗なら `ERROR: ` と clap の `ErrorKind` の `Debug` 形式 —
  `ERROR: MissingRequiredArgument`、`ERROR: ValueValidation`、
  `ERROR: UnknownArgument`、`ERROR: InvalidValue`(後ろに値のないオプション)

```
input:  2024-06-01 --limit 50
        --dry-run 2024-06-02
        2024-06-03 --limit ten
output: batch=2024-06-01 limit=50 dry-run=false
        batch=2024-06-02 limit=100 dry-run=true
        ERROR: ValueValidation
```

インターフェースを `#[derive(clap::Parser)]` 付きの struct として宣言し —
`#[arg(long, default_value_t = 100)]`、そして `bool` に `#[arg(long)]` — 各行を
`Cli::try_parse_from(std::iter::once("settle").chain(words))` で解析してください。
`Err(e)` は `e.kind()` を持っています。オプションは位置引数の前にも後にも来る
ことがあり、`--limit=7` は `--limit 7` と同じです。`--help` は送らないこと。
スターターは何でも受け付ける手書きのループです。
'''
hints = [
  "`use clap::Parser;` と struct への `#[derive(Parser)]`: 素のフィールドは位置引数、`#[arg(long)]` は `--field-name` を作り、フィールドの型が値のパーサーです — `u32` はあなたの代わりに `ten` を拒みます。",
  "`#[arg(long, default_value_t = 100)] limit: u32` が型付きの値としてのデフォルトで、`#[arg(long)] dry_run: bool` はあるかないかのフラグ、行の上では `--dry-run` と綴ります。",
  "`Cli::parse()` は本物の argv を読みますが、ここでは空です。`Cli::try_parse_from(iter)` は最初の要素がプログラム名である任意の文字列イテレータを取ります: `std::iter::once(\"settle\").chain(line.split_whitespace())`。",
  "`Err(e) => println!(\"ERROR: {:?}\", e.kind())` — `ErrorKind` は素朴な enum で、その `Debug` はバリアント名です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.frameworks.08.clap-subcommands"
title = "三つの動詞、ひとつのツール"
story = "グロスター・ロードの決済ボックスの運用ツールは、最初の単語で分岐する三つの if として `pay`、`refund`、`balance` を増やしてきた。`refudn` は最後の分岐に落ち、デスクは拒否を期待したところで残高を読んだ。"
brief = '''
`till` は三つのサブコマンドを持つコマンドラインツールです:

* `pay <TO> <CENTS>` — `TO` は文字列、`CENTS` は符号なし整数。
  `PAY <CENTS> to <TO>` を出力
* `refund <ID> [--reason <WORD>]` — `REFUND <ID>` を、理由が与えられたときは
  `REFUND <ID> because <WORD>` を出力
* `balance [ACCOUNT]` — `ACCOUNT` のデフォルトは `main`。`BALANCE <ACCOUNT>`
  を出力

前回と同じく、ハーネスは引数を渡しません: 標準入力の空でない各行がコマンド
ライン一本で、空白で分割し、ツール名は付きません。コマンドライン一本につき
出力一行。失敗時は `ERROR: ` と clap の `ErrorKind` の `Debug` 形式を出力
します: 知らない最初の単語は `ERROR: InvalidSubcommand`、位置引数の欠けた
サブコマンドは `ERROR: MissingRequiredArgument`、整数でない `CENTS` は
`ERROR: ValueValidation`、サブコマンドが持たないオプションは
`ERROR: UnknownArgument` です。

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

`#[command(subcommand)]` を付けたフィールドひとつを持つ struct に
`#[derive(Parser)]` を使い、そのフィールドの型は `#[derive(Subcommand)]` 付きの
enum にします。各バリアントのフィールドがそのサブコマンドの引数で、バリアント名
を小文字にしたものが行の上の単語です。`help` が四つ目の動詞にならないよう、
struct に `#[command(disable_help_subcommand = true)]` を置いてください。
`--help` は送らないこと。スターターは最初の単語に match し、残りを添字参照
しています。
'''
hints = [
  "`use clap::{Parser, Subcommand};` — struct はフィールドひとつ `#[command(subcommand)] command: Command` を持ち、`Command` は `#[derive(Subcommand)]` 付きの enum です。",
  "構造体風のバリアント `Pay { to: String, cents: i64 }` は位置引数二つのサブコマンドで、`#[arg(long)] reason: Option<String>` は省略可能な `--reason`、`#[arg(default_value = \"main\")] account: String` は省略可能な位置引数です。",
  "struct に `#[command(name = \"till\", disable_help_subcommand = true)]` — これがないと clap は自前の `help` サブコマンドを足し、`help` という行は `InvalidSubcommand` ではなく `DisplayHelp` を出力します。",
  "`try_parse_from` のあと、`cli.command` に対して match します: `Command::Refund { id, reason: Some(why) } => ...` と `Command::Refund { id, reason: None } => ...` は、ひとつの match の二つのアームです。",
