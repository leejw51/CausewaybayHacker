id    = "rust.frameworks.13.rand-seeded-shuffle"
title = "同じ抽選をもう一度"
story = "グロスター・ロード裏の不正対策デスクは、手作業の確認のためにその日の怡和街の店からランダムな標本を引く。監査人が昨日の標本にどの店がいたかを訊くが、それを引いたプログラムはもう一度引けない。"
brief = '''
標準入力は二行です。一行目はシード、符号なし 64 ビット整数。二行目は
