story = "夜間のリスクスコアは怡和街の店を一軒ずつ、百ミリ秒ずつ歩く。八十軒になると決済の時間枠の中で終わらなくなり、通り全体が一日遅れで記帳される。"
brief = '''
標準入力は最大 100 行の `<ID> <CENTS>` です: 非負の整数二つ。それらに対する
三つのパスがあり、それぞれ行ごとの `async fn` で、スターターにすでにあります:

