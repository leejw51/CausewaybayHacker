id    = "rust.frameworks.20.tokio-timeout-select"
title = "一秒、それで否"
story = "タイムズスクエアのラッキー・マックの端末は、アクワイアラがかかるだけの時間、アクワイアラを待つ。遅い午後にはそれがタップ一回につき三秒で、行列はエスカレーターまで届いた。"
