[[quest]]
id    = "rust.frameworks.23.the-settlement"
title = "決済"
story = "グロスター・ロード裏の決済パス、17:30。今日の送金は JSON ファイル一つで届き、銀行は 18:00 までに口座ごとに一行を欲しがっていて、今夜出ていくファイルは監査人が三月に読むものだ。"
brief = '''
標準入力は JSON オブジェクト一つです: `"date"`(文字列、`YYYY-MM-DD`)と
`"transfers"`、`{"from", "to", "cents"}` の配列。

決済を出力してください:

```
input:  {"date": "2026-10-06", "transfers": [
          {"from": "LUCKYMAC", "to": "BANK", "cents": 3800},
          {"from": "SOGO", "to": "BANK", "cents": 12500},
          {"from": "BANK", "to": "LUCKYMAC", "cents": 300}]}
output: SETTLEMENT Tue 06 Oct 2026
        BANK 16000
        LUCKYMAC -3500
        SOGO -12500
        MOVED 3
```

一行目は `%a %d %b %Y` で整形した日付です。次に、どこかに現れる口座ごとに
一行、**名前でソートして**、その純額とともに: 受け取ったすべてから払った
すべてを引いたもの。次に `MOVED <number of transfers>`。

または `ERROR:` の一行だけで、他には何も出力しません。この順で調べます:

* 入力がまったくその形をしていない — `ERROR: not a settlement`
* 日付が解析できない — `ERROR: bad date 2026-13-01`
* それから各送金を順に、1 始まりで — `cents` がゼロか負なら
  `ERROR: transfer 2: nothing to move`、`from` が `to` と等しいなら
  `ERROR: transfer 1: BANK pays itself`

後ろの道から組み立ててください: 形には `serde`、日付には `chrono`、エラーには
コンテキスト付きの `anyhow`、そして `tokio` — 送金ごとにタスク一つがそれを
検証し、両側を `Arc<tokio::sync::Mutex<BTreeMap<String, i64>>>` に記帳し、最初の
悪い送金が報告されるものになるよう**順に** join します。スターターは解析して
spawn しますが、受け取る側にしか記帳せず、決して検証せず、日付を来たまま出力
します。
'''
