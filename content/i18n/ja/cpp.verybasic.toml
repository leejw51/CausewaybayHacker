# C++ LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/cpp/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "cpp.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.verybasic.01.print"
title = "午砲の第一声"
story = "12:00、ヌーンデイガン。発砲記録は一行で始まるはずなのに、その一行がない。"
brief = '''
プログラムは正確に `hello, causewaybay` と改行を出力しなければなりません。C++
ではそれは標準出力ストリームに送る文一つです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — ストリーム、文字列、改行、セミコロン。",
  "一重引用符は文字定数を作ります。文字列には二重引用符が要ります。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.verybasic.02.int-types"
title = "INT に収まらない数"
story = "午砲の記録は 1860 年から撃った砲弾を百分の一単位で数え、それを保持していたレジスタは 32 ビット幅だ。"
brief = '''
`a` を読みます。プログラムには `big` が要ります。`a` の十億倍を保持する 64 ビット整数で、
`a` が 2 を超えると `int` には収まらない値です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
output: 3000000000
```
'''
hints = [
  "`long long big = a * 1000000000LL;` — 接尾辞 `LL` で定数も 64 ビットになります。",
  "`int` は 32 ビットです。五十億は収まらず、結果はでたらめになります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.verybasic.03.floats"
title = "小数の潮位"
story = "潮位表はある読み値を別の読み値で割り、港長が小数二桁を望んだところに整数を出力する。"
brief = '''
正の整数 `a` と `b` を読みます。プログラムには商を `double` で持つ `q` が要ります。
整数を整数で割ると、どちらかを先に変換しない限り結果は整数です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "`double q = static_cast<double>(a) / b;` — 割る前に片方を変換します。",
  "二つの整数での `a / b` は、double になる前に整数へ切り捨てられます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.verybasic.04.strings"
title = "名前の長さ"
story = "サンパンの名前は船首に描かれていて、港の記録はその長さを文字数で欲しがっている。"
brief = '''
一行を `s` に読みます。プログラムはそれが何文字あるかを出力しなければなりません。
`std::string` は自分の長さを知っています。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: 8
```
'''
hints = [
  "`std::cout << s.size() << '\\n';` — `size()` は呼び出しなので括弧が要ります。",
  "`sizeof(s)` は文字列オブジェクトそのものの大きさで、中のテキストの大きさではありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.verybasic.05.bool-if"
title = "偶数か奇数か"
story = "船台のウインチはサンパンを二隻ずつ引き上げ、集計は最後の一隻が一隻だけで上がるかどうかを示す。"
brief = '''
`n` を読みます。プログラムには `bool` の `even` が要ります。`n` が二で割り切れるとき
真になるものです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "`bool even = n % 2 == 0;` — `%` は余り、`==` は比較です。",
  "`=` 一つは代入です。比較には二つ要ります。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.verybasic.06.loops"
title = "礼砲を数える"
story = "砲は n 発撃ち、記録はその番号を足し合わせるが、使っているループが始まらない。"
brief = '''
`n` を読みます。プログラムは `1 + 2 + … + n` を `sum` に足さなければなりません。ループの
本体は書いてあります。`i` を 1 から `n` まで進める `for` の見出しが穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  10
output: 55
```
'''
hints = [
  "`for (long long i = 1; i <= n; ++i) {` — セミコロンで区切った三つの節です。",
  "`<` は一つ手前で止まります。`<=` は `n` 自身を含みます。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.verybasic.07.functions"
title = "その二乗"
story = "ポンプ室の計器が読み値を示し、表示はその二乗を欲しがるが、それをするはずの関数は役に立つものを何も返さない。"
brief = '''
`square` は数を受け取り、その数を自分自身と掛けたものを返さなければなりません。
本体が穴です。`main` は `x` を読んで `square(x)` を出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7
output: 49
```
'''
hints = [
  "`return x * x;` — 掛けて、その結果を返します。",
  "C++ の `^` はビット単位の XOR で、累乗ではありません。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.verybasic.08.structs"
title = "屋台一軒、フィールド二つ"
story = "避風塘の屋台台帳は屋台ごとに名前と値段を持ち、新しい屋台の記録は空だ。"
brief = '''
`Stall` には `name` と `price` があります。プログラムは両方を読み終えていて、それらから
作った `Stall` の `s` が要ります。集成体は波括弧で、フィールドの順に初期化します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "`Stall s{name, price};` — 波括弧、フィールドは構造体が宣言する順に。",
  "初期化子が一つだと最初のフィールドしか埋まらず、値段はゼロになります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.verybasic.09.struct-method"
title = "屋台自身の合計"
story = "屋台の記録はそれぞれ値段と数量を知っているのに、その `total()` はどんな問いにもゼロと答える。"
brief = '''
`Stall::total` は `price` と `qty` の積を返さなければなりません。メンバ関数の中では
フィールドは名前で使います。本体が穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "`return price * qty;` — フィールドを名前で、掛け合わせます。",
  "`this` はポインタなので `this->price` になります。名前だけのほうが簡単です。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.verybasic.10.enums"
title = "二つの路線、二つの色"
story = "避風塘のバス停の上の乗換案内は MTR の二路線を示し、列挙子を選ぶ配線が切れている。"
brief = '''
一語、`island` か `tsuenwan` を読みます。プログラムにはその語で選んだ `Line` の
列挙子 `line` が要ります。色を出力する `switch` は書いてあります。`enum class` の
列挙子は常に型名を付けて書きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "`Line line = word == \"island\" ? Line::Island : Line::TsuenWan;` — 条件演算子、列挙子は修飾付きで。",
  "前に `Line::` がなければ、`Island` はコンパイラの知らない名前です。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.verybasic.11.vector"
title = "一つずつの水揚げ"
story = "サンパンは水揚げを一度に一つの数ずつ下ろし、集計のベクタは空のままだ。"
brief = '''
整数の行を読みます。各値 `x` は読んだそばからベクタ `xs` に追加しなければなりません。
ループと出力部分は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "`xs.push_back(x);` — ベクタは後ろに伸びます。",
  "`push` は `std::stack` のものです。ベクタでは `push_back` です。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.verybasic.12.vector-edit"
title = "最初の一隻を外す"
story = "ウインチ待ちはサンパン番号のベクタで、最初の一隻はもう上がったのに、まだリストに残っている。"
brief = '''
`v` はその行の整数を持っています。プログラムは最初の要素を取り除き(`erase` は
消す要素へのイテレータを受け取ります)、残りを出力しなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "`v.erase(v.begin());` — `begin()` は最初の要素へのイテレータです。",
  "`pop_back` は最後の要素を取り除きます。ベクタに `pop_front` はありません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.verybasic.13.list"
title = "列の先頭へ"
story = "避風塘の係留リストは連結リストで、新しいサンパンはどれも先頭に入るはずだ。"
brief = '''
整数の行を読みます。各 `x` は `std::list` の `l` の先頭に積まなければならず、
最後に読んだものが最初に出力されます。ループと出力部分は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "`l.push_front(x);` — リストはどちらの端にも定数時間で伸ばせます。",
  "`push_back` は入力の順を保ちます。逆順にするのは先頭です。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.verybasic.14.maps"
title = "集計ボード"
story = "避風塘の集計ボードは水揚げの種類ごとに数を数えるが、その数はまったく動かない。"
brief = '''
単語の行を読みます。各単語 `w` について `counts` の数を一つ増やさなければなりません。
`std::map` は、ないキーを最初に添字で引いたときにゼロで作ります。ループと
ソート済みの出力部分は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "`++counts[w];` — 添字でキーがゼロで作られ、それからインクリメントです。",
  "`at()` はまだないキーでは例外を投げます。`[]` は作ります。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.verybasic.15.hashtable"
title = "引くか、引かないか"
story = "屋台の値段はハッシュテーブルにあり、誰も聞いたことのない屋台への問い合わせは、でっち上げのゼロではなくマイナス一と答えなければならない。"
brief = '''
`table` は屋台名を値段に対応させるもので、最初の行から作られます。名前 `q` を一つ
読みます。プログラムには `price` が要ります。キーがあればテーブルの値、なければ
`-1` です。`[]` だと黙ってゼロを挿入してしまいます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "`long long price = table.count(q) ? table[q] : -1;` — まず尋ね、それから添字で引きます。",
  "ないキーに `table[q]` を使うと 0 で挿入され、問い合わせは -1 ではなく 0 を出力します。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.verybasic.16.sets"
title = "どの数も一度ずつ"
story = "係留番号は重複付きで届き、台帳には各番号を一度ずつ、順に持たせたい。"
brief = '''
整数の行を読みます。各 `x` は `std::set` の `seen` に入れなければなりません。
セットは各値を一つずつ昇順に保ちます。大きさと値の出力部分は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "`seen.insert(x);` — セットには `insert` があり、すでに持っている値は無視します。",
  "`push_back` はシーケンスの言葉です。セットに後ろはありません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.verybasic.17.stack"
title = "後入れ先出し"
story = "避風塘の厨房の受け渡し口で皿が積み上がり、上から取られていくが、スタックは皿を一枚も受け取らない。"
brief = '''
整数の行を読みます。各 `x` は `std::stack` の `st` に積まなければなりません。
プログラムはそのあと全部を取り出し、最後に入れた値から出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "`st.push(x);` — スタックは push し、`top()` は最後の push を見ます。",
  "`push_back` はベクタ用です。`std::stack` では `push` です。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.verybasic.18.queue"
title = "先入れ先出し"
story = "避風塘の麺の屋台に客が並び、来た順に出されるはずなのに、キューは誰も受け付けない。"
brief = '''
整数の行を読みます。各 `x` は `std::queue` の `q` に入れなければなりません。
プログラムはそのあと、来た順に先頭から取り出します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1 2 3 4
```
'''
hints = [
  "`q.push(x);` — 後ろから入れ、`front()` で読み、`pop()` で取ります。",
  "`push_front` は `deque` の言葉です。キューは後ろにしか入れません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.verybasic.19.heap"
title = "次はいちばん小さいもの"
story = "ウインチは毎回いちばん軽いサンパンを次に引き上げるが、それを渡すはずのヒープが上下逆さだ。"
brief = '''
整数の行を読みます。プログラムはそれを全部 `pq` に積み、一つずつ取り出しますが、
小さいものから出てこなければなりません。`std::priority_queue` は比較子に
`std::greater` を指定して宣言しない限り最大ヒープです。`pq` の宣言が穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "`std::priority_queue<long long, std::vector<long long>, std::greater<long long>> pq;` — 値の型、コンテナ、比較子。",
  "比較子は三番目のテンプレート引数です。二番目はコンテナです。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.verybasic.20.sorting"
title = "水深順"
story = "係留は船が着いた順に記録され、海図はそれを水深の浅い順に欲しがっている。"
brief = '''
`v` はその行の整数を持っています。プログラムはそれをその場で昇順にソートしなければ
なりません。アルゴリズムは範囲を区切るイテレータの組を受け取ります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "`std::sort(v.begin(), v.end());` — 範囲はイテレータ二つです。",
  "`std::greater` は降順にソートします。既定は昇順です。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.verybasic.21.sort-by-key"
title = "いちばん重い水揚げを先に"
story = "水揚げ記録は各サンパンの名前と重さを並べ、ボードは最大の水揚げをいちばん上に欲しがっている。"
brief = '''
`rows` は `Row{name, score}` のレコードを持っています。プログラムはそれを `score` の
高い順にソートしなければなりません。`a` が `b` より前に来るのはいつかを答える
比較のラムダを付けた `std::sort` です。スコアはすべて異なります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
        mei 40
        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "`std::sort(rows.begin(), rows.end(), [](const Row& a, const Row& b) { return a.score > b.score; });` — ラムダは「a が先か?」に答えます。",
  "`<` だと最小が先になります。`>` は最大を先にします。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.verybasic.22.reverse"
title = "後ろから前へ"
story = "潮位の読み値は新しい順に記録され、海図は古い順に読む。"
brief = '''
`v` はその行の整数を持っています。プログラムはそれをその場で逆順にしなければ
なりません。範囲全体に対する `<algorithm>` のアルゴリズムです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "`std::reverse(v.begin(), v.end());` — メソッドではなく、範囲に対するアルゴリズムです。",
  "ベクタに `reverse()` メンバはありません。`std::list` にはありますが、ベクタはアルゴリズムを使います。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.verybasic.23.closures"
title = "潮位の補正値"
story = "どの読み値にも同じ補正値が足されるのに、その補正値を覚えているはずのラムダが忘れている。"
brief = '''
`k` を読み、次に整数の行を読みます。プログラムには `k` をキャプチャし、引数に `k` を
足したものを返すラムダ `add` が要ります。それがすべての値に適用され、結果が
出力されます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "`auto add = [k](long long x) { return x + k; };` — `[k]` がキャプチャです。",
  "空の `[]` だと、ラムダには `k` がまったく見えません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.verybasic.24.lambdas"
title = "偶数の停泊所を数える"
story = "岸壁沿いの停泊所の番号がリストで届き、事務所はそのうちいくつが偶数かを知りたがっている。"
brief = '''
`v` はその行の整数を持っています。プログラムには `evens` が要ります。そのうち偶数が
いくつあるかで、どの値を数えるかを答えるラムダを付けた `std::count_if` で数えます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "`long long evens = std::count_if(v.begin(), v.end(), [](long long x) { return x % 2 == 0; });` — 範囲、それから判定です。",
  "`std::count` は値を数えます。`count_if` は述語がはいと言うものを数えます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.verybasic.25.threads"
title = "ウインチ一台、スレッド一本"
story = "船台はサンパンの重さの合計を二本目のスレッドで出し、メインスレッドは待つが、そのスレッドは始まらない。"
brief = '''
`v` はその行の整数を持ち、`sum_of` はそれを足し合わせます。プログラムには
`sum_of(v)` を `result` に格納するラムダを走らせる `std::thread` の `t` が要ります。
`main` はそれを join して出力します。ラムダは `v` と `result` に届くよう、参照で
キャプチャしなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "`std::thread t([&] { result = sum_of(v); });` — スレッドは呼び出せるものから作ります。",
  "`[&]` は参照でキャプチャします。だからラムダは `result` に書けるのです。",
]

