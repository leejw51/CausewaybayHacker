title = "SEGFAULT"
story = "12:00、ヌーンデイガン。射撃表は探索木で、右側を下っていくはずの挿入が根で止まる。"
brief = '''
`insert` は `n` を根とする探索木に `v` を入れます。空の場合は書いてあり、新しい
ノードを作ります。穴は `v` を正しい側へ送る一行です。`n->val` より小さければ左、
そうでなければ右で、再帰が返すものを格納します。そのあと中間順の走査が昇順に
出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "`if (v < n->val) n->left = insert(n->left, v); else n->right = insert(n->right, v);` — 片側に再帰し、その結果を格納します。",
  "`n` はポインタです: `.` ではなく `->`。そして小さいほうは左です。",
]
