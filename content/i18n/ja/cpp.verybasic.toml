title = "一つのカウンタに四本の手"
story = "ポンプ室で四本のスレッドが一つのカウンタに足し、順番を守らせるはずのロックが最初の一周のあとずっと握られたままだ。"
brief = '''
四本のスレッドがそれぞれ `counter` に一を十万回足します。ループの各周回は足す間
ミューテックス `mu` を保持し、周回の終わりで解放しなければなりません。
プレースホルダはロックして決してアンロックしないので、二周目は永遠に待ちます。
ロックガードはスコープを抜けるときに解放します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "`std::lock_guard<std::mutex> lock(mu);` — 今ロックし、`}` で `lock` が消えるときにアンロックします。",
  "`mu.lock()` だけでは決して元に戻りません。次の周回は、このスレッドがすでに保持しているミューテックスで止まります。",
]

