# ZIG LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/zig/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "zig.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.advanced.01.lines"
title = "ブースの記録"
story = "1 番ブースのシフト記録は車両を一台一行で記録します: 係員が聞き取った名前、それから払ったもの、それが硬貨何枚になろうとも。プリンタはトンネルより古く、今もフェリー会社の言葉でページを締めます。"
brief = '''
一行目は数 `n` です。続く `n` 行はそれぞれ名前と、その後にスペース区切りの
ゼロ個以上の整数です。

車両ごとに一行 `<NAME> <how many numbers> <their sum>` を出力し、最後に
`BOATS <n>` を出力してください。料金所のプリンタが、フェリー会社のものだった
頃からずっとページの最後に書いてきた集計行です。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

ここでの単位はトークンではなく行です。入力全体に対する一回の
`std.mem.tokenizeAny` は空白で止まり、改行を気にしないので、ある車両がどこで
終わり次の車両がどこで始まるかを教えられません。先に入力を行に切ってください。
`std.mem.splitScalar(u8, input, '\n')` は、`next()` が `?[]const u8` を一行ずつ
返すイテレータをくれます。そしてその行の**中で**トークンに分けます。

それらのスライスはどれも `input` の中を指しています。何もコピーされません:
行はすでに所有しているバイトへの窓です。だから `input` はそれらをすべて使い
終えるまで生きていなければならず、だから `defer gpa.free(input)` が最後に
実行されるのです。
'''
hints = [
  "'\\n' での splitScalar は next() ごとに一行をくれます。その行に対して \" \\r\\t\" を区切りにした tokenizeAny は、そのトークンを走査し、行の終わりより先へは行きません。",
  "名前は最初のトークンなので、ループの前に fields.next() を一回呼んで取ってください。そうすれば while (fields.next()) |tok| は数だけを見ます。",
  "名前だけの行は特別扱いなしで 0 0 になります: while ループが一度も実行されないだけです。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.advanced.02.pointers"
title = "コピーは本物ではない"
story = "ブースの監督は硬貨トレイを一つずつ用紙のコピーに集計し、彼女の後ろの壁の用紙は決して変わりません。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

関数 `load` を通してすべての値を一つの `std.ArrayList(i64)` に積み、三行を
出力してください: `LOADED <how many>`、読むだけの関数 `total` による
`TOTAL <sum>`、そして `FIRST <value>` — 何もなければ `FIRST NONE` です。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

スターターはコンパイルでき、`LOADED 0` を出力します。`load` はリストを**値で**
受け取り、Zig の引数は変更できないので、スターターは人が次にやることを
やります: `var mine = sheet;`、つまりリストのヘッダのコピーを作り、それに
追加します。コピーは伸び、コピーは戻るときに死に、壁の用紙は手つかずです。

言いたいことを `*` で言ってください: `*std.ArrayList(i64)` 型の引数は呼び出し側の
リストのアドレスで、それを通した `sheet.append(gpa, value)` は呼び出し側の
リストに届きます。`total` は `[]const i64`(リストの `.items`)を受け取るべき
です。見る必要はあっても触る必要はなく、型の中の `const` がコンパイラに
それを守らせる方法です。

`FIRST` はオプショナルなポインタです: `?*const i64` は最初の要素のアドレスか
`null` のどちらかで、`null` は Zig が先に確認せずにはたどらせてくれない唯一の
値です。`if (first) |p|` がその確認です。これがこのランドのすべてを一行に
したものです。
'''
hints = [
  "load を直すのは二文字です: シグネチャの sheet: *std.ArrayList(i64) と、呼び出しの &sheet。ポインタ越しのメソッド呼び出しに矢印は要りません。sheet.append(gpa, v) は同じ行のままです。",
  "total は []const i64 を受け取り、sheet.items で呼ばれるべきです — const は約束で、コンパイラがそれを確かめます。",
  "&sheet.items[0] は最初の要素のアドレスで、要素があるときだけ意味を持ちます。if (first) |p| がオプショナルを取り出し、p.* がその先の値です。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.advanced.03.slices"
title = "列の真ん中"
story = "六時前、4 番ブースに四十台が詰まっています。監督には先頭のバンパーと最後尾のテールランプが見え、その間は何も見えません。"
brief = '''
標準入力は一行目に数 `n`、二行目にスペース区切りの `n` 個の整数です。`n` は
`1` 以上です。

三行を出力してください: 最初の値、最後の値、そして厳密にその間にあるすべての
値の合計です。値が三つ未満ならその合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

スライスが列です。`nums[0]` と `nums[nums.len - 1]` が両端で、
`nums[1 .. nums.len - 1]` が真ん中です。同じバイトの上の**新しいスライス**で、
コピーは作られません。そしてそれに対する `for` が合計です。スライスは添字と同じく
検査されます: 要素一つの列の真ん中を計算すると `nums[1..0]` になり、それは
`panic: start index 1 is larger than end index 0` です。ですから `nums.len` の
確認はスライスの後ではなく前に置きます。

`i64` で合計してください。隠れたケースの一つは真ん中が `i32` に収まらず、
`-O Debug` ではオーバーフローした `i32` は折り返しません — パニックします。
'''
hints = [
  "nums[1 .. nums.len - 1] は両端の間のスライスで、それに対する for が合計します。nums とメモリを共有します。",
  "値が一つか二つだとその範囲は空か逆向きで、逆向きのスライスは Debug ではパニックです — 書く前に nums.len への if で守ってください。",
  "真ん中は i64 です: 幅の広いケースは三十億の値を二つ足し、i32 の累積変数は integer overflow でパニックします。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.advanced.04.strings"
title = "バイトは文字ではない"
story = "料金所の頭上の標識は 銅鑼灣 を三バイトで切り詰め、一文字だけを見せます。"
brief = '''
一行を読みます。三行を出力してください:

1. その長さを**バイト**で
2. その長さを**文字**で — UTF-8 のコードポイント
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII 以外の文字が含まれることがあり、そのとき最初の二つの数は
同じではありません。Zig の文字列は `[]const u8` です: バイトのスライスで、
`.len` はバイトです。ずっとそうでした。この水準では言語はエンコーディングに
ついて何も知りません。`u8` はバイトです。

UTF-8 はデコードしなくても簡単に数えられます: どのコードポイントも
`10xxxxxx` の形**ではない**バイトで始まり、どの継続バイトもその形です。
ですからバイト `c` が文字を始めるのは、ちょうど `(c & 0xC0) != 0x80` のとき
です。バイトではなく文字を逆にしてください — `std.mem.reverse(u8, line)` は
`銅` を三つに切り、それを逆順に出力してしまいます。
'''
hints = [
  "for (line, 0..) |c, i| はバイトをその添字とともに走査します。(c & 0xC0) != 0x80 がすべての文字の最初のバイトを拾い出します。",
  "すべての文字の開始添字を std.ArrayList(usize) に集めてください。その長さが、何もデコードしない文字数です。",
  "開始添字を後ろから走査し、各文字のバイト line[from..to] を std.ArrayList(u8) に appendSlice して、その .items を {s} で出力してください。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.advanced.05.structs"
title = "ブースの台帳"
story = "2 番ブースはすべての車軸に課金し、明細を一枚の台帳用紙にまとめています — あるいは、提案が構造体の関数をコメントに置き換えるまではそうでした。"
brief = '''
一行目は `<NAME> <n>` です。続く `n` 行は `<ITEM> <CENTS>` です。

品目を集める、その名前の `Ledger` を作り、各品目を届いた順に `<ITEM> <CENTS>` と
出力し直し、それから `TOTAL <sum>`、それから `BOAT <name> <count>` を出力して
ください。台帳用紙はフェリー会社のもので、その名前欄は今も `BOAT` のままです。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` は `0` のこともあり、そのとき出力は最後の二行だけです。

Zig に `class` はありません。最も近いのは中で関数を宣言した `struct` で、
それがすべてです。背後で走るコンストラクタはありません: `init` は値を返す、
自分で書くただの関数です。隠れた `this` もありません: `self` は書き出された
最初の引数で、関数が台帳に書くときは `*Ledger`、読むだけのときは
`*const Ledger` です。それがメソッドの `const` を目に見えるようにしたものです。
`private:` もありません。フィールドはファイルのどこからでも届き、`main` を
`items` から遠ざけているのは、構造体が `total()` と `count()` を差し出していて、
それを迂回する理由がないことです。
'''
hints = [
  "std.ArrayList(Item) で十分です。構造体は、台帳が自分の明細を所有するためにあります。add は append 一つです: self.items.append(gpa, .{ .name = name, .cents = cents })。",
  "add は書くので self: *Ledger、total と count は読むだけなので self: *const Ledger。ledger.add(...) はどちらでも同じ呼び出しです — Zig がアドレスを取ってくれます。",
  "品目名は input のスライスなので、台帳を埋めるのに費用はかからず、input は台帳より長生きしなければなりません — main の defer の順序がすでにそれを保証しています。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.advanced.06.tagged-union"
title = "ハンドルを握っているのは誰"
story = "Autotoll 車線はどのタグにも会員料金を課します。会員でないタグにも、タグでないものにも。"
brief = '''
標準入力は数 `n`、その後 `<TYPE> <HOURS>` の `n` 行です。

基本料金は `500 + 100 * HOURS` セントです。各行について次のいずれかを出力して
ください:

* `MEMBER` — 基本料金
* `CREW` — 基本料金の半分、整数除算
* `JUNIOR` — 常に `200`
* それ以外 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

タグを、そのうち一つが `other` である四つの場合を持つ `union(enum)` として
モデル化してください。C++ の `enum class` はペイロードを運べず、認識できない
テキストはその横を一緒に運ばなければなりませんでした。Zig のタグ付き共用体は
それを場合の**中に**運びます: `other: []const u8` で、他の三つの場合は何も
運びません。`union(enum)` の場合は背後で整数に変換されることがなく、名前を
外側のスコープに漏らすこともありません。それが `enum class` が存在した二つの
理由です。

料金は `switch` 一つで決めてください。タグ付き共用体に対する `switch` はすべての
場合を網羅しなければなりません — 一つ漏らせばコンパイルできず、警告フラグは
要りません — そして `.other => |raw|` が、ペイロードをそれがいる場合から取り出す
方法です。
'''
hints = [
  "other: []const u8 が四つ目の場合で、.{ .other = raw } がそれを作ります。三つの void の場合は .member、.crew、.junior として作ります。",
  "std.mem.eql(u8, raw, \"MEMBER\") は二つのスライスを比べます。スライスに対する == はポインタを比べ、それは決して意図したものではありません。",
  "@divTrunc(base, 2) は書き出した整数除算です。符号付き整数に対する素の / は、結果が割り切れないかもしれないときコンパイルできません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.advanced.07.maps"
title = "料金所の呼び声"
story = "06:30 の料金所: どのブースも車線の向こうへ何かを叫んでいて、監督はその順位を欲しがっています。"
brief = '''
標準入力全体を読み、空白で分割してください。

相異なる語をそれぞれ一度ずつ `<word> <count>` として、数の降順に、同数なら語の
昇順に出力してください。

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)` は何によっても順序付けられていません — キーでも数でも
到着順でもありません — ですから順位付けは別の手順です: 項目を小さな構造体の
`std.ArrayList` に写し、比較関数付きの `std.mem.sort` で並べ替えます。
`getOrPut(word)` は枠を見つけるか挿入し、どちらだったかを `found_existing` で
教えます。それはまさに数えるループが欲しいものです。新しい枠の `value_ptr` は
書くまで初期化されていません。

Zig にラムダはありません。比較関数はただの関数で、名前で渡され、最初の引数は
それが捕捉したであろうコンテキストのためのものです。ここでは `void` 型の `{}` で、
何も捕捉しないからです。キーは `input` のスライスなので、マップは `input` が
解放される前に `deinit` されなければなりません: 正しい順序の `defer` が、一行も
考えずにそれをします。
'''
hints = [
  "getOrPut(word) は found_existing と value_ptr を持つ枠を返します。新しいときは value_ptr.* = 0 にし、それから一を足します。それが数えるループのすべてです。",
  "counts.iterator() は項目を走査し、各項目は key_ptr と value_ptr を持ちます。項目ごとに Row を一つ std.ArrayList(Row) に追加してください。",
  "比較関数は fn byRank(_: void, a: Row, b: Row) bool です — まず数の降順、次に std.mem.order(u8, a.word, b.word) == .lt — そして std.mem.sort(Row, rows.items, {}, byRank) がそれを適用します。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.advanced.08.hashtable"
title = "順序などまったくない"
story = "料金所の点呼はハッシュ表の気の向いた順で返ってきて、監督はそれをブースが実際に答えた順で欲しがっています。"
brief = '''
標準入力は数 `n`、その後それぞれブース名一つの `n` 行です。`n` は `1` 以上で、
名前は空白でない文字の一続きです。同じ名前が複数回現れることがあります。

相異なる名前をそれぞれ一度ずつ `<name> <count>` として、**その名前が最初に
現れた順に**出力してください。それから `DISTINCT <k>` を出力してください。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

コンテナはこれを自分ではくれません。そしてそれがこのクエストのすべてです。

`std.StringHashMap` はハッシュ表です: 検索は平均 O(1) ですが、`iterator()` は
項目を**バケット順**で返します — ソート順でも挿入順でもなく、表が伸びた瞬間に
変わります。何も順序を約束しないので、ハッシュマップを走査して出力する
プログラムは、出力がハッシュ関数に依存するプログラムです。スターターは
まさにそれをしていて、相異なる名前が一つだけのケースは通りさえします —
それが手がかりです: 順序を見分けられないテストは、順序が正しい証拠では
ありません。

二つの仕事を二つのコンテナに分けてください: `std.ArrayList([]const u8)` が
名前が最初に見られた順を覚え、`std.StringHashMap(i64)` が数えます。出力は
リストを走査して行います。
'''
hints = [
  "ハッシュ表は速く探すためのものです。リストは順序を覚えるためのものです。両方が要ります。",
  "found_existing は名前ごとにちょうど一度、挿入のときに false になります。それが名前を順序リストに追加する瞬間です。",
  "出力はリストを走査し、各数を count.get(name).? でマップに尋ねて行ってください。決してマップを走査しないでください。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.advanced.09.set-and-sort"
title = "誰がどこに停めているか"
story = "高架下の待避所の掲示板には同じバンが同じ区画に二回載っていて、どの行が重複なのか誰にも言えません。"
brief = '''
標準入力は数 `n`、その後 `<BERTH> <NAME>` の `n` 行です。

相異なる `<BERTH> <NAME>` の組をそれぞれ一度ずつ、区画順、次に名前順で出力し、
それから `DISTINCT <k>` と `DUPES <n - k>` を出力してください。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig に組の順序付き集合はありません。最も近いのは、それぞれ一つの仕事をする
二つの道具です。`std.StringHashMap(void)` は集合です — 値が場所を取らない
マップです — そして**行そのもの**(`2 KWAN`)をキーにすると、すでに入っている組の
二つ目のコピーを拒みます。小さな構造体 `{ berth, name }` の `std.ArrayList` が
集合の通したものを集め、比較関数付きの `std.mem.sort` がそれを区画、次に名前の
順に並べます。組を分解する構造化束縛はありません。構造体のフィールドには
すでに名前があります。
'''
hints = [
  "std.StringHashMap(void) が集合です。getOrPut(line).found_existing は行の二つ目のコピーで true、最初のもので false です。",
  "集合が通した行だけがリストに入るので、リストの長さが DISTINCT で、n からそれを引いたものが DUPES です。",
  "比較関数はまず区画で並べ、同じなら std.mem.order(u8, a.name, b.name) == .lt で並べます。std.mem.sort(Mooring, moorings.items, {}, byBerthThenName) がそれを適用します。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.advanced.10.comptime-fn"
title = "車線を一度通るだけ"
story = "車軸の記録は数の列です。Alex は for ループ四つだと言います。Mei は名前の付いた for ループ四つだと言い、その名前は関数です。"
brief = '''
標準入力はスペース区切りの整数の一行です。

四行を出力してください:

1. 偶数の値の合計(なければ `0`)
2. `10` より大きいすべての値を二倍にして、順に、スペース一つで区切ったもの —
   なければ `-`
3. 相異なる値がいくつあるか
4. `FIRST_BIG <i>` — `10` より大きい最初の値の 0 始まりの添字、または `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig には `<algorithm>` もラムダもなく、最も近いものは聞こえるより近くにあります:
**別の関数を `comptime` 引数として**取る関数です。
`fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64` は述語付きの
`accumulate` です。`isEven` を名前で渡すと、コンパイラは呼び出しをインライン化
した `sumIf` の版を打ち出し、実行時には関数ポインタがありません。`sumIf`、
`keepDoubled`、コピーに対する `std.mem.sort` と隣り合う組への一回の走査による
相異なる数、そして `indexOfFirst` を書いてください。要点はループが書きにくい
ことではなく、名前がそのループが何のためにあるかを言い、述語が読める値で
あることです。
'''
hints = [
  "comptime keep: fn (i64) bool が引数の型です。本体の中で keep(x) はただの呼び出しで、呼び出し側では isEven を括弧なしで渡します。",
  "keepDoubled には書き込む場所が要ります: 呼び出し側が deinit する std.ArrayList(i64) を返し、中でその deinit を errdefer して、append が失敗してもリークしないようにしてください。",
  "gpa.dupe(i64, xs) が並べ替えるためのコピーです。並べ替えたスライスでは重複が隣り合うので、値が新しいのはちょうど一つ前の値と違うときです。",
  "indexOfFirst は ?usize を返します。if (indexOfFirst(...)) |i| が見つかったものを出力し、else の枝が -1 を出力します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.advanced.11.generics"
title = "一度だけ書く"
story = "料金所の計器盤には largest が四回書かれています — 車軸用、分用、車線用、車線名用 — そして五つ目が始発のトラムの前に必要です。"
brief = '''
標準入力は二行です: 一行目に整数、二行目に語。

両方に使える **一つの** `largest` と、`larger()` と `smaller()` を持つ型
`Pair(T)` を書いてください。

最大の整数、最大の語、そして最初の二つの整数の `Pair` について
`PAIR <larger> <smaller>` を出力してください。同じ値なら `a` を大きいほうとします。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

スターターはコンパイルできません: `largest` は `i64` に釘付けなので、語を渡すと
*expected type '[]const i64', found '[][]const u8'* です。Zig の
ジェネリック関数は **`comptime T: type`** 引数を持つ関数です:
`fn largest(comptime T: type, xs: []const T) T` は呼ばれた型ごとに一度
打ち出され、`T` は推論されるのではなく呼び出しで書きます —
`largest([]const u8, words)`。

語には `>` がありません。スライスは `std.mem.order` で比べます。ジェネリックの
中で、`if (comptime T == []const u8)` がコンパイル時に比較を選びます — 当て
はまらない枝は解析されることさえなく、それは仕組みを何も持たないテンプレートの
特殊化と同じ考えです。

`Pair(T)` は型に対する同じ技です: `type` を取り**構造体を返す**関数です。
別のクラステンプレートの構文はありません。型はコンパイル時の値で、関数は
それを作れます。
'''
hints = [
  "最初の引数に comptime T: type、中のあらゆる i64 の代わりに T、そして呼び出しは largest(i64, nums.items) と largest([]const u8, words.items) になります。",
  "x > best はスライスではコンパイルできません。if (comptime T == []const u8) std.mem.order(u8, x, best) == .gt else x > best が、インスタンス化ごとに正しい比較を選びます。",
  "fn Pair(comptime T: type) type { return struct { ... }; } — 中では const Self = @This() が作っている構造体に名前を付け、Pair(i64){ .a = ..., .b = ... } がそれを一つ作ります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.advanced.12.function-values"
title = "遮断機の数"
story = "5 番ブースの遮断機は誰が入って誰がバックで出たかを数え、監督は途中で何があろうとシフトの終わりの数を欲しがっています。"
brief = '''
標準入力は数 `n`、その後それぞれ `IN` か `OUT` の `n` 行です。

ゼロを下回らない累計を保ち、各コマンドの後にそれを出力してください。それから
`INS <k>`(`IN` だったコマンドの数で、ジェネリックな `countIf` と述語関数で
数えます)と `CLOSED <final>` を出力してください。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Zig にはクロージャがありません — ラムダも捕捉もありません — そして最も近い
ものは、見えるところに書き出されます。カウンタは**自分の合計を持つ構造体**で、
`add` は `*Counter` のメソッドです: C++ のラムダなら `[total = 0LL]` で捕捉して
`mutable` を付けたであろう状態はフィールドで、それを変える呼び出しは構造体を
ポインタで受け取ります。構造体の外の何物も、`add` を通さずには合計に届きません。

述語は **`comptime` 引数として渡される関数**です: `countIf(commands, isIn)` は
`isIn` を名指しし、コンパイラがそれをインライン化します。捕捉するものは何もない
ので何も捕捉されず、面接官が尋ねるであろう `[&]` 対 `[=]` の問いには、ここに
隠れる場所がありません。
'''
hints = [
  "add は三行です: self.total += delta、ゼロで下限を切る、return self.total。書くので *Counter を受け取ります。count.add(...) がアドレスを渡してくれます。",
  "var count = Counter{} で宣言した Counter は、フィールドの既定値のおかげでゼロから始まります。const のものには足せません。",
  "fn countIf(items: []const []const u8, comptime pred: fn ([]const u8) bool) usize はスライスを走査し、pred が受け入れた項目を数えます。isIn を名前で渡してください。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.advanced.13.optional-union"
title = "数でない行"
story = "車軸カウンタの読み取り機は数の列を渡してきますが、その真ん中に誰かの朝食の注文があります。"
brief = '''
標準入力は数 `n`、その後 `n` 行です。各行は整数のはずです。

各行について、値を二倍にしたものか、解析できなければ `BAD <line>` を出力して
ください。最後に `SUM <total>` を出力します。合計は出力した値の和です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

二つの型が答えを運びます。`fn parse(text: []const u8) ?i64` は *数か、何も
ないか* です: `std.fmt.parseInt` はエラーユニオンを返し、`catch return
null` がエラーをオプショナルの `null` の半分に変えます。文字列全体を拒むか
何も拒まないかなので、`xx` と同じく `4x` も拒まれます。

`fn doubled(text: []const u8) Doubled` は `union(enum) { value: i64,
bad: []const u8 }` を返します — *二倍にした値か、失敗した行のどちらか*、
ちょうど二つの場合の一つで、両方でもどちらでもないこともありません。それに
対する `switch` は、そこにある場合からペイロードを取り出します:
`.value => |v|`、`.bad => |line|`。`main` のどこにも `try` はありません。失敗は
値で、値の行くところへ行きます。スターターの `main` はすでにその switch です。
`parse` と `doubled` がスタブで、それが書かれるまではどの行も `BAD` になります。
'''
hints = [
  "std.fmt.parseInt(i64, text, 10) catch return null が parse のすべてです: 成功すれば値はオプショナルのペイロードとして流れ、どんなエラーでも関数は null を返します。",
  "オプショナルは if (parse(text)) |value| で取り出します。else の経路が null で、そこで .bad の場合を作ります。",
  "同じ関数から .{ .value = v } も .{ .bad = text } も返せるのは、戻り値の型がどちらでも持てる共用体だからです。main の switch が枝を選び、ペイロードは |v| か |text| に捕捉されます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.advanced.14.error-sets"
title = "自分のエラー"
story = "料金サービスの四つの層はそれぞれ違うものを返し、その上の誰もそのどれも受け止めません。"
brief = '''
標準入力は数 `n`、その後それぞれ km 単位の距離のはずの `n` 行です。

`fare(text)` は `std.fmt.parseInt` で解析します — それは `xx` で
`error.InvalidCharacter` として**失敗し**、`fare` の中で自分の
`error.NotANumber` に翻訳されます — そして負の距離を、自分の二つ目のエラー
`error.NegativeDistance` で拒みます。どちらも一つの名前付きエラー集合
`FareError` から来ます。それ以外なら `500 + 100 * km` を返します。

入力の一行ごとに一行を出力してください: 料金、解析できなければ `not a number`、
距離が負なら `negative distance: <km>`。それから失敗した行の数 `ERRORS <k>` を
出力してください。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

スターターはコンパイルでき、`xx` で死にます: `main` の `try fare(text)` が
エラーを上へ渡し、`main` の上には誰もいません — プログラムは `error:
NotANumber` とトレースを出力して `1` で終了します。それが Zig のエラーの話の
すべてです: エラーは戻り値の型 `!i64` の中の値で、どの呼び出し地点もそれを
上へ `try` するか `catch` します。失敗しうると言わなかった関数を越えて巻き戻る
ものは何もありません。

Zig のエラーはオブジェクトではなく**名前**です: メッセージもペイロードも運ばず、
だから `negative distance: <km>` はまだテキストを持っている呼び出し側が
組み立てます。`catch |e| switch (e) { ... }` が二本腕の catch で、switch は集合の
すべてのエラーを名指ししなければなりません — 派生したものを黙って飲み込む C++ の
`catch (const
std::runtime_error&)` に相当するものはありません。スライスされる階層が
ないからです。
'''
hints = [
  "if (fare(text)) |cents| { ... } else |e| switch (e) { ... } が、二本の catch の腕を持つ try ブロックです。成功のペイロードが cents、エラーが e です。",
  "メッセージは自分で組み立てます: エラーは何も運びませんが、text はまだスコープにあり、メッセージが欲しがる km として出力できます。",
  "main の頂上に届いたエラーは error: <Name> とトレースを出力して 1 で終了します。それがスターターが二行目でしていることで、それは良い結果です — プログラムはどこで止まったかを言いました。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.advanced.15.iterators"
title = "自分の while ループ"
story = "料金所の車軸計はシフトの始めから終わりまですべての読み値を刻み、そのどれもどこにも保存しません。"
brief = '''
標準入力は三つの整数です: `start`、`step`、`count`。

それに対する `while` ループが `start` から始まり `step` ずつ進む `count` 個の値を
生むように、`Stops` にイテレータを与えてください。それぞれを一行に出力し、
それから同じ `Stops` の新しいイテレータに対する `total` 関数で計算した
`SUM <total>` を出力してください。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

スターターはコンパイルできません: `main` は `stops.iter()` を呼び、`Stops` には
そんな関数がありません。Zig にはイテレータのプロトコルも、継承するトレイトも
ありません。イテレータとは**オプショナルを返す `next` メソッドを持つ構造体**で
(ここでは `?i64`)、それを走査するループは `while
(it.next()) |value| { ... }` で、最初の `null` で止まります。それが契約のすべてで、
`std.mem.tokenizeAny` と、この道で使ってきたすべての `std` のイテレータが守って
いるものです。

`total` は同じ契約を同じ `while` で走査します。新しいイテレータを渡してください。
`null` に達したイテレータはそこに留まるからです。
'''
hints = [
  "イテレータは入れ子の構造体です: const Iter = struct { value, step, left, fn next(self: *Iter) ?i64 }。next はイテレータを動かすので *Iter を取ります。",
  "next は left が 0 のとき null を返します。そうでなければ今の値を覚え、進め、数を減らし、覚えたものを返します。",
  "ループ変数は var でなければなりません — var walk = stops.iter() — そうでないと next がそのアドレスを取れません。total は二回目の stops.iter() で自分のものを作ります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.advanced.16.defer"
title = "自分で後片付けをする"
story = "料金所の記録簿はシフトが終わると、誰かが覚えていたかどうかに関係なく、正しい順序で自分を閉じます。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

`main` の**先頭**で `first` と `second` という二つの `Guard` 値を宣言し、それぞれの
`drop`(`DROP <name>` を出力します)を `defer` してください。入れ子のブロックの
中で、値を `Tally` に渡します。その defer された `report` が
`TALLY <count> <sum>` を出力します。ブロックの後で `DONE` を出力してください。
`main` 自身はそれ以外に何も出力しません。

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

`DONE` 以外のすべての行は `defer` が出力します。Zig にデストラクタはありません。
最も近いのは `defer` で、それについてより正直です: 解放する行は獲得する行の
隣に書かれ、**ブロック**が終わるとき — 閉じ波括弧で、`return` で、`try` を通って
出ていくエラーで — `defer` の**逆**順に実行されます。`Tally` の `defer` は内側の
ブロックにあるので `TALLY` は `DONE` の前に来ます。二つのガードの `defer` は
`main` のブロックにあり、`second` が最後に defer されたので、それが先に実行
されます。そのどれもあなたが予定したのではありません。スコープが予定したのです。

一つ正しくすべきこと: `defer w.flush()` は `main` の最初の `defer` なので、
**最後に**実行されます — ガードがその行をバッファに書いた後です。それをガードの
後に置くと、`DROP` の行は誰もフラッシュしないバッファに書かれます。
`defer gpa.free(input)`、`defer list.deinit(gpa)`、次のマップの `defer m.unlock(io)`:
この道のあらゆる解放は同じ考えです。
'''
hints = [
  "first を宣言した直後に defer first.drop(w);、second も同じく。drop を自分で呼ぶことはありません。main の終わりが呼びます。",
  "TALLY が DONE の前に出力されるのは、内側の波括弧がすべての理由です: その中の defer tally.report(w) はその閉じ波括弧で実行されます。取り除けば後に出力されます。",
  "defer は常に逆順に実行されます。だから second が first の前に来ます — そして最初に defer されたフラッシュが、その両方の後に実行されます。",
  "tally.report は defer が書かれた瞬間ではなく、実行される瞬間の集計を読みます: defer は延期された文で、それが名指す引数はそのときに評価されます。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.advanced.17.past-the-end"
title = "最後のブースの一つ先"
story = "坑口で 06:00:00。6 番ブースの横の信号盤は海沿いで鳴るすべてのものの射撃表を保持していて、そのチェックサムのループは表の終わりの一つ先の項目を読みます。"
brief = '''
一行目は `n` です。続く `n` 行が射撃表 `<NAME> <SECONDS>` です。
それから一行 `q` と、探す `q` 個の名前です。

名前ごとに `<NAME> FIRES AT <seconds>` か `<NAME> UNKNOWN` を出力してください。
それから `LOADED <n> CHECKSUM <sum of every SECONDS in the table>` を出力して
ください。

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

スターターは問題なくコンパイルでき、二つの違う理由で二回パニックします。
その両方を見つけなければなりません。

一つ目は `lookup` です。それは `?*Shell` を返します — 一致した項目のアドレスか
`null` — そして呼び出し側は見もせずにそれに `.?` を書きます。`.?` は *これは
null ではないと知っている* で、null のとき `-O Debug` はプログラムを
`panic: attempt to use null value` で止めます。オプショナルを確かめてください:
`if (lookup(...))
|shell|` がその先にあるものに届く唯一の方法で、`else` の枝が `UNKNOWN` の
住む場所です。

二つ目はチェックサムのループです。それは `1..=n` を歩いて `table[i]` を読み、
添字 `n` は終わりの一つ先です: `panic: index out of bounds: index 2, len 2`。
ループを直してください。それからパニックが何を買ってくれたかを理解して
ください: このクエストの C++ 版は検査なしに `table[n]` を読み、たまたまその
アドレスにあったもの — ヒープの次のオブジェクトか、何もないか — を得て、誰にも
再現できない量だけ間違ったチェックサムを出力します。Zig は Debug ではすべての
添字とすべての `.?` を検査し、`-O ReleaseFast` ではどちらも検査しません: 同じ
二行がそこでは未定義動作になり、C++ とまったく同じです。それがこのランドの
取引です: 作っている間は検査がオンで、それがオフになるときまでにそれを一度も
必要としないようにしておくのがあなたの仕事です。
'''
hints = [
  "lookup の結果を束縛して確かめてください: if (lookup(table, name)) |shell| { ... } else { UNKNOWN }。オプショナルは答えであり、同時に問いです。",
  "有効な添字は 0 から len - 1 までです。1 から始まり len まで走るループは両端で一つずれていて、パニックするのは上端だけです。スライスに対する for には間違える添字がありません。",
  "どちらのパニックも Debug モードの検査です。スターターを -O ReleaseFast でビルドすると、どちらの行も止まりません: チェックサムは終わりの先を読み、null はアドレス 0 までたどられます。検査が支払っているもので、修正がその支払いに使うものです。",
  "パニックは stderr にメッセージとスタックトレースを出力して 134 で終了します。ジャッジは stdout を読むので、パニックの前に出力したものはすべてまだそこにあり、まだ間違っています。",
]

