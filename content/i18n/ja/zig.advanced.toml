hints = [
  "std.Thread.spawn(.{}, square, .{ nums, out, i }) はすぐにスレッドを起動してハンドルを返します。join できるように、ハンドルは std.Thread のスライスに保持してください。",
  "for (threads, 0..) |*t, i| はハンドルの枠をその添字とともに走査します。t.* = try std.Thread.spawn(...) がそれぞれを埋めます。",
  "out を読む前にすべてのスレッドを join してください。join() はそのスレッドが終わるまでブロックし、その後では書き込みが見えます。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.advanced.19.join"
title = "退出の署名なしに誰も去らない"
story = "車線のスレッドがシフトを終え、主任はそのハンドルを取らずにブースを出て行き、料金所全体の電源が落ちます。"
brief = '''
標準入力は数 `n`、その後 `n` 行のテキストです。

行ごとに一本のスレッドを起動し、それを大文字にしてそのスレッド専用の枠に
入れさせてください。全部を join し、行を順に出力し、それから `DONE` を出力して
ください。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

スターターはコンパイルできず、そのエラーが教訓です。`std.Thread.spawn` は
`!std.Thread` — ハンドルかエラー — を返し、スターターはそれを裸の文として床に
落とします: *error union is ignored*。Zig はエラーかもしれない値を調べずに
済ませることを拒み、それはあなたのためです: ハンドルは `join` する**唯一の**
方法で、誰も join しないスレッドは `main` が戻るときにまだ走っているスレッド
です — プロセスはその下で終わり、行はスケジューラ次第で半分だけ大文字に
なるか、まったくなりません。C++ は join 可能なまま破棄された `std::thread` で
abort します。Zig はハンドルを手に持たせ、それで何をするつもりだったのかを
尋ねます。

ですからすべてのハンドルを保持し、すべてのスレッドをその仕事が読まれる前に
join します(または `detach` しますが、それが望みであることはまずありません)。
形はアロケータのものです: `std.Thread` のスライスを `alloc` し、埋め、join し、
`free` します — そして join のループが、C++ のデストラクタがあった場所に
立ちます。
'''
hints = [
  "コンパイラは spawn の戻り値を見てほしいのです。t.* = try std.Thread.spawn(...) はハンドルを保持し、エラーは上へ渡します。それが両方の半分に対する正直な扱いです。",
  "ハンドルは n の大きさの std.Thread のスライスに保持し、何かを出力する前に for (threads) |t| t.join(); を。",
  "先に全部起動し、それから全部 join してください。起動ループの中の join もここでは通ります — そしてスレッドを一本ずつ走らせることになり、それはスレッドの目的ではありません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.advanced.20.mutex"
title = "トレイ一つ、ブース八つ"
story = "どのブースも取ったものを料金所の壁の一つの合計に足し、一時間の終わりに壁はそのどれとも一致しません。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値ごとに一本のスレッドを起動し、それを**一つの共有の合計**に足させてください。
全部を join し、それから `TOTAL <sum>` と `THREADS <n>` を出力してください。

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

スターターはコンパイルでき、`TOTAL 0` を出力します。ワーカーは `total` を**値で**
受け取ります — スレッドの引数タプルにコピーされた `i64` です — 自分のコピーに
足し、それを捨てます。ポインタ `*i64` を渡すと別のバグになります。これほど
小さなテストでは現れないものです: 複数のスレッドから同時に `total.* += value`
するのは**データ競合**です。Zig の Debug の検査はそれを捕まえません。競合は
ここでも C++ とまったく同じく未定義動作で、単に間違った数というだけではあり
ません。

合計の隣に置き、それに触れるすべてのスレッドがロックする `std.Io.Mutex` が答え
です: `m.lockUncancelable(io)` がそれを取り、`defer m.unlock(io)` が、間で何が
起きようとブロックの終わりにそれを返します。ミューテックスが必要とするので、
ワーカーは `io: std.Io` を引数に取ります — 0.16 ではロックはスレッドライブラリ
ではなく I/O ランタイムの一部で、`std.Thread.Mutex` はもう存在しません。
`defer` が C++ の `lock_guard` で、アンロックが起きる場所に書き出されています。
'''
hints = [
  "total ではなく &total を渡してください: ワーカーの引数は total: *i64 になり、足し算は total.* += value です。スレッドは自分のものではなく main の合計を変えるべきです。",
  "main に var total_mutex: std.Io.Mutex = .init;、タプルに &total_mutex、そしてワーカーでは足し算の前に m.lockUncancelable(io); defer m.unlock(io); を。",
  "すべての join の後に total を読むのはロックなしで安全です: join() は同期点で、書き込むスレッドはもう残っていません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.advanced.21.counter"
title = "自分でロックするカウンタ"
story = "3 番ブースの車軸カウンタは互いに一致しなければならない二つの数を持ち、二人が同時にそれを読んでいます。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

`Counter` を完成させてください: `add` はロックを取り、合計に足し、ヒット数を
増やします。`snapshot` はロックを取り、両方を一緒に返します。値ごとに一本の
スレッドを起動し、join し、それから `TOTAL <sum>` と `HITS <n>` を出力して
ください。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

ミューテックスは構造体の**中に**、守るフィールドの隣に住み、それらに触れる
すべての関数がそれを取ります。それが形です: ロックはオブジェクトの一部で、
呼び出し側が覚えていると信用されるものではありません。

スターターはコンパイルできず、その理由は一分考える価値があります。`snapshot` は
`self: Counter` を受け取ります — 値で、読むだけのメソッドがふつう書かれる
やり方です — そしてミューテックスをロックすることは*ミューテックスを変える*ので、
`self.mutex.lockUncancelable(io)` は `*std.Io.Mutex` を欲しがり、値渡しの `self`
から得られるのは `*const` だけです。さらに悪いことに、値渡しの `self` は
カウンタの**コピー**です: たとえコンパイルできても、ロックのコピーをロックする
ことになり、それは何もロックしません。修正は `self: *Counter` です。手を伸ばす
`mutable` キーワードはありません。回避すべき `const` メソッドがないからです:
ロックを取らなければならないメソッドはシグネチャでそう言い、シグネチャが約束の
すべてです。
'''
hints = [
  "コンパイルエラーを直すのは一文字です: fn snapshot(self: *Counter, io: std.Io) Snapshot。counter.snapshot(io) は同じ読み方のままです。Zig がアドレスを取ってくれます。",
  "値渡しの self は、ミューテックスも含めた Counter 全体のコピーだったでしょう。コピーをロックしても何も守りません。だからコンパイラの拒否は不便ではなく正しい答えなのです。",
  "Counter.add は最初の引数が *Counter のただの関数なので、std.Thread.spawn(.{}, Counter.add, .{ &counter, io, value }) がスレッドからメソッドを呼ぶ方法です。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.advanced.22.lock-order"
title = "ロック二つ、順序一つ"
story = "屋根の下の硬貨トレイが二つ、ロックが二つ、ブースが二つ、そして両方の遮断機が同じ一秒に止まりました。"
brief = '''
二つのトレイ `A` と `B`。それぞれ専用の `std.Io.Mutex` を持つ `i64` です。

標準入力は一行目に初期量、二行目に数 `n`、その後 `FROM`/`TO` が `{A, B}` の
いずれかである `<FROM> <TO> <AMOUNT>` の `n` 行です。

各移動をそれぞれ専用のスレッドで実行し、全部を join し、それから
`A <level>`、`B <level>`、`MOVED <n>` を出力してください。

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

スターターには二つの間違いがあり、出力に現れるのは一つだけです。移動元から
引いて移動先に一度も足しません — それが目に見えるバグです。もう一つは形です:
*移動元を先に*ロックすると、逆向きの二つの移動がそれぞれロックを一つ持って
もう一つを永遠に待つことがあります。それがデッドロックで、テストには現れません。
火曜日の 07:59 に現れます。

Zig には複数のミューテックスを一度に取る `scoped_lock` はありません。最も近い
のは、それが実装している規則を手で守ることです。両方のロックを**一つの大域的な
順序**で取ってください — どのスレッドでも、硬貨がどちら向きに動こうと、`A` の
ミューテックス、それから `B` のもの — そうすれば循環はできません。
`lockUncancelable` が二つ、`defer unlock` が二つ。そして defer は逆順に解放し、
それは `scoped_lock` も使ったであろう順序です。
'''
hints = [
  "どちらの量に触れる前にも両方のトレイをロックしてください: a のミューテックス、それから b のもの、どのスレッドでもその順で、それぞれの後に defer unlock。",
  "硬貨の向きが決めるのはどちらの量が減るかで、どちらのロックを先に取るかではありません。",
  "二つの defer は逆順に解放します: b のロックが先に返され、次に a のもの。それは C++ の scoped_lock も使ったであろう順序で、規則は同じです — すべてのスレッドが順序に合意します。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.advanced.23.queue"
title = "受け渡し口"
story = "一つのブースが受け渡し口から計数室へ硬貨を送り、一人の係員がそれを取り出します。そして係員は 06:40 から空の受け渡し口で待っています。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

生産者が各値を `std.Io.Queue(i64)` に入れます。消費者はそれを一つずつ取り出し、
それぞれを二倍にして出力します。生産者がすべてを入れ終えたら、`main` がキューを
**閉じ**、消費者はキューが空になって閉じられたときに止まります。両方を await し、
それから `CONSUMED <n>` を出力してください。

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

C++ はこれを `std::queue`、ミューテックス、条件変数、`done` フラグから組み立て
ました。Zig 0.16 はそのすべてを一つの型として出荷しています。`std.Io.Queue(T)`
は自分が所有するバッファの上の有界チャネルです: `putOneUncancelable(io, v)` は
満杯の間ブロックし、`getOneUncancelable(io)` は空の間ブロックし、`close(io)` の
後は、空になったキューへの `get` は `error.Closed` を返します — それが消費者の
止まる合図で、ループは `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}` です。キューは FIFO なので、
スケジューラが何をしようと順序は入力の順です。

`io.concurrent(func, .{ args })` はランタイム自身のプール上で `func` を起動し —
専用の並行処理の単位が保証されるか、呼び出しが失敗します — future を返します。
それに対する `.await(io)` が join です。スターターは固まります。生産者は
すべてを入れて戻り、誰もキューを閉じず、消費者は最後の値で目を覚まし、キューを
空にし、決して来ない次のものを待ちます。すべての生産者と消費者の組には
*もう何も来ない* と言う方法が要ります — それが `close` です。
'''
hints = [
  "feeding.await(io) の後に一行: hatch.close(io)。すると taking.await(io) が戻り、プログラムは終了します。",
  "close はキューにまだあるものを捨てません。消費者は空になるまで値を受け取り続け、そのときになって初めて error.Closed を見ます。",
  "走っている間に出力しているのは消費者だけで、main は taking.await(io) の後にだけ CONSUMED を出力します — その順序が、ロックなしでライタを安全に保っています。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.advanced.24.atomic"
title = "一語、ロックなし"
story = "車軸の数にロックは要りません。計数室のそれ以外のすべてには要ります。そしてその二つを見分けるのが仕事です。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値ごとに一本のスレッドを起動してください。それぞれが自分の値を共有の
`std.atomic.Value(i64)` に足し、共有の `std.atomic.Value(i64)` を一つ増やします —
ミューテックスはどこにもありません。全部を join し、`TOTAL <sum>` と `HITS <n>` を
出力してください。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

スターターはコンパイルできません: ワーカーは二つのアトミックを**値で**受け取り、
`fetchAdd` は `*std.atomic.Value(i64)` を必要とします — 値渡しの引数が差し出す
のは `*const` だけです。それは意図的です。アトミックとは、複数のスレッドが
一度に一命令ずつ更新することに合意した場所です。そのコピーは別の場所で、共有は
失われます。アドレスを渡してください。

アトミックはより安いミューテックスではありません。別の道具で、一つの機械語を
一命令で読んで変えて書くためのものです。`fetchAdd(v, .monotonic)` がその命令
です。二つのフィールドが互いに一致しなければならなくなった瞬間、ロックが
戻ってきます — 「この二つを、一緒に」のためのアトミックはありません。だから前の
クエストの `Counter` にはミューテックスがあり、これにはないのです。

ここで `.monotonic` で十分なのは、これらの増加が他のどの書き込みに対して*いつ*
見えるようになるかに何も依存せず、どれも失われないことだけに依存しているから
です。その一文が追加の質問です。
'''
hints = [
  "エラーは *atomic.Value(i64) が欲しいのに *const のものがあると言っています。両方の引数をポインタにし、タプルで &total と &hits を渡してください。",
  "fetchAdd は前の値を返し、足し算をアトミックに適用します。_ = が戻り値を捨て、ロックも defer もありません。",
  "total.raw += value はコンパイルでき、それが競合になります。fetchAdd がそうならない一命令です。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.advanced.25.parallel-sum"
title = "料金所を分ける"
story = "一万二千の車軸の読み値と四つのブース。監督は各ブースの取り分と合計を欲しがり、合計は毎回同じにならなければなりません。"
brief = '''
一行目は `k n` です: `k` 本のスレッドと `n` 個の値。二行目が `n` 個の値です。

値を `k` 個の連続したかたまりに分けてください — かたまり `i` は整数演算で
`i * n / k` から `(i + 1) * n / k` の手前までの添字を覆います — そしてスレッド `i`
に自分のかたまりを `partial[i]` に合計させてください。全部を join し、それから
各かたまりについて順に `CHUNK <i> <sum>` を、最後に `TOTAL <sum of partials>` を
出力してください。

```
input:  2 5
        1 2 3 4 5
output: CHUNK 0 3
        CHUNK 1 12
        TOTAL 15
```

これはスレッドで実際に速くなる形で、このマップで唯一のものです: 各スレッドは
自分の部分スライスを読み、自分の枠に書くので、ロックもアトミックもなく、入力
以外に何も共有されません。スレッドには部分スライスそのものを渡してください —
`nums[begin..end]` はビューで、読む側に渡すべきはビューです — そして自分の一つの
枠へのポインタを。かたまりの境界の式が分割を正確にします — 最後のかたまりは
常に `n` で終わり、`k > n` のときはかたまりが空になることがあり、隠れたケースの
一つがそうなっています。空のスライスの合計は特別扱いなしで `0` です。
'''
hints = [
  "begin と end を main で計算し、そこでスライスしてください: nums[begin..end] がスレッドの受け取るビューで、&partial[i] がそれが書いてよい一つの枠です。",
  "スレッドの中のローカルな合計と、最後の slot.* への一回の書き込みで、共有のスライスにはスレッドごとにちょうど一回だけ触れます。",
  "k > n だといくつかのかたまりが空になり — begin == end — nums[begin..end] はその for ループが単に実行されない空のスライスです。特別扱いはありません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.advanced.26.futures"
title = "数を約束して"
story = "監督は数字を一つずつ取りに走り手を送り、受け渡し口に立って待ったりはしません。数字は戻ってくるときに戻ってきます。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値ごとに、値の二乗を返す `io.concurrent` のタスクを一つ起動してください。
future をリストに集め、**順に** `await` して、それぞれを出力します。それから
一枠の `std.Io.Queue(i64)` を、そこに `n` を入れるもう一本のスレッドに渡し、
出てきたものから `READY <n>` を出力してください。

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

future とは、まだここにない値です。`io.concurrent(square, .{ v })` は
ランタイムのプール上で `square` を起動し、その戻り値のための
`std.Io.Future(i64)` をくれます。`.await(io)` はそれが存在するまでブロックし、
それから一度だけそれを渡します。future を順に await することが出力を順序どおりに
します — タスク自体はいつでも終わるときに終わります。

Zig に `std::promise` はありません。最も近いのは同じパイプの反対側で、0.16 には
すでにパイプがあります。**要素一つの**バッファの上の `std.Io.Queue(i64)` が
promise です: 一方が値を入れ、もう一方がそれを取り出し、取り出す側はそれが来る
までブロックします。それがスレッドがミューテックスもフラグも包むべき戻り値も
なしに一つの結果を報告する方法で — 三つ前のクエストの受け渡し口と同じ型に、
一つのバッファを付けたものです。

`io.concurrent` はタスクが専用に走ることを約束します — ランタイムがスレッドを
与えられなければ `error.ConcurrencyUnavailable` で失敗します — 一方 `io.async` は
より弱い約束をします: 二本目のスレッドを差し出せないランタイムでは、関数は
`async` が戻る前にその場で呼ばれる*かもしれません*。本気のときは `concurrent` と
はっきり言ってください。
'''
hints = [
  "try io.concurrent(square, .{v}) は std.Io.Future(i64) を返します。進みながらそれをリストに追加し、future は決してコピーしないでください — ポインタ越しに await します、for (squares.items) |*f|。",
  "f.await(io) は future ごとにちょうど一度呼べて、値が来るまでブロックします。リストを順に走査すれば出力が順序どおりになります。",
  "報告役のスレッドは &ready と n を受け取ります。main の ready.getOneUncancelable(io) は put が起きるまでブロックします。main が戻る前にスレッドを join してください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.advanced.27.optional-pointer"
title = "コンパイラが名指せる大きさ"
story = "2 番ブースの伝票刺しに連なる通行料の領収書: どの領収書も次のものを持ち、シフトの最初のものまでずっと下へ続き、どの領収書も二度持つ者はいません。"
brief = '''
標準入力は数 `n`、その後セント単位の `n` 個の金額です。

それらを金額ごとに一つのノードの鎖に、届いた順に保持してください:

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

三行を出力してください:

1. 金額を順に、スペース区切りで。なければ `-`
2. `SUM <total>`。鎖に対する**再帰**関数で
3. `LAST <cents>` — 最後のノードの金額 — または `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

スターターはコンパイルできず、そのエラーがポインタが存在する理由です。
`next: Entry` と書くと、コンパイラは `Entry` をメモリに配置しなければなりません:
`cents` の八バイトに加えて `Entry` の大きさ分 — それはまさに求めようとしている
ものです。*struct 'Entry' depends on itself.*

`?*Entry` はポインタで、ポインタにはコンパイラがすでに知っている大きさがあります。
Zig に `unique_ptr` はありません。最も近いのは、それが強制していた規則を手で守る
ことです: **アロケータが所有者です。** `gpa.create(Entry)` がノードを渡し、
`gpa.destroy(node)` がちょうど一度それを返します。そして*誰が*破棄するかという
問いには慣習が答えます — 鎖がノードを所有するので、`main` は戻る前に鎖を走査して
それを解放します。`?` はコンパイラが検査してくれる部分です: `null` は鎖の終わり
であり空の鎖でもあり、何物も取り出さずに `?*Entry` をたどれないので、別の空の
場合はどこにもありません。
'''
hints = [
  "コンパイルエラーを直すのは一行です: next: ?*Entry — これで構造体は、何を指していようと十六バイトです。",
  "後ろから前へ作ってください: node = try gpa.create(Entry); node.* = .{ .cents = v, .next = head }; head = node。古い head が新しいノードの尾になります。",
  "while (walk) |node| : (walk = node.next) で走査します。オプショナルは一歩ごとに一度取り出され、ループは null で終わります。再帰の合計は二行です: null なら 0、そうでなければ cents に残りの合計を足したもの。",
  "head を宣言した直後に defer freeChain(gpa, head): defer は実行されるとき、つまり鎖が完成した main の終わりに head を読みます。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.advanced.28.refcount"
title = "ほかに誰が持っている"
story = "二つの計器が一つの台帳を通して同じ硬貨トレイを読み、台帳は最後の計器がいなくなるまで残り、一秒たりともそれより長く残ってはなりません。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

値を、**持ち主を数える** `Ledger` が所有するスライスに入れてください:
`share()` はハンドルを渡して数を増やし、`release(gpa)` は数を減らしてゼロに
なったらスライスを解放します。ハンドルを二つ取り、数えない見張り役を一つ
持ってください。四行を出力します:

1. `REF <sum>` — 二つ目のハンドルを通して読んだ合計
2. `SHARED <k>` — 両方のハンドルが生きている間の数
3. `ALIVE yes` — それらが生きている間の `watch.alive()`
4. `ALIVE no` — 両方のハンドルが解放された後

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig に `shared_ptr` はありません。最も近いのは、`shared_ptr` の中身を見える
ところに書き出したものです。前のクエストは所有者一人でした。これは所有者の数で、
オブジェクトの隣に保持され、数がゼロになったとき — たまたま最後になった
ハンドルによって — オブジェクトが解放されます。
`share()` が数を増やし、`release()` が減らします。どちらも何物も代わりにやって
くれません: 閉じ波括弧で走るデストラクタはないので、すべての `share()` には
自分で書いた `release()` が対応するか、さもなければスライスがリークし、`main` が
戻るときに `-O Debug` のアロケータが stderr でそう言います。

見張り役は、数えられずに見られている `Ledger` そのものです。スライスがまだ
あるかどうかは見えます — `items` は `?[]i64` で、最後の解放の後の `null` は型が
「なくなった」ために与えてくれる**ゼロ値**です — そしてスライスを生かしておく
ことはできません。それが循環を断つもので、この道の最後のマップの主題です。
'''
hints = [
  "share() は二行です: self.refs += 1; return self。二回呼べば SHARED 2 になり、mirror.items.? は同じスライスに届きます。",
  "release() は数を減らし、ゼロになったときだけスライスを解放して items を null にします — その null が alive() の読むものです。",
  "両方のハンドルを解放してください。最初の解放だけでは何も解放されず、二つ目で解放されます。なぜかを声に出して言ってください: それがこのクエストが本当に尋ねている問いです。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.advanced.29.take"
title = "持っていって"
story = "監督はどの伝票もライダーに渡す前にコピーし、コピー機は料金所でいちばん遅いものです。"
brief = '''
標準入力は数 `n`、その後 `n` 行のテキストです。

行ごとに一つの `Docket` をリスト `pile` に作り、それからすべての伝票を二つ目の
リスト `sent` に渡し、`sent` から各伝票のテキストを大文字にして出力し、それから
`SENT <n>`、`COPIES <c>`、`MOVES <m>` を出力してください。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        SENT 2
        COPIES 0
        MOVES 2
```

`Docket` は自分のテキスト — 自分で確保した `[]u8` — を所有し、自分に起きる
ことを数えます: `copy(gpa)` はバイトを複製して一つの大域変数を増やし、`take()` は
もう一つを増やします。スターターは `COPIES 2` を報告します:
`sent.append(gpa, try d.copy(gpa))` がすべての伝票を、バイトごと複製します。

Zig にはムーブセマンティクスもムーブコンストラクタもありません。最も近いのは
規律で、このクエストはそれを書き出します。構造体を代入するとそのヘッダが
コピーされます — `Docket` なら、テキストのポインタと長さです — ですから
`sent.append
(gpa, d)` は、同じバイトを所有していると信じる伝票を**二つ**残し、その二回目の
`free` がクラッシュです。`take()` が正直な引き渡しです: テキストを持つ伝票を返し、
元のほうには**空のスライス**を残します。ですから元のほうはまだ解放でき — 何も
解放しません — まだテキストを持っているかのように読まれることは決してありません。
それが C++ の *有効だが未規定の* ムーブ元の状態を、自分で選んだ値として書き出した
ものです。
'''
hints = [
  "変わる呼び出しは一つです: sent.append(gpa, d.take())。take は *Docket を必要とし、だからループはすでに |*d| で pile を走査しています。",
  "pile の deinit ループは今もすべての伝票を回ります。take の後はどれも空のスライスを持っていて、deinit は空のものの free を飛ばします。何も二回解放されません。",
  "sent.append(gpa, d.*) はコンパイルでき COPIES 0 MOVES 0 を出力します — そして main の終わりに両方のリストが同じバイトを解放します。カウンタは、正直な引き渡しと二重解放が同じに見えないように存在します。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.advanced.30.generic-ring"
title = "どんな荷にもリングを"
story = "車軸計は最後のいくつかの読み値を保持し、監督は最後のいくつかのナンバーを保持し、Alex は同じリングバッファを二回書きました。"
brief = '''
一行目は容量 `cap` です。二行目は整数のリスト、三行目は語のリストです。

**一つの** `Ring(comptime T: type) type` を書いてください: 入れられた最新の
`cap` 個を保持し、最も古いものを上書きし、到着順に走査できる固定容量の
バッファです。整数を `Ring(i64)` に、語を `Ring([]const u8)` に入れ、各リングの
中身を一行に出力し、それから `DROPPED <k>` — 合計でいくつが押し出されたか — を
出力してください。

```
input:  2
        1 2 3 4
        hku tram bus
output: 3 4
        tram bus
        DROPPED 3
```

スターターはコンパイルできません: `Ring` は `i64` のために書かれていて、語には
行き場がありません。Zig のジェネリック型は**構造体を返す関数**で、この道の前の
ほうの `Pair(T)` とまったく同じです: `fn Ring(comptime T:
type) type { return struct { ... }; }` で、枠には `[]T`、`push` には `T`。その
全体が `T` が何かを知らずに書かれ — コピーできることだけを知っていて — `Ring(i64)`
と `Ring([]const u8)` は一つの定義から打ち出された二つの違う型です。

イテレータも与えてください。リングは到着順には格納されていません — 最も古い
ものは書き込み位置がこれから上書きしようとしている場所にあります — ですから
`next()` が計算をしなければならず、それが読むより書く価値のある部分です。
出力には `T` に対する `comptime` の枝が一つ要ります。語は `{s}` で数は `{d}` だから
です。
'''
hints = [
  "構造体の周りに fn Ring(comptime T: type) type { return struct { ... }; }、枠に []T、push に T、そして中から構造体に名前を付けるために const Self = @This()。それから二つの使用箇所で Ring(i64).init と Ring([]const u8).init。",
  "最も古いものは (head + cap - count) % cap にあり、到着順で k 番目のものは (oldest + k) % cap です。イテレータが持つ必要があるのは k とリングへのポインタだけです。",
  "fn printRing(w, comptime T: type, ring: *const Ring(T)) がイテレータを走査します。if (comptime T == []const u8) が {d} より {s} を選び、もう一方の枝はその T については解析されません。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "zig.advanced.31.invalidation"
title = "歩きながら取り除く"
story = "監督は待避所のリストを読み下しながらバンを消していき、消すたびにその次のものを飛ばします。"
brief = '''
一行目は `n t` です。二行目は `n` 個の整数です。

`t` 未満のすべての値をリストから**その場で**取り除き、残ったものを一行に
(何もなければ `-`)、それから `REMOVED <k>` を出力してください。

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

スターターは誰もが一度は書くバグです: 添字で歩き、`orderedRemove(i)` を呼び、
それから `i += 1` をします — そして枠 `i` に滑り込んだ要素は一度も見られません。
小さい値が二つ隣り合うと、二つ目が生き残ります。そのバグは少なくとも定義された
ものです。そのスライス版の双子はそうではありません: `for
(list.items) |v|` はスライスを**一度だけ**、ポインタと長さで取り、ループの中の
`orderedRemove` はその下でリストを短くします。ループは古い長さを歩き続け、新しい
終わりの先の枠 — リストがまだ所有していて、もう何の意味も持たないメモリ — を
読み、Debug の検査は何も発火しません。バイトは確保領域の中にあるからです。
たいていは動いたように見え、それはもっと悪いことです。

`orderedRemove(i)` は `i` より後ろのすべてを一つ下へずらし、取り除いたものを
返します。ですから: 当たったら取り除き、進め**ない**。外れたら `i += 1`。決して
両方ではありません。枝の中に増分がある `while` ループが形で、それは連結リストでも
ハッシュマップでも同じ形です。
'''
hints = [
  "while から : (i += 1) を外してください。取り除かなかった枝でだけ i += 1 で進みます。もう一方の枝では、orderedRemove がすでに次の要素を枠 i に移しています。",
  "moorings.items.len はループの判定のたびに読み直され、それが while を正しくしています: スライスに対する for なら、長さは始めに凍結されていたでしょう。",
  "終わりから後ろ向きに歩くのがもう一つの正しい答えです — i での削除はその下の枠を決して乱しません — そして枝のない版を求められたときに出すべき答えです。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "zig.advanced.32.overflow"
title = "止まったカウンタ"
story = "料金所のリットルカウンタは i32 で、2147483647 リットルで遮断機がブースの画面に panic: integer overflow を出して下ります。"
brief = '''
標準入力は数 `n`、その後それぞれ `i64` に収まる `n` 個の整数です。その累計も
`i64` に収まります。

二行を出力してください: 途中のすべての累計が `i32` に収まるなら `INT32 OK`、
そうでなければ、はみ出させたであろう最初の値の 0 始まりの添字付きで
`INT32 OVERFLOW <i>`。それから `INT64 <total>`。

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

スターターは合計を `i32` に保ち、二つ目の値でパニックします:
`panic: integer overflow`。それは Zig がこのランドの約束どおりのことをしている
のです — `-O Debug` ではオーバーフローした整数はそう言って止まり、幅の広い
ケースは一行早く、`5000000000` を切り詰めたであろう `@intCast` で止まります。
パニックを贈り物として読み、それから契約の残りを読んでください: `+%` は
折り返し、`+|` は飽和し、素の `+` は Debug ではパニックし、
**`-O ReleaseFast` では未定義動作**です。そこでは検査がオフで、最適化器はそれが
決して起きないと仮定します — ですから正の `v` での `total + v < total` はそこでは
*常に偽*で、判定は削除されます。gcc と clang が C++ でそれを削除するのと
まったく同じです。

ですから決してオーバーフローを起こすことでオーバーフローを検出しないでください。
狭い足し算の*前に*、より広い型で、あるいは限界 — `std.math.minInt(i32)` と
`std.math.maxInt(i32)` — と比べて検出します。そうすればこのプログラムの期待される
出力は、どのビルドモードでも未定義のままのものに何も依存しません。
'''
hints = [
  "合計は i64 に保ち、足すたびに std.math.minInt(i32) と maxInt(i32) と比べてください。i32 の算術は一度も起きないので、何もパニックできず、何も未定義ではありません。",
  "範囲を出た最初の添字だけを記録してください — 一度だけ設定される ?usize — 後の値が合計を範囲内に戻すかもしれず、問いは最初にどこで出たかだからです。",
  "どうしても二つの i32 を足し、それが安全かを知りたいなら: @addWithOverflow(a, b) は折り返した和と桁上がりのビットを返し、どのビルドモードでも定義されています。それが検査です。素の和の符号は、最適化器が削除するものです。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "zig.advanced.33.stop-flag"
title = "言われたら止まる"
story = "夜間車線は誰かが止まれと言うまで走り、このシフトまで誰もそれを言えませんでした。"
brief = '''
標準入力は数 `n`、その後 `n` 個の整数です。

スレッドを二本起動してください。一本目は値を合計して結果を格納します。二本目は
**停止フラグ** `*std.atomic.Value(bool)` を受け取り、`true` を読むまでループ
します。読んだら、二つ目のフラグを設定する `onStop` 関数を実行し、それから止まった
ことを記録します。`main` から停止フラグを設定し、両方を join し、出力してください:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread` には `stop_token` も `jthread` もありません。最も近いのは、それらが
できているものを手で渡すことです。停止要求は、要求する側が書きワーカーが読む
`bool` で、二本のスレッドがそれに触れるのでアトミックです: 一方の側で
`stop.store(true, .release)`、もう一方のワーカーのループで `stop.load(.acquire)`。
自分のフラグを確かめるスレッドはいつでも止められるスレッドです。確かめないものは
スターターの夜間車線で、その `join` は決して戻りません。

C++ の `stop_callback` は停止が要求された瞬間に要求したスレッドで走ります。
ここではワーカーがフラグを見たときに自分で `onStop` を実行し、それは同じ約束 —
*停止が求められたから何かが起きる* — を反対側から守ったものです。`store` の後の
`join` が `jthread` のデストラクタを書き出したものです: 要求し、それから待つ。
ループの中の `std.Thread.yield()` は、ほかに欲しい誰かにコアを譲ります。裸の
スピンも通りますが、コアを一つ無駄にします。
'''
hints = [
  "車線のスレッドは三つのフラグをポインタで受け取ります。そのループは while (!stop.load(.acquire)) std.Thread.yield() catch {}; で、ループの後に onStop を呼び、stopped を格納します。",
  "フラグを設定する前に車線を起動し、その後で join してください。スレッドが始まる前に設定されたフラグは問題ありません — 最初の確認で止まります — しかし store のない join は決して戻りません。",
  "store の .release と load の .acquire は、store の前に起きたことを load の後で見えるようにする組です。ここでは .monotonic でも通り、面接官はなぜかを尋ねるでしょう。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.advanced.34.unreachable"
title = "THE UNREACHABLE"
story = "キャナル・ロードの高架で 07:59。車線モデルはある枝を到達不能と記し、朝の車の流れがそこに到達し、すべての車線が一斉に閉じます — 料金所がすでに返したバッファを、車線のスレッドがまだ読んでいる間に。"
brief = '''
一行目は `w n` です: `w` 本の車線と `n` 個の読み値。二行目が読み値です。

`pump(gpa, w, ledger)` は、参照カウント付きの `Ledger`(三つ前のクエストの
もの)が保持する読み値の上に `w` 本のスレッドを起動します。スレッド `i` は
`i * n / w` から `(i + 1) * n / w` までの読み値を `partial[i]` に合計し、`pump` は
部分和を返します。`main` はそれぞれについて `PUMP <i> <sum>` を、`TOTAL <sum>` を、
そしてすべてが終わった時点で読み値が解放されていれば `FREED yes` を出力します —
台帳の `alive()` を通して観察します。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

スターターは二回失敗し、その二つの失敗がこのランドの二つの半分です。

一つ目は車線モデルです。`pump` は各車線の境界を計算し、それから
`if (begin == end) unreachable;` と言います — *車の来ない車線は起こりえない*。
二つの読み値に三本の車線で、それは起こります。`unreachable` はコメントでも
アサートでもありません: Zig で **仮定する** を意味する唯一の行です。`-O Debug`
ではそこに到達すると `panic: reached unreachable code` で、料金所は理由を画面に
出して止まります。`-O ReleaseFast` ではコンパイラはあなたを*信じます* — その枝は
削除され、そこにしか至りえないものもすべて一緒に削除されます — そしてそこに
到達するプログラムは未定義です。ダングリングポインタを通して読む C++ のプログラムが
未定義なのとまったく同じです。パニックは同じ契約の正直な版です。その主張を消し、
その場合を扱ってください: 空の車線の合計は `0` です。

二つ目は所有権です。スターターの `pump` は車線を起動する前に台帳を**解放**します —
*ワーカーはスライスを持っている、ハンドルは要らない* — そしてその解放は最後の
ものなので、読み値は解放され、それでもワーカーはそれを読みます。Debug では
アロケータは取り戻したメモリを `0xAA` で、すべてのバイトを塗るので、どの読み値も
`-6148914691236517206` として返ってきて、そのうち二つを最初に足した車線が
`panic: integer overflow` で料金所を止めます — それが見えるケースの示す失敗で、
そこではどの車線にも車が来て `unreachable` には決して到達しません: 入力のどの
読み値でもオーバーフローしえない合計と、間違いではない行を指すトレース。
ReleaseFast では塗りも検査もありません: 車線は次の確保がそこに置いたもの、あるいは
カーネルが取り上げたページを読みます。それがダングリング読み出しで、最も高く
つく種類のバグです。間違いのある場所で失敗しないからです。

症状ではなく所有権を直してください。どの車線も起動する前に台帳の**共有を取り**、
終わったらそれを解放します。そうすれば読み値は、車線がどの順で終わろうと、
それを持っている最後のスレッドとちょうど同じだけ生きます。`pump` は戻る前に
join し、`main` が渡したハンドルを最後に解放します。`main` に戻ると `alive()` は
`false` です: 読み値は最後の解放 — join の後の `pump` 自身のもの — によって一度だけ
解放され、まだ読んでいる者は誰もいませんでした。車線の解放どうしが競合するので
数はアトミックです。台帳そのものはスレッドセーフではなく、その必要もありません。
誰も読み値に書き込まないからです。

それがこのランドのすべてを一つのプログラムにしたものです。検査は間違えるたびに
あなたを止め、あなたを正しくする道具 — 誰がこれを持っているかを言う数、待つ
join、解放する `defer` — は、基本の道で出会ったのと同じものです。
