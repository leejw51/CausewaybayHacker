`std.Thread.spawn(.{}, worker, .{ args })` はその引数で新しい OS スレッド上に
`worker` を起動し、ハンドルかエラーを返します。引数はスレッドにコピーされるので、
渡されたスライスは `main` のメモリへのビューで、渡された添字はそのスレッド自身の
ものです。間違ったものを参照で捕捉するクロージャはありません: スレッドが見られる
ものはすべてタプルの中にあり、そこで読めます。

スレッドはスケジューラの好きな順に終わります。添字で書き、join の後に出力する
ことが、出力を毎回同じにします。自分で出力するスレッドではそうはなりません。
