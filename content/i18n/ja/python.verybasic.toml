それをする行を選び、`# FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — 再帰は部分木の新しい根を返すので、格納します。",
  "結果を格納せずに insert を呼ぶと None はそのままです。",
]
