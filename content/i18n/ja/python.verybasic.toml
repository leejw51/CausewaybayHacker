[[quest]]
id    = "python.verybasic.02.int-types"
title = "割り勘"
story = "魚屋のカウンターでコーヒー二杯、紙幣一枚。レジは一人いくらで余りがいくらかを言わねばならないのに、何も言わない。"
brief = '''
`a` と `b` は整数です。プログラムは整数の商と剰余を、空白区切りで一行に出力しなければなりません。Python にはそれぞれに演算子が一つあります。

それをする行を選び、`# FILL` コメントの場所に打ってください。

```
