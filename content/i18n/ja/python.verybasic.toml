[[quest]]
id    = "python.verybasic.03.floats"
title = "正確な取り分"
story = "市場の秤はグラムを小数三桁で示し、レシートは二桁を欲しがる。レシートは白紙だ。"
brief = '''
`x` と `y` は float です。プログラムは `x / y` を小数点以下ちょうど二桁で出力しなければなりません。f 文字列はコロンの後に書式指定を持ちます。

