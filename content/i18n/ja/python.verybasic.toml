[[quest]]
id    = "python.verybasic.01.print"
title = "最初の板"
story = "バウリントン・ロードの 06:00。その日最初の価格板は白紙で、マーカーはメイの手の中にある。"
brief = '''
プログラムは `hello, causewaybay` をちょうど一行に出力しなければなりません。組み込み一つが標準出力に一行を書きます。

それをする行を選び、`# FILL` コメントの場所に打ってください。

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 括弧、そして文字列の中のカンマ。",
  "Python 3 に print 文はありません。print は関数です。",
]

