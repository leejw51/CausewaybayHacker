# PYTHON LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/python/verybasic.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and live in the
# English pack only. Code blocks, identifiers, sample input and output and
# the exact strings a program must print are copied verbatim, never
# translated.

pack   = "python.verybasic"
locale = "ja"

