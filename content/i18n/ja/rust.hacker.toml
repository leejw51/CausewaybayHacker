# RUST LAND — HACKER, in Japanese. A translation pack (SPEC §12.1): the prose of
# `content/rust/hacker.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "rust.hacker"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.hacker.01.two-sum"
title = "二つの運賃"
story = "7-32 号室。最初の質問は誰もが受けるもので、時計は入室の途中から動き出す。"
brief = '''
一行目は `n target`。二行目は整数 `n` 個です。

足すと `target` になる異なる二つの要素の **1 始まり**の添字 `i j` を、
`i < j` として `i j` の形で出力してください。組が複数あるなら、二つ目の
添字が最小のものを。それでも同じなら、一つ目の添字が最小のものを。組が
ひとつもなければ `-1` を出力します。

```
input:  4 9
        2 7 11 15
output: 1 2
```

ここの隠しケースは小さく、調べるのは同点処理と答えなしの場合であって、
速度ではありません。それでも問いは線形のもの — 一回の走査、ひとつの
ハッシュマップ — です。本物の `n` は 200000 で、ネストしたループを
ふるい落とすためにこの問いは存在するからです。この四つのケースをたまたま
通る答えではなく、問いが求めている答えを書いてください。
'''
hints = [
  "一回の走査。各値について、target からそれを引いたものがすでに見たものかを問います。",
  "entry(x).or_insert(j) は繰り返される値の最初の添字を保ちます。それが問題文の求める同点処理です。",
  "見つけた瞬間に出力して return してください — 走査中の最初のヒットが、すでに最小の二つ目の添字です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.hacker.02.window"
title = "繰り返しなし"
story = "マーカーを置く前に、二問目がボードに書かれている。"
brief = '''
テキストが一行、空白なしです。

繰り返しのない文字が続く最長の区間の長さと、その区間そのものを出力
してください。複数の区間が同じ長さなら、最も左のものを出力します。

```
input:  abcabcbb
output: 3
        abc
```

ウィンドウは右にしか動きません。繰り返しのあとに先頭から走査し直して
いるなら、二乗のものを書いています。
'''
hints = [
  "各文字を最後に見た添字と、ウィンドウの始まる添字を保持します。",
  "繰り返しが問題になるのは、その最後の位置が現在のウィンドウの中にあるときだけです — それが `previous >= start` の判定です。",
  "最良の長さ*と*その始まりを記録してください。さもないと最後に区間を出力できません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.hacker.03.intervals"
title = "シフト表"
story = "ラッキー・マックのシフト表を渡され、実際に埋まっている時間はどこかと訊かれる。"
brief = '''
一行目は `n`。続く `n` 行は `<start> <end>` で、`start <= end` です。

重なるか接する組をすべて併合し、結果を昇順に、一行に `<start> <end>`
ひとつずつ出力し、次に `COUNT <k>` を出力してください。

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

接しているのも重なりに数えます: `1 4` と `4 5` は `1 5` に併合されます。
'''
hints = [
  "まず start でソートします。その後は左から右への一回の走査で足り、一区間より前を振り返ることはありません。",
  "新しい start が最後に併合した区間の end 以下なら、それを伸ばします。そうでなければ新しいものを push します。",
  "max(last.end, end) まで伸ばしてください — 長い区間に飲み込まれた短い区間が、それを縮めてはいけません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.hacker.04.grid"
title = "建物の外へ"
story = "ホワイトボードに間取り図、遠い角に防火扉、そしてマーカーではなく時計を見ている面接官。"
brief = '''
一行目は `r c`。続く `r` 行がフロアです: `.` は空き、`#` は壁です。

左上 `(0,0)` から始めて右下 `(r-1, c-1)` に着いてください。上下左右に、
空きマスだけを通って動きます。

最短経路の**歩数**を出力し、経路がなければ `-1` を出力します。次に
`REACHED <k>` を出力します: 始点から到達できる空きマスの数で、始点
自身も数えます。

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

深さ優先ではなく幅優先です。深さ優先の探索は*どれか*の経路を見つけ
ます。問いは最短のものを求めています。
'''
hints = [
  "キューとして使う VecDeque が、ここでの BFS と DFS の違いのすべてです。",
  "マスに印を付けるのは pop したときではなく push したときです。さもないと同じマスが何度もキューに入ります。",
  "距離グリッドが訪問済み集合を兼ねます: -1 はまだ見ていないという意味なので、二つ目の構造は要りません。",
  "四つのオフセットの配列ひとつが、本体のコピー四つに勝ります。隣接マスは i64 で計算し、キャストし戻す前に範囲を確かめてください: 行と列は usize で、`r` が 0 のときの `r - 1` はデバッグビルドではパニックし、リリースビルドではおよそ 1.8e19 に回り込みます。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.hacker.05.binary-search"
title = "どれだけ大きなバンか"
story = "配送所は、手持ちの日数でその日の伝票を捌ける最小のバンを欲しがっている。どのバンかは教えてくれない。あなたが名指ししたものが小さすぎるかどうかは教えてくれる。"
brief = '''
標準入力は整数 2 つ、`n` と `seed` です。入力に重さはありません —
**正確に**この生成器で、ラップする `u64` 演算を使って自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

weights[i] = next() % 1000 + 1        for i in 0..n
```

配送所の持ち時間は常に**三日**です。生成器が作った順に積み、順序を変えず、
荷物を決して分割せずに、`n` 個すべてを三日以内で運べる最小のバンの
積載量を求めてください。

その積載量を出力し、次に `MAX <heaviest package>` を出力します。

```
input:  8 1
output: 1702
        MAX 903
```

`8 1` の重さは `775 154 197 871 35 796 131 903` です。積載量 `1701` では
四日かかり、`1702` なら三日で収まります。

探しているのはリストではありません。**答え**を探しているのです:
`max(weight)` から `sum(weights)` までの積載量で、「三日に収まるか」は
偽、偽、偽、そしてその先ずっと真です。それを二分探索してください。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 200000` で、
答えは `33355734`、最も重い荷物は `1000` — 探すべき積載量は探索の出発点から
三千三百万歩も上にあります。積載量を 1 ずつ上げていくのは正しく、それが
スターターであり、五秒の実行制限に対して**二分経っても終わりませんでした**。
範囲を半分にしていく方は `O(n)` の判定を二十七回するだけで、**10 ミリ秒**で
終わります。どちらもこのマシンで、この課題に入っている二つのプログラムで
測定しました。

範囲の両端は単一の値ではなく合計です: 大きいケースの `sum(weights)` は
`10^8` を少し超えます。それでも `i32` に収まりますが、それは生成器が荷物を
`1000` で頭打ちにしているからにすぎません。`i64` のままにしておけば、その
問いは面白くなくなります — そしてそれこそが望ましいことです。
'''
hints = [
  "下限は最も重い荷物ひとつです — それより小さいものではそれを決して運べません。",
  "上限は合計です: 一日で、すべてを積む。",
  "low + (high - low) / 2 とし、成功したら `high` を `mid` まで下げて、うまくいった最小の積載量を保ちます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.hacker.06.stack"
title = "次に大きいもの"
story = "ボードに運賃の列と、質問がひとつ: それぞれについて、その後で次に大きいものはどれか。"
brief = '''
一行目は `n`。二行目は整数 `n` 個です。

各要素について、**その右側**で最初に真に大きい要素を出力し、なければ
`-1` を出力します。一行に空白区切りで並べてください。次に `NONE <k>`、
`-1` だったものの個数を出力します。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

答えがまだ分からない位置のスタックを保持すると、それは底から上に向かって
減少のままです。各位置は一度 push され一度 pop されるので、見た目が
どうあれ全体は一回の走査です。
'''
hints = [
  "スタックが持つのは、まだ答えを待っている添字であって、値ではありません。",
  "新しい値がスタックの先頭にある値に勝つとき、その添字の答えは新しい値です — そして pop し続けてください。複数に勝つかもしれません。",
  "真に大きい、なので等しい値は互いを解決しません。積み重なって、後でまとめて解決されます。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.hacker.07.coins"
title = "ちょうどのお釣り"
story = "パーシバル・ストリートのレジには硬貨のトレイが三つ、そして紙幣を受け取らない客がいる。"
brief = '''
一行目は `n target`。二行目は硬貨の額面 `n` 個です。どの硬貨も無制限に
使えます。

`target` をちょうど作る最小の硬貨枚数を出力し、作れなければ `-1` を
出力してください。次に `REACH <k>` を出力します: `0..=target` の金額の
うち、作れるものの個数で、`0` も数えます。

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

隠しケースは小さいので、捕まえるのは遅さではなく間違いです — そして
そのひとつが、よくある間違った答えを捕まえます。貪欲法、つまり入る
最大の硬貨を取って繰り返すやり方は、`3 4` から `6` を作るのに `4` を
掴んでから失敗し、まさにそのためのケースがあります。もうひとつの悪い
答え、表なしの素朴な再帰はここでは捕まりませんが、それでも書くべき
ものではありません: 本物では `target` は 100000 で、同じ金額が何千回も
再計算されます。
'''
hints = [
  "best[0] = 0 で、best[a] は、入る各硬貨についての最も安い best[a - coin] より一つ多い値です。",
  "到達不能なセルを読んで一を足す前に守ってください。さもないとオーバーフローします。",
  "REACH は、完成した表のセルのうち、まだ到達不能と印されていないものの個数にすぎません。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.hacker.08.top-k"
title = "最も訊かれた五つ"
story = "ウォームアップ。去年のチケットで最も多く出た単語を五つ訊かれ、それでも時間は計られる。"
brief = '''
一行目は `n k`。二行目は空白区切りの単語 `n` 個です。

最も頻度の高い単語 `k` 個を、頻度の高い順に、同数なら単語の昇順で、
一行にひとつずつ出力してください。異なる単語が `k` 個未満なら、すべてを
出力します。次に `DISTINCT <d>` を出力します。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

ハッシュマップで数え、それから順位付けします。同点処理は飾りでは
ありません。`HashMap` はエントリをプロセスごとにランダム化された順序で
渡すので、回数しか見ない比較関数は同数の単語をマップがたまたま出した
順序のままにします — 同じプログラムが次の実行では別の答えを出し、
ソートの*安定性*をいくら使っても救えません。ソートへの入力がすでに
任意だからです。比較を**全順序**にすること — 回数の降順、次に単語の
昇順 — がそれを直し、面接官が聞きたがっている答えです。
'''
hints = [
  "一回の走査で数え、一回のソートで順位付けします。数えながら順位を更新し続けようとしないでください。",
  "b.1.cmp(&a.1) が回数の降順で、.then(a.0.cmp(b.0)) が単語の昇順の同点処理です。",
  "take(k) は k 個未満のときも安全です — パニックせずに末尾で止まります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.hacker.09.linked-list"
title = "連鎖"
story = "Vec なしでやれと言う。ノードがノードを指すもの。それがこの問いの本当の形だからだ。"
brief = '''
一行目は `n`。二行目は整数 `n` 個、順番どおりです。

それらから単方向連結リストを作り — `Option<Box<Node>>`、答えに `Vec`
なし — 三行出力してください:

1. リストを逆順にしたもの、空白区切り
2. 真ん中のノードの値（偶数の `n` なら、二つのうち後の方）
3. `LEN <n>`、入力を信じるのではなく、リストを辿って数えたもの

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

真ん中はランナーです: ポインタひとつは一歩ずつ、もうひとつは二歩ずつ、
速い方が尽きたとき遅い方がそこにいます。一回の走査です。
'''
hints = [
  "後ろから前へ組むのが楽な向きです: 新しいノードそれぞれが古い先頭を next として取ります。",
  "node.next.take() は None を残して末尾を渡してくれます。それがクローンなしでリスト間でノードを移せる理由です。",
  "真ん中のためには、fast が二歩進めたステップでだけ slow を進めます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.hacker.10.tree-walk"
title = "木の巡り方、三通り"
story = "ホワイトボードに木、そして誰も二度考えるべきでない質問: 三つの順序を言え。"
brief = '''
一行目は `n`。二行目は**レベル順**の値 `n` 個で、`-1` は「ここにノード
なし」です — つまり木はヒープと同じ方法で格納されています: 添字 `i` の
子は `2i+1` と `2i+2` です。

四行出力してください: **行きがけ順**、**通りがけ順**、**帰りがけ順**の
走査をそれぞれ空白区切りで、そして `DEPTH <d>` — 根から葉への最長経路
上のノード数です。

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

行きがけ順はノード、左、右。通りがけ順は左、ノード、右。帰りがけ順は
左、右、ノード。再帰は毎回同じ三行で、動くのは `push` の位置だけです。
'''
hints = [
  "push を三つの可能な位置に置ける再帰関数ひとつが、ほぼ同一の関数三つに勝ります。",
  "基底条件は二つの条件を同時に: 配列の末尾を過ぎたか、-1 の上にいるかです。",
  "深さは 1 + 二つの子のうち深い方で、ノードがなければ 0 です。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.hacker.11.bst"
title = "本当に BST か"
story = "追加の質問。誰もが二つの子を調べ、誰もが最初は間違える。"
brief = '''
前の課題と同じレベル順のエンコーディングです: `-1` はノードなし、`i` の
子は `2i+1` と `2i+2` です。

一行目は `n q`。二行目は木の値 `n` 個。三行目はクエリの値 `q` 個です。

`VALID` か `INVALID` を出力してください — これは二分探索木か、つまり
左部分木のすべての値がノードより真に小さく、右のすべての値が真に
大きいか。次にクエリごとに一行: 木にあれば `<value> FOUND <depth>`、
なければ `<value> ABSENT` で、根の深さは 1 です。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

各ノードで `left < node < right` を調べるだけでは**足りません** — 左
部分木の深いところの値が、先祖より大きいことがまだありえます。代わりに
開区間を下へ運んでください。
'''
hints = [
  "開区間 (low, high) を下へ渡します。根は全範囲を受け取り、左の子は (low, node)、右の子は (node, high) を受け取ります。",
  "ノードがなければ空虚に妥当です — それが基底条件で、false ではなく true を返します。",
  "検索は二分探索です: 小さければ左、そうでなければ右、深さは何回跳んだかです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.hacker.12.heap"
title = "ソート済みの列が K 本"
story = "ラッキー・マックのどの支店も伝票をすでに順に並べて送ってくる。全部をもう一度ソートせずに、一列に併合する。"
brief = '''
一行目は `k`。次に `k` 行、それぞれ個数の後にその数だけの整数が続き、
すでに昇順にソート済みです。

すべてを併合してひとつの昇順の行に、空白区切りで出力し、次に
`POPS <total count>` を出力してください。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`BinaryHeap` は**最大**ヒープです。最小ヒープとして使うには、
`std::cmp::Reverse(x)` を push し、取り出すときに `Reverse` を外します —
それが Rust 固有の技のすべてで、この問いが調べているものです。

ヒープが持つのはリストごとにひとつのエントリであって要素ごとではない
ので、リストがどれだけ長くてもサイズ `k` のままです。
'''
hints = [
  "ヒープのエントリは値がどこから来たかを持たなければなりません。さもないと pop した後に補充できません。",
  "Reverse((value, which, at)) はまず value で順序付けます。それがまさに望みのものです。",
  "リストの次の要素を push するのは、そのリストの要素を pop したときだけです — それがヒープを k に保ちます。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.hacker.13.backtracking"
title = "すべての組み合わせ"
story = "店の配置のありうる方法をすべて挙げる。全部を、決まった順で、同じものは二度出力しない。"
brief = '''
一行目は `n`。二行目は**すでに昇順の**相異なる整数 `n` 個です。

すべての部分集合を、一行にひとつ、値を空白区切りで出力し、空集合は `-`
とします。順序は素直な再帰が生む順です: 各位置で、まずその要素を
**取る**分岐、次に飛ばす分岐。次に `SUBSETS <2^n>` を出力します。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

push、再帰、**pop**。pop が人の忘れる部分で、その症状は最初の行より
後のすべての行が長すぎることです。
'''
hints = [
  "要素ごとに再帰呼び出しが二つ: push した状態でひとつ、しない状態でひとつ。取る方を先にすれば、サンプルの順序が自然に出ます。",
  "chosen.pop() は二つの呼び出しの間に入ります。それが試す・再帰する・戻すの `undo` です。",
  "基底条件は at == nums.len() で、そこでの空の選択が空集合で、これも数に入ります。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.hacker.14.word-search"
title = "その単語はグリッドにあるか"
story = "文字の盤と名前。その名前がそこに書かれているかを知りたがり、行き止まりの数も知りたがる。"
brief = '''
