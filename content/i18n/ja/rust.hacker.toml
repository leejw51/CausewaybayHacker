[[quest]]
id    = "rust.hacker.24.inversions"
title = "時計に捕まるもの"
story = "午後の回の最初の質問。素朴な答えは正しく、そして間違った答えだ。"
brief = '''
標準入力は整数二つ、`n` と `seed` です。入力に配列はありません — 回り込む
`u64` 算術で、**正確に**この生成器で自分で作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

**転倒数**を数えてください: `a[i] > a[j]` となる組 `i < j` です。その数を
出力し、次に `MAX <largest value>` を出力します。

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1` のとき配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
です。

**この課題は計算量を強制し、それができる唯一の種類です。** 隠しケースの
ひとつは `n = 200000` です。`O(n²)` の二重ループ — スターターがそれです —
は `2 × 10^10` 回の比較で、五秒の実行制限の中で終わりません。マージソート
の途中で転倒を数えれば `O(n log n)` で、およそ二十ミリ秒で終わります。
このマシンで、この二つのプログラムで計測しました。

大きなケースが決めてくれることがあと二つ。`n = 200000` の答えは
`9990744366` で、`i32` には収まりません — 幅の間違ったアキュムレータは
遅いのではなく、黙って間違います。そして生成器はパニックではなく回り込ま
なければならず、リリースモードではどのみちそうなりますが、デバッグモード
ではそうなりません: `wrapping_mul` と `wrapping_add` と書き、そのつもりで
いてください。
'''
hints = [
  "ソートの前に max を取るか、コピーをソートしてください。マージソートは足元で配列を並べ替えます。",
  "併合で右側の値が勝つとき、左半分の残りの要素すべてがそれより大きい — それが一度に `mid - left` 個の転倒で、技のすべてです。",
  "圧縮した値に対する Fenwick 木がもうひとつの O(n log n) の答えで、部屋で名前を挙げる価値があります。時計の下ではマージソートの方がコードが少ないです。",
]

