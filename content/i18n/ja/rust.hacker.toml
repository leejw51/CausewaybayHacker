# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.hacker.23.prefix-sums"
title = "目標に当たる方法はいくつあるか"
story = "一日の売上と、監査人が見たがっている数。連続する時間の区間で、ちょうどその額になるものがいくつあるか。"
brief = '''
標準入力は整数 2 つ、`n` と `seed` です。入力にリストはなく、目標値も
ありません — **正確に**この生成器で、ラップする `u64` 演算を使って
両方とも自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

k = (next() % 9) - 4                  # the target, drawn first
values[i] = (next() % 9) - 4          for i in 0..n
```

連続する区間で合計がちょうど `k` になるものの数を出力し、次に
`RANGE <s>`、リスト全体の合計を、もう一度足すのではなく最後の累積和
から読み取って出力してください。

```
input:  8 1
output: 4
        RANGE 0
```

`8 1` では目標値は `1`、値は `-1 -1 -1 -4 4 1 3 -1` です。

負の値はスライディングウィンドウを殺します — 大きすぎるウィンドウは
縮めても直せません。生き残るのは累積和です: 区間 `i..j` の合計が `k` に
なるのは `prefix[j] - prefix[i] == k` のときちょうどなので、
`prefix[j] - k` に等しい以前の累積和がいくつあるかを数えます。先頭から
始まる区間のために、マップに `0 → 1` を種として入れてください。

**この課題は計算量を強制します。** 隠しケースのひとつは `n = 500000` です。
すべての区間をその開始点から足し直すのは `1.25 × 10^11` 回の加算で、それが
スターターであり、正しくもあり、五秒の実行制限に対して **51 秒**かかります。
累積和とマップの答えは一回の走査で `O(n)`、**14 ミリ秒**で終わります。
どちらもこのマシンで、この課題に入っている二つのプログラムで測定しました。

`n` が二重ループに通常ふさわしい 200000 ではなく 500000 なのには、知って
おく価値のある理由があります。ここでの素朴な内側ループは連続したスライス上の
加算と比較ひとつずつで、コンパイラが喜んでベクトル化します: 200000 でも
**九秒足らず**で帰ってきました — 制限は超えていますが二倍にも満たず、もっと
速いマシンなら通してしまったでしょう。良いノートパソコンを買えば越えられる
基準は、基準ではありません。

数え上げは大きく — 大きいケースで `53075531` — それでも `i32` に収まります。
走る累積和も同じで、値が `-4..4` の範囲にあるため 500000 個足しても数千に
しかなりません。ここには幅を間違えて静かに壊れるものはありません。
遅いだけです。
'''
hints = [
  "現在の累積和を記録する*前に*以前の累積和を引いてください。さもないと k が 0 のとき、長さゼロの区間が自分自身を数えます。",
  "最初に seen.insert(0, 1) しておくことが、添字 0 から始まる区間をそもそも見つけられるようにします。",
  "最後の累積和が合計なので、二行目に追加のコストはかかりません。",
]

