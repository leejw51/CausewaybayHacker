# ---------------------------------------------------------------- 34
[[quest]]
id    = "rust.hacker.34.stable-sort"
title = "同点は場所を守る"
story = "二人の配達員が同じスコアで終わり、リーダーボードは描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。配達員 `n` 人を作ります。配達員 `i` は
添字 `i` とスコアを持ちます:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

配達員をスコアの**降順**にソートしてください。同じスコアの配達員は
到着した順を保たなければなりません。添字を空白区切りで出力し、次に
`TIES <k>` — ソート後の順序で隣り合う組のうちスコアが等しいものの数を
出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えは同点に何が起きる
かでほぼ完全に決まります。

**これは、自分がどのソートを持っているかを知ることについての課題です。**
`sort_by_key` は**安定**です — 等しい要素は相対順序を保ちます。
`sort_unstable_by_key` はそうではなく、本物の入力では目に見えてそうなり
ません: それはパターン破りクイックソートで、たいてい速く、同点について
何の約束もしません。スターターはそれを使っており、隠しケースはそれが
実証的に順序をかき混ぜるのに十分な大きさです。（`n = 8` ではたまたま
そうなりません — 小さなテストでは何も証明できなかった理由であり、ここ
では小さなケースが判定するものではなく*見える*ものになっている理由
です。）

正しい答えは二つあり、両方言えるべきです。安定ソートを使う。**または**
不安定なものを使って比較を**全順序**にする — `(Reverse(score), index)` で
ソートすれば、どの二要素も等しく比較されることがなく、安定性は問題で
なくなります。既定で手を伸ばすべきは二つ目です。順序が完全に指定されて
いれば、不安定ソートには何も証明することがありません。
'''
hints = [
  "一語: sort_unstable_by_key を sort_by_key にします。それが安定な方の答えです。",
  "もう一方の答えは不安定ソートのままで (Reverse(score), index) でソートします — 全順序なので、不安定になりうる同点が残りません。",
  "TIES は完成した順序で隣り合う等しいスコアを数え、その数は二つのどちらを書いても同じです — あなたを露わにするのは添字の順序の方です。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.hacker.28.lru"
title = "ホワイトボード"
story = "7-32 号室、最後の質問、そして面接官はモニターを切る。ハイライトなし、補完なし、時計。"
brief = '''
一行目は `cap q`。続く `q` 行は `PUT <key> <value>` か `GET <key>` です。

満杯のときに**最も長く使われていない**エントリを追い出す、固定容量の
キャッシュを実装してください。`GET` も `PUT` も、キーを使ったことに
数えます。

各 `GET` について値を出力し、なければ `-1` を出力します。最後に生き
残ったキーを、最近使われたものから順に、空白区切りで — キャッシュが
空なら `-` を — そして `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

サンプルを追ってください: `GET 1` が `1` を再び最近のものにするので、
`PUT 3` が場所を必要とするとき出ていくのは `2` です。`GET 2` は外れます。
`GET 3` は当たり、`3` を最も最近のものにします。だから生き残りは `3 1`
と出力されます。

教科書の答えはハッシュマップから双方向連結リストへ、です。Rust では
`unsafe` も `Rc<RefCell<_>>` も使わない正直な版は、単調増加するスタンプ
を持つ `HashMap<i64, (i64, u64)>` で、追い出しは最も古いものを走査して
探します。それは追い出しあたり O(1) ではなく O(cap) で、そう口に出して
言うことは、そうでないふりをするより部屋の中で価値があります。
'''
hints = [
  "操作ごとに刻む時計ひとつ。触れたキーはすべてその読みを記録します。すると新しさはソートに使うただの数です。",
  "すでにあるキーの上書きは追い出しではありません — キャッシュが満杯だと判断する前に contains_key を調べてください。",
  "最後の行はスタンプの降順に並べます。つまり最後に触れたキーが先頭に来ます。",
