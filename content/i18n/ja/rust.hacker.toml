# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまでクリアしたどのマップも跳びの数を数えていた。トラムは停留所がいくつあるかを気にしない。どれだけかかるかを気にする。"
brief = '''
標準入力は `n m seed`: 停留所 `n` 個、無向の重み付き辺 `m` 本です。グラフは
回り込む `u64` で、**正確に**この生成器で自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達可能なすべての停留所への最短距離の合計（`0` 自身も
含み、それは `0`）を出力し、次に `MAX <the largest of them>` を出力して
ください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 100000`、
`m = 200000` です。Dijkstra はどちらにせよ正しいアルゴリズムです。時計が
決めるのは優先度付きキューです。未訪問のノードをすべて走査して最小を
探すのは `O(V²)` で、五秒の実行制限に対して**およそ十六秒**かかります。
二分ヒープなら `O((V + E) log V)` になり、**およそ五十ミリ秒**で終わり
ます。どちらの数もこのマシンで、この課題に付属する二つのプログラムで
計測しました: スターターが走査版です。

はっきり見ておく価値があります。時間制限付きスクリーニングに落ちる最も
よくある形だからです: **スターターは間違っていません。** 正確に正しい
答えを出力します。拒まれるのは、三倍遅く着くからだけです。

`std::collections::BinaryHeap` は最大ヒープなので、
`Reverse((distance, node))` を push します。decrease-key はなく、要り
ません: 改善した距離を新しいエントリとして push し、pop したエントリの
距離がすでに記録したものより悪ければ飛ばします。この「古いエントリ」の
スキップが人の忘れる行で、それがないとヒープは際限なく育ちます。
'''
hints = [
  "Reverse((distance, node)) が最大ヒープを最小ヒープに変え、distance を先に置くことでそれがエントリの順序を決めます。",
  "`if d > dist[u] { continue; }` が古いエントリのスキップです。それがなくてもアルゴリズムは正しいままですが、ヒープは廃れたエントリで埋まります。",
  "生成器の全域木の半分がすべてのノードの到達可能性を保証するので、i64::MAX に対するフィルタは実際には何も除きません — それでも残してください。到達不能なノードのあるこの問いの版が、追加の質問だからです。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.hacker.30.range-queries"
title = "変わり続ける合計"
story = "チェーン全体の一日ぶんのレジ操作四百万件、その半分が訂正で、誰かが累計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の
操作を実行します。すべて同じ生成器から、回り込む `u64` で:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

すべてのクエリの答えの累計を出力し、次に `UPDATES <k>` を出力して
ください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制され、そうするのには手間がかかりました。** 素朴な
答え — クエリごとに範囲をループする — はクエリあたり `O(n)` で、この
マシンではコンパイラによって驚くほど速いものにベクトル化*も*されます。
小さなケースでは捕まりません。そこで大きな隠しケースは
`n = 500000, q = 4000000` で、素朴な答えは `10^11` のオーダーの要素に
触れて五秒の実行制限の中で終わらず、Fenwick 木は全体をおよそ十分の一秒
でやり遂げます。どちらも、この課題の二つのプログラムで計測しました。

教訓は面接官が釣ろうとしているものです: *一点更新、区間和*は Fenwick 木が
まさにそのために存在する形です。短い関数三つ — add、prefix、そして
二つの prefix の差としての range — で、`i & i.wrapping_neg()` が最下位の
立っているビットぶん進む方法です。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ります。O(n) のボトムアップ構築は良い最適化ですが、時計が試しているものではありません。",
  "i & i.wrapping_neg() は最下位の立っているビットを取り出します。それを足すと木を上に歩き、引くと下に歩きます。",
  "range(l, r) は prefix(r + 1) - prefix(l) で、その一組のオフバイワンを正しくすることがデバッグの大半です。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "トップ二十の質問。ほとんどのスクリーニングで何らかの形で訊かれ、ほとんどの人が一度は書いて一度も理解していないもの。"
brief = '''
標準入力は `n alphabet seed` です。文字列は自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、次に `AT <index>` — その長さのもの
のうち**最も左**のものの 0 始まりの開始位置を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心から広げます。中心は `n` 個ではなく `2n - 1` 個です: どの文字も
奇数長の回文の中心で、二文字の間のどの隙間も偶数長の中心です。隙間を
忘れることが、正しく見える解が `abba` で `1` を返す理由です。

**テストが強制するものとしないもの**を、はっきりと。仕事をする隠し
ケースは**一**文字のアルファベットに対する `n = 20000` です。中心から
広げる方法の最悪ケースで — どの中心も文字列の端まで走ります — 正しい
答えはそこで完全な `O(n²)` をやって、なお **0.08 秒**で終わります。
これはまた、すべての部分文字列を調べて一つずつ検査するやり方を拒む
ものでもあります: それは五秒の制限に対して**四十秒経ってもまだ走って
いました**。

もうひとつの大きなケース、二文字のアルファベットに対する `n = 20000`
は**正しさ**のケースであって速さのものではありません。ランダムな二値
文字列では回文の検査は一、二文字で失敗するので、三乗の答えでさえ
**0.64 秒**で通ります。これが調べるのは、あなたの生成器と最左の添字の
同点処理が大規模でも我々のものと一致することです。速かったかどうかは
調べません。三つの数はすべてこのマシンで計測しました。

正直な注釈をひとつ。面接官が突いてきそうな種類のことだからです: 一文字
のケースが拒むのは、*すべて*の部分文字列を調べるやり方です。これまで
見つけた最良より長くない部分文字列を飛ばす一行を足せば、同じ三乗の
ループが両方の大きなケースを通ります — この入力ではその枝刈りで `O(n²)`
に潰れるのです。つまりテストは素朴な三乗を拒むのであって、最悪ケースで
三乗のすべてのプログラムを拒むのではありません。

というわけで: テストは三乗を拒み、二乗を受け入れます。`O(n)` の答えである
Manacher のアルゴリズムは**要求しません**。それが存在することと何を
するかは知っておいてください。「で、二乗より良くできる?」が、この問いが
普通そのために訊かれる追加の質問だからです。
'''
hints = [
  "中心ごとに呼び出し二回: 奇数長のための (c, c) と偶数長のための (c, c + 1) です。スターターには二つ目がありません。",
  "ループが止まったとき、i と j はどちらも回文の一つ外に動いています — なので回文は i + 1 から始まり、長さは j - i - 1 です。",
  "更新するのは真に長い回文のときだけで、各長さの最も左のものが保たれます。それが AT の求めるものです。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.hacker.32.modular"
title = "十億七で割った余り"
story = "問題文の末尾にその句が現れ、部屋の半分はそれが何をしろと言っているのか分からない。"
brief = '''
標準入力は `n q seed` です。回り込む `u64` で、`q` 個のクエリを生成
します:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各クエリについて二項係数 `C(a, b)` を **1000000007 を法として**計算
してください。`q` 個の答えすべての合計を、それ自体も `1000000007` を
法として出力し、次に `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

このサイズでは `C(a, b)` は数十万桁になるので、計算してから減らすことは
決してありません — 掛け算のたびに減らしていきます。問題は割り算です:
`a! / (b! (a-b)!)` は剰余算術では意味を持ちません。代わりになるのが
**モジュラ逆元**で、`1000000007` は素数なので Fermat の小定理がそれを
与えてくれます: `inverse(v) = v^(p-2) mod p`、高速べき乗でおよそ三十回の
二乗で計算できます。

というわけで: `factorial[0..=n]` を一度だけ前計算し、各クエリに
`f[a] * inv(f[b]) * inv(f[a-b])` で答えます。

**ここでは計算量が強制されます。** 隠しケースのひとつは `n = 200000`、
`q = 200000` です。各係数を独立に計算する — `b` 項を掛け、`b` 項で割り、
それぞれにモジュラ逆元をひとつ — と五秒の実行制限の中で終わりません。
それがスターターです。共有の階乗表ひとつならおよそ五十ミリ秒で終わり
ます。どちらもこのマシンで計測しました。

すべての中間値は `2^30` 未満の二つの値の積なので、`i64` に収まり、何も
オーバーフローしません。32 ビットの `int` の言語では収まらず、それが
この問いが訊かれる理由のもう半分です。
'''
hints = [
  "掛け算のたびに減らし、最後にまとめては決してやらないでください。i64 は P 未満の二つの値の積を保持できますが、階乗は保持できません。",
  "inverse(v) は power(v, P - 2) で、それが動くのは P が素数だからにほかなりません — ここでの Fermat の小定理の中身はそれがすべてです。",
  "inverse(factorial[n]) から逆向きに逆階乗も前計算しておけば、クエリごとの power() 呼び出し二回がなくなります。通るためには不要ですが、口に出して言う価値があります。",
]

