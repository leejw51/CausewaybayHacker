}
```
'''
hints = [
  "`let` の論駁可能なパターンには else 分岐が要り、その分岐は抜け出さなければなりません — return、break、continue、panic のどれかです。値を返すのは抜け出すことになりません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.cheatsheet_advanced.10.binding-and-guard"
title = "短い奇数の散歩"
story = "パーシヴァル・ストリートでのアレックスの歩行命令: 1 から 5 ブロックの歩きは短い。メイが気にするのは奇数のものだけ。"
brief = '''
`enum Cmd { Walk(i32), Wait }`。`Cmd::label(&self)` の中に、距離が 1 から 5 —
