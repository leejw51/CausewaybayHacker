[[quest]]
id    = "rust.cheatsheet_advanced.25.arc-mutex"
title = "四つのドア、一つの集計"
story = "SOGO 地下のゲームセンターでは四つのドアが入場者を一つの集計に数える。合計は正確でなければならない。"
brief = '''
`hits` は `Arc<Mutex<u32>>` です。四つの spawn されたスレッドのそれぞれで、`c` は
`Arc::clone(&hits)` で、各スレッドはカウントに 1 を 1000 回足します。
スレッドの中で 1 を足す行はどれでしょう?

```
hs.push(thread::spawn(move || {
    for _ in 0..1000 { /* ____ */ }
}));
for h in hs { h.join().unwrap(); }
```
