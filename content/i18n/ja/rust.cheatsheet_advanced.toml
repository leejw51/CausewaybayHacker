```

空欄を埋める式はどれでしょう?
'''
hints = [
  "テストに通ったときだけ値を残すのは Option のメソッドです。Result にはそのメソッドがありません。テストに落ちたとき、何のエラーになればよいかが必要になるからです。まず Option に降りましょう。クロージャには参照が貸されます。",
]

# ---------------------------------------------------------------- 57
[[quest]]
id    = "rust.cheatsheet_advanced.57.bool-option-result"
title = "BOOL、OPTION、RESULT"
story = "利舞台の座席板: 座席番号は板に載っているか、いないかのどちらかで、チケット売り場は載っていないときに一文を欲しがっている。"
brief = '''
`fn pick(xs: &[u32], i: usize) -> Result<u32, String>` の中で: `i` が範囲内なら
`xs[i]` を返し、そうでなければ `Err(format!("no item {i}"))`
— 決してパニックせず、メッセージは必要なときだけ組み立てます。

```
let v = ____;
Ok(v)
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "三つの型が順に並びます: bool が Option になり(遅延で。さもないとインデックスがパニック)、Option が Result になり(遅延で。メッセージは必要なときだけフォーマットされる)、そこで初めて Result 関数の中の `?` が使えます。",
]
