    Cmd::Wait => "wait".into(),
    // ____
    Cmd::Walk(_) => "walk".into(),
}
```
'''
hints = [
  "`@` で範囲パターンに名前を束縛すれば、ガードでその名前を検査できます。どちらの範囲の形が上端を含むかに注意。",
]

