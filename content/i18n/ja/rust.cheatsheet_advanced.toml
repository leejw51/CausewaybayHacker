# RUST LAND — CHEATSHEET ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose of
# `content/rust/cheatsheet_advanced.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "rust.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet_advanced.01.default-method"
title = "予備の一行"
story = "06:50、ジャーディンズ・バザールの上の階。メイのリストにある店はどれも自分の名前を言える。彼女は全部の店に挨拶をさせたいが、店ごとに挨拶を書くのは御免だ。"
brief = '''
`Greet` はすでに `name` を要求しています。トレイトに `hello` を足して、
`impl Greet for Shop` が `name` **だけ** を書けばよく、それでも `Shop.hello()` が
コンパイルでき、`name` が返すものをそのまま返すようにしてください。

```
trait Greet {
    fn name(&self) -> String;
    // ____
}
impl Greet for Shop { fn name(&self) -> String { "Sogo".into() } }
```
'''
hints = [
  "本体を持つトレイトメソッドは実装側で省略できます。シグネチャだけのものは省略できません。そのためのキーワードはなく、本体があることがすべての合図です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.cheatsheet_advanced.02.trait-objects"
title = "どんな形でも"
story = "ジャフィ・ロードの看板屋は、四角も丸も同じ注文帳で受ける。どれも自分の面積を知っている。"
brief = '''
`Shape` は `fn area(&self) -> f64` を持つトレイトで、`Sq` と `Ci` の両方が
実装しています。`Sq` **と** `Ci` を同時に、それぞれヒープ上に置いて入れられる
伸長可能なリストとして `shapes` を宣言し、
`shapes.iter().map(|s| s.area()).sum::<f64>()` が動くようにしてください。
'''
hints = [
  "一つの Vec に二つの具体型を入れるにはトレイトオブジェクトへのポインタが要ります。ジェネリックパラメータでは型がどちらか一方に固定され、裸のトレイトはそもそも型ではありません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet_advanced.03.where-bound"
title = "何であれ、いちばん大きいもの"
story = "SOGO の価格板は価格を f64、在庫数を i32 で持っている。フェリスは関数を二つ書かずに、どちらの最大値も欲しい。"
brief = '''
`largest` は `&[f64]` **と** `&[i32]` の両方で呼ばれます。`>` で比較して、
勝者への参照を返します。境界は `where` 句に書きます。

```
// ____
    let mut m = &v[0];
    for x in v { if x > m { m = x; } }
    m
}
```
'''
hints = [
  "`>` に必要なのは半順序だけで、それ以上ではありません。全順序や完全な等価性を求める境界は浮動小数点を締め出します。それに本体が返すのは `&T` であって `T` ではありません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.cheatsheet_advanced.04.next-signature"
title = "Fib が渡すもの"
story = "ヘネシー・ロードのトラム番号は一つずつ出てくる。どれも、その前の二つから作られる。"
brief = '''
`Fib { a: u64, b: u64 }` が `u64` のイテレータになります:

```
impl Iterator for Fib {
    type Item = u64;
    // ____
        let r = self.a;
        self.a = self.b;
        self.b += r;
        Some(r)
    }
}
```

空欄のメソッドに、トレイトが要求するシグネチャはどれでしょう?
'''
hints = [
  "このメソッドは状態を進めるので `self` の排他的な借用が要ります。そして「もう何もない」と言えなければならないので、アイテムを裸ではなく包んで返します。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet_advanced.05.box-dyn-error"
title = "二種類のトラブル"
story = "グロスター・ロードから延びる決済の経路はパーサでも台帳でも失敗しうる。`main` は一つの `?` で両方を飲み込まなければならない。"
brief = '''
`AppError` は自作のエラーです:

```
impl fmt::Display for AppError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, "app: {}", self.0) }
}
impl std::error::Error for AppError {}
```

impl はこれだけです — `AppError` には `From` 変換が **ありません**。
`main` の中で、`?` が `ParseIntError` **と** `AppError` の両方に使われます。
両方がコンパイルできる `main` のシグネチャはどれでしょう?
'''
hints = [
  "一つの `?` に二つの異なるエラー型を通すには、両方が変換できる戻り値型が要ります: トレイトオブジェクトで、しかもサイズが決まったもの — つまりポインタの後ろに置きます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet_advanced.06.from-for-question-mark"
title = "変換器"
story = "ジャーディンズ・バザールのレジはパース失敗を自分の言葉で報告する。台帳は毎行 `map_err` を書かずに、自分の enum で受け取りたい。"
brief = '''
`enum AppError { Parse(ParseIntError), Neg }`。下の関数は書かれたとおりに
コンパイルできなければなりません — 変換は `?` がやります:

```
fn read(s: &str) -> Result<i32, AppError> {
    let n: i32 = s.trim().parse()?;
    if n < 0 { return Err(AppError::Neg); }
    Ok(n)
}
```

中に `fn from(e: ParseIntError) -> Self { AppError::Parse(e) }` を書いて
これを成り立たせる impl のヘッダはどれでしょう?
'''
hints = [
  "`?` はエラー変換のために特定の一つのトレイトを呼びます。それは変換先の型に、変換元の型について実装するものです — 逆向きではなく、鏡写しのいとこでもありません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.cheatsheet_advanced.07.map-err-chain"
title = "彼女自身の言葉で"
story = "7-32 号室の台帳は失敗を平文で記録する。だからパーサのエラーは関数を出る前に String にならなければならない。"
brief = '''
関数は `Result<i32, String>` を返します。`n` は `s` をパースした `i32` で、
不正な `s` ならパーサのメッセージを `Err` として返します。一行で。

```
fn read(s: &str) -> Result<i32, String> {
    // ____
    Ok(n * 2)
}
```
'''
hints = [
  "パーサのエラーから String への組み込みの変換はないので、`?` だけでは足りません。まずエラーを変換してから伝播させましょう。",
]

