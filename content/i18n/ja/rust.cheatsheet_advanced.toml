[[quest]]
id    = "rust.cheatsheet_advanced.56.result-has-no-filter"
title = "Result には filter がない"
story = "ビクトリア・パークの入口の人数カウンターは数か故障を報告する。ゼロという値は、カウンターが一度も押されなかったという意味だ。"
