]

# ---------------------------------------------------------------- 53
[[quest]]
id    = "rust.cheatsheet_advanced.53.unwrap-or-else-err"
title = "クロージャはエラーを受け取る"
story = "イーウォー・ストリートのコインランドリーのカウンターは整理券番号を印字する。機械が詰まったときはエラーメッセージの長さを — どれほどひどいかを表す店主独自の暗号だ。"
