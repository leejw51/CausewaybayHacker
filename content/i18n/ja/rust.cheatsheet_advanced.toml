    move || { c += 1; c }
}
```
'''
hints = [
  "このクロージャはキャプチャしたものを変更するので、ある一種類のクロージャです。二回呼ばれるので一回きりの種類ではありません。そして本体のどこにも Box で包む箇所はありません。",
]

