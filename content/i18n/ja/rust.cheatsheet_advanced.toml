'''
hints = [
  "それ自体が Option を返す検索はチェーンしなければなりません。map すると Option の中に Option ができます。それに検索は参照を返すので、デフォルトの前にコピーして取り出しましょう。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.cheatsheet_advanced.09.let-else"
title = "最初の単語か、さもなくば退場"
story = "大排檔の注文票は白紙かもしれない。最初の単語がなければ、メイは 0 を持って立ち去る。"
brief = '''
`w` は `s` の空白区切りの最初の単語 — 次の行で使われる `&str` — でなければ
なりません。なければ、関数はその場で `0` を返します。

```
fn first_num(s: &str) -> i32 {
    // ____
