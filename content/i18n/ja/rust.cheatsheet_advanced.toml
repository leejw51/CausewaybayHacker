]

# ---------------------------------------------------------------- 55
[[quest]]
id    = "rust.cheatsheet_advanced.55.map-err-variant"
title = "エラー型が違う"
story = "ハイサン・プレイスの映画館の予約システムには独自のエラー enum があるが、チケットのパーサはその言葉を話さない。"
