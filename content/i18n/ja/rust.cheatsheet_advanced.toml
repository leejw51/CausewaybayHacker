# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.cheatsheet_advanced.27.take-n-messages"
title = "ちょうど四つ、ハングしない"
story = "ロックハート・ロードの四人の配達員がそれぞれ数字を一つ無線で返す。配車係は自分の無線をつけたままで、それでも四つ受けたら聞くのをやめなければならない。"
brief = '''
`n: usize = 4`。四つのスレッドがそれぞれ `tx.clone()` を受け取り、それぞれ
何か仕事をした後に `u64` を **一つ** 送ります。元の `tx` は drop **されず**、
`main` が持ったままです。`r` は四つのメッセージすべてを持ち、`main` は
ハングしてはいけません。

```
let (tx, rx) = mpsc::channel::<u64>();
for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "受信側のブロッキングイテレータは送信側が全部いなくなって初めて終わります。`main` に一つ残っているなら、数で止めましょう。ノンブロッキングのイテレータはその時点で届いているものだけを返します — 何もないかもしれません。",
]

