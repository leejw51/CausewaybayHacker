空欄を埋める式はどれでしょう?
'''
hints = [
  "`.iter()` は `&i32` を渡し、`filter` はクロージャに各要素への参照を貸すので、クロージャが見るのは `&&i32` です。出てくる要素は、コピーするまでは参照のままです。",
]

# ---------------------------------------------------------------- 48
[[quest]]
id    = "rust.cheatsheet_advanced.48.into-iter-filter"
title = "アンパサンド一つ"
story = "シュガー・ストリートの屋台の店じまい: Vec の番号は今夜以降は要らないので、借りるのではなく持っていってよい。"
brief = '''
`a: Vec<i32>` は `[10, 16, 300, 1000, 200]` で、この後は**必要ありません**。
