空欄を埋める式はどれでしょう?
'''
hints = [
  "Vec に対する `.into_iter()` は `i32` そのものを渡すので、`filter` はクロージャに `&i32` を貸します — 参照は二つではなく一つ — そしてその後にコピーするものは何も残りません。",
]

# ---------------------------------------------------------------- 49
[[quest]]
id    = "rust.cheatsheet_advanced.49.copied-first"
title = "先にコピー"
