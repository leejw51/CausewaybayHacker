ハングしてはいけません。

```
let (tx, rx) = mpsc::channel::<u64>();
for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "受信側のブロッキングイテレータは送信側が全部いなくなって初めて終わります。`main` に一つ残っているなら、数で止めましょう。ノンブロッキングのイテレータはその時点で届いているものだけを返します — 何もないかもしれません。",
]

