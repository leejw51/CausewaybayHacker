]

# ---------------------------------------------------------------- 50
[[quest]]
id    = "rust.cheatsheet_advanced.50.parse-once"
title = "パースは一度だけ"
story = "ボーリントン・ロードの市場の値札板は遅いカメラで読み取られ、読むたびにコストがかかる。メイは値札ごとに一度だけ読みたい。"
brief = '''
`a: Vec<&str>` は `["123", "456.5", "-1.2", "aa", "12345678"]` です。`parse`
は `&str` を一つ `f32` としてパースし、呼ばれた回数を数えるクロージャです。
`c` はパースできた数でなければならず、`parse` は文字列ごとに一度だけ呼ばれます
— 九回ではなく五回。

```
let c: Vec<f32> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "パースが成功するかどうかでフィルタすると、パースした数を捨ててしまうので、次のステップでまたパースすることになります。一つのアダプタで、同じステップのうちに数を残して失敗を捨てられます。",
]

# ---------------------------------------------------------------- 51
[[quest]]
id    = "rust.cheatsheet_advanced.51.all-or-nothing"
title = "全部か無か"
story = "リー・ガーデンの荷捌き場の配送目録: 重さが一つでも読めなければ、その行だけでなく目録ごと差し戻される。"
brief = '''
`a: Vec<&str>` は重さを持っています。`c` は、すべてが `f32` としてパースできれば
全部の重さを持つ `Ok`、一つでもできなければ最初の `Err` でなければなりません —
`["123", "aa"]` は `Err`、`["1", "2.5"]` は `Ok([1.0, 2.5])` になります。

```
let c: Result<Vec<f32>, ParseFloatError> = ____;
```

空欄を埋める式はどれでしょう?
'''
hints = [
  "Result を一つの Result に collect すると最初の Err で止まります — ただし Err がそこまで届けば、です。先に失敗を捨てるものは何であれ、失敗する材料を残しません。",
]

