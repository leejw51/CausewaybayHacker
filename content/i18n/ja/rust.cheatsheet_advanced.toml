[[quest]]
id    = "rust.cheatsheet_advanced.21.checked-digits"
title = "黙ってラップしない"
story = "グロスター・ロードの決済は金額を手でパースする。オーバーフローは None として返らなければならない。もっともらしく見えるだけの数字では決してない。"
