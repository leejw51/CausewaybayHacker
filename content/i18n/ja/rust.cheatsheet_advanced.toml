[[quest]]
id    = "rust.cheatsheet_advanced.08.option-chain"
title = "添字かもしれない"
story = "銅鑼湾駅のロッカー番号 `o` は None かもしれないし、最後のロッカーより先かもしれない。メイは中身か -1 が欲しい。パニックは御免だ。"
