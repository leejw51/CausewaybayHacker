  "case Line::TsuenWan: return \"red\"; と case Line::KwunTong: return \"green\"; — Island の行と同じ形です。",
  "enum class の列挙子は常に型を前に付けて書きます: Line::TsuenWan、TsuenWan 単独は決してありません。",
