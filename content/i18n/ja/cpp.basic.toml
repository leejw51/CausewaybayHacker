出力の前にキーをソートするのです。`count(k)` や `find(k)` は、キーを作らずに
それがあるかどうかを尋ねます。

```
counts["gun"] = 12;
counts.erase("siu");
counts.at("mai") = 0;
std::sort(keys.begin(), keys.end());
```

`counts` はすでにその行のすべての語を集計していて、どの行にも `mai` があります。
`keys` はそのキーのベクタで、バケットが出した順に写してあります。その四行を
`// FILL` に打ってください: `gun` を `12` で追加し、`siu` を取り除き、`mai` を
`0` にし、それから毎回同じ出力になるようキーをソートします。

```
input:  siu mai har gau siu mai
output: gau 1
        gun 12
        har 1
        mai 0
```
'''
hints = [
  "counts[\"gun\"] = 12; counts.erase(\"siu\"); counts.at(\"mai\") = 0; そして std::sort(keys.begin(), keys.end()); — 追加、削除、編集、ソート。",
  "テーブルには自前の順序がありません: キーは写してあります。それをソートするのが四行目で、出力の前です。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.basic.11.sets"
title = "係留番号"
story = "係留リストにはサンパンの番号が入港のたびに一回ずつ載っていて、港長は実際には何隻なのかを知りたがっています。"
brief = '''
`std::set<long long>` は各値を一つずつ、昇順に保ちます。`insert(x)` は値を
追加し(重複は無視されます)、`erase(x)` は値を取り除きます(ない値は無視されます)。
セットに編集はありません: 値がそれ自身のキーなので、`1` を `-1` に変えるのは
erase の後に insert です。そしてソートの行もありません: `std::set` は常に昇順です。

```
seen.insert(100);
seen.erase(3);
seen.erase(1); seen.insert(-1);
```

`seen` はすでにその行の相異なる値を持っています。その三行を `// FILL` に
打ってください: `100` を追加し、`3` を取り除き、それから `1` を `-1` に変えます。
大きさとソート順の走査は書いてあります。

```
input:  3 1 3 2 1
output: 3
        -1 2 100
```
'''
hints = [
  "seen.insert(100); seen.erase(3); seen.erase(1); seen.insert(-1); — 最後の二つの呼び出しは同じ行です。",
  "3 のないセットでの erase(3) は何もせず、-1 がすでにあるときの insert(-1) も何もしません: どちらも安全です。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.basic.12.stack-queue"
title = "後入れ先出し、先入れ先出し"
story = "サンパンは着いた順に避風塘の岸壁に横付けします: 最後に入った一隻が最初に出られ、最初に入った一隻が仲買人に最初に応対されます。"
brief = '''
`std::stack` は後入れ先出しです: `push(x)` は上に追加し、`pop()` は一番上を
取り除き(何も返しません)、`top()` はそれへの参照で、代入すれば一番上を
その場で編集できます。`std::queue` は反対の端で同じ形です: 後ろに `push`、
前で `front()` と `pop()`。

```
st.push(0);
st.pop();
st.top() = 99;
```

どの数もすでに `st` と `q` の両方に積んであります。その三行を `// FILL` に
打ってください: 上に `0` を追加し、それをまた取り出し、それから一番上を `99`
で上書きします。そのあとスタックは空になるまで取り出されて出力され、キューは
最初の二つが取られます。

```
input:  1 2 3 4
output: 99 3 2 1
        1 2
```
'''
hints = [
  "st.push(0); st.pop(); st.top() = 99; — スタックに対する追加、削除、編集。キューには手を付けません。",
  "top() は参照なので、st.top() = 99 は pop() が次に取り除く要素を変えます。",
]

