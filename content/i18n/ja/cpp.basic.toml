id    = "cpp.basic.07.structs"
title = "屋台一軒、フィールド三つ"
story = "避風塘の魚の屋台は名前と値段と数を三枚の別々の板に書いていて、誰も一枚にまとめていません。"
brief = '''
`struct` は名前付きのフィールドを一つの値にまとめ、それらのフィールドを扱う
