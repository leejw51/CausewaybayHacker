# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.basic.14.sort-by-key"
title = "順位表"
story = "ヨットクラブのレースボードはすべての艇をポイント付きで登録順に並べ、コモドアは一位をいちばん上に欲しがっています。"
brief = '''
`std::sort` は比較子を取ります: 二つの要素を受け取り、一つ目が二つ目より前に
来るべきかを答える関数です。その場で書くラムダが普通の比較子で、「スコアの
降順、次に名前の昇順」は一つの式です: スコアが違えば高いほうが先、同点なら
小さい名前が先です。

```
std::sort(rs.begin(), rs.end(), [](const Row& a, const Row& b) {
    return a.score != b.score ? a.score > b.score : a.name < b.name;
});
```

行は読み込まれ、出力されます。その `std::sort` を `// FILL` に打ってください。

```
input:  3
        mei 40
        alex 55
        sam 40
output: alex 55
        mei 40
        sam 40
```
'''
hints = [
  "std::sort(rs.begin(), rs.end(), [](const Row& a, const Row& b) { return a.score != b.score ? a.score > b.score : a.name < b.name; });",
  "比較子は「a は b より前か」に答えます: スコアが高いほうが先、同点なら小さい名前。",
]

