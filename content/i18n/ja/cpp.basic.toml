# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.basic.09.vector"
title = "順番どおりの水揚げ"
story = "どのサンパンも水揚げを一度に一つの数ずつ水面越しに叫び、港長は最後の船が入るまでそれを置く場所がありません。"
brief = '''
`std::vector<long long>` は伸びる配列で、それに対してすることは追加、削除、
編集、ソートの四つです。`push_back(x)` は末尾に追加し、
`erase(v.begin() + i)` はインデックス `i` の要素を取り除いて隙間を詰め、
`v[i] = x` はすでにあるものを上書きし、`<algorithm>` の `std::sort` は全体を
昇順に並べます。インデックス `0` が先頭です。

```
xs.push_back(99);
xs.erase(xs.begin());
xs[0] = 700;
std::sort(xs.begin(), xs.end());
```

`xs` はその行の整数を持っています。その四行を四つの `// FILL` に打ってください:
末尾に `99` を追加し、最初の要素を取り除き、新しい最初の要素を `700` にし、
それからソートします。ベクタが出力され、次にその大きさが出力されます。

```
input:  4 8 15 16
output: 15 16 99 700
        4
```
'''
hints = [
  "xs.push_back(99); xs.erase(xs.begin()); xs[0] = 700; std::sort(xs.begin(), xs.end()); — 追加、削除、編集、ソート。",
  "erase と sort はイテレータ(xs.begin()、xs.end())を取り、[] はインデックスを取ります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.basic.16.list"
title = "前か後ろか"
story = "偶数番号のサンパンは避風塘の奥に、奇数番号は手前に舫うのに、係留リストはただ後ろに足し続けます。"
brief = '''
`<list>` の `std::list` は双方向連結リストです: どちらの端での追加も削除も
定数時間で、ベクタは先頭ではそれができません。`push_front(x)` は先頭に追加し、
`pop_back()` は最後の要素を取り除き、`front()` は参照で(代入すると最初の要素が
変わります)、リストは自分の `sort()` メンバで自身をソートします。`std::sort`
はランダムアクセスを必要とし、連結リストにはそれがないからです。

```
l.push_front(0);
l.pop_back();
l.front() = 99;
l.sort();
```

`l` はすでにその行の整数を順に持っています。その四行を `// FILL` に打ってください:
先頭に `0` を追加し、最後の要素を取り除き、先頭を `99` で上書きし、それから
ソートします。リストが出力されます。

```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "l.push_front(0); l.pop_back(); l.front() = 99; l.sort(); — 一行ずつ、この順で。",
  "std::sort は std::list をソートできません(ランダムアクセスがない)。リスト自身の l.sort() ならできます。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.basic.10.maps"
title = "集計ボード"
story = "避風塘の集計ボードには船団が揚げた魚が一匹一語で全部並び、仲買人は種類ごとに一行、数を付けて欲しがっています。"
brief = '''
`std::map<std::string, int>` はキー順に保たれる辞書です。`m[k] = v` はキーを
追加します(あれば上書きします)。`erase(k)` はキーを取り除き、なければ何も
しません。`at(k)` はすでに存在するはずのキーの項目で、代入すれば編集になり、
キーをでっち上げる代わりに例外を投げます。マップを走査するとキーはソート順に
訪れます。`std::map` は常にキー順なので、ここにソートの行はありません。

```
counts["crab"] = 1;
counts.erase("rice");
counts.at("fish") = 9;
```

`counts` はすでにその行のすべての語を集計していて、どの行にも `fish` があります。
その三行を `// FILL` に打ってください: `crab` を `1` で追加し、`rice` を取り除き、
それから `fish` を `9` にします。ソートした出力は書いてあります。

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
'''
hints = [
  "counts[\"crab\"] = 1; counts.erase(\"rice\"); counts.at(\"fish\") = 9; — 追加、削除、編集。",
  "[] はないキーを作り、at() は作るのを拒みます。キーがすでにあるはずのときは at() を使います。",
]

