[[quest]]
id    = "cpp.basic.13.sorting"
title = "水深順"
story = "避風塘の岸壁沿いの測深値は船が測った順に書き留められ、海図はそれを浅い順に、次に深い順に欲しがっています。"
brief = '''
`<algorithm>` の `std::sort` は範囲をその場で並べます。ベクタの両端を渡すと
