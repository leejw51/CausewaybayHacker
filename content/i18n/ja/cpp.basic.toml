return price * qty;
Stall s{name, price, qty};
```

`Stall` は名前と値段と数量を持ち、`main` は `name: total` を出力します。
その二行を二つの `// FILL` に打ってください: 一つ目は `total()` の本体、
二つ目は `main` で `s` を作ります。

```
input:  fish 12 3
output: fish: 36
```
