[[quest]]
id    = "cpp.basic.17.threads"
title = "一隻にウインチ一台"
story = "船台のどのサンパンにも専用のウインチがあり、全部が一斉に引き、集計は最後の一台が止まってから読まれます。"
brief = '''
`std::thread` は作られた瞬間に関数を自分のスレッドで走らせ、`join()` はそれが
終わるのを待ちます。スレッドのベクタは `emplace_back` とラムダで作ります。
`[&, i]` のキャプチャは `i` 以外のすべてを参照で借り、`i` はコピーします。
ループは先へ進みますが、コピーは動きません。各スレッドは自分の枠にだけ書くので
何も共有されず、すべての `join()` が戻るまで何も出力されません。

```
threads.emplace_back([&, i] { results[i] = xs[i] * xs[i]; });
for (auto& t : threads) t.join();
```

`results` は数ごとに一つの枠を持ち、出力は書いてあります。一行目をループの中の
`// FILL` に打ってプレースホルダを置き換え、二行目をその後の `// FILL` に
打ってください。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "ループの中に threads.emplace_back([&, i] { results[i] = xs[i] * xs[i]; });、その後に for (auto& t : threads) t.join();。",
  "main の終わりまでに join されていないスレッドはプログラムを終了させます。出力の前に全部 join してください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.basic.18.binary-tree"
title = "SEGFAULT"
story = "12:00、ヌーンデイガン。射撃表は時刻の木で、砲はありもしない左の枝をたどった — nullptr を、コーズウェイベイで間違ってはならない唯一のアドレスで逆参照して。"
brief = '''
二分探索木は、値と二つの子ポインタを持つノードでできています: 小さい値は
`left` の下に、大きい値は `right` の下に住みます。挿入は再帰です: 空の部分木
(`nullptr`)は新しいノードになり、そうでなければ値は片側へ降りていき、その側が
なったものが格納し直されます。その側はついさっきまで `nullptr` だったかも
しれないからです。その格納こそが仕掛けのすべてで、その前の `nullptr` の確認こそが
ボスのすべてです。

```
if (!n) return new Node{v};
if (v < n->val) n->left = insert(n->left, v);
else n->right = insert(n->right, v);
return n;
```

`Node`、`nullptr` の場合、`inorder`、`height`、`main` は書いてあります。
降りていく二行を二つの `// FILL` に打ってください: 左のものを `if` に、
右のものを `else` に。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "左に n->left = insert(n->left, v);、右に n->right = insert(n->right, v);。",
  "結果を格納し直してください: 子は nullptr だったかもしれず、新しいノードは insert が返すものです。",
]
