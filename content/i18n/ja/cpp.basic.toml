std::sort(v.begin(), v.end(), std::greater<>{});
```

数は `v` に読み込まれ、二回出力されます。一つ目の `// FILL` に一行目を、
二つ目に二行目を打ってください。

```
input:  3 1 2
output: 1 2 3
        3 2 1
```
'''
hints = [
  "std::sort(v.begin(), v.end()); そして std::sort(v.begin(), v.end(), std::greater<>{});",
  "std::sort はコンテナではなく範囲を取ります: begin() と end()。",
]

