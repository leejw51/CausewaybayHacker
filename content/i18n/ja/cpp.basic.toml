title = "偶数の停泊所、二乗"
story = "岸壁沿いの偶数番号の停泊所は番号の二乗を払い、奇数番号は何も払わず、帳簿には合計の一行があります。"
brief = '''
`<numeric>` と `<algorithm>` のアルゴリズムは最後の引数にラムダを取ります。
`std::accumulate` は範囲を一つの値に畳み込みます: 初期値から始め、それまでの
