case Line::TsuenWan: return "red";
case Line::KwunTong: return "green";
```

`parse` は語を `Line` にし、`Island` の case は書いてあります。その二つの
`case` の行を `// FILL` の、`Island` の行の下に打ってください。

```
input:  island
output: blue
```
'''
