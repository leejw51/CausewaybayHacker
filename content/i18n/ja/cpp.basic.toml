[[quest]]
id    = "cpp.basic.08.enums"
title = "路線の色"
story = "避風塘のバス停の上の乗換案内は MTR の三路線を示し、それぞれの横の色の帯は塗りつぶされています。"
brief = '''
`enum class` は名前付きの値の閉じた集合です: `Line::Island`、
`Line::TsuenWan`、`Line::KwunTong`、それ以外はありません。それに対する `switch`
は持っている値の分岐を選び、各 `case` は型を前に付けて列挙子を名指しします。
