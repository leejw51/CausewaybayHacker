id    = "cpp.basic.05.loops"
title = "礼砲を数える"
story = "砲は月の日ごとに一発ずつ鳴り、銘板は累計と、どの一発が三の倍数の日に当たったかを欲しがっています。"
brief = '''
C++ で数えるループは三つの部分を持つ `for` です: カウンタがどこから始まり、
いつまで続き、どう進むか。`for (long long i = 1;
i <= n; ++i)` は `1` から `n` までを両端含めて訪れます。本体は訪れるたびに一回
走り、`%` は余りなので、`i % 3 == 0` は「3 の倍数」という意味です。

```
for (long long i = 1; i <= n; ++i) {
```

本体は書いてあります: `i` を `sum` に足し、3 の倍数を数えます。その `for` の行を
`// FILL` に打ち、プレースホルダの行を置き換えてください。

```
input:  10
output: 55
        3
```
'''
hints = [
  "for (long long i = 1; i <= n; ++i) { — 1 から始め、i <= n の間続け、一ずつ進みます。",
  "< n ではなく <= n: 礼砲は n そのものも数えます。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.basic.06.functions"
title = "船台の料金"
story = "ヨットクラブのウインチは、その日の最初の十回は一回五、それ以降は三を取るのに、料金板には「運賃」としか書いてありません。"
brief = '''
関数はひとまとまりの仕事に名前を付けます: 戻り値の型、名前、引数、そして
`return` で終わる本体です。`long long fare(long long
rides)` は数を一つ受け取り、一つ返します。関数は `if` の中から早めに `return`
でき、その行の後にあるものはもう一方の場合です。

```
if (rides <= 10) return rides * 5;
return 50 + (rides - 10) * 3;
```

料金: 最初の 10 回は一回 5、それ以降は一回ごとに 3 です。`main` は `n` を読み、
`fare(n)` を出力します。その二行を `fare` の本体として `// FILL` に打ち、
`return 0;` を置き換えてください。

```
input:  13
output: 59
```
'''
hints = [
  "if (rides <= 10) return rides * 5; — そして次の行に return 50 + (rides - 10) * 3;",
  "5 で十回なら 50 で、十回目を超えた一回ごとにその上に 3 が加わります。",
]

