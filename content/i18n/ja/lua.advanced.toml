[[quest]]
id    = "lua.advanced.03.queue"
title = "誰がハッチを閉めるのか"
story = "安庶庇街の餃子の屋台はどの注文もハッチから厨房へ通しますが、最後の注文の後、カウンターは決して来ない次を立ったまま待っています。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

生産者のコルーチンがひとつ、各値を十倍してキューに積み、そのたびに yield し、最後に **番兵** を積みます。メインループは番兵を見るまでキューから取り、各値を出力して合計を保ち、そのあと `SUM <total>` と `CLOSED` を出力します。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

キューは先頭と末尾を持つテーブルで、テーブルに `close` はありません。そこにあるどれも、もう来ないことを消費者に伝えられません。それは項目でなければなりません。そしてその項目は `nil` ではいけません。テーブルの中の `nil` とは項目の不在だからです。番兵はそれ自身の値です — `local CLOSED = {}`、ほかの誰も持っていないテーブル — そして `value == CLOSED` はそのテーブルひとつに対してだけ真です。テーブルの `==` は同一性だからです。

スターターは番兵を決して積みません。`take` はキューに何か入るまで厨房を resume し、厨房が死んでキューが空になると諦めて `nil` を返します。ループは `nil` という語を出力し、それを合計に足して死にます。ブロッキングキューのある言語なら、これはハングでしょう。Lua では、辿られた `nil` です。

番兵を積むのは生産者です。決して消費者ではありません — 流れが終わったと知っている側が、それを終わらせる側です。
'''
hints = [
  "一行、厨房の関数の最後に: push(hatch, CLOSED)。",
  "消費者はすでに value == CLOSED を確かめています。生産者が決して送らなかったものを待っていて、代わりに nil を受け取ったのです。",
  "番兵が新しいテーブルなのは、nil はテーブルに保存できず、テーブルは自分自身とだけ等しいからです。値がテーブルであることもありうるとしても、番兵はやはり安全です: ほかの誰もこれを持てません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.advanced.04.thread-pool"
title = "八人の運搬係"
story = "蓮花街の端に線香の木箱が四十、運搬係が八人。四十人の運搬係は誰も欲しくありません。欲しいのは、決して立ち止まらない八人です。"
brief = '''
標準入力はふたつの整数 `w` と `n`、続いて `n` 個の値です。

`w` 人の運搬係の **プール** を走らせてください: 同時に動くコルーチンは多くても `w` 個で、それぞれが仕事をひとつ運び、途中で一度 yield してから `(index, value * value)` を返します。結果は仕事が **終わった** 順に集め、インデックスで並べ替え、`<index> <value>` を一行ずつ出力し、次に `WORKERS <w>` を出力します。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

コルーチンは結果ではありません。`coroutine.resume(co)` は `true` と、続いて仕事が yield したか返したものを返します — 値が出てくる扉はそれだけで、それは仕事を終わらせる resume のときに開き、それがプールのどの回かはたまたま次第です。スターターは終わったコルーチンそのもの — `thread: 0x...` の値 — を集め、ソートがその一つを添字で引こうとします。

結果にインデックスを持たせることが、出力を毎回同じにします。それで並べ替えるのは答えの最後の行であって、最初の行ではありません。プールは引き出しのクエストのスケジューラに上限を付けたものです: 走っているものを `w` まで補充し、それぞれに一回順番を与え、死んだものを引退させ、仕事と走っているものの両方が空になるまで繰り返します。
'''
hints = [
  "スターターはソートか print で死にます: attempt to index local 'a' (a thread value)。コルーチンは仕事であって、その答えではありません。",
  "local ok, index, value = coroutine.resume(co) — 仕事を戻りまで走らせる resume では、戻り値が ok の後に続きます。状態が dead のとき { index, value } を保ってください。",
  "プールは自分の順で仕事を終わらせ、結果の中のインデックスだけが、それぞれがどこから来たかの記録です。出力の前にそれで並べ替えてください。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.advanced.05.asyncio"
title = "async は実際どこで動くのか"
story = "メイは四年間 async のコードを書いてきて、それを動かしているものを一度も見たことがありません。今夜、ループは彼女に読める while ループで、路地のどの使い走りもその上で順番を待ちます。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

`double(value)` を、スケジューラに一度 yield し — `coroutine.yield()` — 値を二倍して返すように書いてください。値ごとにコルーチンをひとつ作り、すべてを `gather` で走らせ、各結果を入力順に出力し、次に `SUM <total>` と `TASKS <n>` を出力します。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)` は `f` を実行しません。**コルーチンオブジェクト** を作って返すだけで、何かがそれを resume するまで中では何も起きません。スターターの `run` はそれを三つ、resume しないまま返し、出力は `thread: 0x...` が三行、続いて `attempt to perform arithmetic on a thread value` です。

`gather` がイベントループで、ここではあなたがそれを書きます: タスクを回る `while` で、死んでいないものを順に、一巡また一巡と、何も残らなくなるまで resume し、各タスクの **戻り値** をそのタスクのスロットに保ちます。結果は、どの順で終わったかに関係なく、タスクを渡した順で出てきます。それが、一つのタスクを死ぬまで resume してから次に触れるループではなく、これに手を伸ばす理由のすべてです: そのループは正しく逐次的で、`gather` は正しく交互に進みます。

ここにスレッドはちょうど一本です。`coroutine.yield()` は、タスクがスレッドをループに返して別のタスクが使えるようにする地点です。何も並列には走りません。ものごとは、止まれると自分で言った場所で、**順番に** 走ります。
'''
hints = [
  "return tasks の代わりに return gather(tasks) — そして gather はあなたが書くループです: 死んでいないタスクをすべて、何度も何度も、一つもなくなるまで resume します。",
  "タスクを dead にする resume は、二つ目の戻り値がタスクの戻り値になるものです。それをタスク自身のインデックスに保存してください。それが結果を入力順に保つものです。",
  "終わった順に結果が必要なら、それは前のクエストのプールで、そのときはインデックスを自分で持ち運びます。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.advanced.06.async-queue"
title = "済んだと誰が言うのか"
story = "ビクトリア・パークの提灯の門で使い走り三人が整理券の列を捌き、係は列が空だと言うのを待っています。列は決してそう言いません。券が済んだと誰も列に伝えなかったからです。"
brief = '''
標準入力はふたつの整数 `w` と `n`、続いて `n` 個の値です。

`{ index, value }` の仕事を、保留中のものを数えるキューに入れてください。永遠にループして仕事を取り、`value * 10` を `results[index]` に書き、`task_done` を呼ぶ消費者のコルーチンを `w` 個開始します。メインの関数は `join` — すべての `put` がその `task_done` を得るまで消費者を resume するスケジューラ — を走らせ、それから消費者をキャンセルし、それから結果をインデックス順に出力し、`CONSUMERS <w>` を出力します。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join` は保留中の数が `0` になると戻り、それを減らすのは `task_done` だけです。スターターの消費者は決してそれを呼ばないので、仕事はすべて処理されたのに数はまだ `4` と言い、どの消費者も空のキューの `get` で停車していて、何かを変えられるものはもう何も残っていません。検出器のないループなら、実行環境がプログラムを殺すまでそこで空回りするでしょう。これは検出します: どの消費者も数を減らさなかった一巡はデッドロックで、`join` は `error` でそう言います。ハッチのクエストと同じハングで、綴りが違うだけです — そして直し方もまた一行、消費者の側です。

消費者は `while true` のループです。それが終わるのは、join の後に main がキャンセルするからで、ここでのキャンセルとは **合図付きで resume すること** です: `get` はキューが空のあいだ yield し、それを起こす resume が `"cancel"` を渡すと、`get` は `nil` を返し、消費者は戻ります。yield で停車しているコルーチンは、起こされたときの値で止められます。
'''
hints = [
  "各仕事を処理した後に task_done(queue)。join は put と task_done を突き合わせて数えるだけで、ほかには何も見ません。",
  "coroutine.create は何もスケジュールしません。消費者は join が最初に resume したときに走り、キューが空だと気づいた消費者は get の中から \"idle\" を yield します。",
  "\"cancel\" で起こされた消費者は get から nil を受け取って戻り、それが while true を終わらせます。何も渡さずに resume すれば、また停車するだけです。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.advanced.07.context-managers"
title = "それでもシャッターは下りる"
story = "浣紗街の屋台は注文のたびにシャッターを上げ、その後で下ろします。21:40 に悪い注文を受けた屋台はそれからずっと開いたままです。閉める行が、失敗した行の後にあったからです。"
brief = '''
標準入力は個数 `n`、続いて `<STALL> <CENTS>` の `n` 行で、`CENTS` は整数のはずです。

`opened(stall, body)` — ブロックを関数として受け取る関数 — を書いてください。それは入るときに `OPEN <STALL>` を出力し、`body` を走らせ、**本体が例外を投げたかどうかに関係なく**、出るときに `SHUT <STALL>` を出力します。本体の中でセントを解釈して合計に足します。セントが解釈できない行は、シャッターが閉まった後に `BAD <STALL>` として報告されます。最後に `TOTAL <sum>` と `REJECTED <k>` を出力します。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

Lua に `with` も `finally` もありません。いちばん近いのは、本体をクロージャとして受け取る関数と、呼び出しの周りの `pcall` です。`pcall` より前がすべて入口で、後がすべて出口であり、出口は両方の経路で走ります。`pcall` はエラーを `SHUT` の上まで登らせる代わりに戻り値に変えるからです。スターターは `body()` を裸で呼んでいて、`WONG` のシャッターは決して閉まりません。

シャッターが下りた後、エラーは上に戻ります: `error(err, 0)` がそれを投げ直します — `0` は `error` がメッセージに二つ目の位置を前置するのを防ぎます — そして呼び出し側自身の `pcall` がそれを見て `BAD` を出力します。`opened` の中で飲み込まないでください: 呼び出し側は知りたがっています。
'''
hints = [
  "local ok, err = pcall(body)、次に print(SHUT)、次に if not ok then error(err, 0) end。pcall が finally です。",
  "エラーは opened を通り抜けて main の pcall まで出ていくので、main の BAD はやはり出力されます — SHUT の後に。SHUT は投げ直しの前に出力されたからです。",
  "total = total + parse_cents(cents) は右側を先に評価します。parse_cents が例外を投げると何も代入されないので、悪い行は何も足しません。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.advanced.08.pipeline"
title = "ラインの料理人"
story = "大坑の餃子の屋台のボー料理長のライン: ひとつの持ち場が注文を二乗し、次が累計を保ち、誰もバッチ全体を待ちません。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

**コルーチンのイテレータ** で二段のパイプラインを作ってください:

1. `squares(values)` は各値の二乗を yield する
2. `running(stream)` は数の任意のイテレータを受け取り、累計を保ち、`value, total` の組を yield する

`main` は各組を `<square> <total>` として出力し、次に `PIPE <n>` を出力します。

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

どちらの段もリストを作りません。各 `coroutine.yield` は項目をひとつ次の段に渡して止まります。`main` が引き、`running` が `squares` から引き、`squares` が入力から引きます。求められる前に計算されるものは何もなく、パイプライン全体が抱えているのは流れている項目ひとつだけです。それが、同じ三つの関数を一億行のファイルにも効かせるものです。

スターターの二段目は `yield` のあるべき場所に `return` があるので、最終的な合計 — 数 — を返すただの関数で、`main` の `for` はそれを呼ぼうとします: `attempt to call a number value`。
'''
hints = [
  "エラーは attempt to call a number value です — running は for が呼べるイテレータの代わりに合計を返しました。",
  "ループを coroutine.wrap で包み、その中で coroutine.yield(value, total)。yield は値をいくつも運べ、for はそれを自分のいくつもの変数として受け取ります。",
  "running(squares(nums)) が組み合わさるのは、包まれたコルーチンが for の呼べる関数だからです。running は自分の入力が別のコルーチンだと知りもせず、気にもしません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.advanced.09.itertools"
title = "棚の上の道具箱"
story = "蓮花宮の委員会の机には誰も開けない道具の棚があり、係は毎晩、同じ券の連続を手で数えています。"
brief = '''
標準入力は整数が一行です。

三行を出力してください。どれもプログラムの先頭の `tools` テーブルで作り、手作りのものは使いません:

1. `SUMS` の後に累計 — `tools.accumulate`
2. `RUNS` の後に、**隣り合う** 等しい値の各連続を `<v>x<k>` として — `tools.groupby`
3. `PAIRS <k>`: **相異なる** 値の順序なしの組がいくつあるか — 並べ替えた相異なる値に対する `tools.combinations`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Lua に `itertools` はありません。モジュールは関数のテーブルで、`tools` は `require` で読み込む代わりにファイルの先頭に書いてあるものです。その三つの関数はもうそこにあり — 誰も開けない棚です — それぞれコルーチンのイテレータを返すので、そのまま `for` に入ります。

`groupby` は **隣り合う** 等しい項目だけをまとめます。数え役ではなく、サンプルは両者が食い違うように選んであります: `1` は四回、二つの連続で現れます。スターターは二行目に数のテーブルを使っていて、まさにその入力で間違えます — しかも数を `pairs` の順、つまり順不同で出力します。

どのイテレータも怠惰です: `accumulate` は一回引くごとに累計をひとつ yield し、`groupby` は値とその連続をリストとして yield するので、`#run` が長さです。`table.concat` が要るときはイテレータをリストに集め、いくつかだけが要るときはループで数えてください。
'''
hints = [
  "tools.accumulate(nums) は各要素の後の累計を yield します。table.concat のためにリストに集めてください。",
  "for value, run in tools.groupby(nums) do — run はその連続のメンバーのリストで、#run がその長さです。",
  "tools.combinations(distinct, 2) は順序なしの組をそれぞれ一回ずつ yield します。数えると n*(n-1)/2 で、それを手で確かめれば正しい n を持っているとわかります。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.advanced.10.functools"
title = "計算したものを覚えておく"
story = "線香の屋台は龍が通るまでに、同じふたつの数から同じ夜の値段を一万一千回、毎回ゼロから計算しています。"
brief = '''
標準入力は `n k bits` です: 整数ふたつと、二進数字の文字列です。

四行を出力してください:

1. `FIB <fib(n)>` — `memoize` で包んだ **再帰の** `fib` から
2. `PRODUCT <k!>` — `1..k` に掛け算で `reduce`、初期値付きで `k = 0` が `1` になるように
3. `BIN <value>` — 基数を受け取るパーサーに基数 `2` を束縛した `partial` で `bits` を解釈したもの
4. `MISSES <m>` — `fib.misses`、再帰が実際に本体を走らせた回数

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` は多くても `400` で、LuaJIT のスタックにとっては何でもありません。キャッシュなしだと `fib(35)` は約三千万回の呼び出しで、`fib(90)` は終わりません。キャッシュがあれば、どの `fib(i)` も一回だけ走り、`MISSES` は `n + 1` です。`memoize` は「包まれて」のクエストのラッパーにクロージャの中のキャッシュを足したものです: 呼び出せるテーブルなので `fib.misses` はフィールドで、`fib = memoize(function ... end)` なので中の再帰もキャッシュを通ります。スターターの `fib` はただの関数で、最後の行が `fib.misses` で死にます。

`fib(90)` と `20!` は 2^53 を越え、Lua の数は double です: それを越えると桁は黙って失われます。スターターは `big` を持っています。基数 10^7 の肢のリストとしての数で、`add`、`mul_small`、`tostring` があります。`fib` は big を足し、積は big に小さな数を掛けます。`partial` は関数の先頭の引数をいくつか固定して新しい関数をくれます。`reduce` は二引数の関数をイテレータ全体に畳み込みます。どちらも巧妙ではありません。どちらも質問されます。
'''
hints = [
  "local fib; fib = memoize(function(n) ... end) — 先に名前を宣言してください。そうすれば本体の中の fib は、最終的にラッパーを持つ上位値になります。スターターが最後の行で死ぬのは、ただの関数に misses フィールドがないからです。",
  "reduce(big.mul_small, range(1, k), big.from(1)) — 三つ目の引数が開始値で、それが空の範囲を 1 にするものです。",
  "partial(parse, 2) は基数を自分で補ってテキストを受け取る関数を返します。unpack(bound, 1, count) が束縛した引数を先頭に置きます。select(\"#\", ...) は、そのひとつが nil でも数えます。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.advanced.11.protocol"
title = "描ければそれでいい"
story = "ビクトリア・パークの提灯の案内板は屋台とカウンターを載せていて、それぞれ別々のふたつのプログラムが作ったものです。そして板が知りたいのは、それぞれが自分を描けるかどうかだけです。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、それぞれ次のどちらかです

* `STALL <NAME> <AISLE>` — `<NAME> / A<AISLE>` として描かれる
* `COUNTER <NUMBER>` — `COUNTER <NUMBER>` として描かれる

プロトコル `Sign` をメソッド名のリスト — `{ "render" }` — として宣言し、`implements(object, protocol)` を、オブジェクトがそのすべての名前に関数を持つときに真になるものとして宣言してください。`Stall` と `Counter` をただのクラスとして — **`Sign` には一切触れずに** — 書き、描いたものを出力する関数 `show(sign)` をひとつ書きます。すべての看板を出力し、次に `implements(x, Sign)` で数えた `SIGNS <n>`、次にメタテーブルを比べる `is_a(x, Stall)` で数えた `STALLS <k>` を出力します。

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

プロトコルは **構造的な** 型です: クラスはメソッドを持つことでそれを満たすのであって、そう宣言することでではありません。Lua にはそれを表す名前がありません。それが Lua の持つ唯一の種類の型だからです。検査は実行時の名前による探索で、**呼び出しがするのと同じ探索** でなければなりません: `object[name]` で、それは `__index` を通って、メソッドが住むクラスへ行きます。スターターは `rawget` で検査していて、それはインスタンス自身の中しか見ないので、どれにも `render` を見つけられず、`SIGNS 0` と報告します。

`show` はその探索で実行時に振り分けます — `sign:render()` はメタテーブルの連鎖が持つ `render` を何であれ見つけます。代わりに選ぶ静的な振り分けはありません。Lua の仕組みはひとつで、これがそれです。
'''
hints = [
  "rawget(object, name) の代わりに object[name]。直すのはそれで全部です: rawget はメタテーブルを飛ばし、メソッドは __index の後ろのクラスにあります。",
  "Stall も Counter もどこにも Sign に触れていません。render() を持つことでそれを満たしています。それが構造的ということです。",
  "implements が確かめるのは、その名前に関数が存在することで、引数の数や何を返すかではありません。Lua でそれらを確かめるものは何もありません。呼び出しがそれを知ることになります。",
]

