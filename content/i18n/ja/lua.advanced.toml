[[quest]]
id    = "lua.advanced.17.none"
title = "20:59 の板"
story = "20:59、浣紗街、太鼓はまだ鳴っていません。値段の板がまだ開いていない屋台のことをノートに尋ね、ノートは無で答え、板はその無の値段を印字します。"
brief = '''
標準入力は個数 `n`、続いて `n` 行の `<STALL> <CENTS>` — 開いている屋台 — 次に個数 `q` と、調べる屋台名 `q` 個です。

各問い合わせについて `<STALL> <cents>` を、その屋台が開いていなければ `<STALL> NONE` を出力してください。そのあと `MISSING <k>` と、`CHEAPEST <STALL>` — 開いている屋台のうち最も安いもの、同額なら名前順 — または何も開いていなければ `CHEAPEST NONE` を出力します。

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

スターターは `CHAN` で落ちます:

```
attempt to index local 'stall' (a nil value)
```

この行が、この道のこの区間のボスです。これはバグを指しません。`nil` が最終的に *辿られた* 場所を指しているだけで、それは `nil` が *作られた* 場所からどれだけ離れていてもおかしくありません — そしてスターターでは、作られた場所がふたつあります。`lookup` は `board[name]` を返し、それは存在しない屋台に対して設計どおり `nil` で、呼び出し側は確かめずにその `.cents` を読んでいます。さらに `cheapest` は出口に `return` がないので何も返さず、呼び出し側はそれを `nil` として受け取って同じことをしています。

誰も書いていないキーは `nil` です。末尾まで落ちた関数は `nil` を返します。どちらもその時点ではエラーではなく、どちらも後でエラーになります。直し方はどちらも同じです: `nil` を受け取りうるコードが、添字で引く前に `== nil` で確かめます。（Lua で偽なのは `nil` と `false` だけなので、ここでは `if not stall` でも正しいでしょう — 値段が `0` の屋台もやはりテーブルです — が、`== nil` は意図をそのまま言います。）

`lookup` と `cheapest` が **意図的に** 屋台 **または nil** を返すようにし、コメントでそう言い、`nil` が届く場所で処理してください。
'''
hints = [
  "トレースバックを読んでください: エラーは print の行ですが、nil はその一行前の lookup から、さらにその前の board[name] から出てきています。",
  "if stall == nil then が確認の仕方です。cents = 0 のテーブルは nil でも false でもありません。Lua で偽なのは nil と false だけです。",
  "cheapest は板を歩いてから return なしで終わります。Lua はそれを警告しません。呼び出し側は nil を受け取り、後で気づきます。best を返してください。空の板なら best は一度も設定されないので nil が返ります。",
  "pairs は板を順不同に歩くので、比較が自分で同点を決着させなければなりません: セントの低いほう、次に名前の小さいほう。どの屋台が先に来たかを信じてはいけません。",
]

