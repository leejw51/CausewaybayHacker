[[quest]]
id    = "lua.advanced.15.decorators"
title = "包まれて"
story = "龍の委員会は今夜、値段の関数が何回呼ばれたかを知りたがっていて、関数のほうは見張られていることを知りたくありません。"
brief = '''
標準入力は個数 `n`、続いて kg 単位の重さ `n` 個です。

`price(kg)` は `500 + 100 * kg` です。`price` が知らないまま呼び出しがすべて数えられるように、それを `counted` で包んでください。重さごとに値段を一つ出力し、次に `CALLS <n>`、次に `NAME <price.name>` を出力します — これは `price` と言わなければなりません。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

Lua にデコレータはありません。いちばん近いのは、関数を受け取って代わりに呼び出せる何かを返す関数で、このノードはそれを教えます。`price = counted(price, "price")` は名前を `counted` が返したものに束縛し直します — `def` の上の `@counted` がすることとまったく同じです。

数はどこに住むのでしょう。Lua の関数はフィールドを持てないので、ラッパーは **テーブル** — `{ calls = 0 }` — で、数を増やして元の関数を呼ぶ `__call` メタメソッドで呼び出せるようにします。すると `price(kg)` は `__call` を通り、`price.calls` はただのフィールドの読み出しです。

Lua の関数には自分の名前もありません。ラッパーは自分が代役を務める名前を教えられなければなりません。スターターは決して教えず、最後の行は `NAME wrapper` と言います。それが手作業の `functools.wraps` です: 包まれたものの素性を、それを置き換えたものに写すこと。
'''
hints = [
  "price = counted(price, \"price\") — 二つ目の引数がラッパーの持つ名前です。直すのはそれで全部です。",
  "関数の後の price = counted(price) は、その上のデコレータと同じです: 名前は counted が返したものに束縛し直され、元の関数はクロージャの中の上位値 func としてだけ生き残ります。",
  "__call の中の ... はどんな引数でも中身を知らずに転送します。それがラッパーをどんな関数にも使い回せるものにしています。",
]

