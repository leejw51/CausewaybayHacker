標準入力は個数 `n`、続いて `<NAME> <CENTS>` の `n` 行です。

各行を **凍結した** レコード `Price.new(name, cents)` にしてください。それから各値段について、その `cents` を上書きしようとし、その試みが例外を投げたら `FROZEN <NAME>` を出力します。次に、宣言したスロット `count` をひとつ持つ `Tally` クラス: `tally.count` を設定し、それから綴りを間違えた `tally.cuont` を設定しようとし、*それ* が例外を投げたら `SLOTS YES` を出力します。最後に `IN_SET <k>`、**値** をキーにした値段の集合の大きさ、そして `TOTAL <sum>` です。

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

Lua のテーブルは常に書き込めます。凍結するのはメタテーブルの技です。フィールドは呼び出し側が決して見ないテーブルに置き、**空のプロキシ** を返します。その `__index` はフィールドで — どの読み出しも素通りします — その `__newindex` は例外を投げます: プロキシが持っていないキーへの書き込みはすべてそこへ行き、プロキシは何も持っていません。代入の周りの `pcall` が、死なずに試みるやり方です。

集合はもう半分です。テーブルは **同一性で** キーになります: 同じフィールドを持つふたつのレコードはふたつのキーで、スターターの `IN_SET` は `3` と言います。凍結したレコードが自分の値を代表できるのは、キーがフィールドから作られるとき — `price:key()` — だけで、それが安全なのはまさに、フィールドがその下で変われないからです。

`Tally` のスロットはまた `__newindex` で、宣言した名前だけを許します: `count` には `rawset`、それ以外にはエラー。属性名の打ち間違いは、誰も読まない黙った新しいフィールドになる代わりに、代入の時点でエラーになります。
'''
hints = [
  "Price.new は、メタテーブルに __index = フィールドと、エラーを出す __newindex を持つ空のテーブルを返します。読み出しは素通りし、書き込みはメタメソッド以外に着地する場所がありません。",
  "集合は price:key()、フィールドから作った文字列をキーにしてください。テーブルそのものは自分自身に対してだけのキーです。",
  "TOTAL は元のセントの合計で、それが成り立つのは代入が失敗したからにすぎません。スターターではその時点でどの値段も 0 で、TOTAL は 0 です — 変更は許されただけでなく、実際に通ったのです。",
]

