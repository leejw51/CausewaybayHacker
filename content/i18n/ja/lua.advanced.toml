[[quest]]
id    = "lua.advanced.02.lock"
title = "ひとつの引き出し、八つの手"
story = "路地のどの屋台も委員会の机のひとつの現金引き出しに払い込みますが、巡行が終わると引き出しには一軒分のお金しかなく、どの屋台も払ったと言い張ります。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとにコルーチンをひとつ作り、それを **ひとつの共有合計** に足して共有のヒット数を増やし、すべてを総当たりで回してください — すべての使い走りが死ぬまで、どの使い走りにも順番が回ります。そのあと `TOTAL <sum>` と `HITS <n>` を出力します。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

スターターはサンプルで決定的に `TOTAL 4` を出力します。どの使い走りも引き出しを読み、**yield** し、それから読んだものに自分の値を足して書き戻します。最初のひとりが書くころには四人とも `0` を読んでいて、最後の書き込みが勝ちます: 一軒分のお金とヒット四つ。それが失われた更新で、しかもスレッドひとつの上で、言語に忘れるべきロックもないまま起きました。

Lua に `Lock` がないのは、横取りがないからです。コルーチンは `coroutine.yield()` と言うまで走り、そのあいだにほかのものは何も走りません。クリティカルセクションとは yield を含まないコードのひと続きのことで、バグは読みと書きのあいだの yield です。yield を真ん中から出してください — まず順番を待ち、それから読み、足し、書くのをひと続きで — そうすれば引き出しは正しくなります。更新が本当に途中で yield しなければならないとき（たとえばソケットを待つとき）、ロックはフラグです: `while busy do coroutine.yield() end`、それを立て、仕事をし、下ろす。それが書き下したミューテックスです。

スケジューラはプログラムの中に書いてあります: 使い走りを回って `dead` でないものを一人ずつ resume するループで、一巡して生きているものが一人もいなくなるまで続きます。
'''
hints = [
  "スターターを実行してください: TOTAL 4、HITS 4。四人が 0 を読み、yield し、それぞれ 0 に自分の値を足して書きます。最後の書き込みが合計です。",
