# LUA LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the prose
# of `content/lua/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "lua.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.advanced.01.conversions"
title = "三つの姿、ひとつの名前"
story = "浣紗街の線香の屋台は、値段を文字として、数として、ドルとして、一冊のノートに、ひとつの名前で書いています。"
brief = '''
一行を読みます: セント単位の金額で、数字だけです。

三行を出力してください:

1. 前後の空白を除いた文字列の文字数
2. 金額を数として
3. 金額をドルとして、小数点以下ちょうど二桁で

```
input:  1234
output: 4
        1234
        12.34
```

金額は非負です。**ひとつの名前** を三回束縛し直して書いてください — 文字列、次に数、そしてまた文字列です。Lua のローカル変数は何でも保持でき、代入で気を変えます。その代償として、いま `cents` が何なのかは、上の行を読む以外に知る手立てがありません。

ドルの計算に割り算を経由しないでください。`1234 / 100` は今日は `12.34` ですが、`0.1 + 0.2` は出力すれば `0.3` で、比べればそうではありません。`math.floor` と `%` ならふたつの半分が正確に得られ、`string.format("%02d", ...)` が後半をゼロ埋めします。`tonumber` が変換で、`#cents` はまだ文字列のうちの文字列の長さです。
'''
hints = [
  "cents がまだ文字列のうちに #cents を取ったものが一行目です。",
  "cents = tonumber(cents) はその場での変換ではありません。古い名前に新しい値を束縛しているだけです。その後、文字列は消えています。",
  "string.format の中の %02d は、幅二、ゼロ埋め、十進です。5 セントは 0.05 であって 0.5 ではありません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.advanced.02.control-flow"
title = "どの路地"
story = "龍の道順のために路地の番号が道にチョークで書かれ、蓮花宮の係の板は各路地に何があるかを示すはずです。それが毎回番号を示し、しかもゼロから始めています。"
brief = '''
整数 `n` をひとつ読みます。`1` から `n` までの各 `i` について、一行を出力してください:

* `i` が 3 でも 5 でも割り切れるなら `FISHVEG`
* `i` が 3 で割り切れるなら `FISH`
* `i` が 5 で割り切れるなら `VEG`
* それ以外は `i` そのもの

そのあと、`0` を読むまで一行に一つずつ整数を読み続け、`SKIPPED <k>` を出力してください。`k` はそこまでに読んだ 0 でない行の数です。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

ループがふたつ、種類もふたつ。一つ目は始まる前に何回回るかを知っています: `for i = 1, n do`。二つ目は知りません: `break` 付きの `while true do` です。回数は読んだものが決めるからです。Lua の数値 `for` は両端を **含みます** — `for i = 1, n` は `n` 回回ります — そしてスターターは `0` から始めていて、それがこのランドの名の由来の一つずれです。
'''
hints = [
  "両方の場合を先に確かめてください。さもないと決して発火しません。3 でも 5 でも割り切れるとは、15 で割り切れるということです。",
  "for i = 0, n - 1 は一つ早く始まり、一つ早く止まります。スターターにはそのバグがあり、出力の一行目は FISHVEG です。0 は何でも割り切れるからです。",
  "while true do ... break が、出口が途中にあるループの Lua での書き方です。下で判定する repeat ... until もあります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.advanced.03.lists"
title = "龍の真ん中"
story = "六十七メートルの藁が担ぎ手の列の肩に乗り、頭にいる係には最初の担ぎ手と最後の担ぎ手が見えて、あいだは何も見えません。"
brief = '''
標準入力は一行目に個数 `n`、二行目にスペース区切りの `n` 個の整数です。`n` は少なくとも `1` なので、出力すべき最初の値と最後の値は必ずあります。

三行を出力してください: 最初の値、最後の値、そしてそのふたつに厳密に挟まれたすべての合計です。値が三つ未満なら、その合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Lua のリストはキー `1..n` を持つテーブルで、`#nums` は `n` です。最初の要素は `nums[1]`、最後は `nums[#nums]` です。`nums[-1]` はありません — 負のキーは何も保存されていないただのキーで、読めば文句も言わずに `nil` を返します — そしてスライスもありません: 真ん中は `2` から `#nums - 1` までのループで、真ん中がなければ零回回るので、ほかの言語で要るガードがここではただで手に入ります。

スターターは `nums[0]` を出力します。それは Lua ではエラーではありません。それは `nil` で、`print` は `nil` という語を書き、プログラムは 0 で終了します。このランドの名はこれに由来します。
'''
hints = [
  "nums[#nums] が最後の要素で、nums[#nums - 1] がその一つ前です。負の数は何も効きません。",
  "for i = 2, #nums - 1 が最初と最後以外のすべてで、値が一つなら for i = 2, 0 となり、ひとりでに零回回ります。",
  "io.read(\"*a\") はすべてを一度に読み、gmatch(\"%S+\") がトークンを歩くので、改行は問題でなくなります。最初のトークンは個数です。飛ばしてください。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.advanced.04.strings"
title = "バイトは文字ではない"
story = "ビクトリア・パークの屋台の提灯の注文票は、銅鑼灣 を三バイトで切り、一文字と疑問符を印字しています。"
brief = '''
一行を読みます。三行を出力してください:

1. UTF-8 で符号化したときの **バイト** 数
2. **文字** 数
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

行には ASCII 以外の文字が含まれることがあり、そのときは最初のふたつの数は一致しません。Lua の文字列は **バイト** の並びで、それ以外は何も知りません: `#s` はバイト数で、`s:reverse()` はバイトを逆にするので、多バイト文字はどれも半分に切れます。文字とは、あなたが定義するものです。UTF-8 では、一文字は先頭バイト一つとそれに続く任意個の継続バイトです — パターンにすると `[^\128-\191][\128-\191]*` — なので、先頭バイトを数えれば文字数になり、`gmatch` で文字を歩いて積み上げれば逆順になります。

スターターはバイト数を二回出力し、行を届いたままに出力します。三行目を直すのに `line:reverse()` に手を伸ばさないでください: `causeway` では正しく、誰もが実際に打つサンプルでは、どの符号化でも文字列ではないバイトを出力します。
'''
hints = [
  "#line はバイトです。文字は数えなければなりません: gsub は二つ目の戻り値として一致の数を返し、一文字ごとに一致させればそれが文字数です。",
  "継続バイトは 128..191（10xxxxxx）です。一文字は、そうでないバイト一つと、それに続くそうであるバイト零個以上です: \"[^\\128-\\191][\\128-\\191]*\"。",
  "table.insert(reversed, 1, ch) は先頭に積むので、最後の文字が最初に来ます。table.concat は区切りなしでつなぎます。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.advanced.05.dicts"
title = "路地の呼び声"
story = "九時の浣紗街: どの屋台も何かを叫んでいて、書館街の端の板は順位を欲しがっています。"
brief = '''
標準入力をすべて読み、空白で分割します。

相異なる語をそれぞれ一回ずつ `<word> <count>` として出力してください。順は数の降順、同数なら語の昇順です。

```
input:  tram tram bus
output: tram 2
        bus 1
```

語をキーにしたテーブルが数え役で、`counts[word] + 1` は初回にエラーになります — `attempt to perform arithmetic on a nil value` — 誰も書いていないキーは `nil` だからです。`(counts[word] or 0) + 1` がゼロを補います。

`pairs` はキーを **まったく順不同に** 歩き、その順は実行ごとに変わります。キーをリストに写し、数の降順、次に語の昇順と言う比較関数で `table.sort` し、そのリストから出力してください。比較関数は、一つ目の引数が先に来るときに `true` を返します。
'''
hints = [
  "スターターは最初の語で死にます: counts[word] + 1 は書く前に読み、読むものが何もありません。(counts[word] or 0) がゼロを補います。",
  "pairs でキーをリストに集め、そのリストを table.sort します。テーブルそのものには直すべき順がありません。",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — 数の降順、次に語の昇順、そして等しい引数には決して true を返さない。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.advanced.06.sets"
title = "両方の屋台にあるもの"
story = "提灯の屋台がふたつ、安庶庇街の両側にひとつずつ。そして龍の道順を二度横切らずに、どちらでも手に入るものを知りたい客がいます。"
brief = '''
標準入力は二行で、それぞれが屋台の品をスペースで区切ったものです。ひとつの屋台が同じものを二回載せることがありますが、一回と数えます。

三行を出力してください:

1. `BOTH` の後に両方のリストにあるものすべてを、並べ替えてスペース区切りで — 何もなければ `BOTH -`
2. `ONLY_A <k>`: 一つ目のリストにあって二つ目にないものの数
3. `ALL <k>`: どちらかのリストにある相異なるものの数

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua には集合の型がありません。集合とは、**キー** がメンバーで値が `true` のテーブルです: `tofu` を二回書けば同じキーを二回書くことになり、重複は入る途中で消えます。所属は `a[x]` で、それは `true` か `nil` です。積、差、和は、ひとつの集合のキーを歩いてもう一方に尋ねる三つのループです — 関数として書けば、三行は三つの呼び出しになります。

`#` は集合のキーを数えません。数えるのはリスト部分で、それは空です。`pairs` のループで数え、出力の前にメンバーをリストに並べ替えてください。`pairs` には順がないからです。
'''
hints = [
  "すべてのトークンについて set[word] = true で集合ができます。重複した tofu は同じキーを二回書いたものです。",
  "積は pairs(a) のループで、b[key] が true のキーを残します。差はそれが nil のキーを残します。和は両方の集合のキーを一つのテーブルに書きます。",
  "文字列のキーしかないテーブルの #set は 0 です。pairs でキーをリストに写して table.sort すれば、#list が数で、table.concat(list, \" \") がその行です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.advanced.07.functions"
title = "一斤あたり"
story = "浣紗街の値札は、特に書いていなければどれも一斤あたりで、線香の屋台の値札プリンターは毎回それを言われないと動きません。"
brief = '''
標準入力は個数 `n`、続いて `<NAME> <CENTS>` または `<NAME> <CENTS> <UNIT>` の `n` 行です。

`<NAME> $<dollars>/<unit>` を小数二桁で返す `tag(name, cents, unit)` を書いてください。`unit` がなければ `catty` を意味します。一行に値札一枚を出力します。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua にはデフォルト引数がありません。呼び出し側が省いた引数は `nil` で、スターターの `tag` はそれを連結しています: `attempt to concatenate local 'unit' (a nil value)`。定石は関数の最初の行 — `unit = unit or "catty"` — です。`or` は左側が `nil` か `false` でない限りそれを返すからです。それが Lua のデフォルト引数の仕組みのすべてで、`def` の行と同じくらい関数の契約の一部です。

行をトークンのリストに分割し、セントを変換してから `tag(unpack(parts))` で部品を渡してください。`unpack` はリストを引数に広げるので、二要素のリストも三要素のリストも、ひとつのシグネチャに収まります。
'''
hints = [
  "tag の最初の行に unit = unit or \"catty\"。直すのはそれで全部です。",
  "`x or default` が Lua のデフォルト引数です。ひとつの値でだけ失敗します: 呼び出し側がわざと false を渡しても、それも置き換えてしまいます。それが続きの質問です。",
  "tag(unpack(parts)) がリストを広げます。部品が二つなら三番目の引数は nil で、or がそれを埋めます。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.advanced.08.exceptions"
title = "数ではない行"
story = "文旦の屋台の秤が重さの列を印字し、その真ん中に誰かの電話番号が混ざっています。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数のはずです。

各行について、値を二倍したもの、あるいは解釈できなければ `BAD <line>` を出力してください。最後に `SUM <total>` を出力します。合計は出力した値の和です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")` は黙って `nil` です。`tonumber("1.5")` は `1.5` で、整数ではありません。そしてスターターの `double` はどちらにも `error` で例外を投げます。`error` は Lua の関数が拒むやり方です — `Result` はなく、関数そのものからの `(value, ok)` もありません — そして数を期待していた呼び出し側は、それをどうするかを `pcall` で言わなければなりません: `pcall` は代わりに関数を呼び、エラーを上へ登らせる代わりに `true, result` か `false, message` を返します。

`pcall` は失敗しうる一つの呼び出しの周りだけに置いてください。ループの本体全体を包むと、あなた自身の `print` の打ち間違いまで飲み込んでしまいます。プログラムはそうやって黙って失敗することを覚えます。
'''
hints = [
  "スターターは xx で main.lua:3: not an integer: xx と言って死にます。そのメッセージこそ、クラッシュする代わりに pcall が二つ目の戻り値として渡してくれるものです。",
  "local ok, value = pcall(double, line) — pcall は関数と引数を別々に受け取ります。pcall(double(line)) は先に double を呼んで、pcall が走る前にクラッシュします。",
  "ok が false なら value はメッセージです。BAD を出力して先へ進んでください。悪い行は合計に何も足しません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.advanced.09.comprehensions"
title = "浣紗街を一往復"
story = "アレックスは for ループ三つでできると言います。路地は龍一匹の幅で、線香には火がついています。通れるのは一回だけです。"
brief = '''
標準入力は、スペース区切りの整数が一行です。

三行を出力してください:

1. 偶数の値の合計（なければ `0`）
2. `10` より大きいすべての値を二倍にして、順に、スペース一つで区切ったもの — なければ `-`
3. 相異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua に内包表記はありません。いちばん近いのはテーブルからテーブルを作る関数で、このノードはそれを教えます。`filter(list, keep)` と `map(list, f)` を一度だけ書けば — どちらも新しいテーブルを埋めるループです — 三行は呼び出しになります: `sum(filter(nums, even))`、`map(filter(nums, big), double)`、そして値から作った集合を数えたもの。述語と変換は引数として渡される関数で、それが内包表記の `if` と式に当たります。

`table.concat` は文字列だけでなく数も受け取るので、二行目に変換は要りません。ただし、リストが空のときには `-` が要ります。`table.concat({}, " ")` は空文字列だからです。
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end) が偶数を残し、その sum が一行目です。",
  "map(filter(nums, big), double) — filter が先、変換が後。内包表記の後ろの if と前の式と同じです。",
  "集合は値をキーにしたテーブルです。#set はキーを数えず、pairs のループが数えます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.advanced.10.dict-comprehensions"
title = "同じ一往復、キー付きで"
story = "線香の屋台の値段は、書かれた順に赤い紙の切れ端に載っています。おばさんはそれを一枚の板にしてほしく、しかも二回ほしがっています。"
brief = '''
標準入力は個数 `n`、続いて `<ITEM> <PRICE>` の `n` 行です。`PRICE` はセント単位の整数です。品は多くても一回しか現れず、`n` は少なくとも `1` です — 名指しすべき最安の品は必ずあります。

三行を出力してください:

1. 値段が **100 より厳密に大きい** すべての品を `ITEM=PRICE` として、品名で並べ替え、スペース一つで区切ったもの — なければ `-`
2. すべての品を、値段を **整数除算で半分** にして、同じ形式で、品名で並べ替えたもの
3. `CHEAPEST <item>` — いちばん安い値段、同額なら品名の昇順

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

前のノードのキー付き版です。Lua に辞書内包表記はありません。いちばん近いのは `filter_pairs(t, keep)` と `map_values(t, f)` で、どちらも同じキーで新しいテーブルを埋める `pairs` のループです。一行目は値が 100 を超える組を残し、二行目はすべての値を `math.floor(v / 2)` で変換してすべてのキーを残します。どちらも内包表記ではなく、どちらも一度だけ書く関数ひとつずつです。

`pairs` には順がないので、`sorted_keys(t)` — キーをリストにして並べ替えたもの — が三つ目の補助関数で、出力する行はすべてそれを通ります。最安については、並べ替えたキーを歩いて、厳密に低い値段のときだけ最初のものを保ちます: キーはアルファベット順に来るので、等しい値段の最初のものが同点の決着です。
'''
hints = [
  "filter_pairs は keep(key, value) が true のときにキーを残し、map_values はすべてのキーに f(value) を書きます。どちらも新しいテーブルを埋めます — 歩いているテーブルに書き込んではいけません。",
  "sorted_keys(t) が、キー付きのテーブルを決まった順で出力する唯一の方法です。ここのどの行もそれを通ります。最安も含めて。",
  "並べ替えたキーを歩き、厳密に低い値段のときだけ最良を置き換えてください: 等しい値段の最初のものはアルファベット順で最初なので、同点はひとりでに決着します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.advanced.11.sorting"
title = "順位表"
story = "龍の委員会は毎晩いちばん安い線香を貼り出し、蓮花宮の係はリストふたつと鉛筆で屋台の順位を手作業でつけています。"
brief = '''
標準入力は二行です: 一行目に屋台名、二行目に同じ順でセント単位の値段。屋台は少なくとも一つあります。

屋台を安い順に `<rank>. <NAME> <cents>` として出力してください。順位は `1` から始まり、同額なら名前の昇順です。そのあと `CHEAPEST <NAME>` を出力します。

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
```

ふたつのリストをひとつのレコードのリスト — `{ name = ..., price = ... }` — に綴じ合わせ、値段で並べて同点を名前で決める比較関数で `table.sort` し、`ipairs` が結果に番号を振ります。比較関数はクロージャです。等しい二つのレコードには `false` を返さなければならず、さもないと `table.sort` は `invalid order function for sorting` を投げます。裸の添字ループでソートしない版は、三つ目の屋台で同点の決着を間違える版です。
'''
hints = [
  "屋台一つにレコード一つ、ふたつのリストを同じ添字で歩いて作ります。値段は tonumber してください。さもないと文字列として 1200 が 900 より前に来ます。",
  "function(a, b) if a.price ~= b.price then return a.price < b.price end return a.name < b.name end — 値段、次に名前、そして等しいレコードには false。",
  "for rank, stall in ipairs(stalls) は 1 から始まる順位をただでくれます。",
]

