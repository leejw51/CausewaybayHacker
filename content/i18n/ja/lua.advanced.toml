[[quest]]
id    = "lua.advanced.14.iterator"
title = "止まるまで、次へ"
story = "ビクトリア・パークの提灯の門の発券機は、ある始まりから決まった刻みで番号を配り、そのリストを持っていません。そして列の板はそれを、どんなリストとも同じようにループしたがっています。"
brief = '''
標準入力は三つの整数です: `start`、`step`、`count`。

**イテレータのプロトコルを手で** 実装するクラス `Tickets` を書いてください: `next` は次の値を返し、`count` 個の値を配り終えたら `nil` を返します。`iter` は汎用 `for` が必要とするものを返します。各値を一行ずつ出力し、次に二つ目の `Tickets` を `sum` に渡して計算した `SUM <total>` を出力します。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

これは `coroutine.wrap` が代わりに書いてくれるものです。汎用 `for` は三つのもの — 関数 `f`、状態 `s`、制御値 — を受け取り、毎回の前に `f(s, control)` を呼び、最初の結果が `nil` なら止まります。`Tickets.next` はすでにその形をしています: その `self` が状態で、二つ目の引数は無視してよい制御値です。だから `iter` は一行です: `return Tickets.next, self`。`sum`、`collect`、`for` はどれも同じ踊りを踊り、どれも状態が何かを気にしません。

スターターには `next` があって `iter` がなく、`for` は `attempt to call method 'iter' (a nil value)` と言います。`next` からの `nil` が、ここでの `StopIteration` です。それが、券が決して `nil` になれない理由で、`0` が立派な券である理由です — `0` は `nil` ではありません。

状態として `self` を返す `iter` は **イテレータ** の印です: 一度歩けば使い切られます。**コンテナ** は `iter` から毎回新しい状態を返し、何度でも歩けます。この道の前のほうの `Bag` がそれでした。どちらを書いているのか言ってください。違いは、誰かが二度目にループしたときに現れます。
'''
hints = [
  "function Tickets:iter() return Tickets.next, self end。値ふたつで、for が動き始めます。",
  "nil は投げられるのではなく返されます。for ループはそこで止まり、あなたはそれを目にしません。進める前に返そうとしている値を保存してください。さもないと一歩ずれます。",
  "for value in obj:iter() は for value in Tickets.next, obj です — メソッド呼び出しは組を作るだけです。self を閉じ込めたクロージャを返しても動きます。組は、余分な関数なしのプロトコルです。",
]

