[[quest]]
id    = "lua.advanced.15.collections"
title = "正しい入れ物"
story = "委員会の机はその夜の券を一本の長いリストに持ち、それについてのどの質問にも、上から読み直して答えています。"
brief = '''
標準入力は三行です: 語が一行、すでに **昇順に並んだ** 整数が一行、整数 `x` がひとつ。

四行を出力してください:

1. `TOP <word> <count>` — 最も頻繁な語、同数なら語の昇順 — 数のテーブルから
2. `BISECT <l> <r>` — 並んだ整数の中での `x` の `bisect_left` と `bisect_right`: `x` より小さい値がいくつあるか、そして `x` より大きくない値がいくつあるか
3. `SMALLEST3` の後に最小の整数三つ — **ヒープ** から取り出したもの — 少なければそれより少なく
4. `GROUPS` の後に、語の各頭文字について `<letter>:<k>` を、文字の昇順で — 頭文字をキーにし、`__index` が **初めてのアクセスでリストを作る** テーブル

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

Lua が備えている入れ物はひとつで、ほかはどれもテーブルに規律を足したものです。スターターの `TOP` は **挿入順** で最初に最大の数に達した語、つまり `tofu` を保ち、問題文は `egg` と言っています: 語を並べ替えて、意図を言ってください。その `BISECT` は `x` のインデックスを走査して探し、`x` が無いと転びます。並んだリストに対する二分探索は決して例外を投げず、`left` と `right` の差は `x` がいくつあるかです。その `SMALLEST3` は前から三つの値を読むためにリスト全体を並べ替えていて、それこそ `k` が小さく `n` がそうでないときにヒープが避けるために存在するものです。そしてその `GROUPS` は数のテーブルを `pairs` の順、つまりまったくの順不同で歩きます。

`setmetatable({}, { __index = function(t, k) local v = {}; rawset(t, k, v); return v end })` が Lua の `defaultdict(list)` です: 無いキーの最初の読み出しがリストを作って保存するので、`groups[letter][#... + 1]` は決して検査を必要としません。
'''
hints = [
  "words の代わりに sorted_keys(counts) を歩き、数が厳密に大きいときだけ一位を置き換えてください。そうすれば同数はアルファベット順で最初のもの、つまり egg になります。",
  "bisect_left と bisect_right は決して例外を投げません。スターターの index_of は x が無いと nil を返し、隠しケースのひとつがまさにそれです。どちらも < を <= に替えただけの同じループです。",
  "ヒープは、i の親が floor(i / 2) のリストです: push は末尾に追加して浮かび上がらせ、pop は最後の項目を一番上に移して沈めます。三回の pop が、n が何であれ最小の三つです。",
  "__index メタメソッドは無いキーに対してだけ走ります。その中の rawset が新しいリストを保存するので、次の読み出しはただのヒットです。出力の前にキーを並べ替えてください — メタテーブルを持つテーブルもやはり順不同です。",
]

