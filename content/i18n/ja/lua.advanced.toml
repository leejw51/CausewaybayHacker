[[quest]]
id    = "lua.advanced.01.threads"
title = "十二の使い走り、ひとつの路地"
story = "21:00、浣紗街。十二人の線香の使い走りが同時に自分の節を受け持ち、数を集める係が、誰かが書き込む前に板を読んでいます。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとに **コルーチン** をひとつ作り、その二乗を計算して `results[i]` — 自分専用のスロット — に格納してください。こうすれば同じ場所に書く使い走りはふたりといません。すべてを resume し、結果を **インデックス順** に一行ずつ出力し、次に `THREADS <n>` を出力します。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Lua にスレッドはなく、あるのはコルーチンで、そのひとつに対する `type(co)` は文字列 `thread` です。それが最後の行の数です。`coroutine.create(f)` は `f` を実行しません。`coroutine.resume(co, ...)` がそれを実行し、**最初の** resume では引数が `f` の引数になり、yield するか戻るまで走ります — `square` は決して yield しないので、resume 一回で仕事は全部です。結果は、後で `main` が読める場所に書かなければなりません。使い走りごとのスロットを持つテーブルが、その最も単純な形です。

スターターの使い走りは始まった瞬間にすべて落ちますが、プログラムはそれでも終了して出力します。引数なしの `coroutine.resume(co)` は `square(nil, nil)` を呼び、`nil` の算術はコルーチンの中で起き、`resume` はそれを戻り値 — `false` とメッセージ — として報告し、スターターはそれを捨てます。`results` は空のままで、どの行も `nil` と言います。死んだコルーチンが道連れにするのは自分だけです — `resume` の二つ目の戻り値を読んでください。さもないと、永遠に気づきません。
'''
hints = [
  "coroutine.resume(co, i, nums[i]) — 最初の resume の引数が square の受け取るもので、スターターは何も渡していません。",
  "resume は ok, ... を返します — コルーチンが死んだときは false とエラーメッセージです。確かめてください。スターターの使い走りはみな value が nil のまま `value * value` で、黙って死にました。",
  "results は square の上位値です: 入れ子の関数は main が見ているのと同じテーブルを見ているので、後で書き込みが見えます。",
]

