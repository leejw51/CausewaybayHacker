`Bag` はリスト型を包んでおらず、その必要もありません。`bag:len()` は呼び出しの瞬間にメタテーブルを通してキー `len` を探すことで、そこにあるものが何であれ呼ばれます。Lua はものが何 *である* かを決して尋ねません。必要なときに、キーがそこにあるかを尋ねるだけです。スターターには三つのメソッドのどれもなく、最初のエラーは `attempt to call method 'len' (a nil value)` です。

