[[quest]]
id    = "lua.advanced.14.generators"
title = "自分の for ループ"
story = "線香の屋台のティッカーは、最初の値段から決まった刻みですべての値段を並べますが、そのリストはどこにも持っていません。"
brief = '''
標準入力は三つの整数です: `start`、`step`、`count`。

`ticker(start, step, count)` を **コルーチン** として書いてください — `start` から始めて `step` ずつ進む `count` 個の値を yield する関数を `coroutine.wrap` で包んだものです。各値を一行ずつ出力し、次に二つ目の ticker を `sum` に渡して計算した `SUM <total>` を出力します。

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

最後の行は、`ticker` が返すものを `main` が何と呼ぶか — テーブルなら `list`、`coroutine.wrap` が返す関数なら `generator` — で、スターターの `main` がそのまま出力します。いまは `list` と言っていて、その一行前で `for value in ticker(...)` がすでに `attempt to call a table value` で失敗しています: 汎用 `for` は最初のオペランドを呼び、リストは呼び出せません。

`coroutine.wrap(f)` は `f` を実行しません。関数を返し、その関数を呼ぶたびに `f` を次の `coroutine.yield(value)` まで走らせ、その値を返します。`f` が戻ると関数は何も返さず、`for` は `nil` を見て止まります。だから `for` がそれに効き、`sum` がそれに効き、百万個の値のリストが一度も存在することなく百万個の値を作れるのです。

スターターはリストを作って返しています。追加を `yield` に変え、リストを消してください。
'''
hints = [
  "return coroutine.wrap(function() ... end) — 本体が yield し、wrap がそれを for が呼べる関数に変えます。",
  "coroutine.yield(value)、そして進める。本体は yield で止まり、次の呼び出しでその後から再開します。",
  "包まれたコルーチンは一度しか消費できず、死んだ後に呼ぶとエラーです。だから main は、ループが吸い尽くしたものを使い回さずに、sum のために新しい ticker を作ります。",
]

