[[quest]]
id    = "lua.advanced.16.timeouts"
title = "待つのをやめる"
story = "係の板は路地のどの屋台にも待ち時間を問い合わせ、カード読取機が止まっている屋台は決して答えないので、板は決して描き直されません。"
brief = '''
標準入力は個数 `n`、続いて `<STALL> <SECONDS>` の `n` 行で、`SECONDS` はすぐに答える屋台なら `0`、時間内に答えない屋台なら `1` です。

ここでの時間は **ティック** です: 十分の一秒が `coroutine.yield()` 一回で、`fetch(stall, seconds)` は一秒あたり十回 yield してから `<STALL> OK` を返します。各屋台について、その `fetch` をコルーチンとして `wait_for(task, 2)` — 二ティック、0.2 秒の期限 — の下で走らせ、`<STALL> OK` または `<STALL> TIMEOUT` を入力順に出力してください。それから永遠にループする `watch()` コルーチンを開始し、一回順番を与え、**`"cancel"` 付きで resume して** キャンセルし、そのハンドラから `CANCELLED` を、どの経路でも走るコードから `CLEANUP` を出力させます。最後に `TIMEOUTS <k>` を出力します。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` はタスクを多くても `ticks` 回 resume し、終わったかどうかを報告します。最後の順番の後もまだ `suspended` なら、それがタイムアウトで、タスクはただ二度と resume されません。スターターは代わりに `fetch` を最後まで resume するので、`WONG` は十ティックすべてを使ってから `OK` と言います。

コルーチンのキャンセルとは、それが停車している yield に値を届けることです。`watch` は `pcall` の中で yield し、yield が `"cancel"` を返すと例外を投げます。`pcall` がそれを捕まえ — `CANCELLED` を出力するハンドラ — それから後始末の行が走り、それからエラーがもう一度投げられるので、キャンセルを届けた resume は `false, "cancelled"` を受け取ります。スターターは見張り役を作り、一回順番を与え、そして捨てます: 誰も二度と resume しないコルーチンは永遠に何も走らせず、どちらの行も出力されません。処理した後は投げ直してください — キャンセルを飲み込むことが、タスクがキャンセルできなくなる道です。
'''
hints = [
  "wait_for(task, 2): 多くても二回 resume し、タスクが dead になれば true と結果を、そうでなければ false を返します。タイムアウトしたタスクは、ただ二度と resume されません。",
  "coroutine.resume(watcher, \"cancel\") — その文字列が見張り役の yield の返すもので、見張り役自身のコードがそれをエラーに変えます。変数に nil を入れても何もキャンセルされません。コルーチンを忘れるだけです。",
  "create の後の最初の resume が、見張り役に始まって yield で停車する順番を与えます。だからキャンセルには、まだ始まっていない関数ではなく、着地する yield があります。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.advanced.17.coroutine"
title = "コルーチン"
story = "浣紗街、全長に伸びた龍、節ごとに線香の使い走りがひとり。そのひとりが決して場を譲らず、太鼓が鳴り続けるなか龍全体がひとつの節で止まり、合計はまったくの無として返ってきます。"
brief = '''
標準入力はふたつの整数 `k` と `n` です。

`1..n` を `k` 個の連続した塊に分け — 塊 `i` は `floor(n*i/k) + 1` から `floor(n*(i+1)/k)` まで、両端を含む — 各塊をそれ専用の **コルーチン** に渡してください。コルーチンはその範囲の二乗の和を求めます: ライブラリ呼び出しなしのただのループで、ほかのものに順番が回るよう 100 000 個ごとに yield します。どの使い走りも、yield を含まないひと続きで結果を **ひとつの共有合計** に足し、自分のスロットにも記録します。すべてが死ぬまで総当たりで回してください。各塊についてインデックス順に `CHUNK <i> <sum>` を出力し、次に `TOTAL <sum>`、次に `THREADS <k>` を出力します — コルーチンの型名は `thread` で、それが数です。

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

スターターは、タイミングとは関係のない理由で失敗します。`local part = coroutine.resume(co, lo, hi)` は `resume` の **最初の** 結果、つまり `true` を保ち、その後に続いた答えは床に落とされます。最初の `CHUNK` の行は `attempt to concatenate local 'part' (a boolean value)` です。それが小さなバグです。引き出しのクエストのやり方で直してください: 読みと書きのあいだに yield のない共有合計の更新、ちょうどひとりの使い走りが書く塊ごとのスロット、そしてロックのクエストのスケジューラ — 死んでいない使い走りはみな、誰も残らなくなるまで順番を得ます。

大きなケースでは和が 2^53 を越え、Lua の数は double です: そこを越えると `+` は丸めます。各和をふたつの肢 — 10^9 未満の下位部分と残りの上位部分 — として持ち、`%d%09d` として出力してください。

大きなものがボスで、それは直せるバグではありません。これを `k = 4` と `n = 4000000` で走らせて時間を計り、それから `k = 1` で走らせてください。同じ時間がかかります。それからループから yield を消してもう一度走らせてください: 同じ出力、同じ時間、そしてエラーなし。コルーチンは `yield` と言うまで場を握ります。それを言わない使い走りは、ほかの三人が待つあいだ最後まで走り、何もそれを教えてくれません。ほかに場を必要とするものが何もなかったからです。それが、太鼓が鳴り続けるなかひとつの節で止まった龍です。四つのコアの上の四つのコルーチンは、ひとつのコアの上で順番に二乗を足し、切り替えのコストが加わります。LuaJIT にスレッドはありません。コルーチンは止まる場所であって、二つ目のコアではありません。実行は、各使い走りが止まれると言った場所で、**順番に** 進みます。並列の仕事は二つ目のプロセス — `io.popen` — か、LÖVE クライアントの `love.thread` で、それは何も共有せずチャンネルで話す別の Lua の状態です。

出力が決定的なのは、塊がインデックス順に出力され、合計が使い走りの終わった順ではなく塊の和だからです。`TOTAL` はスロットを足したものではなく共有合計から出力してください — yield を含まない更新こそがこの地図の主題で、ふたつは一致しなければなりません。
'''
hints = [
