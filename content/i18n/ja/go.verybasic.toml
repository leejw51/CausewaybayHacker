# GO LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/go/verybasic.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and live in the
# English pack only. Code blocks, identifiers, sample input and output and
# the exact strings a program must print are copied verbatim, never
# translated.

pack   = "go.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.verybasic.01.print"
title = "最初の一行"
story = "天后、06:00、シャッターは半分。券売機の画面は挨拶するはずが、空の一行を出す。"
brief = '''
一つのことを言うプログラムには `fmt` の呼び出しが一つ要ります: 引数を出力して行を終えるものです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  
output: hello, causewaybay
```
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — 二重引用符の中の文字列、小文字、カンマ一つ。",
  "fmt のない print は stderr に書き、ln のない Print は行を終えません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.verybasic.02.int-types"
title = "広い数"
story = "天后のオクトパスリーダーはタップを int32 で数え、一日の合計はそこに収まらない。"
brief = '''
`n` は `int32` です。四十億を掛けるには先に広い型が要ります: `n` を `int64` に変換してから掛けてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7
output: 28000000000
```
'''
hints = [
  "wide := int64(n) * 4000000000 — 先に変換し、広い型で掛けます。",
  "n * 4000000000 は int32 で計算され、定数が収まらないのでコンパイルできません。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.verybasic.03.floats"
title = "小数の運賃"
story = "板の運賃はテキストだ。リーダーは倍にする前にそれを float64 として必要とする。"
brief = '''
`s` は文字列の運賃です。`strconv` は、数とエラーを返す一つの呼び出しでそれを `float64` にします。数は残し、エラーは捨ててください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  0.1
output: 0.100000000
        0.20
```
'''
hints = [
  "x, _ := strconv.ParseFloat(s, 64) — 結果は二つ、64 が欲しい幅です。",
  "32 だと値は先に float32 に丸められます。小数九桁目がそれを見せます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.verybasic.04.strings"
title = "大文字の駅名"
story = "天后のホームの標識は駅名を大文字で欲しがるのに、リーダーには小文字の形しかない。"
brief = '''
`line` は一行のテキストです。`strings` パッケージにはそれを大文字で返す関数があります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tin hau
output: TIN HAU
        7
```
'''
hints = [
  "up := strings.ToUpper(line) — 文字列を受け取るパッケージ関数で、文字列のメソッドではありません。",
  "Go の文字列に大文字小文字のメソッドはありません。strings.Title は単語の頭を大文字にするもので、同じではありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.verybasic.05.bool-if"
title = "偶数の車両"
story = "偶数番号の車両は広いホームに止まる。表示は一本おきに間違った方を選ぶ。"
brief = '''
`n` は車両番号です。プログラムは `n` が二で割り切れれば `even`、そうでなければ `odd` を出力します。`if` の行には剰余の検査が要ります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "if n%2 == 0 { — % が剰余、== が比較。",
  "= 一つは代入で、n/2 は商であって剰余ではありません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.verybasic.06.loops"
title = "駅を数える"
story = "路線には n 駅あり、集計板は 1 から n まで足す。走るループは一つ手前で止まる。"
brief = '''
`n` は読み込み済みです。ループは `i` を 1 から `n` まで（`n` を含めて）走らせ、各 `i` を `sum` に足さなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
output: 15
```
'''
hints = [
  "for i := 1; i <= n; i++ { — 三つの節、そして <= が n を含めます。",
  ":= のない i = 1 は何も宣言せず、< n は一つ早く止まります。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.verybasic.07.functions"
title = "ライダーの料率"
story = "配達一件ごとに五、一晩に一度三ドルのボーナス。料率の関数はまだ何も返さない。"
brief = '''
`fare` は配達回数を受け取り、一件あたり五に三を足して返さなければなりません。その `return` の行を書いてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: 23
```
'''
hints = [
  "return rides*5 + 3 — 先に掛けて、それからボーナスを足します。",
  "rides * (5 + 3) は一件八。rides + 5*3 は回数に十五を足します。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.verybasic.08.structs"
title = "一つの屋台、二つのフィールド"
story = "ラッキーマックの屋台カードには名前と値段があるのに、注文画面は両方のフィールドを空にして組み立てる。"
brief = '''
`Stall` にはフィールド `Name` と `Price` があります。キー付きの構造体リテラルで `name` と `price` から一つ組み立ててください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  noodles 12
output: noodles 24
```
'''
hints = [
  "s := Stall{Name: name, Price: price} — フィールド名、コロン、カンマ。",
  "値が三つは一つ多く、フィールドには値が合わなければならない型があります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.verybasic.09.struct-method"
title = "屋台の合計"
story = "屋台は値段と数量を知っているのに、Total メソッドはどの注文にもゼロを返す。"
brief = '''
`Total` は `Stall` のメソッドです。その `return` の行は、レシーバ `s` を通して読んだ値段掛ける数量を返さなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 4
output: 12
```
'''
hints = [
  "return s.Price * s.Qty — フィールドにはレシーバを通して届きます。",
  "Price 単独はスコープにありません。レシーバ s がメソッドから構造体を見る道です。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.verybasic.10.enums"
title = "三番目の路線"
story = "乗換駅の標識は路線に 0、1、2 と番号を振り、名前を言う前に番号を路線に戻す。"
brief = '''
`Line` は `Island`、`TsuenWan`、`KwunTong` を持つ `iota` の型です。下の `switch` が比較できるよう、整数 `n` を `Line` にしてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  2
output: kwuntong
```
'''
hints = [
  "line := Line(n) — 変換で、型に対する関数呼び出しのように書きます。",
  "line := n は int で、switch はそれを Line の定数と比べるのでコンパイルできません。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.verybasic.11.vector"
title = "車両のリスト"
story = "回線を流れてくる車両番号は全部リストの末尾に付くはずなのに、リストは空のままだ。"
brief = '''
`xs` は int のスライスです。ループの中で、スライスを伸ばす組み込みで各 `v` をその末尾に置いてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs = append(xs, v) — append は伸びたスライスを返すので、代入し戻します。",
  "スライスにメソッドはありません。append はスライスを最初に受け取る組み込みです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.verybasic.12.vector-edit"
title = "二両目が外れる"
story = "二両目が列車から外される。リストは違う一両を落とすか、何も落とさない。"
brief = '''
`xs` はその行の整数（四つ以上）を持っています。その前のスライスとその後のスライスをつないで、インデックス 1 の要素を取り除いてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 3 4 1
```
'''
hints = [
  "xs = append(xs[:1], xs[2:]...) — ... が尻尾を append に展開します。",
  "... がないと append は int を求める所にスライスを渡され、コンパイルできません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.verybasic.13.list"
title = "ライダーの列、連結"
story = "ライダーは次々に出勤するのに、ドアの連結リストは誰も保持しない。"
brief = '''
`l` は `container/list` です。各 `v` をその末尾に置くと、`Front` からの走査が順に出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4 5 6
output: 4 5 6
```
'''
hints = [
  "l.PushBack(v) — container/list に追記するメソッドです。",
  "PushFront もあり、それだと逆順に出力されます。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.verybasic.14.maps"
title = "注文の集計"
story = "ラッキーマックで注文された料理はそれぞれ数を一つ増やすはずなのに、集計が動かない。"
brief = '''
`counts` は `map[string]int` です。ループの中で `w` の数に一を足してください — ないキーはゼロとして読めるので、式一つで済みます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  rice tea rice bun
output: bun 1
        rice 2
        tea 1
```
'''
hints = [
  "counts[w]++ — マップを添字し、++ がそこにあるもの（なければゼロ）に一を足します。",
  "counts[w] = 1 は繰り返しをすべて忘れます。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.verybasic.15.hashtable"
title = "名前から番号へ"
story = "ライダー名簿は名前を定数時間で番号に写すのに、検索は全員に -1 と答える。"
brief = '''
`table` は `map[string]int` — Go のハッシュテーブルです。最初のループで各 `name` をそのインデックス `i` と共に格納してください。下の検索はカンマ ok の形を使います。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  alex mei kit
        mei kit bo
output: 1
        2
        -1
```
'''
hints = [
  "table[name] = i — 角括弧の中に左のキー、右に値。",
  "キーは文字列でなければなりません。table[i] は int で添字しますが、それはマップのキーの型ではありません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.verybasic.16.sets"
title = "相異なるライダー"
story = "四十回の配達、八人のライダー。相異なるライダーを数えるはずの集合が何も数えない。"
brief = '''
`seen` は `map[int]struct{}` — 集合です。各 `v` をそこに記録してください。空の構造体が、何も費やさない値です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  8 3 8 5 3 8
output: 3
```
'''
hints = [
  "seen[v] = struct{}{} — 型、そしてそれを一つ作る一組の波括弧。",
  "true は bool で、マップの値の型は struct{} です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.verybasic.17.stack"
title = "上から二枚"
story = "皿はパスで積まれ上から取られる。レジは一番上の皿を二度読み、決して取らない。"
brief = '''
`stack` はスタックとして使うスライスです。`top` はその末尾から読まれます。次の行は、再スライスでその最後の要素を落とさなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1
        4
        2
```
'''
hints = [
  "stack = stack[:len(stack)-1] — 最後の要素以外のすべて。",
  "stack[1:] は先頭を落とします。それはキューの動きであって、スタックのではありません。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.verybasic.18.queue"
title = "前から二人"
story = "客はレジに並び、前から抜けていく。画面は同じ客を二度捌く。"
brief = '''
`queue` はキューとして使うスライスです。`front` はその最初の要素です。次の行は、インデックス 1 からの再スライスでその要素を落とさなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 3
        1
        2
```
'''
hints = [
  "queue = queue[1:] — 二番目の要素から先のすべて。",
  "queue[:1] は先頭だけを残し、queue[0:] はすべてを残します。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "go.verybasic.19.heap"
title = "小さい順に"
story = "注文は番号の小さい順に捌かれる。それを持つはずのヒープに手で push され、どんな順でも出てくる。"
brief = '''
`h` は `heap.Interface` を実装する `*IntHeap` です。順序が保たれるよう、各 `v` を `heap` パッケージを通して push してください。下の pop は小さい順に出てきます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 1 4 2
output: 1 2 4 5
```
'''
hints = [
  "heap.Push(h, v) — ヒープと値を渡すパッケージ関数です。",
  "&v を push するとヒープにポインタが渡ります。その Push は int を型アサートしてパニックします。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "go.verybasic.20.sorting"
title = "到着掲示板"
story = "掲示板は到着を打ち込んだ順に並べる。昇順に欲しい。"
brief = '''
`xs` は int のスライスです。`sort` パッケージの呼び出し一つで、その場で昇順に並べてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "sort.Ints(xs) — 複数形で、[]int 用、その場で整列します。",
  "sort.Sort は Len、Less、Swap を持つ型を求めます。素の []int はそうではありません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "go.verybasic.21.sort-by-key"
title = "ライダーのリーダーボード"
story = "リーダーボードには名前と得点があり、出勤した順に並んでいる。"
brief = '''
`rows` は `Row{Name, Score}` のスライスです。`sort.Slice` とインデックスに対する less 関数で、`Score` の高い順に整列してください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
        alex 40
        mei 75
        kit 12
output: mei 75
        alex 40
        kit 12
```
'''
hints = [
  "sort.Slice(rows, func(i, j int) bool { return rows[i].Score > rows[j].Score }) — 降順には >。",
  "less 関数の引数には型 int が要ります。ないとコンパイルできません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "go.verybasic.22.reverse"
title = "逆向きの路線"
story = "最終列車は駅を逆順に走るのに、掲示板はまだ前向きに並べている。"
brief = '''
`xs` は int のスライスです。`slices` パッケージは呼び出し一つでそれをその場で逆順にします。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 4 1
output: 1 4 1 3
```
'''
hints = [
  "slices.Reverse(xs) — その場で、戻り値なし。",
  "スライスそのものを受け取り、そのポインタではありません。結果を代入するとコンパイルできません。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "go.verybasic.23.closures"
title = "追加料金"
story = "夜の板のどの運賃にも同じ追加料金が付くのに、足す関数が金額を忘れた。"
brief = '''
`k` が先に読まれます。`add` は int を受け取りそれに `k` を足して返す関数リテラル — `k` に対するクロージャ — でなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "add := func(x int) int { return x + k } — 引数の型、結果の型、そして外側の k。",
  "結果の型がなければリテラルは何も返しません。x * k は別の関数です。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "go.verybasic.24.lambdas"
title = "すべてのドアを二乗"
story = "ホームの模型はすべてのドア番号の二乗を欲しがるのに、ドアに関数を写すヘルパーには何も渡されない。"
brief = '''
`apply` はスライスと関数を受け取り、写したスライスを返します。引数を二乗する関数リテラルを渡して `xs` に対して呼んでください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 1 4 9
```
'''
hints = [
  "ys := apply(xs, func(x int) int { return x * x }) — リテラル全体が引数です。",
  "x * x 単独は関数ではなく、結果の型のないリテラルは何も返しません。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.verybasic.25.threads"
title = "注文一つにライダー一人"
story = "八つの注文が八台のバイクで一斉に厨房を出て、板はどれも待たない。"
brief = '''
数ごとにゴルーチン一つ: それぞれが `x` を二乗して `results[i]` に入れ、終わったら `WaitGroup` に知らせます。`i` と `x` を渡して、`go` キーワードで始めてください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
hints = [
  "go func(i, x int) { defer wg.Done(); results[i] = x * x }(i, x) — リテラル、そしてループの値での呼び出し。",
  "Done がなければ WaitGroup は戻りません。(i, x) がなければリテラルは呼ばれません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "go.verybasic.26.mutex"
title = "一つの合計、多くの手"
story = "どのライダーも運賃を一つの合計に同時に足し、合計は誰にも再現できない分だけ狂って戻る。"
brief = '''
`total` はすべてのゴルーチンで共有されます。それに `x` を足す行は `mu.Lock()` と `mu.Unlock()` の間に置かれなければなりません — ここでは三つとも一行に。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "mu.Lock(); total += x; mu.Unlock() — ロック、共有値に触る、アンロック。",
  "Unlock のない Lock は他のすべてのゴルーチンを永遠に止め、WaitGroup も道連れです。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.verybasic.27.binary-tree"
title = "ヌルポインタ"
story = "11:55、ラッキーマックの前のレジはすべての注文を番号で木に綴じるのに、左の枝は綴じてから捨てられる。"
brief = '''
`insert` は `n` を根とする部分木に `v` を入れ、その部分木の根を返します。`if` の枝は小さい `v` を扱います: 左の子へ再帰し、返ってきたものを格納してください。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
