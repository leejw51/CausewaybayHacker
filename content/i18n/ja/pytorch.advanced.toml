`BatchNorm` は訓練中は現在のバッチの統計で正規化し、eval では訓練中に蓄積した移動平均で正規化します。サービス時に `train()` のまま残されたモデルは各リクエストをそれ自身で正規化し、だから大きさ一のバッチはゼロで出てきます。

訓練バッチをいくつか走らせ、eval に切り替え、移動平均が動いたかどうかと、大きさ一のバッチが今は生き残るかどうかを出力してください。

```
output: True True False
```
'''
hints = [
  "bn.eval() — train モードでは大きさ一のバッチは分散がゼロで、BatchNorm1d は例外を出します。",
  "running_mean はパラメータではなくバッファです: state dict には入っていて、勾配は得ません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.advanced.17.layernorm"
title = "バッチごとではなくトークンごとに"
story = "ラックのトランスフォーマーは各トークンをそれ自身で正規化するのに、ここで書かれた版はバッチで正規化し、バッチが変わるたびにずれていく。"
brief = '''
LayerNorm は **特徴量** の軸について、一度に一トークンずつ正規化します。だからバッチに他に何が入っているかを気にしません — トランスフォーマーが BatchNorm ではなくこれを使う理由です。

書き下すと `(x - mean) / sqrt(var + eps)` で、平均と分散は最後の軸について `keepdim=True` で取り、分散の unbiased は `False` です。

`nn.LayerNorm` に手で一致させ、その一致と、ある行の平均と標準偏差を出力してください。

平均は構成上ゼロですが、float32 ではそのわずかにどちらか側に着地します — そして `round(-1e-8, 4)` は `-0.0` で、それは `0.0` と同じテキストではありません。どちら側に着地するかはマシンの都合で、あなたの都合ではありません。print の中の `+ 0.0` がそれを決着させます: IEEE 754 では `-0.0 + 0.0` は `0.0` です。

```
output: True 0.0 1.0
```
'''
hints = [
  "dim=-1 に keepdim=True、そして分散には unbiased=False — LayerNorm は n-1 ではなく n で割ります。",
  "eps はデフォルトで 1e-5 で、平方根の外ではなく中に入ります。",
]

