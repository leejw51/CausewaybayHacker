[[quest]]
id    = "pytorch.advanced.11.freeze"
title = "動かない層"
story = "最後の層だけをファインチューニングしているのに、オプティマイザにすべてを渡したせいでバックボーン全体が動いている。"
brief = '''
凍結は二つの別々のことで、両方が必要です。`requires_grad = False` は勾配の計算を止め、凍結していないパラメータだけをオプティマイザに渡すことはそれらをステップさせないようにします。片方だけをやるのが、よくある半分凍結のバグです。

最初の層を凍結し、まだ学習しているものだけをオプティマイザに渡し、それぞれがいくつのテンソルを見ているかと、凍結した重みが動いたかどうかを出力してください。

```
output: 2 4 True False
```
'''
hints = [
  "ループの中で p.requires_grad = False、それから model.parameters() を requires_grad で絞り込みます。",
  "model.parameters() は凍結したテンソルもまだ返します。短くなるのはオプティマイザのリストだけです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "pytorch.advanced.12.clip-grad"
title = "スパイク"
story = "03:40 に悪いバッチが一つ、巨大な勾配が一つ、そして 03:41 にはモデルのすべての重みが NaN だ。"
brief = '''
クリッピングは勾配ベクトル全体を、そのノルムが高々 `max_norm` になるようにスケールし直します。向きは保ち、一歩を短くします。それは `backward()` の **後**、`step()` の **前** に置きます — それ以外の場所では何もしません。

`clip_grad_norm_` は、クリップする前に見たノルムを返します。

ここの勾配のノルムは `sqrt(3² + 4²) = 5` です。`1.0` にクリップすると、同じ向きの単位ベクトルになります。

```
output: 5.0 1.0 [0.6, 0.8]
```
'''
hints = [
  "nn.utils.clip_grad_norm_([w], max_norm=1.0) — 末尾のアンダースコアは、.grad をその場で編集するからです。",
  "返すのはクリップ前のノルムで、それがログに残す価値のある数です。",
]

