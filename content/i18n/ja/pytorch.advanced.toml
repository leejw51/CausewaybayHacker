定数で初期化された層は対称です: すべてのユニットが同じ勾配を得て、実行の間ずっと隣と同一のままです。ランダムな初期化が対称性を破り、そのランダムさの *スケール* が、信号が深さを生き延びるかどうかを決めます — Kaiming と Xavier はそのためのものです。

重みを Kaiming 正規分布で、バイアスをゼロで初期化し、一ステップの後に隠れ層の行が異なるかどうかを出力してください。

