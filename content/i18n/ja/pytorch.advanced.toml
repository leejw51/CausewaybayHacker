[[quest]]
id    = "pytorch.advanced.16.batchnorm"
title = "移動平均"
story = "モデルは訓練ではよい点を取り、サービスに出した途端、同じデータで悪い点を取る。誰も eval を呼ばず、バッチ統計が大きさ一のバッチから計算し直されている。"
