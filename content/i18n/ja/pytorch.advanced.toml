学習率スケジュールは訓練が進むにつれて一歩を小さくします。`StepLR(opt, step_size=2, gamma=0.1)` は二エポックごとに率に `0.1` を掛け、`sched.step()` はオプティマイザがステップした後で **エポックごとに一回** 呼びます — バッチごとに呼ぶと、意図より何百倍も速く減衰します。

