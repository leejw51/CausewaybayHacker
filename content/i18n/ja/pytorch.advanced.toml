[[quest]]
id    = "pytorch.advanced.09.stop-gradient"
title = "学び返したターゲット"
story = "ターゲットネットワークはオンラインのほうが追いつく間じっとしているはずなのに、両方とも動いている。"
brief = '''
モデルが生成したものに対して損失を計算すると、止めない限り勾配は **両側** に流れます。ターゲットに対する `detach()` が勾配停止で、それを忘れるのが、モデルが自分自身に対して訓練して崩壊するバグです。

`b` を detach した状態で `a` を `b` に向けて訓練し、二つのうちどちらが勾配を得たかを出力してください。

```
output: True False
```
'''
hints = [
  "target = b.detach() — ターゲットはもう学習されるものではなく、ただの数です。",
  "detach がないと b.grad も埋まり、ターゲットは予測のほうへ流されていきます。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.advanced.10.retain-graph"
title = "二度 backward しようとして"
story = "一回の順伝播に損失が二つあり、二回目の backward はバッファがすでに解放されたと例外を出す。"
brief = '''
`backward()` はグラフをたどりながら解放します。したがって同じ順伝播に対する二回目の `backward()` は例外を出し — バッファはもうありません — それを保持するのが `retain_graph=True` です。

まっとうな直し方はたいてい、損失を足して `backward()` を一回呼ぶことです。`retain_graph` は本当に二回の別々のパスが必要なときのためのもので、メモリを食います。

グラフを保持して二回目のパスを走らせ、蓄積された勾配を出力してください: `w = 2` での `d(w²)/dw + d(3w)/dw` は `4 + 3` です。

```
output: caught 7.0
```
'''
hints = [
  "first.backward(retain_graph=True) — そうすれば二回目のパスにもたどるグラフが残ります。",
  "勾配は蓄積されるので、出力される数は二つの導関数の和です。",
]

