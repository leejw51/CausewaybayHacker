  "torch.log_softmax(big, dim=0) — 呼び出し一つで、アンダーフローした数の対数を取ることは決してありません。",
  "中の工夫は、指数を取る前に行の最大値を引くことです。それをブロードキャストさせるのが keepdim です。",
]

