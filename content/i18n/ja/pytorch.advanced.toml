# ---------------------------------------------------------------- 19
[[quest]]
id    = "pytorch.advanced.19.weight-decay"
title = "ゼロへ引き戻される"
story = "モデルは訓練セットを正確に丸暗記し、ある重みは隣の四百倍の大きさになっている。"
brief = '''
重み減衰は、すべてのステップにゼロへ向かう引きを加えます。ただの SGD ではそれはまさに L2 正則化です: 勾配に `wd * w` が足されるので、他に勾配がまったくなければ、重みはステップごとに `1 - lr * wd` 倍に縮みます。

ここでは損失は定数なので、重みを動かすのは減衰だけです: `lr=0.1`、`wd=0.5` で `2.0` は `2.0 * 0.95` になります。

```
output: 1.9
```
'''
hints = [
  "torch.optim.SGD([w], lr=0.1, weight_decay=0.5) — 減衰は損失の項ではなく、オプティマイザの引数です。",
  "バイアスと正規化のパラメータは通常、減衰から除外され、それには param group が二つ要ります。",
]

