# PYTORCH LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.advanced.01.view-contiguous"
title = "拒んだ view"
story = "バッチは入ってくる途中で転置され、一年間動いてきた平坦化が連続性について例外を出す。"
brief = '''
`view` は、テンソルのメモリが新しい形の必要とするとおりにすでに並んでいることを要求します。転置はメモリを一切動かさず — ストライドを変えるだけ — なので、転置したテンソルに `view` をすると `RuntimeError` が出ます。これは PyTorch の面接で必ず聞かれる二つか三つのエラーの一つです。

`reshape` は必要ならコピーし、どちらでも動きます。`contiguous()` はコピーを明示的に行い、それで `view` が再び合法になります。

転置したテンソルで `view` が失敗することを出力し、それから、それでも平坦化する二つのやり方を出力してください。

```
output: RuntimeError True True
```
'''
hints = [
  "x.reshape(6) は必要ならコピーします。x.contiguous().view(6) は先にコピーしてから view します。",
  "転置が変えるのはメモリではなくストライドです — それこそ view が許容できないことです。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.advanced.02.in-place"
title = "アンダースコア"
story = "誰かがアンダースコアを一つ足してメモリを節約し、今や逆伝播は、勾配に必要な変数が変更されたと例外を出す。"
brief = '''
末尾のアンダースコアは *その場で* を意味します: `relu_`、`add_`、`mul_`。その場の演算は割り当てを一つ節約し、逆伝播が必要とするはずだった値を破壊します。そして autograd はそれを捕まえます — `backward()` の時点で、原因となった行から遠く離れたところで。

同じ算術をその場でない形で行って逆伝播が生き残るようにし、勾配を出力してください。

`y = w * 2`、次に `y = y + 1`、次に `loss = y.sum()`: `w` に関する損失の勾配はどの要素でも `2` です。

```
output: [2.0, 2.0, 2.0] caught
```
'''
hints = [
  "y = y + 1 は名前を新しいテンソルに束縛し直します。y += 1 はその場で変更し、グラフを壊します。",
  "定数を足しても勾配は変わりません — d(2w + 1)/dw はやはり 2 です。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.advanced.03.detach-clone"
title = "コピーと、切断"
story = "ログのコードは損失の数ではなくテンソルを持っていて、04:00 になっても四時間分のグラフがまだメモリにある。"
brief = '''
`clone()` はデータをコピーし、**グラフに残ります** — 勾配はそこを通って流れます。`detach()` はデータを共有し、**グラフを離れます** — 何も逆流しません。二つは代替ではなく、別々の問いに答えるものです。

スナップショットに欲しいのは `x.detach().clone()` です: 新しいメモリ、グラフなし。

三つそれぞれについて、勾配を要求するかどうかと、元とストレージを共有するかどうかを出力してください。

```
output: clone True False detach False True snapshot False False
```
'''
hints = [
  "x.clone()、x.detach()、x.detach().clone() — この順番で。",
  "detach は同じメモリを共有するので、そこに書くと元にも書き込まれます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.advanced.04.dtype-promotion"
title = "丸めた割り算"
story = "正規化はカウントを合計で割り、どのラックもゼロで出てくる。一で出てくる一つを除いて。"
brief = '''
二つの整数テンソルに `/` をすると浮動小数点のテンソルになります — torch は昇格させます。`//` は整数を保って切り捨て、`int_tensor /= 2` は黙って切り捨てるのではなく例外を出します。結果の dtype が元に収まらないからです。

真の除算、切り捨て除算、明示的な浮動小数点キャストのそれぞれについて、dtype と値を出力してください。

```
output: torch.float32 [0.5, 1.0, 1.5] torch.int64 [0, 1, 1] torch.float32 [0.5, 1.0, 1.5]
```
'''
hints = [
  "n / 2、n // 2、n.float() / 2 — 一つ目はすでに昇格し、二つ目はしません。",
  "float32 のテンソルは大きな int64 を正確には保持できません。昇格は利便ではなく判断です。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.advanced.05.gather"
title = "正解に付けたスコア"
story = "ロジットのバッチから、真のクラスに対するサンプルごとの確信度を。それをするループが評価でいちばん遅い行だ。"
brief = '''
`gather` はインデックスによって行ごとに一つの要素を、ループなしで拾います。確率の `(batch, classes)` テンソルとラベルの `(batch,)` テンソルに対して、`probs.gather(1, labels.unsqueeze(1)).squeeze(1)` は、すべてのサンプルについてモデルが正しいクラスに与えた確率です。

`unsqueeze` は飾りではありません: `gather` のインデックスは元と同じ次元数を持たなければなりません。

```
output: [0.7, 0.2, 0.9]
```
'''
hints = [
  "probs.gather(1, want.unsqueeze(1)).squeeze(1) — dim 1 がクラスの軸です。",
  "probs[want] は列ではなく行をインデックスし、まったく間違った三行を返します。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.advanced.06.masked-fill"
title = "マイナス無限大"
story = "バッチのパディングの枠が単語であるかのようにアテンションを受け、モデルはパディングを予測することを学んでしまった。"
brief = '''
ソフトマックスからある位置を取り除くには、後で確率をゼロにするのではなく、ソフトマックスの **前に** そのスコアを `-inf` にします: `exp(-inf)` は 0 で、残りの確率はやはり合計一になります。後でゼロにすると、合計が一に満たない行が残ります。

`scores.masked_fill(mask, float("-inf"))` は真偽値のマスクが `True` のところを埋めます。

最後の位置をマスクし、丸めた確率と行の合計を出力してください。

```
output: [0.7311, 0.2689, 0.0] 1.0
```
'''
hints = [
  'scores.masked_fill(keep_out, float("-inf")) — マスクが True のところを埋めます。',
  "マスクされた要素は最大のスコアを持っていました。ソフトマックスの後でマスクしていたら、それが支配したままだったでしょう。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.advanced.07.keepdim"
title = "消えた軸"
story = "各行からその行の最大値を引くと、長方形のテンソルから正方形のテンソルが出てきて、何も例外を出さない。"
brief = '''
縮約は縮約した軸を取り除きます。`(2, 3)` に対する `x.max(dim=1).values` は `(2,)` を返し、それを `(2, 3)` から引くと **間違った** 軸に沿ってブロードキャストされます — 2 を 3 の位置に並べ、数がたまたま合えば、黙って無意味なものを計算します。

`keepdim=True` は軸をサイズ 1 として残し、それこそブロードキャストが望むものです。

keepdim なしの形、ありの形、そして引き算の後の行の最大値 — ゼロです — を出力してください。

```
output: (2,) (2, 1) [0.0, 0.0]
```
'''
hints = [
  "x.max(dim=1).values と x.max(dim=1, keepdim=True).values — max が返すのはテンソルではなく名前付きタプルです。",
  "まさにこの引き算が、数値的に安定なソフトマックスの一行目です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.advanced.08.batched-matmul"
title = "ヘッドごとに一回の積"
story = "アテンションヘッドが四つあり、コードは Python でそれをループする。プロファイラによれば、そのループがモデルそのものだ。"
brief = '''
二次元より多いテンソルに対する `@` は **バッチ化された** 行列積です: 最後の二つの軸が行列で、その前はすべてバッチで、バッチの軸はブロードキャストされます。

`(B, H, T, d) @ (B, H, d, T)` は `(B, H, T, T)` を返します — それはまさにアテンションスコアのテンソルで、すべての系列のすべてのヘッドを一度に、ループなしで得られます。

それを作り、形と、ループした答えと一致するかどうかを出力してください。

```
output: (2, 4, 5, 5) True
```
'''
hints = [
  "q @ k.transpose(-2, -1) — 負の軸なので、バッチの階数が何であれ同じ行が動きます。",
  "k.t() は 2 次元テンソルでしか動かず、4 次元のものでは例外を出します。",
]

