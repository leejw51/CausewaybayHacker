[[quest]]
id    = "remix.verybasic.22.list-go"
title = "リスト — GO"
story = "カウンターの行列: 一人が後ろに並び、先頭が注文を受け、店長は二番目と三番目が誰かを見たがっている。Gogo は Go で注文する。"
brief = '''
伸びる列です: 末尾に積み、先頭から取り、最後を添字で引き、部分範囲を切り出します。プログラムは数をリストに読み込み、100 を追加し、先頭を取り除き、最後の要素、位置 1 と 2 の要素、そして長さを出力します。

Go ではリストはスライスです。`append` は伸びたスライスを返すので代入し直さなければなりません。`nums[1:]` はスライスし直して先頭を落とします。`nums[len(nums)-1]` が最後です — 負の添字はありません — そして `nums[1:3]` は配列を共有する部分スライスです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 6 7 8
output: 100
        7 8
        4
```
'''
hints = [
  "nums = append(nums, 100); nums = nums[1:]; last := nums[len(nums)-1]; mid := nums[1:3].",
  "append(nums, 100) だけではコンパイルできません: 結果が使われておらず、返されるスライスこそが伸びたものです。",
]

