# ---------------------------------------------------------------- 16
[[quest]]
id    = "remix.verybasic.16.enums-go"
title = "列挙型 — GO"
story = "出菜口の上のランプは赤か緑か黄で、待ち秒数はどれかで決まる — 閉じた場合の集合と、そのすべてにわたる分岐だ。Gogo は Go で注文する。"
brief = '''
列挙型は名前付きの値の決まった集合を持つ型で、それに対する match は各場合を名指しして結果を選びます。プログラムはランプの名前を読み、それぞれを列挙型にして、名前と待ち秒数を出力します: red は 30、green は 25、yellow は 5。

Go に enum キーワードはありません: 名前付きの整数型と `iota` を使った `const` ブロックがそれを作ります — `Red`、`Green`、`Yellow` は 0、1、2 です。分岐は値ごとに `case` を一つ置く `switch` です。フォールスルーはなく、残りは `default` が受け止めます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  red green yellow green
output: red 30
        green 25
        yellow 5
        green 25
```
'''
hints = [
  "case Red: return 30、次に case Green: return 25 — 定数ごとに case 一つ、break は要りません。",
  "case \"red\" は Light と文字列を比べるのでコンパイルできません。switch は単語ではなく列挙型に対するものです。",
]

