Rust では `mpsc::channel()` が `Sender` と一つの `Receiver` を与えます。三つの消費者は `Arc<Mutex<Receiver>>` を通して受信側を共有し、それぞれがロックして `recv()` します。`tx.send(x)` が送り、`drop(tx)` が閉じることです: すべての送信側がなくなると `recv` は `Err` を返し、消費者はループを抜けて集計を返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

