Rust では `thread::spawn(move || ...)` がスレッドを起動して `JoinHandle` を返します。`move` はクロージャに塊の自分用のコピーを与え (`Vec` なのでスレッドが所有します)、`h.join().unwrap()` は待ってクロージャが返したもの — ここでは和 — を渡します。だから共有状態はまったくありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6 7
output: 6 15 7
        28
```
'''
hints = [
  "let chunk = chunk.to_vec(); の次に handles.push(thread::spawn(move || chunk.iter().sum::<i64>()));",
  "move がないとクロージャは chunk を借用し、スレッドは main のループより長く生きうるので E0373 です。",
]

