```
'''
hints = [
  "整数には q = a // b の次に r = a % b。f = a / b は最初から浮動小数点数です。",
  "float(a) / b でも動き、Go や Rust に慣れた手はそう打ちます。Python では要りません。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.verybasic.04.strings-go"
title = "文字列 — GO"
story = "注文票はカンマで区切られた名前の一行で、厨房はそれを大声で呼び、分け、一文字ずつ数えたがっている。Gogo は Go で注文する。"
brief = '''
文字列は区切り文字で断片に分けられ、断片は別の区切りでつなぎ直され、文字列全体は一回の呼び出しで大文字になります。落とし穴は長さです: アクセント付きの名前は文字数よりバイト数が多く、人が数えるのはそのうち片方だけです。プログラムはカンマ区切りの名前を一行読み、名前の数、大文字にして ` | ` でつないだ名前、そしてその行の文字数を出力します。

Go では `strings` パッケージが仕事をします: `strings.Split` は `[]string` を返し、`strings.Join` はそれを受け取って戻し、`strings.ToUpper` は新しい文字列を返します。`len(s)` はバイト数です。文字数は `utf8.RuneCountInString(s)` です。Go の文字列はバイトの並びで、rune はそれをデコードしたものだからです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "strings.Split(line, \",\") の次に strings.ToUpper(strings.Join(names, \" | \"))。数は utf8.RuneCountInString(line) です。",
  "len(line) はバイト数です: Zoë は四バイトで三文字、そして隠しテストはそれを知っています。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.verybasic.05.strings-rust"
title = "文字列 — RUST"
story = "注文票はカンマで区切られた名前の一行で、厨房はそれを大声で呼び、分け、一文字ずつ数えたがっている。Ferris は Rust で注文する。"
brief = '''
文字列は区切り文字で断片に分けられ、断片は別の区切りでつなぎ直され、文字列全体は一回の呼び出しで大文字になります。落とし穴は長さです: アクセント付きの名前は文字数よりバイト数が多く、人が数えるのはそのうち片方だけです。プログラムはカンマ区切りの名前を一行読み、名前の数、大文字にして ` | ` でつないだ名前、そしてその行の文字数を出力します。

Rust では `split(',')` はイテレータなので、`Vec<&str>` に `collect` します。vec に対する `join(" | ")` が `String` を作り、`to_uppercase()` がもう一つ作ります。`len()` はバイト数です。文字数は `chars().count()` です。`&str` は UTF-8 のバイトで、`chars()` がそれをデコードするからです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "let names: Vec<&str> = line.split(',').collect(); の次に names.join(\" | \").to_uppercase()。数は line.chars().count() です。",
  "line.len() はバイト数です: Zoë は四バイトで三文字、そして隠しテストはそれを知っています。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.verybasic.06.strings-python"
title = "文字列 — PYTHON"
story = "注文票はカンマで区切られた名前の一行で、厨房はそれを大声で呼び、分け、一文字ずつ数えたがっている。ニシキヘビは Python で注文する。"
brief = '''
文字列は区切り文字で断片に分けられ、断片は別の区切りでつなぎ直され、文字列全体は一回の呼び出しで大文字になります。落とし穴は長さです: アクセント付きの名前は文字数よりバイト数が多く、人が数えるのはそのうち片方だけです。プログラムはカンマ区切りの名前を一行読み、名前の数、大文字にして ` | ` でつないだ名前、そしてその行の文字数を出力します。

Python ではメソッドは文字列にあります: `line.split(",")` はリストを返し、`" | ".join(names)` は*区切り文字*に対して呼び、`.upper()` は新しい文字列を返します。`len(s)` はバイトではなく文字を数えます。Python の `str` は既にデコード済みだからです — バイト数なら `len(s.encode())` です。

それをする行を選び、`# FILL` コメントの場所に打ってください。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "names = line.split(\",\") の次に \" | \".join(names).upper()。数は len(line) です。",
  "len(line.encode()) はバイト数です: Zoë は四バイトで三文字、そして隠しテストはそれを知っています。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "remix.verybasic.07.loops-go"
title = "ループ — GO"
story = "常連の一人が、厨房が注文を半分にしたり三倍にしたりして一に落ち着くまでに何回かかるか、そして途中でどこまで大きくなったかを数えている。Gogo は Go で注文する。"
brief = '''
ループは条件が成り立つ間回り、分岐は二つの腕のうち一つを選び、カウンタは一周ごとに一つ増えます。プログラムは `n` を読んでたどります: 偶数なら半分に、奇数なら三倍して一を足し、1 で止まります。ステップ数と、途中で見た最大の値を出力します。

Go のループのキーワードは一つだけです。`for cond { }` が while ループで、`steps++` はインクリメント文です — 式ではなく文なので、より大きな式の中には置けません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  6
output: 8
        16
```
'''
hints = [
  "for n != 1 { — Go の while — の次に、中の最初の行として steps++。",
  "Go に while はありません。条件一つの for がそれです。",
]

