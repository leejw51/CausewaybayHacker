title = "エラー — GO"
story = "注文票の数のいくつかは数ではない。レジは数であるものを足し、そうでないものを読み上げ、そして倒れない。Gogo は Go で注文する。"
brief = '''
解析は失敗しうるもので、言語ごとに失敗の返し方が違います: 二つ目の戻り値として、`Result` として、あるいは例外として。プログラムはトークンを読み、整数として解析できるものを足し、できないものごとに `bad: <token>` を出力し、最後に合計を出力します。

Go では `strconv.ParseInt` は値*と* `error` を返し、呼び出しの直後のチェックがこの言語全体の定石です: エラーを `nil` と比べ、比較の悪い側に出たらそう言って飛ばします。何も投げられません。チェックはどの行ですか?

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  12 x 30 4y 8
output: bad: x
        bad: 4y
        50
```
'''
hints = [
  "v, err := strconv.ParseInt(t, 10, 64) の次に if err != nil { fmt.Println(\"bad:\", t); continue }。",
  "10 は基数、64 はビット幅です。v は int64 です。",
]

