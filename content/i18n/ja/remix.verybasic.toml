[[quest]]
id    = "remix.verybasic.08.loops-rust"
title = "ループ — RUST"
story = "常連の一人が、厨房が注文を半分にしたり三倍にしたりして一に落ち着くまでに何回かかるか、そして途中でどこまで大きくなったかを数えている。Ferris は Rust で注文する。"
brief = '''
ループは条件が成り立つ間回り、分岐は二つの腕のうち一つを選び、カウンタは一周ごとに一つ増えます。プログラムは `n` を読んでたどります: 偶数なら半分に、奇数なら三倍して一を足し、1 で止まります。ステップ数と、途中で見た最大の値を出力します。

Rust では `while cond { }` と書き、インクリメントは `steps += 1;` です — `++` はありません。中の `if` も式なので、`n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };` でも動きます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  6
output: 8
        16
```
'''
hints = [
  "while n != 1 { の次に、中の最初の行として steps += 1;。",
  "steps++ は Rust ではありません。+= 1 がそうです。",
]

