id    = "remix.verybasic.09.loops-python"
title = "ループ — PYTHON"
story = "常連の一人が、厨房が注文を半分にしたり三倍にしたりして一に落ち着くまでに何回かかるか、そして途中でどこまで大きくなったかを数えている。ニシキヘビは Python で注文する。"
brief = '''
