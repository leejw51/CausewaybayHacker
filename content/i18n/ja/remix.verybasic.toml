[[quest]]
id    = "remix.verybasic.03.numbers-python"
title = "整数と浮動小数点数 — PYTHON"
story = "一番テーブル。注文票に数が二つあり、勘定を割らなければならない: 一人いくつ、いくつ余るか、そして一セント単位まで正確な一人分。ニシキヘビは Python で注文する。"
brief = '''
整数と浮動小数点数は別の型で、整数どうしを割ると整数になります: 商はゼロの方向に丸められ、余りは `%` に残ります。正確な一人分を得るには、先に変換してから割ります。プログラムは `a` と `b` を読み、その和を出力し、次に商と余りを一行に、最後に `a / b` を小数点以下二桁の浮動小数点数として出力します。

Python では `/` は二つの int どうしでも常に浮動小数点数を返すので、正確な一人分には変換がまったく要りません。整数の商は*もう一つの*演算子 `//` で、`%` が余りです。`f"{f:.2f}"` は小数点以下二桁を出力します。

それをする行を選び、`# FILL` コメントの場所に打ってください。

