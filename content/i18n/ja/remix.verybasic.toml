Rust では `t.parse::<i64>()` は `Result` を返し、`let Ok(v) = ... else { ... };` は値を取り出すか `else` を実行します — その else は抜け出さなければなりません (`continue`、`return`、`break`)。`Ok` と `Err` の腕を持つ `match` は同じことの長い書き方です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

