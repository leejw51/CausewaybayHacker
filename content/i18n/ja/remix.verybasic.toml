# REMIX LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1):
# the prose of `content/remix/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "remix.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.verybasic.01.numbers-go"
title = "整数と浮動小数点数 — GO"
story = "一番テーブル。注文票に数が二つあり、勘定を割らなければならない: 一人いくつ、いくつ余るか、そして一セント単位まで正確な一人分。Gogo は Go で注文する。"
brief = '''
整数と浮動小数点数は別の型で、整数どうしを割ると整数になります: 商はゼロの方向に丸められ、余りは `%` に残ります。正確な一人分を得るには、先に変換してから割ります。プログラムは `a` と `b` を読み、その和を出力し、次に商と余りを一行に、最後に `a / b` を小数点以下二桁の浮動小数点数として出力します。

Go では二つの `int64` 値に対する `/` は整数除算で、`%` は余りです。`float64(a)` が変換です — 関数の形をしたキャストです — そして両辺が `float64` になって初めて `/` は正確に割ります。`Printf` の `%.2f` は小数点以下二桁を出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "q := a / b の次に r := a % b — どちらも int64 のままです。f := float64(a) / float64(b) は割る前に変換します。",
  "float64(a) / b はコンパイルできません: Go は一つの式の中で int64 と float64 を決して混ぜません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.verybasic.02.numbers-rust"
title = "整数と浮動小数点数 — RUST"
story = "一番テーブル。注文票に数が二つあり、勘定を割らなければならない: 一人いくつ、いくつ余るか、そして一セント単位まで正確な一人分。Ferris は Rust で注文する。"
brief = '''
整数と浮動小数点数は別の型で、整数どうしを割ると整数になります: 商はゼロの方向に丸められ、余りは `%` に残ります。正確な一人分を得るには、先に変換してから割ります。プログラムは `a` と `b` を読み、その和を出力し、次に商と余りを一行に、最後に `a / b` を小数点以下二桁の浮動小数点数として出力します。

Rust では二つの `i64` 値に対する `/` は整数除算で、`%` は余りです。`a as f64` が変換で、`/` より強く結びつくので、`a as f64 / b as f64` は二つの浮動小数点数を割ります。`println!` の `{:.2}` は小数点以下二桁を出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "let q = a / b; の次に let r = a % b; — どちらも i64 です。let f = a as f64 / b as f64; は割る前に変換します。",
  "a as f64 / b はコンパイルできません: f64 を i64 で割ることはできません。",
]

