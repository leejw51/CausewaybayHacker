Go では `sync.Mutex` は二つのメソッド — ロックを取るものと放すもの — を持つ値で、カウンタはただの変数です。規律はあなた次第です: 取る、足す、放す。Go のメソッド名は公開されるなら大文字で始まり、これらはそうです。ロックを取るのはどの行ですか?

