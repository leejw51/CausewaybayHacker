Rust には `enum Light { Red, Green, Yellow }` があり、それに対する `match` はすべてのバリアントを名指ししなければなりません: それぞれ腕一つ、`=>` の左に型付きのバリアント、右に結果、その後にカンマです。red に三十秒を与える腕はどの行ですか?

