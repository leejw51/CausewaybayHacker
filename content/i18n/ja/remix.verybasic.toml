# ---------------------------------------------------------------- 28
[[quest]]
id    = "remix.verybasic.28.comprehension-go"
title = "内包表記 — GO"
story = "注文票の数のうち厨房の分は偶数だけで、厨房はそれぞれを二乗したものを一息で欲しがっている。Gogo は Go で注文する。"
brief = '''
古いリストから、いくつかの要素を残し、それぞれを変換して新しいリストを作ります: 一つの式でフィルタとマップを。Python はこれを内包表記と呼んで専用の構文を持ち、Rust は同じことを言うイテレータの連鎖を持ち、Go はループで言います。プログラムは数を読み、偶数のものの二乗のリストを作って出力し、その合計を出力します。

Go に内包表記はありません。ループ*が*内包表記です: `for _, x := range nums`、フィルタには `if`、マップには `append` — Python の一行が四行になり、そのどれもが素朴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 4 16 36
        56
```
'''
hints = [
  "for _, x := range nums { if x%2 == 0 { squares = append(squares, x*x) } } — フィルタは if、マップは append です。",
  "squares := []int64{} は空で nil ではない状態から始まり、append が伸ばします。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "remix.verybasic.29.comprehension-rust"
title = "内包表記 — RUST"
story = "注文票の数のうち厨房の分は偶数だけで、厨房はそれぞれを二乗したものを一息で欲しがっている。Ferris は Rust で注文する。"
brief = '''
古いリストから、いくつかの要素を残し、それぞれを変換して新しいリストを作ります: 一つの式でフィルタとマップを。Python はこれを内包表記と呼んで専用の構文を持ち、Rust は同じことを言うイテレータの連鎖を持ち、Go はループで言います。プログラムは数を読み、偶数のものの二乗のリストを作って出力し、その合計を出力します。

Rust の内包表記はイテレータの連鎖です: `.iter()` がたどり、`.filter(|x| ...)` が残し、`.map(|x| ...)` が変換し、`.collect()` が `Vec` を組み立てます — 遅延評価で、`collect` まで何も実行されません。クロージャには `&i64` が見えるので、`*x` になります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 4 16 36
        56
```
'''
hints = [
  "let squares: Vec<i64> = nums.iter().filter(|x| *x % 2 == 0).map(|x| x * x).collect();",
  "filter のクロージャは参照への参照 — &&i64 — を受け取ります。だから x % 2 ではなく *x % 2 です。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "remix.verybasic.30.comprehension-python"
title = "内包表記 — PYTHON"
story = "注文票の数のうち厨房の分は偶数だけで、厨房はそれぞれを二乗したものを一息で欲しがっている。ニシキヘビは Python で注文する。"
brief = '''
古いリストから、いくつかの要素を残し、それぞれを変換して新しいリストを作ります: 一つの式でフィルタとマップを。Python はこれを内包表記と呼んで専用の構文を持ち、Rust は同じことを言うイテレータの連鎖を持ち、Go はループで言います。プログラムは数を読み、偶数のものの二乗のリストを作って出力し、その合計を出力します。

Python のリスト内包表記は一つの式です: `[x * x for x in nums if x % 2 == 0]` — 先にマップ、次にループ、それからフィルタ、すべて角括弧の中です。「nums の各 x について、x が偶数なら、x の二乗」という文のように読めます。

それをする行を選び、`# FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 5 6
output: 4 16 36
        56
```
'''
hints = [
  "squares = [x * x for x in nums if x % 2 == 0] — 式、for、if の順です。",
  "末尾の if はフィルタです。for の前の if は条件式になり、else が必要になります。",
]

