Rust では存在しないキーは問いで、エントリ API がその答えです: `counts.entry(key).or_insert(0)` は値への `&mut` を返し、必要なら先に 0 を挿入します。そして `*... += 1` がそれを通して書き込みます。キーは `String` なので `w.to_string()`、`counts[w]` で読み戻します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea bun tea milk tea
output: tea 1
        bun 1
        tea 2
        milk 1
        tea 3
        3
```
'''
hints = [
  "*counts.entry(w.to_string()).or_insert(0) += 1; の次に println!(\"{} {}\", w, counts[w]);",
  "counts[w] += 1 は E0594 です: HashMap は読むためには添字を使えますが、書くためには決して使えません。",
]

