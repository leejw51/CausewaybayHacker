# ---------------------------------------------------------------- 10
[[quest]]
id    = "remix.verybasic.10.closures-go"
title = "クロージャ — GO"
story = "注文にはどれも伝票番号が付く。番号を配るカウンタはそれを作った関数の中に住んでいて、ほかの誰も触れない。Gogo は Go で注文する。"
brief = '''
クロージャは、作られたスコープの変数を捕まえ、そのスコープが戻った後もそれを生かしておく関数です。`counter()` がそれを一つ作ります: 返されたクロージャを呼ぶたびに次の番号が配られます。プログラムは単語を読み、1 から番号を振り、最後にクロージャが次に配るはずの番号を出力します。

Go では関数リテラル `func() int { ... }` が `n` を参照で捕まえるので、中の `n++` は外の `n` を変えます。そして `counter` はそのリテラルを `func() int` 型の値として返します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "return func() int { n++; return n } を四行で — リテラルが n を捕まえます。",
  "counter の戻り値の型は func() int なので、リテラルも int と書く必要があります。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "remix.verybasic.11.closures-rust"
title = "クロージャ — RUST"
story = "注文にはどれも伝票番号が付く。番号を配るカウンタはそれを作った関数の中に住んでいて、ほかの誰も触れない。Ferris は Rust で注文する。"
brief = '''
クロージャは、作られたスコープの変数を捕まえ、そのスコープが戻った後もそれを生かしておく関数です。`counter()` がそれを一つ作ります: 返されたクロージャを呼ぶたびに次の番号が配られます。プログラムは単語を読み、1 から番号を振り、最後にクロージャが次に配るはずの番号を出力します。

Rust ではクロージャは `|| { ... }` で、`move` は `n` を一緒に持っていかせます — `move` がなければ、もうすぐスコープを抜けるローカル変数を借用することになります。捕まえたものを変更するので戻り値の型は `impl FnMut() -> i64` で、呼び出し側はそれを `mut` で束縛します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "move || { n += 1; n } を四行で — move が n をクロージャの中に持っていきます。",
  "move がないとクロージャは n を借用し、それを返すと E0373 です: n が十分長く生きません。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.verybasic.12.closures-python"
title = "クロージャ — PYTHON"
story = "注文にはどれも伝票番号が付く。番号を配るカウンタはそれを作った関数の中に住んでいて、ほかの誰も触れない。ニシキヘビは Python で注文する。"
brief = '''
クロージャは、作られたスコープの変数を捕まえ、そのスコープが戻った後もそれを生かしておく関数です。`counter()` がそれを一つ作ります: 返されたクロージャを呼ぶたびに次の番号が配られます。プログラムは単語を読み、1 から番号を振り、最後にクロージャが次に配るはずの番号を出力します。

Python ではクロージャは内側の `def` です。外のスコープの `n` を読むのは自由ですが、代入すると新しいローカル変数ができます — 内側の関数が先に、キーワード一つで `n` は外側のスコープのものだと宣言しない限り。その宣言はどの行ですか?

それをする行を選び、`# FILL` コメントの場所に打ってください。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "def next_id(): の下に nonlocal n、n += 1、return n — そして counter は next_id を返します。",
  "nonlocal がなければ n += 1 は UnboundLocalError です: 代入が、読まれる前に新しいローカルの n を作ってしまいました。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "remix.verybasic.13.structs-go"
title = "構造体 — GO"
story = "勘定の各行は名前、値段、数量で、一行の合計の出し方を知っているのはその行自身だ。Gogo は Go で注文する。"
brief = '''
構造体は名前付きのフィールドを一つの値にまとめ、メソッドはその型に付いた関数で、手元の値を `self` / レシーバとして受け取ります。プログラムは `name price qty` の行を読み、各行について名前と行の合計を出力し、最後に総合計を出力します。

Go ではメソッドは名前の前にレシーバを持つ関数です: `func (it Item) Total() int64`。レシーバは構造体のコピーです。`(it *Item)` ならポインタです。公開されるフィールドとメソッドは大文字で始まります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "func (it Item) Total() int64 { return it.Price * it.Qty } — レシーバは名前の前に、独自の丸括弧に入れて書きます。",
  "func Total(it Item) はただの関数です。it.Total() ではそれは見つかりません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "remix.verybasic.14.structs-rust"
title = "構造体 — RUST"
story = "勘定の各行は名前、値段、数量で、一行の合計の出し方を知っているのはその行自身だ。Ferris は Rust で注文する。"
brief = '''
構造体は名前付きのフィールドを一つの値にまとめ、メソッドはその型に付いた関数で、手元の値を `self` / レシーバとして受け取ります。プログラムは `name price qty` の行を読み、各行について名前と行の合計を出力し、最後に総合計を出力します。

Rust ではメソッドは `impl Item { }` ブロックに住み、`&self` はメソッドが構造体を受け取るのではなく借用することを示します。本体は `self.price * self.qty` です。最後の式が戻り値なので、`return` もセミコロンもありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "impl Item { fn total(&self) -> i64 { self.price * self.qty } } — &self は借用し、本体は式一つです。",
  "fn total(self) は Item を値で受け取り、&items 越しに呼ぶと E0507 です: 借用からムーブして取り出すことはできません。",
]

