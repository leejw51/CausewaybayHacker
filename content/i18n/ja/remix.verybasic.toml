brief = '''
マップはキーから値への対応で、要はまだ存在しないキーで何が起きるかです。プログラムは単語を読み、それぞれについてその単語の数を一つ増やし、単語とそこまでの数を出力し、最後に異なる単語がいくつあったかを出力します。

Go では存在しないキーはゼロ値として読まれるので、一つ増やすのにチェックは要りません: 読んで、一足して、格納する — Go で「もう一つ」を書く最短の形で。`counts[w]` で読み戻し、`len(counts)` がキーの数です。数を増やすのはどの行ですか?

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tea bun tea milk tea
output: tea 1
        bun 1
        tea 2
        milk 1
        tea 3
        3
```
'''
hints = [
  "counts[w]++ の次に fmt.Println(w, counts[w]) — 存在しないキーは 0 なので、インクリメントはそのまま動きます。",
  "map[string]int{} は書き込める空のマップです。nil のマップ (var counts map[string]int) は最初の書き込みで panic します。",
]

# ---------------------------------------------------------------- 26
