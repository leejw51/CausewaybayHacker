二つの文字列引数のうち一つを返す関数は、呼び出し側のデータへの参照を返します。Rust はその参照がいつまで有効かを尋ね、答えはシグネチャにライフタイム `'a` として書かれます。Go と Python にはガベージコレクタがあって決して尋ねないので、同じ関数にそんな印はありません。プログラムは二語の行を読み、各組の長い方を出力します。同じ長さなら一つ目です。

Go では `func longest(a, b string) string` は引数の一つを返し、それがいつまでかを誰も言う必要はありません: 文字列は不変で、何かが到達できる限りコレクタが保持します。同じ型の二つの引数は型名を共有します。

