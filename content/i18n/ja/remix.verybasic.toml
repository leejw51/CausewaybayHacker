# ---------------------------------------------------------------- 53
[[quest]]
id    = "remix.verybasic.53.mutex-rust"
title = "ミューテックス — RUST"
story = "壁に集計が一つ、常連の全員がそこに千回ずつ足す。チョークはきれいに手渡されなければならず、さもないと数が狂う。Ferris は Rust で注文する。"
brief = '''
いくつかのスレッドが一つの数に足すのは、足すたびに数をロックしない限りデータ競合です。ミューテックスがそのロックです: 取り、値を変え、放します。プログラムは数を読み、数ごとにスレッドを一つ起動し、それぞれがロックの下で共有カウンタに自分の数を千回足し、最後にカウンタを出力します。

Rust ではカウンタ*が*ロックです: `Arc<Mutex<i64>>` を `Arc::clone` で共有し、`.lock().unwrap()` で開けます。これはガードを返し、ガードは数に参照外しでき、文の終わりで drop されるとロックを解きます。`*guard += x` がそれを通して書き込みます。ロックなしで数に届く方法はありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 6000
```
'''
hints = [
  "spawn の前に let counter = Arc::clone(&counter);、次にループの中で *counter.lock().unwrap() += x;。",
  "* のない counter.lock().unwrap() += x は E0368 です: ガードは数ではなく、数に参照外しされるものです。",
]

