# TYPESCRIPT LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1):
# the prose of `content/typescript/cheatsheet.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live
# in the English pack, and are never translated. Code blocks, identifiers
# and printed strings are copied verbatim.

pack   = "typescript.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet.01.read-all"
title = "フィードまるごと"
story = "19:00、タイムズスクエアの上。大型スクリーンのフィードが一度に届き、そのすべてを求めている。"
brief = '''
Node で、標準入力の**すべて**を一つの `string` として `input` に読み込んでください。
'''
hints = [
  "ファイルディスクリプタ 0 が stdin です。エンコーディングを渡さないと、文字列ではなく Buffer が返ります。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet.02.lines"
title = "幽霊の行はなし"
story = "怡和街の電光掲示板はどのメッセージも改行で終わり、最後の行はいつも空っぽだ。"
brief = '''
`input` は改行で終わります。末尾に空文字列が**残らない**ように `lines` に分割してください。
'''
hints = [
  "`\"a\\nb\\n\"` を改行で分割すると三つに分かれ、最後は空です。先に trim してください。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.cheatsheet.03.numbers"
title = "文字を数に"
story = "駱克道の宝くじ売り場は、当選番号を文字の帯から読み取る。"
brief = '''
`lines[1]` は `"3 1 2"` です。`nums` を `number[]` の `[3, 1, 2]` にする行はどれ?
'''
hints = [
  "`map` は二番目の引数にインデックスを渡し、`parseInt` はそれを基数として受け取ります。`Number` は引数を一つだけ取ります。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.cheatsheet.04.to-fixed"
title = "小数第二位"
story = "軒尼詩道の両替所は、どのレートもきっちり小数第二位まで表示する。"
brief = '''
`const x = 3.14159;` `3.14` を出力してください — **小数点以下**ちょうど二桁。
'''
hints = [
  "`toPrecision` は有効数字を数えます。小数の桁数を数えるのはもう一方のメソッドです。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet.05.floor-div"
title = "半券はなし"
story = "トラムのトークン七枚を二人で分ける。半分のトークンをもらう人はいない。"
brief = '''
`a = 7`、`b = 2`、どちらも非負の整数です。`q` は `3` でなければなりません — 整数除算。
'''
hints = [
  "number はすべて浮動小数点です: `/` は 3.5 を返します。切り捨ててください。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.cheatsheet.06.for-of"
title = "キーではなく値"
story = "記利佐治街の看板を一枚ずつ読む — 番地ではなく、店の名前を。"
brief = '''
`arr: number[]` の**値**(インデックスではなく)を回るループを始めてください。
'''
hints = [
  "`in` はキー、つまり文字列のインデックスを回ります。`of` が値を回ります。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.cheatsheet.07.sort"
title = "9 の次は 10"
story = "そごうのカウンターの整理券: アルファベットが何と言おうと、10 は 9 の次だ。"
brief = '''
`arr: number[]` には `[10, 9, 1]` が入っています。**値の昇順**にその場でソートしてください。
'''
hints = [
  "比較関数がないと `sort` は文字列で比べるので \"10\" < \"9\" になります。比較関数は数を返します: 負なら `a` が先のまま。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.cheatsheet.08.count"
title = "集計"
story = "大牌檔は料理ごとに注文を数え、新しい料理はゼロから始まる。"
brief = '''
`m: Map<string, number>`。キー `w` のカウントに 1 を足してください。まだなければ 0 から始めます。`strict` は有効です。
'''
hints = [
  "`get` は `number | undefined` を返します。ない場合のデフォルトを `??` で与えてください。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.cheatsheet.09.grid"
title = "フロアマップ"
story = "ウィンザーハウス、階ごと店ごと: すべての区画が空いている n×m の図面 — 階ごとに別々の。"
brief = '''
ゼロで埋めた `n`×`m` のグリッド `g` を作ってください。`g[0][0] = 1` と書いたとき、**その一マスだけ**が変わるように。
'''
hints = [
  "`fill` に配列を渡すと、すべての枠に同じ配列が入ります。インデックスごとに新しい行を作ってください。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.cheatsheet.10.heap-parent"
title = "上にいるのは誰"
story = "標準ライブラリにヒープはないので、ミニバスの列は自前のヒープを持つ — ただの配列で。"
brief = '''
二分ヒープが 0 始まりの配列 `h` にあります: インデックス `p` の子は `2*p + 1` と `2*p + 2` です。`i > 0` のとき、`i` の親を求める行はどれ?
'''
hints = [
  "子の式を逆にたどる: 1 を引いて半分に、切り捨て。`i = 2` で試してみてください。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet.11.char-code"
title = "A はゼロ"
story = "銅鑼湾広場のロビーの郵便受けは、a から z の文字で、ゼロから番号が振られている。"
brief = '''
`s` はすべて小文字です。インデックス `i` の文字を 0..25 の `k` に変えてください。`'a'` が 0 です。
'''
hints = [
  "文字列は引き算できません。まず文字のコードを数として取り出してください。'a' は 97 です。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet.12.unknown-catch"
title = "正体不明の throw"
story = "真夜中前に届くフィードが何かを投げる。それが Error だと約束した者はいない。"
brief = '''
`strict` のもとでは、`catch (e) { … }` の `e` は `unknown` 型です。コンパイルが通り、決してクラッシュしない形でその `message` を出力してください。
'''
hints = [
  "`unknown` からはプロパティを読めません。まず実行時のチェックで絞り込んでください。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet.13.map-entries"
title = "キーと数"
story = "大牌檔の集計が終わった。今度は店主がそれを料理ごとに、横に数を添えて読み上げる。"
brief = '''
`m: Map<string, number>`。`m` の**すべて**のペアを、キーを `k`、値を `v` に入れて回るループを始めてください。
'''
hints = [
  "Map はペアとして反復されます — 一つずつ分割代入してください。`Object.entries` は自身のプロパティしか見ず、Map にはそれが一つもありません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.cheatsheet.14.head-tail"
title = "先頭と残り"
story = "ジャーディンズ・バザールの列の最初のバスは今出る。後ろの全員は一緒に待つ。"
brief = '''
`a: number[]` は `[5, 6, 7]` です。一つの宣言で、`first` を数 `5` に、`rest` を `number[]` の `[6, 7]` にしてください。
'''
hints = [
  "角括弧で分割代入します。残りを集めるのはドット三つで、二つではなく、星でもありません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.cheatsheet.15.zero-is-a-value"
title = "ゼロも値"
story = "希慎廣場の 0 階は本物の階だ。エレベーターのパネルはデフォルトの階へ送ってはいけない。"
brief = '''
`x: number | undefined`。`x` が定義されているとき — **`x` が `0` のときでも** — `d` を `x` に等しくし、`x` が `undefined` のときだけ `10` にしてください。
'''
hints = [
  "`0` は falsy なので、「truthy か?」と尋ねるものはどれもゼロを捨ててしまいます。代わりに「null か undefined か?」と尋ねてください。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.cheatsheet.16.await-all"
title = "一度に全部"
story = "六人の配達ライダーが糖街を一緒に出発した。厨房は六人全員を待つ。一人ずつ順番にではなく。"
brief = '''
`async` 関数の中で、`ps: Promise<number>[]` です。すべてを一緒に待って、`rs` をすべての結果の `number[]` にしてください。
'''
hints = [
  "配列を await しても同じ Promise の配列が返るだけです。まず一つの Promise にまとめて、それを await してください。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.cheatsheet.17.param-property"
title = "一行クラス"
story = "午砲は口径を固定して一度だけ作られ、砲台の外の誰もその設定を読まない。"
brief = '''
`class P { … }` の本体にはコンストラクタの行が一つあるだけです。それは `x: number` を受け取り、フィールド `x` として保存します。このフィールドは **private**(クラスの外で `p.x` を読むとコンパイルエラー)かつ **read-only**(後で `this.x` に代入するとコンパイルエラー)です。`strict` は有効です。
'''
hints = [
  "コンストラクタの引数に付けた修飾子がフィールドを宣言し、代入します。アクセス修飾子は読み取り専用の修飾子より前に来ます。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.cheatsheet.18.typeof-narrow"
title = "文字列か"
story = "百德新街の看板は名前のときもあれば数字のときもある。大文字で叫ばれるのは名前だけだ。"
brief = '''
`v: string | number`、`strict` は有効です。その中で `v.toUpperCase()` がコンパイルできる `if` を開いてください。
'''
hints = [
  "プリミティブは何のインスタンスでもありません。プリミティブを絞り込む実行時チェックは、小文字の文字列と比較します。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.cheatsheet.19.bigint"
title = "安全圏の向こう"
story = "銅鑼湾避風塘は 1883 年からのすべての波を数えている。float はとっくに数え損ねた。"
brief = '''
`target` は ES2022 です。`big` を、ちょうど `9223372036854775807` — 2 の 63 乗引く 1 — を持つ `bigint` にしてください。
'''
hints = [
  "`number` は 64 ビットの float です: 2^53 を超えると丸められ、後から変換しても丸めは残ります。すべてのオペランドに `n` が要ります。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.cheatsheet.20.toward-zero"
title = "ゼロへ向かって"
story = "真夜中の海底トンネルの料金所: 八ドルの返金を三人で分ける。ブースの C プログラマーはゼロへ向かって丸める。"
brief = '''
`a = -8`、`b = 3`、どちらも整数です。`q` は `-2` でなければなりません — C、Go、Rust の整数の `/` と同じように、**ゼロへ向かって**丸めた商です。
'''
hints = [
  "切り下げも四捨五入も、ここではどちらも -3 になります。欲しいのは符号に関係なく小数部を切り落とすことです。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.cheatsheet.21.push"
title = "列の最後尾"
story = "登龍街のミニバスの列にもう一人乗客が加わる — 乗客が加わる場所、最後尾に。"
brief = '''
`a: number[]`、`x: number`。`x` を `a` の **末尾** にその場で加え、後で `a` が一要素長くなるようにしてください。`strict` は有効です。
'''
hints = [
  "`concat` は新しい配列を作り、`a` には触れません。その場で変えるメソッドが返すのは配列ではなく新しい長さです — 代入し戻してはいけません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet.22.inclusive-loop"
title = "一から十まで"
story = "リー・ガーデンのエレベーターは 1 階から 10 階まで全部の階に止まり、十階目は省略できない。"
brief = '''
本体が `i = 1, 2, … 10` で — `10` を含めて **十** 回 — 実行されるループを開いてください。`i` はほかのどこにも宣言されていません。`strict` は有効です。
'''
hints = [
  "カウンタは変更を許されるもので宣言し、最後の値がまだ通るように比較してください。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.cheatsheet.23.add-function"
title = "数が二つ入る"
story = "軒尼詩道の両替所は二つの金額を足す。strict の下では、それがどんな種類の金額かも知りたがる。"
brief = '''
`add(2, 3)` が `5` で、ファイルが `strict`（`noImplicitAny` が有効）の下でコンパイルされるように `add` を定義してください。
'''
hints = [
  "型のない引数は暗黙の `any` で、strict はそれを拒みます。`return` のない本体は `undefined` を生みます。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.cheatsheet.24.join"
title = "接着剤"
story = "そごうのアナウンサーが当選した屋台を読み上げる: 名前と名前の間に空白一つ、コンマはなし。"
brief = '''
`xs: string[]` は `["a", "b", "c"]` です。`a b c` を印字してください — 要素を **空白一つ** で区切って。
'''
hints = [
  "このメソッドは区切り文字ではなく配列にあります — そして引数なしで呼ぶと、区切りはコンマです。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.cheatsheet.25.empty-check"
title = "誰も並んでいない"
story = "03:00 のジャーディンズ・バザールのバス停。誰か待っているか? 空の列もやはり列だ。"
brief = '''
`a: number[]`。`a` に要素がないときに **だけ** 入る `if` を開いてください。`strict` は有効です。
'''
hints = [
  "空の配列は真で、二つの配列が互いに `===` になることはありません。いくつあるかを言う一つの数を比べてください。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet.26.max-of-array"
title = "一番高いもの"
story = "グロスター・ロード沿いの塔のうち、事務員が欲しいのは一番高いもの — 二つ組からではなく、リストから。"
brief = '''
`arr: number[]` は `[3, 9, 2]` です（短い配列）。`m` を数 `9` にしてください。
'''
hints = [
  "`Math.max` は数を一つずつ取り、配列は取りません — 配列を渡すとコンパイルエラーです。配列を別々の引数に展開してください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet.27.copy"
title = "自分のコピー"
story = "タイムズスクエアのチケットリストは夜勤のためにコピーされる。一方のリストへの変更がもう一方に現れてはならない。"
brief = '''
`a: number[]`。`b` を同じ要素を持つ **別の** 配列にして、後の `b[0] = 9` が `a` を変えないようにしてください。
'''
hints = [
  "配列の代入は要素ではなく参照をコピーします。`Array(a)` は `a` を唯一の要素とする新しい配列を作ります。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet.28.reverse-string"
title = "逆さま"
story = "パーシバル・ストリートのネオン看板を、トラムの上階から後ろ前に読む。"
brief = '''
`s` は `"abc"` です。`r` を **文字列** `"cba"` にしてください。
'''
hints = [
  "文字列に `reverse` はなく、配列にはあります。配列へ行って戻ってください — そして何も渡さないとき `join` が断片の間に何を置くかに注意。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.cheatsheet.29.queue-front"
title = "列の先頭"
story = "ビクトリア・パークから出発する BFS: 最初に入った停留所が最初に出て、列から去る。"
brief = '''
`q: number[]` は `[1, 2, 3]` で、FIFO キューとして使います。先頭の項目を **取り除いて** `x` に入れてください — `x` が `1`、`q` が `[2, 3]` として残るように。
'''
hints = [
  "`pop` は末尾から取り、インデックスは取り除かずに読みます。先頭から取るメソッドは残りすべてを一つ前に詰めます。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.cheatsheet.30.wrap-modulo"
title = "折り返し"
story = "また真夜中の海底トンネルの料金所: 七ドル足りず、車線は三つ、それでも車線番号は 0、1、2 のどれかでなければならない。"
brief = '''
`b = 3`。`a` は `-7`、`0`、`4` のいずれかになりうる整数です。`r` を数学的な余り — 常に `0..b-1` の範囲で、`-7` なら `2`、`0` なら `0`、`4` なら `1` — にしてください。
'''
hints = [
  "`%` は左オペランドの符号を保つので、`%` 一回では -7 に対して -1 になります。`b` を足すと負の数は直りますが `0` と正の数が壊れます。それをどうにかしてください。",
]
