# ---------------------------------------------------------------- 19
[[quest]]
id    = "python.cheatsheet.19.ripples"
title = "波紋"
story = "ビクトリア・パークから雨水が一区画ずつあふれ出す。水は遠い通りより近い通りに先に届き、地図はそれぞれ何区画かかったかを示さなければならない。"
brief = '''
グリッド上の BFS：`dist` は `(sr, sc)` からの**最短**の歩数を持たなければ
ならないので、マスは入れた順に、O(1) で取り出さなければなりません。空欄に
入る行はどれですか？

```
q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
hints = [
  "deque はどちらの端からも O(1) で取り出せます。どちらの端を取るかで、これがキューになるかスタックになるかが決まります。",
]

