# TYPESCRIPT LAND — ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/typescript/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "typescript.advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.advanced.01.conversions"
title = "ひとつの名前、ひとつの形"
story = "19:00、三十階のコントロールルーム。フィードはタイムズスクエアの枠の値段をテキストで送り、請求画面はそれを数として欲しがり、大画面はドルで欲しがる。"
brief = '''
一行読んでください: セント単位の金額で、数字だけです。

三行を出力します:

1. 前後の空白を取り除いたテキストの文字数
2. 数としての金額
3. 小数ちょうど二桁のドル表記の金額

```
input:  1234
output: 4
        1234
        12.34
```

金額は負ではありません。Python ならひとつの名前を三回束縛し直すところです。
TypeScript はそれを許しません: 名前は生まれたときの型を持ち続けます。だから

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

は一行も走らないうちに失敗します。それが契約の仕事です。形ごとに自分の `const`
を与えてください — テキスト、数、ドル — そうすれば読む人は、名前がいま何を
持っているかを知るために上へスクロールしなくて済みます。

ドルは浮動小数点を通さずに出してください。`(1234 / 100).toFixed(2)` は今日は
たまたま動き、`0.1 + 0.2` は毎日 `0.30000000000000004` です。
`Math.trunc(cents / 100)` と `cents % 100` がちょうど二つの半分で、
`String(cents % 100).padStart(2, "0")` が二つ目を埋めます。
'''
hints = [
  "文字列を持っているうちの text.length が一行目です。",
  "const cents: number = Number(text) は新しい型を持つ新しい名前です。そこに `text` を使い回すと TS2322 になります。古い契約がまだ生きていると、コンパイラが教えているのです。",
  "padStart(2, \"0\") は左側を幅二まで埋めます: 5 セントは 0.05 で、0.5 ではありません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.advanced.02.control-flow"
title = "どの枠か"
story = "タイムズスクエアの画面はローテーションで回る: 三枠ごとに広告、五枠ごとにニュース。スケジューラは毎回枠の番号を出力し、画面は十二メートルの数字を映す。"
brief = '''
整数 `n` をひとつ読み取ってください。`1` から `n` までの各 `i` について、一行ずつ出力します:

* `i` が 3 でも 5 でも割り切れるなら `ADNEWS`
* `i` が 3 で割り切れるなら `AD`
* `i` が 5 で割り切れるなら `NEWS`
* それ以外は `i` そのもの

そのあと、`0` を読むまで一行に一つずつ整数を読み続け、途中で読んだ
ゼロでない行の数を `SKIPPED <k>` として出力します。

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

ループは二つ、種類も二つ。一つ目は始まる前に何回回るかを知っています:
`for (let i = 1; i <= n; i++)`。二つ目は知りません: `break` 付きの `for (;;)` か
`while (true)` です。回数は読んだものが決めるからです。
`i < n` はひとつ手前で止まります。ここで誰もが一度は書く off-by-one です。

標準入力はひとかたまりで届きます。`input.split("\n")` で行が得られ、それを
下へ歩くインデックスが、他の言語でいう「次の行を読む」です。
'''
hints = [
  "両方の場合を先に判定してください。さもないとその分岐は一度も通りません。3 と 5 で割り切れることは、15 で割り切れることです。",
  "i < n は n - 1 で止まります。スターターにはそのバグがあり、サンプル出力が一行早く終わります。",
  "== ではなく ===。`\"0\" == 0` は true で、`\"\" == 0` も true です。そうやって空行が、終わるべきでないループを終わらせます。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.advanced.03.arrays"
title = "掲示板の真ん中"
story = "怡和街のトラム停留所の掲示板は、夕方の最初のトラムと最後のトラムを示す。配車係はそのあいだのすべてに何席あるかを知りたい。"
brief = '''
標準入力は、一行目に個数 `n`、二行目にスペース区切りの `n` 個の整数です。
`n` は `1` 以上なので、出力すべき最初の値と最後の値は必ずあります。

三行を出力します: 最初の値、最後の値、そしてその二つに厳密に挟まれた値すべての
合計。値が三つ未満のときその合計は `0` です。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)` が真ん中です: コピーされた**新しい配列**で、負の終端は後ろから
数えます。`nums[nums.length - 1]` は最後の要素で、`nums.at(-1)` もそうです — ですが
型を見てください。インデックスは `number` と言います。コンパイラがあなたを信用して
いるからです。`at` は `number | undefined` と言います。配列は空でありえ、あなたの
配列がそうでないことをコンパイラは見られないからです。実行時にはどちらも同じ値です。
それについて正直なのは片方だけです。

`reduce((sum, v) => sum + v, 0)` が真ん中を合計します。`0` は飾りではありません:
**初期値なし**の空配列に対する `reduce` は
`TypeError: Reduce of empty array with no initial value` を投げ、要素が一つの入力では
真ん中は空になります。
'''
hints = [
  "nums[nums.length - 1] は最後の要素です。nums.at(-1) もそうで、その型はそこに無いかもしれないことを認めています。",
  "nums.slice(1, -1) は最初と最後以外のすべてです。値が一つか二つなら [] です。",
  "reduce には二番目の引数として 0 が要ります。さもないと空の真ん中は何もない合計になる代わりに例外を投げます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.advanced.04.strings"
title = "三つの長さ"
story = "ハイサン・プレイスの LED ウォールはティッカーの予算を `.length` で組む。トラムの絵文字には二、銅鑼灣には三かかり、その下のコントローラーは九と数える。"
brief = '''
一行読んでください。三行を出力します:

1. UTF-8 でエンコードしたときの **バイト** 数
2. **文字** 数 (Unicode コードポイント)
3. 文字を逆順にした行

```
input:  causeway
output: 8
        8
        yawesuac
```

JavaScript の文字列には長さが三つあり、`.length` は求められた二つのどちらでも
ありません。それは **UTF-16 コードユニット** を数えます: `"銅鑼灣".length` は `3` で
正しそうに見え、`"🚋".length` は `2` でそうではありません。文字は
`for (const ch of s)` と `[...s]` が歩くものです — 文字列のイテレータはコードポイント
ずつ進みます — ので、`[...s].length` が二行目です。

バイトは三つ目の数です。ここには `TextEncoder` も `Buffer` もありません:
`node.d.ts` はどちらも宣言しておらず、`tsc` は `TS2304: Cannot
find name` で止めます。代わりにコードポイントから数えてください — `ch.codePointAt(0)`
が `0x80` 未満なら一バイト、`0x800` 未満なら二、`0x10000` 未満なら三、
それより上はすべて四です。

`s.split("").reverse().join("")` は誰もが手を伸ばす逆順で、サロゲートペアを
真っ二つにします。`[...s]` を逆にしてください。
'''
hints = [
  "[...line] はコードポイントの配列で、その長さが文字数です。line.length は UTF-16 ユニットで、スターターはそれを二度出力します。",
  "for (const ch of line) もコードポイントずつ進むので、ch.codePointAt(0) は文字全体の番号で、ペアの半分になることはありません。",
  "split(\"\") はコードユニットで分けて絵文字を壊します。スプレッドした配列を逆にすれば各文字はそのままです。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.advanced.05.maps"
title = "ウォールが言っていること"
story = "ハイサン・プレイスのウォールは今夜フィードが送ってくる単語に順位を付ける。そこに出る数はどれも NaN だ。"
brief = '''
標準入力全体を読み、空白で分割してください。

相異なる単語をそれぞれ一度ずつ `<word> <count>` の形で、回数の降順、同点なら
単語の昇順で出力します。

```
input:  tram tram bus
output: tram 2
        bus 1
```

スターターは `Record<string, number>` に数えていて、型はどのキーも `number` を
持つと言います。実行時、誰も書いていないキーは `undefined` を持ち、
`undefined + 1` は `NaN` です — 例外もなく警告もなく、ウォールにただ間違った数が
出るだけです。`Map<string, number>` を使ってください: `counts.get(word)` の型は
`number | undefined` で、それが真実であり、`?? 0` がそれへの答えです。

エントリは比較関数で並べ替えます: 回数の降順は `b[1] - a[1]` で、それが `0` のときは
単語へ進みます。単語は `localeCompare` ではなく `<` と `>` で比べてください —
`localeCompare` はマシンのロケールに尋ねますが、掲示板はどのマシンでも同じに
読めなければなりません。
'''
hints = [
  "スターターが NaN を出力するのは、+= の前に counts[word] が undefined だったからです。Record 型は、そこに一度もなかった数を約束していました。",
  "counts.set(word, (counts.get(word) ?? 0) + 1) — get が取りこぼしを認め、?? がゼロを補います。",
  "b[1] - a[1] || wordOrder: 0 を返す比較関数は、同点を || の右側に渡します。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.advanced.06.sets"
title = "両方の画面が流すもの"
story = "怡和街をはさんで二つの画面が向かい合う。広告主は、同じ交差点で二度流すためにお金を払っているクリップがどれかを知りたい。"
brief = '''
標準入力は二行で、それぞれスペース区切りの画面のクリップです。一つの画面が
同じクリップを二度並べることがありますが、それは一つと数えます。

三行を出力します:

1. `BOTH` に続けて、両方のリストにあるクリップすべてを、並べ替えてスペース区切りで —
   何もなければ `BOTH -`
2. `ONLY_A <k>`: 一つ目のリストにあって二つ目にないクリップの数
3. `ALL <k>`: どちらかのリストにある相異なるクリップの数

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

`Set` に重複はありません。そして、この土地がコンパイルに使う `es2023` ライブラリ
では、`intersection` も `difference` も `union` もありません — それらは ES2025 で
加わったもので、`tsc` は `TS2339: Property 'intersection'
does not exist` でそう教えます。何が存在するかを決めるのは、実行する Node の
バージョンではなく、コンパイルに使うライブラリです。だから自分で書いてください:
`[...a].filter((x) => b.has(x))` が積集合、同じものを `!b.has(x)` にすれば差集合、
`new Set([...a, ...b])` が和集合です。

比較関数なしの `.sort()` は文字列を UTF-16 コードユニットで並べます。これらには
まさに正しく、数にはまさに間違いです。順位表は二つ先のクエストです。
'''
hints = [
  "new Set(tokens) は入るときに重複した sneakers を落とします。Set の個数は .length ではなく .size です。",
  "[...a].filter((x) => b.has(x)) が積集合です。判定を否定すれば差集合、両方を一つの Set にスプレッドすれば和集合です。",
  "both.length > 0 ? both.join(\" \") : \"-\" が空の場合を一つの式で扱います。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.advanced.07.functions"
title = "一時間あたり"
story = "料金表の画面枠は、特に書いていなければすべて一時間あたりだ。そして表のプリンタは、書いていない枠の下すべてに `/undefined` と書く。"
brief = '''
標準入力は個数 `n`、続いて `<NAME> <CENTS>` または `<NAME> <CENTS> <UNIT>` の
`n` 行です。

`<NAME> $<dollars>/<unit>` を小数二桁で返す `tag(name, cents, unit = "hour")` を
書き、一行に一つずつタグを出力してください。

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

スターターはコンパイルでき、走り、`TSQ $12.00/undefined` と出力します。理由を
見てください。`const [name, cents, unit] = line.split(" ")` は三つすべてを
`string` と型付けします。`split` は `string[]` を返し、コンパイラはその長さを
知らないからです。トークンが二つの行では実行時に `unit` は `undefined` で、
テンプレートリテラルはその単語を忠実に出力します。型は、配列が一度もしなかった
約束でした。

**デフォルト引数** が修正で、それが効く理由は知っておく価値があります: デフォルトは
引数が `undefined` のときに発動します — 省かれたとき、あるいは明示的に `undefined` が
渡されたとき。ここで `tag(name, cents, unit)` がしているのは後者です。`null` では
発動しません。シグネチャは、呼び出し側が何を省いてよいか、省いたら何が得られるかを
述べる契約です。
'''
hints = [
  "引数リストに unit: string = \"hour\"。それで修正のすべてです。",
  "デフォルトは undefined で発動します。わざと渡された undefined も含めてです。本体の中の `unit ?? \"hour\"` は同じ考えを呼び出し地点で綴ったものです。",
  "テンプレートリテラルの中の `$${...}` は、文字どおりのドル記号に続く埋め込みです。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.advanced.08.exceptions"
title = "数でない行"
story = "怡和街トラム停留所の到着掲示板はフィードから分の列を読む。その真ん中の一行に `xx` とある。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は整数のはずです。

各行について、値を二倍したもの、または整数でなければ `BAD <line>` を出力します。
最後に `SUM <total>` を出力します。合計は出力した値の和です。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")` は失敗しません。`NaN` を返し、`Number("1.5")` は `1.5`、
`Number("")` は `0` です。だからスターターの `double` はテキストをパターンと照らし
合わせて `NotANumber` を **投げ** ます — そして、何もそれを捕まえないので、
スターターは二行目でその例外によって死にます。

投げうる一つの呼び出しを `try`/`catch` で包んでください。`strict` のもとでは、
捕まえた値の型は **`unknown`** です: JavaScript の `throw` は何でも投げられます。
文字列も、数も、`undefined` も。そしてコンパイラはそうでないふりをしません。
`catch (NotANumber e)` はありません。自分で絞り込みます —
`if (err instanceof NotANumber)` — そして自分のものでなければ `throw err` で投げ
直します。そうすれば自分のコードのタイプミスは、悪い行として報告されずに、
ちゃんと大きな音を立てて失敗します。
'''
hints = [
  "スターターは NotANumber: not a whole number: xx で死にます。そのクラスが捕まえるべきものです。",
  "try ブロックは小さく保ってください: 失敗しうる呼び出しだけを中に入れ、出力と合計はその後に置きます。",
  "catch (err: unknown)、それから `if (err instanceof NotANumber)`。それ以外は `throw err` で投げ直します。何でも飲み込む catch は、プログラムが黙って失敗することを覚える方法です。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.advanced.09.array-methods"
title = "フィードを一回で下る"
story = "アレックスは for ループ三つとカウンター三つでできると言う。三つ目が終わるころには、ハイサン・プレイスのウォールへのフィードはもう先へ進んでいる。"
brief = '''
標準入力はスペース区切りの整数の一行です。

三行を出力します:

1. 偶数の値の合計 (なければ `0`)
2. `10` より大きい値すべてを二倍し、順番どおり、スペース一つで区切ったもの —
   なければ `-`
3. 相異なる値がいくつあるか

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

TypeScript には内包表記がありません。あるのは配列メソッドで、同じ考えを左から右へ
書いたものです: `filter` は残し、`map` は変換し、`reduce` は畳み込み、
`new Set(...)` は重複を除きます。どれも新しい値を返し、どれもインデックスを
必要としません。

`reduce` は初期値を取り、ここではそれは省けません: サンプルには偶数がありますが、
隠しケースの一つにはなく、
`[].reduce((a, b) => a + b)` は `TypeError: Reduce of empty array with
no initial value` を投げます。`reduce((sum, v) => sum + v, 0)` は何もないものを
`0` に合計します。

負の数: JavaScript では `-4 % 2` は `-0` です。`-0 === 0` は `true` なので偶数の
判定は問題ありません — ですが数はテンプレートリテラルを通して出力してください。
そこでは `` `${-0}` `` は `"0"` です。裸の `-0` を決して `console.log` に届かせない
でください。
'''
hints = [
  "nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0) — 残して、畳み込む。0 が開始時の合計です。",
  "filter が先、map が後: 元の値で絞り込み、生き残ったものを二倍します。",
  "new Set(nums).size が相異なる数です。Set は数を値で比べるので、二つの 12 は一つです。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.advanced.10.from-entries"
title = "同じ一回を、キー付きで"
story = "リー・ガーデンのショッピングアプリは今夜の値段を、店が打ち込んだ順のペアのリストで受け取る。セールのバナーはそれを一枚の掲示板として欲しがり、しかも二度欲しがる。"
brief = '''
標準入力は個数 `n`、続いて `<ITEM> <PRICE>` の `n` 行です。`PRICE` はセント単位の
整数です。品物は多くても一度しか現れず、`n` は `1` 以上です — 名前を挙げるべき
いちばん安い品物は必ずあります。

三行を出力します:

1. 値段が **100 より厳密に大きい** 品物すべてを `ITEM=PRICE` の形で、品物で並べ替え、
   スペース一つで区切ったもの — なければ `-`
2. すべての品物を、値段を **半分にして切り捨てた** もので、同じ形式、品物で
   並べ替えて
3. `CHEAPEST <item>` — いちばん安い値段、同点なら品物の昇順

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)` は `[key, value]` のペアからキー付きオブジェクトを一つの
式で作り、`Object.entries(obj)` はそれをまた分解します — なので
`Object.fromEntries(Object.entries(prices).filter(...))` は絞り込んだ掲示板、
同じものに `.map(([k, v]) => [k, Math.floor(v / 2)])` を使えば変換した掲示板です。
どちらも空のオブジェクトとそれを埋めるループを必要としません。

並べ替えてから出力してください。並んでいるように見えてもです。オブジェクトは
文字列キーを挿入順に保ちますが、配列のインデックスに見えるキーは **例外** です —
どの順で届いても、`"7"` が `"10"` より前、それが `"SCARF"` より前です。商品番号を
キーにした掲示板は勝手に並び替わってしまいます。欲しい順序ははっきり言ってください。
'''
hints = [
  "Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100)) — 分解して、残して、また組み立てる。",
  "Object.entries(obj).sort(byKey) はキーの順に [key, value] のペアを与えます。まさに ITEM=PRICE が欲しいものです。",
  "いちばん安いものには、値段で並べ替え、値段が同じなら名前へ進みます: a[1] - b[1] || byKey(a, b)。最初のエントリが勝ちです。",
]

