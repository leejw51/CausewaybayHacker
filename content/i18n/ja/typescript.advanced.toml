`function*` は呼んでも走りません。ジェネレーターオブジェクトを返し、本体は、何かが
次の値を求めるたびに一歩ずつ走ります — `for...of`、スプレッド、`Array.from`。
だから百万個の値の配列を一度も存在させずに、百万個の値を記述できるのです。

