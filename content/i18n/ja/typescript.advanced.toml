[[quest]]
id    = "typescript.advanced.30.error-classes"
title = "自分のエラー"
story = "広告予約システムの四つの層がそれぞれ自分のものを投げ、予約画面はそのうち一つを捕まえて、ほかのものに倒される。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は時間単位の予約の長さのはずです。

エラーの階層を定義してください: 基底として `PriceError extends Error`、それを継承する
`NotANumber` と `Negative`。`Negative` は時間数を持ち、そのメッセージは
`negative hours: <h>` です。`NotANumber` のメッセージは `not a number` です。
`price(text)` はテキストを `BigInt(text)` で変換し — 整数でないものには何でも
`SyntaxError` を投げます — **`SyntaxError` を `cause` にして** `NotANumber` を投げ、
負の長さを拒否し、それ以外は `500 + 100 * hours` を返します。

各値段かエラーのメッセージを出力し、それから `ERRORS <k>` を出力します。**基底
クラス** へ、一度だけ絞り込んでください。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative hours: -2
        ERRORS 2
```

スターターは `err instanceof Negative` で絞り込み、それ以外をすべて投げ直すので、
`xx` の行が捕まらない `NotANumber` でプログラムを倒します。`err instanceof PriceError`
は階層のどのメンバーに対しても true で、`err.message` がメッセージです — それは
ハンドラではなく、`super(...)` に渡されてクラスの中に住んでいます。

`new NotANumber({ cause })` — `ErrorOptions` は `es2022` ライブラリにあります — は
下にある `SyntaxError` を記録します。ここでは何もそれを出力しません。捕まらなかった
ものなら、スタックトレースの下の `[cause]:` ブロックとして出力されます。その連鎖が、
それを渡す理由です。

`class X extends Error` と `instanceof X` が動くのは、ターゲットが `es2022` だから
です。ES5 までコンパイルし下げると、`Error` のサブクラスはプロトタイプを失い、
`instanceof` は黙って `false` を返します — 古いコードベースが
`Object.setPrototypeOf(this, new.target.prototype)` だらけな理由です。
'''
hints = [
  "err instanceof PriceError — 基底クラスが両方のサブクラスを覆います。それが基底クラスを持つ意味です。",
  "instanceof の検査の後、err は PriceError で、err.message は型検査を通ります。その前、err は unknown で、何も通りません。",
  "TypeScript の catch には型のフィルターがないので、instanceof の検査の順が Python の except 節の順になります: 基底クラスの後に検査したサブクラスは死んだコードで、何も警告してくれません。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "typescript.advanced.31.iterator"
title = "止まるまで NEXT"
story = "リー・ガーデンの行列の発券機は、始まりから一定の刻みで番号を配り、そのリストを持っていない。そして行列の画面はいつも、機械が出したより一枚少ない整理券を示す。"
brief = '''
標準入力は三つの整数: `start`、`step`、`count` です。

**イテレータプロトコルを手で** 実装するクラス `Tickets` を書いてください:
`[Symbol.iterator]()` は `this` を返し、`next()` は `count` 個の値それぞれについて
`{ done: false, value }` を、それから `{ done: true, value: undefined }` を返します。
各値を一行ずつ出力し、それから二つ目の `Tickets` を歩いて計算した `SUM <total>` を
出力します。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

これがジェネレーターがあなたの代わりに書いてくれるものです。`for...of` はそのものに
対して `[Symbol.iterator]()` を一度呼び、それから結果が `done: true` と言うまで、その
結果に対して `next()` を呼びます — そして `done: true` と言う結果は、**値も含めて**
二度と見られません。スプレッド、`Array.from`、分割代入も同じです。

スターターの `next` は整理券を使い切った後で `done` を決めるので、最後の本物の整理券が
`done: true` の印付きで出ていき、`for...of` はそれを落とします。それは型検査を通ります:
`{ done: boolean, value: number }` はどちらにしても `IteratorResult<number>` に合います。
契約は結果がどんな形かを述べ、いつ終わったと言ってよいかは述べません。

`[Symbol.iterator]()` が `this` を返すのは **イテレータ** の印です: 一度歩けば使い
果たされます。**コンテナ** は毎回新しいイテレータを返し、何度でも歩けます。この道の
`Bag` がそれでした。どちらを書いているのかをはっきりさせてください。その違いは、
誰かが二度目にループしたときに現れます。
'''
hints = [
  "先に `left === 0` を確かめて { done: true, value: undefined } を返します。それから初めて整理券を取って { done: false, value } を返します。",
  "done の結果の値は for...of に無視されます。スターターの最後の整理券は done と言う結果の中にあり、だから画面も合計も最後の整理券の分だけ足りないのです。",
  "進める前に、返そうとしている値を保存してください。さもないと逆向きに一歩ずれます。",
]

