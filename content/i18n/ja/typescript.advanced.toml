ことはありません — に格納します。**すべて** を待ってから、結果を **インデックス順** に
一行に一つずつ出力し、それから `TASKS <n>` を出力します。

```
input:  3
        2 3 4
output: 4
        9
        16
        TASKS 3
```

`async` 関数を呼ぶと、すぐに始まります。最初の `await` までは同期的に走り、その時点で
`Promise` を返して、呼び出し側は先へ進みます。スレッドは一つです: タスクはそのあいだ
どこか別の場所で走っているのではなく、**止めて置かれて** いて、イベントループが
戻ってくるのを待っています — それができるのは、いま走っているコードがスレッドを
手放してからだけです。

スターターはすべてのタスクを始めてすぐに出力するので、どのタスクもまだ一つも枠を
埋めに戻っていないうちに枠を出力します: `undefined` が `n` 回。
`await Promise.all(tasks)` が合流です。すべてのタスクが決着するまでスレッドを手放し、
どれか一つが例外を投げたらすぐに reject します — それが、promise を床に落とさずに
持っておくもう一つの理由です。
'''
hints = [
  "出力ループの前に await Promise.all(tasks)。スターターはすでに tasks 配列を作っていますが、何もそれを待っていません。",
  "すべてのタスクを始めてから、すべてを待ちます。ここでは `for (const t of tasks) await t;` も正しいです。最初の await の前にタスクはすべて始まっているからです。",
  "results は square のクロージャに捕らえられています。main が出力するのと同じ配列で、だから合流の後に書き込みが見えるのです。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.advanced.19.mutex"
title = "カウンター一つ、画面八つ"
story = "島じゅうの画面が、三十階の一つきりの請求カウンターに再生回数を報告する。真夜中、カウンターは再生一回と言い、どの画面も報告したと誓う。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとに async タスクを一つ、一斉に始めてください。各タスクは共有カウンターを読み、
請求サーバーへ **往復** し (スターターの `roundTrip()`、イベントループ一回り)、
合計に自分の値を、ヒット数に一を足してカウンターを書き戻します。すべてを待ってから、
`TOTAL <sum>` と `HITS <n>` を出力します。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

JavaScript のスレッドは一つで、だから競合はないと言う人がいます。**データ** 競合は
ありません: 二つの行がまったく同じ瞬間に走ることはありません。ほかの種類はすべて
あります。スターターのタスクはみなカウンターを読み、みな往復で止まり、みな戻ってきて
`読んだもの + 自分の分` を書きます — そして各タスクが読んだのは `0` でした。最後に
書いたものが勝ちます: `TOTAL 4`、`HITS 1`、決定的に、毎回。読み込みと書き込みの
あいだの `await` は扉で、何でもそこを通り抜けられます。

往復は残してください。それが仕事です。読み込み、往復、書き込みの周りにロックを
かけてください。スターターには正しいシグネチャを持ち、中にロックのない `Mutex`
クラスがあります — `run` はクリティカルセクションを呼ぶだけです。Promise だけで
本物にしてください: `tail` という promise を持ち、各呼び出し側は tail に連なり、
それを自分の promise で置き換え、古いものを待ち、走り、例外がロックを持ったままに
できないよう `finally` で自分のものを resolve します。
'''
hints = [
  "スターターを実行してください: TOTAL は最後の値で、HITS は 1 です。どのタスクも、どのタスクも書き込む前にカウンターを読みました。往復が、みながすれ違った場所です。",
  "ロックは promise のキューです。`const ahead = this.tail; this.tail = <resolve できる新しい promise>; await ahead;` — それから走り、それから自分のものを resolve します。",
  "`finally` で resolve し、try の中では `return await critical()` とします。そうすれば解放はクリティカルセクションが終わった後に起こり、その promise が作られただけのときではありません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.advanced.20.channel"
title = "誰がフィードを閉じるか"
story = "コントロールルームは到着時刻をすべて怡和街の掲示板へのフィードに流す。最後の一つの後、掲示板は決して来ない次を待ち続け、それから暗くなる。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

一つのプロデューサータスクが、各値を十倍したものをイベントループ一回りに一つずつ
`Channel` に送り、それからそれを **閉じ** ます。メインタスクはチャネルが閉じたと
言うまで受信し、各値を出力して合計を保ち、それから `SUM <total>` と `CLOSED` を
出力します。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

スターターの `Channel` は完成しています: `send`、`receive`、そして待っている受信側を
すべて `undefined` で起こす `close`。プロデューサーは `close` を一度も呼ばないので、
最後の値の後、受信側は誰も決して resolve しない promise を待ちます。

Go ならそれは `fatal error: all goroutines are asleep - deadlock!` です。Python なら
ランナーが殺すまでのハングです。Node はどちらもしません。イベントループに、何かを
起こしうるものが何も残っていないとき — タイマーも、I/O も、immediate もない — プロセス
はただ **終了** します。ステータス `0` で、あなたの `for (;;)` の途中で。`SUM` の行も
`CLOSED` の行も走らず、外から見ると成功に見えます。それはクラッシュより悪く、
スターターがしていることです。

チャネルを閉じるのはプロデューサーです。決してコンシューマーではありません —
ストリームが終わったと知っている側が、それを終わらせる側です。
'''
hints = [
  "一行、制御の最後に: feed.close()。",
  "受信側はすでに `=== undefined` を確かめています。プロデューサーが送らなかったものを待っていたのです。`if (!value) break` でも止まります — 最初の 0 で。隠しケースの一つはそれを送ります。",
  "undefined がチャネル上の本物の値でありうるなら、receive は代わりに { done: true } | { done: false, value: T } を返すでしょう — イテレータの next() が返すのと同じ形で、同じ理由からです。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.advanced.21.worker-pool"
title = "八台のエンコーダー"
story = "ハイサン・プレイスのウォール用にレンダリングするクリップが四十本、ラックにはエンコーダーが八台。誰も四十台のエンコーダーは欲しくない。欲しいのは、決して立ち止まらない八台だ。"
brief = '''
標準入力は二つの整数 `w` と `n`、続いて `n` 個の値です。

`w` 個のワーカーのプールを走らせてください。各ワーカーはループします: まだ取られて
いない次のインデックスを取り、`await render(index, value)` — インデックスに応じた
何回かのイベントループの後に `[index, value * value]` を返します — そしてその組を
`results` に push し、インデックスが残らなくなるまで続けます。すべてのワーカーを待ち、
結果をインデックスで並べ替え、`<index> <value>` を一行に一つずつ出力し、それから
`WORKERS <w>` を出力します。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

組は仕事が **終わった** 順に届き、それは始まった順ではありません。結果にインデックスを
持たせることで、出力が毎回同じになり、それで並べ替えることが答えの最後の行です。

`const i = next++` にロックは要りません。前のクエストの後なら、その理由は知っておく
価値があります: `next` を読んでから増やすまでのあいだに `await` がないので、ほかの
ワーカーがそのあいだに入り込めません。ロックが必要だったのは、いつも `await` を
またぐときだけでした。

スターターは `workers.forEach(async (w) => {
await w; })` でワーカーを待っています。コンパイルでき、何も待ちません: `forEach` は
async のコールバックを呼び、promise を受け取り、それを捨てます。コールバックはどれも
await しますが、`main` はどれも await せず、空の結果を出力します。
'''
hints = [
  "forEach の代わりに await Promise.all(pool)。forEach は、コールバックが返すものを、async であろうとなかろうと決して待ちません。",
  "結果は終わった順に届きます。各組のインデックスが、それがどこから来たかの唯一の記録で、並べ替えがそれを元に戻します。",
  "`for (const running of pool) await running;` でも動きます。動かないのは、コールバックを取る配列メソッド — map、forEach、filter — を、コールバックを await してくれるかのように使うことです。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.advanced.22.async-await"
title = "ASYNC はどこで本当に走るのか"
story = "メイは四年間 `await` を書いてきて、それを動かしているものを一度も見たことがない。コントロールルームにはループが一つあり、島じゅうの画面がその上で順番を取る。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

`async function double(value)` は一度だけ譲り — `await null` — 値を二倍して返します。
`n` 個すべてを `Promise.all` で走らせ、各結果を入力順に出力し、それから `SUM <total>`
と `TASKS <n>` を出力します。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

スターターの `run` は値を `double` に通して **promise** の配列を得ます — そして
コンパイラにそれは数の配列だと言います:

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc` はそれを受け入れます。`as unknown as` は検査をやめろと伝える方法だからです。
キャストはほかのすべての型と一緒に消去され、実行時の配列は promise のままです:
出力は `[object Promise]` が三回と、それらをゼロにくっつけた文字列の `SUM` です。
キャストは変換ではありません。コンパイラが信じることを変え、値については何も
変えません。

`Promise.all` は promise を受け取り、どの順で終わっても、**渡した順に** 結果へ
resolve します。

すべてはどこで走るのか? 一つのスレッドの上で、順番に。`await null` は関数の残りを
**マイクロタスク** キューに入れ、Node はタイマーや immediate や I/O — マクロタスク —
に触れる前にそれを完全に空にします。千回の await の前に予約した
`setTimeout(..., 0)` でも、それらすべての後に走ります。ここに並列なものは何も
ありません。物事は順番に、止まってよいと言った場所で走ります。
'''
hints = [
  "キャストを消して tsc の言うことを見てください: Type 'Promise<number>[]' is not assignable to type 'number[]'。そのエラーが、キャストの隠していた真実でした。",
  "return Promise.all(nums.map((v) => double(v))) — await は呼び出し側、run(nums) が await されるところにあります。",
  "Promise.all は引数の順を保ちます。終わった順に結果が欲しければ、ワーカープールとまったく同じように、インデックスを自分で持ち運ぶことになります。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.advanced.23.work-queue"
title = "終わったと言うのは誰か"
story = "三人のオペレーターが画面更新のキューを片付け、シフトリーダーはキューが空だと言うのを待つ。キューは決してそう言わない。誰も更新が終わったと伝えなかったからで、23:10 にコンソール全体が暗くなる。"
brief = '''
標準入力は二つの整数 `w` と `n`、続いて `n` 個の値です。

`[index, value]` の組をスターターの `WorkQueue` に入れてください。`w` 個の
コンシューマータスクを始めます。それぞれ、組を取り、一回り待ち、`value * 10` を
`results[index]` に書き、`taskDone()` を呼ぶことを繰り返します。メインタスクは
`queue.join()` を await し、それからキューを閉じてコンシューマーの `get()` が
`undefined` を返して止まるようにし、それらを await し、それから結果をインデックス順に
出力し、`CONSUMERS <w>` を出力します。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join()` は、これまでに `put` されたすべての項目に対応する `taskDone()` があったときに
resolve します。スターターのコンシューマーはそれを一度も呼びません。なので `main` は
`join` を待ち、コンシューマーは決して来ない項目を `get` で待ち、誰かを起こしうる
ものはイベントループに何も残りません。

それが **デッドロック** です — みなが待ち、誰も動かない — そしてスレッドもロックも
要りません: 互いが動くのを待つ二つの promise で十分です。二つのタスクが二つの
async ミューテックスを逆の順で取るのは、同じことをもっと儀式ばってしたものです。
それへの Node の答えは前のマップのものと同じです: ループが干上がり、プロセスは
何も出力しないまま、ステータス `0` で終了します。

修正はまた一行、コンシューマー側です。
'''
hints = [
  "各項目を処理した後に queue.taskDone()。join は put と taskDone を突き合わせて数えるだけで、ほかには何も見ません。",
  "スターターを実行すると何も出力せずに 0 で終了します。クラッシュでもハングでもありません: イベントループが、起こりうることを使い果たしたのです。",
  "close() は get() で止まっているコンシューマーすべてを undefined で起こし、それが彼らのループを終わらせます。だから main は join の後にそれらを await できるのです。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.advanced.24.finally"
title = "ロックはそれでもかけ直される"
story = "コントロールルームは更新のたびに広告主の枠のロックを外し、終わったらまたかける。22:40 に悪い更新を受けた枠は、それからずっと外れたままだ。ロックをかけるコードが、失敗した行の後にあったからだ。"
brief = '''
標準入力は個数 `n`、続いて `<NAME> <CENTS>` の `n` 行です。`CENTS` は整数のはずです。

`OPEN <NAME>` を出力し、一度 yield し、`SHUT <NAME>` を出力するジェネレーター
`opened(name)` を書いてください — **本体が例外を上げたかどうかにかかわらず**。本体は
`for (const _ of opened(name))` のループで、セントを解析して合計に足します。
セントが解析できない行は、枠が閉じた後に `BAD <NAME>` として報告します。最後に
`TOTAL <sum>` と `REJECTED <k>` を出力します。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

ジェネレーターに対する `for...of` はリソースの見張り番で、理由はこうです: ループ本体が
早く抜けるとき — `break`、`return`、あるいは例外 — `for...of` はジェネレーターの
`return()` を呼び、それはジェネレーターを **`yield` の位置で**、その `yield` が
`return` 文であるかのように再開します。`yield` の後のコードは走りません。`yield` を
囲む `finally` の中のコードは走ります。スターターには `finally` がなく、`WONG` の枠は
決して閉じません。

TypeScript 5.2 にはまさにこのための `using` と `Symbol.dispose` がありますが、ここには
ありません: `es2023` ライブラリには `Symbol.dispose` がないので、`using` はコンパイル
できません。`try`/`finally` は `using` の材料です。

ジェネレーターの中でエラーを捕まえないでください。呼び出し側は `BAD` を出力したく、
それを飲み込んだジェネレーターは、何も起こらなかったかのように `TOTAL` を出力して
しまいます。
'''
hints = [
  "try { yield; } finally { console.log(`SHUT ${name}`); } — finally が、どの経路でも走る部分です。",
  "例外は、return() が finally を走らせた後に for...of を通って外へ出るので、main の catch はそれを見ます — だから BAD は SHUT の後に出力されます。",
  "ジェネレーターだけが方法ではありません: `body()` の周りに try/finally を置いた `withSlot(name, body)` 関数でも同じ仕事をします。ジェネレーターの形は、for...of が出ていくときに何をするかを見せてくれるものです。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.advanced.25.pipeline"
title = "フィードの段"
story = "怡和街の掲示板へのフィードは三十階で二つの段を通る: 一つは読み取り値を二乗し、次は累計を保つ。掲示板は一つずつ来たとおりに見るはずで、23:59 に夜の全部を見るのではない。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

**ジェネレーター** の二段のパイプラインを作ってください:

1. `squares(values)` は各値の二乗を yield する
2. `running(stream)` は任意の `Iterable<number>` を受け取り、累計を保ち、
   `[value, total]` の組を yield する

`main` は各組を `<square> <total>` として出力し、それから `PIPE <n>` を出力します。

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

どちらの段も配列を作りません。各 `yield` は一つの項目を次の段に渡して止まります。
`main` が引き、`running` が `squares` から引き、`squares` が入力から引きます。求め
られる前に計算されるものは何もなく、パイプライン全体が抱えている項目は一つだけです。

スターターの二段目は名前だけのジェネレーターです。ストリーム全体を歩き、それから
最後に **一度だけ**、最後の値と最終的な合計で yield します — そしてそれは完璧に型検査を
通ります。`Generator<[number, number]>` は各項目がどんな形かを述べ、いくつあるかに
ついては何も述べないからです。掲示板は真夜中に一行を受け取ります。
'''
hints = [
  "yield をループの中へ移してください: 値ごとに一度 yield [value, total]。",
  "スターターの出力は一行と PIPE 1 です。ループの後で yield する段は、余計な手順の付いた配列です。",
  "running(squares(nums)) が組み合わさるのは、ジェネレーターが Iterable だからです。running は、自分の入力が別のジェネレーターであることを知りもしないし、気にもしません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.advanced.26.toolbox"
title = "棚にない道具箱"
story = "コントロールルームのマニュアルは、同じフレームの連続をイテレータヘルパーで数えろと言う。三十階のコンパイラはそんなもの聞いたこともなく、夜のオペレーターは手で数える。"
brief = '''
標準入力は整数の一行です。

三行を出力します。どれも自分で書いたジェネレーターで作ります:

1. `SUMS` に続けて累積和 — `accumulate(values)`
2. `RUNS` に続けて、**隣り合う** 等しい値の各連続を `<v>x<k>` で —
   `runs(values)`
3. `PAIRS <k>`: **相異なる** 値の順序なしの組がいくつあるか —
   並べ替えた相異なる値に対する `pairs(items)`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Python には棚に `itertools` があります。JavaScript にはイテレータヘルパー —
`Iterator.prototype.map`、`.filter`、`.take` — がバージョン 22 から Node にあり、
それらはこの棚には **ありません**: `es2023` ライブラリはそれらを宣言していないので、
下の `node` がどれほど新しくても、`tsc` は `TS2339: Property 'map' does not exist` と
言います。使えるのは、ライブラリが宣言しているものと、import するものです。この
ファイルは ES の `import` で `"fs"` から `readFileSync` を import しています — それで
このファイルは **モジュール** になり、ターゲットが CommonJS なので `tsc` はそれを
`require` にコンパイルします。それ以外は、あなたが書きます。

`runs` は **隣り合う** 等しい項目だけをまとめます。個数ではありません。サンプルは
二つが食い違うように選んであります: `1` は四回、二つの連続に現れます。スターターは
二行目のために `Map` に数えていて、まさにその入力で間違えます。
'''
hints = [
  "accumulate は合計を保ち、各値の後でそれを yield します。最後に yield するものが和です。",
  "runs は進行中の連続を保ちます。次の値が違ったら、終わった連続を yield して新しいものを始めます — そしてループの後で、最後の連続を yield してください。ほかの誰もそれをしてくれません。",
  "pairs は j を i + 1 から始める二重ループです。個数は n*(n-1)/2 で、それを手で確かめることが、正しい n を持っていると分かる方法です。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.advanced.27.memo"
title = "解いたことを覚えておく"
story = "タイムズスクエアの画面のスケジューラは、同じ二つの数から同じローテーションを真夜中までに一万一千回、毎回一から解き直す。"
brief = '''
標準入力は `n k bits`: 二つの整数と二進数字の文字列です。

四行を出力します:

1. `FIB <fib(n)>` — **再帰** の `fib` を、自分で書いたメモ化する `memo(...)` で
   包んだものから
2. `PRODUCT <k!>` — `1..k` に対する掛け算の `reduce`。`k = 0` が `1` になるよう
   初期値付きで
3. `BIN <value>` — `fromBinary` が基数 2 として読んだ `bits`。基数を中に固定した
   一引数の関数です
4. `MISSES <m>` — memo が実際に本体を走らせた回数

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` は多くても `400` です。スターターのラッパーは呼び出しを数えるだけで何も覚えない
ので、`fib(10)` は 177 回の呼び出し、`fib(35)` は三千万回、`fib(90)` は終わりません。
キャッシュがあれば各 `fib(i)` は一度だけ走り、`MISSES` は `n + 1` です。

数は `number` に収まりません。`fib(90)` は `2880067194370816120` で、
`Number.MAX_SAFE_INTEGER` を超えており、`number` は一言もなくそれを間違って出力
します。**`bigint`** を使ってください: `0n`、`1n`、`BigInt(i)`。テンプレートリテラルは
bigint をその数字で出力します。`console.log(5n)` 単独では `5n` と出力します。

基数なしの `parseInt(bits)` は `1010` を千十と読みます。スターターはそうしています。
基数をクロージャの中に固定してください —
`(text: string) => parseInt(text, 2)` — それが Python の `functools.partial` です:
引数のいくつかがすでに決まっている関数。`bind` も同じことをしますが、**先頭の**
引数だけで、基数は二番目です。
'''
hints = [
  "memo はクロージャの中に引数から結果への Map を持ちます。ヒットなら Map から返し、ミスなら本体を走らせ、結果を格納し、数えます。",
  "fib は再帰の中でメモ化した fib を呼ばなければなりません。さもないと一番外側の呼び出しだけがキャッシュされます。fib を型付きで先に宣言しておくことが、アロー関数がそれを参照できるようにしています。",
  "reduce((a, b) => a * b, 1n) — 二番目の引数が開始値で、それが空の範囲を 1n にします。それも bigint でなければなりません: 1 * 1n は静かな変換ではなく TS2365 です。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.advanced.28.type-guard"
title = "描ければそれでいい"
story = "リー・ガーデンの案内画面は、二つの別々のシステムから同じフィードで届く店とサービスカウンターを一覧にする。知りたいのは、それぞれが自分を描けるということだけだ。"
brief = '''
標準入力は個数 `n`、続いて `n` 行で、各行は次のどちらかです

* `SHOP <NAME> <LEVEL>` — `<NAME> / L<LEVEL>` と描かれる
* `COUNTER <NUMBER>` — `COUNTER <NUMBER>` と描かれる

スターターの `parse` は各行を、フィードが送ってくるであろうものに変えます: 店には
`Shop` のインスタンス、カウンターには `render` メソッドを持つ **プレーンな
オブジェクト**。それらを `unknown[]` として渡します。それが回線を下ってきたものの
正直な型だからです。`Sign` であるすべての項目を `show` を通して出力し、それから
`SIGNS <k>` と `SHOPS <k>` を出力します — 後者は `instanceof Shop` で数えます。

```
input:  3
        SHOP LAM 4
        COUNTER 2
        SHOP WONG 1
output: LAM / L4
        COUNTER 2
        WONG / L1
        SIGNS 3
        SHOPS 2
```

`Sign` はインターフェースで、インターフェースは **消去** されます。実行時には尋ねる
べき `Sign` がありません — `x instanceof Sign` はコンパイルできません。右辺が意味
しうるものが何もないからです。`unknown` から `Sign` へ行くには **型ガード**
`function isSign(x: unknown): x is Sign` を書き、コンパイラはそれが返すものを何でも
信じます。コンパイラ自身は何も確かめません。

スターターのガードは `x instanceof Shop` を返します。それはコンパイルでき、立派な
ブール値で、そして間違っています: カウンターは形によって `Sign` であり、何のインスタンス
でもありません。ガードは嘘をつき、コンパイラはその言葉を信じ、カウンターは案内から
消えます。代わりに形を確かめてください —
`typeof x === "object"`、`x !== null`、`"render" in x`、そして
`typeof x.render === "function"` — まさにインターフェースが約束したことで、それ以上では
ありません。

`show(sign)` は実行時にディスパッチします: `sign.render()` は、オブジェクトが持つ
`render` を、プロトタイプ上でも自身の上でも見つけます。
'''
hints = [
  "修正のすべては isSign の本体です。カウンターはオブジェクトリテラルで、それがインスタンスであるものには名前がありません。",
  "\"render\" in x は x を、型 unknown の render プロパティを持つものへ絞り込みます。typeof x.render === \"function\" が残りを絞り込みます。どちらも本物の実行時の検査で、そこがスターターとの違いです。",
  "型ガードは本体と同じだけしか正直ではありません。`return true` もコンパイルできます。コンパイラは `x is Sign` を、`as` や `!` を信じるのと同じように信じます — そして三つとも型と一緒に消去されます。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.advanced.29.frozen"
title = "変わらない"
story = "今夜の料金表は 19:00 に readonly の印を付けてすべての画面に配られる。22:00 までに三つがそこに書き込み、一つはありもしない列を足している。"
brief = '''
標準入力は個数 `n`、続いて `<NAME> <CENTS>` の `n` 行です。

各行を `readonly` フィールドを持つ `Price` にしてください。それから各 price について、
その `cents` を上書きしようとし、その試みが例外を投げたら `FROZEN <NAME>` を出力
します。次に、フィールドが `count` 一つの `Tally`: それを設定し、それから綴りを
間違えた `cuont` を設定しようとし、*それ* が例外を投げたら `SEALED YES` を出力します。
最後に `IN_SET <k>` — 名前とセントで見て相異なる price がいくつあるか — と
`TOTAL <sum>` を出力します。

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SEALED YES
        IN_SET 2
        TOTAL 3300
```

`readonly` はコンパイラとの契約で、ここのすべての契約と同じく **消去** されます。
`price.cents = 0` はコンパイルできません — なのでスターターは広げた見方を通して
書きます。`(price as { cents: number }).cents = 0` は、readonly のプロパティが変更可能な
ものに代入可能なのでコンパイルでき、実行時には何も邪魔しません。料金表は書き込まれ、
`TOTAL` は `0` です。契約の実行時の半分は、コンストラクタの最後の
`Object.freeze(this)` です: 凍結したオブジェクトのプロパティへの代入は strict モードで
`TypeError` を投げ、`strict` のもとで `tsc` が出力するすべてのファイルは
`"use strict"` で始まります。

`Object.seal(this)` はもう一つの固定された形です: 既存のフィールドは書き込み可能な
まま、新しいもの — タイプミス — を足すと、誰も読まないフィールドを黙って作る代わりに
例外を投げます。コンパイラも、させてもらえれば `tally.cuont` を捕まえるでしょう。
スターターはさせませんし、`JSON.parse` もさせません。

そしてオブジェクトの `Set` は値ではなく **オブジェクト** を数えます: 二つの
`LAM 1200` の price は二つのメンバーです。二回の割り当てだからです。フィールドから
作った文字列 — `` `${name}:${cents}` `` — を集合のキーにすれば、それらは一つです。
'''
hints = [
  "Price のコンストラクタの最後の行に Object.freeze(this)。パラメータプロパティは本体が走る前に代入されるので、凍結するときにはもうそこにあります。",
  "Tally のコンストラクタに Object.seal(this)。クラスフィールドはコンストラクタ本体の前に初期化されるので、その時点で count は存在し、書き込み可能なままです。",
  "TOTAL は元のセントの合計で、それが成り立つのは書き込みが失敗したからです。スターターではその時点でどの price も 0 で、TOTAL は 0 です — readonly のフィールドは書き込まれ、何も一言も言いませんでした。",
]

