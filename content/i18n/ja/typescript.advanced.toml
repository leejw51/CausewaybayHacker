[[quest]]
id    = "typescript.advanced.32.containers"
title = "正しいコンテナ"
story = "サイネージのオフィスは今夜の再生ログを一本の長い配列に持ち、それについてのどんな質問にも、上から読んで答える。"
brief = '''
標準入力は三行: 単語の一行、すでに **昇順に並んだ** 整数の一行、そして整数 `x` 一つ。

四行を出力します:

1. `TOP <word> <count>` — いちばん頻度の高い単語、同点なら単語の昇順
2. `BISECT <l> <r>` — 並んだ整数の中で、値が `x` より小さくない最初のインデックスと、
   値が `x` より大きい最初のインデックス
3. `SMALLEST3` に続けて、スターターの `MinHeap` から取り出した最小の三つの整数 —
   それより少なければその数だけ
4. `GROUPS` に続けて、単語の各頭文字について `<letter>:<k>` を、文字の昇順で —
   頭文字をキーにした `Map<string, string[]>`

```
input:  tram bus tram bus ferry
        1 3 3 5 8
        3
output: TOP bus 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS b:2 f:1 t:2
```

標準ライブラリにはこの棚に `Map` と `Set` があり、ほかには何もありません — カウンター
も、ヒープも、bisect もありません。ヒープは書いてあります。残りはあなたのものです。

スターターは最高の回数を持つ、最初に見た単語を残します。ここではそれは `tram` で、
問題文は `bus` と言っています。何を意味しているかを述べるキーで同点を決着させて
ください。

二つの二分探索はそれぞれ一回の二分探索です: `lo` と `hi` を持ち、真ん中を見て、片方の
端を動かします — `Math.floor((lo + hi) / 2)` または `(lo + hi) >>> 1`。
その差が `x` がいくつあるかで、どちらも `x` がないときに失敗しません。`indexOf` は
そのとき、インデックスに見える `-1` で失敗します。ヒープは、いちばん小さいいくつかを
何度も何度も欲しいときの正しいコンテナです: 前から三つの値を読むためにすべてを
並べ替えることこそ、ヒープが避けるために存在するものです。

グループ: `groups.get(letter)` は `string[] | undefined` です。ミスのときはリストを
作って set し、それから push します。
'''
hints = [
  "[word, count] のエントリを回数の降順、それから単語の昇順で並べ替え、最初のものを取ります。一つのエントリを得るためにマップ全体を並べ替えるのは、この規模なら構いません。同じ規則で比べる一回の走査でも同じ答えです。",
  "フラグ付きの一つの bisect: sorted[mid] < x のあいだ lo を mid の先へ進めます — そして右の二分探索では sorted[mid] === x のあいだも。x がないとき indexOf は -1 を返し、隠しケースの一つがまさにそれです。",
  "Map はオブジェクトと同じく挿入順を保つので、出力する前に文字を並べ替えてください。[...groups.keys()].sort() が問題文の求める順です。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.advanced.33.cancellation"
title = "待つのをやめる"
story = "コントロールルームは島の地図を描き直す前に、すべての画面に状態を問い合わせる。天后の画面はネットワークカードが壊れていて決して答えず、だから地図は決して描き直されない。"
brief = '''
標準入力は個数 `n`、続いて `<SCREEN> <DOWN>` の `n` 行です。`DOWN` は、すぐに
答える画面なら `0`、ネットワークカードが壊れていてまったく答えない画面なら `1` です。

各画面について、その `ping(screen, down, token)` を **200 ms** の期限付きで `withTimeout` のもとで走らせ、
`<SCREEN> OK` または `<SCREEN> TIMEOUT` を入力順に出力してください。それから
10 ms のスリープで永遠にループする `watch(token)` タスクを始め、そのトークンを
キャンセルし、**それを await し**、その `catch` から `CANCELLED` を、`finally` から
`CLEANUP` を出力させます。最後に `TIMEOUTS <k>` を出力します。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

Promise はキャンセルできません。`.cancel()` はなく、タイマーとの `Promise.race` は
誰の言うことを *聞くか* を決めるだけです — 負けた方は走り続け、それがまだ保留に
しているもの、タイマーや購読は、あなたの最後の行の後も握られたままです。だから
キャンセルは **渡すもの** です: 仕事が確かめる、あるいは購読するトークンです。
スターターには一つあります。`cancel()` と `onCancel(handler)` を持つ `Token` です。
`sleep` は購読し、キャンセルされるとタイマーを消して `Cancelled` で reject します。
そして `silence` — 死んだ画面 — は、キャンセル以外の何も決着させない promise です。(`AbortController`
はプラットフォームによる同じものです。ここでは宣言されていません。)

`withTimeout(work, ms)` はトークンを作り、`work(token)` を、`Timeout` で reject **し**
トークンをキャンセルするタイマーと競わせ、仕事が勝ったときは `finally` で自分の
タイマーを消します。スターターはそれを一度も呼びません: `ping` を直接 await し、
`WONG` は決して答えません。Node がそれに何をするかは見てきました: 誰かを起こしうる
ものが何も残らないので、プロセスは `LAM OK` の後、ステータス `0` で終了します。

スターターは `watch` を await せずにキャンセルもするので、ウォッチャーが順番を得る前に
`TIMEOUTS` が出力されます — そしてウォッチャーが投げ直した `Cancelled` は誰にも
届かず、Node はそれを unhandled rejection として報告し、ステータス `1` で終了します。
`Cancelled` は `watch` の中で処理した後に投げ直してください: それを飲み込むことは、
タスクがキャンセルできなくなる方法です。タスクを await した場所で捕まえてください。
'''
hints = [
  "withTimeout: setTimeout が Timeout で reject してトークンをキャンセルする期限の promise、try の中で `return await Promise.race([work(token), deadline])`、そして finally で clearTimeout。",
  "`await watcher` が、TIMEOUTS が出力される前にタスクに catch と finally を走らせるものです。それは Cancelled をあなたに投げ直すので、それも捕まえてください — それだけを。",
  "finally で期限のタイマーを消してください。そうしないと、答えた画面もどれも 200 ms のタイマーを残し、プロセスは終了する前にその最後のものを待ちます: 出力は正しく、毎回遅くなります。トークンのキャンセルは、逆方向の同じ気遣いです。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "typescript.advanced.34.event-loop"
title = "イベントループ"
story = "サイネージのコントロールルーム、島じゅうの画面に対してスレッドは一つ。一つのコールバックが決して譲らず、天后からハイサン・プレイスまでのすべての掲示板が同じフレームで固まる。"
brief = '''
標準入力は二つの整数 `k` と `n` です。

`1..n` を `k` 個の連続した塊に分けてください — 塊 `i` は
`floor(n*i/k) + 1` から `floor(n*(i+1)/k)` まで (両端を含む) — そして各塊の二乗の和を
普通のループで、`bigint` として求めます。仕事が始まる前に、`main` は `setImmediate` で
掲示板の再描画を一つ予約し、それが `BOARD <finished>` を出力します: 掲示板が
スレッドを得たときに終わっていた塊の数です。掲示板はそれを **最初の塊の後、二つ目の
前に** 得なければなりません。各塊について `CHUNK <i> <sum>` をインデックス順に出力し、
それから `TOTAL <sum>`、それから `CHUNKS <k>` を出力します。

```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node はあなたの JavaScript を **一つのスレッド** で走らせ、建物じゅうの画面がそれを
待っています。走っているコールバックは、return するか `await` するまで中断されません
— タイマーにも、I/O にも、掲示板にも。スターターは各塊を `async` 関数で包み、
すべてを `Promise.all` に渡していて、並行に見えます。それは一本の長いコールバック
です: 中に `await` のない `async` 関数は、呼ばれた瞬間に最初から最後まで走ります。
`main` が手放す前に `k` 個の塊はすべて合計され、掲示板は最後に `BOARD 3` を表示して
再描画し、`4 2000000` では島じゅうの画面が合計のあいだずっと同じフレームを表示します。
ここで何を書いても和を並列に走らせることはできません。そのための Node の答えは
ワーカースレッドで、この `node.d.ts` は宣言していません。async は **待つ** ための
ものです。一つのスレッドの上の CPU 仕事は、**礼儀正しく** することしかできません。

だから礼儀正しくしてください: 一つの塊、それからスレッドを返し、それから次。そして
正しいキューに返してください。`await null` や `await Promise.resolve()` は
**マイクロタスク** キューに譲り、Node はそれを空になるまで処理してから immediate や
タイマーを一つでも走らせます — 掲示板はまだ `BOARD 3` を見るでしょう。
`await new Promise((r) => setImmediate(r))` は、先に並んでいた掲示板の後ろ、列の最後尾へ
行きます。

そして小さなバグ。これはタイミングにすべてが関わっています。スターターは
`total += await work(...)` で足し上げます。JavaScript は `+=` の左辺を `await` の
**前に** 評価します: どのタスクも `total` を `0` と読み、止まり、戻ってきて `0 + 自分の分`
を書きます。最後のものが勝ち、`TOTAL` は最後の塊です。それは請求カウンターの失われた
更新で、あなたがそれを見るための、読み込みと書き込みのあいだのコードが一行もない
ものです — 共有状態の読み込みと書き込みのあいだに `await` があれば、それは一つの
スレッド上の競合です。合計は await の後で読むか、ロックを持ってください。
'''
