# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.advanced.13.unions"
title = "誰が乗っているか"
story = "リー・ガーデンのミニバス停留所の運賃画面は、どのカードにも大人運賃を請求する。大人でないカードにも、カードでない一枚にも。"
brief = '''
標準入力は個数 `n`、続いて `<TYPE> <STOPS>` の `n` 行です。

基本運賃は `500 + 100 * STOPS` セントです。各行について次のどれかを出力します:

* `ADULT` — 基本運賃
* `STUDENT` — 基本運賃の半分、切り捨て
* `SENIOR` — 常に `200`
* それ以外 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

行を **判別可能なユニオン** としてモデル化してください: 場合ごとに一つのオブジェクト
型、すべてがリテラルの `kind` フィールドを共有し、`UNKNOWN` の場合は生のテキストを
保持します。`parse` だけが回線から来た文字列を見る場所です。その後は、型が
`Order` のありうる四つの姿を述べ、`order.kind` に対する `switch` が各 `case` の中で
`order` を絞り込みます。

スターターの `switch` にはアームが一つと、それ以外すべてに `UNKNOWN` を出力する
`default` しかありません — 知っているはずの二種類も含めてです。どの種類にも
アームを与え、`default` には何も残っていないことを証明させてください:

```ts
default: {
  const unreachable: never = order;
  return unreachable;
}
```

五つ目の種類がユニオンに加わって switch に加わらなければ、その行はコンパイル
できなくなります。ユニオン自体は実行時に消去されます — `node` はそれを見ません —
なので、この検査はここ、`tsc` で行われるか、まったく行われないかです。
'''
hints = [
  "種類ごとに case を一つ。`case \"STUDENT\":` の中では order に `stops` があるとコンパイラは知っています。`case \"UNKNOWN\":` の中では order に `raw` があり `stops` はないと知っています。",
  "Math.floor(x / 2) が切り捨てた半分です。`/` だけだと奇数の基本運賃に 450.5 を与え、画面はそれを出力します。",
  "default の中の const unreachable: never = order が網羅性の検査です — `_` アームのない Rust の match と同じ仕事です。",
]

# ---------------------------------------------------------------- 14
