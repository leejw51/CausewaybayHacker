# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.advanced.15.higher-order"
title = "包まれて"
story = "請求画面は今夜料金関数が何回走ったかを知りたい。料金関数のほうは、見張られていることを知りたくない。"
brief = '''
標準入力は個数 `n`、続いて時間単位の長さが `n` 個です。

`price(hours)` は `500 + 100 * hours` です。それを `counted` で包み、`price` が
知らないまま呼び出しがすべて数えられるようにしてください。長さごとに値段を一つ
出力し、それから `CALLS <n>`、それから `NAME <price.name>` — これは `price` と
言い続けなければなりません。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

TypeScript の `@decorators` は存在しますが、クラスとそのメンバーにだけです。自由な
関数はそれを身に付けられません。デコレーターが *何であるか* には構文が要りません:
関数を受け取って関数を返す関数です。だから
`const price = counted(function price(hours: number) { ... })` が仕組みのすべてで、
`counted` のジェネリクス — `<A extends unknown[], R>` — こそが、どんなシグネチャ
でも包んで同じものを返せるようにしているものです。

`counted` が返す関数は `wrapper` というクロージャで、何も言わなければその `name` は
`"wrapper"` です: スターターの出力の最後の行です。Python には `functools.wraps` が
ありますが、ここでは名前を自分でコピーします。
`Object.defineProperty(wrapper, "name", { value: fn.name })` — `name` は
読み取り専用なので、普通の代入は strict モードで例外を投げます。

回数は wrapper に置きます: 関数宣言のすぐ後に `wrapper.calls = 0`。`tsc` はその
代入を見て関数の型に `calls: number` を加えるので、`main` で `price.calls` が型検査を
通ります。
'''
hints = [
  "return の前に Object.defineProperty(wrapper, \"name\", { value: fn.name })。一行です。",
  "wrapper.name = fn.name はコンパイルでき、それから TypeError: Cannot assign to read only property 'name' を投げます。defineProperty がそれを越える方法です。",
  "A extends unknown[] での (...args: A) => R が、wrapper がシグネチャを知らずにどんなものでも転送する方法であり、包んだ後も price が (hours: number) => number の型を保つ方法です。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.advanced.16.structural"
title = "その形をしていれば"
story = "リー・ガーデンの紙袋。レジ画面の誰もそれが何かは聞かなかった。聞いたのは、中にいくつ入っているか、スニーカーは入っているか、そして一つずつ見ていくことだった。"
brief = '''
標準入力は、スペース区切りの品物の一行と、探す単語一つだけの一行です。

品物を `Bag` に入れ、スターターの `report` に渡してください。それは次を出力します:

1. `LEN <k>` — `bag.size` から
2. 品物を一行に一つずつ — `for (const item of bag)` から
3. `HAS <WORD> YES` または `HAS <WORD> NO` — `bag.has(word)` から
4. `LONGEST <item>` — いちばん長いもの、同点なら最初のもの

```
input:  cap sneakers tee
        sneakers
output: LEN 3
        cap
        sneakers
        tee
        HAS sneakers YES
        LONGEST sneakers
```

`report` は `Container<string>` を受け取り、`Bag` はどこにも
`implements Container` と言っていません。言う必要がないのです。TypeScript の型は
**構造的** です: 値がインターフェースに合うのは、その名前を挙げたからではなく
メンバーを持っているからです。それはダックタイピングで、インタプリタがそこに
着いたときではなく、プログラムが走る前に `tsc` が検査します。`Set<string>` も
`Container<string>` に合い、それも誰も書き留めていません。

スターターの `Bag` はメンバーを一つも持たず、コンパイルできません:

```
error TS2345: Argument of type 'Bag' is not assignable to parameter of type 'Container<string>'.
```

`size` のゲッター、`has` メソッド、そして `[Symbol.iterator]()` を与えてください —
`for...of` がそのシンボルで探すメソッドで、Python の `for` が `__iter__` を探すのと
同じです。
'''
hints = [
  "get size(): number { return this.goods.length; } — ゲッターです。インターフェースは `size` がメソッドではなくプロパティだと言っているからです。",
  "[Symbol.iterator]() は配列自身のイテレータを返せます: this.goods[Symbol.iterator]()。`*[Symbol.iterator]() { yield* this.goods; }` のジェネレーターでも動きます。",
  "report が同じ長さの品物のうち最初のものを残すのは、厳密に長いときだけ置き換えるからです — >= ではなく > です。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.advanced.17.undefined"
title = "23:59 の掲示板"
story = "23:59、コントロールルーム。料金掲示板はフィードに今夜点いていない画面を尋ね、フィードは何もないと答え、掲示板はその何もないものの値段を読む。"
brief = '''
標準入力は個数 `n`、続いて `<SCREEN> <CENTS>` の `n` 行 — 今夜点いている画面 —
それから個数 `q` と、調べる画面名が `q` 個です。

各問い合わせについて `<SCREEN> <cents>`、その画面が点いていなければ
`<SCREEN> NONE` を出力します。それから `MISSING <k>` と `CHEAPEST <SCREEN>` —
料金がいちばん安い画面、同点なら名前順 — 何も点いていなければ `CHEAPEST NONE` を
出力します。

```
input:  2
        TSQ 1200
        HYSAN 900
        3
        HYSAN
        YEEWO
        TSQ
output: HYSAN 900
        YEEWO NONE
        TSQ 1200
        MISSING 1
        CHEAPEST HYSAN
```

スターターは警告ひとつなくコンパイルでき、`YEEWO` で落ちます:

```
TypeError: Cannot read properties of undefined (reading 'cents')
```

その行がこのマップのボスです。それは決してバグを指しません。`undefined` がついに
*使われた* 場所を指します。そしてスターターでは、その `undefined` は、コンパイラが
気にしなくていいと言われた二つの場所で作られていました。

`lookup` は `Record<string, Screen>` から `board[name]` を返し、インデックスの型は
`Screen` と言います — `Screen | undefined` ではなく — TypeScript は読んだ
インデックスが存在するものと仮定するからです。注釈は `Screen` と言い、`tsc` は
それを信じ、実行時にはそのキーはありません。
そして `cheapest` には主な経路に `return` がありません — いちばん良い画面を計算して
末尾から落ちます — なので暗黙に `undefined` を返し、その型はそれを許します。呼び出し
側はそれから `!` 、非 null アサーションで突き抜けます — コンパイラへの、誰も確かめ
ない約束です。

両方の関数に **意図して** `Screen | undefined` と言わせてください — `Map<string, Screen>`
には `get` があり、その型はすでに取りこぼしを認めています — そして `undefined` を
それが着地する場所で `=== undefined` で扱ってください。`!screen` ではなく: それは
オブジェクトには効きますが、この掲示板が `Map<string, number>` になった日に、`0`
セントの無料の画面が存在しなくなります。
'''
hints = [
  "スタックトレースは上から読んでください: TypeError は console.log の行にありますが、undefined はその一行前の lookup から、さらにその前は Record のインデックスから出てきました。",
  "lookup が Screen | undefined を返すようになると、確認するまで `screen.cents` はコンパイルできなくなります。そのエラーは、Record のインデックスが飛ばした仕事をコンパイラがしているのです。",
  "cheapest には経路が二つあり、return するのは片方だけです。もう片方は末尾から落ち、それを `Screen | undefined` の戻り値の型は黙って許し、呼び出し側の `!` はそうではないと誓います。`best` を return し、呼び出しの `!` を外してください。",
  "`!` と `as` はどちらも、コンパイラが確かめられない約束です。ほかのすべての型と一緒に実行時に消去され、残るのは実際に届いた値です。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.advanced.18.promise-all"
title = "十二の画面、一つのスレッド"
story = "22:00、サイネージのコントロールルーム。十二の画面に一斉にフレーム数を尋ね、どれも答えないうちにレポートが出力される。"
brief = '''
標準入力は個数 `n`、続いて `n` 個の整数です。

値ごとに async タスクを一つ始めてください。タスクはイベントループを一回りだけ待ち、
