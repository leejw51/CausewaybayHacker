# LUA LAND — CHEATSHEET, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/lua/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks and identifiers are copied
# verbatim.

pack   = "lua.cheatsheet"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet.01.read-line"
title = "最初の一行"
story = "21:00、浣紗街。担ぎ手の名簿が一行ずつ届く。"
brief = '''
標準入力から一行を、改行を除いた文字列として `line` に読み込んでください。
'''
hints = [
  "io.read は書式を取ります。一行用、数値用、全部用がそれぞれあります。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet.02.not-equal"
title = "同じではない"
story = "二人が龍の同じ節を担ぐと言い張る。係員が番号の違いを確かめる。"
brief = '''
`a` と `b` が**等しくない**とき真になる `if` を開いてください。
'''
hints = [
  "Lua の「等しくない」は感嘆符ではなくチルダで書きます。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.cheatsheet.03.last"
title = "しっぽ"
story = "龍の頭は1番目の節。係員が欲しいのは、今夜の龍がどれだけ長くてもそのしっぽだ。"
brief = '''
`t` は `{10, 20, 30}` のようなリストです。長さに関係なく、`last` を最後の要素に
してください。
'''
hints = [
  "リストは1から始まるので、長さがそのまま最後の要素のインデックスです。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.cheatsheet.04.local"
title = "ここだけに"
story = "節ごとに線香の数を自分で数える。通りの誰にも見せてはいけない。"
brief = '''
`count` を、0から始まり現在のブロックの中でだけ見える変数にしてください——
グローバルではなく。
'''
hints = [
  "新しい名前にそのまま代入するとグローバルになります。スコープを絞るにはキーワード一つです。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.cheatsheet.05.concat"
title = "名札"
story = "担ぎ手は一人ずつ紙の名札をもらう。単語、ダッシュ、そして番号。"
brief = '''
`n` は数値の7です。`s` を文字列 `"id-7"` にしてください。
'''
hints = [
  "Lua の `+` は算術だけです。文字列はドット二つでつなぎます。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet.06.ipairs"
title = "頭からしっぽまで"
story = "点呼は頭から、節ごとに順番どおりに進む。"
brief = '''
リスト `t` を 1, 2, 3, … の順に、インデックスを `i`、要素を `v` として
ループしてください。
'''
hints = [
  "テーブルそのものはイテレータではありません。リスト部分を順に回り、インデックスと値を返す組み込み関数があります。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet.07.format"
title = "小数二桁"
story = "刷り上がった番組表は、各担ぎ手の線香の取り分を小数第二位まで載せる。"
brief = '''
`x` は `3.14159` です。小数点以下ちょうど二桁で `3.14` と出力してください。
'''
hints = [
  "string.format は C の printf の書式を使います。精度はドットの後ろに書きます。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.cheatsheet.08.sort-desc"
title = "背の高い順"
story = "竿の担ぎ手が背の順に並ぶ。一番高い人が先頭だ。"
brief = '''
`t` は数値のリストです。**降順**に、その場で並べ替えてください。
'''
hints = [
  "table.sort は、`a` が `b` より前に来るかどうかを返す関数を取ります。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.cheatsheet.09.closure"
title = "カウンター"
story = "蓮花宮の門の係員は、数を覚えているカウンターで提灯を数える。"
brief = '''
`counter()` は、呼ぶたびに1ずつ数え上げる関数を返します：

```
local function counter()
  local n = 0
  -- ____
end
local c = counter()
print(c(), c())  -- 1  2
```
'''
hints = [
  "内側の関数は外側の `n` そのものを変えて返します。Lua に `+=` はありません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.cheatsheet.10.setmetatable"
title = "新しいスタック"
story = "線香は小屋の机の上に積まれ、節ごとに自分の山を欲しがる。"
brief = '''
`s` を、メソッドの検索が `Stack` に回される新しい空のテーブルにしてください。

```
local Stack = {}
Stack.__index = Stack
function Stack:push(x) self[#self + 1] = x end
-- ____
s:push(5)
```
'''
hints = [
  "ないキーはメタテーブルの `__index` を通して探されます。setmetatable はそれを設定し、テーブルを返します。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.cheatsheet.11.colon"
title = "コロン"
story = "線香をもう一本積む。呼び出しは、それが誰の山かを知っていなければならない。"
brief = '''
`Stack.push` は `function Stack:push(x)` として定義され、`s` はスタックです。
`s` に5を積んでください。
'''
hints = [
  "`:` で定義したメソッドには隠れた最初の引数 `self` があります。呼び出しはそこにテーブルを渡す必要があります。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.cheatsheet.12.pcall"
title = "龍の頭"
story = "真夜中。龍の頭が廟の石段を上る。悪い線香一本で倒れてはならない。"
brief = '''
`f(x)` はエラーを出すかもしれません。エラーを捕まえるように呼んでください：
失敗したら `ok` は `false`、`err` はメッセージです。
'''
hints = [
  "関数と引数を別々に pcall に渡します。呼ぶのは pcall 自身で、状態が先に来ます。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.cheatsheet.13.pop"
title = "一番上から"
story = "線香は一本ずつ山に積まれる。点火係は一番上の一本をまた取り上げる。"
brief = '''
`t` はスタックとして使うリストで、線香は `table.insert(t, x)` で積まれます。
`#t` が一つ縮むように、**一番上**（最後）の要素を `t` から `top` に取り出して
ください。
'''
hints = [
  "追加するのと同じライブラリが削除もします。位置を与えなければ末尾を取ります。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.cheatsheet.14.gmatch-numbers"
title = "一行の数"
story = "節の数は空白をはさんだ数字の一行で届く：`3 14 15`。"
brief = '''
`line` は `"3 14 15"` で、`t` は空のテーブルです。`t` を三つの**数値** 3, 14, 15
で埋めてください — `t[1] == 3` が真で、`#t` が3になるように。
'''
hints = [
  "パターンのイテレータは数字の連なりを一つずつ文字列として渡します。連なりは一つ以上で、文字列はまだ数値ではありません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.cheatsheet.15.sub"
title = "最初の三文字"
story = "銅鑼湾の路線表示板は、各通りの最初の三文字しか見せない。"
brief = '''
`s` は `"CausewayBay"` です。`head` をその最初の三文字 `"Cau"` にしてください。
'''
hints = [
  "Lua の文字列は1から数え、部分文字列のメソッドは開始位置と、含まれる終了位置を取ります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.cheatsheet.16.pairs"
title = "すべてのキー"
story = "線香の台帳は番号ではなく担ぎ手の名前で付けられていて、係員はすべての項目を読み上げてほしい。"
brief = '''
`t` は `{ann = 3, bo = 5, cy = 2}` です — 文字列のキーで、リスト部分はありません。
キーを `k`、値を `v` として**すべて**の項目を回るループを開いてください。
'''
hints = [
  "ipairs は 1, 2, 3, … と進み、最初に欠けたインデックスで止まります。このテーブルには `t[1]` がそもそもありません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.cheatsheet.17.select"
title = "何人来たか"
story = "担ぎ手は名前を叫んで点呼に答える。何も叫ばない者もいるが、係員はそれでも数に入れる。"
brief = '''
`count` は任意個の引数を取ります。`n` を渡された引数の数にしてください。
`nil` も**含めて**：

```
local function count(...)
  -- ____
  return n
end
print(count(1, nil, 3))  -- 3
```
'''
hints = [
  "可変長引数をテーブルに詰めると穴が失われます。位置で引数を選ぶ組み込み関数には、数えるだけの特別な最初の引数もあります。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.cheatsheet.18.concat"
title = "名前を一行に"
story = "番組表は竿の担ぎ手を一行に、名前と名前の間に空白を一つはさんで載せる。"
brief = '''
`parts` は `{"Tai", "Hang", "Road"}` です。`s` を一つの文字列 `"Tai Hang Road"`
にしてください — `..` のループなしで。
'''
hints = [
  "table ライブラリは文字列のリストを一回の呼び出しでつなぎます。区切りは二番目の引数です。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.cheatsheet.19.floor-div"
title = "分け前と余り"
story = "線香は三本ずつ分けられる。小屋が蓮花宮に何本か貸したので、数はマイナスになった。"
brief = '''
`a` は `-7`、`b` は `3` です。`q` を**切り下げた**商（`-3`）に、`r` を**非負の**
余り（`2`）にして、`q * b + r == a` が成り立つようにしてください。
'''
hints = [
  "LuaJIT には整数除算の演算子がなく、`/` は常に float です。`%` はすでにマイナス無限大の方向に丸めます。fmod は違います。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.cheatsheet.20.shift-letter"
title = "龍が向きを変える"
story = "真夜中の大坑道。龍の頭が街区をぐるりと回り、`z` の担ぎ手が一歩前に出てまた `a` になる。"
brief = '''
`c` は小文字一文字で、`k` は非負の数です。`out` をアルファベットで `k` 個後ろの
文字にしてください。端で折り返します — `"z"` に `k = 1` なら `"a"` です。
小文字の `a` はバイト 97 です。
'''
hints = [
  "文字列に算術はありません。バイトを取り出し、それを 0..25 の中でずらし、バイトを一文字の文字列に戻してください。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.cheatsheet.21.insert"
title = "もう一人の名前"
story = "遅れた担ぎ手が浣紗街の小屋に着き、その名前は名簿の末尾に載る。"
brief = '''
`t` は名前のリストです。table ライブラリで `x` を `t` の **末尾** に置いてください —
インデックスの計算なしで — `#t` が一つ増え、`t[#t]` が `x` になるように。
'''
hints = [
  "リストを伸ばすライブラリの呼び出しはテーブルを最初に取ります。位置を与えなければ、値を最後の一つの後に置きます。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.cheatsheet.22.countdown"
title = "十から一へ"
story = "龍の頭に火を入れるカウントダウンは十から一へ、大坑道の向こうまで叫ばれる。"
brief = '''
`i` に 10, 9, 8, …, 1 の値を — この順で、十個すべて — 与える数値ループを開いて
ください。
'''
hints = [
  "数値 for は三つ目の値が言わない限り一ずつ上ります — そして三つ目の値なしでは、終わりより上の始まりはゼロ回実行されます。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet.23.tally"
title = "集計"
story = "係員は担ぎ手が何本の線香を取ったかを名前ごとに、空の台帳から集計する。"
brief = '''
`seen` は空から始まるテーブルで、`k` は担ぎ手の名前です。`seen[k]` に一を足して
ください。まだテーブルにない名前は 0 として扱い — 最初の一回でエラーではなく 1 に
なるように。
'''
hints = [
  "nil への算術はエラーを起こし、`+` は `or` より強く結合します。デフォルトは足し算の後ではなく前に与えてください。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet.24.function"
title = "二つの和"
story = "二つの小屋が線香を出し合い、合計には通り全体が呼べる名前付きの関数が要る。"
brief = '''
`add` を、二つの数の和を返す **local** な関数として一行で定義してください。
'''
hints = [
  "Lua の本体はひとりでには何も返さず、`function` で開いたものは波括弧ではなく単語で閉じます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet.25.two-returns"
title = "両方いっぺんに"
story = "小屋は線香を三本ずつの束で配り、係員は束の数とばらの本数を一度に欲しがる。"
brief = '''
`divmod` は二つの値を返します。両方を受け取ってください：

```
local function divmod(a, b)
  return math.floor(a / b), a % b
end
-- ____
print(q, r)  -- 2  1
```
'''
hints = [
  "呼び出しは複数の値を返すことができ、コンマ区切りの名前のリストが来た順にそれを受け取ります — ラッパーなし、括弧なし。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet.26.empty"
title = "まだ誰も"
story = "最初の太鼓の前に、係員は誰かが名簿に署名したかどうかを確かめる。"
brief = '''
`t` は穴のないリストで、空かもしれません。`t` に要素が **一つもない** ときにちょうど
真になる `if` を開いてください。
'''
hints = [
  "空のテーブルもやはりテーブルで、すべてのテーブルは真です。異なる二つのテーブルが等しくなることはありません。個数を尋ねてください。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.cheatsheet.27.swap"
title = "場所を替える"
story = "二人の担ぎ手が途中で節を交換し、名簿は紙切れなしで二人の番号を入れ替えなければならない。"
brief = '''
`a` と `b` は既存の二つの変数です。一時変数なしで、一文でその値を交換してください。
'''
hints = [
  "Lua は値のリストを名前のリストに代入し、どれかを格納する前にすべての右辺を評価します。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet.28.error"
title = "太鼓を止めろ"
story = "線香のない棒は不良で、点火係は続けるのではなくメッセージとともに列を止めなければならない。"
brief = '''
メッセージが `"bad"` のエラーで現在の関数を止め、それを囲む `pcall` が `false` と
`bad` を含むメッセージを返すようにしてください。
'''
hints = [
  "assert は最初の引数が nil か false のときだけ文句を言い、文字列はどちらでもありません。エラーを起こす組み込み関数はメッセージを直接取ります。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet.29.and-or"
title = "どちらか一方"
story = "線香が十本を超える担ぎ手は小屋で 5 ドルの徴収金を払い、それ以外は全員 8 ドル払う。"
brief = '''
`n` は数です。`fee` を `n > 10` なら 5、そうでなければ 8 にしてください — 式一つで、
`if` 文なしで。
'''
hints = [
  "一つのキーワードは左が真なら右側を返し、もう一つはそうでないときに埋めます。どの値がどこに落ちるかを読んでください。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet.30.copy"
title = "二つ目の名簿"
story = "真夜中。係員は今夜の名簿を写し取り、明日の訂正が火龍の夜の記録に触れないようにする。"
brief = '''
`src` は数のリストです。`cp` を同じ要素を持つ **新しい** リストにして、`cp[1] = 99` が
`src[1]` をそのままにするようにしてください。このランドは LuaJIT（Lua 5.1）で
動いています。
'''
hints = [
  "テーブルの代入はテーブルではなく参照をコピーします。リストの値を新しいコンストラクタに展開してください — そして 5.1 では展開するものは `table` のフィールドではなくグローバルです。",
]
