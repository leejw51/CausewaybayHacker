[[quest]]
id    = "python.cheatsheet_advanced.04.keep-the-name"
title = "まだ greet と呼ばれる"
story = "パーシヴァル・ストリートの受付の名札は、その上に制服を着ても生き残らなければならない。"
brief = '''
`import functools` は済んでいます。`@logged` を `greet` に適用した後も、
`greet.__name__` は `"greet"` のままで、`greet.__doc__` は greet 自身のもので
なければなりません。空欄に入る行はどれでしょう?

```
def logged(fn):
    # ____
    def inner(*a, **kw):
        print(fn.__name__)
        return fn(*a, **kw)
    return inner
```
'''
hints = [
  "そのヘルパーはデコレータファクトリです: 包まれる側の関数で呼ばれ、返ってきたものがラッパーをデコレートします。",
]

