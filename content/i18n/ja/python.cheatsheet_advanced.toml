# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.cheatsheet_advanced.01.yield-from"
title = "箱の中の箱"
story = "ジャーディンズ・バザール上階の雑居ビルへの配達: 段ボールの中に段ボール。ニシキヘビは全部の品を一つずつ床に出したい。"
brief = '''
`flatten` は、任意に入れ子になったリストのすべての葉を順番に生み出すジェネレータで
なければなりません: `list(flatten([1, [2, [3, 4]], 5]))` は `[1, 2, 3, 4, 5]` です。
空欄に入る行はどれでしょう?

```
def flatten(xs):
    for x in xs:
        if isinstance(x, list):
            # ____
        else:
            yield x
```
'''
hints = [
  "再帰呼び出しはジェネレータを返します。欲しいのはその要素を一つずつ上に渡すことで、そのための二語の形があります。",
]

