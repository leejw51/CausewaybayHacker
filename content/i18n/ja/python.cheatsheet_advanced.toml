[[quest]]
id    = "python.cheatsheet_advanced.05.three-layers"
title = "三度目の正直"
story = "ロックハート・ロードの配達員は諦める前に三回ベルを鳴らす。配車係はそのルールを @ の糖衣なしで配線する。"
brief = '''
`retry` は引数を取るデコレータです: `def` の上の `@retry(3)` はその関数を最大
三回試みさせます。

```
def retry(times):
    def deco(fn):
        def inner(*a, **kw):
            ...
        return inner
    return deco
```

`fetch` はデコレータなしですでに定義されています。手で `fetch` を再束縛して
三回リトライされるようにしてください — `@retry(3)` がするのと同じことです。
'''
hints = [
  "層は三つあります。外側の呼び出しは数を取って本物のデコレータを返します。関数はそこに入ります。",
]

