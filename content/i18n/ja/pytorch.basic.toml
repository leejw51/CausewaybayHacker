平均二乗誤差はまさにその名のとおりです: 差を二乗して平均したもの。書き下すと `((pred - want) ** 2).mean()` で、`nn.MSELoss()(pred, want)` も同じ数です。

両方のやり方で計算し、出力してください。

```
output: 1.5 1.5
```
'''
hints = [
  "((pred - want) ** 2).mean() — 平均の前に二乗します。さもないと符号が打ち消し合います。",
