`nn.CrossEntropyLoss` が受け取るのは確率ではなく **生のロジット** です — ソフトマックスはその中にあります。ターゲットは dtype `int64` のクラスの **インデックス** で、行ごとに一つ、one-hot の行ではありません。

ロジットとインデックスを渡して損失を出力してください。確信を持って正しいバッチの損失はゼロに近くなります。

```
output: 0.0659
```
'''
hints = [
  "nn.CrossEntropyLoss()(logits, want) — ロジットは生のまま入れます。先にソフトマックスしないでください。",
  "ターゲットはインデックスなので int64 でなければなりません — 浮動小数点のターゲットは例外を出します。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "pytorch.basic.13.the-gradient"
title = "この点での傾き"
story = "パラメータは 4.0、損失はその二乗、そして訓練ステップが尋ねるのはいつも、どちらが下り坂か、だけだ。"
brief = '''
パラメータに学習可能の印を付け、順伝播を走らせ、損失に対して `backward()` を呼んでください。`w * w` の勾配は `2w` なので、`4.0` では `w.grad` に `8.0` として入ります。

`.grad` は逆伝播が走るまで `None` です — 最初の訓練ループが `None` を出力して止まるのは、たいていこれが理由です。

```
output: 8.0
```
'''
hints = [
  "loss.backward() — グラフの終端に対して呼ぶもので、パラメータに対してでは決してありません。",
  "勾配は w.grad に入ります。backward() 自体は何も返しません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.basic.14.accumulate"
title = "前のを取っておいた"
story = "逆伝播が二回、そして勾配は計算の言う値の二倍。その間に何も消されていなかった。"
brief = '''
`backward()` は `.grad` に **足し込み** ます。置き換えはしません。同じパラメータに二回走らせると両方の勾配の和が残り、だからこそどの訓練ループも逆伝播の前に勾配を消します。

二回目のパスを、先に勾配を消してから走らせ、出力される数が一回分 — `3.0` での `2w` — になるようにしてください。

```
output: 12.0 6.0
```
'''
hints = [
  "w.grad = None で消えます。次の逆伝播は何もないところから始まります。",
  "オプティマイザがこれをやってくれます — opt.zero_grad() は同じ考えを、持っているすべてのパラメータに対して行うものです。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.basic.15.step-by-hand"
title = "一度だけ下り坂へ"
story = "オプティマイザはオブジェクトになる前は一回の引き算であり、夜勤はその引き算を見てみたい。"
brief = '''
勾配降下法は `w ← w - lr * w.grad` で、それがアルゴリズムのすべてです。それはグラフを切った状態で行わなければなりません — 更新は帳簿付けであってモデルの一部ではありません — なので `torch.no_grad()` の中に入れます。

`w` は `5.0` から始まり、`w * w` の勾配は `10.0`、`lr` は `0.1` です。

```
output: 4.0
```
'''
hints = [
  "w -= lr * w.grad — マイナスです。勾配は上り坂を指すからです。",
  "no_grad ブロックの中でなければなりません。さもないと torch は、勾配を要求する葉をその場で変更することを拒みます。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.basic.16.optimiser"
title = "三つの行"
story = "これまでに書かれたすべての訓練ループは同じ順番の同じ三行で、夜勤が写したものはそれが違う順番になっている。"
brief = '''
オプティマイザはパラメータを持ち、更新を行います。ループの本体はいつも同じ三つの呼び出しを、この順番で行います: 古い勾配を消し、逆伝播を走らせ、ステップを適用する。

`5.0` から `w * w` に対して `lr=0.1` の SGD を二十ステップ行うと、`w` はゼロへ向かいます。

```
output: 0.0576
```
'''
hints = [
  "zero_grad、backward、step — 消して、計算して、適用します。",
  "backward() の前に step() を呼ぶと、前回から .grad に残っていたものが何であれ適用されます。",
]

