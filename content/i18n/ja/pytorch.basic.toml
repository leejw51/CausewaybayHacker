# PYTORCH LAND — BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/basic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.basic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.basic.01.night-shift"
title = "夜勤"
story = "23:00、機械室。コンソールから読み取りの一行がテキストとして出てきて、階下のどのツールもテンソルを欲しがっている。"
brief = '''
空白区切りの数の一行が標準入力に届きます。それを **浮動小数点** のテンソルにし、その形をタプルとして、そして合計を出力してください。

`input().split()` は文字列のリストを返し、`float(t)` はその一つを変換します。その二つにまたがるリスト内包表記が変換のすべてで、`torch.tensor` がそのリストを受け取ります。

合計は `.item()` で出力します。これは 0 次元テンソルから Python の数を取り出すもので、循環小数が自分自身と食い違わないよう小数点以下四桁に丸めます。

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
hints = [
  "torch.tensor([float(t) for t in input().split()]) — 分けて、変換して、包みます。",
  "一次元の形は末尾にカンマ付きで出力されます: (4) ではなく (4,) です。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.basic.02.the-batch"
title = "六つを二つに"
story = "六つの数が回線から平たく届く。モデルは三つの特徴量を持つ二つのサンプル用に書かれていて、平たい一行を拒む。"
brief = '''
モデルが平たい一行を欲しがることはまずありません。欲しいのは `(batch, features)` です。`reshape` は同じ数に新しい形を与え、ある位置の `-1` は *これは他から割り出せ* を意味します。

平たい読み取りを、何行になるにせよ三つずつの行に reshape し、その形と最初の行の最後の数を出力してください。

```
input: 1 2 3 4 5 6
output: (2, 3) 3.0
```
'''
hints = [
  "flat.reshape(-1, 3) — 列は三つで、行数は推論されます。",
  "reshape(3, -1) は何個かずつの三行で、逆向きです。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.basic.03.normalise"
title = "誰も合意しなかった尺度"
story = "ある特徴量は度で、次はワットで測られている。モデルは訓練のすべてのステップを、ワットのほうが大きいと学ぶことに費やす。"
brief = '''
特徴量の標準化とは、その平均を引いて標準偏差で割ることで、そうするとどの列もゼロを中心に広がり一で出てきます。

`dim=0` での平均は列ごとに一つの数 — 形 `(features,)` — で、それを `(batch, features)` から引くと行方向にブロードキャストされます。標準偏差も同じです。

その後、丸めた列の平均を出力してください。構成上それはゼロです。

```
input: 1 10 2 20 3 30
output: [0.0, 0.0] [1.0, 1.0]
```
'''
hints = [
  "(x - x.mean(dim=0)) / x.std(dim=0) — dim=0 は行を畳み、列ごとに一つの数を残します。",
  "dim=0 がないとテンソル全体の平均になり、二つの特徴量が混ざってしまいます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.basic.04.split-xy"
title = "ラベルの列"
story = "キャプチャファイルには最後の列としてラベルがくっついていて、モデルは答えで訓練されてきた。"
brief = '''
生の表はたいてい、特徴量と一緒にラベルを持っています。それを分けるのはスライス二つです: 最後の列の手前までのすべてと、最後の列だけ。

`x[:, :-1]` はすべての行の、最後以外のすべての列です。`x[:, -1]` はすべての行の最後の列で、列の軸は消えるので、行ごとに一つの数として出てきます。

二つの形を出力し、それからラベルを出力してください。

```
input: 1 2 0 3 4 1
output: (2, 2) (2,) [0.0, 1.0]
```
'''
hints = [
  "table[:, :-1] と table[:, -1] — スライスは軸を残し、単一のインデックスは軸を落とします。",
  "table[:, -1:] は列の軸を残して (2, 1) を返し、それは同じ形ではありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.basic.05.layer-by-hand"
title = "書き下した層"
story = "層はクラスになる前は二つの演算であり、夜勤はそれを何にも隠されずに一度見てみたい。"
brief = '''
線形層は行列積とバイアスの加算で、それ以外の何物でもありません。形 `(batch, in)` のバッチ `x` と、形 `(out, in)` — torch が保存する形 — の重み `W` に対して、出力は `x @ W.t() + b` です。

`W.t()` は `(in, out)` なので内側の次元が一致し、形 `(out,)` の `b` はバッチ全体にブロードキャストされます。

それを書き下し、形と丸めた結果を出力してください。

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
hints = [
  "x @ W.t() + b — 内側の次元を合わせるのは転置です。",
  "ここでは行列が正方なので x @ W も動きますが、間違ったものを計算します。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.basic.06.relu"
title = "平らに積んで"
story = "線形層が三つ並び、その積み重ね全体が、層一つのときとまったく同じ直線を描く。"
brief = '''
間に何もない二つの線形層は、一つの線形層です。深さに意味を持たせるのは活性化関数で、ほとんどすべてが使うのが ReLU です: 正の値は残し、残りはゼロにします。

それを層の出力に適用し、数のうちいくつが生き残ったかを報告してください。

```
output: [0.0, 0.0, 1.0, 3.0] 2
```
'''
hints = [
  "torch.relu(z) は正の値を残し、それ以外はすべてゼロで下限を切ります。",
  "(a > 0).sum() は真偽値を数えます。足すと True は 1 だからです。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.basic.07.sigmoid"
title = "燃えているか"
story = "熱モデルは 4.2 を出力するが、夜勤が尋ねたのは、ラックが落ちかけているかどうかだった。"
brief = '''
単一の出力ニューロンは `(-∞, ∞)` 上の生のスコアを出します。シグモイドはそれを `(0, 1)` に押し込め、確率として読めるようにします。そして決定境界 — スコア 0、確率 0.5 — が、はいがいいえに変わるところです。

スコアを確率に、そして 0.5 での はい/いいえ の判定に変えてください。

```
output: [0.0474, 0.5, 0.9526] [0, 1, 1]
```
'''
hints = [
  "torch.sigmoid(scores) — スコア 0 はちょうど 0.5 で出てきます。",
  "(probs >= 0.5).int() は真偽値を 0 と 1 に変え、数として出力されるようにします。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.basic.08.softmax-rows"
title = "行はそれぞれ自分のもの"
story = "四つのサンプル、それぞれ三クラスのバッチで、確信度の数が各行ではなくバッチ全体で合計一になっている。"
brief = '''
形 `(batch, classes)` のロジットのバッチでは、ソフトマックスは **クラス** の軸 — `dim=1` — で取らなければならず、そうすればどの行も単独で合計一になります。`dim=0` はどの *列* も合計一にしてしまい、それはバッチについての言明で、何の意味もありません。

バッチをクラスについてソフトマックスし、行ごとの合計を出力してください。

```
output: [1.0, 1.0] (2, 3)
```
'''
hints = [
  "torch.softmax(logits, dim=1) — (batch, classes) のテンソルでは dim=1 がクラスの軸です。",
  "ここでは dim=-1 も同じ意味で、後でバッチの軸が足されても動き続けます。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.basic.09.predict"
title = "スコアではなく答え"
story = "ダッシュボードはサンプルごとに確信度のバーを三本表示し、オペレーターはどのクラスが勝ったかを目で読み取らなければならない。一晩に四百回。"
brief = '''
分類器の予測は、各行で最大のロジットのインデックスです: クラスの軸に沿った `argmax`。ソフトマックスはどれが最大かを変えないので、予測はロジットから直接読み取れます。

バッチのすべての行について予測したクラスを出力してください。

```
output: [2, 0, 1]
```
'''
hints = [
  "logits.argmax(dim=1) — 行ごとに一つのインデックスなので、結果は (batch,) です。",
  "dim がないとバッチ全体を平らにし、その全体へのインデックスを一つ返します。",
]

