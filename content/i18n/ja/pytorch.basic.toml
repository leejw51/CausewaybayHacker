[[quest]]
id    = "pytorch.basic.10.accuracy"
title = "どれだけ正しいか"
story = "朝会でモデルは好調だと説明される。部屋の誰も数字を持っていない。"
brief = '''
正解率は、ラベルと一致する予測の割合です。二つのテンソルを要素ごとに比べると真偽値になります。真偽値は平均できないので先に浮動小数点にキャストし、それから `mean()` が割合になります。

小数点以下四桁に丸めた正解率と、当たりの数を出力してください。

```
output: 0.75 3
```
'''
hints = [
  "(pred == want).float().mean() — mean を合法にするのは浮動小数点へのキャストです。",
  "真偽値のテンソルに直接 mean() をすると例外が出ます。torch が dtype を選んでくれることはありません。",
]

