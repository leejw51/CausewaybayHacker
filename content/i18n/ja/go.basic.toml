id    = "go.basic.18.binary-tree"
title = "NULLPTR"
story = "11:55 のラッキーマックのフロントのレジは注文を番号で木に綴じる。木の根は nil で、それでも nil を辿ってしまう。注文はすべて通り、ひとつも存在しない。"
brief = '''
二分探索木は、二つの子が同じ struct へのポインタである `struct` で、空の木は
`nil` です。挿入は再帰的です: `nil` の部分木は新しいノードになり、そうでなければ
値は左か右の部分木へ入ります — 再帰が部分木の新しい根を返すので、それを
子のフィールドに代入し直します。`n` が `nil` のときに `n.Left` を辿ると
プログラムは死にます。`nil` チェックが常に先です。

```
type Node struct {
	Val         int
	Left, Right *Node
}
if v < n.Val {
	n.Left = insert(n.Left, v)
} else {
	n.Right = insert(n.Right, v)
}
```

`Node`、`insert` の `nil` チェック、その `if v < n.Val` / `else`、`inorder`、
`height`、`main` は書いてあります。二つの分岐を埋めてください: 左の代入と
右の代入。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "一つ目の分岐に n.Left = insert(n.Left, v)、二つ目に n.Right = insert(n.Right, v)。",
  "insert は部分木の根を返します — 子が nil だったなら新品のノードです — ので、結果を子のフィールドに戻さないと木は育ちません。",
]
