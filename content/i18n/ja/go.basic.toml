[[quest]]
id    = "go.basic.18.nil-and-order"
title = "NULLPTR"
story = "11:55、ラッキーマックの表のレジ。すべての注文が通っていき、そのうちいくつかは存在しないのに、レジはそれも読んでしまう。"
brief = '''
標準入力は個数 `n`、続いて `n` 行です。各行は `<NAME> <CENTS>` か、単独の `-`
で、後者は注文が届かなかったことを意味します: スライスの中の nil な `*Order`
です。

本物の注文を cents の **降順**、同額なら名前の昇順に並べ、`<NAME> <CENTS>` として
出力してください。そのあと `NIL <count>` — 欠けていた個数を出力します。

```
input:  4
        SET 2800
        -
        PIE 900
        TEA 1200
output: SET 2800
        TEA 1200
        PIE 900
        NIL 1
```

`sort.Slice` に渡す比較関数も含めて、何かがデリファレンスする前に、すべての nil を
見つけておかなければなりません。それがこのボスのすべてです。
'''
hints = [
  "スライスの中の nil な *Order は、何かがそのフィールドを読むまでは無害です。先にふるい落とし、それから並べ替えてください。",
  "\"-\" に対する strings.Fields はフィールドを一つ返すので、len(fields) < 2 が欠けた注文の判定です。",
  "降順は less 関数の中の > です。同額の決着はその後の二つ目の比較です。",
]
