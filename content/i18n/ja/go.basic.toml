[[quest]]
id    = "go.basic.17.threads"
title = "注文ごとにライダー一人"
story = "八つの注文が八台のバイクで同時にラッキーマックのドアを出て、板はどれも待たずに夜の分を合計する。"
brief = '''
`go f()` は `f` を自分のゴルーチンで始め、待ちません。`sync.WaitGroup` が
`main` が全部を待つ方法です: 各開始の前に `Add(1)`、各ゴルーチンの終わりに
`Done()` — 関数がどう抜けても走るよう defer して — そして `Wait()` が数が
ゼロに戻るまでブロックします。ここでは各ゴルーチンが自分の `results[i]`
だけに書くので、何も共有されません。

```
var wg sync.WaitGroup
for i, x := range xs {
	wg.Add(1)
	go func(i, x int) {
		defer wg.Done()
		results[i] = x * x
	}(i, x)
}
wg.Wait()
```

ループ、`Add`、ゴルーチンの形は書いてあります。本体を埋めてください:
`defer wg.Done()`、次に `x * x` を `results[i]` に格納。

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
hints = [
  "一行目に defer wg.Done()、二行目に results[i] = x * x。",
  "defer はゴルーチンが戻るときに Done を走らせます。間に何が起きても。先に素の wg.Done() を書くと、仕事の前に「終わった」と言うことになります。",
]

