# GO LAND — CHEATSHEET ADVANCED, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/go/cheatsheet_advanced.toml`, quest by quest, and nothing else. The
# four choices are code, live in the English pack, and are never translated.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "go.cheatsheet_advanced"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet_advanced.01.buffered"
title = "一つ分の余地"
story = "12:30、ラッキー・マックの受け渡し口。コックがトレイを差し出し、誰も受け取らず、彼の後ろで厨房全体が止まる。"
brief = '''
この三行は `main` の中で走り、他のゴルーチンは一つも生きていません。
送信が通って受信が `1` を出力するようにする宣言はどれでしょう?

```
// ____
ch <- 1
fmt.Println(<-ch)
```
'''
hints = [
  "バッファなしの送信は受信側を待ちます。ここでは受信側は同じゴルーチンで、一行後です。チャネルに値を置く場所を与えましょう。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet_advanced.02.wg-launch"
title = "出る前に数えろ"
story = "四十人の配達員が一斉にラッキー・マックを出て、誰が出たかのリストが書かれる前に配車係が店を閉める。"
brief = '''
`go.mod` には `go 1.22` とあるので、各反復はそれぞれ自分の `i` を持ちます。
すべての `i` について `work(i)` をゴルーチンで起動し、最後の `Wait` が本当に
`n` 個すべてを待つようにしてください — カウンタと競合するものがあってはいけません。

```
var wg sync.WaitGroup
for i := range n {
    // ____
}
wg.Wait()
```
'''
hints = [
  "カウンタを増やすのは `Wait` を呼ぶゴルーチンの側で、`go` の前です。減らすのは新しいゴルーチンの中で、defer して行います。そして `defer` には呼び出しが要ります。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.cheatsheet_advanced.03.close-range"
title = "最後の皿、シャッターを下ろせ"
story = "受け渡し口がランチラッシュ最後の皿を出し、ランナーはそこに立ち続ける。厨房が終わったと誰も言わなかったからだ。"
brief = '''
`main` の消費側は `for v := range ch { ... }` でループし、その後 `done` を
出力します。生産側の末尾でそのループを終わらせ、すべての値が届き、待ったままの
ゴルーチンが残らないようにする行はどれでしょう?

```
func produce(ch chan<- int) {
    for i := range 3 {
        ch <- i
    }
    // ____
}
```
'''
hints = [
  "チャネルの range は、チャネルが close され、空になって初めて終わります。番兵の値は単にもう一つの値で、ループは待ち続けます。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.cheatsheet_advanced.04.worker-sig"
title = "入口は一つ、出口も一つ"
story = "ラッキー・マックのラインの四人のコックは、一つのレールから注文を取り、別のレールに皿を置く。新人はずっと注文をレールに戻し続けている。"
brief = '''
ワーカープール: `main` は `jobs` と `results` を素の `chan int` として作り、
ワーカーを四つ起動し、九つのジョブを送って `jobs` を close し、それから
`<-results` で九つの結果を集めます。この本体でコンパイルでき — かつワーカーの
中での `jobs` への送信や `results` からの受信をコンパイラに拒否させる
シグネチャはどれでしょう?

```
// ____
    for j := range jobs {
        results <- j * j
    }
}
```
'''
hints = [
  "矢印はデータが流れる側に付きます: `chan` の前なら取り出すだけ、`chan` の後なら入れるだけ。双方向チャネルはどちらにも変換できます。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.cheatsheet_advanced.05.try-send"
title = "捨てろ、待つな"
story = "天后の到着掲示板は聞こえた列車を全部ログに残す。ログが一杯になっても、掲示板自体が固まってはいけない。"
brief = '''
`ch` は容量 2 の `chan string` で、いくつかのゴルーチンがそこに送信します。
`log(v)` の中で、余地があれば `v` をチャネルに渡し、なければ捨ててください —
呼び出し側は決してブロックしてはならず、送信で待ったままのゴルーチンが
残ってもいけません。
'''
hints = [
  "フォールバック分岐のある `select` は決してブロックしません。フォールバックは何もしてはいけません。別の送信も駄目です。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.cheatsheet_advanced.06.timeout-case"
title = "二秒、それで諦める"
story = "銅鑼湾のプラットフォーム画面は次の列車の信号を待つ。二秒待つのか、永遠に待つのか — ファームウェアにはどちらか分からなかった。"
brief = '''
`ch` は `<-chan int`、`ctx` は `context.Context` です。何も届かないまま二秒経ったら
関数が諦めるように、三つ目の case を埋めてください。

```
select {
case v := <-ch:
    use(v)
    return nil
case <-ctx.Done():
    return ctx.Err()
// ____
    return errTimeout
}
```
'''
hints = [
  "select の case は送信か受信でなければなりません。`time` には `Duration` の後に発火するチャネルを返す関数があり、裸の `2` は 2 ナノ秒です。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.cheatsheet_advanced.07.defer-cancel"
title = "出がけに手を放せ"
story = "金鐘での運賃検索は毎回三秒のタイマーを開き、誰も止めない。夕方のラッシュまでにゲートは一万個のタイマーを抱えている。"
brief = '''
`fetch(ctx)` は三秒の制限が生きたまま走らなければならず、タイマーのリソースは
`get` がどう戻っても — 早期 return、エラー、成功 — 解放されなければなりません。
（`WithCancel` も同じ組を返します。）

```
func get() error {
    ctx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
    // ____
    return fetch(ctx)
}
```
'''
hints = [
  "今 cancel 関数を呼ぶと、`fetch` が見る前に `ctx` がキャンセルされます。呼び出しを `get` が戻るときに予約しましょう — そして `defer` には呼び出しが要ります。括弧込みで。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.cheatsheet_advanced.08.mutex-inc"
title = "読み取りロックではなく書き込みロック"
story = "銅鑼湾乗換駅の五十のゲートが乗客を一つの数に数え、その数は誰にも再現できない分だけ足りない。"
brief = '''
五十のゴルーチンがそれぞれ `Inc` を千回呼びます。その後 `Get` は `50000` を
返さなければなりません。

```
type Ctr struct {
    mu sync.RWMutex
    n  int
}
func (c *Ctr) Get() int { c.mu.RLock(); defer c.mu.RUnlock(); return c.n }
// ____
```
'''
hints = [
  "書き込みには共有ロックではなく排他ロックが要ります。値レシーバは構造体をロックごとコピーするので、本物の `n` は決して動きません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.cheatsheet_advanced.09.once"
title = "ウォームアップは一度だけ"
story = "二十人の配達員が同じ秒にラッキー・マックのアプリを開き、バックエンドはデータベース接続を二十個開く。一人一つ、全部が「最初の」接続。"
brief = '''
`initDB()` はパッケージレベルの `db` を設定する `func()` です。`conn()` は二十の
ゴルーチンから同時に呼ばれます。`initDB` はちょうど一回だけ走らなければならず、
どの呼び出し側も完成した `db` を見なければなりません。

```
var once sync.Once
func conn() *DB {
    // ____
    return db
}
```
'''
hints = [
  "`Once` は関数そのものを取ります。呼び出した結果ではありません — そしてクロージャの中の裸の名前は未使用の値で、コンパイルできません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.cheatsheet_advanced.10.atomic-add"
title = "一刻み、ロックなし"
story = "アイランド線の状況ページのヒットカウンタは負荷がかかると刻みを落とす。整数一つのためにミューテックスというのはアレックスには大げさに思える。"
brief = '''
`var hits atomic.Int64` が百のゴルーチンから、それぞれ一万回インクリメント
されます。一つ残らず数えて `hits.Load()` が `1000000` で終わる行はどれでしょう?
'''
hints = [
  "型付き atomic にはメソッドがあります。load してから store するのは二つの操作で、その間に隙間があります。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.cheatsheet_advanced.11.fan-in"
title = "多くの線、一つのホーム"
story = "荃湾と観塘からの列車が金鐘の一つのホームに流れ込む。合流は夜最後の列車まで動くが、そこでホームが空にならない。"
brief = '''
ファンイン。`go.mod` には `go 1.22` とあるので、各反復はそれぞれ自分の `c` を
持ちます。各入力に対して、それを `out` にコピーしてから自分の完了を数える
フォワーダを起動し、下のクローザが `out` を close できるようにしてください。

```
func merge(ins ...<-chan int) <-chan int {
    out := make(chan int)
    var wg sync.WaitGroup
    wg.Add(len(ins))
    for _, c := range ins {
        // ____
    }
    go func() { wg.Wait(); close(out) }()
    return out
}
```
'''
hints = [
  "自分のゴルーチンで走らなければならず（`go` キーワードと末尾の呼び出し）、終わったらグループに伝えなければなりません — さもないと `Wait` は決して戻らず、`out` は決して close されません。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.cheatsheet_advanced.12.defer-args"
title = "いつ読まれた?"
story = "天后の切符売り場は帰りがけにレジの合計を印字する。印字されるのは、シフトが始まった瞬間の合計だ。"
brief = '''
`2` を出力してください — `main` が戻るときに `x` が持っている値です。

```
func main() {
    x := 1
    // ____
    x = 2
}
```
'''
hints = [
  "defer した呼び出しの引数は `defer` の時点で評価され、走るときではありません。自分で `x` を読むクロージャだけが後の書き込みを見ます。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.cheatsheet_advanced.13.recover"
title = "落ちていく途中で捕まえろ"
story = "ラッキー・マックのラインで一つの悪い注文が木べらを投げ、その一皿が「失敗」と印を付けて戻ってくる代わりに、厨房全体が暗転する。"
brief = '''
`f` は panic するかもしれません。`safe` は panic を飲み込んで代わりに `errPanic` を
返さなければなりません。行儀のよい `f` なら `nil` を返します。

```
func safe(f func()) (err error) {
    // ____
    f()
    return nil
}
```
'''
hints = [
  "defer された関数の中からしか効きません — 組み込み関数そのものを defer しても何も起きません — そして外へ出す唯一の方法は名前付き結果への代入です。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.cheatsheet_advanced.14.errors-as"
title = "どの種類の間違い"
story = "ラッキー・マックの検索から配達員 id が三層の文脈に包まれて返ってくる。窓口に要るのは文章ではなく、見つからなかったキーだ。"
brief = '''
`err` は `fmt.Errorf("lookup: %w", &NotFound{Key: k})` で作られました。素の
`errors.Is` ははい・いいえしか言いません。本体で `nf.Key` を出力できる `if` を
開いてください — panic なしで。

```
type NotFound struct{ Key string }
func (e *NotFound) Error() string { return e.Key + " not found" }
```
'''
hints = [
  "直接の型アサーションは包みを見通せません。ターゲットは `error` を実装する型の変数へのポインタです — そしてここではその型はポインタ型です。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.cheatsheet_advanced.15.assert-ok"
title = "しゃべれるか?"
story = "天后の案内板はフィード上のあらゆるオブジェクトに自己紹介を求め、最初の素の整数が板を落とす。"
brief = '''
`x` は `any` です。`Stop` は `String() string` メソッドを持ち、宣言せずとも
`fmt.Stringer` を満たします。`42` は満たしません。`s` と `ok` を束縛して、
次の行が `if !ok { return "plain" }` にできるようにしてください — どちらの入力
でも、クラッシュせずに。（型 switch でもできますが、行数が増えます。）
'''
hints = [
  "二値形式のアサーションは panic する代わりに報告します。インタフェースの完全な名前は `fmt` にあります。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.cheatsheet_advanced.16.promoted"
title = "借りた声"
story = "銅鑼湾駅の状況サーバは中にロガーを抱えている。サーバのロギングを渡されたランナーは、プレフィックスなしで出力する。"
brief = '''
`run` は `func(string)` を欲しがっています。`srv` に束縛された `srv` のロギングを
渡し、`[mtr] up` と出力されるようにしてください。

```
type Logger struct{ prefix string }
func (l Logger) Log(s string) { fmt.Println(l.prefix, s) }
type Server struct {
    Logger
    addr string
}
func run(log func(string)) { log("up") }
srv := Server{Logger{"[mtr]"}, ":8080"}
```
'''
hints = [
  "埋め込みフィールドのメソッドは外側の構造体に昇格します。メソッドを呼ばずに名前だけ書くと、レシーバがすでに束縛された関数値になります。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.cheatsheet_advanced.17.generic-map"
title = "何でも入れて、何でも出す"
story = "怡和街の到着掲示板は列車番号を `[]int` で受け取り `[]string` が欲しい。アレックスは同じ四行のループを三度目に書くのを拒む。"
brief = '''
二つの型パラメータを持つジェネリックな `Map` を、
`Map([]int{1, 2, 3}, strconv.Itoa)` が `[]string{"1", "2", "3"}` を返すように
宣言してください。

```
// ____
    out := make([]U, 0, len(xs))
    for _, x := range xs {
        out = append(out, f(x))
    }
    return out
}
```
'''
hints = [
  "すべての型パラメータには制約が要ります。同じ制約を持つパラメータは `a, b int` と同じように共有できます。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.cheatsheet_advanced.18.ordered"
title = "大なりが使えるものなら何でも"
story = "金鐘のホームの温度計は名前付き整数型 `Celsius` で報告する。素の int 向けに書かれたジェネリックな比較はそれを拒む。"
brief = '''
`type Celsius int`。三つの呼び出しすべてがコンパイルできなければなりません:
`Max(3, 5)`、`Max(2.5, 1.0)`、`Max(Celsius(30), Celsius(28))`。
本体は組み込みの `max` を使い、それには `<` が使える型が要ります。
'''
hints = [
  "チルダなしで `int` を列挙する制約は、int から*派生した*すべての型を拒みます。標準ライブラリには `<` が使えるものすべてのための制約が一つあります。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "go.cheatsheet_advanced.19.generic-stack"
title = "残る push"
story = "アイランド線のアナウンサーの裏にある駅名スタックはあらゆる push を受け入れ、誰が見ても毎回空だ。"
brief = '''
`type Stack[T any] struct{ items []T }`。`var s Stack[string]` の後、
`s.Push("Tin Hau")` と `s.Push("Causeway Bay")` を経て、`len(s.items)` は
`2` でなければなりません。
'''
hints = [
  "ジェネリック型のレシーバは型パラメータを繰り返します。変更するメソッドにはポインタ形が要り、さもないとコピーを編集します。`append` は新しいスライスを返すので、誰かがそれを保持しなければなりません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "go.cheatsheet_advanced.20.sort-desc-safe"
title = "大きいものから、ラップなし"
story = "銅鑼湾の運賃残高ランキングには `int` の最上端の口座と最下端の口座があり、ソートがそれを逆順に置く。"
brief = '''
`xs` は `math.MaxInt` と `math.MinInt` の両方を含む `[]int` です。その場で
大きいものから順に並べ替えてください — その二つについても正しく。
'''
hints = [
  "遠く離れた二つの int の引き算はオーバーフローして符号が反転します。`cmp` に三方比較があります。そして `sort.Slice` の関数が受け取るのは要素ではなく添字です。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "go.cheatsheet_advanced.21.bisect"
title = "半分にしろ"
story = "アイランド線管制室のソート済み列車 id リストには一千万のエントリがあり、検索は毎回その全部を歩く。"
brief = '''
`xs` は昇順にソートされた `[]int` です。一行かつ O(log n) で、`i` に `7` の
位置（または挿入されるべき位置）を、`found` にそれがあるかどうかを設定してください。
'''
hints = [
  "`slices` パッケージには位置と bool の両方を返す検索があります。`sort.SearchInts` は位置しか返さず、`Index` はスライスを歩きます。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "go.cheatsheet_advanced.22.omitempty"
title = "空欄は省け"
story = "ラッキー・マックのアプリが送る配達員プロフィールは、徒歩の人全員で `bike` フィールドが空で、ダッシュボードは四十台の空の自転車を描く。"
brief = '''
`json.Marshal(Rider{Name: "Alex"})` は `{"name":"Alex"}` を、
`json.Marshal(Rider{Name: "Alex", Bike: "e-7"})` は
`{"name":"Alex","bike":"e-7"}` を返さなければなりません。それをするフィールド
宣言はどれでしょう?

```
type Rider struct {
    Name string `json:"name"`
    // ____
}
```
'''
hints = [
  "オプションは名前と同じ引用符の中に、コンマで区切って入ります — そして非公開フィールドはそもそもマーシャルされません。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "go.cheatsheet_advanced.23.scanner-buffer"
title = "行より長い"
story = "アイランド線ゲートログの夜間エクスポートは十万文字の一行で、リーダーは何も返さず、誰も印字しなかったエラーも返さない。"
brief = '''
`sc := bufio.NewScanner(os.Stdin)`。次の入力行は 100,000 バイトの長さです。
最初の `sc.Scan()` の前に置いて、そのスキャンを成功させる行はどれでしょう?
'''
hints = [
  "デフォルトのトークン上限は 64 KiB です。スキャナには初期バイトスライスと最大サイズを取るメソッドがあります — 引数は一つではなく二つ — そして split 関数はこれとは無関係です。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "go.cheatsheet_advanced.24.stable"
title = "同点はそのまま"
story = "金鐘の二百人のゲート係員が勤務表のために勤続年数でまとめられ、同じ年数の人たちが印刷のたびに入れ替わり続ける。"
brief = '''
`ps` は二百のエントリを持つ `[]P` で、
`less := func(i, j int) bool { return ps[i].S < ps[j].S }` とします。`S` が等しい
エントリが元の相対順序を保つことが保証されるように、`ps` を `S` で並べ替えてください。
'''
hints = [
  "`less` は添字を取るので、`slices` のものではなく `sort` パッケージのスライス関数に合います — そして二つのスライスソートのうち、同点をその場に保つと約束するのは一つだけです。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.cheatsheet_advanced.25.duration"
title = "ナノ秒ではなくミリ秒"
story = "銅鑼湾の停車時間はテキスト `250` で届き、ドアは開いてから二百五十ナノ秒後に閉まる。"
brief = '''
`s` は `"250"`、ミリ秒の数です。`n, err := strconv.ParseInt(s, 10, 64)`
（エラーなし）の後、`d` を `250ms` と出力される `time.Duration` にしてください。
'''
hints = [
  "変数の `int64` は `Duration` と掛け算できません — できるのは型なし定数だけです。先に数を変換してから、単位でスケールしましょう。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "go.cheatsheet_advanced.26.struct-key"
title = "同じセル、同じバケツ"
story = "配達員は待っている格子セルごとにまとめられる。怡和街の同じ角にいる二人目が一人目を消す。"
brief = '''
`type pt struct{ r, c int }`、`m` は `map[pt][]int` です（比較可能なフィールドの
構造体はキーとして問題ありません）。セル `(r, c)` の下に配達員 `id` を足し、
すでにある id は保ってください — キーが一度も見られていない場合も含めて。
'''
hints = [
  "存在しないキーは nil スライスとして読め、nil スライスへの append は問題ありません。結果は同じ値のキーの下に格納し直さなければなりません。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.cheatsheet_advanced.27.builder-ptr"
title = "ビルダーをコピーするな"
story = "アイランド線のアナウンスは一片ずつ組み立てられ、最後の一片を足すヘルパーが不正なコピーについてのメッセージでクラッシュする。"
brief = '''
`sb` はすでに `"Island"` を持つ `strings.Builder` です。`add(…, " Line")` —
シグネチャが要求する引数で呼んだ — の後に `sb.String()` が `"Island Line"` になり、
panic しないように `add` を宣言してください。
'''
hints = [
  "ゼロでない `Builder` を値で渡すとコピーされ、コピーへの最初の書き込みが panic します。ビルダーに `+=` はありません。二つの値を返すメソッドがあり、無視するのは構いませんが、参照外しは駄目です。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "go.cheatsheet_advanced.28.heap-pop"
title = "ヒープのてっぺん"
story = "ラッキー・マックの配車係の優先リストは一番急ぎの注文を渡す。三番目に渡される注文は、期限が一番遅いものだ。"
brief = '''
`IntHeap` は `Less` を `h[i] > h[j]` と書いて `heap.Interface` を実装しており、
`h` は `heap.Init(h)` で初期化済みの `*IntHeap` です。最大値を `int` の `x` に
取り出し、次の取り出しのためにヒープを有効なままにしてください。
'''
hints = [
  "あなたが型に書いたメソッドは最後の要素を取り除くだけです。ルートを取り出して再ヒープ化するのはパッケージ関数です。それは `any` を返します。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "go.cheatsheet_advanced.29.iota"
title = "ゼロ、一、二"
story = "金鐘の掲示板の MTR 三路線はどれも番号ゼロで、色の検索がそのすべてをアイランド線の青に塗る。"
brief = '''
`type Line int` は三要素の配列を添字で引く `String()` メソッドを持ちます。
`Island`、`TsuenWan`、`KwunTong` を `0`、`1`、`2` として — すべて `Line` 型で —
宣言してください。
'''
hints = [
  "`const` ブロックの中では、式のない定数は前の行の式全体を繰り返します — 型も含めて。上向きに数えるのは一つの式だけです。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.cheatsheet_advanced.30.errc"
title = "最初の悪い知らせ"
story = "アイランド線の八つの駅が一斉に ping される。一つがダウンを報告した瞬間に管制室は次へ移り、七つの ping 係が誰も開けることのない窓口に立ったままになる。"
brief = '''
ここでは `errgroup` なし — 標準ライブラリだけです。`n` 個のゴルーチンそれぞれが
`errc` にちょうど一つの `error`（しばしば `nil`）を送ります。`checkAll` は残りを
待たずに最初の非 nil エラーを返し、その後に送信でブロックしたままのゴルーチンが
残ってはいけません。`errc` を宣言してください。

```
func checkAll(n int) error {
    // ____
    for i := range n {
        go func() { errc <- check(i) }()
    }
    for range n {
        if err := <-errc; err != nil {
            return err
        }
    }
    return nil
}
```
'''
hints = [
  "`checkAll` が戻った後は、誰ももう受信しません。すべての送信側が受信側なしで自分の一回の送信を終えられなければなりません — 全員分のバッファサイズにしましょう。",
]
