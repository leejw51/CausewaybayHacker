```
'''
hints = [
  "sum(p.numel() for p in model.parameters()) — numel は数の個数であって、テンソルの個数ではありません。",
  "len(list(model.parameters())) はテンソルを数え、それは 2 です: 重み一つとバイアス一つ。",
]

