# ---------------------------------------------------------------- 25
[[quest]]
id    = "pytorch.verybasic.25.softmax"
title = "スコアを確率に"
story = "コンソールは生のスコアを三つ出力し、夜勤のオペレーターはモデルがどれだけ自信を持っているかと聞かれる。生のスコアに答えはない。"
brief = '''
ソフトマックスはスコアの行を確率の行に変えます: すべて正で、行の合計は 1。`dim=` はどの軸の合計を一にするかを言います — クラススコアの行なら、それは最後の軸です。

行に沿ってソフトマックスを取る行を選んでください。

```
output: 1.0 2
```
