[[quest]]
id    = "pytorch.verybasic.12.sum-axis"
title = "合計ではなくラックごとに"
story = "電力レポートは格子のすべての数を足し、地下全体で一つの数字を出力する。設備担当はラックごとに一つの数字を欲しがっている。"
brief = '''
`x.sum()` はすべてを一つの数に畳みます。`dim=` は *どの軸を畳むか* を言います: `dim=1` は列に沿って足し、行ごとに一つの数を残します。

行ごとに一つの合計を出す行を選んでください。

```
output: [6, 15]
```
'''
hints = [
  "x.sum(dim=1) — dim は消える軸の名前で、列は軸 1 です。",
  "dim=0 は代わりに行を畳み、列ごとに一つの数を返します。",
]

