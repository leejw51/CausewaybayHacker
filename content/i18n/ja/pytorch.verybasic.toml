'''
hints = [
  "nn.Linear(4, 2) — 入力の特徴量が先、出力の特徴量が後です。",
  "nn.Linear(2, 4) は層を逆向きに作り、入力がもう合いません。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "pytorch.verybasic.23.parameters"
title = "どれだけ大きいか"
story = "助成金の申請書はパラメータ数を求め、誰の手元にもある数は層の数だけだ。"
brief = '''
`model.parameters()` はモジュールが持つすべての学習可能なテンソルを順に返し、`p.numel()` はその一つに入っている数の個数です。`Linear(4, 2)` は `(2, 4)` の重みと `(2,)` のバイアスを持ちます: 8 + 2 = 10。

それらを合計する行を選んでください。

```
