[[quest]]
id    = "pytorch.verybasic.18.transpose"
title = "逆向きの表"
story = "混合表は行と列が逆になって届き、matmul は内側の次元が一致しないと言う。"
brief = '''
`x.t()` は 2 次元テンソルの二つの軸を入れ替えます: `(2, 3)` は `(3, 2)` になり、行 `i` 列 `j` が行 `j` 列 `i` になります。

表を転置する行を選んでください。

```
output: [[1, 4], [2, 5], [3, 6]]
```
'''
hints = [
  "x.t() — 短いほうで、メソッド呼び出しなので括弧が要ります。",
  "x.reshape(3, 2) も (3, 2) を返しますが、数が間違ったセルに入ります。",
]

