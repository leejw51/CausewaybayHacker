[[quest]]
id    = "pytorch.verybasic.13.mean"
title = "吸気の平均"
story = "吸気温度が四つ、そして平均は毎回きっかり整数で出てくる。冷却曲線はそれを信じない。"
brief = '''
`mean` は浮動小数点のテンソルに対してしか定義されていません — 整数のテンソルは黙って丸めるのではなく例外を投げます。`x.float()` は浮動小数点のコピーを返し、その平均は浮動小数点です。

四つの読み取りの平均を取る行を選んでください。

```
output: 2.5
```
'''
