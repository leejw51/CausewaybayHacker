[[quest]]
id    = "pytorch.verybasic.14.argmax"
title = "どれが勝ったか"
story = "分類器は選んだクラスのスコアを出力する。それは誰にも使いようのない数だ。問いはずっと、どのクラスか、だった。"
brief = '''
`max` は最大の値を返します。`argmax` は最大の値が *どこに* あるか — インデックス — を返し、それこそが分類器の答えです。

最大のスコアのインデックスを返す行を選んでください。

```
output: 2
```
'''
hints = [
  "scores.argmax() — arg は「その位置のインデックス」の意味で、その位置の値ではありません。",
  "scores.max() は 0.9 を返し、それはスコアであってクラスではありません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.verybasic.15.mask"
title = "線を越えた"
story = "吸気温度が六つ、熱遮断は 30。アラームは Python のループで数え、そのループは読み取り間隔の中に収まっている。"
brief = '''
テンソルを数と比べると、要素ごとに一つの `True`/`False` のテンソルになります。その真偽値テンソルを足すと `True` の数が数えられます。`True` は 1 だからです。

30 を厳密に超える読み取りを数える行を選んでください。

```
output: 2
```
'''
hints = [
  "(t > 30).sum() — 括弧が効きます。.sum() は > より強く結びつくからです。",
  "t >= 30 は遮断値ちょうどの読み取りも含みますが、それは超えてはいません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.verybasic.16.cat"
title = "二つのバッチを一つに"
story = "キャプチャファイルが二つ、それぞれ二行。ローダーは四行のテンソル一つを受け取るまで何もしようとしない。"
brief = '''
`torch.cat` はすでにある軸に沿ってテンソルをつなぎます。二つの `(2, 2)` を `dim=0` に沿ってつなぐと行が積み重なり、`(4, 2)` になります。

四行の一つのバッチを作る行を選んでください。

```
output: (4, 2)
```
'''
hints = [
  "torch.cat([a, b], dim=0) — テンソルはリストに入れ、dim=0 が行の軸です。",
  "torch.stack は代わりに新しい軸を作るので、形は (2, 2, 2) になります。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.verybasic.17.unsqueeze"
title = "一つだけのバッチ"
story = "一つの読み取りを、バッチしか見たことのないモデルに渡す。モデルは拒む: 二次元が欲しいのに一次元を渡されたのだ。"
brief = '''
バッチで訓練されたモデルは、先頭にバッチの軸があることを期待します。`unsqueeze(0)` は位置 0 にサイズ 1 の新しい軸を差し込み、`(3,)` を `(1, 3)` — 一つのサンプル、三つの特徴量 — に変えます。数は一つも変わりません。

一つの読み取りを大きさ一のバッチにする行を選んでください。

```
output: (1, 3)
```
'''
hints = [
  "one.unsqueeze(0) — 0 は新しい軸の入る場所で、バッチの軸は先頭に入ります。",
  "unsqueeze(1) は (3, 1) を返し、それは特徴量一つのバッチが三つ — 逆向きです。",
]

