[[quest]]
id    = "pytorch.verybasic.19.requires-grad"
title = "学習するもの"
story = "地下で最初のパラメータ。数を一つ持っているが、それをどちらへ動かせばいいのか、今のところ何も知らない。"
brief = '''
テンソルは、頼まれたときだけ自分に起きたことを記録します。`requires_grad=True` はテンソルを学習されるものとして印を付け、それ以降、それに対するすべての演算が記憶されて、勾配をさかのぼってたどれるようになります。

2.0 を持つ学習可能なテンソルを作る行を選んでください。

```
output: True 2.0
```
'''
hints = [
  "torch.tensor(2.0, requires_grad=True) — フラグはコンストラクタのキーワード引数です。",
  "requires_grad は浮動小数点のテンソルでしか使えません。int のテンソルは勾配を持てません。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "pytorch.verybasic.20.backward"
title = "下はどっちか"
story = "`w` は 3.0、損失は `w * w`、そして `w.grad` は None。まだ誰もグラフに逆向きに走れと言っていない。"
brief = '''
順伝播がグラフを作り、`backward()` がそれを逆にたどって `.grad` に勾配を残します。`y = w * w` の導関数は `2w` なので、`w = 3.0` での勾配は `6.0` です。

逆伝播を走らせる行を選んでください。

```
output: 6.0
```
'''
hints = [
  "y.backward() — 呼ぶのは損失、つまりグラフの終端に対してであって、パラメータに対してではありません。",
  "w.backward() はパラメータに自分自身を微分させようとするもので、backward の意味するところではありません。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "pytorch.verybasic.21.no-grad"
title = "見ている間はやめて"
story = "評価のパスは使いもしないグラフを作り、検証セットを採点するたびに地下のメモリのグラフが上がっていく。"
brief = '''
推論にグラフは要りません。torch には、包んだブロックの間だけ記録を切るコンテキストマネージャがあります。結果は `requires_grad` が偽で出てきて、決して起きない逆伝播のために何も保持されません。

`with` はもう書いてあります。それが入るコンテキストマネージャを作る行を選んでください。

```
output: False
```
'''
hints = [
  "名前がそのまま働きを言っているものです: ブロックの間、勾配なし。",
  "呼び出さなければなりません — 属性そのものはコンテキストマネージャではなく、`with` は受け付けません。",
]

