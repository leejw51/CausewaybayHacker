# ZIG LAND — VERY BASIC, in Japanese. A translation pack (SPEC §12.1): the
# prose of `content/zig/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers and printed strings are copied verbatim.

pack   = "zig.verybasic"
locale = "ja"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.verybasic.01.print"
title = "ブースの第一声"
story = "06:00、銅鑼湾側の坑口。1 番ブースの表示板は一行でシフトを始めるはずなのに、その一行がない。"
brief = '''
プログラムは正確に `hello, causewaybay` と改行を出力しなければなりません。`w` は
バッファ付きの stdout ライタです。その `print` は書式文字列と引数のタプルを取り
(引数がないときは空のタプル `.{}`)、失敗することがあるので、呼び出しは
`try` しなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "try w.print(\"hello, causewaybay\\n\", .{}); — try、書式文字列、空のタプル。",
  "print は必ず二つの引数を取ります。そして失敗しうる呼び出しは、そのエラーを捨てることが許されません。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.verybasic.02.int-types"
title = "I32 に収まらない数"
story = "料金所の年次報告は通行台数を十億単位で数え、その数を保持していたレジスタは 32 ビット幅だ。"
brief = '''
`i32` の `a` を読みます。プログラムには `big` が要ります。`a` の十億倍を保持する
`i64` で、`a` が 2 を超えると `i32` には収まらない値です。Zig は算術を被演算子の
型で行い、`-O Debug` では収まらないとき `panic: integer overflow` で止まります。
ですから `a` は掛け算の後ではなく前に `i64` へ広げなければなりません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
output: 3000000000
```
'''
hints = [
  "const big: i64 = @as(i64, a) * 1000000000; — 先に a を広げ、それから 64 ビットで掛けます。",
  "a * 1000000000 は i32 と i32 に収まる定数の積なので、積も i32 です。三十億は収まりません: panic: integer overflow。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.verybasic.03.floats"
title = "小数の通行料"
story = "シフト報告は朝の売上を通過台数で割り、監督がセントを望んだところにドルの整数を出力する。"
brief = '''
正の整数 `a` と `b` を読みます。プログラムには商を `f64` で持つ `q` が要ります。
Zig は数を勝手に変換しません。整数どうしの割り算は整数で、`@floatFromInt` が
整数を浮動小数点数に変えるのは、どの浮動小数点数かを `@as(f64, ...)` で
包んで教えられたときだけです。`{d:.2}` での出力は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "const q: f64 = @as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b)); — 割り算の前に両辺が f64 になります。",
  "@floatFromInt(a) / @floatFromInt(b) はコンパイルできません: 式の途中ではビルトインがなるべき結果の型がないからです。@divTrunc(a, b) は浮動小数点数になる前に 3 です。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.verybasic.04.strings"
title = "名前の長さ"
story = "Autotoll のアカウント名は台帳の一行で、監査はその長さを文字数で欲しがっている。"
brief = '''
`s` は改行を取り除いた入力行です。`[]const u8`、つまりバイトのスライスです。
プログラムはそれが何バイトを持つかを出力しなければなりません。スライスは長さを
メソッドではなくフィールドとして持っています。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  kwan lee
output: 8
```
'''
hints = [
  "try w.print(\"{d}\\n\", .{s.len}); — len はスライスのフィールドなので、括弧はありません。",
  "@sizeOf([]const u8) はスライスそのものの大きさ(ポインタと長さで 16 バイト)で、それが指すテキストの大きさではありません。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.verybasic.05.bool-if"
title = "偶数か奇数か"
story = "料金所は車軸数が偶数なら左の車線へ、奇数なら右へ送り、どちらかを決める集計は決して考えを変えない。"
brief = '''
`i64` の `n` を読みます。プログラムには `even` が要ります。`n` が二で割り切れる
ときに真になる `bool` です。符号付き整数に対して Zig は `%` 演算子を拒みます
(余りの符号があいまいだからです)。そして `@mod` か `@rem` を名指しで求めます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  4
output: even
```
'''
hints = [
  "const even = @mod(n, 2) == 0; — 名指しの余り、それから比較。",
  "n % 2 は i64 ではコンパイルできません: 符号付き整数は @rem か @mod を使わなければなりません。そして @divTrunc(n, 2) は商で、余りではありません。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.verybasic.06.loops"
title = "車軸を数える"
story = "n 台が 2 番ブースを通り、記録はその番号を足し合わせるが、使っているループは一つ早く始まり一つ手前で止まる。"
brief = '''
`n` を読みます。プログラムは `1 + 2 + … + n` を `sum` に足し込まなければなりません。
ループの本体は書いてあります。`i` を 1 から `n` まで歩かせる `for` の見出しが
穴です。範囲 `a..b` に対する `for` は `a` から始まり `b` の手前で止まり、値は
括弧の後の `|i|` で捕捉されます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  10
output: 55
```
'''
hints = [
  "for (1..n + 1) |i| { — 範囲の終わりは含まれないので、n の一つ先です。",
  "1..n は n - 1 で止まります。Zig に ..= はありません。そして範囲に対する for は値を捕捉しないとコンパイルできません。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.verybasic.07.functions"
title = "その二乗"
story = "車線センサが読み値を報告し、表示板はその二乗を欲しがるのに、それをするはずの関数は読み値をそのまま返す。"
brief = '''
`square` は `i64` を取り、その数をそれ自身と掛けたものを返さなければなりません。
その return が穴です。`main` は `x` を読み `square(x)` を出力します。Zig の文は
すべてセミコロンで終わり、`^` はべき乗ではありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  7
output: 49
```
'''
hints = [
  "return x * x; — 掛けて、その結果を返します。",
  "Zig の ^ はビットごとの XOR で、べき乗ではありません: 7 ^ 2 は 5 です。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.verybasic.08.structs"
title = "伝票一枚、フィールド二つ"
story = "ブース職員の食堂の伝票は品目ごとに名前と値段を持つのに、新しい注文の記録は作られないままだ。"
brief = '''
`Item` は `name` と `price` を持ちます。プログラムは両方を読み終えていて、
それらから作る `Item` の `s` が要ります。構造体は波括弧で初期化し、どの
フィールドもドット付きで名指しします(`.field = value`)。書き漏らした
フィールドはゼロではなくコンパイルエラーです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "const s = Item{ .name = name, .price = price }; — 波括弧、先頭にドットを付けてすべてのフィールドを名前で。",
  "Item{ name, price } は構造体ではありません: 位置によるフィールドはタプルのものです。Item{ .name = name } は price が欠けていて、Zig はそれを推測しません。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.verybasic.09.struct-method"
title = "伝票自身の合計"
story = "食堂の伝票はどれも自分の値段と数量を知っているのに、その `total()` は値段だけで答える。"
brief = '''
`Item.total` は `price` と `qty` の積を返さなければなりません。メソッドとは構造体の
中で宣言された関数で、最初の引数がその構造体自身です。フィールドにはその引数を
通して届きます。暗黙の `this` はありません。return が穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "return self.price * self.qty; — 両方のフィールドを self 経由で、掛け合わせます。",
  "裸の price は total の中ではコンパイラが知っている名前ではありません: フィールドには引数を通してしか届きません。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.verybasic.10.enums"
title = "二つの路線、二つの色"
story = "トンネルの銅鑼湾側出口の標識は MTR の二つの路線を示すが、列挙子を選ぶ配線が切れている。"
brief = '''
`island` か `tsuenwan` の一語を読みます。プログラムにはその語で選ばれた `Line` の
`line` が要ります。色を出力する `switch` は書いてあります。Zig では `if` は式なので
宣言の右辺に置けます。そして二つのスライスは `==` ではなく必ず `std.mem.eql` で
比べます。型が宣言されていれば、列挙値はただ `.island` と書けます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = if (std.mem.eql(u8, word, \"island\")) .island else .tsuen_wan; — if 式、スライスは中身で比べます。",
  "word == \"island\" はスライスをポインタと比べることになり、コンパイルできません。Zig に ? : 演算子はなく、if/else が式です。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.verybasic.11.vector"
title = "硬貨を一枚ずつ"
story = "4 番ブースのトレイに硬貨が一枚ずつ落ちるのに、集計リストは決して伸びない。"
brief = '''
整数の一行を読みます。各値 `x` は読まれたとおりに `std.ArrayList` の `xs` に追加
されなければなりません。ループと出力は書いてあります。ArrayList はアロケータを
持っていません。伸びる可能性のある呼び出しにはすべて `gpa` を渡し、それは失敗
しうるので `try` します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "try xs.append(gpa, x); — アロケータが先、それから値、そして前に try。",
  "append(x) だけでは引数が一つ足りません: リストはアロケータを覚えていません。try がなければエラーユニオンが無視され、それはコンパイルエラーです。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.verybasic.12.vector-edit"
title = "最初に通った一台"
story = "遮断機の待ち行列は車両番号のリストで、最初の一台はもう通ったのに、まだリストに載っている。"
brief = '''
`v` は行の整数を持っています。プログラムは最初の要素を取り除き、残りを順に出力
しなければなりません。ArrayList には残りの順序を保つ remove と、最後の要素で
すき間を埋める remove があります。どちらも取り除いた値を返し、Zig はその値を
床に捨てることを許しません。代入しなければならず、誰も要らないなら `_` にです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "_ = v.orderedRemove(0); — 添字 0、残りは前に詰められ、返された値は意図して捨てられます。",
  "swapRemove(0) は最後の要素を 0 番に移し、順序が失われます。pop() は最後の一つを取ります。そして _ = のない orderedRemove は値の無視で、コンパイルできません。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.verybasic.13.list"
title = "列の先頭へ"
story = "故障車線は呼び出しを連結リストに保存していて、新しいものはどれも先頭に入るはずだ。"
brief = '''
整数の一行を読みます。各 `item` は `std.DoublyLinkedList` の `l` の先頭に
つながれなければならず、最後に読んだものが最初に出力されます。このリストは
侵入型です: 各 `Item` に埋め込まれた `node` フィールドをポインタでつなぎます。
それらを出力する走査は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "l.prepend(&item.node); — リストは埋め込まれたノードをポインタでつなぎます。",
  "append は入力の順序を保ちます。逆にするのは先頭です。そしてリストは *Node を取るので、& は省けません。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.verybasic.14.maps"
title = "集計ボード"
story = "料金所の集計ボードは通る車両の種類ごとに数を数えるのに、その数は決して動かない。"
brief = '''
単語の一行を読みます。各 `word` について、`std.StringHashMap(i64)` である `counts`
の数が一つ増えなければなりません。`get` はオプショナルで答えます。まだ見ていない
単語には `null` で、`orelse` がそれをゼロに変えます。そして `put` が新しい数を
格納します。ループと並べ替えた出力は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "try counts.put(word, (counts.get(word) orelse 0) + 1); — 既定値付きで読み、一を足し、格納します。",
  "counts.get(word) + 1 はコンパイルできません: get は ?i64 を返し、オプショナルは orelse で中身を取り出すまで足し算できません。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.verybasic.15.hashtable"
title = "引くか、引かないか"
story = "料金表は車両の種類をキーにしたハッシュマップで、誰も聞いたことのない種類の問い合わせには、でっち上げのゼロではなくマイナス一で答えなければならない。"
brief = '''
`table` は名前を値段に対応させ、一行目から作られます。名前 `q` を一つ読みます。
プログラムには `price` が要ります。キーがあれば表の値、なければ `-1` です。
`get` はオプショナルを返し、オプショナルは中身を取り出すまで数ではありません。
`orelse` は既定値を与え、`.?` は `null` でパニックします。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "const price = table.get(q) orelse -1; — オプショナルと、それが null のときに使うもの。",
  "ないキーに table.get(q).? は panic: attempt to use null value です。そして裸の ?i64 は {d} で出力できません。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.verybasic.16.sets"
title = "どのナンバーも一度ずつ"
story = "カメラからはナンバーが重複して届き、台帳にはそれぞれ一度ずつ、順に載るべきだ。"
brief = '''
整数の一行を読みます。各 `x` は集合の `seen` に入らなければなりません。Zig の std
には集合型がありません。値の型が `void` のハッシュマップが集合で、`void` の値は
`{}` と書きます。個数と並べ替えた値の出力は書いてあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "try seen.put(x, {}); — キーと、void 型のただ一つの値。",
  "put は値が何もないときでもキーと値を取ります。append はリストの言葉で、マップには追加する末尾がありません。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.verybasic.17.stack"
title = "後入れ先出し"
story = "5 番ブースでは領収書が伝票刺しに刺され、上から外されるので、係員は下から上へと読む。"
brief = '''
整数の一行を読みます。それらはすべてスタックとして使う `ArrayList` の `st` に
積まれます。プログラムはそれから一つずつ上から取り出し、最後に入れたものから
値を出力しなければなりません。`pop` はオプショナルを返します(一番上の値、
スタックが空になれば `null`)。そして `while` は一周ごとにそれを一つ取り出し、
`null` で止まれます。ループの見出しが穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while (st.pop()) |top| { — pop し、値を捕捉し、null で止まります。",
  "for (st.items) はリストを前から後ろへ歩き、何も取り出しません。popOrNull は古い std の名前です。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.verybasic.18.queue"
title = "先入れ先出し"
story = "6 番ブースには車両が並び、来た順に処理されるが、キューは誰も受け取らない。"
brief = '''
整数の一行を読みます。各 `x` は `std.Deque(i64)` の `q` の末尾に積まれなければ
なりません。プログラムはそれから来た順に先頭から取り出します。ArrayList と同じく、
Deque は伸びる可能性のある呼び出しのたびに `gpa` を渡されます。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 1 2 3 4
```
'''
hints = [
  "try q.pushBack(gpa, x); — 末尾に入れ、先頭から取るには popFront。",
  "pushFront は一つずつ前のものの前に置くので列が逆になります。Deque に素の push はなく、アロケータを覚えることもありません。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.verybasic.19.heap"
title = "次はいちばん軽いもの"
story = "計量台は毎回いちばん軽いトラックを次に通すのに、それを渡すはずのヒープは上下逆さまだ。"
brief = '''
整数の一行を読みます。プログラムはそれらをすべて `std.PriorityQueue` の `pq` に
積み、一つずつ取り出します。小さいものから出てこなければなりません。キューの
順序は宣言に使った関数で決まります: `byValue` は二つの要素について
`std.math.Order` で答え、それが小さいと言った要素が先に出ます。その return が
穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "return std.math.order(a, b); — a が小さければ a が b より先: 最小ヒープです。",
  "order(b, a) は同じ比較の上下逆さまで、スターターにある最大ヒープです。a < b は bool で、キューは Order を欲しがります。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.verybasic.20.sorting"
title = "通行料の順"
story = "通行料は車両が来た順に記録され、報告は小さいものから並べたがっている。"
brief = '''
`v` は行の整数を持っています。プログラムは `v.items` をその場で昇順に並べ替え
なければなりません。`std.mem` のソートは要素の型、スライス、コンテキスト
(ないときは `{}`)、そして順序を取ります。`std.sort` は関数ではなく名前空間で、
`asc` と `desc` はそこにあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "std.mem.sort(i64, v.items, {}, std.sort.asc(i64)); — 型、スライス、空のコンテキスト、順序。",
  "std.sort.desc は降順に並べます。std.sort(...) は名前空間を呼んでいます。そしてソートはスライスだけでなく、型と順序を欲しがります。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.verybasic.21.sort-by-key"
title = "いちばん忙しいブースを先に"
story = "売上表は各ブースの名前と合計を並べていて、ボードはいちばん大きいものを一番上に欲しがっている。"
brief = '''
`rows` は `Row{name, score}` のレコードを持っています。プログラムはそれらを
`score` の高い順に並べ替えなければなりません。Zig にはラムダがありません: 比較
関数は名前付きの関数 `byScoreDesc` で、名前で `std.mem.sort` に渡され、`a` が
`b` より先に来るとき `true` と答えます。その return が穴です。スコアはすべて
異なります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  3
        mei 40
        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "return a.score > b.score; — 比較関数は「a が先に来るか」に答えます。",
  "< は最小のものを先にします。それがスターターのしていることです。二つの Row を丸ごと > で比べることはできません。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.verybasic.22.reverse"
title = "後ろから前へ"
story = "車軸の読み値は新しいものから記録され、報告は古いものから読む。"
brief = '''
`v` は行の整数を持っています。プログラムは `v.items` をその場で逆順にしなければ
なりません。`std.mem` にある、スライス全体に対する関数で、要素の型を最初に
渡します。ArrayList 自身には reverse がありません。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "std.mem.reverse(i64, v.items); — 要素の型、それからスライス。",
  "v.items[1..] は最初の要素をその場に残します。そして呼ぶべき v.reverse() はありません。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.verybasic.23.closures"
title = "割増料金"
story = "どの通行料にも同じ割増料金が足されるのに、その割増料金を覚えておくはずのものが忘れている。"
brief = '''
`k` を読み、それから整数の一行を読みます。どの値にも `k` が足され、結果が出力
されます。Zig にはクロージャがありません(関数は周りのローカル変数を見られません)。
ですから最も近いものがここに書いてあります: `k` をフィールドに持つ構造体
`Adder` で、メソッド `call` が `self` を通してそれに届きます。メソッドの return が
穴です。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return x + self.k; — k は構造体が持っているもので、self を通して届きます。",
  "x + k はコンパイルできません: main の k は call の中からは見えません。Zig では何も捕捉しないからです。構造体のフィールドがその捕捉です。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.verybasic.24.lambdas"
title = "偶数の車線を数える"
story = "料金所に並ぶ車線の番号はリストで届き、事務所はそのうちいくつが偶数かを知りたがっている。"
brief = '''
`v` は行の整数を持っています。プログラムには `evens` が要ります。そのうちいくつが
偶数かで、`countIf` が数えます。これはスライスと述語、つまり関数ポインタ
`*const fn (i64) bool` を取ります。ラムダに対する Zig の答えは、無名構造体の中で
宣言した関数を名前で取り出すことで、すべて一行です: `struct { fn f(...) ... }.f`。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "const evens = countIf(v.items, struct { fn f(x: i64) bool { return @mod(x, 2) == 0; } }.f); — 構造体の中で宣言され、名前で取り出される関数。",
  ".f がなければ引数は関数ではなく型です。裸の fn は宣言で、呼び出しの中には置けません。== 1 は奇数のほうを数えます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.verybasic.25.threads"
title = "ブース一つ、スレッド一本"
story = "7 番ブースはメインスレッドが待つ間に二本目のスレッドで売上を合計するのに、そのスレッドは一度も起動されない。"
brief = '''
`v` は行の整数を持ち、`sumInto(xs, out)` はそれらを `out` に合計します。
プログラムには `t` が要ります。`v.items` と `result` へのポインタで `sumInto` を
走らせるために起動された OS スレッドです。`main` はそれを join して出力します。
`std.Thread.spawn` は設定(既定値なら `.{}`)、関数、そしてタプルにした引数を取り、
失敗することがあります。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "const t = try std.Thread.spawn(.{}, sumInto, .{ v.items, &result }); — 設定、関数、タプルの引数。",
  "sumInto は *i64 を欲しがるので、引数は result ではなく &result です。そして spawn は失敗しうるので、try がなければ join するものがありません。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.verybasic.26.mutex"
title = "一つのカウンタに四本の手"
story = "料金所の事務所で四つのブースが一つのカウンタに足し込み、ミューテックスは一度も取られないまま周回ごとに返される。"
brief = '''
四本のスレッドがそれぞれ `counter` に一を十万回足します。ループの各周回は、
足す間ミューテックス `mu` を保持していなければなりません。閉じ波括弧で
ロックを外す `defer` は書いてあります。ロックを取る行が穴です。`std.Io.Mutex` は
`io` を手にしてロックします。`lock` は取り消されることがありエラーユニオンを
返し、取り消せない素の形は何も返しません。誰も保持していないミューテックスの
アンロックは `unreachable` で、`-O Debug` ではそれはパニックです。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "mu.lockUncancelable(io); — 今ロックし、すでにある defer が周回の終わりにアンロックします。",
  "mu.lock(io) はエラーユニオンを返し、work はそれを無視することも返すこともできません。誰も保持していないミューテックスへの mu.unlock(io) は到達不能コードへの到達です。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.verybasic.27.binary-tree"
title = "THE OVERFLOW"
story = "06:00、3 番ブース。車軸カウンタは `u8` で、朝の二百五十六本目の車軸が `panic: integer overflow` として通り、遮断機は下りたままだ。深夜からの領収書は、それを収められるだけ広い探索木へ、手で索引をつけ直さなければならない。"
brief = '''
今回の `val` は `i64` で、十分に広い型です。`insert` は `v` を、オプショナルな
ポインタ `n` を根とする探索木に入れます。`null` の場合は書いてあり、アリーナから
新しいノードを作ります。穴は `v` を正しい側へ送る一行です。`node.val` より
小さければ左、そうでなければ右で、再帰が返すものを格納します。呼び出しは
メモリを確保するので `try` します。子は `?*Node` で、そのまま下へ渡します。
誰かが確かめる前に `.?` で取り出してはいけません。そのあと中間順の走査が
昇順に出力します。

それをする行を選び、`// FILL` コメントの場所に打ってください。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); — 片側に再帰し、その結果を格納します。",
  "node.left.? は誰も確かめないうちに取り出された null の子で、二回目の insert で panic: attempt to use null value になります。子はオプショナルのまま下へ渡します。そして小さいほうは左です。",
]
