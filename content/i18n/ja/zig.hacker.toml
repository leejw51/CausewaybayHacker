# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.hacker.29.dijkstra"
title = "どの通りも同じ長さではない"
story = "これまで片付けたマップはどれもホップを数えていた。トラムは停留所がいくつあるかを気にしない。それにどれだけ時間がかかるかを気にする。"
brief = '''
標準入力は `n m seed` です: `n` 個の停留所、`m` 本の重み付きの無向辺。グラフは
**まさに**この生成器で、折り返す `u64` で、自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

停留所 `0` から到達できるすべての停留所への最短距離の合計(`0` 自身を含み、
それは `0` です)を出力し、それから `MAX <the largest of them>` を出力してください。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**ここでは計算量が強制されます。** 隠しケースは `n = 200000`、`m = 400000` です —
C++ の面接が落ち着いた大きさで、答えが同じ答えになるようにここでも保たれて
います。どちらにしても Dijkstra が正しいアルゴリズムです。時計が決めるのは優先度
付きキューです。最小値を求めて未訪問のノードをすべて走査するのは `O(V²)` で、
`n = 200000` ではそれは一つ一つに範囲検査のある `4 × 10^10` 回の読み出しで、五秒の
実行時間の制限内に戻ってきません。二分ヒープならそれは `O((V + E) log V)` になり、
**0.17 s** で終わります。このクエストに同梱された二つのプログラムで、このマシンで
測ったものです: スターターが走査する版です。

はっきり見ておく価値があります。時間制限付きの選考に落ちる最もよくある形だから
です: **スターターは間違っていません。** まさに正しい答えを出力します。拒まれる
のは、着くのが遅すぎるからだけです。

Zig らしい注意を二つ。隣接はノードごとのリストではありません: この大きさでは
二十万の別々の `ArrayList` がアルゴリズムより高くつくので、スターターはすでに
**圧縮された**隣接を作っています — 三本の平らなスライスで、`u` の辺は
`to[start[u] .. start[u + 1]]` です — そしてヒープの版も同じスライスを読みます。
そして `std.PriorityQueue` は与えた順序についての最小ヒープなので、距離で順序
付けた `(distance, node)` の項目に反転は要りません。decrease-key はなく、要り
ません: 改善した距離を新しい項目として push し、pop した項目の距離が記録済みの
ものよりすでに悪ければ飛ばします。その「古い項目」を飛ばすのは人が忘れる行で、
それがないとヒープは際限なく大きくなります。
'''
hints = [
  "Entry = { d, u } と、std.math.order(a.d, b.d) を返す byDistance による std.PriorityQueue(Entry, void, byDistance): ヒープは与えた順序についての最小ヒープなので、何もひっくり返す必要はありません。",
  "if (top.d > dist[top.u]) continue; が古い項目を飛ばすものです。それがなくてもアルゴリズムは正しいままで、ヒープが古くなった項目でいっぱいになります。",
  "生成器の全域木の半分がすべてのノードの到達可能性を保証するので、inf に対するフィルタが実際に何かを取り除くことはありません — それでも残しておいてください。到達できないノードのある版のこの問題が、続きの質問だからです。",
]

