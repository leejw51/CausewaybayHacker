# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.hacker.17.lis"
title = "最長の上り"
story = "日々の売上、言いたいだけの数、それをシードから自分で作る。求められているのは売上が伸び続けた最長の期間で、日が連続している必要はない。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **まさに**
この生成器で、**折り返す**演算子 `*%` と `+%` を使った `u64` の算術で、自分で
作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

最長の**真に増加する部分列**の長さを出力してください — 値は順序を保ちますが、
隣り合っている必要はありません。それから `TAILS <k>` を出力します。`k` は同じ
長さで、ペイシェンスソートの山の数から読んだものです。

```
input:  8 1
output: 3
        TAILS 3
```

`8 1` では配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
で、その中の最長の上りは `93944146 392341189 822192870` です。アルゴリズムの
バグを探しに行く前に、その行と照らして生成器を確かめてください。

**このクエストは計算量を強制します。** スターターは `O(n²)` の表です — 何も
見ずに書けるべき答えで、間違ってはいません。`n = 200000` では、速いものが出力
するのと同じ `881` を `2 × 10^10` 回の比較の後に出力するでしょうが、すべての
範囲検査がオンの Debug ビルドでは五秒の実行時間の制限内に戻ってきません。
目にするのは間違った答えではなくタイムアウトです。それがこの問題が生み出す
ために存在する失敗です。

`O(n log n)` のものは、各長さについて、その長さの部分列が終わりうる最小の値を
保持します — 常に並んでいるリストなので、新しい値の位置は二分探索で、
`std.sort.lowerBound` がその探索です。それは `n = 200000` を **0.04 s** で片付け
ます。このクエストに同梱されたプログラムで、このマシンで測ったものです。

生成器について一つ注意を。この問題で Zig が付け加える半分だからです。`u64` に
対する素の `*` や `+` がオーバーフローしても、ここでは折り返しではありません:
Debug では最初の一歩で `panic: integer overflow` です。生成器は折り返しを意図
しているので、そう言います — `x *% 6364136223846793005 +% 1442695040888963407`
— そしてコンパイラがその違いを守らせます。`u64` で生成し、剰余を取り、それから
`i64` に `@intCast` してください。
'''
hints = [
  "tails は部分列ではありません。その長さが答えで、中身は最良の終わりの値にすぎません。",
  "真に増加するとは、value 以上である最初の tail を置き換えるという意味で、それはまさに std.sort.lowerBound が返すものです — そのコンテキストは value で、比較は std.math.order(value, item) です。",
  "大きなケースがタイムアウトしても、答えには何も間違いはありません — ここではループの形が答えなのです。200000 個の値に対する二重ループは 2 x 10^10 回の比較です。",
]

