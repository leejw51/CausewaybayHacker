[[quest]]
id    = "zig.hacker.34.stable-sort"
title = "同点は席を守る"
story = "二人のライダーが同じスコアで終わり、順位表は描き直すたびに二人を違う順に並べる。"
brief = '''
標準入力は `n buckets seed` です。`n` 人のライダーを作ります。ライダー `i` は
添字 `i` とスコアを持ちます:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

ライダーをスコアの**降順**に並べ替えてください。同じスコアのライダーは届いた順を
保たなければなりません。その添字をスペース区切りで出力し、それから `TIES <k>` —
並べ替えた順で隣り合う組のうちスコアが等しいものの数 — を出力します。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` は小さいので、ほとんどすべてが同点で、答えはほぼ完全にそれらに何が
起きるかで決まります。

**これは自分が持っているのがどのソートかを知ることについてのクエストです。** Zig は
二つを出荷していて、その名前がどちらがどちらかを言っています。
`std.mem.sortUnstable` はパターンを打ち破るクイックソートです: 等しい要素の順序に
ついて何も約束せず、本物の入力では目に見えてそれを保ちません — その分割の段階は
当然のように等しい要素をピボットの向こうへ入れ替えます。`std.mem.sort` はブロック
ソートで、**安定**で、その約束のために少し仕事をします。スターターはスコアだけを
見る比較関数で `sortUnstable` を使い、隠しケースはそれが明らかにそれらをかき
混ぜるほど大きいです。(`n = 8` では不安定なほうは挿入ソートに切り替わり、たまたま
順序を保ちます — だから小さなテストでは何も証明できなかったでしょうし、だから
ここでの小さなケースは、あなたを判定するものではなく*見える*ものなのです。)

正しい答えは二つあり、両方を出せるべきです。`std.mem.sort` を使う。**あるいは**
`sortUnstable` を保ったまま比較を**全順序**にする — スコアの降順、次に添字の昇順
— そうすれば二つの要素が等しく比較されることは決してなく、安定性は問題でなく
なります。既定で手を伸ばすべきは二つ目です。順序が完全に指定されていれば、
不安定なソートには証明すべきことが何もありません。
'''
hints = [
  "一語です: sortUnstable が sort になります。std.mem.sort が安定なもので、それが安定な答えです。",
  "もう一つの答えは sortUnstable を保ち(スコアの降順、次に添字の昇順)で比べます — 全順序なので、不安定になる同点が残りません。",
  "TIES は完成した順序で隣り合う等しいスコアを数え、その数は二つのどちらを書いても同じです — ばれるのは添字の順序です。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.hacker.28.lru"
title = "通行料"
story = "7-32 号室、七回目の面接、最後の質問。正しいものを追い出さなければならないキャッシュ、一つ一つ支払われて返されるノード、そして時計。"
brief = '''
一行目は `cap q` です。続く `q` 行は `PUT <key> <value>` か `GET <key>` です。

満杯になると**最も長く使われていない**項目を追い出す、固定容量のキャッシュを
実装してください。`GET` も `PUT` も、キーを使ったとみなします。

各 `GET` について値を出力し、なければ `-1` を出力してください。最後に生き残った
キーを、最近使ったものから順にスペース区切りで出力し — キャッシュが空なら `-` —
それから `EVICTED <k>` を出力します。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

例をたどってください: `GET 1` は `1` をまた最近のものにするので、`PUT 3` が場所を
必要とするとき出ていくのは `2` です。`GET 2` は外れます。`GET 3` は当たって `3` を
最も最近のものにし、だから生き残りは `3 1` と出力されます。

教科書の答えは**双方向連結リスト**へのハッシュマップで、Zig には本物があり、何も
隠れていません: `std.DoublyLinkedList` は**侵入型**です。リストはノードを確保
しません。`std.DoublyLinkedList.Node` — 二つのポインタ `prev` と `next` — を自分の
構造体の中に埋め込み、それをアロケータで `create` し、自分で `destroy` します。
そのノードに対する `remove` してから `prepend` が先頭への `std::list::splice` で、
`pop()` は最後のノードを返し、そのどれもが一バイトも確保せずに O(1) なので、
操作ごとに O(1) だと言葉を濁さずに声に出して言えます。`*Node` からキーを持つ
項目に戻るには、`@fieldParentPtr("node", node_ptr)` がフィールドのオフセット分だけ
ポインタを後ろへ戻します。するとマップは `std.AutoHashMap(i64, *Entry)` です。

**スターターがボスです。** マップも、リストも、`create` も `destroy` も持っていて、
例の `GET 2` に対して `20` を出力します。それは決してキーに*触れません*: `GET` は
値をそのある場所で読み、上書きはその場で書き、リストはキーが届いた順のままです。
ですから遮断機は誰が最初に入ったかを覚えていてその者を最初に出します — キャッシュ
ではなくキューです — そして `2` ではなく、ついさっき使われた `1` を追い出します。
修正は教科書が矢印を描く二行です: 当たるたびに、ノードを `remove` して `prepend`
します。

Rust の面接では求められなかった、正しくすべきことが二つあります。項目は値
**だけでなく**キーも持ちます。追い出しはリストから始まり、どのマップの項目を
取り除くかを知らなければならないからです。そして三つの手順の順序が大事です:
ノードを `pop()` し、`@fieldParentPtr` を通してキーを読み、それをマップから
`remove` し、*それから*項目を `gpa.destroy` します — 逆にすると、アロケータが
すでに取り戻したポインタを通した読み出しになり、その読み出しを捕まえてくれる
ものは何もありません: そのメモリに今あるものを何でも返します。それがこのランドで
自分から名乗り出ない唯一の間違いです。作ったすべての項目は `main` が戻るまでに
破棄されます。`init.gpa` の背後の `DebugAllocator` が*名指しする*のは忘れたもの
一つ一つで、そのリストが通行料です。

ここのケースは小さく、時計は速さを測っていません: 四つの操作では連結リストと
先頭から走査するスライスを見分けられません。上の段落の `O(1)` は面接の部屋で
声に出して言う文なので、たまたま四つのケースを通ったコードではなく、あなたが
書いたコードについて真でなければなりません。
'''
hints = [
  "スターターに対して例を手でたどってください。GET 1 は 10 を出力して 1 をリストの後ろに残すので、PUT 3 は 1 を追い出します — 遮断機はキャッシュではなくキューです。",
  "recent.remove(&entry.node) してから recent.prepend(&entry.node) すれば項目は O(1) で先頭に移り、その後もマップのそれへのポインタは有効なままです。その一組の呼び出しは、当たるたびと上書きのたびに入ります。",
  "すでにあるキーの上書きは追い出しではありません — キャッシュが満杯だと決める前にマップを確かめてください。",
  "追い出し: 最後のノードを pop() し、@fieldParentPtr で項目に戻り、そのキーをマップから取り除き、それから gpa.destroy します。destroy の後はマップが持っていたポインタは解放済みのアドレスなので、マップの枠が先に消えなければなりません。",
]
