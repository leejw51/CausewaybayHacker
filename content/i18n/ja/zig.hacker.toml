[[quest]]
id    = "zig.hacker.31.palindrome"
title = "逆から読んでも同じ"
story = "トップ二十に入る問題で、たいていの選考で何らかの形で出され、ほとんどの人が一度は書いたことがあって一度も理解したことのないもの。"
brief = '''
標準入力は `n alphabet seed` です。文字列は自分で作ります:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

最長の回文部分文字列の長さを出力し、それから `AT <index>` — その長さのうち
**いちばん左**のものの 0 始まりの開始位置 — を出力してください。

```
input:  12 3 5
output: 5
        AT 1
```

各中心の周りに広げてください。中心は `n` 個ではなく `2n - 1` 個あります: どの
文字も奇数長の回文の中心で、二文字の間のどのすき間も偶数長の回文の中心です。
すき間を忘れることが、正しそうに見える解が `abba` で `1` を返す理由で、それが
スターターのしていることです。

**テストが強制することとしないこと**を、率直に。仕事をする隠しケースは**一**文字の
アルファベットでの `n = 20000` です。中心の周りに広げるやり方の最悪の場合です —
どの中心も文字列の終わりまで走ります — ですから正しい答えはそこで完全な `O(n²)` を
こなし、それでも Debug ビルドで **0.64 s** で終わります。このマシンで測ったもの
です。それはまた、すべての部分文字列を調べてそれぞれを試すやり方も拒みます。
それは三乗で、五秒以内に戻ってきません。

もう一つの大きなケース、二文字のアルファベットでの `n = 20000` は、速さではなく
**正しさ**のケースです。ランダムな二進の文字列では回文の判定は一、二文字で失敗
するので、三乗の答えでさえそれを通ります。それが検査するのは、あなたの生成器と
いちばん左の添字という同点の決着が、大きな規模で私たちのものと一致することです。

正直な注意書きを一つ。面接官が突いてきそうな種類のことだからです: 一文字の
ケースが拒むのは*すべての*部分文字列を調べるやり方です。これまでに見つけた最良の
もの以下の長さの部分文字列を飛ばす一行を足せば、同じ三乗のループが両方の大きな
ケースを通ります — この入力ではその枝刈りがそれを `O(n²)` に潰します。ですから
テストが拒むのは素朴な三乗であって、最悪の場合に三乗であるすべてのプログラム
ではありません。

ですから: テストは三乗を拒み、二乗を受け入れます。`O(n)` の答えである Manacher の
アルゴリズムは要求**しません**。それが存在することと何をするかは知っておいて
ください。「で、二乗より良くできますか?」が、この問題がたいてい準備するために
出される続きの質問だからです。

ここでの添字は `usize` で、広げるのはどちらかの端の先へ踏み出す*前に*止まります:
`i - 1` を作る前に `i > 0` を確かめます。`usize` に対する `0 - 1` は `-1` ではなく
パニックだからです。両方向に一歩ずつ行き過ぎてから一を足し戻す C++ の形は移植
できません。守りが先です。
'''
hints = [
  "中心ごとに二つの呼び出し: 奇数長のための (c, c) と、偶数長のための (c, c + 1)。スターターには二つ目がありません。",
  "広げる前に s[left] == s[right] を確かめてください。そうすれば偶数の呼び出しは違う二つのバイトの間のすき間で抜けられます。それから i > 0 かつ j + 1 < len かつ次の組が一致する間、広げます。",
  "真に長い回文のときだけ更新すれば、各長さのいちばん左のものが保持され、それが AT の求めているものです。",
]

