hints = [
  "tokenizeAny はスペース、タブ、改行のどんな連なりも飛ばすので、行を読むのをやめた瞬間にファイルの折り返しは関係なくなります。",
  "ADD の引数は ADD の枝の中で、同じトークナイザから取り出してください。ループのカウンタはトークンではなくコマンドを数えます。",
  "pop() は ?i64 を返します。空のリストではそれは null で、_ = items.pop(); が守りのすべてです — 書かなかった .? は、起きなかったパニックです。",
