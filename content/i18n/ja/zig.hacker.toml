[[quest]]
id    = "zig.hacker.32.modular"
title = "十億七を法として"
story = "その言い回しは問題文の最後に現れ、部屋の半分はそれが何をしろと言っているのか分からない。"
brief = '''
標準入力は `n q seed` です。`q` 個の問い合わせを、折り返す `u64` で生成します:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

各問い合わせについて二項係数 `C(a, b)` を **1000000007 を法として**計算して
ください。`q` 個すべての答えの合計を、それ自体 `1000000007` を法として出力し、
それから `LAST <the final query's answer>` を出力します。

```
input:  10 5 3
output: 209
        LAST 1
```

この大きさでは `C(a, b)` は何十万桁もあるので、計算してから剰余を取ることは決して
ありません — どの掛け算も進みながら剰余を取ります。問題は割り算です:
`a! / (b! (a-b)!)` はモジュラー算術では意味を持ちません。それに代わるのは
**モジュラー逆元**で、`1000000007` は素数なので、フェルマーの小定理がそれを
くれます: `inverse(v) = v^(p-2) mod p` で、高速なべき乗により三十回ほどの二乗で
計算されます。

ですから: `factorial[0..=n]` を一度前計算し、各問い合わせに
`f[a] * inv(f[b]) * inv(f[a-b])` と答えます。

**ここでは計算量が強制されます。** 隠しケースの一つは `n = 200000`、`q = 200000`
です。各係数を独立に計算する — `b` 個の項を掛け、`b` 個の項で割り、それぞれに
モジュラー逆元一つ — のは五秒の実行時間の制限内に終わりません。それがスターター
です。一つの共有の階乗表なら Debug ビルドで **0.07 s** で終わります。どちらも
このマシンで測ったものです。

どの途中の値も `2^30` 未満の二つの値の積なので `u64` に収まり、何もオーバーフロー
しません — そしてここではそれはビルドが確かめてくれる主張です。掛け算のたびに
剰余を取ってください: `2^64` を超える積は黙って間違うのではなく
`panic: integer overflow` で、それがこの問題が出されるもう半分の理由です。
'''
hints = [
  "掛け算のたびに剰余を取り、決して最後にではなく。u64 は P 未満の二つの値の積は持てますが、階乗は持てず、そのオーバーフローはパニックです。",
  "inverse(v) は power(v, P - 2) で、それが動くのは P が素数だからだけです — それがここでのフェルマーの小定理の中身のすべてです。",
  "逆階乗も inverse(factorial[n]) から後ろ向きに前計算すれば、問い合わせごとの二つの power() 呼び出しがなくなります。通るのに必要ではありませんが、声に出して言う価値があります。",
]

