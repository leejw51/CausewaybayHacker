# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.hacker.19.knapsack"
title = "鞄に何が入るか"
story = "ライダーが一人、鞄が一つ、そして重さとチップの付いた注文のボード。貪欲法は間違ったものを選ぶ。"
brief = '''
一行目は `n cap` です。続く `n` 行は `<weight> <value>` です。各品物は最大
**一度**しか取れません。

`cap` に収まる最良の合計価値を出力し、それから `GREEDY <v>` を出力してください:
まだ収まる品物のうち重さあたりの価値が最良のものを繰り返し取ったら得られる
ものです。

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

二つの数が違うことがこのクエストの要点のすべてで、例がそれを示しています:
重さあたりの価値が最良なのは `1.67` の `6 10` の品物で、それを取ると何も収まらない
四単位の空きが残ります。それを見送って `5 7` の品物を二つとも取れば `14` の
価値になります。隠しケースは小さいので、検査するのは表が速いことではなく、
二つの数の両方を正しく得たことです。

容量は**下向きに**走査され、下へ数える `usize` のループは
`var room = cap; while (room >= weight) : (room -= 1)` と書きます — 条件は減算の
前に確かめられるので、`room` は `weight` を下回ろうとすることがなく、ゼロを
下回ることもありません。
'''
hints = [
  "容量を下向きに走査することが、無制限ではなく 0/1 にします。上向きだと同じ品物が再利用されます。",
  "割らずに比を比べてください: b.value * a.weight と a.value * b.weight を比べれば、答えに浮動小数点はありません。品物そのものではなく、品物の gpa.dupe を並べ替えてください。",
  "貪欲法の走査は並べ替えた品物に対するまっすぐなループです — 後戻りはなく、だからこそ間違っています。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.hacker.20.bits"
title = "ひとりぼっちのもの"
story = "どの車軸も二回数えられる。一本を除いて。ハッシュマップは使わせてもらえず、ソートもさせてもらえない。"
brief = '''
一行目は `n` です。二行目は `n` 個の非負整数で、一つを除くすべての値がちょうど
二回現れます。

四行を出力してください:

1. 一回だけ現れる値。**xor** と定数の追加領域で見つけます
2. それに立っている `1` のビットの数
3. 二のべき乗なら `POW2 YES`、そうでなければ `POW2 NO`(`0` はべき乗ではありません)
4. 最下位の立っているビットを消した値。なければ `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` で `x ^ 0 == x`、そして xor はどの順で起きるかを気にしません。
それが一行目のすべてです。`x & (x - 1)` は最下位の立っているビットを消し、それが
三行目と四行目をただでくれます。すべて `u64` で行ってください — そしてその引き算
は `x -% 1` と書いてください。このランドでは `u64` に対する `0 - 1` は `panic:
integer overflow` で、`-%` が折り返しを意図したと言う方法だからです。それでも
ゼロの場合は守ってください。折り返しは式を正当にするためだけにあります。

ここのケースは小さく、時計は速さを測っていません。大きな隠しケースはなく、この
パックの作り方では作れません: 組と一つからなる配列は生成されるのではなく*構築*
されるもので、二つのランドがそれを構築しても同じ配列にはなりません。ですから
これらのケースは四行とその端を検査します — `0` は二のべき乗ではなく、立っている
ビットのない値は最下位のものを消しても `0` のままです。それでも xor が答えです。
入れ子のループで出現を数えるのは `O(n²)` で、本物の `n` では死にます。
'''
hints = [
  "組はどの順で届いても互いに打ち消し合うので、スライスに対する一回の畳み込みで十分です。",
  "毎回最下位のビットを消してビットを数えるのは、ビット幅ごとにではなく立っているビットごとに一回走ります。@popCount がビルトインの一行です。",
  "二のべき乗はちょうど一つのビットが立っているので、最下位のものを消すとゼロが残ります — そしてゼロ自体は手で除外しなければなりません。さもないとその x -% 1 はすべてのビットが立った値に折り返します。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.hacker.21.matrix"
title = "図面を回す"
story = "図面は上下が逆で、机の上にはもう一枚写しを置く場所がない。"
brief = '''
一行目は `n` です。続く `n` 行は `n × n` の整数のグリッドです。

**時計回りに 90°** 回転したグリッドを、スペース区切りの値の `n` 行で出力して
ください。それからその値を**渦巻き順** — 左上から時計回りに外周を、内側へ — で
一行に出力します。

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

回転はその場で行うべきものです: 転置し、それから各行を逆にします。それを声に
出して言うことが問題の半分です。

グリッドは `n * n` の一本の平らな `[]i64` として保持し、行 `r` をスライス
`grid[r * n .. r * n + n]` とします — すると `std.mem.reverse(i64, row)` が逆順化で、
`std.mem.swap` が転置です。渦巻きは元のものを欲しがるので、回転する前に
`gpa.dupe` でコピーを取り、その四つの境界は `i64` で回してください: 一行の
グリッドの下の境界は出ていく途中で `-1` になり、`usize` ならそれをパニックで拒み
ます。
'''
hints = [
  "対角線より上だけを入れ替えて転置してください — c は r + 1 から — さもないと全部を入れ替えて元に戻してしまいます。",
  "渦巻きは元のグリッドを欲しがるので、その場で回転する前に gpa.dupe でコピーを取ってください。",
  "渦巻きのループの中の二つの if の守りが、真ん中の一行や一列を二回走査するのを止めるものです — そして right と bottom は正当に -1 に達するので、境界は i64 です。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.hacker.22.trie"
title = "接頭辞の箱"
story = "停留所ボードのための自動補完 — 実際にリストにあるものだけを補完する、正直な種類のもの。"
brief = '''
一行目は `n q` です。続く `n` 行は挿入する小文字の単語です。続く `q` 行は
問い合わせで、それぞれ `WORD <s>` か `PREFIX <s>` です。

トライ — それぞれ最大 26 の子を持つノードの木 — を作り、答えてください:

* `WORD <s>` → `s` が挿入されていれば `YES`、そうでなければ `NO`
* `PREFIX <s>` → 挿入された `n` 個の単語のうち `s` で始まるものの数

`n` 個の単語が相異なるとは約束されておらず、`PREFIX` は相異なる単語ではなく
**挿入**を数えます: `tram` を二回挿入すれば `PREFIX tram` は `2` です。`NODES` は
ノードを数えるので、二回目の挿入は何も足しません。

それから `NODES <k>`、根を含めたトライのノードの数を出力します。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

各ノードに、そこを通る挿入された単語の数を保持してください。そうすれば
`PREFIX` は最後に数えることのない走査です。ノードは一つの `std.ArrayList(Node)`
に格納し、子には添字を持たせてください — なければ `-1` — ノードごとに二十六個の
`?*Node` ではなく。そのほうが小さく、速く、そして添字は `.items` へのポインタの
ように伸長によって無効になることがありません。それは仮定の話ではありません:
`append` はリスト全体を動かすかもしれず、その前に取ったポインタは、アロケータが
すでに取り戻したメモリへのポインタです。添字を取り、`append` し、それから
もう一度 `nodes.items[at]` を通ってください。
'''
hints = [
  "ノードは一つの ArrayList に格納し、子には添字を持たせてください。append の前に取った .items へのポインタは、リストが返してしまったかもしれないメモリへのポインタです。",
  "through は踏み込んだノードで増やすので、根は自分自身を数えません。",
  "トライから落ちた問い合わせは at == -1 を残し、-1 は特別扱いなしで NO と 0 に答えます。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.hacker.23.prefix-sums"
title = "目標に届く方法はいくつ"
story = "一日の売上と、監査役が見たがっている数。連続した何時間の組がちょうどそれになるか。"
brief = '''
一行目は `n k` です。二行目は負のこともある `n` 個の整数です。

合計がちょうど `k` になる連続した区間がいくつあるかを出力し、それから
`RANGE <s>`、つまりリスト全体の合計を、もう一度足すのではなく最後の累積和から
読んで出力してください。

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

負の値はスライディングウィンドウを殺します — 大きすぎる窓は縮めても直せません。
生き残るのは累積和です: 区間 `i..j` の合計が `k` になるのはちょうど
`prefix[j] - prefix[i] == k` のときなので、それより前の累積和のうち
`prefix[j] - k` に等しいものがいくつあるかを数えます。先頭から始まる区間のために、
マップに `0 → 1` を種として入れておいてください。

ここのケースは小さく、時計は速さを測っていません。そして `O(n²)` の二重ループを
拒むケースはここにはありません — 本物の `n` ならあるでしょう。200000 個の値に
対するその同じ二重ループは `2 × 10^10` 回の足し算で、Debug ビルドでは五秒の
実行時間の制限をはるかに超え、ハッシュマップの一回の走査は一秒の何分の一かです。
この四つが検査するのは負の値と先頭から始まる区間で、それがこの答えが実際に
間違える二つの場所です。計算量はあなたの良心に任されています。

一つの `std.AutoHashMap(i64, i64)` — 累積和の値から、それが何回現れたかへ —
そしてそれを増やすための `getOrPut`。
'''
hints = [
  "今の累積和を記録する前に、それより前の累積和を引いてください。さもないと k が 0 のとき長さゼロの区間が自分自身を数えます。",
  "最初に seen.put(0, 1) することが、添字 0 から始まる区間をそもそも見つけられるようにします。",
  "最後の累積和が合計なので、二行目には何の追加の費用もかかりません。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.hacker.24.inversions"
title = "時計に捕まるもの"
story = "午後の回の最初の問題。素朴な答えは正しく、そして間違った答えだ — そして Debug ビルドはそれを少しも正しくなくはせず、遅くするだけだ。"
brief = '''
標準入力は二つの整数 `n` と `seed` です。入力に配列はありません — **まさに**
この生成器で、折り返す演算子 `*%` と `+%` を使った `u64` の算術で、自分で
作ります:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

**転倒**を数えてください: `a[i] > a[j]` となる組 `i < j` です。その数を出力し、
それから `MAX <largest value>` を出力します。

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1` では配列は
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
です。

**このクエストは計算量を強制し、それができる唯一の種類のものです。** スターターは
`O(n²)` の二重ループです。隠しケースは `n = 1000000` で、C++ の面接が落ち着いた
大きさです。それより小さいとその最適化器がループをベクトル化して実行時間の制限に
収めてしまったからです。そこでは二重ループは `5 × 10^11` 回の比較で、その一つ
一つに範囲検査がある Debug ビルドは五秒の実行時間の制限内に戻ってきません。
マージソートの途中で転倒を数えるのは `O(n log n)` で、その大きさで **0.19 s**
かかります。このクエストに同梱されたプログラムで、このマシンで測ったものです。

大きなケースが代わりに決めてくれることがほかに二つあります。`n = 1000000` の
答えは `250046540838` で、32 ビットに収まりません — 間違った幅の累積変数はここでは
黙って間違うのではなく `panic: integer overflow` なので、`u64` で数えてください。
そして生成器はオーバーフローではなく折り返さなければなりません: オーバーフロー
する `u64` に対する素の `*` は最初の一歩で同じパニックで、`*%` が折り返しを意味
する演算子です。
'''
hints = [
  "並べ替える前に最大値を取るか、コピーを並べ替えてください。マージソートはあなたの足元でスライスを並べ替えます。",
  "右側の値が併合で勝つとき、左半分の残りの要素はすべてそれより大きいです — それが一度に mid - left 個の転倒で、それが技のすべてです。",
  "圧縮した値に対する Fenwick 木がもう一つの O(n log n) の答えで、面接の部屋で名前を挙げる価値があります。時計の下ではマージソートのほうがコードが少なくて済みます。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.hacker.25.test-cases"
title = "T 個のテストケースが続く"
story = "どの選考も使う形と、どの候補者も少なくとも一度は書くバグ: 二つ目のケースが一つ目を覚えている。"
brief = '''
一行目は `T`、独立したテストケースの数です。各ケースは `n` の行、それから `n` 個の
整数の行です — そして `n` が `0` のとき、その二行目は空です。

各ケースについて**二番目に大きい相異なる**値を出力し、相異なる値が二つ未満なら
`NONE` を出力してください。すべての後に `CASES <T>` を出力します。

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

これは標準的な競技プログラミングの選考の包みで、候補者を落とす理由は一つです:
ケースごとであるべき状態がループの前に宣言されていたこと。すべての累積変数、
すべての集合、すべての `best` はループの**中に**入ります — そしてこの言語では、
それを解放する `defer` がそのすぐ下に入るので、集合はケースごとに一度支払われ
返されます。

行ごとではなく `tokenizeAny` で空白区切りのトークンごとに読めば、`n = 0` の空行は
そもそも特別な場合ではなくなります — それがこの形が教える二つ目のことです。

集合は `std.AutoHashMap(i64, void)` — 何もないものへのマップ — で、そのキーの
二番目に大きいものは、上位二つを保持しながら `keyIterator()` を一回走査すれば
得られます。
'''
hints = [
  "集合をループの中に、その defer deinit をすぐ下に移してください。それが修正のすべてで、クエストのすべてです。",
  "AutoHashMap(i64, void) は集合です: put(value, {}) が挿入し、count() が相異なる値の数です。",
  "まず count() < 2 で守ってください: キーが二つ未満だと二番目に大きいものはまだ minInt で、それを出力するのは間違った種類の正しさです。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.hacker.26.statistics"
title = "小数点以下六桁"
story = "数は、あなたの言語がたまたま出力するようにではなく、仕様が言うとおりに丸めてほしいと言われる。"
brief = '''
一行目は `n` です。二行目は `n` 個の整数です。

それぞれ**小数点以下六桁**で三行を出力してください: 平均、**母集団**標準偏差
(`n - 1` ではなく `n` で割ります)、そして中央値 — `n` が偶数なら真ん中の二つの
値の平均です。

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

このクエストは `match = "float:1e-6"` で判定されるので、比較は数値的です: `3.8` も
`3.800000` も通り、`1e-7` ずれた値も通ります。それは意図的です — 要点は
フォーマッタではなく、整数演算の `@divTrunc(sum, n)` が `3` を与えることと、
偶数長の中央値が時計の下で人が間違える境界だということです。

`{d:.6}` がフォーマッタです — `try w.print("{d:.6}\n", .{mean})` は `f64` を
六桁まで出力します。もう半分は、Zig が整数と浮動小数点数を代わりに混ぜては
くれないことです: `@floatFromInt(v)` が `i64` を `f64` にする方法で、割り算は
その前ではなく後に起きます。標本ではなく母集団です。問題文を二度読んでください。
本物の選考では `/ n` と `/ (n - 1)` の違いが提出物のすべてです。
'''
hints = [
  "割る前に @floatFromInt、後ではなく。二つの整数に対する @divTrunc(sum, n) は、すでに小数部を捨てています。",
  "母集団分散は偏差の二乗の平均です — 合計を n で割ってください。",
  "個数が偶数なら中央値は values[n/2 - 1] と values[n/2] の平均で、その引き算に一つずれが潜んでいます。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.hacker.27.commands"
title = "入力こそが問題"
story = "ブースの記録は八十桁で折り返されて機械から出てきて、先頭の数は単語の数ではなくコマンドの数だ。"
brief = '''
一行目は `k`、続く**コマンド**の数です。コマンドは空白区切りのトークンで、残りの
行にたまたま折り返されたとおりに詰め込まれています — 一行にいくつでも、空白は
どれだけでも、末尾に空行があるかもしれません。

| コマンド | トークン | 効果 |
| --- | --- | --- |
| `ADD <cents>` | 二つ | 品目を積む |
| `VOID` | 一つ | 最後の品目を取り除く。なければ何もしない |
| `TOTAL` | 一つ | 今の合計を出力する |
| `CLEAR` | 一つ | すべてを取り除く |

`k` 個のコマンドの後で、`COMMANDS <k>` と `ITEMS <how many are left>` を出力して
ください。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` はコマンドを数え、`ADD` は二つのトークンからなる一つのコマンドです — ですから
`k` 回回って一回に一つのトークンを読むループは、間違った場所で止まります。
`k` 個のコマンドを読み、引数はコマンドが持つときだけ取り出してください。

空のレジでの `VOID` も、何も足される前の `TOTAL` も、どちらも動かなければなり
ません。問題文にそれが起きないと言う行はなく、本物の選考ではその沈黙が仕様です。
空の `std.ArrayList` に対する `pop()` はここでは未定義動作ではありません —
`null` を返し、それを取り出す `.?` は `panic: attempt to use null value` です。
ですから守りはやはりあなたが書くものです。ただ長さの確認ではなく、
`_ = items.pop();` かオプショナルへの `if` と綴られるだけです。
