[[quest]]
id    = "zig.hacker.30.range-queries"
title = "変わり続ける合計"
story = "料金所全体の一朝分、四百万件のブース操作、その半分は訂正。そして誰かが累計を欲しがっている。"
brief = '''
標準入力は `n q seed` です。`n` 個の値の配列を作り、それから `q` 個の操作を
実行します。すべて同じ生成器から、折り返す `u64` で:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

すべての問い合わせの答えの累計を出力し、それから `UPDATES <k>` を出力して
ください。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**ここでは計算量が強制されます。** 素朴な答え — 問い合わせごとに範囲をループする
— は問い合わせごとに `O(n)` で、小さなケースはそれを捕まえません。ですから大きな
隠しケースは `n = 500000, q = 4000000` で、そこでは素朴な答えは `10^11` 程度の
要素に触れて五秒の実行時間の制限内に終わらず、一方 Fenwick 木は Debug ビルドで
全体を **0.39 s** で片付けます。どちらもこのクエストの二つのプログラムで測った
ものです。

教訓は面接官が釣り上げようとしているものです: *一点更新、区間和* は Fenwick 木が
まさにそのために存在する形です。三つの短い関数 — add、prefix、そして二つの
prefix の差としての range — で、最下位の立っているビットが歩み方です。`usize`
ではそのビットは `i & (~i + 1)` です: C++ の答えが書く `-i` はここでは符号なし型に
存在せず、`~i + 1` は同じビットをコンパイラが受け入れる言い方で言ったものです。
あるいは `i & (0 -% i)` と書いてください — 折り返しが意味なので、演算子がそう
言います。
'''
hints = [
  "初期値ごとに add を一回呼んで木を作ってください。O(n) のボトムアップの構築は良い最適化ですが、時計が試しているものではありません。",
  "i & (~i + 1) は usize の最下位の立っているビットを取り出します。それを足せば木を上り、引けば下ります。",
  "range(l, r) は prefix(r + 1) - prefix(l) で、その一組の一つずれを正しくすることがデバッグのほとんどです。",
]

