input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

push し、再帰し、**pop** する。pop は人が書き漏らす部分で、その症状は最初の行より
後のすべての行が長すぎることです。

再帰は進みながら出力します — ライタ `*std.Io.Writer` と、数のための `*usize` を
