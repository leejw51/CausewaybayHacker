'''
hints = [
  "要素ごとに二つの再帰呼び出し: 一つはそれを追加して、一つはなしで。取るのを先にすれば、例の順序が出てきます。",
  "_ = chosen.pop(); は二つの呼び出しの間に入ります。それが試す・再帰する・元に戻すの元に戻すで、_ = があるのは pop が返す ?i64 をあえて無視しているからです。",
  "基底の場合は at == nums.len で、そこでの空の選択は空の部分集合で、それも数に入ります。",
]

