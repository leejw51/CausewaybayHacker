        REDUNDANT 1
```

Union-find: どの停留所も親を指し、`find` は根まで歩き、`union` は一方の根を
もう一方に向けます。`find` から戻る途中で経路を圧縮すれば、全体は問い合わせ
ごとに事実上定数時間です。

ここのケースは小さく、時計は速さを測っていません — 圧縮せずに歩く `find` でも
四つとも通り、問い合わせごとにスライス全体を走査し直すのでも通ります。それでも
圧縮してください。上の段落は十万の停留所と十万のつながりについての主張で、
守るよう求められるのはこの四行ではなくその主張です。

`parent` は恒等写像から始まります — `for (parent, 0..) |*p, i| p.* = i;` が Zig の
`iota` です — そして `find` はそこに書き込むので、コピーではなくスライスを受け
取ります。
'''
hints = [
  "どの停留所も自分自身を親として、n グループから始めてください。union が成功するたびに数が一つ減ります。",
  "両端がすでに同じ根を持つ辺が冗長なものです — それを数えて次へ進んでください。",
