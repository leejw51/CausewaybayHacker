[[quest]]
id    = "python.basic.04.control-flow"
title = "邊條通道"
story = "街市啲通道號碼油咗喺地下，門口塊牌本來應該話你知每條通道賣乜。佢每次都淨係寫個號碼。"
brief = '''
讀一個整數 `n`。由 `1` 到 `n` 嘅每一個 `i`，印一行：

* `FISHVEG` —— 如果 `i` 同時整除到 3 同 5
* `FISH` —— 如果 `i` 整除到 3
* `VEG` —— 如果 `i` 整除到 5
* 否則就印 `i` 本身

然後繼續讀整數，一行一個，讀到 `0` 為止，再印 `SKIPPED <k>`，
即係途中讀咗幾多行非零嘅數。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

兩個循環，兩種款。第一個未開始已經知自己要行幾多次：
`for i in range(1, n + 1)`。第二個唔知：`while True` 加 `break`，
因為次數係由讀到乜嘢決定嘅。Python 嘅 `range` 會喺終點**之前**停，
而 `range(1, n)` 就係人人喺呢度都寫過一次嘅差一錯誤。
'''
hints = [
  "先 check 兩樣都中嗰個情況，唔係佢永遠唔會觸發。3 同 5 都整除到，即係 15 整除到。",
  "range(1, n) 去到 n - 1 就停。個 starter 就係有呢隻蟲；示例輸出會少咗最尾一行。",
  "while True 加 break 就係 Python 寫「出口喺中間」嘅循環嘅方法。冇 do-while。",
]

