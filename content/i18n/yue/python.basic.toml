title = "加價"
story = "生果檔朝早張批發價表每個價都加同一個加價，而應該記住個加價嘅函數回傳返嚟係 None。"
brief = '''
定義喺另一個函數入面嘅函數可以用外層函數嘅名，外層函數返回之後都繼續用得。呢個就係 closure：內層函數帶住 `k`。外層函數回傳內層嗰個 — 係函數本身，唔係呼叫佢。

```
