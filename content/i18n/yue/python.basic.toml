id    = "python.basic.17.duck-typing"
title = "識嘎就係鴨"
story = "蛋檔嘅一個膠袋。冇人問過佢係乜；佢哋問嘅係入面有幾多隻、啲鴨蛋喺唔喺入面，同埋想逐隻逐隻攞出嚟睇。"
brief = '''
標準輸入係一行貨物，用空格隔開，然後一行係一個要搵嘅字。

將啲貨放入一個 `Bag`，然後印：

1. `LEN <k>` —— 由 `len(bag)` 得出
2. 啲貨，一行一樣 —— 由 `for item in bag` 得出
3. `HAS <WORD> YES` 或者 `HAS <WORD> NO` —— 由 `word in bag` 得出
4. `LONGEST <item>` —— 由 `max(bag, key=len)` 得出，打和就攞第一個

```
