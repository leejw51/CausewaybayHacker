id    = "python.basic.18.none"
title = "冇"
story = "05:59，寶靈頓道。價錢牌向本簿仔問一個仲未開檔嘅檔口，本簿仔答佢「冇嘢」，塊牌就將嗰個「冇嘢」嘅價錢印咗出嚟。"
