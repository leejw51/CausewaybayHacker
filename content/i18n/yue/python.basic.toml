每個查詢印 `<STALL> <cents>`，如果嗰個檔口未開就印 `<STALL> NONE`。
然後印 `MISSING <k>` 同 `CHEAPEST <STALL>` —— 開咗檔嘅檔口入面價錢最低
嗰個，打和就睇名 —— 如果一個都未開就印 `CHEAPEST NONE`。

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

個 starter 去到 `CHAN` 就仆街：

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

呢一行就係大佬。佢永遠唔會指住隻蟲。佢指住嘅係個 `None` 最後畀人*用*嘅
位置，而嗰個位置同佢畀人*整出嚟*嘅位置可以隔幾遠都得 —— 而喺個 starter
入面，佢仲要係喺兩個唔同嘅地方整出嚟。`lookup` 搵唔到檔口就返回 `None`，
呢個係故意嘅，但叫佢嘅人冇問過就直接讀 `.cents`。而 `cheapest` 有一條路徑
冇 `return`，所以佢會**暗中**返回 `None`，叫佢嘅人又對住嗰個 `None` 做返
同一樣嘢。

Python 每個 function 都會返回啲嘢。行到落尾冇 return 嘅 function 返回
`None`。冇預設值嘅 `dict.get` 返回 `None`。兩樣嘢當時都唔係錯誤；兩樣嘢
之後都會變成錯誤。修法兩次都一樣：有可能收到 `None` 嘅碼，喺掂任何屬性之前，
先用 `is None` check 下。唔係 `== None`，唔係 `if not stall` —— 一個價錢係
`0` 嘅檔口係真嘅檔口，而 `not` 會將佢掉走。

**特登**令 `lookup` 同 `cheapest` 返回 `Optional[Stall]`，喺型別註解度講明，
然後喺個 `None` 落地嘅地方處理佢。
'''
hints = [
  "由下而上讀個 traceback：AttributeError 係喺 print 嗰行，但個 None 係前一行由 lookup 出嚟嘅，再之前係由 board.get 出嚟嘅。",
  "if stall is None: 就係個 check。用 `is`，因為 None 係單一個物件，比較身份先係老實嘅比較；`==` 可以被覆寫，而 `not stall` 對一個假值但真實存在嘅嘢嚟講係錯嘅。",
  "cheapest 有兩條路徑，得一條有 return。Python 唔會為此警告你；佢將 None 交畀叫佢嘅人，等嗰個人自己發現。畀空嘅情況一句明確嘅 `return None`，等睇碼嘅人見到係有心咁做嘅。",
  "型別註解入面嘅 Optional[Stall] 唔係由直譯器強制執行嘅。佢係寫畀睇碼嘅人同型別檢查器嘅備註，而睇碼嘅人就係嗰個計緊時嘅人。",
]
