Line l = read_line();
```

開一個 `if`，淨係 `l` 係個 enum 第一個 case 嗰陣先會行入去。
'''
hints = [
  "有 scope 嘅 enum 將啲名放喺 enum 入面，而且佢唔會自己變做 `int` 或者字串。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet.29.substr"
title = "中間嗰個字"
story = "送貨單上面個地址寫住 'Causeway Bay, HK'，而速遞員淨係想要由第十個字元開始嗰個字。"
brief = '''
`std::string s = "Causeway Bay, HK";`——將 `std::string t` 設做 `"Bay"`，即係由 index `9`
開始嘅三個字元。
'''
hints = [
  "第二個參數唔係塊嘢完結嘅位置。交個結尾 index 俾佢，你會攞到由嗰度去到成句尾嘅全部嘢。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet.30.positive-mod"
title = "兜到負數嘅環"
story = "午炮個 ring buffer 得三個格，由零號格倒退七步一定要落喺二號格——唔係負一號格，嗰度隻鴨嘴獸已經坐咗成個朝早。"
brief = '''
`int x, m;`，`m > 0`；`x` 可以係**任何** `int`，包括 `-7` 或者 `-100`。將 `int r` 設做 `x`
除以 `m` 嘅餘數，範圍係 `0..m-1`——`x = -7, m = 3` 嘅話就係 `2`。
'''
hints = [
  "喺 C++ 入面 `%` 嘅符號跟被除數，所以負數 `x` 會得出負數餘數——差一步先到啱嘅格。加一次 `m` 唔係對每個 `x` 都夠；加完再取一次餘。",
]
