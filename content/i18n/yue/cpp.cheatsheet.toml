hints = [
  "`std::max` 係一個得一個 type 參數嘅 template，兩個參數唔一致嗰陣佢係唔肯估嘅。話俾佢聽個 type——留得住個半嗰個。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet.28.enum-class"
title = "邊條線"
story = "銅鑼灣站個港鐵板會講出各條線嘅名，而月台嘅程式想問其中一條，但唔想將佢串做一個數字。"
brief = '''
```cpp
