]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.cheatsheet.27.max-mixed"
title = "兩種入面大嗰個"
story = "百德新街塊租金牌，一間舖係整數蚊，隔籬嗰間就帶個半——而佢要嗰對入面高嗰個。"
