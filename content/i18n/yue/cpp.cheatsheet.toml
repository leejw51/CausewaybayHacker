[[quest]]
id    = "cpp.cheatsheet.26.real-division"
title = "半蚊"
story = "軒尼詩道間找換店七蚊兩個人分係三個半——除非部收銀機係當 int 咁除。"
brief = '''
`int a = 7, b = 2;`——將 `double q` 設做 `3.5`。
