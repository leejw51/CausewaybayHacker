brief = '''
```
x = torch.tensor([1.0, 2.0], requires_grad=True)
y = (x ** 3).sum()
```

將 `g` 整做梯度 dy/dx，一個形狀係 `(2,)` 嘅 **tensor** —— 而且之後
`x.grad` 一定仍然係 `None`。
'''
