[[quest]]
id    = "pytorch.cheatsheet_advanced.16.grad-scaler"
title = "SCALE、STEP、UPDATE"
story = "3 號機架張卡上面嘅半精度：細嘅梯度會 underflow，除非個 loss 先放大，而個 step 知道呢件事。"
brief = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
    with torch.autocast(device_type="cuda", dtype=torch.float16):
        loss = loss_fn(model(xb), yb)
    # ____
```

CUDA 上面 `float16` 嘅混合精度。用一個訓練步嘅三個呼叫填個空位，令
backward 係喺一個經個 scaler 放大咗嘅 loss 上面行，optimiser **永遠唔會套用
仍然 scale 住嘅梯度**（而且梯度入面有 inf 嗰一步會被跳過），而 scale factor
淨係喺嗰一步之後先調整。
'''
hints = [
  "三個呼叫全部都經個 scaler。直接 step 個 optimiser 會令啲梯度仲係 scale 咗嘅；個 scaler 拒絕 step 一個佢從來冇 scale 過嘅 loss，亦拒絕喺 step 之前 update。",
]

