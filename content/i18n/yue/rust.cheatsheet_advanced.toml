# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.cheatsheet_advanced.27.take-n-messages"
title = "啱啱好四個，唔准 HANG"
story = "駱克道四個速遞員每人用無線電報一個數字返嚟；調度員自己部無線電仍然開住，但收到四個之後就一定要停止收聽。"
brief = '''
`n: usize = 4`。四條 thread 每條都攞咗一個 `tx.clone()`，做完啲嘢之後每條
send **一個** `u64`。原本嗰個 `tx` **冇** drop，`main` 仲揸住佢。
`r` 裝住全部四個訊息，而 `main` 唔可以 hang。
```
let (tx, rx) = mpsc::channel::<u64>();
for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "receiver 嗰個會阻塞嘅 iterator 要等到每個 sender 都消失先會完；`main` 仲揸住一個，所以要按數量停。非阻塞嗰個 iterator 回傳嘅係目前為止到咗嘅嘢 —— 可能乜都冇。",
]

