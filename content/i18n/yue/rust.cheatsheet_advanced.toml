# RUST LAND — CHEATSHEET ADVANCED, in Cantonese (written colloquially in Traditional
# characters). A translation pack (SPEC §12.1): the prose of
# `content/rust/cheatsheet_advanced.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack, and
# are never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "rust.cheatsheet_advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet_advanced.01.default-method"
title = "後備嗰行"
story = "06:50，渣甸坊樓上。Mei 張單上面每間舖都識講自己個名；佢想全部都識打招呼，但又唔想逐間寫一次。"
brief = '''
`Greet` 已經要求實現 `name`。喺個 trait 加入 `hello`，令
`impl Greet for Shop` **只需要**寫 `name`，而 `Shop.hello()` 仍然編譯得到，
回傳 `name` 回傳嘅嘢。
```
trait Greet {
    fn name(&self) -> String;
    // ____
}
impl Greet for Shop { fn name(&self) -> String { "Sogo".into() } }
```
'''
hints = [
  "有 body 嘅 trait method 對實現者嚟講係可選嘅；淨係得 signature 嗰啲就唔係。冇關鍵字可以表達呢樣嘢 —— 個 body 本身就係成個信號。",
]

