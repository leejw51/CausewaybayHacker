`Shape` 係一個有 `fn area(&self) -> f64` 嘅 trait；`Sq` 同 `Ci` 都實現咗佢。
將 `shapes` 宣告做一個可以增長嘅 list，可以同時裝住一個 `Sq`
**同埋**一個 `Ci`，每個都喺 heap 上面，令
`shapes.iter().map(|s| s.area()).sum::<f64>()` 行得到。
'''
hints = [
  "一個 Vec 要裝兩個唔同嘅具體類型，就需要一個指住 trait object 嘅指針；generic 參數會將類型釘死做其中一個，而一個光秃秃嘅 trait 根本唔係類型。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet_advanced.03.where-bound"
title = "最大嗰個，唔理係乜"
story = "崇光個價錢板，價錢用 f64 存，存貨數用 i32 存，而 Ferris 想兩樣都搵到最大嗰個，但唔想寫兩個 function。"
brief = '''
`largest` 會用喺一個 `&[f64]` **同埋**一個 `&[i32]` 上面。佢用 `>` 嚟比較，
然後交返一個指住贏家嘅 reference。個 bound 寫喺 `where` 子句入面。
```
// ____
    let mut m = &v[0];
    for x in v { if x > m { m = x; } }
    m
}
```
'''
hints = [
  "`>` 只需要偏序 (partial order)，唔使更多 —— 一個要求全序或者完整相等嘅 bound 會將浮點數拒諸門外。而且個 body 回傳嘅係 `&T`，唔係 `T`。",
]

