`it: Peekable<Chars>` 行緊 `"123+4"`，`n: u32 = 0`。個 loop 將開頭啲數字食入 `n`
（`123`），喺 `+` 度**唔食佢**就停，所以之後嘅 `it.next()` 係 `Some('+')`。
```
