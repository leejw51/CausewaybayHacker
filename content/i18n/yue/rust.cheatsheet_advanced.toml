[[quest]]
id    = "rust.cheatsheet_advanced.04.next-signature"
title = "FIB 交出嘅嘢"
story = "軒尼詩道嘅電車號碼一個一個咁出嚟，每一個都係由前兩個加出嚟。"
brief = '''
`Fib { a: u64, b: u64 }` 變成一個產出 `u64` 嘅 iterator：
```
impl Iterator for Fib {
    type Item = u64;
    // ____
        let r = self.a;
        self.a = self.b;
        self.b += r;
        Some(r)
    }
}
```
空位嗰個 method，個 trait 要求嘅係邊個 signature？
'''
hints = [
  "個 method 會推進狀態，所以佢需要獨佔借用 `self`；而且佢一定要有辦法話「冇嘢喇」，所以佢回傳包住嘅 item，唔係光秃秃嘅。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet_advanced.05.box-dyn-error"
title = "兩種麻煩"
story = "告士打道旁邊條付款路徑，可以喺 parser 度出事，又可以喺賬簿度出事，而 `main` 要用一個 `?` 吞晒兩樣。"
brief = '''
`AppError` 係一個自訂錯誤：
```
impl fmt::Display for AppError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, "app: {}", self.0) }
}
impl std::error::Error for AppError {}
```
佢就淨係得呢啲 impl —— `AppError` **冇**任何 `From` 轉換。
喺 `main` 入面，`?` 用咗喺一個 `ParseIntError` **同埋**一個 `AppError` 上面。
`main` 用邊個 signature 先可以令兩樣都編譯得到？
'''
hints = [
  "兩種唔同嘅錯誤類型經過同一個 `?`，需要一個兩者都可以轉換過去嘅回傳類型：一個 trait object，而且要有固定大小 —— 所以佢要坐喺一個指針後面。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet_advanced.06.from-for-question-mark"
title = "轉換器"
story = "渣甸坊部收銀機用自己嘅講法報告 parse 失敗；賬簿想用自己個 enum 嚟收，但又唔想每一行都寫個 `map_err`。"
brief = '''
`enum AppError { Parse(ParseIntError), Neg }`。下面個 function 要原封不動咁
編譯得到 —— 由 `?` 負責轉換：
```
fn read(s: &str) -> Result<i32, AppError> {
    let n: i32 = s.trim().parse()?;
    if n < 0 { return Err(AppError::Neg); }
    Ok(n)
}
```
邊個 impl header，入面放住 `fn from(e: ParseIntError) -> Self { AppError::Parse(e) }`，
可以做到？
'''
hints = [
  "`?` 會呼叫一個特定嘅 trait 嚟轉換個錯誤，而佢係喺目標類型上面、為來源類型實現嘅 —— 唔係倒轉，亦都唔係佢個鏡像表親。",
]

