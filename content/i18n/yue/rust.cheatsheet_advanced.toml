brief = '''
`hits` 係 `Arc<Mutex<u32>>`。喺四條 spawn 出嚟嘅 thread 每一條入面，`c` 係
`Arc::clone(&hits)`，而每條 thread 將個數加一 1000 次。
喺 thread 入面，邊一行係加一？
```
hs.push(thread::spawn(move || {
    for _ in 0..1000 { /* ____ */ }
}));
for h in hs { h.join().unwrap(); }
```
'''
hints = [
  "lock 會回傳一個 Result；unwrap 佢攞到個 guard，然後 deref 個 guard 先掂到個數字。三步 —— 而啲似是而非嘅選項每個都跳咗一步。",
]

