[[quest]]
id    = "rust.cheatsheet_advanced.07.map-err-chain"
title = "用佢自己嘅說話"
story = "7-32 室本賬簿用純文字記錄失敗，所以 parser 個錯誤離開個 function 之前要變做 String。"
brief = '''
