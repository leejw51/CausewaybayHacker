hints = [
  "先攞下一個字再 filter，個 `+` 已經畀你食咗；淨係 peek 就永遠唔會行前。Peekable 可以淨係喺下一個元素符合條件嗰陣先攞走佢 —— `_eq` 嗰個 variant 要嘅係一個用嚟比較嘅值，唔係 closure。",
]

