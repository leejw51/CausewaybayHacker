[[quest]]
id    = "go.cheatsheet_advanced.09.once"
title = "淨係熱身一次"
story = "二十個車手喺同一秒開 Lucky Mac 個 app，個 backend 開咗二十條數據庫連線，一人一條，全部都叫做第一條。"
