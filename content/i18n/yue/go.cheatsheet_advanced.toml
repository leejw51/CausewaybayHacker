[[quest]]
id    = "go.cheatsheet_advanced.29.iota"
title = "零、一、二"
story = "金鐘個板上面三條港鐵綫全部編做零，而個顏色查找將每一條都髹成港島綫藍。"
brief = '''
`type Line int` 有一個 `String()` method，會索引一個三元素嘅 array。
將 `Island`、`TsuenWan` 同 `KwunTong` 宣告做 `0`、`1`、`2` —— 全部係 `Line` 類型。
'''
hints = [
  "喺 `const` block 入面，一個冇表達式嘅常數會重複上一行成個表達式 —— 連類型都重複。淨係得一個表達式會向上數。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.cheatsheet_advanced.30.errc"
title = "第一個壞消息"
story = "港島綫八個站同時被 ping；一有一個報告落咗線，控制室就去做第二樣嘢，而七個 ping 嘅仲企喺一個永遠冇人開嘅窗口前面。"
brief = '''
呢度冇 `errgroup` —— 淨係 std。`n` 個 goroutine 每個喺 `errc` 上面 send
啱啱好一個 `error`（經常係 `nil`）。`checkAll` 回傳第一個非 nil 嘅錯誤，
唔等其餘嘅，而之後唔可以有 goroutine 留喺佢個 send 度 block 住。宣告 `errc`。

```
func checkAll(n int) error {
    // ____
    for i := range n {
        go func() { errc <- check(i) }()
    }
    for range n {
        if err := <-errc; err != nil {
            return err
        }
    }
    return nil
}
```
'''
hints = [
  "`checkAll` 返回咗之後，就冇人再 receive。每個 sender 都一定要可以喺冇 receiver 嘅情況下完成佢嗰一次 send —— 個 buffer 要大到裝得晒全部。",
]
