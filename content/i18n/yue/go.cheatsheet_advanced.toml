[[quest]]
id    = "go.cheatsheet_advanced.08.mutex-inc"
title = "寫鎖，唔係讀鎖"
story = "銅鑼灣轉車站五十個閘機將乘客計入同一個數，而個數出嚟總係少咗一截，冇人重現到。"
brief = '''
五十個 goroutine 每個呼叫 `Inc` 一千次；之後 `Get` 一定要回傳 `50000`。

```
type Ctr struct {
    mu sync.RWMutex
    n  int
}
func (c *Ctr) Get() int { c.mu.RLock(); defer c.mu.RUnlock(); return c.n }
// ____
```
'''
hints = [
  "寫入需要獨佔鎖，唔係共享鎖；value receiver 會 copy 成個 struct，連個鎖都 copy 埋，所以真正嗰個 `n` 永遠唔郁。",
]

