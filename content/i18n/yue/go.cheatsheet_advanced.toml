# GO LAND — CHEATSHEET ADVANCED, in Cantonese (colloquial written). A translation
# pack (SPEC §12.1): the prose of `content/go/cheatsheet_advanced.toml`, quest by
# quest, and nothing else. The four choices are code, live in the English pack,
# and are never translated. Code blocks, identifiers and printed strings are
# copied verbatim.

pack   = "go.cheatsheet_advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet_advanced.01.buffered"
title = "一個位"
story = "Lucky Mac 個出餐窗口，12:30：個廚師揸住個托盤伸出去，冇人接，成個廚房喺佢後面停晒。"
brief = '''
呢三行喺 `main` 入面行，冇其他 goroutine 生存。邊個宣告可以令個 send 通過，
令個 receive 印到 `1`？

```
// ____
ch <- 1
fmt.Println(<-ch)
```
'''
hints = [
  "冇 buffer 嘅 send 會等一個 receiver，而呢度個 receiver 係同一個 goroutine，下一行先出現。畀條 channel 一個擺個值嘅地方。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet_advanced.02.wg-launch"
title = "出發前先數"
story = "四十個車手同時離開 Lucky Mac，而個調度員連邊個出咗去嘅名單都未寫就閂舖。"
brief = '''
`go.mod` 寫住 `go 1.22`，所以每次迭代都有自己嘅 `i`。為每個 `i` 用一個 goroutine
開 `work(i)`，並且確保最後個 `Wait` 真係等晒全部 `n` 個 —— 唔可以有嘢同個計數器 race。

```
var wg sync.WaitGroup
for i := range n {
    // ____
}
wg.Wait()
```
'''
hints = [
  "個計數器係喺會呼叫 `Wait` 嘅嗰個 goroutine 入面、喺 `go` 之前加上去；喺新嗰個入面 defer 住減返，而 `defer` 需要一個呼叫。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.cheatsheet_advanced.03.close-range"
title = "最後一碟，落閘"
story = "出餐口送出午市最後一碟，個走堂仲企喺度，因為冇人同佢講廚房收工喇。"
brief = '''
`main` 入面個消費者 loop `for v := range ch { ... }`，然後印 `done`。
producer 最尾邊一行可以令嗰個 loop 完結，每個值都送到，而且冇 goroutine 留低等緊？

```
func produce(ch chan<- int) {
    for i := range 3 {
        ch <- i
    }
    // ____
}
```
'''
hints = [
  "對 channel 嘅 range 淨係喺條 channel close 咗而且抽乾咗先會完。一個哨兵值只係多一個值；個 loop 會繼續等。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.cheatsheet_advanced.04.worker-sig"
title = "一邊入，一邊出"
story = "Lucky Mac 條生產線四個廚師由一條軌攞單，將碟放上另一條軌；新嚟嗰個一路將啲單放返上條軌度。"
brief = '''
一個 worker pool：`main` 將 `jobs` 同 `results` 整做普通 `chan int`，
開四個 worker，send 九個 job，close `jobs`，然後用 `<-results` 收九個結果。
邊個 signature 配呢個 body 編譯得到 —— 而且令 compiler 拒絕喺 worker 入面
向 `jobs` send 或者由 `results` receive？

```
// ____
    for j := range jobs {
        results <- j * j
    }
}
```
'''
hints = [
  "支箭放喺數據流動嗰一邊：喺 `chan` 前面係淨係攞出嚟，喺 `chan` 後面係淨係放入去。雙向 channel 可以轉做任何一種。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.cheatsheet_advanced.05.try-send"
title = "掉咗佢，唔好等"
story = "天后個到站板將聽到嘅每班車都記低；當個 log 滿咗，個板本身唔可以死機。"
brief = '''
`ch` 係一個容量係 2 嘅 `chan string`，有幾個 goroutine 向佢 send。
喺 `log(v)` 入面，有位就將 `v` 交畀條 channel，冇位就掉咗佢 ——
呼叫者永遠唔可以 block，亦都唔可以有 goroutine 留喺個 send 度等。
'''
hints = [
  "有後備分支嘅 `select` 永遠唔會 block；嗰個後備分支一定要乜都唔做，唔係另一個 send。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.cheatsheet_advanced.06.timeout-case"
title = "兩秒，然後放棄"
story = "銅鑼灣個月台顯示屏等緊下一班車嘅訊號。佢等兩秒，或者等到永遠 —— 個 firmware 都唔肯定係邊樣。"
brief = '''
`ch` 係一個 `<-chan int`，`ctx` 係一個 `context.Context`。填第三個 case，
令個 function 喺兩秒內乜都冇到就放棄。

```
select {
case v := <-ch:
    use(v)
    return nil
case <-ctx.Done():
    return ctx.Err()
// ____
    return errTimeout
}
```
'''
hints = [
  "select 嘅 case 一定要係一個 send 或者 receive。`time` 有一個 function 會回傳一條喺某個 `Duration` 之後觸發嘅 channel，而一個光秃秃嘅 `2` 係兩納秒。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.cheatsheet_advanced.07.defer-cancel"
title = "出門嗰陣放手"
story = "金鐘每次查車費都開一個三秒嘅計時器，而冇人停過佢；到晚市繁忙時間，個閘機揸住一萬個計時器。"
brief = '''
`fetch(ctx)` 一定要喺三秒限制仍然生效嗰陣行，而無論 `get` 點樣返回 ——
提早返回、出錯、或者成功 —— 計時器嘅資源都一定要釋放。（`WithCancel` 交返嘅係同一對嘢。）

```
func get() error {
    ctx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
    // ____
    return fetch(ctx)
}
```
'''
hints = [
  "而家就呼叫個 cancel function，會喺 `fetch` 見到 `ctx` 之前就 cancel 咗佢。將個呼叫排到 `get` 返回嗰陣 —— 而 `defer` 要一個呼叫，括號都要。",
]

