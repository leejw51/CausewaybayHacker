id    = "go.cheatsheet_advanced.26.struct-key"
title = "同一格，同一桶"
story = "車手按佢哋等緊嘅網格格仔分組；怡和街同一個街角第二個車手會抹走第一個。"
brief = '''
`type pt struct{ r, c int }`，而 `m` 係一個 `map[pt][]int`（欄位可比較嘅
struct 做 key 冇問題）。將車手 `id` 加入格仔 `(r, c)` 下面，保留已經喺度嘅 id ——
包括個 key 從來未見過嗰陣。
'''
hints = [
  "唔存在嘅 key 讀出嚟係 nil slice，而向 nil slice append 冇問題；結果一定要存返落同一個值 key 下面。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.cheatsheet_advanced.27.builder-ptr"
title = "唔好 COPY 個 BUILDER"
story = "港島綫個廣播一截一截咁砌，而加最後一截嗰個 helper 死機，訊息話有一個非法嘅 copy。"
brief = '''
`sb` 係一個已經裝住 `"Island"` 嘅 `strings.Builder`。宣告 `add`，令
`add(…, " Line")` —— 用個 signature 需要嘅 argument 嚟呼叫 —— 之後
`sb.String()` 係 `"Island Line"`，冇 panic。
'''
hints = [
  "一個非零值嘅 `Builder` 按值傳遞會被 copy，而第一次寫入個副本就會 panic。個 builder 冇 `+=`；佢有一個回傳兩個值嘅 method，忽略佢哋冇問題，但 deref 就唔得。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "go.cheatsheet_advanced.28.heap-pop"
title = "HEAP 嘅頂"
story = "Lucky Mac 個調度員嘅優先清單派出最急嘅單，而佢派出嘅第三張單係最遲先到期嗰張。"
brief = '''
`IntHeap` 實現咗 `heap.Interface`，`Less` 寫做 `h[i] > h[j]`，而 `h` 係一個
已經用 `heap.Init(h)` 初始化咗嘅 `*IntHeap`。將最大嘅值攞出嚟放入 `x`
（一個 `int`），並且令個 heap 對下一次攞仍然有效。
'''
hints = [
  "你喺個類型上面寫嗰個 method 淨係移除最後一個元素；package 嗰個 function 先係將個 root 搬走再重新整 heap 嘅嘢。佢回傳 `any`。",
]

