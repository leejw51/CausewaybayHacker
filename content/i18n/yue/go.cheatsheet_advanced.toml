[[quest]]
id    = "go.cheatsheet_advanced.16.promoted"
title = "借嚟嘅聲"
story = "銅鑼灣站個狀態 server 入面載住一個 logger，而被交畀 server 嘅 logging 嘅走堂，印出嚟乜前綴都冇。"
brief = '''
`run` 想要一個 `func(string)`。將 `srv` 嘅 logging 交畀佢，綁定喺 `srv` 上面，
令佢印 `[mtr] up`。

```
type Logger struct{ prefix string }
func (l Logger) Log(s string) { fmt.Println(l.prefix, s) }
type Server struct {
    Logger
    addr string
}
func run(log func(string)) { log("up") }
srv := Server{Logger{"[mtr]"}, ":8080"}
```
'''
hints = [
  "embedded 欄位嘅 method 會提升到外層 struct 上面，而寫個 method 名但唔呼叫佢，就會得到一個 receiver 已經綁定咗嘅 function 值。",
]

