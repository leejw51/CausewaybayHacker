# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.cheatsheet_advanced.11.fan-in"
title = "幾條綫，一個月台"
story = "荃灣綫同觀塘綫嘅車都入金鐘同一個月台；個合併一直好地地，直到夜晚最後一班車，個月台就永遠清唔到。"
brief = '''
Fan-in。`go.mod` 寫住 `go 1.22`，所以每次迭代都有自己嘅 `c`。
為每個輸入開一個轉發器，將佢 copy 入 `out`，然後報告自己完成，
令下面個 closer 可以 close `out`。

```
func merge(ins ...<-chan int) <-chan int {
    out := make(chan int)
    var wg sync.WaitGroup
    wg.Add(len(ins))
    for _, c := range ins {
        // ____
    }
    go func() { wg.Wait(); close(out) }()
    return out
}
```
'''
hints = [
  "佢一定要喺自己嘅 goroutine 入面行（`go` 關鍵字加埋尾嗰個呼叫），而且佢完成嗰陣一定要話畀個 group 知 —— 否則 `Wait` 永遠唔返，`out` 永遠唔 close。",
]

