[[quest]]
id    = "lua.basic.08.enums"
title = "三條綫，三種顏色"
story = "廟門口釘住嘅港鐵圖有三條綫，賣燈籠嗰家嘅細路要講邊種顏色送人群返屋企，而下面塊板係空白嘅。"
brief = '''
Lua 冇 `enum`；最接近嘅係一個裝住有名常數嘅 table — `Line.ISLAND` 係 `1`，而一個值好似其他值咁可以做另一個 table 嘅 key。用字串做 index 就係查名：`Line["ISLAND"]` 同 `Line.ISLAND` 一樣，所以由輸入嚟嘅字轉做大楷再做 index，就變成一個成員。唔存在嘅名畀你 `nil`，唔係錯誤 — 直至有人跟住佢行落去。

```
local Line = { ISLAND = 1 }

local line = Line[word:upper()]
```

`Line`、由成員對應到顏色嘅 `COLOUR` table 同個 print 已經寫好。照住寫 `local line = ...` 嗰行。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 方括號用字串查 key，而啲名係大楷。",
  "Line.word 會搵一個串做 w-o-r-d 嘅 key；淨係方括號嘅寫法先會用你讀到嘅字串。",
]

