[[quest]]
id    = "lua.basic.08.string-slices"
title = "頭幾個字母"
story = "燈籠牌打印機攞條街個名嘅頭幾個字母做短牌，加個記號，而路線牌上面個全名一定要原封不動。"
brief = '''
`s:sub(1, n)` 係子字串：`s` 嘅頭 `n` 個字元，一個新字串 — 位置由 1 開始數，兩頭都包埋。字串改唔到，所以子字串永遠係副本，無論你點樣郁嗰段，`s` 都唔會變。`..` 將兩個字串駁埋做一個新嘅，再 assign 返畀 `head` 就係加喺尾嘅做法。

```
local head = s:sub(1, n)
head = head .. "!"
```

`s` 同 `n` 已經讀咗，兩個 print 已經寫好。打上面兩行，代替兩個佔位。

```
input:  causeway bay
        8
output: causeway!
        causeway bay
```
'''
hints = [
  "local head = s:sub(1, n)，跟住 head = head .. \"!\" — sub 係複製，.. 再整多一個。",
  "s:sub(0, n) 同 s:sub(1, n) 一樣；0 會被夾返去開頭。Lua 冇 +=：個名兩邊都要寫。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.basic.09.int-slices"
title = "由頭數兩個"
story = "路線牌要將第二同第三個龍節號碼抄出嚟，後面駁埋最後兩個，而原本張清單要原封不動。"
brief = '''
Lua 冇 slice；最接近嘅係 `unpack(v, i, j)`，佢將 `i` 到 `j` 嘅值當獨立嘅值回傳，外面包個 `{ ... }` 就將佢哋收埋做一個**新 table** — 改佢永遠唔會改到 `v`。位置由 1 開始數，兩頭都包埋，所以第二同第三個值係 `2, 3`。`table.insert(t, x)` 將 `x` 加喺尾；`#v` 係最後嘅位置，所以 `v[#v - 1]` 同 `v[#v]` 係最後兩個。

```
local part = { unpack(v, 2, 3) }
table.insert(part, v[#v - 1]); table.insert(part, v[#v])
```

`v` 裝住嗰行嘅整數，兩個 print 都寫好。打上面兩行，代替兩個佔位。

```
input:  1 2 3 4 5
output: 2 3 4 5
        1 2 3 4 5
```
'''
hints = [
  "local part = { unpack(v, 2, 3) }，跟住 table.insert(part, v[#v - 1]); table.insert(part, v[#v]) — 一行兩個語句，中間一個分號。",
  "喺 LuaJIT unpack 係 global（table.unpack 係 Lua 5.2 嘅）。冇外面嗰對大括號，兩個值就唔知去咗邊。",
]

