[[quest]]
id    = "lua.basic.06.floats"
title = "小數點後三個位"
story = "廟門口個香磅讀到三個小數位，貨車上面嗰個平嘢淨係得單精度，本簿就將同一個重量寫咗兩次，兩次都錯。"
brief = '''
Lua 嘅數字係 64 位 double — 即係其他地方嘅 `f64`。冇 32 位 float 型別，但 LuaJIT 嘅 `ffi` 整得出：`ffi.new("float[1]", x)` 係一個裝住 `x` 嘅、得一個 `float` 嘅 C array，由佢讀 `[0]` 出嚟就會畀返捨入到最近 `f32` 嘅 `x`。`string.format` 用 `%.3f` 印三個小數位；`%.10f` 印得夠多睇到捨入。（Python pack 同 unpack 一個 `struct` 嘅地方，Lua 就經一個 C 型別。）

```
local x = tonumber(s)
local y = ffi.new("float[1]", x)[0]
```

`ffi` 已經 require 咗，`s` 已經讀咗，兩個 print 都寫好。打上面兩行，代替兩個佔位。

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
hints = [
  "local x = tonumber(s)，跟住 local y = ffi.new(\"float[1]\", x)[0] — 個 array 喺一個 expression 入面整好再讀。",
  "\"float[1]\" 係單精度；\"double[1]\" 會同 x 一樣闊，乜都冇改變。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.basic.04.strings"
title = "火龍個名"
story = "畫橫額嗰個要將擔龍頭嗰個嘅名度長度、大聲讀、再倒轉寫畀廟神枱後面塊鏡，本簿淨係寫咗一次，順住寫。"
brief = '''
字串用 `#s` 知道自己嘅長度，用 `s:upper()` 整一個大楷副本，用 `s:reverse()` 整一個倒轉副本。冒號就係 method 呼叫：`s:upper()` 即係 `string.upper(s)`，幫你將 `s` 當第一個參數傳入去。字串永遠唔會原地改 — 呢啲每個都係一個新字串，`s` 仲係原本嗰個。

```
print(#s)
print(s:upper())
print(s:reverse())
```

`s` 已經讀咗，佢嘅長度已經印咗。照住寫第二同第三個 `print`。

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "print(s:upper()) 然後 print(s:reverse()) — 兩個 method 呼叫，冒號加空括號。",
  "用點嘅 s.upper() 乜都冇傳，string.upper 就會投訴字串個位係 nil。",
]

