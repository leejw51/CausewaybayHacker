[[quest]]
id    = "lua.basic.05.loops"
title = "數龍節"
story = "龍節由龍頭起編號 1 到 n，而龍節號碼總數、同埋每隔三個有鼓嘅係邊幾節，喺個數下面淨係得一行空白。"
brief = '''
數字 `for` 會幫你數：`for i = 1, n do` 由 `1` 開始 `i`，每個值行一次 body，一路去到 `n`，**包埋** `n` — 最後個值係計埋在內嘅，呢樣係 Lua 同 `range` 第一樣唔同嘅地方。body 喺 `end` 完。

```
for i = 1, n do
  total = total + i
  if i % 3 == 0 then threes = threes + 1 end
end
```

`n` 已經讀咗，`total` 同 `threes` 由 `0` 開始，loop body 已經寫好。喺 body 上面照住寫 `for` 嗰行。

```
input:  10
output: 55
        3
```
'''
hints = [
  "for i = 1, n do — 第二個數字係 i 嘅最後一個值，唔係再多一個。",
  "for i = 1, 0 一次都唔會行：起點過咗終點嘅 loop 冇 body 可以行。",
]

