[[quest]]
id    = "lua.basic.10.byte-slices"
title = "頭三個位元組"
story = "燈籠牌打印機要擔龍嘅個名頭三個位元組，後面加個記號，印做字母之前先用 hex 顯示啲位元組。"
brief = '''
Lua 字串**就係**佢嘅位元組：冇另外一個 bytes 型別，`#s` 數位元組，`s:sub` 切位元組。`s:byte(i, j)` 將 `i` 到 `j` 嘅位元組當數字畀返，每個一個回傳值，`{ ... }` 將佢哋收埋做一個 table；`-1` 即係最後一個位置，所以 `s:byte(1, -1)` 係每一個位元組。`string.char(...)` 係反方向 — 數字入，字串出 — 而 `unpack(t)` 將一個 table 攤開做佢要嘅參數。

```
local bytes = { head:byte(1, -1) }
print(string.char(unpack(bytes)))
```

`head` 係 `s` 嘅頭三個位元組，尾加 `"!"`，hex 嗰行由 `bytes` 印。打上面兩行，代替兩個佔位。

```
input:  kwan lee
output: 6b776121
        kwa!
```
'''
hints = [
  "local bytes = { head:byte(1, -1) }，跟住 print(string.char(unpack(bytes))) — byte 行一個方向，char 行返轉頭。",
  "冇參數嘅 head:byte() 淨係第一個位元組；1, -1 係要晒全部。",
]

