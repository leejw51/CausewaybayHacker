[[quest]]
id    = "lua.basic.06.functions"
title = "跑腿人工"
story = "香燭檔按跑去貨車嘅次數畀跑腿人工，第十次之後平啲，而計數嗰頁簿得個名，下面乜都冇。"
brief = '''
`function` 整一個 function：一個名、括號入面嘅參數、body，同埋 `end`。`return` 將一個值畀返叫佢嗰個。body 可以淨係一句 `return`，成個答案寫做一個 expression；`math.min` 同 `math.max` 係佢哋參數之中較細同較大嗰個。

```
local function fare(rides)
  return math.min(rides, 10) * 5 + math.max(rides - 10, 0) * 3
end
```

頭十程每程 `5`，之後每程 `3`。`main` 讀 `n` 再印 `fare(n)`。照住寫 `fare` 入面嘅 `return` 嗰行。

```
input:  12
output: 56
```
'''
hints = [
  "return math.min(rides, 10) * 5 + math.max(rides - 10, 0) * 3 — min 將貴嗰啲封頂喺十程，max 唔畀其餘嗰啲變負數。",
  "function 嘅工作喺 return 完；body 入面佢後面嘅嘢都唔會行，而 return 一定要係佢個 block 最後一個語句。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.basic.07.structs"
title = "一個檔，三個欄"
story = "香燭檔張卡寫住名、價錢同數量，部收銀機將張卡讀做三個散字，乜都冇加埋。"
brief = '''
Lua 冇 `class`；物件係一個 table，後面嘅 metatable 話畀佢知搵唔到 key 嗰陣去邊度搵。`Stall.__index = Stall` 令每個檔口去 `Stall` 度搵 method，`setmetatable({...}, Stall)` 將佢掛上去，`function Stall:total()` 定義一個 method，有一個隱藏嘅第一個參數叫 `self` — 定義同呼叫都用冒號。入面，欄位經 `self` 讀。

```
local Stall = {}
Stall.__index = Stall

function Stall.new(name, price, qty)
  return setmetatable({ name = name, price = price, qty = qty }, Stall)
end

function Stall:total()
  return self.price * self.qty
end
```

`Stall`、佢嘅 `new` 同 `main` 已經寫好。照住寫 `total` 嘅 `return` 嗰行。

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty — 啲欄位喺 table 入面，而喺冒號 method 入面 self 就係個 table。",
  "喺 total() 入面單獨一個 price 唔係一個名；佢會係 global，而冇人設定過嘅 global 係 nil。",
]

