[[quest]]
id    = "lua.basic.09.vector"
title = "龍節清單"
story = "擔龍頭嗰個逐個讀出每節嘅重量，本簿冇張清單，得四格空白：加完之後、拎走之後、換完之後、排完之後。"
brief = '''
