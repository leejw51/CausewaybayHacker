brief = '''
張量係成個地方淨係靠佢砌出嚟嘅嗰一種值。`torch.tensor` 由一個 Python list 整一個出嚟，順序跟返你畀佢嗰個。

揀出整張量 `1 2 3` 嘅嗰一行，然後喺 `# FILL` 註解嗰度打出嚟。

```
output: [1, 2, 3]
```
'''
hints = [
  "torch.tensor 收一個參數 —— 個 list —— 唔係三個數字。",
  "個 list 嘅順序就係個張量嘅順序；冇人會幫你排序。",
