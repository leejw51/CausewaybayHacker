# ---------------------------------------------------------------- 27
[[quest]]
id    = "pytorch.verybasic.27.first-step"
title = "第一步"
story = "樣樣都齊晒 —— 一個參數、一個損失、一個梯度 —— 但係個數一直唔郁。優化器砌好咗，但從來冇人叫過佢做嘢。"
brief = '''
呢個就係成個 loop 行一次：forward、損失、`backward()`，然後係真正郁個參數嘅嗰樣嘢。優化器會用返擺喺 `.grad` 嘅梯度，而做呢樣嘢嘅係優化器自己嘅 method —— 冇咗呢個 call，梯度計完就掉咗，個參數會原封不動留喺起點。

`w` 由 `5.0` 開始，目標係 `0.0`，損失係 `w * w`，所以梯度係 `10.0`。用普通 SGD、`lr=0.1`，呢一步就係 `w - 0.1 * 10.0`。

揀出行呢一步嘅嗰一行。

```
output: 4.0 moved
```
'''
hints = [
  "opt.step() —— zero_grad 清走，backward 填入，step 套用。三樣都要，照呢個次序。",
  "loss.backward() 淨係計梯度；佢從來唔掂個參數。",
]
