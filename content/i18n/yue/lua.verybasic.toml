[[quest]]
id    = "lua.verybasic.20.sorting"
title = "燈籠價錢梯"
story = "燈會塊板上面啲燈籠價錢係按檔口開檔次序排，買家要最平嘅先。"
brief = '''
`xs` 裝住嗰行嘅整數。印之前，個程式要將 `xs` 原地由細到大排好。`table` library 有個 function 做到，預設係由細到大；第二個參數會係一個比較 function。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "table.sort(xs) — 個 library function，table 做參數。",
  "回傳 a > b 嘅比較會由大到細排；普通 table 冇 sort method，而單獨一個 sort 唔係 global。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.verybasic.21.sort-by-key"
title = "排行榜"
story = "棚牆上面舞龍人塊板係按圈數由高到低排，同數嘅兩個就按名排；塊板而家係登記次序。"
brief = '''
`rows` 係一個 list，入面每個 table 都有 `name` 同 `score`。佢要按分數由高到低排，然後按名由細到大排。`table.sort` 收一個比較 function，答 `a` 係咪排喺 `b` 前面；除非兩個分數一樣，否則由分數話事，一樣嘅話就由名話事。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "table.sort(rows, function(a, b) if a.score ~= b.score then return a.score > b.score end return a.name < b.name end) — 分數用大過，咁就由高到低，而名淨係打和先用。",
  "淨係比較分數嘅話，打和嗰啲就會係 sort 碰巧行過佢哋嘅次序；table.sort 唔係 stable 嘅。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.verybasic.22.reverse"
title = "由尾到頭"
story = "火龍個名喺龍尾條橫額上面係倒轉寫嘅，咁由對面睇先啱，場刊都要咁寫。"
brief = '''
`s` 係一行文字。個程式要將佢倒轉印出。字串 library 有個 method 正正做呢樣嘢，用冒號呼叫；`sub` 係切一段出嚟，唔會將佢反轉。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "print(s:reverse()) — 成個 method 名，加個冒號。",
  "s:sub(-1, 1) 要嘅係由最後一個字元到第一個字元嗰段，只要多過一個字母就係空嘅。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.verybasic.23.closures"
title = "加價"
story = "燈籠檔喺每個批發價上面加同一個價，而應該記住加幾多嗰個 function 就唔記得咗。"
brief = '''
`make_adder(k)` 定義咗一個內部 function `add`，回傳 `x + k`。佢要將嗰個內部 function 本身畀返出去 — function 同其他值一樣係一個值 — 咁 `add(x)` 之後先可以喺記住 `k` 嘅情況下被呼叫。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add — 淨係個名，唔好括號。",
  "add() 會冇 x 咁呼叫佢，加咗個 nil；回傳 k 畀返嘅係一個數字，而數字係呼叫唔到嘅。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.verybasic.24.lambdas"
title = "雙數平方"
story = "雙數號嘅龍節按佢號碼嘅平方收錢，單數嘅唔使畀；棚度本數簿要一個總數。"
brief = '''
`xs` 裝住嗰行嘅整數。Lua 冇內建嘅 `map` 或者 `filter`，所以 starter 帶住 `map(f, xs)`、`filter(f, xs)` 同 `sum(xs)`。`total` 要係**雙數**值嘅平方總和，用呢三個加兩個匿名 function 砌出嚟 — `function(x) ... end` 就係 Lua 嘅 lambda。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs)))",
  "filter 留低佢個 function 回傳 true 嘅嘢；map 係轉換。喺 function 外面單獨寫 x * x 係一個 global x，係 nil，拎嚟乘。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.verybasic.25.threads"
title = "每一節一齊嚟"
story = "每一節嘅跑香人喺自己嘅 coroutine 度將自己個數平方，而總數喺佢哋任何一個行過第一個 yield 之前就印咗出嚟。"
brief = '''
呢度冇 thread：coroutine 係最接近嘅嘢，一個 function 淨係喺被 resume 嗰陣先行，用 `yield` 將控制權交返出去。`workers` 入面每個 worker 都已經開咗 — resume 過一次，行到佢第一個 yield — 冇一個寫咗佢嘅結果。印結果之前，主程式要將每個 `co` 行到完。`coroutine` library 有一個 function 會由 coroutine yield 嗰度繼續行落去。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "coroutine.resume(co) — 同開佢嗰個一樣嘅呼叫，會由個 yield 度繼續。",
  "coroutine.status(co) 淨係問；由主程式 yield 係錯誤，因為冇嘢畀你 yield 返去；coroutine 唔係 table，冇 method。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.verybasic.26.mutex"
title = "一個計數器，四隻手"
story = "四個跑香人喺棚牆上用粉筆寫嘅同一個計數器度加數，輪流攞支粉筆；個計數器有把鎖，但冇人喺讀之前攞佢。"
brief = '''
一次得一個 coroutine 行，但一樣有 race：每個 worker 讀 `counter`、yield、再寫返入去，其餘三個就喺中間嗰個空隙行。Lua 冇 mutex；`lock` 係一個細細嘅合作式鎖，佢嘅 `acquire` 會 yield 到個鎖得閒為止，然後攞咗佢。讀之前，每個 worker 都要經嗰個 method **攞**個鎖 — 用冒號，等個鎖將自己傳入去；release 已經寫咗喺寫入之後。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  1000
output: 4000
```
'''
hints = [
  "lock:acquire() — 然後讀、寫，再到已經喺度嘅 release。",
  "用點嘅 lock.acquire() 冇傳 self，就冇 held 畀佢睇；release 一個冇人攞住嘅鎖係刻意設計成錯誤嘅。",
]

