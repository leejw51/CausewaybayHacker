[[quest]]
id    = "lua.verybasic.15.hashtable"
title = "查表"
story = "燈會嘅檔口表將名對應到號碼，問一個唔存在嘅檔口應該答 -1，唔係將塊板變空白。"
brief = '''
`stalls` 將名對應到檔口號碼。對個字 `w`，個程式要印出佢個號碼；`w` 唔喺個 table 入面就印 `-1`。唔存在嘅 key 係 `nil`，唔係錯誤，而 `or` 會將 `nil` 變做一個預設值。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "print(stalls[w] or -1) — or 右邊嗰個就係預設值。",
  "單獨 stalls[w] 遇到唔存在嘅名會印 nil；stalls.w 搵嘅係一個真係叫做 w 嘅檔口。",
]

