[[quest]]
id    = "lua.verybasic.16.sets"
title = "唔同嘅價錢"
story = "六個燈籠檔，三個唔同價錢。塊板要知有幾多個唔同價錢，佢就印六。"
brief = '''
`xs` 裝住嗰行嘅整數。個程式要印出有幾多個**唔同**嘅值。Lua 冇 set：用啲值做 **key** 嘅 table 係最接近嘅嘢 — 同一個 key 儲兩次都只係一個 key — 而計數嗰個 loop 已經用 `pairs` 行過啲 key，因為 `#` 淨係數由 1 開始嘅格。每個 `x` 都要喺 `seen` 度標記做 key。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "seen[x] = true — x 係 key，true 只係一樣唔係 nil 嘅嘢。",
  "seen.x 係串做 x 嘅 key，所有嘢都係同一個 key；table.insert 係加喺尾，會留住重複；seen[x] + 1 第一次就係對 nil 做算術。",
]

