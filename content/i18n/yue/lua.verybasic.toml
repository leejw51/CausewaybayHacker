[[quest]]
id    = "lua.verybasic.19.heap"
title = "最細號碼先"
story = "龍節號碼由啲巷仔亂咁嚟，執事每次都要下一個最細嘅；擺佢哋嗰堆完全唔知邊個係最細。"
brief = '''
Lua 嘅標準 library 冇 heap，所以 starter 帶住一個細細嘅 `MinHeap` class：`push` 加一個值再將佢 sift 上去，`pop` 攞最細嗰個。每個 `x` 都要經個 heap 自己嘅 method 放入去，用冒號呼叫，等個 heap 將自己傳入去，咁之後 `pop` 先會最細嗰個先出。直接寫入 `items` 會跳過 sift，次序就亂咗。

