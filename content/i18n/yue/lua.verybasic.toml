[[quest]]
id    = "lua.verybasic.27.binary-tree"
title = "THE ZERO"
story = "21:00，浣紗街火龍個頭：龍節號碼入咗一棵樹，龍節由 1 開始，而 `segments[0]` 係 `nil` — 個龍頭唔喺任何地方，棵樹嘅左枝都係同一個唔喺任何地方，條龍由第二盞燈籠開始舞。"
brief = '''
龍節號碼讀入 `segments`，佢同每個 Lua list 一樣由 1 開始 — `segments[0]` 係 `nil`，一個未有嘅子節點都係；兩個都唔係錯誤，直至有人跟住佢行落去。`insert(n, v)` 回傳裝住 `v` 嘅樹嘅根；`nil` 嘅情況同右邊已經寫好。對於較細嘅 `v`，左子節點要換做插入佢入面嘅結果，咁 `nil` 子節點就變做一個節點。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — 個遞迴會回傳子樹嘅新根；儲低佢。",
  "呼叫 insert 但唔儲結果，個 nil 就留喺原位，而冇嘢會投訴：nil 唔係錯誤，直至有人跟住佢行落去。唔傳 v 就會插入一個 nil 值，而下一次拎佢嚟比較就係錯誤。",
]
