[[quest]]
id    = "lua.verybasic.08.structs"
title = "一個檔口，兩個欄位"
story = "維園燈會每個檔口張卡都有個名同個價錢。張卡個價錢從來冇儲低過，張標籤淨係印到半個檔口。"
brief = '''
`Stall.new(name, price)` 砌一個以 `Stall` 做 metatable 嘅 table — 即係 Lua 嘅 class。佢要好似儲 `name` 咁將 `price` 儲喺個物件度，咁 `s.price` 先讀得返。欄位係寫喺 `self` 上面；一個淨名就係 local。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "self.price = price — self 係個 table；淨名係個參數。",
  "兩個等號係比較，而單獨一個比較唔係 Lua 接受嘅語句。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.verybasic.09.struct-method"
title = "一行總數"
story = "燈會麵檔每張單都有一行係價錢乘數量，而應該講出嚟嗰個 method 乜都冇講。"
brief = '''
`Stall:total()` 要回傳價錢乘數量。用冒號宣告嘅 method 有一個隱藏嘅第一個參數 `self`，物件嘅欄位要經佢攞；單獨一個 `price` 係一個從來冇設定過嘅 global。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return self.price * self.qty — 兩個欄位都經 self 攞。",
  "單獨一個 price 係 global，係 nil，而 nil 係乘唔到嘅。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.verybasic.10.enums"
title = "路綫顏色"
story = "天后站出口嘅港鐵圖寫住三條綫；班人有個字，要搵佢代表嘅嗰個常數。"
brief = '''
`word` 係 `island`、`tsuenwan`、`kwuntong` 其中一個。Lua 冇 enum：`Line` 係一個裝住有名數字嘅 table，已經係最接近嘅嘢，而 `COLOUR` 就係用呢啲數字做 key。個程式要將 `word` 變做對應嘅 `Line` 成員。table 係用 key 做 index 嘅，而呢度啲 key 係大楷；table 唔可以呼叫，而 `Line.word` 搵嘅係一個串做 `word` 嘅 key。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 方括號按個名查 key，而啲名係大楷。",
  "用細楷嘅 Line[word] 搵唔到 key，畀你 nil，而 COLOUR[nil] 都係 nil：塊板就印 nil。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.verybasic.11.vector"
title = "龍節清單"
story = "大坑道架貨車卸落嚟嘅每一節，都要照到嘅次序寫落清單，而張清單一直係空嘅。"
brief = '''
`xs` 一開始係空 table，而 Lua 嘅 list 就係 key 係 1、2、3、... 嘅 table。loop 入面讀到嘅每個整數 `x` 都要加喺尾，保持輸入嘅次序。`table` library 有個 function 做呢樣嘢；兩個參數就係加喺尾，三個參數嘅話中間嗰個係位置。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "table.insert(xs, x) — table 先，一個值，加喺尾。",
  "table 仲係空嘅時候，xs[#xs] = x 係寫落 index 0，#xs 一直係 0；位置用 1 就會將每個都放喺最前，次序就倒轉晒。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.verybasic.12.vector-edit"
title = "龍頭拆出嚟"
story = "清單第一節係龍頭，而龍頭係單獨用一支棍擔嘅；佢要由清單拆走，後面全部向前移一格。"
brief = '''
`xs` 由 index 1 開始裝住嗰行嘅整數。個程式要移走 index 1 嘅元素，令後面啲向前移。`table.remove` 收一個位置，會將後面嘅移前；將一格設做 `nil` 只會留低個窿，張 list 唔會短咗。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "table.remove(xs, 1) — 位置係第二個參數。",
  "冇位置嘅 table.remove(xs) 攞走嘅係最後嗰個；xs[1] = nil 會喺 list 入面留低個 nil，table.concat 會拒絕佢。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.verybasic.13.list"
title = "燈籠串嘅前面"
story = "燈籠串由浣紗街頭掛到街尾，最新嗰盞要掛喺最前；班人就不停掛喺最尾。"
brief = '''
`chain` 係一個當 list 用嘅 table。Lua 冇 deque；帶位置嘅 `table.insert` 係最接近嘅嘢，佢會將嗰個位置之後嘅全部向後移一格。loop 入面讀到嘅每個 `x` 都要加喺**最前**，咁最後讀嗰個就會排第一。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "table.insert(chain, 1, x) — 三個參數：table、位置、值。",
  "兩個參數就係加喺尾；chain[1] = x 會覆蓋最前嗰個，而唔係將佢推後；普通 table 冇 insert method 畀你用冒號呼叫。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.verybasic.14.maps"
title = "香燭簿"
story = "每條街一本簿，班人燒嘅每樣嘢一行，旁邊寫個數；一樣嘢第一次出現嗰陣，根本冇一行畀你加。"
brief = '''
`counts` 係一個用字做 key 嘅 table。對每個字 `w`，個程式要將佢個數加一，第一次就由零開始。唔存在嘅 key 讀出嚟係 `nil`，而 `nil` 係加唔到嘅；`or` 可以畀個預設值，但佢綁得比 `+` 鬆，所以個預設值要有自己嘅括號。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts[w] = (counts[w] or 0) + 1 — 個括號令預設值喺加之前發生。",
  "冇咗括號，counts[w] or 0 + 1 就係 counts[w] or 1：第一次見係 1，之後每次都仲係 1。唔存在嘅 key 做 counts[w] + 1 就係對 nil 做算術。",
]

