# LUA LAND — VERY BASIC, in Cantonese. A translation pack (SPEC §12.1): the
# prose of `content/lua/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "lua.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.verybasic.01.print"
title = "第一盞燈籠"
story = "21:00，浣紗街。火龍棚頂塊燈籠板仲係黑嘅，今晚第一行字輪到阿美打。"
brief = '''
個程式要喺一行入面一隻字唔差咁印出 `hello, causewaybay`。有一個內建 function 會將佢嘅參數加一個換行寫去標準輸出。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 要有括號，字串入面要有個逗號。",
  "print \"hello causewaybay\" 喺 Lua 係合法嘅 — 呼叫後面可以直接跟一個字串 literal，唔使括號 — 但係唔見咗個逗號。io.write 唔會寫換行，而 puts 根本唔係 Lua 識嘅名。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.verybasic.02.int-types"
title = "分香"
story = "喺蓮花宮門口，啲香要分畀火龍每一節；本數要寫明每節分幾多、剩返幾多，但係佢乜都冇寫。"
brief = '''
`a` 同 `b` 係整數。個程式要喺一行入面印出整數商同餘數，中間隔**一個**空格。LuaJIT 得一種數字型別，亦冇整數除法運算子：`/` 會畀你小數，`math.floor` 將小數剷走，`%` 係餘數。`print` 會喺參數之間加一個 TAB，所以兩個值要先用 `..` 駁埋做一個字串。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — 除完 floor 佢，然後用一個空格駁埋。",
  "a / b 係 3.5，唔係 3。// 喺 LuaJIT 唔係運算子。仲有 print(x, y) 係用 tab 分隔，唔係空格。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.verybasic.03.floats"
title = "準確嘅重量"
story = "書館街棚口個磅話每個舞龍嘅要擔幾重，畀到三個小數位，印出嚟嘅場刊要兩個位；場刊嗰行係空白嘅。"
brief = '''
`x` 同 `y` 係數字。個程式要印出 `x / y`，小數點後面啱啱好兩個位。`string.format` 收 C 式嘅格式規格：`f` 係定點數，點後面嗰個數字就係幾多個小數位。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(string.format(\"%.2f\", x / y)) — 2 前面嗰點就係講小數位。",
  "math.floor(x / y * 100) / 100 仍然係一個數字，而數字會印做 3.5，唔係 3.50；%d 係用嚟印整數嘅。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.verybasic.04.strings"
title = "路線牌"
story = "蓮花街口塊路線牌係用大楷寫嘅，班人份名單就係細楷；寫字佬要佢大大聲讀返出嚟。"
brief = '''
`s` 係一行文字。印完佢嘅長度之後，個程式要將 `s` 用大楷印出。有一個字串 method 會畀返一個每個字母都變咗大楷嘅副本，而 method 係用冒號呼叫嘅，咁個字串就會將自己傳入去。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "print(s:upper()) — 個冒號會將 s 當第一個參數傳入去。",
  "用點嘅 s.upper() 乜都冇傳，upper 就會投訴話收唔到字串；toUpperCase 係 JavaScript。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.verybasic.05.bool-if"
title = "單定雙"
story = "火龍每一節，雙數嘅喺左邊擔，單數嘅喺右邊擔；浣紗街有個舞龍嘅知自己個號碼，要知自己企邊邊。"
brief = '''
`n` 係正整數。`n` 除得盡二就印 `even`，否則印 `odd`。條件係一個 `if` 頭，將餘數同零比較，最尾係 `then`。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  4
output: even
```
'''
hints = [
  "if n % 2 == 0 then — 兩個等號係比較；一個係賦值。",
  "n / 2 係小數；正數 n 嘅話佢永遠唔會係零。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.verybasic.06.loops"
title = "點算"
story = "今晚嘅香數係一加二加三，一路加到最後一節，棚度塊數板就顯示住個零。"
brief = '''
`n` 係正整數。個 loop 要行過由 1 到 `n`（包埋 `n`）嘅每個整數，逐個加落 `total`。數字 `for` 收一個起點同一個終點，而終點**係**包埋在內嘅。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  4
output: 10
```
'''
hints = [
  "for i = 1, n do — 終點係包埋嘅，所以就係 n 本身。",
  "for i in ... 係另一種 loop，收一個 iterator function 嗰種；數字唔係 iterator function。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.verybasic.07.functions"
title = "舞龍人工"
story = "浣紗街頭十個圈，每個圈畀舞龍嘅五蚊，之後每個圈三蚊；個計人工嘅 function 乜都冇畀返。"
brief = '''
`pay(laps)` 要回傳人工：頭十個圈每個 5，第十個圈之後每個 3。function 用一個關鍵字將個值畀返出去；淨係識 print 嘅 function 畀返嘅係 `nil`。

揀出做到嘅嗰一行，然後喺 `-- FILL` 註解嗰度打出嚟。

```
input:  3
output: 15
```
'''
hints = [
  "return math.min(laps, 10) * 5 + math.max(laps - 10, 0) * 3",
  "只收一個參數嘅 math.max 就係個參數本身：夜晚短嘅話 max(laps - 10) 會變負數。仲有喺 pay 入面 print，個 caller 就會印 nil。",
]

