  "heap:push(x) — 個冒號將個 heap 當 self 傳入去，push 會將 x sift 上去佢應該喺嘅位置。",
  "用點嘅 heap.push(x) 會令 x 變咗 self，而一個數字係冇 items 嘅；table.insert(heap.items, x) 將 x 放喺尾，跳過咗 sift。",
]

