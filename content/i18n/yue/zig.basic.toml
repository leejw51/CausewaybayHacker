[[quest]]
id    = "zig.basic.08.string-slices"
title = "短車牌"
story = "頭頂塊板淨係夠位寫車牌嘅四個字，後面加個記號，而個文員將成個車牌抄晒入去。"
brief = '''
`s[0..4]` 係字串嘅一截：由 `0` 開始嘅四個 byte，而且佢係一個 **view** — 佢同
`s` 共用記憶體，亦都唔可以變長。可以接駁嘅字串係 `std.ArrayList(u8)`：
`appendSlice(gpa, bytes)` 將啲 byte copy 落佢個尾，而每個呼叫都要寫 `gpa`，因為
0.16 嘅 list 唔會記住自己嘅 allocator。`t.items` 就係到目前為止嘅 byte。

```
try t.appendSlice(gpa, s[0..4]);
try t.appendSlice(gpa, "...");
```

`s` 係讀入嘅嗰行（最少四個字元），`t` 係一個空 list，離開嗰陣會 free。喺兩個
`// FILL` 記號打嗰兩行。

```
input:  causewaybay
output: caus...
```
'''
hints = [
  "try t.appendSlice(gpa, s[0..4]); — 由 0 開始，喺 4 之前停；個 list 將嗰四個 byte copy 入去。",
  "try t.appendSlice(gpa, \"...\"); — 字串常數都係一個 slice，同一個呼叫就接得落去。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.basic.09.int-slices"
title = "中間抽兩個"
story = "更表想將第二同第三個收費亭嘅數獨立抄出嚟，然後將成行接喺後面，而抄出嚟嘅係成行兩次。"
brief = '''
一個 list 嘅內容係一個 slice，`v.items`，而佢嘅一截係
`v.items[1..3]` — 元素 1 同 2，去到 3 為止、唔包 3 — 佢仍然係 `v` 嘅一個
**view**，乜都冇 copy。copy 嘅係接駁：
`part.appendSlice(gpa, v.items[1..3])` 將嗰兩個 copy 入你自己一個 list，而同一個
呼叫用成個 `v.items` 就會接駁晒全部。

```
try part.appendSlice(gpa, v.items[1..3]);
try part.appendSlice(gpa, v.items);
```

`v` 裝住嗰行嘅整數（最少三個），`part` 係一個空 list。喺兩個 `// FILL` 記號打
嗰兩行。

```
input:  1 2 3 4
output: 2 3 1 2 3 4
```
'''
hints = [
  "try part.appendSlice(gpa, v.items[1..3]); — slice 嘅尾係攞嘅最後一個元素再後一個。",
  "try part.appendSlice(gpa, v.items); — 成個 slice，接喺嗰兩個後面。",
]

