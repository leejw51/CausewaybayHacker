[[quest]]
id    = "zig.basic.10.byte-slices"
title = "頭三個 byte"
story = "讀卡器條線以 byte 傳送一個車牌，接收器留低頭三個，再將最後兩個駁喺尾，而佢印出嚟嘅 buffer 係成個車牌。"
brief = '''
byte 係 `u8`，而讀入嘅嗰行本身已經係一個 byte slice，一個
`[]const u8`。上一個 node 嗰兩個寫法照用：`bytes[0..3]` 係頭三個嘅 view，
`bytes[bytes.len - 2 ..]` 係最後兩個嘅 view — 尾開住就一直去到尾 — 而
`appendSlice` 將一個 view copy 入你擁有嘅 list。`{x:0>2}` 用 hex 印一個 byte；
`{s}` 將個 list 當文字印。

```
try head.appendSlice(gpa, bytes[0..3]);
try head.appendSlice(gpa, bytes[bytes.len - 2 ..]);
```

`bytes` 裝住嗰行（最少三個 byte），`head` 係一個空 list。喺兩個 `// FILL` 記號打
嗰兩行。hex 嗰行同文字嗰行已經幫你印好。

```
input:  sampan
output: 73616d616e
        saman
```
'''
hints = [
  "try head.appendSlice(gpa, bytes[0..3]); — 三個 byte，copy 入個 list。",
  "try head.appendSlice(gpa, bytes[bytes.len - 2 ..]); — 由離尾兩格開始，去到尾；.. 後面乜都冇即係去到尾。",
]

