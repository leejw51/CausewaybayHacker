story = "06:00，紅隧銅鑼灣出入口。成晚嘅收據係一棵金額嘅樹，而個文員拆開咗一條從來都唔存在嘅左枝 — panic: attempt to use null value，喺銅鑼灣唯一一個唔可以錯嘅收費亭度。"
brief = '''
二元搜尋樹係一堆 node，每個有一個值同兩個 optional 子節點指標 `?*Node`，未有嘢
掛上去之前係 `null`：細啲嘅值住喺 `left` 下面，大啲嘅住喺 `right` 下面。插入係
遞迴嘅：一棵空嘅子樹（`null`）變做一個由 `gpa.create` 整出嚟嘅新 node，否則個值
就沿住一邊落去 — 而嗰邊變成乜，就要儲返入去，因為嗰邊一陣之前可能仍然係
`null`。`n orelse { ... }` 就係先處理 null 情況嘅寫法，而對一個冇人 check 過嘅
子節點用 `.?` 就係 `panic: attempt to use null value` — 嗰個就係 boss，亦都正正係
嗰兩行佔位做緊嘅嘢。

```
cur.left = try insert(gpa, cur.left, v);
cur.right = try insert(gpa, cur.right, v);
```

`Node`、`null` 嘅情況、`inorder`、`height`、`freeTree` 同 `main` 已經寫好。喺兩個
`// FILL` 記號打兩行落去嘅行，取代佔位：左邊嗰行喺 `if` 入面，右邊嗰行喺 `else`
入面。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "左邊 cur.left = try insert(gpa, cur.left, v);，右邊 cur.right = try insert(gpa, cur.right, v);。",
  "將結果儲返入去：個子節點可能係 null，而新 node 就係 insert 回傳嘅嘢。insert 可能分配唔到記憶體，所以個呼叫要 try。",
  "佔位嗰行喺未有嘢掛上去之前就用 .? 拆開個子節點 — 嗰個就係 panic。真正嗰行將個 null 交畀 insert，而佢嘅 orelse 就係個 check。",
]
