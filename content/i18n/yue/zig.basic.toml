[[quest]]
id    = "zig.basic.05.loops"
title = "數車軸"
story = "三號收費亭每一下數一條車軸，塊牌想要累計總數，同埋邊幾下係落喺每第三條車軸。"
brief = '''
Zig 嘅計數迴圈係一個有 continue 表達式嘅 `while`：`while (i
<= n) : (i += 1)` 先試條件，行主體，再做 `i += 1`，然後再試。計數器係喺佢之前
宣告嘅 `var`，所以 `i` 由 `1` 行到 `n`，頭尾都包埋。`@rem(i, 3) == 0` 即係話
「3 嘅倍數」— 呢度有正負號嘅整數冇 `%`。

```
while (i <= n) : (i += 1) {
```

主體已經寫好：佢將 `i` 加落 `sum`，同埋數 3 嘅倍數。喺 `// FILL` 打嗰行 `while`，
取代少行一步就停嗰行。

```
input:  10
output: 55
        3
```
'''
hints = [
  "while (i <= n) : (i += 1) { — 試條件、行主體，然後係冒號後面嘅 continue 表達式。",
  "係 <= n，唔係 < n：要數埋第 n 條車軸。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.basic.06.functions"
title = "隧道收費"
story = "廣場頭十條車軸每條收五蚊，之後每條三蚊，而收費板上面淨係寫住 fare。"
brief = '''
函數幫一份工作改個名：`fn`、佢個名、佢嘅參數連型別、佢嘅回傳型別，同一個以
`return` 收尾嘅主體。`fn
fare(rides: i64) i64` 收一個數，畀返一個數。函數可以喺 `if` 入面提早 `return`，
嗰行之後嘅嘢就係另一個情況。Zig 唔收一行佢證明到永遠唔會行嘅嘢，所以兩行真嘢
放入去嘅時候，佔位嗰句 `return` 就要刪。

```
if (rides <= 10) return rides * 5;
return 50 + (rides - 10) * 3;
```

收費：頭 10 次每次 5，之後每次 3。`main` 讀入 `n` 再印 `fare(n)`。喺 `// FILL`
打嗰兩行做 `fare` 嘅主體，取代 `return rides;`。

```
input:  13
output: 59
```
'''
hints = [
  "if (rides <= 10) return rides * 5; — 跟住下一行 return 50 + (rides - 10) * 3;",
  "十次每次 5 係 50，第十次之後每多一次就再加 3。",
  "刪咗 return rides; — 上面有兩個 return，編譯器會話佢係 unreachable code，然後停低。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.basic.07.structs"
title = "一個收費亭，三個欄位"
story = "五號收費亭將佢條車道個名、收費同車數寫喺三塊唔同嘅板上面，冇人將佢哋放埋一塊。"
brief = '''
`struct` 將有名嘅欄位組成一個值，而喺入面宣告嘅 `fn` 就係 method：`s.total()`
將 `s` 當 `self` 傳入去，啲欄位經佢讀，`self.price`。砌一個出嚟要逐個欄位寫名，
次序隨意：`Stall{ .name = name, .price = price, .qty = qty }`。Zig 冇按位置嘅
寫法；漏咗一個欄位係編譯錯誤，唔係一個零。

```
return self.price * self.qty;
const s = Stall{ .name = name, .price = price, .qty = qty };
```

`Stall` 有名、價錢同數量，`main` 印 `name: total`。喺兩個 `// FILL` 記號打嗰兩行：
第一行係 `total()` 嘅主體，第二行喺 `main` 入面砌 `s`。

```
input:  fish 12 3
output: fish: 36
```
'''
hints = [
  "total() 入面 return self.price * self.qty;，main 入面 const s = Stall{ .name = name, .price = price, .qty = qty };。",
  "每個欄位都用一點開頭寫名：.name = name。冇次序可以搞錯，淨係有名可以漏。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.basic.08.enums"
title = "路線顏色"
story = "隧道口個轉車指示牌為出隧道嘅巴士寫住三條港鐵線，而每條旁邊嗰條色帶都被人髹走咗。"
brief = '''
`enum` 係一組封閉嘅有名值：`.island`、`.tsuen_wan`、
`.kwun_tong`，冇其他。對佢做 `switch` 係一個表達式，揀佢裝住嗰個值嘅分支，每個
分支係 `.name => value,`。個 switch 一定要包晒所有值：`else` 分支包你冇寫名嗰啲，
而你寫晒全部之後，Zig 就唔收一個永遠去唔到嘅 `else` — 所以兩個分支放入去嘅時候，
`else => "",` 就要刪。

```
.tsuen_wan => "red",
.kwun_tong => "green",
```

`parse` 將個字變做 `Line`，`.island` 嗰個分支已經寫好。喺 `// FILL` 記號打嗰兩個
