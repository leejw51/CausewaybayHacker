hints = [
  "edit[i][0] = i 同 edit[0][j] = j：將一個前綴變做乜都冇，每個字元要刪一次。",
  "相同嘅字元唔使成本，打斜行；唔同就成本一，攞三個鄰居入面最平嗰個。a:byte(i) == b:byte(j) 比較字元，唔使整兩個新字串。",
  "LCS 係同一個行法，用 max 代替 min，唔同嘅時候冇打斜一步。仲有，每一行都喺 loop 入面用自己嘅 {} 砌 — 一個共用嘅行 table 就係印出一個似層層嘅錯數嘅 bug。",
]

