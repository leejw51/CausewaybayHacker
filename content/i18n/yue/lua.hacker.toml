[[quest]]
id    = "lua.hacker.30.range-queries"
title = "成日變嘅總數"
story = "公園入面每個檔口一晚三十萬個收銀操作，一半係更正，有人要累計總數。"
brief = '''
標準輸入係 `n q seed`。砌一個有 `n` 個值嘅 array，然後行 `q` 個操作，全部來自同一個生成器，用會 wrap 嘅 64 位算術（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

印出每個查詢答案嘅累計總數，然後 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**呢度嘅複雜度係強制執行嘅。** 大嘅隱藏測試係 `n = 500000, q = 300000`。starter 係第 23 個節點嘅答案：一個前綴和 table，令每個查詢係 `O(1)` — 而每個更新都會整爛佢，所以 starter 重砌佢，每個更新 `O(n)`，做十五萬次。喺呢部機用咗 **57 秒**，而執行時限係十秒。（改用普通 loop 加個範圍，本質上冇好到，實際上只係好少少：每個*查詢*而唔係每個更新 `O(n)`，喺度用咗大約 14 秒。）Fenwick tree 幾百分之一秒做晒成件事。全部用呢關嘅程式實測。

（呢關嘅 Rust 同 Go 版本行四百萬個操作。呢片地保留 Python 嘅三十萬，因為啲 case 係參考答案嘅 — 而重點係分開啱嘅結構同錯嘅結構，唔係分開一個 runtime 同另一個。）

面試官想釣嘅就係呢課：*單點更新、範圍求和*正正係 Fenwick tree 存在要處理嘅形狀。三個短 function — add、prefix，同埋用兩個前綴之差做 range — 而 `bit.band(i, -i)` 就係按最低 set bit 行一步嘅方法：`bit` library 將 `-i` 當二補數 32 位整數，就係咁令個竅門行得通。

累計總數會過 `10^13`。Lua 數字準確裝得落 `2^53` 以內每個整數，`print` 會顯示晒十四個位；呢個就係你有嘅餘裕，知道佢係答案嘅一部分。
'''
hints = [
  "每個初始值呼叫一次 add 嚟砌棵樹。O(n) 由下而上嘅砌法係一個好嘅優化，但唔係個鐘測試嘅嘢。",
  "bit.band(i, -i) 分離出最低 set bit — bit library 將 -i 睇做二補數。加佢就向上行棵樹；減佢就向下行。",
  "range(l, r) 係 prefix(r + 1) - prefix(l)，搞啱嗰對差一就係大部分嘅 debug。將 bit.band 綁落一個 local 係呢關唯一需要嘅微優化，而 LuaJIT 都差唔多唔需要。",
]

