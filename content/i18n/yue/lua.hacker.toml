[[quest]]
id    = "lua.hacker.20.bits"
title = "孤零零嗰個"
story = "每張香燭單都掃兩次，除咗一張。佢哋唔畀你用 table，亦唔畀你排序。"
brief = '''
第一行係 `n`。第二行係 `n` 個非負整數，入面每個值都啱啱好出現兩次，除咗一個。

印四行：

1. 出現一次嗰個值，用 **xor** 同常數額外空間搵出嚟
2. 佢有幾多個 `1` 位
3. 佢係二嘅次方就印 `POW2 YES`，否則 `POW2 NO`（`0` 唔係）
4. 清走最低嗰個 set bit 之後嘅值，冇嘅話就 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` 同 `x ^ 0 == x`，而 xor 唔理佢發生嘅次序。成個第一行就係咁。`x & (x - 1)` 清走最低嗰個 set bit，免費畀你第三同第四行。

Lua 5.1 冇位元運算子 — 喺呢度 `^` 係**次方**，`4 ^ 4` 係 `256`。啲位住喺 `bit` library：`bit.bxor(a, b)`、`bit.band(a, b)`、`bit.bor`、`bit.lshift`、`bit.rshift`。佢哋喺 32 位整數上面做嘢，畀返一個有號嘅，所以 `2^31` 或以上嘅值會變負數返嚟；呢度啲值好細。寫數位嘅 loop，因為佢哋問嘅就係個 loop。

呢度四個測試最多五個數字，個鐘喺佢哋身上唔係量速度：一個計數 table 每個都過到，排序都一樣。大啲嘅 case 都唔會改變呢點，因為呢條題目設嘅標準係**空間** — 一個累加器，其他乜都冇 — 而冇任何執行時限分得開常數空間嘅答案同一個 table。嗰樣靠你嘅良心，同埋會問你嘅面試官。
'''
hints = [
  "啲對無論用咩次序嚟都會自己抵銷，所以用 bit.bxor 喺張 list 上面摺一次就夠。",
  "每次清走最低嗰位嚟數位 — walk = bit.band(walk, walk - 1) — 每個 set bit 行一次，唔係每個位闊度行一次。",
  "二嘅次方啱啱好得一個 set bit，所以清走最低嗰個就剩零 — 而零本身要人手排除。",
]

