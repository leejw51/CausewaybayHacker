    next value = (x >> 33) % 1000000007
```

數**逆序對**：`a[i] > a[j]` 嘅 `i < j` 對。印個數，然後 `MAX <largest value>`。

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1` 嘅話個 array 係
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。

**呢關會強制執行複雜度，而且只有呢類關做得到。** 其中一個隱藏測試係 `n = 200000`。`O(n²)` 嘅雙重 loop — 即係 starter — 係 `2 × 10^10` 次比較，喺呢部機行咗 **25 秒**都未完，而執行時限係十秒。喺 merge sort 期間數逆序對係 `O(n log n)`，幾百分之一秒做完。喺呢部機、用呢兩個程式實測。

呢個語言有兩樣嘢決定得唔同。生成器用 LuaJIT 嘅 64 位整數行 — `0ULL + seed`，啲常數尾加 `ULL` — 因為普通數字係 double，個積會唔見咗低位；`tonumber(bit.rshift(x, 33))` 將每次抽出嚟嘅帶返做數字。而答案 `9990744366` 大過 `2^32`，遠細過 `2^53`，所以 double 裝得準，`print` 會顯示每個位；講得出*點解*咁係安全，同埋去到邊度就唔再安全，係答案嘅一部分。
'''
hints = [
  "生成嗰陣攞最大值，或者排序之前由原本個 table 攞 — 呢個 merge sort 係原地做嘅。",
  "右邊嘅值贏咗合併嗰陣，左半剩低每個元素都大過佢 — 即係一次過 `mid - i + 1` 個逆序對，成個竅門就係咁。",
  "遞迴深度係 log2(200000)，大約十八層 — 離 LuaJIT 嘅頂好遠。喺壓縮咗嘅值上面用 Fenwick tree 係另一個 O(n log n) 答案，值得喺房入面講出嚟。",
