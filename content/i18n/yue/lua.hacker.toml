[[quest]]
id    = "lua.hacker.32.modular"
title = "模十億零七"
story = "呢句喺題目最底出現，房入面一半人唔知佢叫佢哋做乜。喺呢間房佢仲多問一樣嘢：一個裝五十三位嘅數字，乘兩次。"
brief = '''
標準輸入係 `n q seed`。用會 wrap 嘅 64 位算術（`0ULL + seed`）生成 `q` 個查詢：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

每個查詢計二項式係數 `C(a, b)` **模 1000000007**。印出全部 `q` 個答案嘅總和，本身都模 `1000000007`，然後 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

喺呢個大細，`C(a, b)` 有幾十萬個位，Lua 冇嘢裝得落。每次乘法都一路做一路約簡。問題係除法：`a! / (b! (a-b)!)` 喺模算術入面冇意義。取代佢嘅係**模逆元**，而因為 `1000000007` 係質數，費馬小定理就畀咗你：`inverse(v) = v^(p-2) mod p`，用重複平方 — 呢度 `^` 係浮點次方，做唔到，所以個 loop 係你嘅。

所以：預先計一次 `factorial[0..n]`，每個查詢答 `f[a] * inv(f[b]) * inv(f[a-b])`。

**而喺呢個語言，乘法本身就係陷阱。** 兩個餘數各自細過 `2^30`；佢哋嘅積細過 `2^60`，而 Lua 數字係一個裝 `2^53` 嘅 double。過咗嗰點 `(a * b) % P` 就錯 — 唔係錯誤，唔係 overflow，只係低位冇咗，個餘數差少少。老實嘅 `mulmod` 將一個因數切做高同低 16 位兩半，令每個部分積保持細過 `2^46`，兩半之間約簡。佢係五行，starter 帶住佢；呢個節點每個積都要經佢。

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 200000`、`q = 200000`。每個係數獨立咁計 — 乘 `b` 項、除 `b` 項，每個一次模逆元 — **25 秒**都未完，而執行時限係十秒；嗰個就係 starter。一張共用嘅階乘表，加由一個 `powmod` 向後預先計好嘅逆階乘，每個查詢兩個 `mulmod` 就答到，幾百分之一秒做完。兩個都喺呢部機實測。
'''
hints = [
  "每次乘法之後都約簡，而且淨係經 mulmod 乘：兩個餘數直接 a * b 會過 2^53，靜靜雞錯。",
  "powmod(v, P - 2) 係模逆元，淨係因為 P 係質數先行得通 — 呢度費馬小定理嘅全部內容就係咁。",
  "逆階乘都預先計，由 powmod(factorial[n], P - 2) 向後：inv_factorial[i - 1] = inv_factorial[i] * i。咁一個查詢就係兩個 mulmod，完全唔使 powmod。",
]

