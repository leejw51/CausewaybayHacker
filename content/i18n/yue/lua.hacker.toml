[[quest]]
id    = "lua.hacker.29.dijkstra"
title = "唔係每條街都一樣長"
story = "你到而家清過嘅每張地圖都係數跳幾多步。電車唔理有幾多個站；佢理嘅係要行幾耐 — 而今晚大坑每條巷都要行耐啲。"
brief = '''
標準輸入係 `n m seed`：`n` 個站，`m` 條有權重嘅無向邊。自己砌個圖，用**完全**呢個生成器，用會 wrap 嘅 64 位算術（`0ULL + seed`，同第 16 個節點一樣）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

印出由站 `0` 去每個去得到嘅站嘅最短距離總和（包埋 `0` 本身，即係 `0`），然後 `MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 100000`、`m = 200000`。無論點都係用 Dijkstra；個鐘決定嘅係 priority queue。starter 將未去過嘅站放喺一個 set — 一個用站做 key 嘅 table — 再用 `pairs` 行個 set 搵最近嗰個，每步 `O(V)`，總共 `O(V²)`：喺呢部機，**32 秒**，而執行時限係十秒。binary heap 令佢變 `O((V + E) log V)`，大約六分之一秒做完。兩個都喺呢部機、用呢關附帶嘅兩個程式實測。

值得睇清楚，因為呢個係計時篩選最常見嘅失敗方法：**starter 冇錯。** 佢印出完全啱嘅答案。佢被拒絕，只係因為到得太遲。

呢度冇 `heapq`：個 heap 就係第 12 個節點交畀你嗰個，裝住 `{ distance, stop }` 項目、按距離比較，今次由你寫。佢冇 decrease-key，你亦唔需要：將改善咗嘅距離當新項目 push，pop 出嚟嘅項目距離已經差過你記錄嗰個就跳過。呢個「過時項目」跳過就係大家會漏嗰行，冇咗佢個 heap 會無限咁大。`math.huge` 係老實嘅 `unreached`：佢比較起嚟大過每個數字，鬆弛嗰陣唔使 `nil` 檢查。
'''
hints = [
  "min-heap 入面用 { distance, stop } 項目，按第一個欄位做 key：第 12 個節點嘅 heap，`less` 簡化做比較 [1]。",
  "距離大過 dist[u] 嘅項目就跳過，呢個就係過時項目跳過。冇咗佢演算法仍然啱，但個 heap 會塞滿過時項目。",
  "math.huge 係老實嘅 `unreached`：佢比較起嚟大過每個數字，鬆弛嗰陣唔使 nil 檢查。生成器嘅生成樹部分保證每個站都去得到，所以最後嘅過濾永遠乜都唔會移走 — 照留住佢，因為有去唔到嘅站嘅版本就係跟進問題。",
]

