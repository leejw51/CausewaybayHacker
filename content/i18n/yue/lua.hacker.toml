  "喺 ADD 分支入面由同一個 iterator 拉 ADD 嘅參數。loop 計數器數嘅係指令，唔係 token。",
  "`if #items > 0 then items[#items] = nil end` 係帶守衛嘅 pop — 喺 Lua 個守衛係免費嘅，照寫就表示你見到呢個情況。",
