brief = '''
第一行係 `n`。第二行係按**層序**嘅 `n` 個值，`-1` 即係「呢度冇節點」— 所以棵樹係用 heap 嘅方式儲：index `i` 嘅子節點係 `2i+1` 同 `2i+2`。

