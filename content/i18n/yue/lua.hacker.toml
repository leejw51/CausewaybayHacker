[[quest]]
id    = "lua.hacker.16.union-find"
title = "邊個同邊個相連"
story = "電車、港鐵同小巴路線喺同一張紙上面，加埋今晚火龍封咗嘅每條巷。其實有幾多個獨立嘅網絡。"
brief = '''
標準輸入係 `n m seed`：`n` 個編號 `0..n-1` 嘅站，`m` 條無向連結。輸入入面冇連結 — 你自己砌，用**完全**呢個生成器，用會 wrap 嘅 64 位算術：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

印三行：有幾多個獨立網絡、最大嗰個嘅大細，同埋 `REDUNDANT <k>` — 有幾多條連結接咗兩個本身已經相連嘅站。一個站連去自己嘅連結都算係其中之一。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1` 嘅話，五條連結係 `6—1`、`4—6`、`2—3`、`2—6`、`1—2`。最後一條接嘅兩個站已經喺同一個網絡，所以佢就係多餘嗰條，剩低嘅係 `{1,2,3,4,6}`，加上各自獨立嘅站 `0`、`5` 同 `7`。

Lua 數字係 double，而 double 裝 53 位：喺入面將其中兩個常數相乘，喺 `+` 發生之前低位已經冇咗。LuaJIT 有題目寫嗰種型別。`0ULL + seed` 係一個無號 64 位整數，喺佢上面嘅 `*` 同 `+` 喺 `2^64` wrap — 唔使 mask，個型別*就係* mask — `bit.rshift(x, 33)` 攞佢，`tonumber(...)` 將 31 位嘅結果帶返做一個 `%` 用得嘅普通數字。呢條路上每個大 case 都用同一個四行生成器。

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 200000`，有 `m = 200000` 條連結。唔係 union-find 嘅嗰個明顯答案 — 每條連結都由 `a` 行晒成個網絡，睇吓 `b` 係咪已經喺入面 — 係啱嘅，而佢每條連結 `O(n)`，所以總共 `O(n·m)`：喺呢部機上面，**25 秒**之後佢仲未行完，而執行時限係十秒。starter 就係咁。有路徑壓縮同按大小合併嘅 union-find 做同樣 200000 條連結用 **0.01 秒**，係喺度用呢一關附帶嘅答案量出嚟。

值得睇清楚，因為呢個係計時篩選最常見嘅失敗方法：**starter 冇錯。** 佢喺範例同兩個細嘅隱藏測試上面都印出完全啱嘅答案。佢被拒絕，只係因為到得太遲。

Union-find：每個站指住一個 parent，`find` 行到根，`union` 將一個根指去另一個。喺 `find` 出返嚟嘅路上壓縮路徑，成件事每個查詢實際上就係常數時間。

將 `find` 寫做 loop。遞迴嗰個係教科書版本，而喺一條二萬長嘅鏈上面佢係 `stack overflow` — 正正係按大小合併存在要避免嘅形狀，亦正正係一個惡意輸入喺第一個 `find` 壓縮佢之前嘅形狀。
'''
hints = [
  "一路行一路抽兩個端點 — 每個一步生成器，按嗰個次序 — 唔好先砌一張連結清單。呢度冇嘢需要啲連結兩次。",
  "開始時每個站都係自己嘅 parent，有 n 組；每次成功嘅 union 將組數減一。之後淨係根嘅 size 項目有意義，所以由啲根讀最大嗰個，唔好由每個 index 讀。",
  "兩頭已經有同一個根嘅連結就係多餘嗰條 — 數佢然後繼續。自己連自己，a == b，自然就會喺呢個測試度跌出嚟。",
  "parent[v], v = root, parent[v] 一行就壓縮：Lua 喺 assign 任何嘢之前會計晒成個右邊，所以舊嘅 parent[v] 喺被覆寫之前已經讀咗。",
]

