印出**編輯距離**：將第一個變做第二個最少要幾多次單字元插入、刪除或者替換。然後印 `LCS <k>`，佢哋最長公共子序列嘅長度。

```
input:  horse
        ros
output: 3
        LCS 2
```

同樣兩個字串上面兩個 table，兩個都係同一條三行遞推式，打和規則唔同。一行一行填；答案喺最遠嗰角。對編輯 table 嚟講，第 `0` 行同第 `0` 列唔係零 — 佢哋係刪除或者插入晒所有嘢嘅成本。

第一行係空嘅話，`gmatch("%S+")` 會將第二個字當第一個畀你。呢條要按行讀，唔好按 token — `gmatch("(.-)\n")` 行過每一行，空行就畀返一個空字串。

