id    = "lua.hacker.27.commands"
title = "輸入就係個問題"
story = "香燭檔部收銀機嘅記錄由機度出嚟嗰陣喺八十欄度摺咗行，而頂嗰個數係指令數，唔係字數。"
brief = '''
第一行係 `k`，後面**指令**嘅數目。啲指令係用空白分隔嘅 token，碰巧點摺就點擠喺其餘嘅行度 — 每行任何數量，任何空格量，可能尾有一行空白。

| 指令 | token | 效果 |
| --- | --- | --- |
| `ADD <cents>` | 兩個 | push 一件貨 |
| `VOID` | 一個 | 移走最後一件，冇就乜都唔做 |
| `TOTAL` | 一個 | 印出而家嘅總數 |
| `CLEAR` | 一個 | 移走所有嘢 |

`k` 個指令之後，印 `COMMANDS <k>` 同 `ITEMS <how many are left>`。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` 數嘅係指令，而 `ADD` 係一個由兩個 token 組成嘅指令 — 所以一個行 `k` 次、每轉讀一個 token 嘅 loop 會停錯地方。讀 `k` 個指令，淨係指令有參數嗰陣先拉個參數 — 而「我叫先拉下一個 token」嘅工具就係 `gmatch` 畀返嘅 **iterator**：`local next_token = input:gmatch("%S+")`，每次 `next_token()` 就係多一個 token，輸入用完就係 `nil`，所以輸入完結係一個值，唔係錯誤。

空收銀機上面嘅 `VOID` 同未加過嘢之前嘅 `TOTAL` 都要行得通。題目冇一句話佢哋唔會發生，而喺真嘅篩選，嗰份沉默就係規格。喺空 table 上面 `items[#items] = nil` 會寫 `items[0] = nil`，乜都唔做 — 其他語言會拋出錯誤嘅地方，Lua 喺呢度係寬容嘅 — 知道佢係咁，並講出嚟，就係被問嗰陣嘅答案。
'''
hints = [
