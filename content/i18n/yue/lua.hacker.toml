[[quest]]
id    = "lua.hacker.31.palindrome"
title = "倒轉都一樣"
story = "頭二十位嘅題目，大部分篩選都會用某種形式問，亦係大部分人寫過一次但從來冇明過嗰條。條龍由尾讀都一樣，面試官話，冇笑。"
brief = '''
標準輸入係 `n alphabet seed`。自己砌個字串，用會 wrap 嘅 64 位算術（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

印出最長回文子字串嘅長度，然後 `AT <index>` — 嗰個長度**最左邊**嗰個嘅起點，由 0 開始計。

```
input:  12 3 5
output: 5
        AT 1
```

圍住每個中心向外擴。有 `2n - 1` 個中心，唔係 `n` 個：每個字元係單數長度回文嘅中心，而兩個字元之間每個空隙係雙數長度回文嘅中心。唔記得啲空隙，就係一個睇落啱嘅答案喺 `abba` 上面回傳 `1` 嘅原因 — 而 starter 正正係咁。

你從來唔需要個字串當字串用。將抽出嚟嘅嘢放喺一個細數字 table — `s[i] = next() % alphabet` — 比較數字；對兩萬個單字元字串用 `..` 會先整兩萬個字串。個 table 由 1 開始，而題目嘅 `AT` 由 0 開始，所以你印嘅 index 係你搵到嗰個減一。

**測試強制同唔強制啲乜**，講白啲。做嘢嘅隱藏測試係 `n = 8000`，字母表得**一**個字母。呢個係圍住中心擴嘅最差情況 — 每個中心都行到字串尾 — 所以啱嘅答案喺嗰度做足 `O(n²)`，三千二百萬次比較，LuaJIT 幾百分之一秒做完。佢亦拒絕逐個子字串檢查再逐個測試嘅答案，嗰個係立方 — 喺呢度大約 `10^11` 次比較 — 遠超十秒時限。

另一個大 case，`n = 20000`，字母表兩個字母，係一個**正確性** case，唔係速度 case：喺隨機二進位字串上面，回文測試一兩個字元之後就失敗。佢檢查你個生成器同你最左 index 嘅打和規則喺大規模下同我哋嘅一致。

所以：測試拒絕立方，接受平方。佢哋**唔會**要求 Manacher 演算法，即係 `O(n)` 嘅答案。知道佢存在同佢做乜，因為「你可唔可以做得好過平方？」通常就係呢條題目要鋪墊嘅跟進問題。
'''
hints = [
  "每個中心擴兩次：(c, c) 畀單數長度，(c, c + 1) 畀雙數長度。starter 漏咗第二個。",
  "loop 停嗰陣，i 同 j 都行過咗回文一格 — 所以佢嘅長度係 j - i - 1，而喺由 1 開始嘅 table 入面，i 已經係由 0 開始嘅起點。",
  "淨係嚴格更長嘅回文先更新，每個長度最左邊嗰個就係你留住嗰個，正正係 AT 問嘅。s[0] 係 nil，唔係繞返嚟嘅字元，而 nil == s[j] 就只係 false — `i >= 1` 嘅檢查仍然係老實應該寫嘅嗰個。",
]

