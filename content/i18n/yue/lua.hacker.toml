[[quest]]
id    = "lua.hacker.11.bst"
title = "佢係咪真係一棵 BST"
story = "跟進題，同一棵燈籠號碼樹。個個都檢查兩個子節點，個個第一次都錯。"
brief = '''
同上一條題目一樣嘅層序編碼：`-1` 係冇節點，`i` 嘅子節點係 `2i+1` 同 `2i+2`。

第一行係 `n q`。第二行係 `n` 個樹值。第三行係 `q` 個查詢值。

印 `VALID` 或者 `INVALID` — 呢棵係咪二元搜尋樹，左子樹每個值都嚴格細過節點，右子樹每個值都嚴格大過節點？然後每個查詢一行：喺棵樹入面就印 `<value> FOUND <depth>`，唔喺就印 `<value> ABSENT`，根係深度 1。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

喺每個節點檢查 `left < node < right` **唔夠** — 左子樹深處嘅一個值仍然可以大過一個祖先。改為將開區間帶落去。Lua 冇最細整數畀你做起點；啲界限由 `nil` 開始，即係「未有界限」，而 `nil` 要有自己嘅檢查，因為 `value <= nil` 係 `attempt to compare number with nil`，一個 runtime 錯誤，唔係 false。

查詢由**落降**答：同節點比較，細啲就向左，否則向右，跌出棵樹就報 `ABSENT`。呢點重要，因為棵樹冇保證係 BST，而喺唔係嘅樹入面，一個值可以喺 array 某個落降永遠唔會睇嘅地方。佢係 `ABSENT` — 問你嘅係查找會點做，唔係掃 array 會搵到乜。
'''
hints = [
  "將一個開區間 (low, high) 傳落去。根攞 (nil, nil)；左子節點攞 (low, node)，右子節點攞 (node, high)。",
  "冇節點就空泛地有效 — 呢個就係 base case，回傳 true，唔係 false。",
  "查找就係二分搜尋：細啲向左，否則向右，深度係跳咗幾多下。跌出棵樹回傳 nil，而 nil 印做 ABSENT。",
]

