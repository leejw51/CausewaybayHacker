[[quest]]
id    = "lua.hacker.08.top-k"
title = "問得最多嘅五個"
story = "熱身回合。佢哋要去年燈謎出現得最多嘅五個字，點都照計時。"
brief = '''
第一行係 `n k`。第二行係 `n` 個用空格分隔嘅字。

印出最常見嘅 `k` 個字，最常見嘅先，打和就按字由細到大，每行一個。如果唔同嘅字少過 `k` 個，就全部印。然後印 `DISTINCT <d>`。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

用一個以字做 key 嘅 table 數，然後排名。打和規則唔係裝飾，而喺 Lua 佢就係成條題目：**`pairs` 行一個 table 完全冇次序** — 唔係插入次序，唔係字母次序，而且每次行都唔同。所以啲字要由計數 table 出嚟放入一個 sequence，再用一個**全序**比較去排：次數由多到少，然後字由細到大，就係 `table.sort` 要畀出一個答案所需要嘅，亦係面試官想聽嘅。

呢度四個測試得幾個字，個鐘喺佢哋身上唔係量速度：每個唔同嘅字都掃成張清單一次嚟數，係 `O(n²)`，四個都過到。一年嘅燈謎就過唔到。呢啲測試檢查嘅係打和規則，嗰部分先係人哋真係會搞錯嘅。
'''
hints = [
  "一個 table 裝次數，另一個 sequence 形狀嘅 table 喺個字第一次見到嗰陣加佢入去 — 你排嘅係第二個，因為你排唔到一個用 pairs 行嘅 table。",
  "比較器喺次數唔同嗰陣回傳 counts[a] > counts[b]，相同就回傳 a < b。Lua 嘅字串用 < 逐個位元組比較，正正係題目要嘅由細到大。",
  "loop 上限係 math.min(k, #words) — 喺短啲嘅 list 上面行到 k 會印 nil。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.hacker.09.linked-list"
title = "條鏈"
story = "佢哋要唔用 sequence 嘅版本。table 指住 table，好似火龍每一節捉住前面嗰節咁，因為呢個先係條題目真正講緊嘅形狀。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數，按次序。

用佢哋砌一條單向鏈結串列 — 一個節點係一個有 `value` 同 `next` 嘅 table — 然後由啲節點答。反轉、中間同長度全部由行條鏈嚟，唔係由你讀輸入落去嗰個 sequence；將輸出收集喺一個 sequence 最後再 `table.concat` 係冇問題嘅。印三行：

1. 反轉咗嘅串列，用空格分隔
2. 中間節點嘅值（`n` 係雙數嘅話，就係兩個之中第二個）
3. `LEN <n>`，行條串列數出嚟，唔係信個輸入

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

中間用快慢指針：一個指針每次行一步，一個每次行兩步，快嗰個行到盡嗰陣，慢嗰個就喺度。行一次。

節點係 `{ value = v, next = head }`，條鏈嘅尾就係 `next` 係 `nil` — 唔係一個設做乜都冇嘅欄位，而係個欄位根本唔存在。`while cursor ~= nil do` 就係行法。用 loop 反轉佢：遞迴反轉係三行靚嘢，LuaJIT 嘅 stack 都頂得住幾千層，但真係會被問嘅係十萬個節點嘅版本，而嗰個係 `stack overflow`。
'''
hints = [
  "由尾砌到頭係容易嗰個方向：每個新節點將舊嘅 head 做佢嘅 next，而第一個砌嘅節點 next = nil。",
