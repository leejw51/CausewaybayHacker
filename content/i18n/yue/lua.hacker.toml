[[quest]]
id    = "lua.hacker.06.stack"
title = "下一個高啲嘅"
story = "板上面一列燈籠高度，同一條問題：每一個之後，下一個比佢高嘅係邊個。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數。

對每個項目，印出**佢右邊**第一個嚴格更大嘅項目，冇就印 `-1`。放喺一行，用空格分隔。然後印 `NONE <k>`，即係有幾多個係 `-1`。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

用一個 stack 裝住答案仲未知嘅位置，由底向上一直係遞減。每個位置 push 一次、pop 一次，所以無論睇落點，成件事都係行一次。Lua table 就係個 stack：`pending[#pending + 1] = i` 係 push，`pending[#pending]` 係頂，`pending[#pending] = nil` 係 pop — 全部 `O(1)`，因為冇窿嘅 sequence 上面嘅 `#` 係一個長度，唔係逐個數。

呢度五個測試最多六個數字，個鐘喺佢哋身上唔係量速度。大啲嘅都唔會，而呢點值得知道：天真嘅答案 — 對每個項目向右行，直到有個大啲嘅出現 — 只係喺輸入已經差唔多遞減嗰陣先係平方。喺隨機輸入上面，平均大約 `ln(n)` 步就停，所以冇任何執行時限分得開佢同 stack。stack 仍然係答案，因為佢喺每個輸入上面都係 `O(n)`，包埋遞減嗰個 — 但喺呢一關，呢個係你要憑論證而唔係憑個鐘去信嘅講法。

`table.concat(answer, " ")` 駁數字亦駁字串，係印一行值嘅方法 — `print(a, b)` 會喺佢哋之間放一個 **tab**。
'''
hints = [
  "個 stack 裝嘅係仲等緊答案嘅 index，唔係值。",
  "新嘅值贏咗 stack 頂嗰個值嗰陣，嗰個 index 嘅答案就係新嘅值 — 然後繼續 pop，佢可能贏幾個。`pending[#pending] = nil` 就係 pop。",
  "嚴格更大，所以相等嘅值唔會互相解決；佢哋疊埋，之後一齊解決。",
]

