`PATHS` 個數模 `1000000007`，原因同平時一樣：喺 `1000 × 1000` 嘅隱藏測試，真正嘅數有六百幾個位，double 老早已經將佢變咗 `inf`。一路加一路約簡 — 兩個餘數加埋仍然細過 `2^31`，所以呢度係呢條路上唯一一個普通 `+` 同 `%` 已經夠用嘅地方。

去唔到嘅格**冇**最好成本：`nil`，而任何嘢加落 `nil` 或者同佢比較之前，都要用 `~= nil` 測試佢。一個 `1000 × 1000` 嘅 table 嘅 table 係一百萬個項目，LuaJIT 唔介意。

**大 case 強制嘅嘢：** 佢拒絕任何逐條列舉路線嘅答案。路線多過公園入面嘅燈籠。
'''
hints = [
  "每格都抽兩個值，包埋兩個角 — 生成器唔會跳過佢哋，只係拒絕封咗佢哋。",
  "一個上面同左邊都冇通嘅鄰居嘅通格，有零條路線去到，亦冇最好成本；nil 係老實嘅 `unreachable`，而 `~= nil` 就係比較或者加之前嘅守衛。",
  "終點可以係通但仍然去唔到，正正就係 PATHS 係 0、MIN 係 -1 嘅時候。其中一個隱藏測試就係咁。",
]

