[[quest]]
id    = "lua.hacker.34.stable-sort"
title = "打和嘅保持原位"
story = "兩個跑腿用同一個分數行完火龍嘅圈，排行榜每次重畫都將佢哋排成唔同次序。"
brief = '''
標準輸入係 `n buckets seed`。砌 `n` 個跑手，跑手 `i` 有 index `i` 同一個分數，用會 wrap 嘅 64 位算術（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分數**由高到低**排啲跑手。同分嘅跑手一定要保持佢哋到嘅次序。印出佢哋嘅 index，用空格分隔，然後 `TIES <k>` — 你排好嘅次序入面有幾多對相鄰嘅分數相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 好細，所以差唔多所有嘢都係打和，答案差唔多完全由佢哋點處理決定。

**呢關講嘅係知道你手上係邊種排序。** `table.sort` **唔係穩定**嘅。佢係一個 quicksort，對比較相等嘅元素嘅次序乜都冇承諾，而佢守住呢個唔承諾：喺範例上面，用普通 `a.score > b.score` 排，打和嗰啲出嚟係 `5 1 6 0 4 3 2 7` — 即係 starter 做嘅嘢。乜都冇拋出。答案只係喺呢個輸入上面係另一個答案，而喺真嘅輸入上面永遠都會係。

呢度得一個正確答案，亦係喺每個語言都應該預設去攞嘅嗰個：將個比較整成**全序**。按 `(-score, index)` 排 — 分數由高到低，然後 index 由細到大 — 咁冇兩個跑手會比較相等，穩定性就唔再係一個問題。全序冇嘢要證明。（Python 面試接受嘅另一個答案，「個排序係穩定嘅，靠佢」，喺呢間房唔適用，而知道呢點正正就係重點。）

個鐘喺度唔係量速度，亦都冇嘢畀佢量：你交畀佢邊個比較器，`table.sort` 都係 `table.sort`。呢四個測試完全由打和點處理決定。
'''
hints = [
  "將後半加落比較器：分數相等嗰陣，return a.index < b.index。成個修正就係咁。",
  "永遠唔好寫一個講 `<=` 或者兩邊都回傳 true 嘅比較器 — `invalid order function for sorting` 係 table.sort 話你知個次序唔係一個次序。",
  "TIES 數嘅係排好嘅次序入面相鄰嘅相等分數，無論你寫邊個比較器，個數都一樣 — 出賣你嘅係 index 次序。",
]

