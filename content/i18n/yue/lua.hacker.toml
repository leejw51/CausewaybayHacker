[[quest]]
id    = "lua.hacker.12.heap"
title = "K 條排好嘅隊"
story = "火龍經過嘅每條巷都送嚟已經排好嘅燈籠號碼。將佢哋合併做一張 list，唔好成堆再排過。"
brief = '''
第一行係 `k`。然後 `k` 行，每行係一個數，後面跟住咁多個已經由細到大排好嘅整數。

將佢哋全部合併做一行遞增，用空格分隔，然後 `POPS <total count>`。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

Lua 冇 `heapq`。二元 min-heap 係一個 table 加兩個 function — `push` 將新嘅最後元素 sift 上去，`pop` 將最後元素搬去頂再 sift 落去 — 而 starter 帶住一個，兩個 function 每個十五行，所以呢度個 loop 先係問題，唔係個 heap。讀一次；呢條路再行落去你會自己寫。

項目係 `{ value, which list, how far into it }`，而個 heap 先按 `value` 排，打和就按 list index 排 — 冇問題，因為佢淨係要*某種*次序，而且要係**全序**，因為 heap 嘅比較係你寫嘅，而一個兩邊都話「相等」嘅比較唔係 Lua 會報告嘅錯。

個 heap 每張 list 裝一個項目，唔係每個元素一個，所以無論啲 list 幾長，佢都保持 `k` 咁大。

呢度四個測試得兩三張 list 上面幾個數字，個鐘喺佢哋身上唔係量速度：將所有嘢倒落一個 table 再 `table.sort`，四個都過到；每一步重掃晒 `k` 個頭都過到。`k` 大嗰陣令佢保持 `O(N log k)` 嘅係 heap，而嗰個係對呢啲測試冇包含嘅輸入嘅承諾。
'''
hints = [
  "heap 項目要帶住個值由邊度嚟，唔係 pop 咗之後你補唔返。",
  "{ value, which, at } 加一個先比較 value 嘅 `less` 正正係你要嘅；用每張非空 list 嘅第一個元素做種子 — 數係 0 嘅 list 冇頭可以做種子。",
  "淨係 pop 咗一張 list 嘅元素先 push 嗰張 list 嘅下一個元素 — 咁個 heap 就保持 k。",
]

