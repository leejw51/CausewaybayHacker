[[quest]]
id    = "lua.hacker.07.coins"
title = "啱啱好嘅散紙"
story = "浣紗街口個香燭檔有三格散紙盤，同一個唔收紙幣嘅客。"
brief = '''
第一行係 `n target`。第二行係 `n` 個硬幣面值。每種硬幣都無限供應。

印出啱啱好湊到 `target` 嘅最少硬幣數，湊唔到就印 `-1`。然後印 `REACH <k>`：`0..target` 之間有幾多個金額湊得到，包埋 `0`。

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

隱藏測試好細，所以佢哋捉嘅係錯而唔係慢 — 而其中一個捉嘅係常見嘅錯答案。貪心法，攞最大放得落嘅硬幣再重複，要用 `3 4` 湊 `6` 嗰陣會攞咗個 `4` 然後失敗，而有一個測試正正就係咁。另一個壞答案，冇 table 嘅普通遞迴，呢度捉唔到，但仍然唔應該寫：真嘅 `target` 係 100000，同一個金額會被重新計幾千次。

個 table 由 `0` 到 `target`，而 Lua table 由 `0` 開始都冇問題 — `best[0] = 0` 係一個真嘅項目。湊唔到嘅金額就係**唔存在**：`best[amount]` 係 `nil`，而喺呢度 `nil` 就係老實嘅「去唔到」。加一之前用 `~= nil` 測試，因為 `nil + 1` 係 `attempt to perform arithmetic on a nil value`。有窿嘅 table 永遠唔好用 `#best` 嚟數任何嘢：`#` 係一個邊界，唔係一個數。
'''
hints = [
  "best[0] = 0，而 best[a] 係對每個放得落嘅硬幣，最平嗰個 best[a - coin] 加一。",
  "喺 Lua，nil 係老實嘅 `unreachable` — 冇人湊過嘅金額根本冇項目。加一之前檢查 `~= nil`，唔係個加法本身就係錯誤。",
  "REACH 係 0..target 之中有幾多個有項目 — 行一次個範圍再數；喺有窿嘅 table 上面，`#best` 係一個邊界，可以係任何值。",
]

