output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

前序係節點、左、右。中序係左、節點、右。後序係左、右、節點。每次個遞迴都係同樣三行，淨係 append 嘅位置郁。呢度個遞迴同棵樹一樣深，heap 形狀嘅 array 即係 `log n`，所以 stack 唔係問題 — 大聲講出嚟，因為會被問。

條公式要根喺 index `0`，而 Lua table 可以有 `0` 做 key：將啲值儲做 `tree[0] .. tree[n-1]`，`2i+1` 就唔使改。超出 table 尾，`tree[i]` 係 `nil`，測試佢嘅條件都係咁。`local function walk(...)` 可以呼叫自己；普通嘅 `local walk = function` 就唔得，因為喺佢自己個 body 入面個名仲未喺 scope。
'''
hints = [
  "一個遞迴 function，append 有三個可能位置，好過三個差唔多一樣嘅 function。",
  "base case 係兩個條件一齊：超出 array 尾，或者坐喺一個 -1 上面。",
  "深度係 1 + 兩個子節點較深嗰個，冇節點就係 0。",
]

