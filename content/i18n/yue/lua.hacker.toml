id    = "lua.hacker.28.lru"
title = "月亮"
story = "7-32 號房，最後一條題目，第八次。面試官閂咗個螢幕，白板上面唯一嘅光係窗外嘅月光：一種 table 型別做晒所有結構，同個鐘。"
brief = '''
第一行係 `cap q`，然後係 `q` 行操作，每個係 `PUT <key> <value>` 或者 `GET <key>` — 或者，當第一行帶住**第三個**數 `seed` 嘅時候，之後就冇任何行，`q` 個操作由下面嘅生成器嚟。

實作一個固定容量嘅 cache，滿咗嗰陣趕走**最耐冇用**嘅項目。`GET` 同 `PUT` 都算用咗一個 key。`PUT` 一個 cache 已經有嘅 key 會替換佢嘅值，令佢變最新 — 佢冇加項目，所以無論 cache 幾滿都唔會趕走任何嘢。

每個 `GET` 印個值，唔喺度就印 `-1`。最後印生存落嚟嘅 key，最近用過嘅先，用空格分隔 — cache 空嘅話就 `-` — 然後 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

跟住範例行一次：`GET 1` 令 `1` 再變最近，所以 `PUT 3` 要位嗰陣走嘅係 `2`。`GET 2` 搵唔到。`GET 3` 命中，令 `3` 變最近，所以生存者印做 `3 1`。

生成形式，用會 wrap 嘅 64 位算術（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**starter 係錯嘅，範例顯示咗。** 佢將 cache 放喺兩個 table — `cache[key]` 裝值，`order` 係一個 key 嘅 sequence，最舊嘅先 — 而佢趕走 `order[1]`。`PUT` 一個新 key 會加落 `order` 尾。`GET` 讀 `cache[key]`，其他乜都唔做，因為讀一個 table 唔會郁到入面任何嘢：table 記得一個 key 度有乜，唔記得你上次幾時睇過。所以 cache 趕走嘅係**最先**入嚟嘅 key，唔係**最耐冇用**嗰個，而喺範例上面 `GET 2` 印 `20`。

呢個就係大佬。呢片地所有嘢都係 table，而 table 冇被讀過嘅記憶。最近用過係一樣你要*寫*嘅嘢 — 每次命中同每次覆寫都要，唔止插入 — 而令嗰次寫入係 `O(1)` 嘅結構就係教科書嗰個：一個 hash table 指入一條雙向鏈結串列。呢度冇將指針收埋嘅 `OrderedDict`。呢度啲指針係欄位：節點係 `{ key = k, value = v, prev = p, next = n }`，`nodes[key]` 搵到佢，拆出嚟再喺熱嗰頭接返係四個 assign，冷嗰頭係 `head.next`。兩頭各一個 sentinel table，即係串列 code 入面邊度都唔使 `nil` 檢查。每個操作都係 `O(1)`，你可以唔使含糊咁講出嚟。

starter 嘅 `table.remove(order, 1)` 除咗錯之外仲係 `O(cap)`，而佢嘅 `order` 就係破綻：sequence 講得出邊個先嚟，但每次掂到都將一個 key 搬去尾，就係一次搜尋加一次移位，而鏈結串列就係你自己砌「常數時間搬去尾」嗰陣嘅樣。

（喺呢個面試嘅 Python 版本，大佬係遞迴上限，而兩千個操作嘅隱藏測試仍然喺度。starter 用遞迴行啲操作 — `step` 最尾係 `return step(i + 1)` — 而佢過到，因為嗰個係**正式嘅尾呼叫**：Lua 會重用個 frame，而尾呼叫無論幾多個都唔使成本。大約兩萬個非尾 frame 先係 `stack overflow` 住嘅地方。兩樣事實都要知；遞迴從來都唔係呢個問題嘅形狀，一串操作就係一個 `for` loop。）
'''
hints = [
  "喺 starter 上面跟住範例行：GET 1 讀 cache[1]，order 仍然係 { 1, 2 }，所以 PUT 3 趕走 1，GET 2 搵到 20。掂一下就要搬個 key，而 GET 就係掂一下。",
  "節點係 { key, value, prev, next }；拆出嚟係兩個 assign，喺熱嗰頭接返係四個。有頭同尾 sentinel，兩頭都冇 nil，空串列亦唔使特別處理。",
  "覆寫一個已經有嘅 key 係掂一下，唔係插入 — 決定 cache 滿咗之前先檢查 nodes[key]，唔係覆寫嗰個情況會趕走一樣佢唔應該趕走嘅嘢。",
  "生存者就係由熱嗰頭讀條串列：由 tail.prev 行返去 head。唔使排序，唔使時間戳，永遠唔好用 pairs — pairs 冇次序畀你。",
