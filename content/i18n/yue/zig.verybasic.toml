```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "try seen.put(x, {}); — 個 key，同埋 void 型別唯一嗰個值。",
  "put 收一個 key 同一個值，就算個值乜都唔係；append 係 list 嘅講法，map 冇「尾」可以加。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.verybasic.17.stack"
title = "後入先出"
story = "收據插落 5 號收費亭嘅單插上面，由頂攞落嚟，而文員係由底讀上去。"
brief = '''
讀一行整數。佢哋全部推上 `st`，一個當 stack 用嘅 `ArrayList`；個程式之後要由頂
逐個攞落嚟，最後入嗰個最先印。`pop` 回傳一個 optional — 頂嗰個，或者個 stack
空咗就係 `null` — 而一個 `while` 可以每轉拆開一個，遇到 `null` 就停。迴圈頭就係
