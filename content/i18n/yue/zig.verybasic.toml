揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while (st.pop()) |top| { — pop，capture 個值，遇到 null 停。",
  "for (st.items) 由頭行到尾，乜都冇攞走；popOrNull 係舊版 std 嘅名。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.verybasic.18.queue"
title = "先入先出"
story = "啲車喺 6 號收費亭排隊，先到先處理，但條隊一架都唔收。"
brief = '''
讀一行整數。每個 `x` 都要推入 `q`（一個 `std.Deque(i64)`）嘅尾；個程式之後會按
嚟到嘅次序由前面逐個攞走。同 ArrayList 一樣，每個可能令 Deque 變大嘅呼叫都要交
`gpa` 畀佢。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 1 2 3 4
```
'''
hints = [
  "try q.pushBack(gpa, x); — 由尾入，用 popFront 由前面攞。",
  "pushFront 將每個擺喺上一個前面，條隊就倒轉咗；Deque 冇淨係叫 push 嘅，而且佢永遠唔會記住 allocator。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.verybasic.19.heap"
title = "最輕嗰架下一個"
story = "地磅每次都攞最輕嗰架貨車下一個上，而本應交佢出嚟嘅 heap 係倒轉咗嘅。"
brief = '''
讀一行整數。個程式將佢哋全部推入 `pq`（一個 `std.PriorityQueue`）再逐個 pop
出嚟，而佢哋一定要由最細開始出。條 queue 嘅次序就係宣告佢嗰陣畀嘅函數：
`byValue` 對兩個元素答一個 `std.math.Order`，佢話細嗰個就先出。佢個 return 就係
個窿。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "return std.math.order(a, b); — a 細過 b 就 a 排先：一個 min-heap。",
  "order(b, a) 係同一個比較倒轉咗，即係 starter 嗰個 max-heap；a < b 係一個 bool，而條 queue 要嘅係 Order。",
]

