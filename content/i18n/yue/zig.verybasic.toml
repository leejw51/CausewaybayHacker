[[quest]]
id    = "zig.verybasic.16.sets"
title = "每個車牌得一次"
story = "車牌號碼由鏡頭送出嚟有重複，而登記冊應該每個得一個，照次序。"
brief = '''
讀一行整數。每個 `x` 都要放入 `seen`，一個 set。Zig 嘅 std 冇 set 型別；一個值
型別係 `void` 嘅 hash map 就係一個 set，而 `void` 值寫做 `{}`。印個數同排咗序嘅
