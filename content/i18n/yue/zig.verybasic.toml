```
'''
hints = [
  "mu.lockUncancelable(io); — 即刻 lock；已經喺度嗰個 defer 會喺呢轉完嗰陣 unlock。",
  "mu.lock(io) 回傳一個 error union，而 work 唔可以唔理佢，亦唔可以 return 佢；喺冇人揸住嘅 mutex 上面 mu.unlock(io) 就係 reached unreachable code。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.verybasic.27.binary-tree"
title = "OVERFLOW"
story = "06:00，3 號收費亭。車軸計數器係一個 `u8`，今朝第二百五十六條車軸過嘅時候變成 `panic: integer overflow`，閘杆落咗；半夜到而家嘅收據要人手重新索引，放入一棵夠闊裝得落佢哋嘅搜尋樹。"
brief = '''
今次 `val` 係 `i64`：夠闊。`insert` 將 `v` 放入以 `n` 為根嘅搜尋樹，`n` 係一個
optional 指標：`null` 嘅情況已經寫好，會由 arena 整一個新節點。個窿係將 `v` 送落
正確嗰邊嘅嗰一行 — 細過 `node.val` 就落左邊，否則落右邊 — 並且將遞歸回傳嘅嘢
存返去；個呼叫會 allocate，所以要 `try`。子節點係 `?*Node`，照原樣傳落去 — 未有
人睇過之前永遠唔好用 `.?` 拆開。Inorder 遍歷之後會按升序印出嚟。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); — 遞歸入其中一邊，再將結果存返去。",
  "node.left.? 係未有人睇過就將個 null 子節點拆開 — 第二次 insert 就 panic: attempt to use null value。子節點以佢本來嘅 optional 傳落去；而細嘅落左邊。",
]
