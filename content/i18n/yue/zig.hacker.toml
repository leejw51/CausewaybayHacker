[[quest]]
id    = "zig.hacker.20.bits"
title = "孤零零嗰個"
story = "每條車軸都數兩次，除咗一條。佢哋唔准你用 hash map，亦都唔准你排序。"
brief = '''
第一行係 `n`。第二行係 `n` 個非負整數，入面每個值都啱啱出現兩次，除咗一個。

印四行：

1. 出現一次嗰個值，用 **xor** 同常數額外空間搵出嚟
2. 佢有幾多個 `1` bit
3. 佢係二嘅次方就印 `POW2 YES`，否則印 `POW2 NO`（`0` 唔係）
4. 清走最低嗰個 set bit 之後嘅值，冇 set bit 就印 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` 同 `x ^ 0 == x`，而 xor 唔理佢以咩次序發生。
呢個就係成個第一行。`x & (x - 1)` 清走最低嗰個 set bit，第三同第四行就免費送埋。
全部用 `u64` 做 — 而嗰個減法要寫做 `x -% 1`，因為喺呢個 land，`u64` 上面嘅
`0 - 1` 係 `panic:
integer overflow`，而 `-%` 就係你講明你係想兜圈嘅方法。照樣守住零嘅情況；
個兜圈淨係為咗令個表達式合法。

呢度嘅 case 好細，個鐘亦都唔係量速度。冇大嘅隱藏 case，亦都冇辦法用呢個 pack
砌 case 嘅方法砌一個：一個成對加一個嘅 array 係*構造*出嚟嘅，唔係產生出嚟嘅，
而兩個 land 構造佢，唔會構造出同一個 array。所以呢啲 case check 嘅係嗰四行同
佢哋嘅邊界 — `0` 唔係二嘅次方，而一個冇 set bit 嘅值清走最低嗰個之後仍然係 `0`。
xor 仍然係答案；用巢狀迴圈數出現次數係 `O(n²)`，喺真正嘅 `n` 會死。
'''
hints = [
  "無論啲對以咩次序嚟，佢哋都會自己抵銷，所以對條 slice 摺一次就夠。",
  "每次清走最低嗰個 bit 咁數 bit，每個 set bit 行一次，唔係每個 bit 闊度行一次。@popCount 係內建嘅一行寫法。",
  "二嘅次方啱啱有一個 bit set，所以清走最低嗰個就剩返零 — 而零本身要人手排除，唔係佢嘅 x -% 1 會兜圈變成全部 bit 都 set 晒。",
]

