`remove` 再 `prepend`，就係 `std::list::splice` 去前面，`pop()` 交返最後一個 node，
而每一個都係 O(1)，一個 byte 都唔使分配，所以你可以唔使留後路咁大聲講每個操作
O(1)。要由一個 `*Node` 返去裝住個 key 嘅項目，`@fieldParentPtr("node", node_ptr)`
會按個 field 嘅 offset 將個指標倒退返去。咁個 map 就係
`std.AutoHashMap(i64, *Entry)`。

**starter 就係 boss。**佢有個 map、個 list、個 `create` 同個 `destroy`，而喺範例佢
對 `GET 2` 印 `20`。佢從來冇*掂*過一個 key：`GET` 喺原位讀個值，覆寫喺原位寫，而
個 list 一直保持 key 到達嘅次序。所以個閘記住邊個最先入，就放嗰個最先出 — 係一條
queue，唔係 cache — 佢踢走啱啱先用過嘅 `1`，而唔係 `2`。修正就係教科書畫箭咀嗰兩行：
每次搵到，將個 node `remove` 再 `prepend`。

有兩樣 Rust 面試冇要求你嘅嘢要搞啱。個項目除咗值之外**仲要**裝住個 key，因為踢走
係由 list 開始，而佢要知道要刪 map 入面邊個項目。而三個步驟嘅次序有關係：`pop()`
個 node，經 `@fieldParentPtr` 讀出個 key，喺 map `remove` 咗佢，*然後*先
`gpa.destroy` 個項目 — 倒轉嚟做，就係透過一個 allocator 已經收返嘅指標去讀，而冇
嘢會幫你捉到嗰次讀取：佢交返嗰塊記憶體而家入面有嘅任何嘢，呢個係呢個 land 入面
唯一一個唔會自己報名嘅錯。你 create 過嘅每個項目，喺 `main` 回傳之前都要 destroy
晒；`init.gpa` 背後嗰個 `DebugAllocator` *會*點名嘅，係你唔記得嘅每一個，而嗰張
名單就係買路錢。

呢度嘅 case 好細，個鐘亦都唔係量速度：四個操作分唔出一個 linked list 同一條由
前面掃起嘅 slice。上面嗰段嘅 `O(1)` 係你喺面試房大聲講嘅句子，所以佢一定要對你寫
嘅 code 成立，而唔係對啱啱好過到四個 case 嘅 code 成立。
