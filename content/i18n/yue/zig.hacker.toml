[[quest]]
id    = "zig.hacker.06.stack"
title = "下一個大啲嘅"
story = "白板上面一列路費，得一條問題：每個之後，第一個比佢大嘅係邊個。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數。

對每個項目，印出**佢右邊**第一個嚴格大過佢嘅項目，冇就印 `-1`。全部放喺一行，
用空格分開。然後印 `NONE <k>`，即係有幾多個係 `-1`。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

用一個 stack 裝住仲未知答案嘅位置，由底向上佢會一直保持遞減。每個位置 push
一次、pop 一次，所以無論睇落點，成件事都係行一次。

呢度嘅 case 好細，個鐘亦都唔係量速度，而喺呢條題目，大 case 都幫唔到手。由每個
位置向右掃，直到出現大啲嘅，喺隨機值上面兩三步就搵到答案，無論幾大都快過任何
鐘。大 case 會刷走嘅係一個遞減嘅 array，正正係令嗰種掃法變平方嘅唯一輸入。
stack 仍然係答案：佢喺*每個*輸入都係行一次，而唔係大部分輸入先係。

一個 `std.ArrayList(usize)` 就係個 stack：`append` 係 push，`pop()` 回傳一個
`?usize`，stack 頂係 `items[items.len - 1]`。
'''
hints = [
  "個 stack 裝嘅係仲等緊答案嘅 index，唔係值。一個有 append 同 pop 嘅 ArrayList 就係個 stack。",
  "新嘅值大過 stack 頂嗰個 index 嘅值，嗰個 index 嘅答案就係新嘅值 — 繼續 pop，佢可能大過幾個。",
  "係嚴格大過，所以相等嘅值唔會互相解決；佢哋會疊埋，之後一齊解決。",
]

