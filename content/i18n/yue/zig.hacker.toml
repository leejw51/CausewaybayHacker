[[quest]]
id    = "zig.hacker.29.dijkstra"
title = "唔係每條街都一樣長"
story = "你至今過咗嘅每張地圖都係數跳數。電車唔理有幾多個站；佢理嘅係要行幾耐。"
brief = '''
標準輸入係 `n m seed`：`n` 個站，`m` 條有權重嘅無向 edge。自己砌個 graph，
用**一模一樣**嘅呢個 generator，以兜圈嘅 `u64` 計：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

印出由站 `0` 去每個行得到嘅站嘅最短距離總和（包埋 `0` 本身，即係 `0`），然後印
`MAX <the largest of them>`。

