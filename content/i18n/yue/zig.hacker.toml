[[quest]]
id    = "zig.hacker.07.coins"
title = "啱啱好嘅散紙"
story = "三號收費亭有三格錢盤，同一個唔肯收紙幣嘅司機。"
brief = '''
第一行係 `n target`。第二行係 `n` 個硬幣面值。每種硬幣都有無限咁多。

印出啱啱好湊到 `target` 嘅最少硬幣數，湊唔到就印 `-1`。然後印 `REACH <k>`：
`0..=target` 入面有幾多個數目湊得到，包埋 `0`。

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

隱藏 case 好細，所以佢哋捉嘅係錯，唔係慢 — 而其中一個捉嘅就係最常見嘅錯答案。
貪心法，即係攞放得落嘅最大硬幣再重複，要用 `3 4` 湊 `6` 嘅時候會攞咗
`4` 然後失敗，而正正有個 case 係咁。另一個壞答案，冇表嘅普通遞迴，呢度捉唔到，
但仍然唔係應該寫嗰個：真正嘅 `target` 係 100000，同一個數目會被重新計幾千次。

張表「湊唔到」嘅標記係 `std.math.maxInt(i64)`。對佢加一，喺呢度唔係 undefined，
亦都唔係靜靜雞錯：佢係 `panic:
integer overflow`，程式即刻停。加之前先 check 個格。（`unreachable` 喺呢隻語言係
keyword，所以個標記叫第二個名。）
'''
hints = [
  "best[0] = 0，而 best[a] 係所有放得落嘅硬幣入面最平嘅 best[a - coin] 再加一。",
  "加一之前，要防住讀到一個 never 格 — maxInt(i64) + 1 喺 Debug 係 panic，程式就喺嗰度停。",
  "REACH 就係完成咗嘅表入面有幾多格唔係仲標住 never。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.hacker.08.top-k"
title = "最多人問嘅五個"
story = "熱身回合。佢哋要去年事故 ticket 入面出現得最多嘅五個字，而且照樣計時。"
brief = '''
第一行係 `n k`。第二行係 `n` 個用空格分開嘅字。

印出最常見嘅 `k` 個字，最常見嘅行先，打和就按字由細到大，一行一個。唔同嘅字少過
`k` 個，就全部印晒。然後印 `DISTINCT <d>`。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

用 hash map 數，然後排名。個打和規則唔係裝飾。一個 `std.StringHashMap` 按佢啲
slot 啱啱好嘅次序交出啲項目 — 呢個次序會隨容量同插入而變 — 所以一個淨係睇數目嘅
comparator 會將數目一樣嘅字留喺嗰個次序，同一個程式下一次行就印出另一個答案。
將個比較整成**全序** — 數目由多到少，再用 `std.mem.lessThan(u8, a, b)` 按字由細到大 —
就係解決方法，亦都係面試官想聽嘅答案。

個 map 嘅 key 係 `[]const u8` slice，而佢唔會 copy 佢哋：佢哋一定要活得長過個 map，
而 `input` 嘅 slice 就係。

呢度嘅 case 好細，個鐘亦都唔係量速度。對呢條題目嚟講咁先啱 — 數同排名點寫都係
`O(n log n)`，而喺呢度真正令人肥佬嘅係個 comparator，`ties` 嗰個 case 會 check，
大 case 就唔會。
'''
hints = [
  "用 getOrPut 行一次數，排一次序。唔好一路數一路維持個排名。",
  "數目唔同嘅時候 comparator 回傳 a.count > b.count，一樣嘅時候回傳 std.mem.lessThan(u8, a.word, b.word) — 全序，所以 map 嘅 slot 次序睇唔出。",
  "@min(k, ranked.items.len) 令 k 太大都安全；喺呢度切過 slice 嘅尾係 panic，唔係靜靜雞讀咗落去。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.hacker.09.linked-list"
title = "條鏈"
story = "佢哋要唔用 slice 嘅版本。node 指住 node，每個用 create 買返嚟、用 destroy 交返出去，因為條題目真正講嘅就係呢個形狀。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數，按次序。

用佢哋砌一條單向 linked list — 每個 link 一個 `?*Node`，每個 node 由
`gpa.create(Node)` 嚟，答案入面唔准有 slice — 然後印三行：

1. 倒轉咗嘅 list，用空格分開
2. 中間 node 嘅值（`n` 係雙數嘅話，兩個入面嘅第二個）
3. `LEN <n>`，行一次個 list 數出嚟，唔係信個輸入

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

中間就用快慢指標：一個指標一次行一步，一個一次行兩步，快嗰個行到盡頭嘅時候，
慢嗰個就喺中間。行一次。

呢條題目嘅 C++ 版本係用 `unique_ptr` 問嘅。Zig 冇擁有權指標型別：最接近嘅係一個由
`gpa.create` 嚟嘅普通 `*Node`，而擁有者就係記得對佢呼叫 `gpa.destroy` 嗰個。指標
出咗 scope 嘅時候乜都唔會行。所以倒轉嗰度對佢搬緊乜嘢係老老實實嘅：寫一個 node 嘅
`next`，就將佢由一條 list 拆出嚟、掛落另一條，冇任何一刻兩條 list 都以為自己擁有佢，
因為擁有權由頭到尾都唔喺個指標入面。印完之後，再行一次倒轉咗嘅 list，將每個 node
交返出去；一個 `DebugAllocator` — Debug build 入面 `init.gpa` 就係佢 — 會喺 stderr
點名你漏咗嘅每一個。

*行*個 list 用一個 raw `?*Node` 仍然啱 — 佢淨係睇，乜都唔擁有。
`while (walk) |node| : (walk = node.next)` 就係慣用寫法。
'''
hints = [
  "由尾砌到頭係容易嗰個方向：每個新 node 將舊嘅 head 做佢嘅 next。由 n 倒數啲值，因為 usize 唔可以行落零以下。",
  "倒轉：記住其餘嘅（head = node.next），將個 node 指去倒轉 list，再將佢變做新嘅倒轉 head。每個 node 寫三次，冇任何 node 會同時喺兩條 list。",
  "搵中間，淨係喺 fast 行得到兩步嘅時候先將 slow 推前。",
  "冇嘢會幫你釋放 node。印完之後行一次倒轉 list，逐個 gpa.destroy；Debug build 入面 allocator 會報你漏咗嘅每一個。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.hacker.10.tree-walk"
title = "繞一棵樹嘅三種行法"
story = "白板上面一棵樹，同一條冇人應該要諗兩次嘅問題：講出三種次序。"
brief = '''
第一行係 `n`。第二行係按**層序**嘅 `n` 個值，`-1` 即係
「呢度冇 node」— 所以棵樹嘅儲法同 heap 一樣：index `i` 嘅子節點係
`2i+1` 同 `2i+2`。

印四行：**前序**、**中序**同**後序**走訪，每行用空格分開，然後印 `DEPTH <d>` —
由 root 到 leaf 最長嗰條路上面有幾多個 node。

```
input:  5
        1 2 3 -1 4
