```

**呢度嘅複雜度係強制嘅。**隱藏 case 係 `n = 200000`、
`m = 400000` — C++ 面試最後定落嚟嘅大細，留喺度令答案係同一個答案。無論點都係
Dijkstra 啱；個鐘決定嘅係個 priority queue。每次掃晒所有未去過嘅 node 搵最細係
`O(V²)`，喺 `n = 200000` 係 `4 × 10^10` 次讀取，每次都做邊界檢查，喺五秒執行時限
