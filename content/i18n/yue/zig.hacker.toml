```

跟住範例行一次：`GET 1` 令 `1` 再變返最近，所以 `PUT 3` 要位嘅時候，走嘅係 `2`。
`GET 2` 搵唔到。`GET 3` 搵到，令 `3` 變成最近，所以生還者印出嚟係 `3 1`。

教科書答案係一個指入**雙向 linked list** 嘅 hash map，而 Zig 有真嘢，乜都冇收埋：
`std.DoublyLinkedList` 係 **intrusive** 嘅。個 list 唔會分配 node；你將一個
`std.DoublyLinkedList.Node` — 兩個指標，`prev` 同 `next` — 嵌入你自己嘅 struct，
