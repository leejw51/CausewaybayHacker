hints = [
  "xs.splice(0, 1); — 由 index 0 開始，一個元素。",
  "delete xs[0] 會喺原本個元素嘅位留低個窿；長度唔會變。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.verybasic.13.list"
title = "跑馬燈嘅頭"
story = "突發新聞要擺喺時代廣場螢幕下面條跑馬燈嘅頭，但最新嗰條一直落咗喺尾。"
brief = '''
`chain` 係一個 `number[]`；TypeScript 冇 deque，array 兩頭都做到。迴圈入面讀到嘅每個 `x` 都要加喺「頭」，咁最後讀到嗰個就排第一。array 有個方法係做嗰一頭嘅。

