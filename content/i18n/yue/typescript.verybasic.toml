[[quest]]
id    = "typescript.verybasic.12.vector-edit"
title = "抽走咗嘅片段"
story = "希慎廣場播放清單第一段片喺播之前被抽走咗；佢要走，後面每段都要推前一格。"
brief = '''
`xs` 裝住嗰行嘅整數。個程式要刪走 index 0 嘅元素，等其餘嘅向前移。有一個 array 方法係用起始 index 同數量嚟刪嘢。

