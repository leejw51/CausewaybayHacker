```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "chain.unshift(x); — push 喺頭嗰邊嘅孖生兄弟。",
  "push(x) 放喺尾。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.verybasic.14.maps"
title = "撳咗幾多下"
story = "利園 app 逐件產品數人撳咗幾多下，每件產品一行；任何嘢第一下撳落去，都搵唔到一行嚟加。"
brief = '''
`counts` 係一個 `Map<string, number>`。對每個字 `w`，個程式要將佢嘅計數加一，第一次由零開始。`get` 嘅型別係 `number | undefined`，因為個 key 可能冇，而 `??` 就係冇嗰陣補上要用嘅值。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts.set(w, (counts.get(w) ?? 0) + 1); — 預設值放喺括號入面，然後先加。",
  "counts.get(w)! + 1 編譯到——! 話畀 tsc 知個值係有嘅——但執行時 undefined + 1 係 NaN。",
]

