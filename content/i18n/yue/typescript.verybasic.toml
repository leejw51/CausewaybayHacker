# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.verybasic.19.heap"
title = "最急嘅行先"
story = "故障以任何次序去到控制室，幅牆每次都應該顯示最急嗰個；裝住佢哋嗰個 list 完全唔知邊個係最急。"
brief = '''
TypeScript 嘅標準函式庫冇 heap，所以 starter 帶住一個細細嘅 `MinHeap`：`push` 加一個值然後將佢篩上去，`pop` 拎走最細嗰個。每個 `x` 都要經 heap 自己嘅方法放入去，咁 `pop` 之後先會由最細嗰個開始回傳。直接寫入 `items` 就會跳過篩嗰步，搞亂個次序。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(x); — heap 自己嘅方法，會將 x 篩上去佢應該喺嘅位。",
  "heap.items.push(x) 將 x 放喺 array 尾，跳過咗篩嗰步。",
]

