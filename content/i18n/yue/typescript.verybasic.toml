[[quest]]
id    = "typescript.verybasic.11.vector"
title = "播放清單"
story = "控制室收到嘅每段片都照收到嘅次序排上今晚個播放清單，但個清單一直係空。"
brief = '''
`xs` 係一個 `number[]`，一開始係空。迴圈入面讀到嘅每個整數 `x` 都要加喺尾，保持輸入嘅次序。array 有一個方法做呢樣嘢。

