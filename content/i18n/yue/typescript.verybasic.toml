[[quest]]
id    = "typescript.verybasic.05.bool-if"
title = "向東定向西"
story = "怡和街啲到站牌，雙數站向東，單數站向西；喺梯上面嗰個安裝師傅有個站號，要知道係邊一面。"
brief = '''
`n` 係正整數。`n` 被二整除就要印 `even`，否則印 `odd`。條件係一個 `if`，用三個字元長嘅嚴格相等運算子將餘數同零比較。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  4
output: even
```
'''
hints = [
  "if (n % 2 === 0) { — 三個等號係比較；一個係賦值。",
  "n % 2 係數字，tsc 唔肯將數字同字串 \"0\" 比較：兩個型別冇交集。",
]

