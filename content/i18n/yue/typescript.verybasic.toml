[[quest]]
id    = "typescript.verybasic.17.stack"
title = "疊層"
story = "希慎廣場幅牆上面啲 overlay 一層疊一層，要由頂嗰層拎走；個 renderer 就一直剝最底嗰層。"
brief = '''
`stack` 係一個當 stack 用嘅 array。個程式要將「頂」（最後）嗰個元素拎出嚟放落 `top`。有一個 array 方法會刪走並回傳最後一項；佢嘅型別係 `number | undefined`，因為個 stack 可能係空嘅。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 4
