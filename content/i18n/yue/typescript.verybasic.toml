[[quest]]
id    = "typescript.verybasic.15.hashtable"
title = "查表"
story = "控制室張表將站名對應到佢塊牌嘅號碼，問一個唔喺度嘅站應該答 -1，而唔係令怡和街塊牌變咗一片空白。"
brief = '''
`table` 將名對應到牌號，而牌號可以係 0。對個字 `w`，個程式要印出佢嘅號碼，或者 `w` 唔喺表入面就印 `-1`。`get` 搵唔到 key 就回傳 `undefined`；有一個運算子只會替換 `null` 同 `undefined`，其他一律唔理。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "console.log(table.get(w) ?? -1); — ?? 只係喺 undefined 或者 null 嗰陣先出手。",
  "|| 對每個 falsy 值都會出手，而 0 係 falsy：號碼係 0 嘅牌就會讀做 -1。",
]

