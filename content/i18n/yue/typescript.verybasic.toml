# TYPESCRIPT LAND — VERY BASIC, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/typescript/verybasic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, the quiz choices, sample input and output and the exact
# strings a program must print are the English pack's and are copied verbatim,
# never translated.

pack   = "typescript.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.verybasic.01.print"
title = "第一塊螢幕"
story = "19:00，時代廣場上空。大螢幕黑住咁著起，今晚第一行字要人手打。"
brief = '''
個程式要喺一行度準確印出 `hello, causewaybay`。全域 `console` 上面有個方法會寫一行去標準輸出。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
output: hello, causewaybay
```
'''
hints = [
  "console.log(\"hello, causewaybay\"); — 要有括號，逗號喺字串入面。",
  "呢度冇 print()；一個從來未見過嘅名，tsc 喺任何嘢行之前就用 TS2304 答你。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.verybasic.02.int-types"
title = "分開嘅播放清單"
story = "希慎廣場幅 LED 牆將今晚啲片段分落佢啲板度；排程器要講每塊板分到幾多、仲剩幾多，但佢乜都冇講。"
brief = '''
`a` 同 `b` 係整數。個程式要喺一行度印出整數商同餘數，中間隔一個空格。TypeScript 得一個 `number` 型別，冇整數除法運算子：`/` 永遠畀你小數，`Math.trunc` 掉咗個小數部分，`%` 係餘數。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); — console.log 會喺參數之間加一個空格。",
  "a / b 係 3.5，唔係 3：每個數都係 double。而 // 喺度唔係運算子；佢係註解嘅開頭。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.verybasic.03.floats"
title = "等車時間"
story = "怡和街個電車牌顯示等車時間到兩個小數位，今晚佢顯示 3.5，最後一個位就空咗。"
brief = '''
`x` 同 `y` 係數字。個程式要印出 `x / y`，小數點後面啱啱好兩個位。數字有個方法會用固定嘅小數位數格式化佢，回傳一個字串。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "console.log((x / y).toFixed(2)); — 個括號令除法先做。",
  "Math.round(x / y * 100) / 100 仍然係數字，而數字印出嚟係 3.5，唔係 3.50。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.verybasic.04.strings"
title = "橫額"
story = "利園 app 個橫額由市場部嗰邊用細楷送過嚟，品牌指引要大楷；橫額係照打嘅樣掛上去。"
brief = '''
`s` 係一行文字。印完佢嘅長度之後，個程式要用大楷印出 `s`。有個字串方法會回傳一個每個字母都變咗大楷嘅副本。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "console.log(s.toUpperCase()); — camelCase，要用括號呼叫。",
  "s.upper() 係 Python；字串型別冇呢個方法，tsc 會話你知。",
]

