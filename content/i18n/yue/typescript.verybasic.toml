[[quest]]
id    = "typescript.verybasic.20.sorting"
title = "車費梯級"
story = "怡和街塊牌上面啲車費係照路綫加入嘅次序排，而塊牌將佢哋當文字咁排：10 排喺 9 前面。"
brief = '''
`xs` 裝住嗰行嘅整數。印出嚟之前，個程式要喺原地將 `xs` 由細到大排好。array 嘅 `sort` 收一個 comparator：負數就將第一個參數排先。冇 comparator 嘅話，`sort` 會將啲數字當字串比較。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "xs.sort((a, b) => a - b); — a 減 b 係由細到大。",
  "冇 comparator 嘅 xs.sort() 會將 10 排喺 9 前面，因為 \"1\" 排喺 \"9\" 前面。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.verybasic.21.sort-by-key"
title = "排行榜"
story = "時代廣場螢幕上面嘅撳掣遊戲排行榜，應該係分數由高到低、同分就按名排，但佢顯示緊嘅係人哋加入嘅次序。"
brief = '''
`rows` 係一個 `[string, number][]`：一個有型別 tuple 嘅 array，先係名，然後係分數。佢要先按分數由高到低排，再按名由細到大排。comparator 係一個箭嘴函數；`||` 只係喺第一個比較得出 0 嗰陣先落去第二個比較，而 `byName` 比較兩個字串。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "rows.sort((a, b) => b[1] - a[1] || byName(a[0], b[0])); — 分數由高到低，所以 b 行先過 a。",
