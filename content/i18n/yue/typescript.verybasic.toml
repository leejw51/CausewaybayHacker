[[quest]]
id    = "typescript.verybasic.06.loops"
title = "點數"
story = "三十樓個控制室沿住個機架將啲螢幕一加二加三咁加埋，console 個總數顯示零。"
brief = '''
`n` 係正整數。個迴圈要行勻由 1 到 `n`（包埋 `n`）嘅每個整數，逐個加落 `total`。一個 `for` 嘅頭有起點、每一輪之前檢查嘅條件，同埋步進。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  4
output: 10
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — 細過或等於，所以 n 本身都會行到。",
  "for...in 行嘅係物件嘅 key；數字冇 key，tsc 唔會畀佢試。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.verybasic.07.functions"
title = "時段收費"
story = "時代廣場塊螢幕今晚頭十個廣告時段每個收五蚊，之後每個收三蚊；收費函數應承咗回傳一個數字，tsc 唔肯 build 佢。"
brief = '''
`fare(rides)` 要回傳應收嘅錢：頭十程每程 5，第十程之後每程 3。簽名寫住 `: number`，所以一個乜都冇交返出嚟嘅函數主體編譯唔到。函數用一個關鍵字將個值交返出嚟。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  3
output: 15
```
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "一個標明 `: number` 嘅函數，如果印嘢而唔回傳，係編譯唔到嘅：tsc 會話佢一定要回傳一個值。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.verybasic.08.structs"
title = "一張卡，兩個欄位"
story = "利園 app 每張產品卡都有名同價錢；個 constructor 從來冇 set 個價錢，build 就停喺應承咗有價錢嗰行。"
brief = '''
`Stall` 個 constructor 收到 `name` 同 `price`。個 class 宣告咗 `price: number`，喺 `strict` 之下每個宣告咗嘅欄位都要喺 constructor 入面賦值。佢要用儲 `name` 嘅同一個方法將 `price` 儲落個物件度，咁 `s.price` 先讀得返。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "this.price = price; — this 係個物件；淨係一個名就係個參數。",
  "this.price = name; 編譯唔到：name 係字串，個欄位係數字。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.verybasic.09.struct-method"
title = "購物籃嗰行"
story = "價錢乘數量係利園 app 每個購物籃嘅一行，應該講出嚟嘅方法應承咗回傳數字，但乜都冇回傳。"
brief = '''
`Stall.total()` 要回傳價錢乘數量。constructor 嘅 `public` 參數一次過宣告同儲好啲欄位；喺方法入面，物件嘅欄位要經 `this` 攞。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return this.price * this.qty; — 兩個欄位都經 this。",
  "方法入面淨係寫 price 唔係個欄位；佢係 class 外面由輸入讀落嘅 price，係字串，tsc 唔會將字串相乘。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.verybasic.10.enums"
title = "路綫顏色"
story = "希慎牆上面、銅鑼灣出口頂嗰塊港鐵板寫住三條綫；feed 送嚟嘅係個字，塊板要嘅係佢代表嘅嗰個 enum 成員。"
brief = '''
`word` 係 `island`、`tsuenwan`、`kwuntong` 其中一個。個程式要將佢變做對應嘅 `Line` 成員。enum 可以用成員嘅名做索引，但只可以用 tsc 知道係佢其中一個名嘅 key：`keyof typeof Line` 就係嗰組名，而 `as` 話畀 tsc 知個字串係其中一個。呢個斷言喺執行時會被抹走——佢乜都唔檢查，所以個字串最好夾得啱。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line = Line[word.toUpperCase() as keyof typeof Line]; — 啲名係大楷。",
  "Line[word as keyof typeof Line] 編譯到，因為 `as` 係一個 tsc 信咗你嘅承諾；執行時 Line[\"tsuenwan\"] 係 undefined。",
]

