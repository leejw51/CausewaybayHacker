`p = P("Mei", Addr("Jardine's Bazaar", 5))`。邊一行令 `s` 係 JSON 文字
`{"name": "Mei", "addr": {"street": "Jardine's Bazaar", "floor": 5}}` ——
雙引號、嵌套物件，全部都要？
'''
hints = [
  "`json` 淨係識 dict 同 list；dataclasses module 有一個會遞歸入嵌套 dataclass 嘅轉換器，而 `vars` 喺第一層就停。",
]

