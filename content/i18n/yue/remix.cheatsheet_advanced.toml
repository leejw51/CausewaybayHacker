[[quest]]
id    = "remix.cheatsheet_advanced.07.wait-go"
title = "四個都返齊"
story = "四個速遞員離開糖街個倉；道門要等到每一個都簽返到先鎖。"
brief = '''
喺 **Go**（1.22，所以 `i` 每次迭代都係新嘅）：

```
var wg sync.WaitGroup
for i := 0; i < 4; i++ {
    wg.Add(1)
    // ____
}
wg.Wait()
```

邊一行喺自己嘅 goroutine 上面開 `work(i)`，令 `wg.Wait()` 啱啱好喺四個 `work`
呼叫都**完成**嗰陣返回 —— 冇 deadlock，冇提早返回？
'''
hints = [
  "work 返回之後要有嘢喺做嘢嗰個 goroutine 上面呼叫 Done，而 go 語句需要一個呼叫。",
]

