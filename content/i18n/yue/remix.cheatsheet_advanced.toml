# REMIX LAND — CHEATSHEET ADVANCED, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/remix/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks and identifiers are copied
# verbatim.

pack   = "remix.cheatsheet_advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet_advanced.01.handoff-go"
title = "交過嚟"
story = "06:50，渣甸坊。Mei 問部 kiosk 攞一個數，而部 kiosk 連整都未整就等佢嚟攞。"
brief = '''
喺 **Go**，`main` 有 `ch := make(chan int)` —— **冇 buffer** —— 之後會做
`x := <-ch`。`compute()` 回傳一個 `int`。放喺嗰兩行之間，邊一行可以將
`compute()` 嘅結果送入 `x`，而 `main` 唔會 deadlock？
'''
hints = [
  "冇 buffer 嘅 send 會 block 到有人 receive 為止。個 sender 一定要係同 receiver 唔同嘅 goroutine。",
]

