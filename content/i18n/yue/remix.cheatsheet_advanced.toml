}
```

兩個 goroutine 每個呼叫 `Inc` 1000 次。邊一行令 `c.n` 每次行都啱啱好係 2000，
喺 `go test -race` 之下乾淨，而且永遠唔會留住個 mutex 唔放？
'''
hints = [
  "個遞增本身一定要喺揸住個鎖嗰陣發生，而個 unlock 一定要排喺個 method 返回嗰陣。",
]

