[[quest]]
id    = "remix.cheatsheet_advanced.04.counter-go"
title = "一次一個"
story = "Lucky Mac Bo 師傅個落單計數器：兩個廚師，每人一千下，而個板一定要寫住啱啱好兩千。"
brief = '''
