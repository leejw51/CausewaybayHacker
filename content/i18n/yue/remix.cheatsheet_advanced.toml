'''
hints = [
  "lock 會畀一個 Result；入面係一個 guard，而做算術之前一定要先 deref 個 guard。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.cheatsheet_advanced.06.counter-python"
title = "一次一個，GIL 話嘅"
story = "7-32 室用四條 thread 數夜更飛；GIL 對 `+=` 乜都冇承諾過。"
brief = '''
喺 **Python**，`lock = threading.Lock()` 係每條 thread 共用嘅唯一一個鎖，
而 `n = 0` 係 global：

```
def work():
    global n
    for _ in range(100_000):
        # ____
            n += 1
```

四條 thread 行 `work`。邊一行令 `n` 每次行都啱啱好係 400000 ——
每條 thread 喺**同一個**鎖上面輪流？
'''
hints = [
  "個 lock 物件本身就係一個 context manager；acquire() 回傳嘅嘢唔係。",
]

