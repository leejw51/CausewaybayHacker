# GO LAND — VERY BASIC, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/go/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, the quiz choices, sample input and output and the exact strings
# a program must print are the English pack's and are copied verbatim, never
# translated.


pack   = "go.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.verybasic.01.print"
title = "第一行"
story = "天后，06:00，閘門升起一半。售票機個螢幕本應打招呼，但印咗一行空白。"
brief = '''
一個講一句嘢嘅程式需要 `fmt` 嘅一個呼叫：印出參數並結束嗰行嘅嗰個。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  
output: hello, causewaybay
```
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — 字串用雙引號，細楷，一個逗號。",
  "冇 fmt 嘅 print 寫去 stderr，而冇 ln 嘅 Print 唔會結束嗰行。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.verybasic.02.int-types"
title = "闊數"
story = "天后個八達通讀卡機用 int32 數拍卡，全日總數塞唔落。"
brief = '''
`n` 係 `int32`。乘以四十億之前要先轉去更闊嘅型別：將 `n` 轉做 `int64`，然後先乘。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7
output: 28000000000
```
'''
hints = [
  "wide := int64(n) * 4000000000 — 先轉型，再喺闊型別入面乘。",
  "n * 4000000000 係喺 int32 入面計，個常數塞唔落，所以編譯唔到。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.verybasic.03.floats"
title = "小數車費"
story = "牌上嘅車費係文字。讀卡機要先變做 float64 先可以雙倍佢。"
brief = '''
`s` 係字串形式嘅車費。`strconv` 用一個呼叫將佢變做 `float64`，回傳個數字同一個 error；留低個數字，掉咗個 error。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  0.1
output: 0.100000000
        0.20
```
'''
hints = [
  "x, _ := strconv.ParseFloat(s, 64) — 兩個結果，64 係你想要嘅闊度。",
  "用 32 嘅話個值會先四捨五入做 float32；第九個小數位睇得出。",
]

