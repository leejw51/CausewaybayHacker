[[quest]]
id    = "go.verybasic.27.binary-tree"
title = "NULLPTR"
story = "Lucky Mac 前面個收銀機 11:55 將每張單按號碼入一棵樹，左邊嗰枝入咗之後就掉咗。"
brief = '''
`insert` 將 `v` 放入以 `n` 為根嘅子樹，並回傳嗰棵子樹嘅根。`if` 分支處理較細嘅 `v`：遞迴入左子節點，並將回傳嘅嘢存返去。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.Left = insert(n.Left, v) — 遞迴呼叫回傳子樹嘅根，所以要指定返去。",
  "淨係 insert(n.Left, v) 會將新節點掉咗；冇嘢存住佢。",
