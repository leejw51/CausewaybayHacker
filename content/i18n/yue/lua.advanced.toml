[[quest]]
id    = "lua.advanced.06.sets"
title = "兩檔都有嘅"
story = "兩個燈籠檔，安庶庇街兩邊一邊一個，有個客想知兩邊有咩都買到，唔使過兩次火龍條路。"
brief = '''
兩行標準輸入，每行係一個檔口嘅貨品，用空格分隔。一個檔口可能將同一樣嘢列兩次；只計一次。

印三行：

1. `BOTH`，後面跟兩張清單都有嘅所有嘢，排好，用空格分隔 — 或者冇嘅話就
   `BOTH -`
2. `ONLY_A <k>`：有幾多樣嘢喺第一張清單但唔喺第二張
3. `ALL <k>`：兩張清單總共有幾多樣唔同嘅嘢

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua 冇 set 型別。set 係一個 table，佢嘅**key** 係成員，值係 `true`：寫兩次 `tofu` 就係將同一個 key 寫兩次，重複嘅一入去就消失。成員資格係 `a[x]`，係 `true` 或者 `nil`。交集、差集同聯集係三個 loop，行過一個 set 嘅 key 再問另一個 — 寫做 function，三行就係三個呼叫。

`#` 唔會數 set 嘅 key；佢數嘅係 list 部分，而嗰部分係空嘅。用 `pairs` 行 loop 嚟數，印之前將成員排好放入一張 list，因為 `pairs` 冇次序。
'''
hints = [
  "每個 token 都 set[word] = true 就砌好個 set；重複嘅 tofu 係同一個 key 寫兩次。",
  "交集係行 pairs(a)，留低 b[key] 係 true 嘅 key。差集留低係 nil 嘅。聯集將兩個 set 嘅 key 寫入同一個 table。",
  "淨係得字串 key 嘅 table，#set 係 0。用 pairs 將啲 key 抄落一張 list，table.sort 佢，#list 就係個數，table.concat(list, \" \") 就係嗰行。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.advanced.07.functions"
title = "每斤"
story = "浣紗街每張價錢牌除非另外寫明，否則都係每斤計，而香燭檔部價錢牌打印機堅持次次都要人話佢知。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 行 `<NAME> <CENTS>` 或者 `<NAME> <CENTS> <UNIT>`。

寫 `tag(name, cents, unit)`，回傳 `<NAME> $<dollars>/<unit>`，兩個小數位，冇 `unit` 就即係 `catty`，每行印一張牌。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua 冇預設參數。caller 冇傳嘅參數係 `nil`，而 starter 嘅 `tag` 將佢駁埋：`attempt to concatenate local 'unit' (a nil value)`。慣用寫法係 function 嘅第一行 — `unit = unit or "catty"` — 因為 `or` 會回傳佢左邊，除非嗰個係 `nil` 或者 `false`。呢個就係 Lua 成套預設參數機制，而佢同 `def` 嗰行一樣，都係 function 契約嘅一部分。

將嗰行切做一張 token list，轉好 cents 之後用 `tag(unpack(parts))` 將啲部分交過去。`unpack` 將一張 list 攤開做參數，所以兩個元素同三個元素嘅 list 都啱同一個簽名。
'''
hints = [
  "tag 第一行寫 unit = unit or \"catty\"。成個修正就係咁。",
  "`x or default` 就係 Lua 嘅預設參數。佢有一個值會失敗：如果 caller 特登傳 false，佢都會換走，呢個就係跟進問題。",
  "tag(unpack(parts)) 將張 list 攤開；得兩部分嘅話第三個參數係 nil，由 or 補返。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.advanced.08.exceptions"
title = "唔係數嘅嗰行"
story = "沙田柚檔個磅印出一列重量，中間夾住某人嘅電話號碼。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 行。每行應該係一個整數。

每行印個值乘二，或者 parse 唔到就印 `BAD <line>`。最後印 `SUM <total>`，total 係你印過嘅值嘅總和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")` 靜靜雞係 `nil`；`tonumber("1.5")` 係 `1.5`，唔係整數；而 starter 嘅 `double` 兩樣都用 `error` 拋出。`error` 係 Lua function 拒絕嘅方法 — 冇 `Result`，function 本身都唔會畀 `(value, ok)` — 而預期收到數字嘅 caller 要用 `pcall` 講明佢點處理：佢幫你呼叫個 function，回傳 `true, result` 或者 `false, message`，而唔係由個錯誤一路爬上去。

`pcall` 淨係包住嗰個會失敗嘅呼叫。包住成個 loop body 會連你自己 `print` 嘅打錯字都吞埋，程式就係咁學識靜靜雞失敗。
'''
hints = [
  "starter 喺 xx 死咗，印 main.lua:3: not an integer: xx。pcall 唔會 crash，而係將呢個訊息當第二個結果交畀你。",
  "local ok, value = pcall(double, line) — pcall 分開收個 function 同佢嘅參數；pcall(double(line)) 會先呼叫 double，喺 pcall 行之前已經 crash。",
  "ok 係 false 嘅時候，value 就係個訊息。印 BAD 然後繼續；壞嗰行乜都唔加落總數。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.advanced.09.comprehensions"
title = "行一次浣紗街"
story = "Alex 話你可以用三個 for loop 做。條巷得一條龍咁闊，香已經點咗；你得行一次。"
brief = '''
標準輸入係一行整數，用空格分隔。

印三行：

1. 雙數值嘅總和（冇就 `0`）
2. 每個大過 `10` 嘅值，乘二，照次序，用單個空格駁埋 —
   冇嘅話就 `-`
3. 有幾多個唔同嘅值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua 冇 comprehension；最接近嘅係一個由 table 砌 table 嘅 function，而呢個節點就係教呢樣。`filter(list, keep)` 同 `map(list, f)` 各寫一次 — 每個都係一個填一個新 table 嘅 loop — 三行就變成呼叫：`sum(filter(nums, even))`、`map(filter(nums, big), double)`，同埋由啲值砌出嚟再數嘅一個 set。判斷式同轉換都係當參數傳入去嘅 function，即係 comprehension 入面嘅 `if` 同 expression。

`table.concat` 收數字亦收字串，所以第二行唔使轉換；但張 list 係空嘅時候就要個 `-`，因為 `table.concat({}, " ")` 係空字串。
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end) 留低雙數；佢嘅總和就係第一行。",
  "map(filter(nums, big), double) — 先 filter，再轉換，同 comprehension 後面嘅 if 同前面嘅 expression 一樣。",
  "set 係用啲值做 key 嘅 table；#set 唔會數 key，pairs loop 先會。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.advanced.10.dict-comprehensions"
title = "同一次行，有 key"
story = "香燭檔啲價錢寫喺一張張紅紙碎上面，按寫嘅次序擺。姨姨要佢哋變做一塊板，仲要兩次。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 行 `<ITEM> <PRICE>`。`PRICE` 係整數仙。每樣貨最多出現一次，`n` 最少係 `1` — 永遠有一樣最平嘅貨可以講。

印三行：

1. 每樣價錢**嚴格大過 100** 嘅貨，寫做 `ITEM=PRICE`，按貨名排，
   用單個空格駁埋 — 冇嘅話就 `-`
2. 每樣貨，佢嘅價錢**用整數除法除二**，同樣格式，
   按貨名排
3. `CHEAPEST <item>` — 最低價錢，打和就按貨名由細到大

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

上一個節點嘅有 key 版本。Lua 冇 dict comprehension；最接近嘅係 `filter_pairs(t, keep)` 同 `map_values(t, f)`，每個都係一個 `pairs` loop，用同樣嘅 key 填一個新 table。第一行留低值大過 100 嘅對；第二行用 `math.floor(v / 2)` 轉換每個值，保留每個 key。兩個都唔係 comprehension，兩個都係一個 function，寫一次。

`pairs` 冇次序，所以 `sorted_keys(t)` — 啲 key 放入一張 list，排好 — 係第三個 helper，每行印出嚟嘅都要經佢。搵最平嗰個，就行過排好嘅 key，只喺價錢嚴格更低嗰陣先換：因為啲 key 係按字母次序嚟，同價嘅第一個就係打和嘅答案。
'''
hints = [
  "keep(key, value) 係 true 嗰陣 filter_pairs 就留低個 key；map_values 喺每個 key 寫 f(value)。兩個都填一個新 table — 永遠唔好寫入你行緊嗰個。",
  "想用固定次序印一個有 key 嘅 table，sorted_keys(t) 係唯一方法。呢度每行都要經佢，包埋最平嗰行。",
  "行過排好嘅 key，淨係價錢嚴格更低先換最好嗰個：同價嘅第一個係字母最前嘅，所以打和自己搞掂。",
]

