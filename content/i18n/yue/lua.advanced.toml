[[quest]]
id    = "lua.advanced.11.protocol"
title = "佢淨係要識畫自己"
story = "維園燈籠指南列出檔口同櫃位，由兩個唔同嘅程式砌，而塊板淨係想知佢哋每個都識畫自己。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 行，每行係以下其中一樣

* `STALL <NAME> <AISLE>` — 畫做 `<NAME> / A<AISLE>`
* `COUNTER <NUMBER>` — 畫做 `COUNTER <NUMBER>`

將一個 protocol `Sign` 宣告做一張 method 名 list — `{ "render" }` — 同埋 `implements(object, protocol)`，物件喺每個名度都有一個 function 就係真。將 `Stall` 同 `Counter` 寫做普通 class — **完全唔提 `Sign`** — 再寫一個 function `show(sign)` 印出畫出嚟嘅嘢。印每個 sign，然後用 `implements(x, Sign)` 數嘅 `SIGNS <n>`，然後用 `is_a(x, Stall)` 數嘅 `STALLS <k>`，佢比較 metatable。

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

protocol 係一個**結構**型別：class 有啲 method 就滿足佢，唔使聲明。Lua 冇名稱呼呢樣，因為佢係 Lua 唯一有嘅型別。個檢查係喺 run time 按名查找，而且一定要係**同呼叫一樣嘅查找**：`object[name]`，經 `__index` 去到啲 method 所在嘅 class。starter 用 `rawget` 檢查，佢淨係睇 instance 本身，喺邊個上面都搵唔到 `render`，就報 `SIGNS 0`。

`show` 喺 run time 經嗰個查找 dispatch — `sign:render()` 搵到 metatable 鏈上面嘅任何 `render`。冇 static dispatch 可以揀；Lua 得一個機制，就係呢個。
'''
hints = [
  "用 object[name] 代替 rawget(object, name)。成個修正就係咁：rawget 跳過 metatable，而啲 method 喺 __index 後面嘅 class 度。",
  "Stall 同 Counter 邊度都冇提 Sign。佢哋有 render() 就滿足佢；呢個就係結構嘅意思。",
  "implements 檢查嘅係個名度有冇 function，唔係佢幾多個參數或者回傳乜。Lua 從來唔會檢查呢啲；呼叫嗰陣先知。",
]

