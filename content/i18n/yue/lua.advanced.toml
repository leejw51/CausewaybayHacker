將 `1..n` 分做 `k` 段連續嘅 chunk — chunk `i` 係 `floor(n*i/k) + 1` 到 `floor(n*(i+1)/k)`，包埋兩頭 — 每段交畀佢自己嘅 **coroutine**，計佢範圍嘅平方和：一個普通 loop，唔用 library 呼叫，每 100 000 個數 yield 一次，等其他有得行。每個跑腿將結果一口氣、中間冇 yield 咁加落**一個共用總數**，同時記錄喺佢自己嗰格。輪流推動佢哋直至全部死晒。按 index 次序每段印 `CHUNK <i> <sum>`，然後 `TOTAL <sum>`，然後 `THREADS <k>` — coroutine 嘅型別名係 `thread`，嗰個就係個數。

