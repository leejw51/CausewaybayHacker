3. `BIN <value>` — 用一個收 base 嘅 parser 嘅 `partial` parse `bits`，
   base 綁做 `2`
4. `MISSES <m>` — `fib.misses`，個遞迴真正行咗 body 幾多次

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` 最多係 `400`，對 LuaJIT 嘅 stack 嚟講唔算乜。冇 cache 嘅話，`fib(35)` 大約三千萬次呼叫，`fib(90)` 行唔完。有 cache 嘅話，每個 `fib(i)` 行一次，`MISSES` 係 `n + 1`。`memoize` 就係「包住咗」嗰條題目嘅 wrapper，closure 入面加個 cache：一個呼叫得嘅 table，所以 `fib.misses` 係一個欄位，而 `fib = memoize(function ... end)` 令入面嘅遞迴都經個 cache。starter 嘅 `fib` 係普通 function，佢最後一行死喺 `fib.misses`。

`fib(90)` 同 `20!` 都過咗 2^53，而 Lua 數字係 double：過咗嗰度，啲位會靜靜雞唔見。starter 帶住 `big`，一個以 base-10^7 limb list 表示嘅數字，有 `add`、`mul_small` 同 `tostring`；`fib` 加 big，乘積就將一個 big 乘一個細數字。`partial` 將一個 function 前面啲參數凍結，畀你一個新 function；`reduce` 將一個兩參數 function 摺過一個 iterator。兩個都唔聰明。兩個都會被問。
'''
hints = [
