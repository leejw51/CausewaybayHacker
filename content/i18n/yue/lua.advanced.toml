每個 iterator 都係 lazy 嘅：`accumulate` 每拉一次 yield 一個累計總和，`groupby` yield 個值同佢嗰串（一張 list），所以 `#run` 就係長度。要 `table.concat` 嗰陣就將 iterator 收埋做一張 list；淨係要知幾多就用 loop 數。
