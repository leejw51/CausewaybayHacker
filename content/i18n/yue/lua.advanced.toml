寫一個 class `Tickets`，**人手實作 iterator protocol**：`next` 回傳下一個值，派晒 `count` 個值就回傳 `nil`，而 `iter` 回傳 generic `for` 需要嘅嘢。每個值自己一行印出，然後印 `SUM <total>`，用第二個 `Tickets` 交畀 `sum` 計出嚟。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

呢個就係 `coroutine.wrap` 幫你寫嘅嘢。generic `for` 收三樣嘢 — 一個 function `f`、一個 state `s` 同一個控制值 — 每轉之前呼叫 `f(s, control)`，第一個結果係 `nil` 就停。`Tickets.next` 已經係呢個形狀：佢嘅 `self` 就係 state，第二個參數係一個佢可以唔理嘅控制值。所以 `iter` 係一行：`return Tickets.next, self`。`sum`、`collect` 同 `for` 全部跳同一隻舞，冇一個理個 state 係乜。

starter 有 `next` 冇 `iter`，而個 `for` 話 `attempt to call method 'iter' (a nil value)`。喺呢度，由 `next` 嚟嘅 `nil` 就係 `StopIteration`；所以一張飛永遠唔可以係 `nil`，而 `0` 係一張冇問題嘅飛 — `0` 唔係 `nil`。

`iter` 將 `self` 當 state 回傳，係 **iterator** 嘅標誌：佢只可以行一次，之後就用完。**container** 每次都由 `iter` 回傳一個新 state，可以行好多次；呢條路早啲嘅 `Bag` 就係一個。講明你寫緊邊種；分別喺有人第二次 loop 嗰陣先會現形。
'''
