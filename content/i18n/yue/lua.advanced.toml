大 case 嘅總和會過 2^53，而 Lua 數字係 double：過咗嗰點 `+` 會捨入。每個總和用兩個 limb 帶住 — 一個細過 10^9 嘅低位部分，同一個係其餘嘅高位部分 — 用 `%d%09d` 印。

大嗰樣嘢就係大佬，而佢唔係一個你修得好嘅 bug。用 `k = 4` 同 `n = 4000000` 行佢並計時，然後用 `k = 1` 行。兩次用同樣時間。然後刪咗 loop 入面個 yield 再行：同樣輸出，同樣時間，冇錯誤。coroutine 一直佔住場地，直至佢講 `yield`；一個從來唔講嘅跑腿會一路行到尾，其他三個就等，而冇嘢話你知，因為冇其他嘢需要個場地。呢個就係條龍停喺一節度，鼓仲打緊。四個 coroutine 喺四個核心上面輪流計平方和，喺一個核心上面，再加切換嘅成本。LuaJIT 冇 thread。coroutine 係一個停低嘅位，唔係第二個核心；佢哋係**輪流**行，喺每個跑腿自己話可以停嘅地方。平行工作係第二個 process — `io.popen` — 或者 LÖVE client 嘅 `love.thread`，佢係一個獨立、乜都唔共用、經 channel 溝通嘅 Lua state。

