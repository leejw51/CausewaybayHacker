  "reduce(big.mul_small, range(1, k), big.from(1)) — 第三個參數係起始值，就係佢令空 range 畀 1。",
  "partial(parse, 2) 回傳一個自己提供 base、收文字嘅 function。unpack(bound, 1, count) 將綁定咗嘅參數放前面；select(\"#\", ...) 就算其中一個係 nil 都數得到。",
