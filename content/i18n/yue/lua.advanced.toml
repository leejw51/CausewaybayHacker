[[quest]]
id    = "lua.advanced.04.thread-pool"
title = "八個搬運工"
story = "蓮花街嗰頭有四十箱香，八個搬運工。冇人想要四十個搬運工；佢哋想要嗰八個永遠唔會企定。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

行一個有 `w` 個搬運工嘅 **pool**：同一時間最多 `w` 個 coroutine 喺度行，每個搬一份工，途中 yield 一次，然後回傳 `(index, value * value)`。啲工**做完**嗰陣收集結果，按 index 排，每行印一個 `<index> <value>`，然後 `WORKERS <w>`。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

coroutine 唔係結果。`coroutine.resume(co)` 回傳 `true`，然後係份工 yield 或者 return 嘅嘢 — 個值淨係由呢度門出嚟，而道門喺令份工做完嗰次 resume 先開，即係 pool 碰巧係邊一轉。starter 收集嘅係做完嘅 coroutine 本身 — `thread: 0x...` 嘅值 — 而 sort 試圖對其中一個做 index。

將 index 帶喺結果入面，先令每次行嘅輸出都一樣；按佢排係答案嘅最後一行，唔係第一行。個 pool 就係錢櫃嗰條題目嘅 scheduler 加個上限：補到 `w` 個喺度行，每個畀一轉，將死咗嘅退休，重複到啲工同行緊嘅都空晒。
'''
hints = [
  "starter 死喺 sort 或者 print：attempt to index local 'a' (a thread value)。coroutine 係份工，唔係佢嘅答案。",
  "local ok, index, value = coroutine.resume(co) — 喺將份工行到 return 嗰次 resume，回傳嘅值跟喺 ok 後面。status 係 dead 嗰陣留住 { index, value }。",
  "pool 用自己嘅次序做完啲工，而結果入面嘅 index 係每份工由邊度嚟嘅唯一記錄。印之前按佢排。",
]

