```

Lua 冇 `itertools`；module 係一個 function table，而 `tools` 就係一個寫喺檔案頂、唔係用 `require` 載入嘅 module。佢三個 function 已經喺度 — 嗰格冇人開過嘅工具 — 每個都回傳一個 coroutine iterator，所以可以直接放入 `for`。

