寫 `opened(stall, body)` — 一個將個 block 當 function 收嘅 function — 入去嗰陣印 `OPEN <STALL>`，行 `body`，出嚟嗰陣印 `SHUT <STALL>`，**無論 body 有冇拋出錯誤**。喺 body 入面 parse cents 再加落總數。cents parse 唔到嘅行，喺捲閘落咗之後報告做 `BAD <STALL>`。最後印 `TOTAL <sum>` 同 `REJECTED <k>`。

