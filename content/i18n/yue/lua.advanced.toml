  "tools.accumulate(nums) 每個元素之後 yield 累計總數；收埋做一張 list 畀 table.concat。",
  "for value, run in tools.groupby(nums) do — run 係嗰串成員嘅 list，#run 係佢嘅長度。",
  "tools.combinations(distinct, 2) 每對無序嘅 yield 一次。數佢哋係 n*(n-1)/2，人手 check 一次就知你個 n 啱唔啱。",
