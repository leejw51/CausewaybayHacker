[[quest]]
id    = "lua.advanced.11.sorting"
title = "排名榜"
story = "火龍會每晚釘出最平嘅香，蓮花宮嘅文員用兩張 list 同一支鉛筆人手排啲檔口。"
brief = '''
兩行標準輸入：第一行係檔口名，第二行係佢哋以仙計嘅價錢，次序一樣。最少有一個檔口。

