[[quest]]
id    = "lua.advanced.06.async-queue"
title = "邊個話做完"
story = "三個跑腿清理緊維園燈籠閘口嘅飛隊，執事等個 queue 話佢空咗。佢從來冇講，因為冇人話佢知一張飛搞掂咗。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

將 `{ index, value }` 工作放入一個會數未做完嘅 queue。開 `w` 個 consumer coroutine，每個永遠 loop：攞一份工，將 `value * 10` 寫入 `results[index]`，再呼叫 `task_done`。主 function 行 `join` — 嗰個 resume 啲 consumer 直至每個 `put` 都有佢嘅 `task_done` 嘅 scheduler — 然後取消啲 consumer，再按 index 次序印結果同 `CONSUMERS <w>`。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

未做完嘅數係 `0` 嗰陣 `join` 先返，而淨係 `task_done` 會減佢。starter 啲 consumer 從來冇呼叫佢，所以每份工都處理咗，個數仍然寫住 `4`，每個 consumer 都停喺空 queue 嘅 `get` 度，冇嘢剩低可以改變任何嘢。一個冇偵測嘅 loop 會喺嗰度轉，直至 runner 殺咗個程式。呢個會偵測：成個一輪冇一個 consumer 減過個數就係 deadlock，而 `join` 用 `error` 講出嚟。同窗口嗰條題目一樣嘅 hang，唔同嘅寫法 — 而修正又係一行，喺 consumer 嗰邊。

consumer 係 `while true` loop。佢哋結束係因為 main 喺 join 之後取消佢哋，而呢度取消即係**帶住一個訊號 resume**：queue 空嘅時候 `get` 會 yield，而叫醒佢嗰次 resume 傳入 `"cancel"` 嘅話，`get` 回傳 `nil`，consumer 就 return。停喺一個 yield 度嘅 coroutine，係由佢醒嚟收到嘅值令佢停嘅。
'''
hints = [
  "每份工處理完就 task_done(queue)。join 淨係將 put 同 task_done 對數，其他乜都唔理。",
  "coroutine.create 乜都冇排程；consumer 喺 join 第一次 resume 佢嗰陣先行，而發現 queue 係空嘅 consumer 會喺 get 入面 yield \"idle\"。",
  "用 \"cancel\" 叫醒嘅 consumer 由 get 收到 nil 就 return，結束個 while true。乜都唔帶咁 resume 佢只會令佢再停低。",
]

