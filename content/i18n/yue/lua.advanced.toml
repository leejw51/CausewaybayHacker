[[quest]]
id    = "lua.advanced.10.functools"
title = "記住你計過嘅嘢"
story = "香燭檔喺火龍經過之前，用同樣兩個數由頭計同一晚嘅價錢一萬一千次，次次都由零開始。"
brief = '''
標準輸入係 `n k bits`：兩個整數同一串二進位數字。

印四行：

1. `FIB <fib(n)>` — 由一個**遞迴**嘅 `fib` 嚟，用 `memoize` 包住
2. `PRODUCT <k!>` — 對 `1..k` 用乘法 `reduce`，帶一個初始值，
