Lua 冇 `with` 亦冇 `finally`；最接近嘅係一個將 body 當 closure 收嘅 function，再喺個呼叫外面包 `pcall`。`pcall` 之前嘅所有嘢係入，之後嘅係出，而出嗰部分兩條路都會行，因為 `pcall` 將個錯誤變做回傳值，而唔係由佢爬過 `SHUT`。starter 冇包就呼叫 `body()`，`WONG` 個捲閘永遠都唔會閂。

捲閘落咗之後，個錯誤再向上拋：`error(err, 0)` 重新拋出佢 — 個 `0` 令 `error` 唔會喺訊息前面多加一個位置 — caller 自己嘅 `pcall` 見到佢就印 `BAD`。唔好喺 `opened` 度吞咗佢：caller 想知。
'''
hints = [
  "local ok, err = pcall(body)，然後 print(SHUT)，然後 if not ok then error(err, 0) end。個 pcall 就係 finally。",
  "個錯誤穿過 opened 出去 main 嘅 pcall，所以 main 嘅 BAD 照樣印 — 喺 SHUT 之後，因為 SHUT 喺重新拋出之前已經印咗。",
