# LUA LAND — ADVANCED, in Cantonese. A translation pack (SPEC §12.1): the
# prose of `content/lua/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "lua.advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.advanced.01.conversions"
title = "三個樣，一個名"
story = "浣紗街嘅香燭檔將個價錢寫做文字、數字同埋蚊，喺同一本簿，用同一個名。"
brief = '''
讀一行：一個以仙計嘅金額，全部係數字。

印三行：

1. 剪走空白之後嘅文字有幾多個字元
2. 個金額當數字
3. 個金額以蚊計，啱啱好兩個小數位

```
input:  1234
output: 4
        1234
        12.34
```

金額唔會係負數。用**一個名**做，重新綁三次 — 一個字串，然後一個數字，然後又係一個字串。Lua 嘅 local 乜都裝得落，一 assign 就轉主意；代價就係除咗讀上面嗰行，冇嘢話到你知 `cents` 而家係乜。

計蚊唔好經除法。`1234 / 100` 今日係 `12.34`，而 `0.1 + 0.2` 印出嚟係 `0.3`，比較嗰陣就唔係。`math.floor` 同 `%` 會準確噉畀你兩半，`string.format("%02d", ...)` 幫第二半補位。`tonumber` 係轉換；`#cents` 係個字串仲係字串嗰陣嘅長度。
'''
hints = [
  "cents 仲係字串嗰陣嘅 #cents 就係第一行。",
  "cents = tonumber(cents) 唔係原地轉換；佢係一個新值綁落舊個名度。之後個字串就冇咗。",
  "string.format 入面嘅 %02d 係闊度二、補零、十進位。5 仙係 0.05，唔係 0.5。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.advanced.02.control-flow"
title = "邊條巷"
story = "啲巷號用粉筆寫咗喺路面，畀火龍行嘅路線用，蓮花宮嗰度執事塊板應該講每條巷有啲乜。佢次次都淨係講個號碼，仲要由零開始。"
brief = '''
讀一個整數 `n`。對由 `1` 到 `n` 嘅每個 `i`，印一行：

* `i` 同時除得盡 3 同 5 就印 `FISHVEG`
* `i` 除得盡 3 就印 `FISH`
* `i` 除得盡 5 就印 `VEG`
* 否則印 `i` 本身

然後繼續讀整數，每行一個，直到讀到 `0`，再印 `SKIPPED <k>`，即係一路上讀咗幾多行唔係零嘅。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

兩個 loop，兩種。第一個喺開始之前已經知要行幾多次：`for i = 1, n do`。第二個唔知：`while true do` 加 `break`，因為次數由你讀到啲乜決定。Lua 嘅數字 `for` 兩頭都係**包埋**嘅 — `for i = 1, n` 行 `n` 次 — 而 starter 由 `0` 開始，呢個就係呢片地個名由來嗰個差一。
'''
hints = [
  "先檢查兩樣都得嘅情況，唔係佢永遠唔會中。除得盡 3 同 5 即係除得盡 15。",
  "for i = 0, n - 1 早一個開始，早一個停。starter 就係有呢個 bug；佢輸出第一行係 FISHVEG，因為 0 乜都除得盡。",
  "while true do ... break 係 Lua 寫出口喺中間嘅 loop 嘅方法。仲有 repeat ... until，喺底測試。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.advanced.03.lists"
title = "條龍嘅中間"
story = "六十七米長嘅禾草擔喺一行舞龍人膊頭上，龍頭嗰度嘅執事睇到第一個同最後一個，中間乜都睇唔到。"
brief = '''
標準輸入第一行係個數 `n`，第二行係 `n` 個整數，用空格分隔。`n` 最少係 `1`，所以永遠有第一個同最後一個值可以印。

印三行：第一個值、最後一個值，同埋佢哋兩個之間（唔包兩頭）所有嘢嘅總和。少過三個值嘅話，個總和係 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Lua 嘅 list 係一個 key 係 `1..n` 嘅 table，`#nums` 係 `n`。第一個元素係 `nums[1]`；最後一個係 `nums[#nums]`。冇 `nums[-1]` 呢回事 — 負數 key 只係一個冇儲過嘢嘅 key，讀佢會靜靜雞畀你 `nil` — 亦都冇 slice：中間就係一個由 `2` 到 `#nums - 1` 嘅 loop，冇中間嘅時候佢行零次，所以其他語言要寫嘅防守喺呢度係免費嘅。

starter 印 `nums[0]`。喺 Lua 呢個唔係錯誤。佢係 `nil`，`print` 會寫個字 `nil`，而程式以 0 結束。呢片地就係因呢樣嘢而得名。
'''
hints = [
  "nums[#nums] 係最後一個元素；nums[#nums - 1] 係佢前面嗰個。負數乜都唔得。",
  "for i = 2, #nums - 1 係除咗第一同最後嘅所有嘢，得一個值嘅時候就係 for i = 2, 0，自己就行零次。",
  "io.read(\"*a\") 一次過讀晒，gmatch(\"%S+\") 行過每個 token，咁換行就唔再重要。第一個 token 係個數；跳過佢。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.advanced.04.strings"
title = "位元組唔係字"
story = "維園燈籠檔張訂貨單喺三個位元組度切斷 銅鑼灣，印出一個字同一個問號。"
brief = '''
讀一行。印三行：

1. 佢以 UTF-8 編碼嘅長度，以**位元組**計
2. 佢以**字元**計嘅長度
3. 將佢啲字元倒轉之後嘅嗰行

```
input:  causeway
output: 8
        8
        yawesuac
```

嗰行可能有 ASCII 以外嘅字元，噉頭兩個數就唔一樣。Lua 字串係一串**位元組**，其他乜都唔知：`#s` 係位元組數，`s:reverse()` 倒轉位元組，會將每個多位元組字元切開兩半。字元係你自己定義嘅嘢。UTF-8 入面一個字元係一個開頭位元組，後面跟任意數量嘅延續位元組 — 寫做 pattern 係 `[^\128-\191][\128-\191]*` — 所以數開頭位元組就係字元數，用 `gmatch` 行過啲字元再疊起佢哋就係倒轉。

starter 印兩次位元組數，嗰行就原樣印。唔好用 `line:reverse()` 嚟整第三行：喺 `causeway` 上面佢啱，但喺大家真係會打嘅範例上面，佢印出嚟嘅位元組喺任何編碼都唔係一個字串。
'''
hints = [
  "#line 係位元組。字元要數：gsub 第二個結果係 match 咗幾多次，每個字元一個 match 就係字元數。",
  "延續位元組係 128..191（10xxxxxx）。一個字元係一個唔係嗰種嘅位元組，後面跟零個或者多個係嗰種嘅：\"[^\\128-\\191][\\128-\\191]*\"。",
  "table.insert(reversed, 1, ch) 推喺最前，所以最後一個字元會排第一。table.concat 冇分隔符咁駁埋。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.advanced.05.dicts"
title = "條巷嗌乜"
story = "九點嘅浣紗街：每個檔口都喺度嗌嘢，書館街嗰頭塊板要個排名。"
brief = '''
讀晒成個標準輸入，按空白切開。

每個唔同嘅字印一次，寫做 `<word> <count>`，按次數由多到少排，打和就按個字由細到大。

```
input:  tram tram bus
output: tram 2
        bus 1
```

用字做 key 嘅 table 就係計數器，而 `counts[word] + 1` 第一次會出錯 — `attempt to perform arithmetic on a nil value` — 因為冇人寫過嘅 key 係 `nil`。`(counts[word] or 0) + 1` 補返個零。

`pairs` 行過啲 key 嘅時候**完全冇次序**，而且每次行都唔同。將啲 key 抄落一張 list，用一個講明次數由多到少、再按字由細到大嘅比較器 `table.sort` 佢，由張 list 印。第一個參數排先嘅話，比較器就回傳 `true`。
'''
hints = [
  "starter 喺第一個字就死：counts[word] + 1 未寫先讀，而冇嘢可以讀。(counts[word] or 0) 補返個零。",
  "用 pairs 將啲 key 收埋做一張 list，然後 table.sort 張 list。個 table 本身冇次序可以整。",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — 次數由多到少，然後字由細到大，相等嘅參數永遠唔好畀 true。",
]

