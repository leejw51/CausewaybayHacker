[[quest]]
id    = "lua.advanced.05.asyncio"
title = "async 到底喺邊度行"
story = "阿美寫咗四年 async code，從來未見過推動佢嘅嗰樣嘢。今晚個 loop 係一個佢讀得明嘅 while loop，條巷每個跑腿都輪流喺上面行。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 個整數。

寫 `double(value)`，令佢 yield 畀 scheduler 一次 — `coroutine.yield()` — 然後回傳個值乘二。每個值整一個 coroutine，用 `gather` 行晒佢哋，按輸入次序印每個結果，然後 `SUM <total>` 同 `TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)` 唔會行 `f`。佢砌一個 **coroutine 物件**交返畀你，入面乜都唔會發生，直至有嘢 resume 佢。starter 嘅 `run` 回傳三個，冇 resume 過，輸出係三行 `thread: 0x...`，跟住係 `attempt to perform arithmetic on a thread value`。

`gather` 就係 event loop，而呢度由你寫：一個行過啲 task 嘅 `while`，按次序 resume 每個未死嘅，一輪又一輪，直到一個都唔剩，將每個 task 嘅**回傳值**儲喺嗰個 task 嘅格入面。結果按你傳入 task 嘅次序出嚟，唔理佢哋用咩次序做完。呢個就係揀佢而唔揀一個將一個 task resume 到死先掂下一個嘅 loop 嘅全部原因：嗰個 loop 啱而且係順序嘅，`gather` 啱而且係交錯嘅。

呢度得一條 thread。`coroutine.yield()` 係一個 task 將條 thread 交返畀個 loop、等另一個用嘅位。冇嘢係平行行嘅；啲嘢係**輪流**行，喺佢哋自己話可以停嘅地方。
'''
hints = [
  "return gather(tasks)，唔係 return tasks — 而 gather 就係你寫嘅 loop：resume 每個未死嘅 task，一次又一次，直至全部死晒。",
  "令一個 task 死嗰次 resume，佢第二個回傳值就係個 task 嘅 return。儲喺個 task 自己嘅 index；就係咁令結果保持輸入次序。",
  "如果你要一做完就攞結果，嗰個就係上一條題目嘅 pool，噉你就要自己帶住個 index。",
]

