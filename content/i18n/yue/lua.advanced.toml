id    = "lua.advanced.03.queue"
title = "邊個閂窗口"
story = "安庶庇街嘅餃子檔將每張單經個窗口遞入廚房，最後一張之後，櫃面就企喺度等一張永遠唔會嚟嘅下一張。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 個整數。

一個 producer coroutine 將每個值乘十推入一個 queue，每推一個就 yield，然後推一個 **sentinel**。主 loop 由 queue 攞嘢，直至見到 sentinel，每個值都印，同時記住總數，然後印 `SUM <total>` 同 `CLOSED`。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

queue 係一個有頭有尾嘅 table，而 table 冇 `close`。佢上面冇嘢可以話畀 consumer 知冇嘢嚟喇；呢樣要係一件貨。而件貨唔可以係 `nil`，因為 table 入面嘅 `nil` 就係冇嘢。sentinel 係一個獨立嘅值 — `local CLOSED = {}`，一個冇其他人攞住嘅 table — 而 `value == CLOSED` 淨係對嗰一個 table 係真，因為 table 嘅 `==` 係比身份。

starter 從來冇推佢。`take` resume 廚房直到 queue 有嘢，廚房死咗而 queue 又係空嘅時候，佢就放棄，回傳 `nil`；個 loop 印出個字 `nil`，然後將佢加落總數，死咗。喺有 blocking queue 嘅語言，呢個會係一個 hang。喺 Lua 佢係一個被跟住行落去嘅 `nil`。

producer 推 sentinel。永遠唔係 consumer — 知道條流完咗嗰邊，就係結束佢嗰邊。
'''
hints = [
  "一行，喺廚房個 function 最尾：push(hatch, CLOSED)。",
  "consumer 已經檢查 value == CLOSED。佢一直等緊 producer 從來冇送嘅嘢，結果收到 nil。",
  "sentinel 係一個新 table，因為 nil 儲唔入 table，亦因為 table 淨係同自己相等。就算啲值都可以係 table，sentinel 仍然安全：冇其他人會有呢一個。",
]

