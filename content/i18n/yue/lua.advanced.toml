'''
hints = [
  "resume 先回傳 ok，值喺後面。更好嘅做法：畀 work 一個 index 同一格去寫，同一個共用總數去加，由 scheduler resume 到死；噉就乜都唔使由 resume 出嚟。",
  "resume 晒全部，一輪又一輪，然後先印。喺跑腿入面印會交錯；喺 loop 之後由啲格印，就唔會。",
  "兩個 limb：lo 細過 10^9，每次加都將進位搬去 hi。41666791666750000 係 hi 41666791 同 lo 666750000，用 %d%09d 印。",
