[[quest]]
id    = "lua.advanced.16.timeouts"
title = "唔等喇"
story = "執事塊板 ping 條巷每個檔口問等候時間，而部讀卡機壞咗嗰個檔口永遠唔答，所以塊板永遠唔會重畫。"
brief = '''
標準輸入係一個數 `n`，然後 `n` 行 `<STALL> <SECONDS>`，即時答嘅檔口 `SECONDS` 係 `0`，唔夠時間答嘅係 `1`。

呢度嘅時間係 **tick**：十分之一秒係一次 `coroutine.yield()`，而 `fetch(stall, seconds)` 每秒 yield 十次，然後回傳 `<STALL> OK`。對每個檔口，將佢嘅 `fetch` 當 coroutine 喺 `wait_for(task, 2)` 下面行 — 兩個 tick 嘅期限，0.2 秒 — 按輸入次序印 `<STALL> OK` 或者 `<STALL> TIMEOUT`。然後開一個永遠 loop 嘅 `watch()` coroutine，畀佢一轉，**用 `"cancel"` resume 佢**嚟取消佢，等佢由 handler 印 `CANCELLED`，由每條路都會行嘅 code 印 `CLEANUP`。最後印 `TIMEOUTS <k>`。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` 最多 resume 個 task `ticks` 次，再報告佢有冇做完；最後一轉之後仍然係 `suspended` 嘅話，就係 timeout，個 task 就咁永遠唔再被 resume。starter 反而將 `fetch` resume 到尾，所以 `WONG` 用晒十個 tick 然後話 `OK`。

取消一個 coroutine，就係將一個值送去佢停住嗰個 yield。`watch` 喺一個 `pcall` 入面 yield，yield 回傳 `"cancel"` 嗰陣就拋出；`pcall` 接住 — 就係印 `CANCELLED` 嗰個 handler — 然後 cleanup 嗰行行，然後個錯誤再拋出，所以送 cancel 嗰次 resume 會收返 `false, "cancelled"`。starter 整咗個 watcher，畀佢一轉，就丟低佢：冇人再 resume 嘅 coroutine 永遠乜都唔行，兩行都唔會印。處理完之後重新拋出 — 吞咗個 cancel，就係一個 task 變成取消唔到嘅原因。
'''
hints = [
  "wait_for(task, 2)：最多 resume 兩次，task 死咗就回傳 true 同結果，否則 false。timeout 咗嘅 task 就咁永遠唔再被 resume。",
  "coroutine.resume(watcher, \"cancel\") — 個字串就係 watcher 個 yield 回傳嘅嘢，佢自己嘅 code 將佢變做錯誤。將個變數設做 nil 乜都冇取消；只係唔記得咗個 coroutine。",
  "create 之後第一次 resume 畀 watcher 一轉開始、停喺 yield 度，所以個 cancel 有個 yield 落腳，而唔係落喺一個未開始嘅 function。",
