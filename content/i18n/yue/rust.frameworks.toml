story = "怡和街三部卡機過數入告士打道寫字樓同一個窗口，而冇嘢話畀個窗口知佢哋已經收工返屋企。夜批到朝早六點仲喺度等。"
brief = '''
第一行係 `<PRODUCERS>`，`1 <= PRODUCERS <= 8`。之後每一行係一張付款單，
`<CARD> <CENTS>`。第 `i` 張單（由 0 開始數，只數單）屬於第 `i % PRODUCERS`
個 producer。一張單唔係啱啱好兩個欄位，或者仙數唔係 `i64`，就係一張壞單：
個 producer 跳過佢，乜都唔送。

每個 producer 係一條 thread，將佢嘅好單逐張一個訊息，送落**一條**
`crossbeam::channel::bounded(4)` channel。一個 consumer —— main thread —— 用
`for msg in rx` 讀條 channel，直到每個 sender 都冇咗，然後印：

* `MESSAGES <n>` —— 收到嘅訊息數
* `TOTAL <sum of cents>`
* `LARGEST <CARD> <CENTS>` —— 最大嗰一張單；打和就攞較細嘅卡 id（字串次序）。
  冇訊息嘅話，`LARGEST -`。

```
input:  3
        K1 1200
        K2 350
        K3 oops
        K4 1200
        K5 90
output: MESSAGES 4
        TOTAL 2840
        LARGEST K1 1200
```

`for msg in rx` 淨係會喺**最後**一個 `Sender` drop 咗嗰陣先完。每個 producer
攞一個 `tx.clone()`，啲 thread 做完佢哋就 drop —— 但係原裝嗰個 `tx` 仲坐喺
`main` 度，所以個迴圈永遠唔完，成次行就係一個 timeout。開始讀之前 drop 佢。
個 starter 冇。
'''
hints = [
  "`use crossbeam::channel::bounded;` —— `bounded(4)` 畀你 `(Sender, Receiver)`；`Sender` 係 `Clone`，而 `Receiver` 係一個 iterator，條 channel 閂咗佢就完。",
  "一條 channel 係喺*每一個* `Sender` 都 drop 咗嗰陣先閂。數一數：每個 producer 一個 clone，加上 `bounded` 交畀你嗰個，`main` 坐喺 `for slip in rx` 嗰陣仲擁有住佢。",
  "consumer 唔可以喺 producer spawn 之前行（佢哋要啲 clone），而原裝嗰個一定要喺 consumer 開始之前冇咗：spawn，然後 `drop(tx);`，然後個迴圈。",
  "`drop(tx);` 就擺喺 `for p in 0..producers` 迴圈之後，喺 `thread::scope` 嘅 closure 入面。其他乜都唔使改。",
]

