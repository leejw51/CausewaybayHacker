id    = "rust.frameworks.22.log-trait"
title = "樓面聽到乜"
story = "告士打道個結算服務係用一堆 if 後面一個光禿禿嘅 print 去 log。有人為咗波斯富街嗰次上線將佢較做 warn，於是啲 error 唔再出現，而啲 debug 行照樣一直嚟。"
brief = '''
第一行係一個 level 字，大細楷都得：`off`、`error`、`warn`、`info`、`debug`
或者 `trace`。其他任何字就印 `unknown level <word>`，其他乜都唔印。之後每一行
係 `<ACCOUNT> <AMOUNT>`。

行每一行，由 1 開始編號，經 `log` crate 嘅 macro 去 log，每個都帶明確嘅
target：

* `trace!(target: "io", "read {raw:?}")` —— 原始嗰行，`Debug` 引號
* `error!(target: "settle", "line {n}: not a number: {amount}")` 當金額唔係
  `i64`；該行跳過
* `info!(target: "settle", "line {n}: {account} {cents}")`
* `warn!(target: "settle", "line {n}: large amount {cents}")` 當
  `cents > 100000`，喺 `info!` 之後
* `debug!(target: "settle", "total so far {total}")` 加完之後

然後，無論 level 係乜，`println!("TOTAL {total}")`。

一條記錄印去**標準輸出**，格式係 `[LEVEL] target: message`，而且淨係喺佢嘅
level 等於或高於所揀嘅 level 嗰陣先印 —— `error` 係最頂，`trace` 係最底，
`off` 除咗總數乜都唔印。

```
input:  info
        A 100
        B 250000
        C 7x
        D 1
output: [INFO] settle: line 1: A 100
        [INFO] settle: line 2: B 250000
        [WARN] settle: line 2: large amount 250000
        [ERROR] settle: line 3: not a number: 7x
        [INFO] settle: line 4: D 1
        TOTAL 250101
```

為一個 unit struct 實現 `log::Log` —— `enabled` 將記錄嘅 level 同
`log::max_level()` 比較，`log` 喺 enabled 嗰陣印，`flush` flush stdout —— 放
一個入 `static LOGGER`，`log::set_logger(&LOGGER)`，然後 `log::set_max_level`，
個字 parse 做 `LevelFilter`。個 starter 有自己嘅 level 表，而且比較嘅方向
倒轉咗。
'''
hints = [
  "`use log::{Log, Metadata, Record, LevelFilter};` —— `impl Log for YourStruct` 係三個 method：`enabled`、`log`、`flush`。`\"warn\".parse::<LevelFilter>()` 讀個字，大細楷都得。",
  "`static LOGGER: StdoutLogger = StdoutLogger; log::set_logger(&LOGGER).unwrap(); log::set_max_level(level);` —— `set_logger` 想要一個 `&'static dyn Log`，呢個就係點解佢係一個 `static`，唔係 `let`。",
  "`Level` 嘅排序係 `Error < Warn < Info < Debug < Trace`，所以一條記錄喺 `record.level() <= log::max_level()` 嗰陣先係要嘅。啲 macro 喺叫你之前已經 check 咗 `max_level()`。",
  "`println!(\"[{}] {}: {}\", record.level(), record.target(), record.args())` —— `Level` 顯示做 `ERROR`、`WARN`……；你喺每個 macro 傳入嘅 `target:` 就係 `record.target()` 返回嘅嘢。",
]

