id    = "rust.frameworks.20.tokio-timeout-select"
title = "一秒，然後話唔得"
story = "時代廣場 Lucky Mac 部卡機等收單機構，收單機構用幾耐佢就等幾耐。一個慢嘅下晝變咗拍一下卡三秒，條隊排到去扶手電梯。"
