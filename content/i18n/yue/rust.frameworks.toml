[[quest]]
id    = "rust.frameworks.17.crossbeam-select-timeout"
title = "三百毫秒"
story = "告士打道 gateway 後面有一間發卡機構 11:52 開始冇反應。崇光啲卡機顯示 PLEASE WAIT 顯示到兩點，因為個 gateway 都一樣喺度等。"
brief = '''
標準輸入係零行或以上嘅 `<CARD> <MS>`，最多二十行：一個卡 id，同埋該卡嘅
發卡機構要幾耐先答，以毫秒計。`MS` 要麼係**最多 3**（一間正常嘅發卡機構），
要麼係**至少 3000**（一間唔正常嘅）；每次行最多三行係慢嗰種。

跟次序處理啲卡。每張卡起一條 worker thread，瞓 `MS` 毫秒然後將卡 id 經一條
channel 送返嚟。**最多等 300 ms** 攞答案：答案到咗就印 `<CARD> APPROVED`，
冇到就印 `<CARD> TIMEOUT`，然後即刻去下一張卡。最後一張卡之後印
`APPROVED <a> TIMEOUT <t>`。

```
input:  V1 0
        V2 3000
        V3 2
output: V1 APPROVED
        V2 TIMEOUT
        V3 APPROVED
        APPROVED 2 TIMEOUT 1
```

個等待係一個 `crossbeam::channel::select!`，對住兩個 receiver：worker 嗰個，
同埋 `after(Duration::from_millis(300))`，一條時間到就送一個訊息嘅 channel。
**每張卡畀佢自己一條** `bounded(1)` channel，咁一間慢嘅發卡機構遲三秒先到
嘅答案就唔會俾人當係下一張卡嘅。worker 用 `let _ = tx.send(..)` 送：到嗰陣
可能已經冇人聽，而咁係冇問題嘅。用 `std::thread::spawn` 開 worker，而且永遠
唔要 join 佢哋 —— `main` 返回就結束成個 process，連瞓住嘅 worker 一齊。個
starter 係用冇 timeout 嘅 `rx.recv()`，等足三秒，然後批准張卡。
'''
hints = [
  "`use crossbeam::channel::{after, bounded, select};` —— `after(d)` 係一個 `Receiver<Instant>`，由而家起計 `d` 之後會收到啱啱好一個訊息。佢係一條同其他一樣嘅 channel，所以 `select!` 等得到佢。",
  "`select!` 食 `recv(rx) -> msg => { .. }` 呢種 arm，邊個 receiver 先 ready 就行邊個。worker 嘅 receiver 放一個 arm，`after` 嘅 receiver 放另一個。",
  "`recv(rx) -> answer` 畀你一個 `Result`：由 worker 嚟就係 `Ok(card)`。timeout 嗰個 arm 嘅訊息係一個你唔需要嘅 `Instant`：`recv(after(Duration::from_millis(300))) -> _ => { .. }`。",
  "`select! { recv(rx) -> answer => { approved += 1; println!(\"{} APPROVED\", answer.unwrap()); } recv(after(Duration::from_millis(300))) -> _ => { timed_out += 1; println!(\"{card} TIMEOUT\"); } }`",
]

