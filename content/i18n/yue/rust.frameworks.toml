input:  7 fast fast
        8 slow fast
        9 slow slow
output: DONE 7 primary 259
        DONE 8 backup 296
        TIMEOUT 9
```

`timeout(dur, fut).await` 係 `Ok(value)` 或者 `Err(Elapsed)`；係 `Err` 嗰陣
入面個 future 已經 drop 咗，連 sleep 一齊 —— 嗰 3 s 永遠唔會等足。個 starter
淨係 await primary，冇 timeout，而且從來唔問 backup。
