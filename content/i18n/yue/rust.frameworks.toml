hints = [
  "`use tokio::time::{sleep, timeout};` —— `timeout(Duration::from_secs(1), fut).await` 畀你 `Result<T, Elapsed>`，而 drop 入面個 future 就係取消佢嘅方法。",
  "`tokio::select! { a = fut_a => ..., b = fut_b => ... }` 兩個都 poll，邊個先完就行邊個 arm；另一個 future 當場就 drop。",
  "將個 `select!` 放入一個 `async fn authorise(...) -> (&'static str, u64)`，然後將*佢*包入 timeout，咁一個死線就蓋住兩間收單機構。",
  "`match timeout(..).await { Ok((who, code)) => println!(\"DONE {id} {who} {code}\"), Err(_) => println!(\"TIMEOUT {id}\") }`。",
