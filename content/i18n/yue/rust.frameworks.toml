[[quest]]
id    = "rust.frameworks.23.the-settlement"
title = "結算"
story = "17:30，告士打道側邊嘅付款通道。當日嘅轉賬以一個 JSON 檔案到達，銀行 18:00 之前要一個戶口一行，而今晚出去嗰份檔案，就係核數師三月會讀嗰份。"
brief = '''
標準輸入係一個 JSON object：`"date"`（字串，`YYYY-MM-DD`）同 `"transfers"`，
一個 `{"from", "to", "cents"}` 嘅 array。

印出結算：

```
input:  {"date": "2026-10-06", "transfers": [
          {"from": "LUCKYMAC", "to": "BANK", "cents": 3800},
          {"from": "SOGO", "to": "BANK", "cents": 12500},
          {"from": "BANK", "to": "LUCKYMAC", "cents": 300}]}
output: SETTLEMENT Tue 06 Oct 2026
        BANK 16000
        LUCKYMAC -3500
        SOGO -12500
        MOVED 3
```

第一行係日期，格式 `%a %d %b %Y`。然後每一個喺任何地方出現過嘅戶口印一行，
**按名排序**，附上佢嘅淨額：收到嘅全部減去畀出嘅全部。然後印
`MOVED <number of transfers>`。

或者印一行 `ERROR:`，其他乜都唔印，按呢個次序 check：

* 輸入根本唔係呢個形狀 —— `ERROR: not a settlement`
* 日期 parse 唔到 —— `ERROR: bad date 2026-13-01`
* 然後跟次序每一筆轉賬，由 1 開始數 —— `cents` 係零或者負數就
  `ERROR: transfer 2: nothing to move`，`from` 等於 `to` 就
