# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.frameworks.01.anyhow-context"
title = "一個問號"
story = "返到付款通道嘅第一個朝早。告士打道側邊個結算讀檔程式喺一個四千行嘅檔案第 3 行死咗，淨係講句 'invalid digit found in string'。"
brief = '''
由標準輸入讀入一行行嘅 `<ACCOUNT> <CENTS>`，印出以仙為單位嘅總數，格式係
`TOTAL <n>`。

如果有一行唔係啱啱好兩個欄位，或者個仙數 parse 唔到做 `i64`，就改為印一行，
然後正常退出：

```
ERROR: line 3: invalid digit found in string
```

呢個就係 `anyhow` 自己對一個帶一層 context 嘅錯誤嘅寫法：`format!("{:#}", err)`
會印出個 context、一個冒號，再印個原因。個 context 係 `line <n>`（由 1 開始數）。
出錯嘅情況下，其他嘢一樣都唔印。

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

做正事嘅 function 用 `anyhow::Result` 做返回型，用 `?` 傳遞錯誤，用
`.with_context(|| ...)` 講明係邊一行。個 starter 係 unwrap 然後 panic，印一大段
stack trace 再以 101 退出 —— 樓面冇人會睇得明嗰啲嘢。
'''
hints = [
  "`use anyhow::{Context, Result};` —— `Result<T>` 即係 `Result<T, anyhow::Error>`，而 `?` 會將任何 `std::error::Error` 轉做佢。",
  "`.with_context(|| format!(\"line {n}\"))` 對 `Result` *同埋* `Option` 都用得（個 `Option` 會變成一個帶住呢句訊息嘅錯誤）。喺 `?` 之前掛上去。",
  "對 `anyhow::Error` 用 `{:#}` 會喺一行印出 `context: cause`；淨係用 `{}` 就只印最外層嘅 context。",
  "少咗一個欄位係 `None`，唔係 parse 錯誤：用 `.ok_or_else(|| anyhow!(\"missing amount\"))` 將佢變做錯誤，再畀佢同一個 `line n` context。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.frameworks.02.thiserror-enum"
title = "有名有姓嘅錯誤"
story = "轉賬服務每一次拒絕都答同一句 'bad transfer'，而樓上兩層個客服部已經開始打電話問工程師到底係邊一種。"
brief = '''
兩個戶口 `A` 同 `B`，開頭嘅結餘喺第一行。然後第二行係 `n`，再然後係 `n` 筆
轉賬 `<FROM> <TO> <CENTS>`。

跟次序套用佢哋。每一筆印 `OK <FROM> <TO> <CENTS>`，或者印個錯誤 —— 而啲錯誤
係一個有三個 variant 嘅 `thiserror` enum，佢嘅 `Display` 要啱啱好係：

* `unknown account X` —— `FROM` 或者 `TO` 唔係 `A` 或 `B`（先 check `FROM`）
* `insufficient funds in A: need 300, have 100`
* `nothing to move` —— 金額係零或者負數

轉賬做完之後印 `A <balance>` 同 `B <balance>`。

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

用 `#[derive(Debug, thiserror::Error)]` 定義個 enum，每句訊息放入佢嘅
`#[error("...")]` attribute，欄位用插值 —— tuple variant 用 `{0}`，有名欄位用
`{need}`。`transfer` 返回 `Result<(), TransferError>`，而 `main` 用 `{}` 印。
個 starter 已經有晒邏輯，不過乜都印 `bad transfer`。
'''
hints = [
  "enum 上面 `#[derive(Debug, thiserror::Error)]`，每個 variant 上面 `#[error(\"...\")]`，呢個就係成個 `impl Display` 加 `impl std::error::Error`。",
  "attribute 入面嘅 `{0}` 係 tuple variant 嘅第一個欄位；`{need}` 同 `{have}` 係 struct variant 嘅有名欄位。",
  "先 check 兩個戶口名，再 check 金額，而 `FROM` 又要先過 `TO`：隱藏嘅例子會送 `C B 0` 入嚟，而個任務講明咗邊個錯誤贏。",
  "個簽名改做 `Result<(), TransferError>`；`main` 入面 `println!(\"{e}\")` 就會印出 attribute 嘅文字。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.frameworks.03.serde-derive"
title = "線上嘅形狀"
story = "怡和街啲卡機用 JSON 送柯打過嚟。舊個讀檔程式係靠數逗號搵金額，所以一間名入面有逗號嘅商戶一直俾人入錯咗欄。"
brief = '''
標準輸入係一個 JSON array，入面係一個個柯打。每個柯打係一個 object，有
`"id"`（數字）、`"merchant"`（字串）同 `"cents"`（數字）。

每個柯打印一行，跟佢哋嚟嘅次序，`<id> <merchant> <cents>`，然後印
`TOTAL <sum of cents>`。

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

定義一個有呢三個欄位嘅 `struct Order`，幫佢 `#[derive(Deserialize)]`，然後交畀
`serde_json::from_str::<Vec<Order>>` 去讀。個 starter 係用逗號切。object 嘅
key 可以係任何次序、任何數量嘅空白，而一個字串入面可以有逗號 —— 呢個正正
係重點。
'''
hints = [
  "`use serde::Deserialize;` 同埋 struct 上面 `#[derive(Deserialize)]` —— 欄位名就係 JSON 嘅 key，而型就講明每個必須係乜。",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` —— 左邊個型就係話畀 serde 知要砌乜嘢。",
  "key 嘅次序同空白係 JSON 嘅事，唔係你嘅事；serde 讀得任何有呢三個 key 嘅 object。印嘢嗰個迴圈同之前一樣。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.frameworks.04.serde-attributes"
title = "銀行讀嘅嘢"
story = "銀行一個禮拜彈返怡和街個結算檔案兩次：每一張從未授權過嘅卡都以 `\"authCode\":null` 送出去，而唯一一部唔報手續費嘅卡機，仲未寫到個檔案就已經令個讀檔程式停低。"
brief = '''
標準輸入係一個 JSON array，入面係卡機送嚟嘅結算記錄。每一條記錄有
`"terminalId"`（字串）、`"merchant"`（字串）、`"amountCents"`（數字），而
`"feeCents"`（數字）同 `"authCode"`（字串）可能有、可能冇。key 可以係任何次序。

每條記錄印一行，跟輸入次序：將條記錄寫成銀行想要嘅樣，用
`serde_json::to_string` 出嚟嘅緊湊 JSON，key 跟呢個次序、串法要一模一樣 ——
`terminalId`、`merchant`、`amountCents`、`feeCents`、`authCode`。冇 `feeCents`
就寫做 `0`；冇 `authCode` 就**索性唔寫**，永遠唔准寫做 `null`。然後印
`NET <sum of amountCents minus feeCents>`。

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

一個 struct 做晒兩個方向：`#[derive(Serialize, Deserialize)]` 加 snake_case
欄位，struct 上面 `#[serde(rename_all = "camelCase")]`，`fee_cents` 上面
`#[serde(default)]`，而 `auth_code: Option<String>` 配
`#[serde(skip_serializing_if = "Option::is_none")]`。`to_string` 會跟 struct
聲明欄位嘅次序寫，所以輸出係準確嘅。個 starter 逐個欄位手動改名，讀唔到冇
手續費嘅記錄，而且寫 `null`。
'''
hints = [
  "`use serde::{Deserialize, Serialize};` —— 一個 struct，兩個 derive。struct 上面嘅 `#[serde(rename_all = \"camelCase\")]` 取代咗每個欄位各自嘅 `rename`。",
  "`fee_cents: i64` 上面嘅 `#[serde(default)]` 會用 `i64::default()` 即係 `0` 填返冇咗嘅 key。冇呢句，一條冇手續費嘅記錄就係一個 deserialize 錯誤。",
  "一個 `Option<String>` 本身已經會將冇咗嘅 key 讀做 `None`；需要 `#[serde(skip_serializing_if = \"Option::is_none\")]` 嘅係*寫*嗰邊，唔係佢就會 serialize 做 `null`。",
  "`serde_json::to_string(record)` 畀你跟 struct 欄位次序嘅緊湊 JSON；`println!` 佢，一條記錄一行。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.frameworks.05.json-value-walk"
title = "每塊葉一行"
story = "波斯富街一間新嘅卡機供應商送嚟一個層層嵌套嘅 object，冇人幫佢寫過 struct，而客服部想今日就睇到入面有乜，唔係等 struct 寫完先。"
brief = '''
標準輸入係一個 JSON 文件，最頂層係一個 object 或者一個 array。將每一個葉值
印做 `<path> = <value>`，一行一個。

* object 嘅 key 以**排序後嘅次序**走訪（key 嘅 byte 次序 —— 即係
  `serde_json::Value::Object` iterate 嘅次序）；array 嘅元素按索引次序。
* 個 path 係啲 key 用 `.` 駁埋，array 索引就用 `[i]`：`terminal.id`、
  `orders[0].cents`，root array 裏面嘅 array 就係 `[1][0]`。key 入面唔會有點
  或者方括號。
* 字串印出嚟唔帶引號。數字、`true`、`false` 同 `null` 就照 JSON 嘅寫法印
  （`1.5` 保持 `1.5`，`null` 就係 `null` 呢個字）。
* 空嘅 object 或者空嘅 array 冇葉，乜都唔印。

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

用 `serde_json::from_str::<serde_json::Value>` 去 parse，然後寫一個遞歸嘅
`walk(path: &str, value: &Value)`，match `Value::Object`、`Value::Array` 同
其餘嘅。個 starter 淨係行最頂層，見到乜就印乜，所以一個嵌套嘅 object 會出成
一行 JSON，而 root 係 array 就直接 panic。
'''
hints = [
  "`use serde_json::Value;` 同 `let doc: Value = serde_json::from_str(&input)?;` —— `Value` 係一個 enum：`Null`、`Bool`、`Number`、`String`、`Array(Vec<Value>)`、`Object(Map<String, Value>)`。",
  "遞歸帶住個 path：`fn walk(path: &str, value: &Value)`。object 嘅話，`for (key, child) in map` 已經係排好序嘅 key 次序；array 嘅話，`iter().enumerate()` 畀你個索引。",
  "個 path 每層長一截：`format!(\"{path}.{key}\")`，除非 `path` 係空（嗰陣就淨係個 key），而索引就係 `format!(\"{path}[{i}]\")`。",
  "`Value::String(s) => println!(\"{path} = {s}\")` 將字串淨色印出嚟；`other => println!(\"{path} = {other}\")` 用 `Value` 自己嘅 `Display`，即係緊湊 JSON —— `null`、`true`、`1.5`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.frameworks.06.toml-config"
title = "服務檔"
story = "告士打道個結算服務係靠人手索引佢個 config table，而第二個 `[[upstream]]` 蓋咗第一個；由禮拜二開始每一筆結算都去咗 fallback。"
brief = '''
標準輸入係一個 TOML 格式嘅服務 config：

* 最頂層：`name`（字串，必須有）、`port`（整數，預設 `8080`）
* table `[limits]`（必須有）：`max_cents`（整數，必須有）、`retries`（整數，
  預設 `3`）
* array of tables `[[upstream]]`，零個或以上，每個有 `name` 同 `url`（字串，
  必須有）同埋 `timeout_ms`（整數，預設 `1000`）

印出摘要 —— 一行 `SERVICE`、一行 `LIMIT`，然後每個 table 一行 `UPSTREAM`，
跟檔案次序：

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

如果輸入唔係合法嘅 TOML，或者唔係呢個形狀（少咗必須有嘅 key、值嘅型唔對），
就淨係印一行 `ERROR: config rejected`，一個字都唔准多，然後正常退出。唔准印
toml 自己嘅訊息。

用 struct 描述個形狀 —— `Config`、`Limits`、`Upstream` —— 每個都
`#[derive(Deserialize)]`，預設值用 `#[serde(default)]` 或者
`#[serde(default = "fn_name")]`，然後用 `toml::from_str::<Config>(&input)` 讀，
對個 `Result` 做 match。個 starter 係讀一個 `toml::Table` 然後索引入去，檔案
齊全就得，其他一切情況都 panic。
'''
hints = [
  "`use serde::Deserialize;` —— toml 同 serde_json 一樣係一種 serde 格式，所以 `toml::from_str::<Config>(&input)` 砌出嚟嘅係同一種 derive 出嚟嘅 struct。一個 `[table]` 係一個 struct 欄位；`[[array_of_tables]]` 係一個 `Vec<Struct>` 欄位。",
  "唔係個型本身 `Default` 嘅預設值就係一個 function：`#[serde(default = \"default_port\")]` 配 `fn default_port() -> u16 { 8080 }`。`Vec` 上面淨係寫 `#[serde(default)]`，就令冇寫 `[[upstream]]` 變成一個空 list。",
  "`toml::from_str` 返回 `Result<Config, toml::de::Error>`；少咗必須有嘅 key、型唔對、語法錯誤，全部都落入 `Err`。對佢 match 然後印你自己嗰行 —— 千萬唔要 `{}` 個錯誤。",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.frameworks.07.clap-derive"
title = "一行 flag"
story = "結算機上面個 ops 工具食 `--limit`，而告士打道枱面有人打咗 `--limti 50`；個工具當咗佢係批次名，然後對全部批次行晒。"
brief = '''
`settle` 係一個命令行工具，有：

* 一個必須有嘅位置參數 `BATCH`（字串）
* `--limit <N>`，無符號整數，預設 `100`
* `--dry-run`，一個 flag

harness 唔會傳任何參數，所以命令行係由標準輸入嚟：每一個非空行係一條命令行，
用空白切開（工具自己個名唔喺行上面）。每條印一行：

* 成功嗰陣，`batch=<BATCH> limit=<N> dry-run=<true|false>`
* 失敗嗰陣，`ERROR: ` 加 clap 嘅 `ErrorKind` 嘅 `Debug` 形式 ——
  `ERROR: MissingRequiredArgument`、`ERROR: ValueValidation`、
  `ERROR: UnknownArgument`、`ERROR: InvalidValue`（一個 option 後面冇值）

```
input:  2024-06-01 --limit 50
        --dry-run 2024-06-02
        2024-06-03 --limit ten
output: batch=2024-06-01 limit=50 dry-run=false
        batch=2024-06-02 limit=100 dry-run=true
        ERROR: ValueValidation
```

用一個 `#[derive(clap::Parser)]` 嘅 struct 聲明個介面 ——
`#[arg(long, default_value_t = 100)]`，同埋 `bool` 上面 `#[arg(long)]` ——
然後每一行用 `Cli::try_parse_from(std::iter::once("settle").chain(words))`
去 parse。`Err(e)` 帶住 `e.kind()`。option 可以喺位置參數之前或者之後，而
`--limit=7` 同 `--limit 7` 係一樣嘅。唔要送 `--help`。個 starter 係一個手寫
迴圈，乜都收。
'''
hints = [
  "`use clap::Parser;` 同 struct 上面 `#[derive(Parser)]`：一個淨色嘅欄位係位置參數，`#[arg(long)]` 整出 `--field-name`，而欄位嘅型就係值嘅 parser —— `u32` 會幫你拒絕 `ten`。",
  "`#[arg(long, default_value_t = 100)] limit: u32` 係以有型嘅值做預設；`#[arg(long)] dry_run: bool` 係一個 flag，有就有冇就冇，喺行上面串做 `--dry-run`。",
  "`Cli::parse()` 讀真正嘅 argv，而呢度佢係空嘅。`Cli::try_parse_from(iter)` 食任何一個字串 iterator，第一項係程式名：`std::iter::once(\"settle\").chain(line.split_whitespace())`。",
  "`Err(e) => println!(\"ERROR: {:?}\", e.kind())` —— `ErrorKind` 係一個普通 enum，佢嘅 `Debug` 就係 variant 個名。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.frameworks.08.clap-subcommands"
title = "三個動詞，一個工具"
story = "告士打道結算機上面個 ops 工具，`pay`、`refund` 同 `balance` 係由第一個字分出嚟嘅三個 if 分支；`refudn` 跌落最後嗰個分支，枱面應該見到拒絕嘅地方見到咗個結餘。"
brief = '''
`till` 係一個有三個子命令嘅命令行工具：

* `pay <TO> <CENTS>` —— `TO` 係字串，`CENTS` 係無符號整數；印
  `PAY <CENTS> to <TO>`
* `refund <ID> [--reason <WORD>]` —— 印 `REFUND <ID>`，有畀原因就印
  `REFUND <ID> because <WORD>`
* `balance [ACCOUNT]` —— `ACCOUNT` 預設係 `main`；印 `BALANCE <ACCOUNT>`

同之前一樣，harness 唔會傳參數：標準輸入每一個非空行係一條命令行，用空白
切開，冇工具個名。每條命令行印一行輸出。失敗嗰陣印 `ERROR: ` 加 clap 嘅
`ErrorKind` 嘅 `Debug` 形式：第一個字唔認得係 `ERROR: InvalidSubcommand`；
子命令少咗位置參數係 `ERROR: MissingRequiredArgument`；`CENTS` 唔係整數係
`ERROR: ValueValidation`；一個該子命令冇嘅 option 係 `ERROR: UnknownArgument`。

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

struct 上面用 `#[derive(Parser)]`，有一個欄位標住 `#[command(subcommand)]`，
佢嘅型係一個 `#[derive(Subcommand)]` 嘅 enum；每個 variant 嘅欄位就係嗰個
子命令嘅參數，variant 個名變細楷就係行上面嗰個字。struct 上面要擺
`#[command(disable_help_subcommand = true)]`，咁 `help` 就唔會變成第四個動詞。
唔要送 `--help`。個 starter 係 match 第一個字，然後索引其餘嘅。
'''
hints = [
  "`use clap::{Parser, Subcommand};` —— struct 得一個欄位 `#[command(subcommand)] command: Command`，而 `Command` 係一個 `#[derive(Subcommand)]` 嘅 enum。",
