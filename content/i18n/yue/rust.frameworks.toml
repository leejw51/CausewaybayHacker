標準輸入最多 8 行 `<ID> <PRIMARY> <BACKUP>`：一個非負整數同兩個字，每個係
`fast` 或者 `slow`。最多兩行係 `slow slow`。

每一下拍卡由兩間收單機構同時授權。每間延遲一段時間之後答返個 code
`id * 37 % 1000` —— 用 `tokio::time::sleep` 模擬個延遲：

* primary：`fast` 10 ms，`slow` 3 s
* backup：`fast` 100 ms，`slow` 3 s

邊個先答邊個贏：對兩個 future 做 `tokio::select!`。成場比賽包喺一個**一秒**
嘅 `tokio::time::timeout` 入面。逐行跟次序處理，每行印：

* `DONE <id> primary <code>` 或者 `DONE <id> backup <code>` —— 邊個贏
