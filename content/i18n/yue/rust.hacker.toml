[[quest]]
id    = "rust.hacker.06.stack"
title = "下一個大啲嘅"
story = "白板上面一列車費，得一條問題：每個之後，第一個比佢大嘅係邊個。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數。

對每個項目，印出佢**右邊**第一個嚴格大過佢嘅項目，冇就印 `-1`。全部放喺一行，用空格分隔。然後印 `NONE <k>`，即係有幾多個係 `-1`。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

用一個 stack 裝住仲未知答案嘅位置，由底向上佢會一直保持遞減。每個位置 push
一次、pop 一次，所以無論睇落點，成件事都係行一次。

呢度嘅 case 好細：佢哋 check 嘅係一串相等嘅值同全部遞減嘅一段，唔係你有幾快。一個大嘅隨機 case 都幫唔到手。由一個值去到下一個大啲嘅值，平均距離大約係 `ln n`，所以喺 200000 個隨機值上面由每個位置向右掃，內層總共行 210 萬步，六毫秒就完成——同個 stack 分唔出。令嗰個答案變平方嘅輸入係一個遞減嘅 list，而 generator 要特登砌嚟產生佢，唔會碰啱產生到。stack 仍然係答案，無論乜數據，每個位置一次 push、一次 pop；只不過話你知嘅唔係呢度個鐘。
'''
hints = [
  "個 stack 裝嘅係仲等緊答案嘅 index，唔係值。",
  "新值大過 stack 頂嗰個值嗰陣，嗰個 index 嘅答案就係新值——然後繼續 pop，佢可能大過好幾個。",
  "嚴格大過，所以相等嘅值唔會互相解決；佢哋疊埋一齊，之後一齊解決。",
]

