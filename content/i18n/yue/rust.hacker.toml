```

每個查詢計二項式係數 `C(a, b)` **模 1000000007**。印出全部 `q` 個答案嘅總和，本身都要模 `1000000007`，然後印 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

喺呢啲大細，`C(a, b)` 有幾十萬位數，所以永遠唔會先計出嚟再取模 — 每次乘法都
一路做一路取模。問題係除法：`a! / (b! (a-b)!)` 喺模算術入面冇意思。取代佢嘅係
**模反元素**，而因為 `1000000007` 係質數，費馬小定理就畀咗你：
`inverse(v) = v^(p-2) mod p`，用快速冪大約三十次平方就計到。

所以：一次過預先計好 `factorial[0..=n]`，每個查詢答
`f[a] * inv(f[b]) * inv(f[a-b])`。

**呢度嘅複雜度係強制嘅。**其中一個隱藏 case 係 `n = 200000`、`q = 200000`。每個係數獨立計——乘 `b` 項，除 `b` 項，每個一個模反元素——喺五秒執行時限之內完成唔到；嗰個就係 starter。一個共用嘅階乘表大約五十毫秒就完成。兩個都係喺呢部機量嘅。

每個中間值都係兩個細過 `2^30` 嘅值嘅乘積，所以 `i64` 裝得落，乜都唔會 overflow。喺 `int` 係 32 位嘅語言就唔得，而呢個就係呢條題目會被問嘅另一半原因。
'''
