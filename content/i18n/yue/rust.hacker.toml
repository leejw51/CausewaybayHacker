[[quest]]
id    = "rust.hacker.08.top-k"
title = "問得最多嘅五個"
story = "熱身輪。佢哋要去年張張 ticket 入面出現得最多嘅五個字，而且照樣計時。"
brief = '''
第一行係 `n k`。第二行係 `n` 個用空格分隔嘅字。

印出最常出現嘅 `k` 個字，最常嘅排先，打和就按字由細到大，一行一個。如果唔同嘅字少過 `k` 個，就全部印。然後印 `DISTINCT <d>`。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

用 hash map 數，然後排名。個打和規則唔係裝飾。`HashMap` 交出啲項目嘅次序係每個 process 隨機嘅，所以一個淨係睇數目嘅 comparator 會將數目一樣嘅字留喺個 map 碰啱產生嘅次序——同一個程式下一次行就印出另一個答案，而排序幾 *stable* 都救唔到你，因為排序嘅輸入本身已經係亂嘅。將個比較整成**全序**——數目由多到少，再按字由細到大——就係解決方法，亦都係面試官想聽嘅答案。

呢度嘅隱藏 case 好細：佢哋 check 嘅係打和規則同 `k` 大過唔同字數目嘅情況，完全唔理速度。輸入係字，而呢個正正係 generator 冇辦法產生得似樣嘅形狀——所以呢條題目守住嘅標準就係上面嗰個正確性標準，而佢係老老實實咁守，唔係靠個鐘。
'''
hints = [
  "行一次數，排一次序。唔好一路數一路維持個排名。",
  "b.1.cmp(&a.1) 係數目由多到少；.then(a.0.cmp(b.0)) 係按字由細到大嘅打和規則。",
  "唔夠 k 個嘅時候 take(k) 都安全——佢去到尾就停，唔會 panic。",
]

