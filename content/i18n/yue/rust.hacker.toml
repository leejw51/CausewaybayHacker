id    = "rust.hacker.07.coins"
title = "啱啱好嘅散紙"
story = "波斯富街個收銀機有三格硬幣，同一個唔肯收紙幣嘅客。"
brief = '''
第一行係 `n target`。第二行係 `n` 個硬幣面值。每種硬幣都有無限多個。

