[[quest]]
id    = "rust.hacker.12.heap"
title = "K 條排好嘅隊"
story = "每間 Lucky Mac 分店送嚟嘅單都已經排好次序。將佢哋合併做一行，唔好成堆再排一次。"
brief = '''
第一行係 `k`。然後 `k` 行，每行係一個數量，跟住咁多個已經由細到大排好嘅整數。

將佢哋全部合併做一行由細到大，用空格分隔，然後印 `POPS <total count>`。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`BinaryHeap` 係 **max**-heap。想當 min-heap 用，就 push `std::cmp::Reverse(x)`，出嚟嘅時候拆走個 `Reverse`——呢個就係成個 Rust 獨有嘅竅門，亦都係條題目 check 緊嘅嘢。

heap 每條 list 裝一個項目，唔係每個元素一個，所以無論啲 list 幾長，佢都保持 `k` 咁大。

呢度嘅 case 好細，個鐘亦都唔係量速度。heap 仍然係答案——每個元素都重新掃晒 `k` 個 head 係 `O(N·k)`，而真正嘅 `k` 係幾千——但呢四個 case 冇一個大到分得出兩者，而 `k` 路嘅輸入亦都唔係呢條路嘅 generator 會產生嘅形狀。
'''
hints = [
  "heap 項目要帶住個值由邊度嚟，唔係 pop 咗之後你補唔返。",
  "Reverse((value, which, at)) 先按 value 排，正正係你想要嘅。",
  "只係喺 pop 咗一條 list 嘅一個元素嗰陣，先 push 嗰條 list 嘅下一個元素——咁 heap 就保持喺 k。",
]

