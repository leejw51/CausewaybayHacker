[[quest]]
id    = "rust.hacker.03.intervals"
title = "更表"
story = "佢哋遞張 Lucky Mac 更表畀你，問你邊幾個鐘其實有人當值。"
brief = '''
第一行係 `n`。之後 `n` 行係 `<start> <end>`，`start <= end`。

將每對重疊或者掂到嘅合併，按遞增次序印出結果，每行一個 `<start> <end>`，然後印 `COUNT <k>`。

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

掂到都當重疊：`1 4` 同 `4 5` 合併做 `1 5`。
'''
hints = [
  "先按 start 排序。之後由左到右行一次就夠，而你永遠唔使向後望多過一個區間。",
  "新嘅 start <= 上一個合併咗嘅區間嘅 end，就延長佢；否則 push 一個新嘅。",
  "延長到 max(last.end, end) — 一個短區間被長區間包住，唔可以令佢縮短。",
]

