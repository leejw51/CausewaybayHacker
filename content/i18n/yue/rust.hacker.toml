# RUST LAND — HACKER, in Cantonese. A translation pack (SPEC §12.1):
# the prose of `content/rust/hacker.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "rust.hacker"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.hacker.01.two-sum"
title = "兩個車費"
story = "7-32 號房。第一條題目係個個都會攞到嗰條，一入門口個鐘就開始計。"
brief = '''
第一行係 `n target`。第二行係 `n` 個整數。

印出兩個唔同項目嘅**由 1 開始**嘅 index `i j`，佢哋加埋等於 `target`，寫做 `i j`，`i < j`。如果有多過一對得，就畀第二個 index 最細嗰對；仲係打和嘅話，就畀第一個 index 最細嗰對。冇一對得嘅話，印 `-1`。

```
input:  4 9
        2 7 11 15
output: 1 2
```

呢度嘅隱藏 case 好細：佢哋 check 嘅係打和規則同冇答案嘅情況，唔係你有幾快。條題目問嘅仍然係線性嗰個做法——行一次，一個 hash map——因為真正嘅 `n` 係 200000，而條題目存在就係為咗篩走個巢狀 loop。寫條題目真正想要嘅答案，唔好寫啱啱好過到呢四個 case 嗰個。
'''
hints = [
  "行一次。對每個值，問 target 減佢係咪已經見過。",
  "entry(x).or_insert(j) 會留住重複值嘅第一個 index——正正係題目要求嘅打和規則。",
  "一搵到就印然後 return——掃嗰陣第一個命中嘅，已經係第二個 index 最細嗰個。",
]

