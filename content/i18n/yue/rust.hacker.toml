[[quest]]
id    = "rust.hacker.02.window"
title = "冇重複"
story = "你未放低支白板筆，第二條題目已經喺白板上面。"
brief = '''
一行文字，冇空格。

印出入面冇重複字元嘅最長一段嘅長度，然後印嗰段本身。如果幾段打和，印最左邊嗰段。

```
input:  abcabcbb
output: 3
        abc
```

個窗口永遠只會向右移。如果你發現自己喺重複之後由頭再掃過，你就寫咗平方嗰個。

呢度嘅 case 好細，個鐘亦都唔係量速度——而大啲嘅 case 都量唔到。一個 generate 出嚟嘅字串捉唔到平方嗰個答案：喺 200000 個隨機字母入面，最長冇重複嘅一段得十九個字元，所以「喺每個位置重新開始，一路延長到撞到重複」每個起點大約行十九步，六毫秒就完成，同個 window 一樣。會懲罰平方版本嘅係有長段冇重複嘅文字，嗰個係特登刁難你嘅輸入，唔係隨機輸入。寫個 window，因為真正嘅輸入係特登刁難你嘅，唔係因為呢四個 case 堅持要你咁寫。
'''
hints = [
  "記住每個字元最後喺邊個 index 見過，同埋個 window 由邊個 index 開始。",
  "一個重複只係喺佢上一次嘅位置喺目前個 window 入面先有關係——即係 `previous >= start` 嗰個測試。",
  "記低最好嘅長度*同埋*佢由邊度開始，唔係最後就印唔到嗰段。",
]

