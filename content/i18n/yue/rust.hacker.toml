[[quest]]
id    = "rust.hacker.29.dijkstra"
title = "唔係每條街都一樣長"
story = "你到而家清過嘅每張地圖都係數跳幾多步。電車唔理有幾多個站；佢理嘅係要行幾耐。"
brief = '''
標準輸入係 `n m seed`：`n` 個站，`m` 條有權重嘅無向 edge。自己砌個 graph，
用**一模一樣**嘅呢個 generator，以兜圈嘅 `u64` 計：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

印出由站 `0` 去每個到得到嘅站嘅最短距離總和（包埋 `0` 自己，係 `0`），然後印 `MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**呢度嘅複雜度係強制嘅。**其中一個隱藏 case 係 `n = 100000`、`m = 200000`。無論點都係 Dijkstra 啱；個鐘決定嘅係個 priority queue。每次掃晒所有未去過嘅 node 搵最細係 `O(V²)`，要**大約十六秒**，而執行時限係五秒。binary heap 令佢變成 `O((V + E) log V)`，**大約五十毫秒**就完成。兩個數都係喺呢部機量嘅，用呢個 quest 附帶嘅兩個程式：starter 係掃嗰個版本。

值得睇清楚，因為呢個係計時 screen 最常見嘅肥佬方法：**starter 冇錯。**佢印出嘅答案完全正確。佢被拒絕，只係因為遲咗三倍先到。

`std::collections::BinaryHeap` 係 max-heap，所以 push `Reverse((distance,
node))`。佢冇 decrease-key，而你亦都唔需要：將改善咗嘅距離當一個新項目 push 入去，pop 出嚟嘅項目如果距離已經差過你記錄咗嘅，就跳過佢。嗰個「過期項目」跳過就係人哋會唔記得嗰行，冇咗佢，個 heap 就會無限咁大。
'''
hints = [
  "Reverse((distance, node)) 將個 max-heap 變成 min-heap，而且將距離放第一，咁排項目次序嘅就係距離。",
  "`if d > dist[u] { continue; }` 就係過期項目跳過。冇咗佢，個演算法仍然正確，而個 heap 會塞滿過時嘅項目。",
  "generator 嘅 spanning tree 嗰半保證每個 node 都行得到，所以 i64::MAX 嘅過濾其實從來冇移走過任何嘢——照樣留住佢，因為有一個行唔到嘅 node 嘅版本，就係呢條題目嘅追問。",
]

