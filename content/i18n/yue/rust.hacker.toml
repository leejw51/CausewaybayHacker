id    = "rust.hacker.34.stable-sort"
title = "打和嘅保持原位"
story = "兩個車手同分完成，而排行榜每次重畫都將佢哋排成唔同次序。"
brief = '''
標準輸入係 `n buckets seed`。砌 `n` 個車手，車手 `i` 有 index `i` 同一個分數：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分數**由高到低**排車手。同分嘅車手一定要保持佢哋到嘅次序。印出佢哋嘅 index，用空格分隔，然後印 `TIES <k>`——你排好嘅次序入面有幾多對相鄰嘅同分。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 好細，所以幾乎全部都係打和，而答案幾乎完全由佢哋點處理決定。

**呢個 quest 講嘅係知道你手上拎住邊種排序。**`sort_by_key` 係 **stable**——相等嘅元素保持佢哋嘅相對次序。`sort_unstable_by_key` 唔係，而喺真正嘅輸入上面佢明顯唔會保住：佢係 pattern-defeating quicksort，通常快啲，而對打和完全冇任何承諾。starter 用嘅就係佢，而隱藏 case 大到證明到佢會打亂佢哋。（喺 `n = 8` 佢啱啱好冇打亂——所以細測試乜都證明唔到，亦所以呢度嘅細 case 係*睇得到*嗰個，而唔係判你嗰個。）

有兩個正確答案，而你應該兩個都講得出。用 stable 嘅排序。**或者**用唔 stable 嗰個，將個比較整成**全序**——按 `(Reverse(score), index)` 排，咁就冇兩個元素會比較相等，stable 與否就唔再係問題。第二個係預設應該用嘅；次序完全指定咗嘅時候，唔 stable 嘅排序冇嘢要證明。
'''
hints = [
  "一個字：sort_unstable_by_key 變做 sort_by_key。嗰個係 stable 嘅答案。",
  "另一個答案保留唔 stable 嘅排序，按 (Reverse(score), index) 排——全序，所以冇剩低任何打和可以唔 stable。",
  "TIES 數嘅係排好嘅次序入面相鄰嘅同分，無論你寫兩個之中邊一個，呢個數都一樣——出賣你嘅係 index 嘅次序。",
]

