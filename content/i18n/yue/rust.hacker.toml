大 case 仲幫你決定另外兩樣嘢。`n = 200000` 嘅答案係 `9990744366`，`i32` 裝唔落——闊度錯咗嘅累加器會靜靜雞錯，唔係慢。而 generator 一定要兜圈而唔係 panic，喺 release mode 佢本身就會兜圈，喺 debug mode 就唔會：寫明 `wrapping_mul` 同 `wrapping_add`，而且係認真嘅。
