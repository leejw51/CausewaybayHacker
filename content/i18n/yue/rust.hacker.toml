[[quest]]
id    = "rust.hacker.05.binary-search"
title = "要幾大架貨車"
story = "車廠想要喺得嗰幾日入面送晒當日單據嘅最細一架貨車。佢哋唔會話你知係邊架；你講一架，佢哋會話你知係咪太細。"
brief = '''
標準輸入係兩個整數，`n` 同 `seed`。輸入入面冇重量——你要自己砌，用**一模一樣**嘅呢個 generator，以兜圈嘅 `u64` 算術計：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

weights[i] = next() % 1000 + 1        for i in 0..n
```

車廠永遠都係得**三**日。搵出最細嘅貨車容量，令全部 `n` 件貨喺最多三日之內送晒，按 generator 產生嘅次序上車，永遠唔調次序，亦都永遠唔拆開一件貨。

印出個容量，然後印 `MAX <heaviest package>`。

```
input:  8 1
output: 1702
        MAX 903
```

`8 1` 嘅重量係 `775 154 197 871 35 796 131 903`。一架 `1701` 嘅貨車要四日；`1702` 三日就做到。

你唔係搜尋個清單。你搜尋嘅係**答案**：由 `max(weight)` 到 `sum(weights)` 嘅容量，喺呢啲容量上面，「三日之內送唔送得晒」係 false、false、false，之後一直都係 true。對佢做 binary search。

**呢個 quest 會強制複雜度。**其中一個隱藏 case 係 `n = 200000`，答案係 `33355734`，最重嗰件貨係 `1000`——所以你搵緊嘅容量喺搜尋起點上面三千三百萬步。一次升一個容量咁行上去係啱嘅，嗰個就係 starter，而佢**兩分鐘都未行完**，執行時限係五秒。改為每次將範圍減半，就係二十七次、每次 `O(n)` 嘅試探，**10 毫秒**就完成。兩個都係喺呢部機量嘅，用呢個 quest 附帶嘅兩個程式。

範圍兩頭都係總和，唔係單一個值：大 case 嘅 `sum(weights)` 啱啱超過 `10^8`。咁樣 `i32` 仍然裝得落，但只係因為 generator 將一件貨封頂喺 `1000`。用 `i64` 裝，條題目就唔再有趣——而你想佢咁。
'''
hints = [
  "下限係最重嗰件貨——細過佢嘅永遠載唔到佢。",
  "上限係總數：一日，全部放上去。",
  "low + (high - low) / 2，成功就將 `high` 移落 `mid`，咁你就留住得嘅最細容量。",
]

