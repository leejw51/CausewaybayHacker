[[quest]]
id    = "rust.hacker.10.tree-walk"
title = "行一棵樹嘅三種方法"
story = "白板上面一棵樹，同一條冇人應該要諗兩次嘅題目：講出三種次序。"
brief = '''
第一行係 `n`。第二行係 `n` 個按**層序**排嘅值，`-1` 代表「呢度冇節點」——所以棵樹係用 heap 嘅方法儲：index `i` 嘅子節點係 `2i+1` 同 `2i+2`。

印四行：**前序**、**中序**同**後序**行法，每行用空格分隔，然後印 `DEPTH <d>`——由根到葉最長路徑上面有幾多個節點。

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

前序係節點、左、右。中序係左、節點、右。後序係左、右、節點。每次個遞迴都係同樣三行，只係 `push` 嘅位置郁咗。
'''
hints = [
  "一個遞迴函數，個 push 有三個可能位置，好過三個差唔多一模一樣嘅函數。",
  "base case 係兩個條件同時：超過 array 尾，或者坐喺一個 -1 上面。",
  "深度係 1 加兩個子節點之中深啲嗰個，冇節點就係 0。",
]

