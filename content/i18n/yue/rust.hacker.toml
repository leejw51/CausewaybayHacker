id    = "rust.hacker.04.grid"
title = "走出大廈"
story = "白板上面一張平面圖，最遠嗰個角有道防火門，面試官望住個鐘多過望住支筆。"
brief = '''
第一行係 `r c`。之後 `r` 行係樓面：`.` 係通路，`#` 係牆。

由左上角 `(0,0)` 出發，去到右下角 `(r-1, c-1)`，只可以經通路格上下左右咁行。

印出一條最短路線嘅**步數**，冇路線就印 `-1`。然後印 `REACHED <k>`：由起點行得到幾多個通路格，包埋起點本身。

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

廣度優先，唔係深度優先。深度優先會搵到*一條*路線；條題目問嘅係最短嗰條。
'''
hints = [
  "將 VecDeque 當 queue 用——呢度 BFS 同 DFS 嘅分別就只係咁多。",
  "一格喺 push 嗰陣就標記，唔好等 pop 先標，否則佢會入 queue 好幾次。",
  "距離格同時做埋已到訪集合：-1 代表未見過，所以唔使第二個結構。",
  "一個 array 裝四個位移，好過將主體抄四次。用 i64 計鄰居，cast 返去之前先做邊界檢查：row 同 column 係 usize，`r` 係 0 嘅時候 `r - 1` 喺 debug build 會 panic，喺 release build 會兜圈變成大約 1.8e19。",
]

