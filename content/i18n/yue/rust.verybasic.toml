story = "崇光美食廣場向雙數枱收佢哋枱號嘅平方，但個收銀機條鏈入面乜都冇。"
brief = '''
`nums` 裝住嗰行嘅整數。整出 `total`：雙數嗰啲嘅平方和，用一條迭代器鏈。
`filter` 留低，`map` 轉換，`sum` 相加。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum(); — &&x 拆開 filter 交過嚟嘅兩層引用。",
  "x % 2 == 1 留低單數；冇 & 模式嘅話餘數會喺引用上面計；冇 filter 就每個數都平方。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.verybasic.25.threads"
title = "四部收銀機"
story = "渣甸坊每張收據開一部收銀機，但啲收銀機從來冇開機。"
brief = '''
每個 `x` 都開一條線程計 `x * x`，並將佢個 handle push 落 `handles`。程式會按次序 join 佢哋並印出平方。
`thread::spawn` 攞一個閉包；`move` 畀條線程一份自己嘅 `x`。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3
output: 1 4 9
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — move，冇參數，x * x 做值。",
  "冇 move 嘅話線程會借一個佢可能比佢命長嘅迴圈變數；spawn 嘅閉包唔攞參數；x + x 係雙倍。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.verybasic.26.mutex"
title = "一個計數器，好多隻手"
story = "渣甸坊每部收銀機同時將收入加落同一個計數器，而個計數器讀出嚟係零。"
brief = '''
`c` 係每條線程入面一個 `Arc<Mutex<i64>>` 嘅複本。將 `x` 加落互斥鎖入面嘅數字。程式會 join 每條線程並印總數。
`lock()` 畀一個守衛；`*` 觸及個數字。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3
output: 6
```
'''
hints = [
  "*c.lock().unwrap() += x; — lock，unwrap 個守衛，* 去到 i64，然後加。",
  "守衛本身唔可以加嘢；lock() 回傳一個要 unwrap 嘅 Result；= x 係覆寫而唔係加。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.verybasic.27.binary-tree"
title = "自動補完"
story = "波斯富街個電話亭，幽靈文字又返嚟，帶住一棵佢見過嘅樹。決定一個值去邊一邊嘅嗰一行，佢冇補完。"
brief = '''
`insert` 將 `value` 放入 `n` 下面嘅樹：細嘅值入左子樹，大嘅入右子樹，然後將子樹指定返去。寫嗰一行。程式會印中序遍歷同高度。
`take()` 將一個子節點抽出嚟，先可以交畀遞迴呼叫。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if value < n.value { n.left = insert(n.left.take(), value); } else { n.right = insert(n.right.take(), value); } — take，遞迴，指定返去，喺比較揀到嘅嗰一邊。",
  "唔指定返去會丟失子樹；> 會將值送錯邊；&n.right 係引用，但函數想要 Option 本身。",
]
