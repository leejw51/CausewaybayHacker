[[quest]]
id    = "rust.verybasic.07.functions"
title = "雙倍車費"
story = "時代廣場個報攤過咗午夜收雙倍，但係嗰個雙倍嘅函數原封不動咁回傳車費。"
brief = '''
寫 `double`：一個攞 `i64` 並回傳佢兩倍嘅函數。程式會讀 `n` 並印 `double(n)`。
