# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.verybasic.05.bool-if"
title = "單定雙"
story = "電車門數緊乘客，但係嗰盞話單定雙嘅燈從來冇變過。"
brief = '''
讀一個整數 `n`。將 `even` 設做一個 `bool`，`n` 係雙數就係 true；程式會由佢印 `even` 或者 `odd`。
`%` 係餘數，`==` 係比較。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  4
output: even
```
'''
hints = [
  "let even = n % 2 == 0; — 餘數係零即係雙數，== 令佢變做 bool。",
  "淨係餘數係一個整數，而 if 想要 bool。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.verybasic.06.loops"
title = "電車人數"
story = "希慎廣場站由 1 數到夜晚最後一班電車嘅車費，總數一直係零。"
brief = '''
讀 `n`。將 1 到 `n`（包括 `n`）每個整數加落 `total`；程式會印出嚟。
用 `for` 行一個範圍就得；`..=` 包埋尾。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  4
output: 10
```
'''
hints = [
  "for i in 1..=n { total += i; } — ..= 去到 n；.. 少一個。",
  "三粒點唔係 Rust；用 = i 而唔係 += i 就淨係留低最後一個。",
]

