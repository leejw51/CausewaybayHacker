揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  3.14159265
output: 3.1415926500
```
'''
hints = [
  "let x: f64 = input.trim().parse().unwrap(); — f64 係闊嗰個；f32 會改變啲位數。",
  "喺未 trim 嘅文字上 parse 會因為換行而失敗；&str 唔係數字。",
]

