揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "*count.entry(w.to_string()).or_insert(0) += 1; — or_insert 交返一個引用，* 就係 += 需要嘅嘢。",
  "insert 每次都用 1 覆寫；get 回傳嘅共享引用唔可以加嘢上去。",
]

