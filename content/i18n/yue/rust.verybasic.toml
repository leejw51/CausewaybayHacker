[[quest]]
id    = "rust.verybasic.14.maps"
title = "落單簿"
story = "Lucky Mac 個落單簿要數每款餸叫咗幾多次，但每款都顯示一。"
brief = '''
`count` 係一個 `BTreeMap<String, i64>`。每個字 `w` 都將佢個計數加一 — 新字由零開始。程式會逐行印 `word count`，已排序。
