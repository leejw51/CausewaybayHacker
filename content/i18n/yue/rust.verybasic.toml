# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.verybasic.17.stack"
title = "後入先出"
story = "點心檔啲乾淨碟由疊嘅頂部攞落嚟，但而家係由底部讀。"
brief = '''
`stack` 係一個當做棧用嘅 `Vec<i64>`。不斷 pop 直到佢空晒，每個都 push 落 `out`；程式會印出嚟 — 後入先出。
`pop` 畀一個 `Option`，所以用 `while let` 做迴圈。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while let Some(v) = stack.pop() { out.push(v.to_string()); } — pop 攞頂部，直到 None 結束迴圈。",
  "Vec 冇 pop_front；由前面行，或者 insert 喺 0，都會變返原本次序。",
]

# ---------------------------------------------------------------- 18
[[quest]]
