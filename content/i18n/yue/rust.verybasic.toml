story = "Lucky Mac 個 hash 點算每次印出嚟嘅次序都唔同。"
brief = '''
`counts` 係一個 `HashMap`，行啲 key 嘅時候冇固定次序。`keys` 用一個 `Vec` 裝住嗰啲 key。將 `keys` 排序，令點算每次印出嚟都一樣。
