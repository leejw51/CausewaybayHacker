# RUST LAND — VERY BASIC, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/rust/verybasic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, the quiz choices, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.


pack   = "rust.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.verybasic.01.print"
title = "第一道光"
story = "06:40，渣甸坊上面。個報攤知道客人叫咩名，但係邊個都唔招呼。"
brief = '''
讀一行，係一個名。喺同一行印出 `hello, ` 同埋個名。
`println!` 係印一行嘅宏；`{}` 係放數值嘅位置。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  mei
output: hello, mei
```
'''
hints = [
  "println!(\"hello, {}\", name); — 個宏要保留 !，{} 就攞 name。",
  "冇咗 ! 就係一個唔存在嘅函數；冇咗參數，{} 就冇嘢可以印。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.verybasic.02.int-types"
title = "更闊嘅收銀機"
story = "波斯富街個收銀機用 i32 計數，全日總數要 u64；轉型嗰行係空嘅。"
brief = '''
讀一個非負整數 `a`，型別係 `i32`。整出 `b`：同一個值，但係 `u64`，程式會印 `b + 1`。
`as` 用嚟喺唔同闊度嘅整數之間轉換。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  12
output: 13
```
'''
hints = [
  "let b: u64 = a as u64; — as 就係轉型，左邊個型別講明變做乜。",
  "i32 唔會自動變做 u64；經 u8 轉型會丟晒 255 以上嘅嘢。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.verybasic.03.floats"
title = "小數磅"
story = "寶靈頓道個磅印十個小數位，讀入嗰個數卻擺咗喺錯嘅闊度入面。"
brief = '''
讀一個小數，放入 `x`，型別係 `f64` — 闊嗰種浮點數 — 程式會用十個小數位印出嚟。
