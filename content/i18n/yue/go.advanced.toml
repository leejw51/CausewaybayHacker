[[quest]]
id    = "go.advanced.04.select"
title = "兩個月台"
story = "1 號月台同 2 號月台都駁住同一個大堂計數器，而個計數器一次只可以望住其中一個。"
brief = '''
標準輸入係兩個整數 `a` 同 `b`。

一個 goroutine 喺電車 channel 送 `a` 個值然後 close 佢；另一個喺港鐵 channel 送
`b` 個然後 close 佢。`main` 用一個 `select` loop 將**兩條**都抽乾，數住邊條嚟咗
幾多。

印 `TRAM <a>`、`MTR <b>`、`TOTAL <a+b>`。

```
input:  3 2
output: TRAM 3
        MTR 2
        TOTAL 5
```

喺一條 close 咗嘅 channel 上面 receive 會即刻回傳，永遠都係 — 所以一個留住嗰個
arm 嘅 `select` 會空轉。竅門係：`v, ok := <-ch`，`ok` 係 false 嗰陣就將嗰個
channel 變數設做 `nil`。喺 **nil** channel 上面 receive 會永遠 block，喺 `select`
入面即係嗰個 arm 就咁閂咗。兩條之中仲有一條唔係 nil 就繼續 loop。
'''
hints = [
  "喺 select case 入面 v, ok := <-ch：條 channel close 咗而且抽乾咗，ok 先會係 false。",
  "將 channel 變數設做 nil 就會停用嗰個 case。nil channel 永遠唔會 ready。",
  "loop 條件係 `tramCh != nil || mtrCh != nil`，所以兩個 arm 都閂咗佢先會完。",
]

