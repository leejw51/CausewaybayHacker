[[quest]]
id    = "go.advanced.16.gotchas"
title = "三樣睇落唔係嗰回事嘅嘢"
story = "唔係演算法題。三段碼，面試官淨係想知每段印啲乜。"
brief = '''
標準輸入係個數量 `n`（至少 4），然後 `n` 個整數。

砌 `a := make([]int, n, n+4)` 然後填滿佢。然後啱啱好出四行：

1. `ALIAS <a[2]>` — 做完 `b := a[:2]` 同 `b = append(b, 99)` 之後。
2. `NILIFACE <bool>` — 將一個 **nil 嘅 `*Thing`** assign 入一個 `Fooer` interface
   變數，報返嗰個變數係咪 `!= nil`。
3. `DEFER_CLOSURE <v>` — 由讀 `x` 嘅 `defer func(){ ... }()` 印。
4. `DEFER_ARG <v>` — 由 `defer fmt.Printf(..., x)` 印。

喺兩個 defer 登記**之前**設 `x := a[0]`，喺 `main` 最最尾設 `x = a[n-1]`。（`n`
至少係 4，係為咗 `a[n-1]` 永遠唔會係 aliasing 嗰步覆蓋嘅嗰格 — `n = 3` 嘅話就
會係，而呢個係第四個驚喜，呢條題刻意將佢擺埋一邊。）

```
input:  4
        1 2 3 4
output: ALIAS 99
        NILIFACE true
        DEFER_CLOSURE 4
        DEFER_ARG 1
```

三個答案都令人意外，而三個都係同一個原因：Go 求值嘅時間，比睇落去早啲或者遲啲。

**Aliasing。** `a[:2]` 共用 `a` 嘅 backing array，而且保留佢嘅 capacity，所以
個 `append` 有位，就直接寫落 `a[2]` 而唔係重新分配。切 slice 唔係 copy。
`a[:2:2]` — 三個 index 嘅寫法 — 會封住個 capacity，就係咁樣先擋得住。

**Typed nil。** 一個 interface 值係一對 (type, value)。放一個 nil `*Thing` 入去，
你得到嘅係 `(*Thing, nil)`，唔係 nil *interface*。所以一個回傳 nil 具體 error
pointer 嘅 function 會令 `if err != nil` 觸發，呢兩行係 Go 入面最貴嘅兩行。

**Defer。** deferred 呼叫嘅 argument 係 **行到 `defer` 嗰陣**求值嘅，唔係個呼叫
行嗰陣。一個唔收 argument 嘅 deferred closure 就係呼叫嗰陣先讀啲變數。兩個
defer 見到嘅係同一個 `x`；佢哋唔一樣，係因為其中一個早就 copy 咗一份。而且
佢哋係 LIFO 咁行，所以後寫嗰個先印。
'''
hints = [
  "喺任何嘢改 x 之前先登記兩個 defer，記住佢哋係後入先出咁行。",
  "cap(a[:2]) 係 cap(a)，唔係 2 — 成個 aliasing 答案就係咁。之後試下 a[:2:2]，睇下 ALIAS 變返原本個值。",
  "boxed 揸住嘅係 (*Thing, nil)。同 nil 比較係比較成對嘢，而 type 嗰半唔係 nil。",
]

