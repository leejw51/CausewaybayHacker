[[quest]]
id    = "go.advanced.12.embedding"
title = "佢乜都冇繼承到"
story = "總站就係一個站加多啲嘢。Alex 寫咗兩次，多咗一次。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行，每行係 `STOP <NAME>` 或者 `TERM <NAME> <LINES>`。

畀 `Stop` 一個回傳佢個名嘅 `Describe() string`。令 `Terminus` **embed** `Stop`
再加一個 `Lines int`，同埋畀佢自己一個 `Describe`，呼叫 embed 嗰個之後加上
`(<lines> lines)`。

印每個嘅 `Describe()`，然後印 `TERMINI <k>`，個數要用 type switch 行一個
`[]Describer` 數出嚟。

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

embedding 唔係繼承。`Terminus` 唔會*變成*一個 `Stop`；佢係入面裝住一個，而入面
嗰個值嘅 method 會被 **promote** 到外面嘅 type，除非外面嘅 type 自己聲明咗一個。
`t.Stop.Describe()` 就係你搵返被遮住嗰個嘅方法，而且冇 `super`。
'''
hints = [
  "embed 咗嘅 field 冇自己嘅名 — 喺 literal 入面同 t.Stop.Describe() 入面都係寫做 `Stop`。",
  "Terminus 滿足 Describer 係因為佢自己嗰個 Describe；冇嘅話佢會透過 promote 上嚟嘅 Stop method 去滿足。",
  "d.(Terminus) 用 comma-ok 寫法就係 type assertion；多過兩種嘅時候，type switch 做嘅係同一件事。",
]

