[[quest]]
id    = "go.advanced.10.context-tree"
title = "佢係向下取消嘅"
story = "一個客閂咗個 app，上游九樣嘢仲喺度煮緊、派緊、收緊錢。"
brief = '''
標準輸入係一個整數 `n`。

用 `context.WithCancel` 整一個 parent context。由佢衍生 `n` 個 child：
**雙數**嗰啲用 `context.WithCancel(parent)`，**單數**嗰啲用
`context.WithDeadline(parent, <一個鐘之前>)`。

每個 child 開一個 goroutine，等 `<-child.Done()`，然後報返佢個 index 同
`child.Err().Error()`。取消個 parent，收齊全部 `n` 份報告，按 index 排序印出嚟。
然後印 parent 自己個 error，同埋如果 `errors.Is(parent.Err(), context.Canceled)`
就印 `IS_CANCELED YES`。

```
input:  3
output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

取消係喺 context tree 入面**向下**流嘅，永遠唔會向上。一個 deadline 已經過咗嘅
child，一整出嚟就已經死咗，parent 做乜都冇分別 — 所以單數嗰啲報嘅係另一個 error，
亦都所以個輸出每次行都一樣，而唔係一場 race。

你整嘅每一個 context 都要 `defer cancel()`，呢樣唔係禮貌。一個你永遠唔 cancel
嘅 context，會令佢 parent 個 child list 一路長，呢種 leak 入面一個 goroutine 都冇。
'''
hints = [
  "將 `done` buffer 做 n，咁一個 deadline 已經過咗嘅 child 就可以唔使等 receiver 都報到數。",
  "開始收集之前先取消個 parent，唔係你 block 喺條 channel 度嗰陣，雙數嗰啲 child 仲喺度等緊。",
  "ctx.Err() 係 context.Canceled 或者 context.DeadlineExceeded，分辨佢哋要用 errors.Is，唔係比較啲字串。",
]

