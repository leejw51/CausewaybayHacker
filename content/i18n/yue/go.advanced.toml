[[quest]]
id    = "go.advanced.06.atomic"
title = "一次，得一次"
story = "每個騎手嘅 app 一開就開一條去車廠嘅連線，而家車廠有四十條連線，得一個 socket。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

每個值開一個 goroutine。佢哋每一個都呼叫同一個 `sync.Once`，佢會印 `INIT` — 所以
`INIT` 啱啱好出現一次，邊個 goroutine 先到都好。之後每個 goroutine 將自己個值加
落一個 `atomic.Int64` 總數，再將一個 `atomic.Int64` 計數加一。

佢哋全部做完之後，印 `TOTAL <sum>` 同 `COUNT <n>`。

```
input:  4
        1 2 3 4
output: INIT
        TOTAL 10
        COUNT 4
```

atomic 計數器唔係一個平啲嘅 mutex — 佢係另一件工具，專門做呢樣嘢：一個 word，
read-modify-write，周圍冇 critical section。任何闊過一個 word 嘅嘢，仲係要用
mutex。
'''
hints = [
  "once.Do(func(){ ... }) 第一次會行佢個 argument，其他人就會 block 住直到佢做完。",
  "atomic.Int64 有 Add 同 Load 呢兩個 method — 唔使攞地址，唔使 mutex。",
  "INIT 一定喺 TOTAL 之前出現，因為印 INIT 係喺 goroutine 入面發生，而 TOTAL 係 Wait 之後先印。",
]

