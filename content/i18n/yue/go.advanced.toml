[[quest]]
id    = "go.advanced.08.worker-pool"
title = "八架單車"
story = "四十張單，八架單車。冇人想要四十架單車；佢哋想要嗰八架永遠唔停低。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

砌一個 worker pool：`w` 個 worker range 一條 `jobs` channel，每個將
`{index, value * value}` 推落一條 `results` channel。一個 goroutine 負責餵 job
然後 close `jobs`；另一個等齊啲 worker 然後 close `results`。`main` range
`results` 直到佢 close，按 index 排序，印 `<index> <value>`，然後印 `WORKERS <w>`。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

三個 close，而且得一個次序行得通：餵嘢嗰個 close `jobs`，啲 worker 嘅 `range`
先會完；啲 worker 做完，個 `WaitGroup` 先會放；等嘅嗰個 close `results`，`main`
嘅 `range` 先會完。
'''
hints = [
  "啲 worker 唔使有自己嘅 index；個 job 自己帶住。",
  "close(results) 唔可以喺 worker 入面做 — 有 w 個 worker，但係 close 只可以合法地做一次。",
  "多出嚟嗰個 goroutine 就係為咗呢樣嘢：wg.Wait() 然後 close(results)，而 main 仲喺度抽緊嘢。",
]

