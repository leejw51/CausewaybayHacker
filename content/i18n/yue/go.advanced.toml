[[quest]]
id    = "go.advanced.05.mutex"
title = "一個錢櫃，八隻手"
story = "兩部收銀機都由同一個錢櫃攞現金，收舖嗰陣個錢櫃同佢哋兩部都對唔上數。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

寫埋個 `Counter`：`Add` 攞個 lock，加落總數度，再將命中次數加一；`Snapshot` 攞
個 lock 然後將兩樣都回傳。每個值開一個 goroutine，等齊佢哋，然後印 `TOTAL <sum>`
同 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

個 mutex 住喺佢保護嘅 struct **入面**，就喺佢守住嘅 field 隔籬，而每個掂到嗰啲
field 嘅 method 都要攞佢。你一唔記得用 pointer receiver，個 `Counter` 就會即刻
被 copy 一份 — `go vet` 會話你知。
'''
hints = [
  "c.mu.Lock() 然後 defer c.mu.Unlock() 就係成個 pattern，而且提早 return 個 defer 都照行。",
  "Snapshot 讀兩個 field；喺同一個 lock 下面讀佢哋，先令呢對數係一致嘅。",
  "兩個 method 都要用 pointer receiver，唔係每次呼叫都係 lock 住個 mutex 嘅 copy，乜都守唔到。",
]

