# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.advanced.01.goroutines"
title = "四十個騎手"
story = "12:30。八架單車，四十張單，個調度員仲係一張一張咁嗌。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

每個值開一個 goroutine。每個 goroutine 將 `{index, value * value}` 送落同一條
channel。收齊全部 `n` 個結果，按 index 排序，每行印一個 `<index> <value>`，然後印
`GOROUTINES <n>`。

```
input:  3
        2 3 4
output: 0 4
        1 9
        2 16
        GOROUTINES 3
```

啲結果係 scheduler 想點嚟就點嚟嘅。帶住個 index 先係令個程式每次行都答同一個
答案嘅原因。

呢個 pack 入面每個 goroutine 都係用 **parameter** 收 loop 變數嘅。由 Go 1.22
開始 — 而且只係喺 `go` directive 寫住 `1.22` 或者更新嘅 module 入面 — `for` loop
會畀每次迭代自己嘅 `i` 同 `v`，所以喺嗰度直接捕捉佢哋係安全嘅；其他任何地方，
直接捕捉佢哋就係 Go 最常見嘅一個 bug。傳入去係喺每個版本都啱嘅做法，而且個
signature 寫得清清楚楚個 goroutine 准睇啲乜。
'''
hints = [
  "一條容量 n 嘅 buffered channel 即係冇 sender 會 block，所以你提早停都唔會漏 goroutine。",
  "啱啱好收 n 次。喺呢度冇其他方法知道佢哋全部做完。",
  "用 sort.Slice 按 index 排，就可以攞返 scheduler 攞走咗嘅次序。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.advanced.02.waitgroup"
title = "冇人可以早走"
story = "最後一個騎手未報到，調度員就已經睇個板，個板得一半嘢。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個字。

每個字開一個 goroutine，將個字轉做大楷寫入 `out[i]` — 佢自己個 index，所以唔會有
兩個 goroutine 掂同一個元素。用 `sync.WaitGroup` 等齊佢哋全部，然後按次序印 `out`，
再印 `WAITED <n>`。

```
input:  2
        lucky
        mac
output: LUCKY
        MAC
        WAITED 2
```

`go` 之前 `wg.Add(1)`，入到 goroutine 第一件事 `defer wg.Done()`，讀任何嘢之前
`wg.Wait()`。喺 goroutine 入面先 Add，就係同 `Wait` 本身鬥快。
'''
hints = [
  "好多個 goroutine 寫 out[i] 係安全嘅，因為每個 i 都啱啱好得一個 goroutine 寫。",
  "defer wg.Done() 放喺 goroutine 第一行，咁 panic 咗都仲會放開個 wait。",
  "wg.Add(1) 放喺 loop 入面、go 語句之前 — 唔係 goroutine 入面。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.advanced.03.close"
title = "邊個閂出餐口"
story = "最後一張單之後個廚房出餐口仲係開住，櫃檯企喺度等多一張。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

一個 goroutine 將每個值乘十送出去，然後 **close** 條 channel。`main` range 條
channel，印每個值同埋計住總和，然後印 `SUM <total>` 同 `CLOSED`。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

`range` 一條 channel，要到條 channel close 咗先會完，之前唔會。唔記得 `close`
嘅話，Go runtime 會一字不漏咁話你知發生咗咩事：
*all goroutines are asleep — deadlock!*

由 sender close。永遠唔係 receiver。
'''
hints = [
  "一行，放喺送嘢嗰個 goroutine 嘅最尾。",
  "喺 goroutine 開頭 defer close(ch) 做嘅係同一件事，而且提早 return 都照樣行。",
  "由收嘢嗰邊 close 會令 sender 送嘢嗰陣 panic — 所以條規矩先係 sender close。",
]

