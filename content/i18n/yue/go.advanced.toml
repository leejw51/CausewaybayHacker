[[quest]]
id    = "go.advanced.15.generic-constraints"
title = "個 type 要應承啲乜"
story = "三個 helper，三種唔同嘅承諾，得一個在乎個 type 做到啲乜。"
brief = '''
第一行係 `n`。第二行係 `n` 個細楷嘅字。

寫三個泛型 helper，每個用一種唔同嘅 constraint：

* `Names[T Named](xs []T) []string` — 一個有 **method** 嘅 constraint
* `Max[T Ordered](xs []T) T` — 一個係 **type set** 嘅 constraint，
  `~string | ~int64`
* `Distinct[T comparable](xs []T) int` — 內置嘅 constraint

將每個字包入一個有 `Name() string` method 嘅 `Stop`。印啲名，用空格連埋，然後印
`MAX <w>`（字典序最大嗰個字）同 `DISTINCT <k>`。

```
input:  3
        tram bus mtr
output: tram bus mtr
        MAX tram
        DISTINCT 3
```

constraint 係一個用喺 type parameter 位置嘅 interface，而佢可以裝兩樣普通
interface 裝唔到嘅嘢：一個 **type set**（`~string` 匹配任何 underlying type 係
`string` 嘅 type）同埋預先聲明嘅 `comparable`。

同一個 `interface{ Name() string }` **parameter** 嘅分別，係值得大聲講出嚟嗰個：
`Names[T Named]` 係 monomorphise 咗嘅，個呼叫係 static 嘅，而且唔使 boxing。
`func Names(xs []Named)` 就要喺每個 call site 人手砌一個唔同嘅 slice。
'''
hints = [
  "喺 Names 入面 x.Name() 過到 type check，係因為個 constraint 應承咗有呢個 method — 呢個就係 method constraint 換返嚟嘅嘢。",
  "Max 可以用 >，純粹因為 Ordered 係一個支援佢嘅 type 嘅 type set；`any` 就 compile 唔到。",
  "map[T]struct{} 要 T 係 comparable，啱啱好就係嗰個 constraint，而 struct{} 係嗰個零闊度嘅值，講緊「係 set，唔係 map」。",
