id    = "go.advanced.12.chan-directions"
title = "佢係行邊個方向"
story = "個 producer 由自己條輸出 channel 度 receive 咗成個星期，而且 compile 到，因為冇人寫低個箭嘴。"
brief = '''
第一行係 `n b`，`b` 至少係 `n`。

整一條 buffer 係 `b` 嘅 channel。`produce(out chan<- int, n int)` 送 `0..n-1`
然後 close 佢。`consume(in <-chan int) int` range 佢然後回傳總和。印：

```
input:  3 5
output: CAP 5
        LEN 3
        SUM 3
        LEN_AFTER 0
```

`CAP` 同 `LEN` 係 produce **之後**、consume 之前攞嘅 `cap(ch)` 同 `len(ch)`：
`cap` 係 buffer 嘅大細，`len` 係入面而家坐住幾多個。

個 starter compile 唔到。`consume` 收嘅係 `<-chan int` — 只收唔送 — 但係佢試圖
向佢送嘢。方向係 **type** 嘅一部分，compile 嗰陣就 check，而將一條雙向 channel
轉做單向係免費嘅，而且係單程嘅。呢個係成種語言最平嘅文件：一個 signature 講
明呢個 function 揸住條喉嘅邊一頭。
'''
hints = [
  "個 error 講到明：invalid operation, cannot send to receive-only channel。刪咗嗰行。",
  "produce 喺呢度可以喺 main goroutine 行，純粹因為個 buffer 夠大裝晒所有嘢；b < n 嘅話佢會永遠 block。",
  "range 一條 close 咗而且抽乾咗嘅 channel 會完 — 所以 produce close 佢，consume 先可以 return。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.advanced.13.select-default"
title = "試下，但係唔等"
story = "條 metrics channel 滿咗，部收銀機唔會為咗等佢而停止服務啲客。"
brief = '''
第一行係 `b n`：一條 buffer 係 `b` 嘅 channel，同埋 `n` 個要塞畀佢嘅值。

用 **non-blocking** send 塞 `1..n` — 一個有 `default` 嘅 `select`，塞唔入就放棄，
唔會等。然後用 non-blocking receive 抽乾佢，再試多一次。印：

```
input:  2 5
output: SENT 2
        DROPPED 3
        GOT 2
        EMPTY yes
```

有 `default` 嘅 `select` 永遠唔會 block：呢一刻冇其他 case ready 嘅話，就行
`default`。咁就將「send」變成「試下 send」，metrics 或者 log channel 就應該係
咁樣運作 — 滿咗就掉，唔係塞住。

`b = 0` 而且冇人 receive 嘅時候，**每一個** send 都會被掉，因為 unbuffered send
要有 receiver 已經喺度等緊先會 ready。
'''
hints = [
  "一個有 default 同一個 case 嘅 select 就係成個 non-blocking 慣用法；冇 TrySend 呢個 function。",
  "抽乾用同一個形狀：有值 ready 就 receive，等 default 去結束個 loop。",
  "唔好用 close channel 嚟測試空唔空 — 喺 close 咗嘅 channel 上面 receive 永遠都 ready，會報 `no`。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.advanced.14.happens-before"
title = "點解呢個係安全嘅"
story = "白板上面四段碼。三段係正確同步嘅，一段唔係，而 race detector 都係咁話。"
brief = '''
標準輸入係一個整數 `n`。

砌四樣正確同步嘅嘢，印每樣嘢嘅結果：

1. `CHAN <v>` — 一個 goroutine 寫一個普通嘅 `int`，**然後**喺一條 channel 上面
   send；個 receive 先係令個寫入變得可見嘅嘢。寫 `42`。
2. `ONCE <k>` — `n` 個 goroutine 全部呼叫同一個 `sync.Once`；`k` 係個 function
   實際行咗幾多次。
3. `MUTEX <k>` — `n` 個 goroutine 喺 `sync.Mutex` 下面將一個計數器加一。
4. `WG <k>` — `n` 個 goroutine 各自寫一個 slice 嘅自己嗰格，而 `wg.Wait()` 先係
   令全部 `n` 個寫入對讀者可見嘅嘢。

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

呢啲每一樣都係一條 *happens-before* 邊，而你需要嘅就只係呢四個形狀：send 發生
喺對應嘅 receive 完成之前；`Once.Do` 要嗰一次呼叫做完之後先會 return；unlock
發生喺下一個 lock 之前；`wg.Wait` 要對應嘅 `Done` 呼叫做完之後先會 return。

呢度冇一樣嘢係靠時間先安全嘅。隨便抽走一條邊，`-race` 就會搵到佢，就算嗰部機
從來冇出過一次錯數。
'''
hints = [
  "close(ready) 然後 <-ready 係 Go 入面最平嘅發佈邊，而且佢帶埋個 goroutine 喺佢之前做嘅每一個寫入。",
  "once.Do 入面嘅 runs++ 唔使自己再有 lock — Once 已經保證佢啱啱好發生一次，而且喺其他每個 Do return 之前。",
  "每個 goroutine 擁有自己一格，所以永遠冇兩個會掂同一舊記憶；唯一需要嘅邊就係讀晒佢哋之前嗰個 Wait。",
]

