[[quest]]
id    = "go.advanced.11.rwmutex"
title = "三百個讀者"
story = "希慎個指示牌一分鐘畀人讀三百次，一日改兩次，而一個普通嘅 Mutex 令啲讀者白白排喺對方後面。"
brief = '''
第一行係 `n q`。下一行係要儲起嘅 `n` 個字，再下一行係要查嘅 `q` 個字。

圍住一個 `map[string]int` 同一個 `sync.RWMutex` 砌一個 `Directory`。`Set` 攞
write lock；`Get` 同 `Size` 攞 **read** lock。順序將每個字對住佢嘅位置儲起 — 後面
重複嘅會覆蓋前面嘅。然後將全部 `q` 個查詢**同時**行，收集返嚟，按查詢次序印
`<word> <index>` 或者 `<word> MISSING`，然後印 `SIZE <k>`。

```
input:  3 2
        tram bus mtr
        bus zzz
output: bus 1
        zzz MISSING
        SIZE 3
```

`RLock` 可以畀任何數量嘅讀者同時揸住，淨係會同 writer 互相 block。佢存在嘅全部
理由就係咁，而只要有一個讀者攞咗 `Lock`，佢就一文不值。

啲寫入係刻意順序做嘅：同一個字同時 `Set`，儲落去嘅 index 就會係碰巧最後行嗰個
goroutine 嘅，而一條答案要睇 scheduler 面色嘅題，就係一條會隨機失敗嘅題。
'''
hints = [
  "讀者用 RLock/RUnlock，writer 用 Lock/Unlock。撈亂咗照樣 compile 到，只係好處靜靜雞冇咗。",
  "每個 goroutine 寫 answers[slot]，冇兩個共用同一個 slot，所以個 slice 唔使自己再有 lock。",
  "讀 map 嘅 comma-ok 寫法先分得開「唔存在」同「存在但係零」。",
]

