[[quest]]
id    = "go.advanced.17.race"
title = "競賽"
story = "銅鑼灣轉車站，2 號月台。兩個計數器，一個數，而個數錯咗幾多，冇人可以重現到兩次一樣。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行 `<IN|OUT> <K>`。

每行開一個 goroutine。每個將自己個計數器加 `K` 次，一次加一 — 唔係 `+= K`，係
一次加一，因為閘機就係咁做嘅。等齊佢哋全部，然後印 `IN <a>`、`OUT <b>`、
`NET <a-b>`。

```
input:  2
        IN 3
        OUT 1
output: IN 3
        OUT 1
        NET 2
```

隱藏測試入面 `K` 去到六位數，呢個正正係重點：幾個 goroutine 一齊做普通嘅
`in++`，去到呢個規模唔係*可能*會漏數，係實會漏，每次行都漏，每次漏嘅數都唔同。
`in++` 係一個 load、一個 add 同一個 store，冇嘢將呢三步綁埋一齊。

用 `sync/atomic`（或者 `sync.Mutex`），然後用真正答案畀人驗證嘅方法去驗證佢：
`go test -race` / `go run -race`，佢報嘅係嗰個未同步嘅存取本身，而唔係佢產生嘅
錯總數。
'''
hints = [
  "atomic.Int64 配 Add(1) 係令呢樣嘢正確嘅最細改動。",
  "用一個 sync.Mutex 圍住兩個計數器都得，只係慢啲；每次加一攞一次 lock 先係公平嘅比較。",
  "Wait 之後先讀兩個計數器，唔係中途讀 — 半路攞嘅 snapshot 係另一種錯。",
]
