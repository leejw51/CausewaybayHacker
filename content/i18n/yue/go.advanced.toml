[[quest]]
id    = "go.advanced.07.context"
title = "唔好再送"
story = "個客三條街之前已經閂咗個 app，廚房仲喺度煮緊佢張單。"
brief = '''
標準輸入係兩個整數 `n` 同 `k`。

開一個 producer goroutine，佢本來會將 `1..n` 逐個送落一條 **unbuffered** channel，
但係佢個 `context` 一被取消就即刻停，而且會報返佢實際送到幾多個。

`main` 啱啱好收 `k` 個值並且印出嚟，呼叫 `cancel()`，印 `CANCELLED`，然後印
producer 報返嚟嘅 `SENT <count>`。

```
input:  5 3
output: 1
        2
        3
        CANCELLED
        SENT 3
```

producer 個 loop body 係一個有兩個 arm 嘅 `select`：`<-ctx.Done()` 同個 send。
一冇人 receive，個 send 就永遠唔會 ready，所以唯一可以觸發嘅就係取消。呢樣嘢
先令到個結果係確定嘅，而唔係靠彩數。
'''
hints = [
  "ctx.Done() 係一條 channel，cancel 一呼叫佢就會 close，所以 receive 佢就係一個普通嘅 select arm。",
  "producer 兩條路都一定要報數：被取消嗰陣 return，同埋個 loop 行完嗰陣。",
  "就算你自己會呼叫 cancel，main 入面嘅 defer cancel() 都唔係可有可無 — 佢係釋放個 context 嘅嘢。",
]

