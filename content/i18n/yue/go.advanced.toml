[[quest]]
id    = "go.advanced.01.control-flow"
title = "電車定港鐵"
story = "銅鑼灣站大堂個板本來係話邊班車到緊。而家佢每一分鐘都只係顯示嗰分鐘嘅數字。"
brief = '''
讀一個整數 `n`。對每個由 `1` 到 `n` 嘅 `i`，印一行：

* `i` 同時被 3 同 5 整除就印 `TRAMMTR`
* `i` 被 3 整除就印 `TRAM`
* `i` 被 5 整除就印 `MTR`
* 否則印 `i` 本身

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

Go 嘅 `switch` 可以冇 subject，每個 arm 收一個布林條件，而且唔會 fall through。
用佢。
'''
hints = [
  "先 check 兩樣都中嘅情況，唔係佢永遠都唔會觸發。",
  "switch { case cond: } 唔使 subject，亦都唔使 break。",
  "被 3 同 5 整除，即係被 15 整除。",
]

