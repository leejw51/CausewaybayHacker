# GO LAND — CHEATSHEET, in Cantonese (colloquial written). A translation pack
# (SPEC §12.1): the prose of `content/go/cheatsheet.toml`, quest by quest, and
# nothing else. The four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "go.cheatsheet"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet.01.flush"
title = "唔 flush 就乜都冇"
story = "06:30，渣甸坊。部 kiosk 成晚都印落 buffer 度，但係冇人見過一行。"
brief = '''
輸出經過一個有 buffer 嘅 writer。邊一行可以確保 `main` 返回嗰陣，寫咗落 `out`
嘅嘢全部真係出到上畫面？

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
hints = [
  "`bufio.Writer` 會一直揸住啲 byte，直到佢俾人 flush；而 `defer` 要一個連埋括號嘅 call。",
]

