[[quest]]
id    = "go.cheatsheet.19.bfs-queue"
title = "最舊嘅先"
story = "雨水喺時代廣場地底停車場一格一格咁由去水位向外散開。"
brief = '''
格仔 BFS。邊一行由隊列攞出下一個點，令搜尋保持廣度優先 —— 而且個 loop 真係會完？

```
q := []pt{{sr, sc}}
for len(q) > 0 {
    // ____
    for _, d := range dirs {
        nr, nc := cur.r+d.r, cur.c+d.c
        if !okCell(nr, nc) { continue }
        q = append(q, pt{nr, nc})
    }
}
```
'''
hints = [
  "廣度優先即係最舊嗰個先行。喺 loop body 入面，`:=` 會整一個新嘅 `q`，而出面嗰個永遠唔會縮。",
]

