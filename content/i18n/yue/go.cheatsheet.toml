# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.cheatsheet.12.close-results"
title = "最後一個走"
story = "四個速遞員喺波斯富街一間後房做夜更。最後一個返嚟之後要有人鎖門 —— 唔可以早過佢。"
brief = '''
一個 worker pool。每個 worker 喺 `jobs` 冇嘢之後 call `wg.Done()`，`jobs` 由
producer 閂。邊一行可以令最後個 `range` 喺所有 worker 做完之後完結 —— 唔 deadlock，
亦唔 panic？

```
results := make(chan int) // unbuffered
for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
hints = [
  "等要喺讀嗰邊隔籬做，唔係喺讀之前：啲 worker 會卡喺冇 buffer 嘅 send 度，等到 `main` 去讀為止。",
]

