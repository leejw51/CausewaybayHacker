# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.cheatsheet.17.cancel-send"
title = "收工時間"
story = "勿地臣街嘅夜更廚房將碟餸一個傳一個咁傳落去。經理嗌收工嗰陣，廚師就放低碟餸 —— 就算冇人接都係。"
brief = '''
喺一個 pipeline stage 入面，
`func send(ctx context.Context, out chan<- int, v int) error`。
喺 `out` 度 send `v`，但 `ctx` 一取消就即刻放棄，return 個 context 嘅 error ——
