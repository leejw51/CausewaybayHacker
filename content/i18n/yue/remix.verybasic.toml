[[quest]]
id    = "remix.verybasic.12.closures-python"
title = "閉包 — PYTHON"
story = "每張單都有個飛號。派飛號嗰個計數器住喺整佢出嚟嘅函數入面，其他人掂唔到。條蟒蛇用 Python 落單。"
brief = '''
閉包係一個函數，佢捕捉咗整佢嗰個 scope 入面嘅變數，喺嗰個 scope return 咗之後仲保住佢。`counter()` 整一個出嚟：每 call 一次佢回傳嘅閉包，就派出下一個號碼。程式讀入一啲字，由 1 開始幫佢哋編號，然後印出閉包下一個會派嘅號碼。

喺 Python 入面，閉包係一個內層 `def`。由外層 scope 讀 `n` 係免費嘅，但係一賦值就會整出一個新嘅局部變數 —— 除非內層函數先用一個關鍵字聲明 `n` 係屬於外層 scope 嘅。邊一行係嗰個聲明？

揀出做到嘅嗰一行，然後喺 `# FILL` 註解嗰度打出嚟。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "def next_id(): 下面寫 nonlocal n、n += 1、return n —— 然後 counter 回傳 next_id。",
  "冇 nonlocal 嘅話，n += 1 係 UnboundLocalError：個賦值喺讀之前整咗個新嘅局部 n。",
]

