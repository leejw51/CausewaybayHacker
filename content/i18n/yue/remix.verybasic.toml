[[quest]]
id    = "remix.verybasic.11.closures-rust"
title = "閉包 — RUST"
story = "每張單都有個飛號。派飛號嗰個計數器住喺整佢出嚟嘅函數入面，其他人掂唔到。Ferris 用 Rust 落單。"
brief = '''
閉包係一個函數，佢捕捉咗整佢嗰個 scope 入面嘅變數，喺嗰個 scope return 咗之後仲保住佢。`counter()` 整一個出嚟：每 call 一次佢回傳嘅閉包，就派出下一個號碼。程式讀入一啲字，由 1 開始幫佢哋編號，然後印出閉包下一個會派嘅號碼。

喺 Rust 入面，閉包係 `|| { ... }`，`move` 令佢將 `n` 帶埋走 —— 冇 `move` 嘅話，佢會借一個就快出 scope 嘅局部變數。佢會改佢捕捉咗嘅嘢，所以回傳型別係 `impl FnMut() -> i64`，call 嘅人要用 `mut` 綁住佢。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "move || { n += 1; n } 分開四行 —— move 將 n 攞入閉包。",
  "冇 move 嘅話閉包會借 n，回傳佢就係 E0373：n 活得唔夠耐。",
]

