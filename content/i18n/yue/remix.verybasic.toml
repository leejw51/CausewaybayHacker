# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.verybasic.04.strings-go"
title = "字串 — GO"
story = "張落單紙係一行名，中間用逗號隔開，廚房要將啲名嗌出嚟、分開，再逐個字母數。Gogo 用 Go 落單。"
brief = '''
字串可以按分隔符切開幾段，啲段再用另一個分隔符駁返埋，成個字串一個 call 就轉晒大階。陷阱喺長度：有重音嘅名，位元組數多過字元數，而兩個之中得一個係人會數嘅。程式讀入一行用逗號分隔嘅名，印出有幾多個名、轉咗大階再用 ` | ` 駁埋嘅名，同埋呢行嘅字元數。

喺 Go 入面，做嘢嘅係 `strings` package：`strings.Split` 畀你一個 `[]string`，`strings.Join` 將佢駁返埋，`strings.ToUpper` 回傳一個新字串。`len(s)` 係位元組數；字元數係 `utf8.RuneCountInString(s)`，因為 Go 嘅字串係位元組，而 rune 係佢解碼出嚟嘅嘢。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "strings.Split(line, \",\") 然後 strings.ToUpper(strings.Join(names, \" | \"))；字元數係 utf8.RuneCountInString(line)。",
  "len(line) 係位元組數：Zoë 係四個位元組、三個字元，隱藏測試知㗎。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.verybasic.05.strings-rust"
title = "字串 — RUST"
story = "張落單紙係一行名，中間用逗號隔開，廚房要將啲名嗌出嚟、分開，再逐個字母數。Ferris 用 Rust 落單。"
brief = '''
字串可以按分隔符切開幾段，啲段再用另一個分隔符駁返埋，成個字串一個 call 就轉晒大階。陷阱喺長度：有重音嘅名，位元組數多過字元數，而兩個之中得一個係人會數嘅。程式讀入一行用逗號分隔嘅名，印出有幾多個名、轉咗大階再用 ` | ` 駁埋嘅名，同埋呢行嘅字元數。

喺 Rust 入面，`split(',')` 係一個 iterator，所以要 `collect` 做 `Vec<&str>`；喺個 vec 上面 `join(" | ")` 整出一個 `String`，`to_uppercase()` 再整多一個。`len()` 係位元組數；字元數係 `chars().count()`，因為 `&str` 係 UTF-8 位元組，`chars()` 將佢哋解碼。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "let names: Vec<&str> = line.split(',').collect(); 然後 names.join(\" | \").to_uppercase()；字元數係 line.chars().count()。",
  "line.len() 係位元組數：Zoë 係四個位元組、三個字元，隱藏測試知㗎。",
]

# ---------------------------------------------------------------- 06
