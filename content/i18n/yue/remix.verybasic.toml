# ---------------------------------------------------------------- 10
[[quest]]
id    = "remix.verybasic.10.closures-go"
title = "閉包 — GO"
story = "每張單都有個飛號。派飛號嗰個計數器住喺整佢出嚟嘅函數入面，其他人掂唔到。Gogo 用 Go 落單。"
brief = '''
閉包係一個函數，佢捕捉咗整佢嗰個 scope 入面嘅變數，喺嗰個 scope return 咗之後仲保住佢。`counter()` 整一個出嚟：每 call 一次佢回傳嘅閉包，就派出下一個號碼。程式讀入一啲字，由 1 開始幫佢哋編號，然後印出閉包下一個會派嘅號碼。

喺 Go 入面，函數字面值 `func() int { ... }` 用 reference 捕捉 `n`，所以入面嘅 `n++` 會改到外面嘅 `n`，而 `counter` 將個字面值當做 `func() int` 型別嘅值回傳。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "return func() int { n++; return n } 分開四行 —— 個字面值捕捉咗 n。",
  "counter 嘅回傳型別係 func() int，所以個字面值都要寫 int。",
]

