# the prose of `content/remix/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "remix.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.verybasic.01.numbers-go"
title = "整數同浮點數 — GO"
story = "一號枱。落單紙上面有兩個數，張單要分：每人幾多份、剩返幾多，同埋準確到一仙嘅每人份額。Gogo 用 Go 落單。"
brief = '''
整數同浮點數係唔同嘅型別，兩個整數相除得返嘅係整數：商向零捨去，餘數留畀 `%`。想要準確嘅份額，就要先轉型、後除。程式讀入 `a` 同 `b`，印出佢哋嘅和，然後喺同一行印商同餘數，再將 `a / b` 當浮點數印出，兩位小數。

喺 Go 入面，兩個 `int64` 之間嘅 `/` 係整數除法，`%` 係餘數。`float64(a)` 就係轉型 —— 一個似函數嘅 cast —— 要兩邊都係 `float64`，`/` 先會準確咁除。`Printf` 入面嘅 `%.2f` 印兩位小數。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "q := a / b 然後 r := a % b —— 兩個都仲係 int64；f := float64(a) / float64(b) 先轉型再除。",
  "float64(a) / b compile 唔到：Go 永遠唔會喺同一條表達式入面混用 int64 同 float64。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.verybasic.02.numbers-rust"
title = "整數同浮點數 — RUST"
story = "一號枱。落單紙上面有兩個數，張單要分：每人幾多份、剩返幾多，同埋準確到一仙嘅每人份額。Ferris 用 Rust 落單。"
brief = '''
整數同浮點數係唔同嘅型別，兩個整數相除得返嘅係整數：商向零捨去，餘數留畀 `%`。想要準確嘅份額，就要先轉型、後除。程式讀入 `a` 同 `b`，印出佢哋嘅和，然後喺同一行印商同餘數，再將 `a / b` 當浮點數印出，兩位小數。

喺 Rust 入面，兩個 `i64` 之間嘅 `/` 係整數除法，`%` 係餘數。`a as f64` 係轉型，佢綁得比 `/` 緊，所以 `a as f64 / b as f64` 係兩個浮點數相除。`println!` 入面嘅 `{:.2}` 印兩位小數。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "let q = a / b; 然後 let r = a % b; —— 兩個都係 i64；let f = a as f64 / b as f64; 先轉型再除。",
  "a as f64 / b compile 唔到：f64 唔可以除 i64。",
]

