[[quest]]
id    = "remix.verybasic.13.structs-go"
title = "結構體 — GO"
story = "張單每一行都係一個名、一個價錢同一個數量，而識得計一行總數嘅，就係嗰行自己。Gogo 用 Go 落單。"
brief = '''
struct 將有名嘅欄位組成一個值，method 就係掛喺個型別上面嘅函數，手上攞住個值做 `self` / receiver。程式讀入 `name price qty` 嘅行，每行印出名同嗰行嘅總數，最後印總計。

喺 Go 入面，method 係一個喺名前面有 receiver 嘅函數：`func (it Item) Total() int64`。receiver 係個 struct 嘅副本；`(it *Item)` 就會係 pointer。匯出嘅欄位同 method 用大階字母開頭。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "func (it Item) Total() int64 { return it.Price * it.Qty } —— receiver 喺名前面，自己用一對括號。",
  "func Total(it Item) 係普通函數；it.Total() 搵佢唔到。",
]

