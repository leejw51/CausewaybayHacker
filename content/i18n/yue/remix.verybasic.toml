喺 Python 入面，啲 method 喺字串身上：`line.split(",")` 畀你一個 list，`" | ".join(names)` 係喺*分隔符*上面 call 嘅，`.upper()` 回傳一個新字串。`len(s)` 數嘅係字元，唔係位元組，因為 Python 嘅 `str` 已經解碼咗 —— 位元組數要用 `len(s.encode())`。

