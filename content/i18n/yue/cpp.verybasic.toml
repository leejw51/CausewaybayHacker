[[quest]]
id    = "cpp.verybasic.25.threads"
title = "一個絞盤，一條 thread"
story = "船排喺第二條 thread 加總舢舨嘅重量，主 thread 就等，而嗰條 thread 從來冇開始過。"
brief = '''
`v` 裝住嗰行嘅整數，`sum_of` 將佢哋加埋。個程式需要 `t`：一條 `std::thread`，行一個
將 `sum_of(v)` 存入 `result` 嘅 lambda；`main` join 佢然後印。個 lambda 一定要
by reference capture，先掂到 `v` 同 `result`。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "`std::thread t([&] { result = sum_of(v); });` — thread 係由一個 callable 砌出嚟嘅。",
  "`[&]` 係 by reference capture，個 lambda 就係咁先寫得到 `result`。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "cpp.verybasic.26.mutex"
title = "四隻手，一個計數器"
story = "泵房入面四條 thread 加落同一個計數器，而本應令佢哋輪流嘅 lock 第一次之後就永遠揸住。"
brief = '''
四條 thread 各自將 `counter` 加一，加十萬次。每次行迴圈都一定要喺加嘅時候揸住
mutex `mu` — 而且喺嗰次結束時放開佢。個佔位 lock 咗就永遠唔 unlock，所以第二次
就永遠等落去；一個 lock guard 離開 scope 嗰陣就會放開。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "`std::lock_guard<std::mutex> lock(mu);` — 即刻 lock，`lock` 喺 `}` 死嗰陣 unlock。",
  "淨係 `mu.lock()` 永遠唔會被撤銷；下一次會 block 喺一個呢條 thread 自己已經揸住嘅 mutex 上面。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.verybasic.27.binary-tree"
title = "SEGFAULT"
story = "12:00，午炮。開炮時間表係一棵搜尋樹，而本應行落右邊嘅 insert 停咗喺個根度。"
brief = '''
`insert` 將 `v` 放入以 `n` 為根嘅搜尋樹：空嘅情況已經寫好，會整一個新節點。個窿
係將 `v` 送落正確嗰邊嘅嗰一行 — 細過 `n->val` 就落左邊，否則落右邊 — 並且將遞歸
回傳嘅嘢存返去。Inorder 遍歷之後會按升序印出嚟。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "`if (v < n->val) n->left = insert(n->left, v); else n->right = insert(n->right, v);` — 遞歸入其中一邊，再將結果存返去。",
  "`n` 係一個指標：用 `->`，唔係 `.`；細嘅落左邊。",
]
