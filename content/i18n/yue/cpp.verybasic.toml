```
'''
hints = [
  "`++counts[w];` — 索引會用零建立個 key，然後加一。",
  "`at()` 遇到未有嘅 key 會拋例外；`[]` 會整一個出嚟。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.verybasic.15.hashtable"
title = "查到，或者查唔到"
story = "檔口價錢放喺一個 hash table 入面，查一個冇人聽過嘅檔口一定要答負一，唔係作一個零出嚟。"
brief = '''
`table` 將檔口名對應去價錢，由第一行砌出嚟。讀一個名 `q`。個程式需要 `price`：
個 key 喺度嘅話係表入面嘅值，唔喺度就係 `-1` — 而 `[]` 會靜靜雞插一個零入去。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "`long long price = table.count(q) ? table[q] : -1;` — 先問，再索引。",
  "`table[q]` 遇到唔存在嘅 key 會用 0 插佢入去 — 個查詢會印 0，唔係 -1。",
]

