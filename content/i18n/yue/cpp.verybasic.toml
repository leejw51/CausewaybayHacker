佢個型別寫。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "`Line line = word == \"island\" ? Line::Island : Line::TsuenWan;` — 條件運算子，enumerator 帶住型別。",
  "前面冇 `Line::` 嘅話，`Island` 唔係編譯器識得嘅名。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.verybasic.11.vector"
title = "漁獲，一個一個嚟"
story = "啲舢舨逐個數咁報漁獲，而點算用嘅 vector 一直係空嘅。"
brief = '''
讀一行整數。每個值 `x` 一讀入就要加落 vector `xs` 嘅尾；個迴圈同印出嚟嗰段已經寫好。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "`xs.push_back(x);` — vector 係喺尾度增長嘅。",
  "`push` 係 `std::stack` 嘅；vector 講嘅係 `push_back`。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.verybasic.12.vector-edit"
title = "第一隻落"
story = "絞盤條隊係一個舢舨號碼嘅 vector，第一隻已經上咗，但佢仲喺個名單上面。"
brief = '''
`v` 裝住嗰行嘅整數。個程式要移走第一個元素 — `erase` 收一個指向要刪嘅元素嘅
