# C++ LAND — VERY BASIC, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/cpp/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, the quiz choices, sample input and output and the exact strings
# a program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "cpp.verybasic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.verybasic.01.print"
title = "午炮第一句"
story = "12:00，午炮。開炮記錄本應以一行開頭，而嗰一行唔見咗。"
brief = '''
個程式要一隻字唔差咁印出 `hello, causewaybay` 加一個換行。喺 C++ 入面，
呢樣嘢係送去標準輸出 stream 嘅一句 statement。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — 個 stream、個字串、個換行、個分號。",
  "單引號整出嚟嘅係字元常數；字串要用雙引號。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.verybasic.02.int-types"
title = "int 裝唔落嘅數"
story = "午炮嘅記錄由 1860 年起以百分之一為單位數住開過幾多炮，而裝住佢嘅 register 得 32 位闊。"
brief = '''
讀入 `a`。個程式需要 `big`：一個 64 位整數，裝住 `a` 乘十億 — `a` 一過 2，
呢個值 `int` 就裝唔落。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  3
output: 3000000000
```
'''
hints = [
  "`long long big = a * 1000000000LL;` — 個 `LL` 後綴令個常數都係 64 位。",
  "`int` 係 32 位：五十億塞唔落，出嚟嘅結果係垃圾。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.verybasic.03.floats"
title = "小數潮汐"
story = "潮汐表將一個讀數除以另一個，港務長想要兩個小數位，佢就印咗個整數出嚟。"
brief = '''
讀入兩個正整數 `a` 同 `b`。個程式需要 `q`：以 `double` 計嘅商 — 一個整數除另一個
整數，出嚟仍然係整數，除非其中一個先轉型。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "`double q = static_cast<double>(a) / b;` — 除之前先將一邊轉型。",
  "兩個整數嘅 `a / b` 會先向下取整做整數，然後先變做 double。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.verybasic.04.strings"
title = "個名有幾長"
story = "舢舨個名髹喺船頭，港口記錄想要佢有幾多個字元。"
brief = '''
讀一行入 `s`。個程式要印出佢有幾多個字元 — `std::string` 知道自己嘅長度。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  kwan lee
output: 8
```
'''
hints = [
  "`std::cout << s.size() << '\\n';` — `size()` 係一個呼叫，所以要有括號。",
  "`sizeof(s)` 係個 string 物件本身嘅大細，唔係入面段文字嘅。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.verybasic.05.bool-if"
title = "雙數定單數"
story = "船排個絞盤一次拉兩隻舢舨，點算表話畀你知最後嗰隻係咪要自己一個上。"
brief = '''
讀入 `n`。個程式需要 `even`：一個 `bool`，`n` 除二冇餘數嘅時候係 true。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  4
output: even
```
'''
hints = [
  "`bool even = n % 2 == 0;` — `%` 係餘數，`==` 係比較。",
  "單一個 `=` 係賦值；比較要用兩個。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.verybasic.06.loops"
title = "數禮炮"
story = "午炮開 n 響，記錄要將啲號碼加埋，但佢用嗰個迴圈從來冇開始過。"
brief = '''
讀入 `n`。個程式要將 `1 + 2 + … + n` 加入 `sum`。迴圈主體已經寫好；令 `i` 由 1
行到 `n` 嘅 `for` 頭就係個窿。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  10
output: 55
```
'''
hints = [
  "`for (long long i = 1; i <= n; ++i) {` — 三個子句，用分號分開。",
  "`<` 早一步停；`<=` 包埋 `n` 本身。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.verybasic.07.functions"
title = "佢嘅平方"
story = "泵房個錶顯示一個讀數，顯示屏想要佢嘅平方，而本應做呢件事嘅函數回傳嘅嘢冇一樣有用。"
brief = '''
`square` 攞一個數，要回傳嗰個數乘佢自己。佢嘅主體係個窿；`main` 讀入 `x` 再印
`square(x)`。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  7
output: 49
```
'''
hints = [
  "`return x * x;` — 乘，然後回傳結果。",
  "`^` 喺 C++ 入面係 bitwise XOR，唔係次方。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.verybasic.08.structs"
title = "一個檔口，兩個欄位"
story = "避風塘嘅檔口登記冊每個檔口記一個名同一個價錢，而新檔口嗰條記錄係空嘅。"
brief = '''
`Stall` 有 `name` 同 `price`。個程式已經讀咗兩樣，需要 `s`：一個由佢哋砌出嚟嘅
`Stall` — aggregate 係用大括號初始化嘅，欄位照次序。

揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "`Stall s{name, price};` — 大括號，欄位照 struct 宣告嘅次序。",
  "淨係一個初始值只會填第一個欄位；個價錢就會係零。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.verybasic.09.struct-method"
title = "檔口自己個總數"
story = "每條檔口記錄都知道自己嘅價錢同數量，而佢個 `total()` 問乜都答零。"
brief = '''
`Stall::total` 要回傳 `price` 乘 `qty`。喺 member function 入面，啲欄位直接用名。
