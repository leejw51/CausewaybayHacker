]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.verybasic.14.maps"
title = "點算板"
story = "避風塘嘅點算板數住每一種漁獲，而個數一直冇郁過。"
brief = '''
讀一行字。對每個字 `w`，`counts` 入面嘅計數要加一 — `std::map` 第一次被索引到
