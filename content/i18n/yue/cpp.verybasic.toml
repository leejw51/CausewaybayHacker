揀出做到嘅嗰一行，然後喺 `// FILL` 註解嗰度打出嚟。

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "`v.erase(v.begin());` — `begin()` 係指向第一個元素嘅 iterator。",
  "`pop_back` 移走最後一個；vector 冇 `pop_front`。",
]

