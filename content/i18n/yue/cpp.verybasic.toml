hints = [
  "`return price * qty;` — 啲欄位，用名，相乘。",
  "`this` 係一個指標，所以會係 `this->price`；直接寫個名簡單啲。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.verybasic.10.enums"
title = "兩條線，兩種顏色"
story = "避風塘巴士站上面個轉車指示牌寫住兩條港鐵線，而揀 enumerator 嗰條線被人剪咗。"
brief = '''
讀一個字，`island` 或者 `tsuenwan`。個程式需要 `line`：一個由呢個字揀出嚟嘅 `Line`
