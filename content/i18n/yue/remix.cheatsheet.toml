'''
hints = [
  "Receiver 唔可以 clone。共用一個：用一個 thread-safe 嘅計數指標包住一把鎖。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.cheatsheet.12.sentinels"
