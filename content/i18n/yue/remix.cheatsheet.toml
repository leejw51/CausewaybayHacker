# REMIX LAND — CHEATSHEET, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/remix/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks and identifiers are copied verbatim.

pack   = "remix.cheatsheet"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet.01.flush"
title = "沖出去"
story = "06:30，渣甸坊。個報攤將所有答案寫晒入緩衝區，但係個螢幕一片空白。"
brief = '''
喺 **Go** 入面，`main` 係咁開頭：

```
in := bufio.NewReader(os.Stdin)
out := bufio.NewWriter(os.Stdout)
// ____
```

喺嗰個位寫邊一行，先可以確保 `main` return 嗰陣，寫入 `out` 嘅嘢全部都去到螢幕？
'''
hints = [
  "有緩衝嘅 writer 要 flush 先會真係寫出去。將 flush 排喺 main return 嗰一刻做。",
]

