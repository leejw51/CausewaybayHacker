[[quest]]
id    = "remix.cheatsheet.06.max-heap"
title = "最大嘅行先"
story = "銅鑼灣郵票舖嘅拍賣，出價最高嗰個行先。heapq 淨係識得最低嗰個。"
brief = '''
喺 **Python** 入面，`h` 係一個配 `heapq` 用嘅 list，而 `heapq` 係 min-heap。將數字 `x` push 入去，令 `heapq.heappop(h)` 最先俾返**最大**嘅值（攞出嚟嗰陣你再將個正負號反返轉）。
'''
hints = [
  "heapq 冇 max-heap。將啲值咁樣存，令佢哋嘅次序反轉。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "remix.cheatsheet.07.recursive-closure"
title = "自己叫自己"
story = "希慎廣場啲𨋢：要搜晒每一層，個搜尋就要自己叫自己。"
brief = '''
喺 **Go** 入面，有個 closure 靠自己叫自己嚟行一個 graph：

```
// ____
dfs = func(u int) {
    for _, v := range g[u] { dfs(v) }
}
```

邊一行一定要寫喺前面，個 body 先可以用到 `dfs`？
'''
hints = [
  "用 `:=` 嘅話，個名喺佢自己個 literal 入面仲未存在。先用佢嘅 function type 宣告個變數，之後先 assign。",
]

