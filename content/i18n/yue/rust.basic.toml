[[quest]]
id    = "rust.basic.02.bindings"
title = "車費牌"
story = "波斯富街電車站個車費牌淨係顯示一個數，之後日票同月票嗰兩格都係空嘅。"
brief = '''
`let` 幫一個值改個名。型別可以寫喺冒號後面，`println!("{}", …)` 會印出大括號入面嘅嘢，跟住換行。`i64` 嘅算術就好似喺紙上面咁寫。

```
println!("{}", n * n);
```

`n` 已經讀咗，頭兩行亦幫你印咗。喺 `// FILL` 註解嗰度打呢一行：第三個 `println!`，`n` 乘自己。

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "println!(\"{}\", n * n);",
  "上面兩行係同一個形狀；淨係第二個參數入面條式唔同。",
]

