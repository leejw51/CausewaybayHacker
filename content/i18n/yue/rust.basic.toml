[[quest]]
id    = "rust.basic.15.sort-by"
title = "排行榜"
story = "時代廣場個機舖公佈當日排名：最高分排先，兩個打和就名排先嗰個先。第二塊榜係按個名有幾長排。"
brief = '''
`sort_by` 攞一個返回 `Ordering` 嘅比較 closure。`b.cmp(&a)` 係降序；
`.then_with(|| …)` 用第二個比較嚟分打和。`sort_by_key` 按 closure 抽出嚟
嘅嘢升序排，兩個都係**穩定**嘅：相同嘅 key 保持原本次序。浮點數冇
`cmp`，要用 `a.partial_cmp(b).unwrap()`。

```
rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));
by_len.sort_by_key(|r| r.0.len());
```

喺兩個 `// FILL` 註解嗰度打兩個排序。`by_len` 係第一次排序之前整嘅 clone，
所以佢嘅打和係照輸入次序。

```
input:  MEI 90
        BO 95
        ALEX 90
output: BO ALEX MEI
        BO MEI ALEX
```
'''
hints = [
  "rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0))); 同埋 by_len.sort_by_key(|r| r.0.len());",
  "cmp 入面 b 喺 a 前面，就係令佢變降序嘅原因。cmp 攞一個 reference，所以係 &a.1。then_with 淨係喺第一個比較係 Equal 嗰陣先行。",
]

