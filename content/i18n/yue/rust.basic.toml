[[quest]]
id    = "rust.basic.05.exchange"
title = "交換"
story = "渣甸坊兩部收銀機喺換更嗰陣交換錢櫃，舊嗰個錢櫃拎出嚟，放個空嘅落去。冇嘢被複製；啲嘢轉咗手。"
brief = '''
`std::mem` 可以唔複製咁交換啲值。`swap(&mut a, &mut b)` 對調兩個名揸住嘅嘢。
`take(&mut a)` 將個值 move 出嚟，原位留低個型別嘅預設值 —— 一個空
`String`、一個空 `Vec`、`0` —— 咁你就可以擁有一樣住喺 `&mut` 入面嘅嘢。
`replace(&mut a, v)` 都係一樣，不過留低嘅係你自己揀嘅值。

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

兩行讀咗入 `a` 同 `b`。喺兩個 `// FILL` 註解嗰度打個 swap 同個 take。

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
hints = [
  "std::mem::swap(&mut a, &mut b); 然後 let taken = std::mem::take(&mut a);",
  "兩個都攞 &mut：啲值留喺原位，郁嘅淨係入面嘅內容。take 之後，a 係一個空 String，唔係一個被 move 走咗嘅名 —— 佢仲用得。",
]

