[[quest]]
id    = "rust.basic.10.maps"
title = "落單簿"
story = "怡和街間茶餐廳每張單嗌一次，廚房想要每碟餸嘅點算，按字母順序排。個簿有餸名冇數字。"
brief = '''
`BTreeMap` 每個 key 存一個值，而且自己會將 key 排好 —— 冇嘢要排，行過去
已經係順序。`.insert(k, v)` 加一個 key（或者換佢個值）；`.remove(&k)` 拎走
一個 key；`.get_mut(&k)` 畀你一個已存在嘅值嘅可變引用 —— 係個 `Option`，
所以要 unwrap，`*` 就係畀你透過佢賦值。

```
count.insert("bill".to_string(), 1);
count.remove("tea");
*count.get_mut("bill").unwrap() = 9;
```

`count` 已經數好嗰行嘅字，會按 key 次序印出嚟。喺 `// FILL` 註解嘅位置，
照次序打呢三行。

```
input:  tea toast tea
output: bill 9
        toast 1
```
'''
hints = [
  "count.insert(\"bill\".to_string(), 1); 跟住 count.remove(\"tea\"); 跟住 *count.get_mut(\"bill\").unwrap() = 9;",
  "key 係 String，所以 insert 要 \"bill\".to_string()；remove 同 get_mut 收 &str，\"tea\" 本身已經係。",
]

