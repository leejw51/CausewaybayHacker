[[quest]]
id    = "rust.basic.08.string-slices"
title = "招牌，一截一截"
story = "怡和街個招牌師傅將舖名嘅頭三個字母切出嚟，抄落一塊新板，再喺後面畫個尾綴，而塊板係空白嘅。"
brief = '''
`&str` 可以按位元組範圍切片：`&s[..3]` 係頭三個位元組，由 `s` 借過嚟，唔係抄。`String::from(head)` 整一個可以增長嘅自有副本，`push_str` 就直接喺佢後面加嘢。（範圍以位元組計，所以呢個係畀 ASCII 文字用嘅；切開一個多位元組字元嘅範圍會 panic。）

```
let head: &str = &s[..3];
t.push_str("-lane");
```

`s` 係 trim 過嘅輸入，`t` 由 `head` 整出嚟。喺第一個 `// FILL` 度打切片，第二個度打追加。

```
input:  percival
output: per
        per-lane
        8
```
'''
hints = [
  "let head: &str = &s[..3]; 然後喺 t 整好之後，t.push_str(\"-lane\");",
  "`&s[..3]` 係借；String::from 係抄；push_str 加落個副本度，`s` 冇郁過。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.int-slices"
title = "條龍嘅中間"
story = "希慎廣場個排隊計數器將條龍中間嗰兩個人抄落一張新名單，再將成條龍抄喺後面，而張名單一直係空嘅。"
brief = '''
`v[1..3]` 係一個 `Vec` 嘅切片：第 1 同第 2 個元素，借嘅。`.to_vec()` 將一個切片抄入一個屬於自己嘅新 `Vec`，`extend_from_slice` 就將一個切片嘅每個元素加落一個 `Vec` 嘅尾。先抄，再加 — 原本嘅 `v` 由頭到尾冇變過。

```
let mut middle: Vec<i64> = v[1..3].to_vec();
middle.extend_from_slice(&v);
```

`v` 由輸入讀入。喺兩個佔位嗰度照樣打呢兩行。

```
input:  1 2 3 4
output: 2 3 1 2 3 4
        6
```
'''
hints = [
  "let mut middle: Vec<i64> = v[1..3].to_vec(); 跟住 middle.extend_from_slice(&v);",
  "Vec 上面嘅範圍係切片；to_vec() 係嗰個令你可以 extend 嘅副本。",
]

