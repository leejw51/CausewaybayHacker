[[quest]]
id    = "rust.basic.15.closures"
title = "服務費"
story = "希慎廣場美食廣場部單據機，每一行都加同一個費用。佢畀人講咗個費用一次，第一行都未印就唔記得咗。"
brief = '''
Closure 係寫喺行內嘅函數：`|x| x + 1`。佢可以用周圍 scope 嘅變數而唔使人遞畀佢 — 呢個就係捕捉。寫明參數型別 `|x: i64|` 係可選嘅，但可以免得編譯器估。

```
let add = |x: i64| x + k;
```

`k` 同啲數已經讀咗，`add` 會套用喺每個數上面再印出。用呢一行取代佔位嗰句 `let add`。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "let add = |x: i64| x + k;",
  "`k` 淨係被讀，所以 closure 係借佢；唔使 `move`，`k` 之後照用得。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.lambdas"
title = "雙數枱"
story = "維多利亞公園個美食節將啲枱編號，只有雙數枱要交每平方米嘅徵費。夾板上面個徵費總數係零。"
brief = '''
Iterator adapter 可以串起嚟：`.iter()` 行一個 `Vec`，`.filter(…)` 留低 closure 話 yes 嘅元素，`.map(…)` 將每個換成 closure 回傳嘅嘢，`.sum()` 加晒。直到最尾嘅 `.sum()` 拉動之前乜都唔會行。啲 closure 見到嘅係 reference，所以 `filter` 攞到 `&&x`，`map` 攞到 `&x`。

```
let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();
```

啲數已經讀咗，`total` 亦會印出。用呢一行取代佔位嗰句 `let total: i64 = 0;`。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();",
  "`let` 上面嘅 `: i64` 話畀 `sum` 知加做邊種數；冇佢嘅話編譯器會問你想要邊種數字型別。",
]

