# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.strings"
title = "招牌"
story = "渣甸坊個招牌師傅要個名三個樣：數幾多個字母嚟報價、大楷寫上塊板、同埋鏡像寫喺玻璃入面。"
brief = '''
`String` 用 `.len()` 知自己幾長，用 `.to_uppercase()` 整個大楷副本。冇 `.reverse()`：你要用 `.chars()` 逐個字元行，用 `.rev()` 掉轉頭行，再用 `.collect()` 收集成一個新嘅 `String`。`let` 上面個型別話畀 `collect` 知要砌乜。

```
let rev: String = line.chars().rev().collect();
```

一行已經讀咗，長度同大楷亦印咗。喺 `// FILL` 註解下面，用呢句 `let` 取代佔位嗰句 `let rev`。

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "let rev: String = line.chars().rev().collect();",
  "`.chars()` 係逐個字元嘅 iterator，`.rev()` 倒住行，`.collect()` 砌出 `let` 要嘅 `String`。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.loops"
title = "電車數站"
story = "怡和街電車個售票員喺紙條上面數站：累計總數，每第三個站打一個剔。張紙條第一行之後全部空白。"
brief = '''
`for` 迴圈行一個範圍。`1..n` 喺 `n` 前面停；`1..=n` 包埋 `n`。迴圈變數每一圈都係新嘅綁定，`+=` 就加落一個 `mut` 總數度。

```
for i in 1..=n {
    sum += i;
    if i % 3 == 0 {
        ticks += 1;
    }
}
```

`n` 已經讀咗，總數已經宣告同印出，迴圈主體亦寫好。用第一行 `for i in 1..=n {` 取代佔位嗰句 `for i in 0..0 {`。

```
input:  6
output: 21
        2
```
'''
hints = [
  "for i in 1..=n {",
  "`..=` 係包含尾嘅範圍。`1..n` 會少一個，總和就差咗 `n`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.functions"
title = "車票卡"
story = "波斯富街電車站部機賣車票卡：頭十程一個價，之後平啲。今日每張卡都印總數係零。"
brief = '''
函數係 `fn name(parameter: Type) -> ReturnType { body }`。主體最後一個表達式，唔加分號，就係回傳值 — `if … else …` 本身係表達式，所以可以做最後嗰行。

```
fn fare(rides: i64) -> i64 {
    if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }
}
```

`fare` 已經宣告，`main` 讀入 `n` 再印 `fare(n)`。用嗰句 `if … else` 做主體，取代佔位嘅 `0`。

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }",
  "唔使 `return`，唔使分號：`if … else` 係最後一個表達式，佢嘅值就係 `fare` 畀返嘅嘢。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.basic.07.structs"
title = "檔口卡"
story = "渣甸坊每個檔口都有張卡：一個名、一個價錢、一個數量。部打卡機印出一個冒號同一個零，前面乜都冇。"
brief = '''
`struct` 將幾個有名嘅 field 放埋一齊。值係用一個逐個 field 命名嘅字面量砌出嚟 — 當本地變數同 field 同名，`name: name` 可以縮短做 `name`。Method 住喺 `impl` 區塊入面，接收 `&self`，經佢讀 field。

```
impl Stall {
    fn total(&self) -> i64 {
        self.price * self.qty
    }
}

let stall = Stall { name, price, qty };
```

`Stall` 同佢嘅 `impl` 已經宣告，`name`、`price`、`qty` 已經讀咗。用 `total` 嘅主體取代佔位嘅 `0`，用嗰句 `let stall` 字面量取代佔位嗰句。

```
input:  mango 12 3
output: mango: 36
```
'''
hints = [
  "let stall = Stall { name, price, qty }; — 而 total 入面：self.price * self.qty",
  "喺 method 入面 field 係經 `self` 攞；喺 `main` 入面啲變數已經係 field 嘅名，所以字面量可以淨係列個名。",
]

