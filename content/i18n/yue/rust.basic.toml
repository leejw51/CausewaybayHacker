[[quest]]
id    = "rust.basic.17.threads"
title = "四部收銀機"
story = "渣甸坊同時開四部收銀機，每部做自己張單。經理按收銀機次序收單，個托盤返嚟係空嘅。"
brief = '''
`thread::spawn` 開一條線程行一個 closure，畀返一個 `JoinHandle`。`move` 畀 closure 自己一份佢用到嘅嘢，咁條線程就唔會借用一個可能已經冇咗嘅 stack frame。`.join()` 等條線程完，以 `Result` 形式回傳 closure 回傳嘅嘢。

```
handles.push(thread::spawn(move || x * x));
squares.push(h.join().unwrap());
```

兩個迴圈都寫好。喺第一個 `// FILL` 註解嗰度打第一行，喺第二個嗰度打第二行。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — 然後 squares.push(h.join().unwrap());",
  "按 handle push 嘅次序 join，輸出先會跟輸入次序；線程本身幾時完都得。",
