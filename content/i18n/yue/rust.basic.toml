[[quest]]
id    = "rust.basic.01.first-light"
title = "第一下光"
story = "06:40，渣甸坊樓上。個游標就咁停喺度，灰色嘅字冇咗。你仲憑記憶打得出嘅嘢，先係你嘅。"
brief = '''
一模一樣咁印出：

```
hello, causewaybay
```

全部細楷，一個逗號，一個空格，一行。其他乜都唔好有。
'''
hints = [
  "println! 係一個 macro，所以個感嘆號要保留。",
  "個字串要一模一樣：細楷、一個逗號、逗號後面一個空格。",
]

