# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.basic.18.traits"
title = "自動補完"
story = "波斯富街部電話亭你未有一行佢就幫你寫完每一行。不過你自己改名嗰個 trait，佢冇嘢補畀你。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行，每行係以下其中一種

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` —— `ROUTE` 係一個數

每個牌印一行 `<tag> <rendering>`，然後印 `SIGNS <n>`：

* `Shop` render 做 `<NAME> / F<FLOOR>`，佢嘅 tag 係 `SIGN`
* `Stop` render 做佢嘅路線號碼，佢嘅 tag 係 `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

宣告一個 trait，為兩個唔同嘅 struct 實現佢：

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` 係一個**預設方法**。`Shop` 乜都唔講就攞到 `SIGN`；`Stop` 自己寫一個，
攞到 `TRAM`。呢個就係面試嗰陣好多人唔記得嘅 trait 嘅另一半：trait 唔止係
一張簽名清單，佢可以帶住行為，而 override 係你自己揀嘅。

透過**一個** function 印嘢：`fn show<T: Sign>(sign: &T)`。個 bound 就係
份合約 —— `show` 對 `Shop` 或者 `Stop` 一無所知，佢淨係知交畀佢嘅嘢有
`render` 同 `tag`。編譯器為每個具體嘅型印一份 `show`，啲呼叫係直接嘅。

個 starter 編譯唔到。個 trait 宣告咗，啲 struct 亦都存在，但係單憑咁樣
你乜都攞唔到：`show(&Shop { .. })` 係 E0277，*the trait bound `Shop: Sign`
is not satisfied*。宣告一個 trait 同實現佢係兩個獨立嘅動作，而喺 Rust
入面第二個永遠都要明文寫出嚟。

兩種牌放落同一個 `Vec` 會係另一個機制 —— `Box<dyn Sign>`，一個指針加一個
vtable，執行嗰陣先查。你呢度唔需要佢，因為每個呼叫點都仲見到具體嘅型。
嗰個係下一張地圖嘅問題，而佢問嘅正正係：你手上揸住嘅係兩者之中邊一個。
'''
hints = [
  "impl Sign for Shop 係寫喺 struct 外面。trait 講係乜；impl 講點做；而編譯器唔會由前者推斷出後者。",
  "Shop 個 impl 完全唔寫 tag，佢就攞 trait 嗰個版本。喺 Stop 個 impl 度寫，Stop 嗰個就贏。預設方法嘅全部就係咁。",
  "show<T: Sign>(sign: &T) 係 generic 嘅，所以個型要喺呼叫嘅地方已經知道 —— 即係喺 match 嘅 arm 入面，你仲見到自己啱啱砌咗乜嘅時候。",
  "一個 Vec 同時裝住兩種就要 Box<dyn Sign>，嗰個係另一個機制，執行嗰陣要查表。冇人問你要呢樣嘢，而喺一條關於 trait 嘅問題度伸手攞佢，會係錯嘅答案。",
]
