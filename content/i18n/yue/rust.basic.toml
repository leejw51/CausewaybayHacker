# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.smart-pointers"
title = "編譯器講得出嘅大細"
story = "Lucky Mac 個單據插：每張單都釘喺下面嗰張上面，一路釘落去到個櫃檯為止。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個以仙為單位嘅金額。

用一條鏈裝住佢哋，一個金額一個節點，跟到達嘅次序：

```
struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}
```

印三行：

1. 啲金額，跟次序，用空格分開，冇嘅話印 `-`
2. `SUM <total>`，要由一個**遞歸**嘅 function 行成條鏈計出嚟
3. `LAST <cents>` —— 最後一個節點嘅金額 —— 或者 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

個 starter 編譯唔到，而個錯誤正正係 `Box` 存在嘅理由。寫
`next: Option<Entry>`，編譯器就要將 `Entry` 喺記憶體度排好：佢要 `8` 個
byte 畀 `cents`，再加一個 `Entry` 有幾大 —— 而呢樣正正係佢計緊嘅嘢。
E0072，*recursive type has infinite size*。

`Box<Entry>` 係一個指住 heap 上一塊 allocation 嘅指針，而一個指針嘅大細
編譯器本來就知。佢擁有佢指住嘅嘢：啱啱好一個擁有者，`Box` drop 嘅時候
釋放，冇計數，冇共享。`Option<Box<Entry>>` 用一個指針大細嘅值，同時係
條鏈嘅尾同埋條鏈入面嘅一個節點 —— 個 `None` 係用 null 地址嚟存，唔係額外
一個 tag byte，所以比起淨係 `Box` 一啲成本都冇多。
'''
hints = [
  "一個字就修好個編譯錯誤：Option<Entry> 變 Option<Box<Entry>>，而個 constructor 加一個 Box::new。",
  "由後面砌返去前面 —— 倒轉 iterate 啲金額，每個新節點都攞你已經有嗰條鏈做佢嘅 next。由前砌到後就要一個指住條尾嘅 cursor，嗰場 borrow 嘅爭拗你而家未需要。",
  "想行但唔想消耗，就揸住一個 Option<&Box<Entry>>：用 head.as_ref() 起步，用 entry.next.as_ref() 行一步。.as_ref() 將 &Option<T> 變做 Option<&T>，呢一下就係保住成條鏈唔散嘅動作。",
  "遞歸嘅 sum 唔使 mut 唔使迴圈：Some(entry) => entry.cents + sum(&entry.next)，None => 0。",
]

