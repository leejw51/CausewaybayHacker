id    = "rust.basic.12.str-and-string"
title = "第一條問題"
story = "香港每一次 Rust 面試都係用呢條開場，而阿薇已經答衰咗兩次。"
brief = '''
讀一行。印三行：

1. 佢第一個用空白字元分開嘅字，以一個**借用**嘅 `&str` 嘅形式 ——
   唔准 allocate，唔准 `to_string()`
2. 嗰個字轉大楷，呢個一定要係一個擁有嘅 `String`，因為大楷版本
   唔係任何已經存在嘅嘢嘅 slice
3. 兩個比較起嚟相等就印 `SAME YES`，否則印 `SAME NO`

```
input:  lucky mac
output: lucky
        LUCKY
        SAME NO
```

`&str` 係一個望住其他人擁有嘅文字嘅 view。`String` 擁有一個可以增長嘅
buffer。`first_word` 返回一個 view，所以佢嘅返回型係由佢個參數借嘅，
乜都唔 allocate —— 呢個就係佢哋真正想問嗰條問題嘅完整答案。
'''
hints = [
