[[quest]]
id    = "rust.basic.16.list"
title = "電車龍，兩頭"
story = "波斯富街條電車龍喺後面上客，喺前面畀查票員上，而車上有邊個嘅名單係空嘅。"
brief = '''
`LinkedList` 係一條喺兩頭改都好平嘅序列。`.push_back(x)` 加喺尾；
`.pop_front()` 拎走頭；`.front_mut()` 畀你個頭嘅可變引用 —— 係個 `Option`，
所以要 unwrap，前面個 `*` 就係畀你透過佢賦值。`LinkedList` 冇 `sort`：要排
就將佢抄入一個 `Vec`（starter 已經抄咗，叫 `sorted`）再排嗰個。（`Vec` 幾乎
永遠係更好嘅選擇；呢個係要識個名嘅嗰個。）

```
list.push_back(0);
list.pop_front();
*list.front_mut().unwrap() = 9;
sorted.sort();
```

`list` 由嗰行嘅整數砌成；先印佢，再印排好嘅副本，再印長度。喺 `// FILL`
註解嘅位置，照次序打呢四行。

```
input:  3 1 4
output: 9 4 0
        0 4 9
        3
```
'''
hints = [
  "list.push_back(0); 跟住 list.pop_front(); 跟住 *list.front_mut().unwrap() = 9; 跟住 sorted.sort();",
  "front_mut() 係 Option<&mut i64>：unwrap 佢，再透過 * 賦值 —— pop 之後個頭就係原本第二個。sorted 係 Vec，所以有 sort()。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.basic.18.hashtable"
title = "落單簿，冇排序"
story = "寶靈頓道嘅點心檔今次用雜湊表記數，讀返出嚟嘅次序就睇個表心情，每朝都唔同。"
brief = '''
`HashMap` 同 `BTreeMap` 係同一個意思 —— 每個 key 一個值 —— 但佢係將 key
雜湊而唔係排序：查找係常數時間，而遍歷次序係任意嘅，每次行都唔同，所以印
之前要先排好啲 key。三個操作都係同樣三個：`.insert(k, v)` 加，`.remove(&k)`
刪，`.get_mut(&k)` 改。

```
counts.insert("bun".to_string(), 1);
counts.remove("siu");
*counts.get_mut("bun").unwrap() = 4;
keys.sort();
```

`counts` 已經數好嗰行嘅字，啲 key 會收集入 `keys` 嚟印。喺 `// FILL` 註解
嘅位置，照次序打呢四行 —— 排序係第四行，喺 `keys` 砌好之後。

```
input:  siu mai har gau siu mai
output: bun 4
        gau 1
        har 1
        mai 2
```
'''
hints = [
  "counts.insert(\"bun\".to_string(), 1); 跟住 counts.remove(\"siu\"); 跟住 *counts.get_mut(\"bun\").unwrap() = 4; 跟住 keys.sort();",
  "同 BTreeMap 嗰幾行一樣，只係改咗名；之後個 keys.sort() 就係用 HashMap 嘅代價。",
]

