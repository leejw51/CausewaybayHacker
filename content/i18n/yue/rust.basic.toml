id    = "rust.basic.33.worker-pool"
title = "個閘口"
story = "時代廣場，12:30。一本落單簿，三個廚師，一個窗口通返出菜位。本簿喺鎖下面共享，廚師揸住佢嘅時間只係夠撕一張單，本簿空咗廚師就收工，出菜位數碟。"
brief = '''
worker pool 就係兩個 channel 加一個鎖。工作經 `job_tx` 落去；啲 worker 共享
一個放喺 `Arc<Mutex<…>>` 後面嘅 `job_rx`，每個用 `job_rx.lock().unwrap().recv()`
攞一份工 —— 個鎖係一個 temporary，所以喺句 statement 完嗰陣就放，煮嘢係喺
鎖**外面**做。所有 `job_tx` 都 drop 咗之後，`recv()` 會返回 `Err`，worker 就係
咁知道要停。結果經 `done_tx` 送返嚟，出菜位一直收，直到每個 `done_tx` ——
worker 嘅 clone *同* main 自己嗰個 —— 都冇咗為止。

```
let job = job_rx.lock().unwrap().recv();
drop(job_tx);
drop(done_tx);
```

個 pool、個迴圈同收集都寫好咗。喺 `// FILL` 註解嗰度打 worker 入面鎖住嘅
receive，同 `main` 入面嘅兩個 drop。漏咗任何一個 drop 都係 deadlock。

```
input:  1 2 3
output: 0 2
        1 5
        2 10
```
'''
hints = [
  "worker 入面 let job = job_rx.lock().unwrap().recv();；send 完之後 drop(job_tx); 同 drop(done_tx);。",
  "lock() 返回嘅 guard 喺嗰個 let 入面係一個 temporary，所以喺分號嗰度就 drop，呢個 worker 煮緊嘢嗰陣其他 worker 可以攞下一份工。成個 cook() 期間都揸住佢就會令個 pool 變返一個一個咁做。",
  "drop(job_tx) 令 recv() 對啲 worker 變做 Err；drop(done_tx) 令 done_rx.iter() 喺啲 worker drop 咗佢哋嗰啲之後可以完。漏咗任何一個，個程式就會永遠等落去。",
]
