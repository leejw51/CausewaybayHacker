[[quest]]
id    = "rust.basic.11.sets"
title = "印花簿"
story = "波斯富街報攤本積分簿每次幫襯蓋一個印，同一個檔口蓋咗兩次。店員要知有幾多個唔同嘅檔口，同埋佢哋嘅號碼按順序排。"
brief = '''
set 每個值只存一次，`BTreeSet` 仲會自己排好，所以冇 sort 要叫 —— 遍歷
已經係順序。`.insert(x)` 加一個值（已經有就乜都唔做）；`.remove(&x)` 拎走
一個，並回傳佢之前係咪喺度。set 冇「改」：個值本身就係 key，所以改一個
值即係刪走舊嘅、加入新嘅 —— 第三行做嘅就係咁，而且只喺舊嘅真係喺度先做。

```
seen.insert(100);
seen.remove(&1);
if seen.remove(&2) { seen.insert(20); }
```

`seen` 已經裝住嗰行唔重複嘅整數，會印佢嘅大細同內容。喺 `// FILL` 註解
嘅位置，照次序打呢三行。

```
input:  3 1 3 2 1
output: 3
        3 20 100
```
'''
hints = [
  "seen.insert(100); 跟住 seen.remove(&1); 跟住 if seen.remove(&2) { seen.insert(20); }",
  "remove 收引用（&1），值喺度就回傳 true —— 個 if 用嘅就係呢個，所以冇 2 嘅 set 會原封不動。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.basic.12.stack-queue"
title = "疊碟"
story = "寶靈頓道點心檔個櫃台，啲碟一隻疊一隻，由最頂攞走；籌號就由條隊最前面攞走。兩疊嘢都放喺度冇人郁。"
brief = '''
`Vec` 就係 stack：`.push(x)` 放上頂，`.pop()` 拎走頂（係個 `Option`），
`.last_mut()` 係頂嘅可變引用，用嚟就地改佢。`VecDeque` 就係 queue：
`.push_back(x)` 排入後面，`.pop_front()` 由前面離開 —— 嗰邊已經寫好。

```
stack.push(42);
stack.pop();
*stack.last_mut().unwrap() = 0;
```

兩個容器都裝住嗰行嘅整數。喺 `// FILL` 註解嘅位置，照次序打呢三行 stack
嘅嘢；之後 stack 由底到頂印出嚟，下一行係 queue 嘅頭。

```
input:  1 2 3 4
output: 1 2 3 0
        1
```
'''
hints = [
  "stack.push(42); 跟住 stack.pop(); 跟住 *stack.last_mut().unwrap() = 0;",
  "個 pop 即刻將 42 拎返走，所以改嘅係之前喺頂嘅嗰個值 —— 後入先出。",
]

