id    = "rust.basic.06.floats"
title = "磅嘅兩個讀數"
story = "渣甸坊個生果磅用雙精度記住重量，錶面就顯示單精度嗰個，而今朝兩個都讀住零。"
brief = '''
`f64` 係 64 位浮點數，冇特別原因就用佢；`f32` 係一半闊度，大約七位有效數字。一旦講明類型，`parse()` 就可以由文字讀出任何一種，`as f32` 將一個 `f64` 收窄，而格式字串入面嘅 `{:.3}` 會印小數點後三位。

```
