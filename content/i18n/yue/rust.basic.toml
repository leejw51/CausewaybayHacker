[[quest]]
id    = "rust.basic.13.sorting"
title = "價錢梯"
story = "寶靈頓道間生果檔，塊板要最平排先，畀老闆睇嗰份就要最貴排先。兩塊板都係按啲箱落貨車嘅次序列價錢。"
brief = '''
`.sort()` 將一個 `mut` `Vec` 原地排成升序。其他次序就用 `.sort_by`，佢接收一個比較兩個元素嘅 closure：`a.cmp(b)` 係升序，所以 `b.cmp(a)` 係降序。

```
asc.sort();
desc.sort_by(|a, b| b.cmp(a));
```

啲數已經複製咗兩份，兩份都會印出。喺 `// FILL` 註解嗰度打呢兩行。

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "asc.sort(); — 同 desc.sort_by(|a, b| b.cmp(a));",
  "兩個都係原地排序，唔回傳嘢，所以係自己一行嘅陳述式，唔係用嚟賦值。",
]

