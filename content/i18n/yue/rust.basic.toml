  "&str 同 String 可以直接比較；標準庫實現咗佢哋之間嘅相等，所以你唔使 as_str()。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.basic.13.combinators"
title = "一個 unwrap 都冇"
story = "Alex 成日話 Rust 版全部都係 unwrap。再寫一次個讀欄程式，會出錯嗰part唔准有 unwrap。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行，每行應該係一個整數。

每一行印個值嘅兩倍，parse 唔到就印 `-1`。然後印 `SOME <k>`，即係有幾多行
parse 到，同埋 `FIRST <v>` —— 第一個 parse 到嘅值 —— 或者 `FIRST NONE`。

```
input:  3
        21
        xx
        -4
output: 42
        -1
        -8
        SOME 2
        FIRST 21
```

用 combinator 嚟做：`.ok()` 將 `Result` 變做 `Option`，`.map(|v| v * 2)`
淨係對存在嘅值起作用，而 `.unwrap_or(-1)` 喺冇值嘅時候提供答案。
`find_map` 一次過就畀到你最後嗰行。

`unwrap()` 喺 parse 到嗰啲行都「得」嘅，然後喺 `xx` 就會拖冧成個程式。
`unwrap_or` 唔會 panic。知道邊個係邊個，就係呢條街嘅任務。
'''
hints = [
  "parse::<i64>() 呢度要用 turbofish，因為下游冇嘢幫編譯器釘死個型。",
  ".ok() 係故意將個錯誤掉走 —— 你唔係要報告點解失敗，淨係報告佢失敗咗。",
  "find_map 會一直行個 closure，直到有一次返回 Some，所以佢喺第一行 parse 到嘅地方就停。",
]

