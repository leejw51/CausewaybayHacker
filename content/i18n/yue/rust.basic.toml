[[quest]]
id    = "rust.basic.09.option"
title = "可能乜都冇"
story = "時代廣場塊告示板，一個靜靜哋嘅朝早。可能冇最高出價，可能冇雙數籌號；塊板要照講出嚟，唔可以靠估。"
brief = '''
`Option<T>` 係 `Some(value)` 或者 `None`，編譯器逼你講明遇到 `None` 會點。
`if let Some(m) = …` 淨係有值嗰陣先行個 block。`.unwrap_or(0)` 畀一個預設值。
`.find(…)` 將第一個符合嘅嘢當 `Option<&T>` 返回，而 `.copied()` 將
`Option<&i64>` 變做 `Option<i64>`。

```
if let Some(m) = nums.iter().max() { println!("MAX {}", m); }
let even = nums.iter().find(|&&x| x % 2 == 0).copied().unwrap_or(0);
```

喺兩個 `// FILL` 註解嗰度打兩行。輸入係空嘅話，第一行乜都唔印，第二行係 `0`。

```
input:  3 5 8 1
output: MAX 8
        8
```
'''
hints = [
  '''if let Some(m) = nums.iter().max() { println!("MAX {}", m); } 然後 find(...).copied().unwrap_or(0)。''',
  "喺一個空 iterator 上面 max() 係 None，if let 就直接跳過。find 交返 Option<&i64>；copied() 將佢變做 Option<i64>，unwrap_or(0) 先會過到型別檢查。",
]

