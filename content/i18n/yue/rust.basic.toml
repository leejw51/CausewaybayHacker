```
'''
hints = [
  "code.chars().filter_map(|c| c.to_digit(10)).collect() —— 然後 (code.as_bytes()[0] - b'a' + b'A') as char。",
  "to_digit 返回一個 Option<u32>；filter_map 會掉走啲 None。一個 byte 減 b'a'，a 就係 0，再加 b'A' 就落喺個大楷度。",
]

