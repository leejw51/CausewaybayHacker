[[quest]]
id    = "rust.basic.14.sort-by-key"
title = "排行榜"
story = "時代廣場樓上間機舖貼出高分榜，最高分排先，同分就按名。塊板依然係啲人啱啱行入嚟嘅次序。"
brief = '''
`.sort_by_key` 按 closure 對每個元素回傳嘅嘢排序。Tuple 係逐個 field 比較，所以用 tuple 做 key 就係先按第一個 field 排，打和就睇第二個；用 `std::cmp::Reverse` 包住一個 field 就將嗰個 field 變做降序。

```
rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));
```

啲行已經讀成 `(String, i64)` 對，亦會印出。喺 `// FILL` 註解嗰度打呢一行。

```
input:  3
        mei 90
        alex 95
        kit 90
output: alex 95
        kit 90
        mei 90
```
'''
hints = [
  "rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));",
  "個 key 係一個 tuple：`Reverse(score)` 令分數降序，後面嘅 `name.clone()` 用字母順序解決打和。",
]

