[[quest]]
id    = "rust.basic.01.the-move"
title = "一個擁有者"
story = "06:40，渣甸坊上面。櫃面得一張收據，上面寫住成條街嘅規矩：一樣嘢得一個擁有者，交咗出去就係交咗出去。"
brief = '''
一個 `String` 啱啱好得一個擁有者。`let kept = receipt;` 唔係複製佢：
係將佢 **move** 走，由嗰行開始 `receipt` 就唔再係一個你用得嘅名 ——
編譯器會用 E0382，borrow of moved value 拒絕你。個值去咗佢去嘅地方，
換咗個新名。

```
let kept = receipt;
```

張收據已經整好，兩個 `println!` 都寫好咗。喺 `// FILL` 註解嗰度打個 move，
等 `kept` 擁有個字串。

```
output: one receipt, one owner
        22
```
'''
hints = [
  "let kept = receipt; —— 一個 let，右手邊係舊個名。",
  "唔使 clone：個字串冇被複製，係轉咗手。過咗呢行再用 receipt 就係 E0382。",
]

