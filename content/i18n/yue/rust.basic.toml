[[quest]]
id    = "rust.basic.14.matching"
title = "件嘢嘅形狀"
story = "個送餐 app 食四個指令，而舊嘅碼係用九個層層疊嘅 if 去 check 佢哋。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行，每行係 `<COMMAND>` 或者
`<COMMAND> <ARG>`。

每一行印：

* `GO <n>` 而 `n` 大過零 —— `FORWARD <n>`
* `GO <n>` 而 `n` 係零或者以下 —— `STAY`
* `STOP` —— `HALT`
* 其他任何嘢 —— `UNKNOWN <COMMAND>`

然後印 `MOVED <total>`，即係你所有向前行嘅總和。

```
input:  4
        GO 3
        GO -1
        STOP
        JUMP 9
output: FORWARD 3
        STAY
        HALT
        UNKNOWN JUMP
        MOVED 3
```

對切開咗嘅一行做一個 `match`，喺 `GO` 嗰個 arm 用一個 **guard** 分開
兩種情況，唔使第二個分支。用 slice pattern —— `["GO", arg]`—— 去 match，
就將一行有幾多截變成 pattern 嘅一部分，而唔係你自己手寫嘅長度檢查。
'''
hints = [
  "parts.as_slice() 就係將個 Vec 變成 slice pattern 可以 match 嘅嘢。",
  "pattern 後面嘅 `if` 係一個 match guard —— 佢分開兩個形狀一樣嘅 arm。",
  "`[command, ..]` 綁住第一個元素、唔理其餘；`[]` 係空行，你一樣要覆蓋。",
]

