[[quest]]
id    = "rust.basic.03.types"
title = "分單"
story = "波斯富街個報攤，兩杯咖啡一張紙幣。個收銀機要講每人幾多、剩幾多、同埋準確嘅份額，今日三行全部空白。"
brief = '''
兩個整數相除得返整數：`7 / 2` 係 `3`，`7 % 2` 係餘數 `1`。想要小數就要先轉型 — `as f64` 將整數變做浮點數 — 格式字串入面嘅 `{:.2}` 會印出小數點後準確兩位。

```
println!("{:.2}", a as f64 / b as f64);
```

`a` 同 `b` 已經讀咗，整數除法同餘數亦印咗。喺 `// FILL` 註解嗰度打呢一行。

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "println!(\"{:.2}\", a as f64 / b as f64);",
  "除之前兩邊都要用 `as f64` 轉型，否則係整數除法，小數位一早冇咗。",
