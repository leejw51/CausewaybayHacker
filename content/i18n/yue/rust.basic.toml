id    = "rust.basic.08.enums"
title = "路線顏色"
story = "時代廣場地底個港鐵指示牌識得三條線，每條線油自己嘅顏色。個顏色查表對三條線都回傳空字串。"
brief = '''
`enum` 係一個封閉嘅變體集合，`match` 每個變體揀一個分支。每個 arm 係 `Pattern => value,`，編譯器堅持每個變體都要有 arm — 漏一個就 build 唔到。

```
let colour = match line {
    Line::Island => "blue",
    Line::TsuenWan => "red",
    Line::KwunTong => "green",
};
```

`Line` 同字→變體嗰個 `match` 已經寫好，顏色 `match` 嘅第一個 arm 亦喺度。喺 `// FILL` 註解嗰度打另外兩個 arm，然後刪走 `_ => ""` 嗰行。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "Line::TsuenWan => \"red\", 同 Line::KwunTong => \"green\",",
  "三個變體都有 arm 之後，`_ => \"\"` 呢個兜底 arm 永遠去唔到，可以刪走。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.vector"
title = "希慎廣場條隊"
story = "希慎廣場個門口人員每組客到嘅時候都將人數寫落紙條。佢要講有幾多組、第一組、最後一組同總數，張紙條一直係空嘅。"
brief = '''
`Vec<T>` 係可以加長嘅列表，對佢做嘅三件事就係下面呢幾行。`.push(x)` 加喺
最尾；`.remove(i)` 拎走第 `i` 個，後面嘅全部向前移；`v[i] = x` 就地改第 `i`
個；`.sort()` 將成個 Vec 由細到大排好。四樣嘢都要個 `Vec` 係 `mut` 先得。

```
v.push(100);
v.remove(0);
v[0] = -1;
v.sort();
```

`v` 裝住嗰行嘅整數，結果同長度會印出嚟。喺四個 `// FILL` 註解嘅位置，
照次序打呢四行。

```
input:  1 9 5 2
output: -1 2 5 100
        4
```
'''
hints = [
  "v.push(100); 跟住 v.remove(0); 跟住 v[0] = -1; 跟住 v.sort(); — 加、刪、改、排。",
  "remove(0) 之後所有嘢向前移，原本第二個變咗 v[0]，改嘅就係佢；sort() 再將剩低嘅排好。",
]

