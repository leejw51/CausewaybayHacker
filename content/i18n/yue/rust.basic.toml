`Vec` 可以就地倒轉：`v.reverse()` 就搞掂，唔使抄。字串唔可以按字元索引，所以要透過佢嘅迭代器倒轉：`s.chars().rev()` 倒住行一次，`collect::<String>()` 就由佢吐出嚟嘅嘢砌一個新字串。

