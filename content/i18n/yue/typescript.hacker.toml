[[quest]]
id    = "typescript.hacker.16.union-find"
title = "邊個同邊個相連"
story = "電車網絡、港鐵同小巴路線喺同一張紙上面。其實有幾多個分開嘅網絡。"
brief = '''
標準輸入係 `n m seed`：`n` 個編號 `0..n-1` 嘅站，`m` 條無向連結。輸入入面冇連結——要你自己砌，用**完全**係呢個嘅生成器，以會 wrap 嘅 64 位元運算（一個 `number` 裝唔落——用 `bigint` 同 `BigInt.asUintN(64, …)`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

印三行：有幾多個分開嘅網絡、最大嗰個嘅大小，同埋 `REDUNDANT <k>`——有幾多條連結接駁嘅兩個站本身已經相連。一個站連去自己都係其中之一。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

對 `8 5 1` 嚟講，五條連結係 `6—1`、`4—6`、`2—3`、`2—6`、`1—2`。最後一條接駁嘅兩個站已經喺同一個網絡，所以佢就係多餘嗰條，剩低嘅係 `{1,2,3,4,6}`，加上各自獨立嘅站 `0`、`5` 同 `7`。

呢種語言第一下咬你就喺個生成器度。一個 `number` 係 double，只係準確到 `2^53`，而 `x * 6364136223846793005` 遠遠超過：用 `number` 運算，個狀態由第一步已經錯，一聲都唔出。用 `bigint` 就準確，`BigInt.asUintN(64, …)` 就係 wrap，而 `x >> 33n` 細過 `2^31`，所以 `Number(x >> 33n)` 會將佢變返一個準確嘅 `number`，畀其他所有嘢用。

**呢度嘅複雜度係強制嘅。**其中一個隱藏測試係 `n = 200000`，有 `m = 200000` 條連結。唔係 union-find 嘅嗰個明顯答案——每條連結都由 `a` 行晒成個網絡，睇吓 `b` 係咪已經喺入面——係啱嘅，而佢每條連結 `O(n)`，所以總共 `O(n·m)`：喺呢部機上面，**一分鐘**之後佢仲未行完，而執行時限係十秒。starter 就係咁。有路徑壓縮同按大小合併嘅 union-find 做同樣 200000 條連結大約用**十分之一秒**，係喺度用呢一關附帶嘅答案量出嚟。

值得睇清楚，因為呢個係計時篩選最常見嘅失敗方法：**starter 冇錯。**佢喺例子同兩個細嘅隱藏測試上面都印出完全啱嘅答案。佢被拒絕，只係因為到得太遲。

union-find：每個站指住一個 parent，`find` 行到根，`union` 將一個根指去另一個。由 `find` 出返嚟嗰陣壓縮條路徑，成件事每次查詢實際上就係常數時間。

用 loop 寫 `find`。遞迴嗰個係教科書版本，喺一條大約一萬長嘅鏈上面就係一個 `RangeError: Maximum call stack size exceeded`——而按大小合併存在就正正係為咗防止呢個形狀，惡意輸入喺第一個 `find` 壓縮佢之前亦正正係呢個形狀。
'''
hints = [
  "一路行一路抽兩個端點——每個一步生成器，按嗰個次序——唔好先砌一個連結清單。呢度冇嘢要用連結兩次。",
  "一開始每個站都係自己嘅 parent，有 n 組；每次成功 union 就減一。用 `Int32Array` 裝 parent 係最快嘅，而且講明咗佢裝乜。",
  "兩頭已經有同一個根嘅連結就係多餘嗰條——計佢一次然後繼續。自己連自己，a === b，會自然喺呢個測試度出現。",
  "只有根嘅 size 項目先有意義，所以由啲根度讀最大嗰個，唔好由每個 index 讀。",
  "bigint 嗰行每個字面值都要加 `n` 後綴——`6364136223846793005n`——而喺一個表達式入面混用 `bigint` 同 `number` 係編譯錯誤，唔係轉換。呢個 error 係 tsc 做緊佢份工。",
]

