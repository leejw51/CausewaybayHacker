```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`，`x ^ 0 == x`，而 xor 唔理次序。成個第一行就係咁。`x & (x - 1)` 清走最低嗰個 set bit，第三同第四行就免費送埋畀你。

呢度每個位元運算子都會先將運算元轉做一個 **32 位元有號**整數。呢啲測試嘅值好細，所以冇代價——但 `2 ** 31 | 0` 係 `-2147483648`，一個去到或者超過 `2^31` 嘅值會一聲唔出咁變做負數或者被截短。過咗條界，`bigint` 有同樣嘅運算子，完全冇闊度限制。面試官問之前，要知條界喺邊。

呢度四個測試最多得五個數，個鐘亦都唔係量佢哋嘅速度：一個計數嘅 `Map` 全部過到，排序都一樣過到。就算有更大嘅測試都改變唔到呢點，因為呢條題目定嘅標準係**空間**——一個累加器，冇其他嘢——而冇任何執行時限分得出常數空間嘅答案同一個 `Map`。呢樣靠你自覺，同埋靠面試官，佢會問。
'''
hints = [
  "啲對無論用咩次序嚟都會互相抵消，所以對個 array fold 一次就夠。`nums.reduce((acc, v) => acc ^ v, 0)` 係同一個 loop 寫做一行。",
  "每次清走最低嗰個 bit 嚟數 bit，每個 set bit 行一次，唔係每個 bit 闊度行一次。",
  "2 嘅次方啱啱好得一個 bit，所以清走最低嗰個就剩零——而零本身要人手排除。",
