story = "每張單都掃咗兩次，除咗一張。佢哋唔准你用 Map，亦都唔准你排序。"
brief = '''
第一行係 `n`。第二行係 `n` 個非負整數，入面每個值都啱啱好出現兩次，除咗一個。

