[[quest]]
id    = "typescript.hacker.06.stack"
title = "下一個大啲嘅"
story = "怡和街電車牌將下幾班車嘅車費列成一欄，佢哋問一條題目：每一個之後，下一個大過佢嘅係邊個。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數。

對每個項目，印出佢**右邊**第一個嚴格大過佢嘅項目，冇就印 `-1`。全部放喺一行，用空格分隔。然後印 `NONE <k>`，即係有幾多個係 `-1`。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

用一個 stack 裝住答案仲未知嘅位置，而佢由底向上一直保持遞減。每個位置 push 一次、pop 一次，所以無論睇落點，成件事都係行一次。一個 array 就係個 stack：喺尾 `push` 同 `pop` 都係 `O(1)`。

呢度五個測試最多六個數字，個鐘喺佢哋身上唔係量速度。大啲嘅都唔會，而呢點值得知道：天真嘅答案——對每個項目向右行，直到有個大啲嘅出現——只係喺輸入已經差唔多遞減嗰陣先係平方。喺隨機輸入上面，平均大約 `ln(n)` 步就停，所以喺生成嘅值上面，冇任何執行時限分得開兩者。stack 仍然係答案，因為佢喺每個輸入上面都係 `O(n)`，包埋遞減嗰個——但喺呢一關，呢個係你要憑論證而唔係憑個鐘去信嘅講法。

`pending.pop()` 嘅型別係 `number | undefined`，因為一個空 array pop 出嚟係 `undefined` 而唔係 throw。檢查完長度之後用 `pending[pending.length - 1]` 讀頂，`undefined` 就永遠唔會出現。
'''
hints = [
  "個 stack 裝嘅係仲等緊答案嘅 index，唔係值。",
  "新值大過 stack 頂嗰個值嗰陣，嗰個 index 嘅答案就係新值——然後繼續 pop，佢可能大過好幾個。",
  "嚴格大過，所以相等嘅值唔會互相解決；佢哋疊埋一齊，之後一齊解決。",
  "`answer[pending.pop()!] = value` 安全，只係因為 loop 條件已經檢查咗 `pending.length > 0`。個 `!` 係你話畀 tsc 知一樣佢睇唔到嘅嘢；確保佢係真嘅。",
]

