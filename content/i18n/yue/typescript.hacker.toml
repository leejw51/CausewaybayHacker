```

喺呢啲大小，`C(a, b)` 有幾十萬個位，所以每次乘法都要邊做邊約。問題係除法：`a! / (b! (a-b)!)` 喺模算術入面冇意義。取代佢嘅係**模逆元**，而因為 `1000000007` 係質數，費馬小定理就畀咗你：`inverse(v) = v^(p-2) mod p`，用重複平方計。

所以：預先計一次 `factorial[0..n]`，每個查詢用 `f[a] * inv(f[b]) * inv(f[a-b])` 答。

**而呢度就係呢種語言加落去嘅陷阱。** 兩個因數都喺 `2^30` 以下，所以佢哋嘅乘積喺 `2^60` 以下——而一個 `number` 係 double，只係準確到 `2^53`。用普通數字寫 `a * b % P` 唔會溢位、唔會 throw，而且係錯嘅：用咗佢，連個例子都會出 `504334178`。要麼用 `bigint` 做乘法，要麼將其中一個因數拆做兩個 15 位元嘅半邊，令冇中間值超過 `2^46`——starter 已經帶住嗰個 `mulmod`，值得識得自己推導出嚟。

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 200000`、`q = 200000`。每個係數獨立咁計——乘 `b` 項、除 `b` 項，每個一次模逆元——喺度行咗三十秒都未完，而執行時限係十秒；嗰個就係 starter。一張共用嘅階乘表大約十分之一秒做完。兩個都喺呢部機實測。
