[[quest]]
id    = "typescript.hacker.07.coins"
title = "啱啱好嘅散紙"
story = "波斯富街個收銀機有三格硬幣，同一個唔肯收紙幣嘅客。"
brief = '''
第一行係 `n target`。第二行係 `n` 個硬幣面值。每種硬幣都有無限多個。

印出啱啱好湊到 `target` 所需嘅最少硬幣數目，湊唔到就印 `-1`。然後印 `REACH <k>`：`0..target` 入面有幾多個金額湊得到，包埋 `0`。

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

隱藏測試好細，所以佢哋捉嘅係錯而唔係慢——而其中一個捉嘅係常見嘅錯答案。貪心法，每次攞最大嘅放得落嘅硬幣再重複，用 `3 4` 湊 `6` 嗰陣會先攞咗個 `4` 然後失敗，而有一個測試正正就係咁。另一個壞答案，冇表嘅純遞迴，呢度捉唔到，但仍然唔係應該寫嗰個：真實情況 `target` 係 100000，同一個金額會被重計幾千次，而一個 `target` 每一個單位一個 frame 嘅遞迴，好早之前已經用完 stack。

`Infinity` 係呢度老實嘅「到唔到」。佢係一個 `number`，比較起嚟大過每個金額，而 `Infinity + 1` 仍然係 `Infinity`，所以鬆弛嗰步唔使特別處理——人哋第一時間會用嘅 `-1` 就唔係咁。
'''
hints = [
  "best[0] = 0，而 best[a] 係喺所有放得落嘅硬幣入面，最平嘅 best[a - coin] 加一。",
  "`new Array<number>(target + 1).fill(Infinity)`——Infinity + 1 係 Infinity，所以就算 a - coin 到唔到，`Math.min(best[a], best[a - coin] + 1)` 都安全。一個 `-1` 哨兵值會次次都被 min 揀中。",
  "REACH 就係做完嘅表入面有幾多格係有限嘅。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.hacker.08.top-k"
title = "問得最多嘅五個"
story = "熱身輪。佢哋要去年張張 ticket 入面出現得最多嘅五個字，而且照樣計時。"
brief = '''
第一行係 `n k`。第二行係 `n` 個用空格分隔嘅字。

印出最常出現嘅 `k` 個字，最常嘅排先，打和就按字由細到大，一行一個。如果唔同嘅字少過 `k` 個，就全部印。然後印 `DISTINCT <d>`。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

用一個 `Map` 數，然後排名。打和規則唔係裝飾。`Map` 係按**插入次序**行——即係啲字喺輸入第一次出現嘅次序——而 `sort` 係穩定嘅，所以淨係按次數排會將打和嘅留喺嗰個次序，唔係題目講嘅，亦都唔係面試官想聽嘅。令個比較變成**全序**——次數由大到細，然後字由細到大——先修正到佢。

用 `<` 同 `>` 比較啲字，佢哋按 UTF-16 code unit 排：對細楷 ASCII 嚟講就係字母次序。`localeCompare` 係人哋會畀嘅另一個答案，而佢按部機嘅 locale 規則排，係同題目寫嘅唔同嘅另一份合約。

呢度四個測試得幾個字，個鐘喺佢哋身上唔係量速度：每個唔同嘅字都掃成個清單一次嚟數，係 `O(n²)`，四個都過到。一年嘅 ticket 就過唔到。呢啲測試檢查嘅係打和規則，嗰部分先係人哋真係會搞錯嘅。
'''
hints = [
  "`counts.set(word, (counts.get(word) ?? 0) + 1)` 就係成個數數嘅 loop。唔好試住一邊數一邊更新個排名。",
  "`(a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0)`——次數由大到細，只有嗰個係 0 嗰陣 `||` 先落去比較個字。",
  "少過 k 個嗰陣 `ranked.slice(0, k)` 都安全——slice 超過尾就喺尾停。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.hacker.09.linked-list"
title = "條鏈"
story = "佢哋要冇 array 嘅做法。節點指住節點，因為條題目真正講緊嘅就係呢個形狀。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數，按次序。

用佢哋砌一條單向 linked list——一個有 `value` 同 `next: ListNode | null` 嘅 class——然後由啲節點答。倒轉、中間同長度全部都係沿住條鏈行出嚟，唔係由你讀輸入落去嗰個 array 度攞；最後將輸出收集喺一個 array 度再 `join` 就冇問題。印三行：

1. 倒轉咗嘅 list，用空格分隔
2. 中間節點嘅值（`n` 係雙數嘅話，攞兩個之中第二個）
3. `LEN <n>`，沿住 list 行嚟數，唔係信個輸入

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

中間用快慢指標：一個指標每次行一步，一個每次行兩步，快嗰個行完嗰陣，慢嗰個就喺度。行一次。

用 loop 倒轉，唔好用遞迴。遞迴倒轉係三行靚 code，加一個喺一萬個節點以外某處出現嘅 `RangeError: Maximum call stack size exceeded`，而會被問到嘅，係呢條題目一百萬個節點嗰個版本。

`strictNullChecks` 開咗，而喺呢一關佢物有所值：`slow.next` 係 `ListNode | null`，你未講清楚佢係 `null` 嗰陣點算之前，tsc 唔會畀你踩上去。
'''
hints = [
  "由尾砌返去頭係容易嗰個方向：每個新節點將舊嘅 head 當佢嘅 next。",
  "覆寫 `cursor.next` 之前先儲低佢。一旦 `cursor.next` 指返轉頭，舊 list 剩低嘅部分就去唔到。",
