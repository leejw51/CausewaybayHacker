`buckets` 好細，所以幾乎全部都係打和，而答案幾乎完全由佢哋點處理決定。

**呢關講嘅係要知道你手上係邊種排序。** `Array.prototype.sort` 由 ES2019 開始規定要係**穩定**嘅，V8 由 2018 年開始已經守住呢個承諾。*唔*穩定嘅係由細到大排完再呼叫 `.reverse()`：咁會連啲打和都一齊倒轉，而 starter 就係咁做。喺個例子上面佢明顯打亂咗佢哋；喺真嘅輸入上面佢永遠都會。

有兩個正確答案，兩個你都應該講得出。用一個 comparator 由高到低排——`(a, b) => b.score - a.score`——其餘交畀穩定性。**或者**將個比較變做**全序**——`b.score - a.score || a.index - b.index`——咁冇兩個元素會比較得相等，穩定性就唔再係問題。第二個係預設應該用嘅；一個全序冇嘢要證明，包括喺比呢個承諾更舊嘅引擎上面。

而 comparator 唔係可有可無。冇 comparator 嘅 `sort()` 將啲車手當佢哋 `toString` 畀出嘅字串比較，而物件嘅 `toString` 個個都係 `[object Object]`。

個鐘喺度唔係量速度，亦都冇嘢畀佢量：你寫兩個之中邊一個，`sort` 都係 `sort`。呢四個測試完全由打和點處理決定。呢關講嘅係知道你個排序承諾咗乜，唔係佢幾快守住個承諾。
'''
hints = [
  "刪咗個 `.reverse()`，將 comparator 反轉做 `b.score - a.score`。呢個係穩定嘅答案，而語言承諾咗。",
  "另一個答案係 `b.score - a.score || a.index - b.index`——一個全序，所以冇打和剩低可以唔穩定。",
  "TIES 數嘅係排好嘅次序入面相鄰嘅同分，無論你寫兩個之中邊一個，呢個數都一樣——出賣你嘅係 index 嘅次序。",
]

