id    = "cpp.basic.10.byte-slices"
title = "頭三個 byte"
story = "午炮條線以 byte 傳送一個名，接收器留低頭三個，再將最後兩個駁喺尾，而佢印出嚟嘅 buffer 係成個名。"
brief = '''
