id    = "cpp.basic.02.bindings"
title = "銅牌"
story = "午炮旁邊塊牌得一個數，跟住兩格空白，本來寫住日數同年份嘅。"
brief = '''
C++ 嘅變數宣告時型別行先：`long long n = 0;`
整出一個叫 `n` 嘅 64 位整數。`std::cin >> n` 由標準輸入讀下一個數入去，
`std::cout << n << '\n'` 就連換行一齊印佢出嚟。對個名做算術就係普通算術：
