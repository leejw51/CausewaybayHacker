id    = "cpp.basic.09.vector"
title = "漁獲，照次序"
story = "每隻舢舨隔住水一個數一個數咁嗌佢嘅漁獲，而最後一隻船未返到之前，港務長冇地方放佢哋。"
brief = '''
`std::vector<long long>` 係一個可以增長嘅 array，對佢做嘅四樣嘢係加、刪、改同
