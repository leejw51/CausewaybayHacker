id    = "cpp.basic.16.list"
title = "頭定尾"
story = "雙數號碼嘅舢舨泊喺避風塘後面，單數嘅泊前面，而泊位名單就只係不停加喺尾。"
brief = '''
`<list>` 嘅 `std::list` 係雙向 linked list：喺任何一頭加或者刪都係常數時間，
