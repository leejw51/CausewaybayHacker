[[quest]]
id    = "cpp.basic.04.strings"
title = "舢舨個名"
story = "舢舨個名喺船頭用大楷髹，喺船尾倒轉髹，而港務長本記錄簿兩樣都冇。"
brief = '''
`std::string` 知道自己嘅長度（`size()`），可以用 `<algorithm>` 行一次，亦可以
由任何一對 iterator 砌出嚟。`std::transform` 對每個字元套用一個函數，再將結果
寫返入去；`<cctype>` 嘅 `::toupper` 就係嗰個函數。`rbegin()` 同 `rend()` 倒轉咁
行個字串，所以由佢哋砌出嚟嘅字串就係倒轉嘅。

```
std::transform(upper.begin(), upper.end(), upper.begin(), ::toupper);
std::string rev(line.rbegin(), line.rend());
```

`upper` 係嗰行嘅 copy，`rev` 係個佔位。喺 `// FILL` 打嗰兩行，取代佔位嘅 `rev`。

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "std::transform(upper.begin(), upper.end(), upper.begin(), ::toupper); — 來源、來源尾、目的地、函數。",
  "std::string rev(line.rbegin(), line.rend()); — 由兩個反向 iterator 砌出嚟嘅字串就係倒轉嘅。",
]

