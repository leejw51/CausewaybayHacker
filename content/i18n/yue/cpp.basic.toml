brief = '''
`std::map<std::string, int>` 係一本按 key 排好嘅字典。`m[k] = v`
加一個 key（或者覆寫已經有嘅）；`erase(k)` 移走一個 key，唔存在就乜都唔做；
`at(k)` 係一個一定已經存在嘅 key 嘅項目 — 賦值畀佢就係改，而且佢會拋例外，
唔會作一個 key 出嚟。行一次個 map 會按排好嘅次序行啲 key — `std::map` 永遠都係
按 key 排好，所以呢度冇排序嗰行。

```
