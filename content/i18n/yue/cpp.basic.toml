  "std::cout << \"...\" 就係成個程式。個 include 已經幫你寫好。",
  "個字串一隻字都唔可以差：細楷，一個逗號，後面一個空格。",
  "main 回傳 int；行到 main 嘅尾都冇 return 係冇問題嘅，意思就係 0。",
