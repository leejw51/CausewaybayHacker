counts.erase("rice");
counts.at("fish") = 9;
```

`counts` 已經數好嗰行每個字，而每行都有 `fish`。喺 `// FILL` 記號打嗰三行：
加 `crab` 做 `1`，移走 `rice`，再將 `fish` 設做 `9`。排好序嘅印出已經寫好。

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
'''
hints = [
  "counts[\"crab\"] = 1; counts.erase(\"rice\"); counts.at(\"fish\") = 9; — 加、刪、改。",
  "[] 會整一個唔存在嘅 key 出嚟；at() 唔肯。個 key 一定要已經喺度嘅時候就用 at()。",
]

