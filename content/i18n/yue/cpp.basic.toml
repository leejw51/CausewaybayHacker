[[quest]]
id    = "cpp.basic.09.int-slices"
title = "中間抽兩個"
story = "船排記錄想將第二同第三個讀數獨立抄出嚟，然後將成個朝早接喺後面，而抄出嚟嘅係成個朝早兩次。"
brief = '''
`std::vector` 冇切片語法；一截就係由兩個 iterator 砌出嚟嘅新 vector —
由 `begin() + 1` 到 `begin() + 3` 為止、唔包尾嗰個 — 而且佢係
**copy**（`<span>` 嘅 `std::span` 先係唔 copy 嘅 view）。
`where` 係 `end()` 嘅時候，`insert(where, first, last)` 就係接駁成段範圍。

```
std::vector<long long> part(v.begin() + 1, v.begin() + 3);
part.insert(part.end(), v.begin(), v.end());
```

`v` 裝住嗰行嘅整數（最少三個）。喺 `// FILL` 打嗰兩行，取代佔位嘅 `part`。

```
input:  1 2 3 4
output: 2 3 1 2 3 4
```
'''
hints = [
  "std::vector<long long> part(v.begin() + 1, v.begin() + 3); — 範圍 constructor；尾係攞嘅最後一個元素再後一個。",
  "part.insert(part.end(), v.begin(), v.end()); — 喺尾度 insert 一段範圍就係接駁。",
]

