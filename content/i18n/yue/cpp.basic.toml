# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.basic.03.types"
title = "潮汐表"
story = "港務長張潮汐表將避風塘嘅水深除以舢舨數目，出嚟嘅答案永遠係整數，就算其實唔係都一樣。"
brief = '''
兩個整數相除得出整數：`7 / 2` 係 `3`，而 `7 % 2` 係餘數 `1`。想得到 `3.5`，
其中一邊要先變做浮點數，`static_cast<double>(a)` 就係明確噉講出嚟嘅寫法。想印
固定小數位，`<iomanip>` 有 `std::fixed` 同 `std::setprecision(2)`。

```
std::cout << a / b << '\n';
std::cout << a % b << '\n';
std::cout << std::fixed << std::setprecision(2) << static_cast<double>(a) / b << '\n';
```

整數除法同餘數已經印咗。喺 `// FILL` 寫第三行：以 `double` 計嘅除法，兩個小數位。

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "std::cout << std::fixed << std::setprecision(2) << static_cast<double>(a) / b << '\\\\n';",
  "淨係一個運算元需要轉型：double 除 long long 出嚟係 double。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.basic.04.int-types"
title = "Register 嘅闊度"
story = "午炮個發射 register 係 32 位闊，海港個鐘嘅係 64 位；一個數由一個抄去另一個，要有人講明先會保住佢個值。"
brief = '''
`<cstdint>` 用闊度幫整數改名：`int32_t` 同 `int64_t` 有正負號，
`uint32_t` 同 `uint64_t` 冇。一個值喺唔同闊度之間搬，就用
`static_cast<...>`，佢大聲講明呢度有轉換發生緊。
`<limits>` 嘅 `std::numeric_limits<T>::max()` 係某個闊度裝得落嘅最大值。

```
uint64_t b = static_cast<uint64_t>(a);
std::cout << std::numeric_limits<uint64_t>::max() << '\n';
```

`a` 係以 `int32_t` 讀入嘅。喺第一個 `// FILL` 打轉型嗰行，喺第二個打第二句
print。

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
hints = [
  "uint64_t b = static_cast<uint64_t>(a); — 個轉型講明要轉去邊個闊度。",
  "std::numeric_limits<uint64_t>::max() 係 18446744073709551615；上面 int32_t 嗰行係同一個呼叫，換咗另一個型別。",
]

