id    = "cpp.basic.01.first-light"
title = "第一道光"
story = "12:00，告士打道海旁。午炮會響，係因為有嘢寫啱咗個地址，而佢旁邊塊牌係空白嘅。"
brief = '''
一隻字都唔可以差，印出：

```
hello, causewaybay
```

全部細楷，一個逗號，一個空格，一行。其他乜都唔要。

`std::cout` 喺 `<iostream>` 入面，`'\n'` 就係換行。`std::endl` 都得，而且佢仲會
flush — 呢度你唔需要，之後你亦都唔會想要。
'''
