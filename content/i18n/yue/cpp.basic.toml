```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "l.push_front(0); l.pop_back(); l.front() = 99; l.sort(); — 每樣一行，照呢個次序。",
  "std::sort 排唔到 std::list（冇隨機存取）；list 自己嘅 l.sort() 就得。",
]

