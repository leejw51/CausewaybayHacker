`xs` 裝住嗰行嘅整數。喺四個 `// FILL` 記號打嗰四行：喺尾加 `99`，移走第一個元素，
將新嘅第一個元素設做 `700`，然後排序。會先印個 vector，再印佢嘅大細。

```
input:  4 8 15 16
output: 15 16 99 700
        4
```
'''
hints = [
  "xs.push_back(99); xs.erase(xs.begin()); xs[0] = 700; std::sort(xs.begin(), xs.end()); — 加、刪、改、排。",
  "erase 同 sort 收 iterator（xs.begin()、xs.end()）；[] 收 index。",
]

