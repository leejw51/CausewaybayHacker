# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet.12.errdefer"
title = "失敗先做"
story = "隧道口支閘，過到數就放車，過唔到就收返張飛。"
brief = '''
`fill` fail 嘅話就 free 咗 `buf`，成功就原封不動交俾 caller。

```
fn load(gpa: std.mem.Allocator, n: usize) ![]u8 {
    const buf = try gpa.alloc(u8, n);
    // ____
    try fill(buf);
    return buf;
}
```
'''
hints = [
  "普通 `defer` 喺每一個出口都會行，成功都包埋。有一種寫法淨係返 error 嗰陣先行。",
]

