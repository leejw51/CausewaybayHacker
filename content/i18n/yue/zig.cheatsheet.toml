title = "銀仔變數字"
story = "2 號亭個銀仔盤用文字數，錢箱要嘅係整數。"
brief = '''
`tok` 係一個裝住 `"42"` 嘅 `[]const u8`。將 `n` 變做十進制嘅 `i64`，壞 token
嘅 error 就交返俾 caller。
'''
hints = [
  "type 行先，跟住係文字，最後係進制。佢返一個 error union，所以要 `try`。",
]

