# ZIG LAND — CHEATSHEET, in Cantonese. A translation pack (SPEC §12.1): the
# prose of `content/zig/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code, live in the English
# pack, and are never translated. Code blocks and identifiers are copied
# verbatim.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "zig.cheatsheet"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet.01.print"
title = "收費牌"
story = "06:00，紅隧銅鑼灣出口。1 號亭頂塊牌要有人寫落去，先會出收費。"
brief = '''
`w` 係 stdout 上面一個有 buffer 嘅 writer。用十進制印 `n`，跟住換行。

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

係邊一行？
'''
hints = [
  "參數要擺入 tuple `.{ ... }` 度；print 可能會 fail，所以要 `try`。",
]

