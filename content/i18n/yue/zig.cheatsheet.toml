# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.cheatsheet.20.labeled-break"
title = "跳出兩個 loop"
story = "搵嗰塊被偷嘅車牌，逐條線逐架車咁搵，一搵到成個掃描就即刻停。"
brief = '''
`grid` 係一個 row 嘅 slice。搵到目標嗰陣，**兩個** loop 要一齊離開 —— 外層 loop
唔可以繼續去下一個 row。

```
outer: for (grid) |row| {
    for (row) |c| {
        if (c == target) {
            found = c;
            // ____
        }
    }
}
```
'''
hints = [
  "有 label 嘅 loop 係喺 keyword 後面寫佢個 label 嚟離開嘅，個名前面要有個冒號；另一個有 label 嘅跳法淨係會跳去下一個 row。",
]

