# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/cpp/hacker.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "cpp.hacker"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.hacker.01.two-sum"
title = "兩張車飛"
story = "7-32 號房，第三次。第一條題目係人人都會抽到嗰條，而今次你錯嘅時候，編譯器唔會話你知。"
brief = '''
第一行係 `n target`。第二行係 `n` 個整數。

印出兩個唔同項目嘅 **1-based** index `i j`，佢哋加埋等於
`target`，格式係 `i j`，而且 `i < j`。如果有多過一對得，就畀第二個 index 最細嗰對；
仲係打和嘅話，就揀第一個 index 最細嗰對。冇一對得就印 `-1`。

```
input:  4 9
        2 7 11 15
output: 1 2
```

呢度嘅隱藏 case 好細：佢哋 check 嘅係打和規則同冇答案嘅情況，唔係你有幾快。
條題目問嘅仍然係線性嗰個做法 — 行一次，一個 `std::unordered_map` — 因為真正嘅
`n` 係 200000，而條題目存在就係為咗篩走個巢狀迴圈。寫條題目真正想要嘅答案，
唔好寫啱啱好過到呢四個 case 嗰個。
'''
hints = [
  "行一次。每個值都問下 target 減佢係咪已經見過。",
  "x 已經喺度嘅話，seen.emplace(x, j) 乜都唔做，咁就留住重複值嘅第一個 index — 正正係題目要求嘅打和規則。",
  "一搵到就印同 return — 掃嘅時候第一個中嘅已經係最細嘅第二個 index。",
]

