**32.6 s** 先印出嚟，而執行時限係五秒，所以你見到嘅係 timeout，唔係錯答案。
條題目存在就係為咗製造呢個失敗。

`O(n log n)` 嗰個對每個長度記住嗰個長度嘅子序列可以收尾嘅最細值 — 一個永遠排好
嘅 list，所以一個新值嘅位置就係一次 binary search，而 `std::lower_bound` 就係嗰次
搜尋。佢做 `n = 200000` 用 **0.006 s**。兩個都係喺呢部機量嘅，用呢個 quest
