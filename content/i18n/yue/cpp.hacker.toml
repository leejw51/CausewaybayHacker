[[quest]]
id    = "cpp.hacker.34.stable-sort"
title = "打和嘅保住位"
story = "兩個車手同分完成，而排行榜每次重畫都將佢哋排成唔同次序。"
brief = '''
標準輸入係 `n buckets seed`。砌 `n` 個車手，車手 `i` 有 index `i` 同一個分數：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分數**由高到低**排車手。同分嘅車手一定要保持佢哋到達嘅次序。印出佢哋嘅 index，
用空格分開，然後印 `TIES <k>` — 你排好嘅次序入面有幾多對相鄰嘅分數相同。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 好細，所以差唔多全部都係打和，而答案差唔多完全由佢哋嘅遭遇決定。

**呢個 quest 講嘅係知道你手上拎住邊種排序。**`std::sort`
**唔係 stable** — 佢對相等元素嘅次序冇任何承諾，而喺真正嘅輸入上面佢明顯唔會
保住：佢係 introsort，佢嘅 partition 步驟理所當然咁將相等元素跨過 pivot 對調。
`std::stable_sort` 係 stable，係 merge sort，為咗呢個承諾要用多啲記憶體。starter
用 `std::sort` 加一個淨係睇分數嘅 comparator，而隱藏 case 大到證明到佢會打亂佢哋。
（喺 `n = 8`，個 library 會退返用 insertion sort，啱啱好保住次序 — 所以細測試乜都
證明唔到，亦所以呢度嘅細 case 係*睇得到*嗰個，而唔係判你嗰個。）

有兩個正確答案，而你應該兩個都講得出。用
`std::stable_sort`。**或者**保留 `std::sort`，將個比較整成
**全序** — 分數由高到低，再 index 由細到大 — 咁就冇兩個元素會比較相等，stable 與否
就唔再係問題。第二個係預設應該用嘅；次序完全指定咗嘅時候，唔 stable 嘅排序冇嘢
要證明。
'''
hints = [
  "一個字：std::sort 變做 std::stable_sort。嗰個係 stable 嘅答案。",
  "另一個答案保留 std::sort，比較（分數由高到低，再 index 由細到大）— 全序，所以冇剩低任何打和可以唔 stable。",
  "TIES 數嘅係排好嘅次序入面相鄰相同嘅分數，無論你寫兩個入面邊個，呢個數都一樣 — 出賣你嘅係 index 嘅次序。",
]

