[[quest]]
id    = "cpp.hacker.08.top-k"
title = "最多人問嘅五個"
story = "熱身回合。佢哋要去年 ticket 入面出現得最多嘅五個字，而且照樣計時。"
brief = '''
第一行係 `n k`。第二行係 `n` 個用空格分開嘅字。

印出最常見嘅 `k` 個字，最常見嘅行先，打和就按字由細到大，一行一個。唔同嘅字少過
`k` 個，就全部印晒。然後印 `DISTINCT <d>`。

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

用 hash map 數，然後排名。個打和規則唔係裝飾。
`std::unordered_map` 按佢啲 bucket 啱啱好嘅次序交出啲項目 — 呢個次序喺 libstdc++
同 libc++ 之間唔同，喺兩次插入唔同嘅執行之間都唔同 — 所以一個淨係睇數目嘅
comparator 會將數目一樣嘅字留喺嗰個次序，同一個程式喺下一部機就印出另一個答案。
`std::sort` 亦都唔 stable，所以就算輸入次序有意義都救唔到你。
將個比較整成**全序** — 數目由多到少，再按字由細到大 — 就係解決方法，亦都係
面試官想聽嘅答案。

呢度嘅 case 好細，個鐘亦都唔係量速度。對呢條題目嚟講咁先啱 — 數同排名點寫都係
`O(n log n)`，而喺呢度真正令人肥佬嘅係個 comparator，`ties` 嗰個 case 會 check，
大 case 就唔會。
'''
hints = [
  "行一次數，排一次序。唔好一路數一路維持個排名。",
  "數目唔同嘅時候 comparator 回傳 a.second > b.second，一樣嘅時候回傳 a.first < b.first — 全序，所以 sort 唔 stable 都睇唔出。",
  "std::min(k, ranked.size()) 令 k 太大都安全；切過 vector 嘅尾唔係 runtime 會報嘅錯誤。",
]

