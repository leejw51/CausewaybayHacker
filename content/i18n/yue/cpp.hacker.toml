快到嚇親人嘅嘢。細 case 捉唔到佢。
所以大嘅隱藏 case 係 `n = 500000, q = 4000000`，天真嘅答案要掂大約 `10^11` 個
元素，喺五秒執行時限之內完成唔到，而 Fenwick tree 用唔使一秒就做晒。兩個都量過，
用呢個 quest 入面嘅兩個程式。

呢個係面試官想釣出嚟嘅教訓：*單點更新、範圍求和* 正正係 Fenwick tree 存在嘅
形狀。三個短函數 — add、prefix，同埋用兩個 prefix 相減嘅 range — 而 `i & -i`
就係你按最低 set bit 行步嘅方法。嗰個表達式入面個 index 要保持有正負號；喺無正負號
型別上面 `-i` 係兜圈，啱啱好得出同樣嘅 bit，但唔係你想喺面試房度要解釋嘅嘢。
'''
hints = [
  "每個初始值呼叫一次 add 嚟砌棵樹。O(n) 由下而上嘅砌法係個好優化，但唔係個鐘測試緊嘅嘢。",
  "i & -i 隔離出最低嘅 set bit。加佢就係沿棵樹行上去；減佢就係行落嚟。",
