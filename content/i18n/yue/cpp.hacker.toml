[[quest]]
id    = "cpp.hacker.33.grid-paths"
title = "穿過街區，永不回頭"
story = "送貨嘅街格，有三條街因為搭棚封咗。有幾多種方法穿過去，同邊條最平。"
brief = '''
標準輸入係 `r c pct seed`。自己按 row-major 次序砌個格，每一格抽**兩個**值：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只可以向**右**或者向**下**行，經過通路嘅格。印出：

1. `PATHS <k>` — 由 `(0,0)` 去 `(r-1,c-1)` 有幾多條唔同嘅路線，模
   `1000000007`
2. `MIN <cost>` — 一條路線嘅最細總成本，兩個端點都計埋，
   冇路線就印 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按 row-major 次序行一次就兩樣都做到：一格嘅路線數係由上面同左邊入嚟嘅路線數
之和，佢最好嘅成本係佢自己嘅成本加上嗰兩個入面平啲嗰個。因為你只會向右或者向下
行，你需要嗰兩格永遠都已經做完 — 所以呢個唔使遞迴，亦都唔使 visited set。

`PATHS` 嘅數目模 `1000000007`，原因同平時一樣：喺
`1000 × 1000` 嘅隱藏 case，真正嘅數有超過六百位。一路加一路取模。

**大 case 強制嘅嘢：**佢刷走任何逐條列舉路線嘅答案。路線多過間房入面嘅原子。佢
分唔到由下而上嘅表同 memoised 遞迴 — 兩個都同格數成線性，兩個都輕鬆過到。
'''
hints = [
  "每一格都抽兩個值，包埋兩個角 — generator 冇跳過佢哋，佢只係唔肯封住佢哋。",
  "一個上面同左邊都冇通路鄰居嘅通路格，有零條路線到達，亦都冇最好成本；保持 INF 代表行唔到，並且守住個加法，因為 INF 加任何嘢都係有正負號 overflow。",
  "終點可以係通路但仍然行唔到，正正就係 PATHS 係 0 同 MIN 係 -1 嘅時候。其中一個隱藏 case 就係咁。",
]

