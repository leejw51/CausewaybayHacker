id    = "cpp.hacker.32.modular"
title = "模十億零七"
story = "呢句說話出現喺題目最底，而半間房嘅人都唔知佢叫佢哋做乜。"
brief = '''
標準輸入係 `n q seed`。產生 `q` 個查詢，以 `std::uint64_t` 計：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

每個查詢計二項式係數 `C(a, b)` **模
1000000007**。印出全部 `q` 個答案嘅總和，本身都模 `1000000007`，
然後印 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

喺呢啲大細，`C(a, b)` 有幾十萬位數，所以永遠唔會先計出嚟再取模 — 每次乘法都
一路做一路取模。問題係除法：`a! / (b! (a-b)!)` 喺模算術入面冇意思。取代佢嘅係
**模反元素**，而因為 `1000000007` 係質數，費馬小定理就畀咗你：
`inverse(v) = v^(p-2) mod p`，用快速冪大約三十次平方就計到。

所以：一次過預先計好 `factorial[0..=n]`，每個查詢答
`f[a] * inv(f[b]) * inv(f[a-b])`。

**呢度嘅複雜度係強制嘅。**其中一個隱藏 case 係 `n = 200000`、
`q = 200000`。每個係數獨立計 — 乘 `b` 項，除 `b` 項，每個一個模反元素 — 喺五秒
執行時限之內完成唔到；嗰個就係 starter。一個共用嘅階乘表用唔使一秒就完成。兩個
都係喺呢部機量嘅。

每個中間值都係兩個細過 `2^30` 嘅值嘅乘積，所以 `long long` 裝得落，乜都唔會
overflow。用 `int` 就唔得 — 呢度 `int` 係 32 位 — 而呢個就係呢條題目會被問嘅
另一半原因。
'''
hints = [
  "每次乘法之後都取模，永遠唔好留到最尾。long long 裝得落兩個細過 P 嘅值嘅乘積；佢裝唔落一個階乘。",
  "inverse(v) 係 power(v, P - 2)，而佢得，只係因為 P 係質數 — 呢度費馬小定理嘅全部內容就係咁。",
  "連反階乘都預先計好，由 inverse(factorial[n]) 倒轉計返落嚟，就可以慳返每個查詢兩次 power() 呼叫。唔使咁做都過到，但值得大聲講出嚟。",
]

