[[quest]]
id    = "cpp.hacker.09.linked-list"
title = "條鏈"
story = "佢哋要唔用 vector 嘅版本。node 指住 node，因為條題目真正講嘅就係呢個形狀。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數，按次序。

用佢哋砌一條單向 linked list — 啲 link 用 `std::unique_ptr<Node>`，答案入面唔准有
vector — 然後印三行：

1. 倒轉咗嘅 list，用空格分開
2. 中間 node 嘅值（`n` 係雙數嘅話，兩個入面嘅第二個）
3. `LEN <n>`，行一次個 list 數出嚟，唔係信個輸入

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

中間就用快慢指標：一個指標一次行一步，一個一次行兩步，快嗰個行到盡頭嘅時候，
慢嗰個就喺中間。行一次。

倒轉嗰度就係 `unique_ptr` 發揮作用嘅地方：一個 node 只可以有一個擁有者，所以將
一個 node 由一條 list 搬去另一條，就係對佢嘅 `next` 做 `std::move`，冇任何一刻
兩條 list 都以為自己擁有佢。*行*個 list 用一個 raw `Node*` 仍然啱 — 佢淨係睇，
乜都唔擁有。
'''
hints = [
  "由尾砌到頭係容易嗰個方向：每個新 node 將舊嘅 head 做佢嘅 next，用 std::move，因為 unique_ptr 唔可以 copy。",
  "倒轉：拆出 head（std::move 入一個 local），將 head 指去佢擁有嘅嘢，將舊嘅倒轉 list 掛喺拆出嚟嗰個 node 度，再將佢變做新嘅倒轉 head。每個 node 四個 move。",
  "搵中間，淨係喺 fast 行得到兩步嘅時候先將 slow 推前。",
]

