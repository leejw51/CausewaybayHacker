[[quest]]
id    = "cpp.hacker.11.bst"
title = "佢真係 BST 咩"
story = "追問。人人都 check 兩個子節點，而人人第一次都錯。"
brief = '''
同上一個 quest 一樣嘅層序編碼：`-1` 係冇嘅 node，`i` 嘅子節點係
`2i+1` 同 `2i+2`。

第一行係 `n q`。第二行係 `n` 個樹嘅值。第三行係 `q` 個查詢值。

印 `VALID` 或者 `INVALID` — 呢棵係咪二元搜尋樹，左子樹每個值都嚴格細過個 node，
右子樹每個值都嚴格大過？然後每個查詢一行：搜尋搵到就印 `<value> FOUND <depth>`，
搵唔到就印 `<value> ABSENT`，root 係深度 1。

個搜尋就係棵樹本身用嚟做嘅 binary search：由 root 開始，值細啲就向左，否則向右，
落到個值或者一個冇嘅 node 就停 — 一個 `-1`，或者過咗 array 尾嘅 index。喺一棵
INVALID 嘅樹上面，嗰次行法可能會錯過一個其實喺 array 入面嘅值，而答案仍然係
`ABSENT`：個查詢問嘅係查找搵到乜，唔係掃一次 array 會搵到乜。其中一個隱藏 case
正正係咁。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

喺每個 node check `left < node < right` **係唔夠嘅** — 左子樹深處嘅一個值仍然可以
大過某個祖先。改為將個開區間傳落去。
'''
hints = [
  "將一個開區間 (low, high) 傳落去。root 攞成個範圍；左子節點攞 (low, node)，右子節點攞 (node, high)。",
  "冇嘅 node 空泛地有效 — 嗰個就係 base case，佢回傳 true，唔係 false。",
  "查找就係 binary search：細啲向左，否則向右，深度就係跳咗幾多下。",
]

