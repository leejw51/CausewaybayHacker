[[quest]]
id    = "cpp.hacker.28.lru"
title = "Linker"
story = "7-32 號房，第三次面試，最後一條題目。一隻冇安全網嘅語言，短啲嘅鐘，同一個一定要踢走啱嘅嘢嘅 cache。"
brief = '''
第一行係 `cap q`。之後 `q` 行係 `PUT <key> <value>` 或者
`GET <key>`。

實作一個固定容量嘅 cache，滿咗嘅時候踢走**最耐冇用過**嘅項目。`GET` 同 `PUT`
都當係用咗一個 key。

每個 `GET` 印出個值，唔喺度就印 `-1`。最尾印出生還嘅 key，最近用過嘅行先，用空格
分開 — cache 係空嘅就印 `-` — 然後印 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

跟住範例行一次：`GET 1` 令 `1` 再變返最近，所以 `PUT 3` 要位嘅時候，走嘅係 `2`。
`GET 2` 搵唔到。`GET 3` 搵到，令 `3` 變成最近，所以生還者印出嚟係 `3 1`。

教科書答案係一個指入**雙向 linked list** 嘅 hash map，而 C++ 有真嘢：
`std::list`，其他元素被插入、刪除或者 splice 嘅時候，佢嘅 iterator 仍然有效 —
正正係 `std::vector` 做唔到嘅保證，亦都係個 map 可以用 `std::list::iterator` 做值
嘅全部原因。`push_front`、`splice` 去前面、`back` 同 `pop_back` 全部都係
O(1)，所以呢度每個操作都係 O(1)，你可以唔使留後路咁講。

有兩樣 Rust 面試冇要求你嘅嘢要搞啱。list node 除咗值之外**仲要**裝住個 key，
因為踢走係由 list 開始，而佢要知道要刪 map 入面邊個項目。而兩個 erase 嘅次序
有關係：先由 `back()` 讀出個 key，喺 map 刪咗佢，*然後*先 `pop_back` — 倒轉嚟做
就係透過一個 iterator 讀一個已經唔存在嘅 node，而呢個 land 由午炮開始講嘅就係
呢樣嘢。

呢度嘅 case 好細，個鐘亦都唔係量速度：四個操作分唔出一個 `std::list` 同一個由
前面掃起嘅 `std::vector`。上面嗰段嘅 `O(1)` 係你喺面試房大聲講嘅句子，所以佢一定
要對你寫嘅 code 成立，而唔係對啱啱好過到四個 case 嘅 code 成立。
'''
hints = [
  "recent.splice(recent.begin(), recent, it) 將 it 指住嘅 node 搬去前面，O(1)，而之後 it 仍然指住同一個 node。成個設計就係建基於呢個操作。",
  "覆寫一個已經存在嘅 key 唔係踢走 — 決定 cache 滿咗之前先 check 個 map。",
  "踢走：攞 back().first，喺 map 刪咗嗰個 key，然後 pop_back。pop_back 之後，map 揸住嘅 iterator 就懸空咗，所以 map 嘅項目要先走。",
  "由頭到尾行個 list 已經係最近用過嘅行先，所以最後一行唔使排序。",
]
