[[quest]]
id    = "cpp.hacker.10.tree-walk"
title = "繞一棵樹嘅三種行法"
story = "白板上面一棵樹，同一條冇人應該要諗兩次嘅問題：講出三種次序。"
brief = '''
第一行係 `n`。第二行係按**層序**嘅 `n` 個值，`-1` 即係
「呢度冇 node」— 所以棵樹嘅儲法同 heap 一樣：index `i` 嘅子節點係
`2i+1` 同 `2i+2`。

印四行：**前序**、**中序**同**後序**走訪，每行用空格分開，然後印 `DEPTH <d>` —
由 root 到 leaf 最長嗰條路上面有幾多個 node。

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

前序係 node、左、右。中序係左、node、右。後序係左、右、node。每次個遞迴都係
同樣三行，淨係 `push_back` 嘅位置郁咗。
'''
hints = [
  "一個遞迴函數，push_back 有三個可以放嘅位，好過三個差唔多一樣嘅函數。",
  "base case 係兩個條件一齊：過咗 vector 嘅尾，或者企喺一個 -1 上面。",
  "深度係 1 + 兩個子節點入面深啲嗰個，冇嘅 node 就係 0。",
]

