[[quest]]
id    = "cpp.hacker.04.grid"
title = "走出大廈"
story = "白板上面一張平面圖，最遠嗰個角有道防火門，面試官望住個鐘，唔係望住你支筆。"
brief = '''
第一行係 `r c`。之後 `r` 行係樓面：`.` 係通路，`#` 係牆。

由左上角 `(0,0)` 出發，去到右下角 `(r-1, c-1)`，只可以經通路嘅格
上、下、左、右咁行。

印出最短路線嘅**步數**，冇路就印 `-1`。
然後印 `REACHED <k>`：由起點行得到幾多個通路格，包埋起點本身。

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

廣度優先，唔係深度優先。深度優先會搵到*一條*路線；條題目問嘅係最短嗰條。
'''
hints = [
  "將 std::deque 當 queue 用 — push_back、pop_front — 呢度 BFS 同 DFS 嘅分別就只係咁多。",
  "一個格 push 嘅時候就標記佢，唔好等 pop 先標，唔係佢會入 queue 幾次。",
  "距離格同時做埋 visited set：-1 即係未見過，所以你唔使第二個結構。",
  "兩個細 array 裝四個位移，好過將主體抄四次。index 之前先用 int 做邊界檢查：呢度 rows 同 cols 特登係 int，所以 r == 0 嘅時候 r - 1 係 -1，唔係一個兜咗圈嘅 size_t。",
]

