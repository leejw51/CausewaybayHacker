[[quest]]
id    = "cpp.hacker.02.window"
title = "冇重複"
story = "你支筆都未放低，第二條題目已經喺白板上面。"
brief = '''
一行文字，冇空格。

印出冇重複字元嘅最長一段嘅長度，然後印嗰段本身。有幾段打和就印最左嗰段。

```
input:  abcabcbb
output: 3
        abc
```

個 window 只會向右郁。如果你發覺自己一見到重複就由頭再掃過，你寫嘅就係
平方嗰個版本。

呢度嘅 case 好細，個鐘亦都唔係量速度。佢都量唔到：喺隨機字串上面，重新掃嗰個
版本每次最多掃幾個字元就撞到重複，所以無論幾大，佢都同個 window 一樣咁快完成 —
喺呢部機以 `n = 200000` 量過，唔係估嘅。呢四個 case check 嘅係長度、最左嘅打和
規則同嗰段本身。照樣寫個 window。佢喺每個輸入都係 `O(n)`，而唔係大部分輸入先係，
而真正嘅面試畀你嘅輸入，係特登揀嚟刁難你嘅。
'''
hints = [
  "記住每個字元最後喺邊個 index 見過，同埋個 window 由邊個 index 開始。",
  "一個重複只係喺佢上一次嘅位置喺目前個 window 入面先有關係 — 即係 previous >= start 嗰個測試。",
  "記低最好嘅長度同佢由邊度開始，唔係最後就印唔到嗰段；substr(start, len) 做埋其餘嘅。",
]

