input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`std::priority_queue` 係 **max**-heap。想當 min-heap 用，就要畀佢
`std::greater<>` 做第三個 template argument — 而要去到嗰度，第二個，即係個容器，
都要寫出嚟：
`std::priority_queue<T, std::vector<T>, std::greater<T>>`。呢個就係成個 C++ 獨有
嘅竅門，亦都係條題目 check 緊嘅嘢。

個 heap 每條 list 裝一個項目，唔係每個元素一個，所以無論啲 list 幾長，佢都保持
大細 `k`。

呢度嘅 case 好細，個鐘亦都唔係量速度，而喺呢條題目冇 case 量得到。將每條 list
倒晒入一個 `std::vector` 再呼叫 `std::sort` 過得到呢啲，大 case 都一樣過到：
`O(N log N)` 對 heap 嘅 `O(N log k)`，唔係執行時限睇得出嘅差距。check 緊嘅係你識唔識
寫 min-heap。面試官想聽嘅係每條 list 一個項目嘅不變式，啲 list 一次過放唔落記憶體
嘅時候，要緊嘅就係呢部分。
'''
hints = [
  "heap 嘅項目要帶住個值由邊度嚟，唔係 pop 咗之後就補唔到貨。std::tuple 先按第一個元素排，正正係你想要嘅。",
  "std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>> — 三個參數全部要寫，唔係你會得到 max-heap。",
  "淨係 pop 咗一條 list 嘅元素先 push 嗰條 list 嘅下一個 — 咁個 heap 就保持喺 k。",
]

