id    = "pytorch.basic.07.sigmoid"
title = "係咪著咗火"
story = "個熱力模型輸出 4.2，而夜更問嘅係個機架係咪就快跳掣。"
brief = '''
一個單一輸出神經元出一個喺 `(-∞, ∞)` 上面嘅原始分數。sigmoid 將佢壓落 `(0, 1)`，喺度可以當係一個機率嚟睇，而決策邊界 —— 分數 0、機率 0.5 —— 就係「係」變做「唔係」嘅地方。

將啲分數變做機率，再喺 0.5 變做係／唔係嘅決定。

