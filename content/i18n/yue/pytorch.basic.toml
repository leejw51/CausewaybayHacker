# PYTORCH LAND — BASIC, in Cantonese. A translation pack (SPEC §12.1):
# the prose of `content/pytorch/basic.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong practitioners actually say them (frontend/src/i18n/yue.ts).

pack   = "pytorch.basic"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.basic.01.night-shift"
title = "夜更"
story = "機房，23:00。控制台吐出一行讀數，係文字，而樓下每件工具都要張量。"
brief = '''
標準輸入會嚟一行用空白分隔嘅數字。將佢變做一個 **float** 張量，印出佢嘅形狀（一個 tuple）同埋總和。

`input().split()` 畀你一個字串 list；`float(t)` 轉換一個。一個 list comprehension 將兩樣砌埋就係成個轉換，`torch.tensor` 接嗰個 list。

總和用 `.item()` 印，佢會由一個 0 維張量攞出個 Python 數字，四捨五入到四個位，咁循環小數就唔會同自己唔啱數。

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
hints = [
  "torch.tensor([float(t) for t in input().split()]) — 拆開、轉換、包起。",
  "一維嘅形狀印出嚟尾有個逗號：(4,)，唔係 (4)。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.basic.02.the-batch"
title = "六個變兩行"
story = "六個數字平平哋由條線傳過嚟。個模型係寫嚟收兩個樣本、每個三個特徵嘅，唔肯收一條平線。"
brief = '''
模型差唔多永遠都唔要一條平線；佢要 `(batch, features)`。`reshape` 將同一批數字變做新形狀，而喺其中一個位寫 `-1` 即係 *由其他位計返呢個出嚟*。

將條平嘅讀數 reshape 做每行三個，有幾多行就幾多行，然後印出形狀同第一行最後嗰個數字。

```
input: 1 2 3 4 5 6
output: (2, 3) 3.0
```
'''
hints = [
  "flat.reshape(-1, 3) — 三個 column，行數自己推出嚟。",
  "reshape(3, -1) 會係三行、每行唔知幾多個，即係反轉咗。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.basic.03.normalise"
title = "冇人傾好嘅尺度"
story = "一個特徵用度數量，下一個用瓦。個模型訓練嘅每一步都用嚟學識瓦數比較大。"
brief = '''
標準化一個特徵，即係減走佢嘅平均值再除以佢嘅標準差，咁每個 column 出嚟都係以零為中心、離散度係一。

`dim=0` 上面嘅平均值係每個 column 一個數字 —— 形狀 `(features,)` —— 由一個 `(batch, features)` 減佢就會沿住啲行 broadcast 落去。標準差都係一樣。

之後印出四捨五入咗嘅每個 column 平均值；照做法佢哋一定係零。

```
input: 1 10 2 20 3 30
output: [0.0, 0.0] [1.0, 1.0]
```
'''
hints = [
  "(x - x.mean(dim=0)) / x.std(dim=0) — dim=0 將啲行壓埋，每個 column 剩返一個數字。",
  "冇 dim=0 你會攞到成個張量嘅平均值，將兩個特徵撈埋一齊。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.basic.04.split-xy"
title = "標籤嗰個 column"
story = "個擷取檔將標籤黐咗喺最後一個 column，個模型一直都喺用答案嚟訓練。"
brief = '''
一張原始表通常將標籤同特徵放埋一齊。拆開佢係兩個 slice：最後一個 column 之前嘅所有嘢，同埋最後一個 column 自己。

`x[:, :-1]` 係每一行、除咗最後嗰個之外嘅每個 column。`x[:, -1]` 係每一行嘅最後一個 column，而 column 嗰條軸會消失，所以出嚟係每行一個數字。

印出兩個形狀，然後印標籤。

```
input: 1 2 0 3 4 1
output: (2, 2) (2,) [0.0, 1.0]
```
'''
hints = [
  "table[:, :-1] 同 table[:, -1] — slice 會留住條軸，單一個 index 就會掉咗佢。",
  "table[:, -1:] 會留住 column 嗰條軸，畀你 (2, 1)，唔係同一個形狀。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.basic.05.layer-by-hand"
title = "一層，逐步寫出嚟"
story = "一層未變做 class 之前係兩個運算，夜更想睇一次冇嘢遮住嘅佢哋。"
brief = '''
一個線性層就係一個矩陣乘法加一個 bias，冇其他嘢。一個形狀 `(batch, in)` 嘅 batch `x`，同一個形狀 `(out, in)` 嘅權重 `W` —— torch 就係咁樣儲佢 —— 輸出係 `x @ W.t() + b`。

`W.t()` 係 `(in, out)`，所以內側嘅維度對得上，而形狀 `(out,)` 嘅 `b` 會喺成個 batch 度 broadcast。

寫出嚟，然後印形狀同四捨五入咗嘅結果。

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
hints = [
  "x @ W.t() + b — 個轉置先令內側維度對得埋。",
  "x @ W 喺度都行得到，因為個矩陣係正方形，但計出嚟係錯嘅嘢。",
]

