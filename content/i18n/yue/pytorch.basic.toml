[[quest]]
id    = "pytorch.basic.14.accumulate"
title = "佢留住咗上一個"
story = "兩次 backward pass，個梯度係算術話嘅兩倍。中間乜都冇清過。"
brief = '''
`backward()` 係**加**入 `.grad`；唔係取代佢。所以同一個參數行兩次，會留低兩個梯度嘅總和，亦即係點解每個訓練 loop 都喺 backward pass 之前清走啲梯度。

行第二次之前先清走啲梯度，咁印出嚟嘅數字就係一次嘅份量：喺 `3.0` 係 `2w`。

```
output: 12.0 6.0
```
'''
hints = [
  "w.grad = None 清走佢；下一次 backward pass 由零開始。",
  "優化器會幫你做 —— opt.zero_grad() 係同一個諗法，套落佢揸住嘅每個參數。",
]

