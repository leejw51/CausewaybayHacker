[[quest]]
id    = "pytorch.basic.13.the-gradient"
title = "呢一點嘅斜率"
story = "個參數係 4.0，損失係佢嘅平方，而一個訓練步驟永遠只問一條問題：邊個方向係落斜。"
brief = '''
將個參數標做可以學嘅，行 forward pass，然後喺損失上面 call `backward()`。`w * w` 嘅梯度係 `2w`，所以喺 `4.0` 佢會以 `8.0` 落入 `w.grad`。

未行過 backward pass 之前 `.grad` 係 `None` —— 第一個訓練 loop 印出 `None` 就停，通常就係因為咁。

```
output: 8.0
```
'''
hints = [
  "loss.backward() — 喺個 graph 嘅尾度 call，永遠唔係喺參數上面。",
  "梯度落入 w.grad；backward() 本身乜都唔 return。",
]

