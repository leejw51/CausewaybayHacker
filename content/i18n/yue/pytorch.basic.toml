story = "優化器未變做 object 之前係一個減數，夜更想睇吓個減數。"
brief = '''
梯度下降係 `w ← w - lr * w.grad`，成個演算法就係咁。佢一定要喺個 graph 熄咗嘅時候做 —— 個更新係記數，唔係模型嘅一部分 —— 所以要放喺 `torch.no_grad()` 入面。

`w` 由 `5.0` 開始，`w * w` 嘅梯度係 `10.0`，`lr` 係 `0.1`。

```
output: 4.0
```
'''
hints = [
  "w -= lr * w.grad — 係減，因為梯度指住上斜。",
  "一定要喺 no_grad block 入面，唔係 torch 唔肯就地改一個 requires grad 嘅 leaf。",
]

