兩個線性層中間乜都冇，就等於一個線性層。activation 先令深度有意義，而 ReLU 係差唔多所有嘢都用嗰個：正數留低，其他變零。

用佢落嗰層嘅輸出度，然後報告有幾多個數字生存落嚟。

```
output: [0.0, 0.0, 1.0, 3.0] 2
```
'''
hints = [
  "torch.relu(z) 留低正數，其他嘢全部壓到零。",
  "(a > 0).sum() 數緊 boolean，因為加埋嗰陣 True 係 1。",
]

