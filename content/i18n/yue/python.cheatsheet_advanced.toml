id    = "python.cheatsheet_advanced.26.all-the-cores"
title = "所有核心"
story = "渲染維園煙花地圖係純 CPU 工作；GIL 一次淨係放一條 thread 入去，所以份工交畀獨立嘅 process。"
brief = '''
`cpu_heavy(x)` 係 module 入面一個頂層 function，而 `p` 係一個
`multiprocessing.Pool`（喺 `__main__` guard 下面）。將 `out` 整做 `xs` 入面
每個 `x` 嘅 `cpu_heavy(x)` 嘅 list，按次序，分散喺啲 process 上面。
'''
hints = [
  "工作係靠 pickle 個 callable 送去另一個 process；lambda 唔可以 pickle。個 pool 嘅 map 收個 function 同個 iterable，分開收。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "python.cheatsheet_advanced.27.all-at-once"
title = "三個一齊，唔係逐個"
story = "駱克道個單位叫咗三個外賣，每個係一秒嘅車程；一個接一個咁叫就令條蟒蛇等三秒。"
brief = '''
`fetch(u)` 係一個 `async def`，佢 await `asyncio.sleep(1)` 然後回傳 `u`。
喺 `async def main()`（由 `asyncio.run(main())` 行）入面，將 `results` 整做
`urls` 嘅結果 list，按次序 —— 三個 fetch 全部**同時**行，令 `main` 大約用
一秒，唔係三秒。
'''
hints = [
  "逐個 await 每個 coroutine 會令佢哋串行。嗰個 combinator 將啲 awaitable 當獨立 argument 咁收，唔係一個 list，而且佢本身一定要被 await。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "python.cheatsheet_advanced.28.generic-first"
title = "任何嘢嘅第一個"
story = "軒尼詩道間藥房想要一個 `first`，對一排藥丸同一排膠布都用得，而個標籤要講明佢攞到嘅係邊樣。"
brief = '''
Python 3.12。`from collections.abc import Sequence` 已經做咗，而且任何地方都
**冇**宣告過 `TypeVar`。寫一個 generic `first` 嘅 `def` 行，佢收一個
`Sequence[T]` 並且回傳一個 `T`，而 `T` 係喺個 function 本身上面宣告。
'''
hints = [
  "3.12 容許一個 function 宣告自己嘅類型參數，喺佢個名後面即刻用方括號。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "python.cheatsheet_advanced.29.shared-bag"
title = "永遠唔會空嘅袋"
story = "大牌檔嘅「新袋」預設值係一個袋，印餐牌嗰陣整一次 —— 而每張信佢嘅單都喺入面搵到上一枱嘅筷子。"
brief = '''
`add(x, xs)` 將 `x` append 落 `xs` 然後回傳 `xs`。冇第二個 argument 咁呼叫兩次，
`add(1)` 然後 `add(2)` 一定要分別得到 `[1]` 同 `[2]` —— 每次一個新 list。
個 body 會喺 append 之前將一個**冇傳**嘅 `xs` 換做一個新嘅空 list。
邊個 `def` 行先啱？
'''
hints = [
  "預設值喺 `def` 嗰陣求值一次，然後每次呼叫都共用。用一個 sentinel，喺入面先砌個 list。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "python.cheatsheet_advanced.30.late-binding"
title = "三個看更，一個數"
story = "謝斐道三個看更每個都被吩咐「記住你個號碼」—— 但佢哋全部記住嘅係個號碼嘅名，到收工嗰陣個個都係 2。"
brief = '''
砌 `fs`，一個有三個零 argument function 嘅 list，令 `[f() for f in fs]` 係
`[0, 2, 4]` —— 每個都將整佢嗰陣嘅 `i` 乘二。
'''
hints = [
  "closure 係喺被呼叫嗰陣先查 `i`，而嗰陣個 loop 已經完咗。預設 argument 係喺整個 lambda 嗰陣求值。",
]
