# RUST LAND — CHEATSHEET, in Cantonese (written colloquially in Traditional characters).
# A translation pack (SPEC §12.1): the prose of `content/rust/cheatsheet.toml`, quest
# by quest, and nothing else. The question is the brief; the four choices are code,
# live in the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "rust.cheatsheet"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet.01.read-all"
title = "成卷帶"
story = "06:30，渣甸坊。個報攤嘅輸入一次過全部嚟到，而佢要晒佢哋。"
brief = '''
用一次呼叫，將 stdin **全部**內容讀入 `s`。

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

係邊一行？
'''
hints = [
  "`read_to_string` 收一個 `&mut String` 然後填滿佢；佢回傳 Result，所以要 unwrap。",
]

