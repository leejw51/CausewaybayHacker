[[quest]]
id    = "rust.cheatsheet.30.char-count"
title = "數霓虹燈"
story = "駱克道上面塊招牌寫住銅鑼灣三個字，而 Mei 第一次數出嚟個數大得離譜。"
brief = '''
`s: &str` 裝住中文字。`n` 係 `s` 入面**字元**嘅數目 —— 所以 `"銅鑼灣"` 係 3，唔係 9。

