# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "最後一個走"
story = "駱克道四個速遞員用同一部對講機報到，而調度員要知道最後一個幾時收線。"
brief = '''
四個 producer，一個 consumer。四個訊息到齊之後，個 `for` loop 一定要完結。

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

空位應該填邊一行？
'''
hints = [
  "個 loop 要等所有 sender 都冇咗先會完。四個 clone 跟住佢哋條 thread 走咗 —— 仲有一個 sender 坐喺 `main` 度。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "一條單軌，四個廚師"
story = "Lucky Mac 嘅夜更廚房：一條落單軌，四個廚師，一次淨係得一個可以睇佢。"
brief = '''
`rx: Receiver<u64>` 係工作隊列。四條 worker thread 各自用 `move` spawn 出嚟，全部都要由呢**一個** receiver 攞工作。邊一行包住 `rx`，令每個 worker 都 clone 到一個 handle？
'''
hints = [
  "Receiver 唔係 Sync，所以跨 thread 共用佢要一把鎖 —— 而把鎖要一個 thread-safe 嘅擁有者，唔係單 thread 嗰種。",
]

