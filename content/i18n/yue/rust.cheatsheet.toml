[[quest]]
id    = "rust.cheatsheet.02.read-line"
title = "換行仲喺度"
story = "訂單寫住 42。收銀機讀嗰陣，換行仲黐住喺度。"
brief = '''
`read_line` 喺 `line` 入面留低咗 `"42\n"`。邊一行可以唔 panic 就將佢變成 `usize`？
'''
hints = [
  "`read_line` 會保留 `\\n`。parse 見到佢就失敗，所以要先 trim。",
]

