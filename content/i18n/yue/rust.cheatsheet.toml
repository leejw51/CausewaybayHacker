`v: Vec<i64>` 升序排好，可能有重複；`t: i64` 可能喺入面，可能唔喺。`i` 係**第一個 ≥ `t` 嘅元素**嘅 index（冇嘅話就係 `v.len()`）—— 經典嘅 lower bound，O(log n)，唔 panic。
'''
hints = [
  "個 slice 分做謂詞成立嘅部分同唔成立嘅部分；回傳嘅 index 係佢唔再成立嘅第一個元素。揀一個對所有*細過* `t` 嘅值都係 true 嘅謂詞。",
]

