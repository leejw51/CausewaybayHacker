[[quest]]
id    = "lua.cheatsheet_advanced.21.format-widths"
title = "節目單嘅欄"
story = "蓮花宮個檔口嘅價錢板對齊成欄，而評判逐個 byte 咁 diff 佢。"
brief = '''
`name` 係 `"tea"`，`price` 係 `3.5`，`n` 係 `7`。印出啱啱好

```
tea       | 3.50|007
```

—— 個名喺 10 欄入面靠左，價錢喺 5 欄入面兩位小數，個數補零到 3 位。
