`print` 喺入面係見唔到嘅。一行，LuaJIT。
'''
hints = [
  "編譯一個 string 會得到一個 function（或者 nil 加一個訊息 —— 所以要 assert）；5.1 嗰個換走 function 嘅 global table 嘅呼叫會回傳同一個 function。",
]
