[[quest]]
id    = "lua.cheatsheet_advanced.28.ffi-array"
title = "真正嘅 C ARRAY"
story = "LÖVE client 底下個錢包 binding 同 C 講嘢；佢交出去嘅 buffer 一定要係一個 C array，唔係 Lua table。"
brief = '''
`ffi` 係 `require("ffi")`，而 `n` 係一個運行時先知嘅數。將 `buf` 整做一個
