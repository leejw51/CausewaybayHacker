id    = "lua.cheatsheet_advanced.30.sandbox"
title = "畀月亮嘅沙池"
story = "午夜。最後一個挑戰係一個陌生人打嘅一行 Lua，而佢喺一間除咗 `x` 乜都冇嘅房入面行。"
brief = '''
`src` 係一個 Lua string，`"return x * 2"`，而 `env` 係 `{x = 10}`。將佢編譯做
