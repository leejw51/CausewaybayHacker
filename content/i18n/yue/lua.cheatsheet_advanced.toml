[[quest]]
id    = "lua.cheatsheet_advanced.29.weak-cache"
title = "識放手嘅 CACHE"
story = "render cache 用燈籠物件做 key；燒完嘅燈籠唔可以被自己嘅 cache 項目留住條命。"
brief = '''
`cache` 將物件（當 key 用嘅 table）對應到計好嘅值。令一個冇其他嘢 reference
嘅物件可以被回收 —— 佢嘅項目跟住消失 —— 而為一個仲生存嘅物件存嘅值就留住。
'''
hints = [
  "弱引用係一個裝住 string 嘅 metatable 欄位；佢入面有邊個字母決定係 key、value，定係兩樣都弱。",
]

