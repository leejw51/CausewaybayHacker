[[quest]]
id    = "lua.cheatsheet_advanced.26.goto-continue"
title = "跳過呢個"
story = "雙數節呢圈休息；個 loop 行過佢哋，唔使將成個 body 包喺一個 `if` 入面。"
brief = '''
```
