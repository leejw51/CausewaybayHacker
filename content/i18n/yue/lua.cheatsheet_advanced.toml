[[quest]]
id    = "lua.cheatsheet_advanced.20.frontier"
title = "成個字"
story = "數節目筆記入面嘅 `the`，Mei 一直連 `there` 同 `thesis` 都捉埋。"
brief = '''
`s` 係 `"the thesis there; the other, the."`。將 `n` 整做 `the` 以**完整一個字**
出現嘅次數 —— 呢度係 `3`，唔係 `6`。（`out` 冇用到。）
