[[quest]]
id    = "lua.cheatsheet_advanced.18.gmatch-pairs"
title = "KEY、等號、VALUE"
story = "鼓隊嘅 config 以一行 `name=value` 對嘅形式喺奧士比街嚟到。"
brief = '''
`s` 係 `"a=1 bb=22 c=3"`。開一個 loop，逐對行過，`k` 係個名，`v` 係啲數字，
兩個都係 string —— `a`/`1`、`bb`/`22`、`c`/`3`。
'''
hints = [
  "pattern 入面每個 capture 都變成一個 loop 變數；冇 capture 嘅話個 loop 攞到嘅係成個匹配，其他乜都冇。",
]

