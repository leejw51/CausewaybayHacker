[[quest]]
id    = "lua.cheatsheet_advanced.27.local-function"
title = "知道自己個名嘅 FUNCTION"
story = "書館街個階乘係 local、遞歸，而且第二次呼叫就死機 —— `attempt to call global 'fact'`。"
brief = '''
將 `fact` 宣告做一個 **local** function，body 係

```
  if n <= 1 then return 1 end
  return n * fact(n - 1)
```

令遞歸呼叫搵得到佢（唔存在叫 `fact` 嘅 global）。寫開頭嗰一行。
'''
hints = [
  "喺 `local x = <expr>` 入面，個名要到個表達式之後先入 scope，所以咁樣賦值嘅 function 值見唔到自己。",
]

