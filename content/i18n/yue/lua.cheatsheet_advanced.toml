[[quest]]
id    = "lua.cheatsheet_advanced.25.bit-test"
title = "個 FLAG 有冇舉起"
story = "每一節嘅狀態係一個 flag 數；司儀檢查 `lit` 嗰一個 bit。"
brief = '''
`flags` 係一個當一排 bit 用嘅數，`i` 係一個由 `0` 數起嘅 bit 位置；LuaJIT 嘅
