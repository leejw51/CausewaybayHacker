[[quest]]
id    = "lua.cheatsheet_advanced.19.gsub-table"
title = "填空"
story = "節目單模板有 `$name` 嘅窿；班底名單填佢哋，而部打印機想知佢填咗幾多個。"
brief = '''
`vars` 係 `{name = "Mei", st = "Tai Hang"}`，而 `s` 係 `"hi $name of $st"`。
將**每一個** `$word` 換做 `vars[word]`，並且將 `n` 整做換咗幾多個 —— 一個呼叫，冇 loop。
'''
hints = [
  "用 table 做替換嗰陣，第一個 capture 就係查找用嘅 key；個數目係個呼叫嘅第二個結果。",
]

