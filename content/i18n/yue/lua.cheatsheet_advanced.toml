[[quest]]
id    = "lua.cheatsheet_advanced.22.sort-strict"
title = "打和唔死機"
story = "四十隊鼓隊，大部分同分，而個 sort 喺評判面前 raise 咗 `invalid order function`。"
brief = '''
`t` 係一個有數字欄位 `score` 嘅紀錄 list，而且**好多都打和**。將佢由最高分
開始排，而 LuaJIT 唔會 raise `invalid order function for sorting`。
'''
hints = [
  "comparator 一定要係嚴格順序：相等嘅元素係 false，而且係一個 boolean，唔係數字。（個 sort 唔係 stable 嘅；打和嘅紀錄可以任何次序出嚟。）",
]

