[[quest]]
id    = "pytorch.hacker.06.one-hot"
title = "唔用個 helper"
story = "面試官話，唔准用 `F.one_hot`。有兩個寫法，佢哋等緊嘅係 scatter 嗰個。"
brief = '''
第一行係 `n c`。第二行係 `n` 個 label。

以整數印出 `n × c` 嘅 one-hot 矩陣，一行一橫。

`zeros(n, c).scatter_(1, labels.unsqueeze(1), 1.0)` 喺每行 label 嗰欄寫一個一。比較嘅寫法 —— `labels.unsqueeze(1) == arange(c)` —— 係另一個收貨嘅答案，而且講出口嗰陣更易解釋。

```
input:  3 4
        2 0 3
output: 0 0 1 0
        1 0 0 0
        0 0 0 1
```
'''
hints = [
  "torch.zeros(n, c).scatter_(1, y.unsqueeze(1), 1.0) —— dim 1，index 嘅形狀同來源一樣。",
  "y.unsqueeze(1) == torch.arange(c) 以 boolean 畀返同一個矩陣，喺面試讀起嚟好啲。",
]

