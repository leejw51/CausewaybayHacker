[[quest]]
id    = "pytorch.hacker.18.adam"
title = "寫 Adam"
story = "憑記憶寫 Adam，三步之後要同 library 對得上。題目問嘅係 bias correction。"
brief = '''
第一行係 `steps lr`。第二行係 `steps` 個梯度，每步一個，用喺一個由 `0` 開始嘅純量參數上面。

印出行完之後你嘅參數，四捨五入到六個小數位，然後印 torch 嘅，然後如果兩者相差喺 `1e-6` 之內就印 `True`。

Adam，`β₁ = 0.9`、`β₂ = 0.999`、`eps = 1e-8`：

```
m = b1*m + (1-b1)*g
v = b2*v + (1-b2)*g*g
mh = m / (1 - b1**t)
vh = v / (1 - b2**t)
w = w - lr * mh / (sqrt(vh) + eps)
```

`t` 由 **1** 開始數。冇 bias correction 嘅話，頭幾步會細得太多，因為 `m` 同 `v` 由零開始。

```
input:  3 0.1
        1 1 1
output: -0.3 -0.3 True
```
'''
hints = [
  "t 由 1 開始，所以用 enumerate(gs, start=1) —— t 係 0 嘅話，第一次 correction 就除以零。",
  "梯度不變嘅話，修正咗嘅 mh/sqrt(vh) 差唔多啱啱好係 1，所以每步大約行 lr 咁遠。",
]

