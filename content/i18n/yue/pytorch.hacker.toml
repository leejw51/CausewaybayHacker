交集係兩個區間喺每條軸上面嘅重疊，**喺零度 clamp** —— 兩個唔掂到嘅框會畀出負嘅闊度，冇個 clamp 嘅話，兩個負數相乘出嚟係正數，個指標就靜靜雞報一個根本唔存在嘅重疊。

```
input:  2 1
        0 0 2 2
        1 1 3 3
        0 0 2 2
output: 1.0
