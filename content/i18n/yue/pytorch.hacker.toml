[[quest]]
id    = "pytorch.hacker.17.grad-accumulation"
title = "塞唔落嘅 batch"
story = "篇 paper 嘅 batch size 係 512，張卡得 128。答案係四次 backward、一次 step，同埋個個都唔記得嗰個除法。"
