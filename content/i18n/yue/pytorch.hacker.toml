[[quest]]
id    = "pytorch.hacker.05.cross-entropy"
title = "寫 cross entropy"
story = "而家寫個損失，喺佢哋交畀你嗰個 batch 上面同 library 對得上五個小數位。"
brief = '''
第一行係 `n c`。跟住係 `n` 行，每行 `c` 個 logits，然後一行 `n` 個 label。

印出你嘅 cross-entropy，四捨五入到五個小數位，然後如果同 `nn.CrossEntropyLoss` 相差喺 `1e-5` 之內就印 `True`。

一個 batch 嘅 cross-entropy 係每行 `-log_softmax(logits)[row, label]` 嘅平均。咁樣寫就穩定、就係一個 `gather`，亦都係佢哋想要嘅答案。寫成 `-log(softmax(x))` 嘅話，就係喺隱藏測試回傳 `inf` 嗰個答案。

```
input:  2 3
        1 2 3
        3 1 0
        2 0
output: 0.28873 True
```
'''
hints = [
  "先 log_softmax，然後 gather 真正嗰個類別，然後取負再攞平均。",
  "預設嘅 reduction 係成個 batch 嘅平均，唔係總和 —— 要對得上 library，呢個係另一半。",
]

