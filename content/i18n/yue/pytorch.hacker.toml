[[quest]]
id    = "pytorch.hacker.12.gelu"
title = "Transformer 入面嗰個"
story = "個 block 入面嘅 MLP 唔用 ReLU 又唔用 sigmoid，考生要寫出佢真正用嗰個。"
brief = '''
第一行係 `n`。第二行係 `n` 個浮點數。

印出你嘅精確 GELU，四捨五入到四個小數位，然後如果同 `nn.GELU()` 相差喺 `1e-5` 之內就印 `True`。

精確 GELU 係 `x · Φ(x)`，`Φ` 係標準常態分佈嘅 CDF：`0.5 · (1 + erf(x/√2))`。`tanh` 嗰個形式係近似，同預設**唔會**對得上 `1e-5`，呢個就係題目個陷阱。

```
input:  3
        -1 0 1
output: -0.1587 0.0 0.8413 True
```
'''
hints = [
  "x * 0.5 * (1 + torch.erf(x / 2 ** 0.5)) —— torch.erf 係誤差函數。",
  "nn.GELU(approximate=\"tanh\") 係另一個；預設係精確嗰個，你要對得上嘅就係佢。",
]

