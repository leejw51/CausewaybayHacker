[[quest]]
id    = "pytorch.hacker.07.normal-equations"
title = "冇梯度下降"
story = "唔訓練都 fit 到條線。最小二乘法有 closed form，佢哋想知你識唔識。"
brief = '''
第一行係 `n d`。跟住係 `n` 行，每行 `d` 個 feature，然後一行 `n` 個 target。

喺一行印出 `d + 1` 個最小二乘係數 —— `d` 個權重，然後係截距 —— 每個四捨五入到四個小數位。

截距嚟自加多一欄一，而答案係 `(XᵀX)⁻¹Xᵀy`。用 `torch.linalg.lstsq`，佢唔使砌個逆矩陣都計到；只要有 bias 嗰欄，面試官兩樣都收。

```
input:  3 1
        0
        1
        2
        1 3 5
output: 2.0 1.0
```
'''
hints = [
  "用 torch.cat([x, torch.ones(n, 1)], dim=1) 加嗰欄一 —— 嗰欄就係截距。",
  "torch.linalg.lstsq(xb, y.unsqueeze(1)).solution —— 右手邊佢要一個矩陣。",
]

