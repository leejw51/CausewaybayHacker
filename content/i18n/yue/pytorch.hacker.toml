[[quest]]
id    = "pytorch.hacker.16.focal"
title = "易嘅唔再計數"
story = "一萬塊背景 patch 同四十塊真嘢，而個損失全部由模型本來已經答啱嘅背景組成。"
brief = '''
第一行係 `n gamma`。第二行係一個二元問題嘅 `n` 個 logits。第三行係 `n` 個 label，每個係 0 或 1。

印出 focal loss 嘅平均，四捨五入到五個小數位，同埋普通 binary cross-entropy 嘅平均，四捨五入到五個小數位。

Focal loss 係 `-(1 - p_t)^γ · log(p_t)`，`p_t` 係模型畀**真正** label 嘅機率。一個有信心又啱嘅預測，`p_t` 接近 1，所以 `(1 - p_t)^γ` 接近零，佢就唔再有貢獻。

```
input:  2 2.0
        4 -4
        1 0
output: 0.00001 0.01815
```
'''
hints = [
  "torch.where(y > 0.5, p, 1 - p) 就係 p_t —— 邊個 label 係真嘅，就係嗰個嘅機率。",
  "gamma = 0 嘅話 focal loss 會變返普通 BCE，呢個係第一樣要行嘅檢查。",
]

