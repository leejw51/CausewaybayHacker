[[quest]]
id    = "pytorch.hacker.13.rmsnorm"
title = "連平均都冇"
story = "新啲嘅模型掉咗置中嗰步，用少啲算術得到同一個結果。寫佢哋留低嗰個。"
brief = '''
第一行係 `n d`。跟住係 `n` 行，每行 `d` 個浮點數。

印出每行正規化之後嘅結果，四捨五入到四個小數位，一行一個。

RMSNorm 除以該行嘅均方根，**唔會**減平均：`x / sqrt(mean(x²) + eps)`。用 `eps = 1e-6`。同 LayerNorm 嘅分別就係咁多，亦都係佢平啲嘅原因。

```
input:  2 4
        1 1 1 1
        0 0 0 2
output: 1.0 1.0 1.0 1.0
        0.0 0.0 0.0 2.0
```
'''
hints = [
  "x.pow(2).mean(dim=-1, keepdim=True) 然後 sqrt —— 要 keepdim，咁佢先會 broadcast 返落成行。",
  "冇減平均，亦冇 bias；一行全部係一，出嚟都係一行全部係一。",
]

