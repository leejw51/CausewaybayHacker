[[quest]]
id    = "pytorch.hacker.15.label-smoothing"
title = "永遠唔會十足肯定"
story = "個模型係啱嘅，但自信得離譜，張 calibration 圖係一個懸崖。"
brief = '''
第一行係 `n c eps`。跟住係 `n` 行，每行 `c` 個 logits，然後一行 `n` 個 label。

印出你 smooth 咗嘅損失，四捨五入到五個小數位，然後如果同 `nn.CrossEntropyLoss(label_smoothing=eps)` 相差喺 `1e-5` 之內就印 `True`。

Label smoothing 將 one-hot target 換成：真正嗰個類別 `1 - eps`，再將 `eps / c` 平均分落**全部** `c` 個類別 —— 包括真正嗰個，你個數字同 library 對唔對得上，就係睇呢個細節。

```
input:  2 3 0.1
        1 2 3
        3 1 0
        2 0
output: 0.42206 True
```
'''
hints = [
  "(1 - eps) * nll + eps * (-logp.mean(dim=1)) —— 第二項係平均分佈嗰部分，覆蓋每一個類別。",
  "eps / c 平均分落全部 c 個類別，啱啱好就係成行 -log_softmax 嘅平均。",
]

