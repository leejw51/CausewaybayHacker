# PYTORCH LAND — HACKER, in Cantonese. A translation pack (SPEC §12.1):
# the prose of `content/pytorch/hacker.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong practitioners actually say them (frontend/src/i18n/yue.ts).

pack   = "pytorch.hacker"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.hacker.01.pairwise"
title = "每一對，冇 loop"
story = "7-32 號房，第五次。第一條題目係個個都會攞到嗰條，一入門口個鐘就開始計。"
brief = '''
第一行係 `n d`。跟住係 `n` 行，每行 `d` 個浮點數。

印出 `n × n` 嘅歐幾里得距離矩陣，每個四捨五入到三個小數位，一行一橫，數值之間用一個空格分隔。

佢哋想聽嘅答案入面冇 Python loop。將 `(n, 1, d)` 同 `(1, n, d)` broadcast，一次過就得到每一個差。

```
input:  3 2
        0 0
        3 4
        0 4
output: 0.0 5.0 4.0
        5.0 0.0 3.0
        4.0 3.0 0.0
```
'''
hints = [
  "(x.unsqueeze(1) - x.unsqueeze(0)) 嘅形狀係 (n, n, d) —— 每一對嘅每一個差。",
  "torch.cdist(x, x) 係 library 嘅答案；面試通常想你將個 broadcast 寫出嚟。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.hacker.02.topk-accuracy"
title = "喺頭五名入面"
story = "篇 paper 話係 top-5，但段 code 計嘅係 top-1。一直冇人留意，直至 reviewer 問攞個數字。"
brief = '''
第一行係 `n c k`。跟住係 `n` 行，每行 `c` 個 logits。最後一行係 `n` 個整數 label。

印出 top-1 準確率同 top-`k` 準確率，每個四捨五入到四個小數位，用一個空格分隔。如果一個樣本嘅 label 喺佢嗰行最大嘅 `k` 個 logits 入面，就算 top-`k` 啱。

`topk` 回傳數值同 index；呢條題目講嘅係 index。

```
input:  3 4 2
        1 2 3 0
        5 1 0 2
        0 1 4 3
        2 0 3
output: 0.6667 1.0
```
'''
hints = [
  "logits.topk(k, dim=1).indices 係 (n, k)，已經由最好排起，所以第 0 欄就係 top-1 預測。",
  "(idx == want.unsqueeze(1)).any(dim=1) —— 靠個 unsqueeze，label 先可以 broadcast 過 k 欄。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.hacker.03.cosine"
title = "睇角度，唔睇長度"
story = "個 retrieval 用 dot product 排名，最長嗰個向量每條 query 都贏，唔理佢講乜。"
brief = '''
第一行係 `n m d`。跟住係 `n` 行 query，每行 `d` 個浮點數，然後 `m` 行文件，每行 `d` 個浮點數。

印出 `n × m` 嘅餘弦相似度矩陣，四捨五入到四個小數位，一行一橫。

餘弦相似度係**正規化**之後嘅向量嘅 dot product。先正規化再乘，個答案就一直係一個矩陣乘法；之後先除嘅話要一個 norm 嘅外積，好多人就係喺度亂咗。

```
input:  2 2 2
        1 0
        0 2
        1 0
        1 1
output: 1.0 0.7071
        0.0 0.7071
```
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) —— 靠 keepdim，個除法先會沿住每行 broadcast。",
  "然後一個矩陣乘法：qn @ kn.t()。零向量會除以零，F.normalize 入面個 eps 就係為咗呢樣。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.hacker.04.stable-softmax"
title = "寫 softmax"
story = "寫 softmax。佢哋第一樣就問呢樣，而佢哋等緊聽嘅，係冇人第一次會寫嘅嗰個減數。"
brief = '''
第一行係 `n c`。跟住係 `n` 行，每行 `c` 個 logits。

每行印出佢嘅 softmax，四捨五入到四個小數位 —— **唔准**用 `torch.softmax`。

一個大 logit 嘅 `exp` 會 overflow 變 `inf`，成行就變 `nan`。先減走每行嘅最大值，數學上乜都冇變，數值上就乜都唔同，因為最大嘅指數變咗 `exp(0)`。

```
input:  2 3
        1 2 3
        1000 1000 1000
output: 0.09 0.2447 0.6652
        0.3333 0.3333 0.3333
```
'''
hints = [
  "x - x.max(dim=1, keepdim=True).values，然後 exp，然後除以該行嘅總和。",
  "max(dim=...) 回傳數值同 index；.values 係你要嗰半，而 keepdim 令個 broadcast 老老實實。",
]

