[[quest]]
id    = "pytorch.hacker.09.iou"
title = "佢哋重疊幾多"
story = "偵測框，同決定一個預測算唔算數嘅嗰個指標。喺零度 clamp 嗰行，就係人哋會唔記得嗰行。"
