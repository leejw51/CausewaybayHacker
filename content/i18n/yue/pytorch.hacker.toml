喺 `k` 個 micro-batch 上面累積梯度，然後 step 一次，等同一個大 batch —— **前提係**每個 micro-batch 嘅損失要先除以 `k`。冇個除法嘅話，梯度大咗 `k` 倍，實際嘅 learning rate 就靜靜雞乘咗上去。

第一行係 `n k`。跟住係 `n` 個浮點數，每個係一個樣本。

印出累積嘅梯度同成個 batch 嘅梯度，每個四捨五入到六個小數位，然後如果兩者相差喺 `1e-6` 之內就印 `True`。

```
input:  4 2
        1 2 3 4
output: 2.5 2.5 True
```
