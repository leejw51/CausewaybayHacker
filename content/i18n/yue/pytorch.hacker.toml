第一行係 `n k d`。跟住係 `n` 個點，每個 `d` 個浮點數，然後 `k` 行 centroid，每行 `d` 個浮點數。

第一行印出每個點嘅分配，然後印 `k` 個更新咗嘅 centroid，一行一個，四捨五入到四個小數位。冇點嘅 centroid 保留佢舊嘅位置。

一次迭代係：用 broadcast 計距離，用 `argmin` 做分配，再逐個 cluster 計一個有 mask 嘅平均。

