[[quest]]
id    = "pytorch.hacker.11.dropout"
title = "寫 dropout"
story = "佢哋話寫 dropout，然後問：inference 嗰陣佢做乜？第二條問題先係真正嗰條。"
brief = '''
第一行係 `n p seed`，`p` 係 drop 嘅機率。

印出生存落嚟嘅比例同輸出嘅平均，每個四捨五入到**一**個小數位，然後如果期望值保得住就印 `True` —— 即係生存落嚟嘅元素有冇乘以 `1/(1-p)`。

得一個小數位，因為實際抽到乜係 generator 嘅事，唔係題目嘅事：檢查緊嘅係，掉走咗 `p` 咁多比例之後，個輸出平均仍然係 1。

呢個係**倒轉式** dropout，每個 framework 都係咁實作：縮放喺訓練嗰陣做，所以 inference 就只係恆等，冇嘢要記、冇嘢要熄。

```
input:  1000 0.5 0
output: 0.5 1.0 True
```
'''
hints = [
  "訓練嗰條路除以 (1 - p)；dropout 同單純清零嘅分別就係咁多。",
  "冇個縮放嘅話，activation 會縮細 (1 - p) 倍，下游每一層喺 inference 都會見到錯嘅尺度。",
]

