[[quest]]
id    = "python.cheatsheet.19.ripples"
title = "漣漪"
story = "雨水由維園一個街口一個街口咁浸出去；水先去到近嘅街，再去遠嘅，而張地圖要講明每個街口行咗幾多格。"
brief = '''
格仔上面嘅 BFS：`dist` 一定要裝住由 `(sr, sc)` 出發嘅**最短**步數，所以啲格要按入隊嘅次序
攞出嚟，O(1)。空位填邊一行？

```
q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
hints = [
  "deque 兩頭 pop 都係 O(1)；你由邊一頭攞，就決定咗呢個係 queue 定係 stack。",
]

