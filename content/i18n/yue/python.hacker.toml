[[quest]]
id    = "python.hacker.06.stack"
title = "下一個大啲嘅"
story = "白板上面一列車費，得一條問題：每個之後，第一個比佢大嘅係邊個。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數。

對每個項目，印出佢**右邊**第一個嚴格大過佢嘅項目，冇就印 `-1`。全部放喺一行，用空格分隔。然後印 `NONE <k>`，即係有幾多個係 `-1`。

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

用一個 stack 裝住答案仲未知嘅位置，佢由底到頂一路保持遞減。每個位置 push 一次、pop 一次，所以無論睇落點，成件事都係行一次。Python 嘅 list 就係個 stack：由尾 `append` 同 `pop` 都係 `O(1)`。

呢度五個測試最多六個數，個鐘喺佢哋身上唔係量速度。大啲嘅測試都唔會，而呢點值得知：天真嘅答案——每個項目都向右行，直到出現大過佢嘅——只係喺已經接近遞減嘅輸入上面先係平方。喺隨機輸入上面，佢平均大約 `ln(n)` 步就停。用呢個 pack 其他地方用嘅產生器砌，200000 個項目喺呢部機行天真版本用咗 **0.09 秒**，stack 版本用 **0.05**，所以冇任何執行時限分得開佢哋。stack 仍然係答案，因為佢喺每個輸入上面都係 `O(n)`，包埋遞減嗰個——但喺呢關，呢個講法你要靠道理接受，唔係靠個鐘。
'''
hints = [
  "個 stack 裝嘅係仲等緊答案嘅 index，唔係值。",
  "新值大過 stack 頂嗰個值嗰陣，嗰個 index 嘅答案就係新值——然後繼續 pop，佢可能大過好幾個。",
  "嚴格大過，所以相等嘅值唔會互相解決；佢哋疊埋一齊，之後一齊解決。",
]

