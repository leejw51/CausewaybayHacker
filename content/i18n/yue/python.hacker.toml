[[quest]]
id    = "python.hacker.30.range-queries"
title = "成日變嘅總數"
story = "成條連鎖店一日三十萬次收銀機操作，一半係更正，而有人要累計總數。"
brief = '''
標準輸入係 `n q seed`。砌一個有 `n` 個值嘅 array，然後行 `q` 個操作，全部由同一個產生器嚟，用會 wrap 嘅 64 位元算術（自己用 mask 截）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

印出每個查詢答案嘅累計總數，然後印 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**呢度嘅複雜度係強制執行嘅。** 天真嘅答案——每個查詢 `sum(values[l:r+1])`——每個查詢係 `O(n)`，而 slice 同 sum 都喺 C 入面行，所以喺任何細嘅輸入上面都快到會呃到你。所以大嘅隱藏測試係 `n = 500000, q = 300000`，天真嘅答案喺度要掂大約 `2 × 10^10` 個元素，喺呢部機行咗**超過三分鐘**，而執行時限係十秒。Fenwick tree 唔使一秒就做晒。兩個都用呢關嘅兩個程式實測。

（呢關嘅 Rust 同 Go 版本行四百萬個操作。Python 行三十萬個，因為一個正確嘅 Fenwick tree 喺 Python 都唔會喺任何老實嘅時限之內做完四百萬個——而重點係分開啱嘅結構同錯嘅結構，唔係分開 Python 同 C。）

面試官想釣出嚟嘅就係呢課：*單點更新、區間求和*，正正就係 Fenwick tree 存在嘅原因。三個短函數——add、prefix，同埋用兩個 prefix 相減嘅 range——而 `i & -i` 就係你按最低 set bit 行一步嘅方法，喺 Python int 上面同喺二補數嘅數上面完全一樣咁用得。
'''
hints = [
  "每個初始值呼叫一次 add 嚟砌棵樹。O(n) 由下而上嘅砌法係個好嘅優化，但唔係個鐘測試緊嘅嘢。",
  "i & -i 抽出最低嘅 set bit——Python 嘅負數做位元運算嗰陣表現得好似二補數咁，所以唔使 wrapping_neg。加佢就係沿樹行上，減佢就係行落。",
  "range(l, r) 係 prefix(r + 1) - prefix(l)，而搞啱嗰對差一，就係大部分 debug 嘅工夫。喺 loop 入面將 self.tree 綁落一個本地變數，喺 CPython 係真嘅加速，亦都係呢關唯一需要嘅微優化。",
]

