  "喺度 BFS 同 DFS 嘅分別就係 deque.popleft()；當 stack 咁用嘅 list 就會變咗另一個。",
  "一格喺 push 嗰陣就標記，唔好等 pop 先標，否則佢會入 queue 好幾次。",
  "距離格同時做埋已到訪集合：-1 代表未見過，所以唔使第二個結構。",
  "r 係 0 嗰陣，grid[r - 1] 唔會 raise。佢會讀最後一行，個搜尋就由地圖底漏咗出去。自己檢查 nr < 0——呢個係 Python 唯一唔會幫你報嘅出界錯誤。",
