印 `VALID` 或者 `INVALID`——呢棵係咪二元搜尋樹，左子樹每個值都嚴格細過個節點，右子樹每個值都嚴格大過？然後每個查詢一行：喺樹入面就印 `<value> FOUND <depth>`，唔喺就印 `<value> ABSENT`，根係深度 1。

