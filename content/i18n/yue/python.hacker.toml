```
input:  10 5 3
output: 209
        LAST 1
```

喺呢啲大小，`C(a, b)` 有幾十萬個位。Python 真係會計出嚟——`math.comb(200000, 100000)` 存在，而且會交返成個數——而呢個就係呢種語言嘅陷阱：佢係啱嘅，每個查詢要幾十毫秒，而佢唔係「模一個質數」嘅意思。每次乘法都要邊做邊約。問題係除法：`a! / (b! (a-b)!)` 喺模算術入面冇意義。取代佢嘅係**模逆元**，而因為 `1000000007` 係質數，費馬小定理就畀咗你：`inverse(v) = v^(p-2) mod p`。Python 三個參數嘅 `pow(v, p - 2, p)` 就係佢，喺 C 入面，一次呼叫。

所以：預先計一次 `factorial[0..n]`，每個查詢用 `f[a] * inv(f[b]) * inv(f[a-b])` 答。

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 200000`、`q = 200000`。每個係數獨立咁計——乘 `b` 項、除 `b` 項，每個一次模逆元——喺十秒嘅執行時限之內行唔完；嗰個就係 starter。一張共用嘅階乘表大約半秒做完。兩個都喺呢部機實測。

