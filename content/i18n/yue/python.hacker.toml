  "新嘅 start <= 最後一個合併區間嘅 end 嗰陣就延長佢；否則 append 一個新嘅。合併咗嘅區間用 list 儲，唔好用 tuple，咁 end 先可以原地改。",
  "延長到 max(last.end, end) — 一個短區間被長區間包住，唔可以令佢縮短。",
