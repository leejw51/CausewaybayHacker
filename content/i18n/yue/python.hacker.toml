[[quest]]
id    = "python.hacker.29.dijkstra"
title = "唔係每條街都一樣長"
story = "你到而家清過嘅每張地圖都係數跳幾多步。電車唔理有幾多個站；佢理嘅係要行幾耐。"
brief = '''
標準輸入係 `n m seed`：`n` 個站，`m` 條無向加權邊。自己砌個圖，用**一模一樣**嘅呢個產生器，用會 wrap 嘅 64 位元算術（自己用 mask 截——Python 嘅 int 唔會 wrap）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

印出由站 `0` 去每個到得到嘅站嘅最短距離總和（包埋 `0` 自己，係 `0`），然後印 `MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**呢度嘅複雜度係強制執行嘅。** 其中一個隱藏測試係 `n = 100000`、`m = 200000`。無論點都係用 Dijkstra；個鐘決定嘅係 priority queue。每次掃晒所有未去過嘅節點搵最細嗰個係 `O(V²)`——`10^10` 步，喺 Python 唔係十六秒，係成個下晝——而執行時限係十秒。用 `heapq` 就係 `O((V + E) log V)`，大約三分之一秒做完。兩個都喺呢部機、用呢關附帶嘅兩個程式實測：starter 就係掃描嗰個版本。

值得睇清楚，因為呢個係限時篩選最常見嘅失手方式：**starter 冇錯。** 佢印出完全正確嘅答案。佢被拒絕，只係因為到得太遲。

`heapq` 係 min-heap，所以 push `(distance, node)`，其餘交畀 tuple 嘅次序。佢冇 decrease-key，你亦都唔使：將改善咗嘅距離當一個新項目 push 入去，pop 出嚟嘅項目如果距離已經差過你記錄咗嗰個，就跳過佢。嗰個「過期項目」嘅跳過就係人哋會唔記得嗰行，冇咗佢 heap 會無止境咁大落去。
'''
hints = [
  "heapq 入面放 (distance, node) tuple：距離排先，就係佢決定項目嘅次序，而 heapq 本身已經係 min-heap。",
  "`if d > dist[u]: continue` 就係過期項目嘅跳過。冇咗佢，演算法仍然啱，但 heap 會塞滿過時嘅項目。",
  '''float("inf") 就係老實嘅「未到過」：佢比較起嚟大過每個 int，鬆弛嗰陣唔使檢查 None。產生器嘅生成樹嗰一半保證每個節點都到得到，所以最尾嗰個過濾永遠唔會刪走任何嘢——都係照留住，因為有到唔到嘅節點嘅版本就係呢條題目嘅追問。''',
