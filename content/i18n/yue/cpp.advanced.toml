id    = "cpp.advanced.16.jthread"
title = "叫停就停"
story = "夜更個泵一直行到有人叫佢停為止，而直到呢更之前，冇人叫得停佢。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

開兩條 `std::jthread`。第一條加總啲值，存低結果。第二條收一個
`std::stop_token`，喺上面註冊一個會設定 flag 嘅 `std::stop_callback`，然後一直
loop 到 `stop_requested()` 為止。喺 `main` 對第二條 thread 呼叫 `request_stop()`，
join 晒兩條，然後印：

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std::jthread` 就係加咗兩樣嘢嘅 `std::thread`，兩樣都係 RAII。佢嘅 destructor 會
**join**，所以 starter 嗰個 abort — 一條仲係 joinable 就被銷毀嘅 `std::thread` —
冇可能發生。佢仲帶住一個 `std::stop_source`：如果 thread 函數第一個參數係
`std::stop_token`，`jthread` 就會傳一個入去，`request_stop()` 會撥佢，而
destructor 喺 join 之前會呼叫 `request_stop()`。一條會 check 自己 token 嘅
thread，係一條你永遠閂得停嘅 thread；唔 check 嗰條就係個 starter。

`stop_callback` 係一條塞住咗嘅 thread 得知消息嘅方法 — 叫停嗰一刻佢就喺叫停嗰條
thread 上面行，平時嘅工作係叫醒 worker 瞓緊喺上面嘅 condition variable。
'''
hints = [
  "將 summer 嘅 std::thread 改做 std::jthread，加 join 之前個 abort 已經冇咗 — 但都係要 join，喺讀 sum 之前。",
  "一個第一個參數係 std::stop_token 嘅 lambda，會自動由行佢嗰條 jthread 攞到一個；接駁就係咁多。",
  "std::stop_callback on_stop(token, fn) 係一個物件：喺 constructor 註冊、喺 destructor 取消註冊，所以佢同個迴圈一樣長命，唔會多。",
