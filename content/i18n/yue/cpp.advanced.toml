  "while (std::cin >> word) 會讀晒每個用空白字元分開嘅 token，直到輸入完；counts[word]++ 就係成個數數迴圈。",
  "一個 vector 可以直接由個 map 嘅 begin() 同 end() 砌出嚟；每個元素係一個 std::pair<const std::string, long long>。",
  "comparator 係一個 lambda，a 要排喺 b 前面就 return true：先按次數由多到少，打和就按字由細到大。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.advanced.08.hashtable"
title = "完全冇次序"
story = "避風塘點名嘅結果按字母排咗返嚟，而港務長想要嘅係啲船真正應嘅次序。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行，每行一個船名。`n` 至少係 `1`，而一個名係一段
冇空格嘅字元。同一個名可以出現多過一次。

每個唔同嘅名印一次，格式係 `<name> <count>`，**按個名第一次出現嘅次序**。然後印
`DISTINCT <k>`。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

兩個 container 單獨都畀唔到你呢樣，而成個任務就係講呢樣。

`std::map` 係一棵樹：行佢會將啲名**排好序**咁畀返你，唔係佢哋應嘅次序。
`std::unordered_map` 係一個 hash table：平均查詢係 O(1) 而唔係 O(log n)，但行佢
會**完全冇指定次序**咁畀返你 — 唔係排好序，唔係插入次序，兩次都唔一定一樣。標準
冇承諾任何次序，所以一個行 `unordered_map` 嚟印嘢嘅程式，輸出係靠佢用嗰個 library
決定。個 starter 正正係咁做，而且得一個唔同名嘅 case 佢仲會過 — 呢個就係破綻：
一個分唔到次序嘅測試，唔係次序啱嘅證據。

兩份工擺兩個 container：一個 `std::vector<std::string>` 記住每個名第一次見到嘅
次序，一個 `std::unordered_map<std::string, long
long>` 負責數。行個 vector 嚟印。
'''
hints = [
  "hash table 係用嚟快啲查。vector 係用嚟記次序。兩樣都要。",
  "`count[name]++ == 0` 每個名淨係 true 一次 — 就係插入嗰次 — 因為 operator[] 會預設構造個值做 0。",
  "行個 vector，逐個名問個 map 攞次數嚟印，永遠唔好行個 map。",
]

