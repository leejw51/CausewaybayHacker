`for (auto it = v.begin(); ...; ++it)` 係 **undefined behaviour** — 通常會行出個尾，
有時睇落用得，而咁更差。

`erase` 回傳指住被刪嗰個之後嘅元素嘅 iterator。用佢：中咗就 `it = v.erase(it)`，
唔中就 `++it`，永遠唔好兩樣都做。C++20 仲有 `std::erase_if(v, predicate)`，一個
呼叫做晒成份工，應該首先答佢；個迴圈係人哋問 `erase_if` 做乜嗰陣先答嘅答案。
'''
hints = [
  "for 頭唔好寫遞增。淨係喺冇 erase 嗰個分支用 ++it 前進；另一個分支 it = erase(it) 已經前進咗。",
  "index 版本都整得好 — erase 之後唔好 ++i — 但要識嘅係 iterator 寫法，因為佢喺 std::list 同 std::map 上面都一樣。",
  "std::erase_if(vector, pred) 回傳刪咗幾多個，正正就係 REMOVED 嗰行。",
]

