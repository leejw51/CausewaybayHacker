[[quest]]
id    = "cpp.advanced.10.algorithms"
title = "船排上一次過"
story = "絞盤記錄係一欄重量。Alex 話寫三個 for 迴圈。阿美話標準庫早就寫好咗。"
brief = '''
標準輸入係一行用空格分開嘅整數。

印四行：

1. 雙數值嘅總和（冇就係 `0`）
2. 每個大過 `10` 嘅值乘二，照次序，用單個空格駁埋 — 冇就印 `-`
3. 有幾多個唔同嘅值
4. `FIRST_BIG <i>` — 第一個大過 `10` 嘅值嘅 index（由 0 開始），冇就係 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

用 `<algorithm>` 同 `<numeric>`，唔好用 index 迴圈：第一行用 `std::accumulate`
加一個 lambda，第二行用 `std::copy_if` 同 `std::transform`，第三行先
`std::sort` 再 `std::unique`，第四行用 `std::find_if`。佢哋個個都收一對
iterator，要做決定嘅就再收一個 lambda。重點唔係個迴圈難寫；而係個名講明咗個迴圈
係做乜嘅。
'''
hints = [
  "accumulate 嘅第四個參數係一個二元函數 (acc, x) -> acc；等佢淨係喺 x 係雙數嘅時候先加 x。",
  "copy_if 要有地方寫 — std::back_inserter(big) 會一路寫一路令個 vector 變大。transform 可以寫返落同一個範圍。",
  "std::unique 將重複嘅搬去尾，回傳一個指住佢哋開始位置嘅 iterator；由 begin() 去到嗰度嘅距離就係唔同值嘅數量。佢淨係睇到相鄰嘅重複，所以先 sort 一個 copy。",
  "find_if 搵唔到就畀返 end()，搵到嘅話 iterator 減 begin() 就係 index。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.advanced.11.templates"
title = "寫一次就夠"
story = "泵房嘅錶板將 largest 寫咗四次 — 公升一次、分鐘一次、泵一次、泵嘅名一次 — 而第五次要喺轉潮之前交。"
brief = '''
標準輸入係兩行：第一行係整數，第二行係字。

寫**一個**兩樣都用得嘅 `largest`，同一個有 `larger()` 同 `smaller()` 嘅 class
template `Pair<T>`。

印最大嘅整數、最大嘅字，然後用頭兩個整數整一個 `Pair`，印
`PAIR <larger> <smaller>`。打和就當 `a` 係大嗰個。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

個 starter 編譯唔到：`largest` 釘死咗喺 `long long`，所以將啲字傳畀佢就係
*no matching function*。一個 **function template**，
`template <typename T> T largest(const std::vector<T>& xs)`，每種用嚟呼叫佢嘅
型別都會印一份出嚟 — `T` 由參數推斷，而個主體對 `T` 嘅唯一要求就係 `>` 用得。

`Pair<T>` 係 class 版嘅同一個諗法。佢啲 method 係 `const`，因為佢哋讀唔寫；佢哋
回傳 `const T&` 而唔係 copy，因為呼叫者淨係想睇。兩個 signature 都講明自己承諾
乜，而編譯器會睇住佢哋。
'''
hints = [
  "喺 largest 前面加 template <typename T>，入面所有 long long 換做 T。啲呼叫唔使改；T 係推斷出嚟嘅。",
  "std::string 本身已經有 operator>，所以同一個 template 主體唔使加任何嘢都編譯到啲字。",
  "Pair<T> 係一個 class template；喺用嗰度先講明型別 — Pair<long long> — 而啲 method 係 const，因為佢哋淨係比較。",
]

