# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.advanced.01.getline"
title = "舢舨記錄簿"
story = "避風塘嘅港務長每隻舢舨記一行：個船名，跟住係佢卸咗嘅嘢，有幾多個數就幾多個數。"
brief = '''
第一行係個數量 `n`。之後嘅 `n` 行每行係一個船名，跟住零個或者多個整數，用空格分開。

每隻船印一行，格式係 `<NAME> <how many numbers> <their sum>`，最後印
`BOATS <n>`。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

呢度嘅單位係行，唔係 token。`std::cin >> x` 去到空白字元就停，而且唔理換行，
所以佢話唔到你知一隻船喺邊度完、下一隻喺邊度開始。`std::getline` 畀你成行；
之後喺嗰行上面開一個 `std::istringstream`，你又可以用返 `>>`，不過只限喺嗰行
入面。

有一樣嘢人人都會中一次：`std::cin >> n` 之後，第一行尾嗰個換行仲喺個 stream
度等緊，第一個 `getline` 會將佢當做一行空行讀咗。
'''
hints = [
  "讀完 n 之後用一個 std::getline(std::cin, junk) 掉咗 >> 留低嘅換行。",
  "std::istringstream fields(line); fields >> name; 然後 while (fields >> value) 行晒其餘嘅 — 冇嘢再 parse 嘅時候個迴圈就完。",
  "船名係嗰行嘅第一個 token，一行得個名就會係 0 0，唔使特別處理。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.advanced.02.references"
title = "copy 唔係本尊"
story = "遊艇會船排嘅絞盤佬每次都將重量寫落張紙嘅副本度，而牆上面嗰張紙永遠冇變過。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

經一個函數 `load` 將每個值推入同一個 `std::vector<long long>`，然後印三行：
`LOADED <how many>`、由一個淨係讀嘅函數 `total` 計出嚟嘅 `TOTAL <sum>`，同埋
`FIRST <value>` — 乜都冇嘅時候就印 `FIRST NONE`。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

個 starter 編譯到，印 `LOADED 0`。`load` 係 **by value** 攞個 vector，所以每次
呼叫都有自己一個 copy，推落嗰個度，回傳嗰陣就掉咗佢。除非你講明，否則 C++ 都係
copy。

用 `&` 講明：型別係 `std::vector<long long>&` 嘅參數係呼叫者個 vector 嘅
reference，唔係佢嘅 copy。`total` 應該攞 `const std::vector<long long>&` — 佢要睇，
唔使郁，而 `const` 就係喺 signature 入面咁講嘅方法，等編譯器幫你睇住。

`FIRST` 係一個指標：`long long* first` 一係係第一個元素嘅地址，一係係 `nullptr`，
而 `nullptr` 就係你跟住佢去之前一定要 check 嘅嗰個值。成個 land 就係呢一句。
'''
hints = [
  "一個字元就整好 load：std::vector<long long>& sheet。呼叫嗰度唔使改；reference 會照寫法綁住個參數。",
  "total 應該攞 const std::vector<long long>& — 個 const 係一個承諾，編譯器會 check。",
  "&sheet.front() 係第一個元素嘅地址，有元素先有意思；寫 *first 之前先 check nullptr。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.advanced.03.vector"
title = "船排中間"
story = "四十隻舢舨喺避風塘泊埋一排。港務長睇到最出同最入嗰隻，中間嘅一隻都睇唔到。"
brief = '''
標準輸入第一行係個數量 `n`，第二行係 `n` 個整數，用空格分開。`n` 至少係 `1`。

印三行：第一個值、最後一個值，同埋嚴格喺佢哋兩個之間所有值嘅總和。少過三個值嘅話，
嗰個總和係 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector` 就係個序列。`front()` 同 `back()` 係兩頭；`begin() + 1` 到
`end() - 1` 係中間，喺嗰個範圍上面行 `std::accumulate` 就係總和 — 只要你交畀佢嘅
起始值係 `long long`。`std::accumulate(first, last, 0)` 會用 `int` 加，因為 `0`
係 `int`，而有一個隱藏 case 嘅中間係裝唔落嘅。
'''
hints = [
  "nums.begin() + 1 同 nums.end() - 1 係 iterator，而 <numeric> 同 <algorithm> 就係用一對 iterator 嚟指一個範圍。",
  "得一個或者兩個值嘅時候，嗰個範圍係空或者倒轉嘅 — 砌佢之前用一個 if 對 nums.size() 守住。",
  "個 0LL 好重要：accumulate 係由起始值推斷結果型別，而淨係 0 就係 int。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.advanced.04.strings"
title = "byte 唔係字"
story = "避風塘嘅告示板將「銅鑼灣」截喺三個 byte，得返一個字。"
brief = '''
讀一行。印三行：

1. 佢有幾多個 **byte**
2. 佢有幾多個 **字元** — UTF-8 code point
3. 將啲字元倒轉咗嘅嗰行

```
input:  causeway
output: 8
        8
        yawesuac
```

嗰行可能有 ASCII 以外嘅字元，噉頭兩個數就唔一樣。`std::string::size()` 係 byte
數，一向都係。`std::string` 對編碼一無所知；佢係一串 `char`，而一個 `char` 就係
一個 byte。

UTF-8 唔使解碼都好易數：每個 code point 都係由一個**唔係** `10xxxxxx` 形式嘅 byte
開頭，而每個延續 byte 都係。所以一個 byte `c` 喺 `(c & 0xC0) != 0x80` 嘅時候
先係一個字元嘅開頭。倒轉嘅係字元，唔係 byte — 直接對個字串用 `std::reverse` 會將
`銅` 斬開三舊，再倒轉咁印出嚟。
'''
hints = [
  "用 unsigned char 行啲 byte；普通 char 可能係 signed，噉對 0x7F 以上嘅嘢做位測試就會出錯。",
  "每個字元收做一個細細嘅 std::string，將佢哋個 vector 倒轉，再駁埋。",
  "數 (c & 0xC0) != 0x80 嘅 byte，唔使解碼任何嘢就係字元數。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.advanced.05.classes"
title = "船排帳簿"
story = "遊艇會船排每次拉船上岸都收錢，啲記錄擺喺同一個地方 — 起碼喺個建議將個 class 換咗做一句註解之前係咁。"
brief = '''
第一行係 `<BOAT> <n>`。之後嘅 `n` 行係 `<ITEM> <CENTS>`。

幫隻船砌一個收集啲項目嘅 `Ledger`，然後照到達次序將每個項目以 `<ITEM> <CENTS>`
印返出嚟，跟住印 `TOTAL <sum>`，再印 `BOAT <name> <count>`。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` 可以係 `0`，噉輸出就得最後兩行。

`class` 就係一個成員預設 private 嘅 `struct`，除非你寫 `public:`。constructor
喺個主體有機會行之前就行咗，所以成員係喺 **initialiser list** 度設定 —
`Ledger(std::string boat) : boat_(std::move(boat)) {}` — 而唔係喺大括號入面賦值。
`total()` 乜都唔改，所以佢宣告做 `const`，亦只係因為咁先可以喺一個
`const Ledger&` 上面呼叫佢。
'''
hints = [
  "一個 std::vector<std::pair<std::string, long long>> 已經夠。個 class 喺度係為咗等本帳簿擁有自己啲記錄。",
  "initialiser list — : boat_(std::move(boat)) — 喺成員構造嗰陣就設定佢；喺大括號入面賦值會先整一個空字串，然後再覆寫。",
  "用 const reference 回傳啲項目，等 main 唔使 copy 個 vector 都行得晒，同埋每個唔改帳簿嘅 method 都標 const。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.advanced.06.enum-class"
title = "邊個揸緊舵"
story = "遊艇會閘口對每張卡都收會員價，包括唔係會員嗰啲，同埋嗰張根本唔係卡嘅。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行 `<TYPE> <HOURS>`。

基本收費係 `500 + 100 * HOURS` 仙。每行印以下其中一樣：

* `MEMBER` — 基本收費
* `CREW` — 基本收費嘅一半，整數除法
* `JUNIOR` — 永遠係 `200`
* 其他 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

將張卡做成一個有四個值嘅 `enum class Card`，其中一個係 `Other`。`enum class`
嘅值唔會偷偷轉做 `int`，亦唔會將啲名漏出去外面個 scope — 普通 `enum` 兩樣都會，
而正正因為咁先應該寫前者。

C++ 嘅 enum 唔可以帶 payload，所以認唔到嘅 tag 要喺隔籬跟住：一個細細嘅
`struct Tag { Card card; std::string raw; }`。用一個 `switch` 決定收費。每個
enumerator 都 cover 晒，編譯器就冇嘢好警告；漏咗一個，`-Wall` 會話你知係邊個。
'''
hints = [
  "Card::Other 係第四個 enumerator；佢認唔到嘅字串就住喺隔籬嘅 Tag::raw。",
  "switch (tag.card)，每個 enumerator 一個 case，喺每個 case 入面直接 return — 每個 arm 都 return 就唔使 break。",
  "std::to_string 將個數變做 std::string；UNKNOWN 嗰行就係用 + 駁字串。",
]

