[[quest]]
id    = "cpp.advanced.17.dangling"
title = "懸空"
story = "維園嘅泵房，噴水池下面兩層。一條泵 thread 仲讀緊一個收更嗰陣間房已經釋放咗嘅 buffer。"
brief = '''
第一行係 `w n`：`w` 個泵同 `n` 個讀數。第二行係啲讀數。

`pump(w, buffer)` 開 `w` 條 thread；第 `i` 條將由 `i * n / w` 到
`(i + 1) * n / w` 嘅讀數加入 `partial[i]`，而 `pump` 回傳啲 partial。`main` 每個印
`PUMP <i> <sum>`，再印 `TOTAL <sum>`，然後如果所有嘢做完嗰陣個 buffer 已經釋放咗
就印 `FREED yes` — 經一個 `std::weak_ptr` 觀察。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

個 starter 會 abort。`pump` 喺一個本地 vector 入面砌啲 thread，佢哋仲係 joinable
就回傳，所以個 vector 嘅 destructor 呼叫 `std::terminate`。睇吓佢本來打算做乜：
嗰啲 thread 揸住 `buffer` 嘅一個 **reference**，而 `pump` 嘅呼叫者就快要由得
`buffer` 死。一條喺 vector 嘅 destructor 行咗之後仲讀佢嘅 thread，係讀緊已釋放嘅
記憶體。有時佢攞到舊啲數。有時攞到下一次分配嘅嘢。有時 allocator 已經將啲 page
交返出去，佢就 segfault。呢個係 undefined behaviour，而且係最貴嗰種，因為佢唔係喺
錯嘅地方出事。

修正擁有權，唔係修正症狀。個 buffer 係一個
`std::shared_ptr<const std::vector<long long>>`，每條 thread capture **自己一份
handle 嘅 copy**，而個 buffer 嘅生命啱啱等於最後一條揸住佢嘅 thread — 無論 `pump`
點樣回傳、啲 thread 用乜次序完成。回傳之前 join。`main` 留住一個 `weak_ptr`，喺
`pump` 回傳兼掉咗自己個 handle 之後，`expired()` 就係證據：啲讀數由最後完成嗰個
泵釋放咗一次，而且冇人仲讀緊。

成個 land 就係呢一個程式。冇嘢 check 過你。你令生命期同用法對得上，而做到呢樣嘅
工具 — 會計數嘅 smart pointer、會等嘅 join — 就係你喺 basic 路上面見過嘅同一個
RAII。
'''
hints = [
  "pump 入面改兩樣：by value capture buffer（個 shared_ptr），唔好 by reference capture readings；回傳之前 join 晒每條 thread — 將一個 std::vector<std::jthread> 擺喺自己個 block，收尾大括號度就會 join。",
  "lambda 嗰份 shared_ptr copy 就係令個 vector 生存嘅嘢；佢喺 thread 函數回傳嗰陣釋放，唔係 pump 回傳嗰陣。呢個就係 reference 同擁有者嘅分別。",
  "partial 仍然係 by reference capture，而咁係啱嘅：pump 擁有佢，pump 回傳佢之前會 join，而每條 thread 淨係寫自己嗰格。",
  "main 刻意將自己個 handle move 入 pump。如果佢留住一個，FREED 就會係 no — 個 buffer 會因為 main 仲揸住而生存，而呢個 boss 亦接受你解釋得到呢個另一個答案。",
]
