[[quest]]
id    = "cpp.advanced.07.maps"
title = "避風塘嗌緊乜"
story = "正午嘅避風塘：每隻舢舨都嗌緊啲乜，港務長想要個排名。"
brief = '''
讀晒成個標準輸入，按空白字元切開。

每個唔同嘅字印一次，格式係 `<word> <count>`，按次數由多到少排，次數一樣就按字由細到大排。

```
