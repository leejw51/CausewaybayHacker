[[quest]]
id    = "cpp.advanced.09.set-and-pair"
title = "邊個泊喺邊"
story = "泊位板將同一隻舢舨喺同一個泊位列咗兩次，冇人講得出邊幾行係重複嘅。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行 `<BERTH> <NAME>`。

每個唔同嘅 `<BERTH> <NAME>` 組合印一次，先按泊位再按名排，然後印 `DISTINCT <k>`
同 `DUPES <n - k>`。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

一個 `std::set<std::pair<int, std::string>>` 一次過做晒三份工：佢唔收已經有嘅嘢
嘅第二份，佢自己保持排好序，而 `std::pair` 本身嘅比較方式正正係輸出想要嘅 — 先比
第一個元素，再比第二個。用 range-`for` 行佢，用 **structured binding**
`const auto& [berth, name]` 拆開每個 pair，唔好用 `.first` 同 `.second`。
'''
hints = [
  "換個 container：std::set<std::pair<int, std::string>>。插入重複嘅嘢唔係錯誤，只係乜都唔做。",
  "set 係按元素型別嘅 operator< 排，而 std::pair 先比 first 再比 second — 正正係輸出想要嘅先泊位後名嘅次序。",
  "for (const auto& [berth, name] : moorings) 將每個 pair 拆做兩個名；n 減個 set 嘅大細就係重複數。",
]

