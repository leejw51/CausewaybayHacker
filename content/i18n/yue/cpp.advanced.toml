        bus 1
```

`std::map<std::string, long long>` 按 key 排，`std::unordered_map` 乜都唔按，
兩個都唔係按次數排 — 所以排名係另一步：將啲 entry 抄入一個裝 pair 嘅
`std::vector`，再用一個 comparator 做 `std::sort`。對一個唔存在嘅 key 做
`counts[word]++` 會先用 `0` 插入佢，正正係數數迴圈想要嘅。
'''
