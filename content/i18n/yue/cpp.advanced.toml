[[quest]]
id    = "cpp.advanced.15.undefined-behaviour"
title = "編譯器假設咗"
story = "泵房嘅公升計數器係一個 int，而去到 2147483647 公升，編譯器早就假設咗佢永遠唔會去到。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數，每個都裝得落一個 `long long`。佢哋嘅
累計總數都裝得落 `long long`。

印兩行：如果沿途每個累計總數都裝得落一個 32 位 `int` 就印 `INT32 OK`，否則印
`INT32 OVERFLOW <i>`，<i> 係第一個會將佢推出範圍嘅值嘅 index（由 0 開始）；然後印
`INT64 <total>`。

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

個 starter 用一個 `int` 裝總數，無論發生乜都印 `INT32 OK`。加個明顯嘅 check —
`if (total + v < total)` — 係整唔好嘅，因為嗰個 check 係用佢想搵嗰個 overflow 嚟
寫，而**有號 overflow 係 undefined behaviour**。編譯器有權假設 UB 唔會發生，所以對佢
嚟講，`v` 係正數嘅 `total + v < total` *永遠係 false*，喺 `-O2` 底下 gcc 同 clang
都會刪走個測試。錯嘅數唔係 optimiser 嘅 bug，係合約。

呢個 land 行嘅規則：undefined behaviour 唔係「某個值」。佢係編譯器假設一樣嘢冇可能，
再由嗰度推理落去。所以你永遠唔好靠觸發 overflow 嚟偵測佢。你要喺加法*之前*偵測，
用一個闊啲嘅型別，或者同上下限比較 — `std::numeric_limits<int>` — 而呢個程式嘅
預期輸出冇靠任何未定義嘅嘢。
'''
hints = [
  "用 long long 裝總數，每次加完同 std::numeric_limits<int>::min() 同 max() 比較。永遠唔會有 int 運算發生。",
  "淨係記第一個出範圍嘅 index；後面嘅值可能會將總數帶返入範圍，而問題問嘅係佢第一次喺邊度出去。",
  "如果你一定要加兩個 int 又想知安唔安全：加之前 check v > INT_MAX - total，唔好加完先睇個和嘅正負號。前者有定義；後者就係編譯器會刪走嗰樣。",
]

