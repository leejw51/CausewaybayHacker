```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node 喺**一條 thread** 上面行你嘅 JavaScript，而成座大廈每塊螢幕都等緊佢。一個行緊嘅 callback 係打斷唔到嘅——timer 唔得，I/O 唔得，塊牌都唔得——直到佢 return 或者 `await`。starter 將每段包喺一個 `async` 函數入面，全部交畀 `Promise.all`，睇落好似並行。其實係一個長長嘅 callback：一個入面冇 `await` 嘅 `async` 函數，一呼叫就由頭行到尾。`main` 未放手之前 `k` 段已經全部計完，塊牌最後先重畫，顯示 `BOARD 3`，而喺 `4 2000000` 嗰陣，全島每塊螢幕喺成個加總期間都顯示同一格畫面。你喺度寫乜都冇辦法令啲加總並行；Node 嘅答案係 worker thread，而呢個 `node.d.ts` 冇宣告佢。async 係用嚟**等**嘅。喺嗰一條 thread 上面嘅 CPU 工作，只可以整得**有禮貌**啲。

咁就有禮貌啲：一段，然後交返條 thread，然後下一段。仲要交返去啱嘅隊。`await null` 或者 `await Promise.resolve()` 讓畀 **microtask** 隊，Node 會將佢清到空，先至行任何一個 immediate 或者 timer——塊牌仍然會見到 `BOARD 3`。`await new Promise((r) => setImmediate(r))` 會排去隊尾，喺塊牌後面，因為塊牌排先。

仲有個細 bug，同時序大有關係。starter 用 `total += await work(...)` 加埋。JavaScript 喺 `await` **之前**計 `+=` 左手邊：每個 task 都將 `total` 讀做 `0`，泊低，返嚟寫 `0 + 我嘅`。最後嗰個贏，`TOTAL` 就係最後一段。呢個就係收費計數器嗰個遺失更新，只係讀同寫之間冇一行 code 畀你睇到——對共用狀態嘅一次讀同一次寫，中間隔住一個 `await`，就係一條 thread 上面嘅 race。喺 await 之後先讀個總數，或者揸住把鎖。
