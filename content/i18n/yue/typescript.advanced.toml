[[quest]]
id    = "typescript.advanced.19.mutex"
title = "一個計數器，八塊螢幕"
story = "島上每塊螢幕都將播放次數報去三十樓嗰一個收費計數器，到咗半夜，計數器話得一次播放，而每塊螢幕都發誓自己報咗。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

每個值開一個 async task，一次過全部開。每個 task 讀個共用計數器，去收費伺服器行一個**來回**（starter 嘅 `roundTrip()`，event loop 行一轉），然後將計數器寫返入去：總數加上佢個值，hits 加一。等齊晒佢哋，然後印 `TOTAL <sum>` 同 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

JavaScript 得一條 thread，啲人會話你知咁即係冇 race。佢冇嘅係 **data** race：永遠冇兩行 code 喺同一刻行。其他種類嘅 race 佢全部都有。starter 啲 task 全部讀咗計數器，全部泊喺個來回度，全部返嚟寫 `我讀到嘅 + 我嘅`——而佢哋每個讀到嘅都係 `0`。最後寫嗰個贏：`TOTAL 4`、`HITS 1`，確定咁、次次都係。讀同寫之間嘅一個 `await` 就係一道門，乜嘢都可以行入嚟。

個來回要留住；佢就係份工。將讀、來回同寫用一把鎖包住。starter 有個 `Mutex` class，簽名啱晒，但入面冇鎖——`run` 淨係呼叫個 critical section。將佢變成真嘅，淨係用 Promise 砌：留住一個 `tail` promise；每個呼叫者駁落 tail 後面，用一個自己嘅 promise 換走佢，等舊嗰個，行，然後喺 `finally` 入面 resolve 自己嗰個，咁一個 exception 都唔會令把鎖一直俾人揸住。
'''
hints = [
  "行吓個 starter：TOTAL 係最後嗰個值，HITS 係 1。每個 task 都喺任何 task 寫之前讀咗計數器；佢哋就係喺個來回度擦身而過。",
  "把鎖係一條 promise 隊。`const ahead = this.tail; this.tail = <a new promise you can resolve>; await ahead;`——然後行，然後 resolve 你嗰個。",
  "喺 `finally` 入面 resolve，喺 try 入面 `return await critical()`，咁釋放先會喺 critical section 行完之後先發生，而唔係喺佢個 promise 啱啱整出嚟嗰陣。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.advanced.20.channel"
title = "邊個閂條 feed"
story = "控制室將每個到站時間沿住條 feed 推去怡和街塊牌，最後一個之後，塊牌坐喺度等一個永遠唔會嚟嘅下一個，然後就黑咗。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

一個 producer task 將每個值乘十送落一條 `Channel`，event loop 每轉一個，然後**閂咗**佢。main task 一路收，直到條 channel 話佢閂咗為止，印每個值、計住總數，然後印 `SUM <total>` 同 `CLOSED`。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

starter 嘅 `Channel` 係完整嘅：`send`、`receive`，同埋 `close`——佢會用 `undefined` 叫醒每個等緊嘅 receiver。個 producer 從來冇呼叫 `close`，所以最後一個值之後，receiver 就 await 緊一個永遠冇人會 resolve 嘅 promise。

喺 Go 嗰度，呢個係 `fatal error: all goroutines are asleep - deadlock!`。喺 Python，就係 hang 住直到 runner 殺咗佢。Node 兩樣都唔係。當 event loop 冇嘢剩低可以叫醒任何嘢——冇 timer、冇 I/O、冇 immediate——個 process 就咁**退出**，status `0`，喺你個 `for (;;)` 中間。`SUM` 嗰行同 `CLOSED` 嗰行永遠唔會行，由外面睇好似成功咗咁。呢個仲衰過 crash，而 starter 就係咁。

由 producer 閂條 channel。永遠唔係 consumer——知道條流完咗嗰邊，就係結束佢嗰邊。
'''
hints = [
  "一行，放喺 control 嘅最尾：feed.close()。",
  "receiver 已經有檢查 `=== undefined`。佢係等緊一樣 producer 從來冇送嘅嘢。`if (!value) break` 都會停——但係喺第一個 0 就停，而其中一個隱藏測試就係送 0。",
  "如果 undefined 可以係 channel 上面一個真嘅值，receive 就會改為回傳 { done: true } | { done: false, value: T }——同 iterator 嘅 next() 回傳嘅形狀一樣，原因都一樣。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.advanced.21.worker-pool"
title = "八部編碼器"
story = "希慎廣場幅牆有四十段片要 render，機架上面有八部編碼器。冇人想要四十部編碼器；佢哋要嘅係嗰八部永遠唔停手。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

行一個有 `w` 個 worker 嘅 pool。每個 worker 一路 loop：攞下一個未有人認領嘅 index，`await render(index, value)`——佢會喺 event loop 行幾轉之後回傳 `[index, value * value]`，轉幾多轉視乎個 index——然後將呢對嘢 push 落 `results`，直到冇 index 剩為止。等齊每個 worker，按 index 排好啲結果，一行一個印 `<index> <value>`，然後印 `WORKERS <w>`。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

啲對係按工作**做完**嘅次序到嘅，唔係開始嘅次序；喺結果入面帶住個 index，先令到每次行嘅輸出都一樣，而按佢排序就係答案嘅最後一行。

`const i = next++` 唔使鎖，而經過上一關之後值得知道點解：讀 `next` 同加一之間冇 `await`，所以冇其他 worker 可以插入嚟。把鎖從來都只係喺跨越 `await` 嗰陣先需要。

starter 用 `workers.forEach(async (w) => {
await w; })` 等啲 worker。佢編譯到，而佢乜都冇等：`forEach` 呼叫個 async callback，攞返一個 promise，然後掉咗佢。每個 callback 都有 await；`main` 就一個都冇 await，印出一個空嘅結果。
'''
hints = [
  "用 await Promise.all(pool) 取代個 forEach。forEach 永遠唔會等佢個 callback 回傳嘅任何嘢，async 唔 async 都一樣。",
  "啲結果按做完嘅次序到；每對入面個 index 係佢從邊度嚟嘅唯一記錄，排序就將佢放返原位。",
  "`for (const running of pool) await running;` 都得。唔得嘅係任何收 callback 嘅 array 方法——map、forEach、filter——當佢會幫你 await 個 callback 咁用。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.advanced.22.async-await"
title = "ASYNC 其實喺邊度行"
story = "Mei 寫咗四年 `await`，但從來未見過推動佢嘅嗰樣嘢。控制室得一個 loop，島上每塊螢幕輪流用佢。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

`async function double(value)` 讓出一次——`await null`——然後回傳個值乘二。用 `Promise.all` 行晒 `n` 個，按輸入次序印每個結果，然後印 `SUM <total>` 同 `TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

starter 個 `run` 將啲值經 `double` map 一次，得到一個 **promise** array——然後話畀 compiler 知佢係一個數字 array：

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc` 接受，因為 `as unknown as` 就係叫佢唔好再檢查嘅寫法。呢個 cast 同其他所有型別一齊被抹走，執行時個 array 仍然係 promise：輸出係三次 `[object Promise]`，同一個由佢哋黐埋一個零而成嘅字串 `SUM`。cast 唔係轉換。佢改變 compiler 相信乜，但完全冇改變個值。

`Promise.all` 收啲 promise，resolve 出佢哋嘅結果，**按你傳入嘅次序**，唔理佢哋係咩次序做完。

咁全部喺邊度行？喺嗰一條 thread 上面，輪住行。`await null` 將函數剩低嘅部分放上 **microtask** 隊，Node 會將呢條隊完全清空，先會掂 timer、immediate 或者任何 I/O——即係 macrotask。一個喺一千個 await 之前排好嘅 `setTimeout(..., 0)`，仍然係喺佢哋全部之後先行。呢度冇嘢係並行嘅；嘢係輪住行，喺佢哋講明可以停嘅地方停。
'''
hints = [
  "刪咗個 cast，睇吓 tsc 講乜：Type 'Promise<number>[]' is not assignable to type 'number[]'. 呢個 error 就係個 cast 收埋咗嘅真相。",
  "return Promise.all(nums.map((v) => double(v)))——個 await 喺呼叫者嗰邊，run(nums) 被 await 嗰度。",
  "Promise.all 保持參數次序。如果你想按做完嘅次序攞結果，就要自己帶住個 index，同 worker pool 一模一樣。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.advanced.23.work-queue"
title = "邊個話做完"
story = "三個操作員清緊螢幕更新嘅隊，值班主管等條隊話佢空咗。佢永遠唔會咁講，因為冇人話佢知一個更新做完咗，到 23:10 成個 console 黑晒。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

將 `[index, value]` 對放上 starter 嘅 `WorkQueue`。開 `w` 個 consumer task，一路 loop：攞一對、等一轉、將 `value * 10` 寫入 `results[index]`，然後呼叫 `taskDone()`。main task await `queue.join()`，然後閂咗條隊，等 consumer 嘅 `get()` 回傳 `undefined`、佢哋停低，await 佢哋，然後按 index 次序印結果同 `CONSUMERS <w>`。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join()` 喺每一個曾經 `put` 過嘅項目都有一個對應嘅 `taskDone()` 之後就會 resolve。starter 啲 consumer 從來冇呼叫佢。所以 `main` 等緊 `join`，consumer 喺 `get` 度等永遠唔會嚟嘅項目，event loop 上面冇剩任何可以叫醒任何人嘅嘢。

呢個就係 **deadlock**——個個都等緊，冇人郁——而佢唔使 thread，亦都唔使鎖：兩個 promise 互相等對方郁就夠。兩個 task 用相反次序攞兩把 async mutex，係同一樣嘢，只係多啲儀式。Node 對佢嘅回應同上一關一樣：loop 行到乾，個 process 退出，status `0`，乜都冇印過。

修正又係一行，喺 consumer 嗰邊。
'''
hints = [
  "每處理完一個項目就 queue.taskDone()。join 淨係將 put 同 taskDone 對數，其他乜都唔理。",
  "行 starter，佢乜都唔印，exit 0。唔係 crash，唔係 hang：event loop 冇晒可能會發生嘅嘢。",
  "close() 會用 undefined 叫醒每個泊喺 get() 度嘅 consumer，結束佢哋嘅 loop；所以 main 喺 join 之後先可以 await 佢哋。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.advanced.24.finally"
title = "把鎖始終都會鎖返"
story = "控制室每次更新都會解鎖一個廣告商嘅時段，更新完再鎖返。22:40 收到壞更新嗰個由嗰陣開始一直冇鎖，因為上鎖嘅 code 喺出錯嗰行後面。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行 `<NAME> <CENTS>`，`CENTS` 理論上係一個整數。

寫一個 generator `opened(name)`，印 `OPEN <NAME>`，yield 一次，然後印 `SHUT <NAME>`——**唔理個 body 有冇 raise**。body 係一個 `for (const _ of opened(name))` loop，解析 cents 然後加落總數。cents 解析唔到嘅一行，要喺個時段閂咗之後報做 `BAD <NAME>`。最後印 `TOTAL <sum>` 同 `REJECTED <k>`。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

對 generator 用 `for...of` 係一個資源守衛，原因係咁：當 loop body 提早離開——`break`、`return`，或者 exception——`for...of` 會呼叫 generator 嘅 `return()`，佢會喺**個 `yield` 度**恢復 generator，當個 `yield` 係一句 `return` 咁。`yield` 後面嘅 code 唔會行。包住個 `yield` 嘅 `finally` 入面嘅 code 就會行。starter 冇 `finally`，`WONG` 個時段永遠閂唔到。

TypeScript 5.2 有 `using` 同 `Symbol.dispose` 正正係做呢樣嘢，但呢度冇：`es2023` 函式庫冇 `Symbol.dispose`，所以 `using` 編譯唔到。`using` 本身就係用 `try`/`finally` 砌出嚟。

唔好喺 generator 入面 catch 個 error。呼叫者要印 `BAD`，而一個吞咗個 error 嘅 generator 會當乜事都冇咁印 `TOTAL`。
'''
hints = [
  "try { yield; } finally { console.log(`SHUT ${name}`); }——finally 就係每條路都會行嘅部分。",
  "return() 行完個 finally 之後，個 exception 會經 for...of 傳出去，所以 main 個 catch 仍然睇到佢——所以 BAD 喺 SHUT 之後先印。",
  "generator 唔係唯一方法：一個 `withSlot(name, body)` 函數，用 try/finally 包住 `body()`，做到同一件事。generator 嘅寫法係展示 for...of 離開時做咗乜嘅嗰個。",
]

