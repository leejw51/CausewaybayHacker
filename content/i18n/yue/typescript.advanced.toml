story = "控制室重畫全島地圖之前會 ping 每塊螢幕攞狀態，而天后嗰塊網卡壞咗嘅螢幕永遠唔答，所以地圖永遠重畫唔到。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行 `<SCREEN> <DOWN>`，`DOWN` 係 `0` 代表即刻會答嘅螢幕，`1` 代表網卡壞咗、完全唔會答嘅螢幕。

