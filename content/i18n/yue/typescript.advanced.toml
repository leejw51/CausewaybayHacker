# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.advanced.01.conversions"
title = "一個名，一個樣"
story = "19:00，三十樓嘅控制室。個 feed 將時代廣場個時段價錢當文字咁傳過嚟，收費螢幕要佢係數字，大螢幕就要佢係蚊。"
brief = '''
讀一行：一個以仙為單位嘅金額，全部係數字。

印三行：

1. 剪走頭尾空白之後嘅文字有幾多個字元
2. 個金額作為一個數字
3. 個金額以蚊為單位，啱啱好兩個小數位

```
input:  1234
output: 4
        1234
        12.34
```

個金額唔會係負數。喺 Python 你會將同一個名重新綁定三次。
TypeScript 唔畀你咁做：一個名出世嗰陣係乜型別，就一世都係乜型別，所以

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

一行都未行就已經失敗。呢個就係份合約做緊佢嘅工作。每個樣都畀佢一個自己嘅
`const` —— 文字、數字、蚊 —— 咁睇碼嘅人就唔使捲返上去睇個名而家裝緊乜。

計蚊嗰行唔好經浮點數。`(1234 / 100).toFixed(2)` 今日啱啱好得，但係
`0.1 + 0.2` 日日都係 `0.30000000000000004`。`Math.trunc(cents / 100)` 同
`cents % 100` 啱啱好係兩截，而 `String(cents % 100).padStart(2, "0")`
就幫第二截補零。
'''
hints = [
  "仲揸住個字串嗰陣，text.length 就係第一行。",
  "const cents: number = Number(text) 係一個新嘅名，配一個新嘅型別。用返 `text` 去裝佢就係 TS2322，即係編譯器話你知舊嗰份合約仲生效。",
  "padStart(2, \"0\") 喺左邊補到闊度二：5 仙係 0.05，唔係 0.5。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.advanced.02.control-flow"
title = "邊個時段"
story = "時代廣場個螢幕輪住播：每第三個時段播廣告，每第五個播新聞。個排程器次次都印時段編號，於是個螢幕就顯示一個四十呎高嘅數字。"
brief = '''
讀一個整數 `n`。對每個由 `1` 到 `n` 嘅 `i`，印一行：

* `i` 同時被 3 同 5 整除就印 `ADNEWS`
* `i` 被 3 整除就印 `AD`
* `i` 被 5 整除就印 `NEWS`
* 否則印 `i` 本身

之後繼續逐行讀整數，一行一個，直到讀到 `0`，然後印
`SKIPPED <k>`，即係沿路讀咗幾多行唔係零嘅。

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

兩個循環，兩種。第一個未開始就知要行幾多次：`for (let i = 1; i <= n; i++)`。
第二個唔知：`for (;;)` 或者 `while (true)` 加一個 `break`，因為次數係由你讀到乜決定。
`i < n` 會早一次停，呢個 off-by-one 人人喺度都寫過一次。

標準輸入係一嚿過到嘅。`input.split("\n")` 畀你啲行，而一個沿住佢哋行落去嘅
index，就係其他語言入面嘅「讀下一行」。
'''
hints = [
  "先 check 兩樣都中嘅情況，唔係佢永遠都唔會觸發。被 3 同 5 整除即係被 15 整除。",
  "i < n 去到 n - 1 就停。個 starter 就係有呢隻蟲；個範例輸出早咗一行完。",
  "用 === 唔好用 ==。`\"0\" == 0` 係 true，`\"\" == 0` 都係 true，一行空白就係咁樣結束咗一個唔應該結束嘅循環。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.advanced.03.arrays"
title = "塊板嘅中間"
story = "怡和街電車站塊板顯示今晚第一班同最後一班電車，調度員想知中間所有車加埋有幾多個座位。"
brief = '''
標準輸入第一行係個數量 `n`，第二行係 `n` 個整數，用空格分開。`n` 至少係 `1`，
所以一定有第一個值同最後一個值可以印。

印三行：第一個值、最後一個值，同埋嚴格喺佢哋兩個之間所有值嘅總和。少過三個值嘅話，
嗰個總和係 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)` 就係中間：一個**新嘅 array**，係複製出嚟嘅，負數嘅
結尾由後面數起。`nums[nums.length - 1]` 係最後一個元素，`nums.at(-1)`
都係 —— 但睇下佢哋嘅型別。用 index 嗰個話係 `number`，因為編譯器信你；
`at` 話係 `number | undefined`，因為一個 array 可以係空嘅，而編譯器睇唔到
你嗰個唔係。兩個喺執行嗰陣係同一個值。得一個係老實嘅。

`reduce((sum, v) => sum + v, 0)` 將中間加埋。個 `0` 唔係裝飾：喺一個空
array 度 `reduce` 而**冇初始值**，會 throw
`TypeError: Reduce of empty array with no initial value`，而得一個元素嘅
輸入就會令中間係空。
'''
hints = [
  "nums[nums.length - 1] 係最後一個元素。nums.at(-1) 都係，而佢嘅型別認咗佢可能唔喺度。",
  "nums.slice(1, -1) 係除咗第一個同最後一個之外嘅所有嘢；得一個或者兩個值嘅時候佢係 []。",
  "reduce 要個 0 做第二個參數，唔係嘅話一個空嘅中間會 throw，而唔係加埋等於冇嘢。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.advanced.04.strings"
title = "三個長度"
story = "希慎廣場幅 LED 牆用 `.length` 計跑馬燈嘅預算。一個電車 emoji 佢計兩個，銅鑼灣佢計三個，而下面個控制器就數到九。"
brief = '''
讀一行。印三行：

1. 佢用 UTF-8 編碼有幾多個 **byte**
2. 佢有幾多個 **字元**（Unicode code point）
3. 呢一行嘅字元倒轉排

```
input:  causeway
output: 8
        8
        yawesuac
```

一個 JavaScript 字串有三個長度，而 `.length` 唔係要求嘅兩個之中任何一個。
佢數嘅係 **UTF-16 code unit**：`"銅鑼灣".length` 係 `3`，睇落啱，
`"🚋".length` 係 `2`，就唔啱。字元係 `for (const ch of s)` 同 `[...s]`
行過嘅嘢 —— 字串嘅 iterator 係一個 code point 一個 code point 咁行 ——
所以 `[...s].length` 就係第二行。

byte 係第三個數字。呢度冇 `TextEncoder`，亦都冇 `Buffer`：
`node.d.ts` 兩個都冇宣告，`tsc` 會用 `TS2304: Cannot
find name` 截停你。改為由 code point 數返出嚟 —— `ch.codePointAt(0)`
細過 `0x80` 係一個 byte，細過 `0x800` 兩個，細過 `0x10000` 三個，
再大就係四個。

`s.split("").reverse().join("")` 係人人都會伸手去攞嘅倒轉寫法，而佢會將一對
surrogate pair 切開兩半。倒轉 `[...s]` 啦。
'''
hints = [
  "[...line] 係一個 code point 嘅 array；佢嘅長度就係字元數。line.length 係 UTF-16 unit，而個 starter 將佢印咗兩次。",
  "for (const ch of line) 都係一個 code point 一個咁行，所以 ch.codePointAt(0) 係成個字元嘅編號，永遠唔會係半對。",
  "split(\"\") 係按 code unit 切，會整爛個 emoji；倒轉展開咗嘅 array 就可以保住每個字元完整。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.advanced.05.maps"
title = "幅牆講緊乜"
story = "希慎廣場幅牆將今晚個 feed 送上嚟嘅字排名，而上面每一個數都寫住 NaN。"
brief = '''
讀晒成個標準輸入，按空白字元切開。

每個唔同嘅字印一次，格式係 `<word> <count>`，按次數由多到少排，次數一樣就按字由細到大排。

```
input:  tram tram bus
output: tram 2
        bus 1
```

個 starter 數入一個 `Record<string, number>`，個型別話每個 key 都裝住一個
`number`。執行嗰陣，一個冇人寫過嘅 key 裝住嘅係 `undefined`，而
`undefined + 1` 係 `NaN` —— 冇 exception，冇警告，淨係幅牆上面一個錯嘅數字。
用 `Map<string, number>`：`counts.get(word)` 嘅型別係
`number | undefined`，呢個先係真相，而 `?? 0` 就係對佢嘅回答。

用一個 comparator 排啲 entry：次數由多到少係 `b[1] - a[1]`，而佢係 `0`
嘅時候就落去比個字。比字用 `<` 同 `>`，唔好用 `localeCompare` ——
`localeCompare` 會問部機嘅 locale，而一塊板喺邊部機都要讀出一樣嘅嘢。
'''
hints = [
  "個 starter 印 NaN，因為 += 之前 counts[word] 係 undefined。個 Record 型別應承咗一個從來冇出現過嘅數字。",
  "counts.set(word, (counts.get(word) ?? 0) + 1) —— get 認咗搵唔到，?? 補返個零。",
  "b[1] - a[1] || wordOrder：一個 comparator 回傳 0，就將打和交畀 || 右邊處理。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.advanced.06.sets"
title = "兩個螢幕都播嘅"
story = "兩個螢幕隔住怡和街面對面，個廣告客想知佢喺同一個路口畀錢播咗兩次嘅係邊啲片。"
brief = '''
兩行標準輸入，每行係一個螢幕嘅片，用空格分開。一個螢幕可能同一條片列兩次；
嗰樣只計一次。

印三行：

1. `BOTH` 跟住兩張清單都有嘅每條片，排好序，用空格分開 —— 或者
   冇嘅話就印 `BOTH -`
2. `ONLY_A <k>`：有幾多條片喺第一張清單度而唔喺第二張
3. `ALL <k>`：兩張清單加埋有幾多條唔同嘅片

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

`Set` 冇重複。喺呢個 land 編譯所用嘅 `es2023` library 入面，佢亦都冇
`intersection`、`difference` 或者 `union` —— 嗰啲係 ES2025 先有，
`tsc` 會用 `TS2339: Property 'intersection' does not exist` 話你知。
決定有乜存在嘅係你編譯所對嘅 library，唔係你行緊嘅 Node 版本。所以自己寫：
`[...a].filter((x) => b.has(x))` 係交集，換做 `!b.has(x)` 就係差集，
`new Set([...a, ...b])` 係並集。

冇 comparator 嘅 `.sort()` 係按 UTF-16 code unit 排字串，對呢啲嚟講啱啱好，
對數字嚟講就錯晒。排名榜喺兩個 quest 之後。
'''
hints = [
  "new Set(tokens) 入去嗰陣已經掉咗重複嘅 sneakers。Set 嘅數量係 .size，唔係 .length。",
  "[...a].filter((x) => b.has(x)) 係交集；將個測試反轉就係差集；兩個都展開入一個 Set 就係並集。",
  "both.length > 0 ? both.join(\" \") : \"-\" 一個表達式就處理埋空嘅情況。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.advanced.07.functions"
title = "每個鐘"
story = "價目表上面每個螢幕時段，除非另外寫明，否則都係以鐘計，而印價目表嗰部機喺每個冇寫明嘅下面都印咗 `/undefined`。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行 `<NAME> <CENTS>` 或者
`<NAME> <CENTS> <UNIT>`。

寫 `tag(name, cents, unit = "hour")`，回傳 `<NAME> $<dollars>/<unit>`，
兩個小數位，每行印一個 tag。

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

個 starter 編譯到、行到，然後印出 `TSQ $12.00/undefined`。睇下點解。
`const [name, cents, unit] = line.split(" ")` 將三個都當做 `string`，
因為 `split` 回傳 `string[]`，而編譯器唔知佢有幾長。喺一行得兩個 token 嘅時候，
`unit` 執行嗰陣係 `undefined`，而 template literal 就忠實咁將呢個字印出嚟。
個型別係一個 array 從來冇應承過嘅承諾。

**預設參數**就係修法，而佢得嘅原因值得知道：當個參數係 `undefined` ——
冇傳，或者明確咁傳 `undefined`，即係呢度 `tag(name, cents, unit)` 做緊嘅嘢
—— 預設值就會生效。`null` 就唔會觸發佢。個簽名就係份合約，講明叫佢嘅人
可以漏咗乜，同埋漏咗嘅時候會得到乜。
'''
hints = [
  "參數列入面寫 unit: string = \"hour\"。成個修法就係咁。",
  "預設值喺 undefined 嘅時候生效，包括特登傳入嚟嘅 undefined。喺 body 入面寫 `unit ?? \"hour\"` 係同一個諗法，喺叫嘅地方寫出嚟。",
  "template literal 入面嘅 `$${...}` 係一個真嘅錢銀符號，跟住一個插值。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.advanced.08.exceptions"
title = "唔係數字嘅嗰行"
story = "怡和街電車站個到站板由個 feed 讀一欄分鐘數，而中間有一行寫住 `xx`。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行。每行應該係一個整數。

每行印個值乘二，或者如果佢唔係整數就印 `BAD <line>`。最後印
`SUM <total>`，total 係你印過嗰啲值嘅總和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")` 唔會失敗。佢回傳 `NaN`，而 `Number("1.5")` 係
`1.5`，`Number("")` 係 `0`。所以個 starter 嘅 `double` 先會用一個 pattern
check 段文字，然後 **throw** `NotANumber` —— 亦都所以個 starter 去到第二行
就死咗喺呢個 exception 度，因為冇嘢接住佢。

將嗰一個會 throw 嘅呼叫包喺 `try`/`catch` 入面。喺 `strict` 之下，接住嘅值
嘅型別係 **`unknown`**：JavaScript 嘅 `throw` 乜都可以 throw，一個字串、
一個數字、甚至 `undefined`，而編譯器唔會扮唔知。冇 `catch (NotANumber e)`
呢回事。你自己收窄佢 —— `if (err instanceof NotANumber)` —— 唔係你嘅就
`throw err` 返出去，咁你自己碼入面打錯字都仍然會大大聲咁失敗，而唔會被
當做一行壞嘅輸入報告。
'''
hints = [
  "個 starter 死喺 NotANumber: not a whole number: xx。你要接嘅就係呢個 class。",
  "try block 要細：淨係會失敗嗰個呼叫放入去，印嘢同加總放喺後面。",
  "catch (err: unknown)，然後 `if (err instanceof NotANumber)`。其他嘢就用 `throw err` 再 throw 出去；一個乜都吞晒嘅 catch，就係程式學識靜靜雞失敗嘅方法。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.advanced.09.array-methods"
title = "沿住個 feed 行一次"
story = "Alex 話用三個 for 循環加三個計數器就搞得掂。第三個行完嗰陣，送去希慎廣場幅牆嘅 feed 早就過咗。"
brief = '''
標準輸入係一行整數，用空格分開。

印三行：

1. 雙數值嘅總和（冇嘅話就係 `0`）
2. 每個大過 `10` 嘅值乘二，按次序，用單一空格連埋 ——
   冇嘅話就印 `-`
3. 有幾多個唔同嘅值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

TypeScript 冇 comprehension。佢有 array method，係同一個諗法由左到右咁寫：
`filter` 留低，`map` 轉換，`reduce` 摺埋，`new Set(...)` 去重。每個都回傳
一個新嘅值，冇一個要用 index。

`reduce` 收一個初始值，而喺呢度佢唔係可有可無：個範例有雙數，但其中一個
隱藏測試冇，而 `[].reduce((a, b) => a + b)` 會 throw `TypeError: Reduce of empty array with
no initial value`。`reduce((sum, v) => sum + v, 0)` 加埋冇嘢就係 `0`。

負數：喺 JavaScript `-4 % 2` 係 `-0`。`-0 === 0` 係 `true`，所以
雙數測試冇問題 —— 但數字要經 template literal 印，嗰度
`` `${-0}` `` 係 `"0"`，永遠唔好畀一個光禿禿嘅 `-0` 去到 `console.log`。
'''
hints = [
  "nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0) —— 先留低，再摺埋，個 0 做起始總和。",
  "先 filter 後 map：用原本嘅值 filter，然後將留低嘅乘二。",
  "new Set(nums).size 就係唔同嘅值嘅數量。Set 係按值比較數字，所以兩個 12 算一個。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.advanced.10.from-entries"
title = "同一次，按 key"
story = "利園個購物 app 收到今晚嘅價錢，係一串 pair，次序係啲舖頭打入去嗰個。減價 banner 要將佢哋變做一塊板，而且要兩次。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行 `<ITEM> <PRICE>`。`PRICE` 係以仙為單位嘅整數。
每樣貨最多出現一次，而 `n` 至少係 `1` —— 一定有一樣最平嘅貨可以講。

印三行：

1. 每樣價錢**嚴格大過 100** 嘅貨，格式係 `ITEM=PRICE`，按貨名排，
   用單一空格連埋 —— 冇嘅話就印 `-`
2. 每樣貨，價錢**減半再向下取整**，同一個格式，按貨名排
3. `CHEAPEST <item>` —— 最低價嗰樣，打和就按貨名由細到大

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)` 一個表達式就由 `[key, value]` pair 砌出一個有 key
嘅物件，而 `Object.entries(obj)` 再將佢拆返開 —— 所以
`Object.fromEntries(Object.entries(prices).filter(...))` 係一塊過濾咗嘅板，
同樣咁加 `.map(([k, v]) => [k, Math.floor(v / 2)])` 就係一塊轉換咗嘅板。
兩個都唔使一個空物件同一個循環去填佢。

印之前先排好啲 entry，就算佢哋睇落已經排好。一個物件會按加入次序保留字串 key，
**除咗**睇落似 array index 嘅 key —— `"7"` 喺 `"10"` 前面，`"10"` 喺 `"SCARF"`
前面，唔理佢哋係咩次序到。一塊用產品編號做 key 嘅板會自己重新排過。
你想要咩次序就講出嚟。
'''
hints = [
  "Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100)) —— 拆開、留低、砌返埋。",
  "Object.entries(obj).sort(byKey) 畀你按 key 排好嘅 [key, value] pair，正正就係 ITEM=PRICE 要嘅。",
  "搵最平嗰樣，就按價錢排，價錢打和就落去比名：a[1] - b[1] || byKey(a, b)。第一個 entry 贏。",
]

