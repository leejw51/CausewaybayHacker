]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.advanced.26.toolbox"
title = "唔喺架上面嘅工具箱"
story = "控制室本手冊話用 iterator helper 數相同畫面嘅連續段。三十樓部 compiler 從來未聽過佢哋，夜更操作員只好用手數。"
brief = '''
標準輸入係一行整數。

印三行，每行都由你自己寫嘅 generator 砌出嚟：

1. `SUMS` 跟住累計和——`accumulate(values)`
2. `RUNS` 跟住每段**相鄰**相等值嘅連續段，寫做 `<v>x<k>`——`runs(values)`
3. `PAIRS <k>`：有幾多對無序嘅**唔同**值——`pairs(items)`，行喺排好序嘅唔同值上面

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Python 架上有 `itertools`。JavaScript 有 iterator helper——`Iterator.prototype.map`、`.filter`、`.take`——Node 由 22 版開始有，但佢哋**唔喺**呢個架上面：`es2023` 函式庫冇宣告佢哋，所以無論底下個 `node` 幾新，`tsc` 都會話 `TS2339: Property 'map' does not exist`。你用得嘅就係函式庫宣告咗嘅嘢，同你 import 嘅嘢。呢個檔案用 ES `import` 由 `"fs"` import `readFileSync`——咁就令個檔案變做一個 **module**，而因為目標係 CommonJS，`tsc` 會將佢編譯做一個 `require`。其他所有嘢，你自己寫。

`runs` 只係將**相鄰**嘅相等項目歸做一組。佢唔係計數，而個例子係特登揀嚟令兩者唔同：`1` 出現四次，分兩段。starter 第二行係用一個 `Map` 計數，正正喺呢個輸入度錯。
'''
hints = [
  "accumulate 計住一個總數，每個值之後 yield 佢；佢最後 yield 嗰個就係總和。",
  "runs 記住進行緊嗰段。下一個值唔同嗰陣，yield 做完嗰段，開一段新嘅——loop 之後，yield 最後嗰段，因為冇其他嘢會做。",
  "pairs 係兩個巢狀 loop，j 由 i + 1 開始。數目係 n*(n-1)/2，用手核對一次，就知你個 n 啱唔啱。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.advanced.27.memo"
title = "記住你計過嘅嘢"
story = "時代廣場塊螢幕嘅排程器，半夜之前用同樣兩個數計同一個輪播一萬一千次，次次由頭計過。"
brief = '''
標準輸入係 `n k bits`：兩個整數同一串二進制數字。

印四行：

1. `FIB <fib(n)>`——由一個**遞迴**嘅 `fib` 計，包喺你自己寫嘅 memoise `memo(...)` 入面
2. `PRODUCT <k!>`——喺 `1..k` 上面用乘法 `reduce`，要有初始值，咁 `k = 0` 就得 `1`
3. `BIN <value>`——`bits` 由 `fromBinary` 當二進制讀，一個單參數函數，radix 喺入面固定咗
4. `MISSES <m>`——個 memo 實際行咗個 body 幾多次

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` 最多係 `400`。starter 個包裝會數呼叫次數但乜都唔記，所以 `fib(10)` 係 177 次呼叫，`fib(35)` 係三千萬次，`fib(90)` 行唔完。有咗 cache，每個 `fib(i)` 只行一次，`MISSES` 就係 `n + 1`。

啲數塞唔落一個 `number`。`fib(90)` 係 `2880067194370816120`，超過 `Number.MAX_SAFE_INTEGER`，一個 `number` 會一聲唔出咁印錯佢。用 **`bigint`**：`0n`、`1n`、`BigInt(i)`。template literal 會將 bigint 印做佢嘅數字；單獨 `console.log(5n)` 會印 `5n`。

冇 radix 嘅 `parseInt(bits)` 會將 `1010` 讀做一千零一十。starter 就係咁做。喺一個 closure 入面固定個 radix——`(text: string) => parseInt(text, 2)`——呢個就係 Python 嘅 `functools.partial`：一個已經決定咗部分參數嘅函數。`bind` 都做到同樣嘢，但只限**前面**嘅參數，而 radix 係第二個。
'''
hints = [
  "memo 喺佢個 closure 入面留住一個由參數對應到結果嘅 Map；命中就由 Map 回傳，唔中就行個 body、儲低結果，再計一次數。",
  "fib 喺遞迴入面一定要呼叫 memoise 咗嘅 fib，否則只有最外層嗰個呼叫會被 cache。預先連型別宣告 fib，先令個箭嘴函數可以指返佢。",
  "reduce((a, b) => a * b, 1n)——第二個參數係起始值，令空範圍得出 1n 嘅就係佢。佢都一定要係 bigint：1 * 1n 係 TS2365，唔會靜靜雞轉換。",
]

