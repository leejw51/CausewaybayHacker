`readonly` 係同 compiler 立嘅一份合約，而同呢度每份合約一樣，佢會被**抹走**。`price.cents = 0` 編譯唔到——所以 starter 經一個放闊咗嘅視圖寫入，`(price as { cents: number }).cents = 0`，佢編譯到，因為一個 readonly 屬性可以賦值畀一個可變嘅屬性，而執行時冇嘢攔住。價目表被人寫過，`TOTAL` 係 `0`。合約嘅執行時嗰一半係 constructor 最尾嘅 `Object.freeze(this)`：喺 strict mode 下，賦值畀一個 frozen 物件嘅屬性會 throw `TypeError`，而 `tsc` 喺 `strict` 之下輸出嘅每個檔案都以 `"use strict"` 開頭。

