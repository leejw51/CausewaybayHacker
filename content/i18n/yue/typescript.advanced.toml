'''
hints = [
  "withTimeout：一個期限 promise，佢嘅 setTimeout 用 Timeout reject 同埋 cancel 個 token，喺 try 入面 `return await Promise.race([work(token), deadline])`，喺 finally 入面 clearTimeout。",
  "`await watcher` 先令個 task 喺 TIMEOUTS 印之前行到佢嘅 catch 同 finally；佢會將 Cancelled 重新 throw 畀你，所以都要 catch 埋佢——而且只 catch 佢。",
  "喺 finally 入面清走期限嘅 timer。冇咗佢，每塊答咗嘅螢幕都仍然留低一個 200 ms 嘅 timer，個 process 要等最後一個先退出：輸出啱，但次次行都慢啲。cancel 個 token 係反方向嘅同一種禮貌。",
]

