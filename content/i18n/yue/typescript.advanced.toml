```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

Promise 係 cancel 唔到嘅。冇 `.cancel()`，而同一個 timer `Promise.race` 只係決定你*聽邊個*——輸咗嗰個照行，佢仲有嘅任何待辦嘢，一個 timer 或者一個訂閱，喺你最後一行之後仍然揸住唔放。所以 cancel 係你**傳入去**嘅嘢：一個畀份工檢查或者訂閱嘅 token。starter 有一個，`Token`，有 `cancel()` 同 `onCancel(handler)`；`sleep` 會訂閱，cancel 嗰陣佢清走自己個 timer，用 `Cancelled` reject；而 `silence`——死咗嗰塊螢幕——係一個除咗 cancel 之外乜都 settle 唔到嘅 promise。（`AbortController` 係平台版本嘅同一樣嘢。呢度冇宣告佢。）

`withTimeout(work, ms)` 整一個 token，將 `work(token)` 同一個 timer race——個 timer 會用 `Timeout` reject **同埋** cancel 個 token——而份工贏嗰陣，喺 `finally` 入面清走自己個 timer。starter 從來冇呼叫佢：佢直接 await `ping`，而 `WONG` 永遠唔答。你已經見過 Node 點處理：冇剩任何可以叫醒任何人嘅嘢，所以個 process 喺 `LAM OK` 之後退出，status `0`。

