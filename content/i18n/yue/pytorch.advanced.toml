[[quest]]
id    = "pytorch.advanced.10.retain-graph"
title = "想 backward 兩次"
story = "一次 forward pass 有兩個損失，第二次 backward 報錯，話啲 buffer 已經釋放咗。"
brief = '''
`backward()` 一路行個 graph 一路釋放佢。所以喺同一次 forward pass 上面再 `backward()` 一次會 raise —— 啲 buffer 冇咗 —— 而 `retain_graph=True` 就係留住佢哋嘅方法。

老實嘅修正通常係將啲損失加埋，然後 `backward()` 一次；`retain_graph` 係俾你真係需要兩次獨立 pass 嘅時候用，而且佢食記憶體。

保留住 graph 行第二次 pass，印出累積咗嘅梯度：喺 `w = 2`，`d(w²)/dw + d(3w)/dw` 係 `4 + 3`。

```
output: caught 7.0
```
'''
hints = [
  "first.backward(retain_graph=True) —— 咁第二次 pass 仲有個 graph 可以行。",
  "梯度會累積，所以印出嚟嘅數係兩個導數加埋。",
]

