[[quest]]
id    = "pytorch.advanced.03.detach-clone"
title = "一個副本，一刀切斷"
story = "寫 log 嗰段碼留低咗個損失張量而唔係佢個數，04:00 嘅時候四個鐘嘅 graph 仲喺記憶體入面。"
brief = '''
`clone()` 抄咗啲數據，而且**留喺 graph 入面** —— 梯度會流過佢。`detach()` 共用啲數據，而且**離開 graph** —— 乜都唔會流返轉頭。佢哋唔係二揀一；佢哋答緊唔同嘅問題。

想影張快照就要 `x.detach().clone()`：新記憶體，冇 graph。

三個都印出嚟：佢 requires grad 唔 requires，同埋佢同原本嗰個有冇共用 storage。

```
output: clone True False detach False True snapshot False False
```
'''
hints = [
  "x.clone()、x.detach()、x.detach().clone() —— 就係咁嘅次序。",
  "detach 共用同一舊記憶體，所以寫入去就等於寫落原本嗰個度。",
]

