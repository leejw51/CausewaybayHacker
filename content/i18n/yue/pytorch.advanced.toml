[[quest]]
id    = "pytorch.advanced.08.batched-matmul"
title = "每個 head 乘一次"
story = "四個注意力 head，段碼用 Python loop 逐個行。Profiler 話個 loop 就係成個模型。"
brief = '''
喺多過兩個維度嘅張量上面，`@` 係一個 **batched** 矩陣乘法：最後兩條軸係矩陣，前面全部係 batch，而 batch 軸會 broadcast。

`(B, H, T, d) @ (B, H, d, T)` 得出 `(B, H, T, T)` —— 正正就係注意力分數張量，每條序列嘅每個 head 一次過計晒，唔使 loop。

砌出嚟，印出形狀，同埋佢同用 loop 計嘅答案係咪一樣。

```
output: (2, 4, 5, 5) True
```
'''
hints = [
  "q @ k.transpose(-2, -1) —— 用負數軸，咁無論 batch 有幾多維，同一行都用得。",
  "k.t() 淨係得 2-D 張量先用得，4-D 嘅會 raise。",
]

