id    = "pytorch.advanced.12.clip-grad"
title = "個尖峰"
story = "03:40 一個壞 batch，一個超大嘅梯度，03:41 模型入面每個權重都係 NaN。"
brief = '''
Clipping 會將成個梯度向量按比例縮細，等佢嘅 norm 最多係 `max_norm`，方向唔變，步就縮短。佢要喺 `backward()` **之後**、`step()` **之前** —— 放喺第二度就乜都冇做到。

`clip_grad_norm_` 回傳佢見到嘅 norm，即係 clip 之前嗰個。

呢度個梯度嘅 norm 係 `sqrt(3² + 4²) = 5`；clip 到 `1.0` 就變成同一個方向嘅單位向量。

```
output: 5.0 1.0 [0.6, 0.8]
```
'''
hints = [
  "nn.utils.clip_grad_norm_([w], max_norm=1.0) —— 尾後有底線，因為佢 in place 改 .grad。",
  "佢回傳 clip 之前嘅 norm，嗰個先係值得 log 低嘅數。",
]

