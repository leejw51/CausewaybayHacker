id    = "pytorch.advanced.07.keepdim"
title = "唔見咗嘅軸"
story = "每行減走嗰行嘅最大值，一個長方形張量減完變咗正方形，乜都冇 raise。"
brief = '''
Reduction 會拎走佢 reduce 嗰條軸。喺 `(2, 3)` 上面 `x.max(dim=1).values` 得出 `(2,)`，由 `(2, 3)` 減走佢就會沿住**錯**嘅軸 broadcast —— 佢將個 2 對住個 3 嘅位，而當啲數啱啱夾到嘅時候，就靜靜雞計出一堆廢嘢。

