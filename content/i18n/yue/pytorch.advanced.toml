# PYTORCH LAND — ADVANCED, in Cantonese. A translation pack (SPEC §12.1):
# the prose of `content/pytorch/advanced.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong practitioners actually say them (frontend/src/i18n/yue.ts).

pack   = "pytorch.advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.advanced.01.view-contiguous"
title = "唔肯 view 嘅 view"
story = "個 batch 一入嚟就畀人 transpose 咗，嗰個用咗一年都冇事嘅 flatten 而家報錯，話 contiguity 有問題。"
brief = '''
`view` 要求張量嘅記憶體本身已經係新形狀需要嘅排法。Transpose 唔會搬任何記憶體 —— 佢淨係改 strides —— 所以喺 transpose 咗嘅張量上面 `view` 會 raise `RuntimeError`，而呢個係 PyTorch 面試一定會問嘅兩三個錯誤之一。

`reshape` 有需要就會抄，點都得。`contiguous()` 就係明明白白咁抄一次，抄完 `view` 又合法返。

印出 `view` 喺 transpose 咗嘅張量上面失敗，然後印出兩種照樣 flatten 到嘅方法。

```
output: RuntimeError True True
```
'''
hints = [
  "x.reshape(6) 有需要就抄；x.contiguous().view(6) 先抄，再 view。",
  "Transpose 改嘅係 strides，唔係記憶體 —— 而呢樣正正係 view 忍唔到嘅。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.advanced.02.in-place"
title = "條底線"
story = "有人加咗個底線慳記憶體，而家 backward pass 報錯，話計梯度要用嘅一個變數畀人改咗。"
brief = '''
尾後一個底線即係 *in place*：`relu_`、`add_`、`mul_`。In-place 慳咗一次分配，但係同時毀咗 backward pass 本來要用嘅值，而 autograd 會捉到 —— 喺 `backward()` 嗰陣，離搞出事嗰行好遠。

用 out of place 做同一條算術，等 backward pass 捱得過，然後印出梯度。

`y = w * 2`，然後 `y = y + 1`，然後 `loss = y.sum()`：損失對 `w` 嘅梯度每個元素都係 `2`。

```
output: [2.0, 2.0, 2.0] caught
```
'''
hints = [
  "y = y + 1 係將個名重新綁去一個新張量；y += 1 就會 in place 改，搞爛個 graph。",
  "加一個常數唔會改梯度 —— d(2w + 1)/dw 仍然係 2。",
]

