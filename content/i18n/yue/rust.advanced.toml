# RUST LAND — ADVANCED, in Cantonese (colloquial written Cantonese, traditional
# characters). A translation pack (SPEC §12.1): the prose of
# `content/rust/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "rust.advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.advanced.01.threads"
title = "兩部收銀機，一個櫃檯"
story = "時代廣場分店中午開第二部收銀機，條隊終於郁。間舖其他嘢乜都冇變。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

每個值開一條 thread 計佢嘅平方。**跟你 spawn 嘅次序** join 佢哋，每個結果
印一行，然後印 `THREADS <n>`。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

跟次序 join 就係令每次行輸出都一樣嘅原因。一條自己印嘢嘅 thread 就唔會。
'''
hints = [
  "thread::spawn 返回一個 JoinHandle<T>，T 就係個 closure 返回嘅嘢。",
  "join() 畀你 Result<T, _> —— 個 Err 係 panic，喺呢度 unwrap 係老實嘅。",
  "喺迴圈之前先攞個數量；以值 iterate 個 Vec 會消耗咗佢。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.advanced.02.move"
title = "帶埋佢走"
story = "Alex 將個地址寫喺唯一一張單度交咗畀個車手，然後叫櫃檯讀返個地址出嚟。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行文字。

每一行開一條 thread，返回嗰行嘅大楷版本。跟次序 join，逐個印，然後印
`DONE`。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

個 starter 編譯唔到：個 closure 係借 `line`，而 `thread::spawn` 完全唔知
條 thread 會行幾耐，所以證明唔到個借用會活得過佢。將個字串直接交畀條
thread，而唔係交一個 view 畀佢。
'''
hints = [
  "個錯誤係 E0373：closure may outlive the current function。",
  "喺個 closure 前面加一個關鍵字，佢就由借變做擁有。",
  "line 每一次迴圈都已經係一個新鮮嘅 String，所以送走佢一啲成本都冇。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.advanced.03.channels"
title = "一個窗口，好多車手"
story = "四十個車手，時代廣場廚房後面得一個出餐窗。所有嘢都經個窗出，而個窗從來唔塞。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

每個值開一條 thread。每條 thread 將 `(index, value * 10)` 送落同一條
`mpsc` channel。main thread 收晒佢哋，按 index 排序，印 `<index> <value>`
一行一個，然後印 `RECV <n>`。

```
input:  3
        1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```

用 iterate `rx` 嚟接收，要**每一個** sender 都 drop 咗先會完 —— `main` 手上
仲揸住嗰個都計。Drop 佢，唔係個程式永遠都完唔到。
'''
hints = [
  "每條 thread 要有自己嘅 Sender：喺 move closure 之前 tx.clone()。",
  "迴圈之後 drop(tx)。唔做嘅話個 receiver 會永遠等緊一個坐喺 main 度嘅 sender。",
  "rx.iter() 會一直產出直到條 channel 閂咗，所以 collect() 就已經係成個接收迴圈。",
]

