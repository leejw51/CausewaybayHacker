[[quest]]
id    = "rust.advanced.04.mutex"
title = "一個錢櫃，八隻手"
story = "兩部收銀機都由同一個錢櫃攞現金，收舖嗰陣個錢櫃同佢哋兩個嘅數都對唔上。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

每個值開一條 thread，將佢加落**同一個共享嘅總數**。全部 join 完，然後印
`TOTAL <sum>` 同 `THREADS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

個 starter 編譯到，但係錯嘅：`i64` 係 `Copy`，所以每個 `move` closure 都攞咗
一個自己私人嘅總數，然後掉咗佢。共享一個，然後鎖住佢。
'''
hints = [
  "Arc 係共享擁有；Mutex 係獨佔存取。兩樣都要，跟呢個次序：Arc<Mutex<i64>>。",
  "喺迴圈入面、move closure 之前 Arc::clone(&total) —— 每條 thread 攞走嘅就係嗰個 clone。",
  "lock() 攞到嘅 guard 可以 deref 去個值；*guard += value，而個 guard 離開 scope 就自動解鎖。",
]

