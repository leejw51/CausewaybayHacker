# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.closure-kinds"
title = "三種 closure"
story = "個面試官喺塊板寫 `Fn`、`FnMut` 同 `FnOnce`，問個 callback 應該係邊一種。係有正確答案嘅。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數，`n` 至少係一。

每一種 closure 用一個：

* `apply_fn<F: Fn(i64) -> i64>` —— 以複製捕獲第一個值，將佢加落每個值。
  逐個結果印出嚟。
* `apply_fn_mut<F: FnMut(i64)>` —— 將一個住喺 `main` 嘅計數器加上去。印
  `SEEN <k>`。
* `apply_once<F: FnOnce() -> String>` —— 將一個 `String` 由佢嘅捕獲入面
  **move** 出嚟並且返回佢。印 `TAKEN <s>`，個字串係 `<n> items`。

```
input:  3
        10 20 30
output: 20
        30
        40
        SEEN 3
        TAKEN 3 items
```

呢三個 trait 係一個層級，唔係一張餐牌：每個 `Fn` 都係 `FnMut`，每個
`FnMut` 都係 `FnOnce`。一個 closure 實現邊個，係由佢對佢嘅捕獲*做啲乜*
決定 —— 讀佢哋（`Fn`）、改佢哋（`FnMut`），定係消耗佢哋（`FnOnce`）——
而 `move` 改嘅係佢哋點樣俾人捕獲，唔係出嚟邊個 trait。

個 starter 編譯唔到。`apply_once` 要求 `Fn`，而一個將自己個 `String` 送走
嘅 closure 淨係可以呼叫一次，所以佢係 `FnOnce`，冇其他。揀個呼叫點頂得住
嘅最弱 bound：你淨係呼叫一次就要求 `FnOnce`，咁你就唔會無緣無故排除晒
其他所有 closure。
'''
hints = [
  "個錯誤係 E0525：expected a closure implementing Fn, but this one only implements FnOnce。",
  "改一個字：apply_once 上面個 bound。個 closure 本身已經係啱嘅。",
  "apply_fn_mut 攞 `mut f: F` —— 個參數本身要係可變嘅，個 closure 先可以改佢自己嘅捕獲。",
]

