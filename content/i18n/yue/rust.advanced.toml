  "fetch_add 返回之前嘅值，並且 atomic 咁做個加法；冇鎖，冇 guard。",
  "個 Arc 仲係需要嘅 —— atomic 令*存取*安全，唔係令*共享*安全。",
  "Drop 跟宣告嘅相反次序行，所以 `second` 先走。用 _first 同 _second 綁住佢哋可以令佢哋活到 main 嘅尾；淨係一個 `_` 就會即刻 drop 咗佢哋。",
