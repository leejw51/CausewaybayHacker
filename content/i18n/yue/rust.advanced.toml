[[quest]]
id    = "rust.advanced.12.dispatch"
title = "而家定係遲啲"
story = "同樣兩個舖面，同樣嘅 render，而個面試官想兩種寫法一齊喺塊板度出現。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行 `SHOP <NAME> <FLOOR>` 或者
`STOP <ROUTE>`。

每個牌 render **兩次**：一次透過 `render_static<T: Sign>(sign: &T)`，一次
透過 `render_dynamic(sign: &dyn Sign)`，跟呢個次序 —— 先晒所有 static
嘅，再晒所有 dynamic 嘅。然後印 `DYNAMIC <k>`，即係個
`Vec<Box<dyn Sign>>` 嘅長度。

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        HYSAN / F4
        TRAM 2
        SOGO / F1
        DYNAMIC 3
```

兩個出嚟嘅文字一模一樣，但係佢哋唔係同一樣嘢。`render_static` 係
monomorphise 嘅：編譯器為每個具體嘅型印一份，個呼叫係直接、可以 inline
嘅 —— 但係個型一定要**喺呼叫點**已經知道，所以 static 嗰一輪一定要喺
parse 嗰個分支入面做，即係你仲知自己砌咗乜嘅時候。

`render_dynamic` 攞一個 fat pointer —— 數據加 vtable —— 執行嗰陣先查個
method，而佢唔理自己揸住嘅係乜。呢個就係一個 `Vec` 可以同時裝住兩種嘅
唯一原因。
'''
hints = [
  "render_static 一定要喺具體嘅型仲見得到嘅地方呼叫 —— 喺 match 嘅 arm 入面，個值俾人 box 之前。",
  "sign.as_ref() 將 &Box<dyn Sign> 變做 &dyn Sign；直接交個 box 就要多一次 deref。",
  "兩個 function 嘅 body 都係同一行。分別完全喺個簽名度，完全喺個 method lookup 喺邊度發生。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.interior-mutability"
title = "透過共享 reference 改嘢"
story = "門口個計數器要一路加上去，而同時有四段唔同嘅碼淨係望住佢。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

印四行：

1. `CELL <k>` —— 一個 `Cell<usize>`，每個值加一次，用 `.get()` 讀返出嚟，
   全部透過一個普通嘅 `&` reference
2. `REF <sum>` —— 一本用啲值填滿再加埋嘅帳
3. `RC <k>` —— 本帳係一個 `Rc<RefCell<Vec<i64>>>`，而你揸住**兩個** handle；
   兩個都仲生存嘅時候印 `Rc::strong_count`
4. `DOUBLE panic` —— 故意對同一個 `RefCell` 同時攞兩個 `borrow_mut()`，
   然後用 `std::panic::catch_unwind` 接住個 panic

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T` 正常嚟講即係冇人可以改佢。`Cell` 同 `RefCell` 係獲准嘅例外，而佢哋
用唔同嘅貨幣付鈔：`Cell` 淨係將成個值搬入搬出，所以完全唔使檢查；
`RefCell` 交出真正嘅 reference，所以一定要執行 borrow 規則 —— 喺執行嗰陣，
用 panic，而唔係喺編譯嗰陣用錯誤。

`Rc<RefCell<T>>` 係個個最終都會伸手攞嘅一對，而講得出每一半做乜係值得嘅。
`Rc` 畀個值多過一個擁有者 —— 非 atomic 嘅 refcount，所以佢唔係 `Send`，過唔到
thread（嗰個係 `send-sync` 張地圖）。`RefCell` 畀嗰啲擁有者改嘢嘅權利。兩個都
唔係 `Mutex`。共享**兼且**可變正正係 borrow checker 喺編譯嗰陣拒絕嘅嘢，所以
呢個 pattern 係喺執行嗰陣買返佢，而你搞錯嘅時候就收你一個 panic。

嗰個 panic 唔係呢條街嘅 bug。佢係個價，而見一次就係重點。
'''
hints = [
  "Cell 冇 borrow()：你用 get() 攞一個副本出嚟，用 set() 放一整個值入去。所以佢唔使執行時記帳。",
  "ledger.borrow_mut().push(v) 寫做一句，個 guard 就喺分號度 drop，呢樣就係令個迴圈合法嘅嘢。",
  "catch_unwind 要用 AssertUnwindSafe 包住個 closure，因為佢捕獲咗一個 &RefCell；個 panic 訊息照樣去 stderr，而測試唔會讀嗰度。",
  "Rc::clone(&ledger) 咁樣寫而唔係 .clone()，係等讀嘅人睇得出佢複製嘅係一個 handle 而唔係個 Vec。兩個 handle 都生存嘅時候 Rc::strong_count 讀到 2，而 panic 測試入面嗰兩個 borrow_mut() 可以一個 handle 一個 —— 佢哋係同一個 RefCell，佢會一齊計。",
]

