然後：喺 `main` 嘅**最頂**宣告兩個 `Guard` 值，叫 `first` 同 `second`，佢哋
嘅 `Drop` 會印 `DROP <name>`。佢哋喺 `main` 嘅最尾、其他嘢全部做完之後行，
跟宣告嘅相反次序。

```
