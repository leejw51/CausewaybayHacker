# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.advanced.09.pipeline"
title = "流水線廚師"
story = "Bo 師傅個夜間廚房係一條流水線咁行：一個崗位將柯打平方，下一個保持住個累計數，冇人等成批嘢出齊。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

用兩條 `mpsc` channel 同兩條 thread 砌一條兩級嘅 pipeline：

1. 第一級將每個值平方送出去
2. 第二級收嗰啲值，保持住一個累計總數，送出 `(square, total)`

`main` 將收到嘅每一對印做 `<square> <total>`，然後印 `PIPE <n>`。

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

每一級嘅 sender 都係**move 入**佢條 thread 嘅，所以條 thread 一完佢就 drop，
所以下一級嘅 `for` 迴圈先會完。喺任何地方留一個副本，個程式就會 hang。
'''
hints = [
  "將 nums move 入第一條 thread 之前先攞個數量。",
  "第二條 thread 入面嘅 for square in rx1 係一個接收迴圈，第一級 drop 咗 tx1 佢就完。",
  "main 對 rx2 嘅迴圈喺第二條 thread 完嘅時候完，所以之後先 join 唔會 hang。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.async"
title = "async 到底喺邊度行"
story = "阿薇寫咗四年 async Rust，但係從來冇見過推動佢嘅嗰樣嘢。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

呢度冇 runtime —— 冇 tokio，一個 crate 都冇。自己寫個 executor。

完成 `block_on`，佢會一直 poll 一個 future 直到佢係 `Ready`，然後返回個值
**同埋佢 poll 咗幾多次**。然後用 `block_on` 行一個 `async` block，跟次序對
每個值 await `double(v)`，逐個結果印出嚟，然後印 `SUM <total>` 同
`POLLS <k>`。

`double` 返回之前會 yield 一次，所以每個值多花一次 poll：`POLLS` 係
`n + 1`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        POLLS 4
```

一個 `async fn` 係一個實現咗 `Future` 嘅 state machine，而 `.await` 係
「poll 入面嗰個；佢係 `Pending` 嘅話就返回 `Pending`，記住我行到邊」。
冇嘢 poll 佢之前乜都唔會行。嗰樣嘢係三十行碼，親手寫一次好過讀五次。
'''
hints = [
  "Box::pin 唔使任何 unsafe 就畀到你一個 Pin<Box<F>>，而 .as_mut() 將佢變做 poll 想要嘅 Pin<&mut F>。",
  "Context::from_waker(&waker) 就係成套儀式 —— 個 Waker 係一個真正嘅 runtime 用嚟重新排你入隊嘅嘢。",
  "呢個 executor 遇到 Pending 就 busy-loop。真正嘅 executor 會將條 thread park 住直到個 waker 響，而呢個係唯一有趣嘅分別。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.send-sync"
title = "點解佢過唔到去"
story = "同一段碼，同一個 Vec，得一個字唔同，而兩個之中有一個編譯唔到。講出係邊個字，同埋點解。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

透過一個共享嘅總數，用兩條 thread 加埋佢哋，然後印：

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

最後兩行淨係喺 `assert_send` 同 `assert_sync` 接受個 handle 嘅時候先會印
—— 而呢兩個 function 執行嗰陣乜都唔做。佢哋係
`fn assert_send<T: Send>(_: &T) {}`：個檢查就係個 bound，喺編譯嗰陣發生，
唔係嘅話就完全唔會發生。

個 starter 編譯唔到，而個錯誤就係今堂嘅課。`Rc` 唔係 `Send`，因為佢個
refcount 係一個普通、非 atomic 嘅整數 —— 兩條 thread clone 同一個 `Rc`
會喺上面 race，所以編譯器索性唔畀 `Rc` 跨過 thread 邊界。`Arc` 係同一樣嘢
但係用 atomic 計數，而佢係 `Send`。

`Sync` 係另一半：`&T` 係 `Send` 嘅時候，`T` 就係 `Sync`。`Mutex<T>` 對任何
`T: Send` 都係 `Sync`，因為個鎖就係令共享存取變安全嘅嘢。
'''
hints = [
  "個錯誤係 E0277：`Rc<Mutex<i64>>` cannot be sent between threads safely。改一個型名，連埋一個 import。",
  "Rc 個 refcount 係普通 usize；Arc 嗰個係 AtomicUsize。呢一個分別就係點解一個係 Send 另一個唔係嘅全部理由。",
  "assert_sync(&*total) 問嘅係個 Mutex 本身，唔係包住佢嘅 Arc —— 只要 T 係 Send，Mutex<T> 就係 Sync。",
]

