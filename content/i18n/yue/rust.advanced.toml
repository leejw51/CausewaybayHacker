```

atomic 唔係一個平啲嘅 mutex；佢係另一件工具，用嚟喺一個指令入面
read-modify-write 一個機器字。你一需要兩個欄位互相一致，個鎖就返嚟 ——
冇一個 atomic 係做「呢兩樣嘢，一齊」嘅。

呢度 `Ordering::Relaxed` 已經夠，因為冇嘢依賴呢啲加法相對於任何其他寫入
*幾時*變得可見，淨係要冇一個唔見咗。呢一句就係追問嗰條問題，亦都係
`Relaxed` 嘅全部意思。
