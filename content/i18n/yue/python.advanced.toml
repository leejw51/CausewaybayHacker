`TypeError: tag() missing 1 required positional argument`。預設參數係
function 合約嘅一部分 —— 佢講明叫嘅人可以唔畀乜，唔畀嘅時候會得到乜。

用 `.split()` 切開行，轉咗 cents 之後用 `tag(*parts)` 將啲碎件交過去。
個 `*` 會將一個 list 拆開做位置參數，咁兩個元素嘅 list 同三個元素嘅 list
