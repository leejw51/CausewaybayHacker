[[quest]]
id    = "python.advanced.10.functools"
title = "記住你計過嘅嘢"
story = "豆腐檔由同樣兩個數計同一日嘅價錢，食晏之前計咗一萬一千次，次次由頭計過。"
brief = '''
標準輸入係 `n k bits`：兩個整數同一串二進制數字。

印四行：

1. `FIB <fib(n)>` —— 由一個**遞歸**嘅 `fib` 計，用 `functools.lru_cache`
   記憶化
2. `PRODUCT <k!>` —— 用 `functools.reduce` 配 `operator.mul` 摺 `1..k`，
   要有初始值，令 `k = 0` 得到 `1`
3. `BIN <value>` —— 用一個 `int` 加 `base=2` 嘅 `functools.partial`
   解析 `bits`
