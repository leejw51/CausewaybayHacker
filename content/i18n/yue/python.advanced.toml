[[quest]]
id    = "python.advanced.01.conversions"
title = "三個樣，一個名"
story = "魚檔本簿仔入面，個價錢一時係文字、一時係數字、一時係蚊，三樣嘢都叫做 price。"
brief = '''
讀一行：一個以仙為單位嘅金額，全部係數字。

印三行：

1. 剪走頭尾空白之後嘅文字有幾多個字元
2. 個金額作為一個數字
3. 個金額以蚊為單位，啱啱好兩個小數位

```
input:  1234
output: 4
        1234
        12.34
```

個金額唔會係負數。用**一個名**去做，重新綁定三次 —— `str`，然後 `int`，
然後再 `str`。Python 容許一個名裝任何嘢、隨時改主意；代價係冇嘢會話你知
`cents` 而家係乜，淨係可以睇返上面嘅碼。

計蚊嗰行唔好經 `float`。`1234 / 100` 今日係 `12.34`，但係 `0.1 + 0.2`
日日都係 `0.30000000000000004`。整數除法同餘數可以將兩截啱啱好分開，
`f"{cents % 100:02d}"` 就幫你補零。
'''
hints = [
  "cents 仲係字串嗰陣 len(cents) 就係第一行。",
  "cents = int(cents) 唔係就地轉型；係一個新嘅值綁去舊嘅名度。之後個字串就冇咗。",
  "f-string 入面嘅 :02d 係闊度二、補零、十進制。5 仙係 0.05，唔係 0.5。",
]

