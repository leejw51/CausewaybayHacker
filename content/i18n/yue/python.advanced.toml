[[quest]]
id    = "python.advanced.07.context-managers"
title = "捲閘照樣落"
story = "地庫有個檔口，每張單都開一次捲閘，做完就閂。12:40 收到張壞單嗰個檔口，捲閘由嗰陣一直開到而家，因為閂閘嘅碼寫喺出事嗰行後面。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 行 `<STALL> <CENTS>`，`CENTS` 本來應該係
一個整數。

用 `contextlib.contextmanager` 寫一個 context manager `opened(stall)`，
入去嗰陣印 `OPEN <STALL>`，出嚟嗰陣印 `SHUT <STALL>` —— **無論主體有冇拋
例外**。喺入面解析啲仙，加入總數。仙解析唔到嘅行，喺捲閘閂咗之後報
`BAD <STALL>`。最後印 `TOTAL <sum>` 同 `REJECTED <k>`。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager` 將一個 generator 變做 context manager：`yield` 之前嘅
所有嘢係 `__enter__`，之後嘅所有嘢係 `__exit__`。主體拋例外嗰陣，個例外
會**喺 `yield` 嗰個位掟入個 generator**，所以 `yield` 之後嘅碼淨係喺
`yield` 包喺 `try`/`finally` 入面嘅時候先會行。個 starter 冇 `finally`，
`WONG` 個捲閘就永遠閂唔到。

用 class 嘅寫法 —— `__enter__` 同 `__exit__(self, exc_type, exc, tb)` ——
做同一樣嘢，多幾行，而且可以靠返回 `True` 吞咗個例外。呢度唔好吞：
叫佢嘅人想印 `BAD`。
'''
hints = [
  "try: yield / finally: print(SHUT)。個 finally 就係每一條路都會行嘅 __exit__。",
  "個例外會穿過個 generator，走出個 with 語句，所以 main 嘅 except 照樣見到佢 —— 所以 BAD 係喺 SHUT 之後先印。",
  "with opened(stall) as x: 會綁住個 generator yield 出嚟嘅嘢。呢度佢乜都冇 yield，咁樣冇問題。",
]

