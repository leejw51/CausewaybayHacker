# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.threads"
title = "十二個檔口，一層樓"
story = "12:30，崇光地庫。十二個檔口同時落單，而負責收集總數嘅跑腿，喺佢哋一個都未寫上塊板之前就已經讀咗塊板。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

每個值開一條 `threading.Thread`，計佢嘅平方，存入 `results[i]` ——
佢自己嗰格，咁就冇兩條 thread 會寫同一個位。`join` 晒每一條 thread，
然後**按索引次序**印啲結果，一行一個，再印 `THREADS <n>`。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

thread 唔會返回任何嘢。`Thread(target=f)` 會行 `f`，然後將佢嘅返回值掉走，
所以個結果一定要寫落一個主 thread 喺 `join` 之後讀得到嘅地方。每條 thread
一格嘅 list 係最簡單嘅一種：每個索引啱啱好由一條 thread 寫，所以冇嘢需要鎖。

個 starter 啲 thread 一開始就全部仆街，但個程式照樣行完照樣印。`target=square`
冇 `args=`，即係乜都唔畀就叫 `square()`，個 `TypeError` 落喺條 thread 入面，
印咗去標準錯誤，而 `results` 就成個都係 `None`。一條 thread 死咗淨係帶走佢自己
—— 要睇 stderr，唔係你永遠都唔會知。
'''
hints = [
  "Thread 度加 args=(i, v)。個 target 係以 square(*args) 咁叫嘅，而個 starter 乜都冇畀。",
  "先 start 晒每一條 thread，再 join 晒每一條。喺同一次循環入面又 start 又 join 係啱嘅，不過就會逐條逐條咁行。",
  "results 係一個對 main 本地 list 嘅閉包；入面嗰個 function 見到嘅係同一個 list，所以 join 之後啲寫入係睇得到嘅。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.lock"
title = "一個錢櫃，八隻手"
story = "地庫每個檔口都係交錢入美食廣場辦公室嗰一個錢櫃，收工嗰陣個錢櫃入面乜都冇，而每個檔口都發誓自己交咗。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

每個值開一條 thread，將佢加入**一個共用嘅總數**，同時將一個共用嘅次數加一。
join 晒佢哋，然後印 `TOTAL <sum>` 同 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

個 starter 印 `TOTAL 0`，次次都係咁，而且 stderr 度每個 worker 都有一段
traceback。worker 入面嘅 `total += value` 掂唔到 main 嘅 `total`：`int`
係不可變嘅，對佢 `+=` 係重新綁定個名，而 function 入面賦值過嘅名係嗰個
function 嘅**本地變數**，除非佢講明 `nonlocal`。每個 worker 都整咗自己嘅
`total`，加落去，然後掉咗。

修法係用一個 worker 可以就地改嘅容器 —— 一個單元素 list 或者一個細 class ——
**再加一個 `Lock`**。後半部分唔係可有可無。GIL 保證嘅係一次淨係行一個
bytecode；`drawer[0] += value` 係三個 bytecode（load、add、store），
喺 load 同 store 之間切換 thread 就會唔見咗一次更新。四條 thread 加四個數
唔會發生。凌晨兩點四十條 thread 就會發生。

`with lock:` 會攞住個鎖，出去嗰陣放返 —— 包括由例外出去嗰條路。
'''
hints = [
  "行下個 starter：佢會 UnboundLocalError 死咗，因為 `total += value` 令 total 變咗 pay 嘅本地變數，而且未存在就讀佢。呢個錯誤就係成個診斷。",
  "dict 或者 list 係就地改嘅，所以 `drawer[\"total\"] += value` 改嘅係每條 thread 共用嘅同一個物件。`nonlocal total` 都得，係另一個老實嘅答案。",
  "main 入面整一次 threading.Lock()，讀-改-寫嗰段用 `with lock:` 包住。GIL 唔係鎖住你啲數據嘅鎖；佢係鎖住個直譯器嘅鎖。",
]

