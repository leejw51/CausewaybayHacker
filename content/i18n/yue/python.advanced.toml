[[quest]]
id    = "python.advanced.06.async-queue"
title = "邊個話做完"
story = "三個跑腿喺地庫清緊條落單隊，樓面經理等緊條隊話自己空咗。佢永遠唔會咁講，因為冇人話過佢知有張飛做完咗。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

將 `(index, value)` 對放上一個 `asyncio.Queue`。開 `w` 個消費者 task，
永遠循環：攞一對，將 `value * 10` 寫入 `results[index]`，然後叫
`task_done()`。主 coroutine await `queue.join()`，然後取消啲消費者，
然後按索引次序印啲結果同 `CONSUMERS <w>`。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`queue.join()` 會喺每一個 `put` 過嘅項目都有一個對應嘅 `task_done()` 之後
返回。個 starter 啲消費者從來冇叫過佢，所以 `join` 永遠等落去，個 loop 冇
其他嘢可以行，個程式就 hang 到執行器殺佢為止。同 thread 嗰條街一樣嘅 hang，
寫法唔同 —— 而修法又係一行，喺消費者嗰邊。

啲消費者係 `while True` 循環。佢哋結束係因為 main 喺 join 之後取消佢哋，
而取消一個停喺 `queue.get()` 度嘅 task 係正常、預期嘅停法。用
`gather(..., return_exceptions=True)` await 啲被取消嘅 task，咁個取消
就會被收集，而唔係被報告。
'''
hints = [
  "每處理完一個項目就 queue.task_done()。join 淨係將 put 同 task_done 對數，其他嘢佢唔理。",
  "create_task 將個消費者排上去但唔 await 佢；下次 main await 任何嘢嗰陣個 loop 先會行佢，即係嗰個 join。",
  "一個喺 await get() 嗰陣被取消嘅 task，入面會拋 CancelledError，咁就結束咗個 while True。return_exceptions=True 令 gather 唔會將佢重新拋返畀你。",
]

