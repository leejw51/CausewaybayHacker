[[quest]]
id    = "python.advanced.08.pipeline"
title = "廚房流水線"
story = "波哥喺地庫廚房條流水線：一個崗位將張單平方，下一個崗位計住累計數，冇人會等成批做完。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

砌一條兩級嘅 **generator** 流水線：

