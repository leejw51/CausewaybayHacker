[[quest]]
id    = "python.advanced.09.comprehensions"
title = "行一次寶靈頓道"
story = "阿力話用三個 for 循環就做到。條通道得一個人咁闊，地下又濕；你淨係行得一次。"
brief = '''
標準輸入係一行整數，用空格隔開。

印三行：

1. 所有雙數嘅總和（冇嘅話印 `0`）
2. 所有大過 `10` 嘅值，乘二，按原本次序，用單個空格連埋 —— 冇嘅話印 `-`
3. 有幾多個唔同嘅值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

用 comprehension，唔好用索引循環：`sum` 入面放一個 generator expression，
第二行用一個帶 `if` 嘅 list comprehension，第三行用一個 set comprehension。
`if` 放喺最尾，負責過濾；放喺最前嘅表達式負責轉換。

`" ".join(...)` 要字串，所以第二個 comprehension 要產出 `str(v * 2)`，
唔係 `v * 2`。嗰個 `TypeError: sequence item 0: expected str instance,
int found` 就係人人喺呢行都會撞到嘅。
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) —— generator expression 係唯一參數嘅時候，唔使多加括號。",
  "[str(v * 2) for v in nums if v > 10] —— 前面轉換，後面過濾。",
  "{v for v in nums} 係 set comprehension；set(nums) 係同一樣嘢，喺呢度用邊個都得。",
]

