hints = [
  "個錯誤係 TypeError: cannot unpack non-iterable int object —— running 返回咗一個數，而唔係 yield 啲對。",
  "循環入面 yield value, total。一個入面任何地方有 yield 嘅 function 就係 generator，佢嘅返回值唔係叫佢嘅人見到嘅嘢。",
  "running(squares(nums)) 夾到埋，係因為 generator 係可迭代嘅；running 從來唔知、亦都唔在乎佢嘅輸入係另一個 generator。",
]

