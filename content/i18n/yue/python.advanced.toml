[[quest]]
id    = "python.advanced.03.lists"
title = "條龍嘅中間"
story = "崇光地庫燒鵝檔排咗四十個人。個櫃檯睇到龍頭同龍尾，中間嗰啲一個都睇唔到。"
brief = '''
標準輸入第一行係個數量 `n`，第二行係 `n` 個整數，用空格隔開。

印三行：第一個值、最後一個值，同埋佢哋兩個之間（唔計佢哋本身）所有值嘅總和。
少過三個值嘅話，個總和係 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` 就係中間：一個 slice，佢係一個**新嘅 list** —— Python 切片
係會複製嘅，同 Rust 嘅 slice 或者 Go 嘅 sub-slice 唔同。`nums[-1]` 係最後
一個元素，有負數索引，正正就係你喺 Python 永遠唔會寫
`nums[len(nums) - 1]` 嘅原因。

淨係得一個值嘅時候，`nums[1:-1]` 係空嘅，`sum` 佢就係 `0`，所以其他語言
要寫嘅守衛喺呢度係免費嘅。呢樣嘢值得知，亦都值得親自 check 下，唔好靠估。
'''
hints = [
  "nums[-1] 係最後一個元素；nums[-2] 係佢前面嗰個。",
  "nums[1:-1] 係除咗頭尾之外嘅所有嘢，而一個空嘅 slice 自己加埋就係 0。",
  "sys.stdin.read().split() 一次過讀晒所有嘢，再按任何空白切開，咁換行喺邊就唔重要喇。",
]

