[[quest]]
id    = "python.advanced.03.queue"
title = "邊個閂個窗口"
story = "燒鵝檔每張單都經個窗口遞入廚房，最後一張之後，廚房就企喺度等一張永遠唔會嚟嘅下一張。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

一條生產者 thread 將每個值乘十放上一個 `queue.Queue`，然後放一個**哨兵**。
主 thread 由個 queue 度攞嘢，攞到見到哨兵為止，每個值印出嚟同時計住總數，
然後印 `SUM <total>` 同 `CLOSED`。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

`queue.Queue` 冇 `close`。上面冇任何嘢可以話畀消費者知已經冇下一個；
呢個信息本身一定要係一個項目，而 `None` 係慣常嗰個。個 starter 從來冇送過佢，
所以 `get()` 永遠塞住，明明已經冇嘢好等，執行器就喺時限到咗嗰陣殺咗個程式。
Python 冇死鎖偵測器。個程式就係唔再應你，由外面睇就係「hang 咗」嘅樣。

哨兵由生產者送。永遠唔係消費者 —— 知道條流完咗嗰一邊，先係結束佢嗰一邊。
'''
hints = [
  "一行，放喺 kitchen 最尾：hatch.put(None)。",
  "消費者已經有 check `is None`。佢一直等緊一樣生產者從來冇送過嘅嘢。",
  "如果啲值本身可以合法地係 None，哨兵就要係一個私有物件：SENTINEL = object()，用 `is` 嚟比較。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.thread-pool"
title = "八個搬運工"
story = "崇光卸貨區有四十箱貨，八個搬運工。冇人想要四十個搬運工；佢哋想要嗰八個永遠冇停過手。"
brief = '''
標準輸入係兩個整數 `w` 同 `n`，然後 `n` 個值。

開一個有 `w` 個 worker 嘅 `ThreadPoolExecutor`，每個值 `submit` 一個工作，
返回 `(index, value * value)`，然後用 `as_completed` 收集結果。按索引排序，
一行印一個 `<index> <value>`，然後印 `WORKERS <w>`。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

`submit` 返回嘅係一個 `Future`，唔係結果。`as_completed` 會按佢哋**完成**
嘅次序交返啲 future 畀你，即係個 pool 高興點就點嘅次序，而 `future.result()`
先係攞個值出嚟嘅方法 —— 或者重新拋出個工作死嗰陣嘅例外，呢個係要叫佢嘅
另一個原因。

個 starter 印嘅係啲 future。將索引放入結果入面帶住，先令輸出次次行都一樣；
按佢排序係答案嘅最後一行，唔係第一行。
'''
hints = [
  "個 starter 拆 Future 嗰陣死咗：`for index, value in sorted(results)` 拆唔開一個唔係 tuple 嘅物件。個 tuple 喺 future.result() 入面。",
  "as_completed 係邊個工作完成就 yield 邊個；結果入面嘅索引係每一個由邊度嚟嘅唯一記錄。",
  "with ThreadPoolExecutor(...) as pool: 出去嗰陣會等晒所有 submit 咗嘅工作，所以你印嘅時候冇嘢仲行緊。pool.map 喺呢度都得，仲會幫你保持次序，代價係學唔到 as_completed。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.asyncio"
title = "async 到底喺邊度行"
story = "阿薇寫咗四年 `async def`，一次都未見過推動佢嗰樣嘢。地庫個落單板得一個 loop，每個檔口輪流喺上面行。"
brief = '''
標準輸入係一個數量 `n`，然後 `n` 個整數。

寫一個 `async def double(value)`，佢向 event loop 讓一次 ——
`await asyncio.sleep(0)` —— 然後返回個值嘅兩倍。用 `asyncio.gather`
一次過行晒 `n` 個，按輸入次序印每個結果，然後印 `SUM <total>` 同
`TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

叫一個 `async def` 唔會行佢。佢砌一個 **coroutine 物件**交返畀你，
入面乜都唔會發生，直到有嘢 await 佢。個 starter 個 list 係三個冇 await 過
嘅 coroutine，Python 喺 stderr 度有講 —— `RuntimeWarning: coroutine
'double' was never awaited` —— 而輸出就係三行
`<coroutine object double at 0x...>`。

`gather` 接收啲 coroutine，全部排上嗰一個 loop，然後**按你傳入嘅次序**
返回佢哋嘅結果，無論佢哋係咩次序完成。呢個就係揀佢而唔係自己手寫一個
`await` 循環嘅全部原因：手寫循環係啱嘅但係逐個行，`gather` 係啱嘅而且
係交錯行。

呢度啱啱好得一條 thread。`await` 係一個 coroutine 將條 thread 交返畀個
loop、等第二個用嘅時刻。冇嘢係平行行嘅；啲嘢係**輪流**行，喺佢哋話可以
停嘅地方停。
'''
hints = [
  "await asyncio.gather(*coroutines) —— 個星將個 list 攤開做參數，而個 await 先係真正行佢哋嘅嘢。",
  "asyncio.run(...) 就係執行者：佢整個 loop，將一個 coroutine 行到完，然後閂個 loop。一個程式得一個，喺最頂。",
  "gather 按參數次序返回結果。如果你要邊個完成先攞邊個，嗰個係 asyncio.as_completed，咁你就要自己帶住個索引，同 thread pool 一模一樣。",
]

