[[quest]]
id    = "go.hacker.12.heap"
title = "K 條排好嘅隊"
story = "每間 Lucky Mac 分店送嚟嘅單都已經排好次序。將佢哋合併做一行，唔好成堆再排一次。"
brief = '''
第一行係 `k`。然後 `k` 行，每行係一個數量，跟住咁多個已經由細到大排好嘅整數。

將佢哋全部合併做一行由細到大，用空格分隔，然後印 `POPS <total count>`。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

heap 每條 list 裝一個項目，唔係每個元素一個，所以無論啲 list 幾長，佢都保持 `k` 咁大。每個項目都要記住自己由邊條 list 嚟，否則 pop 咗之後補唔返。

`container/heap` 就係一個 slice type 上面嘅五個 method。`Len`、`Less` 同 `Swap` 用 value receiver；`Push` 同 `Pop` 用 pointer receiver，因為佢哋會改長度。

呢度嘅測試好細：佢哋檢查嘅係長短唔一嘅 list、空 list 同重複嘅值，唔係你嘅速度。將所有嘢駁埋再排序，四個都過到。對一個真實嘅 `k` 嚟講，答案仍然係 heap——呢度擋住你嘅係面試官，唔係個鐘。
'''
hints = [
  "heap.Pop 回傳 any，所以用 type assertion 轉返做 entry 係慣用寫法嘅一部分。",
  "一開始放項目入 heap 嗰陣跳過空嘅 list，否則第一次 pop 就會讀過咗其中一條嘅尾。",
  "只係喺 pop 咗一條 list 嘅一個元素嗰陣，先 push 嗰條 list 嘅下一個元素——咁 heap 就保持喺 k。",
]

