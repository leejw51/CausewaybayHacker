[[quest]]
id    = "go.hacker.05.brackets"
title = "喺邊度爛咗"
story = "投影機上面一個 config file，面試官問嘅唔係佢有冇爛，而係邊個字元整爛咗佢。"
brief = '''
一行，淨係由 `(`、`)`、`[`、`]`、`{`、`}` 組成。

如果每個括號都由同一種括號按正確次序關返，印 `VALID` 然後印 `0`。

否則印 `INVALID`，然後印出事嗰個字元嘅**由 1 開始嘅 index**：

* 一個同開緊嘅嘢唔夾嘅關括號——關括號自己嘅 index
* 一個冇嘢開緊嘅關括號——關括號自己嘅 index
* 行尾仲有嘢開緊——最後一個仲未關嘅括號嘅 index

```
input:  ([]{})
output: VALID
        0
```
'''
hints = [
  "push 每個開括號嘅 index，唔係個字元——你要有個 index 先報得出嚟。",
  "如果 stack 係空，或者 stack 頂嗰個 index 嘅字元唔係佢嘅配對，個關括號就錯。",
  "如果 loop 完咗 stack 仲有嘢，最頂嗰個就係最後一個未關嘅括號。",
]

