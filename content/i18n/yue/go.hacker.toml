        8 10
        15 18
        COUNT 3
```

掂到都當重疊：`1 4` 同 `4 5` 合併做 `1 5`。
'''
hints = [
  "先按起點排序。之後由左至右行一次就夠。",
  "merged[last].end 可以直接賦值，因為 merged 係一個 struct 嘅 slice，唔係 pointer 嘅 slice——直接寫入去就得。",
  "延長到兩個終點之中大嗰個——一個喺長區間入面嘅短區間唔可以令佢縮短。",
]

