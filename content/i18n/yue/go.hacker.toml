[[quest]]
id    = "go.hacker.06.rotated"
title = "兜返轉頭嗰條線"
story = "港島線嘅時間表由錯嘅站開始，仲要兜返轉頭，而佢哋照樣要你用 log 時間查。"
brief = '''
第一行係 `n target`。第二行係 `n` 個唔同嘅整數：一張本來按遞增排好序、然後向左 rotate 咗若干位（可以係零）嘅清單。

印出 `target` **由 1 開始**嘅 index，唔喺入面就印 `-1`。然後印 `PIVOT <p>`，即係最細嗰個值由 1 開始嘅 index。

```
input:  7 0
        4 5 6 7 0 1 2
output: 5
        PIVOT 5
```

兩次 binary search，或者一次聰明嘅。無論點，線性掃描都係另一條題目嘅答案。

呢度嘅測試好細：佢哋檢查嘅係 pivot、搵唔到嘅 target 同冇 rotate 過嘅清單，唔係你嘅速度——亦都冇一個測試檢查得到。個 array 係喺輸入入面嚟嘅，所以讀佢已經係線性，而喺一張啱啱讀完嘅清單上面搜一次，點做都係一樣嘅成本。擋住線性掃描嘅係面試官，唔係個鐘。
'''
hints = [
  "pivot 係唯一一個值大過後面嗰個嘅位置——將 mid 同 hi 比，唔好同 lo 比。",
  "pivot 個 loop 完咗之後，lo == hi，嗰個就係最細值嘅 index；冇 rotate 過嘅清單會得出 0。",
  "每一半都係普通排好序，所以第二次搜尋就係一個普通嘅 binary search，最多行兩次。",
]

