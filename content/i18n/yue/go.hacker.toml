for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只可以向**右**或者向**下**行，行經開放嘅格。印：

1. `PATHS <k>`——由 `(0,0)` 去 `(r-1,c-1)` 有幾多條唔同嘅路線，模 `1000000007`
2. `MIN <cost>`——一條路線嘅最細總成本，兩個端點都計埋，冇路線就印 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按 row-major 次序行一次就兩樣都做到：一格嘅路線數係由上面同由左邊入嚟嘅路線數總和，而佢嘅最佳成本係佢自己嘅成本加兩者之中平啲嗰個。因為你只會向右或者向下行，你需要嘅兩格永遠已經做完——唔使遞迴，亦都唔使 visited set。

`PATHS` 嘅數目模 `1000000007`，原因同平時一樣：喺 `1000 × 1000` 嘅隱藏測試，真正嘅數有六百幾個位。要邊加邊約。

**大 case 強制嘅嘢：**佢刷走任何逐條列舉路線嘅答案。路線多過間房入面嘅原子。佢
分唔到由下而上嘅表同 memoised 遞迴 — 兩個都同格數成線性，兩個都輕鬆過到。
'''
hints = [
  "每格都抽兩個值，包埋兩個角——產生器唔會跳過佢哋，只係唔會封佢哋。",
  "一個開放嘅格，如果上面同左邊都冇開放嘅鄰居，就係零條路線到得到，亦冇最佳成本；保持 inf 代表 `unreachable`，並且守住個加法。",
  "終點可以係開放但到唔到，正正就係 PATHS 係 0、MIN 係 -1 嗰陣。其中一個隱藏測試就係咁。",
