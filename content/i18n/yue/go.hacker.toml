[[quest]]
id    = "go.hacker.07.anagrams"
title = "同一堆字母"
story = "一版站名，啲字母搖亂咗。將係同一個名嘅歸埋一組。"
brief = '''
第一行係 `n`。第二行係 `n` 個細楷字，用空格分隔。

將互為 anagram 嘅字分組。每組印一行，組入面啲字按遞增排序，用單一空格連埋。組同組之間按佢哋第一個字遞增排。然後印 `GROUPS <k>`。

重複嘅字喺佢嗰組入面會出現兩次。

```
input:  6
        eat tea tan ate nat bat
output: ate eat tea
        bat
        nat tan
        GROUPS 3
```

key 就係將個字嘅字母排好序之後嘅字。兩個字係 anagram，正正就係佢哋嘅 key 相等嘅時候，而呢個係一次 map 查找，唔係同到而家見過嘅所有嘢逐個比較。

呢度嘅測試好細：佢哋檢查嘅係分組、次序同重複嘅字，唔係你嘅速度。照樣寫用 map key 嘅答案——真實嘅 `n` 係幾千個字，而將每個字同到而家砌好嘅每一組比較，正正係呢條題目要篩走嘅嘢。
'''
hints = [
  "對 []byte(word) 做 sort.Slice，再用 string(...) 轉返做 string，就係個 key。",
  "對一個唔存在嘅 key append 落 groups[k] 係得嘅：slice 嘅 zero value 係 nil，而 append 識得處理 nil。",
  "將連埋咗嘅行排序，就係按第一個字排序，因為每行都係由第一個字開始。",
]

