[[quest]]
id    = "go.hacker.08.kth-largest"
title = "第 K 大"
story = "熱身回合，而佢哋照樣要 heap，唔要排序。"
brief = '''
標準輸入係兩個整數，`n` 同 `seed`。輸入入面冇清單——你要自己砌，**完全**用呢個 generator，用 `uint64` 計，喺 Go 入面佢會自己 wrap around，唔使搞任何花臣：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

k = n / 2 + 1
```

嗰個除法係整數除法，所以無論 `n` 幾細，都係 `1 <= k <= n`。

印出第 `k` 大嘅**值**——重複都計，所以喺 `3 3 1` 入面第 2 大係 `3`。然後印 `HEAP <size>`，即係你完成嗰陣手上揸住幾多個元素。

```
input:  8 1
output: 189567123
        HEAP 5
```

`8 1` 嘅 array 係
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`，
而 `k` 係 `5`。最大嘅五個按次序係
`908834774 822192870 708211027 392341189 189567123`，所以答案係佢哋最後嗰個，而你停低嗰陣手上揸住五個值。

**個大測試強制咩，唔強制咩。** 其中一個隱藏測試係 `n = 200000`，`k` 係 `100001`。佢會踢走將成張清單掃 `k` 次搵最大值嘅答案：嗰個係 `O(nk)`，兩乘 `10^10` 次比較，要四十五秒，但執行限制得五秒，而 starter 就係咁做。佢**唔會**踢走將成張清單排序——`n log n` 好快，排序喺呢度輕鬆過到。如果你寫排序，就大聲講出嚟；扮個鐘踢走咗佢，仲衰過寫佢。

佢哋想聽嘅答案係**大小係 k 嘅 min-heap**：每個值 push 入去，heap 大過 `k` 就 pop，最後個 root 就係答案。嗰個係 `O(n log k)`，揸住嘅係 `k` 個值而唔係 `n` 個，而個大測試二十五毫秒就返嚟。兩個數字都係喺呢部機度，用呢個 quest 嘅兩個程式量出嚟。

`container/heap` 就係一個 slice type 上面嘅五個 method：`Len`、`Less`、`Swap`、`Push`、`Pop`。`Push` 同 `Pop` 用 pointer receiver；另外三個唔係，而呢個唔對稱正正係個個喺個鐘面前都會搞錯嘅嘢。
'''
hints = [
  "Push 同 Pop 係最原始嘅 slice 操作——append 同斬走條尾。會 sift 嘅係 heap.Push 同 heap.Pop。",
  "永遠唔好直接 call h.Push；要 call heap.Push(h, v)，否則 heap invariant 唔會還原。",
  "loop 完之後，k 個最大入面最細嗰個喺 index 0，而佢就係整體嘅第 k 大。",
]

