  "呢度用 queue = queue[1:] 做 dequeue 冇問題——成個街區做完之後，後面嗰個 backing array 就會被丟棄。",
  '''grid[r][c] 係 index 一個 string，所以佢係一個 byte：同 '#' 比較，唔係 "#"。''',
]

