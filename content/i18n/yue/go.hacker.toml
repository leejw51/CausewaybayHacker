`buckets` 好細，所以幾乎全部都係打和，而答案幾乎完全由佢哋點處理決定。

**呢關講嘅係要知道你手上係邊種排序。** `sort.SliceStable` 係穩定嘅——相等嘅元素保持佢哋嘅相對次序。`sort.Slice` **唔係**，而喺真嘅輸入上面佢會明顯咁唔係：佢係 pattern-defeating quicksort，通常快啲，而且對打和完全冇任何承諾。starter 用咗佢，而隱藏測試夠大，證明得到佢會打亂啲打和。（喺 `n = 8` 佢碰啱冇打亂——所以一個細嘅測試乜都證明唔到，亦都係點解呢度個細測試係*睇得見*嗰個，而唔係判你嗰個。）

有兩個正確答案，兩個你都應該講得出。用 `sort.SliceStable`。**或者**保留 `sort.Slice`，將個比較變做**全序**——分數相等嗰陣比較 index，咁冇兩個元素會比較得相等，穩定性就唔再係問題。第二個係預設應該用嘅；次序完全講明咗嘅時候，一個唔穩定嘅排序冇嘢要證明。

