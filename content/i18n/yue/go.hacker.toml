[[quest]]
id    = "go.hacker.09.linked-list"
title = "條鏈"
story = "佢哋要冇 slice 嘅做法。節點指住節點，因為條題目真正講緊嘅就係呢個形狀。"
brief = '''
第一行係 `n`。第二行係 `n` 個整數，按次序。

用佢哋砌一條由 `*Node` 組成嘅單向 linked list——答案入面唔准有 slice——然後印三行：

1. 倒轉咗嘅 list，用空格分隔
2. 中間節點嘅值（`n` 係雙數嘅話，攞兩個之中第二個）
3. `LEN <n>`，沿住 list 行嚟數

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

中間用快慢指標：一個 pointer 每次行一步，一個每次行兩步，快嗰個行完嗰陣，慢嗰個就喺度。行一次，而如果有人問你，同樣兩個 pointer 仲可以偵測循環。
'''
hints = [
  "由尾砌返去頭係容易嗰個方向：每個新節點將舊嘅 head 當佢嘅 Next。",
  "覆寫 cursor.Next 之前先儲低佢，否則 list 剩低嘅部分就冇咗。",
  "fast 每成功行兩步，slow 就行一步；fast 或者 fast.Next 係 nil 嗰陣就停。",
]

