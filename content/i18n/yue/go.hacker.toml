[[quest]]
id    = "go.hacker.11.bst"
title = "佢係咪真係一棵 BST"
story = "追問。個個都檢查兩個子節點，個個第一次都錯。"
brief = '''
同上一關一樣嘅層序編碼：`-1` 係冇節點，`i` 嘅子節點係 `2i+1` 同 `2i+2`。

第一行係 `n q`。第二行係 `n` 個樹值。第三行係 `q` 個查詢值。

印 `VALID` 或者 `INVALID`——左子樹每個值都嚴格細過個節點，右子樹每個值都嚴格大過。然後每個查詢一行：`<value> FOUND <depth>`，根係深度 1，或者 `<value> ABSENT`。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

喺每個 node check `left < node < right` **係唔夠嘅** — 左子樹深處嘅一個值仍然可以
大過某個祖先。改為將個開區間傳落去。

查找係 **BST 向下行**，唔係搜成棵樹：由根開始，target 細啲就向左，大啲就向右，跌出棵樹就停。喺一棵 `INVALID` 嘅樹上面，呢個向下行可以直接行過一個坐喺 array 入面嘅值——而佢仍然一定要報 `ABSENT`，因為 BST 查找准用嘅成本就只有向下行。其中一個隱藏測試正正就係呢棵樹。
'''
hints = [
  "將一個開區間傳落去。根攞成個 int64 範圍；左子節點攞 (low, node)，右子節點攞 (node, high)。",
  "冇節點係空泛地有效——base case 回傳 true。",
  "查找就係 binary search：細啲向左，否則向右，深度就係跳咗幾多下。",
]

