# GO LAND — HACKER, in Cantonese. A translation pack (SPEC §12.1):
# the prose of `content/go/hacker.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "go.hacker"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.hacker.01.two-sum"
title = "兩個車費"
story = "同一間房，同一條第一題，今次佢哋要你用 Go 寫。"
brief = '''
第一行係 `n target`。第二行係 `n` 個整數。

印出兩個唔同項目嘅**由 1 開始**嘅 index `i j`，佢哋加埋等於 `target`，寫做 `i j`，`i < j`。如果有多過一對得，就畀第二個 index 最細嗰對；仲係打和嘅話，就畀第一個 index 最細嗰對。冇一對得嘅話，印 `-1`。

```
input:  4 9
        2 7 11 15
output: 1 2
```

呢度嘅隱藏測試好細：佢哋檢查嘅係打和規則同冇答案嘅情況，唔係你嘅速度。但條題目仍然係要線性嗰個——行一次、一個 hash map——因為真實嘅 `n` 係 200000，而巢狀 loop 正正係呢條題目要篩走嘅嘢。寫條題目問緊嘅答案，唔好寫啱啱好過到呢四個測試嘅嗰個。
'''
hints = [
  "行一次。對每個值，問個 map target 減佢係咪已經見過。",
  "重複嘅值只記低第一個 index——正正係題目要嘅打和規則。",
  "成個慣用寫法就係 comma-ok 形式：i, ok := seen[k]。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.hacker.02.window"
title = "最短嘅一段"
story = "最少要幾多個連續嘅站先夠行完段距離。佢哋要站數，然後要知佢由邊度開始。"
brief = '''
標準輸入係兩個整數，`n` 同 `seed`。輸入入面冇 array——你要自己砌，**完全**用呢個 generator，用 `uint64` 計，喺 Go 入面佢會自己 wrap around，唔使搞任何花臣：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

s = (sum of all n values) / 2
```

嗰個除法係整數除法，亦都係點解一定有答案：成個 array 按構造一定去到 `s`。

搵出總和最少係 `s` 嘅最短連續一段。印佢嘅長度，然後印佢**由 1 開始**嘅起點 index。如果有幾段一樣咁短，揀最左嗰段。

```
input:  8 1
output: 3
        3
```

`8 1` 嘅 array 係
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。
總數係 `3330417819`，所以 `s` 係 `1665208909`，而由 index `3` 開始嘅三個值就係去到佢嘅最短一段。

**呢個 quest 會強制檢查複雜度。** 其中一個隱藏測試係 `n = 500000`。starter 係老實嘅平方答案——由每個起點向前行，直到總和去到 `s`——而因為 `s` 係總數嘅一半，每次行都大約有 `n / 2` 個元素咁長。即係大約 `10^11` 次加法，要行三十八秒，但執行限制得五秒。兩頭都只係向右郁嘅做法係 `O(n)`——每個元素加一次、減一次——同一個測試七毫秒就返嚟。喺呢部機度，用呢個 quest 嘅兩個程式量出嚟。

個測試用 `n = 500000` 而唔係 `200000`，因為內層 loop 只係一個加法加一個提早 break，而編譯器最擅長就係呢種嘢：喺 `200000`，平方答案都仲係六秒左右，離個限制太近，做唔到關卡。

去到呢個大小，總數大約係 `2.5 × 10^14`。用 `int64` 累加。Go 嘅 `int` 喺呢個 build 上面係 64 bit，所以淨係用 `int` 都過到，而正正因為咁，呢個習慣一定要由你自己嚟，唔可以靠編譯器。
'''
hints = [
  "先砌好個 array，用 int64 計總數——s 係總數嘅一半，而總數遠遠超過 32 bit 裝得落嘅範圍。",
  "保持一個累計總和。每一步加一次 values[right]，永遠唔好重新計；個 window 一去到 s，就記低佢，然後減走 values[left]。",
  "淨係喺一段嚴格更短嘅時候先記低新嘅最佳，咁每個長度留低嘅都係最左嗰段。",
]

