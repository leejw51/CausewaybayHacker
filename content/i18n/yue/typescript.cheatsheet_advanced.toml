[[quest]]
id    = "typescript.cheatsheet_advanced.09.labeled-rest-tuple"
title = "一個指令同佢啲數字"
story = "控制室個 console 收一個動詞，然後幾多個數字就睇個動詞需要幾多。`show 1 2 3`、`clear`，永遠唔會係 `1 2`。"
