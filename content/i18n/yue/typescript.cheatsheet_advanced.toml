# TYPESCRIPT LAND — CHEATSHEET ADVANCED, in Cantonese. A translation pack
# (SPEC §12.1): the prose of `content/typescript/cheatsheet_advanced.toml`,
# quest by quest, and nothing else. The question is the brief; the four
# choices are code, live in the English pack, and are never translated. Code
# blocks, identifiers and printed strings are copied verbatim.

pack   = "typescript.cheatsheet_advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet_advanced.01.generic-bound"
title = "有 ID 嘅乜都得"
story = "19:10，三十樓個控制室。島上每個螢幕都有個 id；個查找表應該收任何一個佢哋嘅 list，而且唔可以改佢。"
brief = '''
`xs` 係一個 `readonly Screen[]`（即係一個 `ReadonlyArray<Screen>`），而
`Screen` 有 `id: string`。開 generic function `byId`，佢個 body 係

```ts
return new Map(xs.map(x => [x.id, x] as const));
```

佢一定要接受 `xs` —— 同埋任何其他帶住 string `id` 嘅嘢嘅唯讀 array ——
而且令個 body 編譯得到。`strict` 開住。
'''
hints = [
  "光秃秃嘅 `T` 冇 `id`；畀個參數一個 bound。而且要求可變 array 嘅地方，唯讀 array 係過唔到嘅。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet_advanced.02.mapped-draft"
title = "每個 KEY，或者有"
story = "希慎廣場一個螢幕 config 嘅草稿可以填一半，仍然可以改。個形狀跟真嗰個，一個 key 一個 key 咁跟。"
brief = '''
用手寫 `Draft<T>` —— 唔好用做呢樣嘢嘅內置 utility type：同 `T` 一樣嘅 key，
每個都係可選，每個保留自己嘅類型，而且仍然可以寫。
`type Screen = { id: string; w: number }` 嘅話，
`const d: Draft<Screen> = { w: 3 };` 同 `d.w = 5;` 都編譯得到。
'''
hints = [
  "mapped type 會行過 `keyof T`；方括號後面一個 `?` 令每個 key 變可選（即係用手寫嘅 `Partial<T>`），`-?` 令佢變必填（`Required<T>`），而前面加 `readonly` 就會凍結佢（`Readonly<T>`）。",
]

