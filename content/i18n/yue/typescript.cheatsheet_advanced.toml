]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet_advanced.05.awaited-return"
title = "LOAD 交返嘅嘢"
story = "三十樓個 feed loader 每個 sprint 都改形狀。命名佢結果嘅類型應該跟住佢改，唔係再打多次。"
brief = '''
```ts
async function load() { return { items: [1, 2], at: Date.now() }; }
```

將 `Feed` 宣告做 `load` resolve 出嚟嘅**拆開咗**嘅物件類型 ——
`{ items: number[]; at: number }` —— 由 `load` 本身推導，令
`const f: Feed = { items: [1], at: 0 };` 編譯得到。
'''
hints = [
  "`load` 係一個值，所以你要先攞佢嘅類型。出嚟嘅係一個 `Promise`；再多一個 utility 就可以拆走個 promise。",
]

