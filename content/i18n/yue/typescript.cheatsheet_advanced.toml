[[quest]]
id    = "typescript.cheatsheet_advanced.08.satisfies-palette"
title = "檢查咗，冇放闊"
story = "LED 牆個調色板會對住合約檢查 —— 但個紅色仍然係一個三元組，因為個 shader 會 index 佢。"
