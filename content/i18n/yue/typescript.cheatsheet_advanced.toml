整一個出嚟），而且冇 duplicate-identifier 錯誤。
'''
hints = [
  "同一個 interface 嘅兩個宣告會合併。`type` alias 唔會合併，而 interface 唔可以 extend 自己。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet_advanced.11.hash-private"
title = "運行時都要收埋"
story = "電車站個計數器個數唔關任何人事：唔關子類事、唔關 serializer 事、唔關 `Object.keys` 事。"
brief = '''
```ts
abstract class Panel { abstract draw(): string; }
interface Tally { bump(): void }

class Counter extends Panel implements Tally {
  // the field goes here
  protected label = "c";
  get value(): number { /* returns the field */ }
  set value(v: number) { /* stores v in the field */ }
  bump() { /* adds one to the field */ }
  draw() { return `${this.label}=${this.value}`; }
}
```

加上 `count` 欄位，由 `0` 開始，喺**運行時**同編譯時都收埋：`new Counter()`
之後，`Object.keys(c)` 同 `JSON.stringify(c)` 都唔可以顯示佢。`strict` 開住。
'''
hints = [
  "`private` 關鍵字會同啲類型一齊被擦走；個欄位喺 JavaScript 入面仍然喺度。`#` 名係喺引擎本身私有嘅 —— 而佢唔收 access modifier，而且需要佢嘅 initializer。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet_advanced.12.overload-impl"
title = "OVERLOAD 下面嗰行"
story = "到站板上面個 `parse` 兩個方向都行：入 string 出 number，入 number 出 string。兩個承諾，一個 body。"
brief = '''
```ts
function parse(x: string): number;
function parse(x: number): string;
```

寫跟喺嗰兩個 overload 後面嘅 implementation 行，body 係
`return typeof x === "string" ? Number(x) : String(x);` —— 令
`parse("42")` 係一個 `number`，而 `parse(7)` 係一個 `string`，喺 `strict` 之下。
'''
hints = [
  "implementation signature 一定要闊到涵蓋每一個 overload，一定要有 body，而喺 `strict` 之下佢個參數唔可以唔寫類型。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet_advanced.13.nullish-assign"
title = "空嘅都係 CACHE 咗"
story = "希慎牆個字幕 cache：有啲螢幕嘅字幕係故意留空嘅，而每個 frame 都重新 load 佢哋正正就係上個星期二令幅牆死機嘅原因。"
brief = '''
`cache: Record<string, string>`；`load(k)` 好貴。淨係當個 key **從來未**設過，
先用 `load(k)` 填 `cache[k]` —— 一個 cache 咗嘅 `""` 係一個真實、有效嘅值，
唔可以觸發重新 load。一句。
'''
hints = [
  "`\"\"` 係 falsy。任何問「佢係咪 truthy？」嘅嘢都會重新 load 佢；問「佢係咪 null 或者 undefined？」嘅賦值 operator 就唔會。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.cheatsheet_advanced.14.find-last-chain"
title = "最後一個廣告，如果有"
story = "時代廣場輪播入面最新嘅廣告係 list 最後嗰個，而今晚有一個係故意零像素闊。"
brief = '''
`xs: S[]` 係 `feeds.flatMap(f => f.panels)`，`S` 有 `kind: string` 同
`width: number`。將 `w` 整做 kind 係 `"ad"` 嘅**最後**一個元素嘅闊度，
冇就係 `-1`。闊度係 `0` 一定要以 `0` 出到嚟。唔准用 non-null assertion；
`strict` 開住。Node 22。
'''
hints = [
  "有一個由尾開始嘅搜尋（Node 18+）；`xs.at(-1)` 只係最後一個*元素*，唔係最後一個匹配。佢嘅結果可能係 `undefined`，所以讀屬性要用 optional chain —— 而個預設值唔可以吞咗一個零。",
]

