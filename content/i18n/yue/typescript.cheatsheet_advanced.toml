[[quest]]
id    = "typescript.cheatsheet_advanced.10.declaration-merging"
title = "多一個欄位，同一個名"
story = "供應商嘅螢幕類型冇亮度，而供應商個檔案係唯讀嘅。控制室今晚每個螢幕都需要亮度。"
brief = '''
`interface Screen { id: string }` 宣告喺一個你唔可以改嘅檔案入面。喺你自己
