hints = [
  "喺 object pattern 入面，屬性名先行，新綁定喺冒號後面 —— 同佢睇落嘅相反 —— 而預設值用 `=` 跟喺個綁定後面。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.cheatsheet_advanced.16.range-from-length"
title = "零到 N 減一"
story = "希慎牆五塊 panel，由零開始編號。喺任何一塊亮起之前就需要佢哋嘅號碼 list。"
brief = '''
`n: number`。用一個表達式將 `ix: number[]` 整做 `[0, 1, …, n - 1]` 呢個 list，
每個元素都真係喺度 —— iterate `ix` 一定要行過 `n` 個數字。
'''
hints = [
  "`Array(n)` 係 `n` 個窿，而 `map` 會跳過啲窿。由一個有 `length` 嘅 array-like 砌起，而個 mapper 嘅**第二個** argument 係 index。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.cheatsheet_advanced.17.sorted-two-keys"
title = "最多嘅先，然後按名"
story = "時代廣場螢幕上面個排行榜：最多 hit 嘅先，打和就按名 —— 而個 feed 自己個 list 唔可以喺其他螢幕底下被重新排序。"
brief = '''
`rs: { id: string; n: number }[]` 係由一個 `Record<string, number>` 嘅 tally 用
`Object.entries(tally).map(([id, n]) => ({ id, n }))` 砌出嚟 —— 啲 entry 係
`[string, number][]`。`top` 嘅表達式：啲 row 按 `n` **降序**排，打和就按
`id` 用 locale 嘅 string 次序升序 —— 而 `rs` 本身一定要原封不動。
Node 22，`strict` 開住。
'''
hints = [
  "Node 20+ 有一個會回傳副本嘅 sort。comparator 一定要回傳一個 number，所以 string 嘅打和唔可以用 `<` —— string 有一個 method 會比較並且回傳一個 number。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.cheatsheet_advanced.18.map-group-push"
title = "入啱個桶"
story = "怡和街嘅午夜：每塊 panel 按 kind 分入一個桶。經典嘅 bug 係 push 落一個冇人保存嘅桶。"
brief = '''
`m: Map<string, string[]>`，起初係空嘅。喺 `for (const [k, v] of pairs)` 入面，
將 `v` 加入存喺 `k` 下面嘅 list，第一次見到 `k` 嗰陣就建立嗰個 list ——
用**一**句，令之後 `m` 真係裝住每一個值。`strict` 開住。
'''
hints = [
  "`get` 回傳個 list 或者 `undefined`；`?? []` 畀你一樣嘢去 push，但一個新嘅 `[]` 除非你放佢入去，否則唔會喺個 map 入面（`has` 然後 `set` 會係兩句）。Map 冇 `[k]`，而 `get` 唔收預設值 —— 而當佢以 JSON 離開嗰陣，`Object.fromEntries(m)` 就係出路。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.cheatsheet_advanced.19.deep-copy"
title = "真係副本嘅副本"
story = "希慎牆嘅綵排 feed 一定要係今晚嗰個嘅真副本 —— 一個 id 嘅 Set、一行行數字 —— 令綵排可以喺上面塗鴉。"
