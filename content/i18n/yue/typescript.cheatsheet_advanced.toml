[[quest]]
id    = "typescript.cheatsheet_advanced.03.as-const-union"
title = "三個字，冇 ENUM"
story = "怡和街啲到站板顯示三種 panel，而冇人想多開一個檔案嚟存個 list。"
brief = '''
```ts
const KINDS = ["ad", "news", "tram"] as const;
```

由 `KINDS` 推導 `Kind`，令佢啱啱好係嗰三個 string 嘅 union ——
`const k: Kind = "ad";` 編譯得到，而 `const b: Kind = "bus";` 唔得。
一個 literal 嘅 union，唔係 enum。
'''
hints = [
  "值唔係類型：先攞個值*嘅*類型，然後用 `number` 去 index 個 tuple，就得到佢啲元素可以係乜。",
]

