hints = [
  "spread 同 `Object.assign` 淨係 copy 一層。JSON 來回一次會冇咗個 Set（佢會變成 `{}`）。Node 17+ 有平台自己嘅深 copy。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.cheatsheet_advanced.20.bigint-sum"
title = "櫃台唔准溝埋"
story = "避風塘嘅浪數已經過咗 2 嘅 63 次方；今晚多嗰七個浪係一個普通 number，而個總和一定要精確。"
brief = '''
`big` 係一個大過 2 嘅 63 次方嘅 `bigint`，而 `n` 係一個 `number` ——
`today.reduce<number>((s, w) => s + w, 0)` —— 裝住一個細嘅整數
（`Number.isInteger(n)` 係 true）。將 `total` 整做佢哋嘅**精確**總和。
`number` 過咗 2 嘅 53 次方就會四捨五入，而 `|0` 會喺 32 bit wrap。
'''
hints = [
  "兩個 operand 一定要係同一種，而 cast 唔係轉換。將細嗰個轉上去 —— 用個 function，唔係 `n` 後綴，嗰個淨係對 literal 有效。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.cheatsheet_advanced.21.named-groups"
title = "嗰行入面每一個年份"
story = "午炮下面個牌匾 feed：建成、翻新、到期。入面每個四位數年份都要上板。"
brief = '''
`s` 係 `"built 1998, refit 2015, due 2031"`，而 `ys: string[]` 係空嘅
（每個年份之後會以 `y.slice(-2).padStart(2, "0")` 顯示）。開一個 loop，
行過一個四位數字嘅 named group `y` 嘅**每一個**匹配，令呢個 body 收集每個年份：

```ts
  ys.push(m.groups?.y ?? "");
```

Node 22，TypeScript 5。
'''
hints = [
  "有一個 method 回傳每個匹配連埋佢啲 group —— 而除非個 pattern 帶住 global flag，否則運行時會 throw。named group 係 `(?<name>…)`；Python 嘅 `P` 喺呢度係 syntax error。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet_advanced.22.loop-closure"
title = "每一個都有自己個數"
story = "希慎牆三塊 panel 準備好遲啲亮起，每塊有自己個號碼。三塊都話係 3 嗰個 bug，係 Skynet 第一樣建議過嘅嘢。"
brief = '''
```ts
class Board {
  q: (() => void)[] = [];
  show(i: number) { /* lights panel i */ }
  arm(n: number) {
    // the loop goes here
  }
}
```

喺 `arm(n)` 入面，將 `n` 個 closure push 上 `this.q`。第 k 個**遲啲**被呼叫嗰陣，
一定要用佢自己個 `k` 呼叫 `this.show(k)` —— `arm(3)` 之後全部行一次會亮起
`0, 1, 2`，唔係 `3, 3, 3`。`strict` 開住。
'''
hints = [
  "`var` 係成個 loop 一個變數；block-scoped 嘅綁定每一轉都係新嘅。而 `function () {}` 有自己嘅 `this`，strict mode 拒絕估佢係乜。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.cheatsheet_advanced.23.type-only-import"
title = "唔留痕跡嘅 IMPORT"
story = "個螢幕 module 一 load 就向控制室 log。個 app 淨係想要佢嘅類型，而冇人想 build 嗰陣見到嗰個 log。"
brief = '''
`screen.ts` 有 `export interface Screen { … }` —— 一個 **named** export，冇
default —— 同一個頂層 `console.log`，個 module 一 load 就會行。
`verbatimModuleSyntax` 開住。import `Screen` 用喺一個類型註解度，令
emit 出嚟嘅 JavaScript 入面**乜嘢**都唔剩低：個 log 唔可以觸發。
'''
hints = [
  "喺 `verbatimModuleSyntax` 之下，普通咁 import 一個類型係錯誤，而大括號*入面*嘅 `type` modifier 仍然會留低一個會 load 個 module 嘅 `import {}`。將個 modifier 放喺成句上面。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.cheatsheet_advanced.24.error-cause"
title = "留住原本嗰個"
story = "個 feed fetch 喺三層樓下面因為一個 TypeError 失敗咗。控制室想自己個 error 擺喺上面，而真正嗰個仍然掛喺下面。"
brief = '''
喺 `catch (e: unknown)` 入面，throw 一個**新**嘅 `Error`，訊息係
`"feed failed"`，並且將 `e` 掛住做佢嘅原始 cause（ES2022），令呼叫者
仍然可以對掛住嗰個行 `instanceof TypeError`。`strict` 開住。
'''
hints = [
  "`Error` 收第二個 argument —— 一個 options 物件，唔係個 error 本身。而 `e` 係 `unknown`：唔 narrow 嘅話你讀唔到佢嘅 `.message`。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.cheatsheet_advanced.25.all-settled"
title = "數吓到咗幾多個"
story = "六個車手離開糖街；一個被雨截停咗。廚房加總到咗嘅，唔會因為一個冇到就掉咗成晚。"
brief = '''
`ps: Promise<number>[]`，而 `rs = await Promise.allSettled(ps)`。喺
`for (const r of rs)` 入面，將每個**成功**嘅 promise 嘅值加落 `total`，
跳過失敗嗰啲 —— 一行，喺 `strict` 之下編譯得到。
'''
hints = [
  "每個結果係一個以 `status` 區分嘅 union；淨係成功嗰個分支有 `value`。兩個 status string 係 spec 用嗰兩個，唔係 \"resolved\"，亦唔係 `ok`。（`Promise.all` 會喺第一個失敗就 throw，而 `Promise.race` 淨係交返一個。）",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet_advanced.26.for-await"
title = "每個到嗰陣"
story = "怡和街啲板嘅 tick feed 一個一個咁嚟，每個都要等一陣。個總和係隨住佢哋到而增長，唔係等全部到齊先。"
brief = '''
`ticks()` 回傳一個 `AsyncGenerator<number>`。喺一個 `async` function 入面，
開個 loop，每個 `t` 一到就收到，令 body `sum += t;` 喺 `strict` 之下編譯得到。
'''
hints = [
  "async iterable 冇 `[Symbol.iterator]`，所以普通 `for…of` 會被拒絕 —— 而 await 個 generator 物件亦冇幫助。個 `await` 係屬於個 `for` 嘅。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet_advanced.27.iterable-stack"
title = "SPREAD 個 STACK"
story = "控制室個 undo stack 應該可以 spread 做 array，又可以好似樓面其他嘢咁用 `for…of` 行。"
brief = '''
```ts
class Stack<T> {
  #items: T[] = [];
  push(x: T) { this.#items.push(x); }
  pop(): T | undefined { return this.#items.pop(); }
  // one more method goes here
}
```

加上嗰一個 method，令 `s.push(1); s.push(2)` 之後 `[...s]` 得到 `[1, 2]`，
而且令 `for (const x of s)` 編譯得到。`strict` 開住。
'''
hints = [
  "個 method 嘅名係方括號入面一個 well-known symbol，佢一定要係 generator（個星），而用 `yield*` 委託畀個 array 會一個一個咁交出啲 item —— 普通 `yield` 會將成個 array 當一個 item 交出去。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet_advanced.28.exhaustive-never"
title = "第四種會整死個 BUILD"
story = "今日兩種 panel。下個 sprint 有人加第三種嗰陣，個 build 一定要喺呢個 switch 度失敗 —— 唔係時代廣場個螢幕喺 19:00 失敗。"
brief = '''
`Shape` 係 `{ kind: "ad"; w: number } | { kind: "news"; len: number }`，而
`area(s: Shape): number` 對 `s.kind` 做 switch。喺 `case "ad"` 同 `case "news"`
各自 `return` 之後，寫個 `default`，令個 function 今日編譯得到，**而且**
喺 `Shape` 加入第三種嗰日就停止編譯。`strict` 開住。
'''
hints = [
  "每個 case 都 return 咗之後，`s` 係 bottom type。將佢賦值畀一個嗰個類型嘅變數今日係免費嘅，而一有一種剩低就即刻係 type error。cast 或者 `any` 乜都唔檢查；`throw` 要到 19:00 先發現。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.cheatsheet_advanced.29.type-guard"
title = "由線路落嚟嘅係乜"
story = "JSON 去到三十樓，啲類型冇晒。要有一個 function 喺運行時望吓佢，然後話畀 compiler 知佢見到乜。"
brief = '''
`data: unknown` 由 `JSON.parse` 嚟，而 `Screen` 係 `{ id: string; w: number }`。
開 function `isScreen`，body 係

```ts
return typeof x === "object" && x !== null && "id" in x && "w" in x;
```

令 `if (isScreen(data)) console.log(data.id.toUpperCase());` 編譯得到 ——
喺個 `if` 入面，`data` 係一個 `Screen`。`strict` 開住。
'''
hints = [
  "回傳 `boolean` 對 compiler 嚟講關於 `x` 乜都冇講。return 位置上面嘅 type predicate 就有 —— 參數名、嗰個字、個類型。個參數一定要接受 `unknown`，而 assertion signature 唔可以坐喺 `if` 入面。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.cheatsheet_advanced.30.asserts-defined"
title = "個 ASSERTION"
story = "午夜。島上啲螢幕熄滅之前最後一次查找：個值喺度，或者今晚以一個 throw 出嚟嘅 Error 結束，而嗰行之後 compiler 一定要信佢講嘅嘢。"
brief = '''
個 body 係 `if (x === undefined || x === null) throw new Error("missing");`。
開 generic function `must`，令

```ts
const v = m.get("a");   // m: Map<string, number>, so v: number | undefined
must(v);
```

之後 `v + 1` 呢行編譯得到 —— `must` 向 compiler 承諾由嗰刻起 `v` 既唔係
`null` 亦唔係 `undefined`。`strict` 開住。
'''
hints = [
  "乜都唔回傳嘅 function 唔可以係 type predicate；佢可以係 assertion signature。而 assert `x is T` 乜都 narrow 唔到 —— 要 assert 嘅係嗰個將 `null` 同 `undefined` 由類型度剝走嘅 utility。",
]
