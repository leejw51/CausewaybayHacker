[[quest]]
id    = "zig.advanced.32.overflow"
title = "停咗嘅計數器"
story = "收費廣場嘅公升計數器係一個 i32，去到 2147483647 公升，支閘就落咗嚟，收費亭個螢幕寫住 panic: integer overflow。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數，每個都裝得落一個 `i64`。佢哋嘅累計總數
都裝得落 `i64`。

印兩行：如果沿途每個累計總數都裝得落一個 `i32` 就印 `INT32 OK`，否則印
`INT32 OVERFLOW <i>`，<i> 係第一個會將佢推出範圍嘅值嘅 index（由 0 開始）；然後印
`INT64 <total>`。

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

個 starter 用一個 `i32` 裝總數，喺第二個值就 panic：`panic: integer overflow`。呢個
正正係 Zig 做緊呢個 land 應承過嘅嘢 — 喺 `-O Debug`，一個 overflow 嘅整數會講出嚟兼
停低，而闊嘅 case 仲早一行停，喺嗰個本來會截斷 `5000000000` 嘅 `@intCast` 度。將個
panic 當係一份禮物，然後讀埋合約其餘部分：`+%` 會 wrap，`+|` 會 saturate，而普通嘅
`+` 喺 Debug 會 panic，喺 **`-O ReleaseFast` 係 undefined behaviour**，嗰度個 check
係閂咗嘅，optimiser 會假設佢永遠唔會發生 — 所以 `v` 係正數嘅 `total + v < total`
喺嗰度*永遠係 false*，個測試會被刪走，同 gcc 同 clang 喺 C++ 刪走佢一模一樣。

所以你永遠唔好靠觸發 overflow 嚟偵測佢。你要喺窄嘅加法*之前*偵測，用一個闊啲嘅
型別，或者同上下限比較 — `std.math.minInt(i32)` 同 `std.math.maxInt(i32)` — 而呢個
程式嘅預期輸出冇靠任何一個 build mode 留做未定義嘅嘢。
'''
hints = [
  "用 i64 裝總數，每次加完同 std.math.minInt(i32) 同 maxInt(i32) 比較。永遠唔會有 i32 運算發生，所以冇嘢會 panic，冇嘢係未定義。",
  "淨係記第一個出範圍嘅 index — 一個只會設一次嘅 ?usize — 因為後面嘅值可能會將總數帶返入範圍，而問題問嘅係佢第一次喺邊度出去。",
  "如果你一定要加兩個 i32 又想知安唔安全：@addWithOverflow(a, b) 回傳 wrap 咗嘅和同一個進位 bit，喺每個 build mode 都有定義。呢個先係 check；普通個和嘅正負號就係 optimiser 會刪走嗰樣。",
]

