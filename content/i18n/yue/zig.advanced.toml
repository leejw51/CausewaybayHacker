  "close 唔會掉走 queue 入面仲有嘅嘢；consumer 會繼續攞到值，直到清晒為止，之後先見到 error.Closed。",
  "consumer 行緊嗰陣係唯一印嘢嘅，而 main 喺 taking.await(io) 之後先印 CONSUMED — 就係呢個次序令個 writer 唔使鎖都安全。",
]

