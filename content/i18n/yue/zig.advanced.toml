[[quest]]
id    = "zig.advanced.33.stop-flag"
title = "叫停就停"
story = "夜更嗰條行車線一直行到有人叫佢停為止，而直到呢更之前，冇人叫得停佢。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

開兩條 thread。第一條加總啲值，存低結果。第二條收一個**停止 flag**，一個
`*std.atomic.Value(bool)`，一直 loop 到讀到 `true` 為止；讀到嗰陣，佢會行一個會
設定第二個 flag 嘅 `onStop` 函數，然後記低佢停咗。喺 `main` 設定停止 flag，
join 晒兩條，然後印：

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread` 冇 `stop_token`，亦冇 `jthread`；最接近嘅係砌成佢哋嘅材料，人手傳入去。
一個停止要求就係一個由要求者寫、worker 讀嘅 `bool`，而因為有兩條 thread 掂佢，佢係
一個 atomic：一邊 `stop.store(true, .release)`，另一邊喺 worker 迴圈入面
`stop.load(.acquire)`。一條會 check 自己 flag 嘅 thread，係一條你永遠閂得停嘅
thread；唔 check 嗰條就係個 starter 嘅夜更行車線，佢個 `join` 永遠都唔會返。

C++ 嘅 `stop_callback` 喺叫停嗰一刻就喺叫停嗰條 thread 上面行；呢度係 worker 見到
個 flag 嗰陣自己行 `onStop`，係同一個承諾 — *因為有人叫停，所以有嘢發生* — 由另一邊
守住。`store` 之後嘅 `join` 就係 `jthread` 嘅 destructor，寫出嚟：先要求，再等。迴圈
入面嘅 `std.Thread.yield()` 將個 core 讓畀其他想用嘅人；淨係空轉都過到，亦都嘥咗一個
core。
'''
hints = [
  "行車線 thread 經指標收三個 flag；佢個迴圈係 while (!stop.load(.acquire)) std.Thread.yield() catch {};，迴圈之後呼叫 onStop 再 store stopped。",
  "設定 flag 之前先 spawn 條行車線，之後先 join。喺 thread 開始之前設定 flag 冇問題 — 佢第一次 check 就會停 — 但冇 store 嘅 join 永遠都唔會返。",
  "store 用 .release、load 用 .acquire 係一對，令 store 之前發生嘅嘢喺 load 之後睇得到；呢度用 .monotonic 都會過，而面試官會問點解。",
]

