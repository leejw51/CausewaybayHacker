[[quest]]
id    = "zig.advanced.34.unreachable"
title = "去唔到"
story = "07:59，堅拿道天橋。行車線模型將一個分支標做去唔到，朝早啲車去咗到，所有行車線一齊封閉 — 而一條行車線 thread 仲讀緊一個收費廣場已經交返咗嘅 buffer。"
brief = '''
第一行係 `w n`：`w` 條行車線同 `n` 個讀數。第二行係啲讀數。

`pump(gpa, w, ledger)` 對住一個有引用計數嘅 `Ledger`（三個任務之前嗰個）揸住嘅讀數開
`w` 條 thread；第 `i` 條將由 `i * n / w` 到 `(i + 1) * n / w` 嘅讀數加入
`partial[i]`，而 `pump` 回傳啲 partial。`main` 每個印 `PUMP <i> <sum>`，再印
`TOTAL <sum>`，然後如果所有嘢做完嗰陣啲讀數已經 release 咗就印 `FREED yes` —
經本帳簿嘅 `alive()` 觀察。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

個 starter 會失敗兩次，而兩次失敗就係呢個 land 嘅兩半。

第一次係個行車線模型。`pump` 計好每條行車線嘅邊界，然後講
`if (begin == end) unreachable;` — *冇車嘅行車線冇可能發生*。三條行車線對住兩個
讀數，佢就發生咗。`unreachable` 唔係註解，亦唔係 assert：佢係 Zig 入面唯一一行解作
