標準輸入係一個數量 `n`，跟住 `n` 個以仙計嘅金額。

將佢哋照到達次序裝落一條鏈，每個金額一個 node：

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

印三行：

1. 照次序嘅金額，用空格分開，冇就印 `-`
2. `SUM <total>`，由一個喺條鏈上面行嘅**遞迴**函數計
3. `LAST <cents>` — 最後一個 node 嘅金額 — 或者 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

個 starter 編譯唔到，而個錯誤正正係指標存在嘅原因。寫 `next: Entry`，編譯器就要
喺記憶體度排好 `Entry`：`cents` 八個 byte，加一個 `Entry` 有幾大 — 而呢個正正係
佢想計出嚟嘅嘢。*struct 'Entry' depends on itself.*

`?*Entry` 係一個指標，而指標嘅大細編譯器早就知道。Zig 冇 `unique_ptr`；最接近嘅
係佢執行嗰條規則，人手守住：**allocator 就係擁有者。** `gpa.create(Entry)` 交一個
node 畀你，`gpa.destroy(node)` 交返佢，啱啱一次，而*邊個* destroy 佢呢個問題靠慣例
答：條鏈擁有佢啲 node，所以 `main` 回傳之前會行一次條鏈嚟 free 佢。個 `?` 就係編譯器
會 check 嘅部分：`null` 同時係條鏈嘅尾同空鏈，而冇嘢可以唔 unwrap 就經一個
`?*Entry` 讀嘢，所以任何地方都冇另外嘅空 case。
'''
hints = [
  "一行就整好個編譯錯誤：next: ?*Entry — 而家個 struct 係十六個 byte，無論佢指住乜。",
  "由尾砌到頭：node = try gpa.create(Entry); node.* = .{ .cents = v, .next = head }; head = node。舊嘅 head 變咗新 node 嘅尾。",
  "用 while (walk) |node| : (walk = node.next) 嚟行；個 optional 每步 unwrap 一次，迴圈喺 null 完。遞迴總和兩行搞掂：null 係 0，否則就係 cents 加其餘嘅總和。",
  "head 一宣告完就寫 defer freeChain(gpa, head)：defer 係喺佢行嗰陣先讀 head，即係 main 嘅尾，嗰陣條鏈已經完整。",
]

