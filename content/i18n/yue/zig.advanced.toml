        6
        CONSUMED 3
```

C++ 用一個 `std::queue`、一個 mutex、一個 condition variable 同一個 `done` flag
砌出呢樣嘢；Zig 0.16 將成樣嘢做成一個型別。`std.Io.Queue(T)` 係一條建喺你自己擁有
嘅 buffer 上面、有上限嘅 channel：`putOneUncancelable(io, v)` 喺滿嗰陣會等，
`getOneUncancelable(io)` 喺空嗰陣會等，而 `close(io)` 之後，對一個清晒嘅 queue
做 `get` 會回傳 `error.Closed` — 呢個就係 consumer 停嘅訊號，個迴圈係 `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}`。queue 係 FIFO，所以無論
scheduler 點做，次序都係輸入次序。

`io.concurrent(func, .{ args })` 喺 runtime 自己嘅 pool 上面開 `func` — 保證有佢
自己一個並行單位，唔係就呼叫失敗 — 然後交返一個 future 畀你；對佢做
`.await(io)` 就係 join。個 starter 會 hang。producer 推晒所有嘢就回傳，冇人關閉個
queue，consumer 為最後一個值醒咗，清晒個 queue，然後等一個永遠唔會嚟嘅下一個。
每對 producer/consumer 都要有方法講*冇嘢再嚟* — 呢個就係 `close`。
