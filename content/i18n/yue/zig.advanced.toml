[[quest]]
id    = "zig.advanced.20.mutex"
title = "一個錢盤，八個收費亭"
story = "每個收費亭都將自己收咗幾多加落廣場牆上面同一個總數，到咗個鐘尾，牆上面個數同佢哋個個都唔夾。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

每個值開一條 thread，將佢加落**一個共用嘅總數**。join 晒佢哋，然後印
`TOTAL <sum>` 同 `THREADS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

個 starter 編譯到，印 `TOTAL 0`。個 worker **by value** 收 `total` — 一個 copy 入
thread 參數 tuple 嘅 `i64` — 加落自己嗰份 copy 然後掉咗佢。改做傳一個指標
`*i64`，你就有另一個 bug，一個喺咁細嘅測試入面唔會現形嘅：幾條 thread 同時做
`total.* += value` 係一個 **data race**。Zig 嘅 Debug check 捉唔到佢；喺呢度 race
同喺 C++ 一樣係 undefined behaviour，唔只係個數錯咁簡單。

喺總數隔籬擺一個 `std.Io.Mutex`，每條掂佢嘅 thread 都鎖佢，就係答案：
`m.lockUncancelable(io)` 攞鎖，`defer m.unlock(io)` 喺 block 尾放返，中間無論發生乜。
個 worker 收 `io: std.Io` 做參數，因為個 mutex 要用佢 — 喺 0.16，個鎖係 I/O
runtime 嘅一部分，唔係 thread library 嘅，而 `std.Thread.Mutex` 已經冇咗。個
`defer` 就係 C++ 嘅 `lock_guard`，寫喺解鎖會發生嘅位置。
'''
hints = [
  "傳 &total，唔好傳 total：worker 嘅參數變做 total: *i64，加法係 total.* += value。條 thread 應該改 main 嘅 total，唔係佢自己嗰份。",
  "喺 main 寫 var total_mutex: std.Io.Mutex = .init;，tuple 入面傳 &total_mutex，worker 入面加法之前 m.lockUncancelable(io); defer m.unlock(io);。",
  "join 晒之後讀 total 唔使鎖都安全：join() 係一個同步點，而且已經冇 thread 會再寫。",
]

