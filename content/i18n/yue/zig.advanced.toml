# ZIG LAND — ADVANCED, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/zig/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "zig.advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.advanced.01.lines"
title = "收費亭記錄簿"
story = "一號亭嘅更表每架車記一行：收費員聽到嘅名，跟住係佢俾咗嘅錢，有幾多個銀仔就幾多個數。部打印機仲老過條隧道，每版紙尾仍然印住渡輪公司嘅字。"
brief = '''
第一行係個數量 `n`。之後嘅 `n` 行每行係一個名，跟住零個或者多個整數，用空格分開。

每架車印一行，格式係 `<NAME> <how many numbers> <their sum>`，最後印
`BOATS <n>` — 自從部打印機仲係渡輪公司嘅時候，收費廣場每版紙都係用呢行數尾。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

呢度嘅單位係行，唔係 token。對成個輸入做一次 `std.mem.tokenizeAny`，去到空白字元
就停，而且唔理換行，所以佢話唔到你知一架車喺邊度完、下一架喺邊度開始。先將個輸入
切做一行一行 — `std.mem.splitScalar(u8, input, '\n')` 畀你一個 iterator，佢嘅
`next()` 係 `?[]const u8`，一次一行 — 然後**喺嗰行入面**先 tokenize。

嗰啲 slice 個個都係指入 `input` 度。冇嘢係 copy 過嘅：一行就係一個望住你本身已經
擁有嘅 byte 嘅窗口，所以 `input` 要一直生存到你用晒佢哋為止，亦所以
`defer gpa.free(input)` 係最後先行嘅嗰樣。
'''
hints = [
  '''splitScalar 用 '\n' 切，每次 next() 畀你一行；對嗰行做 tokenizeAny，用 " \r\t" 做分隔符，就會行晒佢啲 token，唔會行過佢個尾。''',
  "名係第一個 token，所以喺迴圈之前用一次 fields.next() 攞咗佢；之後 while (fields.next()) |tok| 見到嘅就淨係數字。",
  "得個名嘅一行會出 0 0，唔使特別處理：個 while 迴圈根本一次都唔會行。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.advanced.02.pointers"
title = "copy 唔係本尊"
story = "收費亭主管將每個錢盤嘅數記落張紙嘅副本度，而佢身後牆上面嗰張紙永遠冇變過。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

經一個函數 `load` 將每個值推入同一個 `std.ArrayList(i64)`，然後印三行：
`LOADED <how many>`、由一個淨係讀嘅函數 `total` 計出嚟嘅 `TOTAL <sum>`，同埋
`FIRST <value>` — 乜都冇嘅時候就印 `FIRST NONE`。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

個 starter 編譯到，印 `LOADED 0`。`load` 係 **by value** 攞個 list，而 Zig 嘅參數
係唔可以改嘅，所以個 starter 做咗大家跟住會做嘅嘢：`var mine = sheet;` — 將個 list
個 header copy 一份 — 然後 append 落嗰份度。份 copy 變大咗，份 copy 喺回傳嗰陣死咗，
而牆上面嗰張紙冇人郁過。

用 `*` 講明：型別係 `*std.ArrayList(i64)` 嘅參數係呼叫者個 list 嘅地址，經佢做
`sheet.append(gpa, value)` 就會落到呼叫者個 list 度。`total` 應該攞 `[]const i64`
— 個 list 嘅 `.items` — 因為佢要睇，唔使郁，而型別入面嘅 `const` 就係等編譯器幫你
守住呢個承諾嘅方法。

`FIRST` 係一個 optional 指標：`?*const i64` 一係係第一個元素嘅地址，一係係 `null`，
而 `null` 就係 Zig 唔問過你就唔俾你經佢讀嘢嘅嗰個值 — `if (first) |p|` 就係問。
成個 land 就係呢一句。
'''
hints = [
  "兩個字元就整好 load：signature 入面寫 sheet: *std.ArrayList(i64)，呼叫嗰度寫 &sheet。經指標呼叫 method 唔使箭咀；sheet.append(gpa, v) 都係同一行。",
  "total 應該攞 []const i64，用 sheet.items 嚟呼叫 — 個 const 係一個承諾，編譯器會 check。",
  "&sheet.items[0] 係第一個元素嘅地址，有元素先有意思；if (first) |p| 拆開個 optional，p.* 就係佢後面嘅值。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.advanced.03.slices"
title = "車龍中間"
story = "六點前四號亭已經塞咗四十架車。主管睇到最前嗰個車頭同最尾嗰盞車尾燈，中間嘅一架都睇唔到。"
brief = '''
標準輸入第一行係個數量 `n`，第二行係 `n` 個整數，用空格分開。`n` 至少係 `1`。

印三行：第一個值、最後一個值，同埋嚴格喺佢哋兩個之間所有值嘅總和。少過三個值嘅話，
嗰個總和係 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

slice 就係個序列。`nums[0]` 同 `nums[nums.len - 1]` 係兩頭；`nums[1 .. nums.len - 1]`
係中間，一個指住同一啲 byte 嘅**新 slice**，冇 copy 過任何嘢，喺佢上面行一個 `for`
就係總和。切 slice 同攞 index 一樣會 check：`nums[1..0]`，即係得一架車嘅車龍嘅
中間，會係 `panic: start index 1 is larger than end index 0`，所以對 `nums.len`
嘅守衛要擺喺切之前，唔係之後。

用 `i64` 加。有一個隱藏 case 嘅中間係 `i32` 裝唔落嘅，而喺 `-O Debug` 入面，一個
overflow 咗嘅 `i32` 唔會打圈 — 佢會 panic。
'''
hints = [
  "nums[1 .. nums.len - 1] 係兩頭之間嘅 slice；喺佢上面行一個 for 就加得埋。佢同 nums 共用記憶體。",
  "得一個或者兩個值嘅時候，嗰個範圍係空或者倒轉嘅，而倒轉嘅 slice 喺 Debug 係 panic — 寫佢之前用一個 if 對 nums.len 守住。",
  "中間係 i64：闊嗰個 case 係加兩個三十億嘅值，用 i32 做累加器會 panic，報 integer overflow。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.advanced.04.strings"
title = "byte 唔係字"
story = "收費廣場頭頂塊指示牌將「銅鑼灣」截喺三個 byte，得返一個字。"
brief = '''
讀一行。印三行：

1. 佢有幾多個 **byte**
2. 佢有幾多個 **字元** — UTF-8 code point
3. 將啲字元倒轉咗嘅嗰行

```
input:  causeway
output: 8
        8
        yawesuac
```

嗰行可能有 ASCII 以外嘅字元，噉頭兩個數就唔一樣。Zig 嘅字串係一個 `[]const u8`：
一個 byte 嘅 slice，`.len` 係 byte 數，一向都係。喺呢個層次，個語言對編碼一無所知；
一個 `u8` 就係一個 byte。

UTF-8 唔使解碼都好易數：每個 code point 都係由一個**唔係** `10xxxxxx` 形式嘅 byte
開頭，而每個延續 byte 都係。所以一個 byte `c` 喺 `(c & 0xC0) != 0x80` 嘅時候
先係一個字元嘅開頭。倒轉嘅係字元，唔係 byte — `std.mem.reverse(u8, line)` 會將
`銅` 斬開三舊，再倒轉咁印出嚟。
'''
hints = [
  "for (line, 0..) |c, i| 連 index 一齊行啲 byte；(c & 0xC0) != 0x80 就揀得出每個字元嘅第一個 byte。",
  "將每個字元嘅開頭 index 收入一個 std.ArrayList(usize)；佢嘅長度就係字元數，唔使解碼任何嘢。",
  "由尾到頭行啲開頭 index，將每個字元嘅 byte — line[from..to] — appendSlice 落一個 std.ArrayList(u8)，然後用 {s} 印佢嘅 .items。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.advanced.05.structs"
title = "收費亭帳簿"
story = "二號亭每條車軸都收錢，啲記錄寫喺同一張帳簿表度 — 起碼喺個建議將個 struct 啲函數換咗做一句註解之前係咁。"
brief = '''
第一行係 `<NAME> <n>`。之後嘅 `n` 行係 `<ITEM> <CENTS>`。

幫個名砌一個收集啲項目嘅 `Ledger`，然後照到達次序將每個項目以 `<ITEM> <CENTS>`
印返出嚟，跟住印 `TOTAL <sum>`，再印 `BOAT <name> <count>` — 張帳簿表係渡輪公司
嘅，佢個名嗰格到而家仍然寫住 `BOAT`。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` 可以係 `0`，噉輸出就得最後兩行。

Zig 冇 `class`；最接近嘅係一個入面宣告咗函數嘅 `struct`，而佢就係全部。冇
constructor 會喺你背後行：`init` 係一個你自己寫、回傳個值嘅普通函數。冇隱藏嘅
`this`：`self` 係第一個參數，寫到明明白白 — 函數要寫落帳簿就係 `*Ledger`，淨係讀
就係 `*const Ledger` — 嗰個就係 method 上面嘅 `const`，擺咗出嚟俾你睇。亦都冇
`private:`；一個欄位喺個檔案任何地方都攞得到，令 `main` 唔掂 `items` 嘅，係因為個
struct 提供咗 `total()` 同 `count()`，冇理由兜過佢哋。
'''
hints = [
  "一個 std.ArrayList(Item) 已經夠；個 struct 喺度係為咗等本帳簿擁有自己啲記錄。add 就係一個 append：self.items.append(gpa, .{ .name = name, .cents = cents })。",
  "add 用 self: *Ledger，因為佢寫；total 同 count 用 self: *const Ledger，因為佢哋淨係讀。兩種情況 ledger.add(...) 都係同一個呼叫 — Zig 幫你攞個地址。",
  "啲項目名係 input 嘅 slice，所以填本帳簿唔使本錢，而 input 要生存得長過佢 — main 入面 defer 嘅次序已經保證咗。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.advanced.06.tagged-union"
title = "邊個揸緊軚"
story = "自動收費線對每個 tag 都收會員價，包括唔係會員嗰啲，同埋嗰個根本唔係 tag 嘅。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行 `<TYPE> <HOURS>`。

基本收費係 `500 + 100 * HOURS` 仙。每行印以下其中一樣：

* `MEMBER` — 基本收費
* `CREW` — 基本收費嘅一半，整數除法
* `JUNIOR` — 永遠係 `200`
* 其他 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

將個 tag 做成一個有四個 case 嘅 `union(enum)`，其中一個係 `other`。C++ 嘅
`enum class` 帶唔到 payload，認唔到嘅文字要喺隔籬跟住；Zig 嘅 tagged union 將佢
帶喺個 case **入面**：`other: []const u8`，而其餘三個 case 乜都唔帶。`union(enum)`
嘅 case 唔會偷偷轉做整數，亦唔會將啲名漏出去外面個 scope — 正正係 `enum class`
存在嘅兩個原因。

用一個 `switch` 決定收費。對 tagged union 做 `switch` 一定要 cover 晒每個 case —
漏咗一個就編譯唔到，唔使開任何警告 flag — 而 `.other => |raw|` 就係將 payload 由
佢所在嘅 case 攞出嚟嘅方法。
'''
hints = [
  "other: []const u8 係第四個 case，用 .{ .other = raw } 砌佢；三個 void case 就寫 .member、.crew、.junior。",
  "std.mem.eql(u8, raw, \"MEMBER\") 比較兩個 slice；對 slice 用 == 比較嘅係指標，永遠唔係你想要嘅。",
  "@divTrunc(base, 2) 係寫明咗嘅整數除法；對 signed 整數直接用 /，如果結果可能除唔盡就編譯唔到。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.advanced.07.maps"
title = "收費廣場嗌緊乜"
story = "06:30 嘅收費廣場：每個亭都隔住幾條線嗌緊啲乜，主管想要個排名。"
brief = '''
讀晒成個標準輸入，按空白字元切開。

每個唔同嘅字印一次，格式係 `<word> <count>`，按次數由多到少排，次數一樣就按字由細到大排。

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)` 乜都唔按 — 唔按 key、唔按次數、唔按到達次序 — 所以排名係
另一步：將啲 entry 抄入一個裝細 struct 嘅 `std.ArrayList`，再用一個 comparator 做
`std.mem.sort`。`getOrPut(word)` 會搵到個位或者插入佢，再用 `found_existing` 話你知
係邊樣，正正係數數迴圈想要嘅；一個新位嘅 `value_ptr` 喺你寫佢之前係未初始化嘅。

Zig 冇 lambda。comparator 係一個普通函數，用名傳入去，第一個參數就係佢本來會
capture 嘅 context — 呢度係 `{}`，型別係 `void`，因為佢乜都唔 capture。啲 key 係
`input` 嘅 slice，所以個 map 一定要喺 `input` free 之前 `deinit`：`defer` 次序啱，
唔使諗都做到。
'''
hints = [
  "getOrPut(word) 回傳一個有 found_existing 同 value_ptr 嘅位；係新嘅就設 value_ptr.* = 0，然後加一。成個數數迴圈就係咁。",
  "counts.iterator() 行晒啲 entry；每個都有 key_ptr 同 value_ptr。每個 entry append 一個 Row 落一個 std.ArrayList(Row)。",
  "comparator 係 fn byRank(_: void, a: Row, b: Row) bool — 先按次數由多到少，再用 std.mem.order(u8, a.word, b.word) == .lt — 而 std.mem.sort(Row, rows.items, {}, byRank) 就用佢嚟排。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.advanced.08.hashtable"
title = "完全冇次序"
story = "收費廣場點名嘅結果係照 hash table 鍾意嘅次序返嚟，而主管想要嘅係啲亭真正應嘅次序。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行，每行一個收費亭名。`n` 至少係 `1`，而一個名係
一段冇空格嘅字元。同一個名可以出現多過一次。

每個唔同嘅名印一次，格式係 `<name> <count>`，**按個名第一次出現嘅次序**。然後印
`DISTINCT <k>`。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

個 container 單獨畀唔到你呢樣，而成個任務就係講呢樣。

`std.StringHashMap` 係一個 hash table：平均查詢係 O(1)，但 `iterator()` 會按
**bucket 次序**將啲 entry 畀返你 — 唔係排好序，唔係插入次序，而且個 table 一變大
就會變。冇嘢承諾任何次序，所以一個行 hash map 嚟印嘢嘅程式，輸出係靠個 hash 函數
決定。個 starter 正正係咁做，而且得一個唔同名嘅 case 佢仲會過 — 呢個就係破綻：
一個分唔到次序嘅測試，唔係次序啱嘅證據。

兩份工擺兩個 container：一個 `std.ArrayList([]const u8)` 記住每個名第一次見到嘅
次序，一個 `std.StringHashMap(i64)` 負責數。行個 list 嚟印。
'''
hints = [
  "hash table 係用嚟快啲查。list 係用嚟記次序。兩樣都要。",
  "found_existing 每個名淨係 false 一次 — 就係插入嗰次 — 嗰刻就係將個名 append 落次序 list 嘅時候。",
  "行個 list 嚟印，逐個名用 count.get(name).? 問個 map 攞次數，永遠唔好行個 map。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.advanced.09.set-and-sort"
title = "邊個泊喺邊"
story = "天橋底嘅停車處登記板將同一架貨車喺同一個車位列咗兩次，冇人講得出邊幾行係重複嘅。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 行 `<BERTH> <NAME>`。

每個唔同嘅 `<BERTH> <NAME>` 組合印一次，先按車位再按名排，然後印 `DISTINCT <k>`
同 `DUPES <n - k>`。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig 冇裝 pair 嘅有序 set；最接近嘅係兩件各做一份工嘅工具。一個
`std.StringHashMap(void)` 就係一個 set — 一個啲值唔佔位嘅 map — 用**嗰行本身**
`2 KWAN` 做 key，任何已經有嘅組合，第二份佢都唔收。一個裝細 struct
`{ berth, name }` 嘅 `std.ArrayList` 收集個 set 放行嘅嗰啲，再用一個 comparator
做 `std.mem.sort`，排成先車位後名嘅次序。冇 structured binding 幫你拆開個 pair；
個 struct 啲欄位本身已經有名。
'''
hints = [
  "std.StringHashMap(void) 就係個 set；getOrPut(line).found_existing 喺同一行第二次出現嗰陣係 true，第一次係 false。",
  "淨係個 set 放行嘅行先入個 list，所以個 list 嘅長度就係 DISTINCT，n 減佢就係 DUPES。",
  "comparator 先按車位排，打和就用 std.mem.order(u8, a.name, b.name) == .lt；std.mem.sort(Mooring, moorings.items, {}, byBerthThenName) 就用佢嚟排。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.advanced.10.comptime-fn"
title = "車道上一次過"
story = "車軸記錄係一欄數。Alex 話寫四個 for 迴圈。阿美話寫四個有名嘅 for 迴圈，而嗰啲名就係函數。"
brief = '''
標準輸入係一行用空格分開嘅整數。

印四行：

1. 雙數值嘅總和（冇就係 `0`）
2. 每個大過 `10` 嘅值乘二，照次序，用單個空格駁埋 — 冇就印 `-`
3. 有幾多個唔同嘅值
4. `FIRST_BIG <i>` — 第一個大過 `10` 嘅值嘅 index（由 0 開始），冇就係 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig 冇 `<algorithm>`，亦冇 lambda，而最接近嘅嘢比聽落去更近：一個收**另一個函數做
