乘二再印。producer 推晒之後，`main` 就**關閉**個 queue，而 consumer 喺個 queue
清晒兼且關閉咗嘅時候停。await 晒兩個，然後印 `CONSUMED <n>`。

```
input:  3
        1 2 3
output: 2
