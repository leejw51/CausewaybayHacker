[[quest]]
id    = "zig.advanced.23.queue"
title = "個閘口"
story = "一個收費亭經個閘口將啲錢送入點鈔房，一個文員逐個攞出嚟，而個文員由 06:40 開始就一直對住一個空閘口等緊。"
