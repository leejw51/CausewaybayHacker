title = "一路行一路刪"
story = "主管一路讀路旁停車處嘅客貨車名單一路剔，每剔一架就跳過下一架。"
brief = '''
第一行係 `n t`。第二行係 `n` 個整數。

**就地**由個 list 刪走每個細過 `t` 嘅值，將剩低嘅印一行（乜都冇剩就印 `-`），
然後印 `REMOVED <k>`。

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

個 starter 係人人都寫過一次嘅 bug：佢按 index 行，呼叫 `orderedRemove(i)`，跟住
做 `i += 1` — 而滑咗入第 `i` 格嘅元素從來冇人睇過。兩個相鄰嘅細值，第二個就會
生存落嚟。呢個 bug 起碼係有定義嘅。佢嘅 slice 孖生兄弟就唔係：`for
(list.items) |v|` 淨係攞**一次** slice，指標同長度，而喺迴圈入面 `orderedRemove`
會喺佢腳下縮短個 list。個迴圈繼續行舊嘅長度，讀到新尾之後嗰格 — 個 list 仍然
擁有、但已經乜意思都冇嘅記憶體 — 而冇 Debug check 會響，因為啲 byte 仲喺個
allocation 入面。通常睇落用得，而咁更差。

`orderedRemove(i)` 將 `i` 之後所有嘢移前一格，再交返佢刪咗嘅嘢。所以：中咗就刪，
**唔好**前進；唔中就 `i += 1`；永遠唔好兩樣都做。遞增寫喺分支入面嘅 `while` 迴圈
就係個形狀，而喺 linked list 同 hash map 上面都係同一個形狀。
'''
hints = [
  "將 while 嘅 : (i += 1) 拎走。淨係喺冇刪嘢嗰個分支用 i += 1 前進；另一個分支 orderedRemove 已經將下一個元素移咗入第 i 格。",
  "moorings.items.len 每次 check 迴圈條件都會重新讀，所以個 while 先啱：對住個 slice 嘅 for 會喺開頭凍結咗個長度。",
  "由尾向前行係另一個正確答案 — 喺 i 刪嘢永遠唔會搞亂佢下面嘅格 — 人哋問冇分支嘅版本嗰陣，就答呢個。",
