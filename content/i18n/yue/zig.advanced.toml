[[quest]]
id    = "zig.advanced.28.refcount"
title = "仲有邊個揸住佢"
story = "兩個錶經一本帳簿讀同一個錢盤，本帳簿要留到最後一個錶走咗為止，一秒都唔可以多。"
brief = '''
標準輸入係一個數量 `n`，跟住 `n` 個整數。

將啲值擺入一個由 `Ledger` 擁有嘅 slice，而呢個 `Ledger` 會**數住有幾多個揸住佢**：
`share()` 派一個 handle 出去兼將個數加一，`release(gpa)` 將個數減一，去到零嗰陣
就 free 個 slice。攞兩個 handle，再留一個唔計數嘅觀察者。印四行：

1. `REF <sum>` — 經第二個 handle 讀嘅總和
2. `SHARED <k>` — 兩個 handle 都仲在嗰陣嘅數目
3. `ALIVE yes` — 佢哋仲在嗰陣嘅 `watch.alive()`
4. `ALIVE no` — 兩個 handle 都 release 咗之後

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig 冇 `shared_ptr`；最接近嘅係 `shared_ptr` 底下嘅真身，寫喺你睇得到嘅地方。上一個
任務係一個擁有者。呢個係擁有者嘅數目，擺喺物件隔籬，數目去到零嗰陣物件就會 free —
由啱啱最後走嗰個 handle 去做。`share()` 令數目加一；`release()` 令數目減一。冇嘢會
幫你做任何一樣：收尾大括號度冇 destructor 會行，所以每個 `share()` 都要配一個你親手
寫嘅 `release()`，否則個 slice 就會漏，而 `main` 回傳嗰陣 `-O Debug` 嘅 allocator
會喺 stderr 講出嚟。

個觀察者就係個 `Ledger` 本身，睇佢但唔計數。佢睇得到個 slice 仲喺唔喺度 —
`items` 係 `?[]i64`，最後一次 release 之後嘅 `null` 就係個型別畀你代表「冇咗」嘅
**零值** — 而佢唔可以令個 slice 繼續生存。呢個就係打破循環嘅方法，亦係呢條路最後
一張地圖講嘅嘢。
'''
hints = [
  "share() 兩行搞掂：self.refs += 1; return self。叫兩次就係 SHARED 2，而 mirror.items.? 去到同一個 slice。",
  "release() 將個數減一，淨係去到零嗰陣先 free 個 slice 兼將 items 設做 null — alive() 讀嘅就係嗰個 null。",
  "兩個 handle 都要 release；淨係第一個 release 乜都唔會 free，第二個先會。大聲講出點解：呢個任務真正問緊嘅就係呢個。",
]

