```
const gop = try counts.getOrPut(x);
// ____
gop.value_ptr.* += 1;
```
'''
hints = [
  "個結果帶住一個 flag 講個 key 係咪本來已經喺度，同一個指住個 slot 嘅指針；一個新 slot 喺你寫入之前係 undefined。",
]

