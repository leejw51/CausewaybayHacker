```
const found = blk: {
    for (xs) |x| {
        if (x > 100) // ____
    }
    unreachable;
};
return found * 2;
```
'''
hints = [
  "有 label 嘅 block 係用一個 break 嚟交出佢嘅值，個 break 前面加冒號寫明個 label，並且帶住個值；`return` 會帶住錯嘅數字離開個 function，而個 label 就冇用到。",
]

