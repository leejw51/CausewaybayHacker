[[quest]]
id    = "zig.cheatsheet_advanced.05.has-field"
title = "佢有冇車牌"
story = "車有車牌，單車冇。同一個 label function 兩樣都會收到，而且編譯時就要知自己揸住嘅係邊樣。"
brief = '''
`label` 會用一個 `Car`（有一個欄位 `plate`）同一個 `Bike`（冇欄位 `plate`，
亦冇嗰個名嘅 declaration）嚟呼叫。開個 `if`，佢個分支對 `Car` 會行、對 `Bike`
會剪走，令 `v.plate` 淨係喺佢存在嘅地方先編譯。

```
fn label(v: anytype) []const u8 {
    const T = @TypeOf(v);
    // ____
        return v.plate;
    } else return "no plate";
}
```
'''
hints = [
  "有一個 builtin 會問一個類型有冇某個名（以 string 畀）嘅欄位；問 declaration 嗰個對欄位會答冇。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet_advanced.06.comptime-var"
title = "BUILD 之前已經數好"
story = "五個行車線平方表喺個程式行之前就填好；填佢哋嗰個 loop 係由 compiler 展開嘅。"
brief = '''
喺一個**運行時** function 入面，宣告 loop 計數器 `i`，令下面個 `inline while`
會展開，而 `i` 喺每次迭代都係編譯時已知。

```
fn squares() [5]u32 {
    var out: [5]u32 = undefined;
    // ____
    inline while (i < 5) : (i += 1) {
        out[i] = @intCast(i * i);
    }
    return out;
}
```
'''
hints = [
  "運行時嘅 `var` 推唔郁一個 inline loop，`const` 又唔可以步進；強制一個可變編譯時值嘅關鍵字放喺 `var` 前面。",
]

