# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet_advanced.25.main-init"
title = "RUNTIME 由邊度入嚟"
story = "Zig 0.16 用一個 struct 將 I/O runtime 同 allocator 交畀 main。舊嘅 signature 淨係喺兩樣都唔用嗰陣先仍然編譯得到。"
brief = '''
Zig 0.16。開 `main`，令下面個 body 編譯得到：佢由個參數讀 `io` 同 `gpa`，
而且用 `try`。

```
// ____
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
}
```
'''
hints = [
  "entry point 一定要係 `pub`，為咗個 `try` 一定要可以回傳 error，而且收一個 std.process 嗰個類型嘅參數，個 body 由佢度讀欄位。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet_advanced.26.stdin-lines"
title = "一次一行"
story = "車牌 feed 無止境，而控制室經 0.16 個 reader 一行一行咁讀，直到個 feed 閂咗。"
brief = '''
Zig 0.16。`r` 係 `&stdin.interface`，一個喺 buffered stdin 上面嘅 `*std.Io.Reader`。
開一個 loop，將每一行（唔連換行）綁定到 `line`，讀取失敗就向上交畀呼叫者，
而且喺輸入結尾乾淨咁完結。
'''
hints = [
  "0.16 個 reader 有一個 take-up-to-delimiter 呼叫，回傳一個包住 optional slice 嘅 error union：stream 結尾係 null，所以先 `try` 再 capture；佢個 Exclusive 兄弟唔係 optional，去到尾會 error。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.cheatsheet_advanced.27.spawn"
title = "一個亭自己一條 THREAD"
story = "5 號亭喺自己一條 thread 上面將佢嘅計數平方，然後將答案寫入控制室個 slot；控制室讀之前先 join 佢。"
brief = '''
`fn worker(out: *i64, n: i64) void`，而 `total` 係一個 `var i64`。用 `&total`
同 `5` 喺一條新 thread 上面開 `worker`，將個 handle 保留做 `t`，令下一行
`t.join();` 編譯得到。
'''
hints = [
  "Spawn 收一個 config、個 function，同埋佢啲 argument 做一個 tuple；佢可以失敗，而個 handle 要拆走個 error 之後先存在。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet_advanced.28.io-mutex"
title = "一個托盤，兩隻手"
story = "兩個亭加落同一個現金總數。圍住佢嘅鎖喺 0.16 屬於 I/O runtime，而 std.Thread.Mutex 已經冇咗。"
brief = '''
Zig 0.16。`m` 係一個 `*std.Io.Mutex`，`io` 係一個 `std.Io`。加之前先攞個鎖；
下面個 `defer` 會交返佢。`add` 回傳 `void`，唔可以傳播 error。

```
fn add(io: std.Io, m: *std.Io.Mutex, total: *i64, value: i64) void {
    // ____
    defer m.unlock(io);
    total.* += value;
}
```
'''
hints = [
  "0.16 個 mutex 嘅普通 `lock` 收 `io` 而且可以回傳 `error.Canceled`，一個 `void` function 冇得 `try`；佢個唔可以 cancel 嘅兄弟乜都唔回傳。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.cheatsheet_advanced.29.atomic"
title = "一個 WORD，冇鎖"
story = "天橋下面個 hit 計數器係一個機器 word，每條行車線同時都會㩒佢，而冇人想為一個加法加個 mutex。"
brief = '''
`hits` 係一個由幾條 thread 共用嘅 `*std.atomic.Value(u32)`。喺一個唔需要
舊值嘅 `void` function 入面，用 relaxed (monotonic) ordering 原子地加 1。
'''
hints = [
  "read-modify-write 會回傳之前嘅值，而 Zig 唔會畀一個非 void 嘅結果靜靜地丟走；0.16 嘅 ordering 係一個細楷嘅 enum literal。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.cheatsheet_advanced.30.packed-bitcast"
title = "一個 BYTE 八個 FLAG"
story = "個閘機控制器每架車收一個 byte：畀咗錢、被標記、三個 bit 嘅行車線、三個 bit 備用。個 struct 逐個 bit 排好，然後以嗰個 byte 送出去。"
brief = '''
`Flags` 係一個 `packed struct(u8)` —— `@sizeOf(Flags)` 係 1，唔似
`extern struct` 咁用 C 嘅方式排。`f` 係一個 `Flags`。將 `bits` 整做 bit pattern
同 `f` 一樣嘅 `u8`，令佢可以送上線路。

```
const Flags = packed struct(u8) {
    paid: bool,
    flagged: bool,
    lane: u3,
    _pad: u3 = 0,
};
```
'''
hints = [
  "啲整數 cast 想要一個整數入去；packed struct 係由嗰個收一個 argument、由個綁定攞目標嘅 cast 逐個 bit 重新解釋。",
]
