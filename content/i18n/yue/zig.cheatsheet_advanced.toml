# ZIG LAND — CHEATSHEET ADVANCED, in Cantonese. A translation pack (SPEC
# §12.1): the prose of `content/zig/cheatsheet_advanced.toml`, quest by quest,
# and nothing else. The question is the brief; the four choices are code, live
# in the English pack, and are never translated. Code blocks and identifiers
# are copied verbatim.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "zig.cheatsheet_advanced"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet_advanced.01.generic-fn"
title = "任何兩個之中較大嗰個"
story = "22:00，喺個入口。控制室比較兩個車費、兩個重量、兩個時間戳，想將個比較淨係寫一次。"
brief = '''
`max` 回傳同一類型兩個值之中較大嗰個，呼叫嗰陣會將個類型寫明：
`max(i64, 3, 7)`、`max(f64, 2.5, 1.0)`。邊一行開頭？

```
// ____
    return if (a > b) a else b;
}
```
'''
hints = [
  "個類型係第一個 argument，編譯時已知，而其餘兩個參數同回傳都係用佢嚟寫。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet_advanced.02.this"
title = "仲未有名嘅類型"
story = "個貨櫃 stack 乜貨都收。喺入面，啲 method 需要一個名嚟指住佢哋正喺度寫緊嘅 struct。"
brief = '''
喺 `Stack` 回傳嘅 struct 入面，將 `Self` 綁定到嗰個 struct 自己嘅類型，
令 `push` 可以收 `self: *Self`。

```
fn Stack(comptime T: type) type {
    return struct {
        // ____
        items: std.ArrayList(T) = .empty,
        pub fn push(self: *Self, gpa: std.mem.Allocator, v: T) !void {
            try self.items.append(gpa, v);
        }
    };
}
```
'''
hints = [
  "匿名 struct 冇名可以指返自己；有一個 builtin 會交返最內層正喺度定義緊嘅 struct、enum 或者 union。",
]

