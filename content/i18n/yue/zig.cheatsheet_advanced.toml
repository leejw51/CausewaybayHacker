[[quest]]
id    = "zig.cheatsheet_advanced.17.debug-allocator"
title = "會篤你背脊嘅 ALLOCATOR"
story = "夜間 build 用嗰個會報告每一個冇交返嘅 byte 嘅 allocator。佢個名喺 0.16 改咗，舊嗰個編譯唔過。"
brief = '''
Zig 0.16。宣告會檢查 leak 嘅 general-purpose allocator `dbg`，令下面兩行
