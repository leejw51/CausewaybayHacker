[[quest]]
id    = "zig.cheatsheet_advanced.14.to-owned-slice"
title = "將個 LIST 交出去"
story = "雙數行車線收集入一個 list，而呼叫者想要光秃秃嘅 slice，用完用 gpa.free 釋放。"
brief = '''
`list` 係一個用 `gpa` 填滿嘅 `std.ArrayList(i64)`。將佢嘅內容以一個 `[]i64`
回傳，由呼叫者用 `gpa.free` 釋放，`list` 唔剩低任何嘢要釋放，而且乜都唔 copy
（Zig 0.16：個 list 唔持有 allocator）。

```
fn evens(gpa: std.mem.Allocator, xs: []const i64) ![]i64 {
    var list: std.ArrayList(i64) = .empty;
    errdefer list.deinit(gpa);
    for (xs) |x| if (@rem(x, 2) == 0) try list.append(gpa, x);
    // ____
}
```
'''
hints = [
  "`.items` 仍然係個 list 擁有嘅，會被釋放兩次或者永遠唔釋放；轉移擁有權嗰個呼叫會縮到啱啱好，所以佢可以失敗，而且收個 allocator。",
]

