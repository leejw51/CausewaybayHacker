[[quest]]
id    = "zig.cheatsheet_advanced.03.fn-pointer"
title = "今晚用邊條規矩"
story = "2 號亭個收費規矩喺午夜換：之前係雙倍，之後係負數。個亭將條規矩放喺一個變數度然後呼叫佢。"
brief = '''
`double` 同 `negate` 都係 `fn (i32) i32`。宣告一個**運行時變數** `f`，
開頭係 `double`，之後可以重新賦值做 `negate`，而且用 `f(3)` 嚟呼叫。
'''
hints = [
  "光秃秃嘅 `fn` 類型係 comptime-only，唔可以住喺 `var` 入面；運行時嘅 function 值係一個指住佢嘅指針，而 function 係 `const` 嘅。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet_advanced.04.inline-for-fields"
title = "每個欄位，按名"
story = "夜間審計將交畀佢嘅每個紀錄嘅每個欄位都印出嚟，唔理係邊個 struct，亦唔使人話佢知啲欄位名。"
brief = '''
`dump` 為任何交畀佢嘅 struct 印出每個欄位嘅名同值。開個行過啲欄位嘅 loop，
令 `f.name` 可以用喺 `@field` 入面（Zig 0.16：type-info 個 tag 係細楷）。

```
fn dump(v: anytype) void {
    const T = @TypeOf(v);
    if (@typeInfo(T) != .@"struct") @compileError("not a struct: " ++ @typeName(T));
    // ____
        std.debug.print("{s}: {any}\n", .{ f.name, @field(v, f.name) });
    }
}
```
'''
hints = [
  "個欄位 list 係編譯時數據，所以普通 loop index 唔到佢；個 loop 一定要展開，而 `struct` 係關鍵字，做欄位名要加引號。",
]

