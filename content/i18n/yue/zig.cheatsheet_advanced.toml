]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet_advanced.08.switch-on-error"
title = "佢係點樣失敗"
story = "一張污糟咗嘅飛一文不值；一張位數太多嘅飛值最大值。個亭按佢捉到嘅 error 嚟決定。"
brief = '''
`std.fmt.parseInt(i64, tok, 10)` 會以 `InvalidCharacter` 或者 `Overflow` 失敗。
個 error 被 catch 住然後 switch。邊個 prong 對壞字元畀 0？

```
return std.fmt.parseInt(i64, tok, 10) catch |e| switch (e) {
    // ____
    error.Overflow => std.math.maxInt(i64),
};
```
'''
hints = [
  "對 error set 做 switch，每個 case 都用 `error.` 前綴嚟命名；enum-literal 嗰種點嘅寫法係另一個類型。",
]

