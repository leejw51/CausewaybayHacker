[[quest]]
id    = "zig.cheatsheet_advanced.11.enum-from-int"
title = "由線路落嚟嘅一個數"
story = "車軸感應器以一個 byte 送一個行車線類別。收費表係用個 enum 做 key，而個 enum 知自己嘅收費。"
brief = '''
`n` 係一個運行時 `u8`，裝住一個有效嘅 tag 值。將 `lane` 整做對應嘅 `Lane`，
令 `lane.fee()` 編譯得到。

```
const Lane = enum(u8) {
    car, van, truck, bus,
    pub fn fee(self: Lane) i64 {
        return switch (self) { .car, .van => 10, .truck => 20, .bus => 15 };
    }
};
// ____
return lane.fee();
```
'''
hints = [
  "個 builtin 淨係收個整數；佢變成嘅 enum 係結果類型，所以個綁定一定要寫明佢。反方向係 `@intFromEnum`。",
]

