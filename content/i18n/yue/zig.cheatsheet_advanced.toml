hints = [
  "普通 operator 喺 Debug overflow 會 panic，而事後先套一個 mask 已經太遲 —— 個乘法已經 overflow 咗。Zig 有兩族帶後綴嘅 operator：一族會喺最大值飽和，另一族會轉圈。",
]

