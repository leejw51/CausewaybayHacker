[[quest]]
id    = "zig.cheatsheet_advanced.09.walk-optional"
title = "沿住條鏈落去"
story = "今晚啲收據係一條 linked chain，每個 node 指住下一個或者乜都冇。審計行到尾然後加總。"
brief = '''
`Node` 係 `struct { v: i64, next: ?*Node }`，而 `cur` 係一個類型 `?*Node` 嘅 `var`。
開一個 loop，將 `node` 逐個綁定到每個 node 然後行 body，去到 `null` 就停，
而去下一個 node 嗰步係寫喺 loop header 而唔係 body 入面。

```
var total: i64 = 0;
var cur = head;
// ____
    total += node.v;
}
```
'''
hints = [
  "個條件係個 optional 本身，capture 係拆開咗嘅指針，而冒號後面個 continue expression 推進嘅係個 optional，唔係個 capture。",
]

