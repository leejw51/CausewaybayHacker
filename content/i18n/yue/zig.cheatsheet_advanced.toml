[[quest]]
id    = "zig.cheatsheet_advanced.12.labeled-block"
title = "第一個重嘅"
story = "掃描地磅 log 搵第一個超過一百噸嘅讀數；答案係一個值，唔係跳出個 function。"
brief = '''
`xs` 保證有一個超過 100 嘅值。`found` 一定要變成第一個咁樣嘅 `x`，然後個
