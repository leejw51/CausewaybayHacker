# PYTORCH LAND — CHEATSHEET, in Cantonese (colloquial written Cantonese,
# traditional characters). A translation pack (SPEC §12.1): the prose of
# `content/pytorch/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks and identifiers are copied verbatim.

pack   = "pytorch.cheatsheet"
locale = "yue"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.cheatsheet.01.zeros"
title = "一塊白板"
story = "23:00，周亦卿樓地庫嘅機房。今晚第一個 tensor 全部係零。"
brief = '''
`import torch` 已經做咗，整一個 `x`，係形狀 `(2, 3)`、全部係零嘅 **torch** tensor。
'''
hints = [
  "大小放喺個 call 嘅參數度；NumPy 嗰個 function 會俾你一個 ndarray，唔係 tensor。",
]

