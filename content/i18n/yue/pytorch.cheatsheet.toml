        # ____
        self.fc = nn.Linear(4, 2)

    def forward(self, x):
        return self.fc(x)
```

`__init__` 入面邊一行一定要寫喺最前，唔係 assign `self.fc` 就會失敗？
'''
hints = [
  "nn.Module 喺佢自己個 constructor 度設定好啲層嘅登記冊；加任何層之前都要先行咗佢。",
]

