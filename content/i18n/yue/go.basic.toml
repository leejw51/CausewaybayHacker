[[quest]]
id    = "go.basic.04.int-types"
title = "一個數嘅闊度"
story = "天后個八達通讀卡機將車費放喺一個 32 位嘅格仔，全日總數放喺 64 位嗰個，而今日兩個都印住同一個零。"
brief = '''
Go 嘅整數有唔同闊度：`int32` 同 `int64` 有正負，`uint32` 同 `uint64` 唔會低過零。冇嘢會自動轉換 — 你要將目標類型當函數咁寫，`uint64(a)`，個值就會抄入較闊嗰個格仔。`math` 套件幫啲邊界改咗名：`math.MaxInt32` 係最大嘅 `int32`，`math.MaxUint64` 係最大嘅 `uint64`。

```
b := uint64(a)
fmt.Println(math.MaxInt32)
```

`a` 已經讀入做 `int32`。喺兩個佔位嗰度打轉換入 `b` 嗰行，同印 `math.MaxInt32` 嗰行；另外兩行已經幫你印好。

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
hints = [
  "b := uint64(a) — 類型名就係轉換；跟住 fmt.Println(math.MaxInt32)。",
  "闊度係類型嘅一部分：int32 同 int64 唔會唔寫明轉換就混埋一齊。",
]

