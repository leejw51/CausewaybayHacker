[[quest]]
id    = "go.basic.14.embedding"
title = "佢乜都冇繼承到"
story = "總站就係一個站加多啲嘢。Alex 寫咗兩次，多咗一次。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行，每行係 `STOP <NAME>` 或者 `TERM <NAME> <LINES>`。

畀 `Stop` 一個回傳佢個名嘅 `Describe() string`。令 `Terminus` **embed** `Stop`
再加一個 `Lines int`，同埋畀佢自己一個 `Describe`，呼叫 embed 嗰個之後加上
`(<lines> lines)`。

印每個嘅 `Describe()`，然後印 `TERMINI <k>`，個數要用 type switch 行一個
`[]Describer` 數出嚟。

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

embedding 唔係繼承。`Terminus` 唔會*變成*一個 `Stop`；佢係入面裝住一個，而入面
嗰個值嘅 method 會被 **promote** 到外面嘅 type，除非外面嘅 type 自己聲明咗一個。
`t.Stop.Describe()` 就係你搵返被遮住嗰個嘅方法，而且冇 `super`。
'''
hints = [
  "embed 咗嘅 field 冇自己嘅名 — 喺 literal 入面同 t.Stop.Describe() 入面都係寫做 `Stop`。",
  "Terminus 滿足 Describer 係因為佢自己嗰個 Describe；冇嘅話佢會透過 promote 上嚟嘅 Stop method 去滿足。",
  "d.(Terminus) 用 comma-ok 寫法就係 type assertion；多過兩種嘅時候，type switch 做嘅係同一件事。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.basic.15.variadics"
title = "有幾多就幾多"
story = "有時係兩張單，有時係成個架嘅單，個 function 唔應該理呢樣嘢。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個整數。

寫 `total(values ...int64) (sum int64, count int)` — variadic，有 named return
value — 然後用三種方式呼叫佢。印：

1. `ALL <sum> <count>` — 成個 slice，用 `...` 展開
2. `NONE <sum> <count>` — 完全冇 argument 咁呼叫
3. `TWO <sum> <count>` — 頭兩個值逐個傳入，唔夠兩個就有幾多傳幾多

```
input:  4
        1 2 3 4
output: ALL 10 4
        NONE 0 0
        TWO 3 2
```

喺 function 入面 `values` 就係一個普通嘅 `[]int64`，冇 argument 嘅時候佢係 `nil`
— `range` 同 `len` 都應付得到，唔使特別處理。`total(list...)` 係將現有嘅 slice
直接傳過去，唔係 copy 一份新嘅；`total(list)` 就 compile 唔到，知道點解先係考點。
'''
hints = [
  "有 named result 嘅時候，淨係寫 `return` 就會回傳 sum 同 count 當時嘅值。",
  "total(list...) 會展開；total(list) 就係想將一個 []int64 當成單一個 int64 傳入去，compile 唔到。",
  "冇 argument 嘅時候 values 係 nil，而 len(nil slice) 係 0 — 唔使守住。",
]

