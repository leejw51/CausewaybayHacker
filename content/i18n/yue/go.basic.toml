[[quest]]
id    = "go.basic.12.stack-queue"
title = "碟同條隊"
story = "Lucky Mac 出餐位啲乾淨碟一隻疊一隻，由最頂攞走；啲客喺收銀機前排隊，由最前面走。個螢幕將兩樣嘢做成一樣。"
brief = '''
slice 就係 stack。推入係 `append`；彈出係將最後一個元素切走；頂係
`stack[len(stack)-1]`，可以直接賦值 —— 唔使拎走就改到最頂嗰隻碟。queue
嗰邊用 `queue = queue[1:]` 由前面攞，已經寫好。stack 永遠唔會排序 —— 次序
*本身*就係佢嘅重點 —— 所以呢個練習係三行，唔係四行。

```
stack = append(stack, v)
stack = stack[:len(stack)-1]
stack[len(stack)-1] = 99
```

啲數讀入 `xs`（至少兩個）。喺 `xs` 嘅迴圈入面打推入，之後打彈出同改頂，
代替三個佔位；stack 同 queue 嘅頭兩個會印出嚟。

```
input:  1 2 3 4
output: 1 2 99
        1 2
```
'''
hints = [
  "迴圈入面 stack = append(stack, v)；之後 stack = stack[:len(stack)-1] 同 stack[len(stack)-1] = 99。",
  "彈出係將 slice 收窄；冇嘢被抄，亦冇嘢被釋放。彈出之後，len(stack)-1 指嘅係原本頂下面嗰個元素。",
]

