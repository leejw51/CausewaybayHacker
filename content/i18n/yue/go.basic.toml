```
input:  tsuenwan
output: red
```
'''
hints = [
  "case TsuenWan: return \"red\" 同 case KwunTong: return \"green\"，各自一行，放喺 Island 嗰個 case 下面。",
  "Go 嘅 switch 唔會 fall through：每個 case 自己完，唔使 break。",
