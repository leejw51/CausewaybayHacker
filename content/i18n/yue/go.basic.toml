id    = "go.basic.13.sorting"
title = "到站牌"
story = "天后個到站牌按數據入嚟嘅次序列出下幾班車，即係根本冇次序。"
brief = '''
`sort` package 原地排序一個 slice。`sort.Ints(xs)` 將整數排成升序。降序冇 `sort.IntsDesc`；你要將個 slice 包做 `sort.IntSlice`，用 `sort.Reverse` 反轉佢嘅次序，再交畀 `sort.Sort`。

```
sort.Ints(xs)
sort.Sort(sort.Reverse(sort.IntSlice(xs)))
```

喺第一個 print 之前寫升序排序，第二個 print 之前寫降序排序。印出嘅部分已經寫好。

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "先 sort.Ints(xs)；再 sort.Sort(sort.Reverse(sort.IntSlice(xs)))。",
  "sort.IntSlice(xs) 係轉換，唔係複製 — 排序仍然喺 xs 入面發生。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.basic.14.sort-by-key"
title = "車手排行榜"
story = "Lucky Mac 更表塊板應該按送餐數排車手，最多排先，同數按名，但佢係按佢哋打卡嘅次序列出。"
brief = '''
`sort.Slice` 可以排任何 slice，只要畀佢一個 `less(i, j)` 函數，話元素 `i` 係咪應該排喺元素 `j` 前面。兩層次序就係先比第一個 key，打和先跌落第二個。降序就係將比較反轉。

```
sort.Slice(entries, func(i, j int) bool {
	a, b := entries[i], entries[j]
	if a.Score != b.Score { return a.Score > b.Score }
	return a.Name < b.Name
})
```

`sort.Slice` 嘅呼叫同函數嘅開頭已經寫好。寫佢嘅兩行：分數唔同就按分數降序，打和就按名升序。

```
input:  4
        alex 12
        mei 15
        bo 12
        sam 9
output: mei 15
        alex 12
        bo 12
        sam 9
```
'''
hints = [
  "if a.Score != b.Score { return a.Score > b.Score } 然後 return a.Name < b.Name。",
  "less 答嘅係「i 係咪先行？」：分數高嘅先行，分數一樣就名細嘅先行。",
]

