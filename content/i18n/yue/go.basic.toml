[[quest]]
id    = "go.basic.06.functions"
title = "車手嘅費率"
story = "Alex 個外賣 app 一更頭十程一個價，之後另一個價，廚房部平板上面個派錢函數對所有人都回傳零。"
brief = '''
函數嘅參數名後面跟型別，結果型別喺括號後面。`return` 帶住一個值結束佢；`if` 入面嘅 `return` 會提早結束，所以 `if` 之後嗰行淨係喺條件為假嘅時候先會行。

```
func fare(rides int) int {
	if rides <= 10 { return rides * 5 }
	return 50 + (rides-10)*3
}
```

頭十程每程畀 5，之後每程畀 3。`fare` 已經宣告同呼叫；寫佢嘅主體：十程或以下嘅提早 `return`，同其餘嘅 `return`。

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { return rides * 5 } 然後 return 50 + (rides-10)*3。",
  "十程每程 5 就係 50；第二條公式由嗰度開始數。",
]

