story = "八張單同時由 Lucky Mac 道門踩八架單車出去，而塊板一張都唔等，就加埋成晚嘅數。"
brief = '''
`go f()` 喺自己嘅 goroutine 上面開始 `f`，唔會等。`sync.WaitGroup` 就係 `main` 等晒佢哋嘅方法：每次開始前 `Add(1)`，每個完成時喺入面 `Done()` — 用 defer，咁無論函數點樣退出都會行 — `Wait()` 就阻塞到個數返到零。呢度每個 goroutine 淨係寫自己嘅 `results[i]`，所以冇嘢係共用嘅。

```
var wg sync.WaitGroup
for i, x := range xs {
	wg.Add(1)
	go func(i, x int) {
		defer wg.Done()
		results[i] = x * x
	}(i, x)
}
wg.Wait()
```

迴圈、`Add` 同 goroutine 嘅形狀已經寫好。填佢嘅主體：`defer wg.Done()`，然後將 `x * x` 存入 `results[i]`。

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
hints = [
  "第一行 defer wg.Done()，第二行 results[i] = x * x。",
  "defer 會喺 goroutine 返回時行 Done，中間發生乜都唔緊要；一開始就淨係寫 wg.Done() 嘅話，就係未做嘢先話「完成」。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.basic.18.binary-tree"
title = "NULLPTR"
story = "11:55 Lucky Mac 前面部收銀機將每張單按號碼歸檔入一棵樹，而棵樹嘅 root 係 nil，佢照跟住個 nil 行。每張單都過到，但一張都唔存在。"
brief = '''
二元搜尋樹係一個兩個子節點都係指向同一種 struct 嘅指標嘅 `struct`，空樹係 `nil`。插入係遞歸嘅：`nil` 子樹變做新節點，否則個值落入左邊或者右邊嘅子樹 — 因為遞歸會回傳子樹嘅新根，你要將佢賦值返入子節點 field。`n` 係 `nil` 嘅時候跟 `n.Left` 走，個程式就會死；`nil` 檢查永遠行先。

```
type Node struct {
	Val         int
	Left, Right *Node
}
if v < n.Val {
	n.Left = insert(n.Left, v)
} else {
	n.Right = insert(n.Right, v)
}
```

`Node`、`insert` 嘅 `nil` 檢查、佢嘅 `if v < n.Val` / `else`、`inorder`、`height` 同 `main` 已經寫好。填嗰兩個分支：左邊嘅賦值同右邊嘅賦值。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "第一個分支 n.Left = insert(n.Left, v)，第二個分支 n.Right = insert(n.Right, v)。",
  "insert 回傳子樹嘅根 — 子節點本來係 nil 嘅話就係一個全新嘅節點 — 所以結果一定要存返入子節點 field，否則棵樹永遠唔會長大。",
]

