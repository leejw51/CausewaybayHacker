[[quest]]
id    = "go.basic.16.json"
title = "tag 就係合約"
story = "車廠個 API 送嚟嘅 key 係細楷，Go export 出去嘅 field 係大楷，成個星期冇人睇得出點解每張單都係空嘅。"
brief = '''
標準輸入係一行：一個 JSON array 嘅訂單，每張單有一個 `item` 字串同一個 `cents`
數字。

Unmarshal 佢，每張單印一行 `<ITEM> <CENTS>`，然後 marshal 並印出一個摘要
object，key 一定要係 `count` 同 `total`，而且要係呢個次序。如果輸入唔係有效嘅
JSON，就印 `BAD JSON`，其他嘢一律唔印。

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

一個 field 一定要 **export** 咗，`encoding/json` 先會見到佢 — 細楷嘅 field 對
marshaller 嚟講係隱形嘅，一聲都唔會出。之後個 struct tag 先話畀佢知喺 wire 上面
叫咩名。`Marshal` 係按聲明次序寫 field 嘅，所以摘要嘅 key 次序係由你決定，唔係
由 map 決定。
'''
hints = [
  "tag 放喺 type 後面嘅 backtick 入面：Item string `json:\"item\"`。",
