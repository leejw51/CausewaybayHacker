[[quest]]
id    = "go.basic.10.closures"
title = "門口人數"
story = "Lucky Mac 數住邊個入嚟邊個出去，經理想要收舖嗰陣個數，中間發生咩事都好。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行，每行係 `IN` 或者 `OUT`。

維持一個永遠唔會跌到零以下嘅計數。每個指令之後印一次個數。`main` return 嗰陣，
印 `CLOSED <final>` — 要由 `defer` 印，唔係喺 function 尾印。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        CLOSED 2
```

個計數器本身係一個 closure：一個回傳 function 嘅 function，個總數就夾喺佢哋兩個
之間。答案入面冇 package 層級嘅變數。
'''
hints = [
  "total 住喺 makeCounter 個 frame 入面，回傳嗰個 function 令佢一直生存。呢個就係 closure。",
  "defer func(){ ... }() 喺 return 嗰陣先行，而個 closure 係嗰陣先讀 `last` — 唔係寫 defer 嗰陣。",
  "如果個 defer 係收 argument 嘅，佢就會喺 defer 嗰一刻攞住個值。兩樣都試下，睇下佢點變。",
]

