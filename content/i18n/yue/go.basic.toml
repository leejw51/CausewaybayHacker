[[quest]]
id    = "go.basic.09.vector"
title = "車廂點數"
story = "銅鑼灣 2 號月台由每道門讀上車人數，但一個都冇留低：冇總數，冇第一道門，冇最後一道。"
brief = '''
slice 係 Go 嘅可加長列表，對佢做嘅三件事就係下面三行。`append` 加喺尾
再將個 slice 交返畀你，所以永遠要賦返落去。刪走 index 1 又係 `append`：
佢前面嗰截駁埋佢後面嗰截。改就係普通索引 —— `xs[0] = 99` 就地覆蓋第一個。
`sort.Ints` 將成個 slice 就地由細到大排好。

```
xs = append(xs, v)
xs = append(xs[:1], xs[2:]...)
xs[0] = 99
sort.Ints(xs)
```

每個門數 `v` 喺一個迴圈入面讀入（至少兩個）。喺迴圈入面打 `append`，之後
打刪、改同排序，代替四個佔位；長度同個 slice 會印出嚟。

```
input:  3 7 2 5
output: 3
        2 5 99
```
'''
hints = [
  "迴圈入面 xs = append(xs, v)；之後 xs = append(xs[:1], xs[2:]...)、xs[0] = 99 同 sort.Ints(xs)。",
  "xs[:1] 係 index 1 之前嘅全部，xs[2:] 係之後嘅全部；append 將兩截駁埋，個 ... 將第二個 slice 攤開做參數。",
]

