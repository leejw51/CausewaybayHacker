[[quest]]
id    = "go.basic.11.generics"
title = "一個 function，任何 list"
story = "Alex 已經寫咗四次 Sum — 訂單一次、騎手一次、分鐘一次、仙一次 — 第五次就嚟到期。"
brief = '''
標準輸入係一行整數，用空格分開。

印三行：

1. 每個值嘅兩倍，用單個空格連埋
2. 原本啲值嘅總和
3. 有幾多個大過 `10`

```
input:  1 2 3 4 12
output: 2 4 6 8 24
        22
        1
```

寫三個泛型 helper 而且要用佢哋：`MapSlice[T, U any]`、用 `~int64 | ~float64`
constraint 嘅 `Sum[T Number]`，同埋收一個 predicate 嘅 `Count[T any]`。
'''
hints = [
  "MapSlice 會改變元素嘅 type，所以佢要兩個 type parameter，唔係一個。",
  "call site 會由個 slice 同個 function 推斷出 T 同 U — 你唔使寫 MapSlice[int64, string]。",
  "~int64 嘅意思係 int64 加埋任何 underlying type 係 int64 嘅嘢，named type 就係咁樣過到關。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.basic.12.defer-panic-recover"
title = "跌低咗又企返起身"
story = "以前一張壞單就可以令成部收銀機死機，成個更嘅記錄一齊冇埋。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行。每行係一個整數、`BOOM` 呢個字，或者其他嘢。

寫 `run(text string) (out string)`，回傳個值嘅兩倍，parse 唔到就回傳 `BAD <text>`
— 遇到 `BOOM` 就 **panic**，然後喺一個 deferred function 入面 recover，等 caller
攞到 `RECOVERED boom`，而唔係一個死咗嘅程式。每個輸入印一行，最後由 `main` 入面
嘅 `defer` 印 `CLOSED <n>`。

```
input:  4
        21
        BOOM
        xx
        -4
output: 42
        RECOVERED boom
        BAD xx
        -8
        CLOSED 4
```

三件事，三件都係考點：`recover` 只係喺 deferred function 入面先有作用；
**named** return value 係令 deferred function 可以喺 panic 之後改變回傳值嘅關鍵；
`main` 入面嘅 `defer` 喺 return 嗰陣先行，所以個 loop 點行都好，`CLOSED` 一定係
最後一行。
'''
hints = [
  "回傳值一定要有名 — out string — 唔係嘅話個 deferred function 冇嘢可以 assign。",
  "冇 panic 嘅時候 recover() 回傳 nil，所以個 if 就係分辨兩條路嘅方法。",
  "main 入面嗰個 deferred closure 係行嗰陣先讀 `done`，唔係寫嗰陣，所以佢見到嘅係最終嘅數。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.basic.13.zero-values"
title = "冇嘢唔等於冇嘢"
story = "更表個 map 從來冇整過出嚟，段碼成個朝早讀住佢，一次都冇投訴過。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 個字。

按次序印四行：

1. `READ <v>` — 一個 **nil** map 對一個佢冇嘅 key 會畀你乜
2. `LEN <k>` — 將全部 `n` 個字 append 入一個 **nil** slice 之後嘅長度
3. `WRITE <ok|panic>` — 向嗰個 nil map assign 有冇 panic
   （要 recover 佢；唔好畀個程式死）
4. `FOUND <k>` — 有幾多個字係一個*已初始化*、預先放咗 `a` 同 `b` 嘅 map 嘅 key

```
input:  3
        a b c
output: READ 0
        LEN 3
        WRITE panic
        FOUND 2
```

nil map 同 nil slice 唔係同一種「冇」。讀一個 nil map 係合法嘅，會畀你值嘅 type
嘅零值；寫入去就會 panic，因為根本冇個表可以寫。`append` 入一個 nil slice 係合法
嘅，佢會自己分配 — 所以 `var s []T` 係慣用嘅空 slice，而 `var m map[K]V` 就唔係
慣用嘅空 map。
'''
hints = [
  "喺 nil map 上面 empty[\"missing\"] 唔係 error — 佢係 int 嘅零值，即係 0。",
  "append 應付得到 nil slice：佢會幫你分配第一個 backing array，所以你從來唔使為咗起頭而 make()。",
  "個寫入一定要喺一個有 deferred recover 嘅 function 入面發生，唔係個 panic 會喺第四行之前就搞死個程式。",
]

