# GO LAND — BASIC, in Cantonese. A translation pack (SPEC §12.1): the prose of
# `content/go/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.
#
# Register: colloquial written Cantonese in traditional characters, technical
# nouns as Hong Kong developers actually say them (frontend/src/i18n/yue.ts).

pack   = "go.basic"
locale = "yue"

