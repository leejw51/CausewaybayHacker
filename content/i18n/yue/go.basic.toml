[[quest]]
id    = "go.basic.05.loops"
title = "每第三班車"
story = "金鐘個開出班次牌應該要加埋朝早嘅班次，再講有幾多班係每第三班嘅特快。佢顯示兩個零。"
brief = '''
Go 淨係得一個迴圈關鍵字。`for init; condition; step { }` 用嚟數數，入面嘅 `if` 唔使括號，淨係要大括號。`sum += i` 原地加落一個變數，`i%3 == 0` 就係問 `i` 係咪 3 嘅倍數。

```
for i := 1; i <= n; i++ {
	sum += i
	if i%3 == 0 { threes++ }
}
```

迴圈開頭已經寫好。填佢嘅主體：將 `i` 加落 `sum`，係 3 嘅倍數就喺 `threes` 數一下（一個 `if` 寫一行都得）。

```
input:  10
output: 55
        3
```
'''
hints = [
  "一行 sum += i，下一行 if i%3 == 0 { threes++ }。",
  "if 就算得一個陳述式都要大括號；但唔使括號。",
]

