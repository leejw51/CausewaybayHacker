[[quest]]
id    = "go.basic.08.enums"
title = "路線顏色"
story = "金鐘個轉車站地圖識得三條線嘅名，但係全部油成灰色。"
brief = '''
Go 冇 `enum` 關鍵字。慣用做法係一個命名嘅整數型別，加一個用 `iota` 嘅 `const` 區塊，佢會由上到下將常數編做 0、1、2。對住呢種值嘅 `switch` 每個常數列一個 `case`，`case` 可以同佢嘅 `return` 寫喺同一行。

```
type Line int

const (
	Island Line = iota
