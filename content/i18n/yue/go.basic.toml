[[quest]]
id    = "go.basic.09.errors"
title = "唔係數字嗰一行"
story = "騎手記錄由車廠送返嚟，個欄中間夾住咗唔知邊個嘅午餐單。"
brief = '''
標準輸入係個數量 `n`，然後 `n` 行。每行應該係一個整數。

每一行，印個值嘅兩倍，或者 parse 唔到就印 `BAD <line>`。最後印 `SUM <total>`，
即係你印過嗰啲值嘅總和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

定義一個 sentinel `var ErrNotANumber = errors.New(...)`，用
`fmt.Errorf("...: %w", ErrNotANumber)` 包住佢，再喺 `main` 入面用 `errors.Is`
認返佢出嚟。error 係一個值；呢樣嘢就係咁樣換返嚟嘅。
'''
hints = [
  "strconv.ParseInt(s, 10, 64) 回傳 (int64, error) — 第二個值唔係話唔睇就得。",
  "fmt.Errorf 入面嘅 %w 令被包住嘅 error 仲搵得返；%v 就會將佢壓成純文字。",
  "errors.Is 會沿住成條 wrap chain 行，所以個訊息加咗嘢之後佢照樣認得。",
]

