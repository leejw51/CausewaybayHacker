[[quest]]
id    = "typescript.basic.06.functions"
title = "時段收費"
story = "控制室按大電視上面每個時段同廣告商收錢，第十個之後平啲，而三十樓張發票上面個個都係零。"
brief = '''
`function` 整一個函數：一個名、佢嘅參數同型別、冒號後面嘅回傳型別，同埋大括號入面
嘅身。`return` 將一個值交返畀叫佢嗰個。啲型別就係合約 —— tsc 用佢哋檢查每一個呼叫，
然後擦走佢哋；個身仍然可以淨係一句 `return`，成個答案寫做一條表達式。

```
function fare(slots: number): number {
  return Math.min(slots, 10) * 5 + Math.max(slots - 10, 0) * 3;
}
```

頭十個時段每個收 `5`，之後每個收 `3`。`main` 讀 `n` 再印 `fare(n)`。照住喺 `fare`
入面打 `return` 嗰行。

```
input:  12
output: 56
```
'''
hints = [
  "return Math.min(slots, 10) * 5 + Math.max(slots - 10, 0) * 3; — min 將平價時段封頂喺十個，max 唔畀其餘嘅變負數。",
  "個函數嘅工作去到 return 就完；身入面佢後面嘅嘢都唔會行。",
]

