head = Uint8Array.of(...head, 0x21);
```

`s` 同 `bytes` 已經讀咗，兩個 print 都寫好。喺兩個佔位嗰度打上面兩行。

```
input:  kwan lee
output: 6b776121
        kwa!
```
'''
hints = [
  "let head: Uint8Array = bytes.slice(0, 3); 然後 head = Uint8Array.of(...head, 0x21); — 抄一份，再砌一個長啲嘅。",
  "Uint8Array 冇 push：佢嘅長度喺整嗰陣已經定咗。Uint8Array.of 收你想要嘅位元組，展開嘅都得。",
]

