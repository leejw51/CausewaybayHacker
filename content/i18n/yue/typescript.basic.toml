[[quest]]
id    = "typescript.basic.09.vector"
title = "播放清單"
story = "時代廣場個播放清單係一排以秒計嘅廣告長度；操作員加一個、刪走第一個、改多一個再排序，而排好嘅清單將 100 放咗喺 4 前面。"
brief = '''
陣列係就地改嘅。`.push(x)` 喺尾加一個值，`.splice(i, 1)` 喺一個 index 刪走一個值
