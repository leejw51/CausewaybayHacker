enum Line {
  ISLAND,
}

const line: Line = Line[word.toUpperCase() as keyof typeof Line];
```

照住打 `const line` 嗰行。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = Line[word.toUpperCase() as keyof typeof Line]; — 方括號用名搵成員，而啲名係大楷。",
  "冇咗 as keyof typeof Line，tsc 唔肯：普通字串可以係任何名，而個 enum 得三個。",
]

