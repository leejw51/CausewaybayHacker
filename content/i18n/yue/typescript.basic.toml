[[quest]]
id    = "typescript.basic.05.loops"
title = "數格數"
story = "時代廣場大電視將每個循環嘅畫面由 1 編到 n，操作員想要佢哋嘅總和同埋有幾多格落喺每第三格，而預覽下面個計數器兩次都係零。"
brief = '''
數數嘅 `for` 迴圈個括號入面有三部分：起點、每次行之前檢查嘅條件，同埋每步。`for
