[[quest]]
id    = "typescript.basic.10.byte-slices"
title = "頭三個位元組"
story = "希慎廣場幅牆每塊磚攞一間舖個名嘅頭三個位元組，後面加個記號，用十六進制記低啲位元組，再當字母咁著燈，而今晚每塊磚都係黑嘅。"
brief = '''
`Uint8Array` 係一排位元組，每個係 0 到 255 嘅一個數。呢度啲字幕係純 ASCII，所以寫好
嗰行用 `charCodeAt` 逐個字元砌出啲位元組。（呢個 land 冇 `TextEncoder`：一個 quest
睇得到嘅 Node 就只有 `node.d.ts`。）`.slice(0, 3)` 係頭三個位元組嘅**副本** ——
`.subarray` 就會係睇住同一塊記憶體嘅 view。typed array 長度固定，唔可以變長，所以
駁長即係整一個新嘅：`Uint8Array.of(...head, 0x21)`，`0x21` 就係 `"!"`。

```
