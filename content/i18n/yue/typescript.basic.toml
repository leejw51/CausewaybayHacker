[[quest]]
id    = "typescript.basic.04.strings"
title = "鏡"
story = "利園個櫥窗螢幕將每間舖嘅名量度一次、大嗌一次，再為咗反射嗰塊玻璃倒轉寫一次，而今晚佢淨係順住顯示一次個名。"
brief = '''
字串透過 `.length` 知道自己有幾長，用 `.toUpperCase()` 整一個大楷嘅副本。佢冇
`reverse`：嗰個係陣列先有。所以將個字串展開做一個逐個字元嘅陣列，倒轉個陣列，再
駁返埋 —— `[...s].reverse().join("")`。

```
console.log(s.length);
console.log(s.toUpperCase());
console.log([...s].reverse().join(""));
```

`s` 已經讀咗，佢嘅長度已經印咗。照住打第二同第三行 `console.log`。

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "console.log(s.toUpperCase()); 然後 console.log([...s].reverse().join(\"\")); — 一個方法呼叫，之後展開、倒轉、駁埋。",
  "join() 唔畀參數會喺啲字母之間加逗號；join(\"\") 就乜都唔加。",
]

