[[quest]]
id    = "typescript.basic.08.enums"
title = "三條線，三隻色"
story = "怡和街出口個港鐵螢幕將每條線塗上自己嘅顏色，而今晚上面每條線都係港島綫藍色。"
brief = '''
`enum` 係一組封閉、有名嘅成員，亦係 TypeScript 唯一一個去到執行時仲喺度嘅型別：tsc
將佢變做一個物件，所以 `Line.TSUENWAN` 係 `1`，而 `Line["TSUENWAN"]` 用名去搵成員。
編譯器只准你用佢識嘅名做 index，所以由輸入讀到嘅字串要用 `as keyof typeof Line`
話佢知可以係邊啲名 —— 係對 tsc 嘅承諾，唔係檢查。對啲成員嘅 `switch` 已經寫好。

