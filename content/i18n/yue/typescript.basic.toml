`for` 嗰行。

```
input:  10
output: 55
        3
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — 起點、條件、每步，用分號分開。",
  "i < n 會喺 n - 1 停；個總和會少咗 n。",
]

