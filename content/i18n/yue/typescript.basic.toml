[[quest]]
id    = "typescript.basic.08.string-slices"
title = "頭幾個字母"
story = "怡和街電車站個到站板淨係有位放目的地嘅頭幾個字母同一個記號，而佢讀嘅 feed 一定要原封不動留住個全名。"
brief = '''
`s.slice(0, n)` 係 `s` 頭 `n` 個字元，以一個新字串畀返。字串改唔到，所以 slice 永遠
係副本 —— 無論你點樣整嗰截，`s` 都唔會郁。喺字串上面用 `+=` 會整一個新字串再將個名
重新綁定，咁就係駁長，亦都係點解 `head` 要用 `let`。

```
let head: string = s.slice(0, n);
head += "!";
```

`s` 同 `n` 已經讀咗，兩個 print 都寫好。喺兩個佔位嗰度打上面兩行。

```
input:  causeway bay
        8
output: causeway!
        causeway bay
```
'''
hints = [
  "let head: string = s.slice(0, n); 然後 head += \"!\"; — slice 係副本，+= 再整多一個。",
  "slice(start, end) 喺 end 之前停，所以 slice(0, n) 啱啱好 n 個字元。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.basic.09.int-slices"
title = "頂兩個"
story = "電車板要將第二同第三個到站時間抄出嚟，後面加埋最尾兩個，而 feed 自己嗰張表要原封不動。"
brief = '''
`v.slice(1, 3)` 係陣列嘅 slice：index 1 同 2 嘅項目，裝喺一個**新陣列**入面 —— 改佢
永遠唔會改到 `v`。`.push(...other)` 將 `other` 每個項目展開加落尾。slice 由 0 數起，
喺第二個數之前停；負數嘅起點由尾數起，所以 `v.slice(-2)` 係最尾兩個。

```
const part: number[] = v.slice(1, 3);
part.push(...v.slice(-2));
```

`v` 已經讀咗，兩個 print 都寫好。喺兩個佔位嗰度打上面兩行。

```
input:  1 2 3 4 5
output: 2 3 4 5
        1 2 3 4 5
```
'''
hints = [
  "const part: number[] = v.slice(1, 3); 然後 part.push(...v.slice(-2)); — slice 抄一份，push 就地加落尾。",
  "part.push(v.slice(-2)) 冇咗 ... 就係推一個陣列入去，唔係兩個數，tsc 會話你知。",
]

