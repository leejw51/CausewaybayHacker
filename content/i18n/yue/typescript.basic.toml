[[quest]]
id    = "typescript.basic.06.floats"
title = "三個小數位"
story = "怡和街電車站個光感應器讀到三個小數位，佢餵嘅 LED 驅動器只留單精度，而 log 將兩個都顯示做零。"
brief = '''
`number` 係 64 位元 double —— 喺其他 land 叫 `f64`。冇 32 位元 float 型別，但你睇得到
一個：`Math.fround(x)` 將 `x` 四捨五入到最近嘅單精度值，即係 `Float32Array` 會存嘅
嗰個。`.toFixed(3)` 印三個小數位；`.toFixed(10)` 印得夠多，睇得出點樣四捨五入。

```
const x: number = Number(s);
const y: number = Math.fround(x);
```

`s` 已經讀咗，兩個 print 都寫好。喺兩個佔位嗰度打上面兩行。

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
hints = [
  "const x: number = Number(s); 然後 const y: number = Math.fround(x); — fround 即係 float-round，四捨五入到單精度。",
  "new Float32Array([x])[0] 會畀同一個 y；Math.fround 係一個呼叫搞掂嘅寫法。",
]

