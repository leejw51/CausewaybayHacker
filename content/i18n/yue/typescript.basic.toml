[[quest]]
id    = "typescript.basic.01.first-screen"
title = "開機"
story = "時代廣場上空，19:00。場雨啱啱停，大電視著咗，今晚第一格畫面係全黑嘅。"
brief = '''
一隻字都唔可以差，印出：

```
hello, causewaybay
```

全部細楷，一個逗號，一個空格，一行。其他乜都唔要。

`console.log` 會自動幫你加換行。佢仲會喺每個參數之間加一個空格，呢樣係大家第一個
會搞錯嘅地方：`console.log("hello,", "causewaybay")` 係啱嘅，但係
`console.log("hello, ", "causewaybay")` 就會有兩個空格。
'''
hints = [
  "console.log(\"hello, causewaybay\"); 就係成個程式。",
  "個字串一隻字都唔可以差：細楷，一個逗號，後面一個空格。",
  "最底嗰句 `main();` 唔好郁佢。冇人叫過嘅 function 乜都唔會印，而個 starter 正正就係咁。",
