# LUA LAND — CHEATSHEET ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/lua/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "lua.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet_advanced.01.class-index"
title = "会回答的表"
story = "21:00，浣纱街。每一节龙身都是一个表，而阿薇想把方法集中放在一个地方。"
brief = '''
`Dragon` 是一个方法表（`Dragon.length`，……），它的构造函数已经写好：

```
function Dragon.new(n)
  return setmetatable({n = n}, Dragon)
end
```

写出放在构造函数之前的那一行，让 `Dragon.new(3):length()` 能找到 `Dragon.length`。
'''
hints = [
  "实例的元表是 `Dragon`；缺失的键会去那个元表的查找字段所指的地方找 —— 而它可以指向类本身。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet_advanced.02.inherit"
title = "灯笼底下的那一节"
story = "灯笼是顶上带火焰的一节龙身；它自己做不到的，由底下的那一节来做。"
brief = '''
`Segment` 是一个普通的函数表（`Segment.burn`，……），自己没有任何元表字段。
`Lantern` 是按惯例写法的类（`Lantern.__index = Lantern`，实例用
`setmetatable({}, Lantern)` 创建）。写出那一行，让灯笼对 `Lantern` 没有定义的任何
方法回退到 `Segment` —— 同时保留 `Lantern` 自己的方法。
'''
hints = [
  "类本身需要一个元表；`Segment` 没有查找字段，所以它现在这样不能做那个元表。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.cheatsheet_advanced.03.lt-sort"
title = "它们自己排好队"
story = "鼓队都有分数；总管想给它们排序，又不想每次都写比较器。"
brief = '''
`Score` 是一个类（`Score.__index = Score`）；每个实例有一个数字字段 `v`。`scores`
是它们的列表。写出元方法那一行，使 `table.sort(scores)` —— **没有比较器** ——
按 `v` 从小到大排列它们。
'''
hints = [
  "没有比较器时，sort 用 `<` 比较，而两个表之间的 `<` 会向它们的元表要一个特定的字段。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.cheatsheet_advanced.04.eq"
title = "同一个点，两个表"
story = "两个跑手在大坑道的同一个位置各做了一个表，而地图必须把它们当成相等。"
brief = '''
`P` 是一个类（`P.__index = P`），实例有数字字段 `x` 和 `y`。`a` 和 `b` 是两个字段
相等的**不同**实例。写出元方法那一行，让 `a == b` 为 true。
'''
hints = [
  "在元方法里面，对这两个表做 `a == b` 又会调用元方法；比较字段，不是表。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.cheatsheet_advanced.05.call"
title = "直接调用类本身"
story = "阿薇想让 `Pad(5)` 读起来像构造函数，就像她桌上那份 LÖVE 代码那样。"
brief = '''
`Pad` 是一个类，有 `Pad.__index = Pad` 和构造函数 `Pad.new(n)`。`mt` 是一个已经
装为 **`Pad` 自己的**元表的表（`setmetatable(Pad, mt)`）。写出那一行，让 `Pad(5)`
表现得和 `Pad.new(5)` 一样。
'''
hints = [
  "调用 `Pad` 查的是 `Pad` 的元表，不是 `Pad` 本身 —— 而处理函数收到的第一个参数是被调用的那个表。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet_advanced.06.newindex-rawset"
title = "先记下，再存起来"
story = "香账里每一条新记录都先记日志；之后账本仍然得把它存下来。"
brief = '''
`log` 是一个列表。`t` 是一个空表，它的元表有：

```
__newindex = function(t, k, v)
  log[#log + 1] = k
  -- ____
end
```

填上空白，让值真的存进 `t`（之后的 `t[k]` 能读回来），并且**不**第二次运行这个
处理函数。
'''
hints = [
  "处理函数运行时键仍然不存在，所以普通赋值会再次触发处理函数，没完没了；存储必须绕过元表。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet_advanced.07.rawget-default"
title = "它到底写过没有"
story = "计数表对任何名字都回答零；总管想知道哪些名字是真正录入过的。"
brief = '''
`counts` 是这样创建的

```
local counts = setmetatable({}, {__index = function() return 0 end})
```

所以任何缺失的键读出来都是 `0`。写出一个 `if` 的开头，只在 `k` **真的**存进过
`counts` 时为 true —— 存进去的 `0` 算存过，从未写过的键不算。
'''
hints = [
  "普通读取会经过默认值；跳过元表的那种读取是一个全局函数，不是方法。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.cheatsheet_advanced.08.len-trap"
title = "栈有多长"
story = "备用香的栈被某个读过 5.2 手册的人加了一个长度元方法。"
brief = '''
`Stack` 把值放在 `s.items`（一个列表）里。它的元表是一个私有表，定义了返回
`#s.items` 的 `__len`；没有 `len` 方法。在这片土地的 LuaJIT 上，让 `n` 成为
栈 `s` 里值的个数。
'''
hints = [
  "LuaJIT 是 Lua 5.1：长度元方法只对 userdata 生效，所以对象上的 `#` 给的是一个空表的原始长度 —— 0。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.cheatsheet_advanced.09.loop-closure"
title = "每盏灯笼自己的号码"
story = "维多利亚公园的三盏灯笼，每盏有一个按钮，稍后按下时必须报出自己的号码。"
brief = '''
`fns` 是一个空表。往里面填三个函数，使 `fns[1]()`、`fns[2]()` 和 `fns[3]()` 返回
`1`、`2` 和 `3` —— 每个闭包保留自己的号码。
'''
hints = [
  "数值 `for` 每次迭代都会造一个新的局部变量；把它复制到一个外层变量会让每个闭包都拿到同一个最终值。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.cheatsheet_advanced.10.false-default"
title = "FALSE 也是一个答案"
story = "队员可以故意把缓存关掉；那一晚设置读出来却仍然是开着的，阿薇查出了原因。"
brief = '''
`given` 是调用者传来的选项：`true`、`false`，或者没传（`nil`）；`default` 是 `true`。
让 `cache` 成为传来的值 —— **包括 `false`** —— 只有什么都没传时才用 `default`。一行。
'''
hints = [
  "`x and y or z` 和 `x or z` 都把 `false` 当成 `nil`；只有显式地和 `nil` 比较才能分清两者。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.cheatsheet_advanced.11.select-n"
title = "第二声喊"
story = "点名的回答来一个算一个；总管要的是第二个回答，哪怕第一个扛龙人什么都没说。"
brief = '''
`f` 接收任意数量的参数（`function f(...)`）。在它里面，让 `second` 恰好是它的
第二个参数 —— 哪怕第一个是 `nil`，哪怕后面还有更多。
'''
hints = [
  "可变参数列表可以从某个位置切开；把结果赋给一个局部变量只保留剩下的第一个值。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.cheatsheet_advanced.12.unpack-range"
title = "每一个，连空洞一起"
story = "名字沿着龙身往下传，和喊出来的一模一样，空档也算，传给负责数的那一节。"
brief = '''
`t` 是 `{...}`，`n` 是 `select("#", ...)`，所以 `t` 可能有 `nil` 空洞
（`t = {1, nil, nil}`，`n = 3`）。用**全部** `n` 个值调用 `g`，空洞也算。
'''
hints = [
  "对带空洞的表用 `#` 得到的是一个边界，不是个数；解包函数接收明确的首末下标，而在 LuaJIT 上它是一个全局函数。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.cheatsheet_advanced.13.truncate"
title = "只要第一个"
story = "`f` 报告一个值和一个状态；节目单想要一个只装着那个值的列表。"
brief = '''
`f()` 返回两个值，`1, 2`。让 `t` 成为一个**恰好一个**元素的列表，装第一个值 ——
不用临时变量。
'''
hints = [
  "构造器最后位置上的调用会展开所有结果；把调用括起来就把它调整成一个值。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.cheatsheet_advanced.14.wrap"
title = "一个可以调用的跑手"
story = "每一节龙身一个送香的跑手：总管想像调用函数一样调用每一个，拿到下一个灯笼号码。"
brief = '''
`producer` 是一个会多次 yield 值的函数（循环里的 `coroutine.yield(i)`）。让 `gen`
成为一个普通的**函数**：每次 `gen()` 返回下一个 yield 出来的值，并且能直接用在
`for v in gen do` 里。
'''
hints = [
  "创建协程得到的是一个 thread 值，不能被调用；库里有第二个构造函数，交回的是一个函数。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.cheatsheet_advanced.15.resume-value"
title = "跑手带回来的东西"
story = "跑手把一个数字沿龙身往上递，等一个数字传回来之后才收工。"
brief = '''
```
local co = coroutine.create(function(a)
  local b = coroutine.yield(a * 2)
  return b + 1
end)
```

`co` 已经用 `5` 启动过一次；那次调用返回了 `true, 10`，而 `coroutine.status(co)`
现在是 `"suspended"`。写出下一行，使 `ok, v` 为 `true, 8`，并且协程结束
（`"dead"`）。
'''
hints = [
  "第二次 resume 的参数会成为挂起的那个 yield 的结果 —— 恰好是那些参数，一个不多。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.cheatsheet_advanced.16.error-table"
title = "结构化的失败"
story = "失败的查找应该说明它以哪个代码失败，而不是交给调用者一句话去解析。"
brief = '''
`lookup` 必须以一种让调用者能这样写的方式失败

```
local ok, e = pcall(lookup, id)
if not ok then print(e.code) end   -- 404
```

写出 `lookup` 里抛出这个失败的那一行。
'''
hints = [
  "错误值可以是任何 Lua 值，不只是字符串；返回它而不是抛出它会让 `ok` 保持为 true。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.cheatsheet_advanced.17.xpcall"
title = "在哪里断的"
story = "龙在第四十节停住了。阿薇想要消息和它上面的调用帧，不只是消息。"
brief = '''
以保护模式调用 `f`；失败时 `err` 必须装着**附有栈回溯**的消息，而不是光秃秃的消息。
'''
hints = [
  "接收消息处理器的那种保护调用要的是一个函数值；在那里调用它交出的是一个字符串，会被拒绝。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.cheatsheet_advanced.18.gmatch-pairs"
title = "键、等号、值"
story = "鼓队的配置在奥士比街以一行 `name=value` 对的形式到达。"
brief = '''
`s` 是 `"a=1 bb=22 c=3"`。写出一个循环的开头，访问每一对，`k` 是名字、`v` 是数字，
都作为字符串 —— `a`/`1`、`bb`/`22`、`c`/`3`。
'''
hints = [
  "模式里的每个捕获变成一个循环变量；没有捕获时循环拿到的是整个匹配，别的什么都没有。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.cheatsheet_advanced.19.gsub-table"
title = "填空"
story = "节目单模板有 `$name` 的空位；队员名单把它们填上，打印机想知道填了多少个。"
brief = '''
`vars` 是 `{name = "Mei", st = "Tai Hang"}`，而 `s` 是 `"hi $name of $st"`。
把**每一个** `$word` 替换成 `vars[word]`，并让 `n` 成为替换的次数 —— 一次调用，
不用循环。
'''
hints = [
  "用表做替换时，第一个捕获就是查表的键；次数是这次调用的第二个结果。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.cheatsheet_advanced.20.frontier"
title = "整个词"
story = "在节目说明里数 `the` 的时候，阿薇总是把 `there` 和 `thesis` 也数进去。"
brief = '''
`s` 是 `"the thesis there; the other, the."`。让 `n` 成为 `the` 作为**整个词**出现的
次数 —— 这里是 `3`，不是 `6`。（`out` 不使用。）
'''
hints = [
  "Lua 模式没有 `\\b`；frontier 项匹配进入或离开某个字符类的空转换，包括字符串的两端。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.cheatsheet_advanced.21.format-widths"
title = "节目单的栏"
story = "莲花宫摊位的价目板分栏对齐，而评判按字节逐个比对。"
brief = '''
`name` 是 `"tea"`，`price` 是 `3.5`，`n` 是 `7`。精确打印

```
tea       | 3.50|007
```

—— 名字在 10 栏里左对齐，价格在 5 栏里保留两位小数，数字补零到 3 位。
'''
hints = [
  "宽度里的减号表示左对齐，前导零用零补齐，而浮点数的宽度数的是整个 `3.50`。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.cheatsheet_advanced.22.sort-strict"
title = "并列也不崩溃"
story = "四十支鼓队，大多数分数相同，而排序在评判面前抛出了 `invalid order function`。"
brief = '''
`t` 是一个记录列表，每条有数字字段 `score`，而且**很多并列**。按最高分在前排序，
并且不让 LuaJIT 抛出 `invalid order function for sorting`。
'''
hints = [
  "比较器必须是严格序：相等元素返回 false，而且是布尔值，不是数字。（这个排序不稳定；并列的记录可能以任何顺序出来。）",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet_advanced.23.next-empty"
title = "账本里什么都没有"
story = "账本以扛龙人的名字为键；不管它是空是满，`#` 都说零。"
brief = '''
`t` 以扛龙人的名字为键 —— 只有字符串键 —— 所以不管它有没有内容 `#t` 都是 `0`。
写出一个 `if` 的开头，只在 `t` **完全没有**条目时为 true。
'''
hints = [
  "`pairs` 背后的迭代原语返回表的第一个键，没有时返回 `nil`；每个表都是它自己的值，所以 `{}` 和什么都不相等。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet_advanced.24.big-digits"
title = "全部的数字"
story = "灯笼数到了十六位，打印出来却成了科学计数法。"
brief = '''
`n` 是 `2^50` —— 数字 `1125899906842624`。把它每一位都打印出来，不带指数
（LuaJIT 的 `print` 显示的是 `1.1258999068426e+15`）。
'''
hints = [
  "这里每个数字都是 double，默认转换是 `%.14g`；`format` 里的整数转换会写出全部十六位。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet_advanced.25.bit-test"
title = "旗子升起来了吗"
story = "每一节龙身的状态是一个标志数；总管检查代表 `lit` 的那一位。"
brief = '''
`flags` 是一个当作一排比特使用的数字，`i` 是从 `0` 数起的比特位置；LuaJIT 的 `bit`
库已作为 `bit` 加载。写出一个 `if` 的开头，恰好在 `flags` 的第 `i` 位被置位时为 true。
'''
hints = [
  "LuaJIT 没有做这件事的运算符 —— 得靠两次库调用 —— 而且在 Lua 里 `0` 是 true，所以结果还得再比较一下。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet_advanced.26.goto-continue"
title = "跳过这一个"
story = "偶数号的龙身这一圈休息；循环越过它们继续走，不把整个循环体套进一个 `if` 里。"
brief = '''
```
for _, v in ipairs(t) do
  -- ____
  io.write(v, " ")
  ::continue::
end
```

填上空白，使偶数值被跳过而循环继续（LuaJIT 2.1）。
'''
hints = [
  "Lua 没有 `continue` 关键字；LuaJIT 有 5.2 的跳转语句，而循环体末尾的标签就是它的目标。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.cheatsheet_advanced.27.local-function"
title = "知道自己名字的函数"
story = "书馆街的阶乘是局部的、递归的，第二次调用就崩了 —— `attempt to call global 'fact'`。"
brief = '''
把 `fact` 声明为一个**局部**函数，函数体是

```
  if n <= 1 then return 1 end
  return n * fact(n - 1)
```

使递归调用能找到它（不存在名为 `fact` 的全局变量）。写出开头那一行。
'''
hints = [
  "在 `local x = <expr>` 里，名字要到表达式之后才进入作用域，所以这样赋值的函数值看不见自己。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet_advanced.28.ffi-array"
title = "真正的 C 数组"
story = "LÖVE 客户端底下的钱包绑定要和 C 对话；它交出去的缓冲区必须是 C 数组，不是 Lua 表。"
brief = '''
`ffi` 是 `require("ffi")`，`n` 是一个只在运行时才知道的数字。让 `buf` 成为
一个有 `n` 个 `int` 的 C 数组 —— 填零、从 `0` 开始取下标、大小为 `n`。
'''
hints = [
  "C 类型字符串里不能放 Lua 变量；变长数组用一个占位符声明，个数作为下一个参数传入。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet_advanced.29.weak-cache"
title = "会放手的缓存"
story = "渲染缓存以灯笼对象为键；烧尽的灯笼不能被它自己的缓存条目拖着不放。"
brief = '''
`cache` 把对象（用作键的表）映射到计算出的值。让它做到：没有其他任何东西引用的
对象可以被回收 —— 它的条目随之消失 —— 而为活着的对象存的值保留。
'''
hints = [
  "弱引用是元表里一个装着字符串的字段；里面是哪个字母决定了是键弱、值弱还是都弱。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet_advanced.30.sandbox"
title = "给月亮的沙盒"
story = "午夜。最后一道题是陌生人敲进来的一行 Lua，它运行在一间除了 `x` 什么都没有的房间里。"
brief = '''
`src` 是一个 Lua 字符串，`"return x * 2"`，而 `env` 是 `{x = 10}`。把它编译成一个
函数 `f`，它的全局变量**只有** `env` —— 所以 `f()` 返回 `20`，而 `print` 在里面
不可见。一行，LuaJIT。
'''
hints = [
  "编译字符串得到一个函数（或者 nil 和一条消息 —— 所以要断言）；5.1 里那个替换函数全局表的调用返回同一个函数。",
]
