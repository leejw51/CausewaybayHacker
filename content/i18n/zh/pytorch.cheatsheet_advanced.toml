[[quest]]
id    = "pytorch.cheatsheet_advanced.05.modulelist"
title = "登记在册"
story = "渣甸坊楼上一座层层相同的塔。房东只向登记在册的楼层收租。"
brief = '''
```
class Tower(nn.Module):
    def __init__(self, depth):
        super().__init__()
        blocks = [nn.Linear(64, 64) for _ in range(depth)]
        # ____

    def forward(self, x):
        for layer in self.layers:
            x = torch.relu(layer(x))
        return x
```

填上空白，使每一层的权重都出现在 `model.parameters()` 和 `model.state_dict()` 里。
'''
hints = [
  "普通的 Python 容器会把它的内容藏在模块注册表之外。负责注册的容器整个接收列表；Sequential 要的是解包后的层，不是列表。",
]

