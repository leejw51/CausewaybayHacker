sampler = DistributedSampler(ds)
```

构建批大小为 32 的 `loader`，使每个 rank 看到的是 `ds` 中**自己的、互不重叠的
分片**，由 sampler 打乱（每个 epoch 都会调用 `sampler.set_epoch`）。
'''
hints = [
  "sampler 取代了加载器自己的打乱，这两个关键字互斥 —— 两个都传加载器会报错。数据集仍然是第一个参数。",
]

