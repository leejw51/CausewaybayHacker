[[quest]]
id    = "pytorch.cheatsheet_advanced.15.scheduler-step"
title = "每圈降温一次"
story = "机架上的余弦退火：学习率每个 epoch 稍微降一点，在优化器轮过之后。"
brief = '''
```
sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=epochs)
for epoch in range(epochs):
    for xb, yb in loader:
        opt.zero_grad()
        loss = loss_fn(model(xb), yb)
        loss.backward()
        opt.step()
    # ____
```

填上空白，使学习率调度**每个 epoch 推进一次**。
'''
hints = [
  "调度器有它自己的 step，在优化器的 step 之后调用 —— 这里是每个 epoch 一次。读取当前学习率不会推进任何东西，而优化器并不拥有调度器。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.cheatsheet_advanced.16.grad-scaler"
title = "缩放、STEP、更新"
story = "3 号机架显卡上的半精度：小梯度会下溢，除非先把损失放大，并且 step 知道这一点。"
brief = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
    with torch.autocast(device_type="cuda", dtype=torch.float16):
        loss = loss_fn(model(xb), yb)
    # ____
```

CUDA 上的 `float16` 混合精度。用一个训练 step 的三个调用填上空白，使得 backward
在一个被 scaler 放大过的损失上运行，优化器**绝不应用仍处于缩放状态的梯度**
（而梯度中含有 inf 的那一步会被跳过），并且缩放因子只在那一步之后才调整。
'''
hints = [
  "三个调用全都经过 scaler。直接 step 优化器会让梯度保持缩放状态；scaler 拒绝为它从未缩放过的损失做 step，也拒绝在 step 之前 update。",
]

