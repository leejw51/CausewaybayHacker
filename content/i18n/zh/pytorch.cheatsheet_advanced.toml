id    = "pytorch.cheatsheet_advanced.20.distributed-sampler"
title = "每个 RANK 自己的一片"
story = "机架里四张卡，每张一个进程。如果每个进程都读整个数据集，集群就有四倍的工作量，却一点都不快。"
