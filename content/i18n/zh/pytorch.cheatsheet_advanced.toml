```

`F` 是 `torch.nn.functional`。用 `p=0.1` 的**函数式** dropout 填上空白：训练时
丢弃单元，而一旦调用了 `model.eval()` 就**停止丢弃**。
'''
hints = [
  "函数式形式不知道模块处于哪种模式，除非你把模块自己的布尔标志传给它；它的默认是丢弃。在 forward 里新建的层永远处于训练模式。",
]

