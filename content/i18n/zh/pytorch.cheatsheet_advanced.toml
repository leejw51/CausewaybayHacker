# blocks and identifiers are copied verbatim, never translated.

pack   = "pytorch.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.cheatsheet_advanced.01.autograd-grad"
title = "斜率，不要文书"
story = "回到周亦卿楼的地下室。推车上的控制台要的是一个导数，不是一个副作用。"
brief = '''
```
x = torch.tensor([1.0, 2.0], requires_grad=True)
y = (x ** 3).sum()
```

让 `g` 成为梯度 dy/dx，一个形状为 `(2,)` 的**张量** —— 而之后 `x.grad`
必须仍然是 `None`。
'''
hints = [
  "函数式 API 为每个输入返回一个梯度，打包在一个元组里，所以要解包；`y` 上的那个方法是写进 `.grad`，什么都不返回。",
]

