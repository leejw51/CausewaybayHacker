# LUA LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/lua/cheatsheet.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks and identifiers are
# copied verbatim.

pack   = "lua.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet.01.read-line"
title = "第一行"
story = "21:00，浣纱街。队员名单一行一行地送进来。"
brief = '''
从标准输入读一行到 `line`，作为字符串，不带换行符。
'''
hints = [
  "io.read 接收一个格式：一行一种，数字一种，全部一种。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet.02.not-equal"
title = "不一样"
story = "两个人都说自己扛火龙的同一节。纠察确认两个号码不同。"
brief = '''
写出一个在 `a` 和 `b` **不相等**时为真的 `if`。
'''
hints = [
  "Lua 的不等号用波浪号，而不是感叹号。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.cheatsheet.03.last"
title = "龙尾"
story = "龙头是第 1 节。纠察要的是龙尾，不管今晚的龙有多长。"
brief = '''
`t` 是像 `{10, 20, 30}` 这样的列表。让 `last` 成为它的最后一个元素，长度
任意。
'''
hints = [
  "列表从 1 开始，所以长度也就是最后一个元素的下标。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.cheatsheet.04.local"
title = "只留在这里"
story = "每一节自己数自己的香，街上其他人不该看到。"
brief = '''
让 `count` 成为从 0 开始、只在当前块内可见的变量——不是全局变量。
'''
hints = [
  "对新名字直接赋值会产生全局变量。限定作用域只需一个关键字。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.cheatsheet.05.concat"
title = "名牌"
story = "每个扛龙的人都领一张纸牌：一个词、一个横杠、一个号码。"
brief = '''
`n` 是数字 7。让 `s` 成为字符串 `"id-7"`。
'''
hints = [
  "在 Lua 里 `+` 只做算术。字符串用两个点连接。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet.06.ipairs"
title = "从头到尾"
story = "点名从龙头开始，一节一节按顺序来。"
brief = '''
按 1、2、3……的顺序遍历列表 `t`，下标叫 `i`，元素叫 `v`。
'''
hints = [
  "表本身不是迭代器。有一个内置函数按顺序走列表部分，给出下标和值。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet.07.format"
title = "两位小数"
story = "印好的节目单把每人分到的香写到小数点后两位。"
brief = '''
`x` 是 `3.14159`。打印它，小数点后正好两位：`3.14`。
'''
hints = [
  "string.format 用 C 的 printf 代码；精度写在点后面。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.cheatsheet.08.sort-desc"
title = "高的排前面"
story = "扛杆的人按身高排队，最高的在最前。"
brief = '''
`t` 是数字列表。把它按**降序**原地排序。
'''
hints = [
  "table.sort 接收一个函数，说明 `a` 是否排在 `b` 前面。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.cheatsheet.09.closure"
title = "计数器"
story = "莲花宫门口的纠察用一个会记数的计数器数灯笼。"
brief = '''
`counter()` 返回一个函数，每调用一次就加一：

```
local function counter()
  local n = 0
  -- ____
end
local c = counter()
print(c(), c())  -- 1  2
```
'''
hints = [
  "内部函数修改外面的那个 `n` 本身，并把它返回。Lua 没有 `+=`。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.cheatsheet.10.setmetatable"
title = "新的栈"
story = "香堆在棚里的桌子上，每一节都要一堆自己的。"
brief = '''
让 `s` 成为一个新的空表，它的方法查找会转到 `Stack`。

```
local Stack = {}
Stack.__index = Stack
function Stack:push(x) self[#self + 1] = x end
-- ____
s:push(5)
```
'''
hints = [
  "找不到的键会通过元表的 `__index` 去找。setmetatable 设置它并返回该表。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.cheatsheet.11.colon"
title = "冒号"
story = "再放一支香上去。调用得知道这是谁的那一堆。"
brief = '''
`Stack.push` 是用 `function Stack:push(x)` 定义的，`s` 是一个栈。把 5 压进
`s`。
'''
hints = [
  "用 `:` 定义的方法有一个隐藏的第一个参数 `self`。调用时必须把表作为它传进去。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.cheatsheet.12.pcall"
title = "龙头"
story = "午夜。龙头登上庙前的台阶，一支坏香不能让它倒下。"
brief = '''
`f(x)` 可能抛出错误。调用它并捕获错误：失败时 `ok` 为 `false`，`err` 是错误
信息。
'''
hints = [
  "把函数和参数分开交给 pcall；由它自己调用，状态排在前面。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.cheatsheet.13.pop"
title = "从顶上拿"
story = "香一支一支地放上堆；点香的人再把最上面那支拿下来。"
brief = '''
`t` 是一个当作栈用的列表；香用 `table.insert(t, x)` 放上去。把**顶上**（最后一个）
元素从 `t` 取到 `top` 里，使 `#t` 减一。
'''
hints = [
  "负责追加的那个库也负责删除，不给位置时它取末尾。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.cheatsheet.14.gmatch-numbers"
title = "行上的数字"
story = "各节的人数以一行数字到达，中间用空格隔开：`3 14 15`。"
brief = '''
`line` 是 `"3 14 15"`，`t` 是一个空表。往 `t` 里填入三个**数字** 3、14、15——使
`t[1] == 3` 为真，`#t` 为 3。
'''
hints = [
  "模式迭代器把每一段数字作为字符串交出来；一段是一个或多个，而字符串还不是数字。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.cheatsheet.15.sub"
title = "前三个"
story = "铜锣湾的路线牌只显示每条街的前三个字母。"
brief = '''
`s` 是 `"CausewayBay"`。让 `head` 成为它的前三个字符 `"Cau"`。
'''
hints = [
  "Lua 的字符串从 1 数起，取子串的方法接收起点和一个包含在内的终点。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.cheatsheet.16.pairs"
title = "每一个键"
story = "香的账簿按扛龙人的名字记，不按号码，纠察要把每一条都读出来。"
brief = '''
`t` 是 `{ann = 3, bo = 5, cy = 2}`——字符串键，没有列表部分。开一个循环，访问
**每一**条，键叫 `k`，值叫 `v`。
'''
hints = [
  "ipairs 走 1、2、3……在第一个缺失的下标停下；这张表根本没有 `t[1]`。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.cheatsheet.17.select"
title = "来了几个"
story = "扛龙的人喊自己的名字来应到；有些人什么也不喊，纠察照样数上他们。"
brief = '''
`count` 接收任意个参数。让 `n` 成为传入的个数，**包括** `nil`：

```
local function count(...)
  -- ____
  return n
end
print(count(1, nil, 3))  -- 3
```
'''
hints = [
  "把可变参数打包进表会丢掉空洞；那个按位置挑选参数的内置函数还有一个特殊的第一个参数，只负责数个数。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.cheatsheet.18.concat"
title = "一行名字"
story = "节目单把扛杆的人列在一行里，名字之间一个空格。"
brief = '''
`parts` 是 `{"Tai", "Hang", "Road"}`。让 `s` 成为单个字符串 `"Tai Hang Road"`——
不用 `..` 循环。
'''
hints = [
  "table 库一次调用就能把字符串列表连起来；分隔符是第二个参数。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.cheatsheet.19.floor-div"
title = "分份和余数"
story = "香按三支一份分发；棚子借了一些给莲花宫之后，计数变成了负数。"
brief = '''
`a` 是 `-7`，`b` 是 `3`。让 `q` 成为**向下**取整的商（`-3`），`r` 成为**非负**的余数
（`2`），使 `q * b + r == a`。
'''
hints = [
  "LuaJIT 没有整除运算符，而 `/` 永远是浮点数。`%` 已经是向负无穷取整的；fmod 不是。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.cheatsheet.20.shift-letter"
title = "龙转身"
story = "大坑道的午夜。龙头绕着街区转过来，位于 `z` 的扛龙人向前一步，又变回 `a`。"
brief = '''
`c` 是一个小写字母，`k` 是一个非负数。让 `out` 成为字母表里 `k` 位之后的那个字母，
循环回绕——`"z"` 配 `k = 1` 得到 `"a"`。小写 `a` 是字节 97。
'''
hints = [
  "字符串不能做算术；取出它的字节，在 0..25 范围内移动，再把字节变回一个单字符的字符串。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.cheatsheet.21.insert"
title = "再添一个名字"
story = "一个迟到的扛龙人赶到浣纱街的棚子，他的名字添在名册的末尾。"
brief = '''
`t` 是一个名字列表。用 table 库把 `x` 放到 `t` 的**末尾** —— 不做下标运算 ——
使 `#t` 增加一，而 `t[#t]` 是 `x`。
'''
hints = [
  "让列表增长的那个库调用先接收表；不给位置时，它把值放在最后一个之后。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.cheatsheet.22.countdown"
title = "十到一"
story = "点亮龙头的倒数从十数到一，喊声响彻大坑道。"
brief = '''
开启一个数值循环，让 `i` 依次取值 10、9、8、…、1 —— 按这个顺序，全部十个。
'''
hints = [
  "数值 for 每次加一，除非第三个值另有说明 —— 而没有第三个值时，起点高于终点就一次都不跑。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet.23.tally"
title = "计数"
story = "总管按名字记下每个扛龙人拿了多少支香，从一本空账本开始。"
brief = '''
`seen` 是一个开始为空的表，`k` 是一个扛龙人的名字。给 `seen[k]` 加一，把还不在表里
的名字当作 0 —— 第一次它变成 1，而不是报错。
'''
hints = [
  "对 nil 做算术会报错，而 `+` 比 `or` 绑得更紧。把默认值放在加法之前，不是之后。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet.24.function"
title = "两数之和"
story = "两个棚子把香合在一起，总数需要一个有名字的函数，整条街都能调用。"
brief = '''
把 `add` 定义为一个接收两个数并返回它们的和的 **local** 函数，写在一行上。
'''
hints = [
  "Lua 的函数体自己不会交回任何东西，而以 `function` 开头的东西用一个词来结束，不是花括号。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet.25.two-returns"
title = "一次拿两个"
story = "棚子三支一捆地发香，总管想一次拿到捆数和零散的支数。"
brief = '''
`divmod` 返回两个值。把两个都接住：

```
local function divmod(a, b)
  return math.floor(a / b), a % b
end
-- ____
print(q, r)  -- 2  1
```
'''
hints = [
  "一次调用可以交回多个值，而逗号分隔的一列名字会按顺序把它们接住 —— 不用包装，不用括号。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet.26.empty"
title = "还没有人"
story = "第一声鼓响之前，总管查看到底有没有人在名册上签过名。"
brief = '''
`t` 是一个没有空洞的列表，可能为空。开启一个 `if`，恰好当 `t` **没有**元素时为真。
'''
hints = [
  "空表仍然是表，而每个表都是真值；两个不同的表永远不相等。去问个数。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.cheatsheet.27.swap"
title = "换位"
story = "两个扛龙人在半路上交换龙段，名册得把他们的号码对调，连一张纸片都不用。"
brief = '''
`a` 和 `b` 是两个已有的变量。用一条语句交换它们的值，不用临时变量。
'''
hints = [
  "Lua 把一列值赋给一列名字，而且在存入任何一个之前先算完右边的每一个。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet.28.error"
title = "停鼓"
story = "一支没有香的棍子是故障，点火人必须带着一条消息叫停整条线，而不是继续下去。"
brief = '''
用一个消息为 `"bad"` 的错误终止当前函数，使包在外面的 `pcall` 返回 `false` 和一条
含有 `bad` 的消息。
'''
hints = [
  "assert 只在第一个参数是 nil 或 false 时才抱怨，而字符串两者都不是。负责抛出的内置函数直接接收消息。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet.29.and-or"
title = "非此即彼"
story = "拿了超过十支香的扛龙人在棚子交 5 块钱的费用；其他人交 8 块。"
brief = '''
`n` 是一个数。当 `n > 10` 时让 `fee` 为 5，否则为 8 —— 一个表达式，不用 `if` 语句。
'''
hints = [
  "一个关键字在左边为真时给出它的右边；另一个在不为真时补上。读清楚哪个值落在哪里。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet.30.copy"
title = "第二份名册"
story = "午夜。总管把今晚的名册抄一份，这样明天的修改就不会动到火龙之夜的记录。"
brief = '''
`src` 是一个数字列表。让 `cp` 成为一个含同样元素的**新**列表，使 `cp[1] = 99` 之后
`src[1]` 保持原样。这片土地运行的是 LuaJIT（Lua 5.1）。
'''
hints = [
  "赋值一个表复制的是引用，不是表。把列表的值展开进一个新的构造器 —— 而在 5.1 里，展开的那个是全局函数，不是 `table` 的字段。",
]
