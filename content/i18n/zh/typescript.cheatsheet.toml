# TYPESCRIPT LAND — CHEATSHEET, in Simplified Chinese. A translation pack
# (SPEC §12.1): the prose of `content/typescript/cheatsheet.toml`, quest by
# quest, and nothing else. The question is the brief; the four choices are
# code, live in the English pack, and are never translated. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "typescript.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet.01.read-all"
title = "整条数据流"
story = "19:00，时代广场上空。大屏幕的数据流一次性到达，它要全部。"
brief = '''
在 Node 中，把标准输入的**全部**内容作为一个 `string` 读进 `input`。
'''
hints = [
  "文件描述符 0 就是 stdin。不给编码的话，得到的是 Buffer 而不是字符串。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet.02.lines"
title = "没有幽灵行"
story = "怡和街的跑马灯每条消息都以换行结尾，最后一行总是空的。"
brief = '''
`input` 以换行结尾。把它分成 `lines`，末尾**不能**有空字符串。
'''
hints = [
  "把 `\"a\\nb\\n\"` 按换行分割会得到三段，最后一段是空的。先 trim。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.cheatsheet.03.numbers"
title = "文字变数字"
story = "骆克道的彩票摊从一条文字上读出中奖号码。"
brief = '''
`lines[1]` 是 `"3 1 2"`。哪一行能让 `nums` 成为 `number[]` 的 `[3, 1, 2]`？
'''
hints = [
  "`map` 会把下标作为第二个参数传入，而 `parseInt` 把它当作进制。`Number` 只接收一个参数。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.cheatsheet.04.to-fixed"
title = "两位小数"
story = "轩尼诗道的找换店，每个汇率都精确显示到小数点后两位。"
brief = '''
`const x = 3.14159;` 输出 `3.14`——**小数点后**正好两位。
'''
hints = [
  "`toPrecision` 数的是有效数字；数小数位的是另一个方法。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet.05.floor-div"
title = "没有半张票"
story = "七个电车代币分给两个乘客。没人能拿半个代币。"
brief = '''
`a = 7`，`b = 2`，都是非负整数。`q` 必须是 `3`——整数除法。
'''
hints = [
  "所有 number 都是浮点数：`/` 得到 3.5。向下取整。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.cheatsheet.06.for-of"
title = "要值不要键"
story = "记利佐治街的招牌一块一块地读——读店名，不读门牌号。"
brief = '''
开始一个遍历 `arr: number[]` 的**值**（不是下标）的循环。
'''
hints = [
  "`in` 遍历的是键——字符串形式的下标。`of` 遍历的是值。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.cheatsheet.07.sort"
title = "10 排在 9 后"
story = "崇光柜台的排队号：不管字母表怎么说，10 都排在 9 后面。"
brief = '''
`arr: number[]` 里是 `[10, 9, 1]`。把它**按数值升序**就地排序。
'''
hints = [
  "没有比较函数时，`sort` 按字符串比较，所以 \"10\" < \"9\"。比较函数返回一个数：负数表示 `a` 排在前面。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.cheatsheet.08.count"
title = "计数"
story = "大排档按菜式数订单，新菜从零开始。"
brief = '''
`m: Map<string, number>`。给键 `w` 的计数加一；如果还没有，就从 0 开始。`strict` 已开启。
'''
hints = [
  "`get` 返回 `number | undefined`。用 `??` 给缺失的情况一个默认值。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.cheatsheet.09.grid"
title = "楼层平面图"
story = "皇室堡，一层一层、一铺一铺：一张 n×m 的平面图，每个单位都空着——而且每层都是独立的。"
brief = '''
建立 `g`：一个 `n`×`m` 的全零网格，写 `g[0][0] = 1` 时**只**改变那一格。
'''
hints = [
  "把数组传给 `fill`，每个位置放的都是同一个数组。要为每个下标新建一行。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.cheatsheet.10.heap-parent"
title = "上面是谁"
story = "标准库里没有堆，所以小巴队伍自己维护一个——用一个普通数组。"
brief = '''
一个二叉堆存放在从 0 开始的数组 `h` 中：下标 `p` 的子节点是 `2*p + 1` 和 `2*p + 2`。当 `i > 0` 时，哪一行求出 `i` 的父节点？
'''
hints = [
  "把子节点公式倒过来：减一，再除以二并向下取整。用 `i = 2` 试试。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet.11.char-code"
title = "A 是零"
story = "铜锣湾广场大堂的信箱按字母 a 到 z 编号，从零开始。"
brief = '''
`s` 全是小写字母。把下标 `i` 处的字母变成 0..25 范围内的 `k`，其中 `'a'` 是 0。
'''
hints = [
  "字符串不能相减。先把字符的编码取成数字；'a' 是 97。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet.12.unknown-catch"
title = "未知的 throw"
story = "午夜前到达的数据流抛出了什么东西。没人保证它是一个 Error。"
brief = '''
在 `strict` 下，`catch (e) { … }` 里的 `e` 类型是 `unknown`。以一种能通过编译、绝不会崩溃的方式输出它的 `message`。
'''
hints = [
  "不能从 `unknown` 上读取属性。先用运行时检查把它收窄。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet.13.map-entries"
title = "键和计数"
story = "大排档的记单做完了；现在老板一道菜一道菜地读回去，旁边是它的数量。"
brief = '''
`m: Map<string, number>`。开始一个遍历 `m` 里**每一**对的循环，键在 `k` 里，值在 `v` 里。
'''
hints = [
  "Map 以对的形式迭代——把每一对解构。`Object.entries` 只看自有属性，而 Map 一个也没有。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.cheatsheet.14.head-tail"
title = "头和尾"
story = "渣甸坊队伍里的第一辆巴士现在就开；后面的人一起等。"
brief = '''
`a: number[]` 是 `[5, 6, 7]`。在一个声明里，让 `first` 成为数字 `5`，`rest` 成为 `number[]` 的 `[6, 7]`。
'''
hints = [
  "用方括号解构。尾部由三个点收集，不是两个，也不是星号。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.cheatsheet.15.zero-is-a-value"
title = "零是一个值"
story = "希慎广场的 0 层是真实的一层。电梯面板不能把你送到默认层去。"
brief = '''
`x: number | undefined`。让 `d` 在 `x` 有定义时等于 `x`——**即使 `x` 是 `0`**——只有 `x` 是 `undefined` 时才等于 `10`。
'''
hints = [
  "`0` 是假值，所以任何问“它是真值吗？”的写法都会把零扔掉。改问“它是 null 或 undefined 吗？”。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.cheatsheet.16.await-all"
title = "一起到齐"
story = "六个外卖骑手一起从糖街出发。厨房等的是全部六个，不是一个接一个。"
brief = '''
在一个 `async` 函数里，`ps: Promise<number>[]`。让 `rs` 成为所有结果组成的 `number[]`，一起等待它们全部完成。
'''
hints = [
  "await 一个数组得到的还是同一个 promise 数组。先把它们合成一个 promise，再 await 那一个。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.cheatsheet.17.param-property"
title = "一行的类"
story = "午炮只造一次，口径固定，炮台之外没有人能读到这个设置。"
brief = '''
`class P { … }` 的类体里只有一行构造函数。它接收 `x: number`，并把它存为字段 `x`，这个字段是**私有的**（在类外读 `p.x` 是编译错误）和**只读的**（之后给 `this.x` 赋值是编译错误）。`strict` 已开启。
'''
hints = [
  "构造函数参数上的修饰符会声明字段并赋值。访问修饰符写在只读修饰符前面。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.cheatsheet.18.typeof-narrow"
title = "是不是字符串"
story = "百德新街的路牌有时是一个名字，有时是一个数字。只有名字才会被大写喊出来。"
brief = '''
`v: string | number`，`strict` 已开启。开一个 `if`，在它里面 `v.toUpperCase()` 能通过编译。
'''
hints = [
  "原始值不是任何东西的实例。能收窄原始值的运行时检查，是和一个小写字符串做比较。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.cheatsheet.19.bigint"
title = "越过安全线"
story = "铜锣湾避风塘从 1883 年起数着每一个浪。浮点数早就数丢了。"
brief = '''
`target` 是 ES2022。让 `big` 成为一个恰好存着 `9223372036854775807` 的 `bigint`——也就是 2 的 63 次方减一。
'''
hints = [
  "`number` 是 64 位浮点数：超过 2^53 就会舍入，之后再转换也保留着舍入。每个操作数都需要 `n`。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.cheatsheet.20.toward-zero"
title = "向零取整"
story = "午夜的海底隧道收费站：八块钱的退款分三份，亭里的 C 程序员向零取整。"
brief = '''
`a = -8`，`b = 3`，都是整数。`q` 必须是 `-2`——**向零**取整的商，就像 C、Go 和 Rust 里整数的 `/` 那样。
'''
hints = [
  "向下取整和四舍五入在这里都落在 -3 上。你要的是把小数部分切掉，不管正负。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.cheatsheet.21.push"
title = "队伍的末尾"
story = "又一位乘客加入登龙街的小巴队伍 —— 在末尾，乘客加入的地方。"
brief = '''
`a: number[]`，`x: number`。把 `x` 原地加到 `a` 的**末尾**，使之后 `a` 长一个元素。`strict` 已开启。
'''
hints = [
  "`concat` 造出一个新数组，不动 `a`。原地的那个方法返回的是新长度，不是数组 —— 别把它赋回去。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet.22.inclusive-loop"
title = "从一到十"
story = "利园的电梯在 1 到 10 的每一层都停，而第十层不是可选的。"
brief = '''
开启一个循环，其主体在 `i = 1, 2, … 10` 时各运行一次 —— **十**次，包含 `10`。`i` 在别处没有声明。`strict` 已开启。
'''
hints = [
  "用允许改变的东西来声明计数器，并且比较时要让最后一个值仍然能通过。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.cheatsheet.23.add-function"
title = "两个数字进来"
story = "轩尼诗道的找换店把两笔金额加起来；在 strict 之下，它还想知道是哪种金额。"
brief = '''
定义 `add`，使 `add(2, 3)` 为 `5`，并且文件在 `strict` 下（`noImplicitAny` 已开启）能编译。
'''
hints = [
  "没有类型的参数是隐式的 `any`，strict 会拒绝。没有 `return` 的函数体产出 `undefined`。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.cheatsheet.24.join"
title = "胶水"
story = "崇光的播报员大声念出获奖的摊位：每个名字之间一个空格，没有逗号。"
brief = '''
`xs: string[]` 是 `["a", "b", "c"]`。打印出 `a b c` —— 各元素之间用**一个空格**隔开。
'''
hints = [
  "这个方法在数组上，不在分隔符上 —— 而且不带参数调用时，分隔符是逗号。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.cheatsheet.25.empty-check"
title = "没人排队"
story = "凌晨 03:00 的渣甸坊巴士站。有人在等吗？空的队伍也还是队伍。"
brief = '''
`a: number[]`。开启一个 `if`，**只有**当 `a` 没有元素时才进入。`strict` 已开启。
'''
hints = [
  "空数组是真值，而两个数组永远不会 `===`。去比较那个说明有多少个的数字。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet.26.max-of-array"
title = "最高的那座"
story = "告士打道沿线的高楼里，职员想要最高的那座 —— 从一个列表里选，不是从一对里选。"
brief = '''
`arr: number[]` 是 `[3, 9, 2]`（一个短数组）。让 `m` 成为数字 `9`。
'''
hints = [
  "`Math.max` 一个一个地接收数字，不接收数组 —— 把数组交给它是编译错误。把数组展开成单独的参数。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet.27.copy"
title = "自己的一份"
story = "时代广场的票单为夜班复制一份；一份上的改动绝不能出现在另一份上。"
brief = '''
`a: number[]`。让 `b` 成为一个含同样元素的**独立**数组，使之后 `b[0] = 9` 不会改变 `a`。
'''
hints = [
  "赋值一个数组复制的是引用，不是元素。`Array(a)` 造出的是一个以 `a` 为唯一元素的新数组。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet.28.reverse-string"
title = "倒过来"
story = "波斯富街的霓虹招牌，从电车上层倒着读。"
brief = '''
`s` 是 `"abc"`。让 `r` 成为**字符串** `"cba"`。
'''
hints = [
  "字符串没有 `reverse`；数组有。转成数组再转回来 —— 并且留意你什么都不给时 `join` 会在各段之间放什么。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.cheatsheet.29.queue-front"
title = "队伍的最前面"
story = "从维多利亚公园出发的 BFS：最先进去的站最先出来，而且它离开队列。"
brief = '''
`q: number[]` 是 `[1, 2, 3]`，用作 FIFO 队列。**移除**队首元素并放进 `x` —— 使 `x` 为 `1`，而 `q` 剩下 `[2, 3]`。
'''
hints = [
  "`pop` 从末尾取，而下标只读不取。从前面取的那个方法会把其余所有元素往前挪一位。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.cheatsheet.30.wrap-modulo"
title = "绕回去"
story = "又是午夜的海底隧道收费站：差七块钱，三条车道，而车道下标仍然必须是 0、1 或 2。"
brief = '''
`b = 3`。`a` 是一个整数，可能是 `-7`、`0` 或 `4`。让 `r` 成为数学意义上的余数 —— 始终在 `0..b-1` 之内，所以 `-7` 得到 `2`，`0` 得到 `0`，`4` 得到 `1`。
'''
hints = [
  "`%` 保留左操作数的符号，所以单独一个 `%` 对 -7 给出 -1。加上 `b` 修好了负数，却弄坏了 `0` 和正数；想办法处理这一点。",
]
