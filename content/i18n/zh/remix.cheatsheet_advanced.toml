# REMIX LAND — CHEATSHEET ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/remix/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "remix.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet_advanced.01.handoff-go"
title = "交过来"
story = "06:50，渣甸坊。阿薇向售货亭要一个数，而售货亭还没算出来就先等着她来拿。"
brief = '''
在 **Go** 里，`main` 有 `ch := make(chan int)` —— **无缓冲** —— 之后做 `x := <-ch`。
`compute()` 返回一个 `int`。放在这两行之间的哪一行能把 `compute()` 的结果送进 `x`，
而 `main` 不死锁？
'''
hints = [
  "无缓冲的发送会阻塞到有人接收为止。发送者必须是和接收者不同的 goroutine。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.cheatsheet_advanced.02.handoff-rust"
title = "交过来，FERRIS"
story = "Ferris 把同一个数端过 Lucky Mac 的柜台，而柜台不让他借用托盘。"
brief = '''
在 **Rust** 里，`let (tx, rx) = mpsc::channel::<i32>();`，而 `main` 以
`let v = rx.recv().unwrap();` 结束。`compute()` 返回一个 `i32`。两行之间的哪一行
启动一个线程，把 `compute()` 的结果送到 `v` —— 并且能编译？
'''
hints = [
  "spawn 出来的闭包可能活得比 main 的栈帧长，所以它不能借用发送端；它必须拥有它。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "remix.cheatsheet_advanced.03.handoff-python"
title = "交过来，慢慢地"
story = "菜市场价目板旁的蟒蛇第三次拿到同一个数，在一个线程上，而这次它必须真的启动。"
brief = '''
在 **Python** 里，`q = queue.Queue()`，而 `main` 以 `v = q.get()` 结束。
`compute()` 返回一个 `int`。两行之间的哪一行在**新线程**上运行 `compute()` 并把
它的结果送到 `v` —— 使 `q.get()` 能返回而不是永远等下去？
'''
hints = [
  "`target` 要的是一个不带参数就能调用的东西，而只构造却从不 start 的 Thread 什么都不做。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.cheatsheet_advanced.04.counter-go"
title = "一次一个"
story = "Lucky Mac 里 Bo 师傅的订单计数器：两个厨师，各一千下，而板子必须恰好显示两千。"
brief = '''
在 **Go** 里，

```
type C struct {
    mu sync.Mutex
    n  int
}

func (c *C) Inc() {
    // ____
    c.n++
}
```

两个 goroutine 各调用 `Inc` 1000 次。哪一行能让 `c.n` 每次运行都恰好是 2000，
在 `go test -race` 下干净，并且永远不会把互斥锁一直占着？
'''
hints = [
  "递增本身必须在持有锁的时候发生，而解锁必须安排在方法返回的时候。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.cheatsheet_advanced.05.counter-rust"
title = "一次一个，FERRIS"
story = "四只螃蟹，一个计数，怡和街。Ferris 的钳子里攥着 guard，却仍然没法往上加。"
brief = '''
在 **Rust** 里，`let counter = Arc::new(Mutex::new(0));`，而每个 spawn 出来的线程
都持有 `let c = Arc::clone(&counter);`。在线程的循环里，哪一行给共享的数加一 ——
并且能编译？
'''
hints = [
  "上锁得到一个 Result；里面是一个 guard，而做算术之前必须先解引用 guard。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.cheatsheet_advanced.06.counter-python"
title = "一次一个，GIL 说的"
story = "7-32 室在四个线程上数夜班的单子；GIL 对 `+=` 什么都不保证。"
brief = '''
在 **Python** 里，`lock = threading.Lock()` 是所有线程共享的那一把锁，而 `n = 0`
是全局变量：

```
def work():
    global n
    for _ in range(100_000):
        # ____
            n += 1
```

四个线程运行 `work`。哪一行能让 `n` 每次运行都恰好是 400000 —— 每个线程轮流
使用**同一把**锁？
'''
hints = [
  "锁对象自己就是上下文管理器；acquire() 返回的东西不是。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "remix.cheatsheet_advanced.07.wait-go"
title = "四个全回来"
story = "四个速递员离开糖街的货仓；只有每一个都签到回来之后门才上锁。"
brief = '''
在 **Go**（1.22，所以每次迭代的 `i` 都是新的）里：

```
var wg sync.WaitGroup
for i := 0; i < 4; i++ {
    wg.Add(1)
    // ____
}
wg.Wait()
```

哪一行在各自的 goroutine 上启动 `work(i)`，使 `wg.Wait()` 恰好在四个 `work` 调用
都**完成**时返回 —— 不死锁，也不提前返回？
'''
hints = [
  "得有东西在 work 返回后调用 Done，在干活的那个 goroutine 上，而 go 语句需要一个调用。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "remix.cheatsheet_advanced.08.wait-rust"
title = "四个全回来，FERRIS"
story = "Ferris 把摊位自己的价目表同时借给三个帮手，想在卷闸落下之前拿回来，不装箱。"
brief = '''
在 **Rust** 里，`let v = vec![1, 2, 3];` 而 `fn work(x: &i32) -> i32`：

```
thread::scope(|s| {
    for x in &v {
        // ____
    }
});
```

哪一行为每个元素启动一个直接借用 `v` 的线程 —— 不用 `Arc`，不用 `'static` ——
并在作用域结束时被 join？
'''
hints = [
  "通过作用域句柄 spawn，而不是自由函数，并且给它一个闭包，不是一个值。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "remix.cheatsheet_advanced.09.wait-python"
title = "四个全回来，按顺序"
story = "蟒蛇把四件活交给市场的搬运工，想按活儿派出去的顺序拿回收据。"
brief = '''
在 **Python** 里，`jobs` 是一个列表，而 `work(j)` 返回一个 `int`：

```
with ThreadPoolExecutor(4) as ex:
    # ____
print(out[0], len(out))
```

哪一行在池的线程上对 `jobs` 运行 `work`，并让 `out` 成为按任务顺序排列的
**结果列表**，使 `print` 能用？
'''
hints = [
  "executor 自己的 map 保持顺序，但交回的是一个惰性迭代器；submit 交回的是 future。两者都不能取下标。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "remix.cheatsheet_advanced.10.shape-go"
title = "谁是形状"
story = "波斯富街的 Alex 从时代广场的平面图上剪下一个正方形，而编译器说它不是形状。"
brief = '''
在 **Go** 里，

```
type Shape interface{ Area() float64 }

type Sq struct{ s float64 }

func (q *Sq) Area() float64    { return q.s * q.s }
func (q *Sq) Scale(k float64)  { q.s *= k }
```

哪一行把一个 2×2 的正方形放进 `s` —— 并且能编译？
'''
hints = [
  "看接收者。方法集属于声明它的那个类型，而 Sq 的值不是那个类型。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "remix.cheatsheet_advanced.11.shape-rust"
title = "谁是形状，FERRIS"
story = "Ferris 把 trait 写在 Lucky Mac 的餐巾纸上；正方形只需要签个名。"
brief = '''
在 **Rust** 里，

```
trait Shape {
    fn area(&self) -> f64;
    fn describe(&self) -> String { format!("{:.1}", self.area()) }
}

struct Sq { s: f64 }
// ____
```

哪一行让 `Sq { s: 2.0 }.describe()` 给出 `"4.0"`？
'''
hints = [
  "trait 实现在类型上，永远不是反过来，而方法的接收者必须和 trait 的完全一致。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.cheatsheet_advanced.12.shape-python"
title = "谁是形状，它会嘎嘎叫"
story = "蟒蛇不在乎正方形继承自什么，只在乎它回应 `area` —— 而 `isinstance` 要求白纸黑字写下来。"
brief = '''
在 **Python** 3.12 里，`Sq` 是一个有 `area(self) -> float` 方法、没有基类的普通类：

```
