```

`n = counter(); n(); n()` 必须给出 1 然后 2，没有模块级的 `c`。空位里放哪一行？
'''
hints = [
  "赋值会让名字成为最内层函数的局部变量，除非你说明它属于哪个外层作用域 —— 而模块不是那个作用域。",
]

