# ---------------------------------------------------------------- 29
[[quest]]
id    = "remix.cheatsheet_advanced.29.match-rust"
title = "又小又奇，FERRIS"
story = "Ferris 在湾仔的庙里挑幸运数字：一位数、奇数，而且他想在检查的时候留着那个数字。"
brief = '''
在 **Rust** 里，`x` 是一个 `Option<i32>`：

```
match x {
    // ____ "small odd",
    Some(_) => "other",
    None => "none",
}
```

哪个分支头匹配一个 1 到 9（含）之间且为**奇数**的值，并把值绑定到 `n` 供检查？
'''
hints = [
  "用 at 符号把一个名字绑定到范围子模式上，然后把算术放进守卫；Rust 的模式里没有 `in` 也没有 `as`。",
]

