id    = "remix.cheatsheet_advanced.30.match-python"
title = "BOSS：位置模式"
story = "最后一个节点，时代广场。蟒蛇的普通类在说明哪些属性算数、按什么顺序之前，不会按位置匹配。"
brief = '''
在 **Python** 3.12 里，`Pt` 是一个普通类 —— **不是** dataclass：

```
class Pt:
    # ____
    def __init__(self, x, y):
        self.x = x
        self.y = y
```

没有空位里那一行，`case Pt(a, b):` 会抛出
`TypeError: Pt() accepts 0 positional sub-patterns`。类体里的哪一行能让
`case Pt(a, b):` 把 `a` 绑定到 `x`、把 `b` 绑定到 `y`？
'''
hints = [
  "有一个 dunder 正是做这个的，而解释器坚持它必须是一个属性名的元组 —— dataclass 会替你写好。",
]
