class Shape(Protocol):
    def area(self) -> float: ...
```

导入未显示。空位里放哪一行，使 `isinstance(Sq(2), Shape)` 回答 `True` 而不是
抛出 `TypeError`？
'''
hints = [
  "Protocol 只是静态承诺，除非你把它标记为解释器可以在运行时检查的东西；这个标记在 `typing` 里。",
]

