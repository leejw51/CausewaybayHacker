[[quest]]
id    = "remix.cheatsheet_advanced.19.error-go"
title = "缺的是哪个键"
story = "到达 Alex 手里的错误从波斯富街的缓存一路往上被包了两层；他仍然想要那个键。"
brief = '''
在 **Go** 里，

```
type NotFound struct{ Key string }

func (e *NotFound) Error() string { return e.Key + " not found" }

func load(k string) error {
    return fmt.Errorf("load: %w", &NotFound{Key: k})
}
```

`err := load("tea")`。哪一行能拿到 `err` 里面的 `*NotFound`，使 `nf.Key` 可以被
打印 —— 并且不 panic？
'''
hints = [
  "普通的类型断言只看得见最外层的包装。针对*类型*的解包辅助函数需要一个指向该类型变量的指针。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "remix.cheatsheet_advanced.20.error-rust"
title = "缺的是哪个键，FERRIS"
story = "Ferris 在 Lucky Mac 的餐巾纸上手写了错误的 Display；`?` 还是不肯把它装箱。"
brief = '''
在 **Rust** 里，只用标准库 —— 没有 crate：

```
#[derive(Debug)]
struct NotFound(String);

impl fmt::Display for NotFound { /* "<key> not found" */ }

// ____

fn load(k: &str) -> Result<i32, Box<dyn Error>> {
    Err(Box::new(NotFound(k.into())))
}
```

空位里的哪一行能让 `load` 编译，使调用者可以对它用 `?`？
'''
hints = [
  "有了 Debug 和 Display，错误 trait 再没有什么可要求的了 —— 但它仍然必须被实现，带一个空的函数体。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "remix.cheatsheet_advanced.21.error-python"
title = "缺的是哪个键，以及为什么"
story = "蟒蛇把市场的 KeyError 重新抛成自己的错误，而回溯仍然必须显示它从哪里开始。"
brief = '''
在 **Python** 里，`class NotFound(KeyError): pass`，而

```
def load(k):
    try:
        return d[k]
    except KeyError as e:
        # ____
```

调用者必须捕获到一个 `NotFound`，它的 `__cause__` **就是**原来的 `KeyError`。
空位里放哪一行？
'''
hints = [
  "在 except 块里抛出会自动记录一个 context；cause 必须显式点名，而用 `None` 做 cause 会把它压掉。",
]

