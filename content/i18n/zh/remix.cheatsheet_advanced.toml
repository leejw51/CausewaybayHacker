# ---------------------------------------------------------------- 15
[[quest]]
id    = "remix.cheatsheet_advanced.15.generic-python"
title = "任意两个里较大的，带约束"
story = "蟒蛇的类型检查器想在放两个价格通过之前先知道 `<` 是什么意思。"
brief = '''
在 **Python** 3.12 里，`Comparable` 是一个带 `__lt__` 的 `Protocol`：

```
from typing import TypeVar

# ____

def smallest(a: T, b: T) -> T:
    return a if a < b else b
```

哪一行声明 `T`，使得只有 `Comparable` 的类型可以使用 —— 并且在模块被导入时不报错？
'''
hints = [
  "TypeVar 先接收它的名字；之后，一个上界类型放在关键字参数里，而裸的位置参数类型是约束，至少要两个。",
]

