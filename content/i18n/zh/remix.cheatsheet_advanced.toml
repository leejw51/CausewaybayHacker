  "闭包必须修改外层的 `c`，而不是在自己的作用域里声明一个新的，而且在 Go 里 `++` 是语句，不是值。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "remix.cheatsheet_advanced.17.closure-rust"
