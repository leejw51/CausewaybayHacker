[[quest]]
id    = "pytorch.basic.18.sequential"
title = "两层加一个弯"
story = "第一个带隐藏层的网络，而它得先建出来，才谈得上出错。"
brief = '''
`nn.Sequential` 把模块串起来：每一个的输出就是下一个的输入。四个特征进，八个隐藏单元，中间一个 ReLU，三个类别出——这是真有人会上线的最小网络。

参数个数是 `(8*4 + 8) + (3*8 + 3) = 67`。

```
output: (2, 3) 67
```
'''
hints = [
  "nn.Sequential(nn.Linear(4, 8), nn.ReLU(), nn.Linear(8, 3)) ——隐藏宽度出现两次，先作为 out，再作为 in。",
  "nn.ReLU() 是一个模块，要带括号构建；torch.relu 是函数版本。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "pytorch.basic.19.module"
title = "自己的网络"
story = "只要有什么东西发生两次，Sequential 就不够用了，而地下室里那东西不过是同一个块，一再重复。"
brief = '''
真正的模型是一个类。两条规则，恰恰也是大家会违反的两条：在 `__init__` 里把各层赋给 `self`，让它们注册为参数；并且在这之前调用 `super().__init__()`。

`forward` 说明发生什么；调用模型就是调用 `forward`。

```
output: (2, 1) 21
```
'''
hints = [
  "self.fc1 = nn.Linear(3, 4) 和 self.fc2 = nn.Linear(4, 1) ——4 是隐藏宽度，先作为 out，再作为 in。",
  "存在普通列表里而不是挂在 self 上的层，永远不会出现在 parameters() 里，也永远不会被训练。",
]

