# ---------------------------------------------------------------- 21
[[quest]]
id    = "pytorch.basic.21.eval-mode"
title = "还在训练模式"
story = "同一个验证集每评分一次，验证数字就变一次。Dropout 还开着。"
brief = '''
有些层在训练时表现不同。Dropout 在训练时随机把激活值置零，在评估时则什么也不做，而 `model.eval()` 就是拨动这个开关的东西。`model.train()` 把它拨回去。

在 eval 模式下评分两次，两次答案相同；在 train 模式下评分两次则不然。

```
output: True
```
'''
hints = [
  "model.eval() ——它会返回模型本身，但调用它是为了它拨动的那个开关。",
  "no_grad 只是停止记录计算图；它不会关掉 dropout。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "pytorch.basic.22.state-dict"
title = "模型是什么，存下来"
story = "地下室里训练了四个小时，而进程马上就要因为维护窗口被杀掉。"
brief = '''
保存下来的模型不是代码；是那些数字。`state_dict()` 是包含每个参数的有序字典，而 `load_state_dict()` 把它们放进另一个同样形状的模型——这就是为什么加载进形状不同的模型会大声失败，而不是悄悄失败。

把训练好的权重复制到一个新模型里，检查它们现在一致。

```
output: True
```
'''
hints = [
  "fresh.load_state_dict(trained.state_dict()) ——从一个读出，加载进另一个。",
  "fresh = trained 会让它们成为同一个对象，那什么也证明不了。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "pytorch.basic.23.minibatch"
title = "不要一次全上"
story = "整份抓包数据以一个张量整个送进去，分配器放弃了，任务在第四分钟挂掉。"
brief = '''
小批量就是一个切片。遍历 `range(0, n, bs)` 并取 `x[i:i + bs]`，得到大小为 `bs` 的批次；当 `n` 不能整除时，最后还有一个短的——正是这个批次会弄坏假设每批都满的代码。

十个样本，每批四个：打印每个批次的行数。

```
output: [4, 4, 2]
```
'''
hints = [
  "x[i:i + bs] ——切片越过末尾不算错误；它只给出剩下的部分。",
  "最后一批是短的。下游任何地方把 bs 写死的代码，恰恰会在这一批上出错。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "pytorch.basic.24.dataloader"
title = "加载器"
story = "手写的分批循环有四十行，洗牌那里还有个 bug。Torch 从一开始就自带这个。"
brief = '''
`TensorDataset` 把特征和标签配成对，一个下标同时给出两者；`DataLoader` 对它们分批并洗牌。遍历它得到 `(features, labels)` 对，已经切好了。

用 `shuffle=False` 时，顺序就是张量原本的顺序，所以这次运行可以重复。

```
