# PYTORCH LAND — BASIC, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/pytorch/basic.toml`, quest by quest, and
# nothing else. Code blocks, identifiers, sample input and output and the
# exact strings a program must print are the English pack's and are copied
# verbatim, never translated.

pack   = "pytorch.basic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.basic.01.night-shift"
title = "夜班"
story = "机房，23:00。控制台吐出一行读数，是文本，而楼下的每件工具要的都是张量。"
brief = '''
标准输入送来一行以空白分隔的数字。把它变成一个**浮点**张量，打印它的形状（作为元组）和它的总和。

`input().split()` 给出一个字符串列表；`float(t)` 转换其中一个。在这两者之上写一个列表推导式就是全部的转换，而 `torch.tensor` 接收这个列表。

总和用 `.item()` 打印——它从一个 0 维张量里取出 Python 数字——并四舍五入到四位小数，这样一个循环小数就不会和自己对不上。

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
hints = [
  "torch.tensor([float(t) for t in input().split()]) ——拆开、转换、包起来。",
  "一维的形状打印出来带一个结尾逗号：(4,)，而不是 (4)。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.basic.02.the-batch"
title = "六个变成两行"
story = "六个数字平平地从线路上过来。模型是按两个样本、每个三个特征写的，不接受这一条平的。"
brief = '''
模型几乎从来不要一条平的数据；它要的是 `(batch, features)`。`reshape` 给同样的数字一个新形状，而某个位置上的 `-1` 意思是*这一维由其他维推算出来*。

把这条平的读数重塑成每行三个，行数是多少就是多少，然后打印形状和第一行的最后一个数。

```
input: 1 2 3 4 5 6
output: (2, 3) 3.0
```
'''
hints = [
  "flat.reshape(-1, 3) ——三列，行数自动推断。",
  "reshape(3, -1) 会是三行、每行不定个数，正好反过来。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.basic.03.normalise"
title = "没人说好的尺度"
story = "一个特征以度为单位，下一个以瓦为单位。模型把训练的每一步都花在学\"瓦数更大\"这件事上。"
brief = '''
把一个特征标准化，意思是减去它的均值、再除以它的标准差，于是每一列都以零为中心、离散程度为一。

在 `dim=0` 上求均值，每列得到一个数——形状 `(features,)`——把它从 `(batch, features)` 里减去时，会沿着各行广播下去。标准差也一样。

最后打印四舍五入后的各列均值；按构造它们就是零。

```
input: 1 10 2 20 3 30
output: [0.0, 0.0] [1.0, 1.0]
```
'''
hints = [
  "(x - x.mean(dim=0)) / x.std(dim=0) ——dim=0 把各行压掉，每列只留一个数。",
  "不写 dim=0，你得到的是整个张量的均值，会把两个特征混在一起。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.basic.04.split-xy"
title = "标签那一列"
story = "抓包文件把标签当作最后一列粘在后面，而模型一直在拿答案训练。"
brief = '''
一张原始表通常把标签和特征放在一起。拆开它就是两个切片：直到最后一列之前的所有列，以及单独的最后一列。

`x[:, :-1]` 是每一行、除最后一列外的每一列。`x[:, -1]` 是每一行的最后一列，列这一轴随之消失，所以结果是每行一个数。

打印两个形状，然后打印标签。

```
input: 1 2 0 3 4 1
output: (2, 2) (2,) [0.0, 1.0]
```
'''
hints = [
  "table[:, :-1] 和 table[:, -1] ——切片保留这一轴，单个下标去掉这一轴。",
  "table[:, -1:] 会保留列轴，给出 (2, 1)，那不是同一个形状。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.basic.05.layer-by-hand"
title = "把一层写出来"
story = "在层变成一个类之前，它是两个运算，而夜班想亲眼看它们一次，什么都不藏。"
brief = '''
线性层就是一次矩阵乘法加一次偏置加法，别无其他。对形状为 `(batch, in)` 的一批 `x` 和形状为 `(out, in)` 的权重 `W`——torch 就是按这个形状存储它的——输出是 `x @ W.t() + b`。

`W.t()` 是 `(in, out)`，所以内侧维度对得上，而形状为 `(out,)` 的 `b` 在整个批次上广播。

把它写出来，打印形状和四舍五入后的结果。

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
hints = [
  "x @ W.t() + b ——是转置让内侧维度对上。",
  "x @ W 在这里也能跑，因为矩阵是方的，但它算的是错的东西。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.basic.06.relu"
title = "叠起来还是平的"
story = "三个线性层连成一排，整个堆栈画出的直线和一层画出的完全一样。"
brief = '''
两个中间什么都没有的线性层就是一个线性层。激活函数才让深度有意义，而 ReLU 是几乎所有地方都用的那个：保留正数，其余归零。

把它作用在这一层的输出上，然后报告有多少个数活了下来。

```
output: [0.0, 0.0, 1.0, 3.0] 2
```
'''
hints = [
  "torch.relu(z) 保留正数，其余一律压到零。",
  "(a > 0).sum() 对布尔值计数，因为求和时 True 就是 1。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.basic.07.sigmoid"
title = "要着火了吗"
story = "热模型输出 4.2，而夜班问的问题是这个机架是不是快要跳闸了。"
brief = '''
单个输出神经元产生一个 `(-∞, ∞)` 上的原始分数。Sigmoid 把它压到 `(0, 1)`，在那里可以读作概率，而决策边界——分数 0、概率 0.5——就是"是"变成"否"的地方。

把分数变成概率，再在 0.5 处变成是/否的判定。

```
output: [0.0474, 0.5, 0.9526] [0, 1, 1]
```
'''
hints = [
  "torch.sigmoid(scores) ——分数 0 出来正好是 0.5。",
  "(probs >= 0.5).int() 把布尔值变成 0 和 1，让它们作为数字打印出来。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.basic.08.softmax-rows"
title = "每行各算各的"
story = "一批四个样本，每个三个类别，而置信度加起来是整个批次合计为一，而不是每一行合计为一。"
brief = '''
在形状为 `(batch, classes)` 的一批 logits 上，softmax 必须在**类别**轴——`dim=1`——上做，这样每一行各自加起来为一。`dim=0` 会让每一*列*加起来为一，那是对批次的陈述，毫无意义。

在类别上对这批数据做 softmax，打印每行的合计。

```
output: [1.0, 1.0] (2, 3)
```
'''
hints = [
  "torch.softmax(logits, dim=1) ——在 (batch, classes) 张量上，dim=1 是类别轴。",
  "这里 dim=-1 意思相同，而且以后加上批次轴也照样有效。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.basic.09.predict"
title = "要答案，不要分数"
story = "仪表盘给每个样本显示三根置信度条，操作员得用肉眼读出哪个类别赢了，一晚上四百次。"
brief = '''
分类器的预测是每一行里最大 logit 的下标：在类别轴上做 `argmax`。Softmax 不会改变哪一个最大，所以预测可以直接从 logits 上读出来。

打印这一批每一行的预测类别。

```
output: [2, 0, 1]
```
'''
hints = [
  "logits.argmax(dim=1) ——每行一个下标，所以结果是 (batch,)。",
  "不写 dim，它会把整个批次展平，给出一个指向全体的下标。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.basic.10.accuracy"
title = "它多常是对的"
story = "站会上说这个模型表现不错。屋里没人有一个数字。"
brief = '''
准确率是预测与标签相符的比例。逐元素比较两个张量得到布尔值；布尔值不能求平均，所以先转成浮点，然后 `mean()` 就是这个比例。

打印四舍五入到四位的准确率，以及命中的个数。

```
output: 0.75 3
```
'''
hints = [
  "(pred == want).float().mean() ——是转成浮点才让 mean 合法。",
  "直接对布尔张量调用 mean() 会报错；torch 不会替你挑一个 dtype。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "pytorch.basic.11.mse-by-hand"
title = "错了多少，亲手算"
story = "损失曲线是平的，没人信得过这个库。亲手把这个数写出来一次，看它动起来。"
brief = '''
均方误差就是它名字说的那样：差值，平方，求平均。写出来就是 `((pred - want) ** 2).mean()`，而 `nn.MSELoss()(pred, want)` 是同一个数。

两种方式都算一遍，打印出来。

```
output: 1.5 1.5
```
'''
hints = [
  "((pred - want) ** 2).mean() ——先平方再求平均，否则正负号会相互抵消。",
  "nn.MSELoss() 先构建，再对这一对调用：nn.MSELoss()(pred, want)。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "pytorch.basic.12.cross-entropy"
title = "吃 logits 的损失"
story = "有人先对输出做了 softmax，再把它交给分类损失，模型就此停止学习，却一次也没报错。"
brief = '''
`nn.CrossEntropyLoss` 接收的是**原始 logits**，不是概率——softmax 就在它里面。目标是 dtype 为 `int64` 的类别**下标**，每行一个，不是 one-hot 行。

把 logits 和下标喂给它，打印损失。一批自信且正确的预测，损失接近零。

```
output: 0.0659
```
'''
hints = [
  "nn.CrossEntropyLoss()(logits, want) ——logits 原样送进去；不要先做 softmax。",
  "目标是下标，所以必须是 int64——浮点目标会报错。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "pytorch.basic.13.the-gradient"
title = "这一点上的斜率"
story = "参数是 4.0，损失是它的平方，而一步训练永远只问一个问题：哪个方向是下坡。"
brief = '''
把参数标记为可学习，跑一遍前向传播，然后在损失上调用 `backward()`。`w * w` 的梯度是 `2w`，所以在 `4.0` 处，`w.grad` 里落下的是 `8.0`。

在跑过一次反向传播之前，`.grad` 都是 `None`——这通常就是第一个训练循环打印出 `None` 然后停住的原因。

```
output: 8.0
```
'''
hints = [
  "loss.backward() ——在计算图的末端调用，而不是在参数上调用。",
  "梯度落在 w.grad 里；backward() 本身什么也不返回。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.basic.14.accumulate"
title = "它留着上一次的"
story = "两次反向传播，梯度是算术给出的两倍。两次之间什么都没清。"
brief = '''
`backward()` 是往 `.grad` 里**累加**；它不会替换。所以对同一个参数跑两次，留下的是两次梯度之和，这就是为什么每个训练循环都在反向传播之前清空梯度。

跑第二次之前先清空梯度，让打印出来的数是一次的量：`3.0` 处的 `2w`。

```
output: 12.0 6.0
```
'''
hints = [
  "w.grad = None 把它清掉；下一次反向传播从零开始。",
  "优化器会替你做这件事——opt.zero_grad() 是同一个意思，作用在它持有的每一个参数上。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.basic.15.step-by-hand"
title = "下坡，一次"
story = "在优化器变成一个对象之前，它是一次减法，而夜班想亲眼看这一次减法。"
brief = '''
梯度下降就是 `w ← w - lr * w.grad`，这就是整个算法。它必须在关掉计算图的情况下进行——更新是记账，不是模型的一部分——所以它放在 `torch.no_grad()` 里面。

`w` 从 `5.0` 开始，`w * w` 的梯度是 `10.0`，`lr` 是 `0.1`。

```
output: 4.0
```
'''
hints = [
  "w -= lr * w.grad ——是减号，因为梯度指向上坡。",
  "它必须在 no_grad 块里面，否则 torch 拒绝就地修改一个 requires grad 的叶子张量。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.basic.16.optimiser"
title = "那三行"
story = "世上写过的每个训练循环都是同样三行、同样的顺序，而夜班抄来的那个，顺序不一样。"
brief = '''
优化器持有参数并执行更新。循环体永远是同样三个调用，按这个顺序：清空旧梯度，跑反向传播，执行这一步。

在 `w * w` 上从 `5.0` 开始、以 `lr=0.1` 跑二十步 SGD，会把 `w` 推向零。

```
output: 0.0576
```
'''
hints = [
  "zero_grad、backward、step ——清空、计算、应用。",
  "在 backward() 之前调用 step()，应用的是上一次留在 .grad 里的东西。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.basic.17.fit-a-line"
title = "二 X 加一"
story = "风扇曲线是一条直线，没人记下它的斜率。机架门上贴着四个测量值。"
brief = '''
这是最小的真正训练过程：一个 `Linear(1, 1)`，四个恰好落在 `y = 2x + 1` 上的点，再加上足够多步的 Adam 来找出那两个数。

循环体就是你已经知道的那三个调用，前面加上前向传播和损失。

```
output: 2.0 1.0
```
'''
hints = [
  "model(x) 执行前向传播；永远不要直接调用 model.forward(x)。",
  "loss = loss_fn(model(x), y)，然后 zero_grad、backward、step。",
]

