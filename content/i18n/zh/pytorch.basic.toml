[[quest]]
id    = "pytorch.basic.20.train-classifier"
title = "两个簇"
story = "凭两个数判断是冷通道还是热通道。两个簇相隔十万八千里，模型还是错一半，因为没人训练过它。"
brief = '''
第一个分类器：两个分得很开的簇，两个类别，交叉熵，两百步。所有东西都建好了；缺的是循环体。

交叉熵接收模型返回的原始 logits 和整数标签——不做 softmax，不做 one-hot。

```
output: 1.0
```
'''
hints = [
  "loss = loss_fn(model(x), y)，然后按顺序是那三个调用。",
  "标签已经是 int64；交叉熵要的是下标，不是 one-hot 行。",
