**这条街强制执行它的复杂度，而且它是唯一做得到这一点的类型。**有一个隐藏用例是 `n = 200000`。`O(n²)` 的双重循环 —— 起始代码就是它 —— 是 `2 × 10^10` 次比较，在五秒的运行限制内跑不完。在归并排序的过程中数逆序对是 `O(n log n)`，大约二十毫秒跑完。在这台机器上、用这两个程序实测。

