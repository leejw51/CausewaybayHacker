[[quest]]
id    = "rust.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到现在通关的每张地图数的都是跳数。电车不在乎有几站；它在乎每站要多久。"
brief = '''
标准输入是 `n m seed`：`n` 个站点，`m` 条无向带权边。用**恰好**这个生成器、在回绕的 `u64` 里自己构建图：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

打印从站点 `0` 到每个可达站点的最短距离之和（包括 `0` 本身，它是 `0`），然后打印 `MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里的复杂度是强制的。**有一个隐藏用例是 `n = 100000`、`m = 200000`。不管怎样 Dijkstra 都是正确的算法；钟裁决的是优先队列。扫描每个未访问节点找最小值是 `O(V²)`，对着五秒的运行限制它要跑**大约十六秒**。二叉堆让它变成 `O((V + E) log V)`，**大约五十毫秒**跑完。两个数字都在这台机器上、用这条街附带的两个程序实测：起始代码就是扫描版。

值得看清楚，因为这是限时笔试里最常见的失败方式：**起始代码没有错。**它打印的答案完全正确。它被拒绝只是因为迟到了三倍。

`std::collections::BinaryHeap` 是最大堆，所以压入 `Reverse((distance, node))`。它没有 decrease-key，你也不需要：把改进后的距离作为新条目压入，弹出时跳过任何距离已经比你记录的更差的条目。这个"过期条目"跳过是人们忘记的那一行，没有它堆会无限增长。
'''
hints = [
  "Reverse((distance, node)) 把最大堆变成最小堆，并且把距离放在前面，让它成为条目排序的依据。",
  "`if d > dist[u] { continue; }` 就是过期条目跳过。没有它算法仍然正确，只是堆里塞满过时的条目。",
  "生成器里生成树的那一半保证每个节点都可达，所以对 i64::MAX 的过滤实际上从不删掉任何东西 —— 还是留着它，因为带不可达节点的版本就是这道题的追问。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.hacker.30.range-queries"
title = "不停变化的总数"
story = "整个连锁店一天四百万次收银操作，一半是更正，而有人想要累计总数。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后运行 `q` 个操作，全部来自同一个生成器，在回绕的 `u64` 里：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

打印所有查询答案的累计总和，然后打印 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里的复杂度是强制的，而且费了些功夫。**朴素的答案 —— 每个查询遍历一遍区间 —— 每个查询是 `O(n)`，而在这台机器上它*还*被编译器向量化成了快得惊人的东西。小用例抓不住它。所以大的隐藏用例是 `n = 500000, q = 4000000`，朴素答案要触碰大约 `10^11` 个元素，在五秒的运行限制内跑不完，而 Fenwick 树大约十分之一秒就把整件事做完。两者都用这条街里的两个程序实测。

这一课就是面试官在钓的那一条：*单点更新、区间求和*正是 Fenwick 树为之而生的形状。三个短函数 —— add、prefix，以及作为两个 prefix 之差的 range —— 而 `i & i.wrapping_neg()` 就是按最低置位位步进的方法。
'''
hints = [
  "对每个初始值调用一次 add 来建树。O(n) 的自底向上构建是个不错的优化，但不是钟在测的东西。",
  "i & i.wrapping_neg() 分离出最低的置位位。加上它是沿树向上走；减去它是向下走。",
  "range(l, r) 是 prefix(r + 1) - prefix(l)，把这一对差一错误弄对就是大部分的调试。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.hacker.31.palindrome"
title = "倒过来一样"
story = "前二十的题目，大多数笔试都会以某种形式问到，也是大多数人写过一次却从没弄懂的那一道。"
brief = '''
标准输入是 `n alphabet seed`。自己构建字符串：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

打印最长回文子串的长度，然后打印 `AT <index>` —— 该长度的回文中**最靠左**那个的 0 起始起点。

```
input:  12 3 5
output: 5
        AT 1
```

围绕每个中心扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符是奇数长度回文的中心，每两个字符之间的间隙是偶数长度回文的中心。忘掉间隙，就是一个看起来正确的解法在 `abba` 上返回 `1` 的原因。

**测试强制什么、不强制什么**，直说。干活的隐藏用例是**一**个字母的字母表上 `n = 20000`。这是中心扩展的最坏情况 —— 每个中心都跑到字符串末尾 —— 所以正确答案在那里跑满它的 `O(n²)`，仍然在 **0.08 s** 内跑完。它也是拒绝"枚举每个子串、逐个检验"的那个用例：那个方法对着五秒的限制**跑了四十秒还没停**。

另一个大用例，两个字母的字母表上 `n = 20000`，是**正确性**用例而不是速度用例。在随机的二元字符串上，回文检验一两个字符后就失败了，所以即使是立方的答案也能在 **0.64 s** 内过。它检查的是你的生成器和你的最左下标并列规则在大规模上和我们的一致。它不检查你快不快。三个数字都在这台机器上实测。

一个诚实的附注，因为这是面试官会追着问的那种事：单字母用例拒绝的是检验*每一个*子串。加上一行，跳过任何不比目前最佳更长的子串，同样的立方循环就能过两个大用例 —— 在这个输入上那一处剪枝把它压成了 `O(n²)`。所以测试拒绝的是朴素的立方，而不是每一个最坏情况下是立方的程序。

于是：测试拒绝立方，接受平方。它们**不**要求 Manacher 算法，也就是 `O(n)` 的答案。要知道它存在、它做什么，因为"还能比平方更好吗？"就是这道题通常被拿来铺垫的追问。
'''
hints = [
  "每个中心两次调用：(c, c) 对应奇数长度，(c, c + 1) 对应偶数长度。起始代码缺的是第二个。",
  "循环停下时，i 和 j 都已经越过回文一位 —— 所以它从 i + 1 开始，长度是 j - i - 1。",
  "只在严格更长的回文上更新，每种长度里最靠左的那个才是你保留的，这正是 AT 在问的。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.hacker.32.modular"
title = "模十亿零七"
story = "这句话出现在题目最下面，而房间里一半的人不知道它在让自己做什么。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询，在回绕的 `u64` 里：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询计算二项式系数 `C(a, b)` **模 1000000007**。打印全部 `q` 个答案之和，它本身也模 `1000000007`，然后打印 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这种规模下 `C(a, b)` 有几十万位数字，所以它从来不是先算出来再取模 —— 每次乘法都随手取模。问题在于除法：`a! / (b! (a-b)!)` 在模算术里没有意义。取代它的是**模逆元**，而因为 `1000000007` 是素数，费马小定理把它送到你手上：`inverse(v) = v^(p-2) mod p`，用快速幂大约三十次平方就算出来。

于是：预先算一次 `factorial[0..=n]`，每个查询回答 `f[a] * inv(f[b]) * inv(f[a-b])`。

**这里的复杂度是强制的。**有一个隐藏用例是 `n = 200000`、`q = 200000`。独立计算每个系数 —— 乘 `b` 项，除 `b` 项，每项一次模逆元 —— 在五秒的运行限制内跑不完；起始代码就是这样。一张共享的阶乘表大约五十毫秒跑完。两者都在这台机器上实测。

每个中间结果都是两个小于 `2^30` 的值的乘积，所以它放得进 `i64`，什么都不会溢出。在一门 `int` 是 32 位的语言里就放不下，而这是这道题被问的另一半原因。
'''
hints = [
  "每次乘法之后就取模，永远不要留到最后。i64 装得下两个小于 P 的值的乘积；它装不下一个阶乘。",
  "inverse(v) 是 power(v, P - 2)，而它之所以成立只因为 P 是素数 —— 这就是费马小定理在这里的全部内容。",
  "从 inverse(factorial[n]) 倒着把逆阶乘也预先算出来，能省掉每个查询的两次 power() 调用。过题不需要它，但值得说出来。",
]

