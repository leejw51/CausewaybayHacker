[[quest]]
id    = "rust.hacker.33.grid-paths"
title = "穿过街区，绝不回头"
story = "外卖网格里有三条街因为搭竹棚封了。有多少种走法过去，哪条最便宜。"
brief = '''
标准输入是 `r c pct seed`。自己按行优先顺序构建网格，每个格子抽**两个**值：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，只经过通路格。打印：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同的路线，模 `1000000007`
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都算，没有路线则为 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序一趟就能做完两件事：一个格子的路线数是从上方和从左方进入它的路线数之和，它的最佳代价是自己的代价加上两者中较便宜的那个。因为你只会向右或向下走，你需要的两个格子永远已经算完了 —— 这就是为什么这里不需要递归、不需要已访问集合。

`PATHS` 计数模 `1000000007`，理由是通常的那个：在 `1000 × 1000` 的隐藏用例上真实的数字超过六百位。边加边取模。

**大用例强制的是：**它拒绝任何枚举路线的答案。路线比房间里的原子还多。它不区分自底向上的表和带记忆化的递归 —— 两者都与格子数成线性，两者都轻松通过。
'''
hints = [
  "每个格子都抽两个值，包括两个角 —— 生成器不跳过它们，只是拒绝封住它们。",
  "一个上方和左方都没有通路邻居的通路格，可达路线为零，也没有最佳代价；让 i64::MAX 表示 `unreachable`，并在加法前挡住。",
  "终点可以是通路却仍然不可达，这恰好就是 PATHS 为 0、MIN 为 -1 的时候。隐藏用例里有一个就是这样。",
]

