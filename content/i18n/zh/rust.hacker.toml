顺着样例走一遍：`GET 1` 让 `1` 重新变成最近使用的，所以 `PUT 3` 需要腾位置时走的是 `2`。`GET 2` 未命中。`GET 3` 命中，让 `3` 成为最近使用的，这就是幸存者打印为 `3 1` 的原因。

