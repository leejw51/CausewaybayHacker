[[quest]]
id    = "rust.hacker.34.stable-sort"
title = "并列的保持原位"
story = "两个骑手得了同样的分数，而排行榜每次重绘都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个骑手，骑手 `i` 的下标是 `i`，分数是：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

把骑手按分数**降序**排序。分数相同的骑手必须保持到达的顺序。打印他们的下标，用空格分隔，然后打印 `TIES <k>` —— 在你排好的顺序里有多少对相邻的骑手分数相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎全是并列，而答案几乎完全由并列的处理方式决定。

**这是一条关于知道自己手里拿的是哪种排序的街。**`sort_by_key` 是**稳定**的 —— 相等的元素保持相对顺序。`sort_unstable_by_key` 不是，而且在真实输入上它明显不会保持：它是 pattern-defeating quicksort，通常更快，对并列不做任何承诺。起始代码用的就是它，而隐藏用例大到足以让它明显把顺序打乱。（在 `n = 8` 时它碰巧没有 —— 这就是为什么一个小测试什么都证明不了，也是为什么这里的小用例是*可见*的那个，而不是判你的那个。）

正确答案有两个，你应该两个都能给出。用稳定排序。**或者**用不稳定的那个，并把比较做成**全序** —— 按 `(Reverse(score), index)` 排序，这样任何两个元素都不会比较相等，稳定性就不再是个问题。默认该伸手去拿的是第二个；当顺序被完全指定时，不稳定排序没有什么需要证明的。
'''
hints = [
  "一个词：sort_unstable_by_key 改成 sort_by_key。这是稳定排序的答案。",
  "另一个答案保留不稳定排序，改为按 (Reverse(score), index) 排 —— 全序，所以不再剩下任何可以不稳定的并列。",
  "TIES 数的是最终顺序里相邻的相等分数，两种写法里这个数都一样 —— 暴露你的是下标的顺序。",
]

