# TYPESCRIPT LAND — CHEATSHEET ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/typescript/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "typescript.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet_advanced.01.generic-bound"
title = "凡是有 ID 的"
story = "19:10，三十楼的控制室。岛上每块屏幕都有一个 id；查找表应该接收任何一份它们的清单，而且不许改动它。"
brief = '''
`xs` 是一个 `readonly Screen[]`（也就是 `ReadonlyArray<Screen>`），而 `Screen`
有 `id: string`。写出泛型函数 `byId` 的开头，它的函数体是

```ts
return new Map(xs.map(x => [x.id, x] as const));
```

它必须接受 `xs` —— 以及任何其他元素带有字符串 `id` 的只读数组 —— 并让那个
函数体能编译。`strict` 已开启。
'''
hints = [
  "光秃秃的 `T` 没有 `id`；给参数一个约束。而且只读数组在要求可变数组的地方过不去。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet_advanced.02.mapped-draft"
title = "每个键，也许"
story = "希慎广场一份屏幕配置的草稿可以只填一半，而且还能继续编辑。它的形状跟着正式的那份走，一个键对一个键。"
brief = '''
手写 `Draft<T>` —— 不用做这件事的内置工具类型：和 `T` 一样的键，每个都是可选的，
各自保留自己的类型，而且仍然可写。对于 `type Screen = { id: string; w: number }`，
`const d: Draft<Screen> = { w: 3 };` 和 `d.w = 5;` 都能编译。
'''
hints = [
  "映射类型遍历 `keyof T`；方括号后面的 `?` 让每个键可选（也就是手写的 `Partial<T>`），`-?` 让它必填（`Required<T>`），而前面的 `readonly` 把它冻结（`Readonly<T>`）。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.cheatsheet_advanced.03.as-const-union"
title = "三个词，不用 ENUM"
story = "怡和街的到站板显示三种面板，没有人想要第四个文件来保存这份清单。"
brief = '''
```ts
const KINDS = ["ad", "news", "tram"] as const;
```

从 `KINDS` 推导出 `Kind`，使它恰好是那三个字符串的联合 —— `const k: Kind = "ad";`
能编译而 `const b: Kind = "bus";` 不能。字面量的联合，不是 enum。
'''
hints = [
  "值不是类型：先要那个值*的*类型，再用 `number` 给元组取下标，得到它的元素可以是什么。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.cheatsheet_advanced.04.pick-card"
title = "只要正面"
story = "利园的 app 每块屏幕显示一张卡片：id 和标题。feed 字段留在控制室里。"
brief = '''
`Screen` 有 `id`、`title`、`feed` 和 `w`。把 `Card` 声明为**只有** `id` 和 `title`
的对象类型，用一个工具类型从 `Screen` 构建，这样它跟随 `Screen`，在 `Screen`
变化时一起变。
'''
hints = [
  "一个工具保留指定的键，它的孪生兄弟则去掉它们。两者都把键作为一个联合接收，而不是分开的参数。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet_advanced.05.awaited-return"
title = "LOAD 交回来的东西"
story = "三十楼的 feed 加载器每个 sprint 都换形状。给它的结果命名的类型应该跟着变，而不是再敲一遍。"
brief = '''
```ts
async function load() { return { items: [1, 2], at: Date.now() }; }
```

把 `Feed` 声明为 `load` 所 resolve 到的、**解包后**的对象类型 ——
`{ items: number[]; at: number }` —— 从 `load` 本身推导出来，使
`const f: Feed = { items: [1], at: 0 };` 能编译。
'''
hints = [
  "`load` 是一个值，所以你得先要它的类型。出来的是一个 `Promise`；再用一个工具把 promise 剥掉。",
]

