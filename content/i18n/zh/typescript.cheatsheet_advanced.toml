[[quest]]
id    = "typescript.cheatsheet_advanced.06.infer-elem"
title = "箱子里是什么"
story = "给时代广场屏幕的一箱面板：标签应该说明一块面板是什么，而如果它根本不是箱子就什么也别说。"
brief = '''
写出 `Elem<T>`：对数组类型，是它的元素类型（`Elem<string[]>` 是 `string`）；
对任何**不是**数组的东西，是 `never`。
'''
hints = [
  "条件类型可以给它匹配到的那一部分起名，但前面得有一个关键字 —— 而数组后缀需要括号。",
]

