[[quest]]
id    = "typescript.cheatsheet_advanced.07.template-id"
title = "SCREEN 横杠数字"
story = "岛上每块板子都叫 screen-某某，而某某是一个数字。编译器守得住这条线。"
brief = '''
声明 `ScreenId`，使 `"screen-12"` 可以赋给它，而 `"screen-x"` 和 `"led-12"`
都不行。
'''
hints = [
  "类型可以是模板字面量：反引号，里面的占位符类型是一个原始类型。普通引号只是一个普通的字符串字面量。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.cheatsheet_advanced.08.satisfies-palette"
title = "检查过，但没放宽"
story = "LED 墙的调色板要对照合同检查 —— 但红色仍然是一个三元组，因为着色器要给它取下标。"
brief = '''
`type Palette = Record<string, [number, number, number] | string>`。
声明 `p`，带 `r: [255, 0, 0]` 和 `s: "#8cf"`，对照 `Palette` 检查 —— 形状错误的值，
比如 `r: [255, 0]`，是编译错误 —— 然而之后 `p.r.map(x => x / 255)` 和
`p.s.toUpperCase()` 必须能编译：`p` 保留字面量自己更窄的类型。
TypeScript 5。
'''
hints = [
  "类型标注或类型断言会把字面量的类型换成 `Palette`，于是每个值都变成 `tuple | string`。有一个运算符（4.9+）只做检查。",
]

