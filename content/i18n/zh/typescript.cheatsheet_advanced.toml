[[quest]]
id    = "typescript.cheatsheet_advanced.09.labeled-rest-tuple"
title = "一个命令和它的数字"
story = "控制室的控制台接收一个动词，再接收这个动词需要的任意多个数字。`show 1 2 3`、`clear`，绝不是 `1 2`。"
brief = '''
写出 `run` 的开头：一个只接收**一个** rest 参数 `args` 的函数，类型为带标签的元组：
先是一个 `cmd: string`，然后是任意数量的 `nums: number`。
`run("show", 1, 2, 3)` 和 `run("clear")` 能编译；`run(1, 2)` 不能。
'''
hints = [
  "标签写在元组里面，而不定长的尾部本身就是一个 rest 元素 —— 三个点加一个数组类型。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.cheatsheet_advanced.10.declaration-merging"
title = "再加一个字段，同一个名字"
story = "供应商的屏幕类型没有亮度，而供应商的文件是只读的。控制室今晚需要每块屏幕都有亮度。"
brief = '''
`interface Screen { id: string }` 声明在一个你不能编辑的文件里。
在你自己的文件里，给那同一个 `Screen` 再加一个字段 `brightness: number`，
使 `{ id: "a", brightness: 3 }` 在任何地方都是一个 `Screen` —— 不是一个新名字
（`interface Big extends Screen { … }` 或 `type Big = Screen & { … }` 都会造一个），
而且没有重复标识符的错误。
'''
hints = [
  "同一个 interface 的两个声明会合并。`type` 别名不会合并，而 interface 不能 extends 它自己。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet_advanced.11.hash-private"
title = "运行时也藏起来"
story = "电车站计数器的计数与任何人无关：子类无关，序列化器无关，`Object.keys` 也无关。"
brief = '''
```ts
abstract class Panel { abstract draw(): string; }
interface Tally { bump(): void }

class Counter extends Panel implements Tally {
  // the field goes here
  protected label = "c";
  get value(): number { /* returns the field */ }
  set value(v: number) { /* stores v in the field */ }
  bump() { /* adds one to the field */ }
  draw() { return `${this.label}=${this.value}`; }
}
```

添加 `count` 字段，从 `0` 开始，在**运行时**和编译时都隐藏：`new Counter()` 之后，
`Object.keys(c)` 和 `JSON.stringify(c)` 都不能显示它。`strict` 已开启。
'''
hints = [
  "`private` 关键字会随类型一起被擦除；字段在 JavaScript 里仍然在那里。`#` 名字在引擎本身里就是私有的 —— 它不接受访问修饰符，而且需要初始化式。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet_advanced.12.overload-impl"
title = "重载下面那一行"
story = "到站板上的 `parse` 两个方向都通：传入字符串得到数字，传入数字得到字符串。两个承诺，一个函数体。"
brief = '''
```ts
function parse(x: string): number;
function parse(x: number): string;
```

写出跟在这两个重载之后的实现行，函数体是
`return typeof x === "string" ? Number(x) : String(x);` —— 使 `parse("42")`
是 `number` 而 `parse(7)` 是 `string`，在 `strict` 之下。
'''
hints = [
  "实现签名必须宽到能覆盖每一个重载，它必须有函数体，而在 `strict` 之下它的参数不能不写类型。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet_advanced.13.nullish-assign"
title = "空的也算缓存"
story = "希慎墙的字幕缓存：有些屏幕的字幕是故意为空的，而每一帧都重新加载它们正是上周二冻住整面墙的原因。"
brief = '''
`cache: Record<string, string>`；`load(k)` 很昂贵。只在这个键**从未**被设置过时
用 `load(k)` 填充 `cache[k]` —— 缓存里的 `""` 是一个真实、有效的值，不能触发
重新加载。一条语句。
'''
hints = [
  "`\"\"` 是假值。任何问“它是真值吗？”的东西都会重新加载它；问“它是 null 或 undefined 吗？”的那个赋值运算符则不会。",
]

