在 Rust 里，列表是 `Vec`。`push` 就地增长它，`remove(0)` 取走最前面的，`nums[nums.len() - 1]` 是最后一个（或者 `*nums.last().unwrap()`），而 `&nums[1..3]` 是从它借来的切片——一个 `&[i64]`，不是拷贝。

```
nums.push(100);
nums.remove(0);
let last = nums[nums.len() - 1];
let mid = &nums[1..3];
```

把上面这几行敲在 `// FILL` 注释所在的位置。

```
input:  5 6 7 8
output: 100
        7 8
        4
```
'''
hints = [
  "nums.push(100); nums.remove(0); let last = nums[nums.len() - 1]; let mid = &nums[1..3];",
  "Rust 里的 append 接收另一个 Vec 并把它的元素挪过来；单个值用 push。",
  "&nums[1..3] 是借用；没有 & 就是 E0277，因为切片没有可以移动的大小。",
]

