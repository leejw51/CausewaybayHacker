brief = '''
解析可能失败，每种语言交回失败的方式各不相同：作为第二个返回值，作为 `Result`，或者作为异常。程序读入若干记号，把能解析成整数的加起来，对每个不能解析的打印 `bad: <token>`，最后打印总和。

在 Go 里，`strconv.ParseInt` 返回值*和*一个 `error`，而这个检查就是整个语言的惯用法：`if err != nil { ... continue }`。什么都不抛出；错误是一个你在调用之后马上去看的值。

```
v, err := strconv.ParseInt(t, 10, 64)
if err != nil {
fmt.Println("bad:", t)
continue
```

把上面这几行敲在 `// FILL` 注释所在的位置。

```
input:  12 x 30 4y 8
output: bad: x
        bad: 4y
        50
```
'''
hints = [
  "v, err := strconv.ParseInt(t, 10, 64) 然后 if err != nil { fmt.Println(\"bad:\", t); continue }。",
  "10 是进制，64 是位宽；v 是一个 int64。",
  "err == nil 是成功的情况；跳过的分支是另一个。",
]

