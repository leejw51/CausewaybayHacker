        3.50
```
'''
hints = [
  "整数部分用 q = a // b 然后 r = a % b；f = a / b 本来就是浮点数。",
  "float(a) / b 也行，写惯 Go 或 Rust 的手会这么敲；在 Python 里没必要。",
  "留意符号：在 Python 里 -7 // 2 是 -4（向下取整），而 Go 和 Rust 给出 -3（向零取整）。运算符名字一样，取整方式不同——这里的测试都是正数。",
