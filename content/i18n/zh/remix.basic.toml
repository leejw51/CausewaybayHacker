title = "结构体 — PYTHON"
story = "账单上的每一行是一个名字、一个价钱和一个数量，而知道怎么算一行合计的，正是这一行自己。那条蟒蛇用 Python 点单。"
brief = '''
结构体把几个有名字的字段组成一个值，方法是挂在这个类型上的函数，手里拿着这个值作为 `self` / 接收者。程序读入 `name price qty` 的若干行，每行打印名字和这一行的合计，最后打印总计。

在 Python 里，类持有在 `__init__` 里设置的字段和写在它下面的方法；每个方法都显式地把 `self` 作为第一个参数，`self.price * self.qty` 通过它读取字段。

```
def total(self):
return self.price * self.qty
```

把上面这几行敲在 `# FILL` 注释所在的位置。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "def total(self): 下面写 return self.price * self.qty —— self 要写出来，从不隐含。",
  "没有 self 的 def total(): 在调用时是 TypeError：it.total() 会把这个 item 作为第一个参数传进去。",
  "Item(f[0], int(f[1]), int(f[2])) 调用 __init__；字段就是 __init__ 赋给 self 的那些。",
]

