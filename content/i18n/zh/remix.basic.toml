Go 没有 enum 关键字：一个具名整数类型加上带 `iota` 的 `const` 块就构成一个——`Red`、`Green`、`Yellow` 分别是 0、1、2。分支是一个 `switch`，每个值一个 `case`；不会贯穿，`default` 接住其余的。

