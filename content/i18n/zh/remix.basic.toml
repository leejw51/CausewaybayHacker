        tea 2
        milk 1
        tea 3
        3
```
'''
hints = [
  "*counts.entry(w.to_string()).or_insert(0) += 1; 然后 println!(\"{} {}\", w, counts[w]);",
  "counts[w] += 1 是 E0594：HashMap 可以用索引来读，永远不能用索引来写。",
  "* 解引用 or_insert 交回的 &mut i64；没有它，就没有东西可以加。",
]

