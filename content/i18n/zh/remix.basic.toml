joined = " | ".join(names).upper()
chars = len(line)
```

把上面这几行敲在 `# FILL` 注释所在的位置。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "names = line.split(\",\") 然后 \" | \".join(names).upper()；字符数是 len(line)。",
  "len(line.encode()) 是字节数：Zoë 有四个字节、三个字符，隐藏用例知道这一点。",
  "join 是分隔符的方法，不是列表的：\" | \".join(names)，绝不是 names.join(\" | \")。",
]

