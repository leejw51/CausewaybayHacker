[[quest]]
id    = "remix.basic.22.list-go"
title = "列表 — GO"
story = "柜台前的队伍：后面又排上一个，前面的已经招呼好，经理想看看谁排第二、第三。Gogo 用 Go 点单。"
brief = '''
一个能增长的序列：在末尾追加，从前面取走，索引最后一个，再切出一段子范围。程序把数读进一个列表，追加 100，删掉第一个，然后打印最后一个元素、位置 1 和 2 上的元素，以及长度。

在 Go 里，列表就是切片。`append` 返回增长后的切片，必须赋值回去；`nums[1:]` 通过重新切片去掉最前面的；`nums[len(nums)-1]` 是最后一个——没有负数索引——而 `nums[1:3]` 是和原数组共享的子切片。

```
nums = append(nums, 100)
nums = nums[1:]
last := nums[len(nums)-1]
mid := nums[1:3]
```

把上面这几行敲在 `// FILL` 注释所在的位置。

```
input:  5 6 7 8
output: 100
        7 8
        4
```
'''
hints = [
  "nums = append(nums, 100); nums = nums[1:]; last := nums[len(nums)-1]; mid := nums[1:3]。",
  "单独一个 append(nums, 100) 编译不过：结果没被使用，而它返回的切片才是增长后的那个。",
  "nums[1:3] 是位置 1 和 2 ——终点不包含在内，在这片地方处处如此。",
]

