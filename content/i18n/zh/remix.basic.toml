id    = "remix.basic.20.errors-rust"
title = "错误 — RUST"
story = "单子上有些数其实不是数。收银机把是数的加起来，把不是的喊出来，而且不会倒下。Ferris 用 Rust 点单。"
brief = '''
解析可能失败，每种语言交回失败的方式各不相同：作为第二个返回值，作为 `Result`，或者作为异常。程序读入若干记号，把能解析成整数的加起来，对每个不能解析的打印 `bad: <token>`，最后打印总和。

在 Rust 里，`t.parse::<i64>()` 返回一个 `Result`，`let Ok(v) = ... else { ... };` 要么取出值，要么运行 `else` ——而它必须离开（`continue`、`return`、`break`）。带 `Ok` 和 `Err` 两条分支的 `match` 是同一件事的长写法。

```
let Ok(v) = t.parse::<i64>() else {
println!("bad: {}", t);
continue;
};
```

把上面这几行敲在 `// FILL` 注释所在的位置。

```
input:  12 x 30 4y 8
output: bad: x
        bad: 4y
        50
```
'''
hints = [
  "let Ok(v) = t.parse::<i64>() else { println!(\"bad: {}\", t); continue; }; ——注意 else 块后面的分号。",
  "let-else 的 else 必须发散：continue、break 或 return。直接往下走就是 E0308。",
  "parse::<i64> 是 turbofish：因为 v 没有注解，由它告诉 parse 要造出什么。",
]

