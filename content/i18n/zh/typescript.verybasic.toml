# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.verybasic.24.lambdas"
title = "双数楼层"
story = "停车场双数楼层的屏幕按楼层号的平方交租，地库也算在内，单数楼层不交钱；账本要一个总数。"
brief = '''
`xs` 装着这一行的整数。`total` 必须是其中**双数**值的平方和，用 `filter`、`map`、`reduce` 和三个箭头函数构建。`reduce` 需要一个初始值，否则空数组就没有东西可以起头。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "const total = xs.filter((x) => x % 2 === 0).map((x) => x * x).reduce((a, b) => a + b, 0);",
