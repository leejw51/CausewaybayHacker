[[quest]]
id    = "typescript.verybasic.20.sorting"
title = "车费阶梯"
story = "怡和街牌子上的车费按线路加入的顺序排，而牌子把它们当文本排序：10 在 9 前面。"
brief = '''
`xs` 装着这一行的整数。程序必须在打印之前把 `xs` 原地升序排好。数组的 `sort` 接收一个比较函数：返回负数就让第一个参数排在前面。没有比较函数时，`sort` 把数当成字符串比较。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "xs.sort((a, b) => a - b); —— a 减 b 是升序。",
  "不带比较函数的 xs.sort() 把 10 排在 9 前面，因为 \"1\" 在 \"9\" 前面。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.verybasic.21.sort-by-key"
title = "排行榜"
story = "时代广场屏幕上的点击游戏排行榜应该按分数从高到低排，同分按名字排，它显示的却是加入的先后。"
brief = '''
`rows` 是一个 `[string, number][]`：带类型的元组组成的数组，先是名字，再是分数。它必须按分数降序排，再按名字升序排。比较函数是一个箭头函数；`||` 只在第一个比较得出 0 时才落到第二个比较，而 `byName` 比较两个字符串。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "rows.sort((a, b) => b[1] - a[1] || byName(a[0], b[0])); —— 分数降序，所以 b 在 a 前面。",
  "元组的第 1 个元素是数，第 0 个是字符串；tsc 分得清哪个是哪个，byName(a[1], b[1]) 编译不过。",
]

