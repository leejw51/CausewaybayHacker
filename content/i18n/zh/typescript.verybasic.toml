# TYPESCRIPT LAND — VERY BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/typescript/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "typescript.verybasic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.verybasic.01.print"
title = "第一块屏幕"
story = "19:00，时代广场上空。大屏幕亮起，一片漆黑，今晚的第一行得靠手敲进去。"
brief = '''
程序必须在一行里精确打印 `hello, causewaybay`。全局 `console` 上有一个方法，把一行写到标准输出。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
output: hello, causewaybay
```
'''
hints = [
  "console.log(\"hello, causewaybay\"); —— 要括号，逗号在字符串里面。",
  "这里没有 print()；对一个从没见过的名字，tsc 在任何东西运行之前就用 TS2304 回答你。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.verybasic.02.int-types"
title = "分开的播放列表"
story = "希慎广场的 LED 墙把今晚的片段分到各块面板上；排程器该说出每块面板分到几段、还剩几段，它却一声不吭。"
brief = '''
`a` 和 `b` 是整数。程序必须在一行里打印整数商和余数，中间隔一个空格。TypeScript 只有一种 `number` 类型，没有整数除法运算符：`/` 总是给出小数，`Math.trunc` 把小数部分去掉，`%` 是余数。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); —— console.log 会在参数之间加一个空格。",
  "a / b 是 3.5，不是 3：每个数都是 double。而且 // 在这里不是运算符，它开始一条注释。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.verybasic.03.floats"
title = "等候时间"
story = "怡和街的电车牌把等候时间显示到小数点后两位，今晚它显示 3.5，最后一位的地方空着。"
brief = '''
`x` 和 `y` 是数。程序必须打印 `x / y`，小数点后恰好两位。数有一个方法，按固定的小数位数格式化它，并返回一个字符串。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "console.log((x / y).toFixed(2)); —— 括号让除法先算。",
  "Math.round(x / y * 100) / 100 仍然是数，而数打印出来是 3.5，不是 3.50。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.verybasic.04.strings"
title = "横幅"
story = "利园 app 的横幅从市场部发来时是小写，品牌指引要大写；横幅照原样挂上去。"
brief = '''
`s` 是一行文本。在它的长度之后，程序必须打印大写的 `s`。有一个字符串方法返回一个每个字母都大写的副本。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "console.log(s.toUpperCase()); —— 驼峰写法，带括号调用。",
  "s.upper() 是 Python；字符串类型没有这个方法，tsc 会直说。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.verybasic.05.bool-if"
title = "东还是西"
story = "怡和街的到站牌在双数站朝东，单数站朝西；梯子上的安装工知道站号，要知道朝哪边。"
brief = '''
`n` 是正整数。当 `n` 能被二整除时程序打印 `even`，否则打印 `odd`。条件是一个 `if`，用严格相等运算符拿余数和零比较，那个运算符有三个字符长。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: even
```
'''
hints = [
  "if (n % 2 === 0) { —— 三个等号是比较；一个是赋值。",
  "n % 2 是数，tsc 拒绝拿数和字符串 \"0\" 比较：两个类型没有交集。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.verybasic.06.loops"
title = "计数"
story = "三十楼的控制室顺着机架把屏幕一加二加三地加起来，控制台上的总数却是零。"
brief = '''
`n` 是正整数。循环必须走过从 1 到 `n`（含）的每个整数，把每个都加进 `total`。`for` 头部有一个起点、一个每轮之前检查的条件，和一个步进。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: 10
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { —— 小于等于，所以 n 本身也会走到。",
  "for...in 走的是对象的键；数没有键，tsc 也不让它试。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.verybasic.07.functions"
title = "广告时段费率"
story = "时代广场的屏幕对今晚头十个广告时段每个收五块，之后每个收三块；计费函数承诺返回一个数，tsc 却编不过它。"
brief = '''
`fare(rides)` 必须返回收费：头十次每次 5，第十次之后每次 3。签名写着 `: number`，所以什么都不交回的函数体编译不过。函数用一个关键字把值交回去。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3
output: 15
```
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "一个类型为 `: number` 的函数如果只打印不返回，就编译不过：tsc 说它必须返回一个值。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.verybasic.08.structs"
title = "一张卡，两个字段"
story = "利园 app 里每张商品卡都有名字和价格；构造函数从来不设置价格，构建就停在承诺了价格的那一行。"
brief = '''
`Stall` 的构造函数接收 `name` 和 `price`。类声明了 `price: number`，而在 `strict` 下每个声明的字段都必须在构造函数里赋值。它必须像存 `name` 那样把 `price` 存到对象上，这样 `s.price` 才读得回来。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "this.price = price; —— this 是对象；光秃秃的名字是参数。",
  "this.price = name; 编译不过：name 是字符串，而字段是数。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.verybasic.09.struct-method"
title = "购物篮的一行"
story = "单价乘数量是利园 app 每个购物篮里的一行，本该说出它的方法承诺返回一个数，却什么都没返回。"
brief = '''
`Stall.total()` 必须返回价格乘以数量。构造函数的 `public` 参数一步就声明并存好了字段；在方法里面，对象的字段要通过 `this` 访问。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return this.price * this.qty; —— 两个字段都要经过 this。",
  "方法里光秃秃的 price 不是那个字段；它是类外面从输入读来的 price，是字符串，tsc 不会让你拿字符串去乘。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.verybasic.10.enums"
title = "线路的颜色"
story = "希慎那面墙上、铜锣湾出口上方的港铁面板写着三条线；数据源送来的是一个词，面板要的是它代表的那个枚举成员。"
brief = '''
`word` 是 `island`、`tsuenwan`、`kwuntong` 之一。程序必须把它变成对应的 `Line` 成员。枚举可以用成员名来索引，但只能用 tsc 知道是它的名字之一的键：`keyof typeof Line` 就是那组名字，而 `as` 告诉 tsc 这个字符串就是其中之一。这个断言在运行时被擦除 —— 它什么都不检查，所以字符串最好对得上。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line = Line[word.toUpperCase() as keyof typeof Line]; —— 名字是大写的。",
  "Line[word as keyof typeof Line] 编译得过，因为 `as` 是 tsc 照单全收的承诺；在运行时 Line[\"tsuenwan\"] 是 undefined。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.verybasic.11.vector"
title = "播放列表"
story = "控制室收到的每一段片子都按到达的顺序排进今晚的播放列表，列表却一直是空的。"
brief = '''
`xs` 是一个一开始为空的 `number[]`。循环里读到的每个整数 `x` 都必须加到末尾，保持输入的顺序。数组有一个方法专门做这个。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs.push(x); —— 一个值，放在末尾。",
  "unshift(x) 把它放在最前面，顺序就反了。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.verybasic.12.vector-edit"
title = "撤下的片子"
story = "希慎广场播放列表上的第一段片子在播出前被撤了；它得拿掉，后面的每一段都往前挪一位。"
brief = '''
`xs` 装着这一行的整数。程序必须删掉下标 0 的元素，让其余的往前移。有一个数组方法按起始下标和个数来删除。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "xs.splice(0, 1); —— 从下标 0 开始，一个元素。",
  "delete xs[0] 在元素原来的地方留下一个洞；长度不变。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.verybasic.13.list"
title = "跑马灯的最前面"
story = "突发新闻要放在时代广场屏幕下方跑马灯的最前面，最新的一条却总落在最后面。"
brief = '''
`chain` 是一个 `number[]`；TypeScript 没有双端队列，而数组两头都能做。循环里读到的每个 `x` 都必须加到**最前面**，这样最后读到的那个排在第一。数组有一个方法管这一头。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "chain.unshift(x); —— push 在前端的孪生兄弟。",
  "push(x) 放在后面。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.verybasic.14.maps"
title = "点击计数"
story = "利园 app 按商品统计点击，每个商品一行；任何东西的第一次点击都找不到可以加的那一行。"
brief = '''
`counts` 是一个 `Map<string, number>`。对每个词 `w`，程序必须把它的计数加一，第一次从零开始。`get` 的类型是 `number | undefined`，因为键可能不存在，而 `??` 提供键不存在时要用的值。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts.set(w, (counts.get(w) ?? 0) + 1); —— 默认值放在括号里，然后再加。",
  "counts.get(w)! + 1 编译得过 —— ! 告诉 tsc 值一定在 —— 而在运行时 undefined + 1 是 NaN。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.verybasic.15.hashtable"
title = "查表"
story = "控制室的表把站名映射到牌子编号，查一个不在表里的站应该回答 -1，而不是让怡和街的牌子变成空白。"
brief = '''
`table` 把名字映射到牌子编号，而牌子编号可以是 0。对词 `w`，程序必须打印它的编号，`w` 不在表里时打印 `-1`。缺失的键 `get` 返回 `undefined`；有一个运算符只替换 `null` 和 `undefined`，别的一概不管。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "console.log(table.get(w) ?? -1); —— ?? 只在 undefined 或 null 时才出手。",
  "|| 对每个假值都出手，而 0 是假值：编号为 0 的牌子会读成 -1。",
]

