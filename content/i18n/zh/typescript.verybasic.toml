]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.verybasic.19.heap"
title = "最急的先来"
story = "故障以任意顺序到达控制室，墙上每次都该显示下一个最急的；装着它们的那个列表却不知道是哪一个。"
brief = '''
TypeScript 的标准库没有堆，所以初始代码带了一个小小的 `MinHeap`：`push` 加入一个值并把它上浮，`pop` 取出最小的。每个 `x` 都必须经由堆自己的方法放进去，这样 `pop` 之后才会先返回最小的。直接往 `items` 里写就跳过了上浮，顺序就乱了。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(x); —— 堆的方法，它把 x 上浮到它该在的位置。",
  "heap.items.push(x) 把 x 放在数组末尾，跳过了上浮。",
]

