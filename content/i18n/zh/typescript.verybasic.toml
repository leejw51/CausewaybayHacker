]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.verybasic.25.threads"
title = "所有面板一起来"
story = "希慎广场墙上的每块面板各自渲染自己的一帧，而墙在任何一块完成之前就亮了。"
brief = '''
这里没有线程：只有一个事件循环，`square` 在睡眠时把它让出去。每个调用都已经开始，它的 promise 就在 `tasks` 里。在打印结果之前，`main` 必须**等**它们全部完成。`Promise` 有一个函数把 promise 数组变成一个 promise，而 `await` 等它。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "await Promise.all(tasks); —— 一个代表全部的 promise，然后 await 它。",
  "不带 await 的 Promise.all(tasks) 建出了 promise 就径直走过去；tasks.join() 是数组方法，什么都没汇合。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.verybasic.26.mutex"
title = "一个计数器，四路数据"
story = "四路销售数据往控制室控制台上的同一个计数器里加；锁是有的，可谁都不等它就去读。"
brief = '''
只有一个线程，照样有竞争：每个 worker 读 `counter`，`await`，再写回去，其他 worker 就在这个空隙里运行。`lock` 是一个小小的异步锁。在读之前，每个 worker 都必须**拿到**锁，并一直等到真的拿到；释放已经写在写入之后了。`acquire` 返回一个 promise，锁归你时它就完成。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1000
output: 4000
```
'''
hints = [
  "await lock.acquire(); —— 然后是读和写，再是已经写好的释放。",
  "不带 await 的 lock.acquire() 要了锁，却在拿到之前就照样去读计数器。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.verybasic.27.binary-tree"
title = "ANY"
story = "23:59，三十楼控制室：数据源送来的类型是 `any`，每一项检查都通过，时代广场的屏幕用四十英尺高的字母显示 `undefined`。一个类型标注本可以拦住它。"
brief = '''
屏幕 id 放进一棵二叉搜索树，每个子节点都标注为 `TreeNode | null` —— 不是 `any` —— 所以 tsc 让空的情况成为一种必须处理的情况。`insert(n, v)` 返回装着 `v` 的那棵树的根；`null` 的情况和右边已经写好。对较小的 `v`，左子节点必须换成往它里面插入的结果，这样 `null` 子节点才会变成一个节点。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v); —— 递归返回子树的新根；把它存起来。",
  "调用 insert 却不存结果，那个 null 就留在原地，而 tsc 看不出来：类型全都对得上。",
]
