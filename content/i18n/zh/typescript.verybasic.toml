[[quest]]
id    = "typescript.verybasic.18.queue"
title = "快闪店的队伍"
story = "利园快闪店的队伍按排队先后叫号，app 却一直在叫最新的那张号。"
brief = '''
`q` 是按顺序装着号码的数组。程序必须把**第一个**取下来放进 `first`。数组用一个方法从前端移除。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

