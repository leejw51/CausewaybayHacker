[[quest]]
id    = "typescript.verybasic.16.sets"
title = "不同的广告商"
story = "时代广场轮播里有六个时段，三个不同的广告商；发票要的是有几个不同的，它却说六个。"
brief = '''
`xs` 装着这一行的整数。程序必须打印其中有多少个**不同**的值。`Set` 每样只留一个，它计数用的是一个属性，不是 `length`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "console.log(new Set(xs).size); —— new 建出集合，size 数它。",
