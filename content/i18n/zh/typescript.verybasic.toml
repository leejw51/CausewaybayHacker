# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.verybasic.23.closures"
title = "服务费"
story = "利园 app 里每个价格都要加上同样的服务费，本该记住这笔服务费的函数却把它忘了。"
brief = '''
`makeAdder(k)` 定义了一个内部函数 `add`，它返回 `x + k`。它的返回类型 `(x: number) => number` 说它必须交回一个函数 —— 就是那个内部函数本身，这样之后调用 `add(x)` 时 `k` 还记着。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add; —— 光秃秃的名字，不带括号。",
