]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.verybasic.17.stack"
title = "叠加层的栈"
story = "叠加层一层层叠在希慎广场的墙上，要从最上面揭下来；渲染器却一直在揭最底下那层。"
brief = '''
`stack` 是一个当作栈用的数组。程序必须把**栈顶**（最后一个）元素取下来放进 `top`。有一个数组方法删除并返回最后一项；它的类型是 `number | undefined`，因为栈可能是空的。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4
        1 2 3
```
'''
hints = [
  "const top = stack.pop(); —— 不带参数；取的永远是最后一个。",
  "stack[stack.length - 1] 读到了栈顶，却把它留在那一摞上。",
]

