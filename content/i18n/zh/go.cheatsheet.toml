# GO LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/go/cheatsheet.toml`, quest by quest, and
# nothing else. The four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "go.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet.01.flush"
title = "不刷新就没有"
story = "06:30，渣甸坊。自助机整夜都往缓冲区里输出，却没有人看见过一行。"
brief = '''
输出经过一个带缓冲的 writer。哪一行能保证 `main` 返回时，写进 `out` 的所有内容
真的出现在屏幕上？

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
hints = [
  "`bufio.Writer` 会一直攥着字节直到被刷新；而 `defer` 需要一个带括号的调用。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet.02.fields"
title = "松散的空格"
story = "茶餐厅的点菜单上写着 3   5，是匆忙的伙计敲出来的。"
brief = '''
`sc.Scan()` 刚读到一行 `"3   5"`（中间有好几个空格）。哪一行能把它变成两个
记号 `["3", "5"]`？
'''
hints = [
  "按单个空格切分，连续空格之间会留下空字符串。有个函数按任意一段空白切分。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.cheatsheet.03.zero-pad"
title = "五位数"
story = "希慎广场柜台的号码牌永远是五位数，前面补零。"
brief = '''
`n` 是 `42`。把它打印成 `00042`，然后换行。
'''
hints = [
  "宽度前面加一个 `0`，就用零而不是空格来补齐。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.cheatsheet.04.inclusive"
title = "一到十"
story = "电车站从 1 号排到 10 号，大家忘掉的总是最后一个。"
brief = '''
循环遍历 1, 2, … 10 —— 包括 10。
'''
hints = [
  "Go 只有一个循环关键字，子句外面不加括号。`range 10` 从 0 开始数。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.cheatsheet.05.float-div"
title = "半碗"
story = "七碗云吞面两个人分。收银机坚持说每人三碗。"
brief = '''
`n := 7` 和 `m := 2` 都是 `int`。让 `f` 成为 `float64` 值 `3.5`。
'''
hints = [
  "`int / int` 在任何转换之前就已经截断了。先把两边都转换。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.cheatsheet.06.append"
title = "永远重新赋值"
story = "崇光电梯门口的队伍多了一个人。夹板上的名单也得这么写。"
brief = '''
`s` 是一个 `[]int`。把 `x` 加到它的末尾。
'''
hints = [
  "`append` 只是返回切片 —— 可能连着一个新的底层数组 —— 它本身不会改变 `s`。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.cheatsheet.07.comma-ok"
title = "零也算存在"
story = "百德新街的小摊今天卖出零个蛋挞。这和没有这个摊位不是一回事。"
brief = '''
`m` 是 `map[string]int`。只有键 `k` 存在时才进入代码块 —— 存着的 `0` 也算存在。
'''
hints = [
  "不存在的键读出来是零值。向 map 要它的第二个返回值。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.cheatsheet.08.rune"
title = "两个字节，一个字母"
story = "利园山道的咖啡店招牌上有个重音符号，数字节的机器把第二个字母弄错了。"
brief = '''
`s := "héllo"`。让 `r` 成为第二个字符 `'é'`，类型是 `rune`。
'''
hints = [
  "对字符串取下标得到的是字节，而 `é` 在 UTF-8 里占两个字节。先转换成 rune。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.cheatsheet.09.rec-closure"
title = "先起名字"
story = "耀华街后面的小巷会折回原处。走路的人得知道自己的名字，才能继续走下去。"
brief = '''
在 `main` 里，一个调用自己的闭包 `dfs`。哪一个第一行能编译通过？

```
// ____
    vis[u] = true
    for _, v := range adj[u] { if !vis[v] { dfs(v) } }
}
```
'''
hints = [
  "变量在它自己的初始化表达式里还不在作用域内。先声明，再赋值。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.cheatsheet.10.ptr-receiver"
title = "移动真的那个"
story = "时代广场地图上的图钉应该往东挪一个街区。挪动地图的复印件什么也改变不了。"
brief = '''
`type P struct{ X, Y int }`。写出方法 `Shift`，使得 `p.Shift(1)` 之后，调用方的
`p.X` 真的增加了一。
'''
hints = [
  "值接收者操作的是副本。通过指针访问字段是自动的。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.cheatsheet.11.wrap"
title = "保留原因"
story = "铜锣湾邮局的投诉表上有一栏写备注，原信用订书钉钉在后面。"
brief = '''
在 `func parse(s string) (int, error)` 里。返回加了说明的错误，同时让调用方的
`errors.Is(err, strconv.ErrSyntax)` 仍然能匹配。

```
n, err := strconv.Atoi(s)
if err != nil {
    // ____
}
```
'''
hints = [
  "只有一个格式动词会把错误包装起来，让 `errors.Is` 能看穿它。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.cheatsheet.12.close-results"
title = "最后一个走的人"
story = "四个速递员在波斯富街的后房上夜班。总得有人在最后一个回来之后锁门 —— 不能更早。"
brief = '''
一个 worker 池。每个 worker 在 `jobs` 取空后调用 `wg.Done()`，`jobs` 由生产者
关闭。哪一行能让最后的 `range` 在所有 worker 结束后结束 —— 不死锁，也不 panic？

```
results := make(chan int) // unbuffered
for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
hints = [
  "等待要和读取同时进行，而不是在读取之前：worker 们卡在无缓冲的发送上，直到 `main` 去读。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.cheatsheet.13.concat"
title = "全新的底层数组"
story = "两条队伍在崇光路口合流，纠察想要一份全新的名单 —— 而不是在第一条队伍的夹板上涂改出来的。"
brief = '''
`a` 和 `b` 是 `[]int`。让 `c` 成为一个切片，内容是 `a` 的元素后面接 `b` 的，并且之后的
`c[0] = 9` 不会碰到 `a` —— 即使 `a` 有多余的容量。
'''
hints = [
  "`append` 在第一个参数还有空位时会复用它的底层数组。Go 1.22 加了一个总是新分配的函数。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.cheatsheet.14.sort-desc"
title = "最好的在上"
story = "蛋挞联赛的排名表今晚贴上大坑面包店的墙，最高分在最上面。"
brief = '''
`type P struct{ N string; S int }`，`ps` 是 `[]P`。原地排序 `ps`，让 `S` 最大的排在最前。
'''
hints = [
  "基于下标的比较器回答的是“`i` 应该排在 `j` 前面吗？”—— 要最大的在前，就让大的那个排前面。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.cheatsheet.15.nil-map"
title = "还没有页"
story = "渣甸街摊档的新账本还一页纸都没有；第一道记号直接划穿了封面。"
brief = '''
三行都在 `main` 里、同一个块中。空缺处放哪一行，自增才不会 panic？

```
var m map[string]int
// ____
m["a"]++
```
'''
hints = [
  "声明了却从未 make 的 map 是 nil：读得到零值，写会 panic。而且 `:=` 不能在同一个块里重新声明 `m`。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.cheatsheet.16.recv-ok"
title = "零也是包裹数"
story = "开平道的速递员用对讲机报包裹数，零个包裹也是一份真实的报告。只有卷闸落下才意味着一天结束。"
brief = '''
`ch` 是一个 `chan int`。发送方很可能把 `0` 当作真实的值发来，并在做完时关闭 `ch`。
接收到 `v` 里，并且只有在 `ch` 已关闭且取空之后，`ok` 才为 false。
'''
hints = [
  "接收表达式有一种双值形式，就像查 map 一样。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.cheatsheet.17.cancel-send"
title = "收工"
story = "勿地臣街的夜厨房把碟子沿着一条线往下传。经理一喊收工，厨师就放下碟子 —— 哪怕没有人来接。"
brief = '''
在一个流水线阶段里，
`func send(ctx context.Context, out chan<- int, v int) error`。
把 `v` 发到 `out` 上，但 `ctx` 一被取消就立刻放弃并返回 context 的错误 —— 即使没有人在读 `out`。
'''
hints = [
  "只有 `select` 能同时等两件事，而它的每个 case 都必须是一次发送或接收 —— `Done()` 给你一个通道。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.cheatsheet.18.unmarshal"
title = "填真正的表格"
story = "一份预订以 JSON 的形式到达利园酒店的前台。要填的是柜台上那张表格 —— 不是它的复印件。"
brief = '''
`s` 是存着 JSON 的 `string`，`var u User` 是一个普通的值。用 `s` 填充 `u`，错误保留在 `err` 里。
'''
hints = [
  "解码器接收的是字节，而且它必须能写进 `u` 本身，不是它的副本。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "go.cheatsheet.19.bfs-queue"
title = "最老的先走"
story = "雨水在时代广场地下的停车场里一个车位接一个车位地蔓延，从排水口向外扩散。"
brief = '''
网格 BFS。哪一行从队列取出下一个点，使搜索保持广度优先 —— 而且循环真的会结束？

```
q := []pt{{sr, sc}}
for len(q) > 0 {
    // ____
    for _, d := range dirs {
        nr, nc := cur.r+d.r, cur.c+d.c
        if !okCell(nr, nc) { continue }
        q = append(q, pt{nr, nc})
    }
}
```
'''
hints = [
  "广度优先意味着最老的条目先走。在循环体里，`:=` 会造出一个新的 `q`，外面那个永远不会变短。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "go.cheatsheet.20.itoa"
title = "请给数字"
story = "铜锣湾港铁站的售票机显示 65 号闸口。大厅对面的打印机却吐出一个字母。"
brief = '''
`n := 65` 是 `int`。让 `s` 成为字符串 `65` —— 两个字符，就是这两位数字。
'''
hints = [
  "把整数转换成 `string` 得到的是那个码点对应的字符，不是它的数字。到 `strconv` 里找，并留意参数类型。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "go.cheatsheet.21.both"
title = "两盏灯都绿"
story = "怡和街的过路口只有在绿色小人和蜂鸣器意见一致时才放行，而蜂鸣器很有主见。"
brief = '''
`ready` 和 `valid` 都是 `bool`。写出只有当两者都为真时才为真的条件。
'''
hints = [
  "Go 的逻辑运算符按 C 的写法拼写，而单字符的那种形式在 `bool` 上根本没有定义。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "go.cheatsheet.22.last"
title = "线路的尽头"
story = "查票员在铜锣湾总站登上当晚最后一班电车，而车厂给电车编号是从零开始的。"
brief = '''
`a` 是一个非空的 `[]int`。让 `x` 成为它的最后一个元素。
'''
hints = [
  "Go 没有从末尾开始的下标 —— 负数常量下标连编译都过不了 —— 而长度比最后一个下标大一。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "go.cheatsheet.23.empty"
title = "仍然是一个托盘"
story = "有些下午，骆克道的点心推车推出来时上面空无一物，而它仍然是一辆有十二个格子的推车。"
brief = '''
`s` 是一个 `[]int`，很可能非 nil 而且还有余量 —— 比如用 `make([]int, 0, 16)`
造出来的，或者被截回 `s[:0]` 的。只有当它不含任何元素时才进入代码块。
'''
hints = [
  "空切片不必是 nil，而容量是余量，不是内容。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "go.cheatsheet.24.func-add"
title = "类型跟在名字后面"
story = "波斯富街的 Alex 用 Go 的方式写收银机的加法例程；新来的人一直用 C 的方式写，还纳闷构建为什么是红的。"
brief = '''
声明 `add`，接收两个 `int` 并以 `int` 返回它们的和，使 `fmt.Println(add(1, 2))`
打印出 `3`。
'''
hints = [
  "先写名字，再写类型，而结果类型放在参数列表之后 —— 声明时没写结果类型的函数什么都不能返回。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.cheatsheet.25.sort-asc"
title = "最小的在前"
story = "糖街电车站的票根乱七八糟地落在职员桌上，而职员想要最小的号码摆在最上面。"
brief = '''
`a` 是一个 `[]int`，并且已导入 `slices`（Go 1.21+）。用一次调用把 `a` 原地按升序
排序。
'''
hints = [
  "泛型包只接收一个参数 —— 切片本身，不是它的地址。旧的 `sort` 包要的是一个 `Interface` 或者一个比较函数。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "go.cheatsheet.26.reverse"
title = "从后往前"
story = "午炮响过之后，人群从海滨的大门鱼贯而出，顺序恰好与进来时相反。"
brief = '''
`a` 是一个 `[]int`，并且已导入 `slices`（Go 1.21+）。用一行把 `a` 原地反转，
之后继续使用 `a`。
'''
hints = [
  "它作用于交给它的那个切片，什么都不返回，所以没有东西可以赋值 —— 而 `sort` 里同名的函数是给 `Interface` 用的。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.cheatsheet.27.clone"
title = "你自己的一份"
story = "名店坊的报名表被复印一份给第二家店，而复印件上打的勾绝不能出现在原件上。"
brief = '''
`s` 是一个 `[]int`，并且已导入 `slices`（Go 1.21+）。让 `c` 成为 `s` 的一份副本，
使之后的 `c[0] = 9` 不会动到 `s`。
'''
hints = [
  "赋值和重新切片交出的是同一个底层数组，而负责复制的内置函数要的是一个你已经造好的目标。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "go.cheatsheet.28.switch"
title = "一位或两位"
story = "罗素街的 Lucky Mac 把一人或两人的桌子叫作“小桌”，而领位员厌倦了把这条规则写两遍。"
brief = '''
`x` 是一个 `int`。填上空缺，使 `x` 为 1 或 2 时 `s` 变成 `"small"` —— 其他情况
照旧。

```
switch x {
case 0:
    s = "zero"
// ____
default:
    s = "big"
}
```
'''
hints = [
  "Go 的 case 到下一个 case 开始处就结束 —— 不会自己向下穿透 —— 而一个 case 可以列出不止一个值。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "go.cheatsheet.29.abs"
title = "差三块砖"
story = "坚拿道天桥底下，拖鞋落得差三块砖和落得过了三块砖，得分是一样的。"
brief = '''
`x` 是一个可能为负的 `int`（而且小到 `-x` 不会溢出）。让 `a` 成为它的绝对值 ——
Go 1.21+，不额外导入。
'''
hints = [
  "标准库没有整数的绝对值，而 `math` 里的那个接收 `float64`。1.21 带来了两个做比较的内置函数。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.cheatsheet.30.mod"
title = "绕回钟面"
story = "在三站的环线上从维多利亚公园总站倒退七站，而牌板仍然必须显示一个站号，不是一个负号。"
brief = '''
`x` 和 `m` 都是 `int`，`m > 0`，而 `x` 可能为负 —— 比 `-m` 还要更低于零，比如
`x = -7`、`m = 3`。让 `r` 成为落在 `0 .. m-1` 之内的余数，使这一对得到 `2`。
'''
hints = [
  "在 Go 里 `%` 的符号跟随被除数，而只加一次只能救回低至 `-m` 的值。",
]
