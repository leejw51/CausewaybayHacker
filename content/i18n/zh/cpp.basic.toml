[[quest]]
id    = "cpp.basic.16.lambdas"
title = "双号泊位，平方"
story = "墙边的双号泊位按号码的平方付费，单号的不用付，账本上只有一行写总数。"
brief = '''
`<numeric>` 和 `<algorithm>` 里的算法把 lambda 作为最后一个参数。`std::accumulate`
把一个区间折叠成一个值：它从一个初始值开始，用目前的总数和每个元素去调用 lambda，
保留 lambda 返回的东西。从 `0LL` 开始，总数就是 `long long`。

```
long long total = std::accumulate(xs.begin(), xs.end(), 0LL, [](long long acc, long long v) { return v % 2 == 0 ? acc + v * v : acc; });
```

数字在 `xs` 里，`total` 会被打印。把这一行敲在 `// FILL` 处，替换掉占位的 `total`：
`v` 是偶数时 lambda 加上 `v` 的平方，否则原样交回 `acc`。

```
input:  1 2 3 4 5
output: 20
```
'''
hints = [
  "long long total = std::accumulate(xs.begin(), xs.end(), 0LL, [](long long acc, long long v) { return v % 2 == 0 ? acc + v * v : acc; });",
  "lambda 拿到目前的总数和一个元素，返回新的总数。",
]

