[[quest]]
id    = "cpp.basic.15.closures"
title = "潮汐修正"
story = "海图上的每个测深读数都是在低潮时测的，港务长要把它们全部按今天的潮位修正，而潮位他只在潮位计上读过一次。"
brief = '''
lambda 是就地写的函数：`[capture](params) { body }`。捕获列表是它能从外围作用域看到
的东西 —— `[k]` 把 `k` 复制进来，lambda 在存活期间一直保留这份副本。用 `auto` 给它
起名，调用它就是 `add(x)`。

```
auto add = [k](long long v) { return v + k; };
```

`k` 和那些数已经读入，循环对每个数应用 `add`。把这一行敲在 `// FILL` 处，替换掉占位
的 `add`。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "auto add = [k](long long v) { return v + k; };",
  "[k] 把 k 复制进 lambda；[] 什么都不捕获，根本看不到 k。",
]

