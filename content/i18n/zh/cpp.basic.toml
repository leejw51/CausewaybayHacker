id    = "cpp.basic.22.reverse"
title = "倒过来"
story = "最后进来的舢舨应该最先出去，可船排的牌子照写下的顺序读队列，船尾的绞盘名字也反了。"
brief = '''
`<algorithm>` 里的 `std::reverse(first, last)` 就地把一个区间倒过来，任何容器都行。
