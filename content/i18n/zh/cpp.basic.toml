[[quest]]
id    = "cpp.basic.13.sorting"
title = "按深度排序"
story = "沿着避风塘墙边的测深读数是按船测量的顺序记下的，而海图要先由浅到深，再由深到浅。"
brief = '''
`<algorithm>` 里的 `std::sort` 就地给一个区间排序。给它 vector 的两端，它按升序排；
第三个参数给一个比较器，它就按那个来排，而 `std::greater<>{}` 是“大的在前”。

```
std::sort(v.begin(), v.end());
std::sort(v.begin(), v.end(), std::greater<>{});
```

数字被读进 `v` 并打印两次。把第一行敲在第一个 `// FILL` 处，第二行敲在第二个处。

```
input:  3 1 2
output: 1 2 3
        3 2 1
```
'''
hints = [
  "std::sort(v.begin(), v.end()); 然后 std::sort(v.begin(), v.end(), std::greater<>{});",
  "std::sort 接收的是区间，不是容器：begin() 和 end()。",
]

