[[quest]]
id    = "cpp.basic.18.hashtable"
title = "无序的点数板"
story = "出菜口把每道菜都记在哈希表上，然后按桶碰巧排出的顺序读回来，两次打印没有一次一样。"
brief = '''
`std::unordered_map` 是哈希表：和 `std::map` 一样的 `[]`、`erase` 和 `at`，平均更快，
遍历时**没有特定顺序** —— 所以打印前要先把键排序。`count(k)` 或 `find(k)` 可以问一个
键在不在，而不会创建它。

```
counts["gun"] = 12;
counts.erase("siu");
counts.at("mai") = 0;
std::sort(keys.begin(), keys.end());
```

`counts` 已经统计了这一行的每个词，而且每一行都有 `mai`；`keys` 是装着它的键的
vector，按桶给出的任意顺序复制出来。把这四行敲在 `// FILL` 处：把 `gun` 加为 `12`，
删除 `siu`，把 `mai` 设成 `0`，然后给键排序，这样每次打印都一样。

```
input:  siu mai har gau siu mai
output: gau 1
        gun 12
        har 1
        mai 0
```
'''
hints = [
  "counts[\"gun\"] = 12; counts.erase(\"siu\"); counts.at(\"mai\") = 0; 然后 std::sort(keys.begin(), keys.end()); —— 增、删、改、排序。",
  "这个表自己没有顺序：键已经替你复制出来了；给它们排序是第四行，在打印之前。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.basic.11.sets"
title = "泊位号码"
story = "泊位名单上，一条舢舨每进来一次它的号码就出现一次，港务长想知道实际上到底有几条船。"
brief = '''
`std::set<long long>` 每个值只保存一次，按升序排列。`insert(x)` 添加一个值（重复的会
被忽略），`erase(x)` 删除一个值（不存在的会被忽略）。集合没有修改：值就是它自己的键，
所以把 `1` 变成 `-1` 就是先 erase 再 insert。它也没有排序那一行：`std::set` 永远是升序。

```
seen.insert(100);
seen.erase(3);
seen.erase(1); seen.insert(-1);
```

`seen` 已经装着这一行里不重复的值。把这三行敲在 `// FILL` 处：加上 `100`，删除 `3`，
然后把 `1` 变成 `-1`。大小和有序遍历已经写好。

```
input:  3 1 3 2 1
output: 3
        -1 2 100
```
'''
hints = [
  "seen.insert(100); seen.erase(3); seen.erase(1); seen.insert(-1); —— 最后两个调用在同一行。",
  "对没有 3 的集合 erase(3) 什么都不做，-1 已经在里面时 insert(-1) 也什么都不做：两者都安全。",
]

