[[quest]]
id    = "cpp.basic.12.stack-queue"
title = "后进，先出"
story = "舢舨按到达的顺序在避风塘墙边并排泊好：最后进来的是最先能离开的，最先进来的是买家最先招呼的。"
brief = '''
`std::stack` 是后进先出：`push(x)` 加在顶上，`pop()` 移除顶部（什么也不返回），`top()`
是指向它的引用 —— 给它赋值就是就地修改顶部。`std::queue` 在另一端是同样的形状：在
尾部 `push`，在前面 `front()` 和 `pop()`。

```
st.push(0);
st.pop();
st.top() = 99;
```

每个数都已经推入了 `st` 和 `q`。把这三行敲在 `// FILL` 处：在顶上加上 `0`，再把它弹出，
然后把顶部覆盖成 `99`。之后栈会被清空并打印，队列取出前两个。

```
input:  1 2 3 4
output: 99 3 2 1
        1 2
```
'''
hints = [
  "st.push(0); st.pop(); st.top() = 99; —— 对栈增、删、改；队列不动。",
  "top() 是引用，所以 st.top() = 99 改的正是 pop() 下一次要移除的那个元素。",
]

