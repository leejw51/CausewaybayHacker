```
std::reverse(v.begin(), v.end());
std::string r(s.rbegin(), s.rend());
```

`v` 装着第一行的整数，`s` 是第二行。把这两行敲在 `// FILL` 处，替换掉占位的 `r`。

```
input:  1 2 3
        gun
output: 3 2 1
        nug
```
'''
hints = [
  "std::reverse(v.begin(), v.end()); —— 就地进行；什么也不返回。",
  "std::string r(s.rbegin(), s.rend()); —— 反向迭代器构造出反转后的副本。",
]

