# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.basic.09.vector"
title = "渔获，按顺序"
story = "每条舢舨隔着水面一个数一个数地报出渔获，最后一条船进来之前，港务长没地方放它们。"
brief = '''
`std::vector<long long>` 是可以变长的数组，对它做的四件事是增、删、改、排序。
`push_back(x)` 追加到末尾；`erase(v.begin() + i)` 删除下标 `i` 处的元素并合拢空位；
`v[i] = x` 覆盖已有的值；`<algorithm>` 里的 `std::sort` 把整个东西排成升序。下标 `0`
是最前面。

```
xs.push_back(99);
xs.erase(xs.begin());
xs[0] = 700;
std::sort(xs.begin(), xs.end());
```

`xs` 装着这一行的整数。把这四行敲在四个 `// FILL` 处：在末尾加上 `99`，删除第一个
元素，把新的第一个元素设成 `700`，然后排序。先打印 vector，再打印它的大小。

```
input:  4 8 15 16
output: 15 16 99 700
        4
```
'''
hints = [
  "xs.push_back(99); xs.erase(xs.begin()); xs[0] = 700; std::sort(xs.begin(), xs.end()); —— 增、删、改、排序。",
  "erase 和 sort 接收迭代器（xs.begin()、xs.end()）；[] 接收下标。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.basic.16.list"
title = "前面还是后面"
story = "单号的舢舨泊在避风塘前面，双号的泊在后面，可泊位名单只会一直往后面加。"
brief = '''
`<list>` 里的 `std::list` 是双向链表：在任意一端增删都是常数时间，而 vector 在前端
做不到。`push_front(x)` 加到前面，`pop_back()` 删除最后一个元素，`front()` 是一个引用
—— 给它赋值，第一个元素就变了 —— 而链表用自己的 `sort()` 成员给自己排序，因为
`std::sort` 需要随机访问，而链表没有。

```
l.push_front(0);
l.pop_back();
l.front() = 99;
l.sort();
```

`l` 已经按顺序装着这一行的整数。把这四行敲在 `// FILL` 处：在前面加上 `0`，删除最后
一个元素，把最前面的覆盖成 `99`，然后排序。链表会被打印出来。

```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "l.push_front(0); l.pop_back(); l.front() = 99; l.sort(); —— 每行一个，按这个顺序。",
  "std::sort 排不了 std::list（没有随机访问）；链表自己的 l.sort() 可以。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.basic.10.maps"
title = "点数板"
story = "避风塘的点数板列出船队卸下的每一条鱼，一条鱼一个词，买家想要每种一行，带上数目。"
brief = '''
`std::map<std::string, int>` 是按键排序保存的字典。`m[k] = v` 添加一个键（或覆盖已有
的）；`erase(k)` 删除一个键，键不存在时什么都不做；`at(k)` 是一个必须已经存在的键所
对应的条目 —— 给它赋值就是修改，而且它会抛异常，不会凭空造出一个键。遍历 map 时键是
有序的 —— `std::map` 永远按键排序，所以这里没有排序那一行。

```
counts["crab"] = 1;
counts.erase("rice");
counts.at("fish") = 9;
```

`counts` 已经统计了这一行的每个词，而且每一行都有 `fish`。把这三行敲在 `// FILL`
处：把 `crab` 加为 `1`，删除 `rice`，然后把 `fish` 设成 `9`。有序的打印已经写好。

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
'''
hints = [
  "counts[\"crab\"] = 1; counts.erase(\"rice\"); counts.at(\"fish\") = 9; —— 增、删、改。",
  "[] 会创建缺失的键；at() 不肯。键必须已经存在时就用 at()。",
]

