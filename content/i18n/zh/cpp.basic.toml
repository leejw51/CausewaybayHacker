[[quest]]
id    = "cpp.basic.17.threads"
title = "一条船一台绞盘"
story = "船排上的每条舢舨都有自己的绞盘，它们同时拉，点数要等最后一台停下后才读。"
brief = '''
`std::thread` 一被造出来就在自己的线程上运行一个函数；`join()` 等它结束。线程的 vector
用 `emplace_back` 和一个 lambda 构造。捕获 `[&, i]` 按引用借用一切，只有 `i` 是复制的
—— 循环会往前走，副本不会。每个线程只写自己的格子，所以没有共享任何东西，而且在每个
`join()` 都返回之前什么都不打印。

```
threads.emplace_back([&, i] { results[i] = xs[i] * xs[i]; });
for (auto& t : threads) t.join();
```

`results` 每个数一个格子，打印已经写好。把第一行敲在循环里的 `// FILL` 处，替换掉
占位；第二行敲在它后面的 `// FILL` 处。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "循环里写 threads.emplace_back([&, i] { results[i] = xs[i] * xs[i]; });，循环后写 for (auto& t : threads) t.join();。",
  "到 main 结束还没被 join 的线程会终止整个程序；打印之前把它们全部 join。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.basic.18.binary-tree"
title = "SEGFAULT"
story = "12:00，午炮。发射时间表是一棵时间树，而午炮沿着一条根本不存在的左分支走了下去 —— nullptr，被解引用，就在铜锣湾唯一一个绝不能错的地址上。"
brief = '''
二叉搜索树由节点组成，每个节点有一个值和两个子指针：小的值在 `left` 下面，大的在
`right` 下面。插入是递归的：空子树（`nullptr`）变成一个新节点，否则值就沿一边往下走
—— 而那一边变成的东西要存回去，因为那一边刚才可能还是 `nullptr`。这次存回就是全部
的诀窍，而它之前对 `nullptr` 的检查就是整个 boss。

```
if (!n) return new Node{v};
if (v < n->val) n->left = insert(n->left, v);
else n->right = insert(n->right, v);
return n;
```

`Node`、`nullptr` 的情况、`inorder`、`height` 和 `main` 都已经写好。把两行下降的代码
敲在两个 `// FILL` 处：左边那行在 `if` 里，右边那行在 `else` 里。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "左边写 n->left = insert(n->left, v);，右边写 n->right = insert(n->right, v);。",
  "把结果存回去：子节点可能是 nullptr，而新节点就是 insert 的返回值。",
]
