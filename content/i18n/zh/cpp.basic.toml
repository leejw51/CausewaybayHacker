所以 `i % 3 == 0` 的意思是“3 的倍数”。

```
for (long long i = 1; i <= n; ++i) {
```

循环体已经写好：它把 `i` 加进 `sum`，并数出 3 的倍数。把这一行 `for` 敲在 `// FILL`
