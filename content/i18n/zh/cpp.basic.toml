[[quest]]
id    = "cpp.basic.14.sort-by-key"
title = "排行榜"
story = "游艇会的比赛榜按报名顺序列出每条船和它的积分，而会长要第一名在最上面。"
brief = '''
`std::sort` 接收一个比较器：一个接收两个元素的函数，说明第一个是否应排在第二个前面。
就地写的 lambda 是常用的比较器，而“按分数降序，再按名字升序”就是一个表达式：分数不同
时，高的在前；分数相同时，名字小的在前。

```
std::sort(rs.begin(), rs.end(), [](const Row& a, const Row& b) {
    return a.score != b.score ? a.score > b.score : a.name < b.name;
});
```

各行已经读入并会被打印。把那个 `std::sort` 敲在 `// FILL` 处。

```
input:  3
        mei 40
        alex 55
        sam 40
output: alex 55
        mei 40
        sam 40
```
'''
hints = [
  "std::sort(rs.begin(), rs.end(), [](const Row& a, const Row& b) { return a.score != b.score ? a.score > b.score : a.name < b.name; });",
  "比较器回答的是“a 是否排在 b 前面”：分数高的在前，平分时名字小的在前。",
]

