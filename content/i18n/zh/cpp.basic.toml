[[quest]]
id    = "cpp.basic.09.int-slices"
title = "从中间取两个"
story = "船排的记录要把第二和第三个读数单独抄出来，再把整个早上的读数接在后面，结果抄出来的是整个早上两遍。"
brief = '''
`std::vector` 没有切片语法；切片就是用两个迭代器构造的新 vector —— 从 `begin() + 1`
到 `begin() + 3`（不含）—— 而且它是一个**副本**（`<span>` 里的 `std::span` 才是不复制的
视图）。当 `where` 是 `end()` 时，`insert(where, first, last)` 就把整个区间追加上去。

```
std::vector<long long> part(v.begin() + 1, v.begin() + 3);
part.insert(part.end(), v.begin(), v.end());
```

`v` 装着这一行的整数（至少三个）。把这两行敲在 `// FILL` 处，替换掉占位的 `part`。

```
input:  1 2 3 4
output: 2 3 1 2 3 4
```
'''
hints = [
  "std::vector<long long> part(v.begin() + 1, v.begin() + 3); —— 区间构造函数；结尾是所取的最后一个元素的下一个位置。",
  "part.insert(part.end(), v.begin(), v.end()); —— 在末尾插入一个区间就是追加。",
]

