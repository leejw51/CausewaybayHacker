[[quest]]
id    = "cpp.basic.10.byte-slices"
title = "前三个字节"
story = "午炮的线路把一个名字当作字节传过来，接收端留下前三个，再把最后两个接在后面，结果打印出来的缓冲区是整个名字。"
brief = '''
字节是 `uint8_t`，字节数组是 `std::vector<uint8_t>`。和整数 vector 一样的两个惯用法
在这里也适用：切片是用两个迭代器构造的新 vector（一个副本），`insert(end(), first, last)`
追加一个区间。`bytes.end() - 2` 是离末尾两个位置的迭代器。

```
std::vector<uint8_t> head(bytes.begin(), bytes.begin() + 3);
head.insert(head.end(), bytes.end() - 2, bytes.end());
```

`bytes` 装着这一行的字符（至少三个）。把这两行敲在 `// FILL` 处，替换掉占位的 `head`。
十六进制那一行和文本那一行已经替你打印了。

```
input:  sampan
output: 73616d616e
        saman
```
'''
hints = [
  "std::vector<uint8_t> head(bytes.begin(), bytes.begin() + 3); —— 三个字节，一个新 vector。",
  "head.insert(head.end(), bytes.end() - 2, bytes.end()); —— 最后两个，追加上去。",
]

