二叉搜索树把较小的值放在节点的左子树，较大的放在右子树。插入是递归的：空子树（`nil`）变成一个新的 `Node`；否则值沿一边往下走，无论回来的是什么，都要重新存为那个子节点，因为那个子节点刚才可能还是 `nil`——缺失的键是 nil，而 nil 在被跟进之前不是错误。在 `nil` 上跟进 `.left` 就是这整条路得名的那次崩溃；`nil` 检查放在最前面，而且已经写好。

```
if v < n.val then
  n.left = insert(n.left, v)
else
  n.right = insert(n.right, v)
end
```

`Node`、`insert` 的 `nil` 情况和它的 `if v < n.val then` / `else` 骨架、`inorder`、`height` 和 `main` 都已写好。在两个占位处照样输入两行递归。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
