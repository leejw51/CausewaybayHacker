[[quest]]
id    = "lua.basic.17.threads"
title = "十二个跑腿同时"
story = "鼓声第一次响起时，火龙沿线的每个上香跑腿同时为庙里的账本算自己那一节计数的平方，而账本回来全是零，因为没人等他们做完。"
brief = '''
LuaJIT 没有线程；协程是最接近的东西——一个有自己的栈的函数，被 resume 时运行，在每个 `yield` 处停下。`coroutine.create(f)` 创建一个，什么也不运行。`coroutine.resume(co)` 启动它，或者让它从上一个 yield 处继续，并在它再次 yield 或结束时返回。协程结束后 `coroutine.status(co)` 是 `"dead"`，所以 join 就是一直 resume 直到它是为止。先启动每一个跑腿，再让每一个跑腿做完——在启动循环里做完会让它们一次只跑一个。

```
for _, co in ipairs(workers) do
  coroutine.resume(co)
end
for _, co in ipairs(workers) do
  while coroutine.status(co) ~= "dead" do coroutine.resume(co) end
end
```

`square(i)` yield 一次，然后填好 `results[i]`，工作者列表已经建好，两个 print 在第二个循环之后运行。照样把 `resume` 输入为第一个循环的循环体，把 `while` 行输入为第二个循环的循环体。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "第一个循环里 coroutine.resume(co)，第二个循环里 while coroutine.status(co) ~= \"dead\" do coroutine.resume(co) end。",
