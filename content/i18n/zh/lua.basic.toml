  "在 if 下面 n.left = insert(n.left, v)，在 else 下面 n.right = insert(n.right, v)。",
  "赋值才是关键：insert 返回子树的根，当子节点是 nil 时那就是一个全新的 Node。新的 Node 根本没有 left 或 right 键——读它们得到 nil，这没问题，直到你往里面索引。",
]
