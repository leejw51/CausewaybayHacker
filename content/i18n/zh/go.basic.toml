[[quest]]
id    = "go.basic.13.sorting"
title = "到站板"
story = "天后的到站板按数据到来的顺序列出下几班车，也就是根本没有顺序。"
brief = '''
`sort` 包就地排序切片。`sort.Ints(xs)` 把整数按升序排好。降序没有 `sort.IntsDesc`；
而是把切片包装成 `sort.IntSlice`，用 `sort.Reverse` 把顺序反过来，再交给 `sort.Sort`。

```
sort.Ints(xs)
sort.Sort(sort.Reverse(sort.IntSlice(xs)))
```

在第一次打印前写升序排序，在第二次打印前写降序排序。打印已经写好。

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "先 sort.Ints(xs)；再 sort.Sort(sort.Reverse(sort.IntSlice(xs)))。",
  "sort.IntSlice(xs) 是类型转换，不是复制——排序仍然发生在 xs 里面。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.basic.14.sort-by-key"
title = "骑手排行榜"
story = "幸运麦当劳的排班板本该按送单数给骑手排名，最多的在前，同分按名字，它却按打卡顺序列出他们。"
brief = '''
`sort.Slice` 用一个 `less(i, j)` 函数排序任意切片，它回答第 `i` 个元素是否该排在第 `j` 个之前。
两级顺序先比较第一个键，只有相同时才落到第二个。降序只是把比较反过来。

```
sort.Slice(entries, func(i, j int) bool {
	a, b := entries[i], entries[j]
	if a.Score != b.Score { return a.Score > b.Score }
	return a.Name < b.Name
})
```

`sort.Slice` 调用和函数的开头已经写好。写出它的两行：分数不同时按分数降序，
相同时按名字升序。

```
input:  4
        alex 12
        mei 15
        bo 12
        sam 9
output: mei 15
        alex 12
        bo 12
        sam 9
```
'''
hints = [
  "if a.Score != b.Score { return a.Score > b.Score }，然后 return a.Name < b.Name。",
  "less 回答的是“i 排前面吗？”：分数高的排前面，分数相同时名字小的排前面。",
]

