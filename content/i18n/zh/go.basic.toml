[[quest]]
id    = "go.basic.12.stack-queue"
title = "盘子与队伍"
story = "幸运麦当劳出餐口的干净盘子摞起来从顶上拿；顾客在收银台排队从前头走。屏幕把两者做成了一个样。"
brief = '''
切片就是栈。压入是 `append`；弹出是把最后一个元素切掉；栈顶是
`stack[len(stack)-1]`，可以直接给它赋值——不取下来就修改顶上的盘子。
队列那一边用 `queue = queue[1:]` 从前面取，已经替你写好。栈从不排序——
顺序本身就是它的意义——所以这道练习是三行，不是四行。

```
stack = append(stack, v)
stack = stack[:len(stack)-1]
stack[len(stack)-1] = 99
```

数字读进 `xs`（至少两个）。在三个占位符处，把压入输入到遍历 `xs` 的循环里，
弹出和栈顶的修改输入到循环后面；会打印栈和队列的前两个。

```
input:  1 2 3 4
output: 1 2 99
        1 2
```
'''
hints = [
  "循环里 stack = append(stack, v)；之后 stack = stack[:len(stack)-1] 和 stack[len(stack)-1] = 99。",
  "弹出只是把切片变窄；什么也没复制，什么也没释放。弹出之后，len(stack)-1 指的是原来从顶数第二个元素。",
]

