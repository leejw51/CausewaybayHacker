# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.basic.17.threads"
title = "一单一个骑手"
story = "八份订单同时从幸运麦当劳的门口出去，骑上八辆车，而看板一个都不等，就把今晚的账加了起来。"
brief = '''
`go f()` 在它自己的 goroutine 上启动 `f`，不等待。`sync.WaitGroup` 是 `main` 等待
它们全部结束的方法：每次启动前 `Add(1)`，每个结束时在里面 `Done()`——用 defer，
这样不管函数怎么退出都会执行——`Wait()` 阻塞直到计数归零。这里每个 goroutine 只写
自己的 `results[i]`，所以没有共享。

```
var wg sync.WaitGroup
for i, x := range xs {
	wg.Add(1)
	go func(i, x int) {
		defer wg.Done()
		results[i] = x * x
	}(i, x)
}
wg.Wait()
```

循环、`Add` 和 goroutine 的形状已经写好。填它的函数体：`defer wg.Done()`，
然后把 `x * x` 存进 `results[i]`。

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
hints = [
  "第一行 defer wg.Done()，第二行 results[i] = x * x。",
  "defer 在 goroutine 返回时执行 Done，中间不管发生什么；先写一句普通的 wg.Done() 会在干活之前就说“完成了”。",
]

