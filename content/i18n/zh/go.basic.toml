字符串可以像其他东西一样切片：`s[0:4]` 是它的前四个字节。字符串从不改变，
所以切片不复制任何东西也不破坏任何东西——新值 `t` 是它自己的字符串，`s` 完好无损。
追加用 `+=`：它用旧字符串和那一段拼出一个新字符串。

```
t := s[0:4]
t += "_bay"
```

`s` 是 stdin 上的单词。在两个占位处输入切片成 `t` 的那一行和追加的那一行；
先打印 `t`，再打印未动的 `s`。

```
input:  causeway
output: caus_bay
        causeway
```
