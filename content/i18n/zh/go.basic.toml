[[quest]]
id    = "go.basic.04.strings"
title = "站名"
story = "铜锣湾站的月台牌显示了一次站名，然后是一片空白，本该是大写；再一片空白，本该是给镜面那一侧倒着写的。"
brief = '''
`string` 是只读的字节切片。`len(s)` 是它的字节长度，`strings` 包里有日常的各种变换，
要逐个字符走过它就转成 `[]rune`。下面的 `reverse` 辅助函数做的就是这个遍历；你只需要调用它。

```
fmt.Println(strings.ToUpper(line))
fmt.Println(reverse(line))
```

长度已经打印。写出接下来两行：名字的大写，然后是反转后的名字。

```
input:  causeway bay
output: 12
        CAUSEWAY BAY
        yab yawesuac
```
'''
hints = [
  "fmt.Println(strings.ToUpper(line))，然后 fmt.Println(reverse(line))。",
  "那行 _ = strings.ToUpper 只是为了让 import 被用到；真正调用 strings.ToUpper 之后就删掉它。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.basic.05.loops"
title = "每第三班车"
story = "金钟的出发板本该把早上的班次加起来，再说其中有多少班是每三班一趟的快车。它显示两个零。"
brief = '''
Go 只有一个循环关键字。`for init; condition; step { }` 计数，里面的 `if` 不需要括号，
只需要花括号。`sum += i` 就地累加一个变量，`i%3 == 0` 是问 `i` 是否为三的倍数。

```
for i := 1; i <= n; i++ {
	sum += i
	if i%3 == 0 { threes++ }
}
```

循环头已经写好。填它的循环体：把 `i` 加到 `sum`，当它是三的倍数时在 `threes`
里计数（一个 `if` 写在一行也可以）。

```
input:  10
output: 55
        3
```
'''
hints = [
  "一行 sum += i，下一行 if i%3 == 0 { threes++ }。",
  "if 哪怕只有一条语句也需要花括号；它不需要括号。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.basic.06.functions"
title = "骑手的费率"
story = "Alex 的外卖应用给一个班次的前十程一个费率，其余的另一个费率，而厨房平板上的结算函数给每个人都返回零。"
brief = '''
函数的参数名后面跟类型，结果类型写在括号之后。`return` 带着一个值结束函数；`if`
里的 `return` 提前结束，所以 `if` 之后那一行只在条件为假时运行。

```
func fare(rides int) int {
	if rides <= 10 { return rides * 5 }
	return 50 + (rides-10)*3
}
```

前十程每程 5 元，之后每程 3 元。`fare` 已经声明并被调用；写出它的函数体：
十程及以下的提前 `return`，以及其余情况的 `return`。

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { return rides * 5 }，然后 return 50 + (rides-10)*3。",
  "十程各 5 元是 50；第二个公式就从这里开始算。",
]

