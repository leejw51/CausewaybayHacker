id    = "go.basic.04.int-types"
title = "数字的宽度"
story = "天后站的八达通读卡器把车费存在一个 32 位的格子里，把当天的总数存在一个 64 位的格子里，而今天两个都打印出同一个零。"
brief = '''
Go 的整数分宽度：`int32` 和 `int64` 有符号，`uint32` 和 `uint64` 不能低于零。
没有什么会自动转换——你把目标类型像函数一样写出来，`uint64(a)`，值就被复制进
更宽的格子。`math` 包给边界起了名字：`math.MaxInt32` 是最大的 `int32`，
`math.MaxUint64` 是最大的 `uint64`。

```
b := uint64(a)
fmt.Println(math.MaxInt32)
```

`a` 以 `int32` 读入。在两个占位处输入转换成 `b` 的那一行和打印 `math.MaxInt32`
的那一行；另外两行已替你打印。

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
hints = [
  "b := uint64(a) ——类型名就是转换；然后 fmt.Println(math.MaxInt32)。",
  "宽度是类型的一部分：int32 和 int64 不写出转换永远不会混用。",
]

