id    = "go.basic.16.list"
title = "点单链"
story = "Lucky Mac 出餐口的订单挂在一条链上，最新的在后，前头挂着一个标记，而这条链空空地挂着。"
brief = '''
`container/list` 是双向链表。`PushBack` 把值挂到末尾。`Remove` 把一个元素
从它所在的位置摘掉——`l.Front()` 是第一个。修改要通过元素：`e.Value` 是可以
赋值的字段，所以 `l.Front().Value = 99` 原地改写第一个订单。链表没有自己的
排序：从 `l.Front()` 沿 `e.Next()` 的遍历把值复制进切片 `vals`（已经替你写好），
`sort.Ints` 排的是它。

```
l.PushBack(v)
l.Remove(l.Front())
l.Front().Value = 99
sort.Ints(vals)
```

每个数字 `v` 在循环里读入（至少两个）。在四个占位符处，把 `PushBack`
输入到循环里，删除和修改输入到循环后面，排序输入到遍历之后；会打印长度
和排好序的值。

```
input:  3 1 2
output: 2
        2 99
```
'''
hints = [
  "循环里 l.PushBack(v)；之后 l.Remove(l.Front()) 和 l.Front().Value = 99；遍历之后 sort.Ints(vals)。",
  "Remove 接受的是 *Element 而不是值，所以传给它 l.Front()；之后原来的第二个元素成了新的头，被修改的就是它。e.Value 是 interface{}，所以遍历里写的是 e.Value.(int)。",
]

