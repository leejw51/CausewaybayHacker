[[quest]]
id    = "go.basic.10.maps"
title = "订单统计"
story = "幸运麦当劳的厨房打印机每喊一样就吐出一样，却从不说这一波高峰每样到底点了多少。"
brief = '''
`map[string]int` 按词存一个计数。添加是 `counts[w]++`——不存在的键读出来
是零，所以第一次见到就成了 1。删除是 `delete(counts, k)`，键不在时静默。
修改就是赋值：`counts["bun"] = 10` 覆盖那个键下的计数（键不存在时会插入）。
map 没有顺序——range 出来是乱的——所以键被收进一个切片（已经替你写好），
打印前用 `sort.Strings` 排好。

```
counts[w]++
delete(counts, "tea")
counts["bun"] = 10
sort.Strings(keys)
```

每个词 `w` 在循环里读入。在四个占位符处，把计数输入到循环里，`tea` 的
`delete` 和 `bun` 的修改输入到循环后面，排序输入到 `keys` 建好之后；
会打印排好序的 `word count` 各行。

```
input:  tea bun tea rice tea bun
output: bun 10
        rice 1
```
'''
hints = [
  "循环里 counts[w]++；之后 delete(counts, \"tea\") 和 counts[\"bun\"] = 10；keys 建好后 sort.Strings(keys)。",
  "给键赋值，不管键存不存在都是同一行：存在就覆盖，不存在就插入。",
]

