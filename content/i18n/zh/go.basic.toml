[[quest]]
id    = "go.basic.18.hashtable"
title = "计数，减一"
story = "厨房把出餐口喊出的每个词都记数，划掉 the 这个词，而每天晚上读回来的顺序都不一样。"
brief = '''
Go 的 map 就是哈希表：键被哈希到一个槽位，所以添加、删除和查找的开销
不管有十个键还是一千万个键都一样——代价是遍历出来没有固定顺序。添加是
`counts[w]++`；删除是 `delete`；安全地修改一项用 comma-ok 形式，
`n, ok := counts[k]`，它告诉你写回去之前键在不在。键被收进一个切片（已经
替你写好），`sort.Strings` 排好它，否则每天晚上的账都读起来不一样。

```
counts[w]++
delete(counts, "the")
if n, ok := counts["tram"]; ok { counts["tram"] = n * 100 }
sort.Strings(keys)
```

每个词 `w` 在循环里读入。在四个占位符处，把计数输入到循环里，`delete`
和 comma-ok 修改输入到循环后面，排序输入到 `keys` 建好之后；会打印大小
和排好序的统计。

```
input:  the tram the wire the
output: 2
        tram 100
        wire 1
```
'''
hints = [
  "循环里 counts[w]++；之后 delete(counts, \"the\") 和 if n, ok := counts[\"tram\"]; ok { counts[\"tram\"] = n * 100 }；keys 建好后 sort.Strings(keys)。",
  "comma-ok 的读取从不插入：\"tram\" 不在时 ok 为 false，什么也不写——而普通的 counts[\"tram\"] 读取会交回 0，赋值则会创建这个键。",
]

