# GO LAND — BASIC, in Simplified Chinese. A translation pack (SPEC §12.1): the
# prose of `content/go/basic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "go.basic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.basic.01.package-main"
title = "第一个包"
story = "天后站 A 出口。Alex 递给你一台笔记本，里面有个文件，只有一行 package，下面什么都没有。"
brief = '''
精确输出：

```
hello, causewaybay
```

初始代码里没有任何 import。把你需要的那一个加上，这就是本条街的任务 —— 在 Go 里，
导入了却没有用到的包是编译错误，而需要用到却没有导入的包会报 `undefined`。
'''
hints = [
  "Println 在 fmt 里。",
  "import \"fmt\" 写在 package 那一行和 func main 之间。",
  "Println 会自动加换行；Print 不会。",
]

