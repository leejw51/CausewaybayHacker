[[quest]]
id    = "go.basic.02.vars"
title = "八达通读卡器"
story = "天后站的读卡器显示了余额，然后是两个空格 —— 原来显示每日上限和押金的地方。"
brief = '''
变量用 `var` 声明，或者用 `:=` 就地创建，它从右侧取得类型。`fmt.Println` 打印
参数，参数之间有空格，末尾换行。`int64` 上的算术仍是 `int64`：`n * n` 还是整数。

```
fmt.Println(n * n)
```

余额 `n` 已经读取并打印，`n * 2` 也是。写出第三个打印：`n` 乘以它自己。

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "fmt.Println(n * n)",
  "和上一行形状相同：n * 2 变成 n * n。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.basic.03.types"
title = "车费分摊"
story = "天后柜台，两个骑手分一张幸运麦当劳的账单，收据把份额打成一个整数、一个余数，然后才是真正的数字。"
brief = '''
Go 从不替你转换数字。两个整数的 `a / b` 是整数除法（向零取整），`a % b` 是余数。
要得到真正的商，先把两边都用 `float64(...)` 转换，`fmt.Printf` 配合 `%.2f`
打印一个恰好两位小数的浮点数。

```
fmt.Printf("%.2f\n", float64(a)/float64(b))
```

整数份额和余数已经打印。写出第三行：真正的份额，两位小数。

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "fmt.Printf(\"%.2f\\n\", float64(a)/float64(b))",
  "两边都要转换：float64(a) / b 编译不过，因为 float64 和 int64 不能相除。",
]

