[[quest]]
id    = "go.basic.11.sets"
title = "不同的骑手"
story = "一个早上有四十个骑手编号进了幸运麦当劳的门，大多是同样的八个人，而排班板把每次到来都算成一个新骑手。"
brief = '''
Go 没有集合类型；值类型为空结构体的 map 就是惯用写法。添加是
`seen[v] = struct{}{}`；删除是 `delete`。集合没有修改——成员只有在或不在——
所以把 `3` 变成 `4` 是一次删除加一次添加，这里写在一行。`len(seen)` 是
不重复的个数；键出来没有顺序，所以被收进一个切片（已经替你写好），用
`sort.Ints` 排好。

```
seen[v] = struct{}{}
delete(seen, 8)
delete(seen, 3); seen[4] = struct{}{}
sort.Ints(keys)
```

每个骑手编号 `v` 在循环里读入。在四个占位符处，把添加输入到循环里，`8`
的删除和 `3` 改 `4` 的修改输入到循环后面，排序输入到 `keys` 建好之后；
会打印不重复的个数和排好序的编号。

```
input:  8 3 8 5 3 8
output: 2
        4 5
```
'''
hints = [
  "循环里 seen[v] = struct{}{}；之后 delete(seen, 8) 和 delete(seen, 3); seen[4] = struct{}{}；keys 建好后 sort.Ints(keys)。",
  "delete 一个不在的值什么也不做，添加一个已经在的值什么也不变：不管输入是什么，修改的两半都可以安全执行。",
]

