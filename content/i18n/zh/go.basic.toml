# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.basic.08.enums"
title = "线路颜色"
story = "金钟的换乘图认得三条线的名字，却把每一条都涂成灰色。"
brief = '''
Go 没有 `enum` 关键字。惯用法是一个具名整数类型加一个带 `iota` 的 `const` 块，
`iota` 从上往下把常量编号为 0、1、2。对这种值的 `switch` 为每个常量列一个 `case`，
`case` 可以和它的 `return` 写在同一行。

```
type Line int

const (
	Island Line = iota
	TsuenWan
	KwunTong
)

switch l {
case Island: return "blue"
case TsuenWan: return "red"
case KwunTong: return "green"
}
```

`Line`、它的三个常量和 `parse` 已经写好，`colour` 对 `Island` 已经回答 `blue`。
加上缺的两个 case：`TsuenWan` 是 `red`，`KwunTong` 是 `green`。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "case TsuenWan: return \"red\" 和 case KwunTong: return \"green\"，各占一行，写在 Island 那个 case 下面。",
  "Go 的 switch 不会贯穿：每个 case 自己结束，不需要 break。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.vector"
title = "车厢计数"
story = "铜锣湾 2 号月台从每扇门读上车人数，却一个都没留下：没有总数，没有第一扇门，也没有最后一扇。"
brief = '''
切片是 Go 的可增长列表，对它做的就是下面这几行。`append` 在末尾添加并交回
切片，所以总要赋回去。删掉下标 1 还是 `append`：它前面的部分接上它后面的部分。
修改就是普通的下标——`xs[0] = 99` 原地覆盖第一个元素。`sort.Ints` 把整个切片
原地升序排好。

```
xs = append(xs, v)
xs = append(xs[:1], xs[2:]...)
xs[0] = 99
sort.Ints(xs)
```

每个门的数量 `v` 在循环里读入（至少两个）。在四个占位符处，把 `append`
输入到循环里，删除、修改和排序输入到循环后面；会打印长度和切片。

```
input:  3 7 2 5
output: 3
        2 5 99
```
'''
hints = [
  "循环里 xs = append(xs, v)；之后 xs = append(xs[:1], xs[2:]...)、xs[0] = 99 和 sort.Ints(xs)。",
  "xs[:1] 是下标 1 之前的全部，xs[2:] 是它之后的全部；append 把两段接起来，... 把第二个切片展开成参数。",
]

