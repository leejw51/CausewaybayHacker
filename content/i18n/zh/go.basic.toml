# GO LAND — BASIC, in Simplified Chinese. A translation pack (SPEC §12.1): the
# prose of `content/go/basic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "go.basic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.basic.01.package-main"
title = "第一个包"
story = "天后站 A 出口。Alex 递给你一台笔记本，里面有个文件，只有一行 package，下面什么都没有。"
brief = '''
精确输出：

```
hello, causewaybay
```

初始代码里没有任何 import。把你需要的那一个加上，这就是本条街的任务 —— 在 Go 里，
导入了却没有用到的包是编译错误，而需要用到却没有导入的包会报 `undefined`。
'''
hints = [
  "Println 在 fmt 里。",
  "import \"fmt\" 写在 package 那一行和 func main 之间。",
  "Println 会自动加换行；Print 不会。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.basic.02.vars"
title = "八达通读卡器"
story = "天后站的读卡器显示了余额，然后是两个空格 —— 原来显示每日上限和押金的地方。"
brief = '''
从标准输入读取一个整数 `n`。

输出三行：`n`，然后是 `n` 的两倍，然后是 `n` 乘以自身。

`n` 放得进 `int64`，并且可能为负数。

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "读取部分已经替你写好了；n 里已经是那个值。",
  "fmt.Println 接受任何值，所以这里不需要格式字符串。",
  "负数 n 的平方是正数。测试知道这一点。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.basic.03.control-flow"
title = "电车还是地铁"
story = "铜锣湾站大堂的显示板本该报出下一班是哪种服务。它却每分钟都只显示分钟的数字。"
brief = '''
读取一个整数 `n`。对从 `1` 到 `n` 的每个 `i`，输出一行：

* 如果 `i` 同时能被 3 和 5 整除，输出 `TRAMMTR`
* 如果 `i` 能被 3 整除，输出 `TRAM`
* 如果 `i` 能被 5 整除，输出 `MTR`
* 否则输出 `i` 本身

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

Go 的无主语 `switch` 每个分支接受一个布尔条件，并且不会贯穿到下一个分支。用它。
'''
hints = [
  "先检查同时整除的情况，否则它永远不会触发。",
  "switch { case cond: } 不需要主语，也不需要 break。",
  "能被 3 和 5 整除，等价于能被 15 整除。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.basic.04.slices"
title = "车厢中段"
story = "2 号月台数得出谁第一个上车、谁最后一个上车，中间的人全都数丢了。"
brief = '''
标准输入第一行是一个数量 `n`，第二行是 `n` 个用空格分隔的整数。`n` 至少为 `1`。

输出三行：第一个值、最后一个值，以及严格位于两者之间的所有值之和。少于三个值时，
这个和为 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1:len(nums)-1] 共享同一个底层数组 —— 它是一个视图，不是副本。",
  "只有一个或两个值时，这个切片表达式会是空的或者非法的；用 if 保护它。",
  "range 遍历切片会给你下标和值；用 _ 丢掉下标。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.basic.05.maps"
title = "大堂里的广播"
story = "九点的铜锣湾换乘站。广播板要的是排名，而 map 没有顺序。"
brief = '''
读取整个标准输入，按空白字符切分。

每个不同的单词输出一次，格式为 `<word> <count>`，按次数降序排列，次数相同时按单词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

用 range 遍历 Go 的 map，顺序是刻意随机的。先收集，再输出。
'''
hints = [
  "counts[word]++ 对不存在的键也能用：int 的零值是 0。",
  "sort.Slice 接受一个 less 函数 —— 当 i 必须排在 j 前面时返回 true。",
  "次数相同时的比较，是同一个函数里的第二次比较。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.basic.06.strings"
title = "字节不是字"
story = "B 出口的指示牌把 銅鑼灣 截断到三个字节，得到一个半字和一个问号。"
brief = '''
读取一行。输出三行：

1. 它的**字节**长度
2. 它的 **rune** 长度
3. 这一行按 rune 反转后的结果

```
input:  causeway
output: 8
        8
        yawesuac
```

这一行可能含有 ASCII 之外的字符，那时前两个数字就不相同。`len(s)` 是字节数。一直都是。
'''
hints = [
  "len(line) 是字节数；[]rune(line) 是解码后的结果。",
  "反转字节切片会把一个多字节字符从中间切开。",
  "两个下标从两端向中间走，边走边交换，这就是整个反转。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.basic.07.structs"
title = "收银台"
story = "Lucky Mac 的柜台往订单里加了一行，到下一行时它就没了。方法拿到的是一份副本。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<ITEM> <CENTS>`。

把这些项目收集到一个 `Till` 上，然后按到达顺序把每个项目以 `<ITEM> <CENTS>` 的格式
输出回来，最后输出 `TOTAL <sum>`。

```
input:  2
        HASHBROWN 600
        SET 2800
output: HASHBROWN 600
        SET 2800
        TOTAL 3400
```

`n` 可能为 `0`，那时唯一的一行就是 `TOTAL 0`。

值接收者上的方法拿到的是收银台的一份副本。`Add` 必须改到真正的那一个。
'''
hints = [
  "func (t *Till) Add —— 指针接收者修改的是调用方手里的那个收银台。",
  "till.Add(...) 照样能用，不必改；因为 till 是可寻址的，Go 会替你取地址。",
  "Total 只读不写，但同一个类型上的接收者要保持一致。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.basic.08.interfaces"
title = "一份列表，两种东西"
story = "希慎广场的楼层指示牌和门外的电车站牌是由两个不同的程序打印的，谁也放不进对方的列表。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每行是下面两种之一：

* `SHOP <NAME> <FLOOR>` —— 渲染为 `<NAME> / F<FLOOR>`
* `STOP <ROUTE>` —— 渲染为 `TRAM <ROUTE>`

按顺序输出每个招牌渲染后的结果，然后输出 `SIGNS <n>`，再输出 `SHOPS <k>`，其中 `k`
是其中商店的数量 —— 用**类型 switch** 数出来，而不是靠解析时留下的标记。

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        SIGNS 3
        SHOPS 2
```
'''
hints = [
  "没有 `implements` 关键字。给每个结构体一个 Render() string 方法，它就满足了 Sign。",
  "把具体的值直接 append 进 []Sign —— Go 会替你包起来。",
  "switch sign.(type) { case Shop: } 就是类型 switch；带值的写法是 switch v := sign.(type)。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.errors"
title = "不是数字的那一行"
story = "车手日志从车厂送回来，某人的午饭订单夹在数字那一列的中间。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行。每一行都应该是一个整数。

对每一行，输出该值的两倍，或者在解析失败时输出 `BAD <line>`。最后输出 `SUM <total>`，
即你输出过的那些值的总和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

定义一个哨兵错误 `var ErrNotANumber = errors.New(...)`，用
`fmt.Errorf("...: %w", ErrNotANumber)` 包装它，再在 `main` 里用 `errors.Is` 识别它。
错误是一个值；这就是它换来的东西。
'''
hints = [
  "strconv.ParseInt(s, 10, 64) 返回 (int64, error) —— 第二个值不是可以不看的。",
  "fmt.Errorf 里的 %w 让被包装的错误仍然找得到；%v 会把它压平成文本。",
  "errors.Is 会沿着包装链往下走，所以在消息被加过修饰之后它依然能匹配。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.basic.10.closures"
title = "门口计数"
story = "Lucky Mac 数着谁进门、谁出门，经理只要打烊时的那个数，中间发生什么都不管。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每行是 `IN` 或 `OUT`。

维护一个永远不会低于零的计数。每条命令之后输出它。当 `main` 返回时，输出
`CLOSED <final>` —— 要从一个 `defer` 里输出，而不是在函数末尾。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        CLOSED 2
```

计数器本身是一个闭包：一个返回函数的函数，总数被捕获在两者之间。答案里没有任何
包级变量。
'''
hints = [
  "total 活在 makeCounter 的栈帧里，返回的函数让它一直活着。这就是闭包。",
  "defer func(){ ... }() 在返回时运行，闭包是在那时才读 `last` —— 不是在写下 defer 的时候。",
  "带参数的 defer 则会在 defer 时就捕获那个值。两种都试一下，看看结果怎么变。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.basic.11.generics"
title = "一个函数，任何列表"
story = "Alex 已经把 Sum 写了四遍 —— 订单一遍、车手一遍、分钟一遍、分钱一遍 —— 第五遍马上要交。"
brief = '''
标准输入是一行用空格分隔的整数。

输出三行：

1. 每个值的两倍，用单个空格连接
2. 原始值的总和
3. 其中大于 `10` 的有多少个

```
input:  1 2 3 4 12
output: 2 4 6 8 24
        22
        1
```

写三个泛型辅助函数并使用它们：`MapSlice[T, U any]`、在 `~int64 | ~float64` 约束上的
`Sum[T Number]`，以及接受一个谓词的 `Count[T any]`。
'''
hints = [
  "MapSlice 会改变元素类型，所以它需要两个类型参数，而不是一个。",
  "调用处会从切片和函数推断出 T 和 U —— 你不用写 MapSlice[int64, string]。",
  "~int64 表示 int64 以及任何底层类型是 int64 的类型，命名类型就是这样放进来的。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.basic.12.defer-panic-recover"
title = "倒下又爬起来"
story = "以前一张坏单据就能拖垮整台收银机，连整个班次的记录一起丢掉。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行。每行是一个整数、单词 `BOOM`，或者别的什么。

写 `run(text string) (out string)`，返回该值的两倍，或者在解析失败时返回
`BAD <text>` —— 遇到 `BOOM` 时**触发 panic**，并在一个延迟函数里 recover，让调用方拿到
`RECOVERED boom` 而不是一个死掉的程序。每个输入输出一行，最后在 `main` 的一个 `defer`
里输出 `CLOSED <n>`。

```
input:  4
        21
        BOOM
        xx
        -4
output: 42
        RECOVERED boom
        BAD xx
        -8
        CLOSED 4
```

三个事实，而这三个就是全部考点：`recover` 只在延迟函数里才起作用；**具名**返回值是让
延迟函数能在 panic 之后改变返回结果的东西；`main` 里的 `defer` 在返回时运行，所以无论
循环怎么走，`CLOSED` 都是最后一行。
'''
hints = [
  "返回值必须有名字 —— out string —— 否则延迟函数没有东西可以赋值。",
  "没有 panic 时 recover() 返回 nil，所以那个 if 就是区分两条路径的方法。",
  "main 里的延迟闭包是在运行时才读 `done`，不是在写下的时候，所以它看到的是最终的计数。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.basic.13.zero-values"
title = "没有不等于没有"
story = "排班表的 map 从来没有创建过，代码从它里面读了一上午，一声抱怨都没有。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个单词。

按顺序输出四行：

1. `READ <v>` —— 一个 **nil** map 对一个它没有的键会给你什么
2. `LEN <k>` —— 把全部 `n` 个单词 append 到一个 **nil** 切片之后的长度
3. `WRITE <ok|panic>` —— 向那个 nil map 赋值有没有 panic
   （把它 recover 住；不要让程序死掉）
4. `FOUND <k>` —— 这些单词里有多少个是一个*已初始化*、预先放入 `a` 和 `b` 的 map 的键

```
input:  3
        a b c
output: READ 0
        LEN 3
        WRITE panic
        FOUND 2
```

nil map 和 nil 切片不是同一种"没有"。读 nil map 是合法的，得到的是值类型的零值；
往里写会 panic，因为根本没有表可以写进去。对 nil 切片 `append` 是合法的，而且会分配
内存 —— 所以 `var s []T` 是惯用的空切片写法，而 `var m map[K]V` 不是惯用的空 map 写法。
'''
hints = [
  "对 nil map 取 empty[\"missing\"] 不是错误 —— 它是 int 的零值，也就是 0。",
  "append 能处理 nil 切片：它会替你分配第一个底层数组，所以你从来不需要仅仅为了起步而调用 make()。",
  "那次写入必须发生在一个带有延迟 recover 的函数里，否则 panic 会在第四行之前结束程序。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.basic.14.embedding"
title = "它什么都没继承"
story = "终点站就是一个多了些东西的车站。Alex 把它写了两遍，多写了一遍。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每行是 `STOP <NAME>` 或 `TERM <NAME> <LINES>`。

给 `Stop` 一个返回其名字的 `Describe() string`。让 `Terminus` **嵌入** `Stop` 并加上
`Lines int`，再给它自己的 `Describe`，调用被嵌入的那个并追加 `(<lines> lines)`。

输出每一个的 `Describe()`，然后输出 `TERMINI <k>`，用一个对 `[]Describer` 的类型 switch
数出来。

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

嵌入不是继承。`Terminus` 没有*变成*一个 `Stop`；它包含了一个，而被包含的值的方法会被
**提升**到外层类型上，除非外层类型声明了自己的同名方法。`t.Stop.Describe()` 是你触及
被遮蔽的那个方法的方式，这里没有 `super`。
'''
hints = [
  "嵌入字段没有自己的名字 —— 在字面量里和在 t.Stop.Describe() 里都写作 `Stop`。",
  "Terminus 满足 Describer 是因为它自己的 Describe；没有的话，它会通过提升上来的 Stop 方法满足。",
  "带逗号 ok 形式的 d.(Terminus) 是类型断言；多于两种时，类型 switch 做的是同一件事。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.basic.15.variadics"
title = "有多少算多少"
story = "有时是两份订单，有时是整个货架，函数不该在乎这个。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

写 `total(values ...int64) (sum int64, count int)` —— 可变参数，带具名返回值 —— 并用三种
方式调用它。输出：

1. `ALL <sum> <count>` —— 整个切片，用 `...` 展开
2. `NONE <sum> <count>` —— 完全不带参数调用
3. `TWO <sum> <count>` —— 前两个值逐个传入，不足两个则有几个传几个

```
input:  4
        1 2 3 4
output: ALL 10 4
        NONE 0 0
        TWO 3 2
```

在函数内部 `values` 就是一个普通的 `[]int64`，不带参数时它是 `nil` —— `range` 和 `len`
都不需要特殊处理就能应付。`total(list...)` 传入的是现有的切片，而不是复制到一个新切片；
`total(list)` 无法编译，而知道为什么，就是这道题的问题。
'''
hints = [
  "有具名返回值时，一个光秃秃的 `return` 会返回 sum 和 count 当前的值。",
  "total(list...) 是展开；total(list) 试图把一个 []int64 当成单个 int64 传入，无法编译。",
  "不带参数时 values 是 nil，而 len(nil 切片) 是 0 —— 不需要保护。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.basic.16.json"
title = "标签就是契约"
story = "车厂的 API 发来小写的键，Go 导出的字段是大写的，整整一星期没人看出为什么每份订单都是空的。"
brief = '''
标准输入是一行：一个订单的 JSON 数组，每份订单有一个 `item` 字符串和一个 `cents` 数字。

把它 Unmarshal 出来，每份订单输出一行 `<ITEM> <CENTS>`，然后 Marshal 并输出一个摘要
对象，键恰好是 `count` 和 `total`，按这个顺序。如果输入不是合法的 JSON，输出 `BAD JSON`，
其他什么都不输出。

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

字段必须是**导出的**，`encoding/json` 才看得见它 —— 小写字段对 marshaller 是不可见的，
而且不会有任何提示。然后由结构体标签决定它在线路上叫什么名字。`Marshal` 按声明顺序写出
字段，所以摘要的键顺序由你决定，而不是由 map 决定。
'''
hints = [
  "标签写在类型后面的反引号里：Item string `json:\"item\"`。",
  "Unmarshal 接受一个指向目标的指针 —— 是 &orders，不是 orders —— 否则它没有东西可填。",
  "检查 Unmarshal 返回的错误。输入不合法时 orders 会留空，一个忽略这个错误的程序会愉快地打印出一份全零的摘要。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.basic.17.testing"
title = "自己证明"
story = "06:40 没有人会替你检查。表就在那里；把它变绿。"
brief = '''
程序里有一张表，列着四组已知正确的 `(km, fare)` 用例，并用每一组检查 `fare`，输出
`<name> ok` 或 `<name> FAIL got <g> want <w>`，然后输出 `PASSED <k>/4`。最后它从标准输入
读取一个距离并输出 `FARE <x>`。

`fare(km)` 应该是 `500 + 100 * km`。初始代码里的那个是错的，而这张表抓住了它 —— 这正是
全部的意义所在。

```
input:  4
output: zero ok
        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

不要碰这张表；它就是规格。这**就是** Go 的表驱动测试，只是去掉了测试框架：在真实的
包里它是 `func TestFare(t *testing.T)`，配上 `for _, c := range cases` 和
`t.Run(c.name, ...)`，由 `go test` 来运行。表在两边都是一样的。
'''
