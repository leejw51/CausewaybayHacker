# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.basic.18.nil-and-order"
title = "空指针"
story = "11:55，Lucky Mac 前台收银机。每份订单都过了机，其中有些根本不存在，收银机照样读它们。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行。每行要么是 `<NAME> <CENTS>`，要么是单独一个 `-`，
表示这份订单从未到达：切片里的一个 nil `*Order`。

把真实存在的订单按分钱数**降序**输出，相同时按名字升序，格式为 `<NAME> <CENTS>`。然后
输出 `NIL <count>` —— 缺失了多少份。

```
input:  4
        SET 2800
        -
        PIE 900
        TEA 1200
output: SET 2800
        TEA 1200
        PIE 900
        NIL 1
```

每一个 nil 都必须在任何东西解引用它之前被找出来，包括你交给 `sort.Slice` 的比较函数。
这就是这个 BOSS 的全部。
'''
hints = [
  "切片里的一个 nil *Order 没事，直到有东西去读它的字段。先过滤，再排序。",
  "strings.Fields 对 \"-\" 给出一个字段，所以 len(fields) < 2 就是你判断订单缺失的测试。",
  "降序就是 less 函数里的 >；相同时的比较是它后面的第二次比较。",
]
