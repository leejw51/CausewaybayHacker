[[quest]]
id    = "go.basic.18.binary-tree"
title = "空指针"
story = "11:55 的幸运麦当劳前台把每份订单按编号归入一棵树，树的根是 nil，而它照样顺着 nil 走下去。每一单都通过了，却一单都不存在。"
brief = '''
二叉搜索树是一个 `struct`，它的两个子节点是指向同一种 struct 的指针，空树是 `nil`。
插入是递归的：`nil` 子树变成新节点，否则值进入左子树或右子树——因为递归返回子树的新根，
你要把它赋回子节点字段。`n` 为 `nil` 时去访问 `n.Left` 程序就会死掉；`nil` 检查永远在最前面。

```
type Node struct {
	Val         int
	Left, Right *Node
}
if v < n.Val {
	n.Left = insert(n.Left, v)
} else {
	n.Right = insert(n.Right, v)
}
```

`Node`、`insert` 的 `nil` 检查、它的 `if v < n.Val` / `else`、`inorder`、`height`
和 `main` 都已写好。填两个分支：左边的赋值和右边的赋值。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "第一个分支 n.Left = insert(n.Left, v)，第二个分支 n.Right = insert(n.Right, v)。",
  "insert 返回子树的根——子节点原来是 nil 时就是一个全新的节点——所以结果必须存回子节点字段，否则树永远长不大。",
]

