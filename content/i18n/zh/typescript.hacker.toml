[[quest]]
id    = "typescript.hacker.25.test-cases"
title = "接下来是 T 组测试用例"
story = "每场笔试都用的形状，以及每个候选人至少写过一次的 bug：第二组用例记得第一组。"
brief = '''
第一行是 `T`，即相互独立的测试用例数。每组用例是一行 `n`，然后是一行 `n` 个整数 —— 当
`n` 为 `0` 时，第二行是空的。

对每组用例，输出**第二大的不同**值；如果不同的值少于两个，输出 `NONE`。全部输出完之后，
输出 `CASES <T>`。

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

这是标准的竞赛式笔试外壳，它淘汰候选人只有一个原因：本该每组一份的状态被声明在了循环
之前。每一个累加器、每一个 `Set`、每一个 `best` 都放在 `for` **里面**。

按空白分隔的词元读，而不是按行读，`n = 0` 时的空行就根本不再是特殊情况 —— 这是这种形状
教的第二件事。

还有，用比较函数给不同的值排序。`[...distinct].sort()` 把它们当字符串排，于是 `[9, 10]`
回来时是 `[10, 9]`，而第二大的值就成了拼写上碰巧更小的那个数。
'''
hints = [
  "把 `Set` 挪进循环里。这就是全部的修复，也是这道题的全部。",
  "`Set` 负责去重，`[...distinct].sort((a, b) => a - b)` 负责排序，于是 `ranked[ranked.length - 2]` 就是第二大的不同值。",
  "在只有一个元素的数组上，`ranked[ranked.length - 2]` 是 `undefined`，不是报错，而 `console.log` 会打印出 `undefined` 这个词 —— 这就是为什么长度检查要放在前面。",
]

