story = "每张单据都扫了两次，只有一张例外。他们不让你用 Map，也不让你排序。"
brief = '''
第一行是 `n`。第二行是 `n` 个非负整数，其中每个值都恰好出现两次，只有一个例外。

输出四行：

1. 只出现一次的那个值，用 **xor** 和常数额外空间求出
2. 它有多少个 `1` 位
3. 如果它是 2 的幂，输出 `POW2 YES`，否则输出 `POW2 NO`（`0` 不是）
4. 清掉最低的那个置位之后的值；如果它一个置位都没有，就是 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` 且 `x ^ 0 == x`，而且 xor 不在乎按什么顺序进行。这就是第一行的全部。
`x & (x - 1)` 清掉最低的置位，第三行和第四行就白送给你了。

这里的每个位运算符都会先把操作数转成 **32 位有符号**整数。这些用例里的值很小，所以这
不花任何代价 —— 但 `2 ** 31 | 0` 是 `-2147483648`，一个达到或超过 `2^31` 的值会一声不吭地
变成负数或被截断。越过那条线，`bigint` 有同样的运算符，而且完全没有位宽限制。在面试官
问起之前，先知道那条线在哪里。

这里的四个用例最多五个数，时钟在它们身上量的不是速度：一个计数的 `Map` 能全部通过，
排序也可以。更大的用例也不会改变这一点，因为这道题设的门槛是**空间** —— 一个累加器，
别的什么都没有 —— 而没有哪个运行时限能把常数空间的答案和 `Map` 区分开。这一条靠你的
自觉，也靠面试官，他会问的。
'''
hints = [
  "成对的值不管以什么顺序到来都会互相抵消，所以对数组折叠一遍就够了。`nums.reduce((acc, v) => acc ^ v, 0)` 就是写成一行的同一个循环。",
  "每次清掉最低位来数位，循环次数是置位的个数，而不是位宽。",
  "2 的幂恰好有一个置位，所以清掉最低的那一位后剩下零 —— 而零本身要手动排除。",
]

