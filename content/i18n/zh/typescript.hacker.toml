`DONE <how many you ordered>`。

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

Kahn 算法：数一数每个任务在等多少个东西，从什么都不等的那些开始，每取出一个任务，就把
依赖它的任务的计数减一。如果结束时还剩下任务，剩下的就是环。就绪集合是一个存任务编号的
最小堆，所以“编号最小”花的是 `log n` 而不是一次扫描 —— 和合并那道题一样的二十几行，这次
用在普通的数字上。
'''
hints = [
  "`waiting[b]` 是 b 的入度 —— 有多少条边指向它。",
  "普通队列给出的是*一个*顺序；最小堆给出的是题目要求的*那个*顺序。每次推入都把就绪数组重新排序也能给出它，代价是每次推入 `O(n log n)`。",
