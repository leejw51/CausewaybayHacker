[[quest]]
id    = "typescript.hacker.27.commands"
title = "输入本身就是问题"
story = "电车站牌的日志从机器上出来时按八十列折了行，顶上的数量数的是命令，不是单词。"
brief = '''
第一行是 `k`，即后面跟着的**命令**数。命令是以空白分隔的词元，不管怎么折行都塞在剩下的
几行里 —— 每行任意多个，间距任意，末尾可能还有一个空行。

| 命令 | 词元 | 作用 |
| --- | --- | --- |
| `ADD <cents>` | 两个 | 压入一件商品 |
| `VOID` | 一个 | 移除最后一件商品；如果没有，什么都不做 |
| `TOTAL` | 一个 | 输出当前总和 |
| `CLEAR` | 一个 | 移除全部 |

执行完 `k` 条命令后，输出 `COMMANDS <k>` 和 `ITEMS <how many are left>`。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` 数的是命令，而 `ADD` 是由两个词元组成的一条命令 —— 所以一个跑 `k` 次、每次读一个
词元的循环会停在错误的位置。读 `k` 条命令，只有当命令带参数时才取参数：词元数组里的一个
下标 `tokens[at++]` 就是游标，而 `tokens[at++] ?? ""` 让输入的末尾成为一个值，而不是
`undefined`。

在空的收银机上 `VOID`，以及在加入任何东西之前 `TOTAL`，都必须能工作。题目里没有哪一行说
它们不会发生，而在真正的笔试里，这种沉默就是规格说明。这门语言在这个边界上有两件事表现
不同：对空数组调用 `items.pop()` 不会抛出异常，它返回 `undefined` —— 在这里无害，一旦你拿
它做算术就是 `NaN` —— 而不带初始值的 `items.reduce((a, b) => a + b)` 在空数组上**会**抛出
异常。给 `reduce` 它的 `0`。
'''
hints = [
  "`input.split(/\\s+/).filter((t) => t !== \"\")` 把每一串空格、制表符和换行合并掉，所以只要你不再按行读，文件里的折行就不再要紧。",
  "在 ADD 分支里从同一个游标取 ADD 的参数。循环计数器数的是命令，不是词元。",
  "`items.reduce((sum, v) => sum + v, 0)` —— 正是那个 `0` 让空收银机上的 TOTAL 输出 0，而不是抛出 `Reduce of empty array with no initial value`。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到目前为止通关的每张地图数的都是跳数。电车不在乎有几站；它在乎每站要多久。"
brief = '''
标准输入是 `n m seed`：`n` 个站，`m` 条无向带权边。用**恰好**这个生成器自己构建图，用
会回绕的 64 位算术（一个 `bigint`，用 `BigInt.asUintN(64, …)` 回绕 —— `number` 装不下这个
状态）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

输出从站 `0` 到每个可达站的最短距离之和（包括 `0` 本身，它是 `0`），然后输出
`MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 100000`、`m = 200000`。无论如何 Dijkstra
都是正确的算法；时钟决定的是优先队列。每次扫描所有未访问的节点找最小值是 `O(V²)` ——
`10^10` 步，在这台机器上花了**二十六秒**，而运行时限是十秒。二叉堆让它变成
`O((V + E) log V)`，大约四分之一秒就完成。两者都在这台机器上、用这道题附带的两个程序实测
过：初始代码就是扫描的版本。

值得看清楚，因为这是在限时笔试里失败最常见的方式：**初始代码并没有错。**它打印的答案完全
正确。它被拒绝，只是因为来得太晚了。

标准库里没有优先队列；堆得你自己写，和归并那道题里的是同一个，条目是 `[distance, node]`，
按距离排序。它不需要 decrease-key：把改进后的距离作为新条目压进去，弹出时如果某个条目的
距离已经比你记录的更差，就跳过它。这个"过期条目"的跳过就是人们会忘掉的那一行，没有它，
堆会无限增长。
'''
hints = [
  "`[distance, node]` 条目，只按距离比较。`Float64Array(n).fill(Infinity)` 就是距离表，Infinity 是诚实的\"未到达\"。",
  "`if (d > dist[u]) continue;` 就是过期条目的跳过。没有它，算法仍然正确，而堆会塞满作废的条目。",
