[[quest]]
id    = "typescript.hacker.13.backtracking"
title = "每一种组合"
story = "列出这家店所有可能的布置方式。全部，按固定顺序，同一种不要输出两次。"
brief = '''
第一行是 `n`。第二行是 `n` 个互不相同的整数，**已经按升序排好**。

输出每一个子集，每行一个，值用空格分隔，空子集写作 `-`。按显而易见的那种递归产生它们的
顺序排列：在每个位置，先走**选取**这个元素的分支，再走跳过它的分支。然后输出
`SUBSETS <2^n>`。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

推入，递归，**弹出**。弹出是人们漏掉的部分，症状是第一行之后的每一行都太长。那一个共享的
`chosen` 数组正是重点：每次调用都写 `[...chosen, x]` 也是对的，但它为了省写一行，在每一层
都把整个选择复制一遍。这里的顺序是递归自身的顺序，而被检查的正是它。

对于 `2^n`，`1 << n` 是 32 位移位，从 `n = 31` 起就错了；反正你输出的行数才是诚实的数字。
'''
hints = [
  "每个元素两次递归调用：一次推入它，一次不推入。先选取，样例里的顺序就自然出来了。",
  "`chosen.pop()` 放在两次调用之间。那就是 try-recurse-undo 里的 `undo`。",
  "基准情形是 `at === nums.length`，而那时空的选择就是空子集，它照样算数。空数组上的 `chosen.join(\" \")` 是空字符串，所以 `-` 得你自己写。",
]

