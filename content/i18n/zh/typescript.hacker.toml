  "对数字网格来说，`grid.map((row) => row.slice())` 就是足够深的复制；`grid.slice()` 和 `[...grid]` 都少了一层。",
  "螺旋循环里的两个 `if` 守卫，是防止单独剩下的中间一行或一列被走两次的东西。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.hacker.22.trie"
title = "前缀盒"
story = "电车站牌的自动补全 —— 诚实的那种，只补全列表上真正有的。"
brief = '''
第一行是 `n q`。接下来的 `n` 行是要插入的小写单词。再接下来的 `q` 行是查询，每行是
`WORD <s>` 或 `PREFIX <s>`。

构建一棵 trie —— 一棵由节点组成的树，每个节点持有一个从字母到子节点的映射 —— 然后回答：

* `WORD <s>` → 如果 `s` 被插入过，输出 `YES`，否则输出 `NO`
* `PREFIX <s>` → 插入的 `n` 个单词里有多少个以 `s` 开头

这 `n` 个单词不保证互不相同，而 `PREFIX` 数的是**插入次数**，不是不同的单词：把 `tram`
插入两次，`PREFIX tram` 就是 `2`。`NODES` 数的是节点，所以第二次插入不增加节点。

然后输出 `NODES <k>`，即 trie 中包括根在内的节点数。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

在每个节点上记一个计数，表示有多少个插入的单词经过它，这样 `PREFIX` 就是一次走到底、
末尾不用再数的遍历。节点是一个小类；子节点是一个以字母为键的 `Map<string, TrieNode>`。
普通的 `{}` 在单个字母上能活下来，问题在于这个习惯：一旦拿整个单词当键，
`"constructor" in {}` 就已经是 `true` 了，回答它的是一个你从没插入过的原型。`Map` 没有
继承来的键可以绊倒你。
'''
hints = [
  "缺失的子节点 `children.get(letter)` 返回 undefined，而 undefined 既是插入时要新建一个的信号，也是查找时停下来的信号。",
  "`through` 是在你*踏上*的那个节点上加一，所以根永远不会数到自己。",
  "走出 trie 的查询会让游标变成 `undefined`，而 `TrieNode | undefined` 让 tsc 问你：这种情况下 NO 和 0 是什么样子。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.hacker.23.prefix-sums"
title = "有多少种方法凑中目标"
story = "一天的营业额，和一个审计员想看到的数。有多少段连续的小时加起来恰好等于它。"
brief = '''
第一行是 `n k`。第二行是 `n` 个整数，可能是负数。

输出有多少段连续子段的和恰好为 `k`，然后输出 `RANGE <s>`，即整个列表的和，从最后一个
前缀和读出，而不是再加一遍。

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

负值会让滑动窗口失效 —— 一个太大的窗口没法靠缩小来修正。活下来的是前缀和：一段 `i..j`
的和为 `k`，当且仅当 `prefix[j] - prefix[i] == k`，所以数一数之前有多少个前缀等于
`prefix[j] - k`。给 map 预先放进 `0 → 1`，用于从开头起算的那些段。

用 `Map<number, number>` 做键。普通对象也会接受前缀作为键，却把它作为**字符串**交还给你：
`{ [-2]: 1 }` 的 `Object.keys` 是 `["-2"]`。类型说的是 `number`；运行时没有守住它。

这里的四个用例最多五个数，时钟在它们身上量的不是速度：遍历每个起点和每个终点的 `O(n²)`
双重循环能通过全部四个。门槛是真实存在的 —— 在一整天的营业额上，那个双重循环要跑好几分钟
—— 但它不是这些用例要检查的。它们检查的是容易出错的那部分：`0 → 1` 这个种子，以及先查
再记。
'''
hints = [
  "先查之前的前缀，*再*记录当前的前缀，否则当 k 为 0 时，长度为零的段会把自己数进去。",
  "一开始就 `new Map([[0, 1]])`，正是这一点让从下标 0 开始的段能被找到。",
  "`seen.get(prefix - k) ?? 0` —— 用 `??` 而不是 `||`，后者在这里其实也对，但只是碰巧：它替换掉的计数刚好是 0。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.hacker.24.inversions"
title = "被时钟抓住的那一道"
story = "下午回合的第一题。朴素的答案是正确的，也是错误的答案。"
brief = '''
标准输入是两个整数 `n` 和 `seed`。输入里没有数组 —— 你用**恰好**这个生成器自己构建它，
用会回绕的 64 位算术：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

数出**逆序对**：满足 `i < j` 且 `a[i] > a[j]` 的对。输出这个数，然后输出
`MAX <largest value>`。

```
input:  8 1
output: 19
        MAX 908834774
```

对于 `8 1`，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。

**这道题强制要求复杂度，而且只有这一类题能做到。** 有一个隐藏用例是 `n = 200000`。
`O(n²)` 的双重循环 —— 也就是初始代码 —— 是 `2 × 10^10` 次比较，在这台机器上跑了
**四十二秒**，而运行时限是十秒。在归并排序过程中数逆序对是 `O(n log n)`，大约十分之一秒
就完成。在这台机器上，用这两个程序实际测过。

有三件事这门语言的决定不一样。生成器的状态放不进 `number` —— 它是一个 double，只精确到
`2^53` —— 所以它是一个 `bigint`，每一步之后都用 `BigInt.asUintN(64, …)` 回绕。答案
`9990744366` 放不进 32 位整数；`number` 能精确地装下它，而且只要没有东西对它用 `| 0` 或
`>>`，它就一直是精确的。还有，`Math.max(...values)` 会把二十万个参数展开到调用栈上，在这台
机器上它先是一个 `RangeError`，然后才轮得到答案：用循环求最大值。
'''
hints = [
  "排序之前先用循环求最大值，或者对一份副本排序：原地进行的归并排序会把原数组重新排序。还有，不要把 200000 个值展开进 `Math.max`。",
  "当右半边的值在归并中胜出时，左半边剩下的每个元素都比它大 —— 那一下就是 `mid - i` 个逆序对，这就是全部的窍门。",
  "递归深度是 log2(200000)，大约十八层 —— 离上限远着呢。通过一个只分配一次的临时缓冲区来归并，而不是在每一层都切出新数组。在压缩后的值上建一棵 Fenwick 树是另一个 O(n log n) 答案，在房间里值得提一句。",
]

