[[quest]]
id    = "typescript.hacker.30.range-queries"
title = "不断变化的总数"
story = "整条连锁店一天四百万次收银操作，一半是更正，而有人要的是滚动总额。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后执行 `q` 个操作，全部来自同一个生成器，
用会回绕的 64 位算术（一个 `bigint`，用 `BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

输出所有查询答案的累计总和，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里的复杂度是强制的。** 朴素的答案 —— 每次查询都把 `values[l..r]` 加一遍 —— 每次查询
是 `O(n)`，而在紧凑数组上的紧凑循环快到在任何小规模上都有欺骗性。所以大的隐藏用例是
`n = 500000, q = 4000000`，和 Rust、Go、C++ 跑的规模一样。在三十万次操作时 —— 也就是这道题
Python 版本用的规模 —— 朴素循环在这里花了**十七秒**，已经超过十秒的运行时限，而大用例的
操作数是它的十三倍。Fenwick 树跑完全部四百万次不到**半秒**。两者都用这道题里的两个程序实测
过。

这就是面试官想钓出来的那一课：*单点更新、区间求和*正是 Fenwick 树为之而生的形状。三个短
函数 —— add、prefix，以及作为两个前缀之差的 range —— 而 `i & -i` 是你按最低置位迈步的方式。
那是一个 32 位运算，而它在这里是精确的，因为每个下标都小于 `2^31`。总和则不是：它在大用例
上会超过 `2^32`，而 `number` 能精确地装下它，只是因为它保持在 `2^53` 以下。
'''
hints = [
  "对每个初始值调用一次 add 来建树。O(n) 的自底向上建树是个不错的优化，但不是时钟要测的东西。",
  "`i & -i` 分离出最低的置位。加上它就沿树往上走；减去它就往下走。",
  "`range(l, r)` 是 `prefix(r + 1) - prefix(l)`，把这一对差一处理对，就是调试的大部分工作。用 `Float64Array(n + 1)` 做树，能精确地存放这些和，也永远不会变成混合类型的数组。",
