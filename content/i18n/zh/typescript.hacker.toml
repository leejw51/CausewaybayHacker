标准输入是 `n alphabet seed`。自己构建字符串，用会回绕的 64 位算术（一个 `bigint`，用
`BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

输出最长回文子串的长度，然后输出 `AT <index>` —— 该长度中**最靠左**的那一个的 0 基起始
下标。

```
input:  12 3 5
output: 5
        AT 1
```

围绕每个中心向外扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符是奇数长度回文的中心，
而两个字符之间的每个空隙是偶数长度回文的中心。忘了空隙，就是为什么一个看起来正确的解法
在 `abba` 上返回 `1` —— 而初始代码正是这么做的。

**测试强制什么、不强制什么**，直说。真正起作用的隐藏用例是在**单**字母字母表上的
`n = 8000`。它是中心扩展法的最坏情况 —— 每个中心都一路跑到字符串末尾 —— 所以正确答案在
那里做满 `O(n²)`，三千二百万次字符比较，在这台机器上大约十分之一秒完成。它也会拒绝
"检查每个子串并逐一测试"的做法，那是立方级的：在这个规模上是 `10^11` 量级的比较，而时限
是十秒。

另一个大用例是在两字母字母表上的 `n = 20000`，它是**正确性**用例，不是速度用例：在随机的
二进制字符串上，回文测试一两个字符之后就会失败。它检查的是你的生成器和你的最靠左下标平局
处理在大规模上与我们的一致。

所以：测试拒绝立方级，接受平方级。它们**不**要求 Manacher 算法，也就是 `O(n)` 的答案。
要知道它存在、它做什么，因为"你能做得比平方级更好吗？"正是这道题通常被拿来铺垫的追问。
'''
hints = [
  "每个中心两次扩展：(c, c) 对应奇数长度，(c, c + 1) 对应偶数长度。初始代码缺了第二个。",
  "循环停下时，i 和 j 都已经越过回文一步 —— 所以它从 i + 1 开始，长度是 j - i - 1。",
  "只在回文严格更长时才更新，这样每个长度保留的就是最靠左的那一个。还有，这里的边界检查不是可有可无的：两头同时越界时，`s[i]` 和 `s[j]` 都是 `undefined`，`undefined === undefined` 为真，而在单字母字符串上循环永远不会停。",
