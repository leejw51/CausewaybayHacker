[[quest]]
id    = "typescript.hacker.32.modular"
title = "模十亿零七"
story = "这个短语出现在题目底部，房间里一半的人不知道它在要求他们做什么。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询，用会回绕的 64 位算术（一个 `bigint`，用
`BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询，计算二项式系数 `C(a, b)` **模 1000000007**。输出全部 `q` 个答案之和（它本身也
模 `1000000007`），然后输出 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这样的规模下，`C(a, b)` 有几十万位，所以每次乘法都要边算边取模。问题在于除法：
`a! / (b! (a-b)!)` 在模算术里没有意义。取代它的是**模逆元**，而因为 `1000000007` 是质数，
费马小定理把它交给你：`inverse(v) = v^(p-2) mod p`，用反复平方来算。

所以：预先计算一次 `factorial[0..n]`，然后把每个查询答成
`f[a] * inv(f[b]) * inv(f[a-b])`。

**而这里有这门语言加进来的陷阱。** 两个因子都小于 `2^30`，所以乘积小于 `2^60` —— 而
`number` 是一个 double，只精确到 `2^53`。用普通数字写 `a * b % P` 不会溢出，不会抛异常，
而且是错的：用它的话，连样例都会得出 `504334178`。要么用 `bigint` 做乘法，要么把一个因子
拆成两个 15 位的半边，让任何中间结果都不超过 `2^46` —— 初始代码里已经带着那个 `mulmod`，
而它值得你能自己推导出来。

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 200000`、`q = 200000`。每个系数独立计算
—— 乘 `b` 项，除 `b` 项，每次一个模逆元 —— 在这里三十秒后还没跑完，而运行时限是十秒；
那就是初始代码。一张共享的阶乘表大约十分之一秒就完成。两者都在这台机器上实测过。
'''
hints = [
  "每次乘法之后都取模，而且永远不要用裸的 `*` 乘两个余数：超过 2^53 后，double 保留高位、丢掉低位，而低位正是答案。",
  "`powmod(v, P - 2)` 就是模逆元，而它之所以成立，只因为 P 是质数 —— 这就是费马小定理在这里的全部内容。",
  "把阶乘的逆元也预先算好 —— `inverse[n] = powmod(factorial[n], P - 2)`，然后往下走 `inverse[i - 1] = inverse[i] * i` —— 就能把两次幂运算从每个查询里去掉。每个查询只剩两次 `mulmod`。",
]

