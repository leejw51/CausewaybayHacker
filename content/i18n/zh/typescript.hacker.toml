输出**顺时针旋转 90°** 后的网格，`n` 行空格分隔的值。然后在一行里按**螺旋顺序**输出它
的值 —— 从左上角开始顺时针走最外圈，再往里。

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

旋转是要原地做的那个：先转置，再把每一行反转。把这一点说出来，题目就答了一半。
`row.reverse()` 原地反转并交回同一个数组，这在这里正是你要的，而在任何你本想保留原数组
的地方都是个意外。

螺旋要的是原来的网格，所以旋转之前先复制一份：每一行都复制，`grid.map((row) => row.slice())`。
`[...grid]` 只复制外层数组，每一行仍和原来的共用，接着旋转就会同时写穿两份。
