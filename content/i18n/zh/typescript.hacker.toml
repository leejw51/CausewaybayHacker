[[quest]]
id    = "typescript.hacker.28.lru"
title = "擦除"
story = "第六场面试，7-32 房。类型在运行时已经不在了，时钟还在。"
brief = '''
第一行是 `cap q`，然后要么是 `q` 行操作，每行是
`PUT <key> <value>` 或 `GET <key>` —— 要么，当第一行带有**第三个**数 `seed` 时，后面没有
任何行，`q` 个操作来自下面的生成器。

实现一个固定容量的缓存，满了的时候淘汰**最近最少使用**的条目。`GET` 和 `PUT` 都算作使用
一个键。对缓存里已有的键 `PUT`，会替换它的值并让它成为最近使用的 —— 它不新增条目，所以
无论缓存多满，它都不淘汰任何东西。

对每个 `GET` 输出值；如果不在缓存里，输出 `-1`。最后输出幸存的键，最近使用的在前，空格分隔
—— 如果缓存为空则输出 `-` —— 然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把样例走一遍：`GET 1` 让 `1` 重新变成最近使用的，所以当 `PUT 3` 需要空间时，走的是 `2`。
`GET 2` 未命中。`GET 3` 命中并让 `3` 成为最近使用的，这就是为什么幸存者输出为 `3 1`。

生成的形式，用会回绕的 64 位算术（一个 `bigint`，用
`BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**初始代码在 `strict` 下编译得干干净净，而它是错的。** 它把缓存放在一个
`Record<number, number>` 里，并倚仗一个人人都记得一半的事实：对象按插入顺序保存它的键。
所以一次"使用"就是删除再重新插入，而最冷的条目是 `Object.keys(cache)[0]`。在样例上跑它，
`GET 2` 打印出 `20`。

这就是 boss。类型说键是 `number`，而类型在运行时已经不在了：对象的键是**字符串**，
`Object.keys` 把它们作为 `"1"` 和 `"2"` 交还给你，而插入顺序规则有一个为恰好这些键写进语言
里的例外 —— **类似整数的键排在最前面，按数值升序**，不管它们是在哪里插入的。删掉 `1` 再
放回去，丝毫不改变它排在哪里。淘汰移除的是最小的键，而不是最冷的那个，而 tsc 对此一个字
都说不出来，因为程序里没有任何东西类型不对。它检查的每一样东西，在它检查的时候都是真的。

修复就是一个真正表达了初始代码所假设的含义的结构：`Map`。它的键保持为 `number`，它的迭代
顺序就是插入顺序，没有例外。`delete` 再 `set` 就是一次"使用"，`cache.keys().next().value` 是
冷的一端，`[...cache.keys()].reverse()` 是最近使用的在前 —— 而这一切每次操作都是 `O(1)`，
在其他语言里这靠一个指向双向链表的哈希 map 得到，在这里 `Map` 把指针藏起来给了你。

（在这场面试的 Python 版本里，boss 是递归深度限制，而那个两千次操作的隐藏用例仍然在这里。
Node 的栈大约有一万层深，所以一个"处理头部再对尾部递归"的版本能通过它 —— 这是关于这份
输入的一个事实，而不是写那种代码的理由。一串操作就是一个 `for` 循环。）
'''
hints = [
  "拿初始代码手动跑一遍样例，每次操作之后打印 `Object.keys(cache)`。你看到的顺序不是你插入的顺序。",
