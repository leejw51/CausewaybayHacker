title = "穿过街区，绝不回头"
story = "外卖配送网格，有三条街因为搭竹棚封了。有多少种走法过去，哪一种最便宜。"
brief = '''
标准输入是 `r c pct seed`。按行优先顺序自己构建网格，每个格子抽**两个**值，用会回绕的
64 位算术（一个 `bigint`，用 `BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，只能经过开放的格子。输出：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同路线，模
   `1000000007`
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都计入；如果没有路线，输出 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序扫一遍就能同时做完两件事：一个格子的路线数是从上方和从左方进入它的路线数
之和，而它的最佳代价是它自己的代价加上这两者中较便宜的那个。因为你只会向右或向下走，
你需要的那两个格子总是已经算完了 —— 这就是为什么这道题不需要递归，也不需要 visited 集合。
带记忆化的递归在格子数上也是线性的，而在 `1000 × 1000` 的用例上它会有两千层深。Node 的栈
撑得住，但这不等于它就是答案：循环根本没有深度，而 `2000 × 2000` 的追问只差一个问题。

`PATHS` 计数取模 `1000000007` 是出于惯常的理由：在 `1000 × 1000` 的隐藏用例上，真实的数有
六百多位。在这里这不是风格问题。`number` 在最初几十行之内就会越过 `2^53` 不再精确，然后
悄悄打印出一个错误的余数，所以要边加边取模 —— 两个小于 `1000000007` 的余数之和小于
`2^31`，那是精确的。

**大用例强制的是：**它拒绝任何枚举路线的答案。路线比这个房间里的原子还多。

一百万个格子放在 `number[][]` 里，就是分散在一千个数组里的一百万个装箱槽位；一个扁平的
`Float64Array(r * c)`，用 `i * c + j` 做下标，是一整块内存，代码也一样。
'''
hints = [
  "每个格子都抽两个值，包括两个角 —— 生成器不会跳过它们，只是拒绝把它们封掉。",
  "一个开放的格子，如果上方和左方都没有可达的邻居，那么到达它的路线数是零，也没有最佳代价。`Infinity` 是诚实的\"不可达\"：`Math.min` 会忽略它，而 `Infinity + cost` 仍然是 `Infinity`。",
  "终点可以是开放的却仍然不可达，这恰好就是 PATHS 为 0、MIN 为 -1 的时候。有一个隐藏用例就是这样。",
]

