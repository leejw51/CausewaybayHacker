[[quest]]
id    = "typescript.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个车手得分相同，时代广场大屏幕上的排行榜每次重绘都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个车手，第 `i` 个车手的下标是 `i`，并有一个分数，用
会回绕的 64 位算术（一个 `bigint`，用 `BigInt.asUintN(64, …)` 回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分数**降序**给车手排序。分数相同的车手必须保持他们到达的顺序。输出他们的下标，空格分隔，
然后输出 `TIES <k>` —— 你排好的顺序里有多少对相邻的车手分数相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎所有东西都是平局，而答案几乎完全取决于它们被怎样处理。

**这道题考的是你知不知道自己手里拿的是哪种排序。**
从 ES2019 起，`Array.prototype.sort` 就被要求是**稳定**的，而 V8 从 2018 年起就一直守着这个
承诺。*不*稳定的是先升序排序再调用 `.reverse()`：那会把平局连同其他一切一起反转，而初始
代码正是这么做的。在样例上它明显把它们打乱了；在真实输入上它总会这样。

有两个正确答案，你应该两个都能给出。用比较函数降序排序 —— `(a, b) => b.score - a.score`
—— 剩下的交给稳定性。**或者**让比较成为**全序** —— `b.score - a.score || a.index - b.index`
—— 这样没有任何两个元素会比较为相等，稳定性也就不再是个问题。第二种是默认应该用的；全序
没有什么需要证明的，包括在比那个承诺更老的引擎上。

还有，比较函数不是可有可无的。不带比较函数的 `sort()` 会把车手当作它们的 `toString` 给出的
字符串来比较，而对象的 `toString` 对每一个都是 `[object Object]`。

时钟在这里量的不是速度，也没有什么可量的：你写哪一种，`sort` 都是 `sort`。这四个用例完全
取决于平局被怎样处理。这道题讲的是知道你的排序承诺了什么，而不是它守承诺守得多快。
'''
hints = [
  "删掉 `.reverse()`，把比较函数反过来写成 `b.score - a.score`。这就是稳定的答案，而这门语言承诺了它。",
  "另一个答案是 `b.score - a.score || a.index - b.index` —— 全序，所以不再有平局可以不稳定。",
  "TIES 数的是排好的顺序里相邻的相等分数，不管你写的是两种中的哪一种，这个数都一样 —— 露馅的是下标的顺序。",
]

