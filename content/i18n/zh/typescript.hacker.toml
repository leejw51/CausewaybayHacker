[[quest]]
id    = "typescript.hacker.26.statistics"
title = "六位小数"
story = "他们要的是按规格说明书的方式舍入的数字，而不是你的语言碰巧打印出来的样子。"
brief = '''
第一行是 `n`。第二行是 `n` 个整数。

输出三行，每行保留**六位小数**：平均数、**总体**标准差（除以 `n`，不是 `n - 1`），以及
中位数 —— 当 `n` 为偶数时，它是中间两个值的平均。

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

这道题用 `match = "float:1e-6"` 评判，所以比较是按数值进行的：`3.8` 和 `3.800000` 都能
通过，差了 `1e-7` 的值也能通过。这是有意的 —— 重点不在你的格式化，而在于
`Math.floor(sum / n)` 给出的是 `3`，以及偶数长度的中位数是人们在时钟下容易弄错的边界。

是总体，不是样本。这里没有统计模块，所以公式得你自己写：偏差平方的平均数，再
`Math.sqrt`。除以 `n - 1` 得到的是样本标准差，而在真正的笔试里，两者的差别就是整份提交。
`x.toFixed(6)` 就是六位小数。

求中位数要先排序，而且要按**数字**排：不带比较函数的 `values.sort()` 会把 `10` 排在 `9`
前面。
'''
hints = [
  "两个数之间的 `/` 本来就是真除法 —— 没有会让你不小心掉进去的整数除法。初始代码是故意用 `Math.floor` 这么做的，把小数部分扔掉了。",
  "总体标准差：`Math.sqrt(sum of (v - mean) ** 2 / n)`。除以 n - 1 是样本标准差，在这里是错的。",
  "个数为偶数时，中位数是 `values[n / 2 - 1]` 和 `values[n / 2]` 的平均，而那个减法正是差一错误藏身的地方。先用 `(a, b) => a - b` 排序。",
]

