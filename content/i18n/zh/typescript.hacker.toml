[[quest]]
id    = "typescript.hacker.15.topo-sort"
title = "按什么顺序构建"
story = "招牌控制室的构建背后有十一个包和一张依赖图。说出一个安装顺序，或者说出那个意味着不存在顺序的环。"
brief = '''
第一行是 `n m`：`n` 个任务，编号 `0..n-1`，以及 `m` 条边。接下来 `m` 行是 `<a> <b>`，
表示 `a` 必须在 `b` 之前构建。

在一行里输出一个构建顺序，用空格分隔。当同时有几个任务就绪时，取**编号最小**的那个，
