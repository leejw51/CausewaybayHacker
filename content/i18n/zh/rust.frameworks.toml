# RUST LAND — FRAMEWORKS, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/frameworks.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "rust.frameworks"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.frameworks.01.anyhow-context"
title = "一个问号"
story = "回到支付链路的第一个早晨。告士打道旁的结算读取器在一个 4000 行文件的第 3 行就死掉了，只说了一句 “invalid digit found in string”。"
brief = '''
从标准输入读取若干行 `<ACCOUNT> <CENTS>`，输出以分为单位的总额，格式为 `TOTAL <n>`。

如果某一行不是两个字段，或者金额（分）解析不成 `i64`，就改为只输出一行，并正常退出：

```
ERROR: line 3: invalid digit found in string
```

这正是 `anyhow` 自己对带一层上下文的错误的呈现：`format!("{:#}", err)` 输出上下文、一个冒号，然后是原因。上下文是 `line <n>`（从 1 开始计）。出错时不输出任何别的东西。

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

用 `anyhow::Result` 作为干活的那个函数的返回类型，用 `?` 传播错误，用 `.with_context(|| ...)` 说明是哪一行。起始代码直接 unwrap 然后 panic，打印一段栈回溯并以 101 退出 —— 那不是现场任何人能读懂的消息。
'''
hints = [
  "`use anyhow::{Context, Result};` —— `Result<T>` 就是 `Result<T, anyhow::Error>`，而 `?` 会把任何 `std::error::Error` 转换进去。",
  "`.with_context(|| format!(\"line {n}\"))` 对 `Result` *和* `Option` 都可用（`Option` 会变成带该消息的错误）。把它接在 `?` 之前。",
  "对 `anyhow::Error` 用 `{:#}` 会在一行里输出 `context: cause`；普通的 `{}` 只输出最外层的上下文。",
  "缺字段是 `None`，不是解析错误：用 `.ok_or_else(|| anyhow!(\"missing amount\"))` 把它变成错误，并给它同样的 `line n` 上下文。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.frameworks.02.thiserror-enum"
title = "有名字的错误"
story = "转账服务对每一次拒绝都回同一句 “bad transfer”，楼上两层的客服台已经开始打电话问工程师到底是哪一种。"
brief = '''
两个账户 `A` 和 `B`，初始余额在第一行。第二行是 `n`，然后是 `n` 笔转账 `<FROM> <TO> <CENTS>`。

按顺序执行。对每一笔输出 `OK <FROM> <TO> <CENTS>`，或者输出错误 —— 而错误是一个有三个变体的 `thiserror` 枚举，其 `Display` 必须严格为：

* `unknown account X` —— `FROM` 或 `TO` 不是 `A` 或 `B`（先检查 `FROM`）
* `insufficient funds in A: need 300, have 100`
* `nothing to move` —— 金额为零或负数

转账全部处理完后输出 `A <balance>` 和 `B <balance>`。

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

用 `#[derive(Debug, thiserror::Error)]` 定义这个枚举，把每条消息放进各自的 `#[error("...")]` 属性里，字段用插值 —— 元组变体用 `{0}`，命名字段用 `{need}`。`transfer` 返回 `Result<(), TransferError>`，`main` 用 `{}` 打印。起始代码有完整的逻辑，但对一切都输出 `bad transfer`。
'''
hints = [
  "在枚举上写 `#[derive(Debug, thiserror::Error)]`，在每个变体上写 `#[error(\"...\")]`，这就是 `impl Display` 和 `impl std::error::Error` 的全部。",
  "属性里的 `{0}` 是元组变体的第一个字段；`{need}` 和 `{have}` 是结构体变体的命名字段。",
  "先检查两个账户名再检查金额，先检查 `FROM` 再检查 `TO`：隐藏用例会发 `C B 0`，而任务说明里写了哪个错误优先。",
  "签名改为 `Result<(), TransferError>`；之后 `main` 里的 `println!(\"{e}\")` 输出的就是属性里的文本。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.frameworks.03.serde-derive"
title = "线上的形状"
story = "怡和街的刷卡终端把订单以 JSON 发过来。旧的读取器靠数逗号找金额，于是名字里带逗号的商户一直被付到了错的那一列。"
brief = '''
标准输入是一个 JSON 数组，内容是订单。每个订单是一个对象，带 `"id"`（数字）、`"merchant"`（字符串）和 `"cents"`（数字）。

每个订单输出一行，按到来的顺序，`<id> <merchant> <cents>`，然后输出 `TOTAL <sum of cents>`。

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

定义带这三个字段的 `struct Order`，给它 `#[derive(Deserialize)]`，让 `serde_json::from_str::<Vec<Order>>` 来读。起始代码按逗号切分。对象的键可以是任意顺序、带任意多的空白，字符串里也可以含逗号 —— 这正是要点。
'''
hints = [
  "`use serde::Deserialize;`，并在结构体上写 `#[derive(Deserialize)]` —— 字段名就是 JSON 的键，类型规定了每个键必须是什么。",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` —— 左边的类型就是告诉 serde 要构造什么的东西。",
  "键的顺序和空白是 JSON 的事，不是你的；serde 能读任何带这三个键的对象。打印还是原来那个循环。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.frameworks.04.serde-attributes"
title = "银行读的是什么"
story = "银行每周两次打回怡和街的结算文件：每张从未授权的卡都以 `\"authCode\":null` 发出去，而唯一一台不报手续费的终端会在文件写出之前就让读取器停住。"
brief = '''
标准输入是一个 JSON 数组，内容是来自终端的结算记录。每条记录有 `"terminalId"`（字符串）、`"merchant"`（字符串）、`"amountCents"`（数字），并且可能有也可能没有 `"feeCents"`（数字）和 `"authCode"`（字符串）。键可以是任意顺序。

每条记录输出一行，按输入顺序：银行想要的那种记录形式，即 `serde_json::to_string` 生成的紧凑 JSON，键按这个顺序、拼写严格如下 —— `terminalId`、`merchant`、`amountCents`、`feeCents`、`authCode`。缺少的 `feeCents` 写成 `0`；缺少的 `authCode` **直接省略**，绝不写成 `null`。然后输出 `NET <sum of amountCents minus feeCents>`。

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

一个结构体负责两个方向：`#[derive(Serialize, Deserialize)]`，字段用 snake_case，结构体上加 `#[serde(rename_all = "camelCase")]`，`fee_cents` 上加 `#[serde(default)]`，`auth_code: Option<String>` 配上 `#[serde(skip_serializing_if = "Option::is_none")]`。`to_string` 按结构体声明的顺序写出字段，所以输出是精确的。起始代码逐个字段手工改名，读不了没有手续费的记录，还会写出 `null`。
'''
hints = [
  "`use serde::{Deserialize, Serialize};` —— 一个结构体，两个 derive。结构体上的 `#[serde(rename_all = \"camelCase\")]` 取代了每个字段各自的 `rename`。",
  "`fee_cents: i64` 上的 `#[serde(default)]` 用 `i64::default()` 也就是 `0` 填补缺失的键。没有它，一条没有手续费的记录就是一个反序列化错误。",
  "`Option<String>` 本来就把缺失的键读成 `None`；需要 `#[serde(skip_serializing_if = \"Option::is_none\")]` 的是*写出*这一侧，否则它会序列化成 `null`。",
  "`serde_json::to_string(record)` 给出按结构体字段顺序的紧凑 JSON；用 `println!` 输出，一条记录一行。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.frameworks.05.json-value-walk"
title = "每片叶子一行"
story = "波斯富街上一家新的终端供应商发来一个嵌套对象，没人为它写过结构体，而客服台想今天就看到里面有什么，而不是等结构体写好之后。"
brief = '''
标准输入是一个 JSON 文档，顶层是对象或数组。把每个叶子值以 `<path> = <value>` 输出，一个一行。

* 对象的键按**排序后的顺序**访问（键的字节序 —— 这正是 `serde_json::Value::Object` 的迭代顺序）；数组的元素按下标顺序。
* 路径是用 `.` 连接的键，数组下标写成 `[i]`：`terminal.id`、`orders[0].cents`，根数组里的数组则是 `[1][0]`。键里不含点或方括号。
* 字符串输出时不带引号。数字、`true`、`false` 和 `null` 按 JSON 的写法输出（`1.5` 还是 `1.5`，`null` 就是单词 `null`）。
* 空对象或空数组没有叶子，什么都不输出。

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

用 `serde_json::from_str::<serde_json::Value>` 解析，写一个递归的 `walk(path: &str, value: &Value)`，匹配 `Value::Object`、`Value::Array` 以及其余情况。起始代码只走顶层，找到什么就打印什么，所以嵌套对象会以一行 JSON 的形式出来，而根数组会 panic。
'''
hints = [
  "`use serde_json::Value;` 以及 `let doc: Value = serde_json::from_str(&input)?;` —— `Value` 是一个枚举：`Null`、`Bool`、`Number`、`String`、`Array(Vec<Value>)`、`Object(Map<String, Value>)`。",
  "递归带着路径走：`fn walk(path: &str, value: &Value)`。对对象，`for (key, child) in map` 本来就是按键排序的顺序；对数组，`iter().enumerate()` 给出下标。",
  "路径每层长一段：`format!(\"{path}.{key}\")`，除非 `path` 为空（那就只有键本身）；下标则是 `format!(\"{path}[{i}]\")`。",
  "`Value::String(s) => println!(\"{path} = {s}\")` 不带引号地输出字符串；`other => println!(\"{path} = {other}\")` 用的是 `Value` 自己的 `Display`，即紧凑 JSON —— `null`、`true`、`1.5`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.frameworks.06.toml-config"
title = "服务文件"
story = "告士打道的结算服务手工索引它的配置表，第二个 `[[upstream]]` 覆盖了第一个；从周二起每一笔结算都走了备用线路。"
brief = '''
标准输入是一份 TOML 格式的服务配置：

* 顶层：`name`（字符串，必填）、`port`（整数，默认 `8080`）
* 表 `[limits]`（必填）：`max_cents`（整数，必填）、`retries`（整数，默认 `3`）
* 表数组 `[[upstream]]`，零个或多个，每个带 `name` 和 `url`（字符串，必填）以及 `timeout_ms`（整数，默认 `1000`）

输出摘要 —— 一行 `SERVICE`，一行 `LIMIT`，然后每个表按文件顺序各输出一行 `UPSTREAM`：

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

如果输入不是合法的 TOML，或者不是这个形状（缺少必填键、值的类型不对），就只输出一行 `ERROR: config rejected` 并正常退出。不要打印 toml 自己的消息。

用结构体描述这个形状 —— `Config`、`Limits`、`Upstream` —— 各自 `#[derive(Deserialize)]`，默认值用 `#[serde(default)]` 或 `#[serde(default = "fn_name")]`，用 `toml::from_str::<Config>(&input)` 读取并对 `Result` 做 match。起始代码读一个 `toml::Table` 然后往里索引，文件完整时能用，其他一切情况都会 panic。
'''
hints = [
  "`use serde::Deserialize;` —— toml 和 serde_json 一样是一种 serde 格式，所以 `toml::from_str::<Config>(&input)` 构造的是同一类派生出来的结构体。一个 `[table]` 是一个结构体字段；`[[array_of_tables]]` 是一个 `Vec<Struct>` 字段。",
  "不是该类型 `Default` 的默认值要用函数：`#[serde(default = \"default_port\")]` 配上 `fn default_port() -> u16 { 8080 }`。`Vec` 上的普通 `#[serde(default)]` 让缺失的 `[[upstream]]` 成为空列表。",
  "`toml::from_str` 返回 `Result<Config, toml::de::Error>`；缺少必填键、类型不对和语法错误全都落在 `Err` 里。对它做 match 并打印你自己的那一行 —— 绝不要对这个错误用 `{}`。",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.frameworks.07.clap-derive"
title = "一行参数"
story = "结算机上的运维工具接受 `--limit`，告士打道办公桌上有人敲了 `--limti 50`；工具把它当成了批次名，然后对全部批次跑了一遍。"
brief = '''
`settle` 是一个命令行工具，带有：

* 一个必填的位置参数 `BATCH`（字符串）
* `--limit <N>`，无符号整数，默认 `100`
* `--dry-run`，一个开关

评测程序不传任何参数，所以命令行来自标准输入：每个非空行是一条命令行，按空白切分（工具自己的名字不在行里）。对每一条输出一行：

* 成功时，`batch=<BATCH> limit=<N> dry-run=<true|false>`
* 失败时，`ERROR: ` 加上 clap 的 `ErrorKind` 的 `Debug` 形式 —— `ERROR: MissingRequiredArgument`、`ERROR: ValueValidation`、`ERROR: UnknownArgument`、`ERROR: InvalidValue`（选项后面没有值）

```
input:  2024-06-01 --limit 50
        --dry-run 2024-06-02
        2024-06-03 --limit ten
output: batch=2024-06-01 limit=50 dry-run=false
        batch=2024-06-02 limit=100 dry-run=true
        ERROR: ValueValidation
```

把接口声明为一个带 `#[derive(clap::Parser)]` 的结构体 —— `#[arg(long, default_value_t = 100)]`，以及 `bool` 上的 `#[arg(long)]` —— 并用 `Cli::try_parse_from(std::iter::once("settle").chain(words))` 解析每一行。`Err(e)` 带着 `e.kind()`。选项可以在位置参数之前或之后，`--limit=7` 和 `--limit 7` 相同。不要发送 `--help`。起始代码是一个手写的循环，什么都接受。
'''
hints = [
  "`use clap::Parser;`，并在结构体上写 `#[derive(Parser)]`：一个不带属性的字段是位置参数，`#[arg(long)]` 生成 `--field-name`，而字段的类型就是值解析器 —— `u32` 会替你拒绝 `ten`。",
  "`#[arg(long, default_value_t = 100)] limit: u32` 是带类型的默认值；`#[arg(long)] dry_run: bool` 是一个开关，有或没有，在行上拼作 `--dry-run`。",
  "`Cli::parse()` 读的是真实的 argv，这里是空的。`Cli::try_parse_from(iter)` 接受任何字符串迭代器，第一项是程序名：`std::iter::once(\"settle\").chain(line.split_whitespace())`。",
  "`Err(e) => println!(\"ERROR: {:?}\", e.kind())` —— `ErrorKind` 是一个普通枚举，它的 `Debug` 就是变体名。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.frameworks.08.clap-subcommands"
title = "三个动词，一个工具"
story = "告士打道结算机上的运维工具靠对第一个词的三个 if 分支长出了 `pay`、`refund` 和 `balance`；`refudn` 落进了最后一个分支，办公桌上本该看到拒绝的地方看到了一个余额。"
brief = '''
`till` 是一个带三个子命令的命令行工具：

* `pay <TO> <CENTS>` —— `TO` 是字符串，`CENTS` 是无符号整数；输出 `PAY <CENTS> to <TO>`
* `refund <ID> [--reason <WORD>]` —— 输出 `REFUND <ID>`，给了原因时输出 `REFUND <ID> because <WORD>`
* `balance [ACCOUNT]` —— `ACCOUNT` 默认为 `main`；输出 `BALANCE <ACCOUNT>`

和之前一样，评测程序不传任何参数：标准输入的每个非空行是一条命令行，按空白切分，不含工具的名字。每条命令行输出一行。失败时输出 `ERROR: ` 加上 clap 的 `ErrorKind` 的 `Debug` 形式：未知的第一个词是 `ERROR: InvalidSubcommand`；子命令缺少位置参数是 `ERROR: MissingRequiredArgument`；`CENTS` 不是整数是 `ERROR: ValueValidation`；该子命令没有的选项是 `ERROR: UnknownArgument`。

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

在结构体上用 `#[derive(Parser)]`，其中一个字段标为 `#[command(subcommand)]`，类型是一个带 `#[derive(Subcommand)]` 的枚举；每个变体的字段就是那个子命令的参数，变体名的小写就是行上的那个词。在结构体上加 `#[command(disable_help_subcommand = true)]`，这样 `help` 不会成为第四个动词。不要发送 `--help`。起始代码对第一个词做 match，然后对其余部分做索引。
'''
hints = [
  "`use clap::{Parser, Subcommand};` —— 结构体有一个字段 `#[command(subcommand)] command: Command`，而 `Command` 是一个带 `#[derive(Subcommand)]` 的枚举。",
  "类结构体变体 `Pay { to: String, cents: i64 }` 是一个带两个位置参数的子命令；`#[arg(long)] reason: Option<String>` 是可选的 `--reason`；`#[arg(default_value = \"main\")] account: String` 是可选的位置参数。",
  "在结构体上写 `#[command(name = \"till\", disable_help_subcommand = true)]` —— 否则 clap 会自己加一个 `help` 子命令，`help` 这一行就会输出 `DisplayHelp` 而不是 `InvalidSubcommand`。",
  "`try_parse_from` 之后，对 `cli.command` 做 match：`Command::Refund { id, reason: Some(why) } => ...` 和 `Command::Refund { id, reason: None } => ...` 是同一个 match 的两个分支。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.frameworks.09.regex-captures"
title = "文字里的港元"
story = "客服台把顾客邮件粘进退款工单，金额就埋在文字里。把金额抠出来的扫描器在第一个逗号就停下，于是一位在 SOGO 被扣了 HK$1,234.50 的顾客被提议退一块钱。"
brief = '''
标准输入是自由文本，一行一条工单。找出其中每一个港元金额。一个金额是 `HK$` 紧接着整元部分和一个可选的分部分：

* 整元：要么是纯数字（`80`、`1234`），要么是用逗号三位分组的数字（`1,234`、`12,345,678` —— 一到三位数字，然后一个或多个 `,ddd` 组）；
* 分：一个 `.` 加上恰好两位数字（`.50`）。后面没有两位数字的 `.` 不属于金额（`HK$38.` 是 38 元）。

其他任何东西 —— `US$9.99`、单独一个 `HK$` —— 都不是金额。

对每一个金额，按阅读顺序，输出 `<line> <text> <cents>`：从 1 开始的行号、金额在文本中出现的原样、以及它以分为单位的整数值。最后一行之后输出 `TOTAL <cents>`。没有金额的工单只输出总额；空输入输出 `TOTAL 0`。

```
input:  Charged HK$1,234.50 twice at SOGO; the second HK$1,234.50 is a duplicate.
        Refund HK$80 and the HK$12.05 fee. The US$9.99 line is not ours.
output: 1 HK$1,234.50 123450
        1 HK$1,234.50 123450
        2 HK$80 8000
        2 HK$12.05 1205
        TOTAL 256105
```

构造一个 `regex::Regex`，用命名分组分别捕获元和分，在循环**之前**编译一次（编译是最贵的部分；循环体里放一个 `Regex` 是经典错误），然后用 `captures_iter` 走每一行。用整数分来计算：`f64` 的元乘以 100 正是 `HK$0.29` 变成 28 分的方式。起始代码手工扫描，在第一个逗号停下，而且在乘浮点数。
'''
hints = [
  "`use regex::Regex;` 以及循环上方只写一次的 `let re = Regex::new(r\"...\").unwrap();`。`re.captures_iter(line)` 从左到右每个匹配给出一个 `Captures`。",
  "命名分组：`(?P<dollars>...)` 和 `(?P<cents>...)`。在模式里，`\\$` 是字面的美元符号，而分组形式必须在交替中排在前面、逗号组上带 `+`，否则 `HK$1234.50` 会匹配成 `HK$123` —— regex crate 取第一个匹配的备选项，不是最长的那个。",
  "模式：`HK\\$(?P<dollars>\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.(?P<cents>\\d{2}))?`。`&caps[0]` 是整个匹配，`caps[\"dollars\"]` 是分组文本，而 `caps.name(\"cents\")` 是 `Option<Match>`，因为该分组可能没有参与匹配。",
  "`let dollars: i64 = caps[\"dollars\"].replace(',', \"\").parse().unwrap();` 然后 `let cents: i64 = caps.name(\"cents\").map_or(0, |m| m.as_str().parse().unwrap());`，金额就是 `dollars * 100 + cents`。",
]

