[[quest]]
id    = "rust.frameworks.18.tokio-spawn-join"
title = "每行一个任务"
story = "告士打道旁的结算核对器在收单行应答的那一刻就打印那一行。今早的文件回来时第 40 行排在第 1 行上面，SOGO 的对账台直接把它退了回来。"
brief = '''
标准输入最多 50 行 `<MERCHANT> <CENTS>`：一个词，然后一个非负整数。空行跳过。

每一行由它自己的一个 `tokio::spawn` 任务来核对。一次核对是用 `tokio::join!` 一起做的两件事：标签（商户名转大写）和手续费（`cents * 15 / 1000`，向下取整）。收单行的往返是模拟的 —— 在两者运行之前先 `tokio::time::sleep` `(cents % 5) * 50` 毫秒 —— 起始代码里已经有了；保留它。它正是任务不按启动顺序完成的原因。

每个输入行输出一行，**按输入顺序**，`<n> <TAG> <cents> <fee>`，`n` 从 1 开始，然后输出 `TOTAL <sum of cents> <sum of fees>`。空输入只输出 `TOTAL 0 0`。

```
input:  lucky-mac 3804
        sogo 12502
        tsui-wah 700
output: 1 LUCKY-MAC 3804 57
        2 SOGO 12502 187
        3 TSUI-WAH 700 10
        TOTAL 17006 254
```

主函数是 `#[tokio::main] async fn main()`。把每个 `JoinHandle` 保存在一个 `Vec` 里，按压入的顺序 `.await` 它们；任务返回自己的结果，而不是打印。起始代码在任务里面打印，谁先完成谁先出 —— 那是睡眠的顺序，不是文件的顺序。
'''
hints = [
  "`tokio::spawn(fut)` 返回一个 `JoinHandle<T>`，`T` 是 future 返回的类型。让任务*返回*它那一行的数据，而不是打印。",
  "`tokio::join!(a, b)` 在同一个任务上运行两个 future，交回 `(a_result, b_result)` —— 在 `check` 里面，就是标签和手续费。",
  "一个 `Vec<JoinHandle<_>>` 从前往后 await 就是输入顺序，不管任务实际上以什么顺序完成：`for (i, h) in handles.into_iter().enumerate() { let (tag, cents, fee) = h.await.unwrap(); println!(...); }`。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.frameworks.19.tokio-mpsc-drop-sender"
title = "最后一个收银台关门"
story = "希慎广场的四个收银台通过一个通道喂给同一个抽屉盘点。盘点结果一直没打出来：计数任务还在等一个关门时就不再发送的收银台。"
brief = '''
第一行是 `P`，收银台的数量（1 到 8）。之后的每一行是 `<TILL> <CENTS>`：一个收银台编号和一个整数金额。收银台不在 `1..=P` 里的行直接丢掉 —— 不发送，不计数。

每个收银台是一个生产者任务：每个收银台 `tokio::spawn` 一个，持有一个 `tokio::sync::mpsc::channel(4)` 发送端的克隆，按文件顺序为它的每一行发送 `(till, cents)`。唯一的消费者在 `main` 里，用 `while let Some((till, cents)) = rx.recv().await` 接收并统计。

通道排空后，对收银台 1 到 P 各输出一行 `TILL <k> <count> <sum>`，然后输出全部的 `TOTAL <count> <sum>`。

```
input:  3
        1 1200
        2 3000
        1 800
        3 50
        2 1000
output: TILL 1 2 2000
        TILL 2 2 4000
        TILL 3 1 50
        TOTAL 5 6050
```

`recv()` 只在**每一个**发送端都没了的时候才返回 `None`。生产者返回时丢弃各自的克隆；`main` 里原来的 `tx` 还活着，所以循环永远不结束。起始代码就是那个程序。修好它，输出就不依赖于哪个收银台先发送 —— 不管消息以什么顺序到达，统计结果都一样。
'''
hints = [
  "`tokio::sync::mpsc::channel(4)` 给出 `(Sender, Receiver)`。只要还有任何 `Sender` 存在，`Receiver::recv().await` 就是 `Some(msg)`；最后一个被丢弃后就是 `None`。",
  "数一数发送端：每个收银台一个克隆，移进它的任务并在任务返回时丢弃 —— 再加上 `main` 里原来的那个，没有人丢弃它。",
  "`drop(tx);` 紧跟在 spawn 循环之后。然后 `while let Some(..) = rx.recv().await` 就恰好在最后一个收银台发送完毕时结束。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.frameworks.20.tokio-timeout-select"
title = "一秒，然后拒绝"
story = "时代广场 Lucky Mac 的终端等收单行要等多久就等多久。一个慢悠悠的下午那是每拍一次卡三秒，队伍排到了自动扶梯。"
brief = '''
标准输入最多 8 行 `<ID> <PRIMARY> <BACKUP>`：一个非负整数和两个词，每个词是 `fast` 或 `slow`。最多两行是 `slow slow`。

每次拍卡同时由两家收单行授权。每家在一段延迟之后应答授权码 `id * 37 % 1000` —— 用 `tokio::time::sleep` 模拟延迟：

* 主收单行：`fast` 10 毫秒，`slow` 3 秒
* 备用收单行：`fast` 100 毫秒，`slow` 3 秒

先应答的赢：对两个 future 做 `tokio::select!`。整场竞赛包在**一秒**的 `tokio::time::timeout` 里。逐行按顺序处理，对每一行输出：

* `DONE <id> primary <code>` 或 `DONE <id> backup <code>` —— 谁赢了
* `TIMEOUT <id>` —— 两家都没有及时应答

```
input:  7 fast fast
        8 slow fast
        9 slow slow
output: DONE 7 primary 259
        DONE 8 backup 296
        TIMEOUT 9
```

`timeout(dur, fut).await` 是 `Ok(value)` 或 `Err(Elapsed)`；是 `Err` 时里面的 future 已经被丢弃，连同 sleep 一起 —— 那 3 秒永远不会被等完。起始代码只 await 主收单行，没有超时，也从不问备用的。
'''
hints = [
  "`use tokio::time::{sleep, timeout};` —— `timeout(Duration::from_secs(1), fut).await` 给出 `Result<T, Elapsed>`，而丢弃里面的 future 就是取消它的方式。",
  "`tokio::select! { a = fut_a => ..., b = fut_b => ... }` 同时轮询两者，运行最先完成的那个分支；另一个 future 就在那里被丢弃。",
  "把 `select!` 放进一个 `async fn authorise(...) -> (&'static str, u64)`，然后把*它*包进 timeout，这样一个期限覆盖两家收单行。",
  "`match timeout(..).await { Ok((who, code)) => println!(\"DONE {id} {who} {code}\"), Err(_) => println!(\"TIMEOUT {id}\") }`。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.frameworks.21.futures-join-all"
title = "八十个一起"
story = "夜间风险评分一个接一个地走怡和街的商户，每个一百毫秒。到八十家商户时它已经赶不上结算窗口，整条街晚了一天入账。"
brief = '''
标准输入最多 100 行 `<ID> <CENTS>`：两个非负整数。对它们做三遍处理，每遍用一个起始代码里已有的、每行一个的 `async fn`：

1. **评分。** `score(id, cents)` 耗时 100 毫秒（一个 `sleep`），返回 `(id * 7 + cents) % 100`。用 `futures::future::join_all` 一次运行所有评分，它按 future 给出的顺序返回结果。每行输出 `<id> <score>`，按输入顺序。
2. **分桶。** `bucket(cents)` 耗时 20 毫秒，返回 `cents / 10000`。分桶服务允许同时四个在飞：用 `futures::stream::iter(..).map(..).buffer_unordered(4)` 构造流，`collect` 到一个 `Vec`，升序排序，在一行里输出 `BUCKETS <b1> <b2> ...`（没有行时只输出 `BUCKETS`）。
3. **限额。** `check(id, cents)` 在 `cents > 500000` 时是 `Err(id)`，否则是 `Ok(cents)`。用 `futures::future::try_join_all` 运行它们：输出 `OK <sum of cents>`，或者为输入顺序中第一个超限的行输出 `REJECTED <id>`。

```
input:  1 3800
        2 12500
        3 250000
output: 1 7
        2 14
        3 21
        BUCKETS 0 1 25
        OK 266300
```

一百行必须在远少于一秒内完成。起始代码对同样三个函数一行一行地 await，也就是每家商户一百毫秒；超过五十家商户，评测机的五秒就用完了。
'''
hints = [
  "`use futures::future::{join_all, try_join_all}; use futures::stream::{self, StreamExt};` —— `join_all(iter_of_futures).await` 是一个与输入同序的结果 `Vec`。",
  "`stream::iter(&rows).map(|&(_, c)| bucket(c)).buffer_unordered(4).collect::<Vec<_>>().await` 保持四个 future 在运行，每个完成时就产出；之后的 `.sort_unstable()` 把顺序重新变成你的。",
  "`try_join_all(..).await` 在每个 future 都是 `Ok` 时是 `Ok(Vec<T>)`，否则是第一个 `Err` —— `check` 从不 await 任何东西，所以输入顺序中的第一个就是第一个被轮询的。",
  "`let scores = join_all(rows.iter().map(|&(id, c)| score(id, c))).await;` 然后用 `rows.iter().zip(&scores)` 打印。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.frameworks.22.log-trait"
title = "现场听到什么"
story = "告士打道的结算服务用一堆 if 后面一个光秃秃的 print 来记日志。有人为波斯富街的上线把级别设成了 warn，错误不再出现，调试行却一直在来。"
brief = '''
第一行是一个级别词，大小写不限：`off`、`error`、`warn`、`info`、`debug` 或 `trace`。其他任何词输出 `unknown level <word>`，别的什么都不输出。之后的每一行是 `<ACCOUNT> <AMOUNT>`。

走过各行，从 1 开始编号，通过 `log` crate 的宏记录日志，每个带显式的 target：

* `trace!(target: "io", "read {raw:?}")` —— 原始行，以 `Debug` 形式带引号
* `error!(target: "settle", "line {n}: not a number: {amount}")`，当金额不是 `i64` 时；该行跳过
* `info!(target: "settle", "line {n}: {account} {cents}")`
* `warn!(target: "settle", "line {n}: large amount {cents}")`，当 `cents > 100000` 时，在 `info!` 之后
* `debug!(target: "settle", "total so far {total}")`，在把它加进去之后

然后，不论级别如何，`println!("TOTAL {total}")`。

一条记录以 `[LEVEL] target: message` 的形式打印到**标准输出**，而且只在它的级别不低于所选级别时打印 —— `error` 是最高，`trace` 是最低，`off` 除了总额什么都不打印。

```
input:  info
        A 100
        B 250000
        C 7x
        D 1
output: [INFO] settle: line 1: A 100
        [INFO] settle: line 2: B 250000
        [WARN] settle: line 2: large amount 250000
        [ERROR] settle: line 3: not a number: 7x
        [INFO] settle: line 4: D 1
        TOTAL 250101
```

为一个单元结构体实现 `log::Log` —— `enabled` 把记录的级别和 `log::max_level()` 比较，`log` 在 enabled 时打印，`flush` 刷新 stdout —— 把一个放进 `static LOGGER`，`log::set_logger(&LOGGER)`，并用解析成 `LevelFilter` 的那个词调用 `log::set_max_level`。起始代码有自己的级别表，而且比较的方向反了。
'''
hints = [
  "`use log::{Log, Metadata, Record, LevelFilter};` —— `impl Log for YourStruct` 是三个方法：`enabled`、`log`、`flush`。`\"warn\".parse::<LevelFilter>()` 读那个词，大小写不限。",
  "`static LOGGER: StdoutLogger = StdoutLogger; log::set_logger(&LOGGER).unwrap(); log::set_max_level(level);` —— `set_logger` 要的是 `&'static dyn Log`，所以它是 `static` 而不是 `let`。",
  "`Level` 的顺序是 `Error < Warn < Info < Debug < Trace`，所以一条记录在 `record.level() <= log::max_level()` 时是要的。宏在调用你之前已经检查过 `max_level()`。",
  "`println!(\"[{}] {}: {}\", record.level(), record.target(), record.args())` —— `Level` 显示为 `ERROR`、`WARN`……；你在每个宏里传的 `target:` 就是 `record.target()` 返回的东西。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.frameworks.23.the-settlement"
title = "结算"
story = "17:30，告士打道旁的支付链路。当天的转账以一个 JSON 文件到来，银行要在 18:00 前拿到每个账户一行，而今晚发出去的这个文件就是审计员三月份要读的那个。"
brief = '''
标准输入是一个 JSON 对象：`"date"`（字符串，`YYYY-MM-DD`）和 `"transfers"`，一个 `{"from", "to", "cents"}` 的数组。

输出结算结果：

```
input:  {"date": "2026-10-06", "transfers": [
          {"from": "LUCKYMAC", "to": "BANK", "cents": 3800},
          {"from": "SOGO", "to": "BANK", "cents": 12500},
          {"from": "BANK", "to": "LUCKYMAC", "cents": 300}]}
output: SETTLEMENT Tue 06 Oct 2026
        BANK 16000
        LUCKYMAC -3500
        SOGO -12500
        MOVED 3
```

第一行是按 `%a %d %b %Y` 格式化的日期。然后每个在任何地方出现过的账户一行，**按名字排序**，带它的净额：收到的全部减去付出的全部。然后是 `MOVED <number of transfers>`。

或者只输出一行 `ERROR:`，别的什么都没有，按这个顺序检查：

* 输入根本不是那个形状 —— `ERROR: not a settlement`
* 日期解析不了 —— `ERROR: bad date 2026-13-01`
* 然后按顺序检查每笔转账，从 1 开始编号 —— `cents` 为零或负数时 `ERROR: transfer 2: nothing to move`，`from` 等于 `to` 时 `ERROR: transfer 1: BANK pays itself`

用你身后这条路上的东西搭起来：`serde` 管形状，`chrono` 管日期，带上下文的 `anyhow` 管错误，以及 `tokio` —— 每笔转账一个任务，校验它并把两边都记进一个 `Arc<tokio::sync::Mutex<BTreeMap<String, i64>>>`，**按顺序** join，这样第一笔坏转账就是被报告的那一笔。起始代码解析并生成任务，但只记收款方，从不校验，日期也原样输出。
'''
hints = [
  "四个 crate，一个程序。`serde_json::from_str::<Settlement>` 管形状，`NaiveDate::parse_from_str(&s, \"%Y-%m-%d\")` 管日期，`date.format(\"%a %d %b %Y\")` 打印它。",
  "错误用 `anyhow`：在 crate 自己的消息不能泄漏的地方用 `.map_err(|_| anyhow!(\"not a settlement\"))`，任务里面用 `bail!(...)`，join 时用 `.with_context(|| format!(\"transfer {}\", i + 1))` —— 而 `{err:#}` 输出 `context: cause`。",
  "每个任务是 `tokio::spawn(post(Arc::clone(&book), transfer))`，返回 `anyhow::Result<()>`；`handle.await` 给你一个 `Result<Result<()>, JoinError>`，所以是两个 `?` —— 第一个带它自己的上下文。",
  "**按你生成它们的顺序** join 这些句柄，在第一个 `Err` 处停下：这就是转账 2 和 3 都坏时被报告的是 `transfer 2` 的原因。map 是一个 `BTreeMap`，所以账户天然就是排好序出来的。",
]
