        APPROVED 2 TIMEOUT 1
```

等待是对两个接收端做 `crossbeam::channel::select!`：工作线程的那个，以及 `after(Duration::from_millis(300))` —— 一个在时间到时投递一条消息的通道。给**每张卡各自一个** `bounded(1)` 通道，这样一家慢发卡行迟到三秒的答复不会被误认成下一张卡的。工作线程用 `let _ = tx.send(..)` 发送：到那时可能已经没人在听了，这没问题。用 `std::thread::spawn` 生成工作线程，而且永远不要 join 它们 —— `main` 返回就结束了进程，连同还在睡的工作线程一起。起始代码调用没有超时的 `rx.recv()`，等满整整三秒，然后批准了这张卡。
'''
hints = [
  "`use crossbeam::channel::{after, bounded, select};` —— `after(d)` 是一个 `Receiver<Instant>`，在从现在起 `d` 之后恰好收到一条消息。它和别的通道没有两样，正因如此 `select!` 才能等它。",
  "`select!` 接受 `recv(rx) -> msg => { .. }` 分支，运行最先就绪的那个接收端的分支。把工作线程的接收端放在一个分支里，`after` 的接收端放在另一个。",
  "`recv(rx) -> answer` 给出一个 `Result`：来自工作线程的是 `Ok(card)`。超时分支的消息是一个你不需要的 `Instant`：`recv(after(Duration::from_millis(300))) -> _ => { .. }`。",
  "`select! { recv(rx) -> answer => { approved += 1; println!(\"{} APPROVED\", answer.unwrap()); } recv(after(Duration::from_millis(300))) -> _ => { timed_out += 1; println!(\"{card} TIMEOUT\"); } }`",
]

