[[quest]]
id    = "cpp.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个骑手得分相同，而排行榜每次重画都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个骑手，骑手 `i` 的下标是 `i`，还有一个分数：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分数**降序**给骑手排序。分数相同的骑手必须保持他们到达的顺序。输出他们的下标，用空格
分隔，然后输出 `TIES <k>` —— 在你排好的顺序里，有多少对相邻的骑手分数相同。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎全是平局，而答案几乎完全取决于平局怎么处理。

**这一关讲的是知道你手里拿的是哪种排序。** `std::sort` **不稳定** —— 它对相等元素的顺序
不作任何承诺，而在真实的输入上它显然不会保持那个顺序：它是 introsort，它的划分步骤理所当然
地把相等元素换到枢轴的另一边。`std::stable_sort` 是稳定的，是归并排序，为这个承诺付出一些
内存。初始代码用 `std::sort` 配一个只看分数的比较器，而隐藏用例大到足以证明它会把平局打乱。
（在 `n = 8` 时库退回插入排序，碰巧保持了顺序 —— 这就是为什么小测试什么都证明不了，也是
为什么这里的小用例是*可见*的那个，而不是评判你的那个。）

有两个正确答案，你应该两个都能给出。用 `std::stable_sort`。**或者**保留 `std::sort`，让
比较成为**全序** —— 分数降序，然后下标升序 —— 这样没有任何两个元素会比较为相等，稳定性
就不再是个问题。默认应该选第二种；顺序完全确定时，不稳定的排序就没什么可证明的了。
'''
hints = [
  "一个词：std::sort 改成 std::stable_sort。这就是稳定的答案。",
  "另一个答案保留 std::sort，按（分数降序，然后下标升序）比较 —— 全序，所以不再有可以不稳定的平局。",
  "TIES 数的是排好的顺序里相邻的相同分数，不管你写的是两种中的哪一种，这个数都一样 —— 暴露你的是下标的顺序。",
]

