[[quest]]
id    = "cpp.hacker.32.modular"
title = "对十亿零七取模"
story = "这句话出现在题目的最底下，而屋里一半的人不知道它要他们做什么。"
brief = '''
标准输入是 `n q seed`。在 `std::uint64_t` 里生成 `q` 个查询：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询计算二项式系数 `C(a, b)` **对 1000000007 取模**。输出全部 `q` 个答案之和，
本身也对 `1000000007` 取模，然后输出 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这些规模下 `C(a, b)` 有几十万位数字，所以从来不是先算出来再取模 —— 每次乘法都随手
取模。问题在除法：`a! / (b! (a-b)!)` 在模运算里没有意义。取代它的是**模逆元**，而因为
`1000000007` 是质数，费马小定理把它交到你手上：`inverse(v) = v^(p-2) mod p`，用快速幂
大约三十次平方算出来。

所以：先算一次 `factorial[0..=n]`，每个查询答为 `f[a] * inv(f[b]) * inv(f[a-b])`。

**这里强制要求复杂度。** 有一个隐藏用例是 `n = 200000`、`q = 200000`。每个系数独立计算
—— 乘 `b` 项，除以 `b` 项，每次一个模逆元 —— 在五秒的运行时限内跑不完；那就是初始代码。
共用一张阶乘表，远不到一秒就跑完了。两者都在这台机器上实测过。

每个中间值都是两个小于 `2^30` 的值的乘积，所以装得进 `long long`，什么都不会溢出。用
`int` 就不行了 —— 这里 `int` 是 32 位 —— 这是这道题会被问到的另一半原因。
'''
hints = [
  "每次乘法之后都取模，永远不要留到最后。long long 装得下两个小于 P 的值的乘积；装不下一个阶乘。",
  "inverse(v) 就是 power(v, P - 2)，它之所以成立只是因为 P 是质数 —— 这就是费马小定理在这里的全部内容。",
  "连逆阶乘也预先算好，从 inverse(factorial[n]) 倒着推，就省掉了每个查询的两次 power() 调用。通过不需要它，但值得说出口。",
]

