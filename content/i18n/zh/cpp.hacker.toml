[[quest]]
id    = "cpp.hacker.33.grid-paths"
title = "穿过街区，永不回头"
story = "送货网格上有三条街因为搭竹棚封了。有几种走法能穿过去，哪条最便宜。"
brief = '''
标准输入是 `r c pct seed`。按行优先的顺序自己构建网格，每个格子抽**两个**值：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，只经过开放的格子。输出：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同的路线，对 `1000000007` 取模
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都算，没有路线就输出 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序扫一遍就两者都做了：一个格子的路线数是从上方和从左边进来的路线数之和，它的
最佳代价是它自己的代价加上这两者中更便宜的那个。因为你只向右或向下走，你需要的那两个格子
总是已经算完了 —— 这就是为什么这里不需要递归，也不需要访问集合。

`PATHS` 的计数对 `1000000007` 取模，原因照旧：在 `1000 × 1000` 的隐藏用例上，真实的数有
六百多位。一边加一边取模。

**大用例强制的是什么：**它淘汰任何枚举路线的答案。路线比这间屋子里的原子还多。它不区分
自底向上的表和带记忆化的递归 —— 两者都和格子数成线性，都能轻松通过。
'''
hints = [
  "每个格子都要抽两个值，包括两个角 —— 生成器不跳过它们，只是不让它们被封。",
  "上方和左边都没有开放邻居的开放格子，路线数为零，也没有最佳代价；让 INF 表示不可达，并挡住加法，因为 INF 加任何数都是有符号溢出。",
  "终点可以是开放的却仍然不可达，这正是 PATHS 为 0、MIN 为 -1 的时候。有一个隐藏用例就是这样。",
]

