# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.hacker.17.lis"
title = "最长的上升"
story = "每天的营业额，要多少有多少，由你用一个种子自己生成。他们要最长的一段越来越好的日子，而且不必连续。"
brief = '''
标准输入是两个整数 `n` 和 `seed`。输入里没有数组 —— 你用**恰好**这个生成器自己构建它，
用 `std::uint64_t` 算术，按定义它会回绕：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

输出最长**严格递增子序列**的长度 —— 值保持原有顺序，但不必相邻。然后输出
`TAILS <k>`，其中 `k` 就是同一个长度，从耐心排序的牌堆数读出来。

```
input:  8 1
output: 3
        TAILS 3
```

对于 `8 1`，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`，
其中最长的上升是 `93944146 392341189 822192870`。在去算法里找 bug 之前，先拿这一行核对
你的生成器。

**这一关强制要求复杂度。** 初始代码是 `O(n²)` 的表 —— 你应该能不假思索写出来的答案，
而且它没有错。在 `n = 200000` 上它输出的 `881` 和快的那个一样。它在启动后 **32.6 秒**
才输出，而运行时限是五秒，所以你看到的是超时而不是答案错误。这道题存在的意义就是制造
这种失败。

`O(n log n)` 的那个为每个长度记下该长度的子序列所能结尾的最小值 —— 这个列表永远是有序
的，所以新值的位置是一次二分查找，而 `std::lower_bound` 就是那次查找。它跑
`n = 200000` 只要 **0.006 秒**。两者都是在这台机器上，用这一关附带的两个程序实测的。

关于宽度说一句，因为这是 C++ 给这道题加上的那一半。每个生成的值都小于 `2^30`，答案最多
是 `n`，所以 `int` 两者都装得下 —— 但生成器的 `x` 必须是 `std::uint64_t`，别的都不行。
无符号溢出按定义回绕；**有符号**溢出是未定义行为，所以在那里用 `long long` 就等于允许
编译器做任何事，而且对它做 `>> 33` 会是算术右移，而不是这个生成器所指的逻辑右移。用
无符号生成，取模之后再转换。
'''
hints = [
  "tails 不是一个子序列。它的长度才是答案；它的内容只是最好的结尾值。",
  "严格递增意味着你要替换第一个 >= value 的 tail，这正是 std::lower_bound 返回的东西。",
  "如果大用例超时，你的答案没有错 —— 这里答案就是你循环的形状。对 200000 个值的两层嵌套循环是 2 x 10^10 次比较。",
]

