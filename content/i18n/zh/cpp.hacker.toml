对每个用例输出**第二大的不同**值，如果不同的值少于两个就输出 `NONE`。全部输出之后再输出
`CASES <T>`。

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

这是竞赛式笔试的标准外壳，它让候选人挂掉只有一个原因：本该每个用例一份的状态被声明在
循环之前。每个累加器、每个 set、每个 `best` 都要放在 `for` **里面**。

用 `>>` 按空白分隔的记号读，而不是按行读，`n = 0` 的空行就根本不再是特殊情况 —— 这是
