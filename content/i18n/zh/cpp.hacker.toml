```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`，`x ^ 0 == x`，而且 xor 不在乎运算的先后顺序。这就是第一行的全部。
`x & (x - 1)` 清掉最低的置位，第三行和第四行就白送给你了。全部用 `unsigned long
long` 来做：在有符号类型上移位和减法有边界情况，而这道题问的不是那些。

这里的用例很小，计时也不是在量速度。没有大的隐藏用例，按这个包构建用例的方式也造不出
来：成对加一个的数组是*构造*出来的，不是生成出来的，两块地各自构造，造出来的不会是同一个
数组。所以这些用例检查的是那四行和它们的边界 —— `0` 不是二的幂，没有置位的值清掉最低
置位之后仍然是 `0`。xor 仍然是答案；用嵌套循环数出现次数是 `O(n²)`，在真实的 `n` 下会死。
'''
hints = [
