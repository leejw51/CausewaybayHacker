这 `n` 个单词不保证互不相同，而 `PREFIX` 数的是**插入次数**，不是不同的单词：把 `tram`
插入两次，`PREFIX tram` 就是 `2`。`NODES` 数的是节点，所以第二次插入不增加节点。

然后输出 `NODES <k>`，即 trie 里的节点数，包括根。

```
input:  3 3
        tram
        tramway
        train
