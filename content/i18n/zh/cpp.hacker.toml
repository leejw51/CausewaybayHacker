[[quest]]
id    = "cpp.hacker.30.range-queries"
title = "一直在变的总数"
story = "全连锁一天四百万次收银操作，一半是更正，有人要看滚动的总数。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后执行 `q` 次操作，全部来自同一个
生成器，在 `std::uint64_t` 里：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

输出每次查询答案的累计总和，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里强制要求复杂度，而且费了一番功夫。** 朴素答案 —— 每次查询都把区间循环一遍 ——
每次查询是 `O(n)`，而编译器会把它向量化成快得惊人的东西。小用例抓不住它。所以大的隐藏
用例是 `n = 500000, q = 4000000`，在那里朴素答案要碰大约 `10^11` 量级的元素，在五秒的
运行时限内跑不完，而 Fenwick 树远不到一秒就全做完了。两者都实测过，用的是这一关里的
两个程序。

这一课正是面试官在钓的那个：*单点更新、区间求和*正是 Fenwick 树为之存在的形状。三个
简短的函数 —— add、prefix，以及作为两个前缀之差的 range —— 而 `i & -i` 就是你按最低
置位跨步的方式。这个表达式里的下标要保持有符号；在无符号类型上 `-i` 是回绕，碰巧得到
同样的位，但那不是你想在面试间里解释的东西。
'''
hints = [
  "对每个初始值调用一次 add 来建树。O(n) 的自底向上建树是个不错的优化，但不是计时在测的东西。",
  "i & -i 取出最低的置位。加上它就往树上走；减去它就往下走。",
  "range(l, r) 是 prefix(r + 1) - prefix(l)，把这一对差一弄对，就是调试的大部分工作。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.hacker.31.palindrome"
title = "倒过来也一样"
story = "前二十名的题，大多数笔试都会以某种形式问到，也是大多数人写过一次却从没弄懂的那道。"
brief = '''
标准输入是 `n alphabet seed`。自己构建这个字符串：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

输出最长回文子串的长度，然后输出 `AT <index>` —— 该长度中**最靠左**那一个的 0 基起始位置。

```
input:  12 3 5
output: 5
        AT 1
```

围绕每个中心向外扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符是奇数长度回文的中心，
两个字符之间的每个空隙是偶数长度回文的中心。忘了空隙，就是一个看起来正确的解在 `abba`
上返回 `1` 的原因，而初始代码正是这样做的。

**测试强制什么、不强制什么**，直说。起作用的隐藏用例是**单**字母字母表上的 `n = 20000`。
它是中心扩展法的最坏情况 —— 每个中心都一直扩展到字符串末尾 —— 所以正确答案在那里完整地
做了 `O(n²)`，仍然只要几百分之一秒。它也淘汰了“检查每个子串、逐个测试”的做法，那是
立方级的，五秒之内回不来。

另一个大用例，双字母字母表上的 `n = 20000`，是**正确性**用例，不是速度用例。在随机的
二进制串上，回文测试一两个字符之后就失败了，所以连立方级的答案也能过。它检查的是在大
规模下你的生成器和最靠左下标的平局规则与我们的一致。

老实说一个保留意见，因为这正是面试官会追问的那种事：单字母用例淘汰的是检查*每一个*子串。
加一行代码，跳过任何不比目前找到的最佳更长的子串，同样的立方级循环就能过两个大用例 ——
在这个输入上，这个剪枝把它压成了 `O(n²)`。所以测试淘汰的是朴素的立方级做法，而不是
每一个在最坏情况下是立方级的程序。

所以：测试拒绝立方级，接受平方级。它们**不**要求 Manacher 算法，那是 `O(n)` 的答案。
知道它的存在、知道它做什么，因为“你能做得比平方更好吗？”正是这道题通常被拿来铺垫的追问。
'''
hints = [
  "每个中心两次调用：(c, c) 对应奇数长度，(c, c + 1) 对应偶数长度。初始代码少了第二个。",
  "循环停下时，i 和 j 都比回文多走了一格 —— 所以它从 i + 1 开始，长度是 j - i - 1。",
  "只在回文严格更长时才更新，这样每种长度留下的都是最靠左的那个，正是 AT 要的。",
]

