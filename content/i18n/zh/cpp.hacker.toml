[[quest]]
id    = "cpp.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到目前为止通关的每张地图数的都是跳数。电车不在乎有几个站；它在乎的是要走多久。"
brief = '''
标准输入是 `n m seed`：`n` 个站，`m` 条无向带权边。用**恰好**这个生成器、在
`std::uint64_t` 里自己构建这张图：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

输出从站 `0` 到每个可达站的最短距离之和（包括 `0` 自己，距离是 `0`），然后输出
`MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里强制要求复杂度。** 隐藏用例是 `n = 200000`、`m = 400000` —— 是 Rust 和 Go 面试所用
规模的两倍，因为 C++ 跑错误答案也够快，在 `n = 100000` 上它正好落在五秒线上，过不过要看
天气。两种写法都是 Dijkstra，计时决定的是优先队列。每次扫描所有未访问节点找最小值是
`O(V²)`，在 `n = 200000` 上要 **35 秒**，对着五秒的运行时限。二叉堆让它变成
`O((V + E) log V)`，**0.09 秒**跑完。两者都是在这台机器上，用这一关附带的两个程序实测的：
初始代码是扫描的版本。

值得看清楚，因为这是在计时笔试里挂掉最常见的方式：**初始代码没有错。**它输出的正是正确
答案。它被拒绝，只是因为晚到了七倍。

`std::priority_queue` 是最大堆，所以用 `std::greater` 在 `(distance, node)` pair 上声明它。
它没有 decrease-key，你也不需要：把改进后的距离作为新条目压入，弹出的条目如果距离已经比
你记录的更差就跳过。这个“过期条目”的跳过就是人们会忘掉的那一行，没有它堆会无限增长。
'''
hints = [
  "std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>>，其中 Entry = pair<distance, node>：pair 先按距离排序，greater 把最大堆翻过来。",
  "if (d > dist[u]) continue; 就是过期条目的跳过。没有它算法仍然正确，只是堆里塞满了作废的条目。",
  "生成器的生成树那一半保证每个节点都可达，所以对 INF 的过滤实际上从不去掉任何东西 —— 还是留着它，因为有不可达节点的版本就是这道题的追问。",
]

