里它是个带转折的陷阱：在 `-O2` 下，没有边界检查碍事，编译器会把它向量化，于是在
`n = 200000` —— Rust 和 Go 版本的这场面试用的规模 —— 它 **1.5 秒**就跑完了，在五秒的
运行时限之内。所以 C++ 的隐藏用例是 `n = 1000000`。在那里双重循环是 `5 × 10^11` 次比较，
要 **38 秒**。在归并排序过程中数逆序对是 `O(n log n)`，只要 **0.05 秒**。在这台机器上，
用这两个程序实测的。

大用例还替你决定了另外两件事。`n = 1000000` 的答案是 `250046540838`，`int` 装不下 ——
宽度不对的累加器是悄无声息地错，而不是慢。而且生成器必须回绕而不是溢出：
`std::uint64_t` 按定义回绕，有符号的 `long long` 会是未定义行为，编译器对它做任何事都
有理有据。
'''
hints = [
  "先取最大值再排序，或者对副本排序。归并排序会在你脚下重排数组。",
  "归并时右边的值胜出，左半边剩下的每个元素都比它大 —— 一次就是 mid - left 个逆序对，这就是全部的技巧。",
  "在压缩后的值上建 Fenwick 树是另一个 O(n log n) 答案，在面试间里值得提一句；在计时之下，归并排序代码更少。",
]

