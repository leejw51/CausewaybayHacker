[[quest]]
id    = "cpp.hacker.28.lru"
title = "链接器"
story = "7-32 室，第三场面试，最后一道题。一门没有安全网的语言，更短的时间，还有一个必须逐出正确东西的缓存。"
brief = '''
第一行是 `cap q`。接下来 `q` 行是 `PUT <key> <value>` 或 `GET <key>`。

实现一个固定容量的缓存，满了的时候逐出**最近最少使用**的条目。`GET` 和 `PUT` 都算使用
一个键。

每个 `GET` 输出对应的值，不在就输出 `-1`。最后输出留下来的键，最近使用的在前，用空格
分隔 —— 缓存为空就输出 `-` —— 然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把示例走一遍：`GET 1` 让 `1` 重新成为最近使用的，所以 `PUT 3` 需要空间时走的是 `2`。
`GET 2` 未命中。`GET 3` 命中，让 `3` 成为最近使用的，这就是为什么留下的输出为 `3 1`。

教科书答案是一个指向**双向链表**的哈希 map，而 C++ 有现成的真家伙：`std::list`，它的
迭代器在其他元素被插入、删除或拼接时仍然有效 —— 这正是 `std::vector` 给不了的那个保证，
也是 map 能把 `std::list::iterator` 当作值的全部原因。`push_front`、`splice` 到前面、
`back` 和 `pop_back` 都是 O(1)，所以这里的每个操作都是 O(1)，你可以毫不含糊地这么说。

有两件事要做对，是 Rust 那场面试没要求你的。链表节点**既**存值**也**存键，因为逐出是从
链表开始的，必须知道要删掉 map 里的哪个条目。而且两次删除的顺序很重要：先从 `back()` 里
读出键，从 map 里删掉它，*然后*再 `pop_back` —— 反过来就是通过迭代器去读一个已经不存在
的节点，而这块地从午炮开始讲的就是这件事。

这里的用例很小，计时也不是在量速度：四个操作分不出 `std::list` 和一个从头扫描的
`std::vector`。上面那段话里的 `O(1)` 是你在面试间里要说出口的话，所以它必须对你写的代码
成立，而不是对碰巧过了四个用例的代码成立。
'''
hints = [
  "recent.splice(recent.begin(), recent, it) 以 O(1) 把 it 指向的节点移到最前面，之后 it 仍然指向同一个节点。整个设计就建立在这个操作上。",
  "覆盖一个已经存在的键不算逐出 —— 在判定缓存已满之前先查 map。",
  "逐出：取 back().first，从 map 里删掉那个键，然后 pop_back。pop_back 之后 map 持有的迭代器就悬空了，所以 map 条目必须先删。",
  "从前往后遍历链表本来就是最近使用的在前，所以最后一行不需要排序。",
]
