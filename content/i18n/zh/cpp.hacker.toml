  "std::set 同时是有序的和去重的，所以 *std::next(rbegin()) 就是第二大的不同值。",
  "先用 size() < 2 挡住：对超出末尾的反向迭代器做 std::next 是未定义的，而在这块地上，未定义并不意味着会有错误信息。",
]

