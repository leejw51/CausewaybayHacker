# PYTORCH LAND — HACKER, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/pytorch/hacker.toml`, quest by quest, and
# nothing else. Code blocks, identifiers, sample input and output and the
# exact strings a program must print are the English pack's and are copied
# verbatim, never translated.

pack   = "pytorch.hacker"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.hacker.01.pairwise"
title = "每一对，不用循环"
story = "7-32 室，第五次了。第一道题是人人都会遇到的那一道，钟在进门的路上就开始走了。"
brief = '''
第一行是 `n d`。然后是 `n` 行，每行 `d` 个浮点数。

输出 `n × n` 的欧氏距离矩阵，每个值四舍五入到三位小数，每行一行，值之间用单个空格分隔。

他们要的答案里没有 Python 循环。把 `(n, 1, d)` 和 `(1, n, d)` 广播，一次就得到所有差值。

```
input:  3 2
        0 0
        3 4
        0 4
output: 0.0 5.0 4.0
        5.0 0.0 3.0
        4.0 3.0 0.0
```
'''
hints = [
  "(x.unsqueeze(1) - x.unsqueeze(0)) 的形状是 (n, n, d) ——每一对的每一个差值。",
  "torch.cdist(x, x) 是库给的答案；面试通常要你把广播亲手写出来。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.hacker.02.topk-accuracy"
title = "前五名之内"
story = "论文声称的是 top-5，代码算的是 top-1。直到审稿人要这个数，才有人注意到。"
brief = '''
第一行是 `n c k`。然后是 `n` 行，每行 `c` 个 logits。最后一行是 `n` 个整数标签。

输出 top-1 准确率和 top-`k` 准确率，各自四舍五入到四位小数，用一个空格分隔。如果一个样本的标签在它那一行最大的 `k` 个 logits 之中，它就算 top-`k` 命中。

`topk` 返回值和下标；这道题关心的是下标。

```
input:  3 4 2
        1 2 3 0
        5 1 0 2
        0 1 4 3
        2 0 3
output: 0.6667 1.0
```
'''
hints = [
  "logits.topk(k, dim=1).indices 是 (n, k)，已经按最好的在前排好序，所以第 0 列就是 top-1 预测。",
  "(idx == want.unsqueeze(1)).any(dim=1) ——是那个 unsqueeze 让标签能在 k 列上广播。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.hacker.03.cosine"
title = "看角度，不看长度"
story = "检索按点积排序，最长的那个向量赢下每一次查询，不管它说的是什么。"
brief = '''
第一行是 `n m d`。然后是 `n` 行查询，每行 `d` 个浮点数，再是 `m` 行文档，每行 `d` 个浮点数。

输出 `n × m` 的余弦相似度矩阵，四舍五入到四位小数，每行一行。

余弦相似度是**归一化后**向量的点积。先归一化再相乘，是始终只需一次矩阵乘法的答案；事后再除，需要一个范数的外积，也是大家理不清头绪的地方。

```
input:  2 2 2
        1 0
        0 2
        1 0
        1 1
output: 1.0 0.7071
        0.0 0.7071
```
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) ——是 keepdim 让这个除法沿着各行广播下去。",
  "然后一次矩阵乘法：qn @ kn.t()。零向量会导致除以零，这正是 F.normalize 里 eps 的用途。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.hacker.04.stable-softmax"
title = "写出 softmax"
story = "写出 softmax。这是他们问的第一件事，而他们在等着听的，是那个没人第一次就写出来的减法。"
brief = '''
第一行是 `n c`。然后是 `n` 行，每行 `c` 个 logits。

对每一行输出 softmax，四舍五入到四位小数——**不用** `torch.softmax` 来算。

对一个很大的 logit 取 `exp` 会溢出成 `inf`，这一行就变成 `nan`。先减去每一行的最大值，在数学上什么都没变，在数值上什么都变了，因为最大的那个指数变成了 `exp(0)`。

```
input:  2 3
        1 2 3
        1000 1000 1000
output: 0.09 0.2447 0.6652
        0.3333 0.3333 0.3333
```
'''
hints = [
  "x - x.max(dim=1, keepdim=True).values，然后 exp，然后除以行和。",
  "max(dim=...) 返回值和下标；.values 是你要的那一半，而 keepdim 让广播老老实实。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.hacker.05.cross-entropy"
title = "写出交叉熵"
story = "现在写出这个损失，并且在他们交给你的那一批数据上，与库的结果一致到小数点后五位。"
brief = '''
第一行是 `n c`。然后是 `n` 行，每行 `c` 个 logits，再是一行 `n` 个标签。

输出你的交叉熵，四舍五入到五位小数，然后如果它与 `nn.CrossEntropyLoss` 的差在 `1e-5` 以内，输出 `True`。

一个批次的交叉熵是对各行求 `-log_softmax(logits)[row, label]` 的均值。这样写，它是稳定的，只要一次 `gather`，也正是他们要的答案。写成 `-log(softmax(x))`，就是在隐藏用例上返回 `inf` 的那个答案。

```
input:  2 3
        1 2 3
        3 1 0
        2 0
output: 0.28873 True
```
'''
hints = [
  "先 log_softmax，再 gather 出真实类别，然后取负、求均值。",
  "默认的 reduction 是对批次求均值，不是求和——这是和库对上的另一半。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.hacker.06.one-hot"
title = "不用那个辅助函数"
story = "面试官说，不许用 `F.one_hot`。有两种办法，而他们在等的是 scatter。"
brief = '''
第一行是 `n c`。第二行是 `n` 个标签。

以整数形式输出 `n × c` 的 one-hot 矩阵，每行一行。

`zeros(n, c).scatter_(1, labels.unsqueeze(1), 1.0)` 在每一行标签所指的那一列写入一个一。比较的写法——`labels.unsqueeze(1) == arange(c)`——是另一个被接受的答案，而且更容易当面讲清楚。

```
input:  3 4
        2 0 3
output: 0 0 1 0
        1 0 0 0
        0 0 0 1
```
'''
hints = [
  "torch.zeros(n, c).scatter_(1, y.unsqueeze(1), 1.0) ——dim 1，下标的形状和源张量一样。",
  "y.unsqueeze(1) == torch.arange(c) 以布尔值给出同一个矩阵，在面试里读起来更好。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.hacker.07.normal-equations"
title = "不用梯度下降"
story = "不训练就把这条直线拟合出来。最小二乘有闭式解，他们想知道你知不知道。"
brief = '''
第一行是 `n d`。然后是 `n` 行，每行 `d` 个特征，再是一行 `n` 个目标值。

在一行里输出 `d + 1` 个最小二乘系数——先是 `d` 个权重，然后是截距——每个四舍五入到四位小数。

截距来自追加的一列一，而解是 `(XᵀX)⁻¹Xᵀy`。用 `torch.linalg.lstsq`，它不用构造逆矩阵就能求解；只要偏置那一列在，面试官两种都接受。

```
input:  3 1
        0
        1
        2
        1 3 5
output: 2.0 1.0
```
'''
hints = [
  "用 torch.cat([x, torch.ones(n, 1)], dim=1) 追加一列一——那一列就是截距。",
  "torch.linalg.lstsq(xb, y.unsqueeze(1)).solution ——它要求等号右边是一个矩阵。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.hacker.08.kmeans-step"
title = "一次迭代"
story = "分配，然后求平均，然后说出什么变了。他们要的是循环体，不是库。"
brief = '''
第一行是 `n k d`。然后是 `n` 个点，每个 `d` 个浮点数，再是 `k` 行质心，每行 `d` 个浮点数。

在第一行输出每个点的分配结果，然后输出 `k` 个更新后的质心，每行一个，四舍五入到四位小数。没有分到任何点的质心保持原来的位置。

一次迭代就是：用广播算距离，用 `argmin` 做分配，再对每个簇求带掩码的均值。

```
input:  4 2 1
        0
        1
        10
        11
        0
        10
output: 0 0 1 1
        0.5
        10.5
```
'''
hints = [
  "(x.unsqueeze(1) - c.unsqueeze(0)) 是 (n, k, d)；平方，对最后一轴求和，在 k 上取 argmin。",
  "空簇没有均值——要防住它，否则质心会变成 nan，再也恢复不过来。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.hacker.09.iou"
title = "它们重叠了多少"
story = "检测框，以及决定一个预测算不算数的那个指标。在零处截断，是大家会忘掉的那一行。"
brief = '''
第一行是 `n m`。然后是 `n` 个框和 `m` 个框，每个都写成 `x1 y1 x2 y2`。

输出 `n × m` 的 IoU 矩阵，四舍五入到四位小数，每行一行。

交集是两个区间在每个轴上的重叠部分，**在零处截断**——两个不相接的框会给出负的宽度，没有截断的话，两个负数相乘得到正数，这个指标就会悄无声息地报告一个并不存在的重叠。

```
input:  2 1
        0 0 2 2
        1 1 3 3
        0 0 2 2
output: 1.0
        0.1429
```
'''
hints = [
  "左上角是两个角的逐元素最大值，右下角是最小值；然后 (rb - lt).clamp(min=0)。",
  "并集是 areaA + areaB - intersection ——要把交集减掉，否则每个重叠都会被低估。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.hacker.10.nms"
title = "每样东西只留一个"
story = "一扇机架门上有九个框，检测器坚信那里有九扇机架门。"
brief = '''
第一行是 `n thr`。然后是 `n` 行 `x1 y1 x2 y2 score`。

输出非极大值抑制保留下来的下标，按保留的顺序，用空格分隔。如果一个都没保留，输出一个空行。

NMS 是贪心的：取得分最高的框，保留它，丢掉剩下的框里与它的 IoU **大于** `thr` 的每一个，重复。恰好等于阈值的框会留下来。

```
input:  3 0.5
        0 0 2 2 0.9
        0 0 2 2 0.8
        5 5 7 7 0.7
output: 0 2
```
'''
hints = [
  "按得分降序排列，取出最好的，用与它的 IoU 过滤其余的，重复。",
  "抑制的比较是严格大于阈值，所以恰好等于 thr 的框会被保留。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "pytorch.hacker.11.dropout"
title = "写出 dropout"
story = "他们说，写出 dropout，然后问：推理的时候它做什么？第二个问题才是真正的问题。"
brief = '''
第一行是 `n p seed`，其中 `p` 是丢弃概率。

输出存活下来的比例和输出的均值，各自四舍五入到**一**位小数，然后如果期望值得到了保持——也就是说，如果存活的元素被乘以了 `1/(1-p)`——输出 `True`。

只保留一位，因为具体抽到什么是生成器的事，不是这道题的事：要检查的是，在丢掉比例为 `p` 的部分之后，输出的平均值仍然是 1。

这是**反向**（inverted）dropout，也是每个框架实现的那种：缩放发生在训练时，于是推理就只是恒等映射，没什么要记住，也没什么要关掉。

```
input:  1000 0.5 0
output: 0.5 1.0 True
```
'''
hints = [
  "在训练路径上除以 (1 - p)；这就是 dropout 和单纯把东西置零之间的全部区别。",
  "没有缩放，激活值会缩小为原来的 (1 - p) 倍，下游每一层在推理时看到的尺度都是错的。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "pytorch.hacker.12.gelu"
title = "transformer 里的那个"
story = "块里的 MLP 既不用 ReLU 也不用 sigmoid，候选人被要求写出它真正用的那个。"
brief = '''
第一行是 `n`。第二行是 `n` 个浮点数。

输出你的精确 GELU，四舍五入到四位小数，然后如果它与 `nn.GELU()` 的差在 `1e-5` 以内，输出 `True`。

精确的 GELU 是 `x · Φ(x)`，其中 `Φ` 是标准正态分布的 CDF：`0.5 · (1 + erf(x/√2))`。`tanh` 形式是近似，与默认版本的差**不在** `1e-5` 以内，这正是这道题的陷阱。

```
input:  3
        -1 0 1
output: -0.1587 0.0 0.8413 True
```
'''
hints = [
  "x * 0.5 * (1 + torch.erf(x / 2 ** 0.5)) ——torch.erf 是误差函数。",
  "nn.GELU(approximate=\"tanh\") 是另一个；默认的是精确版，你要对上的是它。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "pytorch.hacker.13.rmsnorm"
title = "根本不要均值"
story = "新一些的模型去掉了中心化这一步，用更少的算术得到了同样的结果。写出他们留下的那个。"
brief = '''
第一行是 `n d`。然后是 `n` 行，每行 `d` 个浮点数。

输出归一化后的每一行，四舍五入到四位小数，每行一行。

RMSNorm 除以这一行的均方根，**不**减去均值：`x / sqrt(mean(x²) + eps)`。用 `eps = 1e-6`。这就是它和 LayerNorm 的全部区别，也是它更便宜的原因。

```
input:  2 4
        1 1 1 1
        0 0 0 2
output: 1.0 1.0 1.0 1.0
        0.0 0.0 0.0 2.0
```
'''
hints = [
  "x.pow(2).mean(dim=-1, keepdim=True) 然后 sqrt ——用 keepdim，这样它能沿这一行广播回去。",
  "没有减均值，也没有偏置；一行全是一，出来还是一行全是一。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.hacker.14.sinusoidal"
title = "不要参数的位置"
story = "原始论文里的位置编码：没有表，不用训练，而且能延伸到比任何人给它看过的最长序列还要长。"
brief = '''
第一行是 `t d`，`d` 为偶数。

输出 `t × d` 的正弦位置编码，四舍五入到四位小数，每行一行。

偶数列是 `sin(pos / 10000^(2i/d))`，奇数列是同一个参数的 `cos`，其中 `i` 是配对的下标。所以位置 0 是 `sin(0), cos(0), sin(0), cos(0), …`——零和一交替的一行，这是值得最先做的检查。

```
input:  2 4
output: 0.0 1.0 0.0 1.0
        0.8415 0.5403 0.01 0.9999
```
'''
hints = [
  "频率是 1 / 10000 ** (i / d)，其中 i 取自 arange(0, d, 2) ——每一对一个，不是每一列一个。",
  "pe[:, 0::2] 和 pe[:, 1::2] 是偶数列和奇数列；两者用同一个 (t, d/2) 的参数。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.hacker.15.label-smoothing"
title = "永远不那么确定"
story = "模型是对的，却极度过度自信，校准图是一道悬崖。"
brief = '''
第一行是 `n c eps`。然后是 `n` 行，每行 `c` 个 logits，再是一行 `n` 个标签。

输出你的平滑后的损失，四舍五入到五位小数，然后如果它与 `nn.CrossEntropyLoss(label_smoothing=eps)` 的差在 `1e-5` 以内，输出 `True`。

标签平滑把 one-hot 目标替换为：真实类别上 `1 - eps`，再把 `eps / c` 分摊到**全部** `c` 个类别上——包括真实类别，而这个细节决定了你的数字能否与库对上。

```
input:  2 3 0.1
        1 2 3
        3 1 0
        2 0
output: 0.42206 True
```
'''
hints = [
  "(1 - eps) * nll + eps * (-logp.mean(dim=1)) ——第二项是均匀的那部分，覆盖每一个类别。",
  "把 eps / c 分摊到全部 c 个类别上，恰好就是整行 -log_softmax 的均值。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.hacker.16.focal"
title = "简单的不再算数"
story = "一万个背景块、四十个真目标，而损失完全由模型早已判对的背景构成。"
brief = '''
第一行是 `n gamma`。第二行是一个二分类问题的 `n` 个 logits。第三行是 `n` 个标签，每个为 0 或 1。

输出焦点损失（focal loss）的均值，四舍五入到五位小数，再输出普通二元交叉熵的均值，四舍五入到五位小数。

焦点损失是 `-(1 - p_t)^γ · log(p_t)`，其中 `p_t` 是模型给**真实**标签的概率。一个自信且正确的预测，`p_t` 接近 1，于是 `(1 - p_t)^γ` 接近零，它就不再贡献损失。

```
input:  2 2.0
        4 -4
        1 0
output: 0.00001 0.01815
```
'''
hints = [
  "torch.where(y > 0.5, p, 1 - p) 就是 p_t ——哪个标签是真实的，就是那个标签的概率。",
  "gamma = 0 时焦点损失退化回普通的 BCE，这是最先要跑的检查。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.hacker.17.grad-accumulation"
title = "装不下的批次"
story = "论文的批大小是 512，显卡只装得下 128。答案是四次反向传播加一次 step，再加上那个人人都会忘的除法。"
brief = '''
在 `k` 个微批次上累积梯度再更新一次，等价于一个大批次——**前提是**每个微批次的损失先除以 `k`。不做这个除法，梯度会大 `k` 倍，实际的学习率就悄无声息地被乘上了。

第一行是 `n k`。然后是 `n` 个浮点数，每个一个样本。

输出累积得到的梯度和整批的梯度，各自四舍五入到六位小数，然后如果两者的差在 `1e-6` 以内，输出 `True`。

```
input:  4 2
        1 2 3 4
output: 2.5 2.5 True
```
'''
hints = [
  "在每个微批次反向传播之前，把它的损失除以 k。",
  "这之所以成立，是因为各微批次大小相等；如果最后一批较短，就必须按样本数加权。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "pytorch.hacker.18.adam"
title = "写出 ADAM"
story = "凭记忆写出 Adam，并且让它在三步之后与库的结果一致。偏差校正就是这道题。"
brief = '''
第一行是 `steps lr`。第二行是 `steps` 个梯度，每步一个，作用在一个从 `0` 开始的标量参数上。

输出这些步之后你的参数，四舍五入到六位小数，然后是 torch 的，然后如果两者的差在 `1e-6` 以内，输出 `True`。

Adam，取 `β₁ = 0.9`、`β₂ = 0.999`、`eps = 1e-8`：

```
m = b1*m + (1-b1)*g
v = b2*v + (1-b2)*g*g
mh = m / (1 - b1**t)
vh = v / (1 - b2**t)
w = w - lr * mh / (sqrt(vh) + eps)
```

`t` 从 **1** 开始计数。没有偏差校正，最初几步会小得多，因为 `m` 和 `v` 从零开始。

```
input:  3 0.1
        1 1 1
output: -0.3 -0.3 True
```
'''
hints = [
  "t 从 1 开始，所以用 enumerate(gs, start=1) ——t 为 0 时，第一次校正就会除以零。",
  "梯度恒定时，校正后的 mh/sqrt(vh) 几乎正好是 1，所以每一步大约移动 lr。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "pytorch.hacker.19.padding-mask"
title = "不方正的批次"
story = "四个不同长度的句子放在一个张量里，模型在连同填充一起求平均。"
brief = '''
第一行是 `n t`。第二行是 `n` 个长度。然后是 `n` 行，每行 `t` 个浮点数。

以整数形式输出掩码，每行一行，然后在一行里输出每一行只在**真实**位置上求的均值，四舍五入到四位小数。

`torch.arange(t) < lengths.unsqueeze(1)` 一行就是掩码，不用循环。带掩码的均值是带掩码的和除以长度——除以 `t` 正是这道题要抓的 bug。

```
input:  2 4
