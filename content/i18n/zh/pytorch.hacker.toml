[[quest]]
id    = "pytorch.hacker.27.sgd-from-scratch"
title = "写出完整的 SGD"
story = "动量和权重衰减同时存在，而问题是哪一个先作用。"
brief = '''
第一行是 `steps lr mu wd`。第二行是 `steps` 个梯度，作用在一个从 `1.0` 开始的标量参数上。

输出这些步之后你的参数，四舍五入到六位小数，然后是 torch 的，然后如果两者的差在 `1e-6` 以内，输出 `True`。

Torch 的顺序是：权重衰减**先**并入梯度，然后动量累积衰减后的梯度，然后迈出这一步。

```
g = g + wd * w
b = mu * b + g
w = w - lr * b
```

在动量之后才衰减，或者直接衰减权重而不是衰减梯度，都会得到不同的轨迹——这个区别正是 AdamW 要处理的。

```
input:  3 0.1 0.9 0.1
        1 1 1
output: 0.388169 0.388169 True
```
'''
hints = [
  "先 d = g + wd * w，然后是缓冲区，然后是这一步。",
  "Torch 把动量缓冲区初始化为第一个衰减后的梯度，而不是 mu * 0 + g ——在这里两者是一回事，但值得知道这是个特例。",
]

