[[quest]]
id    = "pytorch.hacker.34.teaching-cluster"
title = "教学集群"
story = "7-32 室，最后一道题，考的就是楼下两层的那东西。搭出它的一个块，并证明它读不到未来。"
brief = '''
第一行是 `t d h seed`。

写出一个 **pre-norm 因果 transformer 块**的前向传播：LayerNorm、多头因果自注意力、残差、LayerNorm、GELU MLP、残差。每个权重都已给出；只缺 `forward`。

输出四样东西：输出的形状；如果注意力核心与 `F.scaled_dot_product_attention(..., is_causal=True)` 的差在 `1e-5` 以内，输出 `True`；如果这个块是因果的——改变**最后**一个 token 必须让之前的每一行输出都保持不变——输出 `True`；如果输出是有限的，输出 `True`。

因果性是一个性质，不是一段代码。一个通过了形状检查却没通过这一项的块，就是那个能训练到完美损失、却生成噪声的 bug。

```
input:  6 16 4 0
output: (6, 16) True True True
```
'''
hints = [
  "attend：按 sqrt(d // h) ——头的维度——缩放，然后用下三角掩码做 masked_fill，然后 softmax，然后 @ v。",
  "block 是两个残差：x = x + proj(attend(x))，然后 x = x + mlp(ln2(x))。pre-norm 意思是 LayerNorm 在每个分支里面，永远不在残差本身上。",
  "如果因果性检查失败，是掩码缺了或者放在了 softmax 之后；如果参照检查失败，是缩放用了 d 而不是 d // h。",
]
