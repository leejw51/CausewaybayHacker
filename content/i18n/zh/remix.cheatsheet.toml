'''
hints = [
  "值接收者得到的是一个副本，动的也是那个副本。改为接收地址。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "remix.cheatsheet.17.derive-ord"
title = "天生可排序"
story = "登龙街的鸡蛋仔队伍按票号排，再按名字排——而没有人为此写过规则。"
brief = '''
在 **Rust** 中，`struct P { x: i32, y: i32 }`，`v` 是一个 `Vec<P>`。放在 struct 上的哪一个属性能让 `v.sort()` 通过编译——先按 `x` 再按 `y` 排序——而不用手写任何 `impl`？
'''
hints = [
  "sort 要的是 Ord，而 Ord 建立在 Eq 和 PartialOrd 之上，它们又建立在 PartialEq 之上。把整条阶梯都 derive 出来。",
]

