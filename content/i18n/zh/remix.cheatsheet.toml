返回一个错误，它加上上下文 `load:`，**并且**把原来的错误保留在里面，使调用方的 `errors.Is(err, strconv.ErrSyntax)` 仍然为真。
'''
hints = [
  "把错误格式化进消息会把它变成文本，链条就断了。有一个动词是包装，而不是打印。",
]

