# ---------------------------------------------------------------- 30
[[quest]]
id    = "remix.cheatsheet.30.whole-quotient"
title = "整数商"
story = "在 7-32 室结账：一笔十八位数的总额三份平分，而蟒蛇要每一位都算对。"
brief = '''
在 **Python** 中，`a` 和 `b` 是 int：`a` 可能为负、可大到 `10**18`，而 `b` 为正。把 `q` 绑定为 `a` 除以 `b` 并**向下**取整的结果，一个每一位都精确的 `int`。
