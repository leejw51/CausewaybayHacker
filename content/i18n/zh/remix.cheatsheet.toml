title = "两个都留着"
story = "时代广场电影院外的两条队合成一条，两个带位员都还留着自己的名单。"
brief = '''
在 **Rust** 中，`a` 和 `b` 是 `Vec<i32>`。生成一个新的 `Vec` `c`，内容是 `a` 后面接 `b`，之后还要继续使用 `a` 和 `b`。
'''
hints = [
  "把 Vec 本身放进数组会把它们 move 掉。改放它们的切片。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "remix.cheatsheet.09.multi-key"
title = "两个键"
story = "骆克道的卡拉 OK 记分牌：最高分在最上面，同分按字母顺序。"
brief = '''
在 **Python** 中，`pairs` 是 `(name, score)` 元组的列表，分数是整数。原地排序：分数**降序**，分数相同时按名字**升序**。
'''
hints = [
  "一个键，两个部分。把数字取负只翻转它自己的顺序；`reverse=True` 会连名字也一起翻转。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "remix.cheatsheet.10.close-results"
title = "全部做完再关"
story = "四个速递员把包裹送到糖街的仓库。门要在最后一个到了之后才关，而不是第一个。"
brief = '''
在 **Go** 中，四个 worker goroutine 各自往**无缓冲**通道 `results` 发送，完成时调用 `wg.Done()`。然后 `main` 收集结果：

```
// ____
for r := range results { all = append(all, r) }
```

在循环前面放哪一行，能在正确的时刻关闭 `results`，让循环结束而不 panic、也不死锁？
'''
hints = [
  "只有在所有发送者都完成后才关闭，而且要在即将读取的那个 goroutine 之外的地方等待。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "remix.cheatsheet.11.shared-rx"
title = "一个收件口，四只手"
story = "怡和街厨房只有一个下单口，四个厨师伸手去拿——一次只能一只手。"
brief = '''
在 **Rust** 中，`let (tx, rx) = mpsc::channel::<i32>();`——四个 spawn 出来的线程都要从这一个接收端取任务。哪一行让 `rx` 变成每个线程都能拿到自己句柄的东西？
'''
hints = [
  "Receiver 不能 clone。共享一个：在锁外面套一个线程安全的引用计数指针。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.cheatsheet.12.sentinels"
title = "每人一个哨兵"
story = "7-32 室的打烊时间。夜班的每个工人都得被通知下班，一个一个来。"
brief = '''
在 **Python** 中，`ts` 是 worker 线程的列表，每个线程都在运行

```
while True:
    j = q.get()
    if j is None: break
    ...
```

生产者已经把所有任务放进了 `q`。哪一行能让**每个** worker 都停下，使 `for t in ts: t.join()` 能返回？
'''
hints = [
  "每个读到停止信号的 worker 都会退出，并把信号一起带走。数一数 worker 有几个。",
]

