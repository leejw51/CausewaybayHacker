# REMIX LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/remix/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "remix.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet.01.flush"
title = "冲刷缓冲"
story = "06:30，渣甸坊。售货亭把每个答案都写进了缓冲区，屏幕却一片空白。"
brief = '''
在 **Go** 中，`main` 是这样开头的：

```
in := bufio.NewReader(os.Stdin)
out := bufio.NewWriter(os.Stdout)
// ____
```

在那个位置放哪一行，才能保证写进 `out` 的所有内容在 `main` 返回时都显示到屏幕上？
'''
hints = [
  "带缓冲的写入器只有在 flush 时才真正写出。把 flush 安排在 main 返回的那一刻。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.cheatsheet.02.char-count"
title = "数字符，不数字节"
story = "百德新街的咖啡店招牌写着 \"héllo\"。收银机却数出了六个字母。"
brief = '''
在 **Rust** 中，`s` 是 `String` `"héllo"`。哪个表达式得到 5，也就是字符的个数，而不是字节的个数？
'''
hints = [
  "Rust 的 String 是 UTF-8 字节；`é` 占两个字节。逐个遍历 char 再数。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "remix.cheatsheet.03.grid"
title = "各自独立的行"
story = "利园宴会的座位表：改了一张桌子，所有桌子都跟着变了。"
brief = '''
在 **Python** 中，构造 `g`，一个 `n` × `m` 的全零网格，每一行都是**独立**的列表——写 `g[0][0] = 1` 只能改变第 0 行。
'''
hints = [
  "列表乘法复制的是引用，而不是行本身。每一行都要重新构造。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.cheatsheet.04.count"
title = "计数"
story = "海运街的大排档按菜名记单，新菜从零开始数。"
brief = '''
在 **Go** 中，`m := map[string]int{}`。给单词 `w` 的计数加一；没见过的单词从 0 开始。
'''
hints = [
  "从 Go 的 map 读一个不存在的键会得到零值，所以不需要先检查。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.cheatsheet.05.float-sort"
title = "浮点数排排站"
story = "波斯富街的金铺给一天的价格排序，每个价格都带着小数。"
brief = '''
在 **Rust** 中，`a` 是一个 `Vec<f64>`。把它原地升序排序。
'''
hints = [
  "`sort()` 需要 `Ord`，而因为 NaN，`f64` 不是 `Ord`。给它一个能给所有浮点数排序的比较器。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.cheatsheet.06.max-heap"
title = "最大的先出"
story = "铜锣湾邮票店的拍卖先收最高的出价。heapq 却只认得最小的。"
brief = '''
在 **Python** 中，`h` 是配合 `heapq` 使用的列表，而 `heapq` 是最小堆。把数字 `x` 压进去，使 `heapq.heappop(h)` 先给出**最大**的值（取出时再把符号翻回来）。
'''
hints = [
  "heapq 里没有最大堆。存值的时候让它们的顺序反过来。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "remix.cheatsheet.07.recursive-closure"
title = "调用自己"
story = "希慎广场的电梯：要搜遍每一层，搜索就得调用它自己。"
brief = '''
在 **Go** 中，一个闭包通过调用自己来遍历图：

```
// ____
dfs = func(u int) {
    for _, v := range g[u] { dfs(v) }
}
```

哪一行必须先写，函数体里才能引用 `dfs`？
'''
hints = [
  "用 `:=` 时，名字在它自己的字面量里还不存在。先用函数类型声明这个变量，再赋值。",
]

# ---------------------------------------------------------------- 08
