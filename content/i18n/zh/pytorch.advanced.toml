[[quest]]
id    = "pytorch.advanced.04.dtype-promotion"
title = "被取整的除法"
story = "归一化把计数除以总数，结果每个机架都是零，除了那个结果是一的。"
brief = '''
对两个整数张量做 `/` 得到浮点张量——torch 会做类型提升。`//` 保持整数并向下取整，而 `int_tensor /= 2` 会报错而不是悄悄截断，因为结果的 dtype 放不回原来的张量。

打印真除法、整除和显式浮点转换各自的 dtype 和值。

```
output: torch.float32 [0.5, 1.0, 1.5] torch.int64 [0, 1, 1] torch.float32 [0.5, 1.0, 1.5]
```
'''
hints = [
  "n / 2、n // 2、n.float() / 2 ——第一个已经做了提升，第二个没有。",
  "float32 张量无法精确存放一个很大的 int64；类型提升是一个决定，不是一种便利。",
]

