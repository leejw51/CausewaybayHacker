[[quest]]
id    = "pytorch.advanced.17.layernorm"
title = "按 token，不按批次"
story = "机架里的 transformer 对每个 token 各自归一化，而这里写的版本按批次归一化，批次一变就漂移。"
brief = '''
LayerNorm 在**特征**轴上归一化，一次一个 token，所以它不在乎批次里还有什么——这就是 transformer 用它而不用 BatchNorm 的原因。

写出来就是 `(x - mean) / sqrt(var + eps)`，均值和方差在最后一轴上用 `keepdim=True` 求，而方差的 unbiased 为 `False`。

亲手写出与 `nn.LayerNorm` 一致的结果，打印是否一致，以及某一行的均值和标准差。

按构造，均值是零，但在 float32 下它会落在零的某一侧、差那么一丝——而 `round(-1e-8, 4)` 是 `-0.0`，和 `0.0` 不是同一段文本。落在哪一侧是机器的事，不是你的事。print 里的 `+ 0.0` 就是用来摆平这件事的：按 IEEE 754，`-0.0 + 0.0` 是 `0.0`。

```
output: True 0.0 1.0
```
'''
hints = [
  "dim=-1 配 keepdim=True，方差上 unbiased=False ——LayerNorm 除以 n，而不是 n-1。",
