# PYTORCH LAND — ADVANCED, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/pytorch/advanced.toml`, quest by quest, and
# nothing else. Code blocks, identifiers, sample input and output and the
# exact strings a program must print are the English pack's and are copied
# verbatim, never translated.

pack   = "pytorch.advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.advanced.01.view-contiguous"
title = "拒绝执行的 view"
story = "批次在进来的路上被转置了，而那个用了一年都没事的展平操作现在报出一个关于连续性的错误。"
brief = '''
`view` 要求张量的内存已经按新形状所需的方式排好。转置不会移动任何内存——它只改变步长（strides）——所以对转置后的张量调用 `view` 会抛出 `RuntimeError`，这也是 PyTorch 面试必问的两三个错误之一。

`reshape` 在必要时会复制，两种情况下都能工作。`contiguous()` 显式地做这次复制，于是 `view` 又变得合法。

打印 `view` 在转置张量上失败，然后打印两种仍然能完成展平的方式。

```
output: RuntimeError True True
```
'''
hints = [
  "x.reshape(6) 必要时会复制；x.contiguous().view(6) 先复制，再做 view。",
  "转置改变的是步长，不是内存——而这恰恰是 view 无法容忍的。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.advanced.02.in-place"
title = "那个下划线"
story = "有人为了省内存加了一个下划线，现在反向传播报错，说求梯度需要的某个变量已经被修改了。"
brief = '''
结尾的下划线意思是*就地*：`relu_`、`add_`、`mul_`。就地操作省下一次内存分配，却毁掉了反向传播要用的那个值，而 autograd 会发现这一点——在 `backward()` 的时候，离肇事的那一行很远。

用非就地的方式做同样的算术，让反向传播活下来，然后打印梯度。

`y = w * 2`，然后 `y = y + 1`，然后 `loss = y.sum()`：损失对 `w` 的梯度对每个元素都是 `2`。

```
output: [2.0, 2.0, 2.0] caught
```
'''
hints = [
  "y = y + 1 把这个名字重新绑定到一个新张量；y += 1 会就地修改，弄坏计算图。",
  "加一个常数不改变梯度——d(2w + 1)/dw 仍然是 2。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.advanced.03.detach-clone"
title = "一份拷贝，一刀切断"
story = "日志代码存下的是损失张量而不是它的数值，到了 04:00，四个小时的计算图还全在内存里。"
brief = '''
`clone()` 复制数据并且**留在计算图里**——梯度会流经它。`detach()` 共享数据并且**离开计算图**——什么都不会流回去。它们不是二选一；它们回答的是不同的问题。

做快照时你要的是 `x.detach().clone()`：新的内存，没有计算图。

对这三者分别打印：是否 requires grad，以及是否与原张量共享存储。

```
output: clone True False detach False True snapshot False False
```
'''
hints = [
  "x.clone()、x.detach()、x.detach().clone() ——按这个顺序。",
  "detach 共享同一块内存，所以往它里面写，也就写进了原张量。",
]

