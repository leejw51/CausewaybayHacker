初始化为常数的层是对称的：每个单元得到同样的梯度，在整个训练过程中都和邻居一模一样。随机初始化打破了这种对称，而随机性的*尺度*决定了信号能否穿过深度活下来——这正是 Kaiming 和 Xavier 的用途。

