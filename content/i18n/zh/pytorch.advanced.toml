[[quest]]
id    = "pytorch.advanced.05.gather"
title = "它给正确答案打的分"
story = "从一批 logits 里取出每个样本在真实类别上的置信度，而做这件事的那个循环是整个评估里最慢的一行。"
brief = '''
`gather` 按下标从每一行挑出一个元素，不用循环。在一个 `(batch, classes)` 的概率张量和一个 `(batch,)` 的标签张量上，`probs.gather(1, labels.unsqueeze(1)).squeeze(1)` 就是模型给每个样本的正确类别的概率。

那个 `unsqueeze` 不是装饰：`gather` 的下标必须和源张量有相同的维数。

```
output: [0.7, 0.2, 0.9]
```
'''
hints = [
  "probs.gather(1, want.unsqueeze(1)).squeeze(1) ——dim 1 是类别轴。",
  "probs[want] 索引的是行，不是列，给出的是完全错误的三行。",
]

