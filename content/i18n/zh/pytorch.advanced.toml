[[quest]]
id    = "pytorch.advanced.09.stop-gradient"
title = "反过来学习的目标"
story = "目标网络本该站着不动，等在线网络追上来，结果两个都在动。"
brief = '''
当损失是针对某个模型产出的东西计算时，梯度会流进**两**边，除非你截断它。对目标调用 `detach()` 就是停止梯度，忘了它就是那种模型对着自己训练、最后坍塌的 bug。

在 `b` 被 detach 的情况下把 `a` 往 `b` 训练，打印两者中哪个得到了梯度。

```
output: True False
```
'''
hints = [
  "target = b.detach() ——现在目标只是一个数，不是要学习的东西。",
  "没有 detach，b.grad 也会被填上，目标会向预测漂移。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.advanced.10.retain-graph"
title = "想反向传播两次"
story = "一次前向传播上有两个损失，第二次 backward 报错，说缓冲区已经被释放了。"
brief = '''
`backward()` 边走边释放计算图。所以在同一次前向传播上第二次调用 `backward()` 会报错——缓冲区已经没了——而 `retain_graph=True` 就是保留它们的办法。

老实的修法通常是把损失加起来，只调用一次 `backward()`；`retain_graph` 是给你真的需要两次独立反向传播的时候用的，而且它耗内存。

保留计算图跑第二次，打印累积的梯度：在 `w = 2` 处 `d(w²)/dw + d(3w)/dw` 是 `4 + 3`。

```
output: caught 7.0
```
'''
hints = [
  "first.backward(retain_graph=True) ——这样第二次仍然有计算图可走。",
  "梯度会累积，所以打印出来的数是两个导数之和。",
]

