[[quest]]
id    = "pytorch.advanced.11.freeze"
title = "留着不动的层"
story = "只微调最后一层，结果整个主干都在动，因为交给优化器的是全部参数。"
brief = '''
冻结是两件独立的事，两件都要做。`requires_grad = False` 让梯度不再被计算；只把未冻结的参数交给优化器，让它不再更新其余参数。只做其中一件，就是常见的"冻了一半"的 bug。

冻结第一层，只把还在学习的东西交给优化器，打印各自看到多少个张量，以及被冻结的权重有没有动。

```
output: 2 4 True False
```
'''
hints = [
  "在循环里 p.requires_grad = False，然后按 requires_grad 过滤 model.parameters()。",
  "model.parameters() 仍然会给出被冻结的张量；只是优化器的列表变短了。",
]

