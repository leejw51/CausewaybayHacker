[[quest]]
id    = "pytorch.advanced.19.weight-decay"
title = "被拉回零"
story = "模型把训练集一字不差地背了下来，有一个权重是它邻居的四百倍大。"
brief = '''
权重衰减给每一步都加上一股往零拉的力。在普通 SGD 里它就是 L2 正则化：梯度加上 `wd * w`，所以即使完全没有别的梯度，权重每一步也会缩小为原来的 `1 - lr * wd` 倍。

这里的损失是常数，所以唯一在移动权重的就是衰减：`lr=0.1`、`wd=0.5` 下，`2.0` 变成 `2.0 * 0.95`。

```
output: 1.9
```
'''
hints = [
  "torch.optim.SGD([w], lr=0.1, weight_decay=0.5) ——衰减是优化器的参数，不是损失里的一项。",
  "偏置和归一化参数通常不参与衰减，这需要两个参数组。",
]

