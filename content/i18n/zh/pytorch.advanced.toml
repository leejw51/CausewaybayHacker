[[quest]]
id    = "pytorch.advanced.12.clip-grad"
title = "尖峰"
story = "03:40 一个坏批次，一个巨大的梯度，到 03:41 模型里每个权重都是 NaN。"
brief = '''
裁剪会重新缩放整个梯度向量，使它的范数至多为 `max_norm`，方向不变，步子变短。它放在 `backward()` **之后**、`step()` **之前**——放在别处就什么也不做。

`clip_grad_norm_` 返回它看到的范数，也就是裁剪之前的。

这里的梯度范数是 `sqrt(3² + 4²) = 5`；裁剪到 `1.0` 后，它变成同一方向上的单位向量。

```
output: 5.0 1.0 [0.6, 0.8]
```
'''
hints = [
  "nn.utils.clip_grad_norm_([w], max_norm=1.0) ——结尾有下划线，因为它就地修改 .grad。",
  "它返回裁剪之前的范数，这才是值得记进日志的那个数。",
]

