[[quest]]
id    = "pytorch.advanced.20.momentum"
title = "它会继续往前冲"
story = "沿着那条又长又浅的山谷，普通的一步要走一万次迭代。得有什么东西记得它原本就在往哪边走。"
brief = '''
动量维护一个滑动的速度：`v ← μv + g`，然后 `w ← w - lr·v`。Torch 的 SGD 做的正是这个，而把它写出来，是弄清 `μ` 是什么意思最便宜的办法。

梯度恒为 `1.0`，`μ = 0.9`，`lr = 0.1`，三步给出的速度是 `1`、`1.9`、`2.71`。

亲手实现这次更新，并把它和 torch 的结果并排打印。

```
output: [-0.1, -0.29, -0.561] True
```
'''
hints = [
  "v = 0.9 * v + 1.0，然后 mine = mine - 0.1 * v ——先算速度，再迈步。",
