[[quest]]
id    = "pytorch.advanced.06.masked-fill"
title = "负无穷"
story = "批次里的填充位被当成单词来关注，模型已经学会了预测填充。"
brief = '''
要把一个位置从 softmax 里去掉，你要在 softmax **之前**把它的分数设为 `-inf`，而不是在之后把它的概率设为零：`exp(-inf)` 是 0，其余概率加起来仍然是一。事后置零，留下的那一行加起来会小于一。

`scores.masked_fill(mask, float("-inf"))` 在布尔掩码为 `True` 的地方填充。

把最后一个位置掩掉，打印四舍五入后的概率和这一行的合计。

```
output: [0.7311, 0.2689, 0.0] 1.0
```
'''
hints = [
  "scores.masked_fill(keep_out, float(\"-inf\")) ——在掩码为 True 的地方填充。",
  "被掩掉的那一项分数最大；如果在 softmax 之后才掩，它还是会占主导。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.advanced.07.keepdim"
title = "消失的那一轴"
story = "从每一行里减去这一行的最大值，一个长方形的张量却得出一个方形的张量，而且什么都没报错。"
brief = '''
归约会去掉它所归约的那一轴。在 `(2, 3)` 上 `x.max(dim=1).values` 得到 `(2,)`，把它从 `(2, 3)` 里减去，会沿着**错误**的轴广播——它把 2 对到了 3 的位置上，而当数字恰好对得上时，就悄无声息地算出一堆胡话。

`keepdim=True` 把这一轴保留为大小 1，这正是广播想要的。

打印不带 keepdim 的形状、带 keepdim 的形状，以及减完之后各行的最大值——它们是零。

```
output: (2,) (2, 1) [0.0, 0.0]
```
'''
hints = [
  "x.max(dim=1).values 和 x.max(dim=1, keepdim=True).values ——max 返回的是具名元组，不是张量。",
  "这个减法正是数值稳定的 softmax 的第一行。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.advanced.08.batched-matmul"
title = "每个头一次乘法"
story = "四个注意力头，代码在 Python 里对它们循环。性能分析器说，这个循环就是整个模型。"
brief = '''
对超过两维的张量做 `@` 是**批量**矩阵乘法：最后两个轴是矩阵，前面的全是批次，而批次轴会广播。

`(B, H, T, d) @ (B, H, d, T)` 得到 `(B, H, T, T)`——这正是注意力分数张量，每个序列的每个头一次算完，没有循环。

把它建出来，打印形状以及它是否与循环得到的答案一致。

```
output: (2, 4, 5, 5) True
```
'''
hints = [
  "q @ k.transpose(-2, -1) ——用负数轴，所以无论批次有几维，同一行都能用。",
  "k.t() 只对二维张量有效，在四维张量上会报错。",
]

