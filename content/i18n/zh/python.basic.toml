[[quest]]
id    = "python.basic.04.control-flow"
title = "哪条过道"
story = "街市的过道编号漆在地上，门口的指示牌本该写明每条过道卖什么。它每次都只写编号。"
brief = '''
读取一个整数 `n`。对从 `1` 到 `n` 的每个 `i`，输出一行：

* 如果 `i` 能同时被 3 和 5 整除，输出 `FISHVEG`
* 如果 `i` 能被 3 整除，输出 `FISH`
* 如果 `i` 能被 5 整除，输出 `VEG`
* 否则输出 `i` 本身

然后继续读取整数，每行一个，直到读到 `0` 为止，再输出 `SKIPPED <k>`，其中 `k`
是途中读到的非零行数。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

两个循环，两种写法。第一个在开始之前就知道要跑多少次：`for i in range(1, n + 1)`。第二个不知道：`while True`
加 `break`，因为次数由你读到的内容决定。Python 的 `range` 在终点**之前**就停下，而 `range(1, n)`
是每个人在这里都会写错一次的差一错误。
'''
hints = [
  "先检查两者都满足的情况，否则它永远不会触发。能被 3 和 5 整除就是能被 15 整除。",
  "range(1, n) 停在 n - 1。起始代码就有这个 bug；样例输出会少最后一行。",
  "while True 加 break 是 Python 表达“出口在中间的循环”的方式。没有 do-while。",
]

