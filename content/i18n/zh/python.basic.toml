[[quest]]
id    = "python.basic.15.generators"
title = "你自己的 for 循环"
story = "鱼档的报价器从开盘价起按固定步长往上列出每一个价格，却从不在任何地方保存它们的列表。"
brief = '''
标准输入是三个整数：`start`、`step`、`count`。

写一个**生成器** `ticker(start, step, count)`，从 `start` 开始、每次前进 `step`，产出 `count`
个值。每个值单独输出一行，然后输出 `SUM <total>`，这个总和要通过把第二个 ticker 交给 `sum` 来计算。

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

最后一行是 `type(ticker(...)).__name__`，由起始代码现有的 `main` 打印。眼下它打出来的是
`list`。

含有 `yield` 的函数在你调用它时并不运行。它返回一个生成器，函数体一次走一步，每当有人要下一个值时才走一步。这就是为什么
`for` 对它有效、`sum` 对它有效，以及为什么它可以产出一百万个值，而一个一百万元素的列表从来不曾存在。

起始代码构建列表并返回它，这是正确的，但不是题目问的。列表是一次性给出所有值；生成器是被问到时给出一个值。把
`append` 改成 `yield`，删掉列表。
'''
hints = [
  "输出的最后一行是类型的名字，测试要的是 `generator`。这正是一个带 yield 的 def 返回的东西。",
  "先 yield value，再前进。函数在 yield 处暂停，下一次请求时从它之后恢复。",
  "生成器只能消费一次。这就是为什么 main 为求和另建了一个新的 ticker，而不是复用被循环耗尽的那个。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "python.basic.16.decorators"
title = "包起来"
story = "街市办公室想知道今天价格函数被调用了多少次，而那个函数不想知道自己正被盯着。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以千克计的重量。

`price(kg)` 是 `500 + 100 * kg`。用 `@counted` 装饰它，让每一次调用都被计数，而 `price`
自己毫不知情。每个重量输出一个价格，然后输出
`CALLS <n>`，然后输出 `NAME <price.__name__>`——它必须仍然说 `price`。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

装饰器是一个接收函数、返回函数的函数。它返回的通常是一个叫 `wrapper`
的闭包，先做点什么，然后调用原函数——而除非你另作声明，`wrapper` 就是名字 `price`
现在所指的东西，连 `__name__` 也是。`functools.wraps` 把原函数的名字和 docstring
复制到 wrapper 上。起始代码忘了它，于是最后一行说的是 `NAME wrapper`。

计数放在哪里？不放在全局变量里。把它挂在 wrapper 上——`wrapper.calls = 0`——事后读
`price.calls`。函数是一个对象，和其他对象一样可以带属性。
'''
hints = [
  "在 def wrapper 上面一行写 @functools.wraps(func)。你的装饰器里面再套一个装饰器。",
  "def price 上面的 @counted 等同于在它后面写 price = counted(price)。这个名字被重新绑定到 counted 返回的任何东西上。",
  "*args, **kwargs 是 wrapper 在不知道签名的情况下转发任意签名的方式，正是它让装饰器可以复用。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "python.basic.17.duck-typing"
title = "会叫就是鸭子"
story = "蛋档的一个塑料袋。没人问它是什么；他们问的是里面有几个、鸭蛋在不在里面，还有能不能一个一个地翻。"
brief = '''
标准输入是一行货品，用空格分隔，然后是一行，只有一个要找的词。

把货品放进一个 `Bag`，然后输出：

1. `LEN <k>` — 来自 `len(bag)`
2. 货品，每行一个 — 来自 `for item in bag`
3. `HAS <WORD> YES` 或 `HAS <WORD> NO` — 来自 `word in bag`
4. `LONGEST <item>` — 来自 `max(bag, key=len)`，长度相同时取第一个

```
input:  egg duckegg tofu
        duckegg
output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag` 不继承 `list`，也不需要继承。`len` 调用
`__len__`，`for` 调用 `__iter__`，`in` 调用 `__contains__`，而 `max`
只需要 `__iter__`。Python 从不问一个东西*是*什么；它只在需要的那一刻问它有没有那个方法。起始代码一个都没有，第一个错误是
`TypeError: object of type 'Bag' has no len()`。

`__contains__` 是可选的：没有它，`in` 会退回到逐个迭代比较，正确但更慢。还是把它写上，因为面试官说“把它做成一个容器”时，指的就是这个。
'''
hints = [
  "def __len__(self): return len(self._goods) — 三个方法，每个一行。",
  "__iter__ 可以直接返回 iter(self._goods)；它不必是生成器，不过 `yield from self._goods` 也行。",
  "max(bag, key=len) 在长度相同的项中保留第一个，所以样例说的是 duckegg 而不是后面的某个。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "python.basic.18.none"
title = "空"
story = "05:59，宝灵顿道。价格牌向记事本查一个还没开档的档口，记事本回答了一个“没有”，价格牌就把这个“没有”的价钱打了出来。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<STALL> <CENTS>`——已经开档的档口——然后是一个数量 `q` 和
`q` 个要查询的档口名。

对每个查询输出 `<STALL> <cents>`，如果该档口没开则输出 `<STALL> NONE`。然后输出 `MISSING <k>` 和
`CHEAPEST <STALL>`——已开档口中价格最低的那个，价格相同时按名字——如果一家都没开，输出 `CHEAPEST NONE`。

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

起始代码在 `CHAN` 上崩溃：

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

这一行就是 boss。它从不指向 bug 本身。它指向一个 `None` 最终被*使用*的地方，而那里离它被*制造出来*的地方可以有任意远——起始代码里，它是在两个不同的地方被制造出来的。`lookup`
对不存在的档口按设计返回 `None`，而调用方不问一声就从它上面读 `.cents`。`cheapest`
有一条路径上没有 `return`，于是它**隐式地**返回 `None`，调用方又对它做了同样的事。

Python 里每个函数都会返回点什么。一个走到末尾的函数返回 `None`。不带默认值的 `dict.get` 返回 `None`。两者在当时都不是错误；两者稍后都会变成错误。修法两次都一样：可能收到
`None` 的代码在碰属性之前先用 `is None` 检查。不是 `== None`，也不是 `if not stall`——价格为 `0`
的档口是真实存在的档口，`not` 会把它扔掉。

让 `lookup` 和 `cheapest` **有意地**返回 `Optional[Stall]`，在注解里说明，并在 `None`
落地的地方处理它。
'''
hints = [
  "从下往上读回溯：AttributeError 在 print 那一行，但 None 是前一行从 lookup 出来的，再往前是从 board.get 出来的。",
  "if stall is None: 就是那个检查。用 `is`，因为 None 是单个对象，身份比较才是诚实的比较；`==` 可以被重载，而 `not stall` 对一个为假但真实存在的值是错的。",
  "cheapest 有两条路径，只有一条有 return。Python 不会为此警告；它把 None 交给调用方，让调用方自己去发现。给空的情况一个显式的 `return None`，读者才能看出这是有意为之。",
  "注解里的 Optional[Stall] 不会被解释器强制执行。它是写给读者和类型检查器的一条说明，而读者才是那个赶时间的人。",
]
