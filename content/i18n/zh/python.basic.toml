[[quest]]
id    = "python.basic.14.dataclasses"
title = "谁在买"
story = "崇光地库的米柜台对每张卡都收全价，包括那些不是成人的，还有那张根本不是卡的。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<TYPE> <KG>`。

基础价格是 `500 + 100 * KG` 分。对每一行输出下列之一：

* `ADULT` — 基础价格
* `STUDENT` — 基础价格的一半，整数除法
* `SENIOR` — 永远是 `200`
* 其他任何值 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

把每一行建模成一个 frozen 的 `@dataclass`——`Order(kind: str, kg: int)`——并用对这个订单的**一个**
`match` 来决定价格。`match` 可以按关键字解构一个 dataclass——`case Order(kind="ADULT", kg=kg):`——而它的最后一个分支
`case Order(kind=other):` 会绑定所有没匹配上的情况。

起始代码的 `match` 只有一个分支，然后是一个兜底的 `case _:`，对所有东西都打印
`UNKNOWN`，包括它本该认识的那三种。分支按顺序尝试，第一个匹配的胜出，所以通配符必须放在最后，而且必须是唯一一个通配符。
'''
hints = [
  "每种类型一个 case：case Order(kind=\"STUDENT\"): 以此类推。dataclass 按字段名匹配。",
  "// 是整数除法；/ 会给你 450.0，而测试要的是 450。",
  "case Order(kind=other): 是一个捕获模式——它总能匹配并绑定那个标签——所以要放在最后，正如 Rust 的 match 里的 `other =>` 分支。",
]

