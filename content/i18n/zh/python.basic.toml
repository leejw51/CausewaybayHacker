二叉搜索树把较小的值放在节点的左子树，较大的放在右子树。插入是递归的：空子树（`None`）
变成一个新的 `Node`；否则值往一侧走下去，回来的东西再存为那个子节点，因为那个子节点
刚才可能还是 `None`。对 `None` 访问 `.left` 就是这整条路以之命名的崩溃——`None` 检查
在最前面，而且已经写好了。

```
if v < n.val:
    n.left = insert(n.left, v)
else:
    n.right = insert(n.right, v)
```

`Node`、`insert` 的 `None` 情况和它的 `if v < n.val:` / `else:` 骨架、`inorder`、`height`
和 `main` 都已写好。照样输入两行递归行，替换两个 `pass` 占位符。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if 下面 n.left = insert(n.left, v)，else 下面 n.right = insert(n.right, v)。",
  "赋值才是关键：insert 返回子树的根，子节点原来是 None 时它就是一个全新的 Node。",
]

