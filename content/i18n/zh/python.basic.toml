[[quest]]
id    = "python.basic.07.structs"
title = "一个摊位，三个字段"
story = "豆腐摊的卡片上有名字、价格和数量，收银机把卡片读成三个松散的词，什么也没加起来。"
brief = '''
`class` 把字段和作用于它们的函数捆在一起。`__init__` 在对象创建时运行，把字段存到 `self`
上；其他方法第一个参数都是 `self`，通过它读字段。没有 `this`——对象就是参数列表里排第一的
那个名字。

```
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        return self.price * self.qty
```

`Stall` 和它的 `__init__` 已经写好。照样输入 `total` 的 `return` 行。

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty ——字段住在 self 上，所以在方法里它们是 self.price 和 self.qty。",
  "在 total() 里单独的 price 不是一个名字；传进来的只有 self。",
]

