title = "加价"
story = "水果摊给早上单子上的每个批发价加同样的加价，而本该记住加价的那个函数返回的是 None。"
brief = '''
定义在另一个函数里面的函数可以使用外层函数的名字，而且在外层函数返回之后仍然可以用。
