# LUA LAND — VERY BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/lua/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "lua.verybasic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.verybasic.01.print"
title = "第一盏灯笼"
story = "21:00，浣纱街。火龙棚上方的灯笼牌还是暗的，今晚的第一行归阿美来敲。"
brief = '''
程序必须在一行里精确打印 `hello, causewaybay`。有一个内建函数把它的参数和一个换行写到标准输出。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 括号，逗号在字符串里面。",
  "print \"hello causewaybay\" 在 Lua 里是合法的——调用后面可以不加括号直接跟一个字符串字面量——但少了逗号。io.write 不写换行，而 puts 不是 Lua 认识的名字。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.verybasic.02.int-types"
title = "分香"
story = "在莲花宫门口，一捆捆香要分给火龙的各节；账上得说每节分几捆、还剩几捆，它却什么也不说。"
brief = '''
`a` 和 `b` 是整数。程序必须在一行里打印整数商和余数，用一个空格隔开。LuaJIT 只有一种数字类型，也没有整数除法运算符：`/` 给出带小数的结果，`math.floor` 把小数去掉，`%` 是余数。`print` 会在参数之间放一个 TAB，所以两个值要先用 `..` 拼成一个字符串。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — 先对除法向下取整，再用一个空格拼起来。",
  "a / b 是 3.5，不是 3。// 在 LuaJIT 里不是运算符。而 print(x, y) 用 tab 分隔，不是空格。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.verybasic.03.floats"
title = "精确的重量"
story = "书馆街火龙棚的秤按三位小数给出每个舞龙者分担的重量，印出来的场刊要两位；场刊上那一行是空的。"
brief = '''
`x` 和 `y` 是数字。程序必须打印 `x / y`，小数点后恰好两位。`string.format` 接受 C 风格的格式说明：`f` 是定点数，点后面的数字是小数位数。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(string.format(\"%.2f\", x / y)) — 2 前面的点表示小数位。",
  "math.floor(x / y * 100) / 100 仍然是数字，而数字打印出来是 3.5，不是 3.50；%d 是给整数用的。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.verybasic.04.strings"
title = "路线牌"
story = "莲花街口的路线牌用大写字母漆成，队员名单上却是小写；写牌师傅要把它大声喊回来。"
brief = '''
`s` 是一行文本。在打印它的长度之后，程序必须把 `s` 以大写打印出来。有一个字符串方法返回一个每个字母都大写的副本，而方法要用冒号调用，这样字符串会把自己传进去。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "print(s:upper()) — 冒号把 s 作为第一个参数传进去。",
  "用点的 s.upper() 什么也没传，upper 会抱怨它没拿到字符串；toUpperCase 是 JavaScript 的。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.verybasic.05.bool-if"
title = "单还是双"
story = "火龙的各节由双数号的人扛左边、单数号的人扛右边；浣纱街上一个舞龙者拿着自己的号码，要知道自己站哪边。"
brief = '''
`n` 是正整数。当 `n` 能被二整除时程序必须打印 `even`，否则打印 `odd`。条件是一个把余数和零比较的 `if` 头，以 `then` 结尾。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  4
output: even
```
'''
hints = [
  "if n % 2 == 0 then — 两个等号是比较；一个是赋值。",
  "n / 2 是带小数的；对正数 n 它永远不会是零。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.verybasic.06.loops"
title = "清点"
story = "今晚要烧的香数是一加二加三，一直加到最后一节，而火龙棚的计数板上是个零。"
brief = '''
`n` 是正整数。循环必须走遍从 1 到 `n`（含 `n`）的每一个整数，把每个都加进 `total`。数值 `for` 接受一个起点和一个终点，而终点是包含在内的。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  4
output: 10
```
'''
hints = [
  "for i = 1, n do — 终点包含在内，所以就是 n 本身。",
  "for i in ... 是另一种循环，接受一个迭代器函数；数字不是迭代器函数。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.verybasic.07.functions"
title = "舞龙者的工钱"
story = "沿浣纱街的头十圈，每圈付舞龙者五块，之后每圈付三块；算工钱的函数什么也没交回来。"
brief = '''
`pay(laps)` 必须返回工钱：头十圈每圈 5，第十圈之后每圈 3。函数用一个关键字把值交回去；只打印的函数交回的是 `nil`。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3
output: 15
```
'''
hints = [
  "return math.min(laps, 10) * 5 + math.max(laps - 10, 0) * 3",
  "只有一个参数的 math.max 就是那个参数本身：夜里走得少时 max(laps - 10) 会变成负数。而在 pay 里面 print，调用者打印出来的就是 nil。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.verybasic.08.structs"
title = "一个摊位，两个字段"
story = "维多利亚公园灯会的每个摊位，卡片上都有名字和价钱。卡片上的价钱从来没被存下来，标签只印出了半个摊位。"
brief = '''
`Stall.new(name, price)` 构造一个以 `Stall` 为元表的表——这就是 Lua 的类。它必须像存 `name` 那样把 `price` 存在对象上，这样 `s.price` 才能读回来。字段要写在 `self` 上；光秃秃的名字是局部变量。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "self.price = price — self 是那张表；光秃秃的名字是参数。",
  "两个等号是比较，而单独一个比较不是 Lua 接受的语句。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.verybasic.09.struct-method"
title = "这一行的总额"
story = "灯会面档的每张单都有一行是价钱乘数量，本该说出它的方法却什么也不说。"
brief = '''
`Stall:total()` 必须返回价钱乘以数量。用冒号声明的方法有一个隐藏的第一个参数 `self`，对象的字段要通过它来访问；单独的 `price` 是一个从没设置过的全局变量。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return self.price * self.qty — 两个字段都通过 self。",
  "单独的 price 是全局变量，是 nil，而 nil 不能相乘。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.verybasic.10.enums"
title = "路线颜色"
story = "天后站出口的港铁地图上写着三条线；队员手上有那个词，需要它代表的常量。"
brief = '''
`word` 是 `island`、`tsuenwan`、`kwuntong` 之一。Lua 没有枚举：`Line` 是一张存放具名数字的表，这是最接近的东西，而 `COLOUR` 以这些数字为键。程序必须把 `word` 变成对应的 `Line` 成员。表是用键来索引的，这里的键是大写的；表不能被调用，而 `Line.word` 找的是一个拼作 `word` 的键。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 方括号按名字查键，而名字是大写的。",
  "用小写的 word 做 Line[word] 找不到键，得到 nil，而 COLOUR[nil] 也是 nil：牌子上打印出 nil。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.verybasic.11.vector"
title = "龙节清单"
story = "从大坑道的货车上卸下来的每一节，都按到达的顺序记上清单，可清单一直是空的。"
brief = '''
`xs` 开始时是一张空表，而 Lua 的列表就是键为 1、2、3……的表。循环里读到的每个整数 `x` 都必须加到末尾，保持输入的顺序。`table` 库里有一个函数做这件事；两个参数时它追加，三个参数时中间那个是位置。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "table.insert(xs, x) — 表在前，一个值，放到末尾。",
  "表还是空的时候 xs[#xs] = x 写到下标 0，#xs 一直是 0；位置给 1 会把每一个都放到最前面，顺序就反了。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.verybasic.12.vector-edit"
title = "龙头卸下来"
story = "清单上的第一节是龙头，龙头单独插在一根杆上；它得从清单上拿掉，后面的每一节都往前挪一位。"
brief = '''
`xs` 装着这一行的整数，从下标 1 开始。程序必须删除下标 1 的元素，让其余的往下挪。`table.remove` 接受一个位置，并把后面的往前移；把某个位置设为 `nil` 留下的是一个洞，而不是更短的列表。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "table.remove(xs, 1) — 位置是第二个参数。",
  "不给位置的 table.remove(xs) 拿走的是最后一个；xs[1] = nil 在列表里留下一个 nil，而 table.concat 会拒绝它。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.verybasic.13.list"
title = "链子的前端"
story = "灯笼串挂满整条浣纱街，最新的一盏要挂在最前面；队员却一直把它挂到最后。"
brief = '''
`chain` 是一张当作列表用的表。Lua 没有双端队列；带位置的 `table.insert` 是最接近的东西，它会把那个位置之后的一切往后挪一位。循环里读到的每个 `x` 都必须加到最前面，这样最后读到的那个排在第一。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "table.insert(chain, 1, x) — 三个参数：表、位置、值。",
  "两个参数是追加到末尾；chain[1] = x 会覆盖最前面那个，而不是把它往后推；普通的表没有可以用冒号调用的 insert 方法。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.verybasic.14.maps"
title = "上香记账本"
story = "每条街一本本子，队员烧的每样东西一行，旁边记个数；某样东西第一次出现时，还没有那一行可以加。"
brief = '''
`counts` 是一张以单词为键的表。对每个单词 `w`，程序必须给它的计数加一，第一次从零开始。缺失的键读出来是 `nil`，而 `nil` 不能相加；`or` 提供默认值，而它的优先级比 `+` 低，所以默认值需要自己的括号。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts[w] = (counts[w] or 0) + 1 — 括号让默认值在加法之前生效。",
  "没有括号，counts[w] or 0 + 1 就是 counts[w] or 1：第一次见到是 1，之后每次都还是 1。对缺失的键做 counts[w] + 1 是对 nil 做算术。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.verybasic.15.hashtable"
title = "查找"
story = "灯会的摊位表把名字对应到编号，问一个不存在的摊位应该说 -1，而不是让牌子变空白。"
brief = '''
`stalls` 把名字映射到摊位编号。对单词 `w`，程序必须打印它的编号，`w` 不在表里时打印 `-1`。缺失的键是 `nil`，不是错误，而 `or` 把 `nil` 变成一个默认值。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "print(stalls[w] or -1) — or 的右边是默认值。",
  "名字缺失时单独的 stalls[w] 会打印 nil；stalls.w 找的是一个字面上叫 w 的摊位。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.verybasic.16.sets"
title = "不同的价格"
story = "六个灯笼摊位，三种不同的价钱。牌子要的是有几种不同的价钱，它却打印出六。"
brief = '''
`xs` 装着这一行的整数。程序必须打印其中有多少个不同的值。Lua 没有集合：一张以这些值为键的表是最接近的东西——同一个键存两次还是一个键——而计数循环已经用 `pairs` 遍历这些键，因为 `#` 只数从 1 开始的位置。每个 `x` 都必须作为键标记到 `seen` 里。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "seen[x] = true — x 是键，true 只是某个不是 nil 的东西。",
  "seen.x 是拼作 x 的那个键，所有东西都用这一个键；table.insert 会追加并保留重复；第一次时 seen[x] + 1 是对 nil 做算术。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.verybasic.17.stack"
title = "香堆"
story = "一捆捆香堆在火龙棚门边，从顶上拿走；跑腿的却一直从底下抽。"
brief = '''
`stack` 是一张当作栈用的表。程序必须把顶上（最后一个）元素拿下来放进 `top`。`table.remove` 删除并返回一个元素，不给位置时它拿最后一个。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4
        1 2 3
```
'''
hints = [
  "local top = table.remove(stack) — 不给位置就是最后一个。",
  "stack[#stack] 读出了顶上那个，却把它留在堆上；位置给 1 拿的是最底下那个。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.verybasic.18.queue"
title = "舞龙者的队列"
story = "舞龙者按在火龙棚签到的顺序被叫去扛龙；指挥却一直叫最新的那个名字。"
brief = '''
`q` 是一张按顺序装着舞龙者的表。Lua 没有双端队列；带位置的 `table.remove` 是最接近的东西，那个位置之后的一切都往前挪。程序必须把第一个拿下来放进 `first`。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 1
        2 3 4
```
'''
hints = [
  "local first = table.remove(q, 1) — 位置 1，其余的往前挪。",
  "不给位置的 table.remove(q) 从后面拿；q[1] 只读不删。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.verybasic.19.heap"
title = "最小的号码先来"
story = "各条巷子报上来的龙节号码没有顺序，指挥每次都要下一个最小的；装它们的那一堆根本不知道哪个是最小的。"
brief = '''
Lua 的标准库没有堆，所以起始代码带了一个小小的 `MinHeap` 类：`push` 加入一个值并把它上浮，`pop` 拿出最小的。每个 `x` 都必须通过堆自己的方法放进去，用冒号调用，让堆把自己传进去，这样之后 `pop` 才会先返回最小的。直接写进 `items` 会跳过上浮，顺序就乱了。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap:push(x) — 冒号把堆作为 self 传进去，push 把 x 上浮到它该在的位置。",
  "用点的 heap.push(x) 让 x 成了 self，而数字没有 items；table.insert(heap.items, x) 把 x 放到末尾，跳过了上浮。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.verybasic.20.sorting"
title = "灯笼价格阶梯"
story = "灯会牌子上的灯笼价钱是按摊位开张的顺序排的，买家想要最便宜的在前。"
brief = '''
`xs` 装着这一行的整数。在打印之前，程序必须把 `xs` 就地升序排序。`table` 库里有一个函数做这件事，默认升序；第二个参数会是一个比较函数。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "table.sort(xs) — 库函数，表作为它的参数。",
  "返回 a > b 的比较函数会降序排序；普通的表没有 sort 方法，单独的 sort 也不是全局变量。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.verybasic.21.sort-by-key"
title = "排行榜"
story = "火龙棚墙上舞龙者的榜按圈数从高到低，圈数相同的两人按名字排；榜上却是签到的顺序。"
brief = '''
`rows` 是一个表的列表，每个表有 `name` 和 `score`。它必须按分数降序排序，再按名字升序。`table.sort` 接受一个比较函数，回答 `a` 是否排在 `b` 前面；除非两者分数相等，否则由分数决定，相等时由名字决定。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "table.sort(rows, function(a, b) if a.score ~= b.score then return a.score > b.score end return a.name < b.name end) — 分数用大于号来降序，只在平局时才看名字。",
  "只比较分数的函数会让平局停留在排序碰巧访问它们的顺序；table.sort 不是稳定的。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.verybasic.22.reverse"
title = "从后往前"
story = "火龙的名字倒着漆在龙尾的横幅上，这样从另一边看是正的，场刊也要这样写。"
brief = '''
`s` 是一行文本。程序必须把它倒过来打印。字符串库里正好有一个方法做这件事，用冒号调用；`sub` 切出一段，但不会把它掉个头。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "print(s:reverse()) — 完整的方法名，加上冒号。",
  "s:sub(-1, 1) 要的是从最后一个字符到第一个字符的那一段，只要超过一个字母它就是空的。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.verybasic.23.closures"
title = "加价"
story = "灯笼摊给每个批发价都加上同样的加价，而本该记住加价的函数却把它忘了。"
brief = '''
`make_adder(k)` 定义了一个返回 `x + k` 的内部函数 `add`。它必须把这个内部函数本身交回去——函数和其他东西一样是一个值——这样以后可以调用 `add(x)`，而 `k` 被记住了。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add — 光秃秃的名字，没有括号。",
  "add() 不带 x 调用了它，加的是 nil；返回 k 交回去的是一个数字，而数字不能被调用。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.verybasic.24.lambdas"
title = "偶数的平方"
story = "双数号的龙节按号码的平方付钱，单数号的不付；火龙棚的账本要一个总数。"
brief = '''
`xs` 装着这一行的整数。Lua 没有内建的 `map` 或 `filter`，所以起始代码带了 `map(f, xs)`、`filter(f, xs)` 和 `sum(xs)`。`total` 必须是偶数值的平方和，用这三个函数加两个匿名函数拼出来——`function(x) ... end` 就是 Lua 的 lambda。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs)))",
  "filter 保留它的函数返回 true 的那些；map 做变换。函数外面光秃秃的 x * x 是全局变量 x，是 nil，拿来相乘。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.verybasic.25.threads"
title = "每一节同时开工"
story = "每一节的上香跑腿在自己的协程上算自己计数的平方，而总数在它们任何一个过了第一个 yield 之前就打印出来了。"
brief = '''
这里没有线程：协程是最接近的东西，一个只在被 resume 时运行、用 `yield` 把控制权交回去的函数。`workers` 里的每个工作者都已经启动——resume 过一次，跑到它的第一个 yield——还没有一个写下结果。在打印结果之前，主程序必须把每个 `co` 跑到结束。`coroutine` 库里有一个函数让协程从它 yield 的地方继续。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "coroutine.resume(co) — 就是启动它的那个调用，它会从 yield 的地方继续。",
  "coroutine.status(co) 只是询问；在主程序里 yield 是错误，因为没有东西可以 yield 回去；协程不是表，没有方法。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.verybasic.26.mutex"
title = "一个计数器，四只手"
story = "四个上香跑腿往火龙棚墙上用粉笔写的同一个计数上加，轮流拿粉笔；计数器有一把锁，可没有人在读之前拿锁。"
brief = '''
一次只运行一个协程，却照样有竞争：每个工作者读 `counter`，yield，再写回去，另外三个就在这个空隙里运行。Lua 没有互斥锁；`lock` 是一把小小的协作式锁，它的 `acquire` 会一直 yield 直到锁空出来，然后拿下它。在读之前，每个工作者都必须通过那个方法拿到锁——用冒号，让锁把自己传进去；释放已经写在写入之后了。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  1000
output: 4000
```
'''
hints = [
  "lock:acquire() — 然后是读和写，然后是已经在那里的释放。",
  "用点的 lock.acquire() 没有传 self，也就没有 held 可看；释放一把没人拿着的锁按设计就是错误。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.verybasic.27.binary-tree"
title = "零"
story = "21:00，浣纱街上的龙头：龙节号码放进一棵树，龙节从 1 开始，而 `segments[0]` 是 `nil`——龙头无处可寻，树的左枝是同一个无处，舞龙从第二盏灯笼开始。"
brief = '''
龙节号码被读进 `segments`，它像每个 Lua 列表一样从 1 开始——`segments[0]` 是 `nil`，还不存在的子节点也是；两者在被跟进之前都不是错误。`insert(n, v)` 返回放进了 `v` 的那棵树的根；`nil` 的情况和右边那一侧已经写好。对较小的 `v`，左子节点必须替换成往它里面插入的结果，这样一个 `nil` 子节点就变成了一个节点。

选出能做到这一点的那一行，然后把它敲在 `-- FILL` 注释所在的位置。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — 递归返回子树新的根；把它存起来。",
  "调用 insert 却不存结果，nil 就留在原处，也没有任何东西抱怨：nil 在被跟进之前不是错误。漏掉 v 会插入一个 nil 值，而下一次拿它做比较就是错误了。",
]
