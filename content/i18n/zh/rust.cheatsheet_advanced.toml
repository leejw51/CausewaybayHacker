```

哪个表达式填进空白？
'''
hints = [
  "从一个 Option 退回到另一个 Option，有立即求值和延迟求值两种口味；立即求值的那种即使命中也会对参数 —— 也就是网络调用 —— 求值。unwrap 在这里也不对：`v` 仍然是一个 Option。",
]

