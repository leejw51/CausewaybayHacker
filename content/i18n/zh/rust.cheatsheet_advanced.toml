# RUST LAND — CHEATSHEET ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code blocks,
# identifiers and printed strings are the English pack's and are copied verbatim,
# never translated.

pack   = "rust.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet_advanced.01.default-method"
title = "备用的那一行"
story = "06:50，渣甸坊楼上。阿薇名单上的每家店都能报出自己的名字；她想让它们全都会打招呼，又不想给每家各写一句。"
brief = '''
`Greet` 已经要求实现 `name`。往 trait 里加上 `hello`，使得
`impl Greet for Shop` **只**写 `name`，而 `Shop.hello()` 仍然能编译，
并返回 `name` 返回的内容。

```
trait Greet {
    fn name(&self) -> String;
    // ____
}
impl Greet for Shop { fn name(&self) -> String { "Sogo".into() } }
```
'''
hints = [
  "带函数体的 trait 方法对实现者来说是可选的；只有签名的则不是。这没有专门的关键字 —— 函数体本身就是全部信号。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.cheatsheet_advanced.02.trait-objects"
title = "什么形状都行"
story = "谢斐道的招牌店把正方形和圆形记在同一本订单簿里，每一个都知道自己的面积。"
brief = '''
`Shape` 是一个带 `fn area(&self) -> f64` 的 trait；`Sq` 和 `Ci` 都实现了它。
把 `shapes` 声明成一个可增长的列表，能同时装下一个 `Sq` **和**一个 `Ci`，
每个都放在堆上，使得 `shapes.iter().map(|s| s.area()).sum::<f64>()` 能用。
'''
hints = [
  "一个 Vec 里装两种具体类型，需要指向 trait 对象的指针；泛型参数会把类型固定成其中一种，而光秃秃的 trait 根本不是类型。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet_advanced.03.where-bound"
title = "最大的那个，不管是什么"
story = "崇光的价目板把价格存成 f64、把库存存成 i32，Ferris 想取两者各自的最大值，又不想写两个函数。"
brief = '''
`largest` 既在 `&[f64]` 上调用，**也**在 `&[i32]` 上调用。它用 `>`
比较，并返回指向胜者的引用。约束写在 `where` 子句里。

```
// ____
    let mut m = &v[0];
    for x in v { if x > m { m = x; } }
    m
}
```
'''
hints = [
  "`>` 只需要偏序，别无所求 —— 要求全序或完全相等的约束会把浮点数关在门外。而且函数体返回的是 `&T`，不是 `T`。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.cheatsheet_advanced.04.next-signature"
title = "FIB 交出来的东西"
story = "轩尼诗道上的电车号码一个一个地出来，每一个都由前两个得出。"
brief = '''
`Fib { a: u64, b: u64 }` 变成一个产出 `u64` 的迭代器：

```
impl Iterator for Fib {
    type Item = u64;
    // ____
        let r = self.a;
        self.a = self.b;
        self.b += r;
        Some(r)
    }
}
```

空白处的方法，trait 要求的是哪个签名？
'''
hints = [
  "这个方法会推进状态，所以它需要对 `self` 的独占借用；它还必须能表示“没有更多了”，所以返回的是包起来的元素，不是裸值。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet_advanced.05.box-dyn-error"
title = "两种麻烦"
story = "告士打道旁的支付路径可能在解析器里失败，也可能在账本里失败，而 `main` 得用一个 `?` 把两种都吞下。"
brief = '''
`AppError` 是一个自定义错误：

```
impl fmt::Display for AppError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, "app: {}", self.0) }
}
impl std::error::Error for AppError {}
```

这是它仅有的 impl —— `AppError` **没有**任何 `From` 转换。
在 `main` 里，`?` 既用在一个 `ParseIntError` 上，**也**用在一个 `AppError` 上。
`main` 用哪个签名能让两者都编译？
'''
hints = [
  "两种不同的错误类型穿过同一个 `?`，需要一个两者都能转换进去的返回类型：一个 trait 对象，而且得是有大小的 —— 所以它要放在指针后面。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet_advanced.06.from-for-question-mark"
title = "转换器"
story = "渣甸坊的收银机用自己的话报告解析失败；账本想要的是自己枚举里的说法，又不想每行都写一个 `map_err`。"
brief = '''
`enum AppError { Parse(ParseIntError), Neg }`。下面的函数必须
原样编译通过 —— 转换由 `?` 来做：

```
fn read(s: &str) -> Result<i32, AppError> {
    let n: i32 = s.trim().parse()?;
    if n < 0 { return Err(AppError::Neg); }
    Ok(n)
}
```

哪个 impl 头部，里面放上 `fn from(e: ParseIntError) -> Self { AppError::Parse(e) }`，
能让它成立？
'''
hints = [
  "`?` 调用一个特定的 trait 来转换错误，而这个 trait 是在目标类型上、为源类型实现的 —— 不是反过来，也不是它那个镜像的表亲。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.cheatsheet_advanced.07.map-err-chain"
title = "用她自己的话"
story = "7-32 室的账本把失败记成纯文本，所以解析器的错误在离开函数之前必须变成 String。"
brief = '''
这个函数返回 `Result<i32, String>`。`n` 是 `s` 解析出的 `i32`，
而坏的 `s` 要把解析器的消息作为 `Err` 返回，一行搞定。

```
fn read(s: &str) -> Result<i32, String> {
    // ____
    Ok(n * 2)
}
```
'''
hints = [
  "解析器的错误没有内置的到 String 的转换，所以单靠 `?` 做不到；先把错误变换一下，再传播出去。",
]

