[[quest]]
id    = "rust.cheatsheet_advanced.10.binding-and-guard"
title = "短的奇数步"
story = "Alex 在波斯富街的步行指令：走 1 到 5 个街区算短，而阿薇只在乎奇数的那些。"
brief = '''
`enum Cmd { Walk(i32), Wait }`。在 `Cmd::label(&self)` 里，加上这样一个分支：
`Walk` 的距离在 1 到 5 之间 —— **包含 5** —— 并且是奇数，打印出距离：

```
