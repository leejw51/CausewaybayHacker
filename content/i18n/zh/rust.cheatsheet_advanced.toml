[[quest]]
id    = "rust.cheatsheet_advanced.31.as-deref"
title = "名字只借不拿"
story = "阿薇在茶餐厅的挂账本上用 `Option<String>` 记着熟客的名字；收据打印机要的是 `&str`，而账本还得留着这个名字。"
brief = '''
`name: Option<String>` 里可能有一个熟客的名字。`n` 必须是从 `name`
**借来**的 `Option<&str>` —— 装着同样文字的 `Some`，或者 `None` —— 而下一行
还要打印 `name`，所以它不能被 move 走。

```
let n: Option<&str> = ____;
println!("{:?} {:?}", n, name);
```

哪个表达式填进空白？
'''
hints = [
  "借用这个 Option 得到的是指向 `String` 的引用的 Option，而不是指向 `str` 的。有一个方法能一步完成借用内部并 deref。按值 map 会把 String move 走，而 clone 出来的是一个在这一行末尾就死掉的临时值。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.cheatsheet_advanced.32.ok-or-else"
title = "只在空的时候"
story = "铜锣湾港铁站的储物柜每报告一个空格，就写一行审计记录 —— 而 Alex 说，满的格子一行都不许写。"
brief = '''
`slot: Option<u32>`。`audit(tag: &str) -> String` **每次被调用**都会往车站的
审计日志写一行，并返回错误文字。`r` 在 `Some(n)` 时是 `Ok(n)`，在 `None` 时是
装着审计文字的 `Err` —— 而满的格子不能碰日志。

```
let r: Result<u32, String> = ____;
```

哪个表达式填进空白？
'''
hints = [
  "把 Option 变成 Result 需要一个错误值，而参数即使用不上也会在调用前求值 —— 所以里面的副作用每次都会发生。交出去的应该是一个可以调用的东西，而不是值；也不是把闭包放在要值的位置上。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "rust.cheatsheet_advanced.33.map-or-else"
title = "端口，或者投诉"
story = "时代广场大屏幕的配置给出一个端口，或者一条解析投诉；状态栏一次就拼好其中之一并显示出来。"
brief = '''
`r: Result<u16, String>`。`msg` 在 `Ok(8080)` 时是 `"port 8080"`，在 `Err` 时是
`"bad: "` 后面接上错误 —— 对 `r` 只调用一次，不用 `match`，也不另外 unwrap。

```
let msg: String = ____;
```

哪个表达式填进空白？
'''
hints = [
  "一次调用的版本接收两个闭包，并且和它那个立即求值的兄弟一样，后备的那个排在前面。在 Result 上，后备闭包拿到的是错误，所以它接收一个参数 —— 而顺序颠倒的那一对在这里照样能编译，只是打印出错误的那一行。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "rust.cheatsheet_advanced.34.is-ok-and"
