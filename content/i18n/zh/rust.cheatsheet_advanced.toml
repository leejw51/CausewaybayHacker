[[quest]]
id    = "rust.cheatsheet_advanced.27.take-n-messages"
title = "恰好四条，不许挂起"
story = "骆克道的四个速递员各自用对讲机报回一个数字；调度员自己的对讲机还开着，却仍然必须在四条之后停止收听。"
brief = '''
`n: usize = 4`。四个线程各拿到一个 `tx.clone()`，每个在做完一些工作后发送
**一个** `u64`。原始的 `tx` **没有**被 drop，`main` 还留着它。
`r` 装着全部四条消息，而 `main` 不能挂起。

```
let (tx, rx) = mpsc::channel::<u64>();
for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "接收端上的阻塞迭代器只有在每个发送者都消失后才结束；`main` 里还留着一个，就按数量停下。非阻塞迭代器只返回到目前为止已到达的 —— 也许一条都没有。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.cheatsheet_advanced.28.global-counter"
title = "整栋楼一个数"
story = "整个时代广场只有一个入场计数器，从每扇门同时往上加，而它最好别在每只手里都是一份新副本。"
brief = '''
一个全程序范围、由每个线程共享的计数器，哪里都没有 `unsafe`。
`fn hit() { HITS.fetch_add(1, Ordering::Relaxed); }` 在四个线程里各调用 1000 次，
join 它们之后 `HITS.load(Ordering::Relaxed)` 必须是 `4000`。

模块级的 `HITS` 用哪个声明能做到？
'''
hints = [
  "有一个错误选项能编译并打印 0：`const` 在每次使用处都内联成一个新值，所以每次 `fetch_add` 加的都是副本。内存里那唯一的一个位置需要另一个项关键字 —— 而它的可变形式碰起来是 `unsafe` 的。",
]

