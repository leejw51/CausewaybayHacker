[[quest]]
id    = "rust.cheatsheet_advanced.09.let-else"
title = "第一个词，不然就走"
story = "大排档的点菜单可能是空白的；要是没有第一个词，阿薇就带着 0 走人。"
brief = '''
`w` 必须是 `s` 按空白分隔的第一个词 —— 一个在下一行用到的 `&str`。
如果一个都没有，函数就在那里直接返回 `0`。

```
fn first_num(s: &str) -> i32 {
    // ____
    w.parse().unwrap_or(0)
}
```
'''
hints = [
  "`let` 上的可反驳模式需要一个 else 分支，而那个分支必须离开 —— return、break、continue 或 panic；交回一个值不算离开。",
]

