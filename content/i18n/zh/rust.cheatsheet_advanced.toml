    Cmd::Wait => "wait".into(),
    // ____
    Cmd::Walk(_) => "walk".into(),
}
```
'''
hints = [
  "用 `@` 把一个名字绑定到范围模式上，然后守卫就能检验这个名字。留意哪种范围写法包含它的上端。",
]

