```

哪个表达式填进空白？
'''
hints = [
  "先 map 成 bool 再问它是不是 Ok，就把那个 bool 扔掉了；默认值设成 true 又会把糊掉的字放进来。有一个调用能同时检查变体和条件 —— 而它的闭包按值拿到这个数，不是隔着引用。",
]

# ---------------------------------------------------------------- 35
[[quest]]
