[[quest]]
id    = "rust.cheatsheet_advanced.08.option-chain"
title = "也许有个下标"
story = "铜锣湾站的储物柜号 `o` 可能是 None，也可能超出最后一个柜子；阿薇要的是柜子里的东西或者 -1，而且不能 panic。"
brief = '''
`v: Vec<i32>`，`o: Option<usize>`。`x` 是一个 `i32`：`v` 在那个下标处的元素；
如果 `o` 是 `None` **或者**下标越界，就是 `-1`。对任何 `o` 都不能 panic。
'''
hints = [
  "本身就返回 Option 的查找要用链式的方式接上，而不是 map，否则会得到 Option 套 Option。而且查找返回的是引用 —— 在给默认值之前先把它复制出来。",
]

