# C++ LAND — VERY BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/cpp/verybasic.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code and stay English. Code blocks,
# identifiers, sample input and output and the exact strings a program must print
# are the English pack's and are copied verbatim, never translated.

pack   = "cpp.verybasic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.verybasic.01.print"
title = "第一炮的第一句"
story = "12:00，午炮。开炮记录本该以一行开头，那一行却不见了。"
brief = '''
程序必须精确打印 `hello, causewaybay` 和一个换行。在 C++ 里，这是一条送往标准输出流的语句。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — 流、字符串、换行、分号。",
  "单引号是字符常量；字符串要用双引号。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.verybasic.02.int-types"
title = "INT 装不下的数"
story = "午炮的记录以百分之一为单位数着 1860 年以来打过的炮弹，而装它的寄存器只有 32 位宽。"
brief = '''
读入 `a`。程序需要 `big`：一个 64 位整数，装着 `a` 乘以十亿 — 一旦 `a` 大于 2，`int` 就装不下这个值。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3
output: 3000000000
```
'''
hints = [
  "`long long big = a * 1000000000LL;` — 后缀 `LL` 让常量也是 64 位。",
  "`int` 是 32 位：五十亿装不下，结果是垃圾值。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.verybasic.03.floats"
title = "带小数的潮水"
story = "潮汐表把一个读数除以另一个，打印出来却是整数，而港务长要的是两位小数。"
brief = '''
读入两个正整数 `a` 和 `b`。程序需要 `q`，即 `double` 形式的商 — 整数除以整数还是整数，除非先把其中一个转换。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "`double q = static_cast<double>(a) / b;` — 除之前先转换一边。",
  "两个整数的 `a / b` 先向下取整成整数，然后才变成 double。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.verybasic.04.strings"
title = "名字有多长"
story = "舢舨的名字漆在船头，港口记录要它的字符数。"
brief = '''
读一行到 `s`。程序必须打印它有多少个字符 — `std::string` 知道自己的长度。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  kwan lee
output: 8
```
'''
hints = [
  "`std::cout << s.size() << '\\n';` — `size()` 是一次调用，所以要有括号。",
  "`sizeof(s)` 是字符串对象本身的大小，不是里面文本的长度。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.verybasic.05.bool-if"
title = "单数还是双数"
story = "船排的绞车一次拉两艘舢舨，计数牌要说出最后一艘是不是单独上去。"
brief = '''
读入 `n`。程序需要 `even`：一个 `bool`，当 `n` 被二整除、没有余数时为真。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: even
```
'''
hints = [
  "`bool even = n % 2 == 0;` — `%` 是余数，`==` 是比较。",
  "单个 `=` 是赋值；比较要两个。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.verybasic.06.loops"
title = "数礼炮"
story = "炮打了 n 响，记录把它们的序号加起来，可它用的循环根本没开始。"
brief = '''
读入 `n`。程序必须把 `1 + 2 + … + n` 加进 `sum`。循环体已经写好；空着的是让 `i` 从 1 走到 `n` 的 `for` 头。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  10
output: 55
```
'''
hints = [
  "`for (long long i = 1; i <= n; ++i) {` — 三个子句，用分号隔开。",
  "`<` 差一个就停；`<=` 包括 `n` 本身。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.verybasic.07.functions"
title = "它的平方"
story = "泵房的仪表显示一个读数，显示屏要它的平方，而本该做这件事的函数返回的东西毫无用处。"
brief = '''
`square` 接收一个数，必须返回这个数乘以它自己。空着的是它的函数体；`main` 读入 `x` 并打印 `square(x)`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7
output: 49
```
'''
hints = [
  "`return x * x;` — 相乘，然后返回结果。",
  "在 C++ 里 `^` 是按位异或，不是乘方。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.verybasic.08.structs"
title = "一个档口，两个字段"
story = "避风塘的档口登记册每个档口记一个名字和一个价钱，新档口的记录是空的。"
brief = '''
`Stall` 有 `name` 和 `price`。程序已经读入这两个值，需要 `s`：用它们构造的一个 `Stall` — 聚合体用花括号初始化，字段按顺序。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
