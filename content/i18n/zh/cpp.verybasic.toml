        1 2 3
```
'''
hints = [
  "`seen.insert(x);` — set 用 `insert`，已经有的值它会忽略。",
  "`push_back` 是序列容器的说法；set 没有尾部。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.verybasic.17.stack"
title = "后进先出"
story = "避风塘厨房的出菜口盘子一个个叠起来，从最上面拿走，而这个栈一个盘子都不收。"
brief = '''
读入一行整数。每个 `x` 都必须压进 `std::stack` `st`；然后程序把所有东西弹出，按后进先出的顺序打印这些值。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "`st.push(x);` — stack 用 push，`top()` 看到的是最后一次 push 的。",
  "`push_back` 是 vector 用的；`std::stack` 说的是 `push`。",
]

