四个线程各自给 `counter` 加一，各加十万次。循环的每一轮在加的时候都必须持有互斥量 `mu` — 并在这一轮结束时释放。占位代码加了锁却从不解锁，所以第二轮永远在等；lock guard 在离开作用域时释放。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  (nothing)
output: 400000
```
'''
