        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "`std::sort(rows.begin(), rows.end(), [](const Row& a, const Row& b) { return a.score > b.score; });` — lambda 回答的是“a 是否排在前面？”。",
  "`<` 会把最小的放在前面；`>` 把最大的放在前面。",
]

