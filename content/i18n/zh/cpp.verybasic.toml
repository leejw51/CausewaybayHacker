brief = '''
`v` 装着这一行的整数，`sum_of` 把它们加起来。程序需要 `t`：一个运行 lambda 的 `std::thread`，这个 lambda 把 `sum_of(v)` 存进 `result`；`main` 对它 join 然后打印。lambda 必须按引用捕获，才能碰到 `v` 和 `result`。

