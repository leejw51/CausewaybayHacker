```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "`return price * qty;` — 按名字取字段，相乘。",
  "`this` 是指针，所以要写 `this->price`；直接用名字更简单。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.verybasic.10.enums"
title = "两条线，两种颜色"
story = "避风塘巴士站上方的转乘指示牌写着两条港铁线，而挑选枚举值的那根线断了。"
brief = '''
读入一个词，`island` 或 `tsuenwan`。程序需要 `line`：按这个词选出的一个 `Line` 枚举值；打印颜色的 `switch` 已经写好。`enum class` 的枚举值总是连同它的类型一起写。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "`Line line = word == \"island\" ? Line::Island : Line::TsuenWan;` — 条件运算符，枚举值带限定。",
  "前面没有 `Line::`，`Island` 就不是编译器认识的名字。",
]

