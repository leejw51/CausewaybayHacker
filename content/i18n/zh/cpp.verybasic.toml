output: fish 40
```
'''
hints = [
  "`Stall s{name, price};` — 花括号，字段按结构体声明它们的顺序。",
  "只给一个初始值只填第一个字段；价钱就成了零。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.verybasic.09.struct-method"
title = "档口自己的总数"
story = "每条档口记录都知道自己的价钱和数量，而它的 `total()` 对什么问题都答零。"
