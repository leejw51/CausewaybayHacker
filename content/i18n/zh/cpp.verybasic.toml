story = "系泊编号来的时候有重复，登记册应该每个只存一次，并且按顺序。"
brief = '''
读入一行整数。每个 `x` 都必须放进 `std::set` `seen`，它对每个值只留一份，按升序排列。打印大小和值的部分已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
