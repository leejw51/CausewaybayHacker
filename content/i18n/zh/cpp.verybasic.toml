# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.verybasic.21.sort-by-key"
title = "最重的渔获在前"
story = "渔获记录列出每艘舢舨的名字和重量，排行牌要最大的收获排在最上面。"
brief = '''
`rows` 装着 `Row{name, score}` 记录。程序必须按 `score` 排序，最高的在前 — 用 `std::sort` 加一个比较器 lambda，由它说明 `a` 什么时候排在 `b` 前面。分数互不相同。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

