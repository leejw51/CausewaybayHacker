[[quest]]
id    = "cpp.verybasic.13.list"
title = "排到最前面"
story = "避风塘的系泊名单是一个链表，每艘新来的舢舨都该插到最前面。"
brief = '''
读入一行整数。每个 `x` 都必须压到 `std::list` `l` 的**前端**，这样最后读入的最先打印。循环和打印已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
