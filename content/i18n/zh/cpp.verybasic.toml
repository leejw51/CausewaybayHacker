]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.verybasic.14.maps"
title = "计数牌"
story = "避风塘的计数牌给每种渔获计数，那个数却从来不动。"
brief = '''
读入一行词。对每个词 `w`，`counts` 里的计数必须加一 — `std::map` 在第一次用下标访问一个不存在的键时，会建出这个键并置为零。循环和排好序的打印已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "`++counts[w];` — 下标访问先把键建成零，然后自增。",
  "`at()` 遇到还不存在的键会抛异常；`[]` 会把它建出来。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.verybasic.15.hashtable"
title = "查得到，或者查不到"
story = "档口价钱放在一张哈希表里，查询一个谁都没听说过的档口必须答负一，而不是编出来的零。"
brief = '''
`table` 把档口名映射到价钱，由第一行建成。读入一个名字 `q`。程序需要 `price`：键存在时是表里的值，不存在时是 `-1` — 而 `[]` 会不声不响地插进一个零。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "`long long price = table.count(q) ? table[q] : -1;` — 先问，再取下标。",
  "对不存在的键用 `table[q]` 会把它以 0 插入 — 查询就会打印 0，而不是 -1。",
]

