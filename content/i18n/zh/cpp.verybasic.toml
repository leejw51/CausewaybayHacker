[[quest]]
id    = "cpp.verybasic.11.vector"
title = "渔获，一个接一个"
story = "舢舨一个数一个数地报上渔获，计数的 vector 却一直是空的。"
brief = '''
读入一行整数。每个值 `x` 读到时都必须追加到 vector `xs` 里；循环和打印已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "`xs.push_back(x);` — vector 在尾部增长。",
  "`push` 属于 `std::stack`；vector 说的是 `push_back`。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.verybasic.12.vector-edit"
title = "第一个走了"
story = "绞车队列是一个装着舢舨编号的 vector，第一艘已经拉上去了，却还在名单上。"
brief = '''
`v` 装着这一行的整数。程序必须删掉第一个元素 — `erase` 接收指向要删除元素的迭代器 — 然后打印剩下的。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "`v.erase(v.begin());` — `begin()` 是指向第一个元素的迭代器。",
  "`pop_back` 删的是最后一个；vector 没有 `pop_front`。",
]

