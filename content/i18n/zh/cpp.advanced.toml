`done` 已设置时停下。把两个都 join，然后输出 `CONSUMED <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

队列是 FIFO，所以无论调度器怎么做，顺序都是输入的顺序。`std::condition_variable` 让消费者
睡到有事可做为止，而不是在锁上空转：`cv.wait(lock, predicate)` 释放 mutex、睡眠，每次
被唤醒时重新检查谓词 —— 这替你处理了虚假唤醒，也是为什么带谓词的形式是唯一该写的形式。

初始代码会挂住。生产者压完所有东西就返回了，从来没有设置 `done`，也没有通知，所以消费者
为最后一个值醒来，排空队列，然后等待一个永远不会来的信号。每一对生产者/消费者都需要一种
方式来说*不会再有了* —— 这就是 `done`。
'''
hints = [
  "在生产者的循环之后：加锁，设置 done = true，解锁，cv.notify_all()。四行，程序就会结束。",
  "done 是在 wait 的谓词里、在 mutex 保护下被读的，所以它也必须在 mutex 保护下被写 —— 不加锁写的标志就是数据竞争。",
  "cv.wait 接收的是 std::unique_lock 而不是 lock_guard，因为 wait 必须对它解锁再重新加锁；每次唤醒都会重新检查谓词。",
]

