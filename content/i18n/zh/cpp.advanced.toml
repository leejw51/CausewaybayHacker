[[quest]]
id    = "cpp.advanced.17.segfault"
title = "错误的地址"
story = "12:00:00。午炮朝一个没有主人的地址开火，整个海滨都安静了。"
brief = '''
第一行是 `n`。接下来的 `n` 行是开炮表，`<NAME> <SECONDS>`。然后是一行 `q`，以及 `q` 个
要查询的名字。

对每个名字输出 `<NAME> FIRES AT <seconds>` 或 `<NAME> UNKNOWN`。然后输出
`LOADED <n> CHECKSUM <sum of every SECONDS in the table>`。

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

初始代码编译得干干净净，然后崩溃两次，原因各不相同，你得把两个都找出来。

第一个是校验和循环。它遍历 `1..n` 并读取 `table.at(i)`，而 `at` 会**检查**：下标 `n` 是
末尾之后的一个位置，所以它抛出 `std::out_of_range`，没人接住，进程中止。修好这个循环。
然后想明白 `at` 替你买到了什么：同一个循环如果用 `table[i]` 来写，是不会抛异常的。它会读取
碰巧在那个地址上的任何东西 —— 堆上的下一个对象，或者什么都没有 —— 并输出一个错了某个
谁也复现不出来的量的校验和。vector 上的 `[]` 不做检查。这就是这片土地上的交易：它很快，
而检查是你的工作。

第二个是 `lookup`。它返回一个 `Shell*`，当名字不在表里时它返回 `nullptr` —— 而调用者
看都不看就在上面写 `->seconds`。通过空指针读取是未定义行为；在所有运行它的机器上它也是
一次段错误，这是未定义行为最仁慈的形式，因为至少它会停下来。检查这个指针。这就是整个
boss，也是每一场 C++ 面试真正在问的问题：*那个地址上此刻是什么，又是谁说你可以读它的？*
'''
hints = [
  "把查找结果绑定到一个名字上并检查它：if (Shell* shell = lookup(...)) { ... } else { UNKNOWN }。这个指针同时是答案和问题。",
  "有效下标从 0 到 size() - 1。从 1 开始跑到 size() 的循环两头都差一，而只有上面那头会崩溃。",
  "at() 会抛出 std::out_of_range，而 [] 根本不检查；你得到的这次崩溃是好结果。你没得到的那个才是 boss。",
  "段错误是操作系统拒绝读取一个不属于这个进程的地址。地址 0 永远是其中之一，这就是为什么 nullptr 稳定地崩溃，而指向已释放内存的过期指针却不会。",
]

