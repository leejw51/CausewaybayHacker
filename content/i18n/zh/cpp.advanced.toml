locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.advanced.01.getline"
title = "舢舨日志"
story = "避风塘的港务长把每条舢舨记成一行：船名，然后是它卸下的东西，有多少个数字就记多少个。"
brief = '''
第一行是数量 `n`。接下来的 `n` 行，每行是一个船名，后面跟着零个或多个整数，用空格分隔。

每条船输出一行，格式为 `<NAME> <how many numbers> <their sum>`，最后输出
`BOATS <n>`。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

这里的单位是行，而不是记号。`std::cin >> x` 在空白处停下，不管换行，所以它没法告诉你
一条船在哪里结束、下一条从哪里开始。`std::getline` 给你整行；在这一行上再套一个
`std::istringstream`，你就又能用 `>>` 了，但只在这一行里面。

有一件事每个人都会被咬一次：`std::cin >> n` 之后，第一行末尾的换行符还留在流里，
第一次 `getline` 会把它读成一个空行。
'''
hints = [
  "读完 n 之后调用一次 std::getline(std::cin, junk)，把 >> 留下的换行符扔掉。",
  "std::istringstream fields(line); fields >> name; 然后 while (fields >> value) 走完剩下的部分 —— 没有东西可解析时循环就结束。",
  "船名是这一行的第一个记号，只有船名的一行给出 0 0，不需要特殊处理。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.advanced.02.references"
title = "副本不是原件"
story = "游艇会船排上的绞车操作员把每一次吊重都写在一张表的副本上，墙上那张表从来不变。"
brief = '''
标准输入是数量 `n`，然后是 `n` 个整数。

通过函数 `load` 把每个值压进同一个 `std::vector<long long>`，然后输出三行：
`LOADED <how many>`，来自只读函数 `total` 的 `TOTAL <sum>`，以及 `FIRST <value>`
—— 没有任何值时输出 `FIRST NONE`。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

初始代码能编译，输出 `LOADED 0`。`load` **按值**接收 vector，所以每次调用都拿到自己的
副本，压进去，返回时再把它扔掉。除非你另外说明，C++ 就是复制。

用 `&` 来另外说明：类型为 `std::vector<long long>&` 的参数是调用者那个 vector 的引用，
而不是它的副本。`total` 应该接收 `const std::vector<long long>&` —— 它需要看，不需要碰，
而 `const` 就是在签名里这样说的方式，编译器会让你说到做到。

`FIRST` 是一个指针：`long long* first` 要么是第一个元素的地址，要么是 `nullptr`，而
`nullptr` 是你在顺着它走之前必须检查的那个值。这就是这片土地的全部，浓缩成一行。
'''
hints = [
  "一个字符就能修好 load：std::vector<long long>& sheet。调用处不用改；引用会直接绑定到写在那里的实参。",
  "total 应该接收 const std::vector<long long>& —— const 是一个承诺，编译器会检查它。",
  "&sheet.front() 是第一个元素的地址，只有在有元素时才有意义；写 *first 之前先检查 nullptr。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.advanced.03.vector"
title = "船阵的中间"
story = "避风塘里四十条舢舨并排泊在一起。港务长看得见最外面和最里面的，中间的一条也看不见。"
brief = '''
标准输入第一行是数量 `n`，第二行是 `n` 个用空格分隔的整数。`n` 至少为 `1`。

输出三行：第一个值、最后一个值，以及严格位于它们之间的所有值的和。少于三个值时这个和是 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector` 就是这个序列。`front()` 和 `back()` 是两端；从 `begin() + 1` 到
`end() - 1` 是中间，而对这个范围调用 `std::accumulate` 就是和 —— 只要你交给它的初始值
是 `long long`。`std::accumulate(first, last, 0)` 用 `int` 求和，因为 `0` 是 `int`，
而有一个隐藏用例的中间部分装不进去。
'''
hints = [
  "nums.begin() + 1 和 nums.end() - 1 是迭代器，而 <numeric> 和 <algorithm> 正是用一对迭代器来表示一个范围。",
  "只有一两个值时这个范围是空的或者是反的 —— 在构造它之前先用 if 检查 nums.size()。",
  "0LL 很重要：accumulate 从初始值推导结果类型，而普通的 0 是 int。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.advanced.04.strings"
title = "字节不是字符"
story = "避风塘的告示板把「銅鑼灣」截在三个字节处，只剩下一个字。"
brief = '''
读取一行。输出三行：

1. 它的长度，以**字节**计
2. 它的长度，以**字符**计 —— UTF-8 码点
3. 把它的字符倒过来之后的这一行

```
input:  causeway
output: 8
        8
        yawesuac
```

这一行可能包含 ASCII 以外的字符，那时前两个数字就不一样了。`std::string::size()` 是字节数。
一直都是。`std::string` 对编码一无所知；它是一串 `char`，而一个 `char` 就是一个字节。

UTF-8 不用解码就很容易数：每个码点都以一个**不是** `10xxxxxx` 形式的字节开头，而每个
后续字节都是这种形式。所以字节 `c` 恰好在 `(c & 0xC0) != 0x80` 时开始一个字符。倒转的是
字符，不是字节 —— 直接对字符串用 `std::reverse` 会把 `銅` 切成三块，再倒着打印出来。
'''
hints = [
  "把字节当作 unsigned char 来遍历；普通的 char 可能是有符号的，那样对 0x7F 以上的字节做位测试就会出错。",
  "把每个字符收集成它自己的小 std::string，把这些字符串组成的 vector 倒过来，再拼起来。",
  "数一数满足 (c & 0xC0) != 0x80 的字节，就是不解码任何东西的字符数。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.advanced.05.classes"
title = "船排账本"
story = "游艇会船排对每次拖船上岸收费，并把各项记在一处 —— 至少在那条建议用一行注释替换掉这个类之前是这样。"
brief = '''
第一行是 `<BOAT> <n>`。接下来的 `n` 行是 `<ITEM> <CENTS>`。

为这条船建一个收集各项的 `Ledger`，然后按到达顺序把每一项原样输出为 `<ITEM> <CENTS>`，
然后是 `TOTAL <sum>`，然后是 `BOAT <name> <count>`。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` 可能是 `0`，那时只输出最后两行。

`class` 就是成员默认私有的 `struct`，除非你写 `public:`。构造函数在函数体有机会执行之前
就已经运行，所以成员是在**初始化列表**里设置的 ——
`Ledger(std::string boat) : boat_(std::move(boat)) {}` —— 而不是在大括号里赋值。
`total()` 什么都不改，所以它被声明为 `const`，这也是它能在 `const Ledger&` 上被调用的
唯一原因。
'''
hints = [
  "一个 std::vector<std::pair<std::string, long long>> 就够了。之所以要一个类，是为了让账本拥有它自己的各行。",
  "初始化列表 —— : boat_(std::move(boat)) —— 在构造时就设置成员；在大括号里赋值会先构造一个空字符串，再把它覆盖掉。",
  "以 const 引用返回各项，这样 main 遍历它们时不用复制 vector；每个不修改账本的方法都标上 const。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.advanced.06.enum-class"
title = "谁在掌舵"
story = "游艇会的闸口对每张卡都收会员价，包括那些不是会员的，还有那张根本不是卡的。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行 `<TYPE> <HOURS>`。

基础价是 `500 + 100 * HOURS` 分。每一行输出下面之一：

* `MEMBER` —— 基础价
* `CREW` —— 基础价的一半，整数除法
* `JUNIOR` —— 永远是 `200`
* 其他任何东西 —— `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

把卡建模成一个有四个值的 `enum class Card`，其中一个是 `Other`。`enum class` 的值不会在
背后偷偷转换成 `int`，也不会把它的名字泄漏到外层作用域 —— 普通的 `enum` 这两件事都会做，
而这两件事正是该写它的原因。

C++ 的枚举不能携带数据，所以不认识的标签要放在它旁边一起带着：一个小小的
`struct Tag { Card card; std::string raw; }`。用一个 `switch` 决定票价。覆盖每一个枚举值，
编译器就没什么可警告的；漏掉一个，`-Wall` 会告诉你是哪一个。
'''
hints = [
  "Card::Other 是第四个枚举值；它不认识的那个字符串就放在旁边的 Tag::raw 里。",
  "switch (tag.card)，每个枚举值一个 case，并在每个 case 里直接 return —— 每个分支都返回时就不需要 break。",
  "std::to_string 把数字变成 std::string；UNKNOWN 那一行就是用 + 拼接字符串。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.advanced.07.maps"
title = "避风塘在喊什么"
story = "正午的避风塘：每条舢舨都在喊着什么，港务长要一个排名。"
brief = '''
读取整个标准输入，按空白切分。

每个不同的词输出一次，格式为 `<word> <count>`，按次数降序排列，次数相同时按词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std::map<std::string, long long>` 按键排序，`std::unordered_map` 什么顺序都没有，两者都
不按次数排序 —— 所以排名是单独的一步：把条目复制进一个由 pair 组成的 `std::vector`，
再用一个比较器对它 `std::sort`。对一个不存在的键做 `counts[word]++`，会先以值 `0` 插入它，
这正是计数循环想要的。
'''
hints = [
  "while (std::cin >> word) 读取每个以空白分隔的记号，直到输入结束；counts[word]++ 就是整个计数循环。",
  "可以直接用 map 的 begin() 和 end() 构造一个 vector；每个元素是 std::pair<const std::string, long long>。",
  "比较器是一个 lambda，当 a 必须排在 b 前面时返回 true：先按次数降序，次数相同时按词升序。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.advanced.08.hashtable"
title = "根本没有顺序"
story = "避风塘的点名结果按字母顺序回来了，而港务长要的是船只实际应答的顺序。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行一个船名。`n` 至少为 `1`，一个船名是一串连续的
非空格字符。同一个船名可能出现不止一次。

每个不同的船名输出一次，格式为 `<name> <count>`，**按这个名字第一次出现的顺序**。
然后输出 `DISTINCT <k>`。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

这两种容器单独哪一个都给不了你这个，而这正是整个任务。

`std::map` 是一棵树：遍历它时名字是**排好序**交回来的，而那不是它们应答的顺序。
`std::unordered_map` 是哈希表：查找平均是 O(1) 而不是 O(log n)，但遍历它时名字是按
**根本没有规定的顺序**交回来的 —— 不是排序，不是插入顺序，两次也不一定相同。标准没有
承诺任何顺序，所以一个靠遍历 `unordered_map` 来输出的程序，它的输出取决于它链接的是哪个库。
初始代码正是这么做的，它甚至能通过只有一个不同名字的用例 —— 这恰恰是破绽：一个分辨不出
顺序的测试，不能证明顺序是对的。

把两件工作放在两个容器里：一个 `std::vector<std::string>` 记住名字第一次出现的顺序，
一个 `std::unordered_map<std::string, long
long>` 负责计数。输出时遍历 vector。
'''
hints = [
  "哈希表用来快速查找。vector 用来记住顺序。两个都需要。",
  "`count[name]++ == 0` 对每个名字恰好成立一次 —— 在插入时 —— 因为 operator[] 会把值默认构造为 0。",
  "输出时遍历 vector，再向 map 询问每个名字的次数，永远不要遍历 map。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.advanced.09.set-and-pair"
title = "谁泊在哪里"
story = "泊位板上同一条舢舨在同一个泊位登记了两次，谁也说不清哪几行是重复的。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行 `<BERTH> <NAME>`。

每个不同的 `<BERTH> <NAME>` 组合输出一次，先按泊位再按名字排序，然后输出
`DISTINCT <k>` 和 `DUPES <n - k>`。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

一个 `std::set<std::pair<int, std::string>>` 一次就做完这三件事：它拒绝任何已经在里面的
东西的第二份，它保持自身有序，而且 `std::pair` 本来就按输出想要的方式比较 —— 先比第一个
元素，再比第二个。用范围 `for` 遍历它，并用**结构化绑定** `const auto& [berth, name]`
把每个 pair 拆开，而不是用 `.first` 和 `.second`。
'''
hints = [
  "换一个容器：std::set<std::pair<int, std::string>>。插入重复项不是错误，而是什么都不做。",
  "set 按元素类型的 operator< 排序，而 std::pair 先比 first 再比 second —— 正是输出要的先泊位后名字的顺序。",
  "for (const auto& [berth, name] : moorings) 把每个 pair 拆成两个名字；n 减去 set 的大小就是重复的数量。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.advanced.10.algorithms"
title = "沿船排走一遍"
story = "绞车日志是一列吊重。Alex 说写三个 for 循环。Mei 说标准库早就替你写好了。"
brief = '''
标准输入是一行用空格分隔的整数。

输出四行：

1. 偶数值的和（没有偶数时为 `0`）
2. 每个大于 `10` 的值乘以二，保持原顺序，用单个空格连接 ——
   没有时输出 `-`
3. 有多少个不同的值
4. `FIRST_BIG <i>` —— 第一个大于 `10` 的值的 0 基下标，
   没有时为 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

用 `<algorithm>` 和 `<numeric>`，不要用下标循环：第一行用带 lambda 的 `std::accumulate`，
第二行用 `std::copy_if` 和 `std::transform`，第三行先 `std::sort` 再 `std::unique`，
第四行用 `std::find_if`。它们每一个都接收一对迭代器，需要做判断的地方再接收一个 lambda。
重点不在于循环难写；而在于名字说明了这个循环是干什么的。
'''
hints = [
  "accumulate 的第四个参数是一个二元函数 (acc, x) -> acc；让它只在 x 是偶数时才加上 x。",
  "copy_if 需要一个写入的地方 —— std::back_inserter(big) 会随写随增长 vector。transform 可以写回同一个范围。",
  "std::unique 把重复项移到末尾，并返回指向它们开始处的迭代器；它到 begin() 的距离就是不同值的个数。它只看得到相邻的重复，所以先对一份副本排序。",
  "find_if 没找到时交回 end()，找到时迭代器减去 begin() 就是下标。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.advanced.11.templates"
title = "只写一次"
story = "泵房的仪表板上 largest 写了四遍 —— 升数、分钟、水泵、水泵名字各一遍 —— 第五遍要在潮水转向之前写好。"
brief = '''
标准输入是两行：第一行是整数，第二行是单词。

写**一个**对两者都适用的 `largest`，以及一个带 `larger()` 和 `smaller()` 的类模板
`Pair<T>`。

输出最大的整数、最大的单词，然后是由前两个整数组成的 `Pair` 的
`PAIR <larger> <smaller>`。相等时算 `a` 是较大的那个。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

初始代码编译不过：`largest` 被钉死在 `long long` 上，所以把单词传给它就是
*no matching function*。**函数模板**
`template <typename T> T largest(const std::vector<T>& xs)` 会按它被调用时的每种类型
各生成一份 —— `T` 从实参推导出来，而函数体对 `T` 的唯一要求就是 `>` 能用在它上面。

`Pair<T>` 是同样的想法，用在类上。它的方法是 `const` 的，因为它们只读不写；它们返回
`const T&` 而不是副本，因为调用者只想看一眼。两个签名都说明了自己的承诺，编译器会让
它们说到做到。
'''
hints = [
  "在 largest 前面加 template <typename T>，并在函数里把所有 long long 换成 T。调用不用改；T 会被推导出来。",
  "std::string 本来就有 operator>，所以同一个模板函数体不加任何东西就能为单词编译。",
  "Pair<T> 是类模板；你在使用处写出类型 —— Pair<long long> —— 而方法是 const 的，因为它们只做比较。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.advanced.12.lambdas"
title = "门口计数"
story = "游艇会的闸机数着谁走进来、谁走出去，而经理只要关门时的那个数，不管中间发生了什么。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行是 `IN` 或 `OUT`。

维护一个永远不会低于零的累计数，每条命令之后输出它。然后输出 `INS <k>` —— 有多少条命令
是 `IN`，用 `std::count_if` 和一个 lambda 来数 —— 以及 `CLOSED <final>`。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

计数器是一个闭包：`make_counter` 返回一个拥有自己总数的 lambda。lambda 默认按值捕获，
而副本在函数体里是 `const` 的 —— 参数列表后面的 `mutable` 才让捕获的总数能在两次调用
之间改变。**初始化捕获** `[total = 0LL]` 直接在方括号里声明被捕获的变量，而不是在外层
作用域里声明，所以 lambda 外面没有任何东西可以让别人碰。

另一种捕获 `[&]` 按引用拿走一切。这个任务里两种都写到了；知道自己想要的是哪一种，正是
面试官在听的东西。
'''
hints = [
  "[total = 0LL](long long delta) mutable { ... } —— 初始化捕获声明了 total，而 mutable 让函数体可以给它赋值。",
  "没有 mutable，函数体就是闭包类型的一个 const 成员函数，total += delta 是编译错误，而不是悄无声息地什么都不做。",
