story = "夜班的泵一直跑到有人叫它停为止，而在这一班之前，谁也叫不停它。"
brief = '''
标准输入是数量 `n`，然后是 `n` 个整数。

启动两个 `std::jthread`。第一个对这些值求和并保存结果。第二个接收一个 `std::stop_token`，
在上面注册一个设置标志的 `std::stop_callback`，然后循环直到 `stop_requested()`。在 `main`
里对第二个线程调用 `request_stop()`，把两个都 join，然后输出：

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std::jthread` 就是加了两样东西的 `std::thread`，两样都是 RAII。它的析构函数会 **join**，
所以初始代码的中止 —— 一个仍然 joinable 就被销毁的 `std::thread` —— 不可能发生。它还带着
一个 `std::stop_source`：如果线程函数的第一个参数是 `std::stop_token`，`jthread` 就会传一个
进去，`request_stop()` 会翻转它，而析构函数在 join 之前会调用 `request_stop()`。一个检查
自己 token 的线程是你随时都能关掉的线程；不检查的，就是初始代码。

`stop_callback` 是被阻塞的线程得知消息的方式 —— 它在请求停止的那一刻、在发出请求的线程上
运行，它通常的工作是唤醒工作线程正睡在上面的条件变量。
'''
hints = [
  "把 summer 的 std::thread 换成 std::jthread，即使还没加 join，中止也消失了 —— 但还是要 join 它，在读取 sum 之前。",
  "第一个参数是 std::stop_token 的 lambda，会自动从运行它的 jthread 那里得到一个；接上就这么简单。",
  "std::stop_callback on_stop(token, fn) 是一个对象：它在构造函数里注册，在析构函数里注销，所以它和循环活得一样长，不多也不少。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.advanced.17.dangling"
title = "悬空"
story = "维多利亚公园的泵房，在喷水池下面两层。一个泵线程还在读一个缓冲区，而房间在交班时已经把它释放了。"
brief = '''
第一行是 `w n`：`w` 台泵和 `n` 个读数。第二行是这些读数。

`pump(w, buffer)` 启动 `w` 个线程；线程 `i` 把从 `i * n / w` 到 `(i + 1) * n / w` 的读数
加起来写进 `partial[i]`，然后 `pump` 返回这些部分和。`main` 为每一个输出 `PUMP <i> <sum>`，
再输出 `TOTAL <sum>`，然后如果在一切完成时缓冲区已经被释放，就输出 `FREED yes` —— 通过一个
`std::weak_ptr` 观察到。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

初始代码会中止。`pump` 在一个局部 vector 里建立它的线程，在它们还 joinable 时就返回了，
所以 vector 的析构函数调用了 `std::terminate`。去读一读它本来要做的事：那些线程持有
`buffer` 的一个**引用**，而 `pump` 的调用者正要让 `buffer` 死掉。一个在 vector 的析构函数
运行之后还读它的线程，读的是已释放的内存。有时它拿到旧的数字。有时它拿到下一次分配的东西。
有时分配器已经把这些页还回去了，它就段错误。这是未定义行为，而且是最昂贵的那一种，因为它
不在出错的地方失败。

修的是所有权，而不是症状。缓冲区是一个
`std::shared_ptr<const std::vector<long long>>`，每个线程捕获**它自己的一份句柄副本**，
而缓冲区恰好活到最后一个持有它的线程为止 —— 不管 `pump` 怎么返回，也不管线程按什么顺序
结束。返回之前 join。`main` 留着一个 `weak_ptr`，在 `pump` 返回并丢掉它自己的句柄之后，
`expired()` 就是证明：读数被释放了，只释放了一次，由最后完成的那台泵释放，而且已经没有人
还在读。

这就是整片土地，浓缩在一个程序里。没有任何东西替你检查。是你让生命周期与使用相吻合，而做到
这一点的工具 —— 会计数的智能指针，会等待的 join —— 就是你在基础路上遇到的同一个 RAII。
'''
hints = [
  "pump 里改两处：按值捕获 buffer（那个 shared_ptr），而不是按引用捕获 readings；并在返回前 join 每一个线程 —— 放在自己块里的 std::vector<std::jthread> 会在右大括号处完成 join。",
  "lambda 里的那份 shared_ptr 副本就是让 vector 活着的东西；它在线程函数返回时被释放，而不是在 pump 返回时。这就是引用和拥有者之间的区别。",
  "partial 仍然按引用捕获，这是对的：pump 拥有它，pump 在返回它之前 join，而且每个线程只写自己的槽位。",
  "main 故意把它的句柄移进 pump。如果它留了一个，FREED 就会是 no —— 缓冲区活着是因为 main 还拿着它，而能解释这一点，是这个 boss 接受的另一个答案。",
]
