4. `ALIVE no` —— 两个句柄都被 `reset()` 之后

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

`unique_ptr` 是一个拥有者。`shared_ptr` 是拥有者的计数，保存在对象旁边，计数归零时对象
就被释放 —— 由碰巧最后离开的那个句柄释放。复制句柄让计数加一；重置或销毁它让计数减一。
计数是原子的，所以两个线程可以各自安全地持有一个句柄；但*对象*并不因此变得线程安全，要碰
它仍然需要前面几张地图里的 mutex。

`weak_ptr` 是一个**不**计数的句柄。它能看到对象是否还在，如果在，可以用 `lock()` 把它
提升为 `shared_ptr`；它不能让对象继续活着。这就是打破环的东西 —— 两个互相持有
`shared_ptr` 的对象永远到不了零 —— 也是这条路最后一张地图要讲的内容。
