```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

初始代码能编译，启动了线程，然后中止。它从来不 join 它们，而一个在析构函数运行时仍然
**joinable** 的 `std::thread` 会调用 `std::terminate`。这不是库的 bug。一个比启动它的函数
活得更久的线程，会对着已经不存在的栈变量运行，而标准认定：一次你看得见的中止，好过一次
你看不见的对已释放内存的读取。

所以每个 `std::thread` 在离开作用域之前都要被 join（或者 detach，而那几乎从来不是你想要的）。
C++20 有 `std::jthread`，它在析构函数里 join —— 线程的 RAII，和锁的 `lock_guard` 是同一个
想法 —— 它是默认就该拿来用的类型。两种写法在这里都能通过。
'''
hints = [
  "最小的修法是一个循环：在输出任何东西之前 for (std::thread& t : threads) t.join();。",
  "更好的修法是换类型：std::vector<std::jthread>，让 vector 离开作用域时由析构函数去 join。",
  "把 jthread 的 vector 放在它自己的块里，这样 join 发生在右大括号处，在输出循环读取各行之前。",
]

