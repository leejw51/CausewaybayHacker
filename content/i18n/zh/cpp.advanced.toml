在 `main` 的**顶部**声明两个 `Guard` 值，分别叫 `first` 和 `second`，它们的析构函数输出
`DROP <name>`。在一个嵌套的块里，把这些值送进一个 `Tally`，它的析构函数输出
`TALLY <count> <sum>`。块结束之后输出 `DONE`。`main` 自己不输出别的任何东西。

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

除了 `DONE` 以外的每一行都是析构函数输出的。`Tally` 在它所在块的右大括号处死去，所以
`TALLY` 出现在 `DONE` 之前；两个 guard 在 `main` 返回时死去，按声明的**相反**顺序，所以
`second` 在 `first` 之前。这些都不是你安排的。是作用域安排的。

这就是 RAII，而这个名字比这个想法糟糕：资源绑定到一个对象的生命周期上，析构函数就是释放。
`std::lock_guard` 这样解锁，`std::unique_ptr` 这样释放内存，`std::ofstream` 这样关闭文件，
而提前的 `return` 或抛出的异常会一模一样地运行它们每一个。这三个你在下一张地图里都会遇到。
'''
hints = [
  "析构函数是 ~Guard() { ... } —— 没有返回类型，没有参数，你也从来不调用它；作用域会调用。",
  "里面那对大括号就是 TALLY 在 DONE 之前输出的全部原因。去掉它们，它就会在后面输出。",
  "析构永远是构造的逆序，这就是为什么 second 先走，也是为什么第二个获取的锁先被释放。",
]

