恰好一个拥有者，在析构函数里被 `delete`，不能复制，可以移动。裸 `Entry*` 是另一种指针 ——
它只看不拥有 —— 而遍历链条来输出正是裸指针该干的事。`nullptr` 既是链的结尾，也是空链，
