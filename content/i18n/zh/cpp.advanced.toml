`std::variant<long long, std::string> doubled(const std::string&)` 是*要么是翻倍后的值，
要么是失败的那一行* —— 恰好两种类型之一，从不两者都是，也从不两者都不是。
`std::get_if<long long>(&result)` 在里面装的是数字时给你一个指向它的指针，不是时给你
