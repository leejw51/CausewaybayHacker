[[quest]]
id    = "cpp.advanced.07.atomic"
title = "一个字，不加锁"
story = "闸机的计数不需要锁。泵房里别的一切都需要，而分清两者就是这份工作。"
brief = '''
标准输入是数量 `n`，然后是 `n` 个整数。

每个值启动一个线程。每个线程把自己的值加到一个共享的 `std::atomic<long long>` 上，并把
一个共享的 `std::atomic<int>` 加一 —— 任何地方都没有 mutex。把它们全部 join，然后输出
`TOTAL <sum>` 和 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

初始代码编译不过：lambda **按值**捕获了两个原子变量，而 `std::atomic` 没有拷贝构造函数。
这是故意的。原子变量是多个线程约定一次一条指令地更新的同一个位置；它的副本会是另一个位置，
共享就没了。按引用捕获它们。

原子变量不是更便宜的 mutex；它是另一种工具，用于在一条指令里完成读-改-写的一个机器字。
`fetch_add` 就是那条指令。一旦有两个字段必须彼此对得上，锁就回来了 —— 没有表示“这两样
东西，一起”的原子变量，这就是为什么上一个任务的 `Counter` 有 mutex，而这一个没有。

这里用 `std::memory_order_relaxed` 就够了，因为没有任何东西依赖这些自增相对于其他写入
*何时*变得可见，只依赖它们一个都不丢。这句话就是接下来的追问。
'''
hints = [
  "错误信息说 std::atomic 的拷贝构造函数是被删除的。捕获 [&total, &hits, value] 并去掉 mutable。",
  "fetch_add 返回之前的值，并原子地完成加法；没有锁，也没有 guard。",
  "在原子变量上 total += value 同样是原子的，也没问题；total = total + value 就不是 —— 那是一次读取和一次写入，中间有空隙。",
]

