title = "你自己的错误"
story = "泊位收费服务的四层各自抛出不同的东西，而它们上面没有任何一层接住其中任何一个。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行本该是以 km 计的距离。

`fare(text)` 用 `std::stoll` 解析 —— 它遇到 `xx` 会**抛出** `std::invalid_argument` ——
并通过抛出你自己的 `NegativeDistance` 来拒绝负距离；这是一个派生自 `std::runtime_error`
的类，它的 `what()` 内容是 `negative distance: <km>`。否则它返回 `500 + 100 * km`。

每个输入行输出一行：票价；解析不了时输出 `not a number`；距离为负时输出
`NegativeDistance` 的 `what()`。然后输出 `ERRORS <k>`，即有多少行失败了。

解析失败时输出的是你的话而不是异常的话，因为 `std::invalid_argument::what()` 是库想说
什么就说什么 —— 在 libstdc++ 上是 `stoll`，在 libc++ 上是 `stoll: no conversion` ——
而期望输出不能依赖于这个。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

初始代码能编译，然后在 `xx` 上死掉：一个没人接住的异常到达 `main` 的顶部，运行时调用
`std::terminate`，这就是你看到的 abort。一个带两个 `catch` 分支的 `try` 块就能修好它 ——
更具体的类型放在前面，因为分支是按顺序尝试的，如果 `std::runtime_error` 在前，它就会把
`NegativeDistance` 吞掉。永远按 `const&` 捕获：按值捕获会把派生的异常切割成它的基类，
丢掉你抛出的消息。
'''
hints = [
  "把调用包进 try { ... }，然后加上 catch (const NegativeDistance& e)，再加 catch (const std::invalid_argument&) —— 就按这个顺序。",
  "e.what() 就是你在构造函数里构建的消息；std::runtime_error 替你把它存着。",
  "未捕获的异常会调用 std::terminate，它中止进程，除了已经输出的内容之外什么都不会被刷出。初始代码在第二行就是这样。",
]

