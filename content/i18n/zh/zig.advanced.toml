[[quest]]
id    = "zig.advanced.18.threads"
title = "两条车道，一个计数器"
story = "07:00，天桥开放第二条车道，隧道口的车龙终于散了。广场上别的什么都没变。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个 `std.Thread`，计算它的平方并写进 `out[i]` —— 它自己的槽位，所以没有两个线程
会碰同一个元素。join 所有线程，然后每行输出一个结果，最后输出 `THREADS <n>`。

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

`std.Thread.spawn(.{}, worker, .{ args })` 在一个新的操作系统线程上用这些参数启动 `worker`，
返回句柄或者一个错误；参数会被复制进线程，所以传进去的切片是 `main` 内存上的一个视图，而传进去
的下标是那个线程自己的。这里没有闭包会按引用捕获错的东西：线程能看到的一切都在那个元组里，
你读得到。

线程按调度器喜欢的任意顺序结束。按下标写入、在 join 之后再输出，才让每次运行的输出都一样。
一个自己去输出的线程做不到这一点。
'''
hints = [
  "std.Thread.spawn(.{}, square, .{ nums, out, i }) 立刻启动线程并返回它的句柄；把句柄存在一个 std.Thread 的切片里，这样才能 join 它们。",
  "for (threads, 0..) |*t, i| 带着下标遍历句柄槽位；t.* = try std.Thread.spawn(...) 把每一个填上。",
  "在读 out 之前 join 每一个线程。join() 会阻塞直到那个线程结束，之后它写的东西就可见了。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.advanced.19.join"
title = "不签退，谁也不许走"
story = "一个车道线程做完了它的班，工头没拿它的句柄就走出了收费亭，整个广场的电就断了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行文本。

每行启动一个线程，把它转成大写写进自己的槽位。join 所有线程，按顺序输出这些行，然后输出 `DONE`。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

初始代码编译不过，而这个错误就是这一课。`std.Thread.spawn` 返回 `!std.Thread` —— 句柄，或者
一个错误 —— 而初始代码把它当作一条裸语句丢在了地上：*error union is ignored*。Zig 拒绝让一个
可能是错误的值不经检查就过去，这是在帮你：句柄是 `join` 的**唯一**途径，而一个没人 join 的线程，
在 `main` 返回时还在跑 —— 进程在它脚下结束了，那些行转了一半大写，或者根本没转，全看调度器。
C++ 在一个仍然 joinable 的 `std::thread` 被销毁时中止；Zig 让你把句柄握在手里，然后问你打算拿它
做什么。

所以每一个句柄都要留着，每一个线程都要在读取它的工作之前 join（或者 `detach`，而那几乎从来不是
你想要的）。形状和分配器一样：`alloc` 一个 `std.Thread` 的切片，填满它，join 它，`free` 它 ——
join 循环站在 C++ 析构函数原来站的位置。
'''
hints = [
  "编译器要你看一眼 spawn 的返回值。t.* = try std.Thread.spawn(...) 留住句柄并把任何错误往上交，这是对两半都诚实的处理。",
  "把句柄存在一个大小为 n 的 std.Thread 切片里；在输出任何东西之前 for (threads) |t| t.join();。",
  "先把它们全部 spawn，再把它们全部 join。在 spawn 循环里 join 在这里也能通过 —— 但线程就一个接一个地跑了，那不是线程的用途。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.advanced.20.mutex"
title = "一个硬币盘，八个收费亭"
story = "每个收费亭都把收到的钱加到广场墙上的同一个总数里，而到了整点，墙上的数和它们每一个都对不上。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个线程，把它加到**同一个共享总数**上。join 所有线程，然后输出 `TOTAL <sum>` 和
`THREADS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

初始代码能编译，输出 `TOTAL 0`。worker **按值**接收 `total` —— 一个被复制进线程参数元组的 `i64` ——
加到它自己的副本上，然后扔掉。传一个指针 `*i64`，你就有了另一个 bug，一个在这么小的测试里不会
露面的 bug：多个线程同时执行 `total.* += value` 是**数据竞争**。Zig 的 Debug 检查抓不到它；在这里
竞争和在 C++ 里一样是未定义行为，而不只是一个错的数字。

在总数旁边放一个 `std.Io.Mutex`，每个碰它的线程都先加锁，这就是答案：`m.lockUncancelable(io)`
拿到锁，`defer m.unlock(io)` 在块结束时把它还回去，不管中间发生了什么。worker 接收一个
`io: std.Io` 参数，因为互斥锁需要它 —— 在 0.16 里锁是 I/O 运行时的一部分，而不是线程库的，
`std.Thread.Mutex` 已经不存在了。这个 `defer` 就是 C++ 的 `lock_guard`，写在解锁将要发生的地方。
'''
hints = [
  "传 &total，而不是 total：worker 的参数变成 total: *i64，加法变成 total.* += value。线程应该改的是 main 的 total，而不是它自己的。",
  "在 main 里 var total_mutex: std.Io.Mutex = .init;，元组里放 &total_mutex，在 worker 里加法之前 m.lockUncancelable(io); defer m.unlock(io);。",
  "在所有 join 之后读 total 不加锁也安全：join() 是一个同步点，而且已经没有线程会再写了。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.advanced.21.counter"
title = "自己上锁的计数器"
story = "3 号收费亭的车轴计数器记着两个必须彼此一致的数字，而有两个人在同时读它们。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

完成 `Counter`：`add` 加锁，加到总数上并把命中次数加一；`snapshot` 加锁并把两者一起返回。每个值
启动一个线程，join 它们，然后输出 `TOTAL <sum>` 和 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

互斥锁住在结构体**里面**，挨着它守护的字段，每一个碰这些字段的函数都要拿它。这就是形状：锁是
对象的一部分，而不是寄希望于调用者记得的东西。

初始代码编译不过，原因值得花一分钟。`snapshot` 接收 `self: Counter` —— 按值，只读的方法通常
就是这么写的 —— 而给互斥锁加锁会*改变这个互斥锁*，所以 `self.mutex.lockUncancelable(io)` 要的是
`*std.Io.Mutex`，而一个按值的 `self` 能给出的只有 `*const`。更糟的是，按值的 `self` 是计数器的一个
**副本**：就算它编译过了，它锁的也是锁的副本，什么也锁不住。修法是 `self: *Counter`。这里没有
`mutable` 关键字可用，因为本来就没有要绕过的 `const` 方法：一个必须拿锁的方法在签名里就这么说，
而签名就是全部的承诺。
'''
hints = [
  "一个字符就能修好编译错误：fn snapshot(self: *Counter, io: std.Io) Snapshot。counter.snapshot(io) 读起来还是一样；Zig 会替你取地址。",
  "按值的 self 本来会是整个 Counter 的副本，连互斥锁一起。给副本加锁什么也保护不了，所以编译器的拒绝是正确的答案，而不是麻烦。",
  "Counter.add 是一个第一个参数为 *Counter 的普通函数，所以 std.Thread.spawn(.{}, Counter.add, .{ &counter, io, value }) 就是线程调用方法的方式。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.advanced.22.lock-order"
title = "两把锁，一个顺序"
story = "雨棚下两个硬币盘，两把锁，两个收费亭，两闸杆杆在同一秒停住了。"
brief = '''
两个硬币盘 `A` 和 `B`，各是一个 `i64`，各有自己的 `std.Io.Mutex`。

标准输入第一行是起始余量，第二行是数量 `n`，然后是 `n` 行 `<FROM> <TO> <AMOUNT>`，
`FROM`/`TO` 属于 `{A, B}`。

每笔转移在它自己的线程上执行，join 所有线程，然后输出 `A <level>`、`B <level>`、`MOVED <n>`。

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

初始代码有两处错，只有一处会在输出里显出来。它从来源扣了钱，却从不给目的地加上 —— 这是看得见
的 bug。另一处是形状：*先锁来源*意味着两笔方向相反的转移可以各自握着一把锁、等着另一把，永远
等下去。这就是死锁，它不会在测试里出现；它出现在某个星期二的 07:59。

Zig 没有一次拿多个互斥锁的 `scoped_lock`；最接近的是它所实现的那条规则，由你手工遵守。按**一个
全局顺序**拿两把锁 —— 先 `A` 的互斥锁再 `B` 的，在每一个线程里都是如此，不管硬币往哪边走 ——
环就形成不了。两个 `lockUncancelable`，两个 `defer unlock`，而 defer 按相反顺序释放，这也正是
`scoped_lock` 会用的顺序。
'''
hints = [
  "在碰任何一个余量之前把两个盘都锁上：先 a 的互斥锁，再 b 的，在每个线程里都按这个顺序，每个后面跟着它的 defer unlock。",
  "硬币的方向决定哪个余量减，而不是决定先拿哪把锁。",
  "两个 defer 按相反顺序释放：b 的锁先还，然后是 a 的。这是 C++ scoped_lock 会用的顺序，规则也一样 —— 每个线程都认同这个顺序。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.advanced.23.queue"
title = "递件口"
story = "一个收费亭把硬币从递件口送进点钞室，一个文员把它们取出来，而这个文员从 06:40 起就一直守着一个空的递件口。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

一个生产者把每个值推进一个 `std.Io.Queue(i64)`；一个消费者一次取出一个，输出它的两倍。生产者推完
所有值后，`main` **关闭**队列，而消费者在队列被取空且已关闭时停下。await 两者，然后输出
`CONSUMED <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

C++ 用一个 `std::queue`、一个互斥锁、一个条件变量和一个 `done` 标志搭出这个东西；Zig 0.16 把整套
做成了一个类型。`std.Io.Queue(T)` 是建在你自己拥有的缓冲区上的有界通道：`putOneUncancelable(io, v)`
在满时阻塞，`getOneUncancelable(io)` 在空时阻塞，而在 `close(io)` 之后，对一个已取空的队列 `get`
会返回 `error.Closed` —— 这就是消费者停下的信号，循环是 `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}`。队列是先进先出的，所以不管调度器怎么做，顺序
都是输入的顺序。

`io.concurrent(func, .{ args })` 在运行时自己的池上启动 `func` —— 它保证拥有自己的并发单元，否则
调用失败 —— 并交回一个 future；对它调用 `.await(io)` 就是 join。初始代码会挂住。生产者推完所有值
就返回了，没人关闭队列，消费者为最后一个值醒来，取空队列，然后等着一个永远不会来的下一个。每一对
生产者/消费者都需要一种方式来说*不会再有了* —— 这就是 `close`。
'''
hints = [
  "在 feeding.await(io) 之后加一行：hatch.close(io)。然后 taking.await(io) 就会返回，程序结束。",
  "close 不会扔掉队列里还剩的东西；消费者会一直拿到值直到队列空了，然后才看到 error.Closed。",
  "消费者运行时它是唯一在输出的，而 main 只在 taking.await(io) 之后才输出 CONSUMED —— 正是这个先后顺序让 writer 不加锁也安全。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.advanced.24.atomic"
title = "一个字，不用锁"
story = "车轴计数不需要锁。点钞室里别的东西都需要，而分清它们就是这份工作。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个线程。每个线程把它的值加到一个共享的 `std.atomic.Value(i64)` 上，并把另一个共享的
`std.atomic.Value(i64)` 加一 —— 哪里都没有互斥锁。join 所有线程，输出 `TOTAL <sum>` 和 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

初始代码编译不过：worker **按值**接收这两个原子量，而 `fetchAdd` 需要一个
`*std.atomic.Value(i64)` —— 按值的参数能给的只有 `*const`。这是有意的。原子量是若干线程约定一次
一条指令地更新的一个位置；它的副本会是另一个位置，共享也就没了。传地址。

原子量不是更便宜的互斥锁；它是另一种工具，用于在一条指令里完成读-改-写的一个机器字。
`fetchAdd(v, .monotonic)` 就是那条指令。一旦两个字段必须彼此一致，锁就回来了 —— 没有针对「这两样
东西，一起」的原子操作，这就是为什么前几个任务的 `Counter` 有互斥锁，而这一个没有。

这里用 `.monotonic` 就够了，因为没有任何东西依赖这些自增*何时*相对于其他写入变得可见，只要求一个
都不丢。这句话就是面试官的追问。
'''
hints = [
  "错误信息说它要 *atomic.Value(i64)，而手上只有一个 *const 的。把两个参数都改成指针，并在元组里传 &total 和 &hits。",
  "fetchAdd 返回之前的值并原子地完成加法；_ = 丢掉返回值，没有锁也没有 defer。",
  "total.raw += value 能编译，而它就是那个竞争；fetchAdd 是那条不竞争的指令。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.advanced.25.parallel-sum"
title = "把广场分开"
story = "一万二千个车轴读数，四个收费亭。主管要每个亭的份额和总数，而且总数每次运行都必须一样。"
brief = '''
第一行是 `k n`：`k` 个线程和 `n` 个值。第二行是这 `n` 个值。

把这些值分成 `k` 个连续的块 —— 块 `i` 覆盖的下标从 `i * n / k` 起，直到 `(i + 1) * n / k` 但不包括
它，用整数运算 —— 让线程 `i` 把它的块加起来写进 `partial[i]`。join 所有线程，然后按顺序为每个块
输出 `CHUNK <i> <sum>`，再输出 `TOTAL <部分和之和>`。

```
input:  2 5
        1 2 3 4 5
output: CHUNK 0 3
        CHUNK 1 12
        TOTAL 15
```

这是真正会因为线程而变快的形状，也是这张地图上唯一的一个：每个线程读自己的子切片、写自己的槽位，
所以没有锁，没有原子量，除了输入之外什么都不共享。把子切片本身交给线程 —— `nums[begin..end]`
是一个视图，而读者就该拿到视图 —— 再加一个指向它那一个槽位的指针。块边界的公式让划分恰好精确 ——
最后一块总是结束于 `n`，而当 `k > n` 时某个块可能是空的，有一个隐藏用例正是这样安排的；空切片
的和是 `0`，不需要特殊处理。
'''
hints = [
  "在 main 里算出 begin 和 end 并在那里切片：nums[begin..end] 是线程拿到的视图，&partial[i] 是它唯一可以写的槽位。",
  "线程里用一个局部 sum，最后对 slot.* 写一次，这样每个线程对共享切片恰好只碰一次。",
  "k > n 会让某些块为空 —— begin == end —— 而 nums[begin..end] 是一个空切片，它的 for 循环根本不会执行。没有特殊情况。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.advanced.26.futures"
title = "答应我那个数"
story = "主管派跑腿的去取每一个数字，自己不站在递件口干等；数字什么时候回来就什么时候回来。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个 `io.concurrent` 任务，返回这个值的平方。把 future 收集在一个列表里，**按顺序**
`await` 它们，逐个输出。然后把一个只有一个槽位的 `std.Io.Queue(i64)` 交给另一个线程，由它把 `n`
放进去，再根据取出来的东西输出 `READY <n>`。

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

future 是一个还没到的值。`io.concurrent(square, .{ v })` 在运行时的池上启动 `square`，给你一个
代表它返回值的 `std.Io.Future(i64)`；`.await(io)` 阻塞到值出现为止，然后交给你，只交一次。按顺序
await 这些 future，输出才有顺序 —— 任务本身什么时候结束就什么时候结束。

Zig 没有 `std::promise`；最接近的是同一根管道的另一端，而 0.16 已经有这根管道了。一个建在**只有一个
元素**的缓冲区上的 `std.Io.Queue(i64)` 就是一个承诺：一边把值放进去，另一边把它取出来，取的一方
阻塞到它出现为止。这是一个线程不用互斥锁、不用标志、也不用包装返回值就能报告一个结果的方式 ——
它和三个任务之前的递件口是同一个类型，只是缓冲区大小为一。

`io.concurrent` 承诺任务在自己的并发单元上运行 —— 如果运行时给不出线程，它就以
`error.ConcurrencyUnavailable` 失败 —— 而 `io.async` 给的承诺更弱：在一个没有第二个线程可给的
运行时上，函数*可能*就在原地、在 `async` 返回之前被调用。你要的是 `concurrent` 时，就明说出来。
'''
hints = [
  "try io.concurrent(square, .{v}) 返回一个 std.Io.Future(i64)；边走边把它追加到列表里，而且永远不要复制 future —— 通过指针 await 它，for (squares.items) |*f|。",
  "每个 future 的 f.await(io) 只能调用一次，并阻塞到值出现为止；按顺序遍历列表，输出就是有序的。",
  "报告线程拿到 &ready 和 n；main 里的 ready.getOneUncancelable(io) 会阻塞到 put 发生为止。在 main 返回之前 join 这个线程。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.advanced.27.optional-pointer"
title = "编译器说得出的大小"
story = "2 号收费亭票钉上那串收费收据：每张收据压着下一张，一直到这个班的第一张，而没有人会把同一张收据拿两次。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以分为单位的金额。

把它们按到达顺序放在一条链里，每个金额一个节点：

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

输出三行：

1. 按顺序排列、以空格分隔的金额，如果一个都没有就输出 `-`
2. `SUM <total>`，由一个在链上**递归**的函数算出
3. `LAST <cents>` —— 最后一个节点上的金额 —— 或者 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

初始代码编译不过，而这个错误正是指针存在的理由。写 `next: Entry`，编译器就得把 `Entry` 在内存里
排布出来：`cents` 的八个字节，加上一个 `Entry` 的大小 —— 而那正是它想要算出来的东西。
*struct 'Entry' depends on itself.*

`?*Entry` 是一个指针，而指针的大小编译器早就知道。Zig 没有 `unique_ptr`；最接近的是它所强制的那条
规则，由你手工遵守：**分配器是拥有者。**`gpa.create(Entry)` 给你一个节点，`gpa.destroy(node)`
把它还回去，恰好一次，而*谁*来销毁它，由约定来回答 —— 链拥有它的节点，所以 `main` 在返回之前
沿着链把它释放掉。`?` 是编译器确实会检查的那部分：`null` 既是链的末尾也是空链，而任何东西都不能
不解包就透过 `?*Entry` 去读，所以哪里都不需要单独的空情况。
'''
hints = [
  "一行就能修好编译错误：next: ?*Entry —— 现在这个结构体是十六个字节，不管它指向什么。",
  "从后往前建：node = try gpa.create(Entry); node.* = .{ .cents = v, .next = head }; head = node。旧的 head 变成新节点的尾巴。",
  "用 while (walk) |node| : (walk = node.next) 遍历；可选值每一步解包一次，循环在 null 处结束。递归求和两行就够：null 是 0，否则是 cents 加上其余部分的和。",
  "在声明 head 之后紧接着 defer freeChain(gpa, head)：defer 在运行时才读 head，也就是 main 结束、链已经完整的时候。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.advanced.28.refcount"
title = "还有谁拿着它"
story = "两个仪表通过同一本账读同一个硬币盘，而这本账必须留到最后一个仪表离开为止，多一秒都不行。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

把这些值放进一个由 `Ledger` 拥有的切片里，这个 `Ledger` **数着它的持有者**：`share()` 交出一个
句柄并把计数加一，`release(gpa)` 把计数减一，并在计数归零时释放切片。拿两个句柄，再留一个不计数
的观察者。输出四行：

1. `REF <sum>` —— 通过第二个句柄读出的和
2. `SHARED <k>` —— 两个句柄都活着时的计数
3. `ALIVE yes` —— 两个句柄活着时的 `watch.alive()`
4. `ALIVE no` —— 两个句柄都被释放之后

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig 没有 `shared_ptr`；最接近的是 `shared_ptr` 底下的东西，写在你看得见的地方。上一个任务是一个
拥有者。这一个是拥有者的计数，放在对象旁边，计数归零时对象被释放 —— 由碰巧最后离开的那个句柄
释放。`share()` 加计数；`release()` 减计数。没有任何东西替你做这两件事：右大括号处不会运行析构
函数，所以每一个 `share()` 都要配一个你亲手写的 `release()`，否则切片就泄漏了，而 `-O Debug` 的
分配器会在 `main` 返回时在 stderr 上说出来。

观察者就是 `Ledger` 本身，只看不计数。它能看到切片还在不在 —— `items` 是 `?[]i64`，最后一次
释放之后的 `null` 就是这个类型为「没了」给出的**零值** —— 而它不能让切片继续活着。这就是打破
循环的东西，也是这条路上最后一张地图要讲的。
'''
hints = [
  "share() 两行：self.refs += 1; return self。调用两次得到 SHARED 2，而 mirror.items.? 拿到的是同一个切片。",
  "release() 把计数减一，并且只有在它归零时才释放切片并把 items 设为 null —— alive() 读的就是那个 null。",
  "把两个句柄都释放；只释放第一个什么也不会释放，第二个才会。把原因说出来：这才是这个任务真正在问的问题。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.advanced.29.take"
title = "带走它"
story = "主管把每张单据交给骑手之前都要先影印一份，而复印机是广场上最慢的东西。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行文本。

每行建一个 `Docket`，放在列表 `pile` 里，然后把每张单据交给第二个列表 `sent`，从 `sent` 输出每张
单据转成大写的文本，然后输出 `SENT <n>`、`COPIES <c>`、`MOVES <m>`。

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        SENT 2
        COPIES 0
        MOVES 2
```

`Docket` 拥有它的文本 —— 一个它自己分配的 `[]u8` —— 并记录发生在它身上的事：`copy(gpa)` 复制
字节并把一个全局计数加一，`take()` 加另一个。初始代码报告 `COPIES 2`：
`sent.append(gpa, try d.copy(gpa))` 把每张单据连同字节全部复制了一遍。

Zig 没有移动语义，也没有移动构造函数；最接近的是一种纪律，而这个任务把它写出来。给结构体赋值
复制的是它的头部 —— 对 `Docket` 来说，就是文本的指针和长度 —— 所以 `sent.append
(gpa, d)` 会留下**两张**单据，都以为自己拥有同样的字节，而第二次 `free` 它们就是崩溃。`take()`
是诚实的交接：它返回一张持有文本的单据，并给来源留下一个**空切片**，所以来源仍然可以被释放 ——
释放的是空 —— 并且永远不会被当成还持有文本来读。这就是 C++ 所说的*有效但未指定*的被移动后状态，
写成了一个由你选定的值。
'''
hints = [
  "只改一个调用：sent.append(gpa, d.take())。take 需要 *Docket，这就是为什么循环已经用 |*d| 遍历 pile。",
  "pile 的 deinit 循环仍然会跑遍每一张单据；take 之后每张都持有一个空切片，而 deinit 对空切片会跳过 free。没有任何东西被释放两次。",
  "sent.append(gpa, d.*) 能编译，并输出 COPIES 0 MOVES 0 —— 然后在 main 结束时两个列表会释放同样的字节。这些计数器的存在，就是为了让诚实的交接和双重释放看起来不一样。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.advanced.30.generic-ring"
title = "装什么货都行的环"
story = "车轴仪表留着最近几个读数，主管留着最近几个车牌号，而 Alex 把同一个环形缓冲区写了两遍。"
brief = '''
第一行是容量 `cap`。第二行是一串整数；第三行是一串单词。

写**一个** `Ring(comptime T: type) type`：一个固定容量的缓冲区，保留最近推入的 `cap` 个元素，
覆盖最旧的，并且可以按到达顺序遍历。把整数推进一个 `Ring(i64)`，把单词推进一个
`Ring([]const u8)`，每个环的内容输出一行，然后输出 `DROPPED <k>` —— 总共有多少个元素被挤出去。

```
input:  2
        1 2 3 4
        hku tram bus
output: 3 4
        tram bus
        DROPPED 3
```

初始代码编译不过：`Ring` 是为 `i64` 写的，单词无处可放。Zig 里的泛型类型是一个**返回结构体的
函数**，和这条路前面的 `Pair(T)` 一模一样：`fn Ring(comptime T:
type) type { return struct { ... }; }`，槽位用 `[]T`，`push` 用 `T`。整个东西在不知道 `T` 是什么
的情况下写成 —— 只知道它能被复制 —— 而 `Ring(i64)` 和 `Ring([]const u8)` 是从同一个定义里压出来
的两个不同类型。

再给它一个迭代器。环不是按到达顺序存储的 —— 最旧的元素在写头即将覆盖的地方 —— 所以 `next()`
得自己算，而这正是值得亲手写、而不是读别人写的部分。输出需要对 `T` 做一个 `comptime` 分支，
因为单词是 `{s}`，数字是 `{d}`。
'''
hints = [
  "在结构体外面包上 fn Ring(comptime T: type) type { return struct { ... }; }，槽位用 []T，push 用 T，并用 const Self = @This() 在内部称呼这个结构体。然后在两处使用的地方写 Ring(i64).init 和 Ring([]const u8).init。",
  "最旧的元素在 (head + cap - count) % cap；按到达顺序的第 k 个元素是 (oldest + k) % cap。迭代器只需要带着 k 和一个指向环的指针。",
  "fn printRing(w, comptime T: type, ring: *const Ring(T)) 遍历迭代器；if (comptime T == []const u8) 选 {s} 而不是 {d}，另一个分支对那个 T 根本不会被分析。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "zig.advanced.31.invalidation"
title = "边走边删"
story = "主管一边往下读路边停车处的名单，一边划掉货车，而每划掉一辆，就漏掉下一辆。"
brief = '''
第一行是 `n t`。第二行是 `n` 个整数。

**原地**从列表里删掉每一个小于 `t` 的值，在一行里输出剩下的（如果什么都不剩就输出 `-`），然后
输出 `REMOVED <k>`。

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

初始代码是人人都会写一次的那个 bug：它按下标遍历，调用 `orderedRemove(i)`，然后执行 `i += 1` ——
而滑进槽位 `i` 的那个元素从来没被看过。两个相邻的小值，第二个就活了下来。这个 bug 至少是有定义的。
它的切片孪生兄弟就不是了：`for
(list.items) |v|` 只取**一次**切片，指针和长度，而循环里的 `orderedRemove` 在它脚下把列表缩短了。
循环继续按旧的长度走，读到新末尾之后的槽位 —— 列表仍然拥有、却已不再代表任何东西的内存 ——
而没有任何 Debug 检查会触发，因为那些字节在分配的范围之内。它通常看起来像是成功了，这更糟。

`orderedRemove(i)` 把 `i` 之后的一切往下挪一位，并交回它删掉的东西。所以：命中时，删掉并且**不要**
前进；没命中时，`i += 1`；绝不两者都做。自增写在分支里面的 `while` 循环就是这个形状，在链表和
哈希表上也是同一个形状。
'''
hints = [
  "去掉 while 上的 : (i += 1)。只在没有删除的那个分支里用 i += 1 前进；在另一个分支里，orderedRemove 已经把下一个元素挪进了槽位 i。",
  "moorings.items.len 在每次循环判断时都会重新读取，这就是 while 正确的原因：对切片的 for 会在一开始就把长度冻结。",
  "从末尾往回走是另一个正确答案 —— 在 i 处删除永远不会扰动它下面的槽位 —— 当他们问没有分支的版本时，就给这个。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "zig.advanced.32.overflow"
title = "停下来的计数器"
story = "广场的升数计数器是一个 i32，到了 2147483647 升，闸杆落下，收费亭屏幕上显示 panic: integer overflow。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数，每个都放得进一个 `i64`。它们的累计总和也放得进
`i64`。

输出两行：如果沿途每一个累计总和都放得进 `i32`，输出 `INT32 OK`，否则输出 `INT32 OVERFLOW <i>`，
其中是那个本会把它推出范围的第一个值的 0 基下标；然后输出 `INT64 <total>`。

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

初始代码把总数存在一个 `i32` 里，在第二个值上 panic：`panic: integer overflow`。这正是 Zig 在履行
这片领地的承诺 —— 在 `-O Debug` 下，溢出的整数会说出来并停下，而宽的那个用例还要早一行停下，在
那个本会截断 `5000000000` 的 `@intCast` 处。把这个 panic 当成礼物，然后读完合同的其余部分：`+%`
回绕，`+|` 饱和，而普通的 `+` 在 Debug 下 panic，在 **`-O ReleaseFast` 下是未定义行为**，那里检查
是关掉的，优化器假定它永远不会发生 —— 所以在 `v` 为正时，`total + v < total` 在那里*永远为假*，
这个测试会被删掉，和 gcc、clang 对 C++ 删掉它一模一样。

所以你永远不要通过制造溢出来检测溢出。你要在窄类型的加法*之前*检测它，用一个更宽的类型，或者
与极限值比较 —— `std.math.minInt(i32)` 和 `std.math.maxInt(i32)` —— 这样这个程序的期望输出就不
依赖于任何构建模式下未定义的东西。
'''
hints = [
  "把总数存在 i64 里，每次加法之后和 std.math.minInt(i32) 及 maxInt(i32) 比较。从头到尾不发生任何 i32 运算，所以什么都不会 panic，也没有什么是未定义的。",
  "只记下第一个离开范围的下标 —— 一个只设置一次的 ?usize —— 因为后面的值可能把总数带回范围内，而问题问的是它第一次离开的地方。",
  "如果你一定要把两个 i32 相加并想知道是否安全：@addWithOverflow(a, b) 返回回绕后的和以及一个进位位，在每种构建模式下都有定义。这才是检查；普通加法结果的符号，正是优化器会删掉的东西。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "zig.advanced.33.stop-flag"
title = "叫停就停"
story = "夜间车道一直开着，直到有人叫它停下，而在这个班之前，没有人能叫得停它。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

启动两个线程。第一个把这些值加起来并存下结果。第二个接收一个**停止标志**，一个
`*std.atomic.Value(bool)`，一直循环直到读到 `true`；读到时，它运行一个 `onStop` 函数来设置第二个
标志，然后记下它已经停了。在 `main` 里设置停止标志，join 两个线程，然后输出：

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread` 没有 `stop_token`，也没有 `jthread`；最接近的是构成它们的那些东西，由你手工传递。
停止请求是一个 `bool`，请求方写、工作线程读，而因为有两个线程碰它，它是一个原子量：一边是
`stop.store(true, .release)`，另一边在工作线程的循环里是 `stop.load(.acquire)`。一个检查自己标志的
线程是你随时都能关掉的线程；不检查的，就是初始代码里的夜间车道，它的 `join` 永远不会返回。

C++ 的 `stop_callback` 在请求停止的那一刻、在发出请求的线程上运行；这里是工作线程看到标志时自己
运行 `onStop`，这是同一个承诺 —— *因为有人要求停止，所以某件事发生了* —— 从另一边来履行。`store`
之后的 `join` 就是 `jthread` 的析构函数，写了出来：先请求，再等待。循环里的 `std.Thread.yield()`
把核心让给任何想用它的人；光秃秃地空转也能通过，也会浪费一个核心。
'''
hints = [
  "车道线程按指针接收三个标志；它的循环是 while (!stop.load(.acquire)) std.Thread.yield() catch {};，循环之后调用 onStop 并存下 stopped。",
  "在设置标志之前 spawn 车道线程，之后 join 它。在线程启动之前就设好的标志没问题 —— 它在第一次检查时就停下 —— 但没有 store 的 join 永远不会返回。",
  "store 上的 .release 和 load 上的 .acquire 是一对，它让 store 之前发生的事在 load 之后可见；.monotonic 在这里也能通过，而面试官会问为什么。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.advanced.34.unreachable"
title = "不可达"
story = "07:59，坚拿道天桥。车道模型把一个分支标成不可达，早高峰的车流到达了它，所有车道同时关闭 —— 而一个车道线程还在读一个广场早已交还的缓冲区。"
brief = '''
第一行是 `w n`：`w` 条车道和 `n` 个读数。第二行是这些读数。

`pump(gpa, w, ledger)` 在一个带引用计数的 `Ledger`（三个任务之前的那个）所持有的读数上启动 `w` 个
线程；线程 `i` 把从 `i * n / w` 到 `(i + 1) * n / w` 的读数加起来写进 `partial[i]`，然后 `pump`
返回这些部分和。`main` 为每一个输出 `PUMP <i> <sum>`，再输出 `TOTAL <sum>`，然后如果在一切完成时
读数已经被释放，就输出 `FREED yes` —— 通过账本的 `alive()` 观察到。

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

初始代码失败了两次，而这两次失败正是这片领地的两半。

第一次是车道模型。`pump` 算出每条车道的边界，然后说 `if (begin == end) unreachable;` ——
*没有车流的车道不可能发生*。三条车道分两个读数，它就发生了。`unreachable` 不是注释，也不是断言：
它是 Zig 里唯一一行意思是**假定**的代码。在 `-O Debug` 下到达它就是
`panic: reached unreachable code`，广场停下，原因显示在屏幕上。在 `-O ReleaseFast` 下编译器*相信*
你 —— 这个分支被删掉，所有只可能通向它的东西也一起被删掉 —— 而到达它的程序是未定义的，和一个
透过悬空指针去读的 C++ 程序是未定义的完全一样。panic 是同一份合同的诚实版本。删掉这个断言，处理
这种情况：空车道的和是 `0`。

第二次是所有权。初始代码的 `pump` 在启动车道之前就**释放**了账本 —— *工作线程已经有了它们的切片，
句柄用不着了* —— 而这次释放是最后一次，所以读数被释放了，而工作线程照样去读。在 Debug 下，分配器
会把它收回的内存每个字节都涂成 `0xAA`，所以每个读数回来都是 `-6148914691236517206`，而第一条把
其中两个相加的车道就用 `panic: integer overflow` 让广场停下 —— 这就是可见用例显示出来的失败，那里
每条车道都有车流，`unreachable` 从未被到达：一个对输入中任何读数都不可能溢出的和，以及一条指向
并非错误所在那一行的调用栈。在 ReleaseFast 下没有涂色也没有检查：
车道读到的是下一次分配放在那里的任何东西，或者是一页已经被内核收走的内存。这就是悬空读取，而它是
最昂贵的那种 bug，因为它不在出错的地方失败。

修的是所有权，而不是症状。每条车道在启动之前**拿一份**账本的份额，做完时释放，所以读数恰好活到
最后一个持有它们的线程为止 —— 不管车道按什么顺序结束。`pump` 在返回之前 join，并最后释放 `main`
交给它的那个句柄。回到 `main`，`alive()` 是 `false`：读数被释放了，只释放了一次，由最后一次释放 ——
`pump` 自己的那次，在 join 之后 —— 而且已经没有人还在读。计数是原子的，因为各车道的释放彼此竞争；
账本本身不是线程安全的，也不需要是，因为没有人写读数。

这就是整片领地，浓缩在一个程序里。每次你错了，检查都会拦住你，而让你正确的工具 —— 说出谁在拿着
它的计数，会等待的 join，负责释放的 `defer` —— 就是你在基础路上遇到的那些。
'''
hints = [
  "删掉 unreachable，让空车道照常运行：begin == end 是一个空切片，它的和是零。一个你证明不了的断言，就不该作出。",
  "给每条车道一份份额：用 ledger.share() 来 spawn 它，并让它 defer ledger.release(gpa)。车道的份额就是让读数活着的东西；它在车道的函数返回时被释放，而不是在 pump 返回时。",
  "pump 自己的释放挪到 pump 顶部的一个 defer 里，这样它在 join 之后运行 —— 在读数被读完之后 —— 而它释放的正是 main 交出去的那个句柄。",
  "partial 按槽位交给各车道，这是对的：pump 拥有它，pump 在返回它之前 join，而且每条车道只写自己的槽位。如果 main 留了一份份额，FREED 就会是 no —— 读数活着是因为 main 还拿着它们，而能解释这一点，是这个 boss 接受的另一个答案。",
]
