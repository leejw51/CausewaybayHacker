# ZIG LAND — ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/zig/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "zig.advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.advanced.01.lines"
title = "收费亭日志"
story = "1 号收费亭的当班日志把每辆车记成一行：收费员听到的名字，然后是它付的钱，有多少枚硬币就记多少个数。打印机比隧道还老，每页结尾仍然印着渡轮公司的那个词。"
brief = '''
第一行是数量 `n`。接下来的 `n` 行，每行是一个名字，后面跟着零个或多个整数，用空格分隔。

每辆车输出一行，格式为 `<NAME> <how many numbers> <their sum>`，最后输出
`BOATS <n>` —— 这是广场的打印机自从属于渡轮公司以来，每一页都用来收尾的那行合计。

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

这里的单位是行，而不是记号。对整个输入做一次 `std.mem.tokenizeAny`，它在空白处停下，
不管换行，所以它没法告诉你一辆车在哪里结束、下一辆从哪里开始。先把输入切成行 ——
`std.mem.splitScalar(u8, input, '\n')` 给你一个迭代器，它的 `next()` 是 `?[]const u8`，
一次一行 —— 然后在这一行**之内**再做记号切分。

这些切片每一个都指向 `input`。什么都没有复制：一行只是开向你已经拥有的那些字节的一扇窗，
所以 `input` 必须活到你用完它们全部为止，这也是为什么 `defer gpa.free(input)` 是最后
一个执行的。
'''
hints = [
  "对 '\\n' 做 splitScalar，每次 next() 交给你一行；在这一行上用 tokenizeAny、以 \" \\r\\t\" 作分隔符，就能走完它的记号，而且不会越过行尾。",
  "名字是第一个记号，所以在循环之前用一次 fields.next() 取走它；之后 while (fields.next()) |tok| 看到的就只剩数字。",
  "只有名字的一行给出 0 0，不需要特殊处理：while 循环根本不会执行。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.advanced.02.pointers"
title = "副本不是原件"
story = "收费亭主管把每个硬币盘的数都记在一张表的副本上，而她身后墙上那张表从来不变。"
brief = '''
标准输入是数量 `n`，然后是 `n` 个整数。

通过函数 `load` 把每个值压进同一个 `std.ArrayList(i64)`，然后输出三行：
`LOADED <how many>`，来自只读函数 `total` 的 `TOTAL <sum>`，以及 `FIRST <value>`
—— 没有任何值时输出 `FIRST NONE`。

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

起始代码能编译，输出 `LOADED 0`。`load` **按值**接收列表，而 Zig 的参数是不可变的，
于是起始代码做了人们接下来会做的事：`var mine = sheet;` —— 复制一份列表的头部 —— 然后
往副本里追加。副本变长了，副本在返回时死掉，墙上那张表纹丝不动。

用 `*` 把你的意思说出来：类型为 `*std.ArrayList(i64)` 的参数是调用者那个列表的地址，
通过它调用 `sheet.append(gpa, value)`，值就落进调用者的列表里。`total` 应该接收
`[]const i64` —— 也就是列表的 `.items` —— 因为它只需要看，不需要碰，而类型里的 `const`
就是编译器让你说到做到的方式。

`FIRST` 是一个可选指针：`?*const i64` 要么是第一个元素的地址，要么是 `null`，而 `null`
是 Zig 唯一不先问一声就不让你透过它读取的值 —— `if (first) |p|` 就是那一问。这片领地
的全部，就在这一行里。
'''
hints = [
  "修好 load 只要两处：签名里写 sheet: *std.ArrayList(i64)，调用处写 &sheet。通过指针调用方法不需要箭头；sheet.append(gpa, v) 还是同一行。",
  "total 应该接收 []const i64，并用 sheet.items 调用 —— const 是一个承诺，编译器会检查它。",
  "&sheet.items[0] 是第一个元素的地址，只有在它存在时才有意义；if (first) |p| 解开可选值，p.* 是它背后的值。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.advanced.03.slices"
title = "队伍的中间"
story = "六点前，4 号收费亭前堵了四十辆车。主管看得见最前面的保险杠和最后面的尾灯，中间什么都看不见。"
brief = '''
标准输入第一行是数量 `n`，第二行是 `n` 个用空格分隔的整数。`n` 至少为 `1`。

输出三行：第一个值、最后一个值，以及严格位于两者之间的所有值之和。值少于三个时，这个和为 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

切片就是这个序列。`nums[0]` 和 `nums[nums.len - 1]` 是两端；`nums[1 .. nums.len - 1]`
是中间，一个指向同一批字节的**新切片**，没有任何复制，对它做一次 `for` 就是求和。切片和
下标一样会被检查：`nums[1..0]` —— 只有一个元素的队伍算出来的中间正是这个 —— 会得到
`panic: start index 1 is larger than end index 0`，所以对 `nums.len` 的判断要写在切片之前，
而不是之后。

用 `i64` 求和。有一个隐藏用例的中间部分装不进 `i32`，而在 `-O Debug` 下，溢出的 `i32`
不会回绕 —— 它会 panic。
'''
hints = [
  "nums[1 .. nums.len - 1] 是两端之间的切片；对它做一次 for 就能求和。它和 nums 共享同一块内存。",
  "只有一个或两个值时，这个范围是空的或者是倒着的，而倒着的切片在 Debug 下是 panic —— 写它之前先用 if 判断 nums.len。",
  "中间的和是 i64：那个大用例要把两个三十亿的值相加，i32 的累加器会以 integer overflow panic。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.advanced.04.strings"
title = "字节不是字符"
story = "广场上方的指示牌把「銅鑼灣」截在第三个字节，只显示出一个字。"
brief = '''
读入一行。输出三行：

1. 它以**字节**计的长度
2. 它以**字符**计的长度 —— UTF-8 码点
3. 把字符倒过来之后的这一行

```
input:  causeway
output: 8
        8
        yawesuac
```

这一行可能包含 ASCII 以外的字符，这时前两个数就不相同了。Zig 的字符串是 `[]const u8`：
一个字节切片，`.len` 是字节数。它一直都是。在这个层面上语言对编码一无所知；`u8` 就是一个字节。

UTF-8 不用解码就很容易数：每个码点都以一个**不**属于 `10xxxxxx` 形式的字节开头，而每个
后续字节都属于这种形式。所以字节 `c` 恰好在 `(c & 0xC0) != 0x80` 时开始一个字符。倒转
的是字符，不是字节 —— `std.mem.reverse(u8, line)` 会把 `銅` 切成三块，再倒着打印出来。
'''
hints = [
  "for (line, 0..) |c, i| 连同下标走遍每个字节；(c & 0xC0) != 0x80 挑出每个字符的第一个字节。",
  "把每个字符的起始下标收集进一个 std.ArrayList(usize)；它的长度就是字符数，什么都不用解码。",
  "倒着走这些起始下标，把每个字符的字节 —— line[from..to] —— 用 appendSlice 追加到一个 std.ArrayList(u8) 上，然后用 {s} 打印它的 .items。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.advanced.05.structs"
title = "收费亭账本"
story = "2 号收费亭按车轴收费，把各项都记在同一张账本表格上 —— 至少在那条建议用一行注释替换掉这个结构体的函数之前是这样。"
brief = '''
第一行是 `<NAME> <n>`。接下来 `n` 行是 `<ITEM> <CENTS>`。

为这个名字建一个 `Ledger` 来收集各项，然后按到达顺序把每一项原样输出为 `<ITEM> <CENTS>`，
再输出 `TOTAL <sum>`，再输出 `BOAT <name> <count>` —— 这张账本表格是渡轮公司的，它的
名字栏至今还写着 `BOAT`。

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` 可能是 `0`，这时输出只有最后两行。

Zig 没有 `class`；最接近的是一个在内部声明了函数的 `struct`，而它就是全部。没有在你背后
运行的构造函数：`init` 是你自己写的一个普通函数，返回这个值。没有隐藏的 `this`：`self`
是第一个参数，明明白白写出来 —— 函数要写账本时是 `*Ledger`，只读时是 `*const Ledger`
—— 这就是方法上的 `const`，只是变得看得见了。也没有 `private:`；字段在文件里任何地方都
能访问，让 `main` 不去碰 `items` 的，是结构体提供了 `total()` 和 `count()`，没有理由绕过它们。
'''
hints = [
  "一个 std.ArrayList(Item) 就够了；结构体的作用是让账本拥有自己的各行。add 就是一次 append：self.items.append(gpa, .{ .name = name, .cents = cents })。",
  "add 用 self: *Ledger，因为它要写；total 和 count 用 self: *const Ledger，因为它们只读。两种情况下 ledger.add(...) 都是同一个调用 —— Zig 替你取地址。",
  "各项的名字是 input 的切片，所以填满账本不花任何代价，而 input 必须比它活得久 —— main 里 defer 的顺序已经保证了这一点。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.advanced.06.tagged-union"
title = "谁在开车"
story = "快易通车道对每张电子标签都收会员价，包括那些不是会员的，以及那张根本不是标签的。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行 `<TYPE> <HOURS>`。

基本费率是 `500 + 100 * HOURS` 分。每一行输出以下之一：

* `MEMBER` —— 基本费率
* `CREW` —— 基本费率的一半，整数除法
* `JUNIOR` —— 永远是 `200`
* 其他任何东西 —— `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

把标签建模为一个有四种情况的 `union(enum)`，其中一种是 `other`。C++ 的 `enum class`
不能携带数据，认不出的文本只能在它旁边另外传递；Zig 的带标签的联合把它放在情况**内部**：
`other: []const u8`，而另外三种情况什么都不携带。`union(enum)` 的情况不会在你背后转换
成整数，也不会把它的名字漏到外层作用域里，而这正是 `enum class` 存在的两个理由。

用一个 `switch` 决定收费。对带标签的联合做 `switch` 必须覆盖每一种情况 —— 漏掉一个就
编译不过，不需要任何警告开关 —— 而 `.other => |raw|` 就是把数据从所在情况里取出来的方式。
'''
hints = [
  "other: []const u8 是第四种情况，用 .{ .other = raw } 构造；三个 void 情况分别构造为 .member、.crew、.junior。",
  "std.mem.eql(u8, raw, \"MEMBER\") 比较两个切片；切片上的 == 比较的是指针，那从来不是你想要的。",
  "@divTrunc(base, 2) 是明明白白写出来的整数除法；有符号整数上的普通 / 在结果可能不整除时编译不过。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.advanced.07.maps"
title = "广场在喊什么"
story = "06:30 的收费广场：每个收费亭都隔着车道喊着什么，主管要的是排名。"
brief = '''
读入全部标准输入，按空白切分。

每个不同的词输出一次，格式为 `<word> <count>`，按次数降序排列，次数相同时按词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)` 没有任何顺序 —— 不按键，不按次数，也不按到达 —— 所以排名是
单独的一步：把条目复制进一个由小结构体组成的 `std.ArrayList`，再用比较函数对它做
`std.mem.sort`。`getOrPut(word)` 找到槽位或者插入它，并用 `found_existing` 告诉你是
哪一种，这正是计数循环要的；新槽位的 `value_ptr` 在你写入之前是未初始化的。

Zig 没有 lambda。比较函数是一个普通函数，按名字传入，第一个参数是它本来会捕获的上下文
—— 这里是 `{}`，类型为 `void`，因为它什么都不捕获。键是 `input` 的切片，所以必须在释放
`input` 之前 `deinit` 这个映射：按正确顺序写 `defer`，不用多想就做到了。
'''
hints = [
  "getOrPut(word) 返回一个带 found_existing 和 value_ptr 的槽位；新的时候设 value_ptr.* = 0，然后加一。这就是整个计数循环。",
  "counts.iterator() 走遍所有条目；每个条目有 key_ptr 和 value_ptr。每个条目往一个 std.ArrayList(Row) 里追加一个 Row。",
  "比较函数是 fn byRank(_: void, a: Row, b: Row) bool —— 先按次数降序，再看 std.mem.order(u8, a.word, b.word) == .lt —— 用 std.mem.sort(Row, rows.items, {}, byRank) 应用它。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.advanced.08.hashtable"
title = "毫无顺序"
story = "广场的点名结果按哈希表高兴的顺序回来，而主管要的是各个收费亭实际应答的顺序。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行一个收费亭名字。`n` 至少为 `1`，名字是一段连续的
非空格字符。同一个名字可能出现不止一次。

每个不同的名字输出一次，格式为 `<name> <count>`，**按名字第一次出现的顺序**。然后输出
`DISTINCT <k>`。

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

容器自己不会给你这个，而这就是整道题。

`std.StringHashMap` 是一张哈希表：查找平均是 O(1)，但 `iterator()` 按**桶的顺序**交回
条目 —— 不排序，不按插入顺序，而且表一变大就变了。没有什么保证顺序，所以一个靠遍历哈希
映射来打印的程序，输出取决于哈希函数。起始代码正是这么做的，它甚至能通过只有一个不同
名字的用例 —— 这就是破绽：一个分辨不出顺序的测试，不能证明顺序是对的。

把两件事放在两个容器里：一个 `std.ArrayList([]const u8)` 记住每个名字第一次出现的顺序，
一个 `std.StringHashMap(i64)` 负责计数。打印时遍历列表。
'''
hints = [
  "哈希表是用来快速查找的。列表是用来记住顺序的。两个你都需要。",
  "found_existing 对每个名字恰好有一次是 false —— 就在插入时 —— 那正是把名字追加到顺序列表的时机。",
  "打印时遍历列表，用 count.get(name).? 向映射要每个名字的次数，永远不要遍历映射。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.advanced.09.set-and-sort"
title = "谁停在哪里"
story = "天桥下停车处的告示板把同一辆货车在同一个车位上列了两次，没人说得清哪几行是重复的。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行 `<BERTH> <NAME>`。

每个不同的 `<BERTH> <NAME>` 组合输出一次，先按车位、再按名字排序，然后输出
`DISTINCT <k>` 和 `DUPES <n - k>`。

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig 没有有序的二元组集合；最接近的是两个各做一件事的工具。`std.StringHashMap(void)`
是一个集合 —— 值不占空间的映射 —— 用**这一行本身** `2 KWAN` 作键，任何已经在里面的组合
都会被拒绝第二份。一个由小结构体 `{ berth, name }` 组成的 `std.ArrayList` 收集集合放行
的那些，再用带比较函数的 `std.mem.sort` 把它们排成先车位后名字的顺序。没有结构化绑定来
拆开这一对；结构体的字段本来就有名字。
'''
hints = [
  "std.StringHashMap(void) 就是集合；getOrPut(line).found_existing 在同一行的第二份上是 true，第一份上是 false。",
  "只有集合放行的行才进列表，所以列表的长度就是 DISTINCT，n 减去它就是 DUPES。",
  "比较函数先按车位排，相同时看 std.mem.order(u8, a.name, b.name) == .lt；用 std.mem.sort(Mooring, moorings.items, {}, byBerthThenName) 应用它。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.advanced.10.comptime-fn"
title = "沿车道走一遍"
story = "车轴日志是一列计数。Alex 说写四个 for 循环。Mei 说写四个有名字的 for 循环，而那些名字就是函数。"
brief = '''
标准输入是一行用空格分隔的整数。

输出四行：

1. 偶数值之和（没有偶数时为 `0`）
2. 每个大于 `10` 的值乘以二，按原顺序，用单个空格连接 —— 没有这样的值时输出 `-`
3. 有多少个不同的值
4. `FIRST_BIG <i>` —— 第一个大于 `10` 的值的下标（从 0 开始），没有则为 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig 没有 `<algorithm>`，也没有 lambda，而最接近的东西比听上去更近：一个把**另一个函数作为
`comptime` 参数**接收的函数。`fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64`
就是带谓词的 `accumulate`；你按名字传入 `isEven`，编译器生成一份把调用内联进去的 `sumIf`，
运行时根本没有函数指针。写出 `sumIf`、`keepDoubled`、一个靠对副本做 `std.mem.sort` 再
扫一遍相邻对得出的不同值计数，以及 `indexOfFirst`。要点不在于循环难写；而在于名字说明了
这个循环是干什么的，谓词是一个你读得懂的值。
'''
hints = [
  "comptime keep: fn (i64) bool 是参数类型；在函数体里 keep(x) 是一次普通调用，在调用处你传 isEven，不带括号。",
  "keepDoubled 需要一个写入的地方：返回一个由调用者 deinit 的 std.ArrayList(i64)，并在内部对它的 deinit 做 errdefer，这样 append 失败时不会泄漏。",
  "gpa.dupe(i64, xs) 就是用来排序的副本；排好序的切片里重复值是相邻的，所以一个值恰好在它和前一个不同时才是新的。",
  "indexOfFirst 返回 ?usize；if (indexOfFirst(...)) |i| 打印命中的下标，else 分支打印 -1。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.advanced.11.generics"
title = "只写一次"
story = "广场的仪表板上 largest 写了四遍 —— 车轴、分钟、车道，还有车道名 —— 而第五遍要在头班电车之前交。"
brief = '''
标准输入是两行：第一行是整数，第二行是单词。

写**一个**对两者都适用的 `largest`，以及一个带 `larger()` 和 `smaller()` 的类型 `Pair(T)`。

输出最大的整数、最大的单词，然后是由前两个整数组成的 `Pair` 的 `PAIR <larger> <smaller>`。
相等时算 `a` 是较大的那个。

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

起始代码编译不过：`largest` 被钉死在 `i64` 上，所以把单词传给它就是
*expected type '[]const i64', found '[][]const u8'*。Zig 里的泛型函数就是一个带有
**`comptime T: type`** 参数的函数：`fn largest(comptime T: type, xs: []const T) T` 对每个
被调用的类型生成一份，而 `T` 在调用处写出来 —— `largest([]const u8, words)` —— 而不是推导出来。

单词没有 `>`；切片用 `std.mem.order` 比较。在泛型内部，`if (comptime T == []const u8)`
在编译期选择比较方式 —— 不适用的那个分支根本不会被分析，这和模板特化是同一个想法，却
没有那一套机制。

`Pair(T)` 是用在类型上的同一个技巧：一个接收 `type` 并**返回一个结构体**的函数。没有单独
的类模板语法；类型在编译期就是一个值，函数可以造出一个。
'''
hints = [
  "第一个参数写 comptime T: type，里面所有的 i64 换成 T，调用就变成 largest(i64, nums.items) 和 largest([]const u8, words.items)。",
  "x > best 对切片编译不过；if (comptime T == []const u8) std.mem.order(u8, x, best) == .gt else x > best 为每个实例挑出正确的比较。",
  "fn Pair(comptime T: type) type { return struct { ... }; } —— 在里面，const Self = @This() 命名正在构造的这个结构体，Pair(i64){ .a = ..., .b = ... } 造出一个。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.advanced.12.function-values"
title = "闸杆计数"
story = "5 号收费亭的闸杆记录谁开进来、谁倒出去，主管要的是当班结束时的那个数，不管中间发生了什么。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行是 `IN` 或 `OUT`。

维护一个永远不会低于零的累计数，每条命令之后输出它。然后输出 `INS <k>` —— 有多少条命令
是 `IN`，用一个泛型的 `countIf` 加一个谓词函数来数 —— 以及 `CLOSED <final>`。

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Zig 没有闭包 —— 没有 lambda，没有捕获 —— 最接近的东西就明明白白写在你看得见的地方。
计数器是一个**自己保存总数的结构体**，而 `add` 是 `*Counter` 上的方法：C++ lambda 会用
`[total = 0LL]` 捕获并标成 `mutable` 的那个状态，在这里是一个字段，而改变它的调用通过
指针接收这个结构体。结构体之外，除了经由 `add`，什么都碰不到这个总数。

谓词是一个**作为 `comptime` 参数传入的函数**：`countIf(commands, isIn)` 写出 `isIn` 的
名字，编译器把它内联。没有东西要捕获，所以什么都没有被捕获，面试官会问的 `[&]` 对
`[=]` 的那个问题在这里无处藏身。
'''
hints = [
  "add 就三行：self.total += delta，在零处截住，返回 self.total。它接收 *Counter，因为它要写；count.add(...) 会替你传地址。",
  "用 var count = Counter{} 声明的 Counter 因为字段默认值而从零开始；const 的那个就不能往上加了。",
  "fn countIf(items: []const []const u8, comptime pred: fn ([]const u8) bool) usize 走遍切片，数出 pred 接受的那些；按名字传入 isIn。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.advanced.13.optional-union"
title = "不是数字的那一行"
story = "车轴计数器的读数器交上来一列数字，中间夹着某人的早餐单。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行。每一行本该是一个整数。

对每一行，要么输出它的两倍，要么在解析不了时输出 `BAD <line>`。最后输出 `SUM <total>`，
其中 total 是你输出的那些值的和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

答案由两个类型承载。`fn parse(text: []const u8) ?i64` 是*一个数字，或者什么都没有*：
`std.fmt.parseInt` 返回一个错误联合，而 `catch return null` 把错误变成可选值的 `null`
那一半。它要么接受整个字符串，要么全部拒绝，所以 `4x` 和 `xx` 一样被拒绝。

`fn doubled(text: []const u8) Doubled` 返回一个 `union(enum) { value: i64, bad: []const u8 }` —— *要么是翻倍后的值，要么是失败的那一行*，恰好两种情况之一，绝不会
两个都是，也绝不会两个都不是。对它做 `switch`，就能从当前那个情况里取出数据：
`.value => |v|`、`.bad => |line|`。`main` 里一个 `try` 都没有；失败是一个值，它去值该去的
地方。起始代码的 `main` 已经是那个 switch；`parse` 和 `doubled` 是空壳，在写好之前每一行
都会输出 `BAD`。
'''
hints = [
  "std.fmt.parseInt(i64, text, 10) catch return null 就是 parse 的全部：成功时值作为可选值的数据落下去，遇到任何错误函数就返回 null。",
  "可选值用 if (parse(text)) |value| 解开；else 那条路就是 null，.bad 情况就在那里构造。",
  "同一个函数既能返回 .{ .value = v } 也能返回 .{ .bad = text } 是合法的，因为返回类型是一个两者皆可容纳的联合；main 里的 switch 挑选分支，数据被捕获在 |v| 或 |text| 里。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.advanced.14.error-sets"
title = "你自己的错误"
story = "收费服务的四层各自返回不同的东西，而它们上面没有任何一层接住其中任何一个。"
brief = '''
标准输入是数量 `n`，然后是 `n` 行，每行本该是一个以 km 计的距离。

`fare(text)` 用 `std.fmt.parseInt` 解析 —— 它在 `xx` 上以 `error.InvalidCharacter`
**失败**，在 `fare` 内部被转换成它自己的 `error.NotANumber` —— 并用你自己的第二个错误
`error.NegativeDistance` 拒绝负的距离。两者都来自同一个具名错误集 `FareError`。否则它
返回 `500 + 100 * km`。

每个输入行输出一行：收费，或者解析不了时输出 `not a number`，或者距离为负时输出
`negative distance: <km>`。然后输出 `ERRORS <k>`，即失败的行数。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

起始代码能编译，然后死在 `xx` 上：`main` 里的 `try fare(text)` 把错误往上交，而 `main`
上面没有任何人 —— 程序输出 `error: NotANumber` 和一段调用栈，以 `1` 退出。这就是 Zig 关于错误的全部故事：错误是返回类型
`!i64` 里的一个值，每个调用处要么把它 `try` 上去，要么把它 `catch` 住。没有什么会越过
一个没说自己可能失败的函数向外展开。

Zig 的错误是一个**名字**，不是一个对象：它不带消息，也不带数据，所以
`negative distance: <km>` 是由仍然握着文本的调用者构造的。`catch |e| switch (e) { ... }`
就是两个分支的 catch，而 switch 必须点到错误集里的每一个错误 —— C++ 里那个会悄悄吞掉
派生类的 `catch (const std::runtime_error&)` 在这里没有对应物，因为没有可供切割的继承层次。
'''
hints = [
  "if (fare(text)) |cents| { ... } else |e| switch (e) { ... } 就是带两个 catch 分支的 try 块；成功时的数据是 cents，错误是 e。",
  "消息要你自己构造：错误什么都不带，但 text 还在作用域里，可以作为消息要的 km 打印出来。",
  "到达 main 顶端的错误会输出 error: <Name> 和一段调用栈，并以 1 退出。起始代码在第二行做的就是这个，而这是好结果 —— 程序说出了它停在哪里。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.advanced.15.iterators"
title = "你自己的 while 循环"
story = "广场的车轴表从当班开始到结束，一个读数一个读数地跳过去，哪一个都不存下来。"
brief = '''
标准输入是三个整数：`start`、`step`、`count`。

给 `Stops` 一个迭代器，使得对它做的 `while` 循环产出 `count` 个值，从 `start` 开始，每次
前进 `step`。每个值单独一行输出，然后输出 `SUM <total>`，由一个 `total` 函数在同一个
`Stops` 的一个新迭代器上算出。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

起始代码编译不过：`main` 调用了 `stops.iter()`，而 `Stops` 没有这个函数。Zig 没有迭代器
协议，也没有可以继承的 trait。迭代器就是一个**带有返回可选值的 `next` 方法的结构体**
—— 这里是 `?i64` —— 而遍历它的循环是 `while (it.next()) |value| { ... }`，遇到第一个 `null` 就停。这就是全部约定，也是
`std.mem.tokenizeAny` 以及你在这条路上用过的每个 `std` 迭代器都遵守的那一个。

`total` 用同一个 `while` 走同一个约定；给它一个新的迭代器，因为已经到达 `null` 的迭代器
会一直停在那里。
'''
hints = [
  "迭代器是一个嵌套结构体：const Iter = struct { value, step, left, fn next(self: *Iter) ?i64 }。next 接收 *Iter，因为它要移动迭代器。",
  "left 为 0 时 next 返回 null；否则它记下当前值，前进一步，倒数一次，然后返回记下的那个值。",
  "循环变量必须是 var —— var walk = stops.iter() —— 否则 next 取不到它的地址；total 用第二次 stops.iter() 造出它自己的那个。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.advanced.16.defer"
title = "它自己收拾干净"
story = "当班结束时，广场的日志簿会自己合上，顺序正确，不管有没有人记得去合。"
brief = '''
标准输入是数量 `n`，然后是 `n` 个整数。

在 `main` 的**顶部**声明两个 `Guard` 值，分别叫 `first` 和 `second`，并对每一个的 `drop`
做 `defer`，`drop` 输出 `DROP <name>`。在一个嵌套块里，把这些值喂给一个 `Tally`，它被
defer 的 `report` 输出 `TALLY <count> <sum>`。块之后输出 `DONE`。`main` 自己不输出任何
别的东西。

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

除了 `DONE`，每一行都是由 `defer` 输出的。Zig 没有析构函数；最接近的是 `defer`，而且它
对此更诚实：释放的那一行就写在获取的那一行旁边，它在**块**结束时运行 —— 在右花括号处，
在 `return` 时，在错误经由 `try` 出去时 —— 按 `defer` 的**逆序**运行。`Tally` 的 `defer`
在内层块里，所以 `TALLY` 在 `DONE` 之前；两个守卫的 `defer` 在 `main` 的块里，而 `second`
是最后被 defer 的，所以它最先运行。这些都不是你安排的。是作用域安排的。

有一件事要做对：`defer w.flush()` 是 `main` 里的第一个 `defer`，所以它**最后**运行 ——
在守卫们把它们的行写进缓冲区之后。把它放到它们后面，`DROP` 那几行就会被写进一个没人
刷新的缓冲区。`defer gpa.free(input)`、`defer list.deinit(gpa)`、下一张地图上的
`defer m.unlock(io)`：这条路上的每一次释放都是同一个想法。
'''
hints = [
  "在 first 声明之后紧接着写 defer first.drop(w);，second 也一样。你永远不自己调用 drop；main 的结尾会调用。",
  "TALLY 在 DONE 之前输出，全靠内层的花括号：写在里面的 defer tally.report(w) 在它们的右花括号处运行。去掉花括号，它就在后面输出了。",
  "defer 永远逆序运行，所以 second 在 first 之前 —— 也所以最先被 defer 的 flush 在它们两个之后运行。",
  "tally.report 读取的是 defer 运行那一刻的 tally，而不是写下它那一刻的：defer 是一条被推迟的语句，它提到的参数在那时才求值。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.advanced.17.past-the-end"
title = "最后一个收费亭再往后一个"
story = "隧道口，06:00:00。6 号收费亭旁的信号板保存着海滨上所有会响的东西的鸣放表，而它的校验和循环多读了表尾之后的一项。"
brief = '''
第一行是 `n`。接下来 `n` 行是鸣放表，`<NAME> <SECONDS>`。然后是一行 `q`，以及 `q` 个
要查的名字。

对每个名字输出 `<NAME> FIRES AT <seconds>` 或 `<NAME> UNKNOWN`。然后输出
`LOADED <n> CHECKSUM <sum of every SECONDS in the table>`。

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

起始代码编译干净，却会 panic 两次，原因各不相同，两个你都得找出来。

第一个是 `lookup`。它返回一个 `?*Shell` —— 匹配项的地址，或者 `null` —— 而调用者看都
不看就在上面写了 `.?`。`.?` 的意思是*我知道这不是 null*，而当它是 null 时，`-O Debug`
会以 `panic: attempt to use null value` 停下程序。去检验这个可选值：`if (lookup(...)) |shell|` 是拿到它背后东西的唯一方式，而 `else` 分支就是 `UNKNOWN` 所在的地方。

第二个是校验和循环。它走 `1..=n` 并读取 `table[i]`，而下标 `n` 已经越过末尾一位：
`panic: index out of bounds: index 2, len 2`。修好这个循环。然后理解这次 panic 替你买到
了什么：这道题的 C++ 版本不加检查地读取 `table[n]`，拿到那个地址上碰巧有的东西 —— 堆上
的下一个对象，或者什么都没有 —— 然后输出一个错得没人能重现的校验和。Zig 在 Debug 下检查
每个下标和每个 `.?`，而在 `-O ReleaseFast` 下两者都不检查：同样两行在那里就成了未定义
行为，和 C++ 一模一样。这就是这片领地的交易：你在构建时检查是开着的，而等它关掉的时候，
你的责任是让它一次都没被需要过。
'''
hints = [
  "绑定查找结果并检验它：if (lookup(table, name)) |shell| { ... } else { UNKNOWN }。这个可选值既是答案也是提问。",
  "合法下标从 0 到 len - 1。从 1 开始、一直走到 len 的循环两头都差一，只有上头那一端会 panic。对切片做 for 就没有下标可以写错。",
  "两次 panic 都是 Debug 模式的检查。用 -O ReleaseFast 构建起始代码，两行都不会停：校验和读过了末尾，null 被一路跟到零地址。检查是你付钱买的东西，修复是你用来付的钱。",
  "panic 在 stderr 上输出消息和调用栈，以 134 退出；评测读的是 stdout，所以 panic 之前输出的一切都还在，而且还是错的。",
]

