# ZIG LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/zig/cheatsheet.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks and identifiers are
# copied verbatim.

pack   = "zig.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet.01.print"
title = "收费牌"
story = "06:00，红磡海底隧道铜锣湾入口。1 号亭上方的牌子要有人写进去，才会显示收费。"
brief = '''
`w` 是 stdout 上的带缓冲 writer。以十进制打印 `n`，然后换行。

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

是哪一行？
'''
hints = [
  "参数放在元组 `.{ ... }` 里；print 可能失败，所以要 `try`。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet.02.parse-int"
title = "硬币变数字"
story = "2 号亭的硬币盘用文字计数，钱箱要的是整数。"
brief = '''
`tok` 是存着 `"42"` 的 `[]const u8`。把 `n` 解析为十进制 `i64`，坏的 token
产生的错误交给调用者。
'''
hints = [
  "先写类型，再写文本，最后是进制。它返回错误联合，所以要 `try`。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.cheatsheet.03.for-index"
title = "车道号"
story = "车轴计数器记下每辆车走的车道，从零开始数。"
brief = '''
`xs` 是 `[]const i64`。遍历它，每个元素叫 `x`，下标叫 `i`。
'''
hints = [
  "for 循环可以同时走两样东西：切片和一个从 0 开始的开放区间。各一个捕获。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet.04.div-trunc"
title = "分账"
story = "一夜的收入要在各亭之间分，账本可能是负数。"
brief = '''
`a` 和 `b` 是运行时的 `i64`，都可能为负。让 `q` 成为它们的商，像 C 一样
**向零**取整。
'''
hints = [
  "有符号的运行时整数不能直接用 `/`：Zig 要你说明取整方式。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.cheatsheet.05.eql"
title = "同一块车牌"
story = "天桥上的车牌识别器把每辆车和通缉名单上的那块对比。"
brief = '''
`a` 和 `b` 都是 `[]const u8`。写出一个在两者字节相同时为真的 `if`。
'''
hints = [
  "切片没有 `==`。std.mem 的比较函数先接收元素类型。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet.06.orelse"
title = "没有记录"
story = "计数表从没见过的车牌也有个数，那个数是零。"
brief = '''
`counts` 是 `std.StringHashMap(i64)`，`get` 返回 `?i64`。让 `c` 等于键 `k`
的计数，`k` 不存在时为 0。
'''
hints = [
  "可选值用 `orelse` 带默认值解开；`catch` 是给错误联合用的。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.cheatsheet.07.append"
title = "再来一辆"
story = "3 号亭的队伍多了一辆车，每个字节都是付过钱的。"
brief = '''
把 `x` 加到列表末尾。

```
var xs: std.ArrayList(i64) = .empty;
defer xs.deinit(gpa);
// ____
```
'''
hints = [
  "列表不保存分配器：每个可能扩容的调用都要传 `gpa`，并对结果 `try`。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet.08.sort-desc"
title = "最重的排前面"
story = "坚拿道下的地磅把最重的货车列在最上面。"
brief = '''
`xs` 是 `std.ArrayList(i64)`。把它的 items 按**降序**原地排序。
'''
hints = [
  "std.mem.sort 接收类型、切片、上下文和比较器；std.sort 每个方向各有一个。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.cheatsheet.09.catch-default"
title = "糊掉的票"
story = "售票机出来的票糊了。亭里当它是零，挥手放行。"
brief = '''
`tok` 可能不是数字。把它按十进制 `i64` 解析到 `n`，解析失败时用 0，而不是
返回错误。
'''
hints = [
  "错误联合用 `catch` 给默认值；`orelse` 是给可选值用的。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.cheatsheet.10.comptime-type"
title = "什么货都行"
story = "入口的集装箱堆什么货都收，只要在编译时告诉它是什么。"
brief = '''
`Stack` 是一个函数：接收元素类型，返回用它构造的 struct 类型。哪一行开头？

```
// ____
    return struct {
        items: []T,
    };
}
```
'''
hints = [
  "类型是编译时已知的值，所以它的参数要这样标记；函数返回 `type`。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.cheatsheet.11.self-ptr"
title = "计数盒"
story = "钉在 4 号亭的计数器每过一辆车响一下。它的副本只会自己响。"
brief = '''
方法 `inc` 给调用它的那个计数器加一：

```
const Counter = struct {
    n: i64 = 0,
    // ____
        self.n += 1;
    }
};
```
'''
hints = [
  "参数是常量副本。要改调用者的 struct，就接收指向它的指针。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet.12.errdefer"
title = "只在失败时"
story = "隧道口的闸杆在收费通过时放车，不通过就把票收回。"
brief = '''
`fill` 失败时释放 `buf`，成功时原封不动交给调用者。

```
fn load(gpa: std.mem.Allocator, n: usize) ![]u8 {
    const buf = try gpa.alloc(u8, n);
    // ____
    try fill(buf);
    return buf;
}
```
'''
hints = [
  "普通的 `defer` 在每条出路上都执行，包括成功。有一种写法只在返回错误时执行。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.cheatsheet.13.slice"
title = "中间的车道"
story = "入口的五条车道里，今晚被摄像头盯着的是中间那两条。"
brief = '''
`xs` 是一个五个元素的 `[]const i64`。让 `mid` 成为下标 1 和 2 处元素的视图——
恰好两个，不复制。
'''
hints = [
  "子切片写成 `[start..end]`，不包含 end；完全不写 end，它就一直到 `xs.len`。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.cheatsheet.14.while-step"
title = "数亭子"
story = "检查员从零号走到最后一个亭子，每检查一次走一步。"
brief = '''
`i` 和 `n` 是 `usize`，`i` 从 0 开始。开一个循环，对 `i = 0, 1, …, n-1` 执行循环体，
步进写在循环头里，而不是循环体的末尾。
'''
hints = [
  "Zig 没有 C 风格的 `for`：它是一个 `while`，continue 表达式放在冒号后面，而且没有 `++`。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.cheatsheet.15.switch-range"
title = "重量等级"
story = "地磅按读出的吨数把每辆车分到一个等级，最重的等级没有上限。"
brief = '''
`t` 是一个 `i64`。哪一个分支让从 0 到 9（包括 9）的每个值都给出 `"light"`？

```
const class = switch (t) {
    // ____
    10...99 => "medium",
    else => "heavy",
};
```
'''
hints = [
  "switch 的范围两端都包含，写法比切片范围多一个点。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.cheatsheet.16.error-union"
title = "可能失败，就说出来"
story = "5 号亭的读票机要么交回一个数字，要么承认它读不了这张票，而它的标签两样都写着。"
brief = '''
`parse` 把一个 token 变成 `i64`，并把解析失败传给它的调用者。哪一行是它的开头？

```
// ____
    return try std.fmt.parseInt(i64, s, 10);
}
```
'''
hints = [
  "函数里的 `try` 只有在返回类型能携带错误时才能编译；推断的错误集写法是在类型前加一个字符。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.cheatsheet.17.if-capture"
title = "如果有车牌"
story = "3 号车道上方的摄像头可能读到了车牌，也可能没有；只有读到了，计数才会动。"
brief = '''
`maybe` 是一个 `?i64`。开一个 `if`，它的主体只在 `maybe` 有值时运行，并在主体里把
那个值绑定到 `v`。
'''
hints = [
  "条件是可选值本身，不是一个比较，而它后面的捕获就是解开后的值。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.cheatsheet.18.hashmap-count"
title = "再来一个"
story = "控制室里的车牌计数每过一辆车就加一，而一块从没见过的车牌从零开始。"
brief = '''
给键 `x` 下存着的计数加一，还不存在的键当作 0。

```
var counts: std.AutoHashMap(i64, i64) = .init(gpa);
defer counts.deinit();
// ____
```
'''
hints = [
  "`get` 返回可选值，所以在任何算术之前都要先给它一个默认值；这个 map 记得自己的分配器，所以存入的调用不接收分配器。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.cheatsheet.19.intcast"
title = "有符号的车道号"
story = "车道号从线上下来时是有符号整数；车道表只接受无符号的尺寸类型。"
brief = '''
`k` 是运行时的 `i64`，已知非负且在范围内。让 `idx` 成为存着同样值的 `usize`，使
`xs[idx]` 能编译。
'''
hints = [
  "这个转换只接收一个参数，目标位宽来自它落入的绑定，所以绑定必须写明类型。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.cheatsheet.20.labeled-break"
title = "跳出两层循环"
story = "寻找那块被盗车牌的搜索一条车道一条车道、一辆车一辆车地进行，一找到，整个排查就停下。"
brief = '''
`grid` 是一个由行组成的切片。找到目标时，一次性离开**两层**循环——外层循环不能
继续到下一行。

```
outer: for (grid) |row| {
    for (row) |c| {
        if (c == target) {
            found = c;
            // ____
        }
    }
}
```
'''
hints = [
  "带标签的循环靠在关键字后面写它的标签来离开，标签名前面有一个冒号；另一种带标签的跳转只会跳到下一行。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.cheatsheet.21.var-typed"
title = "累计总额"
story = "1 号亭的夜班账本从零开始，循环交给它的每一笔通行费都记进去。"
brief = '''
`xs` 是一个 `[]const i64`。把 `total` 声明为从 0 开始的 `i64`，使下面的循环能往
里加。

```
// ____
for (xs) |x| total += x;
```
'''
hints = [
  "循环会写入的绑定需要可变的关键字，而光秃秃的整数字面量没有自己的运行时类型 —— 声明必须写明一个。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.cheatsheet.22.range-for"
title = "转十圈"
story = "查票员巡一圈，十个亭子每个试一次，10 号亭也包括在内。"
brief = '''
开启一个 `for`，其主体运行**十**次，`i` 依次取值 1、2、…、10 —— 最后一次必须看到
`i == 10`。
'''
hints = [
  "对范围的 for 不包含它的上界，和切片 `[a..b]` 完全一样，所以上界要比你想要的最后一个值大一。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.cheatsheet.23.bool-and"
title = "两盏灯都绿"
story = "2 号车道的栏杆只有在票已读取且费用已结清时才抬起。"
brief = '''
`ready` 和 `valid` 是运行时的 `bool`。开启一个 `if`，其主体只有在两者都为真时才
运行。
'''
hints = [
  "Zig 的逻辑运算符是关键字，不是双写的符号 —— C 的写法在这里是编译错误 —— 而条件仍然需要它的括号。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.cheatsheet.24.float-from-int"
title = "半价通行费"
story = "夜间半价通行费：牌子上的收费是整数，而折扣不是。"
brief = '''
`n` 是运行时的 `i64`。让 `f` 成为存着同样值的 `f64`，使 `f / 2.0` 能编译。
'''
hints = [
  "没有隐式的整数到浮点数转换，而做这件事的内置函数只接收值 —— 目标类型来自绑定，所以绑定必须写明一个。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet.25.abs"
title = "偏了多少"
story = "4 号亭的车轴计数器一夜之间漂移了；控制室想知道偏了多少，而不是偏向哪边。"
brief = '''
`x` 是运行时的 `i64`，可能为负。让 `a` 成为它的绝对值 —— 并记住结果是**无符号**的
（`u64`）。
'''
hints = [
  "从 0.12 起这是一个内置函数，不是 std.math 的函数，而且它交回的是输入类型的无符号孪生类型 —— 有符号的绑定接不住它。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet.26.reverse"
title = "原路退回"
story = "拖车把队伍从隧道口倒着拖出来，顺序与进来时相反。"
brief = '''
`xs` 是一个 `std.ArrayList(i64)`。把它的元素原地反转。
'''
hints = [
  "切片没有方法；std.mem 里的辅助函数先接收元素类型，和 sort、eql 一样。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.cheatsheet.27.dupe"
title = "一份存档"
story = "这一班的车牌清单要送到铜锣湾的档案室，档案室自己留一份。"
brief = '''
`xs` 是一个 `[]const i64`。让 `c` 成为它在堆上的一份独立副本，由 `gpa` 拥有 ——
调用方之后用 `gpa.free(c)` 释放。
'''
hints = [
  "复制是分配器上的方法，不在 std.mem 上，而且在切片之前先告诉它元素类型。分配可能失败。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet.28.items-len"
title = "队伍有多长"
story = "隧道口的牌子显示 3 号亭有多少辆车在等。"
brief = '''
`xs` 是一个 `std.ArrayList(i64)`。让 `n` 成为它所含元素的个数。
'''
hints = [
  "列表自己没有长度；元素住在一个切片字段里，而切片的长度是一个字段，不是一次调用。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.cheatsheet.29.return-error"
title = "说出哪里错了"
story = "5 号亭向一个空队列要第一辆车，读取器得把这件事说出来。"
brief = '''
当切片里什么都没有时，交给调用方一个名为 `Empty` 的错误。

```
fn first(xs: []const i64) !i64 {
    if (xs.len == 0) {
        // ____
    }
    return xs[0];
}
```
'''
hints = [
  "错误是一个值，像其他值一样返回；新的错误从小写的命名空间加一个点拼出来 —— 不是像函数那样调用 —— 不需要声明。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.cheatsheet.30.mod"
title = "剩下的"
story = "当晚的收入三份平分，剩下的硬币进小费罐 —— 绝不会是负的一把。"
brief = '''
`a` 和 `b` 是运行时的 `i64`；`b` 为正，`a` 可能为负。让 `r` 成为**永不为负**的余数：
`a = -7`、`b = 3` 时，`r` 必须是 `2`。
'''
hints = [
  "和 `/` 一样，`%` 拒绝有符号的运行时操作数，逼你选一个内置函数：一个跟随被除数的符号，另一个跟随除数的符号。",
]
