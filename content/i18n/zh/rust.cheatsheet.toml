]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.cheatsheet.28.unwrap-or"
title = "要么就是零"
story = "铜锣湾站的储物柜牌板上可能没有某个号码的记录，而显示屏仍然得显示点什么。"
brief = '''
`o: Option<i32>`。`n` 是一个 `i32`：`o` 里面的值，若 `o` 是 `None` 则为 0 ——
