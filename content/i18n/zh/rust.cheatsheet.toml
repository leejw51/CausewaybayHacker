# RUST LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code and stay English. Code blocks,
# identifiers and printed strings are the English pack's and are copied verbatim,
# never translated.

pack   = "rust.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet.01.read-all"
title = "整卷磁带"
story = "06:30，渣甸坊。售货亭的输入一次全部到达，而它想要全部。"
brief = '''
用一次调用把 stdin 的**全部**内容读进 `s`。

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

是哪一行？
'''
hints = [
  "`read_to_string` 接收一个 `&mut String` 并把它填满；它返回 Result，所以要 unwrap。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.cheatsheet.02.read-line"
title = "换行还在"
story = "订单上写的是 42。收银机读到的却连换行一起带着。"
brief = '''
`read_line` 在 `line` 里留下了 `"42\n"`。哪一行能在不 panic 的前提下把它变成 `usize`？
'''
hints = [
  "`read_line` 会保留 `\\n`。parse 遇到它就会失败，所以先 trim。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet.03.width"
title = "右对齐"
story = "菜市场的价目板把每个数字都对齐在右边。"
brief = '''
把 `x` 在五个字符宽的栏里右对齐打印。
'''
hints = [
  "花括号里，对齐写在宽度前面：`<` 左对齐，`^` 居中，`>` 右对齐。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.cheatsheet.04.usize"
title = "下标是 usize"
story = "铜锣湾站的 7 号储物柜。号码是以 i32 传来的。"
brief = '''
`i` 是 `i32`，`v` 是 `Vec<u8>`。哪一行读取第 `i` 个元素？
'''
hints = [
  "Vec 只能用 `usize` 做下标。`as` 就是类型转换。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet.05.inclusive"
title = "一到十"
story = "电车站编号从 1 到 10，而最后一站偏偏最容易被人忘掉。"
brief = '''
循环 1, 2, … 10，包括 10。
'''
hints = [
  "`a..b` 在 `b` 之前就停下，`a..=b` 则包含 `b`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet.06.guard"
title = "守卫"
story = "骆克道的保安除了名单上的名字，还要多查一样东西。"
brief = '''
在 `match x { … }` 里，匹配任意负数的分支：

```
match x {
    0 => "zero",
    // ____
    _ => "pos",
}
```
'''
hints = [
  "守卫的写法是 `pattern if condition =>`。先把值绑定到一个名字上。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.cheatsheet.07.fnmut"
title = "计数器"
story = "门童手里的计数器：每按一下，它记的数字就变一次。"
brief = '''
`let mut cnt = 0;` —— 写一个闭包 `inc`，每次调用让 `cnt` 加一，使 `inc(); inc();` 能够通过编译。
'''
hints = [
  "会修改所捕获变量的闭包是 `FnMut`，调用它需要一个 `mut` 绑定。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.cheatsheet.08.desc"
title = "大的在前"
story = "崇光地库游戏厅的排行榜：最高分排在最上面。"
brief = '''
把 `v: Vec<i32>` 按**降序**原地排序。
'''
hints = [
  "`sort_by` 接收一个比较函数。把两个操作数对调，顺序就反过来了。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.cheatsheet.09.count"
title = "记账"
story = "大排档按菜式统计订单，新菜式从零开始。"
brief = '''
`m: HashMap<String, i32>`。给键 `k` 的计数加一；如果还没有，就从 0 开始。
'''
hints = [
  "`entry(k).or_insert(0)` 返回一个 `&mut i32`；解引用后再相加。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.cheatsheet.10.min-heap"
title = "最小的在顶"
story = "小巴的队伍先载路程最短的。BinaryHeap 只会把最大的放在顶上。"
brief = '''
`h` 是一个 `BinaryHeap<i32>`。push `x`，使 `h.pop()` 先给出**最小**的。
'''
hints = [
  "BinaryHeap 是最大堆。把值包一层，让它的顺序反过来。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.cheatsheet.11.clone"
title = "两份副本"
story = "时代广场办公室里的复印机。原件留在玻璃板上。"
brief = '''
`let a = String::from("x");` —— 让 `b` 成为一个属于它自己的 `String`，这样之后仍然可以使用 `a`。
'''
hints = [
  "`let b = a;` 会移动这个 String。深拷贝要明确地写出来。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.cheatsheet.12.ok-or"
title = "缺失的一行"
story = "7-32 室的账本里有一处空缺。返回 Result 的函数必须说明原因。"
brief = '''
在 `fn … -> Result<i32, &'static str>` 里，`o` 是一个 `Option<i32>`。把值取出来，否则返回错误 `"missing"`。
'''
hints = [
  "在返回 Result 的函数里，对 Option 用 `?` 行不通。先把 Option 变成 Result。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.cheatsheet.13.filter-map-sum"
title = "先筛选，再平方"
story = "维多利亚公园跑道上的计步器在电池电压不足时会记下负数；阿薇要的是真实圈数的平方，再加起来。"
brief = '''
`v: Vec<i64>` 里既有正数**也有负数**。`s` 是其中仅正数的平方之和。

```
let s: i64 = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "平方之前先丢掉负数 —— 平方是没有符号的。在 `.iter()` 上，filter 的闭包看到的是 `&&i64`。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.cheatsheet.14.iter-mut"
title = "原地修改"
story = "怡和街的 7-Eleven 给货架上的每个价格都加一块钱，而之后货架还得在那里。"
brief = '''
`let mut v: Vec<i32> = …;` —— 给 **`v` 本身的每一个元素**加一，而且下一行还要继续使用 `v`。
'''
hints = [
  "遍历 Vec 有三种方式：借用它、独占借用它，或者把它拿走。只有一种既能通过 `x` 写入，又能保住 `v`。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.cheatsheet.15.windows"
title = "相邻两站"
story = "沿轩尼诗道而下的电车时刻表：阿薇要的是每一站和下一站之间的间隔。"
brief = '''
`v: Vec<i64>` 至少有三个元素。`d` 存放每一个 `i` 对应的 `v[i+1] - v[i]`，
所以它恰好比 `v` 短一个。

```
let d: Vec<i64> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "要的是重叠的对，不是不相交的对 —— 而且每一对到手时是切片，不是元组。",
]

