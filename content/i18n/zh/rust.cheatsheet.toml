# RUST LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code and stay English. Code blocks,
# identifiers and printed strings are the English pack's and are copied verbatim,
# never translated.

pack   = "rust.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet.01.read-all"
title = "整卷磁带"
story = "06:30，渣甸坊。售货亭的输入一次全部到达，而它想要全部。"
brief = '''
用一次调用把 stdin 的**全部**内容读进 `s`。

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

是哪一行？
'''
hints = [
  "`read_to_string` 接收一个 `&mut String` 并把它填满；它返回 Result，所以要 unwrap。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.cheatsheet.02.read-line"
title = "换行还在"
story = "订单上写的是 42。收银机读到的却连换行一起带着。"
brief = '''
`read_line` 在 `line` 里留下了 `"42\n"`。哪一行能在不 panic 的前提下把它变成 `usize`？
'''
hints = [
  "`read_line` 会保留 `\\n`。parse 遇到它就会失败，所以先 trim。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.cheatsheet.03.width"
title = "右对齐"
story = "菜市场的价目板把每个数字都对齐在右边。"
brief = '''
把 `x` 在五个字符宽的栏里右对齐打印。
'''
hints = [
  "花括号里，对齐写在宽度前面：`<` 左对齐，`^` 居中，`>` 右对齐。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.cheatsheet.04.usize"
title = "下标是 usize"
story = "铜锣湾站的 7 号储物柜。号码是以 i32 传来的。"
brief = '''
`i` 是 `i32`，`v` 是 `Vec<u8>`。哪一行读取第 `i` 个元素？
'''
hints = [
  "Vec 只能用 `usize` 做下标。`as` 就是类型转换。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet.05.inclusive"
title = "一到十"
story = "电车站编号从 1 到 10，而最后一站偏偏最容易被人忘掉。"
brief = '''
循环 1, 2, … 10，包括 10。
'''
hints = [
  "`a..b` 在 `b` 之前就停下，`a..=b` 则包含 `b`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet.06.guard"
title = "守卫"
story = "骆克道的保安除了名单上的名字，还要多查一样东西。"
brief = '''
在 `match x { … }` 里，匹配任意负数的分支：

```
match x {
    0 => "zero",
    // ____
    _ => "pos",
}
```
'''
hints = [
  "守卫的写法是 `pattern if condition =>`。先把值绑定到一个名字上。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.cheatsheet.07.fnmut"
title = "计数器"
story = "门童手里的计数器：每按一下，它记的数字就变一次。"
brief = '''
`let mut cnt = 0;` —— 写一个闭包 `inc`，每次调用让 `cnt` 加一，使 `inc(); inc();` 能够通过编译。
'''
hints = [
  "会修改所捕获变量的闭包是 `FnMut`，调用它需要一个 `mut` 绑定。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.cheatsheet.08.desc"
title = "大的在前"
story = "崇光地库游戏厅的排行榜：最高分排在最上面。"
brief = '''
把 `v: Vec<i32>` 按**降序**原地排序。
'''
hints = [
  "`sort_by` 接收一个比较函数。把两个操作数对调，顺序就反过来了。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.cheatsheet.09.count"
title = "记账"
story = "大排档按菜式统计订单，新菜式从零开始。"
brief = '''
`m: HashMap<String, i32>`。给键 `k` 的计数加一；如果还没有，就从 0 开始。
'''
hints = [
  "`entry(k).or_insert(0)` 返回一个 `&mut i32`；解引用后再相加。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.cheatsheet.10.min-heap"
title = "最小的在顶"
story = "小巴的队伍先载路程最短的。BinaryHeap 只会把最大的放在顶上。"
brief = '''
`h` 是一个 `BinaryHeap<i32>`。push `x`，使 `h.pop()` 先给出**最小**的。
'''
hints = [
  "BinaryHeap 是最大堆。把值包一层，让它的顺序反过来。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.cheatsheet.11.clone"
title = "两份副本"
story = "时代广场办公室里的复印机。原件留在玻璃板上。"
brief = '''
`let a = String::from("x");` —— 让 `b` 成为一个属于它自己的 `String`，这样之后仍然可以使用 `a`。
'''
hints = [
  "`let b = a;` 会移动这个 String。深拷贝要明确地写出来。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.cheatsheet.12.ok-or"
title = "缺失的一行"
story = "7-32 室的账本里有一处空缺。返回 Result 的函数必须说明原因。"
brief = '''
在 `fn … -> Result<i32, &'static str>` 里，`o` 是一个 `Option<i32>`。把值取出来，否则返回错误 `"missing"`。
'''
hints = [
  "在返回 Result 的函数里，对 Option 用 `?` 行不通。先把 Option 变成 Result。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.cheatsheet.13.filter-map-sum"
title = "先筛选，再平方"
story = "维多利亚公园跑道上的计步器在电池电压不足时会记下负数；阿薇要的是真实圈数的平方，再加起来。"
brief = '''
`v: Vec<i64>` 里既有正数**也有负数**。`s` 是其中仅正数的平方之和。

```
let s: i64 = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "平方之前先丢掉负数 —— 平方是没有符号的。在 `.iter()` 上，filter 的闭包看到的是 `&&i64`。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.cheatsheet.14.iter-mut"
title = "原地修改"
story = "怡和街的 7-Eleven 给货架上的每个价格都加一块钱，而之后货架还得在那里。"
brief = '''
`let mut v: Vec<i32> = …;` —— 给 **`v` 本身的每一个元素**加一，而且下一行还要继续使用 `v`。
'''
hints = [
  "遍历 Vec 有三种方式：借用它、独占借用它，或者把它拿走。只有一种既能通过 `x` 写入，又能保住 `v`。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.cheatsheet.15.windows"
title = "相邻两站"
story = "沿轩尼诗道而下的电车时刻表：阿薇要的是每一站和下一站之间的间隔。"
brief = '''
`v: Vec<i64>` 至少有三个元素。`d` 存放每一个 `i` 对应的 `v[i+1] - v[i]`，
所以它恰好比 `v` 短一个。

```
let d: Vec<i64> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "要的是重叠的对，不是不相交的对 —— 而且每一对到手时是切片，不是元组。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.cheatsheet.16.reverse-string"
title = "倒过来"
story = "擦窗工从远端读波斯富街的霓虹灯；阿薇要的是按他的顺序排列的字母。"
brief = '''
`s: &str` 可能含有非 ASCII 字符。`r` 是一个新的 `String`，内容是 `s` 的字符按相反的顺序排列。
'''
hints = [
  "遍历字符（不是字节 —— 多字节字符会被拆坏），把遍历反过来，再收集成一个 String。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.cheatsheet.17.concat"
title = "连接，而不是移动"
story = "两条队伍在时代广场扶手电梯脚下合流；两边的名单都是借给阿薇的，不是送给她的。"
brief = '''
`a: Vec<i32>` 和 `b: Vec<i32>`。`c` 是一个**新的** `Vec<i32>`，内容是 `a` 的元素后面接着 `b` 的 —— 而且之后 `a` 和 `b` 都还要使用。
'''
hints = [
  "按值连接两个 Vec 会把它们移动掉。改为连接两个借来的切片。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.cheatsheet.18.derive-hash"
title = "能进集合"
story = "Ferris 把铜锣湾网格里每个走过的路口钉进一个集合，而编译器想知道两枚图钉该怎么比较。"
brief = '''
`struct P { x: i32, y: i32 }` 必须能放进 `HashSet<P>`。写在 struct 上方的哪一行 derive **足以**让 `set.insert(p)` 通过编译？
'''
hints = [
  "哈希集合需要对值做哈希，还需要比较两个值是否完全相等 —— 而完全相等建立在部分相等之上。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "最后一个签退"
story = "骆克道上四个速递员用同一部对讲机报到，调度员必须知道最后一个什么时候签退。"
brief = '''
四个生产者，一个消费者。`for` 循环必须在四条消息到齐后结束。

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

空缺处放哪一行？
'''
hints = [
  "只有当每一个发送端都消失，循环才会结束。四个克隆跟着它们的线程走了 —— 还有一个发送端仍然留在 `main` 里。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "一条单轨，四个厨师"
story = "Lucky Mac 的夜厨房：一条点单轨，四个厨师，一次只能有一个人读它。"
brief = '''
`rx: Receiver<u64>` 是任务队列。四个 worker 线程，每个都用 `move` spawn 出来，必须全部从这**一个**接收端取任务。哪一行把 `rx` 包起来，使得每个 worker 都能克隆到一个句柄？
'''
hints = [
  "Receiver 不是 Sync，所以跨线程共享它需要一把锁 —— 而这把锁需要一个线程安全的所有者，不是单线程的那种。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.cheatsheet.21.from-str"
title = "从线上来"
story = "一条客户记录以 JSON 的形式从告士打道的金融科技公司顺着线路传来，阿薇要把它变成一个 struct。"
brief = '''
`s: &str` 存着一个 JSON 对象。`User` derive 了 `Deserialize`，并且有一个
`name: String` 字段。填上空缺，让它通过编译：

```
fn name_of(s: &str) -> Result<String, serde_json::Error> {
    // ____
    Ok(u.name)
}
```
'''
hints = [
  "下一行的 `u.name` 什么也定不下来：serde 猜不出目标类型，所以要在绑定上写明它。输入是文本，不是 `Value`。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.cheatsheet.22.lower-bound"
title = "第一个不小于的"
story = "崇光的价目板是排好序的；阿薇想知道第一件价格至少为 `t` 的商品从哪里开始。"
brief = '''
`v: Vec<i64>` 按升序排好，可能含有重复；`t: i64` 可能在里面，也可能不在。`i` 是**第一个 ≥ `t` 的元素**的下标（没有的话就是 `v.len()`）—— 经典的 lower bound，O(log n)，不 panic。
'''
hints = [
  "切片被分成谓词成立的部分和不成立的部分；返回的下标就是谓词开始不成立的第一个元素。选那个对所有*小于* `t` 的值都为真的谓词。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.cheatsheet.23.pow"
title = "乘方"
story = "铜锣湾唐楼的复利租金：底数的若干次方，而指数送到时位宽不对。"
brief = '''
`x: u64` 和 `e: u64`，结果装得下。`p` 是 `x` 的 `e` 次方。
'''
hints = [
  "`^` 是异或，不是乘方。整数的乘方方法只接受一种固定位宽的指数，而它不是 `u64`。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "rust.cheatsheet.24.read-vec"
title = "一整行"
story = "渣甸坊最后一台收银机交出一行用空格隔开的数字，连换行符一起；上游的一切都靠这一次解析。"
brief = '''
`line` 来自 `read_line`，所以 `\n` 还在上面，而且数字之间可能隔着**不止一个空格**。
把它变成一个 `Vec<i64>`，对于格式正确的一行不能 panic。

```
let v: Vec<i64> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "按连续的空白切分（这也会吃掉换行符），把每个 token 解析并 unwrap，然后收集 —— Vec<i64> 不能从 Result 收集出来。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.cheatsheet.25.let-mut"
title = "计数从十开始"
story = "渣甸坊的鸡蛋仔档口记着一个不断累加的订单数，而这个数必须允许被改动。"
brief = '''
把 `y` 声明为一个存着 10 的**无符号 64 位**整数，使下一行能编译：

```
// ____
y += 1;
```

是哪一行？
'''
hints = [
  "两件事要做对：绑定必须允许改动，而绑定用一个 `=` 来赋值，不是比较。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.cheatsheet.26.fn-add"
title = "最后一个字符"
story = "Mei 在渣甸坊楼上的收银机里写下最小的一个函数，编译器却为最后一个字符争论不休。"
brief = '''
一个函数 `add`，接收两个 `i32` 值并返回它们的和，使 `println!("{}", add(2, 3));`
打印出 `5`。整个函数写在一行上。
'''
hints = [
  "参数要有类型，返回类型写在箭头之后，而以分号结尾的函数体返回的是 `()`。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.cheatsheet.27.sub-slice"
title = "中间的两辆"
story = "波斯富街旁的车厂里停着五辆电车；Mei 只想看第二辆和第三辆，而车厂五辆都留着。"
brief = '''
`v: Vec<i32>` 至少有四个元素。`w` 是一个 `&[i32]`，**恰好**借用下标 1 和 2 处的
元素 —— 两个元素，不复制。

```
let w: &[i32] = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "对 Vec 用范围下标得到的是切片，而切片必须借用才能持有。`a..b` 不包含末端；`a..=b` 包含。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.cheatsheet.28.unwrap-or"
title = "要么就是零"
story = "铜锣湾站的储物柜牌板上可能没有某个号码的记录，而显示屏仍然得显示点什么。"
brief = '''
`o: Option<i32>`。`n` 是一个 `i32`：`o` 里面的值，若 `o` 是 `None` 则为 0 ——
而且这一行**绝不能 panic**。
'''
hints = [
  "有一个方法带着后备值来解包；后备值是内部类型的普通值，不是另一个 Option。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.cheatsheet.29.pop-front"
title = "下一位"
story = "铜锣湾网格上的 BFS 按发现的顺序取出站点 —— 是怡和街的小巴队伍，不是一摞盘子。"
brief = '''
`q: VecDeque<usize>` 是队列。循环每一轮**移除**队首的元素，队列空了就结束：

```
while let Some(u) = ____ {
```

哪个表达式填进空缺？
'''
hints = [
  "VecDeque 有两端，方法名里都点明了是哪一端。只看队首而不取走，会永远转下去。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.cheatsheet.30.char-count"
title = "数霓虹灯"
story = "骆克道上方的招牌写着 銅鑼灣 三个字，而 Mei 第一次数出来的结果大得离谱。"
brief = '''
`s: &str` 含有中文字符。`n` 是 `s` 里**字符**的个数 —— 所以对 `"銅鑼灣"` 来说是
3，不是 9。

```
let n = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "`&str` 以字节计量自己的长度，而一个汉字占三个字节。数字符，不是数字节 —— 而且字符迭代器无法预先报出自己的长度，只能说它走了多少步。",
]
