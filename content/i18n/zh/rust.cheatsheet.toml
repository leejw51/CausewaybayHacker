```

是哪一行？
'''
hints = [
  "两件事要做对：绑定必须允许改动，而绑定用一个 `=` 来赋值，不是比较。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.cheatsheet.26.fn-add"
title = "最后一个字符"
story = "Mei 在渣甸坊楼上的收银机里写下最小的一个函数，编译器却为最后一个字符争论不休。"
brief = '''
一个函数 `add`，接收两个 `i32` 值并返回它们的和，使 `println!("{}", add(2, 3));`
打印出 `5`。整个函数写在一行上。
'''
hints = [
  "参数要有类型，返回类型写在箭头之后，而以分号结尾的函数体返回的是 `()`。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.cheatsheet.27.sub-slice"
title = "中间的两辆"
story = "波斯富街旁的车厂里停着五辆电车；Mei 只想看第二辆和第三辆，而车厂五辆都留着。"
brief = '''
`v: Vec<i32>` 至少有四个元素。`w` 是一个 `&[i32]`，**恰好**借用下标 1 和 2 处的
元素 —— 两个元素，不复制。

```
let w: &[i32] = ____;
```

哪个表达式填进空缺？
'''
hints = [
