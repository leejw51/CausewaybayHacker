'''
hints = [
  "有一个方法带着后备值来解包；后备值是内部类型的普通值，不是另一个 Option。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.cheatsheet.29.pop-front"
title = "下一位"
story = "铜锣湾网格上的 BFS 按发现的顺序取出站点 —— 是怡和街的小巴队伍，不是一摞盘子。"
brief = '''
`q: VecDeque<usize>` 是队列。循环每一轮**移除**队首的元素，队列空了就结束：

```
while let Some(u) = ____ {
```

哪个表达式填进空缺？
'''
hints = [
  "VecDeque 有两端，方法名里都点明了是哪一端。只看队首而不取走，会永远转下去。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.cheatsheet.30.char-count"
title = "数霓虹灯"
story = "骆克道上方的招牌写着 銅鑼灣 三个字，而 Mei 第一次数出来的结果大得离谱。"
brief = '''
`s: &str` 含有中文字符。`n` 是 `s` 里**字符**的个数 —— 所以对 `"銅鑼灣"` 来说是
3，不是 9。

```
let n = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "`&str` 以字节计量自己的长度，而一个汉字占三个字节。数字符，不是数字节 —— 而且字符迭代器无法预先报出自己的长度，只能说它走了多少步。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.cheatsheet.31.option-map"
title = "翻倍，或者什么都没有"
story = "茶餐厅的欢乐时光里，积分卡上的印花翻倍——前提是有卡。没有卡就没有印花，收银台也不能因此崩掉。"
brief = '''
`o: Option<i32>`。`d` 是 `o` 里的值翻倍后的结果，仍然包着：
`Some(21)` 变成 `Some(42)`，`None` 保持 `None`，不会 panic。

```
let d: Option<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "有一个方法只改变 Option 里面的东西，盒子保持不变：闭包拿到的是普通值，返回的也是普通值，而 `None` 根本不会到达闭包。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.cheatsheet.32.and-then"
title = "一个盒子，不是两个"
story = "点单纸可能是空白的；就算不是，Alex 也可能在桌号那一栏写了 \"tea\"。"
brief = '''
`s: Option<&str>`。`n` 是 `s` 里写的数字：`Some("42")` 得到 `Some(42)`，
`Some("tea")` 和 `None` 都得到 `None`。解析本身也可能失败，所以闭包会产生
它自己的 Option。

```
let n: Option<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "当闭包本身已经返回 Option 时，只变换里面的值会留下 `Option<Option<i32>>`。你需要的是让闭包自己的 Option 直接成为结果的那个方法——而且闭包必须返回 Option，而不是 Result。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "rust.cheatsheet.33.option-filter"
title = "只要大桌"
story = "时代广场美食广场楼上，只有超过一百块的账单才送一杯免费柠檬茶。"
brief = '''
`t: Option<i32>` 是一张账单。`big` 只在账单**超过 100** 时保留它：
`Some(150)` 仍是 `Some(150)`，`Some(20)` 变成 `None`，`None` 仍是 `None`。

```
let big: Option<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "Option 也能像迭代器一样按谓词保留或丢弃。谓词拿到的是值的引用，所以和数字比较之前先解构它。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "rust.cheatsheet.34.unwrap-or-else"
title = "别打电话给厨房"
story = "菜单板缓存着今日特价。打电话到边宁顿街的厨房要一分钟，所以阿薇只在菜单板空着的时候才打。"
brief = '''
`cache: Option<String>`，而 `fn fetch() -> String` 很慢。`s` 是缓存的字符串；
`cache` 为 `None` 时则是 `fetch()` 的结果——而当 `cache` 有值时，`fetch`
**根本不能运行**。

```
let s: String = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "参数在方法被调用之前就会被求值，不管方法需不需要它。要让后备值变成惰性的，就交出一个计算它的闭包；方法只会在 `None` 时调用它。",
]

# ---------------------------------------------------------------- 35
[[quest]]
id    = "rust.cheatsheet.35.unwrap-or-default"
title = "空托盘"
story = "就算 9 号桌没人点单，点心车推过去时也是一个空托盘，而不是一个洞。"
brief = '''
`o: Option<Vec<i32>>`。`v` 是 `o` 里的 Vec；`o` 为 `None` 时则是该类型自己的
默认值——空 Vec——而且不写出这个默认值。

```
let v: Vec<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "每个 `Default` 类型都知道自己的空值，Option 有一个专门要这个值的 unwrap：它不接受参数。你可能记得的 `or_default` 在 HashMap 的 entry API 上，不在 Option 上。",
]

# ---------------------------------------------------------------- 36
[[quest]]
id    = "rust.cheatsheet.36.map-or"
title = "名牌宽度"
story = "希慎广场柜台的名牌打印机按名字决定名牌宽度，没有名字就打出一张宽度为零的名牌。"
brief = '''
`o: Option<&str>`。`n` 是里面字符串的长度，`None` 时为 `0`——默认值和变换
在**一次**调用里完成：`Some("Mei")` 得到 3。

```
let n: usize = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "有一个方法就是 map 加上带后备值的 unwrap。它的默认值放在前面，是一个普通值；带 `_else` 的兄弟方法则要求默认值是一个闭包。",
]

# ---------------------------------------------------------------- 37
[[quest]]
id    = "rust.cheatsheet.37.then-some"
title = "会员减十块"
story = "崇光百货的收银员给持卡会员减十块。其他人什么都没有，不是零，是没有。"
brief = '''
`vip: bool`。`vip` 为 true 时 `discount` 是 `Some(10)`，为 false 时是 `None`，
用一次在 bool 上的调用写出来。

```
let discount: Option<u32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "bool 可以变成 Option。一个方法接收值本身并把它包起来；名字更短的孪生方法则要求一个闭包。无论哪种，传入的都是里面的值，而不是一个 Option。",
]

# ---------------------------------------------------------------- 38
[[quest]]
id    = "rust.cheatsheet.38.bool-then"
title = "只在营业时"
story = "怡和街大排档打印整份菜单要花一阵子。打烊之后，Alex 希望打印机根本别启动。"
brief = '''
`open: bool`，而 `fn menu() -> Vec<String>` 很慢。`open` 为 true 时 `m` 是
`Some(menu())`，为 false 时是 `None`——而且 `open` 为 false 时 `menu`
**不能运行**。

```
let m: Option<Vec<String>> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "传一个值，就意味着每次都要先把它算出来。接收闭包的那个 bool 方法只会在 bool 为 true 时调用它。",
]

# ---------------------------------------------------------------- 39
[[quest]]
id    = "rust.cheatsheet.39.filter-map-parse"
title = "跳过糊掉的字"
story = "雨打在波斯富街电车站的告示板上，把几个到站分钟数糊成了字母。留下数字，其余丢掉。"
brief = '''
`words: Vec<&str>` 是 `["3", "x", "7"]`。`nums` 装下所有能解析成数字的词，
解析不了的就直接**跳过**：`[3, 7]`。

```
let nums: Vec<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "普通的 map 每个输入保留一个输出，所以坏词会变成 `None`（或者一次 panic）。有一个适配器把每项映射成 Option，只保留解开后的 `Some`。",
]

# ---------------------------------------------------------------- 40
[[quest]]
id    = "rust.cheatsheet.40.filter-map-then-some"
title = "双号座位，双倍积分"
story = "凌晨两点开往旺角的小巴上，今晚只有双号座位能攒积分，而且是双倍。"
brief = '''
`v: Vec<i32>` 是 `[1, 2, 3, 4]`。`d` 只为**偶数** `x` 装入 `x * 2`——`[4, 8]`
——挑选和变换在同一个适配器里完成。

```
let d: Vec<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "用接收普通值的那个 bool 方法把判断变成 Option，再让丢弃 `None` 的适配器来挑选。filter 要的是 bool，普通的 map 则会把 Option 本身收集起来。",
]

# ---------------------------------------------------------------- 41
[[quest]]
id    = "rust.cheatsheet.41.find"
title = "第一个大客"
story = "利园收银台的小票卷一路滚过去。阿薇要的是第一张超过五十块的小票，就那一张。"
brief = '''
`v: Vec<i32>` 是 `[12, 64, 30, 90]`。`f` 是**第一个**大于 50 的元素的引用，
没有则为 `None`：这里是 `Some(&64)`。

```
let f: Option<&i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "在第一个匹配处停下的适配器返回的是 Option，不是另一个迭代器，也不是 bool。它的闭包拿到的是元素的引用，而在 `.iter()` 上元素本身已经是引用——要剥两层。",
]

# ---------------------------------------------------------------- 42
[[quest]]
id    = "rust.cheatsheet.42.position"
title = "第几站？"
story = "港岛线的显示屏要点亮正确的那个点，所以它要的是铜锣湾在线上的位置，而不是它的名字。"
brief = '''
`stops: Vec<&str>` 是 `["Admiralty", "Wan Chai", "Causeway Bay", "Tin Hau"]`。
`i` 是 `"Causeway Bay"` 的**下标**，找不到则为 `None`：这里是 `Some(2)`。

```
let i: Option<usize> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "找到元素，得到的是元素；你要的是它站在哪里。有一个方法只返回下标，而它的闭包拿到的是元素本身，而不是元素的引用。",
]

# ---------------------------------------------------------------- 43
[[quest]]
id    = "rust.cheatsheet.43.find-map"
title = "第一个真数字"
story = "骆克道变电站的电表读数开头全是破折号和 n/a。工程师要的是第一个真正的数字。"
brief = '''
`cells: Vec<&str>` 是 `["--", "n/a", "42", "7"]`。`first` 是**第一个**能解析
成数字的格子，并且已经解析好——`Some(42)`——一个都没有则为 `None`。

```
let first: Option<i32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "find 返回的是原来的元素，而不是解析后的值；只看第一个元素则会停在 `\"--\"`。有一个方法把每项映射成 Option，并在第一个 `Some` 处停下——它的闭包必须返回 Option，而不是 Result。",
]

# ---------------------------------------------------------------- 44
[[quest]]
id    = "rust.cheatsheet.44.flat-map"
title = "单子上的每个词"
story = "金华柜台上的点单纸一行一行钉着。盘点要把所有单子上的每个词放进一张清单。"
brief = '''
`lines: Vec<&str>` 是 `["milk tea", "pineapple bun x2"]`。`words` 是每一行的
每个词组成的一张扁平清单：
`["milk", "tea", "pineapple", "bun", "x2"]`。

```
let words: Vec<&str> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "每一行都会变成一个词的迭代器，普通的 map 会交给你一个迭代器的迭代器。有一个适配器边映射边把内层迭代器首尾相接——它就是 map 之后再 `flatten`，和把一串 Option 只留下 Some 的是同一个 `flatten`。",
]

# ---------------------------------------------------------------- 45
[[quest]]
id    = "rust.cheatsheet.45.all"
title = "全部够冷"
story = "时代广场小卖部的奶茶冰箱，只有当天每一次读数都低于四十度才算通过检查。"
brief = '''
`temps: Vec<i32>`。当**每一个**读数都低于 40 时 `ok` 为 true：
`[30, 35]` 得到 `true`，`[30, 45]` 得到 `false`。

```
let ok: bool = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "一个方法只要有一项通过就为 true，另一个只有在没有任何一项失败时才为 true。选严格的那个，并记住 `.iter()` 交给闭包的是引用。",
]

# ---------------------------------------------------------------- 46
[[quest]]
id    = "rust.cheatsheet.46.map-err"
title = "用你自己的话说"
story = "铜锣湾诊所的排队机会打印号码票。扫描出来是乱码时，屏幕上应该显示 \"bad ticket\"，而不是 ParseIntError。"
brief = '''
在 `fn ticket(s: &str) -> Result<u32, String>` 里，用 `?` 解析 `s`。
`s` 不合法时函数必须返回 `Err("bad ticket".to_string())`
——`ParseIntError` 本身不会转换成 `String`。

```
let n: u32 = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "只改 Result 的错误那一侧，Ok 那一侧不动，`?` 就能把它带出去。用 `.ok()` 丢掉错误会得到一个 Option，如果你只关心成没成功那是对的——但在返回 Result 的函数里，不能对 Option 用 `?`。",
]

# ---------------------------------------------------------------- 47
[[quest]]
id    = "rust.cheatsheet.47.option-to-result"
title = "包起来不等于转换"
story = "铜锣湾站的八达通增值机要么有余额，要么没有，可收据打印机只听得懂 Result。"
brief = '''
`o` 是一个 `Option<u32>`。`o` 是 `Some(v)` 时 `r` 必须是 `Ok(v)`，是 `None` 时
必须是 `Err("empty")`。

```
let r: Result<u32, &str> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "把整个 Option 包进 `Ok` 得到的是 `Result<Option<u32>, _>`——`None` 还在里面。转换的意思是说清楚 `None` 要变成哪个错误。",
]

# ---------------------------------------------------------------- 48
[[quest]]
id    = "rust.cheatsheet.48.result-to-option"
title = "只告诉我解析成没成"
story = "阿薇的电车站计数器读剪贴板上潦草的数字；读不出来就耸耸肩，不用解释。"
brief = '''
`r` 是 `s.parse::<u32>()` 返回的 `Result<u32, ParseIntError>`。解析成功时 `o`
必须是 `Some(n)`，失败时是 `None`——错误本身用不着。

```
let o: Option<u32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "从 Result 降到 Option，会保留 Ok 那一边，把错误扔掉。`Some(…)` 只是把整个 Result 包起来，而 Result 的另一边是错误，不是值。",
]

# ---------------------------------------------------------------- 49
[[quest]]
id    = "rust.cheatsheet.49.result-err"
title = "只要投诉"
story = "崇光地库的打印机用 Result 记录每个任务；夜班经理只想要一份出错的清单，成功的一概不提。"
brief = '''
`r` 是一个 `Result<u32, String>`。`r` 是 `Err(message)` 时 `e` 必须是
`Some(message)`，`r` 是 `Ok` 时是 `None`。

```
let e: Option<String> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "把 Ok 那边留成 Option 的方法有个孪生兄弟：留下 Err 那边、丢掉 Ok 的那个。",
]

# ---------------------------------------------------------------- 50
[[quest]]
id    = "rust.cheatsheet.50.filter-map-result-ok"
title = "只留好读数"
story = "轩尼诗道电车线上的三个计量表发回报告；其中一个报了故障，Alex 只要传过来的读数。"
brief = '''
`results` 是 `Vec<Result<u32, String>>`，比如
`[Ok(3), Err("x"), Ok(5)]`。`good` 必须只有那些 `Ok` 的值：
`[3, 5]`。

```
let good: Vec<u32> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "方法可以用路径传进去，代替闭包。你需要那个把每个 Result 变成 Option 的方法，再配上只保留 Some 并拆开它们的适配器。",
]

# ---------------------------------------------------------------- 51
[[quest]]
id    = "rust.cheatsheet.51.ok-question-in-option-fn"
title = "问号，Option 那边"
story = "大排档的点单纸写着要几碗；字迹糊了的单子应该就是没点，而不是报错。"
brief = '''
在 `fn double(s: &str) -> Option<u32>` 里，把 `s` 解析成 `u32`，解析不了就以
`None` 结束。`double("21")` 是 `Some(42)`，
`double("x")` 是 `None`。

```
let n = ____;
Some(n * 2)
```

哪个表达式填进空缺？
'''
hints = [
  "`?` 只能带出和函数返回值同一种的失败。这个函数返回 Option，所以先把解析得到的 Result 变成 Option；这样 `?` 才能在它的 `None` 上停下。",
]

# ---------------------------------------------------------------- 52
[[quest]]
id    = "rust.cheatsheet.52.both-ways"
title = "去了又回"
story = "时代广场放映会的座位表是一个手写的 HashMap，名字对座位号：有的名字没有，有的号码不是数字。"
brief = '''
在 `fn seat(m: &HashMap<&str, &str>, k: &str) -> Result<u32, String>` 里：
找不到 `k` 必须返回 `Err(format!("no {k}"))`，值解析不了必须
把解析错误以 `String` 返回。

```
let n = ____;
Ok(n)
```

哪个表达式填进空缺？
'''
hints = [
  "两种失败，两种形状：查找给的是 Option，要先变成 Result，`?` 才能在这里用；解析给的是 Result，但它的错误还不是 String。",
]

# ---------------------------------------------------------------- 53
[[quest]]
id    = "rust.cheatsheet.53.let-else"
title = "否则就走"
story = "铜锣湾的电车读卡器要么读到车费，要么什么也读不到；读不到时，闸门就一直关着。"
brief = '''
`a: Option<i32>`。把值取出到 `x`，让这一行**之后**的代码都能用它；`a` 是
`None` 时就离开函数。

```
fn show(a: Option<i32>) {
    ____
    println!("{}", x);
}
```

哪一行填进空缺？
'''
hints = [
  "这个模式会把 `x` 绑定到整个代码块的剩余部分，所以它不能放在 `if` 里。而且 `else` 分支不能正常结束——必须离开：return、break、continue 或 panic。",
]

# ---------------------------------------------------------------- 54
[[quest]]
id    = "rust.cheatsheet.54.let-else-continue"
title = "跳过糊掉的单"
story = "阿薇把大排档的点单纸加起来；有一张糊掉了，其余的照样算。"
brief = '''
`lines` 是 `["4", "x", "10"]`。把能解析的数字加起来，解析不了的跳过，
让 `total` 最后是 `14`。

```
for s in lines {
    ____
    total += n;
}
```

哪一行填进空缺？
'''
hints = [
  "`parse` 给的是 Result，所以模式是 Result 的成功分支，不是 Option 的。else 分支要离开这一轮循环，而不是结束整个循环。",
]
