[[quest]]
id    = "rust.cheatsheet.16.reverse-string"
title = "倒过来"
story = "擦窗工从远端读波斯富街的霓虹灯；阿薇要的是按他的顺序排列的字母。"
brief = '''
`s: &str` 可能含有非 ASCII 字符。`r` 是一个新的 `String`，内容是 `s` 的字符按相反的顺序排列。
'''
hints = [
  "遍历字符（不是字节 —— 多字节字符会被拆坏），把遍历反过来，再收集成一个 String。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.cheatsheet.17.concat"
title = "连接，而不是移动"
story = "两条队伍在时代广场扶手电梯脚下合流；两边的名单都是借给阿薇的，不是送给她的。"
brief = '''
`a: Vec<i32>` 和 `b: Vec<i32>`。`c` 是一个**新的** `Vec<i32>`，内容是 `a` 的元素后面接着 `b` 的 —— 而且之后 `a` 和 `b` 都还要使用。
'''
hints = [
  "按值连接两个 Vec 会把它们移动掉。改为连接两个借来的切片。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.cheatsheet.18.derive-hash"
title = "能进集合"
story = "Ferris 把铜锣湾网格里每个走过的路口钉进一个集合，而编译器想知道两枚图钉该怎么比较。"
brief = '''
`struct P { x: i32, y: i32 }` 必须能放进 `HashSet<P>`。写在 struct 上方的哪一行 derive **足以**让 `set.insert(p)` 通过编译？
'''
hints = [
  "哈希集合需要对值做哈希，还需要比较两个值是否完全相等 —— 而完全相等建立在部分相等之上。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "最后一个签退"
story = "骆克道上四个速递员用同一部对讲机报到，调度员必须知道最后一个什么时候签退。"
brief = '''
四个生产者，一个消费者。`for` 循环必须在四条消息到齐后结束。

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

空缺处放哪一行？
'''
hints = [
  "只有当每一个发送端都消失，循环才会结束。四个克隆跟着它们的线程走了 —— 还有一个发送端仍然留在 `main` 里。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "一条单轨，四个厨师"
story = "Lucky Mac 的夜厨房：一条点单轨，四个厨师，一次只能有一个人读它。"
brief = '''
`rx: Receiver<u64>` 是任务队列。四个 worker 线程，每个都用 `move` spawn 出来，必须全部从这**一个**接收端取任务。哪一行把 `rx` 包起来，使得每个 worker 都能克隆到一个句柄？
'''
hints = [
  "Receiver 不是 Sync，所以跨线程共享它需要一把锁 —— 而这把锁需要一个线程安全的所有者，不是单线程的那种。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.cheatsheet.21.from-str"
title = "从线上来"
story = "一条客户记录以 JSON 的形式从告士打道的金融科技公司顺着线路传来，阿薇要把它变成一个 struct。"
brief = '''
`s: &str` 存着一个 JSON 对象。`User` derive 了 `Deserialize`，并且有一个
`name: String` 字段。填上空缺，让它通过编译：

```
fn name_of(s: &str) -> Result<String, serde_json::Error> {
    // ____
    Ok(u.name)
}
```
'''
hints = [
  "下一行的 `u.name` 什么也定不下来：serde 猜不出目标类型，所以要在绑定上写明它。输入是文本，不是 `Value`。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "rust.cheatsheet.22.lower-bound"
title = "第一个不小于的"
story = "崇光的价目板是排好序的；阿薇想知道第一件价格至少为 `t` 的商品从哪里开始。"
brief = '''
`v: Vec<i64>` 按升序排好，可能含有重复；`t: i64` 可能在里面，也可能不在。`i` 是**第一个 ≥ `t` 的元素**的下标（没有的话就是 `v.len()`）—— 经典的 lower bound，O(log n)，不 panic。
'''
hints = [
  "切片被分成谓词成立的部分和不成立的部分；返回的下标就是谓词开始不成立的第一个元素。选那个对所有*小于* `t` 的值都为真的谓词。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.cheatsheet.23.pow"
title = "乘方"
story = "铜锣湾唐楼的复利租金：底数的若干次方，而指数送到时位宽不对。"
brief = '''
`x: u64` 和 `e: u64`，结果装得下。`p` 是 `x` 的 `e` 次方。
'''
hints = [
  "`^` 是异或，不是乘方。整数的乘方方法只接受一种固定位宽的指数，而它不是 `u64`。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "rust.cheatsheet.24.read-vec"
title = "一整行"
story = "渣甸坊最后一台收银机交出一行用空格隔开的数字，连换行符一起；上游的一切都靠这一次解析。"
brief = '''
`line` 来自 `read_line`，所以 `\n` 还在上面，而且数字之间可能隔着**不止一个空格**。
把它变成一个 `Vec<i64>`，对于格式正确的一行不能 panic。

```
let v: Vec<i64> = ____;
```

哪个表达式填进空缺？
'''
hints = [
  "按连续的空白切分（这也会吃掉换行符），把每个 token 解析并 unwrap，然后收集 —— Vec<i64> 不能从 Result 收集出来。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.cheatsheet.25.let-mut"
title = "计数从十开始"
story = "渣甸坊的鸡蛋仔档口记着一个不断累加的订单数，而这个数必须允许被改动。"
brief = '''
把 `y` 声明为一个存着 10 的**无符号 64 位**整数，使下一行能编译：

```
