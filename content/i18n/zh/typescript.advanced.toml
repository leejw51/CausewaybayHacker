```

给它一个 `size` getter、一个 `has` 方法，以及一个 `[Symbol.iterator]()` —— 这是 `for...of`
通过那个 symbol 去查找的方法，就像 Python 的 `for` 去查找 `__iter__` 一样。
'''
hints = [
