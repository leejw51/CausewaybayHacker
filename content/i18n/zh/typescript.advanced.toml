brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<NAME> <CENTS>`。

把每一行建成一个字段为 `readonly` 的 `Price`。然后对每个价格尝试覆盖它的 `cents`，尝试抛出异常时输出 `FROZEN <NAME>`。接着，一个只有一个字段 `count` 的 `Tally`：设置它，然后尝试设置拼错的 `cuont`，当*这个*抛出异常时输出 `SEALED YES`。最后输出 `IN_SET <k>`，即按名字和 cents 算有多少个不同的价格，以及 `TOTAL <sum>`。

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SEALED YES
        IN_SET 2
        TOTAL 3300
```

`readonly` 是和编译器的约定，和这里的每一个约定一样，它会被**擦除**。`price.cents = 0` 编译不过 —— 所以起始代码通过一个放宽了的视图去写，`(price as { cents: number }).cents = 0`，它能编译，因为 readonly 属性可以赋给可变属性，而到了运行时没有任何东西拦着。价目卡被写了，`TOTAL` 是 `0`。约定在运行时的那一半是构造函数末尾的 `Object.freeze(this)`：在严格模式下，给冻结对象的属性赋值会抛出 `TypeError`，而 `tsc` 在 `strict` 下输出的每个文件都以 `"use strict"` 开头。

`Object.seal(this)` 是另一种固定形状：已有字段仍然可写，而添加新字段 —— 一个拼写错误 —— 会抛出异常，而不是悄悄造出一个没人读的字段。如果你让编译器管，它也会抓到 `tally.cuont`；起始代码不让它管，`JSON.parse` 也不让。

还有，对象的 `Set` 数的是**对象**，而不是值：两个 `LAM 1200` 价格是两个成员，因为它们是两次分配。用由字段组成的字符串 —— `` `${name}:${cents}` `` —— 作为集合的键，它们就是一个。
'''
hints = [
  "Object.freeze(this) 作为 Price 构造函数的最后一行。参数属性在函数体运行之前就已赋值，所以它们已经在那里，可以冻结了。",
  "在 Tally 的构造函数里 Object.seal(this)。类字段在构造函数体之前初始化，所以那时 count 已经存在，并保持可写。",
  "TOTAL 是原始 cents 的和，这只有在那些写入都失败时才成立。在起始代码里，到那时每个价格都是 0，TOTAL 是 0 —— readonly 字段被写了，而没有任何东西吭一声。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.advanced.30.error-classes"
title = "你自己的错误"
story = "广告预订系统的四层各抛各的东西，预订屏幕接住了其中一种，却被其他几种搞垮了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每行本应是以小时计的预订时长。

定义一个错误层级：`PriceError extends Error` 作为基类，`NotANumber` 和 `Negative` 继承它。`Negative` 带着小时数，它的消息是 `negative hours: <h>`；`NotANumber` 的消息是 `not a number`。`price(text)` 用 `BigInt(text)` 转换文本 —— 它在任何不是整数的东西上抛出 `SyntaxError` —— 然后抛出 `NotANumber`，**把那个 `SyntaxError` 作为它的 `cause`**；它拒绝负的时长，否则返回 `500 + 100 * hours`。

输出每个价格或错误的消息，然后输出 `ERRORS <k>`。收窄到**基类**，只收窄一次。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative hours: -2
        ERRORS 2
```

起始代码用 `err instanceof Negative` 收窄，把其他一切重新抛出，于是 `xx` 那一行用一个未捕获的 `NotANumber` 把程序搞垮了。`err instanceof PriceError` 对层级里的每个成员都为真，而 `err.message` 就是那条消息 —— 它存在于类里，传给 `super(...)`，而不是在处理代码里。

`new NotANumber({ cause })` —— `ErrorOptions` 在 `es2022` 库里 —— 记录下底下的那个 `SyntaxError`。这里没有东西打印它；一个未捕获的错误会打印，作为栈追踪下面的一个 `[cause]:` 块。这条链就是要传它的原因。

`class X extends Error` 和 `instanceof X` 能工作，是因为目标是 `es2022`。编译到 ES5 时，`Error` 的子类会丢掉它的原型，`instanceof` 悄悄地返回 `false` —— 这就是为什么老代码库里到处是 `Object.setPrototypeOf(this, new.target.prototype)`。
'''
hints = [
  "err instanceof PriceError —— 基类覆盖了两个子类，这正是要有一个基类的意义。",
  "在 instanceof 检查之后，err 是一个 PriceError，err.message 能通过类型检查。在它之前，err 是 unknown，什么都通不过。",
  "TypeScript 的 catch 没有类型过滤，所以你的 instanceof 检查的顺序就是 Python 的 except 子句的顺序：排在基类之后检查的子类是死代码，而没有任何东西会警告你。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "typescript.advanced.31.iterator"
title = "下一个，直到停下"
story = "利园排队处的取号机从一个起点按固定步长发号，不保留号码列表，而排队屏幕上显示的永远比机器发出的少一张。"
brief = '''
标准输入是三个整数：`start`、`step`、`count`。

写一个类 `Tickets`，**手工实现迭代器协议**：`[Symbol.iterator]()` 返回 `this`，`next()` 对 `count` 个值中的每一个返回 `{ done: false, value }`，然后返回 `{ done: true, value: undefined }`。每个值单独一行输出，然后输出 `SUM <total>`，它通过遍历第二个 `Tickets` 算出。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

这就是生成器替你写的东西。`for...of` 对那个东西调用一次 `[Symbol.iterator]()`，然后对结果调用 `next()`，直到某个结果说 `done: true` —— 而一个说 `done: true` 的结果不会再被看一眼，**连同它的值**。展开、`Array.from` 和解构也一样。

起始代码的 `next` 在用掉号码之后才决定 `done`，所以最后一张真实的号码是标着 `done: true` 发出去的，而 `for...of` 把它丢了。它能通过类型检查：`{ done: boolean, value: number }` 无论如何都符合 `IteratorResult<number>`。约定说的是结果长什么样，而不是你什么时候可以说你结束了。

`[Symbol.iterator]()` 返回 `this` 是**迭代器**的标志：它只能被遍历一次，然后就耗尽了。**容器**每次都返回一个新的迭代器，可以被反复遍历；这条路上的 `Bag` 就是一个。说清楚你写的是哪一种；差别会在别人第二次循环时显现出来。
'''
hints = [
  "先检查 `left === 0`，返回 { done: true, value: undefined }。然后才取号码，返回 { done: false, value }。",
  "for...of 会忽略 done 结果的值。起始代码的最后一张号码在说 done 的那个结果里，这就是屏幕和总和都少了最后一张的原因。",
  "在前进之前先保存你要返回的值，否则你会朝另一个方向差一步。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "typescript.advanced.32.containers"
title = "对的容器"
story = "广告屏办公室把当晚的播放日志存在一个长长的数组里，关于它的每个问题都从头读起来回答。"
brief = '''
三行标准输入：一行单词，一行已经**升序排好**的整数，以及一个整数 `x`。

输出四行：

1. `TOP <word> <count>` —— 出现最多的单词，平局按单词升序
2. `BISECT <l> <r>` —— 在排好序的整数里，第一个值不小于 `x` 的下标，
   以及第一个值大于 `x` 的下标
3. `SMALLEST3` 后面跟三个最小的整数，从起始代码的 `MinHeap` 里弹出 ——
   不足三个就少一些
4. `GROUPS` 后面跟单词的每个首字母对应的 `<letter>:<k>`，字母升序 ——
   一个以首字母为键的 `Map<string, string[]>`

```
input:  tram bus tram bus ferry
        1 3 3 5 8
        3
output: TOP bus 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS b:2 f:1 t:2
```

标准库在这个架子上只有 `Map` 和 `Set` —— 没有计数器，没有堆，没有 bisect。堆已经替你写好了。其余的归你。

起始代码保留它见到的第一个最高计数的单词，在这里是 `tram`，而题目说的是 `bus`。用一个说出你本意的键来打破平局。

两次二分各是一个二分查找：维护 `lo` 和 `hi`，看中间，移动一端 —— `Math.floor((lo + hi) / 2)` 或 `(lo + hi) >>> 1`。它们的差就是 `x` 有多少个副本，而且 `x` 不存在时它们都不会失败，`indexOf` 却会返回一个看起来像下标的 `-1`。当你要一遍又一遍地取最小的几个时，堆就是对的容器：把它们全部排序只为从前面读三个值，正是它存在所要避免的事。

分组：`groups.get(letter)` 是 `string[] | undefined`。未命中时创建列表，set 进去，然后 push。
'''
hints = [
  "把 [word, count] 条目按 count 降序、再按 word 升序排序，取第一个。在这个规模下为了一个条目给整个 map 排序没问题；用同一规则比较的单次遍历也是同一个答案。",
  "一个带标志的 bisect：当 sorted[mid] < x 时把 lo 移过 mid —— 对右侧二分，当 sorted[mid] === x 时也这样。x 不存在时 indexOf 返回 -1，而有一个隐藏用例恰好就是这样。",
  "Map 和对象一样保持插入顺序，所以打印前要给字母排序。[...groups.keys()].sort() 就是题目要求的顺序。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.advanced.33.cancellation"
title = "别再等了"
story = "控制室在重画全岛地图之前要 ping 每块屏幕的状态，而天后那块网卡坏了的屏幕永远不回答，于是地图永远不重画。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<SCREEN> <DOWN>`，其中 `DOWN` 为 `0` 表示屏幕会立刻回答，为 `1` 表示它的网卡坏了，根本不会回答。

对每块屏幕，在 `withTimeout` 下以 **200 ms** 的期限运行它的 `ping(screen, down, token)`，并按输入顺序输出 `<SCREEN> OK` 或 `<SCREEN> TIMEOUT`。然后启动一个 `watch(token)` 任务，它以 10 ms 的 sleep 无限循环；取消它的 token，**await 它**，让它在 `catch` 里打印 `CANCELLED`，在 `finally` 里打印 `CLEANUP`。最后输出 `TIMEOUTS <k>`。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

Promise 不能被取消。没有 `.cancel()`，而用 `Promise.race` 和一个定时器赛跑只决定你*听谁的* —— 输家继续跑，它还挂着的任何东西，一个定时器或一个订阅，在你的最后一行之后仍然抓着不放。所以取消是你**传进去**的东西：一个工作会去检查或订阅的 token。起始代码有一个，`Token`，带 `cancel()` 和 `onCancel(handler)`；`sleep` 会订阅它，取消时清掉自己的定时器并以 `Cancelled` reject，而 `silence` —— 那块死掉的屏幕 —— 是一个除了取消之外什么都不会让它落定的 promise。（`AbortController` 是平台版本的同一样东西。这里没有声明它。）

`withTimeout(work, ms)` 创建一个 token，让 `work(token)` 和一个以 `Timeout` reject **并且**取消 token 的定时器赛跑，工作赢了时在 `finally` 里清掉自己的定时器。起始代码从不调用它：它直接 await `ping`，而 `WONG` 永远不回答。你已经见过 Node 对此怎么做：再没有任何能唤醒谁的东西，于是进程在 `LAM OK` 之后退出，状态码 `0`。

它还取消了 `watch` 却不 await 它，所以 `TIMEOUTS` 在 watcher 轮到之前就打印了 —— 而 watcher 重新抛出的 `Cancelled` 没有落到任何人手里，Node 把它报告为未处理的 rejection，以状态码 `1` 退出。在 `watch` 里处理完 `Cancelled` 之后要重新抛出它：吞掉它，任务就变得无法取消了。在你 await 这个任务的地方捕获它。
'''
hints = [
  "withTimeout：一个 deadline promise，它的 setTimeout 以 Timeout reject 并取消 token；在 try 里 `return await Promise.race([work(token), deadline])`，在 finally 里 clearTimeout。",
  "`await watcher` 让任务在 TIMEOUTS 打印之前运行它的 catch 和 finally；它会把 Cancelled 重新抛给你，所以也要捕获它 —— 并且只捕获它。",
  "在 finally 里清掉 deadline 的定时器。不清的话，每块已经回答了的屏幕仍然会留下一个 200 ms 的定时器，进程要等最后一个到期才退出：输出正确，每次都更慢。取消 token 是反方向上的同一份礼貌。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "typescript.advanced.34.event-loop"
title = "事件循环"
story = "广告屏控制室，全岛每块屏幕共用一个线程。一个回调从不让出，从天后到希慎的每块牌子都定格在同一帧上。"
brief = '''
标准输入是两个整数 `k` 和 `n`。

把 `1..n` 分成 `k` 个连续的块 —— 第 `i` 块是从 `floor(n*i/k) + 1` 到 `floor(n*(i+1)/k)`（含两端）—— 用一个普通循环把每块的平方和算成 `bigint`。在任何工作开始之前，`main` 用 `setImmediate` 安排一次牌子重画，它打印 `BOARD <finished>`：牌子拿到线程时已经完成了多少块。牌子必须**在第一块之后、第二块之前**拿到线程。按下标顺序为每块输出 `CHUNK <i> <sum>`，然后输出 `TOTAL <sum>`，然后输出 `CHUNKS <k>`。

```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node 在**一个线程**上运行你的 JavaScript，楼里的每块屏幕都在等它。一个正在运行的回调不能被打断 —— 定时器不行，I/O 不行，牌子也不行 —— 直到它返回或 `await`。起始代码把每一块包进一个 `async` 函数，全部交给 `Promise.all`，看起来是并发的。其实它是一个长长的回调：一个里面没有 `await` 的 `async` 函数，一被调用就从头跑到尾。在 `main` 放手之前，全部 `k` 块都已求和，牌子最后才重画，显示 `BOARD 3`，而在 `4 2000000` 上，全岛每块屏幕在整个求和期间都显示同一帧。你在这里写的任何东西都没法让求和并行运行；Node 对此的答案是 worker 线程，而这个 `node.d.ts` 没有声明它。Async 是用来**等待**的。一个线程上的 CPU 工作只能做得**有礼貌**。

那就有礼貌些：做一块，然后把线程还回去，然后下一块。而且要还给对的队列。`await null` 或 `await Promise.resolve()` 让给的是 **microtask** 队列，Node 会在运行任何 immediate 或定时器之前把它清空 —— 牌子仍然会看到 `BOARD 3`。`await new Promise((r) => setImmediate(r))` 排到队尾，在先入队的牌子后面。

还有那个小 bug，它和时机息息相关。起始代码用 `total += await work(...)` 来累加。JavaScript 在 `await` **之前**就求出 `+=` 的左边：每个任务都把 `total` 读成 `0`，停下，回来写 `0 + 我的`。最后一个赢，`TOTAL` 就是最后一块。这就是计费计数器上的丢失更新，只是读和写之间没有一行代码让你看见 —— 对共享状态的一次读和一次写，中间隔着一个 `await`，就是一个线程上的竞态。在 await 之后再读总数，或者拿着锁。
'''
hints = [
  "运行起始代码，读最后一行：BOARD 3，在一切之后打印。牌子最先被安排，却仍然最后运行，因为从来没有东西把线程还回去。",
  "每一轮一块：对各块写一个普通 for 循环，每块之后 `await new Promise((r) => setImmediate(r))`。牌子的 immediate 先入队，所以它在第 0 块之后运行。",
  "`total += await x` 在 await 之前读 total。`const part = await x; total += part;` 在之后读 —— 或者，循环体里根本没有 await，就没有什么可竞争的。",
  "n*(n+1)*(2n+1)/6 是总数的闭式。用它核对一次 TOTAL，你就知道块的边界是对的。",
]
