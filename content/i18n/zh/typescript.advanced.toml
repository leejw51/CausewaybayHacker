# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.advanced.26.toolbox"
title = "不在架子上的工具箱"
story = "控制室的手册说要用迭代器辅助方法来数相同帧的连续段。三十楼的编译器从来没听说过它们，夜班操作员只好用手数。"
brief = '''
标准输入是一行整数。

输出三行，每一行都由你自己写的一个生成器构建：

1. `SUMS` 后面跟累计和 —— `accumulate(values)`
2. `RUNS` 后面跟每一段**相邻**相等值，写成 `<v>x<k>` ——
   `runs(values)`
3. `PAIRS <k>`：有多少个由**不同**值组成的无序对 ——
   在排好序的不同值上用 `pairs(items)`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Python 的架子上有 `itertools`。JavaScript 有迭代器辅助方法 —— `Iterator.prototype.map`、`.filter`、`.take` —— Node 从 22 版起就有，但它们**不在**这个架子上：`es2023` 库没有声明它们，所以不管底下的 `node` 多新，`tsc` 都说 `TS2339: Property 'map' does not exist`。你能用的是库里声明的东西，以及你 import 进来的东西。这个文件用 ES `import` 从 `"fs"` 导入 `readFileSync` —— 这让文件成为一个**模块**，而 `tsc` 把它编译成 `require`，因为目标是 CommonJS。其余的一切，你自己写。

`runs` 只把**相邻**的相等项归为一组。它不是计数，而样例特意选成让两者结果不同：`1` 出现了四次，分在两段里。起始代码第二行用一个 `Map` 来计数，恰好在这个输入上出错。
'''
hints = [
  "accumulate 维护一个总数，每个值之后 yield 它；它 yield 的最后一个就是总和。",
  "runs 记着正在进行的那一段。下一个值不同时，yield 已完成的那一段，然后开始新的一段 —— 循环结束后，yield 最后一段，没有别的地方会替你做。",
  "pairs 是两层嵌套循环，j 从 i + 1 开始。数量是 n*(n-1)/2，手算核对一下，你就知道 n 取对了。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.advanced.27.memo"
title = "记住你算出来的东西"
story = "时代广场大屏的排程器在午夜之前要从同样两个数算出同一个轮播一万一千次，每次都从头算起。"
brief = '''
标准输入是 `n k bits`：两个整数和一串二进制数字。

输出四行：

1. `FIB <fib(n)>` —— 来自一个**递归**的 `fib`，包在你自己写的记忆化
   `memo(...)` 里
2. `PRODUCT <k!>` —— 在 `1..k` 上用乘法做 `reduce`，带一个初始值，
   这样 `k = 0` 得到 `1`
3. `BIN <value>` —— 由 `fromBinary` 把 `bits` 按二进制读出，它是一个
   单参数函数，基数在内部固定
4. `MISSES <m>` —— 记忆化实际运行函数体的次数

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` 最大是 `400`。起始代码的包装器只数调用次数，什么都不记，所以 `fib(10)` 是 177 次调用，`fib(35)` 是三千万次，而 `fib(90)` 跑不完。有了缓存，每个 `fib(i)` 只运行一次，`MISSES` 是 `n + 1`。

这些数装不进 `number`。`fib(90)` 是 `2880067194370816120`，超过了 `Number.MAX_SAFE_INTEGER`，而 `number` 会一声不吭地把它打印错。用 **`bigint`**：`0n`、`1n`、`BigInt(i)`。模板字符串把 bigint 打印成它的数字；单独 `console.log(5n)` 打印的是 `5n`。

不带基数的 `parseInt(bits)` 把 `1010` 读成一千零一十。起始代码就是这么干的。在一个闭包里把基数固定下来 —— `(text: string) => parseInt(text, 2)` —— 这就是 Python 的 `functools.partial`：一个部分参数已经定好了的函数。`bind` 做的是同样的事，但只能固定**前面的**参数，而基数是第二个。
'''
hints = [
  "memo 在它的闭包里保存一个从参数到结果的 Map；命中就从 Map 返回，未命中就运行函数体、存下结果并计数。",
  "fib 在递归里必须调用记忆化之后的 fib，否则只有最外层的调用被缓存。先声明 fib 及其类型，箭头函数才能引用它。",
  "reduce((a, b) => a * b, 1n) —— 第二个参数是起始值，正是它让空区间得到 1n。它也必须是 bigint：1 * 1n 是 TS2365，而不是悄悄转换。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.advanced.28.type-guard"
title = "它只需要能画出来"
story = "利园的导览屏列出商店和服务柜台，它们从两个不同系统顺着同一条数据流过来，而屏幕只想知道每一个都能把自己画出来。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每行是以下之一

