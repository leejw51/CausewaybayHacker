        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

把这一行建模成一个**可辨识联合**：每种情况一个对象类型，都共享一个字面量 `kind` 字段，另有一个
保留原始文本的 `UNKNOWN` 情况。`parse` 是唯一去看从线上来的字符串的地方；在它之后，类型说明了
一个 `Order` 可以是哪四种东西，而对 `order.kind` 的 `switch` 会在每个 `case` 里收窄 `order`。

