`report` 接收一个 `Container<string>`，而 `Bag` 哪里都没写 `implements Container`。它不需要。
TypeScript 的类型是**结构化**的：一个值符合某个接口，靠的是拥有那些成员，而不是报出它的名字。
这就是鸭子类型，只不过由 `tsc` 在程序运行之前检查，而不是由解释器在跑到那里时检查。
`Set<string>` 也符合 `Container<string>`，同样没有人写下这一点。

