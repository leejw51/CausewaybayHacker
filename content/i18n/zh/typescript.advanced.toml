起始代码的 `parse` 把每一行变成数据流会发来的东西：商店是一个 `Shop` 实例，柜台是一个带 `render` 方法的**普通对象**。它把它们作为 `unknown[]` 交出来，因为这是任何从线上传来的东西的诚实类型。通过 `show` 输出每一个是 `Sign` 的项，然后输出 `SIGNS <k>` 和 `SHOPS <k>` —— 后者用 `instanceof Shop` 来数。

```
input:  3
        SHOP LAM 4
        COUNTER 2
        SHOP WONG 1
output: LAM / L4
        COUNTER 2
        WONG / L1
        SIGNS 3
        SHOPS 2
```

`Sign` 是一个接口，而接口会被**擦除**。运行时没有 `Sign` 可问 —— `x instanceof Sign` 编译不过，因为右边没有任何东西可以让它指代。要从 `unknown` 走到 `Sign`，你得写一个**类型守卫**，`function isSign(x: unknown): x is Sign`，而编译器相信它返回的任何东西。它自己什么都不检查。

起始代码的守卫返回 `x instanceof Shop`。它能编译，是个完全正常的布尔值，但它是错的：柜台按形状是一个 `Sign`，却不是任何东西的实例。守卫撒了谎，编译器信了它的话，柜台就从导览里消失了。改为检查形状 —— `typeof x === "object"`、`x !== null`、`"render" in x`，以及 `typeof x.render === "function"` —— 这恰好就是接口承诺的东西，不多也不少。

`show(sign)` 在运行时分派：`sign.render()` 找到这个对象拥有的那个 `render`，不管是在原型上还是在它自己身上。
'''
hints = [
