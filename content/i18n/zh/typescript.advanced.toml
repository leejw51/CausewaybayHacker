# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.advanced.01.conversions"
title = "一个名字，一种形态"
story = "19:00，三十楼的控制室。数据源把时代广场时段的价钱当文本发来，计费屏要的是数字，大屏幕要的是元。"
brief = '''
读取一行：一个以分为单位的金额，全是数字。

输出三行：

1. 去掉首尾空白后的文本有多少个字符
2. 这个金额作为数字
3. 这个金额换算成元，精确到两位小数

```
input:  1234
output: 4
        1234
        12.34
```

金额非负。在 Python 里你会把一个名字重新绑定三次。TypeScript 不让你这么做：一个名字保留它
诞生时的类型，所以

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

在任何一行运行之前就失败了。这是契约在尽它的职责。给每种形态一个自己的 `const` —— 文本、
数字、元 —— 这样读代码的人永远不必往上翻，去弄清一个名字此刻装的是什么。

算元的时候不要经过浮点数。`(1234 / 100).toFixed(2)` 今天碰巧能用，而 `0.1 + 0.2`
每天都是 `0.30000000000000004`。`Math.trunc(cents / 100)` 和 `cents % 100` 精确地给出
两个部分，`String(cents % 100).padStart(2, "0")` 给第二部分补零。
'''
hints = [
  "趁你手里还是字符串的时候取 text.length，就是第一行。",
  "const cents: number = Number(text) 是一个新名字、一个新类型。拿 `text` 来装它是 TS2322，这是编译器在告诉你旧的契约仍然有效。",
  "padStart(2, \"0\") 在左边补到宽度二：5 分是 0.05，不是 0.5。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.advanced.02.control-flow"
title = "哪个时段"
story = "时代广场的大屏幕按轮换播放：每第三个时段放广告，每第五个放新闻。排程器每次都只打印时段编号，于是屏幕上出现一个四十英尺高的数字。"
brief = '''
读取一个整数 `n`。对从 `1` 到 `n` 的每个 `i`，输出一行：

* 如果 `i` 能同时被 3 和 5 整除，输出 `ADNEWS`
* 如果 `i` 能被 3 整除，输出 `AD`
* 如果 `i` 能被 5 整除，输出 `NEWS`
* 否则输出 `i` 本身

然后继续读取整数，每行一个，直到读到 `0` 为止，再输出 `SKIPPED <k>`，即途中读到的
非零行数。

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

两个循环，两种类型。第一个在开始之前就知道要跑多少次：`for (let i = 1; i <= n; i++)`。
第二个不知道：`for (;;)` 或者 `while (true)` 加一个 `break`，因为次数由你读到的东西决定。
`i < n` 会少跑一次，这是每个人在这里都会写一次的差一错误。

标准输入是一整块送来的。`input.split("\n")` 给你各行，而一个沿着它们往下走的下标，就是
你在任何其他语言里都会有的那个“读下一行”。
'''
hints = [
  "先检查两者都满足的情况，不然它永远不会触发。能被 3 和 5 整除就是能被 15 整除。",
  "i < n 停在 n - 1。起始代码就有这个 bug；样例输出早一行就结束了。",
  "用 === 而不是 ==。`\"0\" == 0` 是 true，`\"\" == 0` 也是 true，一个空行就是这样结束了一个不该结束的循环。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.advanced.03.arrays"
title = "牌子的中间"
story = "怡和街电车站的牌子显示今晚的头班车和末班车，调度员想知道中间所有车一共有多少座位。"
brief = '''
标准输入第一行是计数 `n`，第二行是 `n` 个整数，用空格分隔。`n` 至少为 `1`，所以总有
第一个值和最后一个值可以输出。

输出三行：第一个值、最后一个值，以及严格位于它们之间的所有值的和。少于三个值时这个和是 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)` 就是中间部分：一个**新数组**，复制出来的，负数的结束位置从后往前数。
`nums[nums.length - 1]` 是最后一个元素，`nums.at(-1)` 也是 —— 但看看它们的类型。下标说
`number`，因为编译器信任你；`at` 说 `number | undefined`，因为数组可能是空的，而编译器看不出
你的不是。两者在运行时是同一个值。只有一个对此是诚实的。

`reduce((sum, v) => sum + v, 0)` 把中间部分加起来。那个 `0` 不是装饰：在空数组上
**不带初始值**调用 `reduce` 会抛出 `TypeError: Reduce of empty array with no initial value`，
而只有一个元素的输入会让中间部分为空。
'''
hints = [
  "nums[nums.length - 1] 是最后一个元素。nums.at(-1) 也是，而且它的类型承认它可能不存在。",
  "nums.slice(1, -1) 是除了第一个和最后一个以外的全部；只有一两个值时它是 []。",
  "reduce 需要 0 作为第二个参数，否则空的中间部分会抛异常，而不是加出一个零。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.advanced.04.strings"
title = "三种长度"
story = "希慎广场的 LED 墙按 `.length` 给跑马灯分配预算。一个电车 emoji 算两个，銅鑼灣 算三个，而底下的控制器数出九个。"
brief = '''
读取一行。输出三行：

1. 它编码成 UTF-8 后的长度，以**字节**计
2. 它的长度，以**字符**（Unicode 码点）计
3. 字符顺序反转后的这一行

```
input:  causeway
output: 8
        8
        yawesuac
```

一个 JavaScript 字符串有三种长度，而 `.length` 不是题目要的两种里的任何一种。它数的是
**UTF-16 码元**：`"銅鑼灣".length` 是 `3`，看起来对，而 `"🚋".length` 是 `2`，就不对了。
字符是 `for (const ch of s)` 和 `[...s]` 走过的东西 —— 字符串迭代器按码点前进 —— 所以
`[...s].length` 是第二行。

字节是第三个数。这里没有 `TextEncoder` 也没有 `Buffer`：`node.d.ts` 两个都没声明，`tsc`
会用 `TS2304: Cannot
find name` 拦住你。改为从码点去数 —— `ch.codePointAt(0)` 小于 `0x80` 是一个字节，小于
`0x800` 是两个，小于 `0x10000` 是三个，再往上是四个。

`s.split("").reverse().join("")` 是每个人都会伸手去拿的反转写法，而它会把代理对劈成两半。
反转 `[...s]`。
'''
hints = [
  "[...line] 是一个码点数组；它的长度就是字符数。line.length 是 UTF-16 码元数，起始代码把它打印了两次。",
  "for (const ch of line) 也按码点前进，所以 ch.codePointAt(0) 是整个字符的编号，绝不会是一对里的一半。",
  "split(\"\") 按码元切分，会把 emoji 弄坏；反转展开后的数组能让每个字符保持完整。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.advanced.05.maps"
title = "墙上在说什么"
story = "希慎广场的墙给今晚数据源送上来的词排名，而上面每个计数都显示 NaN。"
brief = '''
读取整个标准输入，按空白切分。

每个不同的词输出一次，格式为 `<word> <count>`，按计数降序排列，计数相同时按词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

起始代码把计数放进一个 `Record<string, number>`，类型说每个键都装着一个 `number`。在运行时，
一个没人写过的键装的是 `undefined`，而 `undefined + 1` 是 `NaN` —— 没有异常，没有警告，
只有墙上一个错误的数字。用 `Map<string, number>`：`counts.get(word)` 的类型是
`number | undefined`，这才是实情，而 `?? 0` 就是对它的回答。

用比较函数给条目排序：计数降序是 `b[1] - a[1]`，当它是 `0` 时再落到词上比较。用 `<` 和 `>`
比较词，不要用 `localeCompare` —— `localeCompare` 会去问机器的区域设置，而一块牌子在每台
机器上都必须读起来一样。
'''
hints = [
  "起始代码打印 NaN，是因为 += 之前 counts[word] 是 undefined。Record 类型承诺了一个从来不存在的数字。",
  "counts.set(word, (counts.get(word) ?? 0) + 1) —— get 承认没找到，?? 补上那个零。",
  "b[1] - a[1] || wordOrder：比较函数返回 0 时，就把平局交给 || 的右边。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.advanced.06.sets"
title = "两块屏幕都在播的"
story = "怡和街两边有两块屏幕面对面，广告主想知道她付钱让哪些片段在同一个路口播了两遍。"
brief = '''
两行标准输入，每行是一块屏幕的片段，用空格分隔。一块屏幕可能把同一个片段列两次；那只算一次。

输出三行：

1. `BOTH`，后面跟着两个列表上都有的每个片段，排好序，用空格分隔 —— 如果一个都没有，就是
   `BOTH -`
2. `ONLY_A <k>`：有多少片段在第一个列表上而不在第二个上
3. `ALL <k>`：两个列表合起来有多少个不同的片段

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

`Set` 没有重复。在这个地图编译所用的 `es2023` 库里，它也没有 `intersection`、`difference`
或 `union` —— 这些是 ES2025 才来的，`tsc` 会用 `TS2339: Property 'intersection'
does not exist` 告诉你。决定什么存在的是你编译所用的库，不是你运行时的 Node 版本。所以自己
写出来：`[...a].filter((x) => b.has(x))` 是交集，把条件换成 `!b.has(x)` 是差集，
`new Set([...a, ...b])` 是并集。

不带比较函数的 `.sort()` 按 UTF-16 码元给字符串排序，对这些来说恰好正确，对数字来说恰好错误。
排名牌还在两道题之后。
'''
hints = [
  "new Set(tokens) 在进门时就丢掉重复的运动鞋。Set 的个数是 .size，不是 .length。",
  "[...a].filter((x) => b.has(x)) 是交集；把测试取反就是差集；把两者都展开进一个 Set 就是并集。",
  "both.length > 0 ? both.join(\" \") : \"-\" 用一个表达式就处理了空的情况。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.advanced.07.functions"
title = "按小时计"
story = "价目卡上每个屏幕时段都按小时计，除非另有说明，而卡片打印机在每个没说明的时段下面都写了 `/undefined`。"
brief = '''
标准输入是计数 `n`，然后是 `n` 行 `<NAME> <CENTS>` 或 `<NAME> <CENTS> <UNIT>`。

写一个 `tag(name, cents, unit = "hour")`，返回带两位小数的 `<NAME> $<dollars>/<unit>`，
每行打印一个标签。

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

起始代码能编译、能运行，并打印 `TSQ $12.00/undefined`。看看为什么。
`const [name, cents, unit] = line.split(" ")` 把三个都定为 `string` 类型，因为 `split` 返回
`string[]`，而编译器不知道它有多长。在只有两个词的行上，`unit` 在运行时是 `undefined`，模板
字面量就忠实地把这个词打印出来。这个类型是数组从未做过的承诺。

**默认参数**就是修复办法，而它奏效的原因值得知道：当实参是 `undefined` 时默认值就会生效 ——
缺省，或者显式传入 `undefined`，这正是这里 `tag(name, cents, unit)` 所做的。`null` 不会触发它。
函数签名就是契约，说明调用者可以省略什么，以及省略时会得到什么。
'''
hints = [
  "在参数列表里写 unit: string = \"hour\"。这就是整个修复。",
  "默认值在遇到 undefined 时生效，包括故意传入的 undefined。在函数体里写 `unit ?? \"hour\"` 是同一个想法，只是写在了使用处。",
  "模板字面量里的 `$${...}` 是一个字面的美元符号，后面跟一个插值。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.advanced.08.exceptions"
title = "那行不是数字"
story = "怡和街电车站的到站牌从数据源读一列分钟数，而中间有一行写着 `xx`。"
brief = '''
标准输入是计数 `n`，然后是 `n` 行。每一行本该是一个整数。

对每一行，要么输出翻倍后的值，要么在它不是整数时输出 `BAD <line>`。最后输出 `SUM <total>`，
其中总数是你输出过的那些值的和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")` 不会失败。它返回 `NaN`，而 `Number("1.5")` 是 `1.5`，`Number("")` 是 `0`。
这就是为什么起始代码的 `double` 要用一个模式检查文本，并**抛出** `NotANumber` —— 也是为什么
起始代码在第二行就带着这个异常死掉，因为没有任何东西捕获它。

把那个可能抛异常的调用包在 `try`/`catch` 里。在 `strict` 下，捕获到的值类型是 **`unknown`**：
JavaScript 的 `throw` 可以抛出任何东西，字符串、数字或者 `undefined`，编译器不会假装不是这样。
没有 `catch (NotANumber e)` 这种写法。你自己去收窄它 —— `if (err instanceof NotANumber)` ——
不是你的就再 `throw err` 一次，这样你自己代码里的笔误仍然会大声失败，而不是被当作一行坏数据报告。
'''
hints = [
  "起始代码带着 NotANumber: not a whole number: xx 死掉。你要捕获的就是这个类。",
  "让 try 块保持小：只把可能失败的调用放进去，打印和累加放在后面。",
  "catch (err: unknown)，然后 `if (err instanceof NotANumber)`。其他任何东西都用 `throw err` 重新抛出；一个什么都吞掉的 catch，就是程序学会默默失败的方式。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.advanced.09.array-methods"
title = "沿着数据源走一遍"
story = "Alex 说用三个 for 循环和三个计数器就能做。等第三个跑完，送往希慎广场墙的数据源早就往前走了。"
brief = '''
标准输入是一行用空格分隔的整数。

输出三行：

1. 偶数值的和（没有的话是 `0`）
2. 每个大于 `10` 的值，翻倍，按原顺序，用单个空格连接 —— 没有的话是 `-`
3. 有多少个不同的值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

TypeScript 没有推导式。它有数组方法，那是同一个想法从左往右写：`filter` 保留，`map` 变换，
`reduce` 折叠，`new Set(...)` 去重。每一个都返回一个新值，没有一个需要下标。

`reduce` 接收一个初始值，而在这里它不是可选的：样例里有偶数，但有一个隐藏用例没有，而
`[].reduce((a, b) => a + b)` 会抛出 `TypeError: Reduce of empty array with
no initial value`。`reduce((sum, v) => sum + v, 0)` 把空的东西加成 `0`。

负数：在 JavaScript 里 `-4 % 2` 是 `-0`。`-0 === 0` 是 `true`，所以偶数测试没问题 —— 但要
通过模板字面量打印数字，在那里 `` `${-0}` `` 是 `"0"`，永远不要让一个光秃秃的 `-0` 到达
`console.log`。
'''
hints = [
  "nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0) —— 先保留，再折叠，用 0 作为起始的和。",
  "先 filter，后 map：按原值过滤，再把留下的翻倍。",
  "new Set(nums).size 就是不同值的个数。Set 按值比较数字，所以两个 12 算一个。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.advanced.10.from-entries"
title = "同样的一遍，按键"
story = "利园的购物 app 收到今晚的价钱，是一串按各店输入顺序排列的键值对。促销横幅要的是一块牌子，而且要两次。"
brief = '''
标准输入是计数 `n`，然后是 `n` 行 `<ITEM> <PRICE>`。`PRICE` 是以分为单位的整数。每个商品
最多出现一次，`n` 至少为 `1` —— 总有一个最便宜的商品可以报出来。

输出三行：

1. 每个价格**严格大于 100** 的商品，格式为 `ITEM=PRICE`，按商品排序，用单个空格连接 ——
   没有的话是 `-`
2. 每个商品，价格**减半并向下取整**，格式相同，按商品排序
3. `CHEAPEST <item>` —— 价格最低的，平局按商品升序

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)` 用一个表达式从 `[key, value]` 键值对构建一个带键的对象，
`Object.entries(obj)` 再把它拆开 —— 所以 `Object.fromEntries(Object.entries(prices).filter(...))`
是一块过滤过的牌子，而把它换成 `.map(([k, v]) => [k, Math.floor(v / 2)])` 就是一块变换过的。
两者都不需要一个空对象加一个往里填的循环。

打印之前先给条目排序，即使它们看起来已经排好了。对象按插入顺序保存字符串键，**除了**看起来像
数组下标的键 —— `"7"` 在 `"10"` 之前，`"10"` 在 `"SCARF"` 之前，不管它们以什么顺序到达。
一块以商品编号为键的牌子会自己重新排序。把你要的顺序说出来。
'''
hints = [
  "Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100)) —— 拆开，保留，再装回去。",
  "Object.entries(obj).sort(byKey) 按键的顺序给出 [key, value] 对，正是 ITEM=PRICE 想要的。",
  "找最便宜的，就按价格排序，价格相同时落到名字上：a[1] - b[1] || byKey(a, b)。第一个条目胜出。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.advanced.11.sorting"
title = "排名牌"
story = "三十楼的广告办公室给今晚时代广场大屏幕的出价排名，两个出价相同的广告主按他们打电话进来的顺序出现。"
brief = '''
两行标准输入：第一行是广告主名字，第二行是他们以分为单位的出价，顺序相同。至少有一个广告主。

按最便宜的在前给广告主排名，格式为 `<rank>. <NAME> <cents>`，名次从 `1` 开始，平局按名字升序。
然后输出 `CHEAPEST <NAME>`。

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
```

`names.map((name, i) => ({ name, cents: bids[i] }))` 把两个列表配成对；带比较函数的 `sort`
给这些对排序；`map` 交给你的下标就是名次。比较函数返回负数、零或正数，而起始代码里的那个只会
返回价格差 —— 所以平局按输入顺序出来，因为 `sort` 是稳定的，而稳定不等于正确。

永远不要对数字调用不带比较函数的 `.sort()`。它会先把它们转成字符串，于是
`[900, 1200].sort()` 是 `[1200, 900]`，因为 `"1"` 排在 `"9"` 前面。
'''
hints = [
  "平局时 a.cents - b.cents 是 0，而 0 || nameOrder 会落到名字上。",
  "用 < 和 > 比较名字。localeCompare 在这里也行，但它还会去问机器的区域设置，而排名牌不该依赖这个问题。",
  "sort 原地修改数组并返回它。toSorted 是复制的版本，它在 es2023 里。",
]

