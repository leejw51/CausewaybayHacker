# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.advanced.15.higher-order"
title = "包起来"
story = "计费屏想知道今晚费率函数运行了多少次，而费率函数不想知道自己被人盯着。"
brief = '''
标准输入是计数 `n`，然后是 `n` 个以小时计的时长。

`price(hours)` 是 `500 + 100 * hours`。用 `counted` 把它包起来，让每次调用都被计数，而
`price` 并不知道。每个时长输出一个价格，然后是 `CALLS <n>`，然后是 `NAME <price.name>` ——
它必须仍然是 `price`。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

TypeScript 的 `@decorators` 是存在的，但只能用在类和类的成员上；一个独立的函数戴不了。而装饰器
*是*什么并不需要语法：一个接收函数并返回函数的函数。所以
`const price = counted(function price(hours: number) { ... })` 就是整个机制，而 `counted` 上的
泛型 —— `<A extends unknown[], R>` —— 让它能包住任何签名，并交回同一个签名。

`counted` 返回的函数是一个叫 `wrapper` 的闭包，除非你另作说明，它的 `name` 就是 `"wrapper"`：
起始代码输出的最后一行。Python 有 `functools.wraps`；在这里你用
`Object.defineProperty(wrapper, "name", { value: fn.name })` 自己复制名字 —— `name` 是只读的，
所以在严格模式下直接赋值会抛异常。

计数放在 wrapper 上：函数声明之后紧接着写 `wrapper.calls = 0`。`tsc` 看到这个赋值，会把
`calls: number` 加进函数的类型，所以 `price.calls` 在 `main` 里能通过类型检查。
'''
hints = [
  "在 return 之前写 Object.defineProperty(wrapper, \"name\", { value: fn.name })。一行。",
  "wrapper.name = fn.name 能编译，然后抛出 TypeError: Cannot assign to read only property 'name'。defineProperty 就是绕过它的办法。",
  "带 A extends unknown[] 的 (...args: A) => R，就是 wrapper 在不知道签名的情况下转发任何签名的方式，也是 price 包装后仍保留 (hours: number) => number 类型的方式。",
]

