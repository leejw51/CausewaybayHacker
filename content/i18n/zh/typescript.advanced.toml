# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.advanced.17.undefined"
title = "23:59 的牌子"
story = "23:59，控制室。费率牌向数据源要一块今晚没开的屏幕，数据源回了一个“什么都没有”，而牌子读出了这个“什么都没有”的价钱。"
brief = '''
标准输入是计数 `n`，然后是 `n` 行 `<SCREEN> <CENTS>` —— 今晚开着的屏幕 —— 然后是计数 `q`
和 `q` 个要查的屏幕名。

对每个查询输出 `<SCREEN> <cents>`，如果那块屏幕没开则输出 `<SCREEN> NONE`。然后输出
`MISSING <k>` 和 `CHEAPEST <SCREEN>` —— 费率最低的屏幕，平局按名字 —— 如果什么都没开，就是
`CHEAPEST NONE`。

```
input:  2
        TSQ 1200
        HYSAN 900
        3
        HYSAN
        YEEWO
        TSQ
output: HYSAN 900
        YEEWO NONE
        TSQ 1200
        MISSING 1
        CHEAPEST HYSAN
```

起始代码编译时没有一个警告，然后在 `YEEWO` 上崩溃：

```
TypeError: Cannot read properties of undefined (reading 'cents')
```

这一行就是这张地图的头目。它从来不指向 bug。它指向的是一个 `undefined` 终于被*使用*的地方，
而在起始代码里，这个 `undefined` 是在两个编译器被告知不必担心的地方产生的。

`lookup` 从一个 `Record<string, Screen>` 返回 `board[name]`，下标类型说的是 `Screen` ——
不是 `Screen | undefined` —— 因为 TypeScript 假定你读的下标就是存在的下标。注解说 `Screen`，
`tsc` 相信了它，而在运行时这个键不在。
而 `cheapest` 在主路径上没有 `return` —— 它算出最好的屏幕，然后从末尾掉出去 —— 所以它隐式
返回 `undefined`，这是它的类型允许的；调用者随后用 `!`，也就是非空断言，穿过它去取值 —— 一个
对编译器的、没人检查的承诺。

让两个函数都**有意地**说 `Screen | undefined` —— `Map<string, Screen>` 有 `get`，它的类型
已经承认会查不到 —— 然后在 `undefined` 落地的地方用 `=== undefined` 处理它。不要用 `!screen`：
它对对象有效，而等到哪天这块牌子变成 `Map<string, number>`，那块 `0` 分的免费屏幕就不再存在了。
'''
hints = [
  "从上往下读栈追踪：TypeError 发生在 console.log 上，但 undefined 是早一行从 lookup 里出来的，再之前是从 Record 下标里出来的。",
  "一旦 lookup 返回 Screen | undefined，在你检查之前 `screen.cents` 就不再能编译。这个错误就是编译器在做 Record 下标跳过的那份工作。",
  "cheapest 有两条路径，只有一条有返回。另一条从末尾掉出去，`Screen | undefined` 返回类型悄悄允许了这一点，而调用者的 `!` 发誓它没有。返回 `best`，并去掉调用处的 `!`。",
  "`!` 和 `as` 都是编译器无法检查的承诺。它们和其他所有类型一起在运行时被擦除，剩下的就是实际到达的那个值。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.advanced.18.promise-all"
title = "十二块屏幕，一个线程"
story = "22:00，广告屏控制室。十二块屏幕同时被问要帧数，报告却在任何一块回答之前就打印出来了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个 async 任务：它等待事件循环转一圈，算出这个值的平方，存进 `results[i]` —— 它自己的格子，所以没有两个任务写同一个地方。等**所有**任务都完成，然后**按下标顺序**输出结果，每行一个，最后输出 `TASKS <n>`。

```
input:  3
        2 3 4
output: 4
        9
        16
        TASKS 3
```

调用一个 `async` 函数会立刻启动它。它同步地一直跑到第一个 `await`，在那里交回一个 `Promise`，调用者接着往下走。只有一个线程：这些任务并不是在别处同时跑着，它们是**停着的**，等事件循环回来找它们 —— 而事件循环只有在当前正在跑的代码让出线程之后才能回来。

起始代码启动了每个任务就马上打印，于是在任何一个任务回来填格子之前就把格子打印了出来：`undefined`，`n` 次。`await Promise.all(tasks)` 就是汇合点。它让出线程，直到每个任务都已落定；只要其中任何一个抛出异常，它就立刻 reject —— 这也是要留住这些 promise、而不是把它们随手丢掉的另一个原因。
'''
hints = [
  "在打印循环之前 await Promise.all(tasks)。起始代码已经建好了 tasks 数组；只是没有任何东西在等它。",
  "先启动每个任务，再等全部任务。这里 `for (const t of tasks) await t;` 也是对的，因为在第一个 await 之前所有任务都已经启动了。",
  "results 被 square 的闭包捕获；它和 main 打印的是同一个数组，所以汇合之后那些写入是看得见的。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.advanced.19.mutex"
title = "一个计数器，八块屏幕"
story = "岛上每块屏幕都把播放次数报进三十楼那唯一的计费计数器。到了午夜，计数器说只有一次播放，而每块屏幕都发誓自己报过了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

每个值启动一个 async 任务，全部同时启动。每个任务读取共享计数器，去计费服务器走一个**来回**（起始代码里的 `roundTrip()`，事件循环转一圈），然后把计数器写回去：总数加上它的值，命中次数加一。等全部完成，然后输出 `TOTAL <sum>` 和 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

JavaScript 只有一个线程，人们会告诉你这意味着它没有竞态。它没有**数据**竞态：没有两行代码会在同一瞬间运行。其他各种竞态它都有。起始代码的任务全都读了计数器，全都停在那个来回上，然后全都回来写 `我读到的 + 我的` —— 而它们每一个读到的都是 `0`。最后写的那个赢：`TOTAL 4`、`HITS 1`，确定无疑，每次都一样。读和写之间的一个 `await` 就是一扇门，什么都能从中走过去。

保留那个来回；它就是这份工作本身。在读、来回和写的外面加一把锁。起始代码有一个签名正确、里面却没有锁的 `Mutex` 类 —— `run` 只是直接调用临界区。只用 Promise 把它做成真的：保存一个 `tail` promise；每个调用者都接在 tail 后面，用自己的一个 promise 替换它，等待旧的那个，运行，然后在 `finally` 里 resolve 自己的，这样异常就不会让锁一直被占着。
'''
hints = [
  "运行起始代码：TOTAL 是最后一个值，HITS 是 1。每个任务都在任何任务写入之前读了计数器；它们就是在那个来回上彼此错过的。",
  "锁就是一个 promise 队列。`const ahead = this.tail; this.tail = <a new promise you can resolve>; await ahead;` —— 然后运行，再 resolve 你自己的。",
  "在 `finally` 里 resolve，并在 try 里 `return await critical()`，这样释放发生在临界区结束之后，而不是在它的 promise 刚被创建的时候。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.advanced.20.channel"
title = "谁来关掉这条数据流"
story = "控制室把每个到站时间都顺着数据流推给怡和街的牌子，最后一个之后，牌子一直等着一个永远不会来的下一个，然后黑屏了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

一个生产者任务把每个值乘以十，顺着一个 `Channel` 发出去，事件循环每转一圈发一个，然后**关闭**它。主任务一直接收，直到 channel 说它已关闭，边接收边打印每个值并累加总数，然后输出 `SUM <total>` 和 `CLOSED`。

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

起始代码的 `Channel` 是完整的：`send`、`receive`，还有 `close`，它用 `undefined` 唤醒每一个正在等待的接收者。生产者从来不调用 `close`，所以最后一个值之后，接收者在 await 一个永远没人会 resolve 的 promise。

在 Go 里这是 `fatal error: all goroutines are asleep - deadlock!`。在 Python 里它会一直挂着，直到运行器把它杀掉。Node 两样都不做。当事件循环里再没有任何东西能唤醒什么 —— 没有定时器，没有 I/O，没有 immediate —— 进程就直接**退出**，状态码 `0`，就在你的 `for (;;)` 中间。`SUM` 那行和 `CLOSED` 那行永远不会运行，而从外面看，它就像成功了。这比崩溃还糟，而起始代码做的正是这个。

由生产者关闭 channel。永远不是消费者 —— 知道数据流已经结束的那一方，才是结束它的那一方。
'''
hints = [
  "一行，放在 control 的末尾：feed.close()。",
  "接收者已经在检查 `=== undefined`。它在等一个生产者从来没发的东西。`if (!value) break` 也会停下 —— 在第一个 0 上，而有一个隐藏用例正好会发 0。",
  "如果 undefined 可能是 channel 上的一个真实值，receive 就会改为返回 { done: true } | { done: false, value: T } —— 和迭代器的 next() 返回的形状一样，理由也一样。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.advanced.21.worker-pool"
title = "八台编码器"
story = "希慎广场的屏幕墙有四十段片子要渲染，机架上有八台编码器。没人想要四十台编码器；他们要的是这八台永远不闲着。"
brief = '''
标准输入是两个整数 `w` 和 `n`，然后是 `n` 个值。

运行一个有 `w` 个 worker 的池。每个 worker 循环：取下一个还没被认领的下标，`await render(index, value)` —— 它在事件循环转过几圈之后（圈数取决于下标）返回 `[index, value * value]` —— 然后把这一对 push 进 `results`，直到没有下标剩下。等每个 worker 都完成，按下标给结果排序，每行输出一个 `<index> <value>`，最后输出 `WORKERS <w>`。

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

这些对是按任务**完成**的顺序到达的，而那不是它们开始的顺序；在结果里带上下标，才让输出每次都一样，而按它排序就是答案的最后一行。

`const i = next++` 不需要锁，上一道题之后，值得知道为什么：在读取 `next` 和把它加一之间没有 `await`，所以没有别的 worker 能插进来。锁从来只在跨越 `await` 时才需要。

起始代码用 `workers.forEach(async (w) => {
await w; })` 来等待 worker。它能编译，但它什么都没等：`forEach` 调用这个 async 回调，拿回一个 promise，然后把它扔掉。每个回调都在 await；`main` 一个也没 await，于是打印出一个空结果。
'''
hints = [
  "用 await Promise.all(pool) 代替那个 forEach。forEach 从不等待它的回调返回的任何东西，不管是不是 async。",
  "结果按完成顺序到达；每一对里的下标是它从哪里来的唯一记录，而排序把它放回原位。",
  "`for (const running of pool) await running;` 也行。不行的是任何接收回调的数组方法 —— map、forEach、filter —— 被当成会替你 await 回调来用。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.advanced.22.async-await"
title = "ASYNC 到底在哪里运行"
story = "阿美写了四年 `await`，却从来没见过驱动它的那个东西。控制室只有一个循环，岛上每块屏幕都在它上面轮流。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

`async function double(value)` 让出一次 —— `await null` —— 然后返回这个值的两倍。用 `Promise.all` 运行全部 `n` 个，按输入顺序输出每个结果，然后输出 `SUM <total>` 和 `TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

起始代码的 `run` 把这些值映射过 `double`，得到一个 **promise** 数组 —— 然后告诉编译器它是一个数字数组：

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc` 接受了，因为 `as unknown as` 就是你叫它别再检查的方式。这个类型断言和其他所有类型一起被擦除，到了运行时这个数组仍然是 promise：输出是三次 `[object Promise]`，以及一个由它们和零粘在一起的字符串 `SUM`。类型断言不是转换。它改变的是编译器相信什么，而不是值本身的任何东西。

`Promise.all` 接收这些 promise，resolve 成它们的结果，**顺序就是你传入的顺序**，不管它们按什么顺序完成。

这一切到底在哪里运行？在那一个线程上，轮流运行。`await null` 把函数剩下的部分放进 **microtask** 队列，Node 会把它完全清空，才去碰定时器、immediate 或任何 I/O —— 也就是 macrotask。在一千个 await 之前安排的 `setTimeout(..., 0)`，仍然在它们全部之后才运行。这里没有任何东西是并行的；事情是轮流运行的，停在它们声明自己可以停下的地方。
'''
hints = [
  "删掉那个类型断言，看看 tsc 怎么说：Type 'Promise<number>[]' is not assignable to type 'number[]'。那条错误就是类型断言藏起来的真相。",
  "return Promise.all(nums.map((v) => double(v))) —— await 在调用处，也就是 await run(nums) 的地方。",
  "Promise.all 保持参数顺序。如果你想按完成顺序拿到结果，你就得自己带上下标，就像 worker 池那样。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.advanced.23.work-queue"
title = "谁来说它做完了"
story = "三个操作员在清屏幕更新的队列，值班主管等着队列说它空了。它永远不会这么说，因为没人告诉它哪个更新做完了。23:10，整个控制台黑了。"
brief = '''
标准输入是两个整数 `w` 和 `n`，然后是 `n` 个值。

把 `[index, value]` 对放进起始代码的 `WorkQueue`。启动 `w` 个消费者任务，它们循环：取一对，等一圈，把 `value * 10` 写进 `results[index]`，然后调用 `taskDone()`。主任务 await `queue.join()`，然后关闭队列，让消费者的 `get()` 返回 `undefined` 从而停下，再 await 它们，然后按下标顺序输出结果和 `CONSUMERS <w>`。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

当每一个曾经被 `put` 的项都有了一个对应的 `taskDone()`，`join()` 就会 resolve。起始代码的消费者从不调用它。于是 `main` 在等 `join`，消费者在 `get` 上等永远不会来的项，而事件循环上再没有任何能唤醒谁的东西。

这就是**死锁** —— 每个人都在等，没有人在动 —— 而它不需要线程，也不需要锁：两个 promise 各自等着对方先动就够了。两个任务以相反的顺序获取两个 async mutex，是同一件事，只是更讲究排场。Node 对它的回应就是上一张地图里那个：循环跑空，进程退出，状态码 `0`，什么都没打印。

修复又是一行，在消费者那一边。
'''
hints = [
  "每处理完一个项之后调用 queue.taskDone()。join 只拿 put 的次数和 taskDone 的次数对数，别的一概不管。",
  "运行起始代码，它什么都不打印，以 0 退出。不是崩溃，也不是挂起：事件循环里再也没有可能发生的事了。",
  "close() 用 undefined 唤醒每一个停在 get() 里的消费者，这结束了它们的循环；这就是 main 能在 join 之后 await 它们的原因。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.advanced.24.finally"
title = "锁照样锁回去"
story = "控制室每次更新都会解锁一个广告商的时段，更新完再锁上。22:40 收到一个坏更新的那个时段从那以后一直开着，因为上锁的代码在失败的那一行后面。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<NAME> <CENTS>`，其中 `CENTS` 本应是整数。

写一个生成器 `opened(name)`，它打印 `OPEN <NAME>`，yield 一次，然后打印 `SHUT <NAME>` —— **无论循环体有没有抛出异常**。循环体是一个 `for (const _ of opened(name))` 循环，它解析 cents 并加到总数上。cents 解析不了的那一行，要在时段关上之后报告为 `BAD <NAME>`。最后输出 `TOTAL <sum>` 和 `REJECTED <k>`。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

对生成器做 `for...of` 就是一种资源守卫，原因在这里：当循环体提前退出 —— `break`、`return` 或异常 —— `for...of` 会调用生成器的 `return()`，它让生成器**在 `yield` 处**恢复，就好像那个 `yield` 是一条 `return` 语句。`yield` 之后的代码不会运行。包在 `yield` 外面的 `finally` 里的代码会运行。起始代码没有 `finally`，于是 `WONG` 的时段永远关不上。

TypeScript 5.2 有 `using` 和 `Symbol.dispose` 专门干这个，但这里没有：`es2023` 库里没有 `Symbol.dispose`，所以 `using` 编译不过。`try`/`finally` 就是 `using` 的构成材料。

不要在生成器里面捕获错误。调用者要打印 `BAD`，而一个把错误吞掉的生成器会若无其事地打印 `TOTAL`。
'''
hints = [
  "try { yield; } finally { console.log(`SHUT ${name}`); } —— finally 是每条路径上都会运行的那部分。",
  "异常在 return() 运行完 finally 之后穿出 for...of，所以 main 的 catch 仍然看得到它 —— 这就是 BAD 在 SHUT 之后打印的原因。",
  "生成器不是唯一的办法：一个在 `body()` 外面包着 try/finally 的 `withSlot(name, body)` 函数也能做同样的事。生成器的写法能让你看到 for...of 在退出时做了什么。",
]

