# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.hacker.20.bits"
title = "落单的那一个"
story = "每张香的货单都被扫描了两次，除了一张。他们不让你用表，也不让你排序。"
brief = '''
第一行是 `n`。第二行是 `n` 个非负整数，其中除了一个之外，每个值都恰好出现两次。

输出四行：

1. 只出现一次的那个值，用**异或**和常数额外空间找出
2. 它有多少个 `1` 位
3. 如果它是 2 的幂，输出 `POW2 YES`，否则输出 `POW2 NO`（`0` 不是）
4. 清除最低的置位之后的值，没有置位则为 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` 且 `x ^ 0 == x`，而异或不在乎以什么顺序发生。这就是第一行的全部。`x & (x - 1)` 清除最低的置位，这让你免费得到第三和第四行。

Lua 5.1 没有位运算符——`^` 在这里是**乘方**，`4 ^ 4` 是 `256`。位运算住在 `bit` 库里：`bit.bxor(a, b)`、`bit.band(a,
b)`、`bit.bor`、`bit.lshift`、`bit.rshift`。它们作用在 32 位整数上，交回一个有符号的，所以大于等于 `2^31` 的值会变成负数回来；这里的值都很小。写那个数位的循环，因为他们要的就是这个循环。

这里的四个用例最多五个数，时钟在它们身上不是在测速度：一张计数表每个都能过，排序也能。更大的用例也改变不了这一点，因为这道题设下的门槛是**空间**——一个累加器，别的什么都没有——而没有哪个运行时限能把常数空间的答案和一张表区分开。那一条靠你的自觉，也靠面试官，他会问。
'''
hints = [
  "成对的值不管以什么顺序到来都会互相抵消，所以用 bit.bxor 在列表上折叠一遍就够了。",
  "每次清除最低的那一位来数位数——walk = bit.band(walk, walk - 1)——每个置位跑一次，而不是每个位宽跑一次。",
  "2 的幂恰好只有一位置位，所以清除最低的那一位就剩下零——而零本身得手动排除。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.hacker.21.matrix"
title = "把平面图转过来"
story = "灯会的平面图上下颠倒了，而桌上没有地方再放一份副本。"
brief = '''
第一行是 `n`。接下来 `n` 行是一个 `n × n` 的整数网格。

输出**顺时针旋转 90°** 后的网格，`n` 行用空格分隔的值。然后在一行上按**螺旋顺序**输出它的值——从左上角开始顺时针绕最外圈，逐圈向内。

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

旋转是要原地做的那个：先转置，再把每一行反转。把这一点说出来就是这道题的一半。Lua 的多重赋值就是交换——`grid[r][c], grid[c][r] = grid[c][r], grid[r][c]`——不需要临时变量，因为右边在存任何东西之前就已经全部求值了。这里没有 `zip(*grid)` 那样的一行写法，也没有东西替你反转一行；两者都是循环，而你应该能说出每一个为什么行得通。

螺旋要的是**原来的**网格，而表是引用：`copy =
grid` 是同一张表的两个名字，`{unpack(grid)}` 复制了外层的表，却共享每一行。一行一行地复制。
'''
hints = [
  "转置时只交换对角线上方的——c 从 r + 1 开始——否则你又把一切换了回去。多重赋值不需要临时变量就能交换。",
  "螺旋要的是原来的网格，所以在原地旋转之前一行一行地复制它：表是引用，`copy = grid` 什么也没复制。",
  "螺旋循环里的两个 `if` 保护，就是防止单独的中间一行或一列被走两遍的东西。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.hacker.22.trie"
title = "前缀盒"
story = "电车站牌的自动补全——诚实的那种，只补全清单上真有的东西。"
brief = '''
第一行是 `n q`。接下来 `n` 行是要插入的小写单词。再接下来 `q` 行是查询，每个是 `WORD <s>` 或 `PREFIX <s>`。

构建一棵 trie——一棵节点树，每个节点保存一个从字母到子节点的映射——并回答：

* `WORD <s>` → 如果插入过 `s` 则为 `YES`，否则为 `NO`
* `PREFIX <s>` → 插入的 `n` 个单词中有多少个以 `s` 开头

这 `n` 个单词并不保证互不相同，而 `PREFIX` 数的是**插入次数**，不是不同的单词：把 `tram` 插入两次，`PREFIX tram` 就是 `2`。`NODES` 数的是节点，所以第二次插入不增加任何节点。

然后输出 `NODES <k>`，即 trie 中的节点数，包括根。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

在每个节点上记一个计数，表示有多少个插入的单词经过它，这样 `PREFIX` 就是一次走到底、最后不用数的遍历。节点是一张表——`{
children = {}, through = 0, terminal = false }`——而 `children` 是一张以单字符字符串为键的表，因为 26 格的数组是 C 的答案，而表是 Lua 的答案。不存在的子节点是 `nil`，而 `nil` 既是插入时创建一个的信号，也是查找时停下的信号。单词的字母来自 `word:gmatch(".")`，一次一个。
'''
hints = [
  "缺失的子节点 children[letter] 是 nil，而 nil 既是插入时创建一个的信号，也是查找时停下的信号。",
  "`through` 在你*踏上*的那个节点上加一，所以根永远不会数到自己。",
  "掉出 trie 的查询会让 `at` 成为 nil，而 nil 的回答是 NO 和 0——但前提是你在从它身上读字段之前先检查 `at ~= nil`；`nil.terminal` 是运行时错误。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.hacker.23.prefix-sums"
title = "有多少种方法凑中目标"
story = "一整晚的进账，一小时一小时的，还有一个委员会的核数师想看到的数字。有多少段连续的钟点加起来恰好等于它。"
brief = '''
第一行是 `n k`。第二行是 `n` 个整数，可能是负数。

输出有多少段连续区间的和恰好为 `k`，然后输出 `RANGE <s>`，即整个列表的和，从最后一个前缀和读出，而不是再加一遍。

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

负数会杀死滑动窗口——太大的窗口没法靠缩小来修正。活下来的是前缀和：区间 `i..j` 的和为 `k`，恰好当 `prefix[j] - prefix[i] == k`，所以数一数之前有多少个前缀等于 `prefix[j] - k`。用 `[0] = 1` 给表做种子，以覆盖从开头开始的区间。

从没写过的计数是 `nil`，而 `nil + 1` 是错误，不是 `1`。`(seen[key] or 0) + 1` 就是 Lua 里的“不存在就是零”——那个 `or` 就是 `defaultdict`。

这里的四个用例最多五个数，时钟在它们身上不是在测速度：对每个起点和每个终点的 `O(n²)` 双重循环，四个都能过。门槛是真的——在一整晚的进账上那个双重循环要几分钟——只是这些用例检查的不是它。它们检查的是容易弄错的那部分：`[0] = 1` 这个种子，以及先查再记。
'''
hints = [
  "在记录当前前缀*之前*先查之前的前缀，否则当 k 为 0 时，长度为零的区间会把它自己数进去。",
  "一开始就写 seen = { [0] = 1 }，正是它让从下标 1 开始的区间能被找到。",
  "最后一个前缀就是总数，所以第二行不额外花任何代价。(seen[key] or 0) 就是让缺失的计数读作零的方法。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.hacker.24.inversions"
title = "被时钟抓住的那一道"
story = "晚间回合的第一题。朴素的答案是正确的，也是错误的答案。"
brief = '''
标准输入是两个整数 `n` 和 `seed`。输入里没有数组——你用**恰好**这个生成器自己构建它，用会回绕的 64 位算术：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

数出**逆序对**：满足 `i < j` 且 `a[i] > a[j]` 的对。输出这个数，然后输出 `MAX <largest value>`。

```
input:  8 1
output: 19
        MAX 908834774
```

对于 `8 1`，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。

**这道题强制要求复杂度，而且只有这一类题能做到。** 有一个隐藏用例是 `n = 200000`。`O(n²)` 的双重循环——也就是初始代码——是 `2 × 10^10` 次比较，在这台机器上跑了 **25 秒**还没结束，而运行时限是十秒。在归并排序过程中数逆序对是 `O(n log n)`，百分之几秒就完成。在这台机器上，用这两个程序实际测过。

有两件事这门语言的决定不一样。生成器跑在 LuaJIT 的 64 位整数里——`0ULL + seed`，常数末尾带着 `ULL`——因为普通的数字是 double，乘积会丢掉低位；`tonumber(bit.rshift(x, 33))` 把每次抽取带回成一个数字。还有，答案 `9990744366` 超过了 `2^32`，又远小于 `2^53`，所以 double 能精确地装下它，`print` 会显示每一位；说出*为什么*这是安全的，以及在哪里它就不再安全，是答案的一部分。
'''
hints = [
  "边生成边取最大值，或者在排序之前从原表上取——这个归并排序是原地进行的。",
  "当右半边的值在归并中胜出时，左半边剩下的每个元素都比它大——那一下就是 `mid - i + 1` 个逆序对，这就是全部的窍门。",
  "递归深度是 log2(200000)，大约十八层——离 LuaJIT 的上限远着呢。在压缩后的值上建一棵 Fenwick 树是另一个 O(n log n) 答案，在房间里值得提一句。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.hacker.25.test-cases"
title = "接下来是 T 组测试用例"
story = "每次筛选都用的格式，和每个候选人至少会写一次的 bug：第二个用例记得第一个，就像火龙的第二晚记得第一晚的香。"
brief = '''
第一行是 `T`，即独立测试用例的数量。每个用例是一行 `n`，然后是一行 `n` 个整数——当 `n` 为 `0` 时，第二行是空的。

对每个用例，输出**第二大的不同**值，如果不同的值少于两个则输出 `NONE`。全部输出之后，输出 `CASES <T>`。

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

这是标准的竞赛式筛选外壳，它让候选人失败的原因只有一个：本该每个用例一份的状态被声明在了循环之前。每个累加器、每个集合、每个 `best` 都要放在 `for` **里面**——在循环体里声明的 `local` 每一轮都是一个新变量。

按空白分隔的记号来读，而不是按行，`n = 0` 时的空行就根本不再是特殊情况——这是这种格式教的第二件事。集合是一张以值为键的表；要给它们排名，就用 `pairs` 把键复制进一个序列，再 `table.sort` 它，因为 `pairs` 没有顺序，而第二大是一个关于顺序的问题。
'''
hints = [
  "把 `local distinct = {}` 移到循环里面。这就是全部修复，也就是整道题。",
  "以值为键的表会去重；pairs 以不特定的顺序把键取出来，table.sort 给它们一个顺序，于是 ranked[#ranked - 1] 就是第二大的不同值。",
  "在只有一个元素的序列上，ranked[#ranked - 1] 就是 ranked[0]，它是 nil，打印出来是 `nil` 而不是抛出错误——这就是为什么长度检查要放在前面，也是为什么缺失的键在被跟进之前不是错误。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.hacker.26.statistics"
title = "六位小数"
story = "灯笼摊的进账，五个晚上的。他们要按规格说的方式舍入的数字，而不是你的语言碰巧打印的样子——而这门语言把 4.0 打印成 4。"
brief = '''
第一行是 `n`。第二行是 `n` 个整数。

输出三行，每行保留**六位小数**：平均值、**总体**标准差（除以 `n`，不是 `n - 1`），以及中位数——`n` 为偶数时是中间两个值的平均。

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

这道题用 `match = "float:1e-6"` 评判，所以比较是数值的：`3.8` 和 `3.800000` 都能过，差了 `1e-7` 的值也能过。这是有意的——重点不是你的格式化，而是平均值必须是平均值，以及偶数长度的中位数是一个人们在时钟下会弄错的边界。

Lua 只有一种数字类型。`19 / 5` 是 `3.8`，`print` 显示为 `3.8`；`20 / 5` 是 `4`，`print` 显示为 `4`，而不是 `4.0`——所以六位小数来自 `string.format("%.6f", v)`，而对 `3.8` 用 `%d` 是错误，不是舍入。总体，不是样本：这里没有 `statistics` 模块可以拿来用，所以循环归你写——偏差平方的平均值，然后 `math.sqrt`。把题目读两遍；在真实的筛选里，`n` 和 `n - 1` 之间的差别就是整个提交。
'''
hints = [
  "`/` 永远是真正的除法：sum / n 本身就是平均值，是初始代码的 math.floor 把小数部分扔掉了。",
  "总体标准差是与平均值之差的平方的平均值的平方根——除以 n。除以 n - 1 是样本标准差，在这里是错的。",
  "对偶数个数，中位数是 1 基表里 values[n / 2] 和 values[n / 2 + 1] 的平均，而这对下标就是差一错误藏身的地方。n 为偶数时 n / 2 是整数，所以它是合法的键。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.hacker.27.commands"
title = "输入本身就是问题"
story = "香档的收银记录从机器上出来时按八十列折了行，而顶上的那个数是命令的数量，不是单词的数量。"
brief = '''
第一行是 `k`，即后面跟着的**命令**数量。命令是用空白分隔的记号，按碰巧折行的方式挤在剩下的各行里——每行任意多个，任意多的空白，末尾可能还有一个空行。

| 命令 | 记号 | 效果 |
| --- | --- | --- |
| `ADD <cents>` | 两个 | 压入一件物品 |
| `VOID` | 一个 | 移除最后一件物品，没有则什么也不做 |
| `TOTAL` | 一个 | 输出当前的和 |
| `CLEAR` | 一个 | 移除一切 |

`k` 条命令之后，输出 `COMMANDS <k>` 和 `ITEMS <how many are left>`。

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` 数的是命令，而 `ADD` 是由两个记号组成的一条命令——所以一个跑 `k` 次、每轮读一个记号的循环会停在错误的地方。读 `k` 条命令，只在命令带参数时才取出参数——而“我要时再取下一个记号”的工具，就是 `gmatch` 交回的那个**迭代器**：`local next_token = input:gmatch("%S+")`，每次 `next_token()` 就是又一个记号，输入用完后就是 `nil`，所以输入的结束是一个值，而不是一个错误。

对空收银机做 `VOID`，以及在加任何东西之前做 `TOTAL`，都必须能行。题目里没有一行说它们不会发生，而在真实的筛选里，那份沉默就是规格。对空表做 `items[#items] = nil` 写的是 `items[0] = nil`，它什么也不做——在别的语言会抛出错误的地方 Lua 是宽容的——而知道这一点并把它说出来，就是被问到时的答案。
'''
hints = [
  "gmatch(\"%S+\") 在每一段空格、tab 和换行上切分，所以一旦你不再按行读，文件里的折行就不再重要。",
  "在 ADD 分支里面、从同一个迭代器取出 ADD 的参数。循环计数器数的是命令，不是记号。",
  "`if #items > 0 then items[#items] = nil end` 就是带保护的弹出——在 Lua 里这个保护是免费的，而照样写上它，说明你看到了这种情况。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到目前为止走通的每张地图数的都是跳数。电车不在乎有几个站；它在乎的是要花多久——而今晚大坑的每条巷子都要花更久。"
brief = '''
标准输入是 `n m seed`：`n` 个站，`m` 条无向带权边。用**恰好**这个生成器自己构建图，用会回绕的 64 位算术（`0ULL + seed`，和第 16 关一样）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

输出从站 `0` 到每个可达站的最短距离之和（包括 `0` 本身，它是 `0`），然后输出 `MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里强制要求复杂度。** 有一个隐藏用例是 `n = 100000`，`m = 200000`。无论如何 Dijkstra 都是对的算法；时钟决定的是优先队列。初始代码把未访问的站放在一个集合里——一张以站为键的表——并用 `pairs` 遍历这个集合来找最近的那个，每一步 `O(V)`，总共 `O(V²)`：在这台机器上是 **32 秒**，而运行限制是十秒。二叉堆让它成为 `O((V + E) log V)`，大约六分之一秒就完成。两者都是在这台机器上，用这道题附带的两个程序测的。

值得看清楚，因为这是限时筛选里最常见的失败方式：**初始代码并没有错。** 它输出完全正确的答案。它被拒绝，只是因为来得太晚了。

这里没有 `heapq`：堆就是你在第 12 关拿到的那个，装着 `{ distance, stop }` 条目、按距离比较，而这一次由你来写。它没有 decrease-key，你也不需要：把改进后的距离作为一个新条目推入，弹出时跳过距离已经比你记下的更差的条目。这个“过期条目”的跳过是人们会忘掉的那一行，没有它，堆会无限制地增长。`math.huge` 就是诚实的 `unreached`：它比任何数字都大，在松弛时不需要 `nil` 检查。
'''
hints = [
  "在一个以第一个字段为键的最小堆里放 { distance, stop } 条目：就是第 12 关的堆，把 `less` 简化成比较 [1]。",
  "跳过距离大于 dist[u] 的条目，就是过期条目的跳过。没有它算法仍然正确，只是堆里会塞满作废的条目。",
