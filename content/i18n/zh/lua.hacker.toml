[[quest]]
id    = "lua.hacker.14.word-search"
title = "单词在格子里吗"
story = "一块字母板，和一个从灯谜上来的名字。他们想知道这个名字是不是写在里面，还想要死胡同的个数。"
brief = '''
第一行是 `r c`。接下来 `r` 行是一个小写字母网格。最后一行是单词。

如果你能通过在**相邻**格子之间上下左右移动拼出这个单词，并且一次尝试中同一个格子不用两次，这个单词就在网格里。

输出 `FOUND` 或 `ABSENT`，然后输出 `STARTS <k>`：有多少个格子是这个单词的首字母。

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

进去的路上把格子标记为已用，**出来的路上取消标记**。失败的分支之后仍然被标记着的格子，会让后面的分支因为一个网格里并不存在的原因而失败。Lua 的字符串不能原地标记——它是不可变的，`s:sub` 永远只会造出新的——所以每一行先变成一张由单字符字符串组成的表，而标记就是往那张表里写。

`or` 在 Lua 里的短路和在别处完全一样，所以用 `or` 把四个方向串起来，会在第一个能拼出单词其余部分的方向上停下。
'''
hints = [
  "用一个单词里不可能有的字符覆盖这个格子，递归，然后把原来的放回去。",
  "在搜索之前用单独的一遍数首字母，否则 '#' 标记会把计数弄乱。",
  "成功的基本情况是 `at == #letters`——在匹配了这个格子之后检查，而不是之前。",
  "用 `or` 把四个方向串起来，而不是四个 if 加一个 `found` 标志：`or` 本来就会在第一个成功的分支上停下。命中之后还继续，是在做别人要你别做的工作。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.hacker.15.topo-sort"
title = "按什么顺序构建"
story = "要把火龙弄出龙棚有十一件活——稻草、骨架、香，龙头最后——还有一张谁等谁的清单。说出一个顺序，或者说出那个意味着没有顺序的环。"
brief = '''
第一行是 `n m`：`n` 个任务，编号 `0..n-1`，以及 `m` 条边。接下来 `m` 行是 `<a> <b>`，意思是 `a` 必须在 `b` 之前构建。

在一行上输出一个构建顺序，用空格分隔。当几个任务同时就绪时，取**编号最小**的那个，这样答案是唯一的。如果不存在顺序，改为输出 `CYCLE`。然后输出 `DONE <how many you ordered>`。

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

Kahn 算法：数一数每个任务在等多少个东西，从什么都不等的那些开始，每拿走一个任务，就给它的依赖者减一。如果结束时还剩下任务，那些任务就是环。就绪集合是一个数字的最小堆——就是第 12 关那个，比较简化成 `<`——所以“编号最小”花的是 `log n`，而不是一次扫描。任务从 `0` 开始编号，而 `after[0]` 和 `waiting[0]` 在 Lua 的表里是普通的条目；只有 `ipairs` 和 `#` 假装表从 `1` 开始，所以用数值 `for` 来遍历任务。
'''
hints = [
  "waiting[b] 是 b 的入度——有多少条边指向它。",
  "普通队列给出*一个*顺序；最小堆给出题目要的*那个*顺序。",
  "你从来不直接检测环。你注意到出来的任务少于 n 个，剩下的那些就在环里。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.hacker.16.union-find"
title = "谁和谁连着"
story = "电车、港铁和小巴线画在同一张纸上，还有今晚火龙封掉的每一条巷子。到底有几个彼此分开的网络。"
brief = '''
标准输入是 `n m seed`：`n` 个站，编号 `0..n-1`，`m` 条无向连接。输入里没有连接——你用**恰好**这个生成器自己构建它们，用会回绕的 64 位算术：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

输出三行：有几个彼此分开的网络，最大的那个有多大，以及 `REDUNDANT <k>`——有多少条连接连的是本来就已经连通的两个站。从一个站连到它自己的连接也算其中之一。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

对于 `8 5 1`，五条连接是 `6—1`、`4—6`、`2—3`、`2—6`、`1—2`。最后一条连接的两个站已经在同一个网络里，所以它就是多余的那条，剩下的是 `{1,2,3,4,6}`，外加各自独立的站 `0`、`5` 和 `7`。

Lua 的数字是 double，而 double 只装得下 53 位：在它里面把两个这样的常数相乘，低位在 `+` 发生之前就已经没了。LuaJIT 有题目所用的那种类型。`0ULL + seed` 是一个无符号 64 位整数，它上面的 `*` 和 `+` 在 `2^64` 处回绕——不用掩码，类型*就是*掩码——`bit.rshift(x, 33)` 取出它，而 `tonumber(...)` 把 31 位的结果带回成一个 `%` 乐于处理的普通数字。这条路上每个大用例都用同一个四行的生成器。

**这里强制要求复杂度。** 有一个隐藏用例是 `n = 200000`，带 `m = 200000` 条连接。那个不是并查集的显而易见的答案——从 `a` 出发把网络走一遍，看 `b` 是否已经在里面，每条连接一次——是正确的，而它每条连接 `O(n)`，总共 `O(n·m)`：在这台机器上，它跑了 **25 秒**还没结束，而运行限制是十秒。初始代码就是它。带路径压缩和按大小合并的并查集，处理同样的 200000 条连接只要 **0.01 秒**，是在这里用这道题附带的解答实测的。

值得看清楚，因为这是限时筛选里最常见的失败方式：**初始代码并没有错。** 它在样例和两个小的隐藏用例上都输出完全正确的答案。它被拒绝，只是因为来得太晚了。

并查集：每个站指向一个父节点，`find` 走到根，`union` 让一个根指向另一个。在从 `find` 往回走的路上压缩路径，整个过程每次查询实际上就是常数时间。

把 `find` 写成循环。递归的那个是教科书版本，而它在一条两万长的链上就是一个 `stack overflow`——那正是按大小合并要防止的形状，也正是恶意输入在第一次 `find` 压缩它之前所具有的形状。
'''
hints = [
  "边走边抽取两个端点——每个一步生成器，按那个顺序——而不是先建一个连接列表。这里没有什么需要用到连接两次。",
  "一开始每个站都是自己的父节点，一共 n 组；每次成功的合并让组数减一。之后只有根的大小记录才有意义，所以从根上读出最大的，而不是从每个下标上读。",
  "两端已经有同一个根的连接就是多余的那条——数上它，然后继续。自环 a == b 自然会落进这个判断里。",
  "parent[v], v = root, parent[v] 一行完成压缩：Lua 在赋任何值之前先把整个右边求完，所以旧的 parent[v] 在被覆盖之前就读出来了。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.hacker.17.lis"
title = "最长的上升"
story = "灯笼摊一年里每晚的进账。他们要最长的一段越来越好的夜晚，而这些夜晚不必是连续的。"
brief = '''
第一行是 `n`。第二行是 `n` 个整数。

输出最长**严格递增子序列**的长度——值保持原来的顺序，但不必相邻。然后输出 `TAILS <k>`，其中 `k` 就是同一个长度，从耐心排序的牌堆数读出来。

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

`O(n²)` 的表是你应该能不假思索写出来的答案。`O(n log n)` 的那个为每个长度记下该长度的子序列能结尾的最小值——一张永远有序的表，所以新值的位置是一次二分查找。Lua 里没有 `bisect`；这个搜索是六行，手写，它找的是**第一个** `>= value` 的尾部——左边那个，不是右边那个，因为严格递增意味着相等的值是替换而不是延长。两种答案在这里都能过；用例很小，也这么说了。还是写第二种，因为追问永远是“还能更快吗？”。

写 `tails[#tails + 1] = value` 是追加；对序列内部的某个 `at` 写 `tails[at] = value` 是替换。二分查找把 `at` 交给你，当它落在末尾之后一位时，同一个赋值就完成了追加。
'''
hints = [
  "tails 不是一个子序列。它的长度是答案；它的内容只是最好的结尾值。",
  "严格递增意味着你替换第一个 >= value 的尾部，这正是用 `tails[mid] < value` 的搜索找到的。去找第一个 > value 的尾部，你得到的就是非递减了。",
  "跑出 tails 的末尾——low == #tails + 1——意味着这个值延长了目前最长的那一段，这时 `tails[low] = value` 就是一次追加。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.hacker.18.edit-distance"
title = "相差多远"
story = "同一条巷子在两块不同路牌上的两种拼法。它们之间差几次单字符编辑。"
brief = '''
两行，每行一个小写单词。任何一行都可能是**空的**，那时答案就是另一行的长度。

输出**编辑距离**：把第一个变成第二个所需的最少单字符插入、删除或替换次数。然后输出 `LCS <k>`，即它们最长公共子序列的长度。

```
input:  horse
        ros
output: 3
        LCS 2
```

在同样两个字符串上的两张表，两者都是同样三行的递推，只是平局处理不同。一行一行地填；答案在最远的那个角上。对编辑表来说，第 `0` 行和第 `0` 列不是零——它们是删除或插入全部东西的代价。

第一行为空意味着 `gmatch("%S+")` 会把第二个单词当作第一个交给你。这道题要按行读，而不是按记号——`gmatch("(.-)\n")` 逐行走过，对空行交回一个空字符串。

一张 `(len(a)+1) × (len(b)+1)` 的表是一张由表组成的表，而每一行都必须是它**自己的**表：在循环里用 `{}` 构造每一行。把同一张行表赋给每个下标，那就只有一行，从各个方向被覆盖，而最远那个角上的答案是看起来说得通的胡说。
'''
hints = [
  "edit[i][0] = i，edit[0][j] = j：把一个前缀变成空，每个字符要一次删除。",
  "字符相同不花代价，沿对角线走一步；不同则花一，取三个邻居中最便宜的。a:byte(i) == b:byte(j) 比较字符而不用造出两个新字符串。",
  "LCS 是同样的走法，把 min 换成 max，并且不相同时不走对角线。还有，在循环里给每一行各自的 {}——一张共享的行表就是那个打印出一个说得通的错误数字的 bug。",
]

