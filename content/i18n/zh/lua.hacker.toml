[[quest]]
id    = "lua.hacker.33.grid-paths"
title = "穿过街区，绝不回头"
story = "大坑的街道网格，三条巷子为火龙封了。有多少种走法穿过去，哪条最便宜。"
brief = '''
标准输入是 `r c pct seed`。自己构建网格，按行优先顺序，每个格子抽取**两个**值，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，穿过通路格子。输出：

1. `PATHS <k>`——从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同的路线，模 `1000000007`
2. `MIN <cost>`——一条路线的最小总代价，两个端点都算，没有路线则为 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序走一遍就能两件事都做完：一个格子的路线数是从上方和从左方进来的路线数之和，它的最佳代价是它自己的代价加上那两者中较便宜的一个。因为你只会向右或向下走，你需要的两个格子总是已经算完了——这就是为什么它不需要递归，也不需要访问集合。带记忆化的递归在格子数上也是线性的，而在 `1000 × 1000` 的用例上它也会有两千层深——碰巧在 LuaJIT 的上限之内，但这里答案是循环，理由照旧：这个问题的形状就是一张按顺序填的表。

`PATHS` 计数取模 `1000000007`，理由照旧：在 `1000 × 1000` 的隐藏用例上，真实的数字有六百多位，double 早就把它变成 `inf` 了。边加边约简——两个剩余相加仍小于 `2^31`，所以这是这条路上唯一一个普通的 `+` 和 `%` 就够用的地方。

不可达的格子**没有**最佳代价：`nil`，而 `nil` 要在对它做任何加法或比较之前用 `~= nil` 检查。`1000 × 1000` 的一张由表组成的表是一百万个条目，LuaJIT 不在乎。

**大用例强制的是什么：**它拒绝任何枚举路线的答案。路线的数量比公园里的灯笼还多。
'''
hints = [
  "每个格子都抽取两个值，包括两个角——生成器不跳过它们，只是拒绝把它们堵上。",
  "上方和左方都没有通路邻居的通路格子，可达的路线数为零，也没有最佳代价；nil 就是诚实的 `unreachable`，而 `~= nil` 是你比较或相加之前的保护。",
  "终点可以是通路却仍然不可达，这恰好就是 PATHS 为 0、MIN 为 -1 的时候。其中一个隐藏用例就是这样。",
]

