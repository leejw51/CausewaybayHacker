[[quest]]
id    = "lua.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个跑腿以相同的分数跑完了火龙的一圈，而排行榜每次重画都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个骑手，骑手 `i` 有下标 `i` 和一个分数，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分数**降序**给骑手排序。分数相同的骑手必须保持他们到达时的顺序。输出他们的下标，用空格分隔，然后输出 `TIES <k>`——在你排好的顺序中有多少对相邻的分数相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎全是平局，答案几乎完全取决于它们怎么处理。

**这是一道关于知道你手里拿的是哪种排序的题。** `table.sort` **不是稳定的**。它是快速排序，对比较相等的元素的顺序不做任何承诺，而且它说到做到地不承诺：在样例上，用普通的 `a.score > b.score` 排序，平局出来是 `5 1 6 0 4 3 2 7`——初始代码就是这样。什么也没抛出。答案只是一个不同的答案，在这个输入上是，而在真实的输入上永远会是。

这里有一个正确答案，也是在每种语言里都应该默认去拿的那个：让比较成为**全序**。按 `(-score, index)` 排序——分数降序，然后下标升序——这样没有两个骑手会比较相等，稳定性也就不再是个问题。全序没有什么需要证明的。（Python 面试接受的另一个答案，“排序是稳定的，依赖它”，在这个房间里不可用，而知道这一点正是重点。）

时钟在这里不是在测速度，也没有什么可测的：不管你交给它哪个比较函数，`table.sort` 都是 `table.sort`。这四个用例完全取决于平局怎么处理。
'''
hints = [
  "给比较函数加上后半截：分数相等时，return a.index < b.index。这就是全部修复。",
  "永远不要写一个说 `<=` 或者两个方向都返回 true 的比较函数——`invalid order function for sorting` 是 table.sort 在告诉你这个顺序不是一个顺序。",
  "TIES 数的是排好的顺序中相邻的相等分数，不管你写的是哪个比较函数，这个计数都一样——暴露你的是下标的顺序。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.hacker.28.lru"
title = "月亮"
story = "7-32 房，最后一题，第八次。面试官关掉显示器，白板上唯一的光是窗外的月亮：每一种结构都只用一种表类型，还有那只钟。"
brief = '''
第一行是 `cap q`，然后要么是 `q` 行操作，每行是 `PUT <key> <value>` 或 `GET <key>`——要么，当第一行带着**第三个**数 `seed` 时，后面根本没有行，`q` 个操作来自下面的生成器。

实现一个固定容量的缓存，满了时淘汰**最近最少使用**的条目。`GET` 和 `PUT` 都算作使用了一个键。对缓存里已有的键做 `PUT`，会替换它的值并让它成为最近使用的——它不增加条目，所以不管缓存有多满，它都不淘汰任何东西。

对每个 `GET` 输出值，不在则输出 `-1`。最后输出存活的键，最近使用的在前，用空格分隔——缓存为空则输出 `-`——然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把样例走一遍：`GET 1` 让 `1` 重新成为最近的，所以当 `PUT 3` 需要空间时，走的是 `2`。`GET 2` 没命中。`GET 3` 命中，让 `3` 成为最近的，这就是为什么存活者输出为 `3 1`。

生成的形式，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**初始代码是错的，样例就说明了这一点。** 它把缓存放在两张表里——`cache[key]` 存值，`order` 是一个键的序列，最旧的在前——并淘汰 `order[1]`。对新键的 `PUT` 追加到 `order`。`GET` 读 `cache[key]`，别的什么也不做，因为读一张表不会移动里面的任何东西：表记得某个键上有什么，而不记得你上次什么时候看过。所以缓存淘汰的是**最先**进来的键，而不是**最近最少**使用的那个，在样例上 `GET 2` 输出 `20`。

那就是 boss。这片土地上的一切都是表，而表不记得自己被读过。“最近”是一件你必须*写下*的事——在每次命中和每次覆盖时，而不只是在插入时——而让这次写成为 `O(1)` 的结构就是教科书上的那个：一张指向双向链表的哈希表。这里没有把指针藏起来的 `OrderedDict`。在这里指针就是字段：节点是 `{ key = k, value = v, prev = p, next = n }`，`nodes[key]` 找到它，把它摘下来再挂到热的那一端是四次赋值，冷的那一端是 `head.next`。两端各一张哨兵表，意味着链表代码里任何地方都不需要 `nil` 检查。每个操作都是 `O(1)`，你可以毫不含糊地这么说。

初始代码的 `table.remove(order, 1)` 除了是错的，还是 `O(cap)`，而它的 `order` 就是破绽：序列能说出谁先来，但每次碰到就把一个键挪到末尾，是一次搜索加一次移位，而链表就是你自己动手构建“以常数时间挪到末尾”时它的样子。

（在这场面试的 Python 版本里，boss 是递归上限，而两千个操作的隐藏用例在这里仍然存在。初始代码递归地走过这些操作——在 `step` 的末尾 `return step(i + 1)`——而它能过，因为那是一个**真正的尾调用**：Lua 复用栈帧，尾调用不管有多少都不花任何代价。大约两万个非尾调用的栈帧，才是 `stack overflow` 住的地方。两个事实都要知道；递归从来不是这个问题的形状，而一串操作就是一个 `for` 循环。）
'''
