[[quest]]
id    = "lua.hacker.30.range-queries"
title = "不断变化的总数"
story = "公园里每个摊位一晚上的三十万次收银操作，一半是更正，而有人想要累计总数。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后运行 `q` 个操作，全都来自同一个生成器，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

输出每个查询答案的累计总数，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里强制要求复杂度。** 大的隐藏用例是 `n = 500000,
q = 300000`。初始代码是第 23 关的答案：一张前缀和表，它让每次查询都是 `O(1)`——而每次更新都会破坏它，所以初始代码重建它，每次更新 `O(n)`，重建十五万次。在这台机器上它花了 **57 秒**，而运行限制是十秒。（改用普通循环对区间求和，在量级上并不更好，实际上也只好一点：它是每次*查询* `O(n)` 而不是每次更新，在这里花了大约 14 秒。）Fenwick 树百分之几秒就把整件事做完。全部实测，用的是这道题里的程序。

（这道题的 Rust 和 Go 版本跑四百万次操作。这片土地沿用 Python 的三十万次，因为用例是参考实现的——而重点是把对的结构和错的结构分开，而不是把一种运行时和另一种分开。）

这一课就是面试官想钓出来的那个：*单点更新、区间求和*正是 Fenwick 树为之存在的形状。三个短函数——add、prefix，以及作为两个前缀之差的 range——而 `bit.band(i, -i)` 就是你按最低置位迈步的方法：`bit` 库把 `-i` 当作补码的 32 位整数，这正是那个技巧能成立的原因。

累计总数会超过 `10^13`。Lua 的数字能精确地装下直到 `2^53` 的每个整数，`print` 会显示它的全部十四位；那就是你的余量，而知道这一点是答案的一部分。
'''
hints = [
  "通过对每个初始值调用一次 add 来建树。O(n) 的自底向上建树是一个不错的优化，但不是时钟在测的东西。",
  "bit.band(i, -i) 分离出最低的置位——bit 库把 -i 看作补码。加上它是沿树往上走；减去它是往下走。",
  "range(l, r) 是 prefix(r + 1) - prefix(l)，把这一对差一弄对就是调试的大部分工作。把 bit.band 绑定到一个局部变量是这道题唯一需要的微优化，而 LuaJIT 几乎连这个都不需要。",
]

