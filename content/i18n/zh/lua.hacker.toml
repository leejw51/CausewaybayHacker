# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.hacker.11.bst"
title = "它真的是 BST 吗"
story = "追问，同一棵灯笼号码的树。每个人都去检查两个子节点，每个人第一次都错了。"
brief = '''
和上一题相同的层序编码：`-1` 是缺失的节点，`i` 的子节点是 `2i+1` 和 `2i+2`。

第一行是 `n q`。第二行是树的 `n` 个值。第三行是 `q` 个查询值。

输出 `VALID` 或 `INVALID`——这是不是一棵二叉搜索树，左子树中的每个值都严格小于节点，右子树中的每个值都严格大于节点？然后每个查询一行：如果在树里，输出 `<value> FOUND <depth>`，不在则输出 `<value> ABSENT`，根的深度为 1。

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

在每个节点检查 `left < node < right` **是不够的**——左子树深处的某个值仍然可能比某个祖先大。改为把开区间一路往下传。Lua 没有可以作为起点的最小整数；边界一开始是 `nil`，意思是“还没有边界”，而 `nil` 需要自己的检查，因为 `value <= nil` 是 `attempt to compare number with nil`，一个运行时错误，而不是假。

查询由**下降**来回答：和节点比较，更小就往左，否则往右，掉出树时报告 `ABSENT`。这一点很重要，因为这棵树并不保证是 BST，而在不是 BST 的树里，一个值可能待在数组中下降永远不会去看的某个地方。那就是 `ABSENT`——问你的是查找会做什么，而不是扫描数组会找到什么。
'''
hints = [
  "把开区间 (low, high) 往下传。根得到 (nil, nil)；左子节点得到 (low, node)，右子节点得到 (node, high)。",
  "缺失的节点空洞地有效——那是基本情况，它返回 true，而不是 false。",
  "查找就是二分搜索：更小的往左，否则往右，深度是走了几跳。掉出树时返回 nil，而 nil 输出为 ABSENT。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.hacker.12.heap"
title = "K 条有序队列"
story = "火龙经过的每条巷子送来的灯笼号码都已经排好序。把它们合并成一个列表，不要把全部重新排一遍。"
brief = '''
第一行是 `k`。然后是 `k` 行，每行是一个数量，后面跟着那么多个已经升序排好的整数。

把它们全部合并成一行升序输出，用空格分隔，然后输出 `POPS <total count>`。

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

Lua 里没有 `heapq`。二叉最小堆就是一张表加两个函数——`push` 把新的最后一个元素上浮，`pop` 把最后一个元素移到顶上再下沉——而初始代码带了一个，两个各十五行的函数，所以这里的问题是循环而不是堆。读一遍；在这条路再往后，你会自己写它。

条目是 `{ value, which list, how far into it }`，堆先按 `value`、平局时按列表下标给条目排序——这没问题，因为它只需要是*某种*顺序，而且必须是**全序**，因为堆的比较是你写的，而一个两边都说“相等”的比较不是 Lua 会报告的错误。

堆里每个列表一个条目，而不是每个元素一个，所以不管列表有多长，它都保持在大小 `k`。

这里的四个用例只是分布在两三个列表里的寥寥几个数，时钟在它们身上不是在测速度：把所有东西倒进一张表再 `table.sort`，四个都能过；每一步都重新扫一遍全部 `k` 个表头也能过。堆是在 `k` 很大时让它保持 `O(N log k)` 的东西，而那是对这些用例里没有的输入所做的承诺。
'''
hints = [
  "堆条目必须带着值从哪里来，否则弹出之后你没法补充。",
  "用 `less` 先比较 value 的 { value, which, at } 正是你想要的；用每个非空列表的第一个元素做种子——数量为 0 的列表没有表头可以做种子。",
  "只在弹出某个列表的一个元素时才推入那个列表的下一个元素——这让堆保持在 k。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.hacker.13.backtracking"
title = "每一种组合"
story = "列出灯笼挂上摊位的每一种方式。全部，按固定顺序，同一种不要打印两次。"
brief = '''
第一行是 `n`。第二行是 `n` 个**已经升序排好**的不同整数。

输出每一个子集，每行一个，值用空格分隔，空子集输出为 `-`。按显而易见的递归产生它们的顺序排列：在每个位置上，先走**取**这个元素的分支，再走跳过它的分支。然后输出 `SUBSETS <2^n>`。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

推入，递归，**弹出**。弹出是人们会漏掉的那部分，症状是第一行之后的每一行都太长。在 Lua 里推入是 `chosen[#chosen + 1] = v`，弹出是 `chosen[#chosen] = nil`——给最后一个位置赋 `nil` 就是让序列变短的方式，`#chosen` 也跟着往下走。这里没有 `itertools` 以别的顺序给你子集；顺序就是递归自己的顺序，而检查的正是它。
'''
hints = [
  "每个元素两次递归调用：一次把它追加进去，一次不追加。先取，样例里的顺序就自然出来了。",
  "chosen[#chosen] = nil 放在两次调用之间。那就是“尝试—递归—撤销”里的 `undo`。",
  "基本情况是 at > #nums，那里的空选择就是空子集，它仍然算数——并输出为 `-`。",
]

