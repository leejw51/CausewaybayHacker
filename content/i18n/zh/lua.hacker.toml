[[quest]]
id    = "lua.hacker.32.modular"
title = "模十亿零七"
story = "这句话出现在题目的最底下，房间里一半的人不知道它要他们做什么。在这个房间里它还多要一件事：一个装得下五十三位的数字，乘两次。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询计算二项式系数 `C(a, b)` **模
1000000007**。输出所有 `q` 个答案之和，它本身也模 `1000000007`，然后输出 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这样的规模下 `C(a, b)` 有几十万位，Lua 里没有任何东西装得下它。每次乘法都要边算边约简。问题在除法：`a! / (b! (a-b)!)` 在模算术里没有意义。取代它的是**模逆元**，而因为 `1000000007` 是质数，费马小定理把它交给你：`inverse(v) = v^(p-2) mod p`，用反复平方——这里的 `^` 是浮点乘方，做不到这件事，所以循环归你写。

所以：一次性预先算好 `factorial[0..n]`，每个查询的答案就是 `f[a] * inv(f[b]) * inv(f[a-b])`。

**而在这门语言里，乘法本身就是陷阱。** 两个剩余各自小于 `2^30`；它们的乘积小于 `2^60`，而 Lua 的数字是只装得下 `2^53` 的 double。超过那一点 `(a * b) % P` 就是错的——不是错误，不是溢出，只是低位没了，剩余差了一点点。诚实的 `mulmod` 把其中一个因子拆成高低两个 16 位的半截，让每个部分积都保持在 `2^46` 以下，并在两半之间做约简。它是五行，初始代码里带着；这一关的每个乘积都要经过它。

**这里强制要求复杂度。** 有一个隐藏用例是 `n = 200000`，`q = 200000`。独立地计算每个系数——乘 `b` 项，除 `b` 项，每个一次模逆元——跑了 **25 秒**还没结束，而运行限制是十秒；那就是初始代码。一张共享的阶乘表，加上从一次 `powmod` 往回预先算好的逆阶乘，用两次 `mulmod` 回答每个查询，百分之几秒就完成。两者都是在这台机器上测的。
'''
hints = [
  "每次乘法之后都约简，而且只通过 mulmod 相乘：两个剩余直接 a * b 会超过 2^53，而且悄悄地错。",
  "powmod(v, P - 2) 就是模逆元，它只因为 P 是质数才成立——这就是费马小定理在这里的全部内容。",
  "逆阶乘也预先算好，从 powmod(factorial[n], P - 2) 往回算：inv_factorial[i - 1] = inv_factorial[i] * i。这样一个查询就是两次 mulmod，根本不用 powmod。",
]

