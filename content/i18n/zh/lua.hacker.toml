[[quest]]
id    = "lua.hacker.31.palindrome"
title = "倒过来一样"
story = "前二十名的题目，大多数筛选都以某种形式问过，也是大多数人写过一次却从没弄懂的那一道。火龙从尾巴读起也一样，面试官说，没有笑。"
brief = '''
标准输入是 `n alphabet seed`。自己构建字符串，用会回绕的 64 位算术（`0ULL + seed`）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

输出最长回文子串的长度，然后输出 `AT <index>`——那个长度中**最靠左**的那一个的 0 基起点。

```
input:  12 3 5
output: 5
        AT 1
```

围绕每个中心向外扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符是奇数长度回文的中心，而两个字符之间的每个空隙是偶数长度回文的中心。忘了空隙，就是一个看起来正确的解在 `abba` 上返回 `1` 的原因——而初始代码正是这样。

你从来不需要把字符串当作字符串。把抽取的结果放在一张小数字的表里——`s[i] = next() % alphabet`——然后比较数字；对两万个单字符字符串用 `..`，会先造出两万个字符串。表是 1 基的，而题目的 `AT` 是 0 基的，所以你输出的下标比你找到的下标小一。

**测试强制什么、不强制什么**，直说。真正干活的隐藏用例是在**单**字母字母表上的 `n = 8000`。这是围绕中心扩展的最坏情况——每个中心都一路跑到字符串末尾——所以正确的答案在那里要做满 `O(n²)`，三千二百万次比较，而 LuaJIT 百分之几秒就做完。它也会拒绝“检查每个子串、逐个测试”的写法，那是立方级的——这里是 `10^11` 量级的比较——远远超出十秒的限制。

另一个大用例，在两个字母的字母表上的 `n = 20000`，是一个**正确性**用例而不是速度用例：在随机二进制字符串上，回文测试在一两个字符之后就失败了。它检查的是你的生成器和你的最左下标平局处理在大规模下和我们的一致。

所以：测试拒绝立方级，接受平方级。它们**不**要求 Manacher 算法，那是 `O(n)` 的答案。知道它存在、知道它做什么，因为“你能做得比平方级更好吗？”正是这道题通常要引出的追问。
'''
hints = [
  "每个中心扩展两次：(c, c) 用于奇数长度，(c, c + 1) 用于偶数长度。初始代码少了第二个。",
  "循环停下时，i 和 j 都已经越过回文一位——所以它的长度是 j - i - 1，而在 1 基的表里，i 就已经是 0 基的起点了。",
  "只在回文严格更长时才更新，这样每个长度中最靠左的那个就是你保留的那个，这正是 AT 要的。s[0] 是 nil，而不是绕回来的字符，nil == s[j] 只是 false——但 `i >= 1` 检查仍然是诚实该写的那个。",
]

