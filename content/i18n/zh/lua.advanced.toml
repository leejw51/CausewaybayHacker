[[quest]]
id    = "lua.advanced.11.protocol"
title = "只要能画出来"
story = "维多利亚公园灯会的名录列出摊位和柜台，由两个不同的程序构造，而牌子只想知道它们每一个都能把自己画出来。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行是以下之一

* `STALL <NAME> <AISLE>`——渲染为 `<NAME> / A<AISLE>`
* `COUNTER <NUMBER>`——渲染为 `COUNTER <NUMBER>`

把协议 `Sign` 声明为一个方法名列表——`{ "render" }`——再写 `implements(object, protocol)`，当对象在每一个名字上都有一个函数时它为真。把 `Stall` 和 `Counter` 写成普通的类——**不提 `Sign`**——再写一个函数 `show(sign)` 输出渲染结果。输出每个牌子，然后输出用 `implements(x, Sign)` 数出来的 `SIGNS <n>`，再输出用 `is_a(x, Stall)` 数出来的 `STALLS <k>`，后者比较的是元表。

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

协议是一种**结构化**类型：一个类满足它，靠的是拥有那些方法，而不是声明自己满足。Lua 没有给这个起名字，因为这是 Lua 唯一有的那种类型。检查是在运行时按名字查找，而且它必须是**和调用所做的同一次查找**：`object[name]`，它经过 `__index` 到达方法所在的类。起始代码用 `rawget` 检查，它只看实例本身，在任何一个上都找不到 `render`，于是报告 `SIGNS 0`。

`show` 在运行时通过那次查找来分派——`sign:render()` 找到元表链上的那个 `render`，不管是哪一个。没有静态分派可以另选；Lua 只有一种机制，就是这个。
'''
hints = [
  "用 object[name] 代替 rawget(object, name)。这就是全部修复：rawget 跳过元表，而方法在 __index 背后的类上。",
  "Stall 和 Counter 都没有在任何地方提到 Sign。它们靠拥有 render() 来满足它；这就是“结构化”的意思。",
  "implements 检查那个名字上有没有函数，不检查它的参数个数或返回什么。Lua 里从来没有东西检查这些；调用时才会发现。",
]

