[[quest]]
id    = "lua.advanced.10.functools"
title = "记住你算过的"
story = "火龙经过之前，香档用同样的两个数字把同一晚的价钱算了一万一千次，每次都从头算。"
brief = '''
标准输入是 `n k bits`：两个整数和一串二进制数字。

输出四行：

1. `FIB <fib(n)>`——来自一个被 `memoize` 包装的**递归** `fib`
2. `PRODUCT <k!>`——对 `1..k` 用乘法做 `reduce`，带一个初始值，这样 `k = 0` 给出 `1`
3. `BIN <value>`——`bits` 由一个接受进制的解析器的 `partial` 解析，进制绑定为 `2`
4. `MISSES <m>`——`fib.misses`，递归实际运行函数体的次数

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` 最多为 `400`，这对 LuaJIT 的栈来说不算什么。没有缓存，`fib(35)` 大约是三千万次调用，`fib(90)` 跑不完。有了它，每个 `fib(i)` 只运行一次，`MISSES` 是 `n + 1`。`memoize` 就是“包起来”那一关的包装器，闭包里多了一个缓存：一张可调用的表，所以 `fib.misses` 是一个字段，并且 `fib =
memoize(function ... end)`，这样里面的递归也经过缓存。起始代码的 `fib` 是一个普通函数，它的最后一行死在 `fib.misses` 上。

`fib(90)` 和 `20!` 超过了 2^53，而 Lua 的数字是 double：超过那里，数字会悄悄丢失。起始代码带了 `big`，一个以 10^7 为基的分段列表表示的数字，附带 `add`、`mul_small` 和 `tostring`；`fib` 把 big 相加，乘积则把一个 big 乘以一个小数字。`partial` 冻结函数开头的几个参数，给你一个新函数；`reduce` 把一个二元函数折叠过一个迭代器。两者都不巧妙。两者都会被问到。
'''
hints = [
  "local fib; fib = memoize(function(n) ... end) — 先声明名字，这样函数体里的 fib 就是最终装着包装器的那个上值。起始代码死在最后一行，因为普通函数没有 misses 字段。",
  "reduce(big.mul_small, range(1, k), big.from(1)) — 第三个参数是起始值，正是它让空范围给出 1。",
  "partial(parse, 2) 返回一个自己提供进制、接受文本的函数。unpack(bound, 1, count) 把绑定的参数放在前面；select(\"#\", ...) 即使其中一个是 nil 也会把它们数进去。",
]

