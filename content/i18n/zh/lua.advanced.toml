为每个值创建一个协程，把它加到**一个共享的总数**上，并给一个共享的次数加一，然后以轮转的方式驱动它们全部——每个跑腿都轮到一次，直到每个跑腿都死掉。然后输出 `TOTAL <sum>` 和 `HITS <n>`。

