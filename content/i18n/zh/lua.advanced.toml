  "用 price:key() 给集合作键，它是由字段构造的字符串。表本身只对它自己是一个键。",
  "TOTAL 是原始分数的和，这只在赋值失败时才成立。在起始代码里，到那时每个价格都已是 0，TOTAL 就是 0——修改不仅被允许了，而且生效了。",
]

