output: TOTAL 10
        HITS 4
```

起始代码在样例上确定地输出 `TOTAL 4`。每个跑腿读抽屉，**yield**，然后把读到的值加上自己的值写回去。等到第一个写入时，四个都已经读到了 `0`，最后一次写入胜出：一个摊位的钱，四次命中。这就是丢失的更新，而它发生在一个线程上，语言里也没有锁可忘。

Lua 里没有 `Lock`，因为没有抢占。协程一直运行到它说 `coroutine.yield()` 为止，中间没有别的东西运行。临界区就是任何一段里面没有 yield 的代码，而 bug 是读和写之间的一个 yield。把 yield 从中间移出去——先等轮到自己，然后在一段里读、加、写——抽屉就对了。当更新确实必须在中间 yield 时（比如等一个 socket），锁就是一个标志：`while busy do
coroutine.yield() end`，设置它，干活，清除它。这就是一把拼写出来的互斥锁。

调度器写在程序里：一个遍历跑腿的循环，resume 每个不是 `dead` 的，直到整整一轮都找不到活着的。
'''
hints = [
  "运行起始代码：TOTAL 4，HITS 4。四个跑腿读到 0，yield，然后各自写入 0 加上自己的值。最后一次写入就是总数。",
  "total = total + value，读和写之间没有 yield。yield 可以留在 pay 里；只是不能夹在更新中间。",
  "不要写 local total = total + value：那会造出一个新的局部变量遮住上值，外层的 total 永远不动。闭包只有在你给那个变量赋值时才共享它。",
]

