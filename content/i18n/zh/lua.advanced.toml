# LUA LAND — ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/lua/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "lua.advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.advanced.01.conversions"
title = "三种形态，一个名字"
story = "浣纱街的香档在一本记事本里，把价钱既记成文字，又记成数字，又记成元，都在同一个名字底下。"
brief = '''
读取一行：一个以分为单位的金额，全是数字。

输出三行：

1. 去掉首尾空白后的文本有多少个字符
2. 这个金额作为数字
3. 这个金额换算成元，精确到两位小数

```
input:  1234
output: 4
        1234
        12.34
```

金额非负。用**一个名字**来做，重新绑定三次——先是字符串，然后是数字，然后又是字符串。Lua 的局部变量什么都能装，一赋值就改主意；代价是，除了读上面那一行，没有任何东西告诉你 `cents` 此刻是什么。

算元的时候不要经过除法。`1234 / 100` 今天是 `12.34`，而 `0.1 + 0.2` 打印出来是 `0.3`，比较起来却不是。`math.floor` 和 `%` 精确地给你两个部分，`string.format("%02d", ...)` 给第二部分补零。`tonumber` 是转换；在 `cents` 还是字符串的时候，`#cents` 是字符串的长度。
'''
hints = [
  "在 cents 还是字符串的时候取 #cents，就是第一行。",
  "cents = tonumber(cents) 不是原地转换；它是把一个新值绑定到旧名字上。在那之后字符串就没了。",
  "string.format 里的 %02d 是宽度二、补零、十进制。5 分是 0.05，不是 0.5。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.advanced.02.control-flow"
title = "哪条巷子"
story = "巷子的编号用粉笔写在火龙要走的路上，莲花宫前指挥的牌子本该写明每条巷子里有什么。它每次都只写编号，而且从零开始。"
brief = '''
读取一个整数 `n`。对从 `1` 到 `n` 的每个 `i`，输出一行：

* 如果 `i` 能同时被 3 和 5 整除，输出 `FISHVEG`
* 如果 `i` 能被 3 整除，输出 `FISH`
* 如果 `i` 能被 5 整除，输出 `VEG`
* 否则输出 `i` 本身

然后继续读取整数，每行一个，直到读到 `0` 为止，再输出 `SKIPPED <k>`，即途中读到的非零行数。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

两个循环，两种写法。第一个在开始之前就知道要跑多少次：`for i = 1, n do`。第二个不知道：`while true do` 加 `break`，因为次数由你读到的内容决定。Lua 的数值 `for` 两端都是**包含**的——`for i = 1, n` 跑 `n` 次——而起始代码从 `0` 开始，这正是这片土地得名的那个差一错误。
'''
hints = [
  "先检查两者都满足的情况，否则它永远不会触发。能被 3 和 5 整除就是能被 15 整除。",
  "for i = 0, n - 1 早一步开始，也早一步结束。起始代码就有这个 bug；它输出的第一行是 FISHVEG，因为 0 能被任何数整除。",
  "while true do ... break 是 Lua 表达“出口在中间的循环”的方式。还有 repeat ... until，它在底部检查。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.advanced.03.lists"
title = "火龙的中段"
story = "六十七米长的稻草扛在一排舞龙者的肩上，龙头的指挥看得见第一个和最后一个舞龙者，中间的一个也看不见。"
brief = '''
标准输入第一行是一个数量 `n`，第二行是 `n` 个整数，用空格分隔。`n` 至少为 `1`，所以总有第一个值和最后一个值可以输出。

输出三行：第一个值、最后一个值，以及严格位于它们之间所有值的和。少于三个值时，这个和为 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Lua 的列表是一张键为 `1..n` 的表，`#nums` 就是 `n`。第一个元素是 `nums[1]`；最后一个是 `nums[#nums]`。没有 `nums[-1]`——负数键只是一个没存过东西的键，读它会毫无怨言地得到 `nil`——也没有切片：中间部分是一个从 `2` 到 `#nums - 1` 的循环，没有中间部分时它跑零次，所以其他语言需要的那道保护在这里是免费的。

起始代码打印 `nums[0]`。这在 Lua 里不是错误。它是 `nil`，`print` 写出 `nil` 这个词，程序以 0 退出。这片土地正是因此得名。
'''
hints = [
  "nums[#nums] 是最后一个元素；nums[#nums - 1] 是它前面那个。负数都不管用。",
  "for i = 2, #nums - 1 是除去首尾之后的全部，只有一个值时它就是 for i = 2, 0，自己就会跑零次。",
  "io.read(\"*a\") 一次读完全部内容，gmatch(\"%S+\") 逐个走过各个记号，于是换行在哪里就不再重要。第一个记号是数量；跳过它。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.advanced.04.strings"
title = "字节不是字"
story = "维多利亚公园灯笼摊的订货单把 銅鑼灣 截到三个字节，打出一个字和一个问号。"
brief = '''
读取一行。输出三行：

1. 它以 UTF-8 编码的**字节**长度
2. 它的**字符**长度
3. 字符顺序反转后的这一行

```
input:  causeway
output: 8
        8
        yawesuac
```

这一行可能含有 ASCII 以外的字符，那时前两个数字就不一样。Lua 的字符串是一串**字节**，此外什么也不知道：`#s` 是字节数，`s:reverse()` 反转的是字节，会把每个多字节字符切成两半。字符是你自己定义的东西。在 UTF-8 里，一个字符是一个首字节后面跟着任意多个后续字节——写成模式就是 `[^\128-\191][\128-\191]*`——所以数首字节就是字符数，用 `gmatch` 走过各个字符再把它们叠起来就是反转。

起始代码把字节数打印两次，这一行原样打印。不要用 `line:reverse()` 去修第三行：对 `causeway` 它是对的，而对大家真正会输入的样例，它打印出的字节在任何编码下都不是字符串。
'''
hints = [
  "#line 是字节数。字符必须自己数：gsub 的第二个返回值是匹配的次数，每个字符匹配一次，就是字符的个数。",
  "后续字节是 128..191（10xxxxxx）。一个字符是一个不属于它的字节，后面跟着零个或多个属于它的字节：\"[^\\128-\\191][\\128-\\191]*\"。",
  "table.insert(reversed, 1, ch) 压到最前面，所以最后一个字符最后排在第一。table.concat 不带分隔符地连接。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.advanced.05.dicts"
title = "巷子在喊什么"
story = "九点的浣纱街：每个摊位都在喊着什么，书馆街那头的牌子想要一个排名。"
brief = '''
读取全部标准输入，按空白切分。

每个不同的单词输出一次，格式为 `<word> <count>`，按次数降序排列，次数相同时按单词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

以单词为键的表就是计数器，而第一次时 `counts[word] + 1` 是错误——`attempt to perform arithmetic on a nil value`——因为没人写过的键是 `nil`。`(counts[word] or 0) + 1` 补上那个零。

`pairs` 遍历键时**完全没有顺序**，而且顺序每次运行都会变。把键复制进一个列表，用一个说明“次数降序、然后单词升序”的比较函数 `table.sort` 它，再从列表输出。比较函数在第一个参数应排在前面时返回 `true`。
'''
hints = [
  "起始代码在第一个单词上就死了：counts[word] + 1 在写之前先读，而没有东西可读。(counts[word] or 0) 补上那个零。",
  "用 pairs 把键收进一个列表，然后 table.sort 这个列表。表本身没有顺序可修。",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — 次数降序，然后单词升序，对相等的参数永远不返回 true。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.advanced.06.sets"
title = "两个档口都有的"
story = "两个灯笼摊，一个在安庶庇街这边，一个在那边，一位顾客想知道哪些东西两边都买得到，免得横穿火龙的路线两次。"
brief = '''
两行标准输入，每行是一个摊位的货品，用空格分隔。一个摊位可能把同一样东西列两次；那只算一次。

输出三行：

1. `BOTH` 后面跟着两个列表上都有的所有东西，排好序，用空格分隔——没有的话输出 `BOTH -`
2. `ONLY_A <k>`：在第一个列表上而不在第二个列表上的东西有多少
3. `ALL <k>`：两个列表上一共有多少不同的东西

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua 没有集合类型。集合是一张以成员为**键**、值为 `true` 的表：把 `tofu` 写两次就是把同一个键写两次，重复在进门时就消失了。成员判断是 `a[x]`，它是 `true` 或 `nil`。交集、差集和并集是三个循环，遍历一个集合的键去问另一个——把它们写成函数，三行就是三次调用。

`#` 不数集合的键；它数的是列表部分，而列表部分是空的。用一个 `pairs` 循环来数，并在输出之前把成员排好序放进一个列表，因为 `pairs` 没有顺序。
'''
hints = [
  "对每个记号 set[word] = true 就建好了集合；重复的 tofu 是同一个键写了两次。",
  "交集是一个遍历 pairs(a) 的循环，保留 b[key] 为 true 的键。差集保留它为 nil 的键。并集把两个集合的键都写进一张表。",
  "只有字符串键的表 #set 是 0。用 pairs 把键复制进一个列表，table.sort 它，#list 就是数量，table.concat(list, \" \") 就是那一行。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.advanced.07.functions"
title = "每斤"
story = "浣纱街上每张价签都是按斤算的，除非另有写明，而香档的价签打印机坚持每次都要被告知。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<NAME> <CENTS>` 或 `<NAME> <CENTS> <UNIT>`。

写一个 `tag(name, cents, unit)`，返回 `<NAME> $<dollars>/<unit>`，保留两位小数，缺少 `unit` 时表示 `catty`，每行输出一个价签。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua 没有默认参数。调用者漏掉的参数是 `nil`，而起始代码的 `tag` 把它拿去拼接：`attempt to concatenate local 'unit'
(a nil value)`。惯用写法是函数的第一行——`unit = unit or "catty"`——因为 `or` 除非左边是 `nil` 或 `false`，否则返回左边。这就是 Lua 默认参数机制的全部，而它和一行 `def` 一样，是函数契约的一部分。

把这一行切成一个记号列表，转换好分数之后用 `tag(unpack(parts))` 把各部分交过去。`unpack` 把列表展开成参数，所以两个元素的列表和三个元素的列表都适合同一个签名。
'''
hints = [
  "在 tag 的第一行写 unit = unit or \"catty\"。这就是全部修复。",
  "`x or default` 是 Lua 的默认参数。它对一个值失效：如果调用者故意传 false，或者也替换它，这就是追问的问题。",
  "tag(unpack(parts)) 展开列表；只有两个部分时第三个参数是 nil，由 or 补上。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.advanced.08.exceptions"
title = "不是数字的那一行"
story = "柚子档的秤打印出一列重量，中间夹着某人的电话号码。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行。每一行本应是一个整数。

对每一行，输出值的两倍，或者在它无法解析时输出 `BAD <line>`。最后输出 `SUM <total>`，其中总数是你输出的那些值的和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")` 是 `nil`，悄无声息；`tonumber("1.5")` 是 `1.5`，它不是整数；而起始代码的 `double` 对两者都用 `error` 抛出。`error` 是 Lua 函数拒绝的方式——没有 `Result`，函数本身也不返回 `(value, ok)`——而期待一个数字的调用者必须用 `pcall` 说明它怎么处理：`pcall` 替你调用函数，返回 `true, result` 或 `false, message`，而不是让错误往上爬。

让 `pcall` 只包住那一个可能失败的调用。把整个循环体都包起来，也会把你自己 `print` 里的笔误吞掉，程序就是这样学会悄悄失败的。
'''
hints = [
  "起始代码在 xx 上以 main.lua:3: not an integer: xx 死掉。这条消息就是 pcall 不崩溃时作为第二个结果交给你的东西。",
  "local ok, value = pcall(double, line) — pcall 把函数和它的参数分开接收；pcall(double(line)) 会先调用 double，在 pcall 运行之前就崩溃。",
  "ok 为 false 时，value 就是消息。输出 BAD 然后继续；坏的那一行不往总数里加任何东西。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.advanced.09.comprehensions"
title = "浣纱街一趟走完"
story = "Alex 说你可以用三个 for 循环来做。巷子只有一条火龙那么宽，香已经点上；你只有一趟。"
brief = '''
标准输入是一行整数，用空格分隔。

输出三行：

1. 偶数值的和（没有偶数时为 `0`）
2. 每个大于 `10` 的值乘以二，保持顺序，用单个空格连接——没有的话输出 `-`
3. 一共有多少个不同的值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua 没有推导式；最接近的是一个从表构造表的函数，而这一关教的就是它们。把 `filter(list, keep)` 和 `map(list, f)` 各写一次——每个都是一个填充新表的循环——三行就变成了调用：`sum(filter(nums, even))`、`map(filter(nums,
big), double)`，以及一个由这些值构造、再数一数的集合。谓词和变换是作为参数传进去的函数，也就是推导式里的 `if` 和那个表达式。

`table.concat` 既接受字符串也接受数字，所以第二行不需要转换；但列表为空时它确实需要那个 `-`，因为 `table.concat({}, " ")` 是空字符串。
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end) 留下偶数；对它求和就是第一行。",
  "map(filter(nums, big), double) — 先过滤，再变换，就和推导式后面的 if、前面的表达式一样。",
  "集合是一张以这些值为键的表；#set 不数键，pairs 循环才数。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.advanced.10.dict-comprehensions"
title = "同样的一遍，按键"
story = "香档的价钱写在一张张红纸条上，按写下的顺序排着。阿姨想要一块完整的牌子，而且要两次。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<ITEM> <PRICE>`。`PRICE` 是以分为单位的整数。一种货品最多出现一次，`n` 至少为 `1`——总有一个最便宜的货品可以说出来。

输出三行：

1. 每个价格**严格大于 100** 的货品，格式为 `ITEM=PRICE`，按货品排序，用单个空格连接——没有的话输出 `-`
2. 每个货品，价格**用整数除法减半**，格式相同，按货品排序
3. `CHEAPEST <item>`——价格最低的，平局时按货品升序

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

上一关的按键版本。Lua 没有字典推导式；最接近的是 `filter_pairs(t, keep)` 和 `map_values(t, f)`，每个都是一个 `pairs` 循环，用同样的键填充一张新表。第一行保留值大于 100 的键值对；第二行用 `math.floor(v / 2)` 变换每个值并保留所有键。两者都不是推导式，而且各自就是一个函数，写一次。

`pairs` 没有顺序，所以 `sorted_keys(t)`——把键放进列表并排好序——是第三个辅助函数，每一行输出都经过它。至于最便宜的，走过排好序的键，只在价格严格更低时才替换：因为键是按字母顺序来的，相同价格中的第一个就是平局的胜者。
'''
hints = [
  "当 keep(key, value) 为 true 时 filter_pairs 保留那个键；map_values 在每个键上写 f(value)。两者都填充一张新表——永远不要写进你正在遍历的那张。",
  "sorted_keys(t) 是以固定顺序输出一张按键组织的表的唯一办法。这里每一行都经过它，包括最便宜的那一行。",
  "走过排好序的键，只在价格严格更低时才替换最优值：相同价格中的第一个按字母排在最前，平局自己就解决了。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.advanced.11.sorting"
title = "排名榜"
story = "火龙委员会每晚把最便宜的香钉上榜，莲花宫的文员拿着两个列表和一支铅笔手工给摊位排名。"
brief = '''
两行标准输入：第一行是摊位名，第二行是它们以分为单位的价格，顺序相同。至少有一个摊位。

按最便宜在前的顺序输出摊位排名，格式为 `<rank>. <NAME> <cents>`，排名从 `1` 开始，平局时按名字升序。然后输出 `CHEAPEST <NAME>`。

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
```

把两个列表拉链合成一个记录列表——`{ name = ..., price = ... }`——然后用一个按价格排序、按名字打破平局的比较函数 `table.sort` 它，再由 `ipairs` 给结果编号。比较函数是一个闭包；对两个相等的记录它必须返回 `false`，否则 `table.sort` 会抛出 `invalid order function for sorting`。只用一个下标循环、不排序的那种写法，会在第三个摊位把平局判错。
'''
hints = [
  "每个摊位一条记录，用同一个下标同时走过两个列表来构造。价格要 tonumber，否则作为字符串 1200 会排在 900 前面。",
  "function(a, b) if a.price ~= b.price then return a.price < b.price end return a.name < b.name end — 先价格，后名字，对相等的记录返回 false。",
  "for rank, stall in ipairs(stalls) 免费把排名交给你，从 1 开始。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.advanced.12.classes"
title = "档口的记事本"
story = "浣纱街的每个摊位都有自己记今晚生意的记事本，而香档那本里的每一行，都写进了委员会桌上那本公用的里。"
brief = '''
