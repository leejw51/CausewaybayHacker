story = "火龙委员会想知道今晚价格函数被调用了多少次，而函数不想知道自己正被盯着。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以公斤为单位的重量。

`price(kg)` 是 `500 + 100 * kg`。用 `counted` 把它包起来，让每次调用都被计数，而 `price` 并不知道。每个重量输出一个价格，然后输出 `CALLS <n>`，再输出 `NAME <price.name>`——它必须说 `price`。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

Lua 没有装饰器；最接近的是一个接受函数、返回某个可调用的东西来顶替它的函数，而这一关教的就是它。`price = counted(price, "price")` 把名字重新绑定到 `counted` 返回的东西上——这正是 `def` 上方的 `@counted` 所做的事。

计数放在哪里？Lua 的函数不能带字段，所以包装器是一张**表**——`{ calls = 0 }`——用一个 `__call` 元方法让它可调用，这个元方法把计数加一并调用原函数。于是 `price(kg)` 经过 `__call`，而 `price.calls` 就是一次普通的字段读取。

Lua 的函数也没有自己的名字。包装器必须被告知它所顶替的那个名字；起始代码从没告诉它，最后一行就说 `NAME wrapper`。这就是手工完成的 `functools.wraps`：被包装的东西的身份，复制到顶替它的东西上。
'''
hints = [
  "price = counted(price, \"price\") — 第二个参数是包装器带着的名字。这就是全部修复。",
  "在函数之后写 price = counted(price)，和把装饰器写在它上方一样：名字被重新绑定到 counted 返回的东西上，原函数只作为闭包里的上值 func 存活下来。",
  "__call 里的 ... 转发任意参数而无需知道它们是什么，这正是包装器能用于任何函数的原因。",
]

