```

Lua 的表永远是可写的；冻结一张表是元表的把戏。把字段放在一张调用者永远看不到的表里，交回一个**空的代理**，它的 `__index` 就是那些字段——每次读都会落过去——而它的 `__newindex` 会抛出错误：对代理没有的键的每一次写都会去那里，而代理一个键都没有。用 `pcall` 包住赋值，就是在不死掉的情况下做出尝试的方法。

集合是另一半。表作为键是**按身份**的：字段相同的两条记录是两个键，起始代码的 `IN_SET` 说 `3`。冻结的记录只有在键由字段构造——`price:key()`——时才能代表它的值，而这之所以安全，恰恰是因为字段不能在它底下改变。

`Tally` 的槽位又是 `__newindex`，只允许声明过的名字：`count` 用 `rawset`，其他任何名字都报错。属性名里的笔误就变成了赋值处的错误，而不是一个没人读的、悄悄多出来的新字段。
