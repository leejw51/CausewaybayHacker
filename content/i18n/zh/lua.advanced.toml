协程不是结果。`coroutine.resume(co)` 返回 `true`，后面跟着任务 yield 或返回的东西——那是值出来的唯一一扇门，而它在让任务完成的那次 resume 上打开，那碰巧是池的哪一轮就是哪一轮。起始代码收集的是完成了的协程本身——`thread: 0x...` 这样的值——而排序试图对其中一个做索引。

把下标带在结果里，才让每次运行的输出都一样；按它排序是答案的最后一行，而不是第一行。池就是抽屉那一关的调度器加一个上限：补满到 `w` 个在运行，每个给一轮，把死掉的退休，重复，直到任务和在运行的都空了。
'''
hints = [
  "起始代码死在排序或打印上：attempt to index local 'a' (a thread value)。协程是任务，不是它的答案。",
  "local ok, index, value = coroutine.resume(co) — 在把任务运行到返回的那次 resume 上，返回值跟在 ok 后面。状态为 dead 时保留 { index, value }。",
  "池按它自己的顺序完成任务，结果里的下标是每个任务从哪里来的唯一记录。输出之前按它排序。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.advanced.05.asyncio"
title = "async 到底在哪里跑"
story = "阿美写了四年 async 代码，却从没亲眼见过驱动它的那个东西。今晚这个循环是一个她读得懂的 while 循环，巷子里的每个跑腿轮流在上面跑。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

写一个 `double(value)`，让它向调度器 yield 一次——`coroutine.yield()`——然后返回值的两倍。为每个值做一个协程，用 `gather` 把它们全部运行起来，按输入顺序输出每个结果，然后输出 `SUM <total>` 和 `TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)` 不运行 `f`。它构造一个**协程对象**并把它交回来，在有东西 resume 它之前，里面什么也不会发生。起始代码的 `run` 返回三个这样的对象，没有 resume 过，输出是三行 `thread: 0x...`，接着是 `attempt to perform arithmetic on a
thread value`。

`gather` 就是事件循环，而在这里由你来写：一个遍历任务的 `while`，按顺序 resume 每个没有死掉的任务，一轮接一轮，直到一个不剩，并把每个任务的**返回值**存在那个任务的槽位里。结果按你传入任务的顺序出来，不管它们以什么顺序完成。这就是选择它、而不选择一个把一个任务 resume 到死再碰下一个的循环的全部理由：那种循环是正确而顺序执行的，而 `gather` 是正确而交错执行的。

这里只有恰好一个线程。`coroutine.yield()` 是任务把线程交还给循环、好让另一个任务使用它的那个点。没有任何东西并行运行；东西是**轮流**运行的，在它们说自己可以停下的地方。
'''
hints = [
  "用 return gather(tasks) 代替 return tasks——而 gather 就是你要写的那个循环：resume 每个没死的任务，一遍又一遍，直到一个都不剩。",
  "让任务死掉的那次 resume，它的第二个返回值就是任务的返回值。把它存在任务自己的下标上；这就是保持结果按输入顺序的原因。",
  "如果你需要结果按完成顺序出来，那就是上一关的池，那时下标得由你自己带着。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.advanced.06.async-queue"
title = "谁说它做完了"
story = "三个跑腿在维多利亚公园灯会入口清理排队的票，指挥等着队列说它空了。它从来不说，因为没人告诉它哪张票处理完了。"
brief = '''
标准输入是两个整数 `w` 和 `n`，然后是 `n` 个值。

把 `{ index, value }` 任务放进一个会计算待处理数的队列。启动 `w` 个消费者协程，它们永远循环：取一个任务，把 `value * 10` 写进 `results[index]`，再调用 `task_done`。主函数运行 `join`——那个调度器一直 resume 消费者，直到每个 `put` 都有了它的 `task_done`——然后取消消费者，再按下标顺序输出结果和 `CONSUMERS <w>`。

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

待处理数为 `0` 时 `join` 返回，而只有 `task_done` 能让它减少。起始代码的消费者从不调用它，所以每个任务都处理了，计数仍然说 `4`，每个消费者都停在空队列的 `get` 里，再也没有任何东西能改变任何事。没有检测的循环会在那里空转，直到运行器杀掉程序。这一个会检测：整整一轮都没有消费者让计数减少，就是死锁，`join` 用 `error` 把它说出来。和窗口那一关是同样的挂起，拼法不同——而修复又是一行，在消费者那一边。

消费者是 `while true` 循环。它们之所以结束，是因为 main 在 join 之后取消了它们，而这里的取消就是**带着一个信号去 resume**：队列为空时 `get` 会 yield，当唤醒它的那次 resume 传入 `"cancel"` 时，`get` 返回 `nil`，消费者就返回了。停在 yield 上的协程，是被它醒来时收到的那个值停下的。
'''
hints = [
  "每个任务处理完后 task_done(queue)。join 只拿 put 的次数和 task_done 的次数相比，别的都不管。",
  "coroutine.create 什么也不调度；消费者在 join 第一次 resume 它时才运行，而发现队列为空的消费者会从 get 里面 yield 出 \"idle\"。",
  "被 \"cancel\" 唤醒的消费者从 get 拿到 nil 并返回，这就结束了 while true。什么也不带去 resume 它，只会让它再次停下。",
]

