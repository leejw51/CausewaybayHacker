标准输入是一个数量 `n`，然后是 `n` 行 `<NAME> <CENTS>`。

把每一行构造成一条**冻结**的记录 `Price.new(name, cents)`。然后，对每个价格，尝试覆盖它的 `cents`，在尝试抛出错误时输出 `FROZEN <NAME>`。接着，一个声明了一个槽位 `count` 的 `Tally` 类：设置 `tally.count`，然后尝试设置拼错的 `tally.cuont`，在*那次*抛出错误时输出 `SLOTS YES`。最后输出 `IN_SET <k>`——一个按**值**作键的价格集合的大小——和 `TOTAL <sum>`。

