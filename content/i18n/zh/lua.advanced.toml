标准输入是一个数量 `n`，然后是 `n` 行 `<STALL> <CENTS>`，其中 `CENTS` 本应是一个整数。

写一个 `opened(stall, body)`——一个把代码块作为函数接收的函数——进门时输出 `OPEN <STALL>`，运行 `body`，出门时输出 `SHUT <STALL>`，**不管函数体有没有抛出错误**。在函数体里，解析分数并加到总数上。分数无法解析的那一行，在卷闸门关上之后报告为 `BAD <STALL>`。最后输出 `TOTAL <sum>` 和 `REJECTED <k>`。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

Lua 没有 `with`，也没有 `finally`；最接近的是一个把函数体当作闭包接收的函数，外加包住那次调用的 `pcall`。`pcall` 之前的一切是进入，之后的一切是退出，而退出在两条路径上都会运行，因为 `pcall` 把错误变成一个返回值，而不是让它爬过 `SHUT`。起始代码直接调用 `body()`，`WONG` 的卷闸门就永远关不上。

卷闸门落下之后，错误再往上走：`error(err, 0)` 重新抛出它——那个 `0` 防止 `error` 在消息前面再加一个位置——而调用者自己的 `pcall` 看到它并输出 `BAD`。不要在 `opened` 里把它吞掉：调用者想知道。
'''
hints = [
  "local ok, err = pcall(body)，然后 print(SHUT)，然后 if not ok then error(err, 0) end。pcall 就是 finally。",
  "错误穿过 opened 到达 main 的 pcall，所以 main 的 BAD 照样打印——在 SHUT 之后，因为 SHUT 在重新抛出之前就打印了。",
  "total = total + parse_cents(cents) 先求右边的值；parse_cents 抛出时什么也没被赋值，所以坏的那一行什么也不加。",
]

