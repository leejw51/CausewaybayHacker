        16
        THREADS 3
```

Lua 没有线程；它有协程，而对其中一个做 `type(co)` 得到的是字符串 `thread`，这就是最后一行的那个计数。`coroutine.create(f)` 不运行 `f`。`coroutine.resume(co, ...)` 运行它——在**第一次** resume 时参数成为 `f` 的参数——直到它 yield 或返回；而 `square` 从不 yield，所以一次 resume 就是全部工作。结果必须写在 `main` 之后能读到的地方；每个跑腿一个槽位的表就是最简单的那种地方。

