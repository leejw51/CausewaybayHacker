标准输入是一个数量 `n`，然后是 `n` 个整数。

为每个值创建一个**协程**，计算它的平方并存进 `results[i]`——它自己的槽位，所以没有两个跑腿会写同一个地方。把它们每一个都 resume，然后**按下标顺序**输出结果，每行一个，再输出 `THREADS <n>`。

