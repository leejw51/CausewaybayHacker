每个迭代器都是惰性的：`accumulate` 每拉取一次 yield 一个累计和，`groupby` yield 出值和它那一段组成的列表，所以 `#run` 就是长度。需要 `table.concat` 时，把迭代器收集成列表；只需要个数时，用循环数一数。
