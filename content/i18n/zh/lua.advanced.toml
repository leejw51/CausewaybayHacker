brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行本应是一个以公斤为单位的重量。

定义一个由**表**构成的错误层级：`PriceError` 作为基类，`NotANumber` 和 `Negative` 由 `class(PriceError)` 从它派生。`Negative` 带着重量，它的消息是 `negative weight: <kg>`；`NotANumber` 的消息是 `not a number`。`price(text)` 转换文本，抛出 `NotANumber` 时把解析失败保存为它的 `cause`，拒绝负重量，否则返回 `500 + 100 * kg`。

输出每个价格或错误的消息，然后输出 `ERRORS <k>`。用 `is_a` 捕获**基类**，一次。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative weight: -2
        ERRORS 2
```

`error` 能抛出任何值，而表是唯一能带着消息、原因和类的那一种。类就是它的元表；`is_a(err, cls)` 从它开始沿着 `parent` 链接往上走，一个 `if is_a(err, PriceError)` 就能捕获层级里的每一个成员。起始代码只捕获 `Negative`，所以 `xx` 那一行用一张未被捕获的表把程序撂倒了：`(error object is not a string)`。

`print(err)` 打印 `tostring(err)`，而 `tostring` **直接在元表里**找 `__tostring`——元方法不会经过 `__index` 链去找——所以 `class` 必须给它造出的每个类都放上一个。`cause` 是 `pcall` 从失败的解析中交回的字符串；这里没有东西打印它，而调试器会把两者一上一下都显示出来。那条链就是保留它的理由。
'''
hints = [
  "elseif is_a(result, PriceError) then — 基类捕获两个子类，这正是有基类的意义。",
  "print(result) 打印 tostring(result)，那就是错误自己的类上的 __tostring。不需要在处理程序里格式化。",
  "测试好几个类时顺序很重要：放在基类测试之后的子类测试是死代码，而 Lua 不会警告你。认不出的就重新抛出——error(result, 0)——而不是把它吞掉。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "lua.advanced.14.iterator"
title = "下一个，直到停下"
story = "维多利亚公园灯会入口的取票机从一个起点按固定步长发号，不保留任何列表，而排队牌想像遍历任何列表那样遍历它。"
brief = '''
标准输入是三个整数：`start`、`step`、`count`。

写一个 `Tickets` 类，**手工实现迭代器协议**：`next` 返回下一个值，或者在已经发出 `count` 个值时返回 `nil`，而 `iter` 返回泛型 `for` 需要的东西。每个值单独输出一行，然后输出 `SUM <total>`，它是把第二个 `Tickets` 交给 `sum` 算出来的。

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

这就是 `coroutine.wrap` 替你写的东西。泛型 `for` 接受三样东西——一个函数 `f`、一个状态 `s` 和一个控制值——在每一轮之前调用 `f(s, control)`，第一个结果为 `nil` 时停下。`Tickets.next` 已经是这个形状：它的 `self` 就是状态，第二个参数是一个它可以忽略的控制值。所以 `iter` 就是一行：`return Tickets.next, self`。`sum`、`collect` 和 `for` 都跳同样的舞，没有一个在乎状态是什么。

起始代码有 `next` 而没有 `iter`，`for` 说 `attempt to call
method 'iter' (a nil value)`。`next` 返回的 `nil` 在这里就是 `StopIteration`；这就是为什么票号永远不能是 `nil`，也是为什么 `0` 是一张好票——`0` 不是 `nil`。

`iter` 把 `self` 作为状态返回，是**迭代器**的标志：它只能被走一遍，然后就用完了。**容器**每次从 `iter` 返回一个新的状态，可以被反复遍历；这条路早些时候的 `Bag` 就是一个。说明你写的是哪一种；这个区别会在有人第二次循环时显现出来。
'''
hints = [
  "function Tickets:iter() return Tickets.next, self end。两个值，for 就开始工作了。",
  "nil 是被返回的，不是被抛出的。for 循环在它上面停下；你永远看不到它。在前进之前先保存你将要返回的那个值，否则你会差一步。",
  "for value in obj:iter() 就是 for value in Tickets.next, obj——方法调用只是产生这一对。返回一个捕获 self 的闭包也行；这一对就是不带额外函数的协议。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "lua.advanced.15.collections"
title = "对的容器"
story = "委员会的桌子把今晚的票存在一个长长的列表里，对它们的每个问题都从头读一遍来回答。"
brief = '''
三行标准输入：一行单词，一行已经**升序排好**的整数，以及一个整数 `x`。

输出四行：

1. `TOP <word> <count>`——出现最多的单词，平局按单词升序——来自一张计数表
2. `BISECT <l> <r>`——`x` 在排好序的整数中的 `bisect_left` 和 `bisect_right`：有多少个值小于 `x`，有多少个值不大于它
3. `SMALLEST3` 后面跟着最小的三个整数——从一个**堆**里弹出——不足三个就少一些
4. `GROUPS` 后面跟着单词的每个首字母对应的 `<letter>:<k>`，字母升序——来自一张以首字母为键、其 `__index` **在第一次访问时创建列表**的表

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

Lua 只自带一种容器，其他每一种都是一张表加一套规矩。起始代码的 `TOP` 保留第一个达到最高次数的单词，按**插入顺序**那是 `tofu`，而题目说的是 `egg`：把单词排好序，说出你的意思。它的 `BISECT` 扫描 `x` 的下标，`x` 不存在时就摔倒了；在排好序的列表上做二分查找永远不会抛出错误，而 `left` 和 `right` 相差的正是 `x` 的副本数。它的 `SMALLEST3` 把整个列表排序，只为从前面读出三个值，而这正是 `k` 小、`n` 不小时堆存在所要避免的事。它的 `GROUPS` 按 `pairs` 的顺序遍历一张计数表，那根本没有顺序。

`setmetatable({}, { __index = function(t, k) local v = {}; rawset(t, k,
v); return v end })` 就是 Lua 的 `defaultdict(list)`：第一次读一个缺失的键时造出列表并存起来，所以 `groups[letter][#... + 1]` 永远不需要检查。
'''
hints = [
  "遍历 sorted_keys(counts) 而不是 words，只在次数严格更大时才替换最高者；平局就归按字母排在最前的那个，也就是 egg。",
  "bisect_left 和 bisect_right 永远不会抛出错误；起始代码的 index_of 在 x 不存在时返回 nil，而隐藏用例中正有一个是这样。两者是同一个循环，只是把 < 换成 <=。",
  "堆是一个列表，其中 i 的父节点是 floor(i / 2)：push 追加并上浮，pop 把最后一项移到顶上再下沉。弹出三次就是最小的三个，不管 n 是多少。",
  "__index 元方法只在键缺失时运行；在它里面 rawset 把新列表存起来，下一次读就是普通的命中。输出之前把键排好序——带元表的表仍然没有顺序。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "lua.advanced.16.timeouts"
title = "别再等了"
story = "指挥的牌子向巷子里的每个摊位询问等候时间，而读卡机坏了的那个摊位从不回答，所以牌子永远不重画。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<STALL> <SECONDS>`，其中立即回答的摊位 `SECONDS` 为 `0`，来不及回答的为 `1`。

这里的时间是**刻**：十分之一秒就是一次 `coroutine.yield()`，`fetch(stall, seconds)` 每秒 yield 十次，然后返回 `<STALL> OK`。对每个摊位，在 `wait_for(task, 2)` 下以协程运行它的 `fetch`——两刻的期限，0.2 秒——并按输入顺序输出 `<STALL> OK` 或 `<STALL> TIMEOUT`。然后启动一个永远循环的 `watch()` 协程，给它一轮，**用 `"cancel"` resume 它**来取消它，让它从处理程序里输出 `CANCELLED`，从每条路径都会运行的代码里输出 `CLEANUP`。最后输出 `TIMEOUTS <k>`。

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` 最多 resume 任务 `ticks` 次，并报告它是否完成；如果最后一轮之后它仍然是 `suspended`，那就是超时，而这个任务就再也不会被 resume。起始代码却把 `fetch` 一直 resume 到结束，所以 `WONG` 用完了全部十刻，然后说 `OK`。

取消一个协程，就是把一个值送到它停着的那个 yield 上。`watch` 在一个 `pcall` 里面 yield，当 yield 返回 `"cancel"` 时它抛出错误；`pcall` 接住它——那就是输出 `CANCELLED` 的处理程序——然后清理那一行运行，然后错误被再次抛出，于是送来取消的那次 resume 拿回 `false, "cancelled"`。起始代码创建了监视者，给了它一轮，然后把它丢下：一个再也没人 resume 的协程永远什么也不运行，两行都不会打印。处理之后要重新抛出——把取消吞掉，就是一个任务变得无法取消的方式。
'''
hints = [
  "wait_for(task, 2)：最多 resume 两次，如果任务死了就返回 true 和结果，否则返回 false。超时的任务只是再也不被 resume。",
  "coroutine.resume(watcher, \"cancel\") — 这个字符串就是监视者的 yield 返回的东西，它自己的代码把它变成一个错误。把变量设为 nil 什么也没取消；它只是忘掉了这个协程。",
  "create 之后的第一次 resume 给监视者一轮去启动并停在 yield 上，这样取消才有一个 yield 可落，而不是落在一个还没开始的函数上。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.advanced.17.coroutine"
title = "协程"
story = "浣纱街，火龙全身展开，每一节一个上香跑腿。其中一个从不交出场地，整条火龙停在一节上，鼓声还在响，而总数回来时什么都没有。"
brief = '''
标准输入是两个整数 `k` 和 `n`。

把 `1..n` 分成 `k` 个连续的块——第 `i` 块是 `floor(n*i/k) + 1` 到 `floor(n*(i+1)/k)`（含两端）——并把每一块交给它自己的**协程**，它计算自己范围内的平方和：一个普通的循环，不调用库函数，每 100 000 个数 yield 一次，好让别的协程轮到。每个跑腿在一段不含 yield 的代码里把自己的结果加到**一个共享的总数**上，同时也记录在自己的槽位里。以轮转方式驱动它们，直到全部死掉。按下标顺序为每一块输出 `CHUNK <i> <sum>`，然后输出 `TOTAL <sum>`，再输出 `THREADS <k>`——协程的类型名是 `thread`，那就是这个计数。

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

起始代码失败的原因和时序毫无关系。`local part = coroutine.resume(co, lo, hi)` 保留的是 `resume` 的**第一个**结果，也就是 `true`，而跟在它后面的答案被扔在了地上；第一行 `CHUNK` 是 `attempt to concatenate local 'part'
(a boolean value)`。这是那个小 bug。按抽屉那一关的方式修它：一个共享的总数，在读和写之间没有 yield 地更新；每块的槽位只由一个跑腿写入；再加上锁那一关的调度器——每个没死的跑腿都轮到一次，直到一个不剩。

在大用例上这些和超过 2^53，而 Lua 的数字是 double：超过那一点 `+` 就会舍入。把每个和作为两段来带着——低段小于 10^9，高段是其余部分——并以 `%d%09d` 输出。

那件大事才是 boss，而它不是一个你能修的 bug。用 `k = 4` 和 `n = 4000000` 运行它并计时，然后用 `k = 1` 运行。它们花的时间一样。然后把循环里的 yield 删掉再运行一次：同样的输出，同样的时间，没有错误。协程一直占着场地，直到它说 `yield`；一个从不说的跑腿会一直跑到结束，其他三个等着，而没有任何东西告诉你，因为没有别的东西需要场地。这就是火龙停在一节上、鼓声还在响。四个核上的四个协程轮流计算平方和，其实在一个核上，还要加上切换的代价。LuaJIT 没有线程。协程是一个可以停下的地方，不是第二个核；运行是**轮流**的，在每个跑腿说自己可以暂停的地方。并行的工作是第二个进程——`io.popen`——或者 LÖVE 客户端的 `love.thread`，那是一个独立的 Lua 状态，什么也不共享，通过一个通道来通信。

输出是确定的，因为各块按下标输出，而总数是各块之和，与跑腿完成的顺序无关。用共享的总数输出 `TOTAL`，而不是把槽位加起来——那段不含 yield 的更新正是这张地图要讲的东西，两者必须一致。
'''
hints = [
  "resume 先返回 ok，值在它后面。更好的做法：给工作一个下标和一个要写的槽位，再给一个要往里加的共享总数，让调度器一直 resume 到死；那样就根本不需要从 resume 里拿出任何东西。",
  "全部 resume，一轮又一轮，然后再输出。在跑腿里面输出会交错；在循环之后从槽位输出则不会。",
  "两段：lo 小于 10^9，每次相加都把进位移到 hi。41666791666750000 就是 hi 41666791 和 lo 666750000，以 %d%09d 输出。",
  "n*(n+1)*(2n+1)/6 是总数的闭式公式。用它核对一次 TOTAL，你就知道块的边界是对的。然后在一个大 n 上把 k=1 和 k=4 的时间比一比：当它们一样时，你就见到了协程。",
]
