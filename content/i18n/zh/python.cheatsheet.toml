[[quest]]
id    = "python.cheatsheet.19.ripples"
title = "涟漪"
story = "雨水从维多利亚公园一个街区一个街区地漫出去；水先到近的街，再到远的街，而地图必须说出每个街区用了几步。"
brief = '''
网格上的 BFS：`dist` 必须存放从 `(sr, sc)` 出发的**最短**步数，所以格子必须按
进入的顺序取出，并且是 O(1)。空缺处放哪一行？

```
q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
hints = [
  "deque 从任一端弹出都是 O(1)；你取哪一端，决定了它是队列还是栈。",
]

