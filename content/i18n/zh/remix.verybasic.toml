# ---------------------------------------------------------------- 10
[[quest]]
id    = "remix.verybasic.10.closures-go"
title = "闭包 — GO"
story = "每张单子都有一个票号。发号的计数器住在创建它的那个函数里面，别人谁也碰不到。Gogo 用 Go 点单。"
brief = '''
闭包是一个函数，它捕获了创建它的那个作用域里的变量，并在那个作用域返回之后仍让变量活着。`counter()` 就创建一个：它返回的闭包每被调用一次，就发出下一个号码。程序读入单词，从 1 开始给它们编号，然后打印闭包下一次会发出的号码。

在 Go 里，函数字面量 `func() int { ... }` 按引用捕获 `n`，所以里面的 `n++` 改的是外面的 `n`，而 `counter` 把这个字面量作为 `func() int` 类型的值返回。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "return func() int { n++; return n }，分成四行——字面量捕获了 n。",
  "counter 的返回类型是 func() int，所以字面量也必须写 int。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "remix.verybasic.11.closures-rust"
title = "闭包 — RUST"
story = "每张单子都有一个票号。发号的计数器住在创建它的那个函数里面，别人谁也碰不到。Ferris 用 Rust 点单。"
brief = '''
闭包是一个函数，它捕获了创建它的那个作用域里的变量，并在那个作用域返回之后仍让变量活着。`counter()` 就创建一个：它返回的闭包每被调用一次，就发出下一个号码。程序读入单词，从 1 开始给它们编号，然后打印闭包下一次会发出的号码。

在 Rust 里，闭包是 `|| { ... }`，`move` 让它把 `n` 带走——没有 `move`，它借用的就是一个马上要离开作用域的局部变量。它修改了捕获的东西，所以返回类型是 `impl FnMut() -> i64`，调用方要用 `mut` 绑定它。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "move || { n += 1; n }，分成四行—— move 把 n 带进闭包。",
  "没有 move，闭包借用 n，返回它就是 E0373：n 活得不够长。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "remix.verybasic.12.closures-python"
title = "闭包 — PYTHON"
story = "每张单子都有一个票号。发号的计数器住在创建它的那个函数里面，别人谁也碰不到。那条蟒蛇用 Python 点单。"
brief = '''
闭包是一个函数，它捕获了创建它的那个作用域里的变量，并在那个作用域返回之后仍让变量活着。`counter()` 就创建一个：它返回的闭包每被调用一次，就发出下一个号码。程序读入单词，从 1 开始给它们编号，然后打印闭包下一次会发出的号码。

在 Python 里，闭包是一个内层 `def`。从外层作用域读 `n` 不成问题，但给它赋值会造出一个新的局部变量——除非内层函数先用一个关键字声明 `n` 属于外围作用域。哪一行是这个声明？

选出能做到这一点的那一行，然后把它敲在 `# FILL` 注释所在的位置。

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "def next_id(): 下面写 nonlocal n、n += 1、return n ——然后 counter 返回 next_id。",
  "没有 nonlocal，n += 1 就是 UnboundLocalError：赋值在读取之前造出了一个新的局部 n。",
]

