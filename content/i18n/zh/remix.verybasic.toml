[[quest]]
id    = "remix.verybasic.07.loops-go"
title = "循环 — GO"
story = "一位熟客在数：厨房要把一份单子减半或者乘三多少次，它才会变成一，途中又最大涨到多少。Gogo 用 Go 点单。"
brief = '''
条件成立时循环就一直跑，分支从两条路里选一条，计数器每转一圈加一。程序读入 `n` 并让它走下去：偶数就减半；奇数就乘三加一；到 1 停下。它打印步数和途中见过的最大值。

Go 只有一个循环关键字。`for cond { }` 就是它的 while 循环，`steps++` 是自增语句——是语句，不是表达式，所以不能放进更大的表达式里。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  6
output: 8
        16
```
'''
hints = [
  "for n != 1 { ——Go 的 while ——然后把 steps++ 作为里面的第一行。",
  "Go 里没有 while；只带一个条件的 for 就是它。",
]

