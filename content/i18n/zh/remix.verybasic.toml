story = "每张单子上有两个菜名，出菜口喊出较长的那个。喊出的名字是交给它的两个之一——从来不是拷贝。那条蟒蛇用 Python 点单。"
brief = '''
一个返回自己两个字符串参数之一的函数，返回的是指向调用方数据的引用。Rust 会问这个引用能用多久，答案以生命周期 `'a` 的形式写在签名里；Go 和 Python 有垃圾回收器，从来不问，所以同样的函数没有这样的标记。程序读入若干行，每行两个单词，打印每对中较长的那个，平局时取第一个。

在 Python 里，函数返回它的参数之一，只要还有名字指着这个对象，它就活着——没有生命周期，没有 `&`。签名把两个参数和结果都注解为 `str`，并像每个 `def` 一样以冒号结尾。是哪一行？

选出能做到这一点的那一行，然后把它敲在 `# FILL` 注释所在的位置。

```
input:  tea coffee
        milk bun
output: coffee
        milk
```
'''
hints = [
  "def longest(a: str, b: str) -> str: 下面写 return a if len(a) >= len(b) else b。",
  "a: &str 在 Python 里是语法错误；没有 &，也没有生命周期，因为这份活由回收器来干。",
]

