# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.verybasic.01.numbers-go"
title = "整数与浮点 — GO"
story = "一号桌。点菜单上两个数，账要分：每人几份，剩下几份，还有精确到分的每人份额。Gogo 用 Go 点单。"
brief = '''
整数和浮点数是不同的类型，两个整数相除得到整数：商向零取整，余数留给 `%`。要得到精确的份额，就先转换、再相除。程序读入 `a` 和 `b`，打印它们的和，然后在一行里打印商和余数，再把 `a / b` 作为浮点数打印，保留两位小数。

在 Go 里，两个 `int64` 之间的 `/` 是整数除法，`%` 是余数。`float64(a)` 是转换——长得像函数调用的类型转换——只有两边都是 `float64` 时，`/` 才做精确除法。`Printf` 里的 `%.2f` 打印两位小数。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "q := a / b 然后 r := a % b ——两者都还是 int64；f := float64(a) / float64(b) 先转换再相除。",
  "float64(a) / b 编译不过：Go 从不在一个表达式里混用 int64 和 float64。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.verybasic.02.numbers-rust"
title = "整数与浮点 — RUST"
story = "一号桌。点菜单上两个数，账要分：每人几份，剩下几份，还有精确到分的每人份额。Ferris 用 Rust 点单。"
brief = '''
整数和浮点数是不同的类型，两个整数相除得到整数：商向零取整，余数留给 `%`。要得到精确的份额，就先转换、再相除。程序读入 `a` 和 `b`，打印它们的和，然后在一行里打印商和余数，再把 `a / b` 作为浮点数打印，保留两位小数。

在 Rust 里，两个 `i64` 之间的 `/` 是整数除法，`%` 是余数。`a as f64` 是转换，它比 `/` 绑定得更紧，所以 `a as f64 / b as f64` 是两个浮点数相除。`println!` 里的 `{:.2}` 打印两位小数。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "let q = a / b; 然后 let r = a % b; ——都是 i64；let f = a as f64 / b as f64; 先转换再相除。",
  "a as f64 / b 编译不过：f64 不能除以 i64。",
]

