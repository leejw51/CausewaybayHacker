brief = '''
启动几个线程，给每个一份活，等它们全部做完，再把它们的结果合起来。程序读入若干数，切成三块，每块在自己的线程上求和，按块的顺序打印三个和，再打印总和。

在 Go 里，`go func(...) { ... }(args)` 启动一个 goroutine，`sync.WaitGroup` 给它们计数：每次启动之前 `wg.Add(1)`，里面第一件事 `defer wg.Done()`，循环之后 `wg.Wait()`。块和它的下标作为参数传进去，这样每个 goroutine 都有自己的一份。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4 5 6 7
output: 6 15 7
        28
```
'''
hints = [
  "go func(i int, chunk []int64) { defer wg.Done(); ... }(i, chunk) ——前面的 go 让它成为 goroutine；没有它，字面量只是直接运行，而没有 Done，Wait 永远不会返回。",
  "不带参数的 go func() { 和末尾的 (i, chunk) 对不上：too many arguments。",
]

