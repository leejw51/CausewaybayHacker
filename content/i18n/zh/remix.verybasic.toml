Rust 写成 `while cond { }`，自增是 `steps += 1;` ——没有 `++`。里面的 `if` 也是表达式，所以 `n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };` 也行得通。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  6
output: 8
        16
```
'''
hints = [
  "while n != 1 { 然后把 steps += 1; 作为里面的第一行。",
  "steps++ 不是 Rust；+= 1 才是。",
]

