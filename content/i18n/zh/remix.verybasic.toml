[[quest]]
id    = "remix.verybasic.03.numbers-python"
title = "整数与浮点 — PYTHON"
story = "一号桌。点菜单上两个数，账要分：每人几份，剩下几份，还有精确到分的每人份额。那条蟒蛇用 Python 点单。"
brief = '''
整数和浮点数是不同的类型，两个整数相除得到整数：商向零取整，余数留给 `%`。要得到精确的份额，就先转换、再相除。程序读入 `a` 和 `b`，打印它们的和，然后在一行里打印商和余数，再把 `a / b` 作为浮点数打印，保留两位小数。

在 Python 里，`/` 总是得到浮点数，哪怕两边都是 int，所以精确份额根本不需要转换。整数商是*另一个*运算符 `//`，`%` 是余数。`f"{f:.2f}"` 打印两位小数。

选出能做到这一点的那一行，然后把它敲在 `# FILL` 注释所在的位置。

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "整数部分用 q = a // b 然后 r = a % b；f = a / b 本来就是浮点数。",
  "float(a) / b 也行，写惯 Go 或 Rust 的手会这么敲；在 Python 里没必要。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.verybasic.04.strings-go"
title = "字符串 — GO"
story = "点菜单是一行名字，中间用逗号隔开，厨房要把它们喊出来、分开，再按字母数一数。Gogo 用 Go 点单。"
brief = '''
字符串按分隔符切成几段，几段再用另一个分隔符拼回去，整个字符串用一个调用转成大写。陷阱在长度：带重音的名字字节数比字符数多，而两者之中只有一个是人会去数的。程序读入一行用逗号分隔的名字，打印名字的个数、转成大写并用 ` | ` 拼接的名字，以及这一行的字符数。

在 Go 里，活儿由 `strings` 包来干：`strings.Split` 给出一个 `[]string`，`strings.Join` 把它拼回去，`strings.ToUpper` 返回一个新字符串。`len(s)` 是字节数；字符数是 `utf8.RuneCountInString(s)`，因为 Go 的字符串是字节，而 rune 是它解码出来的东西。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "strings.Split(line, \",\") 然后 strings.ToUpper(strings.Join(names, \" | \"))；字符数是 utf8.RuneCountInString(line)。",
  "len(line) 是字节数：Zoë 有四个字节、三个字符，隐藏用例知道这一点。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.verybasic.05.strings-rust"
title = "字符串 — RUST"
story = "点菜单是一行名字，中间用逗号隔开，厨房要把它们喊出来、分开，再按字母数一数。Ferris 用 Rust 点单。"
brief = '''
字符串按分隔符切成几段，几段再用另一个分隔符拼回去，整个字符串用一个调用转成大写。陷阱在长度：带重音的名字字节数比字符数多，而两者之中只有一个是人会去数的。程序读入一行用逗号分隔的名字，打印名字的个数、转成大写并用 ` | ` 拼接的名字，以及这一行的字符数。

在 Rust 里，`split(',')` 是一个迭代器，所以要 `collect` 成一个 `Vec<&str>`；在这个 vec 上 `join(" | ")` 得到一个 `String`，`to_uppercase()` 再得到另一个。`len()` 是字节数；字符数是 `chars().count()`，因为 `&str` 是 UTF-8 字节，而 `chars()` 把它们解码。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "let names: Vec<&str> = line.split(',').collect(); 然后 names.join(\" | \").to_uppercase()；字符数是 line.chars().count()。",
  "line.len() 是字节数：Zoë 有四个字节、三个字符，隐藏用例知道这一点。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.verybasic.06.strings-python"
title = "字符串 — PYTHON"
story = "点菜单是一行名字，中间用逗号隔开，厨房要把它们喊出来、分开，再按字母数一数。那条蟒蛇用 Python 点单。"
brief = '''
字符串按分隔符切成几段，几段再用另一个分隔符拼回去，整个字符串用一个调用转成大写。陷阱在长度：带重音的名字字节数比字符数多，而两者之中只有一个是人会去数的。程序读入一行用逗号分隔的名字，打印名字的个数、转成大写并用 ` | ` 拼接的名字，以及这一行的字符数。

在 Python 里，方法都在字符串上：`line.split(",")` 给出一个列表，`" | ".join(names)` 是在*分隔符*上调用的，`.upper()` 返回一个新字符串。`len(s)` 数的是字符而不是字节，因为 Python 的 `str` 已经解码过了——字节数要用 `len(s.encode())`。

选出能做到这一点的那一行，然后把它敲在 `# FILL` 注释所在的位置。

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "names = line.split(\",\") 然后 \" | \".join(names).upper()；字符数是 len(line)。",
  "len(line.encode()) 是字节数：Zoë 有四个字节、三个字符，隐藏用例知道这一点。",
]

