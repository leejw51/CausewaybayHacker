[[quest]]
id    = "remix.verybasic.13.structs-go"
title = "结构体 — GO"
story = "账单上的每一行是一个名字、一个价钱和一个数量，而知道怎么算一行合计的，正是这一行自己。Gogo 用 Go 点单。"
brief = '''
结构体把几个有名字的字段组成一个值，方法是挂在这个类型上的函数，手里拿着这个值作为 `self` / 接收者。程序读入 `name price qty` 的若干行，每行打印名字和这一行的合计，最后打印总计。

在 Go 里，方法是名字前面带一个接收者的函数：`func (it Item) Total() int64`。接收者是结构体的一份拷贝；`(it *Item)` 则是一个指针。导出的字段和方法以大写字母开头。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "func (it Item) Total() int64 { return it.Price * it.Qty } ——接收者放在名字前面单独的括号里。",
  "func Total(it Item) 是一个普通函数；it.Total() 找不到它。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "remix.verybasic.14.structs-rust"
title = "结构体 — RUST"
story = "账单上的每一行是一个名字、一个价钱和一个数量，而知道怎么算一行合计的，正是这一行自己。Ferris 用 Rust 点单。"
brief = '''
结构体把几个有名字的字段组成一个值，方法是挂在这个类型上的函数，手里拿着这个值作为 `self` / 接收者。程序读入 `name price qty` 的若干行，每行打印名字和这一行的合计，最后打印总计。

在 Rust 里，方法住在 `impl Item { }` 块里，`&self` 表示方法借用结构体，而不是把它拿走。`self.price * self.qty` 就是函数体；最后一个表达式就是返回值，所以没有 `return`，也没有分号。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tea 12 3
        bun 8 2
output: tea 36
        bun 16
        52
```
'''
hints = [
  "impl Item { fn total(&self) -> i64 { self.price * self.qty } } —— &self 是借用，函数体是一个表达式。",
  "fn total(self) 按值拿走 Item，通过 &items 调用它就是 E0507：不能从借用里移出。",
]

