id    = "remix.verybasic.53.mutex-rust"
title = "互斥锁 — RUST"
story = "墙上只有一个记数，每位熟客都往上加一千次；粉笔必须干干净净地交接，否则数字就错了。Ferris 用 Rust 点单。"
brief = '''
几个线程往同一个数上加，除非每次加的时候都把这个数锁住，否则就是数据竞争。互斥锁就是那把锁：拿到它，改值，放开它。程序读入若干数，每个数启动一个线程，每个线程在锁的保护下把自己的数往共享计数器上加一千次，最后打印计数器。

在 Rust 里，计数器*就是*锁：`Arc<Mutex<i64>>`，通过 `Arc::clone` 共享，通过 `.lock().unwrap()` 打开，它返回一个守卫，解引用就是那个数，并在语句结束、守卫被丢弃时解锁。`*guard += x` 通过它写入；不拿锁就没有办法碰到那个数。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3
output: 6000
```
'''
hints = [
  "在 spawn 之前 let counter = Arc::clone(&counter);，然后在循环里 *counter.lock().unwrap() += x;。",
  "不带 * 的 counter.lock().unwrap() += x 是 E0368：守卫不是数，它解引用之后才是。",
]

