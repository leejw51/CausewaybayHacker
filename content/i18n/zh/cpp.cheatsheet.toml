# C++ LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC
# §12.1): the prose of `content/cpp/cheatsheet.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live
# in the English pack, and are never translated. Code blocks, identifiers
# and printed strings are copied verbatim.

pack   = "cpp.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet.01.fast-io"
title = "打开闸门"
story = "06:00，避风塘。一百万行鱼价同时涌进来，默认的流太客气，跟不上。"
brief = '''
在 `main` 的第一行、任何输入输出之前：让 `cin`/`cout` 不再与 C 的 stdio 同步，并把 `cin` 与 `cout` 解绑，这样每次读取都不会刷新输出。

是哪一行？
'''
hints = [
  "关闭同步用 `false`；`tie` 接收要刷新的流的指针，`nullptr` 表示没有。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.cheatsheet.02.getline"
title = "连空格一起"
story = "送货单上的地址是 'Flat 7, 32 Percival Street'——里面的每个空格都有用。"
brief = '''
`std::string line;`——把输入的**一整行**连同空格读进去。
'''
hints = [
  "`>>` 遇到第一个空白就停。这个自由函数先接收流，再接收字符串。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.cheatsheet.03.fixed"
title = "两位小数"
story = "轩尼诗道的找换店，每个汇率都精确显示到小数点后两位。"
brief = '''
`double x = 3.14159;`，并且已包含 `<iomanip>`。输出 `3.14`——**小数点后**正好两位。
'''
hints = [
  "单独用 `setprecision` 数的是有效数字。加上 `std::fixed` 才数小数位。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.cheatsheet.04.long-long"
title = "宽乘积"
story = "铜锣湾拍卖行里，两笔十亿元的出价相乘。int 装不下这个答案。"
brief = '''
`int a, b;` 各自最大 10^9。把 `a` 乘 `b` 存进 `p`，不能溢出。
'''
hints = [
  "乘法按操作数的类型计算。要在 `*` 之前把其中一个变宽，而不是之后。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.cheatsheet.05.range-for"
title = "写回去"
story = "崇光游戏机中心的双倍积分之夜。要改的是记分板上的分数本身，不是它的副本。"
brief = '''
把 `std::vector<int> v` 的每个元素**就地**翻倍。
'''
hints = [
  "`auto x` 是每个元素的副本。要改向量本身，就绑定一个引用。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.cheatsheet.06.grid"
title = "楼层平面图"
story = "皇室堡，一层一层、一铺一铺：一张 n×m 的平面图，每个单位都空着。"
brief = '''
`n` 和 `m` 在运行时读入。建立 `g`：一个 `int` 的 `n`×`m` 网格，每格都是 `0`，可以用 `g[i][j]` 访问。
'''
hints = [
  "构造函数的第二个参数是 `n` 行中每一行的初始值——所以给它一整行。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.cheatsheet.07.desc"
title = "大的在前"
story = "百德新街的租金牌，把最贵的铺位列在最上面。"
brief = '''
`std::vector<int> v` 里的数字没有特定顺序。把它按**降序**排序。
'''
hints = [
  "默认是升序；`sort` 的第三个参数把顺序反过来——排完再反转是多走一趟。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.cheatsheet.08.count"
title = "计数"
story = "茶餐厅按桌数奶茶，新的一桌从零开始。"
brief = '''
`std::unordered_map<std::string, int> cnt;`——给单词 `w` 的计数加一。还没见过的单词从 0 开始。
'''
hints = [
  "`operator[]` 会用值初始化的 `int`（也就是 0）插入不存在的键。`at` 则会抛异常。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.cheatsheet.09.find"
title = "只看不写"
story = "利园大堂的保安核对访客名单。他不准在上面写字。"
brief = '''
`m` 是 `std::map<std::string, int>`。检查键 `k` 是否存在——**不要**把它加进映射。
'''
hints = [
  "键不存在时，`m[k]` 会插入一个默认值。`find` 则返回 `end()`。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.cheatsheet.10.min-heap"
title = "小的在上"
story = "登龙街的小巴站先开最短的那一程。priority_queue 只会把最大的放在顶上。"
brief = '''
`std::priority_queue` 默认先弹出**最大**的。声明 `pq`，使 `pq.top()` 是**最小**的 `int`。
'''
hints = [
  "模板有三个参数：类型、容器，然后是比较器。中间那个不能跳过。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.cheatsheet.11.erase-remove"
title = "扫掉零"
story = "渣甸坊摊档收档时间。空箱子搬走，这一排就变短了。"
brief = '''
从 `std::vector<int> v` 中删除所有 `0`，让 `v.size()` 变小。
'''
hints = [
  "`std::remove` 只是把要留下的元素往前挪，并返回新的结尾；再把从那里到旧结尾的区间 `erase` 掉。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.cheatsheet.12.stoi"
title = "坏数字"
story = "7-32 室的账簿里有一格写着 'abc'。解析器抛出异常，总得有人接住它。"
brief = '''
`std::string s` 可能是 `"abc"`，这时 `std::stoi` 会抛异常。把 `int n` 设为解析出的值；如果 `s` 不是数字，就设为 `-1`。
'''
hints = [
  "`catch` 只匹配被抛出的类型。没有数字时，`stoi` 抛出的是 `std::invalid_argument`。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.cheatsheet.13.words"
title = "一词一词"
story = "午炮的日志行写着 'fired   12:00  Jardine'——词与词之间的空隙不总是一个空格宽。"
brief = '''
`std::string line` 存着用**一个或多个**空格隔开的单词。已包含 `<sstream>`，并已声明 `std::string w;` 和 `std::vector<std::string> words;`。把每个单词按顺序推进 `words`，其中不能有空字符串。
'''
hints = [
  "对字符串流用 `>>` 会跳过每个单词前面的任意一段空白，并在下一段空白处停下——按分隔符读取则什么都不跳过。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.cheatsheet.14.capture"
title = "累计总额"
story = "避风塘的舢舨渡船只有一个钱箱，每次上船的钱都得落进那个箱子——而不是它的复印件。"
brief = '''
`int total = 0;` 是 `main` 里的局部变量。定义 `add`，使 `add(5);` 把 `5` 加到**那个 `total` 本身**上——之后 `total` 读出来是 `5`。
'''
hints = [
  "lambda 看不见外面的任何东西，除非方括号里写明；而按值捕获是只读的，除非你另外要求——即便如此它也只是一个副本。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.cheatsheet.15.bindings"
title = "键和值，各有其名"
story = "怡和街的租金检讨：账簿上每家店铺都加一，而要改的是账簿本身。"
brief = '''
`std::map<std::string, int> m;`——给 **`m` 里存着的每一个值**加 `1`，并在循环头里直接把键叫 `k`、值叫 `v`（不用 `.first` 或 `.second`）。
'''
hints = [
  "方括号把每一对拆成两个名字。这些名字是映射自己那一对的别名，还是它的副本，取决于它们前面写的是什么。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.cheatsheet.16.sort-by"
title = "按第二个排"
story = "游艇会的滑道绞车日志把每个船壳号和船长的名字配成一对，港务长要按船长的字母顺序排。"
brief = '''
`std::vector<std::pair<int, std::string>> v;`——下面几行是 `std::sort(v.begin(), v.end(), …)` 的第三个参数。选出按**字符串**从 A 到 Z 给 `v` 排序的那一个。
'''
hints = [
  "比较器只回答一个问题——`a` 排在 `b` 前面吗？——针对你关心的那个成员，用严格的 `<`。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.cheatsheet.17.ordering"
title = "集合里的一席"
story = "避风塘里的每条舢舨都是一个 (行, 列) 泊位，港务处把它们存在一个 std::set 里——它拒绝任何无法排序的东西。"
brief = '''
```cpp
struct Pt { int r, c; };
std::set<Pt> taken;
```

这段现在还编译不过。在 `Pt` 里加**一个成员**，使 `taken` 可以工作，并按 `r` 排序、`r` 相同时再按 `c` 排。C++20，已包含 `<tuple>`。
'''
hints = [
  "set 比较的是 `const` 元素，而字典序意味着只有第一个字段相同时第二个字段才起作用。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.cheatsheet.18.optional"
title = "也许是个数"
story = "维多利亚公园喷泉下的泵房报出一个压力读数，传感器拔掉时则什么也没有——而显示屏绝不能因为“没有”而崩溃。"
brief = '''
`std::optional<int> r = read_sensor();`——把 `int n` 设为读数，`r` 里什么也没有时设为 `-1`。任何东西都不能抛异常。
'''
hints = [
  "optional 不是数，所以它不能和一个数并排放进 `?:`。它的某个成员把后备值作为参数接收。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.cheatsheet.19.lower-bound"
title = "它该去的位置"
story = "怡和街的电车站牌按顺序列出发车分钟数，问题是下一班电车占哪一格。"
brief = '''
`std::vector<int> v` 按升序排好，`int x` 已给定。把 `int i` 设为**第一个不小于** `x` 的元素的下标——所以当每个元素都更小时，`i` 等于 `v.size()`；当 `x` 出现时，它是 `x` 的第一个下标。
'''
hints = [
  "这个算法交回的是迭代器，不是数；迭代器减去开头就是距离。还要留意是哪一个 bound：另一个会跳过所有的 `x`。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.cheatsheet.20.wide-sum"
title = "溢出的总和"
story = "正午，炮声响起，隧道收费机把二十万笔、每笔高达十亿的通行费加起来——一个任何 int 都没装下过的总数。"
brief = '''
`std::vector<int> v` 有 2·10^5 个元素，每个最大 10^9，并且已包含 `<numeric>`。把**精确的**总和存进 `long long s`。
'''
hints = [
  "累加值的类型是初始值的类型，不是 `s` 的类型——每一次相加都先在那个类型里发生，然后才存起来。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.cheatsheet.21.push-back"
title = "堆上再加一个"
story = "一个新箱子落在渣甸坊档口的最后面，而这一排箱子是一个必须长大一格的 vector。"
brief = '''
`std::vector<int> v;` 和 `int x;` —— 把 `x` 加到 `v` 的**末尾**，使 `v.size()` 增加一，而 `v.back()` 是 `x`。
'''
hints = [
  "vector 只在一端生长，而负责这件事的成员在名字里说明了是哪一端 —— 单独的 `append` 和 `push` 是别的语言的词。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.cheatsheet.22.queue-pop"
title = "下一位"
story = "登龙街的小巴队伍：排在最前面的人上车，队伍就短了一个。"
brief = '''
`std::queue<int> q;` 非空。把**队首**元素存进 `int x`，**并把它从 `q` 里移除**，使 `q.size()` 减少一。
'''
hints = [
  "在标准容器里，移除和读取是两个不同的成员 —— 负责移除的那个什么都不交回来。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.cheatsheet.23.reverse"
title = "从后往前"
story = "电车在铜锣湾总站掉头，而它刚刚停靠过的站点列表得反过来读。"
brief = '''
`std::vector<int> v` 存着 `3, 1, 2`。把它**原地**反转，使它读作 `2, 1, 3`。已包含 `<algorithm>`。
'''
hints = [
  "`vector` 没有做这件事的成员；这个算法接收一对迭代器。而在反向迭代器上排序只是排序 —— 它不会把顺序倒过来。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.cheatsheet.24.copy"
title = "一份副本，不是一扇窗"
story = "利园大堂为夜班警卫多打印一份访客名单，而他在自己那份上涂写的东西绝不能出现在日班那份上。"
brief = '''
`std::vector<int> a{1, 2};` —— 让 `b` 成为 `a` 的一份**独立**副本，使 `b.push_back(3);` 之后 vector `a` 仍有 2 个元素，而 `b` 有 3 个。
'''
hints = [
  "vector 靠普通赋值复制自己。声明里的 `&` 会给同一个 vector 起第二个名字，而 `std::move` 会把被移动的那个掏空。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.cheatsheet.25.digit"
title = "字符背后的数字"
story = "皇室堡门上漆的铺号是一个 '7'，而电梯控制器要的是数字七，不是这个字形的编码。"
brief = '''
`char c = '7';` —— 把 `int d` 设为数字 `7`（不是 `55`，那是字符的编码）。
'''
hints = [
  "char 本来就是一个小整数，所以强制转换只是给编码换个名字。数字在表里是挨着排的 —— 减去它们起头的那一个。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "cpp.cheatsheet.26.real-division"
title = "半块钱"
story = "在轩尼诗道的找换店，七块钱两个人分是三块五 —— 除非收银机像 int 那样做除法。"
brief = '''
`int a = 7, b = 2;` —— 把 `double q` 设为 `3.5`。
'''
hints = [
  "除法在操作数的类型里进行，先于任何存储或转换。要拓宽的是一个操作数，不是结果。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.cheatsheet.27.max-mixed"
title = "两种类型里较大的"
story = "百德新街的租金牌板上，一家铺子以整数元计，隔壁那家带半块 —— 而要的是两者中较高的。"
brief = '''
`int a = 2; double b = 2.5;` —— 把 `double m` 设为两者中较大的，使 `m` 为 `2.5`。已包含 `<algorithm>`。
'''
hints = [
  "`std::max` 是只有一个类型参数的模板，两个实参类型不一致时它拒绝猜测。把类型告诉它 —— 能保住那半块的那个类型。",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet.28.enum-class"
title = "哪条线"
story = "铜锣湾站的港铁牌板给各条线路起了名字，而站台代码想问起其中一条，又不想把它拼成一个数字。"
brief = '''
```cpp
enum class Line { Island, TsuenWan };
Line l = read_line();
```

开启一个 `if`，恰好当 `l` 是这个枚举的第一个成员时才进入。
'''
hints = [
  "有作用域的枚举把名字放在枚举内部，而且它不会自己变成 `int` 或字符串。",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet.29.substr"
title = "中间那个词"
story = "送货单上的地址写着 'Causeway Bay, HK'，而快递员只想要从第十个字符开始的那个词。"
brief = '''
`std::string s = "Causeway Bay, HK";` —— 把 `std::string t` 设为 `"Bay"`，即从下标 `9` 开始的三个字符。
'''
hints = [
  "第二个参数不是这一段结束的位置。交给它一个结束下标，你得到的是直到句尾的所有内容。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet.30.positive-mod"
title = "绕成了负数"
story = "午炮的环形缓冲区有三个槽位，从零号槽往回退七步必须落在二号槽 —— 而不是负一号槽，鸭嘴兽一上午都坐在那上面。"
brief = '''
`int x, m;`，其中 `m > 0`；`x` 可以是**任意** `int`，包括 `-7` 或 `-100`。把 `int r` 设为 `x` 除以 `m` 的、落在 `0..m-1` 范围内的余数 —— 对 `x = -7, m = 3` 来说是 `2`。
'''
hints = [
  "在 C++ 里 `%` 的符号跟随被除数，所以负的 `x` 得到负的余数 —— 离正确的槽位差一步。加一次 `m` 并不是对每个 `x` 都够；加上之后再取一次余。",
]
