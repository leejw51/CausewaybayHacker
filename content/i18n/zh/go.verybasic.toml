[[quest]]
id    = "go.verybasic.27.binary-tree"
title = "NULLPTR"
story = "幸运麦 11:55 的前台收银机把每笔订单按号码归进一棵树，左枝归好了又被扔掉。"
brief = '''
`insert` 把 `v` 放进以 `n` 为根的子树，并返回这棵子树的根。`if` 分支处理较小的 `v`：递归进左子节点，把返回的东西存起来。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.Left = insert(n.Left, v) — 递归调用返回子树的根，所以要赋回去。",
  "单独的 insert(n.Left, v) 会把新节点扔掉；什么也没存下它。",
]
