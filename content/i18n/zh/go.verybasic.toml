[[quest]]
id    = "go.verybasic.17.stack"
title = "从顶上拿两个"
story = "碟子在传菜口叠起来，从顶上拿；收银机把顶上的碟子读了两次却从不拿走。"
brief = '''
`stack` 是一个当栈用的切片。`top` 从它的末尾读出；接下来那一行必须通过重新切片把最后一个元素去掉。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
