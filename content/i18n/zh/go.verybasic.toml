# GO LAND — VERY BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/go/verybasic.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code and stay English. Code blocks,
# identifiers, sample input and output and the exact strings a program must print
# are the English pack's and are copied verbatim, never translated.

pack   = "go.verybasic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.verybasic.01.print"
title = "第一行"
story = "天后，06:00，卷闸拉起一半。售票机的屏幕本该打招呼，却打印了一行空白。"
brief = '''
一个只说一件事的程序需要 `fmt` 里的一个调用：打印它的参数并结束这一行的那个。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  
output: hello, causewaybay
```
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — 双引号里的字符串，小写，一个逗号。",
  "没有 fmt 的 print 写到 stderr，而没有 ln 的 Print 不结束这一行。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.verybasic.02.int-types"
title = "宽的数"
story = "天后的八达通读卡器用 int32 数拍卡，全天的总数装不下。"
brief = '''
`n` 是一个 `int32`。要把它乘以四十亿，先得换成更宽的类型：把 `n` 转成 `int64`，然后再乘。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7
output: 28000000000
```
'''
hints = [
  "wide := int64(n) * 4000000000 — 先转换，再在宽类型里相乘。",
  "n * 4000000000 在 int32 里计算，常量装不下，所以编译不过。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.verybasic.03.floats"
title = "小数车费"
story = "牌子上的车费是文本。读卡器得先把它变成 float64 才能翻倍。"
brief = '''
`s` 是字符串形式的车费。`strconv` 用一个返回数字和错误的调用把它变成 `float64`；留下数字，丢掉错误。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  0.1
output: 0.100000000
        0.20
```
'''
hints = [
  "x, _ := strconv.ParseFloat(s, 64) — 两个返回值，64 是你要的宽度。",
  "用 32 会先把值舍入成 float32；第九位小数就看得出来。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.verybasic.04.strings"
title = "大写的站名"
story = "天后的月台牌要大写的站名，读卡器手里只有小写的。"
brief = '''
`line` 是一行文本。`strings` 包里有一个函数返回它的大写形式。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tin hau
output: TIN HAU
        7
```
'''
hints = [
  "up := strings.ToUpper(line) — 一个接收字符串的包函数，不是字符串上的方法。",
  "Go 的字符串没有大小写方法；strings.Title 是把每个词的首字母大写，不是一回事。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.verybasic.05.bool-if"
title = "双数车厢"
story = "双数车厢停在宽月台；显示屏每隔一班就挑错。"
brief = '''
`n` 是车厢号。当 `n` 被二整除没有余数时程序打印 `even`，否则打印 `odd`。`if` 那一行需要余数测试。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: even
```
'''
hints = [
  "if n%2 == 0 { — % 是余数，== 是比较。",
  "单个 = 是赋值，而 n/2 是商，不是余数。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.verybasic.06.loops"
title = "数站"
story = "这条线有 n 个站，计数板从 1 加到 n；它跑的循环差一个就停了。"
brief = '''
`n` 已读入。循环必须让 `i` 从 1 跑到 `n`（含），把每个 `i` 加进 `sum`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5
output: 15
```
'''
hints = [
  "for i := 1; i <= n; i++ { — 三个子句，<= 把 n 留在里面。",
  "没有 := 的 i = 1 什么也没声明，而 < n 早停了一步。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.verybasic.07.functions"
title = "骑手的费率"
story = "每单送货付五块，每晚再加一次三块奖金。费率函数目前什么也不返回。"
brief = '''
`fare` 接收送单数，必须返回每单五块加三块。写出它的 `return` 那一行。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: 23
```
'''
hints = [
  "return rides*5 + 3 — 先乘，再加奖金。",
  "rides * (5 + 3) 是每单八块；rides + 5*3 是往单数上加十五。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.verybasic.08.structs"
title = "一个摊位，两个字段"
story = "幸运麦的摊位卡有名字和价格，点单屏造出来的却两个字段都是空的。"
brief = '''
`Stall` 有字段 `Name` 和 `Price`。用带键的结构体字面量，从 `name` 和 `price` 造出一个。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  noodles 12
output: noodles 24
```
'''
hints = [
  "s := Stall{Name: name, Price: price} — 字段名，冒号，逗号。",
  "三个值多了一个，而且字段有类型，值必须匹配。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.verybasic.09.struct-method"
title = "摊位的总额"
story = "摊位知道自己的价格和数量；它的 Total 方法对每一单都返回零。"
brief = '''
`Total` 是 `Stall` 上的方法。它的 `return` 那一行必须给出价格乘数量，通过接收者 `s` 读取。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 4
output: 12
```
'''
hints = [
  "return s.Price * s.Qty — 字段通过接收者访问。",
  "单独的 Price 不在作用域里；接收者 s 才是方法看到自己结构体的方式。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.verybasic.10.enums"
title = "第三条线"
story = "换乘站的牌子把线路编成 0、1、2，在叫出名字之前得先把数字变回线路。"
brief = '''
`Line` 是一个 `iota` 类型，有 `Island`、`TsuenWan`、`KwunTong`。把整数 `n` 变成一个 `Line`，下面的 `switch` 才能比较它。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  2
output: kwuntong
```
'''
hints = [
  "line := Line(n) — 一次转换，写法像在类型上做函数调用。",
  "line := n 是 int，而 switch 拿它和 Line 常量比较，编译不过。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.verybasic.11.vector"
title = "车厢清单"
story = "从线路上传来的每个车厢号都该接到清单末尾；清单却一直是空的。"
brief = '''
`xs` 是一个 int 切片。在循环里，用那个让切片增长的内建函数把每个 `v` 接到它的末尾。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs = append(xs, v) — append 返回增长后的切片，所以要赋回去。",
  "切片没有方法；append 是内建函数，第一个参数是切片。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.verybasic.12.vector-edit"
title = "第二节车厢摘掉"
story = "第二节车厢从列车上摘了下来。清单要么删错了，要么什么也没删。"
brief = '''
`xs` 装着这一行的整数，至少四个。把下标 1 的元素删掉：把它前面的切片和后面的切片接起来。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 3 4 1
```
'''
hints = [
  "xs = append(xs[:1], xs[2:]...) — ... 把尾巴展开进 append。",
  "没有 ...，append 拿到的是一个切片，而它要的是 int，编译不过。",
]

