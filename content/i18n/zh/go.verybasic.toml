选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 4 1
output: 3
        1
        2
```
'''
hints = [
  "queue = queue[1:] — 从第二个元素起的全部。",
  "queue[:1] 只留下前端，而 queue[0:] 什么都留着。",
]

