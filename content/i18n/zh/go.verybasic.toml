# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.verybasic.25.threads"
title = "一单一骑手"
story = "八份订单同时骑着八辆车出了厨房，看板却谁也不等。"
brief = '''
每个数一个 goroutine：把它的 `x` 平方存进 `results[i]`，完成时通知 `WaitGroup`。用 `go` 关键字启动它，把 `i` 和 `x` 传进去。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
