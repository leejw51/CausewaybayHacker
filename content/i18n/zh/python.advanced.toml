[[quest]]
id    = "python.advanced.08.exceptions"
title = "不是数字的那一行"
story = "鱼档的秤打出一列重量，中间夹着某个人的电话号码。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行。每一行本该是一个整数。

对每一行，要么输出它的值的两倍，要么在解析不了时输出 `BAD <line>`。最后输出 `SUM <total>`，其中 total
是你输出过的那些值的和。

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")` 会抛出 `ValueError`。这是 Python 告诉你转换失败的唯一方式——没有 `Result`，没有 `(value, ok)`；失败就是一个异常，而期望得到数字的那段代码必须用
`try`/`except ValueError` 说清楚它打算怎么办。

捕获 **`ValueError`**，而不是 `Exception`。光秃秃的 `except:` 还会把
`KeyboardInterrupt` 和你自己代码里的拼写错误一起吞掉，程序就是这样学会悄无声息地失败的。
'''
hints = [
  "起始代码在 xx 上死于 ValueError: invalid literal for int() with base 10。这条消息就是你要捕获的那个异常。",
  "把 try 块保持得很小：只有可能失败的那个调用放在里面，print 和累加放在后面。",
  "except 里的 continue 会跳过这一行余下的循环体，于是坏行什么也不会加进去。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "python.advanced.09.comprehensions"
title = "宝灵顿道一趟走完"
story = "亚历克斯说三个 for 循环就能做到。过道只容一个人，地板是湿的；你只能走一趟。"
brief = '''
标准输入是一行整数，用空格分隔。

输出三行：

1. 所有偶数值的和（没有则为 `0`）
2. 每个大于 `10` 的值，翻倍，按原顺序，用单个空格连接——没有则输出
   `-`
3. 一共有多少个不同的值

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

用推导式，不要用索引循环：`sum` 里放一个生成器表达式，第二行用一个带 `if`
的列表推导式，第三行用一个集合推导式。`if` 放在末尾负责过滤；放在前面的表达式负责变换。

`" ".join(...)` 要的是字符串，所以第二个推导式必须产出
`str(v * 2)`，而不是 `v * 2`。那条 `TypeError: sequence item 0: expected str
instance, int found` 是每个人在这一行都会遇到的。
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — 生成器表达式作为唯一参数时不需要额外的括号。",
  "[str(v * 2) for v in nums if v > 10] — 前面变换，后面过滤。",
  "{v for v in nums} 是集合推导式；set(nums) 是同一回事，这里两种都行。",
]

