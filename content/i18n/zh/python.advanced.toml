# ---------------------------------------------------------------- 22
[[quest]]
id    = "python.advanced.05.asyncio"
title = "async 到底在哪里跑"
story = "阿薇写了四年 `async def`，却一次也没见过驱动它的那个东西。地库的点单板只有一个循环，每个档口轮流上去用。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

写一个 `async def double(value)`，它向事件循环让出一次——`await asyncio.sleep(0)`——然后返回值的两倍。用
`asyncio.gather` 把全部 `n` 个一起跑起来，按输入顺序输出每个结果，然后输出
`SUM <total>` 和 `TASKS <n>`。

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

调用一个 `async def` 并不会运行它。它构建一个**协程对象**并交还给你，在有东西 await
它之前，里面什么都不会发生。起始代码的列表是三个没被 await 的协程，Python 在 stderr
上这样说——`RuntimeWarning: coroutine 'double' was never awaited`——而输出是三行
`<coroutine object double at 0x...>`。

`gather` 接收这些协程，把它们全部调度到那一个循环上，并**按你传入的顺序**返回它们的结果，不管它们以什么顺序完成。这就是选它而不是手写一串
`await` 循环的全部理由：那个循环是正确的、顺序的，而 `gather` 是正确的、交错的。

这里只有一个线程。`await`
是协程把线程交还给循环、好让别的协程使用的那个点。没有任何东西并行运行；一切**轮流**运行，在它们声明过可以停下的地方停下。
'''
hints = [
  "await asyncio.gather(*coroutines) — 星号把列表展开成参数，而 await 才是让它们运行的东西。",
  "asyncio.run(...) 是执行者：它建好循环，把一个协程跑到完成，然后关闭循环。每个程序有一个，在最顶层。",
  "gather 按参数顺序返回结果。如果你需要按完成顺序拿到它们，那是 asyncio.as_completed，那时你得自己带上索引，和线程池那题一模一样。",
]

