'''
hints = [
  "在 Thread 上写 args=(i, v)。target 是以 square(*args) 的方式调用的，而起始代码什么都没传。",
  "先启动每个线程，再对每个线程 join。在同一次循环迭代里既启动又 join 是正确的，只不过它们会一个一个地跑。",
  "results 是对 main 局部列表的闭包；嵌套函数看到的是同一个列表，所以写入在 join 之后是可见的。",
]

