[[quest]]
id    = "python.advanced.17.none"
title = "05:59 的价格牌"
story = "05:59，宝灵顿道。价格牌向记事本查一个还没开档的档口，记事本回答了一个“没有”，价格牌就把这个“没有”的价钱打了出来。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<STALL> <CENTS>`——已经开档的档口——然后是一个数量 `q` 和
`q` 个要查询的档口名。

对每个查询输出 `<STALL> <cents>`，如果该档口没开则输出 `<STALL> NONE`。然后输出 `MISSING <k>` 和
`CHEAPEST <STALL>`——已开档口中价格最低的那个，价格相同时按名字——如果一家都没开，输出 `CHEAPEST NONE`。

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

起始代码在 `CHAN` 上崩溃：

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

这一行就是 boss。它从不指向 bug 本身。它指向一个 `None` 最终被*使用*的地方，而那里离它被*制造出来*的地方可以有任意远——起始代码里，它是在两个不同的地方被制造出来的。`lookup`
对不存在的档口按设计返回 `None`，而调用方不问一声就从它上面读 `.cents`。`cheapest`
有一条路径上没有 `return`，于是它**隐式地**返回 `None`，调用方又对它做了同样的事。

Python 里每个函数都会返回点什么。一个走到末尾的函数返回 `None`。不带默认值的 `dict.get` 返回 `None`。两者在当时都不是错误；两者稍后都会变成错误。修法两次都一样：可能收到
`None` 的代码在碰属性之前先用 `is None` 检查。不是 `== None`，也不是 `if not stall`——价格为 `0`
的档口是真实存在的档口，`not` 会把它扔掉。

让 `lookup` 和 `cheapest` **有意地**返回 `Optional[Stall]`，在注解里说明，并在 `None`
落地的地方处理它。
'''
hints = [
  "从下往上读回溯：AttributeError 在 print 那一行，但 None 是前一行从 lookup 出来的，再往前是从 board.get 出来的。",
  "if stall is None: 就是那个检查。用 `is`，因为 None 是单个对象，身份比较才是诚实的比较；`==` 可以被重载，而 `not stall` 对一个为假但真实存在的值是错的。",
  "cheapest 有两条路径，只有一条有 return。Python 不会为此警告；它把 None 交给调用方，让调用方自己去发现。给空的情况一个显式的 `return None`，读者才能看出这是有意为之。",
  "注解里的 Optional[Stall] 不会被解释器强制执行。它是写给读者和类型检查器的一条说明，而读者才是那个赶时间的人。",
]

