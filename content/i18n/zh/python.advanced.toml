# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.conversions"
title = "三种形态，一个名字"
story = "鱼档的记事本里，价钱既是文字，又是数字，又是元，而三个都叫 price。"
brief = '''
读取一行：一个以分为单位的金额，全是数字。

输出三行：

1. 去掉首尾空白后的文本有多少个字符
2. 这个金额作为数字
3. 这个金额换算成元，精确到两位小数

```
input:  1234
output: 4
        1234
        12.34
```

金额非负。用**一个名字**来做，重新绑定三次——先是 `str`，然后是 `int`，然后又是
`str`。Python 允许一个名字装任何东西、随时改主意；代价是，除了读上面的代码，没有任何东西告诉你
`cents` 此刻是什么。

算元的时候不要经过 `float`。`1234 / 100` 今天是 `12.34`，而 `0.1 + 0.2`
每天都是 `0.30000000000000004`。整数除法和取模精确地给你两个部分，`f"{cents % 100:02d}"`
给第二部分补零。
'''
hints = [
  "在 cents 还是字符串的时候取 len(cents)，就是第一行。",
  "cents = int(cents) 不是原地转换；它是把一个新值绑定到旧名字上。在那之后字符串就没了。",
  "f-string 里的 :02d 是宽度二、补零、十进制。5 分是 0.05，不是 0.5。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.control-flow"
title = "哪条过道"
story = "街市的过道编号漆在地上，门口的指示牌本该写明每条过道卖什么。它每次都只写编号。"
brief = '''
读取一个整数 `n`。对从 `1` 到 `n` 的每个 `i`，输出一行：

* 如果 `i` 能同时被 3 和 5 整除，输出 `FISHVEG`
* 如果 `i` 能被 3 整除，输出 `FISH`
* 如果 `i` 能被 5 整除，输出 `VEG`
* 否则输出 `i` 本身

然后继续读取整数，每行一个，直到读到 `0` 为止，再输出 `SKIPPED <k>`，其中 `k`
是途中读到的非零行数。

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

两个循环，两种写法。第一个在开始之前就知道要跑多少次：`for i in range(1, n + 1)`。第二个不知道：`while True`
加 `break`，因为次数由你读到的内容决定。Python 的 `range` 在终点**之前**就停下，而 `range(1, n)`
是每个人在这里都会写错一次的差一错误。
'''
hints = [
  "先检查两者都满足的情况，否则它永远不会触发。能被 3 和 5 整除就是能被 15 整除。",
  "range(1, n) 停在 n - 1。起始代码就有这个 bug；样例输出会少最后一行。",
  "while True 加 break 是 Python 表达“出口在中间的循环”的方式。没有 do-while。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.lists"
title = "队伍中间"
story = "四十个人在崇光地库排队买烧鹅。柜台看得见队头和队尾，中间的一个也看不见。"
brief = '''
标准输入第一行是一个数量 `n`，第二行是 `n` 个整数，用空格分隔。

输出三行：第一个值、最后一个值，以及严格位于它们之间所有值的和。少于三个值时，这个和为 `0`。

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` 就是中间部分：一个切片，也就是一个**新列表**——Python 切片时会复制，这一点和 Rust
的切片或 Go 的子切片不同。`nums[-1]` 是最后一个元素，负索引正是你在 Python 里从来不写
`nums[len(nums) - 1]` 的全部原因。

只有一个值时，`nums[1:-1]` 是空的，对它 `sum` 得到 `0`，所以其他语言需要的那道保护在这里是免费的。这值得知道，也值得去验证而不是想当然。
'''
hints = [
  "nums[-1] 是最后一个元素；nums[-2] 是它前面那个。",
  "nums[1:-1] 是除去首尾之后的全部，而空切片自己就会求和为 0。",
  "sys.stdin.read().split() 一次读完全部内容并按任意空白切分，于是换行在哪里就不再重要。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.strings"
title = "字节不是字"
story = "崇光地库的楼层指示牌把 銅鑼灣 截到三个字节，打出一个字和一个问号。"
brief = '''
读取一行。输出三行：

1. 它按 UTF-8 编码后的**字节**长度
2. 它的**字符**长度
3. 把这一行的字符倒过来

```
input:  causeway
output: 8
        8
        yawesuac
```

这一行可能含有 ASCII 之外的字符，那时前两个数字就不相同。Python 的 `str` 是码点的序列，所以 `len`
是字符数；要得到字节，你得专门去要，用 `.encode("utf-8")`，然后对**那个结果**取 `len`，才是另一个数字。

`s[::-1]` 反转一个字符串。它是一个步长为 `-1` 的切片，对任何序列都有效。
'''
hints = [
  "len(line) 是字符数。len(line.encode(\"utf-8\")) 是字节数。起始代码把错的那个先打了出来。",
  "line[::-1] 就是整个反转。对 str 切片得到的还是 str。",
  "把字节串倒过来会把一个多字节字符切成两半；把 str 倒过来不会，因为 str 里根本没有字节。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.dicts"
title = "街市在喊什么"
story = "七点的宝灵顿道：每个档口都在喊些什么，坚拿道那头的指示牌想要一份排名。"
brief = '''
读取标准输入的全部内容，按空白切分。

每个不同的词输出一次，格式为 `<word> <count>`，按次数降序排列，次数相同时按词升序。

```
input:  tram tram bus
output: tram 2
        bus 1
```

dict 会记住插入顺序，但那不是你要的顺序。给 `sorted` 一个返回元组的 `key`，它会按第一个元素排序、用第二个元素决胜；把次数取负，就能在一个字段上降序而另一个字段保持升序。
'''
hints = [
  "起始代码在第一个词上就死于 KeyError：counts[word] += 1 先读后写，而那里没有东西可读。counts.get(word, 0) 补上那个零。",
  "sorted(counts.items(), key=...) 按你要求的顺序给出 (word, count) 对。dict 本身仍然保持插入顺序。",
  "key=lambda item: (-item[1], item[0]) — 次数降序，然后词升序，一个元组搞定。",
]

