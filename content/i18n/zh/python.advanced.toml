`REJECTED <k>`。

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager` 把一个生成器变成上下文管理器：`yield` 之前的一切是 `__enter__`，之后的一切是
`__exit__`。当函数体抛出异常时，异常会**在 `yield` 处被抛进生成器**，所以它之后的代码只有在 `yield` 位于
`try`/`finally` 里面时才会运行。起始代码没有 `finally`，于是 `WONG` 的卷闸门永远关不上。

类的写法——`__enter__` 和 `__exit__(self, exc_type, exc, tb)`——用更多行做同样的事，而且可以通过返回
`True` 吞掉异常。这里不要吞：调用方要打印 `BAD`。
'''
hints = [
  "try: yield / finally: print(SHUT)。finally 就是在每条路径上都会运行的那个 __exit__。",
  "异常穿过生成器、穿出 with 语句，所以 main 的 except 仍然看得到它——这就是 BAD 印在 SHUT 之后的原因。",
  "with opened(stall) as x: 会绑定生成器 yield 出来的任何东西。这里它什么都不 yield，那也没关系。",
