[[quest]]
id    = "python.advanced.15.decorators"
title = "包起来"
story = "街市办公室想知道今天价格函数被调用了多少次，而那个函数不想知道自己正被盯着。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以千克计的重量。

`price(kg)` 是 `500 + 100 * kg`。用 `@counted` 装饰它，让每一次调用都被计数，而 `price`
自己毫不知情。每个重量输出一个价格，然后输出
`CALLS <n>`，然后输出 `NAME <price.__name__>`——它必须仍然说 `price`。

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

装饰器是一个接收函数、返回函数的函数。它返回的通常是一个叫 `wrapper`
的闭包，先做点什么，然后调用原函数——而除非你另作声明，`wrapper` 就是名字 `price`
现在所指的东西，连 `__name__` 也是。`functools.wraps` 把原函数的名字和 docstring
复制到 wrapper 上。起始代码忘了它，于是最后一行说的是 `NAME wrapper`。

计数放在哪里？不放在全局变量里。把它挂在 wrapper 上——`wrapper.calls = 0`——事后读
`price.calls`。函数是一个对象，和其他对象一样可以带属性。
'''
hints = [
  "在 def wrapper 上面一行写 @functools.wraps(func)。你的装饰器里面再套一个装饰器。",
  "def price 上面的 @counted 等同于在它后面写 price = counted(price)。这个名字被重新绑定到 counted 返回的任何东西上。",
  "*args, **kwargs 是 wrapper 在不知道签名的情况下转发任意签名的方式，正是它让装饰器可以复用。",
]

