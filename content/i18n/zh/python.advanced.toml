[[quest]]
id    = "python.advanced.07.functions"
title = "每斤"
story = "宝灵顿道上的每张价签都是按斤算的，除非它另有说明；而标签打印机坚持每次都要人告诉它一遍。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<NAME> <CENTS>` 或
`<NAME> <CENTS> <UNIT>`。

写一个 `tag(name, cents, unit="catty")`，返回 `<NAME> $<dollars>/<unit>`，保留两位小数，每行输出一张标签。

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

起始代码的 `tag` 没有默认值，所以只有两个词的行会让它崩溃：`TypeError: tag() missing 1 required positional argument`。默认参数是函数契约的一部分——它说明调用方可以省掉什么，以及省掉之后会得到什么。

用 `.split()` 切开这一行，把分转换好之后用 `tag(*parts)` 把各部分交过去。`*`
把一个列表展开成位置参数，于是两个元素的列表和三个元素的列表都能套进同一个签名。
'''
hints = [
  "在 def 那一行写 unit=\"catty\"。这就是整个修复。",
  "有默认值的参数放在没有默认值的参数之后——def tag(name, cents, unit=\"catty\")——而一个是列表或 dict 的默认值会在多次调用之间共享，那是接下来的问题。",
  "tag(*parts) 把列表展开；只有两部分时，默认值填上第三个。",
]

