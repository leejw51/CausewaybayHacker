story = "地库里每个档口都往美食广场办公室的那一个钱抽屉里交钱，收档时抽屉里什么都没有，而每个档口都发誓自己交过了。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

为每个值启动一个线程，把它加到**一个共享的总数**上，并把一个共享的计数加一。全部 join 之后，输出 `TOTAL <sum>`
和 `HITS <n>`。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

起始代码打印 `TOTAL 0`，每次都是如此，而且每个工作线程都在 stderr 上留下一条回溯。工作函数里的
`total += value` 碰不到 main 的 `total`：`int` 是不可变的，对它 `+=`
会重新绑定这个名字，而在函数里被赋值的名字是该函数的**局部**变量，除非声明了 `nonlocal`。每个工作线程各自造了一个
`total`，往上加，然后丢掉。

修法是一个工作线程可以原地修改的容器——一个单元素列表或一个小类——**外加一把 `Lock`**。后半部分不是可选的。GIL
保证同一时刻只有一条字节码在跑；`drawer[0] += value`
是三条字节码（load、add、store），在 load 和 store 之间切一次线程就会丢掉一次更新。四个线程加四个数时它不会发生。凌晨两点四十个线程时它会发生。

`with lock:` 取得锁，并在退出时释放它，包括通过异常退出的那条路。
'''
hints = [
  "运行起始代码：它死于 UnboundLocalError，因为 `total += value` 让 total 成了 pay 的局部变量，并在它存在之前就去读它。这个错误就是完整的诊断。",
  "dict 或 list 是原地修改的，所以 `drawer[\"total\"] += value` 改的是每个线程共享的那一个对象。`nonlocal total` 也行，是另一个诚实的答案。",
  "在 main 里建一次 threading.Lock()，用 `with lock:` 围住读-改-写。GIL 不是你数据上的锁；它是解释器上的锁。",
]

