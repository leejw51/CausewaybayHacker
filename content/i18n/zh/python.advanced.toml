[[quest]]
id    = "python.advanced.12.classes"
title = "档口的记事本"
story = "宝灵顿道上每个档口都有自己的一本当日销售记事本，而豆腐档那本的每一行都写在封面上，没写进里面。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<ITEM> <CENTS>`。

建一个 `Notebook` 类来收集这些条目，然后把每个条目按到达的顺序原样输出为
`<ITEM> <CENTS>`，接着输出 `TOTAL <sum>`，最后通过 `print(book)`
输出记事本本身——它的 `__repr__` 必须产出 `Notebook(items=<n>, total=<sum>)`。

```
input:  2
        TOFU 600
        SET 2800
output: TOFU 600
        SET 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n` 可以是 `0`，那时这两行是 `TOTAL 0` 和
`Notebook(items=0, total=0)`。

起始代码里的 bug 就是这道题名字的由来：`items = []` 写在**类体**里，于是它是一个被将来所有 `Notebook`
共用的列表，而不是每本记事本一个。凡是在 `__init__` 里通过 `self` 创建的，属于实例；凡是写在类体里的，属于类。可变的类属性是最常逃过代码审查的
Python bug，因为程序一直运行正常，直到出现第二个实例为止。
'''
hints = [
  "运行起始代码，看输出的第一行：PENCIL 0，来自一本没人在里面写过字的记事本。那就是被共享的列表。",
  "def __init__(self): self.items = [] — 在构造函数里、通过 self、每个实例各建一个。",
  "没有 __str__ 时，print(book) 会调用 repr(book)，所以 __repr__ 是唯一要写的方法。让它看起来像一次能重建出它的构造调用；这是惯例。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "python.advanced.13.dataclasses"
title = "谁在买"
story = "崇光地库的米柜台对每张卡都收全价，包括那些不是成人的，还有那张根本不是卡的。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<TYPE> <KG>`。

基础价格是 `500 + 100 * KG` 分。对每一行输出下列之一：

* `ADULT` — 基础价格
* `STUDENT` — 基础价格的一半，整数除法
* `SENIOR` — 永远是 `200`
* 其他任何值 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

把每一行建模成一个 frozen 的 `@dataclass`——`Order(kind: str, kg: int)`——并用对这个订单的**一个**
`match` 来决定价格。`match` 可以按关键字解构一个 dataclass——`case Order(kind="ADULT", kg=kg):`——而它的最后一个分支
`case Order(kind=other):` 会绑定所有没匹配上的情况。

起始代码的 `match` 只有一个分支，然后是一个兜底的 `case _:`，对所有东西都打印
`UNKNOWN`，包括它本该认识的那三种。分支按顺序尝试，第一个匹配的胜出，所以通配符必须放在最后，而且必须是唯一一个通配符。
'''
hints = [
  "每种类型一个 case：case Order(kind=\"STUDENT\"): 以此类推。dataclass 按字段名匹配。",
  "// 是整数除法；/ 会给你 450.0，而测试要的是 450。",
  "case Order(kind=other): 是一个捕获模式——它总能匹配并绑定那个标签——所以要放在最后，正如 Rust 的 match 里的 `other =>` 分支。",
]

