id    = "python.advanced.07.context-managers"
title = "卷闸门照样落下"
story = "地库里一个档口每接一单就拉起卷闸门，接完就放下。12:40 收到一张坏单子的那家，从那时起就一直开着，因为关门的代码写在出错那一行的后面。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行 `<STALL> <CENTS>`，其中
`CENTS` 本该是一个整数。

用 `contextlib.contextmanager` 写一个上下文管理器 `opened(stall)`，进入时打印 `OPEN <STALL>`，退出时打印
`SHUT <STALL>`——**无论函数体是否抛出异常**。在它里面解析分数并累加到总数。分数解析不了的行，在卷闸门关上之后报告为
