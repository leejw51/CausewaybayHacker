[[quest]]
id    = "python.advanced.06.sets"
title = "两个档口都有的"
story = "两个菜档，一边一个，隔着过道；一位顾客想知道哪些东西两边随便哪家都能买到，免得在湿地板上来回走两趟。"
brief = '''
标准输入两行，每行是一个档口的货品，用空格分隔。一个档口可能把同一样东西列两次；那只算一次。

输出三行：

1. `BOTH` 后面跟着两份清单上都有的东西，排好序，用空格分隔——如果一样都没有，输出
   `BOTH -`
2. `ONLY_A <k>`：有多少东西在第一份清单上而不在第二份上
3. `ALL <k>`：两份清单加起来一共有多少种不同的东西

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set` 没有重复也没有顺序，`&`、`-` 和 `|` 就是那三种运算。对 set 用 `sorted` 得到一个列表，这是按固定顺序打印它的唯一办法。
'''
hints = [
  "set(input().split()) 直接从各个词构建集合；重复的 tofu 在进去的路上就消失了。",
  "a & b 是交集，a - b 是差集，a | b 是并集。对每个取 len 就是数量。",
  "\" \".join(sorted(both)) 需要字符串——这些本来就是——而 `if both else \"-\"` 用一个表达式就覆盖了空的情况。",
]

