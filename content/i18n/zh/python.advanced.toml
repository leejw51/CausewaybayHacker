Python 字节码，而一个 CPU 密集的线程每隔几毫秒交出这把锁，好让别的线程轮上一次。四个核上的四个线程在一个核上轮流求平方和，外加切换的开销。Python
里的线程是用来等待的——等 socket、等文件、等 `sleep`——等待期间锁被释放，并发才是真的。对 CPU
工作，答案是 `multiprocessing`，或者 `concurrent.futures.
ProcessPoolExecutor`，它运行各自带锁的独立解释器，代价是复制参数。

输出是确定的，因为各块按索引打印，总数是各块之和，而不是线程完成的顺序。`TOTAL`
要从加了锁的总数打印，而不是把各格加起来——锁才是这张地图讲的东西，两者必须一致。
