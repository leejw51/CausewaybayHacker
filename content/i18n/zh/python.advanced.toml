[[quest]]
id    = "python.advanced.11.sorting"
title = "排名榜"
story = "街市办公室每天早上贴出最便宜的菜心，办事员靠两张清单和一支铅笔手工给各档口排名。"
brief = '''
标准输入两行：第一行是档口名字，第二行是它们的价格（以分计），顺序一致。

按最便宜在前的顺序输出各档口，格式为 `<rank>. <NAME> <cents>`，名次从 `1`
开始，价格相同时按名字升序。然后输出
`CHEAPEST <NAME>`。

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
```

`zip` 把两个列表配成对；带 `key` 的 `sorted` 给这些对排序；`enumerate(..., start=1)`
给它们编号。三个内置函数，任何地方都没有索引运算——用 `for i in range(len(names))`
的那个版本，会在第三个档口把决胜规则弄错。
'''
hints = [
  "zip(names, prices) 逐个产出 (name, price) 元组，每个档口一个，到较短的列表结束时停止。",
  "key=lambda pair: (pair[1], pair[0]) 先按价格再按名字排序；sorted 是稳定的，但键已经是完整的时候你用不着这一点。",
  "enumerate(ranked, start=1) 给出 (rank, (name, price))，嵌套的元组可以在 for 那一行直接解包。",
]

