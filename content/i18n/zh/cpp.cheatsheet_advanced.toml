# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet_advanced.29.fetch-add"
title = "我前面的那个数"
story = "铜锣湾站的八个旋转闸共用一个计数器；每个闸口都需要自己那一下之前的计数，而且一下都不能丢。"
brief = '''
`std::atomic<int> hits{0};` 被八个线程同时递增。在每个线程里，加 `1`，
并把 `int before` 设为**这个线程递增之前**的那个值。不能丢失任何一次递增。
'''
hints = [
  "先读值再存新值是两个独立的原子步骤，另一个线程能挤在中间。前置自增是原子的，但交回的是之后的值。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet_advanced.30.condition-variable"
title = "等到有东西为止"
story = "正午，炮响，Lucky Mac 的传菜窗口：传菜员一直睡到真的有盘子在那里，不为别的醒来，也绝不错过提早放下的那一盘。"
brief = '''
`std::mutex m; std::condition_variable cv; std::queue<int> q;` —— 在消费者
的开头，取得锁并**阻塞到 `q` 非空为止**，即使生产者在我们到达之前就已经
push 并 notify 过也要正确，而且要能抵御虚假唤醒。之后锁仍然持有。
'''
hints = [
  "等待需要一把它能释放再重新获取的锁，所以不是那个简单的 guard，也不是裸的互斥量。接收谓词的那个重载在每次醒来时都重新检查它，而如果它已经成立就立即返回。",
]
