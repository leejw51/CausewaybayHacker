[[quest]]
id    = "rust.basic.07.string-str"
title = "拥有的文字与借来的文字"
story = "渣甸坊的店招只漆一次，归店铺所有。每个读它的人都是借来看；为今天做的横幅则是一件新东西。"
brief = '''
`String` 拥有它的文字，而且能变长；`&str` 借用住在别处的文字。只读的
函数接收 `&str`；构造新文字的函数返回 `String`。`format!` 构造
`String` 的方式和 `println!` 构造一行的方式一样，而 `&name`（或
`name.as_str()`）把一个 `String` 作为 `&str` 借出去。

```
format!("** {} **", name)
let line = banner(&name);
```

在两个 `// FILL` 注释处敲下这两行：`banner` 的函数体，以及 `main` 里的
调用。

```
input:  mei
output: ** mei **
        9
```
'''
hints = [
  "不带分号的 format!(\"** {} **\", name) 就是函数的值；main 里写 let line = banner(&name);。",
  "不带 & 的 banner(name) 想在需要 &str 的地方传一个 String：E0308。这个 & 就是整堂课。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.basic.08.chars-bytes"
title = "字母和数字"
story = "维多利亚公园的一个储物柜密码：字母和数字混在一起。管理员把数字加起来，然后喊出第一个字母。"
brief = '''
`&str` 是字节；`.chars()` 按字符走它，`.bytes()` / `.as_bytes()` 按
`u8` 走它。`c.to_digit(10)` 把数字字符变成 `Some(number)`，其他的变成
`None`，所以 `filter_map` 只留下数字。字节就是数：`b'a'` 是 97，
字母运算写作 `(byte - b'a' + b'A') as char`。

```
let digits: Vec<u32> = code.chars().filter_map(|c| c.to_digit(10)).collect();
let first = (code.as_bytes()[0] - b'a' + b'A') as char;
```

在两个 `// FILL` 注释处敲下这两行。密码总是以小写字母开头。

```
input:  a1b2c3
output: 6
        A
```
'''
hints = [
  "code.chars().filter_map(|c| c.to_digit(10)).collect() —— 然后是 (code.as_bytes()[0] - b'a' + b'A') as char。",
  "to_digit 返回 Option<u32>；filter_map 丢掉那些 None。一个字节减去 b'a'，对 a 来说是 0，再加上 b'A' 就落在大写字母上。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.option"
title = "也许什么都没有"
story = "安静的早上，时代广场的告示板。可能没有最高出价，也可能没有偶数票号；告示板必须如实说出来，而不是去猜。"
brief = '''
`Option<T>` 是 `Some(value)` 或 `None`，编译器逼你说清楚遇到 `None`
时怎么办。`if let Some(m) = …` 只在有值时才执行一个块。`.unwrap_or(0)`
给出一个默认值。`.find(…)` 以 `Option<&T>` 返回第一个匹配，而
`.copied()` 把 `Option<&i64>` 变成 `Option<i64>`。

```
if let Some(m) = nums.iter().max() { println!("MAX {}", m); }
let even = nums.iter().find(|&&x| x % 2 == 0).copied().unwrap_or(0);
```

在两个 `// FILL` 注释处敲下这两行。输入为空时，第一行什么都不输出，
第二行是 `0`。

```
input:  3 5 8 1
output: MAX 8
        8
```
'''
hints = [
  "if let Some(m) = nums.iter().max() { println!(\"MAX {}\", m); }，然后是 find(...).copied().unwrap_or(0)。",
  "空迭代器上的 max() 是 None，if let 直接跳过。find 交回的是 Option<&i64>；copied() 把它变成 Option<i64>，unwrap_or(0) 的类型才对得上。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.basic.10.result"
title = "不是数字的那一行"
story = "波斯富街的收银机收到一行价格，其中一个是个单词。收银机没有崩溃；它说出是哪一个坏了，以及为什么。"
brief = '''
`Result<T, E>` 是 `Ok(value)` 或 `Err(error)`。在一个返回 `Result` 的
函数里，`?` 运算符解开 `Ok`，而遇到 `Err` 时当场把它**返回**给调用者
—— 一个字符代替一整个 `match`。`"12".parse::<i64>()` 是一个
`Result<i64, ParseIntError>`。

```
out.push(tok.parse::<i64>()?);
```

`parse_all` 返回那个 vector 或者第一个错误，`main` 对它做 match。在
`// FILL` 注释处敲下带 `?` 的那一行。

```
input:  1 2 3
output: 6
```
'''
hints = [
  "out.push(tok.parse::<i64>()?);",
  "? 只能用在返回类型是 Result（或 Option）、且错误类型对得上的函数里 —— 这里是 ParseIntError，正是 parse 给出的那个。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.basic.11.match"
title = "数字的形状"
story = "维多利亚公园的一道闸门给票号分类：零、一位数、偶数、奇数。四个分支，什么都漏不下去。"
brief = '''
`match` 必须覆盖每一种情况，它的分支是模式：一个字面量、一个区间
`1..=9`、一个带守卫的绑定 `x if x % 2 == 0`，以及表示其余一切的 `_`。
第一个吻合的分支胜出，所以顺序很重要。它是一个表达式：每个分支的值就是
整个 `match` 的值。

```
0 => "ZERO",
1..=9 => "ONE DIGIT",
x if x % 2 == 0 => "EVEN",
_ => "ODD",
```

`match` 已经替你开好了头，只有一个写着 `TODO` 的分支。按这个顺序把它
换成那四个分支。

```
input:  12
output: EVEN
```
'''
hints = [
  "0 => \"ZERO\", 1..=9 => \"ONE DIGIT\", x if x % 2 == 0 => \"EVEN\", _ => \"ODD\",",
  "带守卫的分支要放在 _ 之前，否则它永远不会执行。1..=9 两端都包含；1..9 会把 9 留给守卫分支。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.basic.12.iterator-chain"
title = "怡和街一趟走完"
story = "怡和街，走一趟：留下偶数号的铺面，把门牌号平方，再把所有大于十的加起来。没有下标，没有第二个循环。"
brief = '''
迭代器链从左往右读：`.iter()` 走遍 vector，`.filter(|&&x| …)` 留下闭包
说好的那些，`.map(|x| …)` 做变换，最后的 `.collect()` 或 `.sum()` 把它
变成一个值。在最后那个调用之前，什么都不会执行。`iter()` 产出
`&i64`，而 `filter` 看到的是指向它的引用，所以要用 `&&x` 这个模式才
够得到那个数。

```
let squares: Vec<i64> = nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect();
let big: i64 = nums.iter().filter(|&&x| x > 10).sum();
```

在两个 `// FILL` 注释处敲下这两行。

```
input:  1 2 3 4 11 20
output: 4 16 400
        31
```
'''
hints = [
  "nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect() —— 第二行用 .filter(|&&x| x > 10).sum()。",
  "let 上的类型告诉 collect() 和 sum() 要构造什么；没有 Vec<i64> 和 i64，编译器推断不出来。",
]

