[[quest]]
id    = "rust.basic.18.traits"
title = "自动补全"
story = "波斯富街的电话亭在你写出一行之前就替你把每一行写完了。对你自己命名的 trait，它没有补全。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行是下面之一

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` —— `ROUTE` 是一个数字

每个招牌输出一行 `<tag> <rendering>`，然后输出 `SIGNS <n>`：

* `Shop` 渲染成 `<NAME> / F<FLOOR>`，它的标签是 `SIGN`
* `Stop` 渲染成它的路线号，它的标签是 `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

声明一个 trait，并为两个不同的结构体实现它：

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` 是一个**默认方法**。`Shop` 对它什么都不说，就得到 `SIGN`；`Stop` 自己写了一个，就得到 `TRAM`。这是面试里人们常忘记的 trait 的另一半：trait 不只是一份签名清单，它可以携带行为，而覆盖是可选的。

通过**一个**函数打印：`fn show<T: Sign>(sign: &T)`。约束就是契约 —— `show` 对 `Shop` 和 `Stop` 一无所知，只知道递给它的东西有 `render` 和 `tag`。编译器为每个具体类型生成一份 `show`，调用是直接的。

起始代码编译不通过。trait 声明了，结构体也在，但光这样什么都换不来：`show(&Shop { .. })` 是 E0277，*the trait bound `Shop: Sign` is not satisfied*。声明一个 trait 和实现它是两个独立的动作，而在 Rust 里第二个动作总是要明确写出来。

把两种招牌放进同一个 `Vec` 会是另一种机制 —— `Box<dyn Sign>`，一个指针加一张虚表，在运行时查找。这里你不需要它，因为在每个调用点具体类型都还看得见。那是下一张地图要问的问题，而它问的正是你手里拿的是两者中的哪一个。
'''
hints = [
  "impl Sign for Shop 写在结构体外面。trait 说做什么；impl 说怎么做；编译器不会从前者推出后者。",
  "Shop 的 impl 里完全不写 tag，它就用 trait 的版本。在 Stop 的 impl 里写上，Stop 的就赢。默认方法的全部含义就是这个。",
  "show<T: Sign>(sign: &T) 是泛型的，所以类型必须在调用处就已知 —— 也就是在 match 分支里面，那时你还看得见自己刚构造的是什么。",
  "一个同时装下两者的 Vec 需要 Box<dyn Sign>，那是另一种带运行时查找的机制。题目没有要求它，在这里伸手去拿它，会是对一个关于 trait 的问题给出的错误答案。",
]
