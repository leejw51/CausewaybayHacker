[[quest]]
id    = "rust.basic.13.fold-zip-windows"
title = "成对、连涨和累计"
story = "波斯富街的电车计数器读一天的人数：有几个小时比前一个小时多，全部的乘积，以及每个数旁边标上它的钟点。"
brief = '''
三个屏幕上老是用到的适配器。切片上的 `.windows(2)` 把每一对相邻元素作为
一个两元素的切片产出。`.fold(start, |acc, x| …)` 让一个累加器贯穿整个
序列。`.zip(…)` 并排走两个序列，而 `(0..).zip(&nums)` 就是手写出来的
`enumerate`。

```
let ups = nums.windows(2).filter(|w| w[1] > w[0]).count();
let product = nums.iter().fold(1i64, |acc, &x| acc * x);
let pairs: Vec<String> = (0..).zip(&nums).map(|(i, x)| format!("{}:{}", i, x)).collect();
```

在三个 `// FILL` 注释处敲下这三行。

```
input:  1 3 2 5
output: 2
        30
        0:1 1:3 2:2 3:5
```
'''
hints = [
  "windows(2).filter(|w| w[1] > w[0]).count() —— fold(1i64, |acc, &x| acc * x) —— (0..).zip(&nums).map(|(i, x)| format!(\"{}:{}\", i, x)).collect()",
  "windows 是切片的方法，所以直接在 nums 上调用，而不是在 nums.iter() 上。fold 里的 1i64 固定了累加器的类型；光写 1 会有歧义。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.basic.14.entry"
title = "渣甸坊在喊什么"
story = "一个早上在渣甸坊里喊过的每个词，都数一遍。喊得最响的在前；同样多的按字母顺序。"
brief = '''
`HashMap` 的 entry API 就是一行写完的计数器。`counts.entry(key)` 找到某个
键的位置，不管它存不存在；`.or_insert(0)` 在它不存在时放一个 `0` 进去，
而且无论哪种情况都交回指向值的 `&mut`；`*… += 1` 把它加一。一次查找，
不用先 `contains_key`。

```
*counts.entry(w.to_string()).or_insert(0) += 1;
```

map、循环、排序和打印都已经写好。在 `// FILL` 注释处敲下 entry 那一行。

```
input:  a b a c b a
output: a 3
        b 2
        c 1
```
'''
hints = [
  "*counts.entry(w.to_string()).or_insert(0) += 1;",
  "键是 String，所以 w（一个 &str）要用 to_string() 变成 String。前面的星号解引用 or_insert 返回的那个 &mut usize。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.basic.15.sort-by"
title = "排行榜"
story = "时代广场的游戏机厅贴出当天的榜：最高分在前，两人同分时，名字排在前面的那个在前。第二块榜按名字长短排。"
brief = '''
`sort_by` 接收一个返回 `Ordering` 的比较闭包。`b.cmp(&a)` 是降序；
`.then_with(|| …)` 用第二次比较来打破平局。`sort_by_key` 按闭包取出的
东西升序排序，而两者都是**稳定**的：键相等的元素保持原来的顺序。浮点数
没有 `cmp`，要写成 `a.partial_cmp(b).unwrap()`。

```
rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));
by_len.sort_by_key(|r| r.0.len());
```

在两个 `// FILL` 注释处敲下这两次排序。`by_len` 是在第一次排序之前做的
一份 clone，所以它的平局保持输入顺序。

```
input:  MEI 90
        BO 95
        ALEX 90
output: BO ALEX MEI
        BO MEI ALEX
```
'''
hints = [
  "rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0))); 以及 by_len.sort_by_key(|r| r.0.len());",
  "cmp 里 b 在 a 前面，这就是降序的由来。cmp 接收一个引用，所以是 &a.1。then_with 只在第一次比较结果为 Equal 时才执行。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.heap-reverse"
title = "最小的先来"
story = "时代广场的点心窗口先叫最小的票号。那一叠票是一个堆，而 Rust 里的堆，除非你另有交代，总是先交出最大的。"
brief = '''
`BinaryHeap` 是一个最大堆：`pop()` 给出最大的。把每个值包进
`std::cmp::Reverse` 就把顺序翻过来，所以 `BinaryHeap<Reverse<i64>>`
弹出的是最小的 —— 每道最短路径题和第 k 小题都想要的那个最小堆。
`while let Some(Reverse(x)) = heap.pop()` 一边清空一边解包。

```
heap.push(Reverse(x));
while let Some(Reverse(x)) = heap.pop() { out.push(x); }
```

在两个 `// FILL` 注释处敲下推入和清空。

```
input:  5 1 9 3
output: 1 3 5 9
```
'''
hints = [
  "heap.push(Reverse(x)); 然后 while let Some(Reverse(x)) = heap.pop() { out.push(x); }",
  "Reverse 是一个元组结构体，所以 Reverse(x) 既在推入时包装，也在模式里解构。没有它，输出就会是最大的在前。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.basic.17.derive-ord"
title = "逐个字段比较"
story = "波斯富街牌子上的票价，先按区再按价格排序。没有人写这个比较；是让编译器去写的。"
brief = '''
`sort()`、`max()`、`BinaryHeap` 和 `==` 都需要类型实现比较相关的
trait。`#[derive(…)]` 为结构体写出它们，**按声明顺序逐个字段**比较：
`PartialEq, Eq` 用于 `==`，`PartialOrd, Ord` 用于 `<` 和排序，`Clone`
用于 `.clone()`，`Debug` 用于 `{:?}`。

```
#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord)]
```

在 `// FILL` 注释处、`struct Fare` 上面那一行敲下这个属性。没有它，
