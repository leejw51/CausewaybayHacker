# RUST LAND — BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/basic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "rust.basic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.the-move"
title = "只有一个主人"
story = "06:40，渣甸坊楼上。柜台上一张收据，上面写着整条街的规矩：一样东西只有一个主人，交出去就是交出去了。"
brief = '''
一个 `String` 恰好只有一个主人。`let kept = receipt;` 不是复制它：
而是**移动**它，从那一行起，`receipt` 就不再是一个你能用的名字 ——
编译器会以 E0382，borrow of moved value 拒绝。值去了它该去的地方，
换了新名字。

```
let kept = receipt;
```

收据已经做好，两个 `println!` 也已经写好。在 `// FILL` 注释处敲下这次
移动，让 `kept` 拥有这个字符串。

```
output: one receipt, one owner
        22
```
'''
hints = [
  "let kept = receipt; —— 一个 let，右边是旧名字。",
  "不要 clone：字符串没有被复制，它换了主人。在这一行之后再用 receipt 就是 E0382。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.borrow"
title = "只是看看"
story = "波斯富街电车站。售票员把名单上的每个名字读一遍，然后原样交回；除了办事处，从来没有人拥有过它。"
brief = '''
`&` 是出借。一个接收 `name: &str` 的函数只是*看一眼*这个字符串；
调用者保留着它，之后还能用。`&names[i]` 借用的是其中一个元素，而
`&String` 在调用处会自己变成 `&str`。

```
total += width(&names[i]);
```

`width` 和两个 `println!` 都已经写好。在 `// FILL` 注释处敲下调用，
用 `&` 把每个名字借出去。第二行证明循环结束后这些名字仍然是你的。

```
input:  MEI
        BO
        ALEX
output: 9
        MEI,BO,ALEX
```
'''
hints = [
  "total += width(&names[i]); —— & 放在实参上。",
  "width 要的是 &str；&String 在调用处会强制转换成 &str，所以 &names[i] 就够了。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.basic.03.mut-borrow"
title = "借出去让人改"
story = "Lucky Mac 的小亭把牌子上每个价格都加同样的数。牌子从不离开墙；改它的那只手是借来的。"
brief = '''
`&mut` 是为了修改而出借。一个接收 `prices: &mut Vec<i64>` 的函数可以
原地修改调用者的 vector；调用者在调用处写 `&mut prices`，而 `prices`
本身必须是 `let mut`。在函数里，`iter_mut()` 交出一个个 `&mut i64`，
`*p` 就是其中一个背后的那个数。

```
*p += by;
bump(&mut prices, by);
```

`bump` 和打印都已经写好。在两个 `// FILL` 注释处敲下这两行：`bump`
里面的修改，以及出借这个 vector 的调用。

```
input:  3
        10 20 30
output: 13 23 33
```
'''
hints = [
  "循环里写 *p += by;，然后在 main 里写 bump(&mut prices, by);。",
  "p 是一个 &mut i64：星号穿过它够到那个数。调用需要的是 &mut，不是 &，而 prices 声明成 mut 正是为了这个。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.clone"
title = "第二份"
story = "希慎广场的两张名单：门口那张按到达顺序记，经理那张要排序。给经理那张排序，绝不能碰到门口那张。"
brief = '''
移动之后只剩一个主人。当你需要两个时，`.clone()` 做一份深拷贝，从此
两者互不相干。小而简单的值 —— `i64`、`bool`、`char`、`f64`，以及由它们
组成的元组 —— 是 `Copy` 的：`let b = a;` 会复制它们，`a` 不用任何
clone 也照样能用。

```
let mut sorted = names.clone();
```

名字已经读好，`sorted.sort()` 和两个 `println!` 也已经写好。在
`// FILL` 注释处敲下这次 clone，让原来的顺序保留下来。

```
input:  MEI BO ALEX
output: MEI BO ALEX
        ALEX BO MEI
```
'''
hints = [
  "let mut sorted = names.clone(); —— 要 mut，因为 sort() 原地修改它。",
  "let mut sorted = names; 也能编译，可那样 names 就没了，第一个 println! 就是 E0382。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.exchange"
title = "交换"
story = "渣甸坊的两台收银机在换班时互换钱箱，旧钱箱被抽出来，一个空的放回原处。什么都没有被复制；东西只是换了手。"
brief = '''
`std::mem` 不做复制就能交换值。`swap(&mut a, &mut b)` 对调两个名字里
装的东西。`take(&mut a)` 把值移出来，留下该类型的默认值 —— 空的
`String`、空的 `Vec`、`0` —— 于是你能拥有一个待在 `&mut` 里面的东西。
`replace(&mut a, v)` 是同一回事，只是留下的是你自己挑的值。

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

两行已经读进 `a` 和 `b`。在 `// FILL` 注释处敲下 swap 和 take。

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
hints = [
  "std::mem::swap(&mut a, &mut b); 然后 let taken = std::mem::take(&mut a);",
  "两者都接收 &mut：值留在原地，移动的只是内容。take 之后 a 是一个空的 String，而不是一个被移走的值 —— 它仍然能用。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.slices"
title = "队伍的中间"
story = "希慎广场的队伍，去掉第一个和最后一个：真正在等的那些人。"
brief = '''
`&v[a..b]` 是一个切片：借来的一扇窗，看着 `Vec` 的一部分，从 `a` 开始，
到 `b` 为止但不包括它，不做任何复制。它的类型是 `&[i64]`，一个接收
`&[i64]` 的函数，接受整个 vector（`&nums`）和它的任何一扇窗，方式完全
一样。单独的 `..` 是全部；`a..` 一直到末尾。

```
let middle = &nums[1..nums.len() - 1];
```

`total` 和三个 `println!` 都已经写好。在 `// FILL` 注释处敲下这个切片。

```
input:  5 1 2 3 9
output: 6
        20
        3
```
'''
hints = [
  "let middle = &nums[1..nums.len() - 1];",
  "区间的终点不包含在内，所以 len() - 1 刚好停在最后一个元素之前。前面的 & 让它成为一次借用，而不是从 vector 里移出来。",
]

