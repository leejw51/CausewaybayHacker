[[quest]]
id    = "rust.basic.13.sorting"
title = "价格阶梯"
story = "宝灵顿道的水果摊，牌子上要最便宜的排前面，给老板看的要最贵的排前面。两块牌子上的价格都还是箱子从货车卸下来的顺序。"
brief = '''
`.sort()` 把一个 `mut` `Vec` 就地按升序排好。其他顺序用 `.sort_by`，它接收一个
比较两个元素的闭包：`a.cmp(b)` 是升序，所以 `b.cmp(a)` 就是降序。

```
asc.sort();
desc.sort_by(|a, b| b.cmp(a));
```

数字复制了两份，两份都会打印。在 `// FILL` 注释处输入这两行。

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "asc.sort(); ——以及 desc.sort_by(|a, b| b.cmp(a));",
  "两者都是就地排序、不返回值，所以它们各自是一行语句，不是要赋值的东西。",
]

