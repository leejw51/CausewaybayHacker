# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.basic.13.combinators"
title = "一个 unwrap 都不用"
story = "Alex 老说 Rust 那份代码全是 unwrap。把读数列的程序再写一遍，在可能失败的部分里不许出现 unwrap。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行本应是一个整数。

对每一行，输出这个值的两倍，解析不了时输出 `-1`。然后输出 `SOME <k>`，即成功解析的行数，以及 `FIRST <v>` —— 第一个解析成功的值 —— 或者 `FIRST NONE`。

```
input:  3
        21
        xx
        -4
output: 42
        -1
        -8
        SOME 2
        FIRST 21
```

用组合子来做：`.ok()` 把 `Result` 变成 `Option`，`.map(|v| v * 2)` 只对存在的值起作用，`.unwrap_or(-1)` 在值不存在时给出答案。`find_map` 让你一趟就得到最后那一行。

`unwrap()` 在解析得了的行上也"能用"，然后在 `xx` 上把整个程序拖垮。`unwrap_or` 不可能 panic。分得清哪个是哪个，就是这条街的任务。
'''
hints = [
  "parse::<i64>() 在这里需要 turbofish，因为下游没有任何东西替编译器钉住类型。",
  ".ok() 是故意把错误扔掉 —— 你不需要报告为什么失败，只需要知道失败了。",
  "find_map 会一直运行闭包，直到某一次返回 Some，所以它在第一个解析成功的行就停下。",
]

