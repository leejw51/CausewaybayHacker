`&str` 是对别人所拥有的文本的一个视图。`String` 拥有一块可以增长的缓冲区。`first_word` 返回的是视图，所以它的返回类型从参数借用，并且什么都不分配 —— 这就是他们真正想问的那个问题的完整答案。
