[[quest]]
id    = "rust.basic.02.bindings"
title = "票价牌"
story = "波斯富街电车站的票价牌只显示一个数字，后面本来写着日票和月票的两格都空着。"
brief = '''
`let` 给一个值起名字。类型可以写在冒号后面，`println!("{}", …)` 打印
花括号里的东西，末尾再换一行。`i64` 上的算术就照纸上那样写。

```
println!("{}", n * n);
```

`n` 已经读好，前两行也已经替你打印了。在 `// FILL` 注释处输入这一行：
第三个 `println!`，`n` 乘以它自己。

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "println!(\"{}\", n * n);",
  "上面两行的形状一样；只有第二个参数里的表达式不同。",
