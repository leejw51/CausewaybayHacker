[[quest]]
id    = "rust.basic.03.types"
title = "分账"
story = "波斯富街小店，两杯咖啡一张钞票。收银机要说每人几块、剩几块、精确到分的份额，今天三行全是空的。"
brief = '''
两个整数相除得到整数：`7 / 2` 是 `3`，`7 % 2` 是余数 `1`。要得到小数
先转换——`as f64` 把整数变成浮点数——格式字符串里的 `{:.2}` 恰好打印小数点后两位。

```
println!("{:.2}", a as f64 / b as f64);
```

`a` 和 `b` 已经读好，整数除法和余数也已经打印。在 `// FILL` 注释处输入这一行。

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "println!(\"{:.2}\", a as f64 / b as f64);",
  "两边都先用 `as f64` 转换再相除，否则除法在整数上进行，小数早就没了。",
]

