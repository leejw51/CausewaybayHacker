[[quest]]
id    = "rust.basic.17.testing"
title = "自己证明"
story = "06:40 没有人会替你检查这个。表就在那里；把它变绿。"
brief = '''
程序里有一张表，四对已知正确的 `(km, fare)`，它拿 `fare` 逐一核对，打印 `<name> ok` 或 `<name> FAIL got <g> want <w>`，然后打印 `PASSED <k>/4`。最后它从标准输入读取一个距离，打印 `FARE <x>`。

`fare(km)` 应该是 `500 + 100 * km`。起始代码里的是错的，而表抓住了它 —— 这正是全部的意义。

```
input:  4
output: zero ok
        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

不要动那张表；它就是规格。在真正的 crate 里它住在 `#[cfg(test)] mod tests` 里，由 `cargo test` 运行。两种情况下表是一样的 —— 变的只有跑它的框架，而一张读得懂的表，比一个读不懂的框架值钱得多。
'''
hints = [
  "表是规格。函数才是错的那个。",
  "四个用例里有三个失败，通过的那个是 km = 0，这恰恰说明为什么一个测试用例什么都证明不了。",
  "在 crate 里这就是 #[cfg(test)] mod tests，里面有 #[test] fn fares() 和 assert_eq!(fare(arg), want)。",
]

