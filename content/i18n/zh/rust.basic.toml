# RUST LAND — BASIC, in Simplified Chinese. A translation pack (SPEC §12.1): the
# prose of `content/rust/basic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.basic"
locale = "zh"

