[[quest]]
id    = "rust.basic.04.strings"
title = "店招"
story = "渣甸街的招牌师傅要这个名字的三种样子：数几个字母好报价，大写的上牌子，反过来的贴在玻璃内侧。"
brief = '''
`String` 用 `.len()` 知道自己的长度，用 `.to_uppercase()` 得到一份大写副本。
没有 `.reverse()`：你用 `.chars()` 逐个走过字符，用 `.rev()` 把方向调转，再用
`.collect()` 收进一个新的 `String`。`let` 上的类型告诉 `collect` 要造什么。

```
let rev: String = line.chars().rev().collect();
```

这一行已经读好，长度和大写形式也已经打印。在 `// FILL` 注释下方，用这条 `let`
替换占位的 `let rev`。

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "let rev: String = line.chars().rev().collect();",
  "`.chars()` 是字符的迭代器，`.rev()` 倒着走，`.collect()` 造出 `let` 要求的 `String`。",
]

