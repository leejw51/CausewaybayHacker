[[quest]]
id    = "rust.basic.14.sort-by-key"
title = "排行榜"
story = "时代广场楼上的游戏厅贴出高分榜，最高分在前，同分按名字排。榜上还是大家碰巧走进来的顺序。"
brief = '''
`.sort_by_key` 按闭包对每个元素返回的东西排序。元组按字段逐个比较，所以元组键
先按第一个字段排，相同时再按第二个；把字段包进 `std::cmp::Reverse` 会让它变为降序。

```
rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));
```

各行以 `(String, i64)` 对读入并打印。在 `// FILL` 注释处输入这一行。

```
input:  3
        mei 90
        alex 95
        kit 90
output: alex 95
        kit 90
        mei 90
```
'''
hints = [
  "rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));",
  "键是一个元组：`Reverse(score)` 让分数降序，后面的 `name.clone()` 按字母顺序处理并列。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.basic.15.closures"
title = "服务费"
story = "希慎广场美食广场的账单打印机给每一行加同一笔费用。它只被告知过一次金额，还没打第一行就忘了。"
brief = '''
闭包是内联写出的函数：`|x| x + 1`。它可以直接使用周围作用域的变量而不用传入——
这就是捕获。写出参数类型 `|x: i64|` 不是必须的，但能免去编译器猜测。

```
let add = |x: i64| x + k;
```

`k` 和数字已经读好，`add` 会应用到每个数字并打印。用这一行替换占位的 `let add`。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "let add = |x: i64| x + k;",
  "`k` 只是被读取，所以闭包借用它；不需要 `move`，`k` 之后仍然可用。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.lambdas"
title = "偶数桌"
story = "维多利亚公园的美食节给桌子编了号，只有偶数号的桌子要交平方米费。写字板上的费用总额是零。"
brief = '''
迭代器适配器可以链式调用：`.iter()` 走过 `Vec`，`.filter(…)` 保留闭包说“是”的元素，
`.map(…)` 把每个元素换成闭包返回的东西，`.sum()` 把它们加起来。在末尾的 `.sum()`
拉动之前什么都不会运行。闭包看到的是引用，所以 `filter` 拿到 `&&x`，`map` 拿到 `&x`。

```
let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();
```

数字已经读好，`total` 会被打印。用这一行替换占位的 `let total: i64 = 0;`。

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();",
  "`let` 上的 `: i64` 告诉 `sum` 往什么类型里加；没有它，编译器会问你想要哪种数字类型。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.basic.17.threads"
title = "四台收银机"
story = "渣甸街同时开四台收银机，每台各算自己的收据。经理按收银机顺序收上来，托盘却是空的。"
brief = '''
`thread::spawn` 启动一个线程运行闭包，并返回一个 `JoinHandle`。`move` 让闭包拥有
它所用之物的自己的副本，这样线程就不会借用一个可能已经消失的栈帧。`.join()` 等待
线程结束，并以 `Result` 返回闭包的返回值。

```
handles.push(thread::spawn(move || x * x));
squares.push(h.join().unwrap());
```

两个循环都已写好。在第一个 `// FILL` 注释处输入第一行，在第二个处输入第二行。

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); ——然后 squares.push(h.join().unwrap());",
  "按 handle 推入的顺序 join，输出才能保持输入的顺序；线程本身什么时候结束都无所谓。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.basic.18.binary-tree"
title = "自动补全"
story = "波斯富街的电话亭，灰色的幽灵文字又回来了，递给你一棵它见过一千遍的树。你亲手一个节点一个节点长出来的那棵，它没有补全，而在你动手之前树一直是空的。"
brief = '''
二叉搜索树是一个带值和两个可选子节点的 `Node`，子节点类型是 `Option<Box<Node>>`：
`None` 是空子树，`Some(Box::new(…))` 是真正的子树。插入是递归的——空子树变成新叶子；
非空的把值交给它应属的那一侧，并把回来的子树存回去。`.take()` 把子节点从它的 `Option`
里移出来，好交给递归调用再放回去。

```
if value < n.value {
    n.left = insert(n.left.take(), value);
} else {
    n.right = insert(n.right.take(), value);
}
```

`Node`、`inorder`、`height`、`main` 和 `insert` 的骨架都已写好，直到那个 `if … else`。
在 `// FILL` 注释处输入这两行赋值。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left.take(), value); ——以及 n.right = insert(n.right.take(), value);",
  "`take()` 留下 `None` 并把子节点交给你往下传；把调用结果赋回去，长大的子树就放回原位了。",
]

