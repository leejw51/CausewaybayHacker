[[quest]]
id    = "rust.basic.05.loops"
title = "电车计数"
story = "怡和街电车上的售票员在纸条上记站数：一个累计总数，每隔三站打一个勾。纸条第一行之后全是空白。"
brief = '''
`for` 循环走过一个范围。`1..n` 在 `n` 之前停下；`1..=n` 包含它。
循环变量每一轮都是新的绑定，`+=` 往一个 `mut` 总数上加。

```
for i in 1..=n {
    sum += i;
    if i % 3 == 0 {
        ticks += 1;
    }
}
```

`n` 已经读好，总数已经声明并打印，循环体也写好了。用第一行 `for i in 1..=n {`
替换占位的 `for i in 0..0 {`。

```
input:  6
output: 21
        2
```
'''
hints = [
  "for i in 1..=n {",
  "`..=` 是包含末端的范围。`1..n` 会少一个，总和就差了 `n`。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.functions"
title = "乘车卡"
story = "波斯富街电车站的售卡机卖乘车卡：前十程一个价，之后的更便宜。今天它给每张卡打出的总价都是零。"
brief = '''
函数写作 `fn name(parameter: Type) -> ReturnType { body }`。函数体里最后一个
不带分号的表达式就是返回值——`if … else …` 也是表达式，所以它可以就是最后那一行。

```
fn fare(rides: i64) -> i64 {
    if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }
}
```

`fare` 已经声明，`main` 读取 `n` 并打印 `fare(n)`。用那行 `if … else`
作为函数体，替换占位的 `0`。

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }",
  "不要 `return`，不要分号：`if … else` 是最后一个表达式，它的值就是 `fare` 返回的值。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.basic.07.structs"
title = "摊位卡"
story = "渣甸街每个摊位都有一张卡：名字、价格、数量。卡片打印机打出一个冒号和一个零，前面什么都没有。"
brief = '''
`struct` 把有名字的字段组合在一起。值用一个逐个写出字段名的字面量来构造——
当局部变量和字段同名时，`name: name` 可以缩写成 `name`。方法写在 `impl` 块里，
接收 `&self`，通过它读取字段。

```
impl Stall {
    fn total(&self) -> i64 {
        self.price * self.qty
    }
}

let stall = Stall { name, price, qty };
```

`Stall` 和它的 `impl` 已经声明，`name`、`price` 和 `qty` 已经读好。用
`total` 的函数体替换占位的 `0`，用 `let stall` 字面量替换占位的那一个。

```
input:  mango 12 3
output: mango: 36
```
'''
hints = [
  "let stall = Stall { name, price, qty }; ——而在 total 里：self.price * self.qty",
  "在方法里字段通过 `self` 访问；在 `main` 里变量已经和字段同名，所以字面量可以直接列出它们。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.basic.08.enums"
title = "线路颜色"
story = "时代广场下面的港铁指示牌认得三条线，每条各涂一种颜色。颜色查询对三条线返回的都是空字符串。"
brief = '''
`enum` 是一组封闭的变体，`match` 按变体选择分支。每个分支是 `Pattern => value,`，
编译器坚持每个变体都要有分支——漏掉一个就编译不过。

```
let colour = match line {
    Line::Island => "blue",
    Line::TsuenWan => "red",
    Line::KwunTong => "green",
};
```

`Line` 和从单词到变体的 `match` 已经写好，颜色 `match` 的第一个分支也在。在
`// FILL` 注释处输入另外两个分支，并删掉 `_ => ""` 那一行。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "Line::TsuenWan => \"red\", 和 Line::KwunTong => \"green\",",
  "三个变体都有分支之后，`_ => \"\"` 这个兜底分支就永远到不了，可以删掉。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.vector"
title = "希慎门口的队"
story = "希慎广场的门童把每一组客人的人数写在纸条上。他得报出有多少组、第一组、最后一组和总人数，纸条却一直是空的。"
brief = '''
`Vec<T>` 是可增长的列表，对它做的就是这几件事。`.push(x)` 在末尾添加；
`.remove(i)` 取出下标 `i` 处的元素，后面的整体前移；`v[i] = x` 原地修改下标
`i` 处的元素；`.sort()` 把整个向量升序排好——这四个操作都要求 `Vec` 是 `mut`。

```
v.push(100);
v.remove(0);
v[0] = -1;
v.sort();
```

`v` 装着这一行的整数，结果和它的长度会被打印。在四个 `// FILL` 注释处，
按这个顺序照样输入这四行。

```
input:  1 9 5 2
output: -1 2 5 100
        4
```
'''
hints = [
  "v.push(100); 然后 v.remove(0); 然后 v[0] = -1; 然后 v.sort(); ——添加、删除、修改、排序。",
  "remove(0) 让所有元素前移，原来第二个现在成了 v[0]，修改改的就是它；sort() 再把剩下的排好序。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.basic.10.maps"
title = "点菜单"
story = "怡和街的茶餐厅每道菜只喊一次，厨房要的是按菜名字母顺序排的每道菜的数量。单子上只有菜名，没有数字。"
brief = '''
`BTreeMap` 每个键存一个值，并且自己把键保持有序——没有什么要排序的，
遍历出来已经是顺序。`.insert(k, v)` 添加一个键（或替换它的值），`.remove(&k)`
把键删掉，`.get_mut(&k)` 交回已有值的可变引用——它是个 `Option`，所以要
unwrap，`*` 让你通过它赋值。

```
count.insert("bill".to_string(), 1);
count.remove("tea");
*count.get_mut("bill").unwrap() = 9;
```

`count` 已经统计好这一行的词，并按键的顺序打印。在 `// FILL` 注释处，
按这个顺序照样输入这三行。

```
input:  tea toast tea
output: bill 9
        toast 1
```
'''
hints = [
  "count.insert(\"bill\".to_string(), 1); 然后 count.remove(\"tea\"); 然后 *count.get_mut(\"bill\").unwrap() = 9;",
  "键是 String，所以 insert 要用 \"bill\".to_string()；remove 和 get_mut 接受 &str，而 \"tea\" 本来就是。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.basic.11.sets"
title = "印花簿"
story = "波斯富街小店的积分簿每来一次盖一个章，同一个摊位盖了两次。店员要知道有多少个不同的摊位，还要它们的编号按顺序排好。"
brief = '''
集合里每个值只出现一次，`BTreeSet` 自己把它们保持有序，所以没有 sort 可调——
遍历出来已经是顺序。`.insert(x)` 添加一个值（已经在就什么也不做），
`.remove(&x)` 取出一个值并返回它原来在不在。集合没有"修改"：值就是它自己的键，
所以修改就是删掉旧值再插入新值——第三行做的正是这个，且只在旧值存在时才做。

```
seen.insert(100);
seen.remove(&1);
if seen.remove(&2) { seen.insert(20); }
```

`seen` 已经装着这一行不重复的整数，会打印它的大小和内容。在 `// FILL`
注释处，按这个顺序照样输入这三行。

```
input:  3 1 3 2 1
output: 3
        3 20 100
```
'''
hints = [
  "seen.insert(100); 然后 seen.remove(&1); 然后 if seen.remove(&2) { seen.insert(20); }",
  "remove 接受引用（&1），值原来存在时返回 true——if 用的就是它，所以没有 2 的集合会原样不动。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.basic.12.stack-queue"
title = "盘子堆"
story = "宝灵顿道的点心柜台，盘子摞起来从顶上拿，号码牌从队伍前头叫。两堆东西都原封不动地放在那里。"
brief = '''
`Vec` 就是栈：`.push(x)` 压到顶上，`.pop()` 取走顶部（作为 `Option`），
`.last_mut()` 是顶部的可变引用，用来原地修改它。`VecDeque` 是队列：
`.push_back(x)` 从后面加入，`.pop_front()` 从前面离开——那一边已经写好。

```
stack.push(42);
stack.pop();
*stack.last_mut().unwrap() = 0;
```

两个容器都装着这一行的整数。在 `// FILL` 注释处，按这个顺序照样输入栈的
三行；之后栈会从底到顶打印，下一行是队列的队首。

```
input:  1 2 3 4
output: 1 2 3 0
        1
```
'''
hints = [
  "stack.push(42); 然后 stack.pop(); 然后 *stack.last_mut().unwrap() = 0;",
  "pop 立刻把 42 又拿了下来，所以修改落在原来顶上的那个值——后进先出。",
]

