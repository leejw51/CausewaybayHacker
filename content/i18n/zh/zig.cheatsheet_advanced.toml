# ZIG LAND — CHEATSHEET ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/zig/cheatsheet_advanced.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "zig.cheatsheet_advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet_advanced.01.generic-fn"
title = "任意两个里较大的"
story = "22:00，隧道口。控制室要比较两个车费、两个重量、两个时间戳，想把比较只写一次。"
brief = '''
`max` 返回同一类型两个值中较大的那个，调用时把类型写明：`max(i64, 3, 7)`、
`max(f64, 2.5, 1.0)`。哪一行是它的开头？

```
// ____
    return if (a > b) a else b;
}
```
'''
hints = [
  "类型是第一个参数，在编译期已知，而另外两个参数和返回值都用它来表示。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet_advanced.02.this"
title = "还没有名字的类型"
story = "集装箱栈什么货都装。在它内部，方法需要一个名字来指代正在编写它们的那个 struct。"
brief = '''
在 `Stack` 返回的 struct 里，把 `Self` 绑定到那个 struct 自己的类型，
使 `push` 可以接收 `self: *Self`。

```
fn Stack(comptime T: type) type {
    return struct {
        // ____
        items: std.ArrayList(T) = .empty,
        pub fn push(self: *Self, gpa: std.mem.Allocator, v: T) !void {
            try self.items.append(gpa, v);
        }
    };
}
```
'''
hints = [
  "匿名 struct 没有名字可以指代自己；有一个内置函数交回正在定义的最内层 struct、enum 或 union。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.cheatsheet_advanced.03.fn-pointer"
title = "今晚用哪条规则"
story = "2 号收费亭的车费规则在午夜切换：之前加倍，之后取负。亭子把规则放在一个变量里再调用它。"
brief = '''
`double` 和 `negate` 都是 `fn (i32) i32`。声明一个**运行时变量** `f`，
初始为 `double`，之后可以重新赋值为 `negate`，并以 `f(3)` 的方式调用。
'''
hints = [
  "光秃秃的 `fn` 类型只能在编译期使用，不能放进 `var`；运行时的函数值是指向函数的指针，而函数本身是 `const`。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet_advanced.04.inline-for-fields"
title = "每个字段，按名字"
story = "夜间审计把交给它的每条记录的每个字段都打印出来，不管是什么 struct，也不用告诉它字段名。"
brief = '''
`dump` 对交给它的任何 struct 打印每个字段的名字和值。写出遍历字段的循环的开头，
使 `f.name` 能用在 `@field` 里（Zig 0.16：type-info 的 tag 用小写拼写）。

```
fn dump(v: anytype) void {
    const T = @TypeOf(v);
    if (@typeInfo(T) != .@"struct") @compileError("not a struct: " ++ @typeName(T));
    // ____
        std.debug.print("{s}: {any}\n", .{ f.name, @field(v, f.name) });
    }
}
```
'''
hints = [
  "字段列表是编译期数据，所以普通循环没法给它取下标；循环必须被展开，而 `struct` 是关键字，作为字段名需要加引号。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.cheatsheet_advanced.05.has-field"
title = "它有车牌吗"
story = "汽车有车牌，自行车没有。那一个标签函数两种都会收到，必须在编译期就知道手里拿的是哪种。"
brief = '''
`label` 既用 `Car`（有字段 `plate`）调用，也用 `Bike`（没有字段 `plate`，也没有
这个名字的声明）调用。写出那个 `if` 的开头：对 `Car` 走它的分支，对 `Bike` 则被
裁掉，使 `v.plate` 只在它存在的地方被编译。

```
fn label(v: anytype) []const u8 {
    const T = @TypeOf(v);
    // ____
        return v.plate;
    } else return "no plate";
}
```
'''
hints = [
  "有一个内置函数问一个类型是否有给定名字（以字符串给出）的字段；问声明的那个对字段会说没有。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet_advanced.06.comptime-var"
title = "构建之前就数好"
story = "五张车道平方表在程序运行之前就填好了；填表的循环由编译器展开。"
brief = '''
在一个**运行时**函数里，声明循环计数器 `i`，使下面的 `inline while` 能展开，
并且每次迭代中 `i` 都在编译期已知。

```
fn squares() [5]u32 {
    var out: [5]u32 = undefined;
    // ____
    inline while (i < 5) : (i += 1) {
        out[i] = @intCast(i * i);
    }
    return out;
}
```
'''
hints = [
  "运行时的 `var` 驱动不了 inline 循环，`const` 又不能递增；那个强制可变编译期值的关键字放在 `var` 前面。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.cheatsheet_advanced.07.error-merge"
title = "两份失败方式的清单"
story = "解析一张票可能以两种方式失败，收费又多一种。收费函数把三种都写在一个集合里。"
brief = '''
`ParseError` 是 `error{ Empty, BadDigit }`。把 `TollError` 定义为装着那两个错误
**以及** `Overdrawn` 的集合，使 `fn charge(s: []const u8) TollError!i64` 可以返回
三者中的任何一个。
'''
hints = [
  "错误集合用一个两字符的运算符合并；单个竖线是按位或，不接受类型。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet_advanced.08.switch-on-error"
title = "它是怎么失败的"
story = "糊掉的票一文不值；位数太多的票按最大值算。收费亭根据它捕获到的错误来决定。"
brief = '''
`std.fmt.parseInt(i64, tok, 10)` 会以 `InvalidCharacter` 或 `Overflow` 失败。
错误被捕获并做 switch。哪个分支在字符有误时给出 0？

```
return std.fmt.parseInt(i64, tok, 10) catch |e| switch (e) {
    // ____
    error.Overflow => std.math.maxInt(i64),
};
```
'''
hints = [
  "对错误集合的 switch 用 `error.` 前缀命名每个分支；带点的枚举字面量形式是另一种类型。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.cheatsheet_advanced.09.walk-optional"
title = "沿着链往下"
story = "今晚的收据是一条链，每个节点指向下一个或者指向空无。审计走到链尾，把它们加起来。"
brief = '''
`Node` 是 `struct { v: i64, next: ?*Node }`，而 `cur` 是一个类型为 `?*Node` 的 `var`。
写出一个循环的开头：循环体里 `node` 依次绑定到每个节点，到 `null` 时停下，
而走向下一个节点的步进写在循环头里而不是循环体里。

```
var total: i64 = 0;
var cur = head;
// ____
    total += node.v;
}
```
'''
hints = [
  "条件就是那个可选值本身，捕获是解开后的指针，而冒号后面的 continue 表达式推进的是可选值，不是捕获。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.cheatsheet_advanced.10.union-payload"
title = "他们怎么付的"
story = "一辆车用硬币付、用八达通付，或者被挥手放行。统计把硬币按面值加，卡按双倍加。"
brief = '''
`Pay` 是 `union(enum) { coin: i64, octopus: i64, waved: void }`，而 `p` 是一个 `Pay`。
哪个分支把硬币的 payload 加到 `t` 上？

```
switch (p) {
    // ____
    .octopus => |amount| t += amount * 2,
    .waved => {},
}
```
'''
hints = [
  "payload 由箭头后面的捕获绑定，和对可选值做 `if` 时一样的竖线；普通捕获是值，`|*x|` 是指向它的指针。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.cheatsheet_advanced.11.enum-from-int"
title = "线路上来的一个数"
story = "车轴传感器把车道类别作为一个字节发来。费用表以枚举为键，而枚举知道自己的费用。"
brief = '''
`n` 是一个运行时的 `u8`，装着一个合法的 tag 值。让 `lane` 成为对应的 `Lane`，
使 `lane.fee()` 能编译。

```
const Lane = enum(u8) {
    car, van, truck, bus,
    pub fn fee(self: Lane) i64 {
        return switch (self) { .car, .van => 10, .truck => 20, .bus => 15 };
    }
};
// ____
return lane.fee();
```
'''
hints = [
  "这个内置函数只接收整数；它变成的枚举是结果类型，所以绑定必须写明它。反方向是 `@intFromEnum`。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet_advanced.12.labeled-block"
title = "第一个超重的"
story = "地磅日志被扫描，找第一个超过一百吨的读数；答案是一个值，不是跳出函数。"
brief = '''
`xs` 保证含有一个超过 100 的值。`found` 必须成为第一个这样的 `x`，然后函数
继续使用 `found`。哪一行把 `x` 从代码块里交出来？

```
const found = blk: {
    for (xs) |x| {
        if (x > 100) // ____
    }
    unreachable;
};
return found * 2;
```
'''
hints = [
  "带标签的代码块通过一个 break 产出它的值：break 前面带冒号指明标签，并带上那个值；`return` 会带着错误的数字离开函数，而标签没有被用到。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.cheatsheet_advanced.13.span"
title = "来自 C 那边的字符串"
story = "车牌摄像头的驱动是 C 写的。它交出的名字是一个以零字节结尾的指针，而 Zig 这边想要一个带长度的切片。"
brief = '''
`c_name` 是一个 `[*:0]const u8` —— 没有长度、以 0 结尾的多项指针。让 `s` 成为
覆盖它到（不含）终止符为止的字节的 `[]const u8`，不复制。
'''
hints = [
  "多项指针不会强制转换成切片：得有东西走到哨兵处来找出长度。有一个 std.mem 函数正是做这个的，而且只接收指针。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.cheatsheet_advanced.14.to-owned-slice"
title = "把清单交出去"
story = "偶数号车道被收集进一个列表，而调用者想要裸切片，用完后用 gpa.free 释放。"
brief = '''
`list` 是一个用 `gpa` 填满的 `std.ArrayList(i64)`。把它的内容作为一个 `[]i64` 返回，
由调用者用 `gpa.free` 释放，`list` 不再有任何东西要释放，也不复制任何东西
（Zig 0.16：列表不持有分配器）。

```
fn evens(gpa: std.mem.Allocator, xs: []const i64) ![]i64 {
    var list: std.ArrayList(i64) = .empty;
    errdefer list.deinit(gpa);
    for (xs) |x| if (@rem(x, 2) == 0) try list.append(gpa, x);
    // ____
}
```
'''
hints = [
  "`.items` 仍然归列表所有，会被释放两次或者永远不释放；转移所有权的那个调用会收缩到合适大小，所以它可能失败，并且接收分配器。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.cheatsheet_advanced.15.get-or-put"
title = "一次查找，不是两次"
story = "控制室的车牌计数每辆车加一次，而夜班拒绝把同一个车牌哈希两遍。"
brief = '''
`counts` 是一个 `std.AutoHashMap(i64, i64)`。用一次查找给 `x` 计数：第一次见到的
键在递增前从 0 开始，已经在的键保留它的计数。

```
const gop = try counts.getOrPut(x);
// ____
gop.value_ptr.* += 1;
```
'''
hints = [
  "结果带着一个说明键是否已存在的标志和一个指向槽位的指针；新槽位在你写入之前是 undefined。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.cheatsheet_advanced.16.dupe-key"
title = "活得比那一行长的键"
story = "车牌一行一个地进入同一个缓冲区。今晚见过的车牌集合不能指向一个即将被覆盖的缓冲区。"
brief = '''
`seen` 是一个用 `gpa` 创建的 `std.StringHashMap(void)`，而 `word` 是一个指向行缓冲区的
`[]const u8` 切片，那个缓冲区会被下一次读取覆盖。把 `word` 作为一个在缓冲区变化后
仍然有效的键插入。键在最后会被一个一个释放。
'''
hints = [
  "字符串 map 存的是你给它的切片，不是字节；先用分配器把它们复制一份，而复制也可能失败。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.cheatsheet_advanced.17.debug-allocator"
title = "会告发你的分配器"
story = "夜间构建用的是那个会报告每一个没还回来的字节的分配器。它的名字在 0.16 改了，旧的编译不过。"
brief = '''
Zig 0.16。声明带泄漏检查的通用分配器 `dbg`，使下面两行能编译 —— `deinit`
会修改它并报告泄漏。

```
// ____
defer _ = dbg.deinit();
const gpa = dbg.allocator();
```
'''
hints = [
  "`GeneralPurposeAllocator` 已从 0.16 的 std.heap 里消失；这个类型接收一个配置元组，并从 decl 字面量初始化，而不是一次调用。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.cheatsheet_advanced.18.arena"
title = "最后一次付清"
story = "一个请求的草稿节点和字符串在请求结束时一起死去。没有人一个一个地释放它们。"
brief = '''
`page` 是 `std.heap.page_allocator`。在它之上让 `arena` 成为一个 arena，
使下面的 `a.create(Node)` 和 `std.fmt.allocPrint(a, ...)` 全部由那一个 `deinit` 释放。

```
// ____
defer arena.deinit();
const a = arena.allocator();
```
'''
hints = [
  "arena 建在一个子分配器之上，子分配器是它唯一的参数；它不是泛型类型，也没有配置元组。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.cheatsheet_advanced.19.defer-order"
title = "后进先出"
story = "出收费亭时盖三个章，其中两个是 defer 的。账本显示的是它们落下的顺序。"
brief = '''
这个函数完整打印出什么？

```
fn stamp() void {
    defer std.debug.print("1", .{});
    defer std.debug.print("2", .{});
    std.debug.print("3", .{});
}
```
'''
hints = [
  "被 defer 的语句在作用域退出时按 defer 的相反顺序运行：最后登记的最先跑。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.cheatsheet_advanced.20.split-keeps-empties"
title = "空列也算"
story = "收费导出是逗号分隔的，缺失的列是一个空字段，而不是一个从未存在的字段。`a,,b` 是三列。"
brief = '''
`line` 是一个 `[]const u8`。让 `it` 成为遍历 `line` 中逗号分隔字段的迭代器，
使 `while (it.next()) |f| n += 1;` 把 `"a,,b"` 数成 **3** 个字段，把 `"a"` 数成 1 个。
'''
hints = [
  "两个 std.mem 迭代器都接收单字节分隔符；tokenizer 会吞掉连续的分隔符，只会数出两个，而 splitter 会产出中间那个空字段。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.cheatsheet_advanced.21.sort-context"
title = "按别人的数字排序"
story = "车道下标按另一张表里的重量重新排序。Zig 没有闭包可以捕获那张表，所以把表交给排序。"
brief = '''
`idx` 是一个 `[]usize`，`keys` 是一个 `[]const i64`。用这个比较器按 `keys[i]`
给 `idx` 升序排序：

```
fn byKey(keys: []const i64, a: usize, b: usize) bool {
    return keys[a] < keys[b];
}
```
'''
hints = [
  "第三个参数是比较器作为第一个参数接收的上下文；比较器的类型必须和它完全匹配，所以 `{}` 只配得上 `void` 上下文。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.cheatsheet_advanced.22.truncate"
title = "只要低字节"
story = "车轴传感器把四个读数打包进一个 u32。收费亭要最低的那个字节，而其余部分不为零时不能 panic。"
brief = '''
`x` 是一个装着 `0x1234` 的运行时 `u32`。让 `lo` 成为一个装着 `0x34` 的 `u8` ——
低八位 —— 在 Debug 模式下不触发安全 panic。
'''
hints = [
  "检查值是否放得下的那个转换会在 0x1234 上 panic；丢掉高位的那个只接收一个参数，从绑定处获取宽度。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.cheatsheet_advanced.23.wrapping"
title = "回绕，别停"
story = "车牌哈希就是要溢出的，一晚上几千次。在 Debug 模式下，没有明说的溢出就是一次 panic 和一道关上的栏杆。"
brief = '''
`h` 是一个从接近 `std.math.maxInt(u32)` 开始的 `u32`，而 `c` 是一个 `u8`。
写出哈希步骤 `h = h * 31 + c`，使它按模 2^32 **回绕** —— 不是 panic，
也不是在最大值处截住。
'''
hints = [
  "普通运算符在 Debug 下溢出会 panic，而事后再做掩码已经太迟 —— 乘法早就溢出了。Zig 有两族带后缀的运算符：一族在最大值处饱和，另一族回绕。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.cheatsheet_advanced.24.expect-equal"
title = "证明车费"
story = "面试官运行之前，候选人先对车费表和平均值跑 `zig test`，测试说出它期望什么。"
brief = '''
`fare(3)` 返回一个应为 7 的 `i64`。在 test 块里断言它 —— 值错了测试必须失败，
而且必须能编译。

```
fn avg(sum: i64, n: i64) f64 {
    return @as(f64, @floatFromInt(sum)) / @as(f64, @floatFromInt(n));
}

test "fare" {
    // ____
    try std.testing.expect(avg(5, 2) == 2.5);
}
```
'''
hints = [
  "这个比较返回一个错误联合，所以必须 `try`，否则编译器拒绝忽略它；单参数的 `expect` 接收的是 bool。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet_advanced.25.main-init"
title = "运行时从哪里进来"
story = "Zig 0.16 把 I/O 运行时和分配器放在一个 struct 里交给 main。旧签名只有在两样都不用时才还能编译。"
brief = '''
Zig 0.16。写出 `main` 的开头，使下面的函数体能编译：它从参数上读取 `io` 和 `gpa`，
并且用到了 `try`。

```
// ____
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
}
```
'''
hints = [
  "入口点必须是 `pub`，必须能为了 `try` 返回错误，并且接收一个 std.process 类型的参数，函数体从它上面读字段。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet_advanced.26.stdin-lines"
title = "一次一行"
story = "车牌数据流没有尽头，控制室通过 0.16 的 reader 一次读一行，直到数据流关闭。"
brief = '''
Zig 0.16。`r` 是 `&stdin.interface`，一个覆盖带缓冲 stdin 的 `*std.Io.Reader`。
写出一个循环的开头：把每一行（不含换行符）绑定到 `line`，把读取失败向上传给
调用者，并在输入结束时干净地结束。
'''
hints = [
  "0.16 的 reader 有一个“取到分隔符为止”的调用，返回包着可选切片的错误联合：流结束时为 null，所以先 `try` 再捕获；它的 Exclusive 兄弟不是可选的，到末尾会报错。",
]

