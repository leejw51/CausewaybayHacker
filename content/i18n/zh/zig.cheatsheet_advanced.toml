[[quest]]
id    = "zig.cheatsheet_advanced.30.packed-bitcast"
title = "一个字节里的八个标志"
story = "栏杆控制器每辆车收一个字节：已付、已标记、三位的车道、三位备用。这个 struct 按位布局，并作为那个字节发出去。"
brief = '''
`Flags` 是一个 `packed struct(u8)` —— `@sizeOf(Flags)` 是 1，不像 `extern struct`
那样按 C 的方式布局。`f` 是一个 `Flags`。让 `bits` 成为位模式与 `f` 相同的 `u8`，
这样它就能发到线路上。

```
const Flags = packed struct(u8) {
    paid: bool,
    flagged: bool,
    lane: u3,
    _pad: u3 = 0,
};
```
'''
hints = [
  "整数转换要的是整数输入；packed struct 由那个只接收一个参数、从绑定处获取目标类型的转换逐位重新解释。",
]
