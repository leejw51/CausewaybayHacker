# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet_advanced.28.io-mutex"
title = "一个托盘，两只手"
story = "两个收费亭往同一个现金总额上加。在 0.16 里围着它的锁属于 I/O 运行时，而 std.Thread.Mutex 没有了。"
brief = '''
Zig 0.16。`m` 是一个 `*std.Io.Mutex`，`io` 是一个 `std.Io`。在相加之前取得锁；
下面的 `defer` 会把它还回去。`add` 返回 `void`，不能传播错误。

```
fn add(io: std.Io, m: *std.Io.Mutex, total: *i64, value: i64) void {
    // ____
    defer m.unlock(io);
    total.* += value;
}
```
'''
hints = [
  "0.16 互斥量的普通 `lock` 接收 `io` 并可能返回 `error.Canceled`，而 `void` 函数没法 `try` 它；它那个不可取消的兄弟什么都不返回。",
]

