# ZIG LAND — VERY BASIC, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/zig/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "zig.verybasic"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.verybasic.01.print"
title = "收费亭的第一句"
story = "06:00，铜锣湾隧道口。1 号收费亭的显示屏本该用一行字开始这一班，那一行却不见了。"
brief = '''
程序必须精确打印 `hello, causewaybay` 和一个换行。`w` 是带缓冲的标准输出 writer；它的 `print` 接受一个格式字符串和一个参数元组 —— 没有参数时就是空元组 `.{}` —— 而且它可能失败，所以调用必须加 `try`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "try w.print(\"hello, causewaybay\\n\", .{}); —— try、格式字符串、空元组。",
  "print 总是接受两个参数；而一个可能失败的调用，不允许把它的错误随手丢掉。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.verybasic.02.int-types"
title = "I32 装不下的数"
story = "广场的年报以十亿为单位统计过隧道的车次，而装这个数字的寄存器只有 32 位宽。"
brief = '''
读入 `a`，一个 `i32`。程序需要 `big`：一个 `i64`，装着 `a` 乘以十亿 —— 一旦 `a` 大于 2，`i32` 就装不下这个值。Zig 按操作数的类型做运算，在 `-O Debug` 下装不下时会以 `panic: integer overflow` 停下；所以 `a` 必须在乘法之前加宽成 `i64`，而不是之后。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3
output: 3000000000
```
'''
hints = [
  "const big: i64 = @as(i64, a) * 1000000000; —— 先加宽 a，再用 64 位相乘。",
  "a * 1000000000 是 i32 乘以一个 i32 装得下的常量，所以乘积也是 i32，而三十亿装不下：panic: integer overflow。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.verybasic.03.floats"
title = "带小数的隧道费"
story = "交班报告把早上的收入除以通过的车辆数，打印出来的却是整元，而主管要的是精确到分。"
brief = '''
读入两个正整数 `a` 和 `b`。程序需要 `q`，即 `f64` 形式的商。Zig 从不替你转换数字：两个整数相除还是整数，而 `@floatFromInt` 只有在被告知要变成哪种浮点数时 —— 外面套一层 `@as(f64, ...)` —— 才会把整数变成浮点数。用 `{d:.2}` 打印的那一句已经写好了。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7 2
output: 3.50
```
'''
hints = [
  "const q: f64 = @as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b)); —— 除之前两边都先变成 f64。",
  "@floatFromInt(a) / @floatFromInt(b) 编译不过：在表达式中间，这个内建函数没有可以变成的结果类型。@divTrunc(a, b) 在变成浮点数之前就已经是 3 了。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.verybasic.04.strings"
title = "名字有多长"
story = "快易通账户的名字是登记册里的一行，审计要知道它有多少个字符。"
brief = '''
`s` 是去掉换行后的输入行 —— 一个 `[]const u8`，一个字节切片。程序必须打印它有多少个字节。切片把长度当作字段带着，而不是方法。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  kwan lee
output: 8
```
'''
hints = [
  "try w.print(\"{d}\\n\", .{s.len}); —— len 是切片的字段，所以不加括号。",
  "@sizeOf([]const u8) 是切片本身的大小 —— 一个指针加一个长度，16 字节 —— 而不是它所指向的文本的大小。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.verybasic.05.bool-if"
title = "单数还是双数"
story = "广场把车轴数为双数的车分到左边的车道，单数的分到右边，而负责判断的那个计数从来不改主意。"
brief = '''
读入 `n`，一个 `i64`。程序需要 `even`：一个 `bool`，当 `n` 能被二整除、没有余数时为真。对有符号整数，Zig 拒绝使用 `%` 运算符 —— 余数的符号有歧义 —— 要求你点名使用 `@mod` 或 `@rem`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  4
output: even
```
'''
hints = [
  "const even = @mod(n, 2) == 0; —— 点名取余，再比较。",
  "n % 2 在 i64 上编译不过：有符号整数必须用 @rem 或 @mod。而 @divTrunc(n, 2) 是商，不是余下的部分。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.verybasic.06.loops"
title = "数车轴"
story = "n 辆车经过 2 号收费亭，记录把它们的编号加起来，可它用的循环早开始了一个、又少走了一个。"
brief = '''
读入 `n`。程序必须把 `1 + 2 + … + n` 加到 `sum` 里。循环体已经写好；让 `i` 从 1 走到 `n` 的 `for` 头部就是那个空。对区间 `a..b` 的 `for` 从 `a` 开始、在 `b` 之前停下，值用括号后面的 `|i|` 捕获。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  10
output: 55
```
'''
hints = [
  "for (1..n + 1) |i| { —— 区间的终点不包含在内，所以要比 n 多一。",
  "1..n 停在 n - 1；Zig 里没有 ..=；而对区间的 for 必须捕获它的值，否则编译不过。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.verybasic.07.functions"
title = "它的平方"
story = "车道传感器报上一个读数，显示屏要它的平方，而本该做这件事的函数把读数原样交了回来。"
brief = '''
`square` 接受一个 `i64`，必须返回这个数乘以它自己。它的 return 就是那个空；`main` 读入 `x` 并打印 `square(x)`。Zig 的每条语句都以分号结尾，而 `^` 不是乘方。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  7
output: 49
```
'''
hints = [
  "return x * x; —— 相乘，然后返回结果。",
  "^ 在 Zig 里是按位异或，不是乘方：7 ^ 2 是 5。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.verybasic.08.structs"
title = "一张收费单，两个字段"
story = "收费亭员工的饭堂单每项记一个名字和一个价钱，而新订单的那条记录从来没有被建起来。"
brief = '''
`Item` 有一个 `name` 和一个 `price`。程序已经把两者都读进来了，需要用它们建出 `s`，一个 `Item` —— 结构体用花括号初始化，每个字段都用点号点名，`.field = value`；漏掉一个字段是编译错误，而不是零。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "const s = Item{ .name = name, .price = price }; —— 花括号，每个字段都以点号开头点名。",
  "Item{ name, price } 不是结构体：按位置排列的字段属于元组。Item{ .name = name } 漏了 price，而 Zig 不会替你猜。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.verybasic.09.struct-method"
title = "收费单自己的总额"
story = "每张饭堂单都知道自己的单价和数量，而它的 `total()` 回答的只有单价。"
brief = '''
`Item.total` 必须返回 `price` 乘以 `qty`。方法是在结构体里面声明、第一个参数就是结构体本身的函数，字段要通过这个参数去取 —— 没有隐式的 `this`。return 就是那个空。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "return self.price * self.qty; —— 两个字段都通过 self 取，然后相乘。",
  "在 total 里面，光秃秃的 price 不是编译器认识的名字：字段只能通过参数取到。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.verybasic.10.enums"
title = "两条线，两种颜色"
story = "隧道铜锣湾出口的指示牌写着两条港铁线，而负责选出枚举成员的那根线被剪断了。"
brief = '''
读入一个词，`island` 或 `tsuenwan`。程序需要 `line`：一个按这个词选出的 `Line`；打印颜色的 `switch` 已经写好。在 Zig 里 `if` 是表达式，所以它可以放在声明的右边；两个切片用 `std.mem.eql` 比较，绝不用 `==`。类型声明了之后，枚举值可以只写成 `.island`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = if (std.mem.eql(u8, word, \"island\")) .island else .tsuen_wan; —— 一个 if 表达式，切片按内容比较。",
  "word == \"island\" 是拿切片和指针比较，编译不过；Zig 里没有 ? : 运算符，if/else 就是那个表达式。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.verybasic.11.vector"
title = "硬币，一枚接一枚"
story = "硬币一枚一枚掉进 4 号收费亭的硬币盘，而计数列表从来没有变长过。"
brief = '''
读入一行整数。每个值 `x` 读到时都必须追加到 `std.ArrayList` `xs` 里；循环和打印已经写好。ArrayList 自己不持有分配器：每个可能让它变长的调用都要递给它 `gpa`，而且可能失败，所以要加 `try`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "try xs.append(gpa, x); —— 先是分配器，再是值，前面加 try。",
  "只写 append(x) 少了一个参数：列表不记得分配器。没有 try，错误联合就被忽略了，这是编译错误。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.verybasic.12.vector-edit"
title = "第一个过闸的"
story = "闸杆前的队列是一串车辆编号，第一辆已经过去了，却还在名单上。"
brief = '''
`v` 装着这一行的整数。程序必须删掉第一个元素，然后按顺序打印剩下的。ArrayList 有一种删除会保持剩余元素的顺序，另一种用最后一个元素填补空位；两者都返回被删掉的值，而这个值 Zig 不许你随手丢掉 —— 必须赋给某个东西，没人要的话就赋给 `_`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "_ = v.orderedRemove(0); —— 下标 0，其余的往前挪，返回值被有意丢掉。",
  "swapRemove(0) 把最后一个元素搬进 0 号位置，顺序就没了；pop() 取走的是最后一个；而没有 _ = 的 orderedRemove 是被忽略的值，编译不过。",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.verybasic.13.list"
title = "排到最前面"
story = "故障车道把它的出车记录放在一个链表里，每条新记录都应该插在最前面。"
brief = '''
读入一行整数。每个 `item` 都必须链接到 `std.DoublyLinkedList` `l` 的**最前面**，这样最后读到的最先打印。这个链表是侵入式的：它通过指针链接嵌在每个 `Item` 里的 `node` 字段；打印它们的遍历已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "l.prepend(&item.node); —— 链表通过指针链接嵌入的 node。",
  "append 保持输入的顺序；是插在最前面才把它倒过来。而链表接受的是 *Node，所以 & 不能省。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.verybasic.14.maps"
title = "计数板"
story = "广场的计数板统计每一类通过的车辆，而那个数字从来不动。"
brief = '''
读入一行词。对每个 `word`，它在 `counts`（一个 `std.StringHashMap(i64)`）里的计数都必须加一。`get` 回答的是一个可选值 —— 还没见过的词是 `null`，`orelse` 把它变成零 —— 而 `put` 存入新的计数。循环和排好序的打印已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "try counts.put(word, (counts.get(word) orelse 0) + 1); —— 带默认值读取，加一，存回去。",
  "counts.get(word) + 1 编译不过：get 返回 ?i64，可选值在被 orelse 解开之前不能拿来相加。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.verybasic.15.hashtable"
title = "查一查，查不到也行"
story = "收费表是一个以车辆类别为键的哈希表，查询一个谁都没听说过的类别，必须回答负一，而不是编出来的零。"
brief = '''
`table` 把名字映射到价钱，由第一行建成。读入一个名字 `q`。程序需要 `price`：键存在时是表里的值，不存在时是 `-1`。`get` 交回的是一个可选值，而可选值在解开之前不是数字 —— `orelse` 给出默认值，`.?` 遇到 `null` 会 panic。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "const price = table.get(q) orelse -1; —— 可选值，以及它为 null 时用什么。",
  "对不存在的键用 table.get(q).? 就是 panic: attempt to use null value；而光秃秃的 ?i64 不能用 {d} 打印。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.verybasic.16.sets"
title = "每个车牌只记一次"
story = "摄像头拍下的车牌有重复，而登记册应该每个只记一次，而且按顺序。"
brief = '''
读入一行整数。每个 `x` 都必须放进 `seen`，一个集合。Zig 的标准库没有集合类型；值类型为 `void` 的哈希表就是一个集合，而 `void` 值写作 `{}`。打印个数和排好序的值的部分已经写好。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "try seen.put(x, {}); —— 键，以及 void 类型唯一的那个值。",
  "put 接受一个键和一个值，即使值什么都不是；append 是列表的说法，而哈希表没有可以往后追加的尾巴。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.verybasic.17.stack"
title = "后进先出"
story = "收据被插到 5 号收费亭的单据钉上，从最上面取下来，而收银员却是从下往上读的。"
brief = '''
读入一行整数。它们全都被压进 `st`，一个当作栈用的 `ArrayList`；然后程序必须从栈顶一个一个取下来，按后进先出的顺序打印这些值。`pop` 返回一个可选值 —— 栈顶的值，或者栈空了之后的 `null` —— 而 `while` 可以每一轮解开一个，遇到 `null` 就停。循环头部就是那个空。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while (st.pop()) |top| { —— pop，捕获值，遇到 null 停下。",
  "for (st.items) 从前往后遍历列表，什么都没取下来；popOrNull 是旧版标准库里的名字。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.verybasic.18.queue"
title = "先进先出"
story = "车辆在 6 号收费亭前排队，按到达的顺序通过，可这个队列一辆车都不收。"
brief = '''
读入一行整数。每个 `x` 都必须压到 `q`（一个 `std.Deque(i64)`）的**后面**；然后程序按它们到达的顺序从前面取出。和 ArrayList 一样，每个可能让 Deque 变长的调用都要递给它 `gpa`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 1 2 3 4
```
'''
hints = [
  "try q.pushBack(gpa, x); —— 从后面进，用 popFront 从前面取。",
  "pushFront 把每一个都放到前一个的前面，队伍就倒过来了；Deque 没有普通的 push，而且它从不记得分配器。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.verybasic.19.heap"
title = "下一个最轻的"
story = "地磅每次都让最轻的货车先过，而本该把它交出来的堆却是倒着的。"
brief = '''
读入一行整数。程序把它们全都压进 `pq`，一个 `std.PriorityQueue`，再一个一个弹出来，它们必须从小到大出来。队列的顺序就是声明它时用的那个函数：`byValue` 对两个元素回答一个 `std.math.Order`，被它判为较小的元素先出来。它的 return 就是那个空。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "return std.math.order(a, b); —— a 较小时排在 b 前面：最小堆。",
  "order(b, a) 是把同一个比较倒过来，也就是起始代码里的那个最大堆；a < b 是 bool，而队列要的是 Order。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.verybasic.20.sorting"
title = "收费排序"
story = "收费按车辆到达的顺序记录，而报告要从小到大排。"
brief = '''
`v` 装着这一行的整数。程序必须把 `v.items` 原地按升序排序。`std.mem` 里的排序函数接受元素类型、切片、一个上下文（没有时是 `{}`）和排序规则 —— `std.sort` 是一个命名空间，不是函数，`asc` 和 `desc` 就住在那里。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "std.mem.sort(i64, v.items, {}, std.sort.asc(i64)); —— 类型、切片、空上下文、排序规则。",
  "std.sort.desc 是降序；std.sort(...) 是在调用一个命名空间；而排序要的是类型和排序规则，不是光一个切片。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.verybasic.21.sort-by-key"
title = "最忙的收费亭排第一"
story = "收入表列出每个收费亭的名字和总额，而看板要最大的排在最上面。"
brief = '''
`rows` 装着 `Row{name, score}` 记录。程序必须按 `score` 从高到低给它们排序。Zig 没有 lambda：比较函数是一个有名字的函数 `byScoreDesc`，按名字传给 `std.mem.sort`，当 `a` 应该排在 `b` 前面时它回答 `true`。它的 return 就是那个空。分数互不相同。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  3
        mei 40
        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "return a.score > b.score; —— 比较函数回答的是“a 是否排在前面？”。",
  "< 会把最小的排在前面，也就是起始代码做的事；两个 Row 不能整个拿来用 > 比较。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.verybasic.22.reverse"
title = "从后往前"
story = "车轴读数是按最新的在前记录的，而报告要从最旧的读起。"
brief = '''
`v` 装着这一行的整数。程序必须把 `v.items` 原地反转 —— 用 `std.mem` 里一个作用于整个切片的函数，先给出元素类型。ArrayList 自己没有反转方法。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "std.mem.reverse(i64, v.items); —— 先是元素类型，再是切片。",
  "v.items[1..] 让第一个元素留在原地；而且根本没有 v.reverse() 可以调用。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.verybasic.23.closures"
title = "附加费"
story = "每一笔收费都要加上同一笔附加费，而本该记住这笔附加费的东西把它忘了。"
brief = '''
读入 `k`，然后读入一行整数。每个值都加上 `k`，然后打印结果。Zig 没有闭包 —— 函数看不到它周围的局部变量 —— 所以这里写好的是最接近的东西：`Adder`，一个把 `k` 放在字段里带着的结构体，还有一个方法 `call`，通过 `self` 取到它。这个方法的 return 就是那个空。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return x + self.k; —— 这个 k 是结构体带着的那个，通过 self 取到。",
  "x + k 编译不过：main 里的 k 在 call 里面看不到，因为 Zig 里没有任何东西会捕获变量。结构体的字段就是那次捕获。",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.verybasic.24.lambdas"
title = "数一数双数车道"
story = "广场各条车道的编号以列表形式送来，办公室想知道其中有多少个是双数。"
brief = '''
`v` 装着这一行的整数。程序需要 `evens`：其中有多少个是双数，由 `countIf` 来数，它接受切片和一个谓词 —— 一个函数指针，`*const fn (i64) bool`。Zig 对 lambda 的回答，是在一个匿名结构体里声明函数，再按名字把它取出来，全写在一行里：`struct { fn f(...) ... }.f`。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "const evens = countIf(v.items, struct { fn f(x: i64) bool { return @mod(x, 2) == 0; } }.f); —— 这个函数，在结构体里声明，再按名字取出来。",
  "没有 .f 的话，参数是一个类型，而不是函数；光秃秃的 fn 是一个声明，不能放在调用里面；== 1 数的是单数。",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.verybasic.25.threads"
title = "一个收费亭，一个线程"
story = "7 号收费亭在第二个线程上合计收入，主线程在等，而那个线程从来没有启动过。"
brief = '''
`v` 装着这一行的整数，`sumInto(xs, out)` 把它们加起来放进 `out`。程序需要 `t`：一个操作系统线程，启动后对 `v.items` 运行 `sumInto`，并带上指向 `result` 的指针；`main` 会 join 它并打印。`std.Thread.spawn` 接受一个配置（默认值用 `.{}`）、函数，以及以元组形式给出的参数，而且它可能失败。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "const t = try std.Thread.spawn(.{}, sumInto, .{ v.items, &result }); —— 配置、函数、放在元组里的参数。",
  "sumInto 要的是 *i64，所以参数是 &result 而不是 result；而 spawn 可能失败，没有 try 就没有东西可以 join。",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.verybasic.26.mutex"
title = "四只手摸一个计数器"
story = "四个收费亭往广场办公室的同一个计数器上加数，而那把互斥锁每一轮都被交还，却从来没有被拿到过。"
brief = '''
四个线程各自给 `counter` 加一，各加十万次。每一轮循环在加的时候都必须持有互斥锁 `mu`。在右花括号处解锁的 `defer` 已经写好；拿锁的那一行就是那个空。`std.Io.Mutex` 要拿着 `io` 来加锁 —— `lock` 可以被取消，返回一个错误联合，而普通的、不可取消的那种形式什么都不返回。解锁一把没人持有的互斥锁是 `unreachable`，在 `-O Debug` 下那就是一次 panic。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "mu.lockUncancelable(io); —— 现在就加锁；已经在那里的 defer 会在这一轮结束时解锁。",
  "mu.lock(io) 返回一个错误联合，work 既不能忽略它也不能返回它；对没人持有的互斥锁调用 mu.unlock(io) 就是走到了 unreachable 的代码。",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.verybasic.27.binary-tree"
title = "溢出"
story = "06:00，3 号收费亭。车轴计数器是一个 `u8`，早上第二百五十六根车轴过来时变成了 `panic: integer overflow`，闸杆放下了；午夜以来的收据得全部手工重新编索引，放进一棵宽到装得下它们的搜索树里。"
brief = '''
这一次 `val` 是 `i64`：足够宽。`insert` 把 `v` 放进以 `n` 为根的搜索树，`n` 是一个可选指针：`null` 的情况已经写好，会从 arena 里造一个新节点。那个空是唯一的一行：把 `v` 送到正确的一边 —— 比 `node.val` 小就往左，否则往右 —— 并把递归返回的结果存下来；这个调用要分配内存，所以要加 `try`。子节点是 `?*Node`，就按它本来的样子往下传 —— 绝不在任何人看过之前就用 `.?` 解开。然后中序遍历按升序打印。

选出能做到这一点的那一行，然后把它敲在 `// FILL` 注释所在的位置。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); —— 递归进其中一边，并把结果存下来。",
  "node.left.? 是在没人看过之前就把 null 子节点解开 —— 第二次 insert 就是 panic: attempt to use null value。子节点要按它本来的可选值往下传；而且小的往左。",
]
