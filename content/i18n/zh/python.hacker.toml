[[quest]]
id    = "python.hacker.16.union-find"
title = "谁和谁连着"
story = "电车网、港铁和小巴线画在同一张纸上。到底有几个彼此分开的网络。"
brief = '''
标准输入是 `n m seed`：`n` 个站，编号 `0..n-1`，`m` 条无向连接。输入里没有连接 —— 你用
**恰好**这个生成器自己构建它们，用会回绕的 64 位算术（手动掩码 —— Python 的整数不会
回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

输出三行：有几个彼此分开的网络，最大的那个有多大，以及 `REDUNDANT <k>` —— 有多少条连接
连的是本来就已经连通的两个站。从一个站连到它自己的连接也算其中之一。

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

对于 `8 5 1`，五条连接是 `6—1`、`4—6`、`2—3`、`2—6`、`1—2`。最后一条连接的两个站已经在
同一个网络里，所以它就是多余的那条，剩下的是 `{1,2,3,4,6}`，外加各自独立的站 `0`、`5`
和 `7`。

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 200000`，带 `m = 200000` 条连接。那个
不是并查集的显而易见的答案 —— 从 `a` 出发把网络走一遍，看 `b` 是否已经在里面，每条连接
一次 —— 是正确的，而它每条连接 `O(n)`，总共 `O(n·m)`：在这台机器上，它跑了**两分钟**还没
结束，而运行限制是十秒。初始代码就是它。带路径压缩和按大小合并的并查集，处理同样的
200000 条连接只要 **0.24 秒**，是在这里用这道题附带的解答实测的。

值得看清楚，因为这是限时笔试里最常见的失败方式：**初始代码并没有错。** 它在样例和两个
小的隐藏用例上都输出完全正确的答案。它被拒绝，只是因为来得太晚了。

并查集：每个站指向一个父节点，`find` 走到根，`union` 让一个根指向另一个。在从 `find`
往回走的路上压缩路径，整个过程每次查询实际上就是常数时间。

把 `find` 写成循环。递归的那个是教科书版本，而它在一条一千长的链上就是一个
`RecursionError` —— 那正是按大小合并要防止的形状，也正是恶意输入在第一次 `find` 压缩它
之前所具有的形状。
'''
hints = [
  "边走边抽取两个端点 —— 每个一步生成器，按那个顺序 —— 而不是先建一个连接列表。这里没有什么需要用到连接两次。",
  "一开始每个站都是自己的父节点，一共 n 组；每次成功的合并让组数减一。",
  "两端已经有同一个根的连接就是多余的那条 —— 数上它，然后继续。自环 a == b 自然会落进这个判断里。",
  "只有根的大小记录才有意义，所以从根上读出最大的，而不是从每个下标上读。max(..., default=0) 不用特殊处理就能应付 n = 0。",
  "parent[x], x = root, parent[x] 一行就完成压缩：右边会先整个求值，然后才进行任何一次赋值，所以旧的 parent[x] 在被覆盖之前就读出来了。",
]

