[[quest]]
id    = "python.hacker.32.modular"
title = "模十亿零七"
story = "这个短语出现在题目底部，房间里一半的人不知道它在要求他们做什么。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询，用会回绕的 64 位算术（手动掩码）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询，计算二项式系数 `C(a, b)` **模 1000000007**。输出全部 `q` 个答案之和（它本身也
模 `1000000007`），然后输出 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这样的规模下，`C(a, b)` 有几十万位。Python 真的会把它算出来 —— `math.comb(200000, 100000)`
存在，而且会返回整个数 —— 而这正是这门语言里的陷阱：它是正确的，每个查询要花几十毫秒，
而它不是“模一个质数”的意思。每次乘法都要边算边取模。问题在于除法：
`a! / (b! (a-b)!)` 在模算术里没有意义。取代它的是**模逆元**，而因为 `1000000007` 是质数，
费马小定理把它交给你：`inverse(v) = v^(p-2) mod p`。Python 三个参数的 `pow(v, p - 2, p)`
就是它，用 C 实现，一次调用。

所以：预先计算一次 `factorial[0..n]`，然后把每个查询答成
`f[a] * inv(f[b]) * inv(f[a-b])`。

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 200000`、`q = 200000`。每个系数独立计算
—— 乘 `b` 项，除 `b` 项，每次一个模逆元 —— 在十秒的运行时限内跑不完；那就是初始代码。一张
共享的阶乘表大约半秒就完成。两者都在这台机器上实测过。

每个中间结果都是两个小于 `2^30` 的值的乘积，所以它放得进 `i64`；在 Python 里无论如何都不会
溢出，每次乘法之后取模的理由是速度，而不是正确性。在 `int` 是 32 位的语言里，两者都是理由，
而那正是这道题会被问到的另一半原因。
'''
hints = [
  "每次乘法之后都取模。Python 不会溢出，但一个二十万位的中间结果乘起来很慢，而 % P 让每个数都保持在 2^30 以下。",
  "pow(v, P - 2, P) 就是模逆元，而它之所以成立，只因为 P 是质数 —— 这就是费马小定理在这里的全部内容。Python 3.8 及以后也接受 pow(v, -1, P)，是同一件事的直接说法。",
  "把阶乘的逆元也预先算好，从 inverse(factorial[n]) 往回推，就能把每个查询里的两次 pow() 调用去掉。过关用不着，但值得说出来。",
]

