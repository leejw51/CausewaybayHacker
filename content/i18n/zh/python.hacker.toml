[[quest]]
id    = "python.hacker.33.grid-paths"
title = "穿过街区，绝不回头"
story = "外卖配送网格，有三条街因为搭竹棚封了。有多少种走法过去，哪一种最便宜。"
brief = '''
标准输入是 `r c pct seed`。按行优先顺序自己构建网格，每个格子抽**两个**值，用会回绕的
64 位算术（手动掩码）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**走，只能穿过通路格子。输出：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同的路线，模
   `1000000007`
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都算在内；没有路线则输出 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序扫一遍就能两个都做：一个格子的路线数是从上面和从左边进来的路线数之和，它的
最佳代价是它自己的代价加上那两个里更便宜的一个。因为你只会向右或向下走，你需要的那两个
格子总是已经算完了 —— 这就是为什么它既不需要递归，也不需要访问集合。带记忆的递归在格子数
上也是线性的，而在 `1000 × 1000` 的用例上它还会有两千层栈帧深，是 Python 上限的两倍；所以
在这里，循环之所以是答案，除了通常的理由还有这一条。

`PATHS` 的计数模 `1000000007`，理由和平常一样：在 `1000 × 1000` 的隐藏用例上，真实的数
有六百多位。Python 装得下它。还是边加边取模；题目这么说了，而不取模的数是错的答案。

**大用例强制的是什么：**它拒绝任何枚举路线的答案。路线的数量比房间里的原子还多。
'''
hints = [
  "每个格子都抽两个值，包括两个角 —— 生成器不会跳过它们，只是不会把它们堵上。",
  "一个通路格子，如果上面和左边都没有通路的邻居，就只有零条路线可达，也没有最佳代价；None 是诚实的“不可达”，而 `is not None` 就是比较或相加之前的守卫。",
  "终点可以是通路却仍然不可达，这时 PATHS 恰好是 0，MIN 是 -1。有一个隐藏用例就是这样。",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "python.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个骑手得分相同，排行榜每次重绘都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个骑手，骑手 `i` 有下标 `i` 和一个分数，用会回绕的
64 位算术（手动掩码）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分数**降序**给骑手排序。分数相同的骑手必须保持他们到达的顺序。输出他们的下标，用空格
分隔，然后输出 `TIES <k>` —— 你排好的顺序里有多少对相邻的骑手分数相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎全是平局，答案几乎完全取决于平局会怎样。

**这道题讲的是知道你手里拿的是哪一种排序。** Python 的 `sorted` 和 `list.sort` **总是**
稳定的 —— Timsort 承诺了这一点 —— 而文档写明 `reverse=True` 会守住这个承诺：即使排序反转，
相等的元素也保持原来的顺序。*不*稳定的是先升序排序、再用 `[::-1]` 把列表翻过来：那会把
平局连同其他一切一起反转，而初始代码正是这么做的。在样例上它明显把平局打乱了；在真实输入
上它总会这样。

正确答案有两个，你应该两个都能给出。用 `reverse=True` 或者取负的键按降序排序，剩下的交给
稳定性。**或者**让比较成为**全序** —— 按 `(-score, index)` 排序，这样任何两个元素都不会
相等，稳定性也就不再是个问题。第二种是默认该用的；全序没有什么需要证明的。

时钟在这里量的不是速度，也没有什么可量的：不管你写哪一种，`sorted` 都是 `sorted`。这四个
用例完全取决于平局会怎样。这道题讲的是知道你的排序承诺了什么，而不是它多快兑现承诺。
'''
hints = [
  "删掉 [::-1]，加上 reverse=True。那就是稳定的答案，而且文档承诺了：reverse=True 不会把平局反转。",
  "另一个答案按 key=lambda r: (-r[0], r[1]) 排序 —— 一个全序，所以没有剩下的平局可以不稳定。永远不要直接给元组排序：(score, index) 在平局时比较下标，是升序，而你要的是分数降序、下标升序。",
  "TIES 数的是排好的顺序里相邻的相等分数，不管你写的是两种里的哪一种，这个数都一样 —— 暴露你的是下标的顺序。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "python.hacker.28.lru"
title = "递归上限"
story = "7-32 房，最后一道题，第四次。面试官把显示器关掉，白板上的语言是那种到一千层栈帧就停下的。"
brief = '''
第一行是 `cap q`，然后要么是 `q` 行操作，每行是 `PUT <key> <value>` 或 `GET <key>` ——
要么，当第一行带着**第三个**数 `seed` 时，后面再没有别的行，`q` 个操作来自下面的生成器。

实现一个固定容量的缓存，满了的时候淘汰**最近最少使用**的条目。`GET` 和 `PUT` 都算使用
一个键。`PUT` 一个缓存里已经有的键，会替换它的值并让它成为最近使用的 —— 它不增加条目，
所以不管缓存多满，它都不淘汰任何东西。

对每个 `GET` 输出值，不在则输出 `-1`。最后输出剩下的键，最近使用的在前，用空格分隔 ——
缓存为空时输出 `-` —— 然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把样例走一遍：`GET 1` 让 `1` 重新成为最近的，所以当 `PUT 3` 需要腾地方时，走的是 `2`。
`GET 2` 未命中。`GET 3` 命中并让 `3` 成为最近的，这就是为什么剩下的键打印成 `3 1`。

生成的形式，用会回绕的 64 位算术（手动掩码）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**初始代码是正确的。** 在样例和你能敲出来的每个用例上运行它，它每次都对。它处理操作的
方式是函数式语言的方式 —— 处理第一个，对剩下的递归 —— 而 Python 不是函数式语言。它没有
尾调用消除，每次调用都是一个真正的栈帧，而 `sys.getrecursionlimit()` 是 `1000`。隐藏的
生成用例有两千个操作，初始代码死在它上面，报的是

```
RecursionError: maximum recursion depth exceeded
```

那就是 boss。`sys.setrecursionlimit(10000)` 能让它消失，而它是错误的答案：上限在那里，是
因为解释器底下的 C 栈是有限的，把上限调得够高，会把一个干净的异常变成段错误。递归从来就
不是这个问题的形状。操作是一个序列；序列就是一个 `for` 循环。（而且每次调用时的 `ops[1:]`
都会复制列表的剩余部分，所以递归版本还是平方级的，只是没有人注意到，因为它从来没走到那一步
让这件事变得要紧。）

然后是缓存本身。教科书的答案是一个指向双向链表的哈希表，而 Python 标准库里就有一个，把
指针藏了起来：`collections.OrderedDict`。`move_to_end(key)` 就是“碰一下”，
`popitem(last=False)` 就是从冷的一端淘汰，两者都是 `O(1)`，所以这里的每个操作都是 `O(1)`，
你可以不打折扣地这么说。（普通的 `dict` 从 3.7 起就保持插入顺序，只是少了 `move_to_end`；
把键删掉再重新插入，是手写出来的同一个技巧。）初始代码的缓存是一个存 `(value, stamp)` 对的
dict，淘汰时扫一遍找最旧的时间戳，那是 `O(cap)` —— 正确，而且是要修的第二件事。
'''
hints = [
  "读回溯：它以 RecursionError 结尾，是同一个函数的一千行。这一半的修复是对 ops 的一个 for 循环，别的什么都不变。",
  "OrderedDict：每次命中和每次覆盖都 `move_to_end(key)`，新键到来而缓存已满时 `popitem(last=False)`。覆盖一个已经存在的键不是淘汰 —— 在判断缓存已满之前先检查成员资格。",
  "剩下的键就是从热的一端读出的 OrderedDict：reversed(cache) 是最近使用的在前，所以最后一行不需要排序，也不需要时间戳。",
  "sys.setrecursionlimit 不是修复，而知道为什么就是他们想要的答案：它挪动上限，而不是去掉上限，过了某个点，解释器就不再抛异常，而是开始崩溃。",
]
