`prefix[j] - k`。给 map 预先放进 `0 → 1`，用于从开头起算的那些段。

这里的四个用例最多五个数，时钟在它们身上量的不是速度：遍历每个起点和每个终点的 `O(n²)`
双重循环能通过全部四个。门槛是真实存在的 —— 在一整天的营业额上，那个双重循环要跑好几分钟
—— 但它不是这些用例要检查的。它们检查的是容易出错的那部分：`{0: 1}` 这个种子，以及先查
再记。
'''
hints = [
  "先查之前的前缀，*再*记录当前的前缀，否则当 k 为 0 时，长度为零的段会把自己数进去。",
  "一开始就 seen = {0: 1}，正是这一点让从下标 0 开始的段能被找到。",
  "最后一个前缀就是总和，所以第二行不花任何额外代价。collections.defaultdict(int) 能省掉那些 .get(…, 0)，Counter 也能。",
]

