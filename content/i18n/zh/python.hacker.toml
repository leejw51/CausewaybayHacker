id    = "python.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到目前为止通关的每张地图数的都是跳数。电车不在乎有几站；它在乎每站要多久。"
brief = '''
标准输入是 `n m seed`：`n` 个站，`m` 条无向带权边。用**恰好**这个生成器自己构建图，用
会回绕的 64 位算术（手动掩码 —— Python 的整数不会回绕）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

输出从站 `0` 到每个可达站的最短距离之和（包括 `0` 本身，它是 `0`），然后输出
`MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 100000`、`m = 200000`。无论如何 Dijkstra
都是正确的算法；时钟决定的是优先队列。每次扫描所有未访问的节点找最小值是 `O(V²)` ——
`10^10` 步，在 Python 里那不是十六秒，而是整个下午 —— 而运行时限是十秒。`heapq` 让它变成
`O((V + E) log V)`，大约三分之一秒就完成。两者都在这台机器上、用这道题附带的两个程序实测
过：初始代码就是扫描的版本。

值得看清楚，因为这是在限时笔试里失败最常见的方式：**初始代码并没有错。**它打印的答案完全
正确。它被拒绝，只是因为来得太晚了。

`heapq` 是最小堆，所以压入 `(distance, node)`，元组的顺序会搞定其余的事。它没有
decrease-key，而你也不需要：把改进后的距离作为新条目压进去，弹出时如果某个条目的距离已经
比你记录的更差，就跳过它。这个“过期条目”的跳过就是人们会忘掉的那一行，没有它，堆会无限
增长。
'''
hints = [
  "heapq 里放 (distance, node) 元组：距离在前，条目就按它排序，而 heapq 本来就是最小堆。",
  "`if d > dist[u]: continue` 就是过期条目的跳过。没有它，算法仍然正确，而堆会塞满作废的条目。",
  "float(\"inf\") 是诚实的“未到达”：它比任何 int 都大，松弛时不需要 None 检查。生成器的生成树那一半保证每个节点都可达，所以最后的过滤从来不会去掉任何东西 —— 但还是留着它，因为这道题带不可达节点的版本就是追问。",
]

