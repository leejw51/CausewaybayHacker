title = "不断变化的总数"
story = "整条连锁店一天三十万次收银操作，一半是更正，而有人要的是滚动总额。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后执行 `q` 个操作，全部来自同一个生成器，
用会回绕的 64 位算术（手动掩码）：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

输出所有查询答案的累计总和，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里的复杂度是强制的。** 朴素的答案 —— 每次查询都 `sum(values[l:r+1])` —— 每次查询是
`O(n)`，而切片和求和都在 C 里运行，这让它在任何小规模上都快得有欺骗性。所以大的隐藏用例是
`n = 500000, q = 300000`，朴素答案要碰 `2 × 10^10` 量级的元素，在这台机器上花了**三分钟以上**，
而运行时限是十秒。Fenwick 树不到一秒就做完全部。两者都用这道题里的两个程序实测过。

（这道题的 Rust 和 Go 版本跑四百万次操作。Python 跑三十万次，因为一棵正确的 Python
Fenwick 树同样没法在任何诚实的时限内跑完四百万次 —— 而重点是把正确的结构和错误的结构分开，
不是把 Python 和 C 分开。）

这就是面试官想钓出来的那一课：*单点更新、区间求和*正是 Fenwick 树为之而生的形状。三个短
函数 —— add、prefix，以及作为两个前缀之差的 range —— 而 `i & -i` 是你按最低置位迈步的方式，
它在 Python 整数上的效果和在补码整数上完全一样。
'''
hints = [
  "对每个初始值调用一次 add 来建树。O(n) 的自底向上建树是个不错的优化，但不是时钟要测的东西。",
  "i & -i 分离出最低的置位 —— 做位运算时，Python 的负整数表现得就像补码，所以不需要 wrapping_neg。加上它就沿树往上走；减去它就往下走。",
  "range(l, r) 是 prefix(r + 1) - prefix(l)，把这一对差一处理对，就是调试的大部分工作。在循环里把 self.tree 绑到一个局部变量上，在 CPython 里是实打实的提速，也是这道题唯一需要的微优化。",
]

