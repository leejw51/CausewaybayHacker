        mei 40
        alex 55
        sam 40
output: alex 55
        mei 40
        sam 40
```
'''
hints = [
  "byScore 里写 if (a.score != b.score) return a.score > b.score; 然后 return std.mem.lessThan(u8, a.name, b.name);，main 里写 std.mem.sort(Row, rows.items, {}, byScore);。",
  "比较函数回答的是“a 是否排在 b 前面”：分数高的在前，平局时名字小的在前。删掉它下面占位的 return。",
  "上下文参数是 _: void，因为没有上下文；排序时为它传入 {}。",
]

