  "try seen.put(100, {}); _ = seen.remove(3); _ = seen.remove(1); try seen.put(-1, {}); —— 最后两个调用在同一行。",
  "在没有 3 的集合上 remove(3) 返回 false，什么都不改；-1 已经在里面时 put(-1, {}) 用 void 覆盖 void：两者都是安全的。",
]

