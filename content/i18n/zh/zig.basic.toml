  "try counts.put(gpa, \"gun\", 12); _ = counts.remove(\"siu\"); counts.getPtr(\"mai\").?.* = 0; 然后 std.mem.sort([]const u8, keys.items, {}, lessStr); —— 增、删、改、排序。",
  "unmanaged 映射在 put、getOrPut 和 deinit 上接收 gpa；remove 和 getPtr 不分配任何东西，也不接收它。",
