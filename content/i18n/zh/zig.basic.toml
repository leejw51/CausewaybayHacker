return std.mem.lessThan(u8, a.name, b.name);
std.mem.sort(Row, rows.items, {}, byScore);
```

行的读入和打印都写好了。把两行比较代码敲在 `byScore` 里的 `// FILL` 处，把
`std.mem.sort` 敲在 `main` 里的那一个。

```
