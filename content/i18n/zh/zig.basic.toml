# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.basic.18.binary-tree"
title = "THE NULL"
story = "06:00，铜锣湾隧道口。夜里的收据是一棵金额树，而文员解包了一个从来不存在的左子节点 —— panic: attempt to use null value，就在铜锣湾唯一一个绝不能错的收费亭上。"
brief = '''
二叉搜索树由节点组成，每个节点有一个值和两个可选的子节点指针 `?*Node`，在有东西挂上去
之前是 `null`：较小的值挂在 `left` 下面，较大的挂在 `right` 下面。插入是递归的：空的
子树（`null`）变成一个由 `gpa.create` 造出的新节点，否则值沿着一侧往下走 —— 而那一侧
变成什么都要存回去，因为那一侧片刻之前可能还是 `null`。`n orelse { ... }` 是先处理 null
情况的写法，而对一个没人检查过的子节点用 `.?` 就是
`panic: attempt to use null value` —— 那就是 boss，也正是那两行占位代码所做的事。

```
cur.left = try insert(gpa, cur.left, v);
cur.right = try insert(gpa, cur.right, v);
```

`Node`、`null` 情况、`inorder`、`height`、`freeTree` 和 `main` 都已经写好。把两行下降的
代码敲在两个 `// FILL` 处，替换掉占位符：左边的在 `if` 里，右边的在 `else` 里。

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "左边写 cur.left = try insert(gpa, cur.left, v);，右边写 cur.right = try insert(gpa, cur.right, v);。",
  "把结果存回去：子节点可能是 null，而新节点就是 insert 的返回值。insert 可能分配失败，所以这个调用要 try。",
  "占位代码在还没有任何东西挂上去之前就用 .? 解包子节点 —— 这就是 panic。真正的那一行把 null 交给 insert，而它的 orelse 就是那个检查。",
]
