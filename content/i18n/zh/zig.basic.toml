挪；`pop()` 取下最后一个并以可选值交回，`_ =` 把它丢弃；`items[0]` 是最前面，给它赋值
就改了第一个元素；`std.mem.sort` 给切片排序。

```
try l.insert(gpa, 0, 0);
_ = l.pop();
l.items[0] = 99;
std.mem.sort(i64, l.items, {}, std.sort.asc(i64));
```

`l` 已经按顺序存着这一行的整数。把这四行敲在 `// FILL` 处：在最前面加 `0`，删掉最后
一个元素，把最前面的覆盖成 `99`，然后排序。列表会被打印出来。

```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "try l.insert(gpa, 0, 0); _ = l.pop(); l.items[0] = 99; std.mem.sort(i64, l.items, {}, std.sort.asc(i64)); —— 每行一个，按这个顺序。",
  "insert 依次接收分配器、下标、值；pop 返回 ?i64，而 _ = 表示你不要它。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.basic.10.maps"
title = "计数板"
story = "广场的计数板列出了夜里经过的每一种车型，一辆车一个词，而稽核要的是每种车型一行，带一个计数。"
brief = '''
Zig 的标准库没有按树排序的映射：`std.StringHashMap(i64)` 就是字典，用 `.init(gpa)` 创建，
这样它会记住自己的分配器，它的键是 `input` 的切片，而 `input` 活得比它久。`put(k, v)`
加一个键（或者覆盖已存在的）；`remove(k)` 取出一个并告诉你它原来在不在 —— `_ =` 把这个
答案扔掉；`getPtr(k)` 是指向一个已存在的键的值的指针，键不存在时是 `null`，所以
`.?.* = 9` 先解包再通过它写入。哈希映射遍历键时没有顺序，所以脚手架把它们复制出来并
排好序再打印；下一个节点会让你来写那一行。

```
try counts.put("crab", 1);
_ = counts.remove("rice");
counts.getPtr("fish").?.* = 9;
```

`counts` 已经统计了这一行的每个词，而且每一行都有 `fish`。把这三行敲在 `// FILL` 处：
加上 `crab` 为 `1`，删掉 `rice`，再把 `fish` 设为 `9`。排好序的打印已经写好了。

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
'''
hints = [
  "try counts.put(\"crab\", 1); _ = counts.remove(\"rice\"); counts.getPtr(\"fish\").?.* = 9; —— 增、删、改。",
  "put 会创建不存在的键；getPtr 不会，它会交回 null。键必须已经存在时用 getPtr —— .? 就是它确实存在的保证。",
]

