哈希集合没有顺序。

```
try seen.put(100, {});
_ = seen.remove(3);
_ = seen.remove(1); try seen.put(-1, {});
```

`seen` 已经存着这一行的不同值。把这三行敲在 `// FILL` 处：加上 `100`，删掉 `3`，然后把
`1` 变成 `-1`。大小和排好序的遍历已经写好了。

```
input:  3 1 3 2 1
output: 3
        -1 2 100
```
'''
