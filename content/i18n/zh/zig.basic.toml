_ = st.pop();
st.items[st.items.len - 1] = 99;
```

每个数都已经压进了 `st` 和 `q`。把这三行敲在 `// FILL` 处：在栈顶加 `0`，再把它弹出来，
然后把栈顶覆盖成 `99`。然后栈被清空并打印，队列取出前两个。

```
input:  1 2 3 4
output: 99 3 2 1
        1 2
```
'''
hints = [
  "try st.append(gpa, 0); _ = st.pop(); st.items[st.items.len - 1] = 99; —— 在栈上增、删、改；队列不动。",
  "items.len - 1 是栈顶，所以给那里赋值，改的就是下一次 pop() 会交回的那个元素。",
]

