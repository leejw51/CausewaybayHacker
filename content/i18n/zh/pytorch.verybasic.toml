[[quest]]
id    = "pytorch.verybasic.22.linear"
title = "第一层"
story = "四个特征进，两个类别出，而本该坐在两者之间的那一层还没建。"
brief = '''
`nn.Linear(in_features, out_features)` 是一次矩阵乘法加一次偏置相加，权重替你建好。参数顺序是*输入*在前、*输出*在后——`(batch, 4)` 进去，`(batch, 2)` 出来。

选出构建这一层的那一行。

```
output: (3, 2)
```
'''
hints = [
  "nn.Linear(4, 2) ——输入特征数在前，输出特征数在后。",
  "nn.Linear(2, 4) 建出来的层是反过来的，输入就装不进去了。",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "pytorch.verybasic.23.parameters"
title = "它有多大"
story = "经费申请要一个参数量，而大家手里唯一的数字是层数。"
brief = '''
`model.parameters()` 逐个产出这个模块拥有的每一个可学习张量，`p.numel()` 是其中一个里有多少个数字。一个 `Linear(4, 2)` 拥有一个 `(2, 4)` 的权重和一个 `(2,)` 的偏置：8 + 2 = 10。

选出把它们加总的那一行。

```
output: 10
```
'''
hints = [
  "sum(p.numel() for p in model.parameters()) ——numel 数的是数字的个数，不是张量的个数。",
  "len(list(model.parameters())) 数的是张量，那是 2：一个权重和一个偏置。",
]

