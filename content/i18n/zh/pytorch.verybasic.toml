[[quest]]
id    = "pytorch.verybasic.13.mean"
title = "平均进风温度"
story = "四个进风温度，平均值每一次都算出整数，冷却曲线不相信这一点。"
brief = '''
`mean` 只对浮点张量有定义——整数张量会直接抛出异常，而不是悄悄舍入。`x.float()` 返回一份浮点副本，它的均值是浮点数。

选出对四个读数求均值的那一行。

```
output: 2.5
```
'''
hints = [
  "x.float().mean() ——先转换，再求平均。",
  "对 int64 张量调 x.mean() 会抛出异常；在这里 torch 不会替你挑一个 dtype。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.verybasic.14.argmax"
title = "谁赢了"
story = "分类器打印它选中的那个类别的分数，那是一个没人能据以行动的数字。问题一直是：哪个类别。"
brief = '''
`max` 给出最大值。`argmax` 给出最大值*在哪里*——它的下标——而那才是分类器真正的答案。

选出给出最大分数下标的那一行。

```
output: 2
```
'''
hints = [
  "scores.argmax() ——arg 的意思是“……的下标”，不是“……处的值”。",
  "scores.max() 给出 0.9，那是分数而不是类别。",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "pytorch.verybasic.15.mask"
title = "越线"
story = "六个进风温度，30 度处一个过热断路。警报用 Python 循环来数，而循环的耗时已经挤进了读数间隔。"
brief = '''
拿张量和一个数比较，得到一个由 `True`/`False` 组成的张量，每个元素一个。对这个布尔张量求和就是在数 `True` 的个数，因为 `True` 是 1。

选出数出严格高于 30 的读数有几个的那一行。

```
output: 2
```
'''
hints = [
  "(t > 30).sum() ——括号很重要，因为 .sum() 比 > 绑定得更紧。",
  "t >= 30 会把恰好等于断路值的那个读数也算进去，而它并没有高于断路值。",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "pytorch.verybasic.16.cat"
title = "两批，合成一批"
story = "两个采集文件，各两行，而加载器在拿到一个四行的张量之前什么都不肯做。"
brief = '''
`torch.cat` 沿着一个已经存在的轴把张量接起来。沿 `dim=0` 接两个 `(2, 2)` 就是把行叠起来，得到 `(4, 2)`。

选出造出一批四行的那一行。

```
output: (4, 2)
```
'''
hints = [
  "torch.cat([a, b], dim=0) ——张量放在一个列表里，dim=0 是行的轴。",
  "torch.stack 会造出一个新轴，那样形状会是 (2, 2, 2)。",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "pytorch.verybasic.17.unsqueeze"
title = "一个样本的一批"
story = "一个读数，交给一个只见过批的模型。它拒绝了：它要两个维度，而拿到的只有一个。"
brief = '''
在批上训练出来的模型期望前面有一个批的轴。`unsqueeze(0)` 在位置 0 插入一个大小为 1 的新轴，把 `(3,)` 变成 `(1, 3)`——一个样本，三个特征——一个数字都不改。

选出把这一个读数变成一个样本的一批的那一行。

```
output: (1, 3)
```
'''
hints = [
  "one.unsqueeze(0) ——0 是新轴放的位置，而批的轴放在最前面。",
  "unsqueeze(1) 给出 (3, 1)，那是三个批、每批一个特征——反过来了。",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "pytorch.verybasic.18.transpose"
title = "反过来的表"
story = "混合表送来的时候行和列颠倒了，矩阵乘法说内维度不一致。"
brief = '''
`x.t()` 交换二维张量的两个轴：`(2, 3)` 变成 `(3, 2)`，第 `i` 行第 `j` 列变成第 `j` 行第 `i` 列。

选出把这张表转置的那一行。

```
output: [[1, 4], [2, 5], [3, 6]]
```
'''
hints = [
  "x.t() ——短的那个，而且它是方法调用，所以括号不能少。",
  "x.reshape(3, 2) 也会给出一个 (3, 2)，但数字落在了错误的格子里。",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "pytorch.verybasic.19.requires-grad"
title = "会学习的那一个"
story = "地下室里的第一个参数。它装着一个数字，而到目前为止没有任何东西知道该往哪个方向挪它。"
brief = '''
张量只有在你要求时才会记录发生在它身上的事。`requires_grad=True` 把一个张量标记为要学习的东西，从此对它的每一个运算都会被记住，好让梯度可以一路追溯回来。

选出造出一个装着 2.0 的可学习张量的那一行。

```
output: True 2.0
```
'''
hints = [
  "torch.tensor(2.0, requires_grad=True) ——这个标志是构造函数上的一个关键字参数。",
  "requires_grad 只对浮点张量有效；整数张量不能携带梯度。",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "pytorch.verybasic.20.backward"
title = "哪边是下坡"
story = "`w` 是 3.0，损失是 `w * w`，而 `w.grad` 是 None。还没有任何东西叫图反向跑一遍。"
brief = '''
前向传播构建一张图；`backward()` 反向走一遍这张图，把梯度留在 `.grad` 里。对于 `y = w * w`，导数是 `2w`，所以在 `w = 3.0` 处梯度是 `6.0`。

选出运行反向传播的那一行。

```
output: 6.0
```
'''
hints = [
  "y.backward() ——它在损失上调用，也就是图的末端，而不是在参数上。",
  "w.backward() 是让参数对自己求导，那不是 backward 的意思。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "pytorch.verybasic.21.no-grad"
title = "我们看着的时候别记"
story = "评估过程构建了一张它从不使用的图，每次给验证集打分，地下室的内存曲线都往上爬一截。"
brief = '''
推理不需要图。Torch 有一个上下文管理器，能在它包裹的代码块里关掉记录，于是结果出来时 `requires_grad` 为假，也不会为一次永远不会发生的反向传播保留任何东西。

`with` 已经写好。选出构建它所进入的那个上下文管理器的那一行。

```
output: False
```
'''
hints = [
  "就是名字说出了它作用的那一个：在这个代码块的范围内，没有梯度。",
  "它必须被调用——光秃秃的属性不是上下文管理器，`with` 会拒绝它。",
]

