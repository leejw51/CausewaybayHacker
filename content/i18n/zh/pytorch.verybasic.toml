  "nn.MSELoss() ——它是一个类，所以先构建，再调用。",
  "nn.L1Loss() 是绝对差，那会给出 2.0 而不是 4.0。",
]

# ---------------------------------------------------------------- 27  BOSS
[[quest]]
id    = "pytorch.verybasic.27.first-step"
title = "第一步"
story = "一切就位——一个参数、一个损失、一个梯度——而那个数字从不移动。优化器建好了，却从没被要求做任何事。"
brief = '''
