]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "pytorch.verybasic.25.softmax"
title = "分数变成概率"
story = "控制台打印出三个原始分数，夜班的操作员被问模型有多大把握。原始分数里没有答案。"
