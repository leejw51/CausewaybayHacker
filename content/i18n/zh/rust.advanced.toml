[[quest]]
id    = "rust.advanced.12.matching"
title = "东西的形状"
story = "外卖应用接受四条命令，旧代码用九层嵌套的 if 来检查它们。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行是 `<COMMAND>` 或 `<COMMAND> <ARG>`。

对每一行，输出：

* `GO <n>` 且 `n` 大于零时输出 `FORWARD <n>`
* `GO <n>` 且 `n` 小于或等于零时输出 `STAY`
* `STOP` 输出 `HALT`
* 其他任何情况输出 `UNKNOWN <COMMAND>`

然后输出 `MOVED <total>`，即所有前进量之和。

```
input:  4
        GO 3
        GO -1
        STOP
        JUMP 9
output: FORWARD 3
        STAY
        HALT
        UNKNOWN JUMP
        MOVED 3
```

对切分后的行做一个 `match`，在 `GO` 分支上加一个**守卫**来区分两种情况，不要另开一个分支。匹配切片模式 —— `["GO", arg]` —— 让这一行的元数成为模式的一部分，而不是你手写的一次长度检查。
'''
hints = [
  "parts.as_slice() 就是把 Vec 变成切片模式能匹配的东西的那一步。",
  "模式后面的 `if` 是匹配守卫 —— 它把两个形状相同的分支区分开。",
  "`[command, ..]` 绑定第一个元素并忽略其余；`[]` 是你仍然要覆盖的空行。",
]

