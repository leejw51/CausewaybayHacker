# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.advanced.13.interior-mutability"
title = "通过共享引用修改"
story = "门上的计数器必须往上走，而四段不同的代码都只是在看着它。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

打印四行：

1. `CELL <k>` —— 一个 `Cell<usize>`，每个值加一次，用 `.get()` 读回来，全程通过一个普通的 `&` 引用
2. `REF <sum>` —— 一本填入这些值并求和的账本
3. `RC <k>` —— 账本是一个 `Rc<RefCell<Vec<i64>>>`，你手里握着**两个**句柄；在两个都活着的时候打印 `Rc::strong_count`
4. `DOUBLE panic` —— 故意在同一个 `RefCell` 上同时取两个 `borrow_mut()`，并用 `std::panic::catch_unwind` 接住这个 panic

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T` 通常意味着谁都不能改它。`Cell` 和 `RefCell` 是受认可的例外，而两者付的是不同的货币：`Cell` 只整个地把值搬进搬出，所以完全不需要检查；`RefCell` 交出的是真正的引用，因此必须执行借用规则 —— 在运行时，用 panic，而不是在编译时用错误。

`Rc<RefCell<T>>` 是每个人最终都会伸手去拿的那一对，值得能说清每一半各干什么。`Rc` 给值多于一个的所有者 —— 非原子的引用计数，所以它不是 `Send`，不能跨线程（那是 `send-sync` 那张地图讲的）。`RefCell` 给这些所有者修改的权利。两者都不是 `Mutex`。共享**并且**可变正是借用检查器在编译时拒绝的东西，所以这个模式在运行时把它买回来，并在你做错时向你收一次 panic。

那个 panic 不是这条街的 bug。它是价格，而亲眼见它一次就是目的。
'''
hints = [
  "Cell 没有 borrow()：你用 get() 取一份副本出来，用 set() 把整个值放进去。这就是它不需要运行时记账的原因。",
  "ledger.borrow_mut().push(v) 写成一条语句，让 guard 在分号处丢弃，这才是让循环合法的关键。",
  "catch_unwind 需要在闭包外面套一层 AssertUnwindSafe，因为闭包捕获了一个 &RefCell；panic 消息仍然会去 stderr，而测试不读它。",
  "写成 Rc::clone(&ledger) 而不是 .clone()，是为了让读者看出它复制的是一个句柄而不是 Vec。两个句柄都活着时 Rc::strong_count 读到 2，而 panic 测试里的两个 borrow_mut() 可以一个句柄各来一个 —— 它们是同一个 RefCell，它把两者合在一起数。",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.advanced.14.custom-error"
title = "你自己的错误"
story = "票价服务的四层各自发明了自己的失败类型，没有一个能互相转换。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 行，每一行本应是一个以 km 为单位的距离。

定义 `enum FareError { NotANumber, Negative(i64) }`，为它实现 `Display` 和 `std::error::Error`，并实现 `From<std::num::ParseIntError> for FareError`，让 `?` 能自动转换。

`fare(text) -> Result<i64, FareError>` 用 `?` 解析，拒绝负距离，否则返回 `500 + 100 * km`。打印每个结果或错误的 `Display` 文本，然后打印 `ERRORS <k>`。

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

起始代码编译不通过。`?` 不只是传播 —— 它在出去的路上调用 `From::from`，没有那个 impl，就没有从 `ParseIntError` 通往你的类型的路。实现 `From` 才是让 `?` 能跨越层边界工作的东西，也是错误枚举值得存在的全部理由。

`map_err` 是答案的另一半，用于你想附加上下文而不是转换类型的时候。他们问起就提一句；这里不需要它。
'''
hints = [
  "错误是 `?` 上的 E0277：the trait From<ParseIntError> is not implemented for FareError。",
  "六行：impl From<ParseIntError> for FareError，fn from 返回 FareError::NotANumber。",
  "Display 是 {} 打印的；Debug 是 {:?} 打印的；Error trait 是让它能放进 Box<dyn Error> 的。三个都值得有，这里只需要一个。",
