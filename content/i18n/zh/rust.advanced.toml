[[quest]]
id    = "rust.advanced.11.send-sync"
title = "它为什么过不去"
story = "同样的代码，同样的 Vec，只差一个词，两份里有一份编译不过。说出是哪个词，为什么。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

通过一个共享总数，在两个线程里把它们加起来，然后打印：

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

最后两行只在 `assert_send` 和 `assert_sync` 接受这个句柄时才打印 —— 而这两个函数在运行时什么都不做。它们是 `fn assert_send<T: Send>(_: &T) {}`：检查就是那个约束，它要么发生在编译时，要么根本不发生。

起始代码编译不通过，而这个错误就是这一课。`Rc` 不是 `Send`，因为它的引用计数是一个普通的非原子整数 —— 两个线程克隆同一个 `Rc` 会在它上面竞争，所以编译器根本不允许 `Rc` 跨越线程边界。`Arc` 是同一个东西换成原子计数，它是 `Send`。

`Sync` 是另一半：当 `&T` 是 `Send` 时，`T` 就是 `Sync`。对任何 `T: Send`，`Mutex<T>` 都是 `Sync`，因为锁正是让共享访问安全的东西。
'''
hints = [
  "错误是 E0277：`Rc<Mutex<i64>>` cannot be sent between threads safely。改一个类型名，连带改一个 import。",
  "Rc 的引用计数是普通的 usize；Arc 的是 AtomicUsize。这一个差别就是为什么一个是 Send、另一个不是的全部原因。",
  "assert_sync(&*total) 问的是 Mutex 本身，而不是外面包着的 Arc —— 只要 T 是 Send，Mutex<T> 就是 Sync。",
]

