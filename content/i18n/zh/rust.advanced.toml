# RUST LAND — ADVANCED, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/rust/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "rust.advanced"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.advanced.01.shadowing"
title = "三个名字，一个名字"
story = "崇光路口的自助机把价格存成了文本、数字和金额三份，而三份都叫 price。"
brief = '''
读取一行：一个以分为单位的金额，由数字组成。

输出三行：

1. 去掉首尾空白后的文本有多少个字符
2. 这个金额作为数字
3. 这个金额换算成元，精确到两位小数

```
input:  1234
output: 4
        1234
        12.34
```

金额非负，并且能放进 `i64`。用同一个名字完成，遮蔽两次 —— 先是 `&str`，再是 `i64`，最后是 `String`。
'''
hints = [
  "第二个 `let cents = ...` 不是赋值；它创建一个新绑定，把旧的遮住，而且类型可以不同。",
  "这就是遮蔽和 `mut` 的区别：`mut` 保持类型不变，遮蔽不用。",
  "两位小数、前面补零，用的是 {:02} 宽度标志。",
]

