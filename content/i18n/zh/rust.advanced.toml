[[quest]]
id    = "rust.advanced.13.modules"
title = "谁有资格看这个"
story = "票价表漏到了三个文件里，其中两个被改过。把它关到一扇门后面去。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以 km 为单位的距离。

把票价逻辑组织成一个模块：

* `mod fares`，带一个**公开**的 `adult(km) -> i64` 和一个**私有**的 `base(km)`，`adult` 调用后者 —— `500 + 100 * km`
* 一个嵌套的 `mod fares::pass`，带一个公开的 `monthly() -> i64`，返回 `50000`

每个距离输出一个成人票价，然后输出 `MONTHLY <x>`。

```
input:  3
        1 2 3
output: 600
        700
        800
        MONTHLY 50000
```

起始代码编译不通过：这些项都在，只是没有一个是 `pub`，而模块的内容默认对外私有。这个默认值正是这项特性 —— `base` 不属于接口，而编译器就是让它保持这样的那个东西。嵌套模块需要在 `mod` 那一行也写上自己的 `pub`，不能只写在里面的函数上。
'''
hints = [
  "错误是 E0603：这个项存在，只是它是私有的。三个 pub 关键字就能修好整个文件。",
  "base 是故意保持私有的 —— 它是这里唯一一件与别人无关的事。",
  "把函数设为公开并不会把门设为公开：`mod pass` 也需要 pub。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.advanced.14.smart-pointers"
title = "编译器说得出的大小"
story = "Lucky Mac 的单据钉：每张单子都钉在下面那张上，一路钉到柜台。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个以分为单位的金额。

把它们放进一条链，一个节点一个金额，按到达的顺序：

```
struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}
```

输出三行：

1. 按顺序输出这些金额，用空格分隔，没有则输出 `-`
2. `SUM <total>`，由一个对链做**递归**的函数算出
3. `LAST <cents>` —— 最后一个节点上的金额 —— 或者 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

起始代码编译不通过，而这个错误正是 `Box` 存在的理由。写成 `next: Option<Entry>`，编译器就得把 `Entry` 在内存里排布出来：它需要 `8` 个字节给 `cents`，再加上一个 `Entry` 有多大 —— 而这正是它在试图算出的东西。E0072，*recursive type has infinite size*。

`Box<Entry>` 是指向堆上一块分配的指针，而指针的大小编译器早就知道。它拥有自己指向的东西：恰好一个所有者，`Box` 被丢弃时释放，没有计数，没有共享。`Option<Box<Entry>>` 既是链的末端，也是链中的一个节点，装在一个指针大小的值里 —— `None` 存成空地址，而不是额外的标签字节，所以它比单独一个 `Box` 不多花任何代价。
'''
hints = [
  "一个词就能修好编译错误：Option<Entry> 改成 Option<Box<Entry>>，构造函数里多一个 Box::new。",
  "从后往前建 —— 倒序遍历这些金额，把你已有的链作为每个新节点的 next。从前往后建需要一个指向尾部的游标，那是一场你现在还不需要的借用之争。",
  "要在不消耗链的情况下遍历，手里握一个 Option<&Box<Entry>>：用 head.as_ref() 起步，用 entry.next.as_ref() 往前走。.as_ref() 把 &Option<T> 变成 Option<&T>，这一步就是让链保持完整的关键。",
  "递归求和不需要 mut，也不需要循环：Some(entry) => entry.cents + sum(&entry.next)，None => 0。",
]

