# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.advanced.15.atomics"
title = "一个字，不上锁"
story = "闸机的计数不需要锁。机房里其他的一切都需要，而把它们分清楚就是这份工作。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数。

为每个值生成一个线程。每个线程把自己的值加进一个共享的 `AtomicI64`，并把一个共享的 `AtomicUsize` 加一 —— 哪里都不许有 `Mutex`。把线程全部 join，打印 `TOTAL <sum>` 和 `HITS <n>`。

然后：在 `main` 的**最顶部**声明两个 `Guard` 值，命名为 `first` 和 `second`，它们的 `Drop` 打印 `DROP <name>`。它们在 `main` 的末尾运行，在其他一切之后，按声明的相反顺序。

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
        DROP second
        DROP first
```

原子操作不是更便宜的互斥锁；它是另一种工具，针对的是在单条指令里读-改-写的一个机器字。一旦你需要两个字段彼此一致，锁就回来了 —— 没有哪种原子操作能表达"这两样东西，一起"。

这里 `Ordering::Relaxed` 就够了，因为没有什么依赖于这些增量*何时*相对于任何其他写入变得可见，只要求一个都不丢。这句话就是追问的那个问题，也是 `Relaxed` 含义的全部。
'''
hints = [
  "fetch_add 返回之前的值并原子地完成加法；没有锁，也没有 guard。",
  "Arc 仍然需要 —— 原子操作让*访问*安全，不是让*共享*安全。",
  "Drop 按声明的相反顺序运行，所以 `second` 先走。把它们绑定为 _first 和 _second 能让它们活到 main 结束；光秃秃的 `_` 会立刻丢弃它们。",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.advanced.16.closure-kinds"
title = "三种闭包"
story = "面试官在板上写下 `Fn`、`FnMut` 和 `FnOnce`，问回调应该是哪一种。这道题有正确答案。"
brief = '''
标准输入是一个数量 `n`，然后是 `n` 个整数，`n` 至少为一。

三种闭包各用一个：

* `apply_fn<F: Fn(i64) -> i64>` —— 按复制捕获第一个值，把它加到每个值上。打印每个结果。
* `apply_fn_mut<F: FnMut(i64)>` —— 给一个住在 `main` 里的计数器加一。打印 `SEEN <k>`。
* `apply_once<F: FnOnce() -> String>` —— 把一个 `String` 从它的捕获里**移出来**并返回。打印 `TAKEN <s>`，其中字符串是 `<n> items`。

```
input:  3
        10 20 30
output: 20
        30
        40
        SEEN 3
        TAKEN 3 items
```

这三个 trait 是一个层级，不是一份菜单：每个 `Fn` 都是 `FnMut`，每个 `FnMut` 都是 `FnOnce`。一个闭包实现哪一个，由它对捕获的东西*做了什么*决定 —— 读它们（`Fn`）、改它们（`FnMut`）、还是消耗它们（`FnOnce`）—— 而 `move` 改变的是捕获的方式，不是最后得到哪个 trait。

起始代码编译不通过。`apply_once` 要求 `Fn`，而一个把自己的 `String` 送出去的闭包只能被调用一次，所以它是 `FnOnce`，仅此而已。取调用点能接受的最弱约束：只调用一次就要求 `FnOnce`，这样你就没有无缘无故把其他所有闭包都排除在外。
'''
hints = [
  "错误是 E0525：expected a closure implementing Fn, but this one only implements FnOnce。",
  "只改一个词：apply_once 上的约束。闭包本身已经是对的。",
  "apply_fn_mut 接收 `mut f: F` —— 参数本身必须是可变的，闭包才能修改自己捕获的东西。",
]

