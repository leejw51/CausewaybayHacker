[[quest]]
id    = "rust.advanced.17.deadlock"
title = "死锁"
story = "时代广场的机房，地下两层。两把锁，两个线程，两部扶梯在同一秒停住。"
brief = '''
两个账户 `A` 和 `B`，各是一个 `Arc<Mutex<i64>>`。

标准输入第一行是起始余额，第二行是一个数量 `n`，然后是 `n` 行 `<FROM> <TO> <AMOUNT>`，其中 `FROM`/`TO` 取自 `{A, B}`。

每笔转账在自己的线程上运行，把线程全部 join，然后打印 `A <balance>`、`B <balance>`、`MOVED <n>`。

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

起始代码有两处错，只有一处会在输出里显现。它扣了来源却从不给目的地入账 —— 这是看得见的 bug。另一处是形状：*先锁来源*意味着两笔方向相反的转账可以各握一把锁、等对方的那把，等到永远。

两把锁都要拿，**始终按同一个全局顺序** —— 先 `A` 后 `B`，不管钱往哪边走 —— 环就形不成。
'''
hints = [
  "碰任何一个余额之前先把两个账户都锁上，并且始终按同一个顺序。",
  "钱的方向决定哪个 guard 挨减，而不是哪把锁先被拿。",
  "两个 guard 在 transfer 结束时按相反顺序丢弃，这没问题 —— 要紧的是获取的顺序。",
]
