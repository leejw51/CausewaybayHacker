[[quest]]
id    = "python.cheatsheet_advanced.01.yield-from"
title = "箱子套箱子"
story = "送到渣甸坊楼上唐楼的一批货：纸箱里套着纸箱，而蟒蛇想把每一件都摆到地上，一次一件。"
brief = '''
`flatten` 必须是一个生成器，按顺序产出任意嵌套列表的每一个叶子：
`list(flatten([1, [2, [3, 4]], 5]))` 是 `[1, 2, 3, 4, 5]`。空白处填哪一行？

```
def flatten(xs):
    for x in xs:
        if isinstance(x, list):
            # ____
        else:
            yield x
```
'''
hints = [
  "递归调用返回的是一个生成器；你要的是它的元素，一个一个往上交 —— 有一个两个词的写法专门做这个。",
]

