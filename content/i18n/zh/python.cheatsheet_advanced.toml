尝试三次。

```
def retry(times):
    def deco(fn):
        def inner(*a, **kw):
            ...
        return inner
    return deco
```

`fetch` 已经定义好了，没有任何装饰器。手工重新绑定 `fetch`，让它被重试三次 ——
和 `@retry(3)` 做的事一模一样。
'''
hints = [
  "有三层。最外层的调用接收那个数字并交回真正的装饰器；函数再放进那个装饰器里。",
]

