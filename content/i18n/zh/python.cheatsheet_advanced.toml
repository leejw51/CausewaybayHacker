[[quest]]
id    = "python.cheatsheet_advanced.04.keep-the-name"
title = "还叫 GREET"
story = "波斯富街前台的名牌必须在制服套上去之后还活着。"
brief = '''
`import functools` 已经做了。把 `@logged` 应用到 `greet` 之后，
