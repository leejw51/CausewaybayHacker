title = "权重回家"
story = "检查点在湾仔一个储物柜里的 U 盘上过了一夜。早上：装回一个同样形状的网络。"
brief = '''
权重是用 `torch.save(model.state_dict(), p)` 保存的。现在一个全新的 `model = Net()` 已经建好。哪一行把那些权重放回去，并让 `model` 仍然是一个 `nn.Module`？
'''
hints = [
  "一行里两步：从磁盘读出字典，再把那个字典交给模块的加载器。只读文件得到的是 dict，不是模型。",
]

