[[quest]]
id    = "pytorch.cheatsheet.15.long"
title = "请给整数"
story = "香港大球场的售票处数的是座位，从来不数半个座位。"
brief = '''
`target = torch.tensor([0., 2., 1.])` 来的时候是 `float32`，而 `nn.CrossEntropyLoss` 拒绝它：类别下标必须是 **`int64`**。哪一行修好 `target`？
'''
hints = [
  "类型转换返回新张量，而不是改变这一个；对张量调用 `int()` 得到的是 32 位的那种 —— 不是损失函数要的那种。",
]

