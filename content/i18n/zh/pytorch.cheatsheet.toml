[[quest]]
id    = "pytorch.cheatsheet.19.keepdim"
title = "每行归一"
story = "宝灵顿道的五个摊位，三班营收：每个摊位按班次的份额必须加起来等于一。"
brief = '''
`x` 的形状是 `(5, 3)`。广播从右边对齐形状，所以 `(5, 3)` 除以 `(5, 1)` 是一行一行地相除。哪一行得到 `s`，即每行的和，形状为 `(5, 1)`，使 `x / s` 把每一行归一化？
'''
hints = [
  "归约通常会丢掉它求和的那个轴；让它把那个轴保留为大小 1。单纯的 `(5,)` 对上 `(5, 3)` 对不齐。",
]

