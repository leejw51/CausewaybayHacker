[[quest]]
id    = "pytorch.cheatsheet.13.stack"
title = "新的一层"
story = "时代广场的两层楼，每层都是同样的店铺网格，一层叠在另一层上面。"
brief = '''
`a` 和 `b` 的形状都是 `(3, 4)`。哪一行得到形状为 `(2, 3, 4)` 的 `z`，其中 `z[0]` 是 `a`，`z[1]` 是 `b`？
'''
hints = [
  "一个函数沿着已有的轴拼接；另一个把各块放到一个全新的轴上，默认在最前面。数一数结果的维数。",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "pytorch.cheatsheet.14.matmul"
title = "行遇上列"
story = "两个摊位乘三种货品，三种货品乘四天：渣甸坊的营收表。"
brief = '''
`a` 的形状是 `(2, 3)`，`b` 的形状是 `(3, 4)`。哪一行得到 `c`，即**矩阵乘积**，形状为 `(2, 4)`？
'''
hints = [
  "`*` 是逐元素相乘，需要两个形状能广播；矩阵乘积有它自己的中缀运算符，和 NumPy 用的是同一个。",
]

