# PYTORCH LAND — CHEATSHEET, in Simplified Chinese. A translation pack (SPEC §12.1):
# the prose of `content/pytorch/cheatsheet.toml`, quest by quest, and nothing else.
# The question is the brief; the four choices are code and stay English. Code
# blocks and identifiers are copied verbatim, never translated.

pack   = "pytorch.cheatsheet"
locale = "zh"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.cheatsheet.01.zeros"
title = "一张白纸"
story = "23:00，周亦卿楼地下的机房。今晚的第一个张量全是零。"
brief = '''
已经 `import torch`，生成 `x`，一个形状为 `(2, 3)` 的全零 **torch** 张量。
'''
hints = [
  "尺寸作为调用的参数传入；NumPy 的函数给你的是 ndarray，不是张量。",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.cheatsheet.02.to-device"
title = "浮点数，上卡"
story = "标签以整数的形式待在 CPU 上。3 号机架的 GPU 要的是浮点数。"
brief = '''
`x = torch.tensor([1, 2, 3])` 是 CPU 上的 `int64`，而
`device = "cuda" if torch.cuda.is_available() else "cpu"`。哪一行让 `x` 变成 `device` 上的 `float32` 张量？
'''
hints = [
  "`.to` 返回一个新张量，原来的不变，所以要保留它的返回值。",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.cheatsheet.03.eval-mode"
title = "熄灯"
story = "中央图书馆终端机前的考试夜。试卷是真的，Dropout 就不再乱猜。"
brief = '''
`model` 里有 `Dropout` 和 `BatchNorm` 层。在测试集上打分之前，哪一行把这些层切换到推理时的行为？
'''
hints = [
  "每个 nn.Module 都带着一个 training 标志；调用一个方法就能为它和所有子模块关掉它。",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.cheatsheet.04.view"
title = "三行四列"
story = "糖街仓库里排成一列的十二个包裹，而货架有三层。"
brief = '''
`x = torch.arange(12)` 的形状是 `(12,)`。让 `y` 是同样的数字，排成 **3 行 4 列**。
'''
hints = [
  "新的尺寸先写行数，它们的乘积必须等于元素个数。",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.cheatsheet.05.argmax"
title = "获胜的类别"
story = "天后电车站的数字识别器每行给十个类别打分。每行都得有一个数字胜出。"
brief = '''
`logits` 的形状是 `(batch, classes)`。哪一行得到 `pred`，即每一行最佳类别的下标，形状为 `(batch,)`？
'''
hints = [
  "`dim` 指的是被归约掉的那个轴。类别沿着 dim 1 排列。",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.cheatsheet.06.unsqueeze"
title = "是列，不是行"
story = "罗素街三间铺位的租金，四个月的杂费。每一对都要碰上。"
brief = '''
`x` 的形状是 `(3,)`，`y` 的形状是 `(4,)`。哪一行改变 `x` 的形状，使 `x + y` 广播成形状 `(3, 4)`？
'''
hints = [
  "广播从右边开始对齐形状。`x` 需要在它自己的轴后面加一个大小为 1 的新轴。",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "pytorch.cheatsheet.07.backward"
title = "斜率"
story = "通往利舞台的扶手电梯有个斜率。计算图知道它，总得有人去问。"
brief = '''
```
w = torch.tensor(2.0, requires_grad=True)
y = w * w
```

哪一行把 dy/dw，也就是 4，填进 `w.grad`？
'''
hints = [
  "梯度从输出往回流，所以要在结果上调用，而不是在叶子上。",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.cheatsheet.08.no-grad"
title = "今晚不建图"
story = "夜班只是抄表。没有人需要记录这些数字是怎么算出来的。"
brief = '''
在验证批次上运行模型，**不为 autograd 记录计算图**。哪一行开启这个代码块？

```
# ____
    out = model(xb)
```
'''
hints = [
  "它是一个上下文管理器：它下面缩进的代码块在关闭梯度跟踪的情况下运行。",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "pytorch.cheatsheet.09.step-order"
title = "先后顺序"
story = "先清柜台，再称货，然后找零。街市的顺序从来不变。"
brief = '''
`loss` 刚从这个批次算出来，`opt` 是优化器。哪种三次调用的顺序是一个正确的训练步？
'''
hints = [
  "梯度会累加，所以先清掉旧的；再算出新的；然后使用它们。",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "pytorch.cheatsheet.10.super-init"
title = "先叫父类"
story = "铜锣湾一个新摊位要先拿到业主的文件，才能挂上招牌。"
brief = '''
```
class Net(nn.Module):
    def __init__(self):
        # ____
        self.fc = nn.Linear(4, 2)

    def forward(self, x):
        return self.fc(x)
```

`__init__` 里必须先写哪一行，否则给 `self.fc` 赋值会失败？
'''
hints = [
  "nn.Module 在它自己的构造函数里建立层的登记表；在添加任何层之前先运行它。",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "pytorch.cheatsheet.11.cross-entropy"
title = "原始分数"
story = "地下室的分类器给出的是原始分数，不是概率。裁判得知道是哪一种。"
brief = '''
`logits` 的形状是 `(B, C)`——原始的、未归一化的分数——`target` 的形状是 `(B,)`，存放类别下标。哪一行是正确的分类损失？
'''
hints = [
  "这些损失里有一个自己会做 log-softmax。直接把原始分数喂给它，不要先软化。",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "pytorch.cheatsheet.12.dataloader"
title = "洗过的牌"
story = "礼顿道的麻将馆每一局之前都洗牌。训练程序也该这样。"
brief = '''
`ds` 是一个 `TensorDataset`，`DataLoader` 已经从 `torch.utils.data` 导入。哪一行让 `loader` 产出大小为 32 的批次，并且**每个 epoch 都换一个新的随机顺序**？
'''
hints = [
  "不主动要求就不会打乱，而且批大小的关键字要写全。",
]

