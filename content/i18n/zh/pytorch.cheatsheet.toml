story = "利舞台的每一次排练都从同一个提示开始，否则没人说得出什么变了。"
brief = '''
面试官要求运行可复现：`nn.Linear(4, 2)` 每次脚本启动时都必须得到**同样的随机权重**。在模型构建之前，顶部放哪一行？
'''
hints = [
  "Torch 有自己的随机数生成器；给 NumPy 或 Python 的 `random` 设种子碰不到它，而设置函数把种子作为参数接收。",
]

