story = "怡和街的灯一浪涌，断路器就在迈出那一步之前跳闸 —— 绝不在之后。"
brief = '''
梯度正在爆炸。填上空缺，使 `model` 的**梯度总范数**在更新之前被限制在 `1.0`：

