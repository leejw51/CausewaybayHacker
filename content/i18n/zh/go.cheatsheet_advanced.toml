]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.cheatsheet_advanced.27.builder-ptr"
title = "别复制 BUILDER"
story = "港岛线的广播一块一块地拼起来，而负责加最后一块的辅助函数崩溃了，报的是一条关于非法复制的消息。"
brief = '''
`sb` 是一个已经装着 `"Island"` 的 `strings.Builder`。声明 `add`，
使得在 `add(…, " Line")` 之后 —— 用签名需要的任何参数调用 ——
`sb.String()` 是 `"Island Line"`，并且不 panic。
