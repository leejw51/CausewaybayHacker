id    = "go.cheatsheet_advanced.30.errc"
title = "第一个坏消息"
story = "港岛线的八个车站同时被 ping；一有一个报告故障，控制室就转头去忙别的，而七个 ping 程序还站在一扇永远不会有人打开的窗口前。"
brief = '''
这里没有 `errgroup` —— 只用标准库。`n` 个 goroutine 中的每一个都恰好往
`errc` 发送一个 `error`（通常是 `nil`）。`checkAll` 返回第一个非 nil 的错误，
不等其余的，而之后不能有任何 goroutine 卡在它的发送上。声明 `errc`。

```
func checkAll(n int) error {
    // ____
    for i := range n {
        go func() { errc <- check(i) }()
    }
    for range n {
        if err := <-errc; err != nil {
            return err
        }
    }
    return nil
}
```
'''
hints = [
  "`checkAll` 一旦返回，就再也没有人接收了。每个发送者都必须能在没有接收者的情况下完成它那一次发送 —— 缓冲区要按它们的总数来定。",
]
