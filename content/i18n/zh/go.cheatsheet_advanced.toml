[[quest]]
id    = "go.cheatsheet_advanced.19.generic-stack"
title = "推得进去的 PUSH"
story = "港岛线广播员身后的站名栈接受每一次 push，而每次有人去看，它都是空的。"
brief = '''
`type Stack[T any] struct{ items []T }`。在 `var s Stack[string]`、
`s.Push("Tin Hau")` 和 `s.Push("Causeway Bay")` 之后，`len(s.items)`
必须是 `2`。
'''
hints = [
  "泛型类型的接收者要重复写类型参数，而会修改的方法需要指针形式，否则改的是副本。`append` 返回新切片；得有东西把它留住。",
]

