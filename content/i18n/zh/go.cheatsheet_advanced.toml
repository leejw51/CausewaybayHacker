[[quest]]
id    = "go.cheatsheet_advanced.24.stable"
title = "并列的不动"
story = "金钟两百名闸机员工按资历分组排班，而资历相同的人在每两次打印之间不停地换位置。"
brief = '''
`ps` 是一个有两百个条目的 `[]P`，并且
`less := func(i, j int) bool { return ps[i].S < ps[j].S }`。按 `S` 给 `ps`
