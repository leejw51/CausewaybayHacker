[[quest]]
id    = "go.cheatsheet_advanced.23.scanner-buffer"
title = "比一行还长"
story = "港岛线闸机日志的夜间导出是一条十万字符的行，而读取器什么都没交回来，也没有任何人打印出来的错误。"
