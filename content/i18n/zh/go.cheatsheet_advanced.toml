[[quest]]
id    = "go.cheatsheet_advanced.20.sort-desc-safe"
title = "最大的在前，不回绕"
story = "铜锣湾的票价余额排行榜上，有一个账户正好在 `int` 的最顶端，另一个正好在最底端，而排序把它们的顺序排反了。"
brief = '''
`xs` 是一个 `[]int`，同时含有 `math.MaxInt` 和 `math.MinInt`。
原地排序，最大的在前 —— 对这两个也要正确。
'''
hints = [
  "两个相距很远的 int 相减会溢出并翻转符号；`cmp` 里有一个三路比较。而且 `sort.Slice` 的函数接收的是下标，不是元素。",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "go.cheatsheet_advanced.21.bisect"
title = "对半切"
story = "港岛线控制室里排好序的列车 id 清单有一千万条，而查找每次都把它们全走一遍。"
brief = '''
`xs` 是一个升序排好的 `[]int`。用一行、O(log n) 的时间，把 `i` 设成
`7` 所在（或应插入）的位置，把 `found` 设成它是否在里面。
'''
hints = [
  "`slices` 包里有一个搜索同时返回位置和一个 bool；`sort.SearchInts` 只返回位置，而 `Index` 会把切片走一遍。",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "go.cheatsheet_advanced.22.omitempty"
title = "空的就别写"
story = "Lucky Mac 的 app 发出去的骑手资料里，每个步行者的 `bike` 字段都是空的，仪表盘上画出四十辆空自行车。"
brief = '''
`json.Marshal(Rider{Name: "Alex"})` 必须得到 `{"name":"Alex"}`，而
`json.Marshal(Rider{Name: "Alex", Bike: "e-7"})` 必须得到
`{"name":"Alex","bike":"e-7"}`。哪个字段声明能做到？

```
type Rider struct {
    Name string `json:"name"`
    // ____
}
```
'''
hints = [
  "选项写在和名字同一对引号里，用逗号隔开 —— 而未导出的字段根本不会被序列化。",
]

