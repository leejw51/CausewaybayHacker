[[quest]]
id    = "go.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "你到目前为止通关的每张地图数的都是跳数。电车不在乎有几站；它在乎每站要多久。"
brief = '''
标准输入是 `n m seed`：`n` 个车站，`m` 条无向带权边。用**恰好**这个生成器自己构建这张图，
