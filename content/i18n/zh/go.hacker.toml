brief = '''
第一行是 `n`，至少为 `1`。第二行是 `n` 个整数，可能为负。

输出三行：

1. **非空**连续子段的最大和
2. `AT <start> <end>`，那一段的 1 基边界 —— 如果有几段并列，取从左到右扫描时最先找到的
