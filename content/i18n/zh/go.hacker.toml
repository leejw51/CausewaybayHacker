brief = '''
标准输入是两个整数 `n` 和 `seed`。输入里没有数组 —— 你用**恰好**这个生成器自己构建它，
用 `uint64` 算术，它在 Go 里不声不响地回绕：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007
```

数出**逆序对**：满足 `i < j` 且 `a[i] > a[j]` 的数对。输出这个数量，然后输出
`MAX <largest value>`。

```
input:  8 1
output: 19
        MAX 908834774
```

对于 `8 1`，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。

**这条街强制要求复杂度，而且它是唯一能做到这一点的一类。** 有一个隐藏用例是
`n = 200000`。`O(n²)` 的双重循环 —— 初始代码就是这个 —— 是 `2 × 10^10` 次比较，在五秒的
运行限制内跑不完。在归并排序过程中数逆序对是 `O(n log n)`，大约二十毫秒就能完成。
在这台机器上，用这两个程序实际测过。

`n = 200000` 的答案是 `9990744366`，放不进 `int32`。在 64 位构建上 Go 的 `int` 是 64 位，
你侥幸逃过一劫；还是写 `int64`，因为这道题在别的地方运行的版本不会放过你。
'''
hints = [
  "排序之前先取最大值。归并排序会在你脚下重排切片，而它是同一个底层数组。",
  "合并时右半边的值胜出时，左半边剩下的每个元素都比它大 —— 那就是一次性得到 mid-left 个逆序对，这就是全部的技巧。",
  "copy(values[lo:hi], scratch[lo:hi]) 把合并好的一段写回去；Fenwick 树是另一个 O(n log n) 答案，在面试房间里值得提一句。",
]

