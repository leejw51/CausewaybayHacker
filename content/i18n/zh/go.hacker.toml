[[quest]]
id    = "go.hacker.30.range-queries"
title = "不断变化的总数"
story = "整条连锁店一天四百万次收银操作，一半是更正，而有人要的是滚动总额。"
brief = '''
标准输入是 `n q seed`。构建一个 `n` 个值的数组，然后运行 `q` 次操作，全部来自同一个
生成器：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r] inclusive) to a running total
```

输出所有查询答案的滚动总和，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里的复杂度是强制的，而且费了一番功夫。** 朴素的答案 —— 每次查询都遍历那个区间 ——
每次查询是 `O(n)`，而编译器把那个循环变成了快得惊人的东西。小用例抓不住它。所以大的隐藏
用例是 `n = 500000, q = 4000000`，朴素答案在那里要触碰大约 `10^11` 个元素，五秒的运行
限制内跑不完，而 Fenwick 树大约十分之一秒就能做完整件事。两者都用这条街里的两个程序
测过。

*单点更新、区间求和*正是 Fenwick 树为之存在的那种形状。三个短方法 —— add、prefix，以及
作为两个 prefix 之差的 range —— 而 `i & -i` 就是按最低置位比特步进的方法。
'''
hints = [
  "对每个初始值调用一次 Add 来建树。O(n) 的自底向上建树是个不错的优化，但不是时钟在考的东西。",
  "i & -i 分离出最低的置位比特。加上它是沿树向上走；减去它是向下走。",
  "Range(l, r) 是 Prefix(r+1) - Prefix(l)，把这一对差一错误弄对，就是调试的大半。",
]

