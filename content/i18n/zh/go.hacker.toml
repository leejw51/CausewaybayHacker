[[quest]]
id    = "go.hacker.32.modular"
title = "模十亿零七"
story = "这个短语出现在题目底部，房间里一半的人不知道它在要求他们做什么。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询计算二项式系数 `C(a, b)` **模 1000000007**。输出全部 `q` 个答案之和，它本身也
模 `1000000007`，然后输出 `LAST <最后一个查询的答案>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这种规模下 `C(a, b)` 有几十万位数字，所以它从来不是先算出来再取模 —— 每次乘法都边算
边取模。问题在于除法：`a! / (b! (a-b)!)` 在模算术里没有意义。取代它的是**模逆元**，而
因为 `1000000007` 是素数，费马小定理把它送给你：`inverse(v) = v^(p-2) mod p`，用快速幂
大约三十次平方就能算出来。

所以：预先计算一次 `factorial[0..n]`，然后把每个查询回答为
`f[a] * inv(f[b]) * inv(f[a-b])`。

**这里的复杂度是强制的。** 有一个隐藏用例是 `n = 200000`、`q = 200000`。独立计算每个系数
—— 乘 `b` 项，除 `b` 项，每项一次模逆元 —— 五秒的运行限制内跑不完；初始代码就是这样。
一张共享的阶乘表远不到一秒就能完成。两者都在这台机器上测过。

每个中间结果都是两个小于 `2^30` 的值的乘积，所以放得进 `int64`，不会溢出。Go 的 `int`
在这里是 64 位，但要写 `int64`，而且是认真的 —— 这道题在别的地方运行的版本不会这么
慷慨。
'''
hints = [
  "每次乘法之后都取模，永远不要留到最后。int64 放得下两个小于 P 的值的乘积；它放不下一个阶乘。",
  "inverse(v) 就是 power(v, P-2)，它能成立只是因为 P 是素数 —— 这就是费马小定理在这里的全部内容。",
  "从 inverse(factorial[n]) 倒着预计算逆阶乘，可以省掉每个查询的两次 power 调用。通过不需要它，但值得说出来。",
]

