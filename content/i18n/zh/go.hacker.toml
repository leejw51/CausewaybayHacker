[[quest]]
id    = "go.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个车手得分相同，排行榜每次重绘都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个车手，其中车手 `i` 的下标是 `i`，得分是：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按得分**降序**给车手排序。得分相同的车手必须保持他们到达的顺序。输出他们的下标，用
空格分隔，然后输出 `TIES <k>` —— 你排好的顺序里有多少对相邻的车手得分相同。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎所有的都是平局，答案几乎完全由平局的处理决定。

**这是一条关于知道你手里拿的是哪种排序的街。** `sort.SliceStable` 是稳定的 —— 相等的
元素保持相对顺序。`sort.Slice` **不是**，而且在真实输入上它明显不会：它是 pattern-defeating
快速排序，通常更快，对平局不做任何承诺。初始代码用的是它，而隐藏用例大到足以证明它会把
顺序打乱。（在 `n = 8` 时它碰巧没有 —— 这就是为什么一个小测试什么都证明不了，也是为什么
这里的小用例是*可见*的那个，而不是判定你的那个。）

有两个正确答案，你应该两个都能给出。用 `sort.SliceStable`。**或者**保留 `sort.Slice`，
把比较变成**全序** —— 得分相等时比较下标，这样没有两个元素会比较相等，稳定性就不再是
问题。默认应该伸手去拿第二种；当顺序被完全指定时，不稳定排序没有什么需要证明的。

现代的写法是 `slices.SortFunc` 和 `slices.SortStableFunc`，它们的比较函数返回负数、零或
正数而不是 `bool` —— `cmp.Compare` 是恰好给你 `-1`、`0` 或 `1` 的那个。它们是泛型的而
不是基于反射的，所以更快，而同样的稳定性区别以同样的两个名字存在。两种都要知道 —— 这个
包写的是 `sort`，因为那是你在大多数拿到手的 Go 代码里会读到的。
'''
hints = [
  "一个词：sort.Slice 变成 sort.SliceStable。这就是稳定的答案。",
  "另一个答案保留 sort.Slice，在得分相等时比较下标 —— 一个全序，于是没有平局可以不稳定了。",
  "TIES 数的是最终顺序里相邻的相同得分，无论你写的是两种中的哪一种，这个数都一样 —— 暴露你的是下标顺序。",
]

