input:  9
        -2 1 -3 4 -1 2 1 -5 4
output: 6
        AT 4 7
        ZERO 3
```

一条街里两种不同的一遍扫描思路。最大子段是 Kadane：维护一个滚动的和，一旦它变成负数
就把它扔掉，因为一个负的前缀只会拖累接下来的任何东西。

零和计数**不是**滑动窗口 —— 有负数意味着一段太大的子段不能靠收缩来修正。它是前缀和：
一段的和为零，恰好当两个前缀和相等时，所以数重复出现的次数。先在 map 里把 `0` 记为
出现过一次，用于从开头起始的那些子段。
'''
hints = [
  "Kadane 从 nums[0] 开始，而不是从 0，否则全负的列表会答 0，而那一段是空的。",
  "每次扔掉滚动和时重置子段起点，并且只在严格超过最优时才记录边界。",
  "数零和时，先查前缀再记录它，否则每个前缀都会找到它自己。",
]

