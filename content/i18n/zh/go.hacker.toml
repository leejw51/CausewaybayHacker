[[quest]]
id    = "go.hacker.28.lru"
title = "时钟"
story = "同一个房间，最后一题，墙上的钟是他们换过的那只更短的。"
brief = '''
第一行是 `cap q`。接下来 `q` 行是 `PUT <key> <value>` 或 `GET <key>`。

实现一个固定容量的缓存，满了时淘汰**最久未使用**的条目。`GET` 和 `PUT` 都算作使用了
一个键。

对每个 `GET` 输出它的值，不存在则输出 `-1`。最后输出幸存的键，最近使用的在前，用空格
分隔 —— 缓存为空则输出 `-` —— 然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把样例走一遍：`GET 1` 让 `1` 重新变成最近使用的，所以 `PUT 3` 需要腾地方时，走的是 `2`。
`GET 2` 未命中。`GET 3` 命中并让 `3` 成为最近使用的，这就是幸存者输出为 `3 1` 的原因。

教科书答案是一个哈希 map 指向一个**双向链表**，而 Go 的标准库里就有一个：`container/list`。
`PushFront`、`MoveToFront`、`Back` 和 `Remove` 都是 O(1)，所以这里每个操作都是 O(1)，你可以
毫不含糊地这么说。map 里放的是 `*list.Element`；元素的 `Value` 既要放值也要放键，因为淘汰
是从链表开始的，它必须知道要删除哪个 map 条目。
'''
hints = [
  "元素的 Value 必须带上键，否则从尾部淘汰时找不到要删除的 map 条目。",
  "覆盖一个已经存在的键不算淘汰 —— 在判定缓存已满之前先查 map。",
  "从 Front 走到 Back 本来就是最近使用的在前，所以最后一行不需要排序。",
]
