[[quest]]
id    = "go.hacker.33.grid-paths"
title = "穿过街区，绝不回头"
story = "外卖配送网格，有三条街因为搭竹棚封了。有多少种走法过去，哪一种最便宜。"
brief = '''
标准输入是 `r c pct seed`。自己按行优先顺序构建网格，每个格子抽取**两个**值：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，穿过开放的格子。输出：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同路线，模 `1000000007`
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都计入；没有路线则为 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先顺序扫一遍就能同时做两件事：一个格子的路线数是从上方和左方进入它的路线数之和，
它的最优代价是它自己的代价加上这两者中较便宜的。因为你只会向右或向下移动，你需要的那两个
格子永远已经算完了 —— 不用递归，不用 visited 集合。

`PATHS` 的计数模 `1000000007`，原因和往常一样：在 `1000 × 1000` 的隐藏用例上，真实的数字
有六百多位。边加边取模。

**大用例强制的是什么：** 它拒绝任何枚举路线的答案。路线比房间里的原子还多。它不区分
自底向上的表和带记忆化的递归 —— 两者都与格子数成线性，两者都能轻松通过。
'''
hints = [
  "每个格子都抽取两个值，包括两个角 —— 生成器不会跳过它们，只是拒绝封住它们。",
  "一个上方和左方都没有开放邻居的开放格子，可达路线为零，也没有最优代价；让 inf 表示“不可达”，并在相加时加以保护。",
  "终点可以是开放的却仍然不可达，那正是 PATHS 为 0 且 MIN 为 -1 的时候。隐藏用例里有一个就是这样。",
]

