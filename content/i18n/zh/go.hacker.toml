[[quest]]
id    = "go.hacker.31.palindrome"
title = "倒过来一样"
story = "前二十的题目，大多数笔试都会以某种形式问到，也是大多数人写过一次却从没弄懂的那道。"
brief = '''
标准输入是 `n alphabet seed`。自己构建这个字符串：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

输出最长回文子串的长度，然后输出 `AT <index>` —— 该长度下**最靠左**的那一个的 0 基
起始位置。

```
input:  12 3 5
output: 5
        AT 1
```

以每个中心向外扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符是奇数长度回文的中心，每两个
字符之间的间隙是偶数长度回文的中心。忘掉间隙，就是一个看起来正确的解在 `abba` 上返回
`1` 的原因。

**测试强制什么、不强制什么**，说清楚。真正干活的隐藏用例是**单**字母字母表上的
`n = 20000`。这是中心扩展法的最坏情况 —— 每个中心都跑到字符串末尾 —— 所以正确的答案在
那里跑满它的 `O(n²)`，仍然大约十分之一秒就完成。它也是淘汰 `O(n³)` 答案的用例，即枚举
每个子串再逐个检验：面对五秒限制，那个二十秒之后还在跑。

另一个大用例，双字母字母表上的 `n = 20000`，是一个**正确性**用例而不是速度用例。在随机的
二进制串上，回文检验一两个字符之后就会失败，所以就连立方级的答案也能在一秒内过。它检查
的是你的生成器和最靠左下标的决胜规则在大规模下和我们的一致。它不检查你快不快。两个数字
都在这台机器上测过。

所以：测试拒绝立方级，接受平方级。它们**不**要求 Manacher 算法，那是 `O(n)` 的答案。知道
它存在就好，因为“还能比平方级更快吗？”正是这道题通常被拿来铺垫的追问。
'''
hints = [
  "每个中心调用两次：(c, c) 对应奇数长度，(c, c+1) 对应偶数长度。初始代码缺的是第二个。",
  "循环停下时，i 和 j 都已经越过回文一位 —— 所以它从 i+1 开始，长度是 j-i-1。",
  "只在严格更长的回文上更新，每种长度里留下的是最靠左的那个，这正是 AT 在问的。",
]

