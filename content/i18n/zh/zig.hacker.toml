s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

输出最长回文子串的长度，然后输出 `AT <index>` —— 这个长度中**最靠左**的那一个的
0 基起始下标。

```
input:  12 3 5
output: 5
        AT 1
```

围绕每个中心向外扩展。中心有 `2n - 1` 个，不是 `n` 个：每个字符都是奇数长度回文的中心，
而两个字符之间的每个空隙都是偶数长度回文的中心。忘了空隙，就是一个看起来正确的解在
`abba` 上返回 `1` 的原因，而起始代码正是这样做的。

**测试强制什么、不强制什么**，直说。真正起作用的隐藏用例是 `n = 20000`，字母表只有
**一个**字母。这是中心扩展法的最坏情况 —— 每个中心都一路扩展到字符串末尾 —— 所以正确的
答案在那里完整地跑满 `O(n²)`，在 Debug 构建里仍然 **0.64 s** 就跑完，是在这台机器上实测的。
它也正是淘汰「检查每个子串、逐个测试」的那个用例，那是立方级的，在五秒内回不来。

另一个大用例，`n = 20000`、两个字母的字母表，是一个**正确性**用例，不是速度用例。在随机的
二进制串上，回文测试一两个字符之后就会失败，所以连立方的答案也能过。它检查的是你的生成器
和你最靠左下标的平局处理在大规模下与我们的一致。

一个老实的保留意见，因为这正是面试官会追问的东西：一个字母的用例淘汰的是检查*每一个*子串。
加上一行，跳过任何不比目前最好的更长的子串，同样的立方循环就能通过两个大用例 —— 在这个
输入上，那个剪枝把它压成了 `O(n²)`。所以测试淘汰的是朴素的立方解，而不是每一个最坏情况下
是立方的程序。

所以：测试淘汰立方，接受平方。它们**不**要求 Manacher 算法，那是 `O(n)` 的答案。要知道它
存在、它做什么，因为「你能做得比平方更好吗？」正是这道题通常用来引出的追问。

这里的下标是 `usize`，扩展要在走出任何一端*之前*停下：在 `i - 1` 被构造出来之前先检查
`i > 0`，因为 `usize` 上的 `0 - 1` 是一个 panic，不是 `-1`。C++ 那种每边多走一步、然后再
加回一的写法移植不过来；守卫要放在前面。
'''
hints = [
  "每个中心调用两次：(c, c) 处理奇数长度，(c, c + 1) 处理偶数长度。起始代码缺的是第二个。",
  "扩展之前先检查 s[left] == s[right]，这样偶数的那次调用在两个不同字节之间的空隙上就能直接退出；然后在 i > 0、j + 1 < len 且下一对匹配时继续扩展。",
  "只在严格更长的回文上更新，这样每个长度保留的就是最靠左的那一个，这正是 AT 要的。",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "zig.hacker.32.modular"
title = "对十亿零七取模"
story = "这句话出现在题目的最底下，而屋里一半的人不知道它要他们做什么。"
brief = '''
标准输入是 `n q seed`。生成 `q` 个查询，用回绕的 `u64`：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

对每个查询计算二项式系数 `C(a, b)` **对 1000000007 取模**。输出全部 `q` 个答案之和，
同样对 `1000000007` 取模，然后输出 `LAST <the final query's answer>`。

```
input:  10 5 3
output: 209
        LAST 1
```

在这样的规模下 `C(a, b)` 有几十万位数字，所以它从来不是先算出来再取模 —— 每一次乘法都
随手取模。问题在于除法：`a! / (b! (a-b)!)` 在模运算里没有意义。替代它的是**模逆元**，而
因为 `1000000007` 是质数，费马小定理把它交给你：`inverse(v) = v^(p-2) mod p`，用快速幂
大约三十次平方就算出来。

所以：一次性预计算 `factorial[0..=n]`，然后把每个查询答作
`f[a] * inv(f[b]) * inv(f[a-b])`。

**这里的复杂度是强制的。** 其中一个隐藏用例是 `n = 200000`、`q = 200000`。独立地计算
每个系数 —— 乘 `b` 项、除 `b` 项、每次一个模逆元 —— 在五秒的运行限制内跑不完；那就是起始
代码。一张共享的阶乘表在 Debug 构建里 **0.07 s** 就跑完。两者都是在这台机器上实测的。

每个中间值都是两个小于 `2^30` 的值的乘积，所以装得进 `u64`，什么都不会溢出 —— 而在这里
这是构建替你检查的一个断言。每次乘法之后都取模：一个超过 `2^64` 的乘积不会悄悄出错，它是
`panic: integer overflow`，这就是这道题被问到的另一半原因。
'''
hints = [
  "每次乘法之后都取模，而不是最后才取。u64 装得下两个小于 P 的值的乘积；它装不下一个阶乘，而溢出是一个 panic。",
  "inverse(v) 就是 power(v, P - 2)，而它之所以成立只是因为 P 是质数 —— 这就是费马小定理在这里的全部内容。",
  "把逆阶乘也预计算出来，从 inverse(factorial[n]) 倒着推，就能去掉每个查询的两次 power() 调用。通过不需要它，但值得说出来。",
]

