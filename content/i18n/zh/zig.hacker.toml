```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`，`x ^ 0 == x`，而且 xor 不在乎运算的先后顺序。这就是第一行的全部。
`x & (x - 1)` 清掉最低的置位，第三行和第四行就白送给你了。全部用 `u64` 来做 —— 并且
把那个减法写成 `x -% 1`，因为在这块领地里 `u64` 上的 `0 - 1` 是 `panic:
integer overflow`，而 `-%` 就是你表明自己要的是回绕的写法。零的情况照样要守住；回绕
只是为了让这个表达式合法。

这里的用例很小，计时也不是在量速度。没有大的隐藏用例，按这个包构建用例的方式也造不出
来：成对加一个的数组是*构造*出来的，不是生成出来的，两块领地各自构造，造出来的不会是同一个
数组。所以这些用例检查的是那四行和它们的边界 —— `0` 不是二的幂，没有置位的值清掉最低
置位之后仍然是 `0`。xor 仍然是答案；用嵌套循环数出现次数是 `O(n²)`，在真实的 `n` 下会死。
'''
hints = [
  "不管以什么顺序到来，成对的值都会互相抵消，所以对切片折叠一遍就够了。",
  "每次清掉最低置位来数位数，每个置位跑一次，而不是每个位宽跑一次。@popCount 是内建的一行写法。",
  "二的幂恰好只有一个置位，所以清掉最低的之后剩下零 —— 而零本身要手动排除，否则它的 x -% 1 会回绕成全部位都置位。",
]

