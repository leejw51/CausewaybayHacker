title = "所有组合"
story = "列出车道所有可能的开法。全部，按固定顺序，同一种别输出两次。"
brief = '''
第一行是 `n`。第二行是 `n` 个互不相同的整数，**已经按升序排好**。

输出每一个子集，每行一个，值用空格分隔，空集输出为 `-`。顺序按那个最直接的递归产生的
顺序：在每个位置，先走**选取**该元素的分支，再走跳过它的分支。然后输出 `SUBSETS <2^n>`。

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

压入、递归、**弹出**。弹出是人们会漏掉的那一步，症状是第一行之后的每一行都太长。

递归边走边输出 —— 把 writer（一个 `*std.Io.Writer`）和一个用来计数的 `*usize` 传给它 ——
而不是先把每一行都构建到内存里。这里没有隐藏的分配可以依靠：一行要么写出去，要么存起来，
而存起来就是一次你得付钱、还得交还的 `gpa` 调用。
'''
hints = [
  "每个元素两次递归调用：一次追加了它，一次没有。先选取，示例里的顺序自然就出来了。",
  "_ = chosen.pop(); 放在两次调用之间。这就是“尝试-递归-撤销”里的撤销，写 _ = 是因为 pop 返回一个你选择忽略的 ?i64。",
  "基本情况是 at == nums.len，那里什么都没选就是空集，它也算。",
]

