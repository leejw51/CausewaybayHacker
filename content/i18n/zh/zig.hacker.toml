# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.hacker.29.dijkstra"
title = "不是每条街都一样长"
story = "到目前为止你通关的每张地图数的都是跳数。电车不在乎有多少个站；它在乎的是要花多久。"
brief = '''
标准输入是 `n m seed`：`n` 个站，`m` 条无向带权边。用**恰好**这个生成器自己构建图，
用回绕的 `u64`：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

输出从站 `0` 到每个可达站的最短距离之和（包括 `0` 本身，它是 `0`），然后输出
`MAX <the largest of them>`。

```
input:  6 8 1
output: 4594
        MAX 1582
```

**这里的复杂度是强制的。** 隐藏用例是 `n = 200000`、`m = 400000` —— 这是 C++ 面试定下
来的规模，保留在这里，好让答案是同一个答案。无论如何 Dijkstra 都是正确的算法；计时决定的
是优先队列。每次扫描所有未访问的节点找最小值是 `O(V²)`，在 `n = 200000` 时就是
`4 × 10^10` 次读取，每一次都带边界检查，在五秒的运行限制内回不来。二叉堆让它变成
`O((V + E) log V)`，**0.17 s** 就跑完。是用这一关附带的两个程序在这台机器上实测的：
起始代码就是扫描的那个版本。

值得看清楚，因为这是计时筛选里最常见的失败方式：**起始代码并没有错。** 它输出的答案
完全正确。它被拒绝，只是因为来得太晚。

两条 Zig 式的说明。邻接表不是每个节点一个列表：在这个规模下，二十万个独立的
`ArrayList` 比算法本身还贵，所以起始代码已经建好了一个**压缩**邻接表 —— 三个扁平切片，
`u` 的边是 `to[start[u] .. start[u + 1]]` —— 堆的版本读的是同样的切片。而
`std.PriorityQueue` 是按你给它的顺序排的最小堆，所以按距离排序的 `(distance, node)`
条目不需要反转。它没有 decrease-key，你也不需要：把改进后的距离作为一个新条目压进去，
弹出的条目如果距离已经比你记录的更差，就跳过它。这个「过期条目」的跳过就是人们会忘掉
的那一行，没有它，堆会无限增长。
'''
hints = [
  "std.PriorityQueue(Entry, void, byDistance)，其中 Entry = { d, u }，byDistance 返回 std.math.order(a.d, b.d)：这个堆是按你给的顺序排的最小堆，所以什么都不用反过来。",
  "if (top.d > dist[top.u]) continue; 就是过期条目的跳过。没有它算法仍然正确，只是堆里会塞满作废的条目。",
  "生成器里生成树那一半保证了每个节点都可达，所以对 inf 的过滤实际上从来不会去掉任何东西 —— 还是留着它，因为带一个不可达节点的版本就是追问。",
]

