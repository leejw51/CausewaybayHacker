```

负数让滑动窗口失效 —— 一个太大的窗口不能靠缩小来修正。剩下能用的是前缀和：区间
`i..j` 的和等于 `k`，当且仅当 `prefix[j] - prefix[i] == k`，所以数一数之前有多少个前缀
等于 `prefix[j] - k`。先在 map 里放入 `0 → 1`，用来接住从开头开始的区间。

这里的用例很小，计时也不是在量速度，这里没有哪个用例会淘汰 `O(n²)` 的双重循环 ——
在真实的 `n` 下会有。同样的双重循环跑 200000 个值就是 `2 × 10^10` 次加法，在 Debug
构建里远远超出五秒的运行限制，而哈希 map 一遍扫描只要零点几秒。这四个用例检查的是负数
和从开头开始的区间，那正是这个答案真正会出错的两个地方。复杂度全凭你自觉。

一个 `std.AutoHashMap(i64, i64)` —— 前缀值映射到它出现过的次数 —— 用 `getOrPut`
来加一。
'''
hints = [
  "先查之前的前缀，再记录当前这个，否则当 k 为 0 时，长度为零的区间会把自己算进去。",
  "一开始就 seen.put(0, 1)，从下标 0 开始的区间才能被找到。",
  "最后一个前缀就是总和，所以第二行不用额外花任何代价。",
]

