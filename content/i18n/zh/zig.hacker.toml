brief = '''
第一行是 `n q`。接下来 `n` 行是要插入的小写单词。再接下来 `q` 行是查询，每个是
`WORD <s>` 或 `PREFIX <s>`。

构建一棵 trie —— 一棵每个节点最多有 26 个孩子的树 —— 然后回答：

* `WORD <s>` → 如果 `s` 被插入过就输出 `YES`，否则输出 `NO`
* `PREFIX <s>` → 插入的 `n` 个单词里有多少个以 `s` 开头

这 `n` 个单词不保证互不相同，而 `PREFIX` 数的是**插入次数**，不是不同的单词：把
`tram` 插入两次，`PREFIX tram` 就是 `2`。`NODES` 数的是节点，所以第二次插入不增加节点。

然后输出 `NODES <k>`，即 trie 中的节点数，包括根。

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

在每个节点上记一个计数，表示有多少个插入的单词经过它，这样 `PREFIX` 就是走一遍，最后
不用再数。把节点存在一个 `std.ArrayList(Node)` 里，让孩子存下标 —— 没有就是 `-1` ——
而不是每个节点存二十六个 `?*Node`；这样更小、更快，而且下标永远不会像指向 `.items`
里面的指针那样因为扩容而失效。这不是假设：`append` 可能把整个列表搬走，而在它之前拿到
的指针，指向的是分配器已经收回的内存。先拿下标，再 `append`，然后重新通过
`nodes.items[at]` 去访问。
'''
hints = [
  "把节点存在一个 ArrayList 里，让孩子存下标。在 append 之前拿到的指向 .items 的指针，指向的可能是列表已经交回去的内存。",
  "through 是在你踏上的那个节点上加一的，所以根从来不数它自己。",
