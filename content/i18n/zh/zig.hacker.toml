[[quest]]
id    = "zig.hacker.20.bits"
title = "落单的那一个"
story = "每根车轴都数了两次，只有一根例外。他们不让你用哈希 map，也不让你排序。"
brief = '''
第一行是 `n`。第二行是 `n` 个非负整数，其中每个值都恰好出现两次，只有一个例外。

输出四行：

1. 只出现一次的那个值，用 **xor** 和常数额外空间找出来
2. 它里面有多少个 `1` 位
3. 如果它是二的幂就输出 `POW2 YES`，否则输出 `POW2 NO`（`0` 不是）
