[[quest]]
id    = "zig.hacker.24.inversions"
title = "被计时器抓住的那个"
story = "下午那一轮的第一道题。朴素的答案是对的，而它是错误的答案 —— Debug 构建不会让它变得不对，只会让它更慢。"
brief = '''
标准输入是两个整数，`n` 和 `seed`。输入里没有数组 —— 你用**恰好**这个生成器自己构建它，
用 `u64` 运算和回绕运算符 `*%` 与 `+%`：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

数出**逆序对**：满足 `i < j` 且 `a[i] > a[j]` 的对。输出这个数量，然后输出
`MAX <largest value>`。

```
input:  8 1
output: 19
        MAX 908834774
```

对 `8 1` 来说，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`。

**这一关强制要求复杂度，而且只有这一类关能做到。** 起始代码是 `O(n²)` 的双重循环。隐藏
用例是 `n = 1000000`，这是 C++ 面试定下来的规模，因为在更小的规模下它的优化器会把循环
向量化，挤进运行限制之内。在这个规模下双重循环是 `5 × 10^11` 次比较，而每一次都带边界
检查的 Debug 构建在五秒的运行限制内回不来。在归并排序的过程中数逆序对是 `O(n log n)`，
在这个规模下只要 **0.19 s**，是用这一关附带的程序在这台机器上实测的。

大用例还替你决定了另外两件事。`n = 1000000` 的答案是 `250046540838`，32 位装不下 ——
宽度不对的累加器在这里不会悄悄出错，而是 `panic: integer overflow`，所以用 `u64` 来数。
而且生成器必须回绕而不是溢出：在 `u64` 上溢出的普通 `*` 在第一步就是同一个 panic，
`*%` 才是表示回绕的运算符。
'''
hints = [
