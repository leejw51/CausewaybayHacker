[[quest]]
id    = "zig.hacker.34.stable-sort"
title = "平局保持原位"
story = "两个骑手得分相同，而排行榜每次重画都把他们排成不同的顺序。"
brief = '''
标准输入是 `n buckets seed`。构建 `n` 个骑手，骑手 `i` 的下标是 `i`，还有一个分数：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

按分数**降序**给骑手排序。分数相同的骑手必须保持他们到达的顺序。输出他们的下标，用空格
分隔，然后输出 `TIES <k>` —— 你排好的顺序里有多少对相邻的分数相等。

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` 很小，所以几乎全是平局，答案几乎完全取决于它们遭遇了什么。

**这一关考的是知道你手里拿的是哪种排序。** Zig 带了两种，名字就说明了哪个是哪个。
`std.mem.sortUnstable` 是一种 pattern-defeating quicksort：它对相等元素的顺序不作任何承诺，
在真实的输入上也明显不会保持 —— 它的分区步骤会理所当然地把相等的元素换到枢轴的另一边。
`std.mem.sort` 是一种块排序，**稳定**，并为这个承诺付出一些代价。起始代码用的是
`sortUnstable`，比较器只看分数，而隐藏用例大到足以证明它会把顺序打乱。（在 `n = 8` 时，
不稳定的那个会退化成插入排序，碰巧保持了顺序 —— 这就是为什么一个小测试什么都证明不了，
也是为什么这里的小用例是*可见*的那个，而不是评判你的那个。）

正确答案有两个，你应该两个都能给出。用 `std.mem.sort`。**或者**保留 `sortUnstable`，把
比较变成**全序** —— 分数降序，然后下标升序 —— 这样任何两个元素都不会比较为相等，稳定性
也就不再是个问题。第二种是默认应该用的；当顺序被完全指定时，不稳定的排序没有什么需要证明的。
'''
hints = [
  "一个词：sortUnstable 改成 sort。std.mem.sort 就是稳定的那个，这就是稳定的答案。",
  "另一个答案保留 sortUnstable，按（分数降序，然后下标升序）比较 —— 一个全序，所以没有平局可以不稳定。",
  "TIES 数的是排好的顺序里相邻的相等分数，无论你写的是两种里的哪一种，这个数都一样 —— 暴露你的是下标的顺序。",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.hacker.28.lru"
title = "收费"
story = "7-32 室，第七场面试，最后一道题。一个必须把对的东西逐出的缓存，每个节点都付了钱、也都还了回去，还有那个计时器。"
brief = '''
第一行是 `cap q`。接下来 `q` 行是 `PUT <key> <value>` 或 `GET <key>`。

实现一个固定容量的缓存，满了的时候逐出**最近最少使用**的条目。`GET` 和 `PUT` 都算作
使用一个键。

对每个 `GET` 输出值，如果不在就输出 `-1`。最后输出留下来的键，最近使用的在前，用空格
分隔 —— 如果缓存为空就输出 `-` —— 然后输出 `EVICTED <k>`。

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

把示例走一遍：`GET 1` 让 `1` 重新变成最近的，所以 `PUT 3` 需要空间时，走的是 `2`。
`GET 2` 未命中。`GET 3` 命中，并让 `3` 成为最近的，这就是留下来的键输出为 `3 1` 的原因。

教科书的答案是一个哈希 map 指向一个**双向链表**，而 Zig 有真正的双向链表，什么都不藏：
`std.DoublyLinkedList` 是**侵入式**的。链表不分配节点；你把一个
`std.DoublyLinkedList.Node` —— 两个指针，`prev` 和 `next` —— 嵌在你自己的结构体里，这个
结构体由你用分配器 `create`，也由你自己 `destroy`。对那个节点先 `remove` 再 `prepend`，
就是 `std::list::splice` 到最前面，`pop()` 交回最后一个节点，而它们每一个都是 O(1)，
不分配一个字节，所以你可以毫不含糊地大声说出每个操作 O(1)。要从一个 `*Node` 回到持有
键的那个条目，`@fieldParentPtr("node", node_ptr)` 按字段的偏移把指针往回走。于是 map
就是 `std.AutoHashMap(i64, *Entry)`。

**起始代码就是 boss。** 它有 map、有链表、有 `create` 也有 `destroy`，而它在示例里对
`GET 2` 输出 `20`。它从来不*碰*一个键：`GET` 就地读值，覆盖就地写值，链表保持键到达时的
顺序。于是闸杆记得谁先进来，就先放谁出去 —— 一个队列，不是一个缓存 —— 它逐出的是刚刚才
用过的 `1`，而不是 `2`。修复就是教科书上画了箭头的那两行：每次命中，把节点 `remove`，
再 `prepend`。

有两件事要做对，是 Rust 那场面试没要求过你的。条目除了值之外**还**要持有键，因为逐出是
从链表开始的，必须知道要删掉 map 里的哪一项。而且三个步骤的顺序很重要：`pop()` 出节点，
通过 `@fieldParentPtr` 读出键，把它从 map 里 `remove`，*然后*才 `gpa.destroy` 这个条目
—— 反过来就是通过一个分配器已经收回的指针去读，而没有任何东西替你抓住这次读取：它会
交回那块内存里现在的随便什么东西，这是这块领地里唯一一个不会自己报出来的错误。你
创建的每个条目，到 `main` 返回时都要销毁；`init.gpa` 背后的 `DebugAllocator` *会*点名
的，是你忘掉的每一个，而那张名单就是要交的收费。

这里的用例很小，计时也不是在量速度：四个操作分不出链表和一个从头扫描的切片。上面那段话
里的 `O(1)` 是你在面试间里要大声说出的那句话，所以它必须对你写的代码成立，而不是对碰巧
过了四个用例的代码成立。
'''
hints = [
  "拿起始代码把示例手工走一遍。GET 1 输出 10，并把 1 留在链表末尾，所以 PUT 3 逐出了 1 —— 这个闸杆是一个队列，不是一个缓存。",
  "recent.remove(&entry.node) 然后 recent.prepend(&entry.node) 以 O(1) 把条目移到最前面，而 map 指向它的指针之后仍然有效。这一对调用在每次命中和每次覆盖时都要做。",
  "覆盖一个已经存在的键不是逐出 —— 在判定缓存已满之前先查 map。",
  "逐出：pop() 出最后一个节点，@fieldParentPtr 回到条目，把它的键从 map 里删掉，然后 gpa.destroy 它。destroy 之后 map 里存的指针就是一个已释放的地址，所以 map 那一项必须先删。",
]
