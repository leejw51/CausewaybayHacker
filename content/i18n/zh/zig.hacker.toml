[[quest]]
id    = "zig.hacker.30.range-queries"
title = "一直在变的总数"
story = "整个收费广场一个早上的四百万次收费亭操作，一半是更正，而有人想要累计总数。"
brief = '''
标准输入是 `n q seed`。构建一个有 `n` 个值的数组，然后执行 `q` 个操作，全部来自同一个
生成器，用回绕的 `u64`：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

输出每个查询答案的累计总和，然后输出 `UPDATES <k>`。

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**这里的复杂度是强制的。** 朴素的答案 —— 每个查询都把区间循环一遍 —— 每个查询是
`O(n)`，小用例抓不住它。所以大的隐藏用例是 `n = 500000, q = 4000000`，朴素答案要碰
`10^11` 量级的元素，在五秒的运行限制内跑不完，而 Fenwick 树在 Debug 构建里 **0.39 s**
就做完全部。两者都是用这一关里的两个程序实测的。

面试官想钓出来的就是这一课：*单点更新，区间求和*，正是 Fenwick 树存在的那个形状。三个
短函数 —— add、prefix，以及用两个前缀之差表示的 range —— 最低置位就是你的步长。在
`usize` 上这个位是 `i & (~i + 1)`：C++ 答案里写的 `-i` 在这里的无符号类型上不存在，而
`~i + 1` 是用编译器接受的方式说出同样的位。或者写 `i & (0 -% i)` —— 回绕就是本意，所以
让运算符把它说出来。
'''
hints = [
  "对每个初始值调用一次 add 来建树。O(n) 的自底向上建树是个不错的优化，但不是计时要考的东西。",
  "i & (~i + 1) 取出 usize 的最低置位。加上它是沿树往上走；减去它是往下走。",
  "range(l, r) 是 prefix(r + 1) - prefix(l)，把这一对差一错误弄对就是调试的大部分工作。",
]

