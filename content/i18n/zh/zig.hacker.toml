title = "按什么顺序构建"
story = "十一个源文件和一张依赖图。说出一个构建顺序，或者说出那个让顺序不存在的环。"
brief = '''
第一行是 `n m`：`n` 个任务，编号 `0..n-1`，以及 `m` 条边。接下来 `m` 行是 `<a> <b>`，
表示 `a` 必须在 `b` 之前构建。

把构建顺序输出在一行里，用空格分隔。当有几个任务同时就绪时，取**编号最小**的那个，
这样答案是唯一的。如果不存在顺序，改为输出 `CYCLE`。然后输出 `DONE <how many you ordered>`。

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

Kahn 算法：数一数每个任务在等几样东西，从什么都不等的那些开始，每取出一个任务，就把
依赖它的任务的计数减一。如果做完时还有任务剩下，剩下的那些就是环。

就绪集合是一个 `std.PriorityQueue(usize, void, cmp)`，用 `std.math.order` 做比较，所以
`pop` 返回的就是最小的就绪任务。邻接表是每个任务一个 `std.ArrayList(usize)`，每个都用
`.empty` 开始，每个都用 `deinit(gpa)` 交还。
'''
hints = [
  "waiting[b] 是 b 的入度 —— 有多少条边指向它。",
  "普通队列给出*一个*顺序；最小堆给出题目要的*那个*顺序。",
  "你从来不直接检测环。你注意到出来的任务少于 n 个，剩下的就在环里。",
]

