# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.hacker.17.lis"
title = "最长的上升"
story = "每天的收费收入，要多少有多少，由你用一个种子自己生成。他们要最长的一段越来越好的日子，而且不必连续。"
brief = '''
标准输入是两个整数 `n` 和 `seed`。输入里没有数组 —— 你用**恰好**这个生成器自己构建它，
用 `u64` 算术和**回绕**运算符 `*%` 与 `+%`：

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

输出最长**严格递增子序列**的长度 —— 值保持原有顺序，但不必相邻。然后输出
`TAILS <k>`，其中 `k` 就是同一个长度，从耐心排序的牌堆数读出来。

```
input:  8 1
output: 3
        TAILS 3
```

对于 `8 1`，数组是
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`，
其中最长的上升是 `93944146 392341189 822192870`。在去算法里找 bug 之前，先拿这一行核对
你的生成器。

**这一关强制要求复杂度。** 初始代码是 `O(n²)` 的表 —— 你应该能不假思索写出来的答案，
而且它没有错。在 `n = 200000` 上它会输出和快的那个一样的 `881`，但要经过 `2 × 10^10`
次比较，而在所有边界检查都开着的 Debug 构建里，它在五秒的运行时限内回不来。你看到的是
超时而不是答案错误。这道题存在的意义就是制造这种失败。

`O(n log n)` 的那个为每个长度记下该长度的子序列所能结尾的最小值 —— 这个列表永远是有序
的，所以新值的位置是一次二分查找，而 `std.sort.lowerBound` 就是那次查找。它跑
`n = 200000` 只要 **0.04 秒**，是在这台机器上用这一关附带的程序实测的。

关于生成器说一句，因为这是 Zig 给这道题加上的那一半。对 `u64` 做普通的 `*` 或 `+`
溢出时，在这里不是回绕：在 Debug 下它是 `panic: integer overflow`，第一步就是。生成器
要的是回绕，所以就把它说出来 —— `x *% 6364136223846793005 +% 1442695040888963407` ——
编译器会让你对这个区别负责。用 `u64` 生成，取模，然后 `@intCast` 成 `i64`。
'''
hints = [
  "tails 不是一个子序列。它的长度才是答案；它的内容只是最好的结尾值。",
  "严格递增意味着你要替换第一个 >= value 的 tail，这正是 std.sort.lowerBound 返回的东西 —— 它的 context 是这个值，比较函数是 std.math.order(value, item)。",
  "如果大用例超时，你的答案没有错 —— 这里答案就是你循环的形状。对 200000 个值的两层嵌套循环是 2 x 10^10 次比较。",
]

