[[quest]]
id    = "zig.hacker.33.grid-paths"
title = "穿过街区，永不回头"
story = "送货的网格上有三条街因为搭竹棚封了。有多少种走法能穿过去，哪条最便宜。"
brief = '''
标准输入是 `r c pct seed`。按行优先的顺序自己构建网格，每个格子抽**两个**值：

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

只能向**右**或向**下**移动，只能经过开放的格子。输出：

1. `PATHS <k>` —— 从 `(0,0)` 到 `(r-1,c-1)` 有多少条不同的路线，对 `1000000007` 取模
2. `MIN <cost>` —— 一条路线的最小总代价，两个端点都算，如果没有路线就输出 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

按行优先的顺序走一遍就把两件事都做了：一个格子的路线数是从上方和从左方进入它的路线数
之和，它的最佳代价是它自己的代价加上这两者中较便宜的那个。因为你只会向右或向下走，你
需要的那两个格子总是已经算完了 —— 这就是它不需要递归、也不需要 visited 集合的原因。

`PATHS` 的计数对 `1000000007` 取模，原因照旧：在 `1000 × 1000` 的隐藏用例上，真实的数
有六百多位。边加边取模 —— 而在有符号的 `i64` 上那是 `@mod(x, P)`，因为在这里 `%` 只对
无符号整数有定义；编译器不会替你猜一个符号约定。

**大用例强制的是什么：** 它淘汰任何枚举路线的答案。路线比屋里的原子还多。它不区分自底
向上的表和带记忆化的递归 —— 两者在格子数上都是线性的，都能轻松通过：表在 Debug 构建里
只要 **0.05 s**。
'''
hints = [
  "每个格子都抽两个值，包括两个角 —— 生成器不跳过它们，只是拒绝封住它们。",
  "一个开放的格子，如果上方和左方都没有开放的邻居，那么到达它的路线数为零，也没有最佳代价；让 inf 表示不可达，并守住加法，因为 inf 加任何东西都是一个 panic。",
  "终点可以是开放的却仍然不可达，这正是 PATHS 为 0、MIN 为 -1 的情况。有一个隐藏用例就是这个。",
]

