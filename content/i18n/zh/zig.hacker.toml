旋转要原地做：先转置，再把每一行反转。把这一点说出口，这道题就答了一半。

把网格存成一个长 `n * n` 的扁平 `[]i64`，第 `r` 行就是切片
`grid[r * n .. r * n + n]` —— 这样 `std.mem.reverse(i64, row)` 就是反转，
`std.mem.swap` 就是转置。螺旋要的是原来的网格，所以旋转之前先 `gpa.dupe` 一份副本，
并且它的四条边界用 `i64` 来算：只有一行的网格在走出来时下边界会变成 `-1`，而 `usize`
会用一个 panic 拒绝它。
'''
hints = [
  "转置时只交换对角线以上的 —— c 从 r + 1 开始 —— 否则你会把所有东西又换回去。",
  "螺旋要的是原来的网格，所以在原地旋转之前先 gpa.dupe 一份副本。",
  "螺旋循环里的那两个 if 守卫，是防止中间单独的一行或一列被走两遍的东西 —— 而边界用 i64，是因为 right 和 bottom 本来就会合法地到达 -1。",
]

