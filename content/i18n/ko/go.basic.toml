[[quest]]
id    = "go.basic.16.json"
title = "태그가 계약이다"
story = "차고의 API는 소문자 키를 보내고 Go는 대문자 필드를 내보내는데, 일주일 동안 아무도 왜 모든 주문이 비어 있는지 알 수 없었다."
brief = '''
표준 입력은 한 줄입니다: 주문의 JSON 배열이며, 각 주문에는 문자열 `item`과
숫자 `cents`가 있습니다.

언마셜해서 주문마다 `<ITEM> <CENTS>` 한 줄을 출력한 뒤, 정확히 `count`와
`total` 키를 그 순서대로 가진 요약 객체를 마셜해서 출력하세요. 입력이 유효한
JSON이 아니면 `BAD JSON`만 출력하고 그 외에는 아무것도 출력하지 마세요.

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

`encoding/json`이 필드를 보려면 그 필드가 **내보내진** 것이어야 합니다.
소문자 필드는 마셜러에게 보이지 않고, 아무 말도 없습니다. 그다음 구조체
태그가 전송 시 이름을 정합니다. `Marshal`은 선언 순서대로 필드를 쓰므로
요약의 키 순서는 맵이 아니라 당신이 정합니다.
'''
hints = [
  "태그는 타입 뒤에 백틱으로 들어갑니다: Item string `json:\"item\"`.",
  "Unmarshal은 목적지의 포인터를 받습니다. orders가 아니라 &orders입니다. 아니면 채워 넣을 곳이 없습니다.",
  "Unmarshal의 오류를 확인하세요. 잘못된 입력이면 orders는 빈 채로 남고, 오류를 무시하는 프로그램은 명랑하게 0짜리 요약을 출력합니다.",
]

