  "루프 안에 l.PushBack(v); 그 뒤에 l.Remove(l.Front())와 l.Front().Value = 99; 순회 뒤에 sort.Ints(vals).",
  "Remove는 값이 아니라 *Element를 받으므로 l.Front()를 넘깁니다; 그 뒤엔 옛 두 번째 원소가 새 앞이 되고, 수정되는 것이 그것입니다. e.Value는 interface{}라서 순회가 e.Value.(int)를 씁니다.",
]

