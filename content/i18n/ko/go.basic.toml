[[quest]]
id    = "go.basic.17.threads"
title = "주문마다 라이더 하나"
story = "주문 여덟 개가 럭키맥 문을 나서 자전거 여덟 대에 동시에 실리고, 게시판은 하나도 기다리지 않고 저녁을 합산한다."
brief = '''
`go f()`는 `f`를 자기 고루틴에서 시작하고 기다리지 않습니다. `sync.WaitGroup`이
`main`이 그들 모두를 기다리는 방법입니다: 시작마다 그 전에 `Add(1)`, 각각이
끝날 때 안에서 `Done()` — 함수가 어떻게 빠져나가든 실행되도록 defer로 — 그리고
