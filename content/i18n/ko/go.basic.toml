  "MapSlice는 원소 타입을 바꾸므로 타입 매개변수가 하나가 아니라 둘 필요합니다.",
  "호출하는 쪽은 슬라이스와 함수에서 T와 U를 추론합니다. MapSlice[int64, string]이라고 적지 않습니다.",
  "~int64는 int64와, 밑바탕 타입이 int64인 모든 것을 뜻합니다. 그래서 이름 붙인 타입이 통과합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.basic.12.defer-panic-recover"
title = "넘어졌다가 다시 일어났다"
story = "예전에는 잘못된 전표 한 장이 계산대 전체를 쓰러뜨리고 그 교대 근무 기록까지 함께 날려 버리곤 했다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수이거나, `BOOM`이라는
단어이거나, 그 밖의 무언가입니다.

`run(text string) (out string)`을 작성하세요. 값의 두 배를 돌려주고, 파싱되지
않으면 `BAD <text>`를 돌려주며, `BOOM`에서는 **패닉**을 일으키되 지연된
함수에서 복구해서 호출자가 죽은 프로그램 대신 `RECOVERED boom`을 받게
하세요. 입력 한 줄마다 한 줄을 출력하고, 끝에는 `main`의 `defer`에서
`CLOSED <n>`을 출력하세요.

```
input:  4
        21
        BOOM
        xx
        -4
output: 42
        RECOVERED boom
        BAD xx
        -8
        CLOSED 4
```

세 가지 사실이 있고, 그 셋이 곧 문제입니다: `recover`는 지연된 함수 안에서만
무언가를 합니다. **이름 붙은** 반환값이 있어야 지연된 함수가 패닉 뒤에
반환될 값을 바꿀 수 있습니다. 그리고 `main`의 `defer`는 반환 시점에 실행되므로
루프가 어떻게 흘러갔든 `CLOSED`가 마지막입니다.
'''
hints = [
  "반환값에는 이름이 있어야 합니다 — out string — 아니면 지연된 함수가 대입할 곳이 없습니다.",
  "패닉이 없었으면 recover()는 nil을 돌려주므로, 그 if가 두 경로를 구분하는 방법입니다.",
  "main의 지연된 클로저는 적힌 시점이 아니라 실행되는 시점에 `done`을 읽으므로 최종 개수를 봅니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.basic.13.zero-values"
title = "아무것도 아닌 것이 아무것도 아닌 게 아니다"
story = "근무표 맵은 만들어진 적이 없는데, 코드는 아침 내내 거기서 읽어 오면서 한 번도 불평하지 않았다."
brief = '''
표준 입력은 개수 `n`, 그다음 단어 `n`개입니다.

네 줄을 순서대로 출력하세요:

1. `READ <v>` — **nil** 맵이 없는 키에 대해 돌려주는 것
2. `LEN <k>` — **nil** 슬라이스에 단어 `n`개를 모두 append한 뒤의 길이
3. `WRITE <ok|panic>` — 그 nil 맵에 대입했을 때 패닉이 났는지
   (복구하세요. 프로그램이 죽게 두지 마세요)
4. `FOUND <k>` — `a`와 `b`로 채워 *초기화된* 맵의 키인 단어의 개수

```
input:  3
        a b c
output: READ 0
        LEN 3
        WRITE panic
        FOUND 2
```

nil 맵과 nil 슬라이스는 같은 종류의 없음이 아닙니다. nil 맵을 읽는 것은
합법이고 값 타입의 제로 값을 줍니다. 거기에 쓰면 패닉이 납니다. 써 넣을
테이블이 없기 때문입니다. nil 슬라이스에 `append`하는 것은 합법이고 할당을
합니다. 그래서 `var s []T`는 관용적인 빈 슬라이스이지만 `var m map[K]V`는
관용적인 빈 맵이 아닙니다.
'''
hints = [
  "nil 맵에 empty[\"missing\"]을 하는 것은 오류가 아닙니다. int의 제로 값, 즉 0입니다.",
  "append는 nil 슬라이스를 처리합니다. 첫 배킹 배열을 대신 할당해 주므로, 시작하려고 make()를 쓸 필요는 결코 없습니다.",
  "쓰기는 지연된 recover가 있는 함수 안에서 일어나야 합니다. 아니면 네 번째 줄 전에 패닉이 프로그램을 끝냅니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.basic.14.embedding"
title = "물려받은 것은 없다"
story = "종점은 정류장에 무언가가 더 붙은 것이다. 알렉스는 그것을 두 번 썼고, 그건 한 번 더 쓴 것이다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이며 각 줄은 `STOP <NAME>` 또는
`TERM <NAME> <LINES>`입니다.

`Stop`에 이름을 돌려주는 `Describe() string`을 주세요. `Terminus`가 `Stop`을
**임베드**하고 `Lines int`를 더하게 하고, 임베드된 것을 호출한 뒤
`(<lines> lines)`를 덧붙이는 자기만의 `Describe`를 주세요.

각각의 `Describe()`를 출력한 뒤, `[]Describer`에 대한 타입 스위치로 센
`TERMINI <k>`를 출력하세요.

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

임베딩은 상속이 아닙니다. `Terminus`는 `Stop`이 *되는* 것이 아니라 하나를
담고 있으며, 담긴 값의 메서드는 바깥 타입이 자기 것을 선언하지 않는 한 바깥
타입으로 **승격**됩니다. `t.Stop.Describe()`가 가려 버린 쪽에 닿는 방법이고,
`super`는 없습니다.
'''
hints = [
  "임베드된 필드에는 자기 이름이 없습니다. 리터럴 안에서도 t.Stop.Describe() 안에서도 `Stop`이라고 씁니다.",
  "Terminus는 자기 Describe 덕분에 Describer를 만족합니다. 그것이 없었다면 승격된 Stop 메서드를 통해 만족했을 겁니다.",
  "comma-ok 형태의 d.(Terminus)가 타입 단언입니다. 둘보다 많을 때는 타입 스위치가 같은 일을 합니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.basic.15.variadics"
title = "몇 개가 있든"
story = "어떤 때는 주문 두 건이고 어떤 때는 선반 전체인데, 함수는 그것을 신경 쓰지 말아야 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

`total(values ...int64) (sum int64, count int)`를 작성하세요. 가변 인자에
이름 붙은 반환값이 있는 함수이며, 세 가지 방식으로 호출하세요. 출력:

1. `ALL <sum> <count>` — `...`로 펼친 슬라이스 전체
2. `NONE <sum> <count>` — 인자 없이 호출
3. `TWO <sum> <count>` — 앞의 두 값을 하나씩 따로 넘긴 것, 두 개가 안 되면
   있는 만큼

```
input:  4
        1 2 3 4
output: ALL 10 4
        NONE 0 0
        TWO 3 2
```

함수 안에서 `values`는 평범한 `[]int64`이고, 인자가 없으면 `nil`입니다.
`range`와 `len` 모두 특별한 처리 없이 그것을 다룹니다. `total(list...)`는
기존 슬라이스를 새 것에 복사하지 않고 그대로 넘깁니다. `total(list)`는
컴파일되지 않을 텐데, 그 이유를 아는 것이 문제입니다.
'''
hints = [
  "이름 붙은 결과가 있을 때 맨몸의 `return`은 sum과 count가 지금 갖고 있는 값을 그대로 돌려줍니다.",
  "total(list...)는 펼칩니다. total(list)는 []int64를 int64 하나로 넘기려 해서 컴파일되지 않습니다.",
  "인자가 없으면 values는 nil이고, nil 슬라이스의 len은 0입니다. 막아 줄 필요가 없습니다.",
]

