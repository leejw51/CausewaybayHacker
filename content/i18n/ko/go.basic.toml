[[quest]]
id    = "go.basic.06.strings"
title = "바이트는 글자가 아니다"
story = "B 출구 안내판이 銅鑼灣을 세 번째에서 자르고는 글자 한 개 반과 물음표 하나를 내놓는다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. **바이트** 단위 길이
2. **룬** 단위 길이
3. 룬 순서를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 문자가 들어 있을 수 있고, 그러면 앞의 두 숫자는 서로
다릅니다. `len(s)`는 바이트입니다. 처음부터 늘 그랬습니다.
'''
hints = [
  "len(line)은 바이트 수이고, []rune(line)은 디코딩된 것입니다.",
  "바이트 슬라이스를 뒤집으면 여러 바이트짜리 문자가 반으로 잘립니다.",
  "두 인덱스가 서로를 향해 걸어가며 자리를 바꾸는 것, 그게 뒤집기의 전부입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.basic.07.structs"
title = "계산대"
story = "럭키 맥 카운터가 주문에 한 줄을 추가하는데, 다음 줄을 넣을 때면 그 줄이 사라져 있다. 메서드가 복사본을 받은 것이다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<ITEM> <CENTS>` 형식의 줄 `n`개입니다.

항목들을 `Till`에 모은 뒤, 각 항목을 도착한 순서대로 `<ITEM> <CENTS>` 형태로
다시 출력하고, 마지막에 `TOTAL <sum>`을 출력하세요.

```
input:  2
        HASHBROWN 600
        SET 2800
output: HASHBROWN 600
        SET 2800
        TOTAL 3400
```

`n`은 `0`일 수 있고, 그러면 유일한 줄은 `TOTAL 0`입니다.

값 리시버 메서드는 계산대의 복사본을 받습니다. `Add`는 진짜 계산대를
바꿔야 합니다.
'''
hints = [
  "func (t *Till) Add — 포인터 리시버는 호출자가 들고 있는 계산대를 바꿉니다.",
  "till.Add(...)는 그대로 동작합니다. till이 주소를 취할 수 있으므로 Go가 대신 주소를 취해 줍니다.",
  "Total은 읽기만 하지만, 한 타입의 리시버는 일관되게 맞춰 두세요.",
]

