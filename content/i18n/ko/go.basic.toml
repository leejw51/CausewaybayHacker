[[quest]]
id    = "go.basic.11.generics"
title = "함수 하나, 어떤 목록이든"
story = "알렉스는 Sum을 네 번 썼다. 주문용, 라이더용, 분 단위용, 센트 단위용. 그리고 다섯 번째가 마감이다."
brief = '''
표준 입력은 공백으로 구분된 정수 한 줄입니다.

세 줄을 출력하세요:

1. 모든 값의 두 배를 공백 하나씩으로 이어 붙인 것
2. 원래 값들의 합
3. 그중 `10`보다 큰 값의 개수

```
input:  1 2 3 4 12
output: 2 4 6 8 24
        22
        1
```

제네릭 헬퍼 세 개를 쓰고 사용하세요: `MapSlice[T, U any]`,
