[[quest]]
id    = "go.basic.10.closures"
title = "출입문 카운트"
story = "럭키 맥은 들어오는 사람과 나가는 사람을 세고, 매니저는 그 사이에 무슨 일이 있든 마감 때의 숫자를 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이며 각 줄은 `IN` 또는 `OUT`입니다.

절대 0 아래로 내려가지 않는 누적 카운트를 유지하세요. 명령마다 그 값을
출력하세요. `main`이 반환될 때 `CLOSED <final>`을 출력하세요. 함수 끝에서가
아니라 `defer`에서 출력해야 합니다.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        CLOSED 2
```

카운터 자체는 클로저입니다. 함수를 돌려주는 함수이고, 합계는 그 둘 사이에
붙잡혀 있습니다. 정답에 패키지 수준 변수는 없습니다.
'''
hints = [
  "total은 makeCounter의 프레임에 살고, 돌려준 함수가 그것을 살려 둡니다. 그게 클로저입니다.",
  "defer func(){ ... }()는 반환 시점에 실행되고, 클로저는 defer를 적은 시점이 아니라 그때 `last`를 읽습니다.",
  "인자를 받는 defer였다면 defer 시점의 값을 붙잡았을 겁니다. 둘 다 해 보고 달라지는 것을 지켜보세요.",
]

