# GO LAND — BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/go/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.basic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.basic.01.package-main"
title = "첫 패키지"
story = "틴하우역 A 출구. 알렉스가 건넨 노트북에는 package 한 줄만 있고 그 아래는 텅 빈 파일이 열려 있다."
brief = '''
정확히 다음을 출력하세요:

```
hello, causewaybay
```

시작 코드에는 import가 하나도 없습니다. 필요한 것을 하나 추가하는 것이 이 과제입니다.
Go에서는 쓰지 않는 import가 컴파일 오류이고, 필요한데 없는 import는 `undefined`가 됩니다.
'''
hints = [
  "Println은 fmt 안에 있습니다.",
  "import \"fmt\"는 package 줄과 func main 사이에 들어갑니다.",
  "Println은 줄바꿈을 붙이고, Print는 붙이지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.basic.02.vars"
title = "옥토퍼스 리더기"
story = "틴하우역의 리더기는 잔액만 보여 주고, 일일 상한과 보증금이 있던 자리는 두 칸 모두 비어 있다."
brief = '''
표준 입력에서 정수 `n` 하나를 읽으세요.

세 줄을 출력하세요: `n`, 그다음 `n`의 두 배, 그다음 `n`을 `n`으로 곱한 값.

`n`은 `int64`에 들어가며 음수일 수 있습니다.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "읽는 부분은 이미 되어 있습니다. n에 값이 들어 있습니다.",
  "fmt.Println은 어떤 값이든 받으므로 여기서는 서식 문자열이 필요 없습니다.",
  "음수 n을 제곱하면 양수입니다. 테스트는 그것을 알고 있습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.basic.03.control-flow"
title = "트램이냐 MTR이냐"
story = "코즈웨이베이역 대합실 전광판은 어느 편이 곧 오는지 알려 줘야 한다. 그런데 매 분마다 분 숫자만 띄우고 있다."
brief = '''
정수 `n` 하나를 읽으세요. `1`부터 `n`까지의 모든 `i`에 대해 한 줄씩 출력하세요:

* `i`가 3과 5 모두로 나누어떨어지면 `TRAMMTR`
* `i`가 3으로 나누어떨어지면 `TRAM`
* `i`가 5로 나누어떨어지면 `MTR`
* 그 외에는 `i` 자체

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

Go의 주제 없는 `switch`는 각 갈래마다 불리언 조건을 받고, 아래로 흘러내리지
않습니다. 그것을 쓰세요.
'''
hints = [
  "둘 다인 경우를 먼저 검사하세요. 아니면 그 갈래는 영영 실행되지 않습니다.",
  "switch { case cond: }는 주제가 필요 없고 break도 필요 없습니다.",
  "3과 5로 나누어떨어진다는 것은 15로 나누어떨어진다는 것과 같습니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.basic.04.slices"
title = "객차의 한가운데"
story = "2번 승강장은 맨 처음 타는 사람과 맨 마지막에 타는 사람만 세고, 그 사이의 모두를 놓친다."
brief = '''
표준 입력은 첫 줄에 개수 `n`, 둘째 줄에 공백으로 구분된 정수 `n`개입니다.
`n`은 최소 `1`입니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 엄격히 놓인
모든 값의 합. 값이 세 개 미만이면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1:len(nums)-1]은 같은 배킹 배열을 공유합니다. 복사본이 아니라 뷰입니다.",
  "값이 하나나 둘이면 그 슬라이스 식은 비어 있거나 유효하지 않습니다. if로 막아 주세요.",
  "슬라이스에 range를 걸면 인덱스와 값을 줍니다. 인덱스는 _로 비우세요.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.basic.05.maps"
title = "대합실이 외치는 것"
story = "아홉 시의 코즈웨이베이 환승역. 안내판은 순위를 원하는데 맵에는 순서가 없다."
brief = '''
표준 입력 전체를 읽고 공백 기준으로 나누세요.

서로 다른 단어를 각각 한 번씩 `<word> <count>` 형태로 출력하세요. 횟수
내림차순으로 정렬하고, 같은 횟수끼리는 단어 오름차순으로 정렬합니다.

```
input:  tram tram bus
output: tram 2
        bus 1
```

Go의 맵을 range로 도는 순서는 의도적으로 무작위입니다. 출력하기 전에 먼저
모아 두세요.
'''
hints = [
  "counts[word]++는 없는 키에도 동작합니다. int의 제로 값이 0이기 때문입니다.",
  "sort.Slice는 less 함수를 받습니다. i가 j보다 앞에 와야 할 때 true를 돌려주세요.",
  "동점 처리는 그 같은 함수 안의 두 번째 비교입니다.",
]

