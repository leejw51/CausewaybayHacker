id    = "go.basic.18.hashtable"
title = "집계, 하나 빼고"
story = "주방은 패스에서 외쳐진 모든 단어를 집계하고, the라는 단어를 지우고, 저녁마다 다른 순서로 집계를 읽는다."
brief = '''
Go의 맵은 해시 테이블입니다: 키가 슬롯으로 해시되므로 추가, 삭제, 조회 모두 키가 열 개든
천만 개든 비용이 같습니다 — 대가는 순회가 정해진 순서 없이 나온다는 것입니다. 추가는
`counts[w]++`; 삭제는 `delete`; 항목을 안전하게 수정하는 것은 comma-ok 형태
`n, ok := counts[k]`로, 되쓰기 전에 키가 있었는지 말해 줍니다. 키는 슬라이스로 모여서(작성돼
있음) `sort.Strings`로 정렬됩니다. 아니면 집계가 저녁마다 다르게 읽힐 테니까요.

```
counts[w]++
delete(counts, "the")
if n, ok := counts["tram"]; ok { counts["tram"] = n * 100 }
sort.Strings(keys)
```

단어 `w`는 루프에서 읽힙니다. 루프 안에 세기를, 그 뒤에 `delete`와 comma-ok 수정을, `keys`가
만들어진 뒤에 정렬을 네 개의 자리 표시자 대신 입력하세요; 크기와 정렬된 집계가 출력됩니다.

```
input:  the tram the wire the
output: 2
        tram 100
        wire 1
```
'''
hints = [
  "루프 안에 counts[w]++; 그 뒤에 delete(counts, \"the\")와 if n, ok := counts[\"tram\"]; ok { counts[\"tram\"] = n * 100 }; keys가 만들어진 뒤 sort.Strings(keys).",
  "comma-ok 읽기는 절대 넣지 않습니다: \"tram\"이 없으면 ok가 false라 아무것도 쓰지 않습니다 — 평범한 counts[\"tram\"] 읽기는 0을 돌려줬을 것이고 대입은 키를 만들었을 것입니다.",
