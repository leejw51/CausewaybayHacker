[[quest]]
id    = "go.basic.08.interfaces"
title = "목록 하나, 두 가지 것"
story = "하이산 플레이스 안내판과 그 바깥의 트램 정류장은 서로 다른 두 프로그램이 찍어 내는데, 어느 쪽도 상대의 목록에 들어가지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이며 각 줄은 다음 중 하나입니다.

* `SHOP <NAME> <FLOOR>` — `<NAME> / F<FLOOR>`로 렌더링
* `STOP <ROUTE>` — `TRAM <ROUTE>`로 렌더링

모든 표지판을 순서대로 렌더링해 출력한 뒤 `SIGNS <n>`, 그다음 `SHOPS <k>`를
출력하세요. `k`는 그중 상점의 개수인데, 파싱하면서 들고 있던 플래그가 아니라
**타입 스위치**로 세어야 합니다.

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        SIGNS 3
        SHOPS 2
```
'''
hints = [
  "`implements` 키워드는 없습니다. 각 구조체에 Render() string 메서드를 주면 Sign을 만족합니다.",
  "구체 값을 []Sign에 그대로 append하세요. Go가 대신 감싸 줍니다.",
  "switch sign.(type) { case Shop: }가 타입 스위치이고, 값을 받는 형태는 switch v := sign.(type)입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.errors"
title = "숫자가 아닌 줄"
story = "차고에서 돌아온 라이더 기록의 열 한가운데에 누군가의 점심 주문이 끼어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수여야 합니다.

각 줄마다 값의 두 배를 출력하거나, 파싱되지 않으면 `BAD <line>`을 출력하세요.
마지막에 `SUM <total>`을 출력하세요. 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

센티널 `var ErrNotANumber = errors.New(...)`를 정의하고,
`fmt.Errorf("...: %w", ErrNotANumber)`로 감싼 뒤, `main`에서 `errors.Is`로
알아보세요. 오류는 값입니다. 그 덕분에 얻는 것이 바로 이것입니다.
'''
hints = [
  "strconv.ParseInt(s, 10, 64)는 (int64, error)를 돌려줍니다. 두 번째 값은 봐도 그만 안 봐도 그만인 것이 아닙니다.",
  "fmt.Errorf의 %w는 감싼 오류를 찾을 수 있게 유지합니다. %v였다면 텍스트로 납작하게 눌렸을 겁니다.",
  "errors.Is는 감싼 사슬을 따라 걷기 때문에, 메시지가 덧붙여진 뒤에도 여전히 맞춰 냅니다.",
]

