# GO LAND — BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/go/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.basic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.basic.01.package-main"
title = "첫 패키지"
story = "틴하우역 A 출구. 알렉스가 건넨 노트북에는 package 한 줄만 있고 그 아래는 텅 빈 파일이 열려 있다."
brief = '''
정확히 다음을 출력하세요:

```
hello, causewaybay
```

시작 코드에는 import가 하나도 없습니다. 필요한 것을 하나 추가하는 것이 이 과제입니다.
Go에서는 쓰지 않는 import가 컴파일 오류이고, 필요한데 없는 import는 `undefined`가 됩니다.
'''
hints = [
  "Println은 fmt 안에 있습니다.",
  "import \"fmt\"는 package 줄과 func main 사이에 들어갑니다.",
  "Println은 줄바꿈을 붙이고, Print는 붙이지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.basic.02.vars"
title = "옥토퍼스 리더기"
story = "틴하우역의 리더기는 잔액만 보여 주고, 일일 상한과 보증금이 있던 자리는 두 칸 모두 비어 있다."
brief = '''
변수는 `var`로 선언하거나 `:=`로 그 자리에서 만드는데, `:=`는 오른쪽 값에서
타입을 가져옵니다. `fmt.Println`은 인자들을 공백으로 띄워 출력하고 뒤에 줄을
바꿉니다. `int64`의 산술은 `int64`로 남습니다: `n * n`도 정수입니다.

```
fmt.Println(n * n)
```

잔액 `n`은 읽혀서 출력되고 `n * 2`도 출력됩니다. 세 번째 출력을 쓰세요: `n`
곱하기 `n`.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "fmt.Println(n * n)",
  "바로 위 줄과 같은 모양입니다. n * 2가 n * n이 됩니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.basic.03.types"
title = "요금 나누기"
story = "틴하우 카운터에서 라이더 둘이 럭키맥 계산서 하나를 나누고, 영수증은 몫을 정수로, 나머지로, 그리고 실제 값으로 찍는다."
brief = '''
Go는 숫자를 대신 변환해 주지 않습니다. 정수 둘의 `a / b`는 정수 나눗셈(0 쪽으로
버림)이고 `a % b`는 나머지입니다. 실제 몫을 얻으려면 먼저 양쪽을
`float64(...)`로 변환하고, `fmt.Printf`의 `%.2f`가 소수점 아래 정확히 두 자리로
출력합니다.

```
fmt.Printf("%.2f\n", float64(a)/float64(b))
```

정수 몫과 나머지는 출력되어 있습니다. 셋째 줄을 쓰세요: 실제 몫, 소수 두 자리.

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "fmt.Printf(\"%.2f\\n\", float64(a)/float64(b))",
  "양쪽 모두 변환하세요: float64(a) / b는 컴파일되지 않습니다. float64와 int64는 나눌 수 없습니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.basic.04.strings"
title = "역 이름"
story = "코즈웨이베이 승강장 표지판은 역 이름을 한 번 보여주고, 대문자가 들어갈 자리는 비어 있고, 거울 쪽을 위해 거꾸로 적힐 자리도 비어 있다."
brief = '''
`string`은 읽기 전용 바이트 슬라이스입니다. `len(s)`는 바이트 단위 길이이고,
`strings` 패키지에 일상적인 변환이 들어 있으며, 글자 단위로 걸으려면 `[]rune`으로
변환합니다. 아래의 `reverse` 도우미가 그 걷기를 하니 호출만 하면 됩니다.

```
fmt.Println(strings.ToUpper(line))
fmt.Println(reverse(line))
```

길이는 출력되어 있습니다. 다음 두 줄을 쓰세요: 대문자 이름, 그다음 뒤집은 이름.

```
input:  causeway bay
output: 12
        CAUSEWAY BAY
        yab yawesuac
```
'''
hints = [
  "fmt.Println(strings.ToUpper(line)) 그다음 fmt.Println(reverse(line)).",
  "_ = strings.ToUpper 줄은 import가 쓰이게만 해 둔 것입니다. strings.ToUpper를 실제로 호출하면 지우세요.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.basic.05.loops"
title = "세 번째 열차마다"
story = "애드미럴티 출발 안내판은 아침 열차를 모두 더하고 그중 몇 대가 세 번째마다 오는 급행이었는지 말해야 한다. 0이 둘 찍혀 있다."
brief = '''
Go의 루프 키워드는 하나입니다. `for 초기화; 조건; 증감 { }`이 세고, 그 안의
`if`는 괄호 없이 중괄호만 필요합니다. `sum += i`는 변수에 제자리에서 더하고,
`i%3 == 0`이 `i`가 3의 배수인지 묻는 법입니다.

```
for i := 1; i <= n; i++ {
	sum += i
	if i%3 == 0 { threes++ }
}
```

루프 헤더는 적혀 있습니다. 본문을 채우세요: `i`를 `sum`에 더하고, 3의 배수이면
`threes`에 세세요(한 줄짜리 `if` 하나면 됩니다).

```
input:  10
output: 55
        3
```
'''
hints = [
  "한 줄에 sum += i, 다음 줄에 if i%3 == 0 { threes++ }.",
  "if는 문장이 하나여도 중괄호가 필요하고, 괄호는 필요 없습니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.basic.06.functions"
title = "라이더의 요율"
story = "알렉스의 배달 앱은 근무 중 처음 열 번의 배달은 한 요율로, 나머지는 다른 요율로 지급하는데, 주방 태블릿의 지급 함수는 모두에게 0을 돌려준다."
brief = '''
함수는 매개변수 이름 뒤에 타입을, 괄호 뒤에 결과 타입을 씁니다. `return`이
값과 함께 함수를 끝내고, `if` 안의 `return`은 일찍 끝내므로 `if` 다음 줄은
조건이 거짓일 때만 실행됩니다.

```
func fare(rides int) int {
	if rides <= 10 { return rides * 5 }
	return 50 + (rides-10)*3
}
```

처음 열 번은 한 번에 5, 그 뒤는 한 번에 3입니다. `fare`는 선언되고 호출됩니다.
본문을 쓰세요: 열 번 이하일 때의 이른 `return`, 그리고 나머지의 `return`.

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { return rides * 5 } 그다음 return 50 + (rides-10)*3.",
  "열 번에 5씩이면 50입니다. 두 번째 식은 거기서부터 셉니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.basic.07.structs"
title = "주문의 한 줄"
story = "럭키맥 주문 화면에는 품목마다 한 행이 있다 — 이름, 가격, 몇 개 — 그리고 합계 열은 모든 행에서 0이다."
brief = '''
`struct`는 이름 붙은 필드를 묶습니다. 값은 필드 이름을 적는 리터럴로 만들고,
메서드는 이름 앞에 리시버가 붙은 함수입니다: `func (it Item) Total() int`는
`it.Total()`로 호출되고 `it`를 통해 필드를 읽습니다.

```
it := Item{Name: name, Price: price, Qty: qty}
return it.Price * it.Qty
```

`Item`과 그 `Total` 메서드는 선언되어 있습니다. 읽은 세 값으로 `it`를 만드는
리터럴과 `Total`의 한 줄 본문을 쓰세요.

```
input:  tea 12 3
output: tea: 36
```
'''
hints = [
  "it := Item{Name: name, Price: price, Qty: qty} — 그리고 Total 안에는 return it.Price * it.Qty.",
  "리터럴이 세 이름을 쓰게 되면 _, _, _ = 줄은 지우세요. Go는 쓰지 않는 변수를 거부합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.basic.08.enums"
title = "노선의 색"
story = "애드미럴티 환승 지도는 노선 셋을 이름으로 알면서 모두 회색으로 칠한다."
brief = '''
Go에는 `enum` 키워드가 없습니다. 관용구는 이름 붙은 정수 타입과, 내려가며
상수에 0, 1, 2를 매기는 `iota`가 든 `const` 블록입니다. 그런 값에 대한 `switch`는
상수마다 `case` 하나를 나열하고, `case`는 `return`과 함께 한 줄에 둘 수
있습니다.

```
type Line int

const (
	Island Line = iota
	TsuenWan
	KwunTong
)

switch l {
case Island: return "blue"
case TsuenWan: return "red"
case KwunTong: return "green"
}
```

`Line`, 세 상수, `parse`는 적혀 있고 `colour`는 `Island`에 이미 `blue`라고
답합니다. 빠진 두 case를 더하세요: `TsuenWan`은 `red`, `KwunTong`은 `green`.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "case TsuenWan: return \"red\" 그리고 case KwunTong: return \"green\", Island case 아래에 각각 한 줄씩.",
  "Go의 switch는 아래로 흘러내리지 않습니다. 각 case는 저절로 끝나고 break가 필요 없습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.vector"
title = "객차 세기"
story = "코즈웨이베이 2번 승강장은 모든 문에서 승차 인원을 읽고 하나도 간직하지 않는다. 합계도, 첫 문도, 마지막 문도 없다."
brief = '''
슬라이스는 Go의 늘어나는 리스트이고, 하나에 하는 일은 아래 네 줄입니다. `append`는 끝에
추가하고 슬라이스를 돌려주므로 항상 다시 대입합니다. 인덱스 1 삭제도 다시 `append`입니다:
그 앞부분에 뒷부분을 이어 붙입니다. 수정은 그냥 인덱싱 — `xs[0] = 99`는 첫 원소를 제자리에서
덮어씁니다. 그리고 `sort.Ints`는 슬라이스 전체를 제자리에서 오름차순으로 정렬합니다.

```
xs = append(xs, v)
xs = append(xs[:1], xs[2:]...)
xs[0] = 99
sort.Ints(xs)
```

문 개수 `v`는 루프에서 읽힙니다(최소 두 개). 루프 안에 `append`를, 그 뒤에 삭제, 수정, 정렬을
네 개의 자리 표시자 대신 입력하세요; 길이와 슬라이스가 출력됩니다.

```
input:  3 7 2 5
output: 3
        2 5 99
```
'''
hints = [
  "루프 안에 xs = append(xs, v); 그 뒤에 xs = append(xs[:1], xs[2:]...), xs[0] = 99, sort.Ints(xs).",
  "xs[:1]은 인덱스 1 앞의 전부, xs[2:]는 그 뒤의 전부입니다; append가 둘을 잇고, ...는 두 번째 슬라이스를 인자들로 펼칩니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.basic.10.maps"
title = "주문 집계"
story = "럭키맥 주방 프린터는 외치는 대로 품목을 뱉어내고, 러시 동안 각각이 실제로 몇 개 주문됐는지는 결코 말하지 않는다."
brief = '''
`map[string]int`는 단어로 개수를 키합니다. 추가는 `counts[w]++` — 없는 키는 0으로 읽히므로
첫 등장이 1이 됩니다. 삭제는 `delete(counts, k)`이고, 키가 없으면 조용합니다. 수정은 대입:
`counts["bun"] = 10`은 그 키의 개수를 덮어씁니다(없으면 넣습니다). 맵에는 순서가 없어
range하면 뒤섞여 나오므로, 키를 슬라이스로 모으고(작성돼 있음) `sort.Strings`로 출력 전에
정렬합니다.

```
counts[w]++
delete(counts, "tea")
counts["bun"] = 10
sort.Strings(keys)
```

단어 `w`는 루프에서 읽힙니다. 루프 안에 세기를, 그 뒤에 `tea`의 `delete`와 `bun`의 수정을,
`keys`가 만들어진 뒤에 정렬을 네 개의 자리 표시자 대신 입력하세요; 정렬된 `word count`
줄들이 출력됩니다.

```
input:  tea bun tea rice tea bun
output: bun 10
        rice 1
```
'''
hints = [
  "루프 안에 counts[w]++; 그 뒤에 delete(counts, \"tea\")와 counts[\"bun\"] = 10; keys가 만들어진 뒤 sort.Strings(keys).",
  "키에 대입하는 줄은 키가 있든 없든 같습니다: 있으면 덮어쓰고 없으면 넣습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.basic.11.sets"
title = "서로 다른 라이더"
story = "아침에 라이더 번호 마흔 개가 럭키맥 문으로 들어오는데 대부분은 같은 여덟 사람이고, 근무판은 도착할 때마다 새 라이더로 센다."
brief = '''
Go에는 집합 타입이 없습니다; 값 타입이 빈 구조체인 맵이 관용구입니다. 추가는
`seen[v] = struct{}{}`; 삭제는 `delete`. 집합에는 수정이 없습니다 — 원소는 있거나 없을
뿐입니다 — 그래서 `3`을 `4`로 바꾸는 것은 삭제와 추가이고, 여기서는 한 줄에 씁니다.
`len(seen)`이 서로 다른 개수입니다; 키는 순서 없이 나오므로 슬라이스로 모아(작성돼 있음)
`sort.Ints`로 정렬합니다.

```
seen[v] = struct{}{}
delete(seen, 8)
delete(seen, 3); seen[4] = struct{}{}
sort.Ints(keys)
```

라이더 번호 `v`는 루프에서 읽힙니다. 루프 안에 추가를, 그 뒤에 `8`의 삭제와 `3`→`4` 수정을,
`keys`가 만들어진 뒤에 정렬을 네 개의 자리 표시자 대신 입력하세요; 서로 다른 개수와 정렬된
번호가 출력됩니다.

```
input:  8 3 8 5 3 8
output: 2
        4 5
```
'''
hints = [
  "루프 안에 seen[v] = struct{}{}; 그 뒤에 delete(seen, 8)와 delete(seen, 3); seen[4] = struct{}{}; keys가 만들어진 뒤 sort.Ints(keys).",
  "없는 값의 delete는 아무것도 안 하고, 이미 있는 값의 추가는 아무것도 바꾸지 않습니다: 수정의 두 절반 모두 입력이 무엇이었든 안전합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.basic.12.stack-queue"
title = "접시와 줄"
story = "럭키맥 패스에서 깨끗한 접시는 쌓여서 위에서 빠지고, 손님은 계산대에 줄 서서 앞에서 빠진다. 화면은 둘 다 같은 방식으로 한다."
brief = '''
슬라이스는 스택입니다. 푸시는 `append`; 팝은 마지막 원소를 잘라내는 리슬라이스; 맨 위는
`stack[len(stack)-1]`이고 대입할 수 있습니다 — 접시를 빼지 않고 맨 위를 고칩니다. 앞에서
`queue = queue[1:]`로 꺼내는 큐 쪽은 작성돼 있습니다. 스택은 절대 정렬하지 않습니다 —
순서 자체가 요점이니까요 — 그래서 이 드릴은 넷이 아니라 세 줄입니다.

```
stack = append(stack, v)
stack = stack[:len(stack)-1]
stack[len(stack)-1] = 99
```

숫자는 `xs`로 읽힙니다(최소 두 개). `xs` 루프 안에 푸시를, 그 뒤에 팝과 맨 위 수정을 세 개의
자리 표시자 대신 입력하세요; 스택과 큐의 앞 둘이 출력됩니다.

```
input:  1 2 3 4
output: 1 2 99
        1 2
```
'''
hints = [
  "루프 안에 stack = append(stack, v); 그 뒤에 stack = stack[:len(stack)-1]과 stack[len(stack)-1] = 99.",
  "팝은 슬라이스를 좁힙니다; 복사도 해제도 없습니다. 팝 뒤 len(stack)-1은 위에서 두 번째였던 원소를 가리킵니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.basic.13.sorting"
title = "도착 안내판"
story = "틴하우 도착 안내판은 다음 열차들을 데이터가 들어온 순서로 나열하는데, 그것은 순서가 아니다."
brief = '''
`sort` 패키지는 슬라이스를 제자리에서 정렬합니다. `sort.Ints(xs)`는 정수를
오름차순으로 놓습니다. 내림차순에는 `sort.IntsDesc`가 없습니다. 대신 슬라이스를
`sort.IntSlice`로 감싸고 `sort.Reverse`로 순서를 뒤집어 `sort.Sort`에 넘깁니다.

```
sort.Ints(xs)
sort.Sort(sort.Reverse(sort.IntSlice(xs)))
```

첫 출력 앞에 오름차순 정렬을, 둘째 출력 앞에 내림차순 정렬을 쓰세요. 출력은
적혀 있습니다.

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "먼저 sort.Ints(xs), 다음에 sort.Sort(sort.Reverse(sort.IntSlice(xs))).",
