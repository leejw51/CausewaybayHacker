for i, x := range xs {
	wg.Add(1)
	go func(i, x int) {
		defer wg.Done()
		results[i] = x * x
	}(i, x)
}
wg.Wait()
```

루프, `Add`, 고루틴의 모양은 적혀 있습니다. 본문을 채우세요: `defer wg.Done()`,
그다음 `results[i]`에 `x * x`를 저장하세요.

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
