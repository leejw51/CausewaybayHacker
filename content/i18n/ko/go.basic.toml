  "첫 줄에 defer wg.Done(), 둘째 줄에 results[i] = x * x.",
  "defer는 그 사이에 무슨 일이 있든 고루틴이 반환될 때 Done을 실행합니다. 맨 앞의 평범한 wg.Done()은 일하기도 전에 \"끝났다\"고 말하는 셈입니다.",
]

