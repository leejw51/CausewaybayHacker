[[quest]]
id    = "pytorch.verybasic.04.zeros"
title = "빈 랙"
story = "팬 속도 읽기값을 위한 새 누산기. 네 개씩 세 줄, 첫 읽기값이 들어올 때까지 전부 0이다."
