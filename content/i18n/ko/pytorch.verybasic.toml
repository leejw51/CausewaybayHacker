`reshape`는 같은 숫자들에 다른 모양을 줍니다. 원소 수는 맞아야 합니다. 숫자 열두 개는 `(3, 4)`나 `(4, 3)`이나 `(2, 6)`은 될 수 있지만 `(5, 5)`는 절대 안 됩니다.

열두 개를 네 개씩 세 행으로 늘어놓는 줄을 고르세요.

