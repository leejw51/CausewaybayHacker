[[quest]]
id    = "pytorch.verybasic.03.dtype"
title = "정수가 아니었던 정수"
story = "전력 로그는 와트를 샘플 수로 나누고, 모든 행에서 0을 얻는다. 와트가 정수이고 답도 정수라는 것, 그게 문제다."
brief = '''
텐서는 전체에 dtype이 하나이고, `torch.tensor`는 넘겨받은 것으로 그것을 추론합니다. 파이썬 `int`의 리스트는 `torch.int64`를, `.`이 들어 있는 리스트는 `torch.float32`를 줍니다.

float 텐서를 만들어서 float dtype이 출력되게 하는 줄을 고르세요.

```
output: torch.float32
```
'''
hints = [
  "torch.tensor([1.0, 2.0]) — float로 만드는 것은 소수점입니다.",
  "평범한 int의 리스트는 torch.int64로 추론되고, 0들은 정수 나눗셈에서 나왔습니다.",
]

