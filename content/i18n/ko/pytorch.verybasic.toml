[[quest]]
id    = "pytorch.verybasic.06.reshape"
title = "같은 열두 개"
story = "센서 읽기값 열두 개가 한 줄로 길게 들어온다. 보고서는 네 개씩 랙 세 개로 받고 싶어 하고, 그전에는 선 하나도 그리지 않는다."
