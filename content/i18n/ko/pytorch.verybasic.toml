# PYTORCH LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/verybasic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.verybasic.01.first-tensor"
title = "첫 텐서"
story = "초우이칭 빌딩 지하 기계실, 23:00. 콘솔은 열려 있고 torch는 임포트되었지만, 아직 아무것도 만들어지지 않았다."
brief = '''
텐서는 이 랜드를 이루는 단 하나의 값입니다. `torch.tensor`는 파이썬 리스트로부터 텐서 하나를 만들며, 주어진 순서를 그대로 지킵니다.

텐서 `1 2 3`을 만드는 줄을 고르고, `# FILL` 주석이 있는 자리에 그 줄을 치세요.

```
output: [1, 2, 3]
```
'''
hints = [
  "torch.tensor는 인자를 하나 받습니다. 숫자 셋이 아니라 리스트 하나입니다.",
  "리스트의 순서가 곧 텐서의 순서입니다. 아무것도 대신 정렬해 주지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.verybasic.02.shape"
title = "이건 어떤 모양인가"
story = "랙 통로는 열두 대씩 두 줄인데, 재고 스크립트는 무언가가 스물네 개라고 우긴다. 무엇이 스물네 개인지는 아무도 모른다."
brief = '''
모든 텐서는 자기 모양을 압니다. `x.shape`는 `torch.Size`이고, 속은 튜플입니다. `tuple(...)`로 감싸면 `torch.Size` 없이 튜플로 출력됩니다.

텐서는 이미 만들어져 있습니다. 모양을 평범한 튜플로 출력하는 줄을 고르세요.

```
output: (2, 3)
```
'''
hints = [
  "tuple(x.shape) — 모양은 이미 시퀀스입니다. tuple()은 출력되는 모습만 바꿉니다.",
  "print(x.shape)는 torch.Size([2, 3])을 출력하는데, 같은 텍스트가 아닙니다.",
]

