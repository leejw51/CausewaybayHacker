[[quest]]
id    = "lua.hacker.26.statistics"
title = "소수점 아래 여섯 자리"
story = "등불 노점의 닷새 밤 매출. 당신 언어가 우연히 출력하는 방식이 아니라 명세가 말하는 방식으로 반올림한 숫자를 원한다 — 그리고 이 언어는 4.0을 4로 출력한다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개입니다.

각각 **소수점 아래 여섯 자리**로 세 줄을 출력하세요: 평균, **모집단** 표준편차(`n - 1`이 아니라 `n`으로 나눔), 그리고 중앙값 — 짝수 `n`이면 가운데 두 값의 평균입니다.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

이 퀘스트는 `match = "float:1e-6"`으로 채점되므로 비교는 수치적입니다: `3.8`과 `3.800000` 둘 다 통과하고, `1e-7`만큼 어긋난 값도 통과합니다. 그것은 의도된 것입니다 — 요점은 당신의 서식기가 아니라, 평균이 평균이어야 한다는 것과 짝수 길이의 중앙값이 사람들이 시계 아래에서 틀리는 경계라는 것입니다.

Lua에는 숫자 타입이 하나입니다. `19 / 5`는 `3.8`이고 `print`는 그것을 `3.8`로 보여 줍니다. `20 / 5`는 `4`이고 `print`는 그것을 `4.0`이 아니라 `4`로 보여 줍니다 — 그래서 여섯 자리는 `string.format("%.6f", v)`에서 나오고, `3.8`에 `%d`를 쓰면 반올림이 아니라 에러입니다. 표본이 아니라 모집단: 손을 뻗을 `statistics` 모듈이 없으므로 루프는 당신 몫입니다 — 편차 제곱의 평균, 그다음 `math.sqrt`. 문제를 두 번 읽으세요. 진짜 스크리닝에서 `n`과 `n - 1`의 차이는 제출물 전체입니다.
'''
hints = [
  "`/`는 언제나 진짜 나눗셈입니다: sum / n은 이미 평균이고, 스타터의 math.floor가 소수 부분을 버린 것입니다.",
  "모표준편차는 평균에서의 차이 제곱의 평균의 제곱근입니다 — n으로 나누세요. n - 1로 나누는 것은 표본 쪽이고 여기서는 틀립니다.",
  "짝수 개수의 중앙값은 1부터 세는 테이블에서 values[n / 2]와 values[n / 2 + 1]의 평균이고, 그 인덱스 한 쌍이 하나 차이 오류가 사는 곳입니다. n이 짝수면 n / 2는 정수이므로 유효한 키입니다.",
]

