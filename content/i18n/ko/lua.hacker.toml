[[quest]]
id    = "lua.hacker.14.word-search"
title = "그 단어가 격자에 있는가"
story = "글자판 하나와 등불 수수께끼에서 나온 이름 하나. 그 이름이 판에 적혀 있는지 알고 싶어 하고, 막다른 길의 수도 원한다."
brief = '''
첫 줄은 `r c`입니다. 다음 `r`줄은 소문자 격자입니다. 마지막 줄이 단어입니다.

**인접한** 칸 사이를 위, 아래, 왼쪽, 오른쪽으로 움직이며, 한 번의 시도에서 같은 칸을 두 번 쓰지 않고 철자를 이룰 수 있으면 단어가 격자에 있는 것입니다.

`FOUND` 또는 `ABSENT`를 출력하고, 그다음 `STARTS <k>`를 출력하세요: 단어의 첫 글자를 담은 칸이 몇 개인지입니다.

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

들어가는 길에 쓴 칸을 표시하고 **나오는 길에 표시를 지우세요**. 실패한 가지 뒤에도 표시가 남은 칸은 나중 가지들을 격자에 없는 이유로 실패하게 만듭니다. Lua 문자열은 제자리에서 표시할 수 없습니다 — 불변이고, `s:sub`는 언제나 새 문자열을 만들 뿐입니다 — 그래서 각 행을 먼저 한 글자 문자열의 테이블로 바꾸고, 표시는 그 테이블에 쓰는 것입니다.

Lua에서 `or`는 다른 곳과 똑같이 단락 평가되므로, 네 방향을 `or`로 이으면 나머지 단어의 철자를 이루는 첫 방향에서 멈춥니다.
'''
hints = [
  "칸을 단어에 들어 있을 수 없는 문자로 덮어쓰고, 재귀하고, 원래대로 되돌리세요.",
  "시작 글자는 탐색 전에 별도의 순회로 세세요. 아니면 '#' 표시가 개수를 헷갈리게 합니다.",
  "성공 기저 경우는 `at == #letters`입니다 — 이 칸을 맞춘 뒤에 검사하지, 전에 하지 않습니다.",
  "네 방향은 if 넷과 `found` 플래그 대신 `or`로 이으세요: `or`는 이미 처음 성공하는 분기에서 멈춥니다. 맞춘 뒤에도 계속하는 것은 하지 말라고 한 일입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.hacker.15.topo-sort"
title = "어떤 순서로 만드는가"
story = "용을 창고에서 꺼내는 데 필요한 작업 열한 개 — 짚, 뼈대, 향, 머리는 마지막 — 그리고 무엇이 무엇을 기다리는지 적힌 종이 한 장. 순서를 대거나, 순서가 없다는 뜻인 순환을 대라."
brief = '''
첫 줄은 `n m`입니다: `0..n-1`로 번호 붙은 작업 `n`개와 간선 `m`개. 다음 `m`줄은 `<a> <b>`이고, `a`가 `b`보다 먼저 만들어져야 한다는 뜻입니다.

만드는 순서를 한 줄에 공백으로 구분해 출력하세요. 여러 작업이 한꺼번에 준비되면 **가장 낮은 번호**를 취해서 답이 하나로 정해지게 하세요. 순서가 없으면 대신 `CYCLE`을 출력하세요. 그다음 `DONE <how many you ordered>`를 출력하세요.

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

칸의 알고리즘: 각 작업이 몇 개를 기다리는지 세고, 아무것도 기다리지 않는 것들로 시작하고, 작업 하나를 취할 때마다 그것에 의존하는 것들을 하나씩 줄이세요. 작업이 남은 채로 끝나면 그 작업들이 순환입니다. 준비된 집합은 숫자의 최소 힙 — 노드 12의 것에서 비교를 `<`로 줄인 것 — 이므로, "가장 낮은 번호"는 훑기가 아니라 `log n`이 듭니다. 작업은 `0`부터 번호가 붙고, `after[0]`과 `waiting[0]`은 Lua 테이블의 평범한 항목입니다. 테이블이 `1`에서 시작하는 척하는 것은 `ipairs`와 `#`뿐이므로, 작업은 숫자 `for`로 걸으세요.
'''
hints = [
  "waiting[b]는 b의 진입 차수입니다 — 그것을 가리키는 간선이 몇 개인지.",
  "평범한 큐는 *어떤* 순서를 주고, 최소 힙은 문제가 요구하는 *그* 순서를 줍니다.",
  "순환을 직접 감지하는 일은 없습니다. n개 미만의 작업이 나왔다는 것을 알아채고, 남은 것들이 순환 안에 있는 것입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.hacker.16.union-find"
title = "누가 누구와 이어져 있나"
story = "트램망, MTR, 미니버스 노선이 한 장에, 그리고 오늘 밤 용이 막는 모든 골목. 실제로 분리된 망은 몇 개인가."
brief = '''
표준 입력은 `n m seed`입니다: `0..n-1`로 번호 붙은 정류장 `n`개, 방향 없는 연결 `m`개. 입력에는 연결이 없습니다 — 당신이 만듭니다. **정확히** 이 생성기로, 넘치면 감기는 64비트 산술로:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

세 줄을 출력하세요: 분리된 망이 몇 개인지, 가장 큰 망의 크기, 그리고 `REDUNDANT <k>` — 이미 이어져 있던 두 정류장을 이은 연결이 몇 개인지. 정류장에서 자기 자신으로의 연결도 그중 하나입니다.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1`에서 다섯 연결은 `6—1`, `4—6`, `2—3`, `2—6`, `1—2`입니다. 마지막 것은 이미 같은 망에 있는 두 정류장을 이으므로 불필요한 것이고, 남는 것은 `{1,2,3,4,6}`과 따로 떨어진 정류장 `0`, `5`, `7`입니다.

Lua의 숫자는 double이고, double은 53비트를 담습니다: 그 안에서 저 상수 둘을 곱하면 `+`가 일어나기도 전에 낮은 비트가 사라집니다. LuaJIT에는 문제가 쓰인 바로 그 타입이 있습니다. `0ULL + seed`는 부호 없는 64비트 정수이고, 그 위의 `*`와 `+`는 `2^64`에서 감깁니다 — 마스크가 없습니다. 타입이 *곧* 마스크입니다 — `bit.rshift(x, 33)`이 그것을 받고, `tonumber(...)`가 31비트 결과를 `%`가 기꺼이 받는 평범한 숫자로 되돌립니다. 이 길의 모든 큰 케이스는 같은 네 줄짜리 생성기를 씁니다.

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 200000`에 연결 `m = 200000`개입니다. union-find가 아닌 뻔한 답 — 연결마다 한 번씩, `a`에서 망을 걸어 나가며 `b`가 이미 거기 있는지 보기 — 은 맞고, 연결당 `O(n)`이어서 전체 `O(n·m)`입니다: 이 기계에서 10초 실행 제한에 대해 **25초** 뒤에도 끝나지 않았습니다. 스타터가 그것입니다. 경로 압축과 크기 기준 합치기를 한 union-find는 같은 200000개 연결을 **0.01초**에 처리합니다. 이 퀘스트에 들어 있는 풀이로 여기서 잰 것입니다.

분명히 봐 둘 가치가 있습니다. 시간 제한 스크리닝에서 떨어지는 가장 흔한 방식이니까요: **스타터는 틀리지 않았습니다.** 예시와 작은 숨은 케이스 둘 모두에서 정확히 맞는 답을 출력합니다. 너무 늦게 도착한다는 이유만으로 거부됩니다.

union-find: 모든 정류장은 부모를 가리키고, `find`는 루트까지 걷고, `union`은 한 루트가 다른 루트를 가리키게 합니다. `find`에서 나오는 길에 경로를 압축하면 전체가 질의당 사실상 상수 시간입니다.

`find`는 루프로 쓰세요. 재귀 버전은 교과서 버전이고, 길이 이만인 사슬에서 `stack overflow`입니다 — 그것은 크기 기준 합치기가 막으려고 존재하는 바로 그 모양이고, 첫 `find`가 압축하기 전에 적대적인 입력이 가진 바로 그 모양입니다.
'''
hints = [
  "연결 목록을 먼저 만들지 말고 진행하면서 두 끝점을 뽑으세요 — 각각 생성기 한 단계씩, 그 순서로. 여기서는 연결이 두 번 필요한 곳이 없습니다.",
  "모든 정류장이 자기 자신의 부모이고 그룹이 n개인 상태로 시작하세요. 성공한 union마다 수가 하나 줄어듭니다. 끝난 뒤에는 루트의 크기 항목만 의미가 있으므로, 가장 큰 것은 모든 인덱스가 아니라 루트들에서 읽으세요.",
  "양 끝이 이미 같은 루트를 가진 연결이 불필요한 것입니다 — 세고 넘어가세요. 자기 연결 a == b는 그 검사에서 저절로 걸립니다.",
  "parent[v], v = root, parent[v]는 한 줄로 압축합니다: Lua는 무엇이든 대입하기 전에 오른쪽 전체를 평가하므로, 옛 parent[v]는 덮어써지기 전에 읽힙니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.hacker.17.lis"
title = "가장 긴 상승"
story = "등불 노점의 일 년치 매일 밤 매출. 매출이 나아지는 가장 긴 밤들의 흐름을 원하는데, 연속일 필요는 없다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개입니다.

가장 긴 **엄격히 증가하는 부분 수열**의 길이를 출력하세요 — 값들은 순서를 지키지만 인접할 필요는 없습니다. 그다음 `TAILS <k>`를 출력하세요. `k`는 같은 길이를 페이션스 정렬의 더미 수에서 읽은 것입니다.

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

`O(n²)` 표는 준비 없이도 쓸 수 있어야 하는 답입니다. `O(n log n)` 답은 각 길이마다 그 길이의 부분 수열이 끝날 수 있는 가장 작은 값을 유지합니다 — 항상 정렬되어 있는 테이블이므로 새 값의 위치는 이진 탐색입니다. Lua에는 `bisect`가 없습니다. 탐색은 손으로 쓰는 여섯 줄이고, `>= value`인 **첫** tail을 찾습니다 — 오른쪽이 아니라 왼쪽입니다. 엄격히 증가라는 것은 같은 값이 늘리는 게 아니라 교체한다는 뜻이기 때문입니다. 여기서는 어느 답이든 통과합니다. 케이스가 작고 그렇다고 말합니다. 그래도 두 번째 것을 쓰세요. 후속 질문은 언제나 "그리고 더 빠르게?"이니까요.

`tails[#tails + 1] = value`라고 쓰면 덧붙이고, 시퀀스 안쪽의 `at`에 대해 `tails[at] = value`라고 쓰면 교체합니다. 이진 탐색이 `at`을 건네주고, 그것이 끝 하나 너머에 떨어지면 같은 대입이 덧붙이기를 합니다.
'''
hints = [
  "tails는 부분 수열이 아닙니다. 그 길이가 답이고, 내용물은 최선의 끝 값일 뿐입니다.",
  "엄격히 증가이므로 value 이상인 첫 tail을 교체하고, `tails[mid] < value`로 하는 탐색이 그것을 찾습니다. value보다 큰 첫 tail을 찾으면 대신 비감소가 됩니다.",
  "tails의 끝을 넘어간다는 것 — low == #tails + 1 — 은 이 값이 지금까지의 가장 긴 상승을 늘린다는 뜻이고, 그러면 `tails[low] = value`는 덧붙이기입니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.hacker.18.edit-distance"
title = "얼마나 떨어져 있나"
story = "두 거리 표지판에 적힌 같은 골목의 두 가지 철자. 그 사이에 한 글자 편집이 몇 번인가."
brief = '''
두 줄, 각각 소문자 단어 하나. 어느 줄이든 **비어** 있을 수 있고, 그러면 답은 다른 쪽의 길이입니다.

**편집 거리**를 출력하세요: 첫 번째를 두 번째로 바꾸는 가장 적은 한 글자 삽입, 삭제, 치환의 수입니다. 그다음 가장 긴 공통 부분 수열의 길이 `LCS <k>`를 출력하세요.

```
input:  horse
        ros
output: 3
        LCS 2
```

같은 두 문자열 위의 표 둘이고, 둘 다 동점 처리만 다른 같은 세 줄짜리 점화식입니다. 행 단위로 채우세요. 답은 먼 모서리입니다. 편집 표에서 행 `0`과 열 `0`은 0이 아닙니다 — 전부를 삭제하거나 삽입하는 비용입니다.

첫 줄이 비어 있으면 `gmatch("%S+")`는 두 번째 단어를 첫 번째로 건네줄 겁니다. 이번에는 토큰이 아니라 줄 단위로 읽으세요 — `gmatch("(.-)\n")`은 줄을 걸으며 빈 줄에는 빈 문자열을 돌려줍니다.

`(len(a)+1) × (len(b)+1)` 표는 테이블의 테이블이고, 모든 행은 **자기만의** 테이블이어야 합니다: 루프 안에서 `{}`로 하나씩 만드세요. 행 테이블 하나를 모든 인덱스에 대입하면 사방에서 덮어쓰이는 행 하나일 뿐이고, 먼 모서리의 답은 그럴듯해 보이는 헛소리가 됩니다.
'''
hints = [
  "edit[i][0] = i이고 edit[0][j] = j: 접두사를 빈 문자열로 만드는 데는 글자당 삭제 하나가 듭니다.",
  "같은 글자는 비용 없이 대각선으로 한 걸음, 다른 글자는 비용 1에 세 이웃 중 가장 싼 것을 취합니다. a:byte(i) == b:byte(j)는 새 문자열 둘을 만들지 않고 글자를 비교합니다.",
  "LCS는 min 대신 max를 쓰고 불일치에서 대각선 걸음이 없는 같은 순회입니다. 그리고 모든 행을 루프 안에서 자기만의 {}로 만드세요 — 공유된 행 테이블 하나가 그럴듯한 틀린 숫자를 출력하는 버그입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.hacker.19.knapsack"
title = "가방에 들어가는 것"
story = "심부름꾼 하나, 향 가방 하나, 그리고 무게와 가격이 각각 적힌 노점판. 탐욕법은 엉뚱한 것을 고른다."
brief = '''
첫 줄은 `n cap`입니다. 다음 `n`줄은 `<weight> <value>`입니다. 각 품목은 많아야 **한 번** 취할 수 있습니다.

`cap`에 들어가는 가장 좋은 총 가치를 출력하고, 그다음 `GREEDY <v>`를 출력하세요: 아직 들어가는 것 중 무게당 가치가 가장 좋은 품목을 되풀이해 취하면 얻는 것입니다. 무게당 가치가 같으면 더 가벼운 품목이 먼저입니다.

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

두 숫자가 다르다는 것이 퀘스트의 요점 전부이고, 예시가 그것을 보여 줍니다: 무게당 가치가 가장 좋은 것은 `1.67`인 `6 10` 품목이고, 그것을 취하면 아무것도 들어가지 않는 네 칸이 남습니다. 그것을 포기하고 `5 7` 품목 둘을 취하면 `14`의 가치입니다. 숨은 케이스는 작으므로, 검사하는 것은 표가 빠른지가 아니라 두 숫자를 다 맞혔는지입니다.

비율은 정확하게 비교하세요. Lua에는 숫자 타입이 하나이고 그것은 double이므로 `value / weight`는 실수이고, 종이 위에서 같은 두 비율이 이진수로는 조금 달라질 수 있습니다. 여기에는 `Fraction`이 없습니다. 교차 곱셈이 있습니다: `p.value * q.weight > q.value * p.weight`는 나눗셈 없는 같은 비교이고, 곱은 double이 정확히 담는 정수입니다.
'''
hints = [
  "for room = cap, weight, -1은 용량을 내림차순으로 걷고, 그것이 무한이 아니라 0/1로 만드는 것입니다. 오름차순이면 같은 품목이 다시 쓰입니다.",
  "p.value * q.weight > q.value * p.weight는 나눗셈 없는 비율 비교입니다. 비교자에 넣으면 정렬이 정확합니다.",
  "탐욕 순회는 정렬된 품목에 대한 단순 루프입니다 — 되돌아가기가 없고, 그것이 정확히 틀린 이유입니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.hacker.20.bits"
title = "혼자인 것"
story = "모든 향 전표가 두 번 스캔되는데 하나만 아니다. 테이블도 못 쓰게 하고 정렬도 못 하게 한다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 음이 아닌 정수 `n`개이고, 하나를 빼고 모든 값이 정확히 두 번 나옵니다.

네 줄을 출력하세요:

1. 한 번 나오는 값, **xor**와 상수 추가 공간으로 찾은 것
2. 그 값에 켜진 `1` 비트가 몇 개인지
3. 2의 거듭제곱이면 `POW2 YES`, 아니면 `POW2 NO`(`0`은 아닙니다)
4. 가장 낮은 켜진 비트를 끈 그 값, 켜진 비트가 없으면 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`이고 `x ^ 0 == x`이며, xor는 어떤 순서로 일어나든 상관하지 않습니다. 그것이 첫 줄의 전부입니다. `x & (x - 1)`은 가장 낮은 켜진 비트를 끄고, 그것이 셋째와 넷째 줄을 공짜로 줍니다.

Lua 5.1에는 비트 연산자가 없습니다 — 여기서 `^`는 **거듭제곱**이고, `4 ^ 4`는 `256`입니다. 비트는 `bit` 라이브러리에 삽니다: `bit.bxor(a, b)`, `bit.band(a, b)`, `bit.bor`, `bit.lshift`, `bit.rshift`. 이것들은 32비트 정수에서 일하고 부호 있는 정수를 돌려주므로, `2^31` 이상의 값은 음수로 돌아올 겁니다. 여기의 값들은 작습니다. 비트 세기 루프를 쓰세요. 면접에서 묻는 것이 그 루프니까요.

여기의 네 케이스는 많아야 숫자 다섯 개이고, 시계는 거기서 속도를 재지 않습니다: 개수 테이블도 모두 통과하고, 정렬도 그럴 겁니다. 더 큰 케이스라도 그것을 바꾸지 못합니다. 이 문제가 세우는 기준은 **공간** — 누산기 하나, 그 밖에는 없음 — 이고, 어떤 실행 제한도 상수 공간 답을 테이블과 구별하지 못하기 때문입니다. 그것은 당신의 양심에, 그리고 물어볼 면접관에게 달려 있습니다.
'''
hints = [
  "쌍은 어떤 순서로 오든 서로 상쇄되므로 bit.bxor로 리스트를 한 번 fold하면 충분합니다.",
  "가장 낮은 비트를 매번 끄며 세는 것 — walk = bit.band(walk, walk - 1) — 은 비트 폭이 아니라 켜진 비트 수만큼만 돕니다.",
  "2의 거듭제곱은 켜진 비트가 정확히 하나이므로 가장 낮은 것을 끄면 0이 남습니다 — 그리고 0 자체는 손으로 제외해야 합니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.hacker.21.matrix"
title = "평면도를 돌려라"
story = "등불 장터의 도면이 거꾸로 놓여 있고, 테이블 위에는 두 번째 사본을 놓을 자리가 없다."
brief = '''
첫 줄은 `n`입니다. 다음 `n`줄은 `n × n` 정수 격자입니다.

격자를 **시계 방향으로 90°** 돌려서 공백으로 구분한 값 `n`줄로 출력하세요. 그다음 그 값들을 **나선 순서** — 바깥 고리를 왼쪽 위에서 시계 방향으로, 안쪽으로 — 로 한 줄에 출력하세요.

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

회전은 제자리에서 할 것입니다: 전치하고, 각 행을 뒤집으세요. 그것을 소리 내어 이름 대는 것이 문제의 절반입니다. Lua의 다중 대입이 교환입니다 — `grid[r][c], grid[c][r] = grid[c][r], grid[r][c]` — 임시 변수 없이. 무엇이든 저장하기 전에 오른쪽 전체가 평가되기 때문입니다. 여기에는 `zip(*grid)` 한 줄짜리도, 행을 대신 뒤집어 줄 것도 없습니다. 둘 다 루프이고, 각각이 왜 동작하는지 말할 수 있어야 합니다.

나선은 **원래** 격자를 원하고, 테이블은 참조입니다: `copy = grid`는 테이블 하나에 이름 둘이고, `{unpack(grid)}`는 바깥 테이블을 복사하면서 모든 행을 공유합니다. 행을 하나씩 복사하세요.
'''
hints = [
  "전치는 대각선 위쪽만 교환하세요 — c를 r + 1에서 시작 — 아니면 전부 다시 되돌려 놓게 됩니다. 다중 대입은 임시 변수 없이 교환합니다.",
  "나선은 원래 격자를 원하므로, 제자리에서 돌리기 전에 행 단위로 복사하세요: 테이블은 참조이고, `copy = grid`는 아무것도 복사하지 않습니다.",
  "나선 루프 안의 `if` 가드 둘이 가운데 행이나 열 하나가 두 번 훑히는 것을 막는 것입니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.hacker.22.trie"
title = "접두사 상자"
story = "트램 정류장 안내판용 자동 완성 — 정직한 종류, 실제로 목록에 있는 것만 완성하는."
brief = '''
첫 줄은 `n q`입니다. 다음 `n`줄은 삽입할 소문자 단어입니다. 다음 `q`줄은 질의이고, 각각 `WORD <s>` 또는 `PREFIX <s>`입니다.

트라이 — 각 노드가 글자에서 자식으로 가는 맵을 가진 노드들의 트리 — 를 만들고 답하세요:

* `WORD <s>` → `s`가 삽입되었으면 `YES`, 아니면 `NO`
* `PREFIX <s>` → 삽입된 `n`개 단어 중 `s`로 시작하는 것이 몇 개인지

`n`개 단어가 서로 다르다는 약속은 없고, `PREFIX`는 서로 다른 단어가 아니라 **삽입**을 셉니다: `tram`을 두 번 삽입하면 `PREFIX tram`은 `2`입니다. `NODES`는 노드를 세므로 두 번째 삽입은 아무것도 더하지 않습니다.

그다음 루트를 포함한 트라이의 노드 수 `NODES <k>`를 출력하세요.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

모든 노드에 삽입된 단어 몇 개가 그것을 지나가는지 세어 두면, `PREFIX`는 끝에서 세는 일 없는 걷기입니다. 노드는 테이블 — `{ children = {}, through = 0, terminal = false }` — 이고, `children`은 한 글자 문자열을 키로 하는 테이블입니다. 26칸 배열은 C의 답이고 테이블은 Lua의 답이니까요. 없는 자식은 `nil`이고, `nil`은 삽입할 때는 새로 만들라는, 조회할 때는 멈추라는 신호입니다. 단어의 글자는 `word:gmatch(".")`에서 하나씩 나옵니다.
'''
hints = [
  "없는 자식에 대해 children[letter]는 nil이고, nil은 삽입할 때는 새로 만들라는, 조회할 때는 멈추라는 신호입니다.",
  "`through`는 *올라서는* 노드에서 올리므로 루트는 결코 자기 자신을 세지 않습니다.",
  "트라이에서 떨어지는 질의는 `at`을 nil로 남기고, nil은 NO와 0으로 답합니다 — 하지만 필드를 읽기 전에 `at ~= nil`을 검사할 때만입니다. `nil.terminal`은 런타임 에러입니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.hacker.23.prefix-sums"
title = "목표를 맞히는 방법은 몇 가지"
story = "한 시간 단위로 적힌 하룻밤의 매출과 위원회 감사관이 보고 싶어 하는 숫자 하나. 연속된 시간들의 합이 정확히 그 숫자가 되는 구간은 몇 개인가."
brief = '''
첫 줄은 `n k`입니다. 둘째 줄은 음수일 수 있는 정수 `n`개입니다.

합이 정확히 `k`인 연속 구간이 몇 개인지 출력하고, 그다음 `RANGE <s>`를 출력하세요. 리스트 전체의 합이고, 다시 더하지 말고 마지막 접두사 합에서 읽은 것입니다.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

음수 값은 슬라이딩 윈도를 죽입니다 — 너무 큰 창을 줄여서 고칠 수 없습니다. 살아남는 것은 접두사 합입니다: 구간 `i..j`의 합이 `k`인 것은 정확히 `prefix[j] - prefix[i] == k`일 때이므로, `prefix[j] - k`와 같은 이전 접두사가 몇 개인지 세세요. 처음부터 시작하는 구간을 위해 테이블에 `[0] = 1`로 씨를 뿌리세요.

한 번도 쓰지 않은 개수는 `nil`이고, `nil + 1`은 `1`이 아니라 에러입니다. `(seen[key] or 0) + 1`이 "없으면 0"의 Lua 표현입니다 — 그 `or`가 `defaultdict`입니다.

여기의 네 케이스는 많아야 숫자 다섯 개이고, 시계는 거기서 속도를 재지 않습니다: 모든 시작과 모든 끝에 대한 `O(n²)` 이중 루프도 넷 모두 통과합니다. 기준은 진짜입니다 — 하룻밤의 매출에서 그 이중 루프는 몇 분입니다 — 그리고 이 케이스들이 검사하는 것은 그것이 아닙니다. 검사하는 것은 틀리기 쉬운 부분입니다: `[0] = 1` 씨, 그리고 기록하기 전에 찾기.
'''
hints = [
  "현재 접두사를 기록하기 *전에* 이전 접두사를 찾으세요. 아니면 k가 0일 때 길이 0인 구간이 자기 자신을 셉니다.",
  "처음에 seen = { [0] = 1 }을 해 두는 것이 인덱스 1에서 시작하는 구간을 찾을 수 있게 하는 것입니다.",
  "마지막 접두사가 합계이므로 둘째 줄은 추가 비용이 없습니다. (seen[key] or 0)이 없는 개수를 0으로 읽는 방법입니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.hacker.24.inversions"
title = "시계에 걸리는 것"
story = "저녁 라운드의 첫 문제. 순진한 답은 맞고, 그리고 그것은 틀린 답이다."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에는 배열이 없습니다 — 당신이 만듭니다. **정확히** 이 생성기로, 넘치면 감기는 64비트 산술로:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

**반전**을 세세요: `a[i] > a[j]`인 쌍 `i < j`. 개수를 출력하고, 그다음 `MAX <largest value>`를 출력하세요.

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1`에 대한 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`입니다.

**이 퀘스트는 복잡도를 강제하고, 그럴 수 있는 것은 이런 종류뿐입니다.** 숨은 케이스 하나는 `n = 200000`입니다. `O(n²)` 이중 루프 — 스타터가 그것입니다 — 는 `2 × 10^10`번의 비교이고, 이 기계에서 10초 실행 제한에 대해 **25초** 뒤에도 끝나지 않았습니다. 병합 정렬 중에 반전을 세는 것은 `O(n log n)`이고 수백분의 몇 초에 끝납니다. 이 기계에서, 이 두 프로그램으로 잰 것입니다.

이 언어가 다르게 정하는 것이 둘 있습니다. 생성기는 LuaJIT의 64비트 정수 — `0ULL + seed`, 그리고 끝에 `ULL`이 붙은 상수 — 로 돕니다. 평범한 숫자는 double이라서 곱이 낮은 비트를 잃을 것이기 때문입니다. `tonumber(bit.rshift(x, 33))`이 각 뽑기를 숫자로 되돌립니다. 그리고 답 `9990744366`은 `2^32`를 넘지만 `2^53`보다 훨씬 작으므로 double이 정확히 담고 `print`가 모든 자릿수를 보여 줍니다. 그것이 *왜* 안전한지, 그리고 어디서 안전하지 않게 되는지 말하는 것이 답의 일부입니다.
'''
hints = [
  "최댓값은 생성하면서, 또는 정렬하기 전에 원래 테이블에서 구하세요 — 이 병합 정렬은 제자리에서 동작합니다.",
  "병합에서 오른쪽 값이 이기면 왼쪽 절반의 남은 원소 전부가 그것보다 큽니다 — 그것이 한 번에 `mid - i + 1`개의 반전이고, 요령의 전부입니다.",
  "재귀는 log2(200000), 약 열여덟 프레임 깊이입니다 — LuaJIT의 한계 근처에도 가지 않습니다. 압축된 값 위의 펜윅 트리가 다른 O(n log n) 답이고 면접실에서 이름을 댈 만합니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.hacker.25.test-cases"
title = "T개의 테스트 케이스가 따른다"
story = "모든 스크리닝이 쓰는 모양이고, 모든 지원자가 적어도 한 번은 쓰는 버그: 두 번째 케이스가 첫 번째를 기억한다. 용의 둘째 밤이 첫째 밤의 향을 기억하듯이."
brief = '''
첫 줄은 독립적인 테스트 케이스의 수 `T`입니다. 각 케이스는 `n`이 있는 줄, 그다음 정수 `n`개가 있는 줄입니다 — 그리고 `n`이 `0`이면 그 둘째 줄은 비어 있습니다.

각 케이스에 대해 **두 번째로 큰 서로 다른** 값을, 서로 다른 값이 둘보다 적으면 `NONE`을 출력하세요. 모두 끝난 뒤 `CASES <T>`를 출력하세요.

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

이것은 표준 경쟁 스크리닝 래퍼이고, 한 가지 이유로 지원자를 떨어뜨립니다: 케이스마다여야 했던 상태가 루프 앞에서 선언된 것. 모든 누산기, 모든 집합, 모든 `best`는 `for` **안에** 들어갑니다 — 루프 본문 안에서 선언된 `local`은 매 차례 새 변수입니다.

줄이 아니라 공백 토큰 단위로 읽으면, `n = 0`의 빈 줄은 더 이상 특별한 경우가 아닙니다 — 그것이 이 모양이 가르치는 두 번째 것입니다. 집합은 값을 키로 하는 테이블입니다. 순위를 매기려면 `pairs`로 키를 시퀀스에 복사해 `table.sort`하세요. `pairs`에는 순서가 없고, 두 번째로 큰 것은 순서에 관한 질문이니까요.
'''
hints = [
  "`local distinct = {}`를 루프 안으로 옮기세요. 그것이 고칠 것의 전부이고, 퀘스트의 전부입니다.",
  "값을 키로 하는 테이블이 중복을 없애고, pairs가 키를 특별한 순서 없이 꺼내며, table.sort가 순서를 매기므로, ranked[#ranked - 1]이 두 번째로 큰 서로 다른 값입니다.",
  "원소가 하나인 시퀀스에서 ranked[#ranked - 1]은 ranked[0]이고, 그것은 에러를 내지 않고 nil이며 `nil`로 출력됩니다 — 그래서 길이 검사가 먼저 오고, 그래서 없는 키는 따라가기 전까지는 에러가 아닙니다.",
]

