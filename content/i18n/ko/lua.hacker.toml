[[quest]]
id    = "lua.hacker.34.stable-sort"
title = "동점은 자리를 지킨다"
story = "심부름꾼 둘이 용의 행렬 코스를 같은 점수로 끝냈는데, 리더보드는 다시 그릴 때마다 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 라이더 `n`명을 만드세요. 라이더 `i`는 인덱스 `i`와 점수를 가지며, 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

라이더를 점수 **내림차순**으로 정렬하세요. 점수가 같은 라이더는 들어온 순서를 지켜야 합니다. 인덱스를 공백으로 구분해 출력하고, 그다음 `TIES <k>` — 정렬된 순서에서 점수가 같은 인접 쌍이 몇 개인지 — 를 출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 모든 것이 동점이고, 답은 거의 전적으로 동점에 무슨 일이 일어나느냐로 정해집니다.

**이것은 손에 든 정렬이 어떤 것인지 아는 것에 관한 퀘스트입니다.** `table.sort`는 **안정 정렬이 아닙니다**. 퀵정렬이고, 같다고 비교되는 원소들의 순서에 대해 아무것도 약속하지 않으며, 그 약속하지 않음을 지킵니다: 예시에서 평범한 `a.score > b.score`로 정렬하면 동점은 `5 1 6 0 4 3 2 7`로 나옵니다 — 스타터가 하는 일이 그것입니다. 아무것도 던지지 않습니다. 답은 이 입력에서 그냥 다른 답이고, 진짜 입력에서는 언제나 그럴 겁니다.

여기에는 맞는 답이 하나 있고, 그것은 모든 언어에서 기본으로 손을 뻗어야 할 답입니다: 비교를 **전순서**로 만드세요. `(-score, index)`로 정렬하세요 — 점수 내림차순, 그다음 인덱스 오름차순 — 그러면 두 라이더가 같다고 비교되는 일이 결코 없고 안정성은 더 이상 질문이 아닙니다. 전순서에는 증명할 것이 없습니다. (Python 면접이 받아 주는 다른 답, "정렬은 안정적이니 그것에 기대라"는 이 방에서는 쓸 수 없고, 그것을 아는 것이 요점입니다.)

시계는 여기서 속도를 재지 않고, 잴 것도 없습니다: 어떤 비교자를 건네든 `table.sort`는 `table.sort`입니다. 이 네 케이스는 전적으로 동점에 무슨 일이 일어나느냐로 정해집니다.
'''
hints = [
  "비교자에 두 번째 절반을 더하세요: 점수가 같으면 a.index < b.index를 돌려주세요. 그것이 수정의 전부입니다.",
  "`<=`라고 말하거나 양쪽으로 true를 돌려주는 비교자는 절대 쓰지 마세요 — `invalid order function for sorting`은 table.sort가 그 순서가 순서가 아니라고 말하는 것입니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 수는 어떤 비교자를 썼든 같습니다 — 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.hacker.28.lru"
title = "달"
story = "7-32호실, 마지막 문제, 여덟 번째. 면접관이 모니터를 끄고, 화이트보드를 비추는 유일한 빛은 창밖의 달이다: 모든 자료 구조에 테이블 타입 하나, 그리고 시계."
brief = '''
첫 줄은 `cap q`이고, 그다음 연산 `q`줄이 오며, 각각 `PUT <key> <value>` 또는 `GET <key>`입니다 — 또는, 첫 줄에 **세 번째** 숫자 `seed`가 있으면 더 이상의 줄은 없고, `q`개 연산은 아래의 생성기에서 나옵니다.

가득 차면 **가장 오래전에 사용된** 항목을 내보내는 고정 용량 캐시를 구현하세요. `GET`과 `PUT` 모두 키를 사용한 것으로 칩니다. 캐시에 이미 있는 키의 `PUT`은 값을 교체하고 그것을 가장 최근 것으로 만듭니다 — 항목을 더하지 않으므로, 캐시가 아무리 가득 차 있어도 아무것도 내보내지 않습니다.

`GET`마다 값을, 없으면 `-1`을 출력하세요. 끝에서 살아남은 키를 가장 최근에 사용한 것부터 공백으로 구분해 출력하고 — 캐시가 비어 있으면 `-` — 그다음 `EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만드므로, `PUT 3`에 자리가 필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은 맞고 `3`을 가장 최근 것으로 만들며, 그래서 생존자가 `3 1`로 출력됩니다.

생성되는 형태, 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**스타터는 틀렸고, 예시가 그것을 보여 줍니다.** 스타터는 캐시를 테이블 둘에 둡니다 — 값을 위한 `cache[key]`와, 가장 오래된 것부터 키를 담은 시퀀스 `order` — 그리고 `order[1]`을 내보냅니다. 새 키의 `PUT`은 `order`에 덧붙입니다. `GET`은 `cache[key]`를 읽고 그 밖에는 아무것도 하지 않습니다. 테이블을 읽는 것은 그 안의 아무것도 움직이지 않기 때문입니다: 테이블은 키에 무엇이 있는지 기억하지, 마지막으로 언제 봤는지는 기억하지 않습니다. 그래서 캐시는 **가장 오래전에 사용된** 키가 아니라 **처음** 들어온 키를 내보내고, 예시에서 `GET 2`가 `20`을 출력합니다.

그것이 보스입니다. 이 랜드의 모든 것은 테이블이고, 테이블에는 읽혔다는 기억이 없습니다. 최근성은 당신이 *써야* 하는 것입니다 — 삽입할 때만이 아니라 맞을 때마다, 덮어쓸 때마다 — 그리고 그 쓰기를 `O(1)`로 만드는 구조는 교과서의 그것입니다: 이중 연결 리스트로 들어가는 해시 테이블. 포인터를 숨겨 둔 `OrderedDict`는 없습니다. 여기서 포인터는 필드입니다: 노드는 `{ key = k, value = v, prev = p, next = n }`이고, `nodes[key]`가 그것을 찾으며, 떼어 내서 뜨거운 끝에 다시 잇는 것은 대입 넷이고, 차가운 끝은 `head.next`입니다. 양 끝의 센티널 테이블 둘 덕분에 리스트 코드 어디에도 `nil` 검사가 없습니다. 모든 연산이 `O(1)`이고, 얼버무리지 않고 그렇다고 말할 수 있습니다.

스타터의 `table.remove(order, 1)`은 틀린 데다 `O(cap)`이기까지 하고, 그 `order`가 단서입니다: 시퀀스는 누가 먼저 왔는지 말할 수 있지만, 건드릴 때마다 키를 끝으로 옮기는 것은 탐색과 이동이며, 연결 리스트는 "상수 시간에 끝으로 옮기기"를 직접 만들었을 때의 모습입니다.

