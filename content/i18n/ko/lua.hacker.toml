[[quest]]
id    = "lua.hacker.27.commands"
title = "입력이 문제다"
story = "향 노점의 계산대 로그가 80열에서 줄 바꿈된 채 기계에서 나오고, 맨 위의 숫자는 단어가 아니라 명령의 수다."
brief = '''
첫 줄은 뒤따르는 **명령**의 수 `k`입니다. 명령은 나머지 줄들에 우연히 감긴 대로 채워진 공백 구분 토큰입니다 — 줄마다 몇 개든, 간격이 얼마든, 끝에 빈 줄이 있을 수도 있습니다.

| 명령 | 토큰 | 효과 |
| --- | --- | --- |
| `ADD <cents>` | 둘 | 품목 하나를 push |
| `VOID` | 하나 | 마지막 품목을 제거, 없으면 아무것도 안 함 |
| `TOTAL` | 하나 | 현재 합계를 출력 |
| `CLEAR` | 하나 | 전부 제거 |

`k`개의 명령 뒤에 `COMMANDS <k>`와 `ITEMS <how many are left>`를 출력하세요.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k`는 명령을 세고, `ADD`는 토큰 둘로 된 명령 하나입니다 — 그래서 `k`번 돌며 차례마다 토큰 하나를 읽는 루프는 엉뚱한 곳에서 멈춥니다. 명령을 `k`개 읽고, 명령에 인자가 있을 때만 인자를 꺼내세요 — 그리고 "내가 달라고 할 때 다음 토큰을 꺼내 주기"의 도구는 `gmatch`가 돌려주는 **이터레이터**입니다: `local next_token = input:gmatch("%S+")`, 그리고 `next_token()`마다 토큰이 하나 더, 입력이 다하면 `nil`이므로, 입력의 끝은 에러가 아니라 값입니다.

빈 계산대에서의 `VOID`와 아무것도 더하기 전의 `TOTAL` 둘 다 동작해야 합니다. 문제에는 그런 일이 일어날 수 없다는 줄이 없고, 진짜 스크리닝에서는 그 침묵이 명세입니다. 빈 테이블에서 `items[#items] = nil`은 `items[0] = nil`을 쓰는데, 그것은 아무것도 하지 않습니다 — 다른 언어가 던지는 곳에서 Lua는 너그럽습니다 — 그리고 그것이 그렇다는 것을 알고 말하는 것이 물어볼 때의 답입니다.
'''
hints = [
  "gmatch(\"%S+\")는 공백, 탭, 줄 바꿈의 모든 연속에서 나누므로, 줄 단위로 읽기를 그만두는 순간 파일의 줄 바꿈은 상관없어집니다.",
  "ADD의 인자는 ADD 갈래 안에서, 같은 이터레이터에서 꺼내세요. 루프 카운터는 토큰이 아니라 명령을 셉니다.",
  "`if #items > 0 then items[#items] = nil end`가 가드가 붙은 pop입니다 — Lua에서 가드는 공짜이고, 그래도 쓰는 것은 그 경우를 봤다는 말입니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 클리어한 모든 지도는 정류장 수를 셌다. 트램은 정류장이 몇 개인지 신경 쓰지 않는다. 얼마나 걸리는지를 신경 쓴다 — 그리고 오늘 밤 타이항의 모든 골목은 더 오래 걸린다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 방향 없는 가중치 간선 `m`개. 그래프는 직접 만드세요. **정확히** 이 생성기로, 넘치면 감기는 64비트 산술로(노드 16에서처럼 `0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 도달 가능한 모든 정류장(`0`인 `0` 자신 포함)까지의 최단 거리 합을 출력하고, 그다음 `MAX <the largest of them>`을 출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 100000`, `m = 200000`입니다. 어느 쪽이든 다익스트라가 맞는 알고리즘입니다. 시계가 정하는 것은 우선순위 큐입니다. 스타터는 방문하지 않은 정류장을 집합 — 정류장을 키로 하는 테이블 — 에 두고 `pairs`로 집합을 걸어 가장 가까운 것을 찾는데, 그것은 단계당 `O(V)`, 전체 `O(V²)`입니다: 이 기계에서 10초 실행 제한에 대해 **32초**. 이진 힙은 그것을 `O((V + E) log V)`로 만들고 약 6분의 1초에 끝납니다. 둘 다 이 기계에서, 이 퀘스트에 들어 있는 두 프로그램으로 잰 것입니다.

분명히 봐 둘 가치가 있습니다. 시간 제한 스크리닝에서 떨어지는 가장 흔한 방식이니까요: **스타터는 틀리지 않았습니다.** 정확히 맞는 답을 출력합니다. 너무 늦게 도착한다는 이유만으로 거부됩니다.

여기에는 `heapq`가 없습니다: 힙은 노드 12에서 건네받은 그것이고, `{ distance, stop }` 항목을 담아 거리로 비교하며, 이번에는 당신이 씁니다. decrease-key가 없고, 필요하지도 않습니다: 개선된 거리를 새 항목으로 push하고, pop한 항목 중 거리가 이미 기록된 것보다 나쁜 것은 건너뛰세요. 그 "오래된 항목" 건너뛰기가 사람들이 잊는 줄이고, 그것이 없으면 힙이 끝없이 커집니다. `math.huge`가 정직한 `unreached`입니다: 모든 숫자보다 크게 비교되고 완화 단계에서 `nil` 검사가 필요 없습니다.
'''
hints = [
  "첫 필드를 키로 하는 최소 힙에 { distance, stop } 항목: 노드 12의 힙에서 `less`를 [1] 비교로 줄인 것.",
  "거리가 dist[u]보다 큰 항목을 건너뛰는 것이 오래된 항목 건너뛰기입니다. 없어도 알고리즘은 여전히 맞지만 힙이 폐기된 항목으로 채워집니다.",
  "math.huge가 정직한 `unreached`입니다: 모든 숫자보다 크게 비교되고 완화 단계에서 nil 검사가 필요 없습니다. 생성기의 신장 트리 절반이 모든 정류장의 도달 가능성을 보장하므로 마지막 걸러 내기는 실제로 아무것도 빼지 않습니다 — 그래도 두세요. 도달 불가능한 정류장이 있는 버전의 이 질문이 후속 질문이니까요.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "공원의 모든 노점에 걸친 하룻밤의 계산대 작업 삼십만 건, 그중 절반은 정정, 그리고 누군가는 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만든 다음 연산 `q`개를 실행하세요. 모두 같은 생성기에서, 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**여기서는 복잡도가 강제됩니다.** 큰 숨은 케이스는 `n = 500000, q = 300000`입니다. 스타터는 노드 23의 답입니다: 접두사 합 테이블로, 모든 질의를 `O(1)`로 만듭니다 — 그리고 모든 갱신이 그것을 깨뜨리므로 스타터는 그것을 다시 만듭니다. 갱신당 `O(n)`, 십오만 번. 이 기계에서 그것은 10초 실행 제한에 대해 **57초**가 걸렸습니다. (대신 평범한 루프로 범위를 합하는 것도 종류로는 나을 것이 없고 실제로도 조금 나을 뿐입니다: 갱신당이 아니라 *질의*당 `O(n)`이고, 여기서 약 14초가 걸렸습니다.) 펜윅 트리는 전체를 수백분의 몇 초에 합니다. 모두 이 퀘스트의 프로그램들로 잰 것입니다.

(이 퀘스트의 Rust와 Go 버전은 연산 사백만 개를 돌립니다. 이 랜드는 Python의 삼십만을 유지하는데, 케이스가 기준 구현의 것이기 때문입니다 — 그리고 요점은 한 런타임을 다른 런타임과가 아니라 맞는 구조를 틀린 구조와 가르는 것입니다.)

교훈은 면접관이 낚으려는 바로 그것입니다: *점 갱신, 범위 합*은 펜윅 트리가 존재하는 이유인 정확한 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두 prefix의 차이인 range — 그리고 `bit.band(i, -i)`가 가장 낮은 켜진 비트만큼 걷는 방법입니다: `bit` 라이브러리는 `-i`를 2의 보수 32비트 정수로 다루고, 그것이 그 요령을 동작하게 합니다.

누적 합계는 `10^13`을 넘습니다. Lua의 숫자는 `2^53`까지의 모든 정수를 정확히 담고, `print`는 그 열네 자리를 모두 보여 줍니다. 그것이 당신이 가진 여유이고, 그것을 아는 것이 답의 일부입니다.
'''
hints = [
  "초기 값마다 add를 한 번씩 호출해서 트리를 만드세요. O(n) 상향식 구축은 멋진 최적화이지만 시계가 검사하는 것은 아닙니다.",
  "bit.band(i, -i)가 가장 낮은 켜진 비트를 뽑아냅니다 — bit 라이브러리는 -i를 2의 보수로 봅니다. 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "range(l, r)는 prefix(r + 1) - prefix(l)이고, 그 하나 차이 한 쌍을 맞히는 것이 디버깅의 대부분입니다. bit.band를 지역 변수에 묶는 것이 이 퀘스트에 필요한 유일한 미세 최적화이고, LuaJIT에는 그것조차 거의 필요 없습니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.hacker.31.palindrome"
title = "거꾸로 해도 같은"
story = "상위 스무 개 안의 문제, 대부분의 스크리닝에서 어떤 형태로든 나오고, 대부분 한 번 써 봤지만 끝내 이해하지 못한 그 문제. 용은 꼬리부터 읽어도 같다고 면접관이 말하고, 웃지 않는다."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열은 직접 만드세요. 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

가장 긴 회문 부분 문자열의 길이를 출력하고, 그다음 `AT <index>` — 그 길이 중 **가장 왼쪽** 것의 0부터 세는 시작 위치 — 를 출력하세요.

```
input:  12 3 5
output: 5
        AT 1
```

각 중심에서 확장하세요. 중심은 `n`개가 아니라 `2n - 1`개입니다: 모든 글자는 홀수 길이 회문의 중심이고, 두 글자 사이의 모든 틈은 짝수 길이 회문의 중심입니다. 틈을 잊는 것이 맞아 보이는 풀이가 `abba`에서 `1`을 돌려주는 이유이고 — 스타터가 하는 일이 그것입니다.

문자열을 문자열로 가질 필요는 전혀 없습니다. 뽑은 값을 작은 숫자의 테이블 — `s[i] = next() % alphabet` — 에 두고 숫자를 비교하세요. 한 글자 문자열 이만 개에 `..`를 쓰면 먼저 문자열 이만 개를 만듭니다. 테이블은 1부터 세고 문제의 `AT`는 0부터 세므로, 출력하는 인덱스는 찾은 인덱스보다 하나 작습니다.

**테스트가 강제하는 것과 강제하지 않는 것**, 솔직하게. 일을 하는 숨은 케이스는 **한** 글자 알파벳 위의 `n = 8000`입니다. 그것은 중심 확장의 최악의 경우입니다 — 모든 중심이 문자열 끝까지 달립니다 — 그래서 맞는 답은 거기서 `O(n²)`을 온전히 합니다. 비교 삼천이백만 번이고, LuaJIT는 그것을 수백분의 몇 초에 합니다. 그것은 또한 모든 부분 문자열을 확인해 하나하나 검사하기를 거부하는데, 그것은 삼차 — 여기서 대략 `10^11`번의 비교 — 이고 10초 제한을 한참 벗어납니다.

다른 큰 케이스, 두 글자 알파벳 위의 `n = 20000`은 속도가 아니라 **정확성** 케이스입니다: 무작위 이진 문자열에서 회문 검사는 한두 글자 뒤에 실패합니다. 그것은 당신의 생성기와 가장 왼쪽 인덱스 동점 처리가 큰 규모에서 우리 것과 일치하는지 검사합니다.

그러니까: 테스트는 삼차를 거부하고 이차를 받아들입니다. `O(n)` 답인 마나커 알고리즘은 요구하지 **않습니다**. 그것이 있다는 것과 무엇을 하는지는 알아 두세요. "그리고 이차보다 잘할 수 있나요?"가 이 질문이 보통 준비하는 후속 질문이니까요.
'''
hints = [
  "중심마다 확장 둘: 홀수 길이는 (c, c), 짝수 길이는 (c, c + 1). 스타터에는 두 번째가 빠져 있습니다.",
  "루프가 멈추면 i와 j 모두 회문에서 한 칸씩 벗어나 있습니다 — 그래서 길이는 j - i - 1이고, 1부터 세는 테이블에서 i는 이미 0부터 센 시작입니다.",
  "엄격히 더 긴 회문에서만 갱신하면, 각 길이에서 가장 왼쪽 것이 남고, 그것이 AT가 묻는 것입니다. s[0]은 감겨 돌아온 글자가 아니라 nil이고, nil == s[j]는 그냥 거짓입니다 — 그래도 `i >= 1` 검사가 쓰기에 정직한 것입니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "lua.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구가 문제 맨 아래에 나타나고, 방의 절반은 그것이 무엇을 하라는 것인지 모른다. 이 방에서는 한 가지를 더 요구한다: 쉰세 비트를 담는 숫자를, 두 번 곱하기."
brief = '''
표준 입력은 `n q seed`입니다. 질의 `q`개를 생성하세요. 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

각 질의에 대해 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요. `q`개 답 전부의 합을, 그것도 `1000000007`로 나눈 나머지로 출력하고, 그다음 `LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이고, Lua의 어떤 것도 그것을 담지 못합니다. 모든 곱셈은 하는 대로 줄입니다. 문제는 나눗셈입니다: `a! / (b! (a-b)!)`은 모듈러 산술에서 아무 의미가 없습니다. 그것을 대신하는 것이 **모듈러 역원**이고, `1000000007`이 소수이므로 페르마의 소정리가 그것을 줍니다: 반복 제곱으로 `inverse(v) = v^(p-2) mod p` — 여기서 `^`는 부동소수점 거듭제곱이라 그것을 할 수 없으므로, 루프는 당신 몫입니다.

그러니까: `factorial[0..n]`을 한 번 미리 계산하고, 각 질의에 `f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**그리고 이 언어에서는 곱셈 자체가 함정입니다.** 두 나머지는 각각 `2^30` 미만이고, 그 곱은 `2^60` 미만인데, Lua의 숫자는 `2^53`을 담는 double입니다. 그 지점을 넘으면 `(a * b) % P`는 틀립니다 — 에러도, 오버플로도 아니고, 그냥 낮은 비트가 사라지고 나머지가 조금 어긋납니다. 정직한 `mulmod`는 한 인수를 16비트 높은 절반과 낮은 절반으로 나눠 각 부분 곱이 `2^46` 미만에 머물게 하고, 절반 사이에서 줄입니다. 다섯 줄이고 스타터에 들어 있습니다. 이 노드의 모든 곱은 그것을 거칩니다.

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 200000`, `q = 200000`입니다. 각 계수를 독립적으로 계산하는 것 — 항 `b`개를 곱하고, 항 `b`개로 나누고, 각각 모듈러 역원 하나 — 은 10초 실행 제한에 대해 **25초** 뒤에도 끝나지 않았습니다. 그것이 스타터입니다. 공유된 팩토리얼 테이블 하나에, `powmod` 한 번에서 거꾸로 미리 계산한 역팩토리얼을 더하면 모든 질의에 `mulmod` 두 번으로 답하고 수백분의 몇 초에 끝납니다. 둘 다 이 기계에서 잰 것입니다.
'''
hints = [
  "곱셈마다 줄이고, 곱셈은 mulmod를 통해서만 하세요: 두 나머지의 맨 a * b는 2^53을 넘어서 조용히 틀립니다.",
  "powmod(v, P - 2)가 모듈러 역원이고, P가 소수이기 때문에만 동작합니다 — 그것이 여기서 페르마의 소정리가 말하는 내용 전부입니다.",
  "역팩토리얼도 powmod(factorial[n], P - 2)에서 거꾸로 미리 계산하세요: inv_factorial[i - 1] = inv_factorial[i] * i. 그러면 질의는 mulmod 두 번이고 powmod는 전혀 없습니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "lua.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "용 때문에 골목 셋이 막힌 타이항의 격자. 건너가는 방법은 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자는 직접 만드세요. 행 우선 순서로, 칸마다 값을 **둘** 뽑아서, 넘치면 감기는 64비트 산술로(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

열린 칸으로 **오른쪽** 또는 **아래**로만 움직이세요. 출력하세요:

1. `PATHS <k>` — `(0,0)`에서 `(r-1,c-1)`까지의 서로 다른 경로가 몇 개인지, `1000000007`로 나눈 나머지
2. `MIN <cost>` — 양 끝점을 포함한 경로의 가장 작은 총비용, 경로가 없으면 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

행 우선 순서로 한 번 지나가면 둘 다 됩니다: 칸의 경로 수는 위와 왼쪽에서 들어오는 경로 수의 합이고, 최선 비용은 자기 비용에 그 둘 중 싼 쪽을 더한 것입니다. 오른쪽이나 아래로만 움직이므로 필요한 두 칸은 언제나 이미 끝나 있습니다 — 그래서 재귀도 방문 집합도 필요 없습니다. 메모이제이션한 재귀도 칸 수에 선형이겠지만, `1000 × 1000` 케이스에서는 이천 프레임 깊이이기도 할 겁니다 — 공교롭게도 LuaJIT의 한계 아래이지만, 여기서 답이 루프인 것은 늘 그렇듯 문제의 모양이 순서대로 채우는 표이기 때문입니다.

`PATHS` 개수는 늘 그런 이유로 `1000000007`로 나눈 나머지를 취합니다: `1000 × 1000` 숨은 케이스에서 참값은 육백 자리가 넘고, double이라면 훨씬 전에 그것을 `inf`로 만들었을 겁니다. 더하면서 줄이세요 — 두 나머지를 더해도 `2^31` 미만이므로, 이 길에서 평범한 `+`와 `%`로 충분한 곳은 여기 하나입니다.

도달할 수 없는 칸에는 최선 비용이 **없습니다**: `nil`이고, `nil`은 무엇을 더하거나 비교하기 전에 `~= nil`로 검사합니다. `1000 × 1000` 테이블의 테이블은 항목 백만 개이고 LuaJIT는 개의치 않습니다.

**큰 케이스가 강제하는 것:** 경로를 열거하는 모든 답을 거부합니다. 경로는 공원의 등불보다 많습니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에 값을 둘 뽑으세요 — 생성기는 그 칸들을 건너뛰지 않고, 막기를 거부할 뿐입니다.",
  "위나 왼쪽에 열린 이웃이 없는 열린 칸은 경로 0개로 도달되고 최선 비용이 없습니다. nil이 정직한 `unreachable`이고, `~= nil`이 비교하거나 더하기 전의 가드입니다.",
  "목적지가 열려 있어도 도달 불가능할 수 있고, 그것이 정확히 PATHS가 0이고 MIN이 -1인 경우입니다. 숨은 케이스 중 하나가 그것입니다.",
]

