[[quest]]
id    = "lua.hacker.12.heap"
title = "정렬된 줄 k개"
story = "용이 지나가는 모든 골목이 등불 번호를 이미 순서대로 보낸다. 전부를 다시 정렬하지 않고 한 줄로 합쳐라."
brief = '''
첫 줄은 `k`입니다. 그다음 `k`줄이고, 각 줄은 개수 하나 뒤에 이미 오름차순으로 정렬된 그만큼의 정수입니다.

전부를 오름차순 한 줄로 병합해 공백으로 구분해 출력하고, 그다음 `POPS <total count>`를 출력하세요.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

Lua에는 `heapq`가 없습니다. 이진 최소 힙은 테이블 하나와 함수 둘입니다 — `push`는 새 마지막 원소를 위로 올리고, `pop`은 마지막 원소를 맨 위로 옮겨 아래로 내립니다 — 그리고 스타터에 하나가 들어 있습니다. 각각 열다섯 줄짜리 함수 둘이므로, 여기서 문제는 힙이 아니라 루프입니다. 한 번 읽어 두세요. 이 길 더 가서 직접 쓰게 됩니다.

항목은 `{ value, which list, how far into it }`이고, 힙은 항목을 먼저 `value`로, 같으면 리스트 인덱스로 정렬합니다 — 그것으로 괜찮습니다. *어떤* 순서이기만 하면 되니까요. 그리고 그것은 **전순서**여야 합니다. 힙의 비교는 당신이 쓰는 것이고, 양쪽으로 "같다"고 말하는 비교는 Lua가 보고해 주는 실수가 아니기 때문입니다.

힙은 원소마다가 아니라 리스트마다 항목 하나를 담으므로, 리스트가 아무리 길어도 크기 `k`를 유지합니다.

여기의 네 케이스는 리스트 두세 개에 걸친 숫자 몇 개이고, 시계는 거기서 속도를 재지 않습니다: 전부를 테이블 하나에 붓고 `table.sort`해도 넷 모두 통과하고, 단계마다 `k`개의 머리를 전부 다시 훑어도 마찬가지입니다. 힙은 `k`가 클 때 `O(N log k)`를 지켜 주는 것이고, 그것은 이 케이스들에 없는 입력에 대한 약속입니다.
'''
hints = [
  "힙 항목은 값이 어디서 왔는지를 실어야 합니다. 아니면 pop한 뒤 다시 채울 수 없습니다.",
  "값을 먼저 비교하는 `less`와 함께 { value, which, at }이 바로 원하는 것입니다. 비어 있지 않은 모든 리스트의 첫 원소로 씨를 뿌리세요 — 개수가 0인 리스트에는 씨로 쓸 머리가 없습니다.",
  "어떤 리스트의 원소를 pop할 때만 그 리스트의 다음 원소를 push하세요 — 그래야 힙이 k를 유지합니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.hacker.13.backtracking"
title = "모든 조합"
story = "노점에 등불을 걸 수 있는 모든 방법을 나열하라. 전부, 정해진 순서로, 같은 것을 두 번 출력하지 말고."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 **이미 오름차순인** 서로 다른 정수 `n`개입니다.

모든 부분집합을 한 줄에 하나씩, 값은 공백으로 구분해 출력하고, 빈 부분집합은 `-`로 출력하세요. 순서는 뻔한 재귀가 만들어 내는 대로입니다: 각 위치에서 먼저 원소를 **취하는** 가지, 그다음 건너뛰는 가지. 그다음 `SUBSETS <2^n>`을 출력하세요.

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

push, 재귀, **pop**. pop은 사람들이 빠뜨리는 부분이고, 증상은 첫 줄 뒤의 모든 줄이 너무 긴 것입니다. Lua에서 push는 `chosen[#chosen + 1] = v`이고 pop은 `chosen[#chosen] = nil`입니다 — 마지막 칸에 `nil`을 대입하는 것이 시퀀스가 짧아지는 방법이고, `#chosen`이 그것을 따라 내려갑니다. 여기에는 부분집합을 다른 순서로 줄 `itertools`가 없습니다. 순서는 재귀 자신의 것이고, 그것이 검사되는 것입니다.
'''
hints = [
  "원소마다 재귀 호출 둘: 하나는 덧붙인 채로, 하나는 없이. 취하는 쪽을 먼저 하면 예시의 순서가 저절로 나옵니다.",
  "chosen[#chosen] = nil은 두 호출 사이에 들어갑니다. 그것이 시도-재귀-되돌리기의 `undo`입니다.",
  "기저 경우는 at > #nums이고, 거기서의 빈 선택이 빈 부분집합이며, 그것도 셉니다 — 그리고 `-`로 출력됩니다.",
]

