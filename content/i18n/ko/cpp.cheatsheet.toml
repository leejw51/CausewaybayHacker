]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.cheatsheet.17.ordering"
title = "집합의 한 자리"
story = "태풍 대피항의 모든 삼판은 (행, 열) 정박지이고, 항만 사무소는 그것을 std::set에 둔다 — 순서를 매길 수 없는 것은 거부하는 집합에."
brief = '''
```cpp
struct Pt { int r, c; };
std::set<Pt> taken;
```

이것은 아직 컴파일되지 않습니다. `taken`이 동작하고 `r`로, 동점이면 `c`로
순서를 매기도록 `Pt` 안에 **멤버 하나**를 추가하세요. C++20이고, `<tuple>`이
포함되어 있습니다.
'''
hints = [
  "set은 `const` 원소끼리 비교하고, 사전식 순서란 첫 필드가 같을 때만 두 번째 필드가 의미를 가진다는 뜻입니다.",
]

