]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet.28.enum-class"
title = "어느 노선"
story = "코즈웨이베이역의 MTR 안내판은 노선에 이름을 붙이고, 승강장 코드는 그중 하나를 숫자로 적지 않고 물어보고 싶다."
brief = '''
