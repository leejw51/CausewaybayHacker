# C++ LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/cpp/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks, identifiers and printed strings are
# copied verbatim.

pack   = "cpp.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet.01.fast-io"
title = "수문을 열어라"
story = "06:00, 태풍 대피항. 생선 시세 백만 줄이 한꺼번에 들어오는데, 기본 스트림은 너무 예의 바르게 느리다."
brief = '''
`main`의 첫 줄, 어떤 입출력보다 먼저: `cin`/`cout`이 C의 stdio와 동기화하지 않게 하고, `cin`을 `cout`에서 풀어 읽을 때마다 출력이 flush되지 않게 하세요.

어느 줄일까요?
'''
hints = [
  "동기화를 끄는 값은 `false`이고, `tie`는 flush할 스트림의 포인터를 받습니다. `nullptr`는 없음이라는 뜻입니다.",
]

