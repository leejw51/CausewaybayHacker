# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet.30.positive-mod"
title = "음수로 돌아간 랩"
story = "눈데이 건의 링 버퍼에는 슬롯이 셋이고, 슬롯 0에서 일곱 걸음 뒤로 가면 슬롯 2에 닿아야 한다 — 오리너구리가 아침 내내 앉아 있던 슬롯 -1이 아니라."
brief = '''
`int x, m;`이고 `m > 0`입니다. `x`는 `-7`이나 `-100`을 포함해 **어떤** `int`든 될 수
있습니다. `int r`을 `x`를 `m`으로 나눈 나머지 중 `0..m-1` 범위의 것으로
설정하세요 — `x = -7, m = 3`이면 `2`입니다.
'''
hints = [
  "C++에서 `%`의 부호는 피제수를 따르므로 음수 `x`는 음수 나머지를 줍니다 — 올바른 슬롯에서 한 걸음 모자랍니다. `m`을 한 번 더하는 것으로는 모든 `x`에 충분하지 않습니다. 더한 다음 다시 줄이세요.",
]
