```

`l`이 enum의 첫 번째 case일 때 정확히 실행되는 `if`를 여세요.
'''
hints = [
  "scoped enum은 이름을 enum 안에 두고, 스스로 `int`나 문자열로 바뀌지 않습니다.",
]

