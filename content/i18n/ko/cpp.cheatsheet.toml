[[quest]]
id    = "cpp.cheatsheet.18.optional"
title = "숫자일지도"
story = "빅토리아 공원 분수대 아래 펌프실은 압력 수치를 보고하거나, 센서가 뽑혀 있으면 아무것도 보고하지 않는다 — 그리고 표시판은 아무것도 없을 때 절대 죽어서는 안 된다."
brief = '''
`std::optional<int> r = read_sensor();` — `int n`을 그 수치로, `r`에 아무것도
없으면 `-1`로 설정하세요. 아무것도 던져서는 안 됩니다.
'''
hints = [
  "optional은 숫자가 아니라서 `?:`에서 숫자 옆에 앉을 수 없습니다. 그 멤버 중 하나가 대체값을 인자로 받습니다.",
]

