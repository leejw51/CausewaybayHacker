id    = "cpp.cheatsheet.13.words"
title = "단어 하나씩"
story = "눈데이 건의 기록 줄은 'fired   12:00  Jardine'이다 — 단어 사이의 간격이 언제나 공백 하나는 아니다."
brief = '''
`std::string line`에는 **하나 이상의** 공백으로 띄어진 단어들이 있습니다.
`<sstream>`이 포함되어 있고, `std::string w;`와
`std::vector<std::string> words;`가 선언되어 있습니다. 모든 단어를 순서대로
`words`에 push하되, 그 사이에 빈 문자열이 없어야 합니다.
'''
hints = [
  "string stream의 `>>`는 단어마다 앞의 공백 뭉치를 건너뛰고 다음 공백에서 멈춥니다 — 구분자 기반 읽기는 아무것도 건너뛰지 않습니다.",
]

