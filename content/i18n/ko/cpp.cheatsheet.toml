[[quest]]
id    = "cpp.cheatsheet.25.digit"
title = "char 뒤의 숫자"
story = "윈저 하우스 문에 칠해진 가게 번호는 '7'이고, 승강기 제어기는 글리프의 코드가 아니라 숫자 7을 원한다."
