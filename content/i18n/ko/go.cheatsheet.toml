[[quest]]
id    = "go.cheatsheet.12.close-results"
title = "마지막 사람이 문을"
story = "퍼시벌 스트리트 뒷방에서 배달원 넷이 밤일을 한다. 누군가는 마지막 사람이 돌아온 뒤에 문을 잠가야 한다 — 그 전이 아니라."
brief = '''
워커 풀입니다. 각 워커는 `jobs`가 바닥나면 `wg.Done()`을 부르고, `jobs`는
생산자가 닫습니다. 모든 워커가 끝나면 마지막 `range`가 끝나게 하는 — 데드락도
패닉도 없이 — 줄은 어느 것입니까?

```
results := make(chan int) // unbuffered
for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
hints = [
  "기다림은 읽는 쪽보다 먼저가 아니라 그 옆에서 일어나야 합니다. 워커들은 `main`이 읽을 때까지 버퍼 없는 전송에서 멈춰 있습니다.",
]

