[[quest]]
id    = "go.cheatsheet.19.bfs-queue"
title = "오래된 것부터"
story = "타임스 스퀘어 지하 주차장에 빗물이 배수구에서부터 한 칸씩 바깥으로 번진다."
brief = '''
격자 BFS입니다. 탐색이 너비 우선으로 남고 — 루프가 실제로 끝나도록 — 큐에서
다음 점을 꺼내는 줄은 어느 것입니까?

```
q := []pt{{sr, sc}}
for len(q) > 0 {
    // ____
    for _, d := range dirs {
        nr, nc := cur.r+d.r, cur.c+d.c
        if !okCell(nr, nc) { continue }
        q = append(q, pt{nr, nc})
    }
}
```
'''
hints = [
  "너비 우선은 가장 오래된 항목이 먼저라는 뜻입니다. 루프 본문 안에서 `:=`는 새 `q`를 만들고, 바깥 것은 영영 줄지 않습니다.",
]

