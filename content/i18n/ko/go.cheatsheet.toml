# GO LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/go/cheatsheet.toml`, quest by quest, and nothing else. The four
# choices are code, live in the English pack, and are never translated. Code
# blocks, identifiers and printed strings are copied verbatim.

pack   = "go.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet.01.flush"
title = "플러시 아니면 없음"
story = "06:30, 자딘스 바자. 키오스크는 밤새 버퍼에 출력했지만, 아무도 한 줄도 보지 못했다."
brief = '''
출력은 버퍼가 있는 writer를 거칩니다. `main`이 반환될 때 `out`에 쓴 모든 것이
실제로 화면에 나오게 하는 줄은 어느 것입니까?

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
hints = [
  "`bufio.Writer`는 플러시될 때까지 바이트를 붙잡고 있고, `defer`에는 괄호까지 붙은 호출이 필요합니다.",
]

