가리키는 포인터로 `sumInto`를 실행하도록 띄운 OS 스레드입니다. `main`은
그것을 join하고 출력합니다. `std.Thread.spawn`은 설정(기본값이면 `.{}`),
함수, 그리고 튜플로 된 인자를 받으며, 실패할 수 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "const t = try std.Thread.spawn(.{}, sumInto, .{ v.items, &result }); — 설정, 함수, 튜플 안의 인자.",
  "sumInto는 *i64를 원하므로 인자는 result가 아니라 &result입니다. 그리고 spawn은 실패할 수 있으므로, try가 없으면 join할 것이 없습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.verybasic.26.mutex"
title = "카운터 하나에 손 넷"
story = "부스 네 곳이 요금소 사무실의 카운터 하나에 더하는데, 뮤텍스는 한 번도 잡힌 적 없이 매 바퀴 돌려진다."
brief = '''
스레드 네 개가 각각 `counter`에 1을 십만 번 더합니다. 루프의 매 바퀴는
더하는 동안 뮤텍스 `mu`를 쥐고 있어야 합니다. 닫는 중괄호에서 잠금을
푸는 `defer`는 적혀 있고, 잠금을 거는 줄이 빈칸입니다. `std.Io.Mutex`는
`io`를 손에 쥐고 잠급니다 — `lock`은 취소될 수 있어 오류 유니언을
돌려주고, 취소할 수 없는 평범한 형태는 아무것도 돌려주지 않습니다.
아무도 쥐지 않은 뮤텍스의 잠금을 푸는 것은 `unreachable`이고,
`-O Debug`에서 그것은 패닉입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "mu.lockUncancelable(io); — 지금 잠급니다. 이미 있는 defer가 바퀴가 끝날 때 풉니다.",
  "mu.lock(io)는 work가 무시할 수도 돌려줄 수도 없는 오류 유니언을 돌려줍니다. 아무도 쥐지 않은 뮤텍스에 대한 mu.unlock(io)는 reached unreachable code입니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.verybasic.27.binary-tree"
title = "OVERFLOW"
story = "06:00, 3번 부스. 차축 카운터는 `u8`이었고, 그날 아침 이백쉰여섯 번째 차축은 `panic: integer overflow`로 들어왔으며, 차단기는 내려가 있다. 자정 이후의 영수증을 손으로, 그것들을 담을 만큼 넓은 탐색 트리에 다시 색인해야 한다."
brief = '''
이번에는 `val`이 `i64`입니다: 충분히 넓습니다. `insert`는 옵셔널 포인터
`n`을 뿌리로 하는 탐색 트리에 `v`를 넣습니다. `null`인 경우는 적혀 있고,
아레나에서 새 노드를 만듭니다. 빈칸은 `v`를 올바른 쪽으로 내려보내는 한
줄입니다 — `node.val`보다 작으면 왼쪽, 아니면 오른쪽 — 그리고 재귀가
돌려주는 것을 저장합니다. 그 호출은 할당을 하므로 `try`합니다. 자식은
`?*Node`이고, 있는 그대로 내려보냅니다 — 아무도 들여다보기 전에 `.?`로
풀어서는 절대 안 됩니다. 그다음 중위 순회가 오름차순으로 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); — 한쪽으로 재귀하고 그 결과를 저장합니다.",
  "node.left.?는 아무도 들여다보기 전에 풀어 버린 null 자식입니다 — 두 번째 insert에서 panic: attempt to use null value. 자식은 있는 그대로의 옵셔널로 내려가고, 더 작은 것은 왼쪽으로 갑니다.",
]
