# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.verybasic.24.lambdas"
title = "짝수 차로를 세라"
story = "요금소를 따라 늘어선 차로 번호가 목록으로 오고, 사무실은 그중 몇 개가 짝수인지 알고 싶어 한다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램에는 `evens`가 필요합니다:
그중 몇 개가 짝수인지를 `countIf`로 센 것으로, `countIf`는 슬라이스와
술어 — 함수 포인터 `*const fn (i64) bool` — 를 받습니다. 람다에 대한
Zig의 답은 익명 구조체 안에 선언한 함수를 이름으로 꺼내는 것이고, 그것을
모두 한 줄에 씁니다: `struct { fn f(...) ... }.f`.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "const evens = countIf(v.items, struct { fn f(x: i64) bool { return @mod(x, 2) == 0; } }.f); — 구조체 안에 선언하고 이름으로 꺼낸 함수.",
  ".f가 없으면 인자는 함수가 아니라 타입입니다. 맨 fn은 선언이라 호출 안에 들어갈 수 없습니다. == 1은 홀수를 셉니다.",
]

