# ZIG LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/zig/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "zig.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.verybasic.01.print"
title = "요금소의 첫마디"
story = "06:00, 코즈웨이베이 터널 입구. 1번 부스의 전광판은 한 줄로 근무를 열어야 하는데, 그 줄이 없다."
brief = '''
프로그램은 정확히 `hello, causewaybay`와 줄바꿈을 출력해야 합니다. `w`는
버퍼를 둔 stdout 라이터입니다. 그 `print`는 형식 문자열과 인자 튜플을
받고 — 인자가 없으면 빈 튜플 `.{}` — 실패할 수 있으므로 호출을 `try`해야
합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "try w.print(\"hello, causewaybay\\n\", .{}); — try, 형식 문자열, 빈 튜플.",
  "print는 언제나 인자 두 개를 받습니다. 그리고 실패할 수 있는 호출은 그 오류를 버려서는 안 됩니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.verybasic.02.int-types"
title = "i32에 너무 큰 숫자"
story = "요금소의 연간 보고서는 통행 횟수를 십억 단위로 세는데, 그 수를 담던 레지스터는 32비트 너비다."
brief = '''
`i32`인 `a`를 읽습니다. 프로그램에는 `a`에 10억을 곱한 값을 담는 `i64`
`big`이 필요합니다. `a`가 2보다 크면 `i32`에는 들어가지 않는 값입니다.
Zig는 피연산자의 타입으로 산술을 하고, `-O Debug`에서는 값이 들어가지
않으면 `panic: integer overflow`로 멈춥니다. 그러니 `a`는 곱하기 전에
`i64`로 넓혀야 하고, 곱한 뒤에는 늦습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
output: 3000000000
```
'''
hints = [
  "const big: i64 = @as(i64, a) * 1000000000; — 먼저 a를 넓히고, 그다음 64비트에서 곱합니다.",
  "a * 1000000000은 i32에 i32에 들어가는 상수를 곱한 것이라 곱도 i32이고, 30억은 거기에 들어가지 않습니다: panic: integer overflow.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.verybasic.03.floats"
title = "소수로 된 통행료"
story = "근무 보고서는 아침 수입을 통과한 차량 수로 나누는데, 감독관은 센트까지 원했건만 달러 단위 정수를 찍는다."
brief = '''
양의 정수 `a`와 `b`를 읽습니다. 프로그램에는 몫을 `f64`로 담은 `q`가
필요합니다. Zig는 숫자를 대신 변환해 주는 일이 절대 없습니다. 정수 둘을
나누면 정수이고, `@floatFromInt`는 어느 부동소수점 타입이 될지 들었을
때에만, 즉 `@as(f64, ...)`로 감쌌을 때에만 정수를 부동소수점 수로
바꿉니다. `{d:.2}`로 출력하는 부분은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "const q: f64 = @as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b)); — 나누기 전에 양쪽이 모두 f64가 됩니다.",
  "@floatFromInt(a) / @floatFromInt(b)는 컴파일되지 않습니다. 식 한가운데에서는 그 내장 함수가 무엇이 되어야 할지 알려 줄 결과 타입이 없기 때문입니다. @divTrunc(a, b)는 부동소수점 수가 되기도 전에 3입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.verybasic.04.strings"
title = "이름이 얼마나 긴가"
story = "오토톨 계정 이름은 장부의 한 줄이고, 감사는 그 길이를 글자 수로 원한다."
brief = '''
`s`는 줄바꿈을 잘라 낸 입력 줄입니다. `[]const u8`, 즉 바이트의
슬라이스입니다. 프로그램은 그 안에 바이트가 몇 개 있는지 출력해야 합니다.
슬라이스는 자기 길이를 메서드가 아니라 필드로 가지고 다닙니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  kwan lee
output: 8
```
'''
hints = [
  "try w.print(\"{d}\\n\", .{s.len}); — len은 슬라이스의 필드이므로 괄호가 없습니다.",
  "@sizeOf([]const u8)는 슬라이스 자체의 크기 — 포인터 하나와 길이 하나, 16바이트 — 이지, 그것이 가리키는 텍스트의 크기가 아닙니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.verybasic.05.bool-if"
title = "짝수냐 홀수냐"
story = "요금소는 차축 수가 짝수인 차를 왼쪽 차로로, 홀수인 차를 오른쪽으로 보내는데, 어느 쪽인지 말해 주는 집계표는 마음을 바꾸는 법이 없다."
brief = '''
`i64`인 `n`을 읽습니다. 프로그램에는 `n`이 2로 나누어떨어질 때 참인
`bool` `even`이 필요합니다. 부호 있는 정수에 대해 Zig는 `%` 연산자를
거부하고 — 나머지의 부호가 모호하기 때문입니다 — `@mod`나 `@rem`을
이름으로 부르라고 요구합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "const even = @mod(n, 2) == 0; — 이름으로 부른 나머지, 그다음 비교.",
  "n % 2는 i64에서 컴파일되지 않습니다. 부호 있는 정수는 @rem이나 @mod를 써야 합니다. 그리고 @divTrunc(n, 2)는 몫이지, 남는 것이 아닙니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.verybasic.06.loops"
title = "차축을 세며"
story = "n대의 차량이 2번 부스를 지나가고 일지는 그 번호들을 더하는데, 쓰는 루프가 하나 일찍 시작해 하나 모자라게 멈춘다."
brief = '''
`n`을 읽습니다. 프로그램은 `1 + 2 + … + n`을 `sum`에 더해야 합니다.
루프의 본문은 적혀 있고, `i`를 1부터 `n`까지 걷는 `for` 머리가
빈칸입니다. 범위 `a..b`에 대한 `for`는 `a`에서 시작해 `b` 앞에서
멈추고, 값은 괄호 뒤의 `|i|`로 붙잡습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  10
output: 55
```
'''
hints = [
  "for (1..n + 1) |i| { — 범위의 끝은 포함되지 않으므로 n보다 하나 더.",
  "1..n은 n - 1에서 멈춥니다. Zig에는 ..=가 없습니다. 그리고 범위에 대한 for는 그 값을 붙잡아야 하며, 그렇지 않으면 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.verybasic.07.functions"
title = "그것의 제곱"
story = "차로 센서는 측정값을 보고하고 전광판은 그 제곱을 원하는데, 그 일을 해야 할 함수는 측정값을 그대로 돌려준다."
brief = '''
`square`는 `i64`를 받아 그 수에 자기 자신을 곱한 값을 돌려줘야 합니다.
그 return이 빈칸이고, `main`은 `x`를 읽어 `square(x)`를 출력합니다.
Zig의 모든 문장은 세미콜론으로 끝나고, `^`는 거듭제곱이 아닙니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7
output: 49
```
'''
hints = [
  "return x * x; — 곱하고, 그 결과를 돌려줍니다.",
  "Zig에서 ^는 거듭제곱이 아니라 비트 XOR입니다: 7 ^ 2는 5입니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.verybasic.08.structs"
title = "식권 하나, 필드 둘"
story = "부스 직원들의 매점 식권은 품목마다 이름과 가격을 적어 두는데, 새 주문의 레코드는 끝내 만들어지지 않는다."
brief = '''
`Item`에는 `name`과 `price`가 있습니다. 프로그램은 둘 다 읽었고, 그것들로
만든 `Item`인 `s`가 필요합니다. 구조체는 중괄호로 초기화하고 모든 필드를
점을 붙여 이름으로 적습니다, `.field = value`. 빠뜨린 필드는 0이 아니라
컴파일 오류입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "const s = Item{ .name = name, .price = price }; — 중괄호, 앞에 점을 붙여 이름으로 적은 모든 필드.",
  "Item{ name, price }는 구조체가 아닙니다. 위치로 적는 필드는 튜플의 것입니다. Item{ .name = name }은 price를 빠뜨렸고, Zig는 그것을 짐작해 주지 않습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.verybasic.09.struct-method"
title = "식권 스스로의 합계"
story = "매점 식권마다 가격과 수량을 아는데, 그 `total()`은 가격만 대답한다."
brief = '''
`Item.total`은 `price` 곱하기 `qty`를 돌려줘야 합니다. 메서드는 구조체
안에 선언된 함수로, 첫 매개변수가 구조체 자신이며, 필드는 그 매개변수를
통해 닿습니다 — 암묵적인 `this`는 없습니다. 그 return이 빈칸입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "return self.price * self.qty; — 두 필드 모두 self를 통해, 곱해서.",
  "total 안에서 맨 price는 컴파일러가 아는 이름이 아닙니다. 필드는 매개변수를 통해서만 닿을 수 있습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.verybasic.10.enums"
title = "두 노선, 두 색"
story = "터널 코즈웨이베이 출구의 표지판은 MTR 노선 두 개를 알리는데, 열거자를 고르는 전선이 끊겨 있다."
brief = '''
`island`나 `tsuenwan` 중 한 단어를 읽습니다. 프로그램에는 그 단어로 고른
`Line`인 `line`이 필요합니다. 색을 출력하는 `switch`는 적혀 있습니다.
Zig에서 `if`는 식이므로 선언의 오른쪽에 올 수 있고, 두 슬라이스는 `==`가
아니라 언제나 `std.mem.eql`로 비교합니다. 타입이 선언되어 있으면 enum 값은
그냥 `.island`로 쓸 수 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = if (std.mem.eql(u8, word, \"island\")) .island else .tsuen_wan; — if 식, 내용으로 비교한 슬라이스.",
  "word == \"island\"는 슬라이스를 포인터와 비교하는 것이라 컴파일되지 않습니다. Zig에는 ? : 연산자가 없고, if/else가 그 식입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.verybasic.11.vector"
title = "동전, 하나씩"
story = "동전이 4번 부스의 트레이에 하나씩 떨어지는데, 집계 목록은 전혀 늘어나지 않는다."
brief = '''
정수 한 줄을 읽습니다. 각 값 `x`는 읽히는 대로 `std.ArrayList` `xs`에
덧붙여야 합니다. 루프와 출력은 적혀 있습니다. ArrayList는 할당자를 갖고
있지 않습니다. 목록을 키울 수 있는 모든 호출에 `gpa`를 건네야 하고, 그
호출은 실패할 수 있으므로 `try`합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "try xs.append(gpa, x); — 할당자가 먼저, 그다음 값, 그리고 앞에 try.",
  "append(x)만으로는 인자가 하나 모자랍니다. 목록은 할당자를 기억하지 않습니다. try가 없으면 오류 유니언이 무시되고, 그것은 컴파일 오류입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.verybasic.12.vector-edit"
title = "첫 차를 빼고"
story = "차단기 앞 대기열은 차량 번호 목록인데, 첫 차는 이미 지나갔건만 아직 목록에 있다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램은 첫 원소를 지우고
나머지를 순서대로 출력해야 합니다. ArrayList에는 남은 것의 순서를
지키는 remove와 마지막 원소로 빈자리를 채우는 remove가 있습니다. 어느
쪽이든 지운 값을 돌려주고, Zig에서는 값을 그냥 바닥에 떨어뜨릴 수
없습니다 — 대입해야 하고, 아무도 원하지 않으면 `_`에 대입합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "_ = v.orderedRemove(0); — 인덱스 0, 나머지는 한 칸씩 당겨지고, 돌려받은 값은 일부러 버립니다.",
  "swapRemove(0)는 마지막 원소를 0번 칸으로 옮기므로 순서가 사라집니다. pop()은 마지막 것을 가져갑니다. 그리고 _ = 없는 orderedRemove는 무시된 값이라 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.verybasic.13.list"
title = "줄의 맨 앞"
story = "고장 차로는 출동 요청을 연결 리스트에 보관하는데, 새 요청은 매번 맨 앞에 들어가야 한다."
brief = '''
정수 한 줄을 읽습니다. 각 `item`은 `std.DoublyLinkedList` `l`의 맨 앞에
연결해야 하므로, 마지막에 읽은 것이 먼저 출력됩니다. 이 리스트는
침습형입니다. 각 `Item`에 박힌 `node` 필드를 포인터로 연결하며, 그것들을
출력하는 순회는 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "l.prepend(&item.node); — 리스트는 박혀 있는 노드를 포인터로 연결합니다.",
  "append는 입력 순서를 지킵니다. 순서를 뒤집는 것은 맨 앞입니다. 그리고 리스트는 *Node를 받으므로 &는 선택 사항이 아닙니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.verybasic.14.maps"
title = "집계판"
story = "요금소의 집계판은 차종별 통과 대수를 세는데, 그 수가 도무지 움직이지 않는다."
brief = '''
단어 한 줄을 읽습니다. 각 `word`에 대해 `std.StringHashMap(i64)`인
`counts`의 수가 하나 올라가야 합니다. `get`은 옵셔널로 대답합니다 — 아직
본 적 없는 단어에는 `null`이고, `orelse`가 그것을 0으로 바꿉니다 — 그리고
`put`이 새 수를 저장합니다. 루프와 정렬된 출력은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "try counts.put(word, (counts.get(word) orelse 0) + 1); — 기본값을 두고 읽고, 하나 더하고, 저장합니다.",
  "counts.get(word) + 1은 컴파일되지 않습니다. get은 ?i64를 돌려주고, 옵셔널은 orelse가 풀어 주기 전에는 더할 수 없습니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.verybasic.15.hashtable"
title = "찾아보거나, 말거나"
story = "요금표는 차종을 키로 하는 해시 맵이고, 아무도 들어 본 적 없는 차종을 물으면 지어낸 0이 아니라 -1로 대답해야 한다."
brief = '''
`table`은 첫 줄로 만든, 이름을 가격에 대응시키는 맵입니다. 이름 `q`
하나를 읽습니다. 프로그램에는 `price`가 필요합니다. 키가 있으면 표의
값이고, 없으면 `-1`입니다. `get`은 옵셔널을 돌려주며, 옵셔널은 풀기
전에는 숫자가 아닙니다 — `orelse`는 기본값을 주고, `.?`는 `null`에서
패닉합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "const price = table.get(q) orelse -1; — 옵셔널, 그리고 그것이 null일 때 쓸 값.",
  "없는 키에 대한 table.get(q).?는 panic: attempt to use null value입니다. 그리고 맨 ?i64는 {d}로 출력할 수 없습니다.",
]

