[[quest]]
id    = "zig.verybasic.25.threads"
title = "부스 하나, 스레드 하나"
story = "7번 부스는 두 번째 스레드에서 수입을 합산하고 메인 스레드는 기다리는데, 그 스레드가 시작조차 되지 않는다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있고, `sumInto(xs, out)`은 그것들을 더해
