`log(softmax(x))`는 넘칩니다. `exp(1000)`은 `inf`이고 `log(0)`은 `-inf`입니다. `log_softmax`는 먼저 행 최댓값을 빼서 같은 양을 계산하고, 어떤 입력에도 유한하게 머뭅니다.

