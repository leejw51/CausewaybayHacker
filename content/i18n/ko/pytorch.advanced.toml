[[quest]]
id    = "pytorch.advanced.14.log-sum-exp"
title = "0의 로그"
story = "천 개 중 한 배치에서 손실이 `inf`로 출력된다. 그 배치의 로짓은 크고, 무언가가 언더플로된 확률의 로그를 취했다."
