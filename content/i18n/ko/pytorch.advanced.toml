[[quest]]
id    = "pytorch.advanced.08.batched-matmul"
title = "헤드마다 곱셈 하나"
story = "어텐션 헤드 넷, 그리고 코드는 파이썬에서 그것들을 루프로 돈다. 프로파일러는 그 루프가 곧 모델이라고 말한다."
brief = '''
차원이 둘보다 많은 텐서에 대한 `@`는 **배치** 행렬 곱입니다. 마지막 두 축이 행렬이고, 그 앞의 모든 것이 배치이며, 배치 축들은 브로드캐스트됩니다.

`(B, H, T, d) @ (B, H, d, T)`는 `(B, H, T, T)`를 줍니다. 이것이 정확히 어텐션 점수 텐서이고, 모든 시퀀스의 모든 헤드를 한 번에, 루프 없이 얻습니다.

그것을 만들고, 모양과 루프로 구한 답과 일치하는지를 출력하세요.

```
output: (2, 4, 5, 5) True
```
'''
hints = [
  "q @ k.transpose(-2, -1) — 음수 축이므로, 배치 랭크가 무엇이든 같은 줄이 동작합니다.",
  "k.t()는 2차원 텐서에서만 동작하고 4차원 텐서에서는 예외를 던집니다.",
]

