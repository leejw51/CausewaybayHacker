# PYTORCH LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/advanced.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.advanced.01.view-contiguous"
title = "거부한 view"
story = "배치는 들어오는 길에 전치되고, 1년 동안 잘 돌던 평탄화가 연속성에 대한 예외를 던진다."
brief = '''
`view`는 텐서의 메모리가 새 모양이 요구하는 대로 이미 배치되어 있기를 요구합니다. 전치는 메모리를 전혀 옮기지 않고 스트라이드만 바꾸므로, 전치된 텐서에 `view`를 하면 `RuntimeError`가 나며, 이것은 PyTorch 면접에서 언제나 묻는 두세 가지 오류 중 하나입니다.

`reshape`는 필요할 때 복사하고 어느 쪽이든 동작합니다. `contiguous()`는 복사를 명시적으로 해서 `view`를 다시 가능하게 만듭니다.

전치된 텐서에서 `view`가 실패하는 것을 출력하고, 그래도 평탄화를 얻는 두 방법을 출력하세요.

```
output: RuntimeError True True
```
'''
hints = [
  "x.reshape(6)는 필요하면 복사합니다. x.contiguous().view(6)는 먼저 복사하고 그다음 view합니다.",
  "전치는 메모리가 아니라 스트라이드를 바꿉니다. 바로 그것이 view가 견디지 못하는 것입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.advanced.02.in-place"
title = "밑줄"
story = "누군가 밑줄 하나를 붙여 메모리를 아꼈고, 이제 역전파는 기울기에 필요한 변수가 수정되었다는 예외를 던진다."
brief = '''
끝에 붙은 밑줄은 *제자리*를 뜻합니다: `relu_`, `add_`, `mul_`. 제자리 연산은 할당 하나를 아끼는 대신 역전파가 필요로 할 값을 파괴하고, autograd는 그것을 잡아냅니다. 원인이 된 줄에서 멀리 떨어진 `backward()` 시점에서요.

역전파가 살아남도록 같은 산술을 제자리가 아닌 방식으로 하고, 기울기를 출력하세요.

`y = w * 2`, 그다음 `y = y + 1`, 그다음 `loss = y.sum()`: `w`에 대한 손실의 기울기는 모든 원소에서 `2`입니다.

```
output: [2.0, 2.0, 2.0] caught
```
'''
hints = [
  "y = y + 1은 이름을 새 텐서에 다시 묶습니다. y += 1은 제자리에서 수정해서 그래프를 깨뜨립니다.",
  "상수를 더해도 기울기는 바뀌지 않습니다. d(2w + 1)/dw는 여전히 2입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.advanced.03.detach-clone"
title = "복사, 그리고 절단"
story = "로깅 코드가 손실의 숫자 대신 손실 텐서를 붙들고 있었고, 04:00에도 네 시간 분량의 그래프가 여전히 메모리에 있다."
brief = '''
`clone()`은 데이터를 복사하고 **그래프에 남습니다**. 기울기가 그것을 통해 흐릅니다. `detach()`는 데이터를 공유하고 **그래프를 떠납니다**. 아무것도 거꾸로 흐르지 않습니다. 둘은 대안이 아니라 서로 다른 질문에 대한 답입니다.

스냅샷에 원하는 것은 `x.detach().clone()`입니다. 새 메모리, 그래프 없음.

셋 각각에 대해 grad가 필요한지, 그리고 원본과 저장소를 공유하는지 출력하세요.

```
output: clone True False detach False True snapshot False False
```
'''
hints = [
  "x.clone(), x.detach(), x.detach().clone() — 이 순서로.",
  "detach는 같은 메모리를 공유하므로, 거기에 쓰면 원본에도 쓰입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.advanced.04.dtype-promotion"
title = "반올림한 나눗셈"
story = "정규화가 개수를 합계로 나누는데, 1이 나오는 랙 하나를 빼고 모든 랙이 0으로 나온다."
brief = '''
두 정수 텐서에 `/`를 하면 float 텐서가 나옵니다. torch는 승격합니다. `//`는 정수를 유지하고 내림하며, `int_tensor /= 2`는 조용히 잘라 내는 대신 예외를 던집니다. 결과 dtype이 원래 텐서에 다시 들어가지 않기 때문입니다.

참 나눗셈, 내림 나눗셈, 명시적 float 캐스트의 dtype과 값을 출력하세요.

```
output: torch.float32 [0.5, 1.0, 1.5] torch.int64 [0, 1, 1] torch.float32 [0.5, 1.0, 1.5]
```
'''
hints = [
  "n / 2, n // 2, n.float() / 2 — 첫 번째는 이미 승격하고, 두 번째는 그렇지 않습니다.",
  "float32 텐서는 큰 int64를 정확히 담을 수 없습니다. 승격은 편의가 아니라 결정입니다.",
]

