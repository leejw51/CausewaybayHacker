[[quest]]
id    = "pytorch.advanced.07.keepdim"
title = "사라진 축"
story = "각 행에서 그 행의 최댓값을 빼니 직사각형 텐서에서 정사각형 텐서가 나오는데, 아무것도 예외를 던지지 않는다."
brief = '''
축소 연산은 축소한 축을 없앱니다. `(2, 3)`에 `x.max(dim=1).values`를 하면 `(2,)`가 나오고, 그것을 `(2, 3)`에서 빼면 **엉뚱한** 축을 따라 브로드캐스트됩니다. 2를 3의 자리에 맞춰 세우고, 숫자가 우연히 맞으면 조용히 헛소리를 계산합니다.

`keepdim=True`는 그 축을 크기 1로 남겨 두며, 브로드캐스팅이 원하는 것이 그것입니다.

keepdim 없는 모양, 있는 모양, 그리고 뺄셈 후의 행 최댓값(0입니다)을 출력하세요.

```
output: (2,) (2, 1) [0.0, 0.0]
```
'''
hints = [
  "x.max(dim=1).values와 x.max(dim=1, keepdim=True).values — max는 텐서가 아니라 네임드 튜플을 돌려줍니다.",
  "바로 이 뺄셈이 수치적으로 안정한 소프트맥스의 첫 줄입니다.",
]

