모델이 만들어 낸 무언가에 대해 손실을 계산하면, 막지 않는 한 기울기는 **양쪽 모두로** 흐릅니다. 타깃에 대한 `detach()`가 기울기 중단이고, 이것을 잊는 것이 모델이 자기 자신을 상대로 훈련하다 붕괴하는 버그입니다.

`b`를 detach한 채 `a`를 `b` 쪽으로 훈련시키고, 둘 중 어느 쪽이 기울기를 받았는지 출력하세요.

