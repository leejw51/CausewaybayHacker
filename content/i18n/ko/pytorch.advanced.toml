[[quest]]
id    = "pytorch.advanced.09.stop-gradient"
title = "되받아 배운 타깃"
story = "타깃 네트워크는 온라인 네트워크가 따라잡는 동안 가만히 있어야 하는데, 둘 다 움직이고 있다."
