[[quest]]
id    = "pytorch.advanced.06.masked-fill"
title = "마이너스 무한대"
story = "배치의 패딩 칸이 단어인 것처럼 어텐션을 받고 있고, 모델은 패딩을 예측하는 법을 배웠다."
brief = '''
소프트맥스에서 한 위치를 없애려면, 그 뒤에 확률을 0으로 만드는 것이 아니라 그 **전에** 점수를 `-inf`로 설정합니다. `exp(-inf)`는 0이고, 남은 확률의 합은 여전히 1입니다. 뒤에서 0으로 만들면 합이 1보다 작은 행이 남습니다.

`scores.masked_fill(mask, float("-inf"))`는 불리언 마스크가 `True`인 곳을 채웁니다.

마지막 위치를 마스킹하고, 반올림한 확률과 행 합계를 출력하세요.

```
output: [0.7311, 0.2689, 0.0] 1.0
```
'''
hints = [
  "scores.masked_fill(keep_out, float(\"-inf\")) — 마스크가 True인 곳을 채웁니다.",
  "마스킹된 항목의 점수가 가장 컸습니다. 소프트맥스 뒤에 마스킹했다면 그것이 계속 지배했을 것입니다.",
]

