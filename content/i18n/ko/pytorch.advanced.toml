[[quest]]
id    = "pytorch.advanced.05.gather"
title = "정답에 준 점수"
story = "로짓 배치에서 샘플별로 참 클래스의 신뢰도를 뽑는데, 그걸 하는 루프가 평가에서 가장 느린 줄이다."
brief = '''
`gather`는 루프 없이 인덱스로 행마다 원소 하나를 고릅니다. 확률의 `(batch, classes)` 텐서와 레이블의 `(batch,)` 텐서에 대해, `probs.gather(1, labels.unsqueeze(1)).squeeze(1)`은 모델이 모든 샘플에서 정답 클래스에 준 확률입니다.

`unsqueeze`는 장식이 아닙니다. `gather`의 인덱스는 원본과 차원 수가 같아야 합니다.

```
output: [0.7, 0.2, 0.9]
```
'''
hints = [
  "probs.gather(1, want.unsqueeze(1)).squeeze(1) — dim 1이 클래스 축입니다.",
  "probs[want]는 열이 아니라 행을 인덱싱해서, 완전히 엉뚱한 세 행을 줍니다.",
]

