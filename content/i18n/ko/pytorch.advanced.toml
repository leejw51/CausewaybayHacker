[[quest]]
id    = "pytorch.advanced.10.retain-graph"
title = "역전파를 두 번 하려다"
story = "순전파 하나에 손실 둘, 그리고 두 번째 backward는 버퍼가 이미 해제되었다는 예외를 던진다."
brief = '''
`backward()`는 그래프를 걸어가면서 해제합니다. 그러므로 같은 순전파에 대한 두 번째 `backward()`는 예외를 던지고(버퍼가 사라졌으니까요), 그것들을 붙잡아 두는 것이 `retain_graph=True`입니다.

정직한 해결책은 보통 손실들을 더해서 `backward()`를 한 번 호출하는 것입니다. `retain_graph`는 정말로 두 개의 분리된 패스가 필요할 때를 위한 것이고, 메모리를 씁니다.

그래프를 붙잡아 둔 채 두 번째 패스를 실행하고, 누적된 기울기를 출력하세요. `w = 2`에서 `d(w²)/dw + d(3w)/dw`는 `4 + 3`입니다.

```
output: caught 7.0
```
'''
hints = [
  "first.backward(retain_graph=True) — 그러면 두 번째 패스에도 걸어갈 그래프가 남아 있습니다.",
  "기울기는 누적되므로, 출력되는 숫자는 두 도함수의 합입니다.",
]

