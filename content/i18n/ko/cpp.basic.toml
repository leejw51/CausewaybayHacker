[[quest]]
id    = "cpp.basic.10.byte-slices"
title = "앞 세 바이트"
story = "대포의 전선은 이름을 바이트로 나르고, 수신기는 앞의 세 바이트를 남기고 마지막 두 바이트를 끝에 붙이는데, 출력되는 버퍼는 이름 전체다."
brief = '''
바이트는 `uint8_t`이고, 바이트 배열은 `std::vector<uint8_t>`입니다. 정수
벡터와 같은 두 관용구가 통합니다: 슬라이스는 반복자 두 개로 만든 새
벡터(사본)이고, `insert(end(), first, last)`는 범위를 덧붙입니다.
`bytes.end() - 2`는 끝에서 둘 앞의 반복자입니다.

```
std::vector<uint8_t> head(bytes.begin(), bytes.begin() + 3);
head.insert(head.end(), bytes.end() - 2, bytes.end());
```

`bytes`에는 그 줄의 문자들이 들어 있습니다(최소 셋). 자리표시자 `head`를
대신해 `// FILL`에 그 두 줄을 입력하세요. 16진수 줄과 텍스트 줄은 대신
출력됩니다.

```
input:  sampan
output: 73616d616e
        saman
```
'''
hints = [
  "std::vector<uint8_t> head(bytes.begin(), bytes.begin() + 3); — 세 바이트, 새 벡터.",
  "head.insert(head.end(), bytes.end() - 2, bytes.end()); — 마지막 둘을 덧붙입니다.",
]

