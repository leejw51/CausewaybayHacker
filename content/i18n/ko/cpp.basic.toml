[[quest]]
id    = "cpp.basic.05.loops"
title = "예포를 세며"
story = "대포는 그달의 하루마다 한 번씩 쏘고, 명판은 누적 합계를 원한다. 그리고 몇 번째 발이 3의 배수 날에 떨어졌는지도."
brief = '''
C++에서 횟수를 세는 루프는 세 부분으로 된 `for`입니다: 카운터가 어디서
시작하는지, 얼마나 오래 계속하는지, 어떻게 움직이는지. `for (long long i = 1;
i <= n; ++i)`는 `1`부터 `n`까지를 포함해 방문합니다. 본문은 방문마다 한 번
실행되고, `%`는 나머지이므로 `i % 3 == 0`은 "3의 배수"라는 뜻입니다.

```
for (long long i = 1; i <= n; ++i) {
```

본문은 적혀 있습니다: `i`를 `sum`에 더하고 3의 배수를 셉니다. 자리표시자
줄을 대신해 `// FILL`에 그 `for` 줄을 입력하세요.

```
input:  10
output: 55
        3
```
'''
hints = [
  "for (long long i = 1; i <= n; ++i) { — 1에서 시작해, i <= n인 동안 계속하고, 하나씩 나아갑니다.",
  "< n이 아니라 <= n: 예포는 n 자체도 셉니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.basic.06.functions"
title = "선가 요금"
story = "요트 클럽 윈치는 그날 처음 열 번의 인양은 한 번에 5, 그 뒤로는 3을 받는데, 요금판에는 그냥 요금이라고만 적혀 있다."
brief = '''
함수는 일 한 덩어리에 이름을 붙입니다: 반환 타입, 이름, 매개변수, 그리고
`return`으로 끝나는 본문. `long long fare(long long rides)`는 숫자 하나를
받아 하나를 돌려줍니다. 함수는 `if` 안에서 일찍 `return`할 수 있고, 그 줄
뒤에 오는 것은 모두 다른 경우입니다.

```
if (rides <= 10) return rides * 5;
return 50 + (rides - 10) * 3;
```

요금: 처음 10번은 각 5, 그 뒤로는 한 번에 3입니다. `main`은 `n`을 읽고
`fare(n)`을 출력합니다. `return 0;`을 대신해 `// FILL`에 `fare`의 본문으로
그 두 줄을 입력하세요.

```
input:  13
output: 59
```
'''
hints = [
  "if (rides <= 10) return rides * 5; — 그다음 줄에 return 50 + (rides - 10) * 3;",
  "5씩 열 번이면 50이고, 열 번째를 넘는 한 번마다 그 위에 3이 더해집니다.",
]

