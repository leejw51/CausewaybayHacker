[[quest]]
id    = "cpp.basic.07.structs"
title = "가판대 하나, 필드 셋"
story = "태풍 대피항의 생선 가판대는 이름, 가격, 수량을 서로 다른 판 세 개에 적고, 아무도 그것들을 하나로 모으지 않았다."
brief = '''
`struct`는 이름 붙은 필드들을 한 값으로 묶고, 그 필드들로 일하는 멤버 함수를
가질 수 있습니다. 중괄호는 필드가 선언된 순서대로 필드 하나씩 만듭니다:
`Stall s{"fish", 12, 3};`. 멤버 함수 안에서 필드는 그냥 이름입니다.

```
return price * qty;
Stall s{name, price, qty};
```

`Stall`에는 이름, 가격, 수량이 있고, `main`은 `name: total`을 출력합니다. 두
`// FILL` 표시에 그 두 줄을 입력하세요: 첫 줄은 `total()`의 본문이고, 둘째
줄은 `main`에서 `s`를 만듭니다.

```
input:  fish 12 3
output: fish: 36
```
'''
