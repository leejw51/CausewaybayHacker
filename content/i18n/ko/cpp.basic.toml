story = "12:00, 눈데이 건. 발포표는 시각들의 트리이고, 대포는 애초에 없던 왼쪽 가지를 따라갔다 — nullptr를 역참조했다, 코즈웨이베이에서 절대 틀려서는 안 되는 단 하나의 주소에서."
brief = '''
