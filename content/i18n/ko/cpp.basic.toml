`left` 아래에, 큰 값은 `right` 아래에 삽니다. 삽입은 재귀입니다: 빈
서브트리(`nullptr`)는 새 노드가 되고, 아니면 값이 한쪽으로 내려가며 — 그쪽이
무엇이 되든 그것을 다시 저장합니다. 그쪽이 방금 전까지 `nullptr`였을 수 있기
