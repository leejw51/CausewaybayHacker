[[quest]]
id    = "zig.hacker.27.commands"
title = "입력이 문제다"
story = "부스 일지는 80열에서 줄이 바뀐 채 기계에서 나오고, 맨 위의 수는 단어가 아니라 명령의 수다."
brief = '''
첫 줄은 뒤따르는 **명령**의 수 `k`입니다. 명령은 공백으로 나뉜 토큰들이며, 나머지
줄들에 마침 줄이 바뀐 대로 채워져 있습니다 — 줄마다 몇 개든, 간격이 얼마든, 끝에
빈 줄이 있을 수도 있습니다.

| 명령 | 토큰 | 효과 |
| --- | --- | --- |
| `ADD <cents>` | 둘 | 항목 하나를 넣습니다 |
| `VOID` | 하나 | 마지막 항목을 지우거나, 없으면 아무것도 하지 않습니다 |
| `TOTAL` | 하나 | 현재 합을 출력합니다 |
| `CLEAR` | 하나 | 모든 것을 지웁니다 |

`k`개의 명령 뒤에 `COMMANDS <k>`와 `ITEMS <how many are left>`를 출력하세요.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k`는 명령을 세고, `ADD`는 토큰 둘로 된 명령 하나입니다 — 그래서 `k`번 돌며 한
바퀴에 토큰 하나를 읽는 루프는 엉뚱한 곳에서 멈춥니다. 명령 `k`개를 읽고, 인자는
명령에 인자가 있을 때에만 꺼내세요.

빈 계산대에 대한 `VOID`와 아무것도 더하기 전의 `TOTAL`은 둘 다 동작해야 합니다.
문제에는 그런 일이 일어날 수 없다는 줄이 없고, 진짜 테스트에서는 그 침묵이 곧
명세입니다. 빈 `std.ArrayList`에 대한 `pop()`은 여기서 정의되지 않은 동작이
아닙니다 — `null`을 돌려주고, 그것을 풀 `.?`가
`panic: attempt to use null value`입니다. 그러니 가드는 여전히 당신이 써야 합니다.
길이 검사 대신 `_ = items.pop();`이나 옵셔널에 대한 `if`로 적을 뿐입니다.
'''
hints = [
  "tokenizeAny는 공백, 탭, 줄바꿈의 모든 연속을 건너뛰므로, 줄 단위로 읽기를 그만두는 순간 파일의 줄 바꿈은 상관없어집니다.",
  "ADD의 인자는 ADD 가지 안에서, 같은 토크나이저에서 꺼내세요. 루프 카운터는 토큰이 아니라 명령을 셉니다.",
  "pop()은 ?i64를 돌려줍니다. 빈 리스트에서 그것은 null이고, _ = items.pop();이 가드의 전부입니다 — 당신이 쓰지 않은 .?가 당신이 겪지 않은 패닉입니다.",
]

