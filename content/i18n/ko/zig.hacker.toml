  "_ = chosen.pop();이 두 호출 사이에 갑니다. 그것이 시도-재귀-되돌리기의 되돌리기이고, _ =는 pop이 당신이 무시하기로 한 ?i64를 돌려주기 때문입니다.",
  "기저 사례는 at == nums.len이고, 거기서의 빈 선택은 빈 부분집합이며, 그것도 셉니다.",
