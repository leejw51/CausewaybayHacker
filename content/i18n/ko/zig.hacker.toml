이것이 표준적인 경시 테스트의 틀이고, 이것은 한 가지 이유로 지원자를
떨어뜨립니다: 케이스마다여야 했던 상태가 루프 앞에 선언되었다는 것. 모든 누산기,
모든 집합, 모든 `best`는 루프 **안으로** 갑니다 — 그리고 이 언어에서는 그것을
해제하는 `defer`가 바로 그 아래에 가므로, 집합은 케이스마다 한 번 값을 치르고
