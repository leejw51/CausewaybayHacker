[[quest]]
id    = "zig.hacker.10.tree-walk"
title = "트리를 도는 세 가지 길"
story = "화이트보드에 트리, 그리고 누구도 두 번 생각할 필요가 없어야 할 질문: 세 가지 순서를 대라."
brief = '''
첫 줄은 `n`입니다. 두 번째 줄은 **레벨 순서**로 된 값 `n`개이고, `-1`은 "여기에
노드 없음"을 뜻합니다 — 그러니 트리는 힙처럼 저장되어 있습니다: 인덱스 `i`의
자식은 `2i+1`과 `2i+2`입니다.

네 줄을 출력하세요: **전위**, **중위**, **후위** 순회를 각각 공백으로 나눠서,
그리고 그다음 `DEPTH <d>` — 뿌리에서 잎까지 가장 긴 경로 위의 노드 수.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

전위는 노드, 왼쪽, 오른쪽. 중위는 왼쪽, 노드, 오른쪽. 후위는 왼쪽, 오른쪽, 노드.
재귀는 매번 같은 세 줄이고 `append`의 위치만 움직입니다.

순회는 포인터로 넘긴 `std.ArrayList(i64)`에 모으고, `append`는 할당에 실패할 수
있으므로 순회는 `!void`를 돌려주고 모든 재귀 호출은 `try`입니다. 여기서 오류는
값입니다. 실패할 수 있는 함수는 시그니처에서 그렇다고 말하고, 그것은 `main`까지
죽 올라갑니다.
'''
hints = [
  "append를 가능한 세 자리에 둔 재귀 함수 하나가 거의 똑같은 함수 셋보다 낫습니다.",
  "기저 사례는 두 조건을 한꺼번에 봅니다: 슬라이스의 끝 너머, 또는 -1 위. 그리고 인덱스를 쓰기 전에 검사해야 합니다. 여기서 끝 너머의 인덱스는 패닉이기 때문입니다.",
  "깊이는 1 + 두 자식 중 더 깊은 것이고, 없는 노드는 0입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.hacker.11.bst"
title = "정말로 BST인가"
story = "후속 질문. 누구나 두 자식을 검사하고, 누구나 처음에는 틀린다."
brief = '''
지난 퀘스트와 같은 레벨 순서 인코딩입니다: `-1`은 없는 노드이고, `i`의 자식은
`2i+1`과 `2i+2`입니다.

첫 줄은 `n q`입니다. 두 번째 줄은 트리 값 `n`개입니다. 세 번째 줄은 질의 값
`q`개입니다.

`VALID` 또는 `INVALID`를 출력하세요 — 이것은 왼쪽 서브트리의 모든 값이 노드보다
엄격히 작고 오른쪽의 모든 값이 엄격히 큰 이진 탐색 트리인가? 그다음 질의마다 한
줄: 탐색이 그것을 찾으면 `<value> FOUND <depth>`, 찾지 못하면 `<value> ABSENT`.
뿌리가 깊이 1입니다.

탐색은 트리가 존재하는 목적인 그 이진 탐색입니다: 뿌리에서 시작해 값이 더 작으면
왼쪽, 아니면 오른쪽으로 가고, 그것에 닿거나 없는 노드 — `-1`, 또는 슬라이스 끝
너머의 인덱스 — 에 닿으면 멈춥니다. INVALID 트리에서는 그 걸음이 슬라이스에 들어
있는 값을 지나쳐 갈 수 있고, 그래도 답은 `ABSENT`입니다: 질의는 슬라이스를 훑으면
무엇을 찾을지가 아니라 조회가 무엇을 찾는지를 묻습니다. 숨겨진 케이스 하나가
정확히 그것입니다.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

각 노드에서 `left < node < right`를 검사하는 것으로는 **충분하지 않습니다** —
왼쪽 서브트리 깊은 곳의 값이 여전히 조상보다 클 수 있습니다. 대신 열린 구간을
`std.math.minInt(i64)`와 `std.math.maxInt(i64)`에서 시작해 아래로 가지고
내려가세요.
'''
hints = [
  "열린 구간 (low, high)를 아래로 넘기세요. 뿌리는 i64 범위 전체를 받고, 왼쪽 자식은 (low, node)를, 오른쪽 자식은 (node, high)를 받습니다.",
  "없는 노드는 공허하게 유효합니다 — 그것이 기저 사례이고, false가 아니라 true를 돌려줍니다.",
  "조회는 이진 탐색입니다: 더 작으면 왼쪽, 아니면 오른쪽, 그리고 깊이는 몇 번 건너뛰었는지입니다.",
]

