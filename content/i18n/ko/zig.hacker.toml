[[quest]]
id    = "zig.hacker.31.palindrome"
title = "거꾸로 읽어도 같은"
story = "상위 스무 개 질문, 대부분의 테스트에서 어떤 형태로든 묻는 것이고, 대부분의 사람이 한 번 써 봤지만 한 번도 이해하지 못한 것."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열은 직접 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

가장 긴 회문 부분 문자열의 길이를 출력하고, 그다음 `AT <index>` — 그 길이인 것 중
**가장 왼쪽** 것의 0부터 센 시작 위치 — 를 출력하세요.

```
input:  12 3 5
output: 5
        AT 1
```

각 중심에서 펼치세요. 중심은 `n`개가 아니라 `2n - 1`개입니다: 모든 글자는 홀수
길이 회문의 중심이고, 두 글자 사이의 모든 틈은 짝수 길이 회문의 중심입니다. 틈을
잊는 것이 옳아 보이는 풀이가 `abba`에서 `1`을 돌려주는 이유이고, 스타터가 하는
일이 그것입니다.

**테스트가 강제하는 것과 강제하지 않는 것**, 솔직하게. 일을 하는 숨겨진 케이스는
**한** 글자 알파벳에 대한 `n = 20000`입니다. 그것은 중심에서 펼치기의 최악의
경우이고 — 모든 중심이 문자열 끝까지 달립니다 — 그래서 올바른 답은 거기서
`O(n²)`을 온전히 하고도 Debug 빌드에서 **0.64 s**에 끝납니다. 이 기계에서 잰
것입니다. 그것은 또한 모든 부분 문자열을 하나하나 검사하는 답, 삼차 시간이라 5초 안에
돌아오지 않는 답을 거부하는 것이기도 합니다.

다른 큰 케이스, 두 글자 알파벳에 대한 `n = 20000`은 속도 케이스가 아니라
**정확성** 케이스입니다. 무작위 이진 문자열에서 회문 검사는 한두 글자 만에
실패하므로 삼차 답도 그것을 통과합니다. 그것은 당신의 생성기와 가장 왼쪽 인덱스
동점 처리가 큰 규모에서 우리 것과 맞는지 확인합니다.

솔직한 단서 하나. 면접관이 파고들 만한 종류의 것이기 때문입니다: 한 글자 케이스가
거부하는 것은 *모든* 부분 문자열 검사입니다. 지금까지 찾은 최선보다 길지 않은 부분
문자열을 건너뛰는 한 줄을 더하면 같은 삼차 루프가 두 큰 케이스를 모두 통과합니다 —
이 입력에서 그 가지치기는 그것을 `O(n²)`으로 무너뜨립니다. 그러니 테스트가 거부하는
것은 최악의 경우 삼차인 모든 프로그램이 아니라 순진한 삼차입니다.

그러니: 테스트는 삼차를 거부하고 이차를 받아들입니다. `O(n)` 답인 매내처
알고리즘을 요구하지는 **않습니다**. 그것이 존재한다는 것과 무엇을 하는지는
알아 두세요. "그리고 이차보다 잘할 수 있나요?"가 이 질문이 대개 깔아 두려고 묻는
후속 질문이기 때문입니다.

여기서 인덱스는 `usize`이고, 펼치기는 어느 끝이든 넘어서기 *전에* 멈춥니다: `i - 1`을
만들기 전에 `i > 0`을 검사하는데, `usize`에 대한 `0 - 1`은 `-1`이 아니라 패닉이기
때문입니다. 양쪽으로 한 걸음씩 너무 멀리 걸었다가 하나를 되돌려 더하는 C++ 모양은
옮겨 오지 못합니다. 가드가 먼저 갑니다.
'''
hints = [
  "중심마다 호출 둘: 홀수 길이에는 (c, c), 짝수 길이에는 (c, c + 1). 스타터에는 두 번째가 빠져 있습니다.",
  "넓히기 전에 s[left] == s[right]를 검사해서, 짝수 호출이 서로 다른 두 바이트 사이의 틈에서 빠져나올 수 있게 하세요. 그다음 i > 0이고 j + 1 < len이고 다음 짝이 맞는 동안 넓히세요.",
  "엄격히 더 긴 회문에서만 갱신하면, 각 길이의 가장 왼쪽 것이 남는 것이고, 그것이 AT가 묻는 것입니다.",
]

