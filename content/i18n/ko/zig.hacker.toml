[[quest]]
id    = "zig.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "어느 아침 요금소 전체에서 나온 부스 작업 사백만 건, 그중 절반은 정정이고, 누군가는 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만들고 그다음 작업 `q`개를
실행하는데, 모두 같은 생성기에서, 감싸 도는 `u64`로 합니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**여기서는 복잡도가 강제됩니다.** 순진한 답 — 질의마다 범위를 도는 것 — 은 질의당
`O(n)`이고, 작은 케이스로는 잡히지 않습니다. 그래서 큰 숨겨진 케이스는
`n = 500000, q = 4000000`이고, 거기서 순진한 답은 `10^11` 규모의 원소를 건드리며
5초 실행 제한 안에 끝나지 않는 반면, 펜윅 트리는 Debug 빌드에서 전체를
**0.39 s**에 해냅니다. 둘 다 이 퀘스트의 두 프로그램으로 잰 것입니다.

교훈은 면접관이 낚으려는 바로 그것입니다: *점 갱신, 구간 합*은 펜윅 트리가
존재하는 바로 그 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두 접두사의 차로서의
range — 그리고 가장 낮은 세워진 비트가 걸음을 옮기는 방법입니다. `usize`에서 그
비트는 `i & (~i + 1)`입니다: C++ 답이 쓰는 `-i`는 여기서 부호 없는 타입에 존재하지
않고, `~i + 1`은 같은 비트를 컴파일러가 받아들이는 방식으로 말한 것입니다. 또는
`i & (0 -% i)`라고 쓰세요 — 감싸 돌기가 곧 의미이므로, 연산자가 그렇게 말합니다.
'''
hints = [
  "초기값마다 add를 한 번씩 호출해 트리를 만드세요. O(n) 상향식 구축은 좋은 최적화이지만 시계가 시험하는 것이 아닙니다.",
  "i & (~i + 1)은 usize의 가장 낮은 세워진 비트를 떼어 냅니다. 그것을 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "range(l, r)는 prefix(r + 1) - prefix(l)이고, 그 하나씩 어긋나는 짝을 맞추는 것이 디버깅의 대부분입니다.",
]

