[[quest]]
id    = "zig.hacker.18.edit-distance"
title = "얼마나 떨어져 있나"
story = "서로 다른 두 표지판에 적힌 같은 거리의 두 철자. 둘 사이에 한 글자 편집이 몇 번인가."
brief = '''
두 줄, 각각 소문자 단어 하나. 어느 줄이든 **비어** 있을 수 있고, 그러면 답은 다른
줄의 길이입니다.

**편집 거리**를 출력하세요: 첫째를 둘째로 바꾸는 한 글자 삽입, 삭제, 치환의 가장
적은 수. 그다음 그 둘의 가장 긴 공통 부분 수열의 길이 `LCS <k>`를 출력하세요.

```
input:  horse
        ros
output: 3
        LCS 2
```

같은 두 문자열 위의 표 둘이고, 둘 다 동점 처리만 다른 같은 세 줄짜리
점화식입니다. 행 단위로 채우세요. 답은 먼 구석입니다. 편집 표에서 행 `0`과 열
`0`은 0이 아닙니다 — 모든 것을 지우거나 넣는 비용입니다.

입력은 토큰이 아니라 `std.mem.splitScalar(u8, input, '\n')`로 줄 단위로 읽으세요:
여기서 빈 줄은 진짜 입력이고, 토크나이저는 그것을 건너뛰어 다음 단어로 갈
것입니다. 각 줄 끝의 `\r`은 잘라 내세요. 표는 각각 평평한 슬라이스 하나로,
길이가 `(la + 1) * (lb + 1)`이고, `i * (lb + 1) + j`로 인덱싱합니다.
'''
hints = [
  "edit[i][0] = i이고 edit[0][j] = j: 접두사를 아무것도 아닌 것으로 바꾸는 데는 글자마다 삭제 한 번이 듭니다.",
  "맞는 글자는 비용이 없고 대각선으로 나아갑니다. 어긋나면 비용이 하나 들고 세 이웃 중 가장 싼 것을 가져갑니다 — 중첩된 @min 호출 둘이 셋을 모두 받습니다.",
  "LCS는 @min 대신 @max를 쓰고, 어긋날 때 대각선 걸음이 없는 같은 걸음입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.hacker.19.knapsack"
title = "가방에 들어가는 것"
story = "배달원 하나, 가방 하나, 그리고 저마다 무게와 팁이 있는 주문 게시판. 탐욕법은 틀린 것들을 고른다."
brief = '''
첫 줄은 `n cap`입니다. 다음 `n`줄은 `<weight> <value>`입니다. 각 물건은 많아야
**한 번** 가져갈 수 있습니다.

`cap`에 들어가는 가장 좋은 총 가치를 출력하고, 그다음 `GREEDY <v>`: 아직 들어가는
것 중 무게당 가치가 가장 좋은 물건을 거듭 가져가면 얻을 것을 출력하세요.

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

두 숫자가 다르다는 것이 이 퀘스트의 요점 전부이고, 예시가 그것을 보여 줍니다: 무게당
가치가 가장 좋은 것은 `1.67`인 `6 10` 물건이고, 그것을 가져가면 아무것도 들어가지
않는 네 칸의 여유가 남습니다. 그것을 넘기고 `5 7` 물건 둘을 가져가면 `14`의
가치입니다. 숨겨진 케이스는 작으므로, 그것들이 확인하는 것은 표가 빠른지가 아니라
두 숫자를 모두 맞게 구했는지입니다.

용량은 **아래로** 걷고, 거꾸로 세는 `usize` 루프는
`var room = cap; while (room >= weight) : (room -= 1)`로 씁니다 — 조건은 감소 전에
검사되므로 `room`은 결코 `weight` 아래로 내려가려 하지 않고, 결코 0 아래로도
가지 않습니다.
'''
hints = [
  "용량을 아래로 걷는 것이 무제한이 아니라 0/1로 만드는 것입니다. 위로 걸으면 같은 물건을 다시 쓰게 됩니다.",
  "나누지 않고 비율을 비교하세요: b.value * a.weight 대 a.value * b.weight, 그래서 답에 부동소수점이 없습니다. 물건들 자체가 아니라 물건들의 gpa.dupe를 정렬하세요.",
  "탐욕 훑기는 정렬된 물건들에 대한 곧은 루프입니다 — 되돌아가기가 없고, 그것이 바로 그것이 틀린 이유입니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.hacker.20.bits"
title = "홀로 있는 것"
story = "차축은 하나만 빼고 모두 두 번씩 세어진다. 해시 맵도 쓰지 못하게 하고, 정렬도 하지 못하게 한다."
brief = '''
첫 줄은 `n`입니다. 두 번째 줄은 음이 아닌 정수 `n`개이고, 그 안에서 하나만 빼고 모든
값이 정확히 두 번 나옵니다.

네 줄을 출력하세요:

1. 한 번 나오는 값, **xor**와 상수 추가 공간으로 찾은 것
2. 그 안에 `1` 비트가 몇 개 세워져 있는지
3. 2의 거듭제곱이면 `POW2 YES`, 아니면 `POW2 NO` (`0`은 아닙니다)
4. 가장 낮은 세워진 비트를 지운 값, 또는 세워진 비트가 없으면 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`이고 `x ^ 0 == x`이며, xor는 어떤 순서로 일어나든 상관하지 않습니다.
그것이 첫 줄의 전부입니다. `x & (x - 1)`은 가장 낮은 세워진 비트를 지우고,
그것이 세 번째와 네 번째 줄을 공짜로 줍니다. 모두 `u64`로 하세요 — 그리고 그
뺄셈은 `x -% 1`로 쓰세요. 이 랜드에서 `u64`에 대한 `0 - 1`은 `panic:
integer overflow`이고, `-%`가 감싸 돌기를 뜻했다고 말하는 방법이기 때문입니다.
그래도 0인 경우는 막으세요. 감싸 돌기는 식을 합법으로 만들려고 거기 있을
뿐입니다.

여기 케이스는 작고 시계는 속도를 재지 않습니다. 큰 숨겨진 케이스는 없고, 이 팩이
케이스를 짓는 방식으로는 지을 수도 없습니다: 짝들에 하나를 더한 배열은 생성되는
것이 아니라 *구성되는* 것이고, 두 랜드가 그것을 구성하면 같은 배열을 구성하지
않을 것입니다. 그래서 이 케이스들은 네 줄과 그 경계를 확인합니다 — `0`은 2의
거듭제곱이 아니고, 세워진 비트가 없는 값은 가장 낮은 것을 지워도 `0`으로
남습니다. 그래도 답은 xor입니다. 중첩 루프로 나온 횟수를 세는 것은 `O(n²)`이고
진짜 `n`에서 죽습니다.
'''
hints = [
  "짝들은 어떤 순서로 도착하든 서로를 지우므로, 슬라이스에 대한 접기 한 번으로 충분합니다.",
  "매번 가장 낮은 비트를 지우며 비트를 세면, 비트 너비마다가 아니라 세워진 비트마다 한 번 돕니다. @popCount가 내장 한 줄짜리입니다.",
  "2의 거듭제곱에는 정확히 한 비트가 세워져 있으므로, 가장 낮은 것을 지우면 0이 남습니다 — 그리고 0 자체는 손으로 빼야 합니다. 그렇지 않으면 그 x -% 1이 모든 비트가 세워진 값으로 감싸 돕니다.",
]

