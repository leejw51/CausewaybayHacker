# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.hacker.14.word-search"
title = "그 단어가 격자 안에 있는가"
story = "글자판 하나와 이름 하나. 그 이름이 거기 적혀 있는지 알고 싶어 하고, 막다른 길의 수도 원한다."
brief = '''
첫 줄은 `r c`입니다. 다음 `r`줄은 소문자 격자입니다. 마지막 줄이 단어입니다.

**인접한** 칸들 사이를 위, 아래, 왼쪽, 오른쪽으로 움직이며, 한 번의 시도에서 같은
칸을 두 번 쓰지 않고 그 단어를 적을 수 있으면 단어는 격자 안에 있습니다.

`FOUND` 또는 `ABSENT`를 출력하고, 그다음 `STARTS <k>`: 단어의 첫 글자를 가진
칸이 몇 개인지를 출력하세요.

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

들어가는 길에 칸을 쓴 것으로 표시하고 **나오는 길에 표시를 지우세요**. 실패한
가지 뒤에도 표시된 채 남은 칸은 나중 가지들을 격자에 없는 이유로 실패하게
만듭니다.

행들은 `input`에서 `[]const u8` — 표시를 써넣을 수 없는 슬라이스 — 로
나옵니다. `gpa.dupe(u8, row)`가 각각의 변경 가능한 사본을 사 주고, 각 사본은
탐색이 끝나면 `gpa.free`로 돌려줍니다.
'''
hints = [
  "단어에 들어 있을 수 없는 바이트로 칸을 덮어쓰고, 재귀하고, 그다음 원래 것을 되돌려 놓으세요.",
  "시작 글자는 탐색하기 전에 따로 한 번 훑어 세세요. 그렇지 않으면 '#' 표시가 수를 헷갈리게 할 것입니다.",
  "성공의 기저 사례는 at + 1 == word.len입니다 — 이 칸을 맞춘 뒤에 검사하지, 전에 하지 않습니다.",
  "네 방향을 if 넷과 찾음 플래그가 아니라 `or`로 이으세요: `or`는 이미 성공한 첫 가지에서 멈춥니다. r > 0과 c > 0 가드가 먼저 옵니다. 0인 usize에 대한 r - 1은 패닉이기 때문입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.hacker.15.topo-sort"
title = "어떤 순서로 빌드하는가"
story = "소스 파일 열한 개와 의존성 그래프. 빌드 순서를 대거나, 그런 것이 없다는 뜻인 순환을 대라."
brief = '''
첫 줄은 `n m`입니다: `0..n-1`로 번호 매긴 작업 `n`개와 간선 `m`개. 다음 `m`줄은
`<a> <b>`이고, `a`가 `b`보다 먼저 빌드되어야 한다는 뜻입니다.

빌드 순서를 한 줄에 공백으로 나눠 출력하세요. 여러 작업이 한꺼번에 준비되면
**번호가 가장 낮은** 것을 가져가서, 답이 유일하도록 하세요. 순서가 존재하지
않으면 대신 `CYCLE`을 출력하세요. 그다음 `DONE <how many you ordered>`를
출력하세요.

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

칸의 알고리즘: 각 작업이 몇 개를 기다리는지 세고, 아무것도 기다리지 않는 것들로
시작하고, 작업을 가져갈 때마다 그것에 의존하는 것들을 하나씩 줄이세요. 작업이
남은 채로 끝나면, 그 작업들이 순환입니다.

준비 집합은 `std.math.order`를 비교로 하는 `std.PriorityQueue(usize, void, cmp)`이므로,
`pop`이 돌려주는 것은 가장 작은 준비된 작업입니다. 인접 관계는 작업마다
`std.ArrayList(usize)` 하나이고, 각각 `.empty`로 시작해 `deinit(gpa)`로
돌려줍니다.
'''
hints = [
  "waiting[b]는 b의 진입 차수입니다 — 그것을 가리키는 간선이 몇 개인지.",
  "평범한 큐는 *어떤* 순서를 줍니다. 최소 힙은 문제가 요구하는 *바로 그* 순서를 줍니다.",
  "순환을 직접 감지하는 일은 없습니다. n개보다 적은 작업이 나왔다는 것을 알아차리고, 남은 것들이 그 안에 있습니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.hacker.16.union-find"
title = "누가 누구와 이어져 있나"
story = "트램 노선망, MTR, 미니버스 노선이 한 장에. 따로 떨어진 망은 실제로 몇 개인가."
brief = '''
첫 줄은 `n m`입니다: `0..n-1`로 번호 매긴 정류장 `n`개, 방향 없는 연결 `m`개. 다음
`m`줄은 `<a> <b>`입니다.

세 줄을 출력하세요: 따로 떨어진 망이 몇 개인지, 가장 큰 것의 크기, 그리고
`REDUNDANT <k>` — 연결 중 몇 개가 이미 이어져 있던 두 정류장을 이었는지.

```
input:  6 4
        0 1
        1 2
        3 4
        0 2
output: 3
        3
        REDUNDANT 1
```

유니온 파인드: 모든 정류장은 부모를 가리키고, `find`는 뿌리까지 걷고, `union`은
한 뿌리가 다른 뿌리를 가리키게 합니다. `find`에서 돌아 나오는 길에 경로를
압축하면 전체가 질의마다 사실상 상수 시간입니다.

여기 케이스는 작고 시계는 속도를 재지 않습니다 — 압축하지 않고 걷는 `find`도 넷을
모두 통과할 것이고, 질의마다 슬라이스 전체를 다시 훑는 것도 그럴 것입니다. 그래도
압축하세요. 위 문단은 정류장 십만 개와 연결 십만 개에 대한 주장이고, 당신이
변호하라고 요구받을 것은 이 네 줄이 아니라 그 주장입니다.

`parent`는 항등으로 시작하고 — `for (parent, 0..) |*p, i| p.* = i;`가 Zig의
`iota`입니다 — `find`는 그 안에 쓰기 때문에 사본이 아니라 슬라이스를 받습니다.
'''
hints = [
  "모든 정류장을 자기 자신의 부모로, 그룹 n개로 시작하세요. 성공한 union마다 수가 하나 줄어듭니다.",
  "두 끝의 뿌리가 이미 같은 간선이 중복된 것입니다 — 세고 넘어가세요.",
  "뿌리의 크기 항목만 의미가 있으므로, 가장 큰 것은 모든 인덱스가 아니라 뿌리들에서 읽으세요.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.hacker.17.lis"
title = "가장 긴 오르막"
story = "일일 수입, 그들이 부르고 싶은 만큼, 그리고 당신이 시드에서 직접 만든다. 그들은 나아지는 날들의 가장 긴 구간을 원하고, 그 날들은 연속일 필요가 없다."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에 배열은 없습니다 — 당신이
**정확히** 이 생성기로, `u64` 산술에서 **감싸 도는** 연산자 `*%`와 `+%`로
만듭니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

가장 긴 **엄격히 증가하는 부분 수열**의 길이를 출력하세요 — 값들은 순서를
지키지만 붙어 있을 필요는 없습니다. 그다음 `TAILS <k>`를 출력하는데, `k`는
인내 정렬의 더미 수에서 읽은 같은 길이입니다.

```
input:  8 1
output: 3
        TAILS 3
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`이고,
그 안의 가장 긴 오르막은 `93944146 392341189 822192870`입니다. 알고리즘에서 버그를
찾으러 가기 전에 생성기를 그 줄에 대조해 보세요.

**이 퀘스트는 복잡도를 강제합니다.** 스타터는 `O(n²)` 표입니다 — 아무 준비 없이
쓸 수 있어야 하는 답이고, 틀리지 않았습니다. `n = 200000`에서 그것은
`2 × 10^10`번의 비교 끝에 빠른 것이 출력하는 것과 같은 `881`을 출력할 것이고,
모든 경계 검사가 켜진 Debug 빌드에서는 5초 실행 제한 안에 돌아오지 않습니다. 당신이
보는 것은 틀린 답이 아니라 시간 초과입니다. 그것이 이 질문이 만들어 내려고 존재하는
실패입니다.

`O(n log n)`짜리는 길이마다 그 길이의 부분 수열이 끝날 수 있는 가장 작은 값을
지닙니다 — 언제나 정렬된 목록이므로 새 값의 위치는 이진 탐색이고,
`std.sort.lowerBound`가 그 탐색입니다. 그것은 이 퀘스트와 함께 나오는 프로그램으로
이 기계에서 잰 결과 `n = 200000`을 **0.04 s**에 해냅니다.

생성기에 대해 한마디. 그것이 이 질문에서 Zig가 더하는 반쪽이기 때문입니다.
오버플로하는 `u64`에 대한 맨 `*`나 `+`는 여기서 감싸 돌기가 아닙니다: Debug에서 첫
걸음에 `panic: integer overflow`입니다. 생성기는 감싸 돌기를 뜻하므로 그렇다고
말하고 — `x *% 6364136223846793005 +% 1442695040888963407` — 컴파일러가 당신을
그 차이에 묶어 둡니다. `u64`로 생성하고, 나머지를 취하고, 그다음 `i64`로
`@intCast`하세요.
'''
hints = [
  "tails는 부분 수열이 아닙니다. 그 길이가 답이고, 그 내용은 가장 좋은 끝 값들일 뿐입니다.",
  "엄격히 증가한다는 것은 값보다 >=인 첫 tail을 바꾼다는 뜻이고, 그것이 정확히 std.sort.lowerBound가 돌려주는 것입니다 — 그 컨텍스트는 값이고 비교는 std.math.order(value, item)입니다.",
  "큰 케이스가 시간 초과라면 당신의 답에는 잘못된 것이 없습니다 — 여기서는 루프의 모양이 곧 답입니다. 200000개의 값에 대한 중첩 루프 둘은 2 x 10^10번의 비교입니다.",
]

