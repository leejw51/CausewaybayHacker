[[quest]]
id    = "zig.hacker.12.heap"
title = "정렬된 줄 k개"
story = "부스마다 영수증을 이미 순서대로 보낸다. 전부를 다시 정렬하지 말고 한 줄로 합쳐라."
brief = '''
첫 줄은 `k`입니다. 그다음 `k`줄, 각각 개수와 그 뒤를 잇는 그만큼의 정수이며, 이미
오름차순으로 정렬되어 있습니다.

그것들을 모두 오름차순 한 줄로 합쳐 공백으로 나눠 출력하고, 그다음
`POPS <total count>`를 출력하세요.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`std.PriorityQueue(T, Context, compareFn)`은 `compareFn`이 돌려주는 순서에 대한
**최소** 힙이므로, 여기서 힙의 방향은 속임수가 아닙니다: 값으로 순서를 매기는
`fn (void, Entry, Entry) std.math.Order`를 주면, `pop()`이 가장 작은 것을
`?Entry`로 돌려줍니다. 그것은 `ArrayList`처럼 unmanaged입니다 — 시작은 `.empty`,
`push(gpa, x)`, `deinit(gpa)`.
그것이 Zig에 특유한 부분의 전부이고, 질문이 확인하는 것이 그것입니다.

힙은 원소마다가 아니라 리스트마다 항목 하나를 담으므로, 리스트가 얼마나 길든 크기
`k`를 유지합니다.

여기 케이스는 작고 시계는 속도를 재지 않으며, 이 질문에서는 어떤 케이스도 잴 수
없을 것입니다. 모든 리스트를 슬라이스 하나에 쏟아붓고 `std.mem.sort`를 호출하는
것도 이것들을 통과하고, 큰 것도 통과할 것입니다: 힙의 `O(N log k)`에 대한
`O(N log N)`은 실행 제한이 볼 수 있는 차이가 아닙니다. 확인되는 것은 당신이 힙을
적을 수 있는가입니다. 면접관이 귀 기울이는 것은 리스트마다 항목 하나라는
불변식이고, 그것이 리스트들이 한꺼번에 메모리에 들어가지 않을 때 중요한
부분입니다.
'''
hints = [
  "힙 항목은 값이 어디서 왔는지를 싣고 있어야 합니다. 그렇지 않으면 꺼낸 뒤에 다시 채울 수 없습니다. 항목은 값만으로 순서를 매기세요. 나머지는 장부 정리입니다.",
  "byValue가 std.math.order(a.value, b.value)를 돌려주는 std.PriorityQueue(Entry, void, byValue) — .empty, push(gpa, e), ?Entry로서의 pop().",
  "리스트의 다음 원소는 그 리스트의 원소 하나를 꺼낼 때에만 넣으세요 — 그것이 힙을 k로 유지합니다.",
]

