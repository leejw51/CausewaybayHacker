[[quest]]
id    = "zig.hacker.25.test-cases"
title = "테스트 케이스 T개가 이어진다"
story = "모든 코딩 테스트가 쓰는 모양, 그리고 모든 지원자가 적어도 한 번은 쓰는 버그: 두 번째 케이스가 첫 번째를 기억한다."
