[[quest]]
id    = "zig.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 풀어 온 지도는 모두 건너뛴 횟수를 셌다. 트램은 정류장이 몇 개인지 상관하지 않는다. 얼마나 오래 걸리는지를 상관한다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 방향 없는 가중치 간선 `m`개. 그래프는
**정확히** 이 생성기로, 감싸 도는 `u64`로 직접 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 닿을 수 있는 모든 정류장까지의 최단 거리의 합(`0` 자신도 포함하며,
그것은 `0`)을 출력하고, 그다음 `MAX <the largest of them>`을 출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서는 복잡도가 강제됩니다.** 숨겨진 케이스는 `n = 200000`,
`m = 400000`입니다 — C++ 면접이 정한 크기이고, 답이 같은 답이 되도록 여기서도
유지했습니다. 어느 쪽이든 다익스트라가 올바른 알고리즘입니다. 시계가 정하는 것은
우선순위 큐입니다. 최솟값을 찾으려고 방문하지 않은 모든 노드를 훑는 것은 `O(V²)`이고,
`n = 200000`에서 그것은 하나하나에 경계 검사가 붙은 `4 × 10^10`번의 읽기이며, 5초
실행 제한 안에 돌아오지 않습니다. 이진 힙은 그것을 `O((V + E) log V)`로 만들고
**0.17 s**에 끝냅니다. 이 퀘스트와 함께 나오는 두 프로그램으로 이 기계에서 잰
것이고, 스타터가 훑는 판입니다.

분명히 봐 둘 가치가 있습니다. 시간 제한 테스트에서 떨어지는 가장 흔한 방법이기
때문입니다: **스타터는 틀리지 않았습니다.** 정확히 옳은 답을 출력합니다. 너무 늦게
도착한다는 이유만으로 거부됩니다.

Zig 모양의 메모 둘. 인접 관계는 노드마다 리스트가 아닙니다: 이 크기에서는 따로
떨어진 `ArrayList` 이십만 개가 알고리즘보다 비싸므로, 스타터는 이미 **압축된** 인접
관계 — 평평한 슬라이스 셋이고, `u`의 간선은 `to[start[u] .. start[u + 1]]` — 를
만들고, 힙 판도 같은 슬라이스를 읽습니다. 그리고 `std.PriorityQueue`는 당신이 주는
순서에 대한 최소 힙이므로, 거리로 순서를 매긴 `(distance, node)` 항목은 뒤집을 필요가
없습니다. 그것에는 decrease-key가 없고, 필요하지도 않습니다: 개선된 거리를 새 항목으로
넣고, 꺼낸 항목의 거리가 기록해 둔 것보다 이미 나쁘면 건너뛰세요. 그 "낡은 항목"
건너뛰기가 사람들이 잊는 줄이고, 그것이 없으면 힙은 한없이 자랍니다.
'''
hints = [
  "Entry = { d, u }이고 byDistance가 std.math.order(a.d, b.d)를 돌려주는 std.PriorityQueue(Entry, void, byDistance): 힙은 당신이 주는 순서에 대한 최소 힙이므로 아무것도 뒤집을 필요가 없습니다.",
  "if (top.d > dist[top.u]) continue;가 낡은 항목 건너뛰기입니다. 그것이 없어도 알고리즘은 여전히 옳고, 힙이 쓸모없는 항목들로 찹니다.",
  "생성기의 신장 트리 반쪽이 모든 노드에 닿을 수 있음을 보장하므로, inf에 대한 거르기는 실제로 아무것도 빼지 않습니다 — 그래도 두세요. 닿을 수 없는 노드가 있는 이 질문의 판이 후속 질문이기 때문입니다.",
]

