id    = "zig.hacker.13.backtracking"
title = "모든 조합"
story = "차로를 열 수 있는 모든 방법을 나열하라. 전부, 정해진 순서로, 같은 것을 두 번 출력하지 말고."
brief = '''
첫 줄은 `n`입니다. 두 번째 줄은 **이미 오름차순인** 서로 다른 정수 `n`개입니다.

