  "AutoHashMap(i64, void)는 집합입니다: put(value, {})가 넣고, count()가 서로 다른 값의 수입니다.",
  "먼저 count() < 2로 막으세요: 키가 둘보다 적으면 두 번째로 큰 것은 여전히 minInt이고, 그것을 출력하는 것은 잘못된 종류의 옳음입니다.",
]

