[[quest]]
id    = "zig.hacker.21.matrix"
title = "평면도를 돌려라"
story = "평면도가 거꾸로 놓여 있고, 탁자에는 그 사본을 하나 더 놓을 자리가 없다."
brief = '''
첫 줄은 `n`입니다. 다음 `n`줄은 정수로 된 `n × n` 격자입니다.

**시계 방향으로 90°** 돌린 격자를, 공백으로 나뉜 값 `n`줄로 출력하세요. 그다음 그
값들을 **나선 순서**로 — 바깥 고리를 왼쪽 위에서 시계 방향으로, 안쪽으로 — 한
줄에 출력하세요.

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

회전은 제자리에서 할 것입니다: 전치하고, 그다음 각 행을 뒤집습니다. 그것을
소리 내어 말하는 것이 질문의 절반입니다.

격자는 `n * n`짜리 평평한 `[]i64` 하나로 두고, 행 `r`은 슬라이스
`grid[r * n .. r * n + n]`입니다 — 그러면 `std.mem.reverse(i64, row)`가 뒤집기이고,
`std.mem.swap`이 전치입니다. 나선은 원본을 원하므로 회전하기 전에 사본을
`gpa.dupe`하고, 그 네 경계는 `i64`로 굴리세요: 한 행짜리 격자의 아래 경계는 나가는
길에 `-1`로 가고, `usize`라면 그것을 패닉으로 거부할 것입니다.
'''
hints = [
  "대각선 위쪽만 바꿔서 전치하세요 — c는 r + 1에서 시작 — 그렇지 않으면 모든 것을 다시 바꿔 되돌립니다.",
  "나선은 원래 격자를 원하므로, 제자리에서 회전하기 전에 사본을 gpa.dupe하세요.",
  "나선 루프 안의 if 가드 둘이 가운데 한 행이나 한 열이 두 번 걸어지는 것을 막습니다 — 그리고 right와 bottom이 정당하게 -1에 닿으므로 경계는 i64입니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.hacker.22.trie"
title = "접두사 상자"
story = "정류장 게시판을 위한 자동 완성 — 실제로 목록에 있는 것만 완성해 주는 정직한 종류."
brief = '''
첫 줄은 `n q`입니다. 다음 `n`줄은 넣을 소문자 단어들입니다. 그다음 `q`줄은 질의로,
각각 `WORD <s>` 또는 `PREFIX <s>`입니다.

트라이 — 각각 자식을 최대 26개까지 쥐는 노드들의 트리 — 를 만들고 답하세요:

* `WORD <s>` → `s`가 넣어졌으면 `YES`, 아니면 `NO`
* `PREFIX <s>` → 넣어진 단어 `n`개 중 몇 개가 `s`로 시작하는지

`n`개의 단어가 서로 다르다는 약속은 없고, `PREFIX`는 서로 다른 단어가 아니라
**삽입**을 셉니다: `tram`을 두 번 넣으면 `PREFIX tram`은 `2`입니다. `NODES`는
노드를 세므로, 두 번째 삽입은 아무것도 더하지 않습니다.

그다음 뿌리를 포함한 트라이의 노드 수 `NODES <k>`를 출력하세요.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

모든 노드에 넣어진 단어 몇 개가 그것을 지나가는지 수를 두면, `PREFIX`는 끝에서
세는 일이 없는 걸음입니다. 노드들은 `std.ArrayList(Node)` 하나에 저장하고, 자식은
노드마다 `?*Node` 스물여섯 개 대신 인덱스 — 없으면 `-1` — 를 쥐게 하세요. 더
작고, 더 빠르고, 인덱스는 `.items` 안을 가리키는 포인터처럼 자라남에 의해 무효가
되는 일이 결코 없습니다. 그것은 가정이 아닙니다: `append`는 리스트 전체를 옮길 수
있고, 그 전에 가져간 포인터는 할당자가 이미 돌려받은 메모리를 가리키는
포인터입니다. 인덱스를 가져가고, `append`하고, 그다음 다시 `nodes.items[at]`을
거치세요.
'''
hints = [
  "노드들은 ArrayList 하나에 저장하고 자식은 인덱스를 쥐게 하세요. append 전에 가져간 .items 안의 포인터는 리스트가 돌려줬을지도 모르는 메모리를 가리키는 포인터입니다.",
  "through는 당신이 올라서는 노드에서 올라가므로, 뿌리는 자기 자신을 결코 세지 않습니다.",
  "트라이에서 떨어진 질의는 at == -1을 남기고, -1은 특별한 경우 없이 NO와 0으로 대답합니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.hacker.23.prefix-sums"
title = "목표를 맞히는 방법은 몇 가지"
story = "하루치 수입과 감사관이 보고 싶어 하는 숫자 하나. 연속된 시간 구간 중 몇 개가 정확히 그만큼이 되는가."
brief = '''
첫 줄은 `n k`입니다. 두 번째 줄은 음수일 수도 있는 정수 `n`개입니다.

합이 정확히 `k`인 연속 구간이 몇 개인지 출력하고, 그다음 `RANGE <s>`를 출력하세요.
목록 전체의 합으로, 다시 더하지 말고 마지막 접두사 합에서 읽은 것입니다.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

음수 값은 슬라이딩 윈도를 죽입니다 — 너무 큰 창은 줄여서 고칠 수 없습니다.
살아남는 것은 접두사 합입니다: 구간 `i..j`는 정확히 `prefix[j] - prefix[i] == k`일
때 합이 `k`이므로, 앞선 접두사 중 몇 개가 `prefix[j] - k`와 같은지 세세요. 처음에서
시작하는 구간을 위해 맵에 `0 → 1`을 심어 두세요.

여기 케이스는 작고 시계는 속도를 재지 않으며, 여기에는 `O(n²)` 이중 루프를 거부할
케이스가 없습니다 — 진짜 `n`에서는 있을 것입니다. 200000개의 값에 대한 그 같은 이중
루프는 `2 × 10^10`번의 덧셈이고, Debug 빌드에서는 5초 실행 제한을 한참 넘깁니다.
해시 맵의 한 번 훑기는 1초의 몇 분의 1입니다. 이 넷이 확인하는 것은 음수와 처음에서
시작하는 구간이고, 그 둘이 이 답이 실제로 틀리는 곳입니다. 복잡도는 당신의 양심에
맡깁니다.

`std.AutoHashMap(i64, i64)` 하나 — 접두사 값에서 그것이 나온 횟수로 — 와 그것을
올리는 `getOrPut`.
'''
hints = [
  "현재 것을 기록하기 전에 앞선 접두사를 찾아보세요. 그렇지 않으면 k가 0일 때 길이 0인 구간이 자기 자신을 셉니다.",
  "맨 앞의 seen.put(0, 1)이 인덱스 0에서 시작하는 구간을 아예 찾을 수 있게 해 줍니다.",
  "마지막 접두사가 합계이므로, 두 번째 줄은 추가 비용이 들지 않습니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.hacker.24.inversions"
title = "시계가 잡아내는 것"
story = "오후 라운드의 첫 질문. 순진한 답은 옳고, 그것은 틀린 답이다 — 그리고 Debug 빌드는 그것을 덜 옳게 만들지 않는다. 더 느리게 만들 뿐."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에 배열은 없습니다 — 당신이
**정확히** 이 생성기로, `u64` 산술에서 감싸 도는 연산자 `*%`와 `+%`로 만듭니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

**역전**을 세세요: `a[i] > a[j]`인 짝 `i < j`. 그 수를 출력하고, 그다음
`MAX <largest value>`를 출력하세요.

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`입니다.

**이 퀘스트는 복잡도를 강제하고, 그럴 수 있는 것은 이런 종류뿐입니다.** 스타터는
`O(n²)` 이중 루프입니다. 숨겨진 케이스는 `n = 1000000`으로, C++ 면접이 정한
크기입니다. 그보다 작으면 그쪽 최적화기가 루프를 벡터화해 실행 제한 안에 넣어
버렸기 때문입니다. 거기서 이중 루프는 `5 × 10^11`번의 비교이고, 그 하나하나에 경계
검사가 붙은 Debug 빌드는 5초 실행 제한 안에 돌아오지 않습니다. 병합 정렬 중에
역전을 세는 것은 `O(n log n)`이고, 이 퀘스트와 함께 나오는 프로그램으로 이 기계에서
잰 결과 그 크기에서 **0.19 s**가 걸립니다.

큰 케이스가 대신 정해 주는 것이 두 가지 더 있습니다. `n = 1000000`에 대한 답은
`250046540838`이고, 32비트에 들어가지 않습니다 — 너비가 틀린 누산기는 여기서 조용히
틀리지 않고 `panic: integer overflow`이므로, `u64`로 세세요. 그리고 생성기는
오버플로가 아니라 감싸 돌아야 합니다: 오버플로하는 `u64`에 대한 맨 `*`는 첫 걸음에
그 같은 패닉이고, `*%`가 감싸 돌기를 뜻하는 연산자입니다.
'''
hints = [
  "정렬하기 전에 최댓값을 구하거나, 사본을 정렬하세요. 병합 정렬은 당신 발밑에서 슬라이스를 재배열합니다.",
  "병합에서 오른쪽 값이 이기면, 왼쪽 절반의 남은 모든 원소가 그것보다 큽니다 — 한 번에 mid - left개의 역전이고, 그것이 요령의 전부입니다.",
  "압축한 값들에 대한 펜윅 트리가 또 하나의 O(n log n) 답이고 면접장에서 이름을 댈 가치가 있습니다. 시계 아래에서는 병합 정렬이 코드가 더 적습니다.",
]

