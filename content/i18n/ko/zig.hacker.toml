[[quest]]
id    = "zig.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구는 문제의 맨 아래에 나오고, 방 안의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. 감싸 도는 `u64`로 질의 `q`개를 생성하세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요. `q`개
답 전체의 합을, 그것도 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이므로, 결코 계산한 뒤에 줄이지 않습니다 —
모든 곱셈을 가면서 줄입니다. 문제는 나눗셈입니다: `a! / (b! (a-b)!)`는 모듈러
산술에서 의미가 없습니다. 그것을 대신하는 것이 **모듈러 역원**이고,
`1000000007`이 소수이므로 페르마의 소정리가 그것을 줍니다:
`inverse(v) = v^(p-2) mod p`, 빠른 거듭제곱으로 제곱 서른 번쯤에 계산합니다.

그러니: `factorial[0..=n]`을 한 번 미리 계산하고, 각 질의에
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**여기서는 복잡도가 강제됩니다.** 숨겨진 케이스 하나는 `n = 200000`,
`q = 200000`입니다. 각 계수를 따로 계산하는 것 — 항 `b`개를 곱하고, 항 `b`개로
나누고, 각각 모듈러 역원 하나 — 은 5초 실행 제한 안에 끝나지 않습니다. 그것이
스타터입니다. 공유된 계승 표 하나는 Debug 빌드에서 **0.07 s**에 끝납니다. 둘 다 이
기계에서 잰 것입니다.

모든 중간값은 `2^30`보다 작은 두 값의 곱이므로 `u64`에 들어가고 아무것도
오버플로하지 않습니다 — 그리고 여기서 그것은 빌드가 대신 확인해 주는 주장입니다.
곱셈마다 줄이세요: `2^64`를 넘어서는 곱은 조용히 틀리지 않고
`panic: integer overflow`이며, 그것이 이 질문이 나오는 이유의 나머지 반쪽입니다.
'''
hints = [
  "곱셈마다 줄이세요, 끝에서가 아니라. u64는 P보다 작은 두 값의 곱은 담지만 계승은 담지 못하고, 오버플로는 패닉입니다.",
  "inverse(v)는 power(v, P - 2)이고, P가 소수이기 때문에만 동작합니다 — 그것이 여기서 페르마의 소정리의 내용 전부입니다.",
  "역계승도 inverse(factorial[n])에서부터 거꾸로 미리 계산해 두면 질의마다 power() 호출 둘이 사라집니다. 통과하는 데 필요하지는 않고, 소리 내어 말할 가치가 있습니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "zig.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "대나무 비계 때문에 거리 세 곳이 막힌 배달 격자. 가로지르는 길은 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자는 행 우선 순서로 직접 만들고, 칸마다 값
**둘**을 뽑으세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

열린 칸으로만 **오른쪽** 또는 **아래로** 움직이세요. 출력하세요:

1. `PATHS <k>` — `(0,0)`에서 `(r-1,c-1)`까지 서로 다른 경로가 몇 개인지,
   `1000000007`로 나눈 나머지
2. `MIN <cost>` — 양 끝점을 모두 포함한 경로의 가장 작은 총비용, 또는 경로가
   없으면 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

행 우선 순서로 한 번 훑으면 둘 다 됩니다: 한 칸의 경로 수는 위에서와 왼쪽에서
들어오는 경로 수의 합이고, 그 최선 비용은 자기 비용 더하기 그 둘 중 더 싼 것입니다.
오른쪽이나 아래로만 움직이므로 필요한 두 칸은 언제나 이미 끝나 있습니다 — 그래서
여기에는 재귀도 방문 집합도 필요 없습니다.

`PATHS` 수는 흔한 이유로 `1000000007`로 나눈 나머지를 취합니다: `1000 × 1000` 숨겨진
케이스에서 참인 수는 육백 자리가 넘습니다. 더하면서 줄이세요 — 그리고 부호 있는
`i64`에서 그것은 `@mod(x, P)`입니다. 여기서 `%`는 부호 없는 정수에만 정의되어 있기
때문입니다. 컴파일러는 부호 규약을 대신 짐작해 주지 않습니다.

**큰 케이스가 강제하는 것:** 경로를 하나하나 열거하는 모든 답을 거부합니다. 경로는
방 안의 원자보다 많습니다. 상향식 표와 메모이제이션한 재귀는 구별하지 않습니다 —
둘 다 칸 수에 선형이고 둘 다 여유 있게 통과합니다: 표는 Debug 빌드에서
**0.05 s**가 걸립니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에서 두 값을 모두 뽑으세요 — 생성기는 그것들을 건너뛰지 않고, 막기만 거부합니다.",
  "위나 왼쪽에 열린 이웃이 없는 열린 칸은 경로 0개로 닿고 최선 비용이 없습니다. inf가 닿을 수 없음을 뜻하도록 두고 덧셈을 막으세요. inf에 무엇이든 더하면 패닉이기 때문입니다.",
  "도착지는 열려 있으면서도 닿을 수 없을 수 있고, 바로 그때 PATHS는 0이고 MIN은 -1입니다. 숨겨진 케이스 하나가 그것입니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "zig.hacker.34.stable-sort"
title = "동점은 제자리를 지킨다"
story = "배달원 둘이 같은 점수로 끝났고, 순위표는 다시 그릴 때마다 그 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 배달원 `n`명을 만드는데, 배달원 `i`는 인덱스
`i`와 점수를 가집니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

배달원들을 점수 **내림차순**으로 정렬하세요. 점수가 같은 배달원들은 도착한 순서를
지켜야 합니다. 그들의 인덱스를 공백으로 나눠 출력하고, 그다음 `TIES <k>` — 정렬한
순서에서 이웃한 짝 중 점수가 같은 것이 몇 개인지 — 를 출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`는 작으므로 거의 모든 것이 동점이고, 답은 거의 전적으로 그것들에 무슨 일이
일어나는지로 정해집니다.

**이것은 당신이 어떤 정렬을 쥐고 있는지 아는 것에 관한 퀘스트입니다.** Zig는 둘을
내놓고, 그 이름이 어느 것이 어느 것인지 말해 줍니다. `std.mem.sortUnstable`은 패턴
파괴 퀵정렬입니다: 같은 원소들의 순서에 대해 아무것도 약속하지 않고, 실제 입력에서
눈에 띄게 그것을 지키지 않습니다 — 그 분할 단계는 늘 하는 일로 같은 원소들을 피벗
너머로 바꿔 놓습니다. `std.mem.sort`는 블록 정렬이고, **안정적**이며, 그 약속을 위해
약간의 일을 치릅니다. 스타터는 점수만 보는 비교자와 함께 `sortUnstable`을 쓰고,
숨겨진 케이스는 그것이 순서를 뒤섞는 것을 입증할 만큼 큽니다. (`n = 8`에서 불안정한
것은 삽입 정렬로 물러나 마침 순서를 지킵니다 — 그래서 작은 테스트는 아무것도
증명하지 못했을 것이고, 그래서 여기서 작은 케이스는 당신을 채점하는 것이 아니라
*보이는* 것입니다.)

올바른 답은 둘이고 둘 다 내놓을 수 있어야 합니다. `std.mem.sort`를 쓰세요. **또는**
`sortUnstable`을 두고 비교를 **전순서**로 만드세요 — 점수 내림차순, 그다음 인덱스
오름차순 — 그러면 어떤 두 원소도 같다고 비교되지 않고 안정성은 더 이상 문제가 되지
않습니다. 기본으로 손을 뻗을 것은 두 번째입니다. 순서가 완전히 명시되어 있으면
불안정한 정렬에는 증명할 것이 없습니다.
'''
hints = [
  "한 단어: sortUnstable이 sort가 됩니다. std.mem.sort가 안정적인 것이고, 그것이 안정적인 답입니다.",
  "다른 답은 sortUnstable을 두고 (점수 내림차순, 그다음 인덱스 오름차순)으로 비교합니다 — 전순서이므로 불안정할 동점이 남지 않습니다.",
  "TIES는 완성된 순서에서 이웃한 같은 점수를 세고, 그 수는 둘 중 무엇을 썼든 같습니다 — 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.hacker.28.lru"
title = "통행료"
story = "7-32호실, 일곱 번째 면접, 마지막 질문. 올바른 것을 내보내야 하는 캐시, 값을 치르고 돌려줘야 하는 모든 노드, 그리고 시계."
brief = '''
첫 줄은 `cap q`입니다. 다음 `q`줄은 `PUT <key> <value>` 또는 `GET <key>`입니다.

가득 차면 **가장 오래전에 쓰인** 항목을 내보내는 고정 용량 캐시를 구현하세요.
`GET`과 `PUT` 모두 키를 쓴 것으로 칩니다.

`GET`마다 값을, 없으면 `-1`을 출력하세요. 끝에서 살아남은 키들을 가장 최근에 쓰인
것부터 공백으로 나눠 출력하고 — 캐시가 비어 있으면 `-` — 그다음 `EVICTED <k>`를
출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`에 자리가
필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은 적중하고 `3`을
가장 최근 것으로 만들며, 그래서 살아남은 것들이 `3 1`로 출력됩니다.

교과서적인 답은 **이중 연결 리스트**를 가리키는 해시 맵이고, Zig에는 숨긴 것 하나
없는 진짜가 있습니다: `std.DoublyLinkedList`는 **침습형**입니다. 리스트는 노드를
할당하지 않습니다. 당신이 `std.DoublyLinkedList.Node` — 포인터 둘, `prev`와 `next` —
를 할당자로 `create`하고 직접 `destroy`하는 당신 자신의 구조체 안에 박아 넣습니다.
그 노드에 대한 `remove` 그다음 `prepend`가 앞으로의 `std::list::splice`이고,
`pop()`은 마지막 노드를 돌려주며, 그 모두가 할당 한 바이트 없이 O(1)이므로, 연산마다
O(1)이라고 얼버무리지 않고 소리 내어 말할 수 있습니다. `*Node`에서 키를 쥔 항목으로
돌아가려면, `@fieldParentPtr("node", node_ptr)`가 필드의 오프셋만큼 포인터를
거꾸로 걷습니다. 그러면 맵은 `std.AutoHashMap(i64, *Entry)`입니다.

**스타터가 보스입니다.** 그것에는 맵, 리스트, `create`와 `destroy`가 있고, 예시에서
`GET 2`에 대해 `20`을 출력합니다. 그것은 결코 키를 *건드리지* 않습니다: `GET`은
값을 있는 자리에서 읽고, 덮어쓰기는 제자리에서 쓰며, 리스트는 키가 도착한 순서로
남습니다. 그래서 차단기는 누가 먼저 들어왔는지 기억하고 그것을 먼저 내보냅니다 —
캐시가 아니라 큐 — 그리고 `2` 대신 방금 쓰인 `1`을 내보냅니다. 고침은 교과서가
화살표를 그려 넣는 두 줄입니다: 적중할 때마다 노드를 `remove`하고 `prepend`하세요.

Rust 면접이 요구하지 않았던, 바로잡아야 할 두 가지. 항목은 값**과 함께** 키도
담습니다. 내보내기는 리스트에서 시작하고 맵의 어느 항목을 지울지 알아야 하기
때문입니다. 그리고 세 단계의 순서가 중요합니다: 노드를 `pop()`하고,
`@fieldParentPtr`를 통해 키를 읽고, 그것을 맵에서 `remove`하고, *그다음* 항목을
`gpa.destroy`하세요 — 반대 순서는 할당자가 이미 돌려받은 포인터를 통한 읽기이고,
그 읽기는 아무것도 대신 잡아 주지 않습니다: 지금 그 메모리에 있는 무엇이든
돌려주는데, 그것이 이 랜드에서 스스로를 알리지 않는 단 하나의 실수입니다. 당신이
create한 모든 항목은 `main`이 돌아갈 때쯤 destroy됩니다. `init.gpa` 뒤의
`DebugAllocator`가 *실제로* 이름을 대는 것은 당신이 잊은 하나하나이고, 그 목록이
통행료입니다.

여기 케이스는 작고 시계는 속도를 재지 않습니다: 연산 네 개로는 연결 리스트와
앞에서부터 훑는 슬라이스를 구별할 수 없습니다. 위 문단의 `O(1)`은 방 안에서 소리 내어
말하는 문장이므로, 우연히 네 케이스를 통과한 코드가 아니라 당신이 쓴 코드에 대해
참이어야 합니다.
'''
hints = [
  "예시를 스타터에 대해 손으로 돌려 보세요. GET 1은 10을 출력하고 1을 리스트의 뒤에 남겨 두므로, PUT 3은 1을 내보냅니다 — 차단기는 캐시가 아니라 큐입니다.",
  "recent.remove(&entry.node) 그다음 recent.prepend(&entry.node)는 항목을 O(1)에 앞으로 옮기고, 그 뒤에도 맵이 그것을 가리키는 포인터는 여전히 유효합니다. 그 호출 짝은 모든 적중과 모든 덮어쓰기에 갑니다.",
  "이미 있는 키를 덮어쓰는 것은 내보내기가 아닙니다 — 캐시가 가득 찼다고 정하기 전에 맵을 확인하세요.",
  "내보내기: 마지막 노드를 pop()하고, @fieldParentPtr로 항목으로 돌아가고, 그 키를 맵에서 지우고, 그다음 그것을 gpa.destroy합니다. destroy 뒤에는 맵이 쥐고 있던 포인터가 해제된 주소이므로, 맵 칸이 먼저 가야 합니다.",
]
