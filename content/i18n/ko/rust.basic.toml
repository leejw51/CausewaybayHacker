`HashMap`은 `BTreeMap`과 같은 발상 — 키마다 값 하나 — 이지만 키를 정렬하는 대신
해시합니다: 조회는 상수 시간이고, 순회 순서는 임의이며 실행마다 달라지므로 출력 전에
키를 정렬합니다. 연산은 같은 세 가지입니다: `.insert(k, v)` 추가, `.remove(&k)` 삭제,
`.get_mut(&k)` 수정.

```
counts.insert("bun".to_string(), 1);
counts.remove("siu");
*counts.get_mut("bun").unwrap() = 4;
keys.sort();
```

`counts`는 이미 한 줄의 단어를 세고 있고, 출력을 위해 키가 `keys`로 모입니다. `// FILL`
주석 자리에 네 줄을 그 순서대로 입력하세요 — 정렬은 `keys`가 만들어진 뒤의 네 번째입니다.

```
input:  siu mai har gau siu mai
output: bun 4
        gau 1
        har 1
        mai 2
```
'''
hints = [
  "counts.insert(\"bun\".to_string(), 1); 다음 counts.remove(\"siu\"); 다음 *counts.get_mut(\"bun\").unwrap() = 4; 다음 keys.sort();",
  "이름만 바뀐 BTreeMap의 줄들과 똑같습니다; 그 뒤의 keys.sort()가 HashMap의 값입니다.",
]

