# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.the-move"
title = "주인은 하나"
story = "06:40, 자딘스 바자 위. 계산대 위에 영수증 한 장, 그리고 이 거리 전체의 규칙이 거기 적혀 있다: 물건의 주인은 하나이고, 넘겨주면 넘어간 것이다."
brief = '''
`String`의 주인은 정확히 하나입니다. `let kept = receipt;`는 복사가 아니라
**이동(move)**입니다. 그 줄부터 `receipt`는 쓸 수 없는 이름이 되고, 쓰면
컴파일러가 E0382, borrow of moved value로 거부합니다. 값은 새 이름 아래로
옮겨 갔습니다.

```
let kept = receipt;
```

영수증은 만들어져 있고 `println!` 두 줄도 적혀 있습니다. `// FILL` 주석이
있는 자리에 이동 줄을 쳐서 `kept`가 문자열의 주인이 되게 하세요.

```
output: one receipt, one owner
        22
```
'''
hints = [
  "let kept = receipt; — 옛 이름을 오른쪽에 둔 let 한 줄.",
  "clone은 없습니다. 문자열은 복사되지 않고 손을 바꿉니다. 이 줄 뒤에 receipt를 쓰면 E0382입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.borrow"
title = "보기만 한다"
story = "퍼시벌 스트리트 트램 정류장. 차장은 명단의 이름을 전부 읽고 명단을 그대로 돌려준다. 명단의 주인은 언제나 사무실뿐이었다."
brief = '''
`&`는 빌려줍니다. `name: &str`을 받는 함수는 문자열을 *보기만* 하고, 호출한
쪽이 계속 주인으로 남아 그 뒤에도 쓸 수 있습니다. `&names[i]`는 원소 하나를
빌리는 것이고, `&String`은 호출 자리에서 알아서 `&str`이 됩니다.

```
total += width(&names[i]);
```

`width`와 `println!` 두 줄은 적혀 있습니다. `// FILL` 주석이 있는 자리에
이름 하나하나를 `&`로 빌려주는 호출을 치세요. 두 번째 줄은 반복문 뒤에도
이름들이 여전히 당신 것임을 증명합니다.

```
input:  MEI
        BO
        ALEX
output: 9
        MEI,BO,ALEX
```
'''
hints = [
  "total += width(&names[i]); — 앰퍼샌드는 인자 쪽에 붙습니다.",
  "width는 &str을 원하고, &String은 호출 자리에서 &str로 강제 변환되므로 &names[i]면 충분합니다.",
]

