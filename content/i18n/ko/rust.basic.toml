sorted.sort();
```

`list`는 한 줄의 정수들로 만들어지고, 그것과 정렬된 복사본, 길이가 출력됩니다.
`// FILL` 주석 자리에 네 줄을 그 순서대로 입력하세요.

```
input:  3 1 4
output: 9 4 0
        0 4 9
        3
```
'''
hints = [
  "list.push_back(0); 다음 list.pop_front(); 다음 *list.front_mut().unwrap() = 9; 다음 sorted.sort();",
  "front_mut()는 Option<&mut i64>입니다: unwrap하고 * 를 통해 대입하세요 — pop 뒤의 앞쪽은 원래 두 번째 원소입니다. sorted는 Vec이므로 sort()가 있습니다.",
]

