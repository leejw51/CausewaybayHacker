[[quest]]
id    = "rust.basic.03.mut-borrow"
title = "고치라고 빌려준다"
story = "럭키맥 키오스크가 게시판의 모든 가격을 같은 만큼 올린다. 게시판은 벽을 떠나지 않는다. 그것을 고치는 손이 빌려온 손이다."
brief = '''
`&mut`는 고치라고 빌려줍니다. `prices: &mut Vec<i64>`를 받는 함수는 호출한
쪽의 벡터를 제자리에서 바꿀 수 있습니다. 호출하는 쪽은 `&mut prices`라고
쓰고, `prices` 자체가 `let mut`이어야 합니다. 안에서는 `iter_mut()`가
`&mut i64`를 하나씩 건네고, `*p`가 그 뒤에 있는 숫자입니다.

```
*p += by;
bump(&mut prices, by);
```

`bump`와 출력은 적혀 있습니다. `// FILL` 주석이 있는 두 자리에 두 줄을
치세요: `bump` 안의 변경, 그리고 벡터를 빌려주는 호출.

```
input:  3
        10 20 30
output: 13 23 33
```
'''
hints = [
  "반복문 안에 *p += by;, 그리고 main에 bump(&mut prices, by);",
  "p는 &mut i64입니다. 별표가 그것을 뚫고 들어갑니다. 호출에는 &가 아니라 &mut가 필요하고, prices를 mut로 선언한 이유가 바로 이것입니다.",
]

