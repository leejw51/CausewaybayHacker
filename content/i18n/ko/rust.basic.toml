# RUST LAND — BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/rust/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "rust.basic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.first-light"
title = "첫 불빛"
story = "06:40, 자딘스 바자 위. 커서만 깜박이고 회색 안내문은 사라졌다. 아직 기억으로 칠 수 있는 것은 전부 당신 것이다."
brief = '''
정확히 다음을 출력하세요:

```
hello, causewaybay
```

소문자, 쉼표 하나, 공백 하나, 한 줄. 그 외에는 아무것도 없어야 합니다.
'''
hints = [
  "println!은 매크로이므로 느낌표를 붙입니다.",
  "문자열은 정확해야 합니다: 소문자, 쉼표 하나, 그 뒤 공백 하나.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.bindings"
title = "요금표"
story = "퍼시벌 스트리트 전차 정류장의 요금표에는 숫자 하나만 남아 있고, 일일 요금과 월 정기권이 있던 자리는 두 칸 모두 비어 있다."
brief = '''
표준 입력에서 정수 `n` 하나를 읽으세요.

세 줄을 출력하세요: `n`, 그다음 `n`의 두 배, 그다음 `n`을 제곱한 값.

`n`은 `i64`에 들어가며 음수일 수 있습니다.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "읽는 부분은 이미 되어 있습니다. _n에서 밑줄을 떼고 그대로 쓰세요.",
  "println!은 서식 문자열을 받습니다: println!(\"{}\", n).",
  "음수 n을 제곱하면 양수입니다. 테스트는 그것을 알고 있습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.basic.03.shadowing"
title = "세 이름, 한 이름"
story = "소고 교차로의 키오스크는 가격을 글자로, 숫자로, 돈으로 각각 들고 있으면서 셋 다 price라고 부른다."
brief = '''
한 줄을 읽으세요: 센트 단위 금액이 숫자로 적혀 있습니다.

세 줄을 출력하세요:

1. 앞뒤 공백을 뗀 글자 수
2. 금액을 숫자로
3. 금액을 달러로, 소수점 아래 정확히 두 자리

```
input:  1234
output: 4
        1234
        12.34
```

금액은 음수가 아니며 `i64`에 들어갑니다. 이름 하나를 두 번 섀도잉해서
하세요 — `&str`, 그다음 `i64`, 그다음 `String`.
'''
hints = [
  "두 번째 `let cents = ...`는 대입이 아닙니다. 이전 바인딩을 가리는 새 바인딩을 만드는 것이고, 타입이 달라도 됩니다.",
  "그래서 섀도잉은 `mut`가 아닙니다: `mut`는 타입을 유지하지만 섀도잉은 그렇지 않습니다.",
  "앞에 0을 붙인 두 자리는 {:02} 너비 지정자입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.the-move"
title = "영수증 한 장"
story = "럭키 맥의 계산대는 영수증을 찍고 나면 감사 인사를 못 한다. 종이와 함께 이름까지 넘겨 버렸기 때문이다."
brief = '''
한 줄을 읽으세요: 손님 이름입니다. 두 줄을 출력하세요:

```
input:  MEI
output: RECEIPT: MEI
        THANK YOU, MEI
```

스타터는 컴파일되지 않습니다. `receipt`가 이름을 **값으로** 받기 때문에,
호출 뒤에는 `main`이 더 이상 그 이름을 소유하지 않아 다시 출력할 수 없습니다.

`receipt`가 이름을 가져가는 대신 *들여다보기만* 하게 해서 고치세요.
clone은 하지 마세요.
'''
hints = [
  "에러는 E0382: borrow of moved value입니다. 이동은 출력 시점이 아니라 호출 시점에 일어났습니다.",
  "&str 타입의 매개변수는 빌리고, String 타입의 매개변수는 가져갑니다.",
  "시그니처를 먼저 바꾸세요. 그러면 호출하는 쪽에 &가 필요해집니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.slices"
title = "줄의 한가운데"
story = "하이산 플레이스 앞에 마흔 명. 계산대에서는 줄의 맨 앞과 맨 뒤만 보이고 그 사이는 하나도 보이지 않는다."
brief = '''
표준 입력의 첫 줄은 개수 `n`이고, 둘째 줄에는 정수 `n`개가 공백으로
구분되어 있습니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 엄격히 끼어 있는
값들의 합. 값이 셋 미만이면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```
'''
hints = [
  "nums[1..nums.len() - 1]은 Vec의 슬라이스이지 복사본이 아닙니다.",
  "값이 하나나 둘이면 그 범위는 비거나 뒤집힙니다 — 인덱싱하기 전에 if로 막으세요.",
  "&i64 이터레이터는 바로 i64로 합산됩니다.",
]

