[[quest]]
id    = "rust.basic.16.list"
title = "전차 줄, 양쪽 끝"
story = "퍼시벌 스트리트의 전차 줄은 뒤에서 승객을 태우고 앞에서 검표원을 태우는데, 탑승자 명단이 비어 있다."
