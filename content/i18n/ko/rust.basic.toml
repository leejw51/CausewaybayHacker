title = "소유한 글과 빌린 글"
story = "자딘스 바자의 가게 간판은 한 번 칠해지고 가게가 소유한다. 읽는 사람은 모두 빌려 보는 것이고, 그날을 위해 만든 현수막은 새 물건이다."
