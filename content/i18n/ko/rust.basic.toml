# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.basic.18.traits"
title = "자동 완성"
story = "퍼시벌 스트리트의 휴대폰 키오스크는 당신이 줄을 시작하기도 전에 모든 줄을 끝내 버린다. 당신이 직접 이름 붙인 트레이트에 대한 완성은 갖고 있지 않다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이고, 각 줄은 다음 중 하나입니다

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` — `ROUTE`는 숫자

표지판마다 `<tag> <rendering>` 한 줄씩 출력한 뒤 `SIGNS <n>`을 출력하세요:

* `Shop`은 `<NAME> / F<FLOOR>`로 렌더링되고 태그는 `SIGN`
* `Stop`은 노선 번호로 렌더링되고 태그는 `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

트레이트 하나를 선언하고 서로 다른 구조체 둘에 구현하세요:

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag`는 **기본 메서드**입니다. `Shop`은 그것에 대해 아무 말도 하지 않고
`SIGN`을 얻습니다. `Stop`은 자기 것을 써서 `TRAM`을 얻습니다. 이것이
면접에서 사람들이 잊는 트레이트의 절반입니다: 트레이트는 시그니처 목록만이
아니라 동작을 실어 나를 수 있고, 재정의는 원할 때만 합니다.

**하나의** 함수 `fn show<T: Sign>(sign: &T)`를 통해 출력하세요. 바운드가
계약입니다 — `show`는 `Shop`도 `Stop`도 모르고, 건네받은 것이 무엇이든
`render`와 `tag`를 갖고 있다는 것만 압니다. 컴파일러가 구체 타입마다
`show`의 사본을 하나씩 찍어 내고, 호출은 직접 호출입니다.

스타터는 컴파일되지 않습니다. 트레이트는 선언되어 있고 구조체도 있지만,
그것만으로는 아무것도 얻지 못합니다: `show(&Shop { .. })`는 E0277, *the
trait bound `Shop: Sign` is not satisfied*입니다. 트레이트를 선언하는 것과
구현하는 것은 별개의 두 행위이고, Rust에서 두 번째 것은 언제나 명시적으로
써야 합니다.

두 표지판을 `Vec` 하나에 담는 것은 다른 메커니즘입니다 — `Box<dyn Sign>`,
포인터에 vtable을 더해 실행 시점에 찾아보는 것. 여기서는 필요 없습니다.
모든 호출 지점에서 구체 타입이 아직 보이기 때문입니다. 그것은 다음 지도의
질문이고, 둘 중 어느 것을 들고 있는지 아는 것이 그 질문이 묻는 바입니다.
'''
hints = [
  "impl Sign for Shop은 구조체 바깥에 씁니다. 트레이트는 무엇을 말하고, impl은 어떻게를 말합니다. 컴파일러는 첫 번째에서 두 번째를 추론해 주지 않습니다.",
  "Shop의 impl에서 tag를 아예 빼면 트레이트의 버전을 가져갑니다. Stop의 impl에 쓰면 Stop의 것이 이깁니다. 그것이 기본 메서드의 전부입니다.",
  "show<T: Sign>(sign: &T)는 제네릭이므로 호출되는 자리에서 타입이 알려져 있어야 합니다 — 즉 match 갈래 안, 방금 만든 것이 아직 보이는 곳입니다.",
  "둘을 함께 담는 Vec 하나에는 Box<dyn Sign>이 필요하고, 그것은 실행 시점 조회가 있는 다른 메커니즘입니다. 그것을 요구하는 게 아니며, 여기서 그것에 손을 뻗는 것은 트레이트에 관한 질문에 틀린 답을 하는 것입니다.",
]
