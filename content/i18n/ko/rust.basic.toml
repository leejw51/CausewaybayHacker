기능입니다 — `base`는 인터페이스가 아니고, 그것을 그렇게 지켜 주는 것이
컴파일러입니다. 중첩 모듈은 안의 함수만이 아니라 `mod` 줄 자체에도 `pub`이
필요합니다.
'''
hints = [
