[[quest]]
id    = "rust.basic.08.chars-bytes"
title = "글자와 숫자"
story = "빅토리아 파크의 사물함 번호: 글자와 숫자가 섞여 있다. 관리인은 숫자를 다 더하고 첫 글자를 외친다."
brief = '''
`&str`은 바이트입니다. `.chars()`는 문자 단위로, `.bytes()` /
`.as_bytes()`는 `u8` 단위로 걷습니다. `c.to_digit(10)`은 숫자 문자를
`Some(숫자)`로, 나머지는 `None`으로 바꾸므로 `filter_map`이 숫자만
남깁니다. 바이트는 숫자입니다: `b'a'`는 97이고, 글자 산수는
`(byte - b'a' + b'A') as char`입니다.

```
let digits: Vec<u32> = code.chars().filter_map(|c| c.to_digit(10)).collect();
let first = (code.as_bytes()[0] - b'a' + b'A') as char;
```

`// FILL` 주석이 있는 두 자리에 두 줄을 치세요. 코드는 항상 소문자
글자로 시작합니다.

```
input:  a1b2c3
output: 6
        A
```
'''
hints = [
  "code.chars().filter_map(|c| c.to_digit(10)).collect() — 그다음 (code.as_bytes()[0] - b'a' + b'A') as char.",
  "to_digit은 Option<u32>를 돌려주고 filter_map이 None을 버립니다. 바이트에서 b'a'를 빼면 a가 0이고, b'A'를 더하면 대문자에 닿습니다.",
]

