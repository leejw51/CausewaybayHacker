id    = "rust.basic.15.closures"
title = "봉사료"
story = "하이산 플레이스 푸드코트의 계산서 프린터는 모든 줄에 같은 요금을 더한다. 요금을 한 번 들었지만 첫 줄 전에 잊어버렸다."
brief = '''
클로저는 인라인으로 쓴 함수입니다: `|x| x + 1`. 건네받지 않아도 주변 스코프의
