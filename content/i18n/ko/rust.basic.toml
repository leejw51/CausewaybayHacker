[[quest]]
id    = "rust.basic.06.strings"
title = "바이트는 글자가 아니다"
story = "타임스 스퀘어 안내판이 銅鑼灣을 세 글자에서 자르는데, 나오는 것은 한 글자 반이다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. **바이트** 단위 길이
2. **문자** 단위 길이
