id    = "rust.basic.09.int-slices"
title = "줄의 한가운데"
story = "하이산 플레이스 대기열 카운터는 줄 한가운데 두 사람을 새 명단에 옮기고 뒤에 줄 전체를 붙이는데, 명단이 비어 있다."
