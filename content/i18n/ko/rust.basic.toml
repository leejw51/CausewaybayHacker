[[quest]]
id    = "rust.basic.12.iterator-chain"
title = "이워 스트리트 한 번에"
story = "이워 스트리트, 한 번 걷기: 짝수 가게만 남기고, 그 번호를 제곱하고, 열보다 큰 것을 전부 더한다. 인덱스도, 두 번째 반복문도 없다."
brief = '''
이터레이터 체인은 왼쪽에서 오른쪽으로 읽습니다. `.iter()`가 벡터를 걷고,
`.filter(|&&x| …)`가 클로저가 그렇다고 한 것만 남기고, `.map(|x| …)`이
변환하고, 마지막 `.collect()`나 `.sum()`이 값으로 바꿉니다. 그 마지막
호출 전에는 아무것도 실행되지 않습니다. `iter()`는 `&i64`를 내고,
`filter`는 그것의 참조를 보므로 숫자에 닿으려면 `&&x` 패턴이 됩니다.

```
let squares: Vec<i64> = nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect();
let big: i64 = nums.iter().filter(|&&x| x > 10).sum();
```

`// FILL` 주석이 있는 두 자리에 두 줄을 치세요.

```
input:  1 2 3 4 11 20
output: 4 16 400
        31
```
'''
hints = [
  "nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect() — 둘째는 .filter(|&&x| x > 10).sum().",
  "let에 적은 타입이 collect()와 sum()에게 무엇을 만들지 말해 줍니다. Vec<i64>와 i64가 없으면 컴파일러가 추론하지 못합니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.basic.13.fold-zip-windows"
title = "짝, 오르막, 누적"
story = "퍼시벌 스트리트의 트램 계수기가 하루치 숫자를 읽는다: 앞 시간보다 오른 시간이 몇 번인지, 전부의 곱, 그리고 각 숫자 옆에 그 시간."
brief = '''
면접 화면이 계속 묻는 어댑터 셋. 슬라이스의 `.windows(2)`는 이웃한 쌍을
원소 두 개짜리 슬라이스로 하나씩 냅니다. `.fold(start, |acc, x| …)`는
누적값 하나를 전체에 꿰어 갑니다. `.zip(…)`은 두 수열을 나란히 걷고,
`(0..).zip(&nums)`는 `enumerate`를 손으로 쓴 것입니다.

```
let ups = nums.windows(2).filter(|w| w[1] > w[0]).count();
let product = nums.iter().fold(1i64, |acc, &x| acc * x);
let pairs: Vec<String> = (0..).zip(&nums).map(|(i, x)| format!("{}:{}", i, x)).collect();
```

