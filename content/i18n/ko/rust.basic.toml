]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.lambdas"
title = "짝수 테이블"
story = "빅토리아 파크 푸드 페어는 테이블에 번호를 매기고 짝수 테이블만 제곱미터 부담금을 낸다. 클립보드의 부담금 합계는 0이다."
brief = '''
이터레이터 어댑터는 사슬로 이어집니다: `.iter()`가 `Vec`을 걷고, `.filter(…)`는
클로저가 예라고 한 원소만 남기며, `.map(…)`은 각 원소를 클로저의 반환값으로
바꾸고, `.sum()`이 더합니다. 끝의 `.sum()`이 당기기 전에는 아무것도 실행되지
않습니다. 클로저는 참조를 보므로 `filter`는 `&&x`를, `map`은 `&x`를 받습니다.

```
let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();
```

숫자들은 읽혀 있고 `total`은 출력됩니다. 자리 표시 `let total: i64 = 0;` 대신
저 줄을 입력하세요.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum();",
  "`let`의 `: i64`가 `sum`에게 무엇으로 더할지 알려 줍니다. 없으면 컴파일러가 어떤 숫자 타입인지 되묻습니다.",
]

