brief = '''
`Vec`은 제자리에서 뒤집힙니다: `v.reverse()`면 끝, 복사 없음. 문자열은
문자로 색인할 수 없으니 반복자를 통해 뒤집습니다: `s.chars().rev()`가 뒤에서
앞으로 걷고 `collect::<String>()`이 그것이 내놓는 것으로 새 문자열을 만듭니다.

