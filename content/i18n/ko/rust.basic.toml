middle.extend_from_slice(&v);
```

`v`는 입력에서 읽습니다. 두 자리표시자 자리에 위의 두 줄을 그대로 입력하세요.

```
input:  1 2 3 4
output: 2 3 1 2 3 4
        6
```
'''
hints = [
  "let mut middle: Vec<i64> = v[1..3].to_vec(); 그다음 middle.extend_from_slice(&v);",
  "Vec에 범위를 쓰면 슬라이스입니다. to_vec()이 extend를 할 수 있게 해 주는 복사입니다.",
]

