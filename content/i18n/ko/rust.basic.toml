[[quest]]
id    = "rust.basic.01.first-light"
title = "첫 불빛"
story = "06:40, 자딘스 바자 위. 커서만 깜박이고 회색 안내문은 사라졌다. 아직 기억으로 칠 수 있는 것은 전부 당신 것이다."
brief = '''
정확히 다음을 출력하세요:

```
hello, causewaybay
```

소문자, 쉼표 하나, 공백 하나, 한 줄. 그 외에는 아무것도 없어야 합니다.
'''
hints = [
  "println!은 매크로이므로 느낌표를 붙입니다.",
  "문자열은 정확해야 합니다: 소문자, 쉼표 하나, 그 뒤 공백 하나.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.bindings"
title = "요금표"
story = "퍼시벌 스트리트 전차 정류장의 요금표에는 숫자 하나만 남아 있고, 일일 요금과 월 정기권이 있던 자리는 두 칸 모두 비어 있다."
brief = '''
`let`은 값에 이름을 붙입니다. 타입은 콜론 뒤에 쓸 수 있고, `println!("{}", …)`은
중괄호 자리에 들어온 값을 출력한 뒤 줄을 바꿉니다. `i64`의 산술은 종이에
쓰는 것과 똑같이 씁니다.

```
println!("{}", n * n);
```

`n`은 이미 읽혀 있고 앞의 두 줄도 출력되어 있습니다. `// FILL` 주석 자리에 저
줄을 그대로 입력하세요: 세 번째 `println!`, `n` 곱하기 `n`입니다.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "println!(\"{}\", n * n);",
  "바로 위 두 줄과 같은 모양입니다. 두 번째 인자의 식만 달라집니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.basic.03.types"
title = "나눠 내는 계산서"
story = "퍼시벌 스트리트 매점, 커피 두 잔에 지폐 한 장. 계산기는 각자 몇 개인지, 남는 것이 얼마인지, 정확한 몫이 얼마인지 말해야 하는데 오늘은 세 줄이 모두 비어 있다."
brief = '''
정수 둘을 나누면 정수가 나옵니다: `7 / 2`는 `3`이고 `7 % 2`는 나머지 `1`입니다.
소수를 얻으려면 먼저 변환해야 합니다 — `as f64`가 정수를 부동소수점 수로
바꾸고, 포맷 문자열의 `{:.2}`는 소수점 아래 정확히 두 자리로 출력합니다.

```
println!("{:.2}", a as f64 / b as f64);
```

`a`와 `b`는 읽혀 있고 정수 나눗셈과 나머지는 출력되어 있습니다. `// FILL` 주석
자리에 저 줄을 입력하세요.

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "println!(\"{:.2}\", a as f64 / b as f64);",
  "나누기 전에 양쪽 모두 `as f64`로 변환하세요. 아니면 정수끼리 나눠져서 소수는 이미 사라진 뒤입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.strings"
title = "가게 간판"
story = "자딘스 바자의 간판 화가는 이름이 세 가지로 필요하다. 값을 매기려면 글자 수, 간판에는 대문자, 유리 안쪽에는 거울상으로."
brief = '''
`String`은 `.len()`으로 자기 길이를 알고 `.to_uppercase()`로 대문자 사본을
만듭니다. `.reverse()`는 없습니다: `.chars()`로 글자를 하나씩 걷고, `.rev()`로
방향을 돌린 뒤, `.collect()`로 새 `String`에 모읍니다. `let`에 적은 타입이
`collect`에게 무엇을 만들지 알려 줍니다.

```
let rev: String = line.chars().rev().collect();
```

줄은 읽혀 있고 길이와 대문자 형태는 출력되어 있습니다. `// FILL` 주석 아래의
자리 표시 `let rev` 대신 저 `let`을 입력하세요.

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "let rev: String = line.chars().rev().collect();",
  "`.chars()`는 글자를 도는 이터레이터이고, `.rev()`는 거꾸로 걷게 하며, `.collect()`는 `let`이 요구한 `String`을 만듭니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.loops"
title = "전차 정류장 세기"
story = "이워 스트리트 전차의 차장은 종이 띠에 정류장을 기록한다. 누적 합계와, 세 번째 정류장마다 표시 하나. 띠는 첫 줄 아래로 비어 있다."
brief = '''
`for` 루프는 범위를 걷습니다. `1..n`은 `n` 앞에서 멈추고, `1..=n`은 `n`을
포함합니다. 루프 변수는 매번 새로 바인딩되고, `+=`는 `mut` 합계에 더합니다.

```
for i in 1..=n {
    sum += i;
    if i % 3 == 0 {
        ticks += 1;
    }
}
```

`n`은 읽혀 있고, 합계 변수들은 선언되어 출력되며, 루프 본문도 적혀 있습니다.
자리 표시 `for i in 0..0 {` 대신 첫 줄 `for i in 1..=n {`을 입력하세요.

```
input:  6
output: 21
        2
```
'''
hints = [
  "for i in 1..=n {",
  "`..=`가 끝을 포함하는 범위입니다. `1..n`은 하나 모자라게 멈춰서 합이 `n`만큼 작아집니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.basic.06.functions"
title = "승차 카드"
story = "퍼시벌 스트리트 전차 정류장의 기계는 승차 카드를 판다. 처음 열 번은 한 가격, 나머지는 더 싸게. 오늘은 모든 카드의 합계가 0으로 찍힌다."
brief = '''
함수는 `fn 이름(매개변수: 타입) -> 반환타입 { 본문 }`입니다. 본문의 마지막 식은
세미콜론 없이 두면 그것이 반환값이 되고, `if … else …`도 식이므로 그 마지막
줄이 될 수 있습니다.

```
fn fare(rides: i64) -> i64 {
    if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }
}
```

`fare`는 선언되어 있고 `main`은 `n`을 읽어 `fare(n)`을 출력합니다. 자리 표시
`0` 대신 `if … else` 줄을 본문으로 입력하세요.

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { rides * 5 } else { 50 + (rides - 10) * 3 }",
  "`return`도 세미콜론도 없습니다. `if … else`가 마지막 식이므로 그 값이 `fare`의 반환값입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.basic.07.structs"
title = "가판대 카드"
story = "자딘스 바자의 모든 가판대에는 카드가 있다. 이름, 가격, 개수. 카드 프린터는 콜론과 0만 찍고 그 앞에는 아무것도 없다."
brief = '''
`struct`는 이름 붙은 필드를 묶습니다. 값은 각 필드를 이름으로 지정하는
리터럴로 만드는데, 지역 변수 이름이 필드 이름과 같으면 `name: name`을 `name`으로
줄일 수 있습니다. 메서드는 `impl` 블록 안에 살고 `&self`를 받아 그것을 통해
필드를 읽습니다.

```
impl Stall {
    fn total(&self) -> i64 {
        self.price * self.qty
    }
}

let stall = Stall { name, price, qty };
```

`Stall`과 그 `impl`은 선언되어 있고 `name`, `price`, `qty`는 읽혀 있습니다. 자리
표시 `0` 대신 `total`의 본문을, 자리 표시 리터럴 대신 `let stall` 리터럴을
입력하세요.

```
input:  mango 12 3
output: mango: 36
```
'''
hints = [
  "let stall = Stall { name, price, qty }; — 그리고 total 안에는: self.price * self.qty",
  "메서드 안에서는 `self`를 통해 필드에 닿습니다. `main`에서는 변수 이름이 이미 필드 이름과 같으니 리터럴에 이름만 나열하면 됩니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.basic.08.enums"
title = "노선의 색"
story = "타임스 스퀘어 아래 MTR 표지판은 노선 셋을 알고 각각 제 색으로 칠한다. 색 조회는 셋 모두에 빈 문자열을 돌려준다."
brief = '''
`enum`은 닫힌 변형(variant)의 집합이고, `match`는 변형마다 가지를 고릅니다. 각
팔(arm)은 `패턴 => 값,`이며, 컴파일러는 모든 변형에 팔이 있기를 요구합니다 —
하나라도 빠지면 빌드되지 않습니다.

```
let colour = match line {
    Line::Island => "blue",
    Line::TsuenWan => "red",
    Line::KwunTong => "green",
};
```

`Line`과 단어를 변형으로 바꾸는 `match`는 적혀 있고, 색깔 `match`의 첫 팔도
있습니다. `// FILL` 주석 자리에 나머지 두 팔을 입력하고 `_ => ""` 줄은
지우세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "Line::TsuenWan => \"red\", 그리고 Line::KwunTong => \"green\",",
  "세 변형 모두 팔이 생기면 `_ => \"\"` 포괄 팔은 도달할 수 없으니 없애도 됩니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.vector"
title = "하이산 플레이스의 줄"
story = "하이산 플레이스의 도어맨은 손님 무리가 도착할 때마다 인원수를 띠에 적는다. 무리가 몇인지, 첫 번째, 마지막, 합계를 말해야 하는데 띠는 비어 있다."
brief = '''
`Vec<T>`는 늘어나는 리스트이고, 하나에 하는 일은 이 네 가지입니다. `.push(x)`는 끝에
추가합니다. `.remove(i)`는 인덱스 `i`의 원소를 빼내고 뒤의 것들을 앞으로 당깁니다.
`v[i] = x`는 `i`의 원소를 제자리에서 고치고, `.sort()`는 전체를 오름차순으로
정렬합니다 — 넷 중 무엇을 하든 `Vec`은 `mut`여야 합니다.

```
v.push(100);
v.remove(0);
v[0] = -1;
v.sort();
```

`v`에는 한 줄의 정수들이 들어 있고, 결과와 길이가 출력됩니다. 네 개의 `// FILL` 주석
자리에 네 줄을 그 순서대로 입력하세요.

```
input:  1 9 5 2
output: -1 2 5 100
        4
```
'''
hints = [
  "v.push(100); 다음 v.remove(0); 다음 v[0] = -1; 다음 v.sort(); — 추가, 삭제, 수정, 정렬.",
  "remove(0)은 전부 앞으로 당기므로 두 번째였던 원소가 v[0]이 되고, 수정이 바꾸는 것은 그것입니다. sort()는 남은 것을 정렬합니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.basic.10.maps"
title = "주문 메모장"
story = "이워 스트리트의 차찬텡은 모든 주문을 한 번씩 외치고, 주방은 요리별 집계를 알파벳 순으로 원한다. 메모장에는 요리만 있고 숫자가 없다."
brief = '''
`BTreeMap`은 키마다 값을 하나 담고 키를 스스로 정렬해 둡니다 — 정렬할 것이 없고, 순회하면
이미 순서대로입니다. `.insert(k, v)`는 키를 추가하고(있으면 값을 바꾸고), `.remove(&k)`는
키를 빼내고, `.get_mut(&k)`는 있는 값의 가변 참조를 돌려줍니다 — `Option`이므로
unwrap하고, `*`가 그것을 통해 대입하게 해 줍니다.

```
count.insert("bill".to_string(), 1);
count.remove("tea");
*count.get_mut("bill").unwrap() = 9;
```

`count`는 이미 한 줄의 단어를 세고 있고 키 순서로 출력됩니다. `// FILL` 주석 자리에
세 줄을 그 순서대로 입력하세요.

```
input:  tea toast tea
output: bill 9
        toast 1
```
'''
hints = [
  "count.insert(\"bill\".to_string(), 1); 다음 count.remove(\"tea\"); 다음 *count.get_mut(\"bill\").unwrap() = 9;",
  "키가 String이므로 insert는 \"bill\".to_string()을 받습니다; remove와 get_mut는 &str을 받는데, \"tea\"가 이미 그것입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.basic.11.sets"
title = "도장 수첩"
story = "퍼시벌 스트리트 매점의 적립 수첩에는 방문마다 도장이 하나씩 찍히고, 같은 가판대가 두 번 찍는다. 점원은 서로 다른 가판대가 몇인지, 그 번호를 순서대로 알아야 한다."
brief = '''
집합은 각 값을 한 번만 담고, `BTreeSet`은 스스로 정렬해 두므로 호출할 정렬이 없습니다 —
순회하면 이미 순서대로입니다. `.insert(x)`는 값을 추가하고(이미 있으면 아무것도 안 하고),
`.remove(&x)`는 하나를 빼내며 있었는지를 돌려줍니다. 집합에는 "수정"이 없습니다: 값이
곧 키이므로, 수정은 옛 값을 지우고 새 값을 넣는 것입니다 — 세 번째 줄이 하는 일이고,
옛 값이 있었을 때만입니다.

```
seen.insert(100);
seen.remove(&1);
if seen.remove(&2) { seen.insert(20); }
```

`seen`은 이미 한 줄의 서로 다른 정수들을 담고 있고, 크기와 내용이 출력됩니다. `// FILL`
주석 자리에 세 줄을 그 순서대로 입력하세요.

```
input:  3 1 3 2 1
output: 3
        3 20 100
```
'''
hints = [
  "seen.insert(100); 다음 seen.remove(&1); 다음 if seen.remove(&2) { seen.insert(20); }",
  "remove는 참조(&1)를 받고 값이 있었으면 true를 돌려줍니다 — if가 쓰는 것이 그것이라, 2가 없는 집합은 그대로 둡니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.basic.12.stack-queue"
title = "접시 더미"
story = "보링턴 로드의 딤섬 카운터에서 접시는 쌓여서 위에서 빠지고, 번호표는 줄 앞에서 빠진다. 두 더미 모두 손대지 않은 채 놓여 있다."
brief = '''
`Vec`은 스택입니다: `.push(x)`는 위에 추가하고, `.pop()`은 맨 위를 제거하고(`Option`으로),
`.last_mut()`는 맨 위의 가변 참조라 제자리에서 고칠 수 있습니다. `VecDeque`는 큐입니다:
`.push_back(x)`는 뒤에 서고 `.pop_front()`는 앞에서 나갑니다 — 그쪽은 이미 작성돼 있습니다.

```
stack.push(42);
stack.pop();
*stack.last_mut().unwrap() = 0;
```

두 컨테이너 모두 한 줄의 정수들을 담고 있습니다. `// FILL` 주석 자리에 스택 세 줄을 그
순서대로 입력하세요; 그러면 스택이 아래에서 위로 출력되고, 다음 줄에 큐의 앞이 출력됩니다.

```
input:  1 2 3 4
output: 1 2 3 0
        1
```
'''
hints = [
  "stack.push(42); 다음 stack.pop(); 다음 *stack.last_mut().unwrap() = 0;",
  "pop이 42를 바로 다시 빼내므로, 수정은 그 전에 맨 위였던 값에 닿습니다 — 마지막에 들어온 것이 먼저 나갑니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.basic.13.sorting"
title = "가격 사다리"
story = "보링턴 로드의 과일 가판대는 게시판에는 싼 순으로, 사장에게는 비싼 순으로 가격을 적는다. 두 게시판 모두 상자가 트럭에서 내려온 순서 그대로다."
brief = '''
`.sort()`는 `mut` `Vec`을 제자리에서 오름차순으로 정렬합니다. 다른 순서가
필요하면 원소 둘을 비교하는 클로저를 받는 `.sort_by`가 있습니다: `a.cmp(b)`는
오름차순이니 `b.cmp(a)`는 내림차순입니다.

```
asc.sort();
desc.sort_by(|a, b| b.cmp(a));
```

숫자의 사본 둘이 만들어져 있고 둘 다 출력됩니다. `// FILL` 주석 자리에 저 두
줄을 입력하세요.

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "asc.sort(); — 그리고 desc.sort_by(|a, b| b.cmp(a));",
  "둘 다 제자리에서 정렬하고 아무것도 돌려주지 않으므로, 대입할 것이 아니라 한 줄짜리 문장입니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.basic.14.sort-by-key"
title = "순위표"
story = "타임스 스퀘어 위 오락실은 최고 점수를 높은 순으로, 동점은 이름 순으로 게시한다. 게시판은 아직 사람들이 들어온 순서 그대로다."
brief = '''
`.sort_by_key`는 원소마다 클로저가 돌려주는 값으로 정렬합니다. 튜플은 필드
순서대로 비교되므로 튜플 키는 첫 필드로 정렬하고 같으면 두 번째 필드로 가르며,
필드를 `std::cmp::Reverse`로 감싸면 그 필드만 내림차순이 됩니다.

```
rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));
```

행은 `(String, i64)` 쌍으로 읽혀 출력됩니다. `// FILL` 주석 자리에 저 줄을
입력하세요.

```
input:  3
        mei 90
        alex 95
        kit 90
output: alex 95
        kit 90
        mei 90
```
'''
hints = [
  "rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone()));",
  "키는 튜플입니다: `Reverse(score)`가 점수를 내림차순으로 만들고, 그 뒤의 `name.clone()`이 동점을 알파벳순으로 가릅니다.",
]

