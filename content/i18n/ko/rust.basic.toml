id    = "rust.basic.06.slices"
title = "줄의 한가운데"
story = "하이산 플레이스의 줄에서 맨 앞과 맨 뒤를 뺀 사람들: 실제로 기다리고 있는 사람들."
brief = '''
`&v[a..b]`는 슬라이스입니다. `Vec`의 일부를 빌려 보는 창으로, `a`부터
