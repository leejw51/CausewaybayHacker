[[quest]]
id    = "rust.basic.09.option"
title = "없을 수도 있다"
story = "한가한 아침의 타임스 스퀘어 게시판. 최고 입찰이 없을 수도 있고, 짝수 표 번호가 없을 수도 있다. 게시판은 짐작하는 대신 그렇다고 말해야 한다."
brief = '''
`Option<T>`는 `Some(값)` 아니면 `None`이고, 컴파일러는 `None`일 때 어떻게
할지를 반드시 말하게 합니다. `if let Some(m) = …`은 값이 있을 때만 블록을
실행합니다. `.unwrap_or(0)`은 기본값을 줍니다. `.find(…)`는 첫 번째
일치를 `Option<&T>`로 돌려주고, `.copied()`가 `Option<&i64>`를
`Option<i64>`로 바꿉니다.

```
if let Some(m) = nums.iter().max() { println!("MAX {}", m); }
let even = nums.iter().find(|&&x| x % 2 == 0).copied().unwrap_or(0);
```

`// FILL` 주석이 있는 두 자리에 두 줄을 치세요. 입력이 비어 있으면 첫
줄은 아무것도 출력하지 않고 둘째 줄은 `0`입니다.

```
input:  3 5 8 1
output: MAX 8
        8
```
'''
hints = [
  "if let Some(m) = nums.iter().max() { println!(\"MAX {}\", m); } 그리고 find(...).copied().unwrap_or(0).",
  "빈 이터레이터의 max()는 None이고 if let은 그냥 건너뜁니다. find는 Option<&i64>를 돌려주므로 copied()로 Option<i64>를 만들어야 unwrap_or(0)의 타입이 맞습니다.",
]

