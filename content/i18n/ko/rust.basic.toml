id    = "rust.basic.17.threads"
title = "계산대 넷"
story = "자딘스 바자는 계산대 넷을 동시에 열고 각각 제 영수증을 처리한다. 매니저가 계산대 순서로 거두는데 쟁반은 빈 채로 돌아온다."
brief = '''
`thread::spawn`은 클로저를 실행하는 스레드를 시작하고 `JoinHandle`을
돌려줍니다. `move`는 클로저가 쓰는 것의 사본을 클로저 자신의 것으로 주어,
사라졌을지 모르는 스택 프레임을 스레드가 빌리지 않게 합니다. `.join()`은
스레드를 기다렸다가 클로저의 반환값을 `Result`로 돌려줍니다.

```
handles.push(thread::spawn(move || x * x));
squares.push(h.join().unwrap());
```

두 루프는 적혀 있습니다. 첫 번째 `// FILL` 주석 자리에 첫 줄을, 두 번째 자리에
둘째 줄을 입력하세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — 그다음 squares.push(h.join().unwrap());",
  "핸들을 넣은 순서대로 join하는 것이 출력을 입력 순서로 유지합니다. 스레드 자체는 아무 때나 끝나도 됩니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.basic.18.binary-tree"
title = "자동 완성"
story = "퍼시벌 스트리트 전화 부스, 회색 안내문이 돌아와 천 번은 본 트리를 내민다. 직접 노드 하나씩 키우는 트리에는 완성이 없고, 그때까지 트리는 비어 있다."
brief = '''
이진 탐색 트리는 값 하나와 선택적 자식 둘 `Option<Box<Node>>`을 가진
`Node`입니다: `None`은 빈 서브트리, `Some(Box::new(…))`는 실제 서브트리입니다.
삽입은 재귀입니다 — 빈 서브트리는 새 잎이 되고, 실제 서브트리는 값을 속한 쪽으로
내려보낸 뒤 돌아온 서브트리를 저장합니다. `.take()`는 자식을 `Option`에서 꺼내
재귀 호출에 건네고 다시 넣을 수 있게 합니다.

```
if value < n.value {
    n.left = insert(n.left.take(), value);
} else {
    n.right = insert(n.right.take(), value);
}
```

`Node`, `inorder`, `height`, `main`과 `insert`의 뼈대는 그 `if … else`까지 적혀
있습니다. `// FILL` 주석 자리에 대입문 두 줄을 입력하세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left.take(), value); — 그리고 n.right = insert(n.right.take(), value);",
  "`take()`는 뒤에 `None`을 남기고 내려보낼 자식을 줍니다. 호출 결과를 대입하면 자란 서브트리가 제자리로 돌아갑니다.",
]

