id    = "rust.basic.06.floats"
title = "저울의 두 눈금"
story = "자딘스 바자의 과일 저울은 배정밀도 무게를 간직하고 다이얼에는 단정밀도로 보여 주는데, 오늘 아침엔 둘 다 0이다."
brief = '''
`f64`는 64비트 부동소수점 수로, 달리 정해진 게 없으면 쓰는 것이고, `f32`는
