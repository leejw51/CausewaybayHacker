[[quest]]
id    = "rust.basic.10.result"
title = "숫자가 아닌 줄"
story = "퍼시벌 스트리트의 계산대가 가격 한 줄을 받는다. 그중 하나가 단어다. 계산대는 죽지 않는다. 어느 줄이 왜 잘못됐는지 말한다."
brief = '''
`Result<T, E>`는 `Ok(값)` 아니면 `Err(오류)`입니다. `Result`를 돌려주는
함수 안에서 `?` 연산자는 `Ok`를 풀어 주고, `Err`이면 그 자리에서 호출한
쪽으로 **반환**합니다 — `match` 대신 글자 하나. `"12".parse::<i64>()`는
`Result<i64, ParseIntError>`입니다.

```
out.push(tok.parse::<i64>()?);
```

`parse_all`은 벡터 아니면 첫 오류를 돌려주고, `main`이 그것을 match합니다.
`// FILL` 주석이 있는 자리에 `?`가 있는 줄을 치세요.

```
input:  1 2 3
output: 6
```
'''
hints = [
  "out.push(tok.parse::<i64>()?);",
  "?는 반환 타입이 Result(또는 Option)이고 오류 타입이 맞는 함수 안에서만 됩니다 — 여기서는 ParseIntError이고, parse가 주는 것이 정확히 그것입니다.",
]

