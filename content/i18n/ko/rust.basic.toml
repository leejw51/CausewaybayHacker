story = "타임스 스퀘어 기계실의 일지 한 권, 그것을 쥔 직원 둘. 어느 쪽도 혼자 주인이 아니고, 빌림 검사는 컴파일러에서 일지 자체로 옮겨 간다."
brief = '''
`Rc<T>`는 참조 계수 소유자입니다: `Rc::clone(&log)`은 **같은** 값의 두
번째 손잡이를 만들지, 사본을 만들지 않습니다. `RefCell<T>`는 공유한
손잡이를 통해 고치게 해 줍니다 — `.borrow_mut()`가 빌림 규칙을 실행
시간에 검사하고, 어기면 패닉합니다. `Rc<RefCell<…>>`가 단일 스레드의
공유되고 변경 가능한 값입니다.

```
let writer = Rc::clone(&log);
```

`log`는 만들어져 있고 반복문이 `writer`를 통해 씁니다. `// FILL` 주석이
있는 자리에 두 번째 손잡이를 치세요.

```
input:  1 2 3
output: 2
        [2, 4, 6]
```
'''
hints = [
  "let writer = Rc::clone(&log);",
  "log.clone()도 같은 일을 합니다. Rc::clone(&log)은 계수만 올라갔다고 소리 내어 말하는 표기입니다. strong_count가 2인 것이 증거입니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.basic.27.closures"
title = "클로저 세 종류"
story = "럭키맥 키오스크의 봉사료: 수수료를 더하고, 곁다리로 몇 번 불렸는지 세는 클로저. 두 번째 것은 부를 수 있는 무언가만 원하는 함수에 넘겨진다."
brief = '''
클로저는 자기가 쓰는 것을 붙잡습니다. 읽기만 하면 `Fn`, 붙잡은 변수를
**바꾸면** `FnMut`이고 `let mut`로 묶어야 하며, 값을 꺼내 가면
`FnOnce`입니다. 함수는 바운드로 셋 중 무엇이든 받을 수 있습니다:
`f: impl Fn(i64) -> i64`. 앞의 `move`는 값으로 붙잡기를 강제하고,
스레드가 원하는 것이 그것입니다.

```
let mut charge = |x: i64| { seen += 1; x + fee };
println!("{}", apply(|x| x * fee, 10));
```

`apply`는 적혀 있습니다. `// FILL` 주석이 있는 자리에 `FnMut` 클로저와
호출을 치세요.

```
input:  1 2 3
output: 3 4 5
        3
        20
```
'''
hints = [
  "let mut charge = |x: i64| { seen += 1; x + fee }; 그다음 apply(|x| x * fee, 10)",
  "charge는 쓰이는 동안 seen을 가변으로 빌리므로 seen의 println!은 마지막 호출 뒤에 와야 합니다 — 실제로 그렇습니다. apply에 넘기는 클로저는 fee를 읽기만 하므로 그냥 Fn입니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.basic.28.threads"
title = "계산대 넷"
story = "자딘스 바자가 계산대 넷을 한꺼번에 열고 각자 자기 영수증을 처리한다. 매니저는 계산대 순서대로 걷고, 쟁반은 비어서 돌아온다."
brief = '''
`thread::spawn`은 클로저를 실행하는 스레드를 시작하고 `JoinHandle`을
돌려줍니다. `move`는 클로저가 쓰는 것의 사본을 클로저에 주어, 스레드가
사라졌을지 모를 스택 프레임을 빌리지 않게 합니다. `.join()`은 스레드를
기다리고 클로저가 돌려준 것을 `Result`로 돌려줍니다.

```
handles.push(thread::spawn(move || x * x));
squares.push(h.join().unwrap());
```

두 반복문은 적혀 있습니다. 첫 `// FILL` 주석 자리에 첫 줄을, 둘째 자리에
둘째 줄을 치세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — 그다음 squares.push(h.join().unwrap());",
  "핸들을 넣은 순서대로 join하는 것이 출력을 입력 순서로 유지합니다. 스레드 자체는 아무 때나 끝납니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.basic.29.arc-mutex"
title = "서랍 하나, 손은 여럿"
story = "타임스 스퀘어의 현금 서랍 하나와 모든 계산대에서 뻗어 오는 손. 손마다 서랍의 손잡이를 하나씩 갖고, 서랍은 한 번에 한 손에게만 열린다."
brief = '''
`Arc<T>`는 스레드용 `Rc`입니다: `Arc::clone(&total)`이 스레드마다 값
하나의 손잡이를 줍니다. `Mutex<T>`가 그것을 지킵니다: `.lock().unwrap()`이
잠금을 기다렸다가 값으로 역참조되는 가드를 돌려주고, 가드가 스코프를
벗어나면 잠금이 풀립니다. `*guard += x`가 그것을 통해 씁니다.

```
let total = Arc::clone(&total);
*total.lock().unwrap() += x;
```

`spawn` 앞에 clone을, 그 안에 잠근 덧셈을, `// FILL` 주석이 있는 자리에
치세요. 이름을 가리는(shadowing) 것이 관용구입니다.

```
input:  1 2 3 4
output: 10
        1
```
'''
hints = [
  "spawn 앞에 let total = Arc::clone(&total);, 안에 *total.lock().unwrap() += x;",
  "clone이 없으면 move가 하나뿐인 Arc를 첫 스레드로 가져가서 둘째 반복이 E0382입니다. 끝에 찍히는 계수가 1인 것은 모든 clone이 자기 스레드와 함께 버려졌기 때문입니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.basic.30.atomics-rwlock"
title = "단어 하나, 잠금 없음"
story = "빅토리아 파크의 회전문 계수기는 모든 출입구가 줄 서지 않고 올리고, 게시판은 많은 이가 읽고 적은 이가 쓴다."
brief = '''
정수 하나에는 뮤텍스보다 원자값이 낫습니다:
`AtomicUsize::fetch_add(1, Ordering::SeqCst)`가 아무 스레드에서나 잠금
없이 올리고, `.load(Ordering::SeqCst)`가 읽습니다. 쓰기보다 읽기가 훨씬
많은 더 큰 값에는 `RwLock`이 여러 독자를 한꺼번에(`.read()`), 작성자는
하나(`.write()`) 허용하고, 각각 `Mutex`처럼 가드를 돌려줍니다.

```
hits.fetch_add(1, Ordering::SeqCst);
board.write().unwrap().push(x);
```

clone과 spawn은 적혀 있습니다. 스레드 안, `// FILL` 주석이 있는 자리에
올리기와 쓰기를 치세요.

```
input:  4 2 9
output: 2 4 9
        3
```
'''
hints = [
  "hits.fetch_add(1, Ordering::SeqCst); 그리고 board.write().unwrap().push(x);",
  "fetch_add는 &self를 받습니다. 원자값에 Mutex도 mut도 필요 없는 이유입니다. 여기서 write 가드는 임시값이라 문장이 끝나면 잠금이 풀립니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "rust.basic.31.channel"
title = "창구 하나"
story = "타임스 스퀘어 주방 뒤편의 창구: 요리사 하나가 보내고, 패스가 받고, 창구가 그의 뒤에서 닫히기에 패스는 요리사가 끝났음을 안다."
brief = '''
`mpsc::channel()`은 송신자와 수신자를 돌려줍니다. 송신자는 스레드로
이동하고 `tx.send(v)`가 값을 건네줍니다. 반대편의 `rx.iter()`는 보내진
것을 전부 순서대로 내고, **모든 송신자가 버려지면 끝납니다** — 여기서는
생산자 스레드가 끝나며 그 `tx`가 함께 사라질 때.

```
let (tx, rx) = mpsc::channel::<i64>();
let got: Vec<i64> = rx.iter().collect();
```

생산자 스레드는 적혀 있습니다. `// FILL` 주석이 있는 자리에 채널과
모아 받는 줄을 치세요.

```
input:  1 2 3
output: 10 20 30
```
'''
hints = [
  "let (tx, rx) = mpsc::channel::<i64>(); 그리고 let got: Vec<i64> = rx.iter().collect();",
  "rx.iter()는 채널이 닫힐 때까지 막고, 채널은 생산자 클로저 끝에서 tx가 버려질 때 닫힙니다 — 그래서 collect는 정확히 생산자가 끝날 때 끝납니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.basic.32.producers"
title = "요리사는 여럿, 패스는 하나"
story = "타임스 스퀘어 주방의 모든 요리사가 같은 창구로 보내는데, 패스는 자기가 쥐고 있는 줄도 잊은 창구 열쇠를 하나 갖고 있다. 그것을 내려놓기 전까지 패스는 오지 않을 요리사를 기다린다."
brief = '''
*mpsc*는 다중 생산자입니다: `tx.clone()`이 스레드마다 하나의 채널로
가는 자기 송신자를 줍니다. 수신 반복은 **모든** 송신자가 사라져야
끝나는데, 원래 `tx`가 아직 `main`에 앉아 있습니다. `drop(tx)`가 그것을
내려놓습니다. 그 줄이 없으면 프로그램은 영원히 끝나지 않습니다.

```
let tx = tx.clone();
drop(tx);
```

`spawn` 앞에 clone을, 반복문 뒤에 drop을, `// FILL` 주석이 있는 자리에
치세요. 결과는 인덱스로 정렬되므로 스레드가 어떤 순서로 돌든 상관없습니다.

```
input:  1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```
'''
hints = [
  "반복문 안에 let tx = tx.clone();, 뒤에 drop(tx);",
  "clone이 없으면 move가 하나뿐인 송신자를 첫 스레드로 가져가서 둘째 반복이 E0382입니다. drop이 없으면 rx.iter()가 main 자신의 송신자를 영원히 기다립니다 — 실행이 실패하는 대신 타임아웃됩니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "rust.basic.33.worker-pool"
title = "창구"
story = "12:30, 타임스 스퀘어. 주문서 한 장, 요리사 셋, 패스로 돌아가는 창구 하나. 주문서는 잠금 아래 공유되고, 요리사는 표 한 장 뜯을 동안만 그것을 쥐고, 주문서가 비면 요리사들은 집에 가고 패스가 접시를 센다."
brief = '''
워커 풀은 채널 둘과 잠금 하나입니다. 작업은 `job_tx`로 내려가고,
워커들은 `Arc<Mutex<…>>` 뒤의 `job_rx` 하나를 공유하며 각자
`job_rx.lock().unwrap().recv()`로 작업을 하나 가져갑니다 — 잠금은
임시값이라 그 문장이 끝나면 풀리고, 요리는 잠금 **바깥**에서 일어납니다.
`recv()`는 모든 `job_tx`가 버려지면 `Err`을 돌려주고, 워커는 그것으로
멈출 때를 압니다. 결과는 `done_tx`로 돌아오고, 패스는 모든 `done_tx` —
워커들의 clone *그리고* main 자신의 것 — 가 사라질 때까지 모읍니다.

```
let job = job_rx.lock().unwrap().recv();
drop(job_tx);
drop(done_tx);
```

풀, 반복문, 수집은 적혀 있습니다. 워커 안에 잠근 수신을, `main`에 두
drop을, `// FILL` 주석이 있는 자리에 치세요. drop 어느 하나가 빠져도
데드락입니다.

```
input:  1 2 3
output: 0 2
        1 5
        2 10
```
'''
hints = [
  "워커에 let job = job_rx.lock().unwrap().recv();, 보내기 뒤에 drop(job_tx);와 drop(done_tx);",
  "lock()의 가드는 그 let의 임시값이라 세미콜론에서 버려지고, 이 워커가 요리하는 동안 다른 워커가 다음 작업을 가져갈 수 있습니다. cook()에 걸쳐 쥐고 있으면 풀이 직렬화됩니다.",
  "drop(job_tx)가 워커의 recv()를 Err로 바꾸는 것이고, drop(done_tx)가 워커들이 자기 것을 버린 뒤 done_rx.iter()가 끝나게 하는 것입니다. 어느 쪽이든 잊으면 프로그램은 영원히 기다립니다.",
]
