함수는 벡터 전체(`&nums`)든 그 일부 창이든 같은 방식으로 받습니다. `..`
하나만 쓰면 전부, `a..`는 끝까지입니다.

```
let middle = &nums[1..nums.len() - 1];
```

`total`과 `println!` 세 줄은 적혀 있습니다. `// FILL` 주석이 있는 자리에
슬라이스를 치세요.

```
input:  5 1 2 3 9
output: 6
        20
        3
```
'''
hints = [
  "let middle = &nums[1..nums.len() - 1];",
  "범위의 끝은 포함하지 않으므로 len() - 1은 마지막 원소 바로 앞에서 멈춥니다. 앞의 &가 벡터에서 꺼내 가는 대신 빌리게 만듭니다.",
]

