[[quest]]
id    = "rust.basic.04.clone"
title = "두 번째 사본"
story = "하이산 플레이스의 명단 두 장: 문지기가 도착 순서대로 들고 있는 것과 매니저가 정렬하는 것. 매니저 것을 정렬해도 문지기 것은 건드리면 안 된다."
brief = '''
이동은 주인을 하나만 남깁니다. 둘이 필요하면 `.clone()`이 깊은 복사를
만들고, 그때부터 둘은 서로 독립입니다. 작고 단순한 값 — `i64`, `bool`,
`char`, `f64`, 그것들의 튜플 — 은 `Copy`라서 `let b = a;`가 복사하고 `a`는
clone 없이도 계속 쓸 수 있습니다.

```
let mut sorted = names.clone();
```

이름은 읽혀 있고 `sorted.sort()`와 `println!` 두 줄은 적혀 있습니다.
`// FILL` 주석이 있는 자리에 clone을 쳐서 원래 순서가 살아남게 하세요.

```
input:  MEI BO ALEX
output: MEI BO ALEX
        ALEX BO MEI
```
'''
hints = [
  "let mut sorted = names.clone(); — sort()가 제자리에서 바꾸므로 mut입니다.",
  "let mut sorted = names;도 컴파일은 되지만, 그러면 names가 사라지고 첫 println!이 E0382가 됩니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.exchange"
title = "교환"
story = "자딘스 바자의 두 계산대가 교대 시간에 서랍을 맞바꾸고, 옛 서랍은 들어 올려지고 빈 서랍이 그 자리에 놓인다. 복사되는 것은 없다. 물건이 손을 바꾼다."
brief = '''
`std::mem`은 값을 복사 없이 교환합니다. `swap(&mut a, &mut b)`는 두 이름이
쥔 것을 맞바꿉니다. `take(&mut a)`는 값을 꺼내 오고 그 타입의 기본값 —
빈 `String`, 빈 `Vec`, `0` — 을 뒤에 남깁니다. 그래서 `&mut` 안에 있는
것을 소유할 수 있습니다. `replace(&mut a, v)`는 같은 일을 하되 당신이 고른
값을 남깁니다.

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

두 줄이 `a`와 `b`로 읽힙니다. `// FILL` 주석이 있는 자리에 swap과 take를
치세요.

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
hints = [
  "std::mem::swap(&mut a, &mut b); 그다음 let taken = std::mem::take(&mut a);",
  "둘 다 &mut를 받습니다. 값은 제자리에 있고 내용물만 움직입니다. take 뒤의 a는 빈 String이지, 이동되어 사라진 것이 아닙니다 — 여전히 쓸 수 있습니다.",
]

