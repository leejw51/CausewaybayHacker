[[quest]]
id    = "rust.basic.11.match"
title = "숫자의 모양"
story = "빅토리아 파크의 개찰구가 표 번호를 나눈다: 0, 한 자리, 짝수, 홀수. 네 갈래, 그리고 빠져나가는 것은 없다."
brief = '''
`match`는 모든 경우를 덮어야 하고, 각 갈래는 패턴입니다: 리터럴, 범위
`1..=9`, 가드가 붙은 바인딩 `x if x % 2 == 0`, 나머지를 위한 `_`. 맞는
첫 갈래가 이기므로 순서가 중요합니다. 표현식이기도 해서, 각 갈래의 값이
`match` 전체의 값이 됩니다.

```
0 => "ZERO",
1..=9 => "ONE DIGIT",
x if x % 2 == 0 => "EVEN",
_ => "ODD",
```

`match`는 `TODO`라고 말하는 갈래 하나로 열려 있습니다. 그것을 저 네
갈래로, 그 순서대로 바꾸세요.

```
input:  12
output: EVEN
```
'''
hints = [
  "0 => \"ZERO\", 1..=9 => \"ONE DIGIT\", x if x % 2 == 0 => \"EVEN\", _ => \"ODD\",",
  "가드 갈래를 _ 앞에 두세요. 아니면 절대 실행되지 않습니다. 1..=9는 양 끝을 포함하고, 1..9였다면 9는 가드로 넘어갑니다.",
]

