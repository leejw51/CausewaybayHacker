# ZIG LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/zig/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks and identifiers are
# copied verbatim.

pack   = "zig.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet_advanced.01.generic-fn"
title = "어떤 둘이든 더 큰 것"
story = "22:00, 해저터널 입구. 관제실은 요금 둘, 무게 둘, 타임스탬프 둘을 비교하고, 비교를 한 번만 쓰고 싶다."
brief = '''
`max`는 한 타입의 값 둘 중 더 큰 것을 돌려주고, 타입을 명시해서 호출됩니다:
`max(i64, 3, 7)`, `max(f64, 2.5, 1.0)`. 그것을 여는 줄은 어느 것일까요?

```
// ____
    return if (a > b) a else b;
}
```
'''
hints = [
  "타입은 컴파일 시간에 알려진 첫 인자이고, 나머지 매개변수 둘과 반환은 그것으로 적습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet_advanced.02.this"
title = "아직 이름 없는 타입"
story = "컨테이너 스택은 어떤 화물이든 받는다. 그 안에서 메서드들은 자기가 쓰이고 있는 struct의 이름이 필요하다."
brief = '''
`Stack`이 돌려주는 struct 안에서, `push`가 `self: *Self`를 받을 수 있도록
`Self`를 그 struct 자신의 타입에 묶으세요.

```
fn Stack(comptime T: type) type {
    return struct {
        // ____
        items: std.ArrayList(T) = .empty,
        pub fn push(self: *Self, gpa: std.mem.Allocator, v: T) !void {
            try self.items.append(gpa, v);
        }
    };
}
```
'''
hints = [
  "익명 struct에는 자기를 가리킬 이름이 없습니다. 빌트인 하나가 정의되고 있는 가장 안쪽의 struct, enum, union을 돌려줍니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.cheatsheet_advanced.03.fn-pointer"
title = "오늘 밤의 규칙은"
story = "2번 부스의 요금 규칙은 자정에 바뀐다: 전에는 두 배, 후에는 부호 반전. 부스는 규칙을 변수에 들고 호출한다."
brief = '''
`double`과 `negate`는 둘 다 `fn (i32) i32`입니다. `double`로 시작해 나중에
`negate`로 재대입할 수 있고 `f(3)`으로 호출되는 **런타임 변수** `f`를
선언하세요.
'''
hints = [
  "맨 `fn` 타입은 comptime 전용이라 `var`에 살 수 없습니다. 런타임 함수 값은 함수를 가리키는 포인터이고, 함수는 `const`입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet_advanced.04.inline-for-fields"
title = "모든 필드를, 이름으로"
story = "야간 감사는 건네받은 모든 레코드의 모든 필드를 struct가 무엇이든, 필드 이름을 듣지 않고도 출력한다."
brief = '''
`dump`는 받은 어떤 struct든 각 필드의 이름과 값을 출력합니다. `f.name`을
`@field`에 쓸 수 있도록 필드에 대한 루프를 여세요 (Zig 0.16: type-info
태그는 소문자로 씁니다).

```
fn dump(v: anytype) void {
    const T = @TypeOf(v);
    if (@typeInfo(T) != .@"struct") @compileError("not a struct: " ++ @typeName(T));
    // ____
        std.debug.print("{s}: {any}\n", .{ f.name, @field(v, f.name) });
    }
}
```
'''
hints = [
  "필드 목록은 컴파일 시간 데이터라 평범한 루프로는 인덱싱할 수 없습니다. 루프는 펼쳐져야 하고, `struct`는 키워드라 필드 이름으로 쓰려면 인용이 필요합니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.cheatsheet_advanced.05.has-field"
title = "번호판이 있는가"
story = "자동차에는 번호판이 있고 자전거에는 없다. 라벨 함수 하나가 둘 다 받고, 컴파일 시간에 무엇을 들고 있는지 알아야 한다."
brief = '''
`label`은 `Car`(필드 `plate`가 있음)와 `Bike`(필드 `plate`도, 그 이름의
선언도 없음)로 호출됩니다. `Car`에는 분기가 택해지고 `Bike`에는 잘려
나가서 `v.plate`가 존재하는 곳에서만 컴파일되도록 `if`를 여세요.

```
fn label(v: anytype) []const u8 {
    const T = @TypeOf(v);
    // ____
        return v.plate;
    } else return "no plate";
}
```
'''
hints = [
  "빌트인 하나가 타입에게 문자열로 주어진 이름의 필드가 있는지 묻습니다. 선언에 대해 묻는 것은 필드에는 아니오라고 답합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet_advanced.06.comptime-var"
title = "빌드 전에 세어 둔다"
story = "다섯 차선의 제곱 테이블은 프로그램이 돌기 전에 채워진다. 채우는 루프는 컴파일러가 펼친다."
brief = '''
**런타임** 함수 안에서, 아래의 `inline while`이 펼쳐지고 매 반복에서 `i`가
컴파일 시간에 알려지도록 루프 카운터 `i`를 선언하세요.

```
fn squares() [5]u32 {
    var out: [5]u32 = undefined;
    // ____
    inline while (i < 5) : (i += 1) {
        out[i] = @intCast(i * i);
    }
    return out;
}
```
'''
hints = [
  "런타임 `var`는 inline 루프를 돌릴 수 없고, `const`는 증가시킬 수 없습니다. 가변 컴파일 시간 값을 강제하는 키워드가 `var` 앞에 옵니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.cheatsheet_advanced.07.error-merge"
title = "실패하는 방법의 목록 둘"
story = "표 파싱은 두 가지로 실패할 수 있고, 요금 청구는 세 번째로 실패한다. 청구 함수는 셋을 하나의 셋에 이름 붙인다."
brief = '''
`ParseError`는 `error{ Empty, BadDigit }`입니다. `TollError`를 그 두
에러**와** `Overdrawn`을 담는 셋으로 정의해서
`fn charge(s: []const u8) TollError!i64`가 셋 중 어느 것이든 돌려줄 수 있게
하세요.
'''
hints = [
  "에러 셋은 두 글자 연산자로 병합됩니다. 세로 막대 하나는 비트 or이고 타입을 받지 않습니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet_advanced.08.switch-on-error"
title = "어느 쪽으로 실패했나"
story = "번진 표는 값이 0이다. 자릿수가 너무 많은 표는 최댓값이다. 부스는 잡은 에러로 결정한다."
brief = '''
`std.fmt.parseInt(i64, tok, 10)`은 `InvalidCharacter`나 `Overflow`로
실패합니다. 에러를 잡아 switch합니다. 잘못된 문자에 0을 주는 prong은 어느
것일까요?

```
return std.fmt.parseInt(i64, tok, 10) catch |e| switch (e) {
    // ____
    error.Overflow => std.math.maxInt(i64),
};
```
'''
hints = [
  "에러 셋에 대한 switch는 각 case를 `error.` 접두사로 이름 붙입니다. enum 리터럴의 점 형태는 다른 타입입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.cheatsheet_advanced.09.walk-optional"
title = "사슬을 따라 내려가기"
story = "그날 밤의 영수증은 연결된 사슬이고, 노드마다 다음을 가리키거나 아무것도 가리키지 않는다. 감사는 끝까지 걸어가 합산한다."
brief = '''
`Node`는 `struct { v: i64, next: ?*Node }`이고 `cur`는 `?*Node` 타입의
`var`입니다. 각 노드에 `node`를 차례로 묶어 본문을 실행하고 `null`에서
멈추는 루프를, 다음 노드로 가는 스텝을 본문이 아니라 루프 헤더에 적어서
여세요.

```
var total: i64 = 0;
var cur = head;
// ____
    total += node.v;
}
```
'''
hints = [
  "조건은 옵셔널 자체이고, 캡처는 벗겨 낸 포인터이며, 콜론 뒤의 continue 식은 캡처가 아니라 옵셔널을 전진시킵니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.cheatsheet_advanced.10.union-payload"
title = "어떻게 냈나"
story = "차는 동전으로 내거나, 옥토퍼스 카드로 내거나, 그냥 통과된다. 집계는 동전은 액면가로, 카드는 두 배로 더한다."
brief = '''
`Pay`는 `union(enum) { coin: i64, octopus: i64, waved: void }`이고 `p`는
`Pay`입니다. 동전 페이로드를 `t`에 더하는 prong은 어느 것일까요?

```
switch (p) {
    // ____
    .octopus => |amount| t += amount * 2,
    .waved => {},
}
```
'''
hints = [
  "페이로드는 화살표 뒤의 캡처로 묶입니다. 옵셔널에 대한 `if`와 같은 막대입니다. 평범한 캡처는 값이고, `|*x|`는 그것을 가리키는 포인터입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.cheatsheet_advanced.11.enum-from-int"
title = "선에서 온 숫자"
story = "차축 센서는 차선 등급을 바이트로 보낸다. 요금표는 enum으로 키가 매겨지고, enum은 자기 요금을 안다."
brief = '''
`n`은 유효한 태그 값을 담은 런타임 `u8`입니다. `lane.fee()`가 컴파일되도록
`lane`을 해당 `Lane`으로 만드세요.

```
const Lane = enum(u8) {
    car, van, truck, bus,
    pub fn fee(self: Lane) i64 {
        return switch (self) { .car, .van => 10, .truck => 20, .bus => 15 };
    }
};
// ____
return lane.fee();
```
'''
hints = [
  "빌트인은 정수만 받습니다. 그것이 되는 enum은 결과 타입이므로 바인딩이 그것을 이름 붙여야 합니다. 반대 방향은 `@intFromEnum`입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet_advanced.12.labeled-block"
title = "첫 번째 무거운 것"
story = "계량대 로그를 훑어 100톤을 넘는 첫 측정값을 찾는다. 답은 값이지, 함수 밖으로 뛰어나가는 것이 아니다."
brief = '''
`xs`에는 100을 넘는 값이 있다고 보장됩니다. `found`는 그런 첫 `x`가 되어야
하고, 함수는 그다음 `found`를 계속 씁니다. `x`를 블록 밖으로 건네는 줄은
어느 것일까요?

```
const found = blk: {
    for (xs) |x| {
        if (x > 100) // ____
    }
    unreachable;
};
return found * 2;
```
'''
hints = [
  "레이블 붙은 블록은 앞에 콜론을 붙여 레이블을 이름 붙이고 값을 싣는 break로 값을 냅니다. `return`은 틀린 숫자로 함수를 떠나고 레이블은 쓰이지 않은 채 남습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.cheatsheet_advanced.13.span"
title = "C 쪽에서 온 문자열"
story = "번호판 카메라의 드라이버는 C다. 이름을 0 바이트로 끝나는 포인터로 넘기고, Zig 쪽은 길이가 있는 슬라이스를 원한다."
brief = '''
`c_name`은 `[*:0]const u8` — 길이가 없고 0으로 끝나는 many-item 포인터 —
입니다. `s`를 종결자까지(종결자는 제외) 그 바이트들에 대한 `[]const u8`로,
복사 없이 만드세요.
'''
hints = [
  "many-pointer는 슬라이스로 강제 변환되지 않습니다. 무언가가 센티널까지 걸어가 길이를 찾아야 합니다. std.mem 함수 하나가 정확히 그것을 하고, 포인터만 받습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.cheatsheet_advanced.14.to-owned-slice"
title = "목록을 넘겨라"
story = "짝수 차선들이 목록으로 모이고, 호출자는 다 쓰면 gpa.free로 해제할 맨 슬라이스를 원한다."
brief = '''
`list`는 `gpa`로 채운 `std.ArrayList(i64)`입니다. 그 내용을 호출자가
`gpa.free`로 해제하는 `[]i64`로 돌려주되, `list`가 해제할 것은 남기지 않고
아무것도 복사하지 않으세요 (Zig 0.16: 리스트는 할당자를 들고 있지
않습니다).

```
fn evens(gpa: std.mem.Allocator, xs: []const i64) ![]i64 {
    var list: std.ArrayList(i64) = .empty;
    errdefer list.deinit(gpa);
    for (xs) |x| if (@rem(x, 2) == 0) try list.append(gpa, x);
    // ____
}
```
'''
hints = [
  "`.items`는 여전히 리스트 소유라 두 번 해제되거나 영영 해제되지 않습니다. 소유권을 넘기는 호출은 크기를 딱 맞게 줄이므로 실패할 수 있고 할당자를 받습니다.",
]

