[[quest]]
id    = "zig.cheatsheet_advanced.15.get-or-put"
title = "조회는 둘이 아니라 하나"
story = "관제실의 번호판 집계는 차마다 한 번 올라가고, 야간 근무는 같은 번호판을 두 번 해시하기를 거부한다."
brief = '''
`counts`는 `std.AutoHashMap(i64, i64)`입니다. 조회 한 번으로 `x`를 세세요:
처음 보는 키는 증가 전에 0에서 시작하고, 이미 있는 키는 자기 카운트를
유지합니다.

```
const gop = try counts.getOrPut(x);
// ____
gop.value_ptr.* += 1;
```
'''
hints = [
  "결과는 키가 이미 있었는지 말하는 플래그와 슬롯을 가리키는 포인터를 지닙니다. 새 슬롯은 당신이 쓰기 전까지 undefined입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.cheatsheet_advanced.16.dupe-key"
title = "줄보다 오래 사는 키"
story = "번호판은 같은 버퍼로 한 줄에 하나씩 들어온다. 오늘 밤 본 번호판의 집합은 곧 덮어써질 버퍼를 가리켜서는 안 된다."
brief = '''
`seen`은 `gpa`로 만든 `std.StringHashMap(void)`이고, `word`는 다음 읽기에
덮어써지는 줄 버퍼를 가리키는 `[]const u8` 슬라이스입니다. `word`를 버퍼가
바뀐 뒤에도 유효한 키로 삽입하세요. 키는 끝에 하나씩 해제됩니다.
'''
hints = [
  "문자열 맵은 바이트가 아니라 당신이 준 슬라이스를 저장합니다. 먼저 할당자로 복사하세요. 복사도 실패할 수 있습니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.cheatsheet_advanced.17.debug-allocator"
title = "고자질하는 할당자"
story = "야간 빌드는 돌려주지 않은 모든 바이트를 보고하는 할당자로 돈다. 그 이름이 0.16에서 바뀌었고, 옛 이름은 컴파일되지 않는다."
brief = '''
Zig 0.16. 아래 두 줄이 컴파일되도록 — `deinit`은 그것을 변경하고 누수를
보고합니다 — 누수 검사 범용 할당자 `dbg`를 선언하세요.

```
// ____
defer _ = dbg.deinit();
const gpa = dbg.allocator();
```
'''
hints = [
  "`GeneralPurposeAllocator`는 0.16의 std.heap에서 사라졌습니다. 타입은 설정 튜플을 받고, 호출이 아니라 decl 리터럴로 초기화됩니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.cheatsheet_advanced.18.arena"
title = "끝에 한 번만 지불"
story = "요청 하나의 스크래치 노드와 문자열은 요청이 끝날 때 모두 함께 죽는다. 아무도 하나씩 해제하지 않는다."
brief = '''
`page`는 `std.heap.page_allocator`입니다. 아래의 `a.create(Node)`와
`std.fmt.allocPrint(a, ...)`가 모두 `deinit` 하나로 해제되도록, 그 위에
아레나 `arena`를 만드세요.

```
// ____
defer arena.deinit();
const a = arena.allocator();
```
'''
hints = [
  "아레나는 인자 하나로 받는 자식 할당자 위에 만들어집니다. 제네릭 타입이 아니고 설정 튜플도 없습니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.cheatsheet_advanced.19.defer-order"
title = "나중 들어온 것이 먼저 나간다"
story = "부스를 나가는 길에 도장 셋, 그중 둘은 defer. 장부는 찍힌 순서를 보여 준다."
brief = '''
이 함수는 전부 무엇을 출력할까요?

```
fn stamp() void {
    defer std.debug.print("1", .{});
    defer std.debug.print("2", .{});
    std.debug.print("3", .{});
}
```
'''
hints = [
  "defer된 문장은 스코프를 나갈 때 defer된 순서의 역순으로 실행됩니다: 마지막에 등록된 것이 먼저 갑니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.cheatsheet_advanced.20.split-keeps-empties"
title = "빈 열도 센다"
story = "요금 내보내기는 쉼표로 구분되고, 빠진 열은 아예 없는 필드가 아니라 빈 필드다. `a,,b`는 열 셋이다."
brief = '''
`line`은 `[]const u8`입니다. `while (it.next()) |f| n += 1;`이 `"a,,b"`를
필드 **3**개로, `"a"`를 1개로 세도록 `line`의 쉼표 구분 필드에 대한
이터레이터 `it`를 만드세요.
'''
hints = [
  "std.mem 이터레이터 둘이 한 바이트 구분자를 받습니다. 토크나이저는 연속된 구분자를 삼켜 둘로 세고, 스플리터는 그 사이의 빈 필드를 냅니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.cheatsheet_advanced.21.sort-context"
title = "남의 숫자로 정렬"
story = "차선 인덱스는 별도 테이블의 무게로 재배열된다. Zig에는 테이블을 캡처할 클로저가 없으므로 정렬에 그것을 건넨다."
brief = '''
`idx`는 `[]usize`이고 `keys`는 `[]const i64`입니다. 이 비교자를 써서
`idx`를 `keys[i]` 오름차순으로 정렬하세요:

```
fn byKey(keys: []const i64, a: usize, b: usize) bool {
    return keys[a] < keys[b];
}
```
'''
hints = [
  "셋째 인자는 비교자가 첫 매개변수로 받는 컨텍스트입니다. 비교자의 타입은 그것과 정확히 맞아야 하므로 `{}`는 `void` 컨텍스트에만 맞습니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.cheatsheet_advanced.22.truncate"
title = "낮은 바이트만"
story = "차축 센서는 측정값 넷을 u32 하나에 담는다. 부스는 가장 낮은 바이트를 원하고, 나머지가 0이 아니어도 패닉해서는 안 된다."
brief = '''
`x`는 `0x1234`를 담은 런타임 `u32`입니다. `lo`를 `0x34` — 낮은 8비트 — 를
담은 `u8`로, Debug 모드에서 안전 패닉 없이 만드세요.
'''
hints = [
  "값이 들어맞는지 검사하는 캐스트는 0x1234에서 패닉합니다. 높은 비트를 버리는 캐스트는 인자 하나를 받고 너비는 바인딩에서 얻습니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.cheatsheet_advanced.23.wrapping"
title = "넘어가되 멈추지 마라"
story = "번호판 해시는 하룻밤에 수천 번 오버플로하게 되어 있다. Debug 모드에서 요청되지 않은 오버플로는 패닉이고 닫힌 차단기다."
brief = '''
`h`는 `std.math.maxInt(u32)` 근처에서 시작하는 `u32`이고 `c`는 `u8`입니다.
해시 스텝 `h = h * 31 + c`를 2^32을 법으로 **감기도록** 쓰세요 — 패닉도,
최댓값에서의 포화도 아니라.
'''
hints = [
  "평범한 연산자는 Debug에서 오버플로에 패닉하고, 나중에 씌우는 마스크는 너무 늦습니다 — 곱셈이 이미 넘쳤으니까요. Zig에는 접미사가 붙은 연산자 계열이 둘 있습니다: 하나는 최댓값에서 포화하고, 다른 하나는 감깁니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.cheatsheet_advanced.24.expect-equal"
title = "요금을 증명하라"
story = "면접관이 돌려 보기 전에 후보자가 요금표와 평균에 `zig test`를 돌리고, 테스트는 기대하는 것을 말한다."
brief = '''
`fare(3)`은 7이어야 하는 `i64`를 돌려줍니다. test 블록 안에서 그것을
단언하세요 — 값이 틀리면 테스트가 실패해야 하고 컴파일은 되어야 합니다.

```
fn avg(sum: i64, n: i64) f64 {
    return @as(f64, @floatFromInt(sum)) / @as(f64, @floatFromInt(n));
}

test "fare" {
    // ____
    try std.testing.expect(avg(5, 2) == 2.5);
}
```
'''
hints = [
  "비교는 에러 유니언을 돌려주므로 `try`해야지 아니면 컴파일러가 무시하기를 거부합니다. 인자 하나짜리 `expect`는 bool을 받습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.cheatsheet_advanced.25.main-init"
title = "런타임이 들어오는 곳"
story = "Zig 0.16은 main에 I/O 런타임과 할당자를 struct 하나로 건넨다. 옛 시그니처는 둘 중 어느 것도 쓰지 않을 때만 여전히 컴파일된다."
brief = '''
Zig 0.16. 아래 본문이 컴파일되도록 `main`을 여세요: 매개변수에서 `io`와
`gpa`를 읽고, `try`를 씁니다.

```
// ____
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
}
```
'''
hints = [
  "진입점은 `pub`이어야 하고, `try`를 위해 에러를 돌려줄 수 있어야 하며, 본문이 필드를 읽는 std.process 타입의 매개변수 하나를 받습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.cheatsheet_advanced.26.stdin-lines"
title = "한 번에 한 줄"
story = "번호판 피드는 끝이 없고 관제실은 0.16 리더를 통해 피드가 닫힐 때까지 한 줄씩 읽는다."
brief = '''
Zig 0.16. `r`은 `&stdin.interface`, 버퍼링된 stdin 위의 `*std.Io.Reader`
입니다. 각 줄을(줄바꿈 없이) `line`에 묶고, 읽기 실패는 호출자에게 올려
보내고, 입력 끝에서 깔끔하게 끝나는 루프를 여세요.
'''
hints = [
  "0.16 리더에는 구분자까지 가져오는 호출이 있고, 옵셔널 슬라이스를 감싼 에러 유니언을 돌려줍니다: 스트림 끝에서 null이므로 `try` 다음 캡처. 그 Exclusive 형제는 옵셔널이 아니고 끝에서 에러를 냅니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.cheatsheet_advanced.27.spawn"
title = "자기 스레드 위의 부스 하나"
story = "5번 부스는 자기 스레드에서 자기 카운트를 제곱해 관제실의 슬롯에 답을 쓴다. 관제실은 읽기 전에 join한다."
brief = '''
`fn worker(out: *i64, n: i64) void`이고 `total`은 `var i64`입니다. `&total`과
`5`로 새 스레드에서 `worker`를 시작하고, 다음 줄에서 `t.join();`이
컴파일되도록 핸들을 `t`로 간직하세요.
'''
hints = [
  "spawn은 설정, 함수, 그리고 인자들을 튜플 하나로 받습니다. 실패할 수 있고, 핸들은 에러를 벗겨 내야만 존재합니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.cheatsheet_advanced.28.io-mutex"
title = "트레이 하나, 손 둘"
story = "부스 둘이 현금 합계 하나에 더한다. 그것을 둘러싼 잠금은 0.16에서 I/O 런타임의 것이고, std.Thread.Mutex는 사라졌다."
brief = '''
Zig 0.16. `m`은 `*std.Io.Mutex`이고 `io`는 `std.Io`입니다. 더하기 전에
잠금을 잡으세요. 아래 `defer`가 돌려줍니다. `add`는 `void`를 돌려주고
에러를 전파할 수 없습니다.

```
fn add(io: std.Io, m: *std.Io.Mutex, total: *i64, value: i64) void {
    // ____
    defer m.unlock(io);
    total.* += value;
}
```
'''
hints = [
  "0.16 뮤텍스의 평범한 `lock`은 `io`를 받고 `error.Canceled`를 돌려줄 수 있는데, `void` 함수는 그것을 `try`할 수 없습니다. 취소될 수 없는 그 형제는 아무것도 돌려주지 않습니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.cheatsheet_advanced.29.atomic"
title = "워드 하나, 잠금 없이"
story = "고가도로 아래의 히트 카운터는 기계어 워드 하나이고, 모든 차선이 동시에 올리며, 아무도 덧셈 하나에 뮤텍스를 두르고 싶지 않다."
brief = '''
`hits`는 여러 스레드가 공유하는 `*std.atomic.Value(u32)`입니다. 옛 값이
필요 없는 `void` 함수 안에서, relaxed(monotonic) 순서로 그것에 1을
원자적으로 더하세요.
'''
hints = [
  "read-modify-write는 이전 값을 돌려주고 Zig는 void가 아닌 결과가 조용히 떨어지는 것을 허용하지 않습니다. 순서는 0.16에서 소문자 enum 리터럴입니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "zig.cheatsheet_advanced.30.packed-bitcast"
title = "한 바이트에 플래그 여덟"
story = "차단기 컨트롤러는 차마다 한 바이트를 받는다: 지불됨, 표시됨, 3비트 차선, 3비트 여분. struct는 비트 단위로 배치되고 그 바이트로 보내진다."
brief = '''
`Flags`는 `packed struct(u8)`입니다 — `@sizeOf(Flags)`는 1이고, C처럼
배치되는 `extern struct`와는 다릅니다. `f`는 `Flags`입니다. `bits`를 `f`의
비트 패턴을 가진 `u8`로 만들어 선으로 내보낼 수 있게 하세요.

```
const Flags = packed struct(u8) {
    paid: bool,
    flagged: bool,
    lane: u3,
    _pad: u3 = 0,
};
```
'''
hints = [
  "정수 캐스트들은 정수가 들어오길 원합니다. 패킹된 struct는 인자 하나를 받고 대상을 바인딩에서 얻는 캐스트가 비트 그대로 재해석합니다.",
]
