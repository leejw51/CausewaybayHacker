[[quest]]
id    = "pytorch.hacker.07.normal-equations"
title = "경사 하강법 없이"
story = "훈련하지 말고 직선을 맞춰라. 최소제곱에는 닫힌 형태가 있고, 그들은 당신이 그것을 아는지 알고 싶어 한다."
brief = '''
첫 줄은 `n d`입니다. 그다음 특징 `d`개짜리 행 `n`개, 그다음 타깃 `n`개의 줄입니다.

최소제곱 계수 `d + 1`개(가중치 `d`개, 그다음 절편)를 각각 소수점 아래 네 자리로 반올림해, 한 줄에 출력하세요.

절편은 1로 된 열을 덧붙이는 데서 나오고, 해는 `(XᵀX)⁻¹Xᵀy`입니다. 역행렬을 만들지 않고 그것을 하는 `torch.linalg.lstsq`를 쓰세요. 편향 열만 있다면 면접관은 어느 쪽이든 받아 줍니다.

```
input:  3 1
        0
        1
        2
        1 3 5
output: 2.0 1.0
```
'''
hints = [
  "torch.cat([x, torch.ones(n, 1)], dim=1)로 1의 열을 덧붙이세요. 그 열이 절편입니다.",
  "torch.linalg.lstsq(xb, y.unsqueeze(1)).solution — 오른쪽 항에 행렬을 원합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "pytorch.hacker.08.kmeans-step"
title = "반복 한 번"
story = "할당하고, 평균 내고, 무엇이 바뀌었는지 말하라. 그들은 라이브러리가 아니라 루프 본문을 원한다."
brief = '''
첫 줄은 `n k d`입니다. 그다음 float `d`개짜리 점 `n`개, 그다음 float `d`개짜리 중심 행 `k`개입니다.

첫 줄에 각 점의 할당을 출력하고, 그다음 갱신된 중심 `k`개를 한 줄에 하나씩, 소수점 아래 네 자리로 반올림해 출력하세요. 점이 없는 중심은 옛 위치를 유지합니다.

반복 한 번은 이렇습니다. 브로드캐스팅으로 거리를 구하고, 할당은 `argmin`으로, 그리고 군집마다 마스킹된 평균.

```
input:  4 2 1
        0
        1
        10
        11
        0
        10
output: 0 0 1 1
        0.5
        10.5
```
'''
hints = [
  "(x.unsqueeze(1) - c.unsqueeze(0))는 (n, k, d)입니다. 제곱하고, 마지막 축을 더하고, k에 대해 argmin.",
  "빈 군집에는 평균이 없습니다. 막아 두세요. 아니면 중심이 nan이 되어 영영 회복하지 못합니다.",
]

