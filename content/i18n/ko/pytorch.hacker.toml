[[quest]]
id    = "pytorch.hacker.10.nms"
title = "물체마다 하나만"
story = "랙 문 하나에 박스 아홉 개, 그리고 검출기는 랙 문이 아홉 개라고 확신한다."
brief = '''
첫 줄은 `n thr`입니다. 그다음 `x1 y1 x2 y2 score`인 행 `n`개입니다.

비최대 억제로 남긴 인덱스를 남긴 순서대로, 공백으로 구분해 출력하세요. 하나도 남지 않으면 빈 줄을 출력하세요.

NMS는 탐욕적입니다. 점수가 가장 높은 박스를 골라 남기고, 그것과의 IoU가 `thr`**보다 큰** 나머지 박스를 모두 버리고, 반복합니다. 정확히 임계값인 박스는 살아남습니다.

```
input:  3 0.5
        0 0 2 2 0.9
        0 0 2 2 0.8
        5 5 7 7 0.7
output: 0 2
```
'''
hints = [
  "점수 내림차순으로 정렬하고, 최선을 꺼내고, 나머지를 그것과의 IoU로 거르고, 반복합니다.",
  "억제의 비교는 임계값보다 엄격하게 큰 것이므로, 정확히 thr인 박스는 남습니다.",
]

