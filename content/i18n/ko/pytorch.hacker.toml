[[quest]]
id    = "pytorch.hacker.09.iou"
title = "얼마나 겹치나"
story = "검출 박스, 그리고 예측이 인정되는지를 가르는 지표. 0에서의 clamp가 사람들이 잊는 줄이다."
brief = '''
첫 줄은 `n m`입니다. 그다음 박스 `n`개와 박스 `m`개이고, 각각 `x1 y1 x2 y2`입니다.

`n × m` IoU 행렬을 소수점 아래 네 자리로 반올림해, 한 줄에 한 행씩 출력하세요.

교집합은 각 축에서 두 구간의 겹침이고, **0에서 clamp됩니다**. 닿지 않는 두 박스는 음수 너비를 주고, clamp가 없으면 두 음수의 곱이 양수로 나와서 지표는 존재하지 않는 겹침을 조용히 보고합니다.

```
input:  2 1
        0 0 2 2
        1 1 3 3
        0 0 2 2
output: 1.0
        0.1429
```
'''
hints = [
  "왼쪽 위는 두 모서리의 원소별 최댓값, 오른쪽 아래는 최솟값입니다. 그다음 (rb - lt).clamp(min=0).",
  "합집합은 areaA + areaB - intersection입니다. 빼세요. 아니면 모든 겹침이 과소평가됩니다.",
]

