[[quest]]
id    = "pytorch.hacker.11.dropout"
title = "드롭아웃을 써라"
story = "드롭아웃을 써 보라고 하고는, 이어서 묻는다. 추론 시점에는 무엇을 하죠? 진짜 질문은 두 번째다."
brief = '''
첫 줄은 `n p seed`이고, `p`는 드롭 확률입니다.

살아남은 비율과 출력의 평균을 각각 소수점 아래 **한** 자리로 반올림해 출력하고, 기댓값이 보존되었으면, 즉 살아남은 원소가 `1/(1-p)`로 스케일되었으면 `True`를 출력하세요.

한 자리인 이유는 정확한 뽑기가 생성기의 사정이지 문제의 사정이 아니기 때문입니다. 확인하는 것은 비율 `p`만큼을 버린 뒤에도 출력의 평균이 여전히 1이라는 점입니다.

이것은 모든 프레임워크가 구현하는 **역** 드롭아웃입니다. 스케일링이 훈련 중에 일어나므로 추론은 그냥 항등 함수이고, 기억할 것도 끌 것도 없습니다.

```
input:  1000 0.5 0
output: 0.5 1.0 True
```
'''
hints = [
  "훈련 경로에서 (1 - p)로 나누세요. 드롭아웃과 그냥 0으로 만드는 것의 차이는 그게 전부입니다.",
  "스케일링이 없으면 활성값이 (1 - p)배로 줄어들고, 추론 시 하류의 모든 층이 엉뚱한 스케일을 봅니다.",
]

