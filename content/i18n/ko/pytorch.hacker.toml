# PYTORCH LAND — HACKER, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/hacker.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.hacker"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.hacker.01.pairwise"
title = "모든 쌍, 루프 없이"
story = "7-32호실, 다섯 번째. 첫 문제는 누구나 받는 그 문제이고, 시계는 들어오는 길에 이미 돌기 시작한다."
brief = '''
첫 줄은 `n d`입니다. 그다음 float `d`개짜리 행 `n`개입니다.

유클리드 거리의 `n × n` 행렬을 출력하세요. 각 값은 소수점 아래 세 자리로 반올림하고, 한 줄에 한 행, 값은 공백 하나로 구분합니다.

그들이 찾는 답에는 파이썬 루프가 없습니다. `(n, 1, d)`를 `(1, n, d)`에 대해 브로드캐스트하면 모든 차이가 한 번에 나옵니다.

```
input:  3 2
        0 0
        3 4
        0 4
output: 0.0 5.0 4.0
        5.0 0.0 3.0
        4.0 3.0 0.0
```
'''
hints = [
  "(x.unsqueeze(1) - x.unsqueeze(0))의 모양은 (n, n, d)입니다. 모든 쌍의 모든 차이입니다.",
  "torch.cdist(x, x)가 라이브러리의 답입니다. 면접은 보통 브로드캐스트를 풀어 쓴 것을 원합니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.hacker.02.topk-accuracy"
title = "상위 다섯 안에"
story = "논문은 top-5를 주장하는데 코드는 top-1을 계산한다. 리뷰어가 그 숫자를 물을 때까지 아무도 몰랐다."
brief = '''
첫 줄은 `n c k`입니다. 그다음 로짓 `c`개짜리 행 `n`개입니다. 마지막 줄은 정수 레이블 `n`개입니다.

top-1 정확도와 top-`k` 정확도를 각각 소수점 아래 네 자리로 반올림해, 공백으로 구분하여 출력하세요. 샘플의 레이블이 그 행에서 가장 큰 로짓 `k`개 안에 있으면 top-`k`로 셉니다.

`topk`는 값과 인덱스를 돌려주며, 이 문제가 다루는 것은 인덱스입니다.

```
input:  3 4 2
        1 2 3 0
        5 1 0 2
        0 1 4 3
        2 0 3
output: 0.6667 1.0
```
'''
hints = [
  "logits.topk(k, dim=1).indices는 (n, k)이고 이미 좋은 것부터 정렬되어 있으므로, 0열이 top-1 예측입니다.",
  "(idx == want.unsqueeze(1)).any(dim=1) — 레이블이 k개의 열에 걸쳐 브로드캐스트되게 하는 것이 unsqueeze입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.hacker.03.cosine"
title = "길이 말고, 각도"
story = "검색은 내적으로 순위를 매기고, 가장 긴 벡터가 무슨 내용이든 모든 쿼리에서 이긴다."
brief = '''
첫 줄은 `n m d`입니다. 그다음 float `d`개짜리 쿼리 행 `n`개, 그다음 float `d`개짜리 문서 행 `m`개입니다.

`n × m` 코사인 유사도 행렬을 소수점 아래 네 자리로 반올림해, 한 줄에 한 행씩 출력하세요.

코사인 유사도는 **정규화된** 벡터들의 내적입니다. 먼저 정규화하고 그다음 곱하는 것이 행렬 곱 하나로 끝나는 답입니다. 나중에 나누려면 노름들의 외적이 필요하고, 사람들이 갈피를 잃는 곳이 거기입니다.

```
input:  2 2 2
        1 0
        0 2
        1 0
        1 1
output: 1.0 0.7071
        0.0 0.7071
```
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) — 나눗셈이 행들을 따라 브로드캐스트되게 하는 것이 keepdim입니다.",
  "그다음 행렬 곱 하나: qn @ kn.t(). 영벡터는 0으로 나누게 되는데, F.normalize의 eps가 그것 때문에 있습니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "pytorch.hacker.04.stable-softmax"
title = "소프트맥스를 써라"
story = "소프트맥스를 써라. 그들이 가장 먼저 묻는 것이고, 그들이 귀 기울이는 답은 아무도 첫 시도에 쓰지 않는 그 뺄셈이다."
brief = '''
첫 줄은 `n c`입니다. 그다음 로짓 `c`개짜리 행 `n`개입니다.

각 행에 대해 소프트맥스를 소수점 아래 네 자리로 반올림해 출력하세요. `torch.softmax` **없이** 계산합니다.

큰 로짓의 `exp`는 `inf`로 넘치고 행은 `nan`이 됩니다. 먼저 각 행의 최댓값을 빼는 것은 수학적으로는 아무것도, 수치적으로는 모든 것을 바꿉니다. 가장 큰 지수가 `exp(0)`이 되기 때문입니다.

```
input:  2 3
        1 2 3
        1000 1000 1000
output: 0.09 0.2447 0.6652
        0.3333 0.3333 0.3333
```
'''
hints = [
  "x - x.max(dim=1, keepdim=True).values, 그다음 exp, 그다음 행 합계로 나눕니다.",
  "max(dim=...)은 값과 인덱스를 돌려줍니다. .values가 원하는 절반이고, keepdim이 브로드캐스트를 정직하게 지킵니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "pytorch.hacker.05.cross-entropy"
title = "교차 엔트로피를 써라"
story = "이제 손실을 쓰고, 그들이 건네는 배치에서 라이브러리와 소수점 아래 다섯 자리까지 일치하게 하라."
brief = '''
첫 줄은 `n c`입니다. 그다음 로짓 `c`개짜리 행 `n`개, 그다음 레이블 `n`개의 줄입니다.

당신의 교차 엔트로피를 소수점 아래 다섯 자리로 반올림해 출력하고, 그다음 `nn.CrossEntropyLoss`와 `1e-5`까지 일치하면 `True`를 출력하세요.

배치의 교차 엔트로피는 행들에 대한 `-log_softmax(logits)[row, label]`의 평균입니다. 그렇게 쓰면 안정하고, `gather` 하나이며, 그들이 원하는 답입니다. `-log(softmax(x))`로 쓰면 숨겨진 케이스에서 `inf`를 돌려주는 답이 됩니다.

```
input:  2 3
        1 2 3
        3 1 0
        2 0
output: 0.28873 True
```
'''
hints = [
  "먼저 log_softmax, 그다음 참 클래스를 gather하고, 그다음 부호를 바꿔 평균을 냅니다.",
  "기본 reduction은 합이 아니라 배치에 대한 평균입니다. 라이브러리와 맞추는 나머지 절반이 그것입니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "pytorch.hacker.06.one-hot"
title = "헬퍼 없이"
story = "`F.one_hot`은 안 된다고 면접관이 말한다. 방법은 두 가지, 그리고 그들이 기다리는 것은 scatter다."
brief = '''
첫 줄은 `n c`입니다. 둘째 줄은 레이블 `n`개입니다.

`n × c` 원-핫 행렬을 정수로, 한 줄에 한 행씩 출력하세요.

`zeros(n, c).scatter_(1, labels.unsqueeze(1), 1.0)`은 각 행의 레이블 열에 1을 씁니다. 비교 형태인 `labels.unsqueeze(1) == arange(c)`는 또 하나의 인정되는 답이고, 소리 내어 설명하기가 더 쉽습니다.

```
input:  3 4
        2 0 3
output: 0 0 1 0
        1 0 0 0
        0 0 0 1
```
'''
hints = [
  "torch.zeros(n, c).scatter_(1, y.unsqueeze(1), 1.0) — dim 1, 인덱스는 원본과 같은 모양.",
  "y.unsqueeze(1) == torch.arange(c)는 같은 행렬을 불리언으로 주고, 면접에서 더 잘 읽힙니다.",
]

