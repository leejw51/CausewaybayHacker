title = "SGD를 전부 써라"
story = "모멘텀과 가중치 감쇠를 함께, 그리고 질문은 어느 쪽이 먼저 적용되느냐다."
brief = '''
첫 줄은 `steps lr mu wd`입니다. 둘째 줄은 `1.0`에서 시작하는 스칼라 파라미터에 대한 기울기 `steps`개입니다.

걸음 뒤의 당신의 파라미터를 소수점 아래 여섯 자리로 반올림해 출력하고, 그다음 torch의 것, 그다음 `1e-6`까지 일치하면 `True`를 출력하세요.

torch의 순서는 이렇습니다. 가중치 감쇠가 **먼저** 기울기에 접혀 들어가고, 그다음 모멘텀이 감쇠된 기울기를 누적하고, 그다음 걸음을 내딛습니다.

```
g = g + wd * w
b = mu * b + g
w = w - lr * b
```

모멘텀 뒤에 감쇠하거나, 기울기가 아니라 가중치를 직접 감쇠하면 다른 궤적이 나옵니다. AdamW가 다루는 것이 바로 그 차이입니다.

```
input:  3 0.1 0.9 0.1
        1 1 1
output: 0.388169 0.388169 True
```
'''
hints = [
  "먼저 d = g + wd * w, 그다음 버퍼, 그다음 걸음.",
  "torch는 모멘텀 버퍼를 mu * 0 + g가 아니라 첫 감쇠된 기울기로 초기화합니다. 여기서는 같은 것이지만, 그것이 특수한 경우라는 것은 알아 둘 가치가 있습니다.",
]

