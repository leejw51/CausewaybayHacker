story = "두 이미지의 평균과 그 레이블의 평균으로 훈련하라. 동작하면 안 될 것 같은데 동작한다."
brief = '''
첫 줄은 `n c lam`입니다. 그다음 로짓 `c`개짜리 행 `n`개, 그다음 레이블 `n`개, 그다음 순열 인덱스 `n`개입니다.

mixup 손실을 소수점 아래 다섯 자리로 반올림해 출력하고, 소프트 타깃 방식(`lam * onehot(y) + (1 - lam) * onehot(y[perm])`을 만들고 `-(target * log_softmax(x)).sum(1).mean()`을 취하는 것)과 `1e-5`까지 같으면 `True`를 출력하세요. 그 참조 구현은 이미 적혀 있고, 당신의 것은 한 줄 버전입니다.

원-핫 타깃 대신 **손실**을 섞는 것이 표준 구현이며, 교차 엔트로피는 타깃에 대해 선형이므로 둘은 똑같습니다. 그것을 스스로 증명하는 것이 질문입니다.

```
input:  2 3 0.7
        1 2 3
        3 1 0
        2 0
        1 0
output: 1.03873 True
```
'''
hints = [
  "lam * ce(x, y) + (1 - lam) * ce(x, y[perm]) — y[perm]이 섞인 짝의 레이블입니다.",
  "실제 구현에서는 입력도 섞이며, 같은 lam을 베타 분포에서 뽑습니다.",
]

