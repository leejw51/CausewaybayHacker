[[quest]]
id    = "pytorch.hacker.12.gelu"
title = "트랜스포머 안의 그것"
story = "블록 안의 MLP는 ReLU도 시그모이드도 쓰지 않고, 후보자는 실제로 쓰는 그것을 써 보라는 요청을 받는다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 float `n`개입니다.

당신의 정확한 GELU를 소수점 아래 네 자리로 반올림해 출력하고, 그다음 `nn.GELU()`와 `1e-5`까지 일치하면 `True`를 출력하세요.

정확한 GELU는 `x · Φ(x)`이고, `Φ`는 표준 정규분포의 누적분포함수입니다: `0.5 · (1 + erf(x/√2))`. `tanh` 형태는 근사이고 기본값과 `1e-5`까지 일치하지 **않습니다**. 이 문제의 함정이 그것입니다.

```
input:  3
        -1 0 1
output: -0.1587 0.0 0.8413 True
```
'''
hints = [
  "x * 0.5 * (1 + torch.erf(x / 2 ** 0.5)) — torch.erf가 오차 함수입니다.",
  "nn.GELU(approximate=\"tanh\")가 다른 쪽입니다. 기본값은 정확한 쪽이고, 맞춰야 하는 것이 그것입니다.",
]

