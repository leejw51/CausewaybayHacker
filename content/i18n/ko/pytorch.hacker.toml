[[quest]]
id    = "pytorch.hacker.13.rmsnorm"
title = "평균은 아예 없다"
story = "새로운 모델들은 중심화 단계를 버리고 더 적은 산술로 같은 결과를 얻었다. 그들이 남긴 쪽을 써라."
brief = '''
첫 줄은 `n d`입니다. 그다음 float `d`개짜리 행 `n`개입니다.

정규화된 각 행을 소수점 아래 네 자리로 반올림해, 한 줄에 하나씩 출력하세요.

RMSNorm은 행의 제곱평균제곱근으로 나누고 평균을 빼지 **않습니다**: `x / sqrt(mean(x²) + eps)`. `eps = 1e-6`을 쓰세요. LayerNorm과의 차이는 그게 전부이고, 그래서 더 쌉니다.

```
input:  2 4
        1 1 1 1
