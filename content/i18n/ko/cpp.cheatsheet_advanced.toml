[[quest]]
id    = "cpp.cheatsheet_advanced.21.heap-comparator"
title = "가장 급한 일을 맨 위에"
story = "럭키맥 야간 주방의 보 셰프 주문표 레일은 마감이 가장 이른 주문을 맨 위에 두는데 — 레일은 주문표에게 '작다'가 무슨 뜻인지 모른다."
brief = '''
```cpp
struct Job { int d; std::string name; };   // no comparison operators
std::priority_queue<Job, std::vector<Job>, decltype(cmp)> pq(cmp);
```

`pq.top()`이 언제나 `d`가 **가장 작은** 일이 되도록 (큐 앞에서) `cmp`를
정의하세요.
'''
hints = [
  "비교자는 누가 가라앉는지 말합니다: 큐는 다른 어느 것보다도 '작지' 않은 원소를 맨 위에 둡니다. 가장 작은 것이 위에 오려면 '작다'가 더 크다는 뜻이어야 하고 — 진짜 bool을 돌려줘야 합니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.cheatsheet_advanced.22.getline-delim"
title = "쉼표로 나누기"
story = "배송 명세서는 'Jaffe Road,7,Sogo'를 읽는다 — 필드 셋, 그중 하나는 안에 공백이 있고, 쉼표로만 나눈다."
brief = '''
`std::istringstream ss(line); std::string tok; std::vector<std::string> parts;`
— `line`이 `Jaffe Road,7,Sogo`일 때 `parts`를 **세** 필드로 채우되, 첫째는
`Jaffe Road`여야 합니다.
'''
hints = [
  "`>>`는 공백으로 나누어 도로 이름을 둘로 자릅니다. 줄 읽기는 선택적 구분자를 받습니다 — 셋째 인자로, 문자 하나.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.cheatsheet_advanced.23.erase-if"
title = "홀수는 버리기"
story = "소고 오락실은 단지에서 홀수 번호 토큰을 모두 걷어 낸다 — 한 줄로, 중간에 이터레이터가 상하는 일 없이."
brief = '''
`std::vector<int> v = {1, 3, 5, 2, 4, 7, 9};` — **홀수** 원소를 모두 제거해
`v`가 `{2, 4}`이고 `v.size() == 2`가 되게 하세요. C++20, `<algorithm>`과
`<vector>`는 포함되어 있습니다.
'''
hints = [
  "고전 알고리즘은 뒤섞기만 하고 절대 줄이지 않습니다. `++it` 루프 안에서 지우면 방금 erase가 무효화한 이터레이터를 씁니다. C++20은 이 춤 전체를 대신 춰 주는 자유 함수를 추가했습니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.cheatsheet_advanced.24.popcount"
title = "불 켜진 창 세기"
story = "헤네시 로드 타워의 예순네 가구, 한 비트씩. 야간 경비원은 불 켜진 창을 센다 — 아래 절반만이 아니라 예순네 개 전부."
brief = '''
`std::uint64_t x = 0xF0000000F0000001;` — `int c`를 `x`의 **켜진 비트** 수인
`9`로 설정하세요. `<bit>`과 `<bitset>`은 포함되어 있습니다.
'''
hints = [
  "이 중 둘은 64비트 값의 32비트만 보고, 하나는 전부가 아니라 끝의 1들만 셉니다. C++20의 것은 어떤 unsigned 타입이든 그대로 받습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.cheatsheet_advanced.25.stopwatch"
title = "얼마나 걸렸나"
story = "메이는 대포부터 마지막 키 입력까지 풀이 시간을 재고, 답을 정수 밀리초로 원한다 — 나노초도, 컴파일 오류도 아니고."
brief = '''
```cpp
using namespace std::chrono;
auto t0 = steady_clock::now();
solve();
auto t1 = steady_clock::now();
```

`ms`를 경과 시간의 정수 **밀리초** 수로 설정하세요.
'''
hints = [
  "시점 둘의 차는 시계 자신의 단위로 된 duration입니다. 더 거친 단위로 변환하면 정밀도를 잃으므로 명시적으로 요청해야 합니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "cpp.cheatsheet_advanced.26.jthread"
title = "나가는 길에 스스로 join"
story = "퍼시벌 스트리트의 알렉스는 둘째 스레드에서 야간 배치를 시작하고, 스코프가 끝나면 기다려지길 원한다 — 잊어버릴 수도 있는 줄 없이."
brief = '''
`void work();` — `t`가 스코프를 벗어날 때 **자동으로 join되는** 새 스레드
`t`에서 `work`를 시작하세요. C++20, `<thread>`는 포함되어 있습니다.
'''
hints = [
  "파괴 시점에 아직 joinable한 평범한 스레드는 프로그램을 종료시킵니다. detach는 절대 join하지 않습니다. C++20은 소멸자가 join하는 스레드를 추가했습니다 — 생성자가 explicit이니 `=`는 없습니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.cheatsheet_advanced.27.async"
title = "지금 시작, 나중에 수거"
story = "환전 부스는 손님이 오는 순간 환율 조회를 다른 직원에게 보내고, 필요할 때 숫자를 받아 온다."
brief = '''
`int work(int x);` — `work(5)`를 **다른 스레드에서 즉시** 시작하고, 나중에
`int r = f.get();`이 결과를 내는 핸들 `f`를 얻으세요. `<future>`는
포함되어 있습니다.
'''
hints = [
  "호출 가능 객체와 인자를 따로 넘기세요 — 직접 호출하면 바로 여기서 실행됩니다. deferred 정책은 `get` 전까지 아무것도 시작하지 않습니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "cpp.cheatsheet_advanced.28.scoped-lock"
title = "잠금 둘, 교착 없이"
story = "글로스터 로드 옆 핀테크의 텔러 둘이 같은 두 계좌 사이에서 반대 방향으로 돈을 옮기고, 지점은 절대 얼어붙어서는 안 된다."
brief = '''
```cpp
struct Acct { std::mutex m; int bal; };
void transfer(Acct& from, Acct& to, int amt) {
  // one line here
  from.bal -= amt; to.bal += amt;
}
```

함수의 나머지 동안 **두** 계좌를 모두 잠그세요. 한 스레드가
`transfer(a, b, 1)`을 루프로 돌리는 동안 다른 스레드는 `transfer(b, a, 1)`을
돌립니다. 프로그램은 절대 교착해서는 안 됩니다.
'''
hints = [
  "인자가 온 순서대로 잠금 둘을 차례로 잡는 것이 바로 두 스레드가 서로를 영원히 기다리는 방법입니다. C++17의 가드 하나가 뮤텍스를 몇 개든 받아 교착 없이 획득합니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.cheatsheet_advanced.29.fetch-add"
title = "내 것 직전의 숫자"
story = "코즈웨이베이역의 개찰구 여덟 개가 카운터 하나를 공유한다. 게이트마다 자기 클릭 직전의 카운트가 필요하고, 어떤 클릭도 잃어서는 안 된다."
brief = '''
`std::atomic<int> hits{0};`가 스레드 여덟 개에서 동시에 증가합니다. 각
스레드에서 `1`을 더하고 `int before`를 **이 스레드의 증가 직전** 값으로
설정하세요. 어떤 증가도 잃어서는 안 됩니다.
'''
hints = [
  "값을 읽고 새 값을 저장하는 것은 별개의 원자적 두 단계이고, 그 사이에 다른 스레드가 끼어듭니다. 전위 증가는 원자적이지만 이후의 값을 돌려줍니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet_advanced.30.condition-variable"
title = "무언가 있을 때까지 기다려라"
story = "정오, 대포가 울리고, 럭키맥의 패스 창구: 러너는 접시가 정말 거기 있을 때까지 자고, 다른 것에는 깨지 않으며, 일찍 내려놓은 접시를 절대 놓치지 않는다."
brief = '''
`std::mutex m; std::condition_variable cv; std::queue<int> q;` — 소비자의
시작에서 잠금을 잡고 **`q`가 비어 있지 않을 때까지 막으세요**. 우리가 오기
전에 생산자가 이미 push하고 notify했어도 올바르고, 가짜 깨어남에도
견고하게. 그 뒤에도 잠금은 여전히 잡혀 있습니다.
'''
hints = [
  "wait에는 풀었다가 다시 잡을 수 있는 잠금이 필요하므로 단순한 가드도, 맨 뮤텍스도 안 됩니다. 술어를 받는 오버로드는 깰 때마다 다시 검사하고, 이미 참이면 즉시 돌아옵니다.",
]
