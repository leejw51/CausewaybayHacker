]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.cheatsheet_advanced.13.move-ctor"
title = "열쇠를 받고, 아무것도 남기지 마라"
story = "이워 스트리트의 전당포가 사물함의 내용물을 넘겨받는다. 옛 표는 아무것도 가리키지 않게 두어야지, 아니면 사물함이 두 번 비워진다."
brief = '''
```cpp
struct Buf {
  int* data; int n;
  explicit Buf(int n) : data(new int[n]), n(n) {}
  ~Buf() { delete[] data; }
  Buf(const Buf&) = delete;
  Buf& operator=(const Buf&) = delete;
  // the move constructor goes here
};
```

이동 생성자를 추가하세요: `Buf b(std::move(a));`가 `a`의 배열을 넘겨받고,
이동된 뒤의 `a`는 **파괴해도 안전**해야 합니다. `<utility>`는 포함되어
있습니다.
'''
hints = [
  "매개변수는 rvalue 참조이고, 비울 거라면 `const`일 수 없습니다. 유틸리티 하나가 새 값을 저장하고 옛 값을 돌려주는 것을 식 하나로 합니다.",
]

