```

`seen`이 컴파일되도록 해셔의 첫 줄을 쓰세요.
'''
hints = [
  "해셔는 키 하나를 받아 `size_t`를 돌려주는 호출 연산자입니다 — 그리고 컨테이너는 `const` 객체에서 그것을 부릅니다. 키 둘과 `bool`은 해시가 아니라 비교자입니다.",
]

