# C++ LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/cpp/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "cpp.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet_advanced.01.auto-params"
title = "어떤 둘이든"
story = "헤네시 로드의 환전소는 달러 요금에 센트 팁을 더하는데, 타입 쌍마다 함수를 따로 두고 싶지는 않다."
brief = '''
`add(1, 2.5)`가 컴파일되어 `3.5`를 돌려주고 `add(std::string("a"), "b")`도
컴파일되도록 `add`를 **하나의** 정의로 정의하세요. C++20.
'''
hints = [
  "C++20부터 매개변수 목록의 자리표시자는 그 자체로 함수를 템플릿으로 만듭니다 — 그리고 자리표시자 하나하나가 각자의 타입입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.cheatsheet_advanced.02.constrained-member"
title = "상자 밖에서"
story = "소고의 재고 조사는 온전한 품목만 누계를 내고 — 그것을 보고하는 멤버는 클래스 밖, .cpp에 정의되어 있다."
brief = '''
```cpp
template <std::integral T>
struct Stat {
  T s = 0;
  void add(T x) { s += x; }
  T sum() const;
};
```

`sum`을 struct **밖에서** 정의하세요. `<concepts>`는 포함되어 있습니다.
'''
hints = [
  "클래스 템플릿의 out-of-line 멤버는 템플릿 헤더를 되풀이합니다 — 그리고 제약까지 포함해 같은 헤더여야 합니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.cheatsheet_advanced.03.mutable-capture"
title = "번호표 기계"
story = "럭키맥 카운터의 번호표 기계는 0, 1, 2를 내주고 — 바깥 어디에도 카운터 변수 없이 자기 개수를 스스로 센다."
brief = '''
연속 호출에서 `0`, 그다음 `1`, 그다음 `2`를 돌려주는 호출 가능 객체 `next`를
만드세요. **람다 밖에는 `n`이라는 변수가 없습니다.**
'''
hints = [
  "캡처는 대괄호 안에서 바로 초기화할 수 있습니다. 람다의 호출 연산자는 따로 말하지 않으면 `const`입니다 — 그리고 후위 증가와 전위 증가에 주의하세요.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.cheatsheet_advanced.04.this-capture"
title = "나도 세어 줘"
story = "코즈웨이베이역의 개찰구가 계수기를 내준다. 클릭 하나하나가 사본이 아니라 개찰구 자신의 집계에 떨어져야 한다."
brief = '''
```cpp
struct Counter {
  int count = 0;
  std::function<void()> ticker();
};
```

`ticker` 안에서 람다를 돌려주세요. 그것을 두 번 호출하면 **이 객체의**
`count`가 `2`가 되어야 합니다.
'''
hints = [
  "데이터 멤버는 변수가 아니므로 캡처 목록에 이름으로 들어갈 수 없습니다. 객체를 캡처하세요 — 진짜가 바뀌도록 포인터로.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.cheatsheet_advanced.05.recursive-lambda"
title = "자기 자신을 부른다"
story = "자딘스 바자 빵집의 파티시에는 에그타르트 집계를 자기 자신을 부르는 함수로 쓴다 — main 안에서, 이름 붙은 함수 하나 없이."
brief = '''
`fib(10)`이 `55`를 돌려주도록 `fib`를 **자기 자신을 호출하는** 지역 람다로
