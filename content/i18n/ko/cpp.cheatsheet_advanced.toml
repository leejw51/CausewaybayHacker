# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.cheatsheet_advanced.18.views-pipeline"
title = "게으른 파이프라인"
story = "소고 오락실 점수판은 처음 세 짝수 점수의 제곱을 원하고, 보드가 거기까지 스크롤될 때만 계산한다."
