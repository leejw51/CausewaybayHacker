[[quest]]
id    = "cpp.cheatsheet_advanced.12.weak-lock"
title = "아직 거기 있나?"
story = "자딘스 바자 위층의 관리인은 7호 세입자를 소유하지 않는 메모로 적어 두고, 아직 사는지 확인해야 한다 — 그리고 말하는 동안은 로비에 붙잡아 둬야 한다."
