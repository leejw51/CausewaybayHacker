[[quest]]
id    = "cpp.cheatsheet_advanced.20.pair-hash"
title = "두 반쪽으로 된 키"
story = "코즈웨이베이 격자는 (행, 열)로 방문되고, 방문한 칸의 해시 집합에는 표준이 내놓지 않은 해셔가 필요하다."
