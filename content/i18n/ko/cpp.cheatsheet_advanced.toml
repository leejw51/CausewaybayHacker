'''
hints = [
  "`auto` 변수는 자기 초기화식에 나타날 수 없습니다. 호출 가능 타입을 선언한 변수는 됩니다 — 그리고 람다는 그것을 캡처해야 합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.cheatsheet_advanced.06.if-constexpr"
title = "분기 하나만"
story = "태풍 대피항 부두의 계량대는 상자 개수나 라벨을 받고 — 받은 것에 말이 안 되는 분기는 컴파일을 거부한다."
brief = '''
```cpp
template <typename T>
auto weigh(const T& x) {
  // one line here
}
```

`T`가 정수 타입이면 `x * 2`를, 아니면 `x.size()`를 돌려주세요. `weigh(21)`과
`weigh(std::string("abc"))`가 둘 다 컴파일되어야 합니다. `<type_traits>`는
포함되어 있습니다.
'''
hints = [
  "평범한 `if`는 모든 `T`에 대해 두 분기를 다 컴파일합니다. 조건은 트레이트 타입이 아니라 값이어야 하고 — 다른 분기를 막아 주는 것은 `else`입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.cheatsheet_advanced.07.static-assert"
title = "실행이 아니라 빌드를 실패시켜라"
story = "눈데이 건 포수들은 장전하기도 전에 장약의 제곱을 확인한다 — 산술이 틀리면 아무것도 나가지 않는다."
brief = '''
`constexpr int sq(int x) { return x * x; }`가 선언되어 있습니다.
**네임스페이스 스코프**에서, `sq(12)`가 `144`가 아니면 **컴파일**이
실패하게 하세요 — 런타임에 검사되는 것이 있어서는 안 됩니다.
'''
hints = [
  "`constexpr` 호출은 컴파일러가 평가할 수 있고, 컴파일 시간에 사는 단언문이 있습니다. C++17부터 메시지는 선택이지만, 주려면 문자열이어야 합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.cheatsheet_advanced.08.enum-class"
title = "숫자가 노선이 된다"
story = "코즈웨이베이의 MTR 안내판은 선로에서 노선 번호를 읽어 제대로 된, 스코프가 있는, 1바이트짜리 노선 코드로 바꿔야 한다."
brief = '''
```cpp
