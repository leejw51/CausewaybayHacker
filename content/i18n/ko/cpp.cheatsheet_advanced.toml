[[quest]]
id    = "cpp.cheatsheet_advanced.16.visit"
title = "무엇이든 그것"
story = "타임스 스퀘어 영화관의 표는 좌석 번호이거나 게스트 명단의 이름이다. 안내원은 들어 있는 쪽을 출력한다."
