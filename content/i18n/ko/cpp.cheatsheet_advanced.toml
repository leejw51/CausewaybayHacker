```

`int n`은 입력에서 읽었고 `0`, `1`, `2` 중 하나입니다. 해당 열거자를 담은
`Line l`을 선언하세요.
'''
hints = [
  "스코프 enum은 어느 방향으로도 암시적으로 변환되지 않습니다. 중괄호 초기화는 런타임 `int`의 좁히기를 거부합니다. 이름 붙은 캐스트 중 하나가 할 일입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.cheatsheet_advanced.09.spaceship"
title = "하나 값에 여섯"
story = "항만 사무소는 이제 모든 정박지를 온갖 방법으로 — 작다, 같다, 이상이다 — 비교할 수 있길 원하고, 연산자 여섯을 손으로 쓰기는 거부한다."
brief = '''
`struct Pt { int r, c; };` — `a < b`, `a == b`, `a >= b`가 모두 컴파일되고
`r` 다음 `c`로 순서가 매겨지도록 **멤버 하나**를 추가하세요. C++20,
`<compare>`는 포함되어 있습니다.
'''
hints = [
  "default로 둔 삼방 연산자 하나가 `==`까지 줍니다. 반환 타입은 순서 범주입니다 — 컴파일러가 추론하게 두세요 — 그리고 default로 둔 비교는 `const`여야 합니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.cheatsheet_advanced.10.dynamic-cast"
title = "정말 원인가"
story = "자페 로드의 간판 가게는 모든 주문을 기반 포인터로 들고 있고, 둥근 간판 기계는 정말 원인 것만 받아야 한다."
brief = '''
```cpp
struct Shape { virtual double area() const = 0; virtual ~Shape() = default; };
struct Circle : Shape { double r; double area() const override { return 3.14 * r * r; } };
struct Square : Shape { double s; double area() const override { return s * s; } };
```

`Shape* s`는 어떤 도형을 가리킵니다. 정말 `Circle`일 때 `c`가 그것을
**`Circle`로서** 가리키고, 아니면 `nullptr`이 되게 하세요.
'''
hints = [
  "런타임에 객체에게 무엇이냐고 묻는 캐스트는 하나뿐입니다. 나머지는 포인터를 재해석할 뿐이고 절대 null을 내지 않습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.cheatsheet_advanced.11.move-unique"
title = "넘겨주기"
story = "퍼시벌 스트리트 창고의 소포에는 주인이 정확히 하나다. 밴에 실으면 배달원은 더는 그것을 들고 있지 않다."
