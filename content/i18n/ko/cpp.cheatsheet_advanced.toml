원소가 `4 16 36` — **처음 세 짝수**의 제곱 — 인 게으른 range `r`을
만드세요. `<ranges>`는 포함되어 있습니다.
'''
hints = [
  "어댑터는 `|`로 합성되고 왼쪽에서 오른쪽으로 적용됩니다: 필터 전에 셋을 취하면 엉뚱한 셋을 취하고, 먼저 뒤집으면 반대쪽 끝에서 취합니다.",
]

