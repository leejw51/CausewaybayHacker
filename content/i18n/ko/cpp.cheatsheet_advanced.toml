title = "어떤 텍스트에서든 숫자, 아니면 없음"
story = "터널 요금소는 도착하는 텍스트가 무엇이든 — 리더기의 std::string이든, 테스트의 리터럴이든 — 파싱해서 요금 아니면 없음으로 답한다."
