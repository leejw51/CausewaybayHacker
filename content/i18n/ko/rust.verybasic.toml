# RUST LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/rust/verybasic.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "rust.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.verybasic.01.print"
title = "첫 불빛"
story = "06:40, 자딘스 바자 위. 키오스크는 손님 이름을 알면서도 아무에게도 인사하지 않는다."
brief = '''
한 줄, 이름을 읽습니다. `hello, `와 그 이름을 한 줄에 출력하세요. `println!`은 한 줄을 출력하는 매크로이고, `{}`는 값이 들어갈 자리입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  mei
output: hello, mei
```
'''
hints = [
  "println!(\"hello, {}\", name); — 매크로는 !를 붙이고, {}에 name이 들어갑니다.",
  "!가 없으면 존재하지 않는 함수이고, 인자가 없으면 {}가 출력할 것이 없습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.verybasic.02.int-types"
title = "더 넓은 계산대"
story = "퍼시벌 스트리트의 계산대는 i32로 세는데 하루 합계는 u64를 원한다. 캐스트 줄이 비어 있다."
brief = '''
음이 아닌 정수 `a`를 `i32`로 읽습니다. 같은 값을 `u64`로 가진 `b`를 만들면, 프로그램이 `b + 1`을 출력합니다. `as`가 정수 너비 사이를 변환합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  12
output: 13
```
'''
hints = [
  "let b: u64 = a as u64; — as가 캐스트이고, 왼쪽의 타입이 무엇이 될지를 말합니다.",
  "i32는 저절로 u64가 되지 않고, u8을 거치는 캐스트는 255 위를 전부 잃습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.verybasic.03.floats"
title = "소수점 저울"
story = "보링턴 로드의 저울은 소수 열 자리를 찍는데, 읽어 온 숫자는 잘못된 너비에 담겨 있다."
brief = '''
소수 하나를 넓은 실수형 `f64`인 `x`로 읽으면, 프로그램이 소수 열 자리로 출력합니다. `parse`가 글자에서 숫자를 읽고, `trim`이 먼저 줄바꿈을 떼어냅니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3.14159265
output: 3.1415926500
```
'''
hints = [
  "let x: f64 = input.trim().parse().unwrap(); — f64가 넓은 쪽이고, f32는 자릿수가 달라집니다.",
  "trim하지 않은 글자를 parse하면 줄바꿈에서 실패하고, &str은 숫자가 아닙니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.verybasic.04.strings"
title = "가게 간판"
story = "이워 스트리트의 간판 페인터는 가게 이름을 소문자로 받았고, 간판은 소리쳐야 한다."
brief = '''
한 줄을 읽어 대문자로 출력하세요. `String`에는 대문자 복사본을 돌려주는 메서드가 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  jardines bazaar
output: JARDINES BAZAAR
```
'''
hints = [
  "let upper = line.to_uppercase(); — Rust의 이름은 to_uppercase입니다.",
  "to_upper와 toUpperCase는 다른 언어이고, to_lowercase는 반대 방향입니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.verybasic.05.bool-if"
title = "짝수냐 홀수냐"
story = "트램 문이 승객을 세는데, 홀짝을 알리는 불빛은 한 번도 바뀌지 않는다."
brief = '''
정수 `n`을 읽습니다. `n`이 짝수일 때 참인 `bool`을 `even`에 넣으면, 프로그램이 그것으로 `even` 또는 `odd`를 출력합니다. `%`는 나머지, `==`는 비교입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "let even = n % 2 == 0; — 나머지가 0이면 짝수이고, ==가 그것을 bool로 만듭니다.",
  "나머지만 두면 정수이고, if는 bool을 원합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.verybasic.06.loops"
title = "트램 카운트"
story = "하이산 플레이스 정류장은 1부터 막차까지 요금을 더하는데 합계는 0에 머문다."
brief = '''
`n`을 읽습니다. 1부터 `n`까지(포함) 모든 정수를 `total`에 더하면, 프로그램이 출력합니다. 범위에 대한 `for`가 그 일을 하고, `..=`는 끝을 포함합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: 10
```
'''
hints = [
  "for i in 1..=n { total += i; } — ..=는 n까지 닿고, ..는 하나 앞에서 멈춥니다.",
  "점 세 개는 Rust가 아니고, += i 대신 = i를 쓰면 마지막 값만 남습니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.verybasic.07.functions"
title = "두 배 요금"
story = "타임스 스퀘어 키오스크는 자정 이후 두 배를 받는데, 두 배로 만드는 함수가 요금을 그대로 돌려준다."
brief = '''
`double`을 쓰세요: `i64` 하나를 받아 두 배를 돌려주는 함수입니다. 프로그램은 `n`을 읽고 `double(n)`을 출력합니다. 함수의 마지막 식은 세미콜론 없이 두면 반환값이 됩니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5
output: 10
```
'''
hints = [
  "fn double(x: i64) -> i64 { x * 2 } — ->가 반환 타입을 말하고, 세미콜론 없는 x * 2가 돌아오는 값입니다.",
  "끝의 세미콜론은 값을 아무것도 아닌 것으로 만들고, ->가 없으면 함수는 아무것도 돌려주지 않습니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.verybasic.08.structs"
title = "노점 카드"
story = "보링턴 로드의 모든 노점에는 이름과 가격이 적힌 카드가 있는데, 그것을 담을 타입이 없다."
brief = '''
`Stall`을 선언하세요: `String`인 `name`과 `i64`인 `price`를 가진 구조체입니다. 프로그램은 둘을 읽어 하나를 만들고 출력합니다. `struct`가 타입 이름을 짓고 필드와 타입을 나열합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 38
output: fish: 38
```
'''
hints = [
  "struct Stall { name: String, price: i64 } — 중괄호, 필드: 타입, 쉼표, 세미콜론 없음.",
  "str은 크기가 없어 필드가 될 수 없고, 튜플 구조체에는 만들 때 쓸 필드 이름이 없습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.verybasic.09.struct-method"
title = "노점 합계"
story = "노점 카드는 가격과 수량을 알면서 한 줄이 얼마인지 말하지 못한다."
brief = '''
`Stall`에 `price * qty`를 돌려주는 메서드 `total`을 주세요. 프로그램은 `stall.total()`을 호출합니다. 메서드는 `impl` 블록 안에 살고 `&self`를 받습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  38 3
output: 114
```
'''
hints = [
  "impl Stall { fn total(&self) -> i64 { self.price * self.qty } } — &self가 메서드가 자기 필드에 닿는 방법입니다.",
  "&self가 없으면 self가 없고, self.가 없으면 price와 qty라는 이름은 존재하지 않습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.verybasic.10.enums"
title = "노선 색"
story = "타임스 스퀘어 아래 MTR 표지판은 세 노선을 알지만 췬완선은 아무 색도 칠하지 않는다."
brief = '''
`Line`에 대한 `match`에는 `Island`와 `KwunTong` 팔(arm)이 있습니다. 색이 `red`인 `TsuenWan` 팔을 추가하세요. 팔은 `Type::Variant => value,` 꼴입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "Line::TsuenWan => \"red\", — 앞에 열거형을 붙인 변형, 화살표, 값, 쉼표.",
  "맨 이름은 모두 잡는 바인딩이지 변형이 아니고, ->는 팔이 아닙니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.verybasic.11.vector"
title = "하이산의 줄"
story = "하이산 플레이스의 줄 카운터에는 사람이 올 때마다 늘어나는 목록이 필요한데, 그 목록이 만들어지지 않는다."
brief = '''
`v`를 만드세요: 루프가 push할 수 있는, 비어 있고 늘어나는 `i64` 벡터입니다. 프로그램은 길이와 합을 출력합니다. 벡터는 `Vec::new()`로 만들고 늘리려면 `mut`여야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 6
```
'''
hints = [
  "let mut v: Vec<i64> = Vec::new(); — 괄호가 있는 new(), 그리고 push를 허용하는 mut.",
  "() 없는 Vec::new는 호출이 아니라 함수 자체이고, vec![0]은 0 하나를 담고 시작합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.verybasic.12.vector-edit"
title = "첫 번째로 떠난 사람"
story = "하이산 플레이스 줄의 첫 사람이 안내를 받았는데 목록에는 아직 맨 앞에 있다."
brief = '''
`v`는 그 줄의 정수들을 담고 있습니다. 인덱스 0의 값을 지우면, 프로그램이 남은 것을 출력합니다. 벡터는 인덱스로 지웁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4 5 6 7
output: 5 6 7
```
'''
hints = [
  "v.remove(0); — remove는 인덱스를 받고 나머지를 앞으로 당깁니다.",
  "pop은 마지막을 빼고, 인덱스 1은 두 번째이며, delete는 Vec의 메서드가 아닙니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.verybasic.13.list"
title = "접시 더미"
story = "딤섬 카운터는 새 접시를 레일 맨 앞에 놓는데, 레일은 들어온 순서대로 보여 준다."
brief = '''
`list`는 `LinkedList<i64>`입니다. 각 `x`를 맨 앞에 넣어, 프로그램이 값을 거꾸로 출력하게 하세요. 연결 리스트는 양 끝에 넣을 수 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "list.push_front(x); — 앞쪽 끝이고, push_back은 반대쪽입니다.",
  "LinkedList에는 push도, 인덱스로 넣는 insert도 없습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.verybasic.14.maps"
title = "주문 패드"
story = "럭키 맥 주문 패드는 각 요리가 몇 번 불렸는지 세야 하는데 모든 요리가 1로 나온다."
brief = '''
`count`는 `BTreeMap<String, i64>`입니다. 단어 `w`마다 그 횟수에 1을 더하세요. 새 단어는 0에서 시작합니다. 프로그램은 `word count`를 한 줄씩 정렬해 출력합니다. `entry`가 자리를 찾거나 만들고, `or_insert`가 시작값을 줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "*count.entry(w.to_string()).or_insert(0) += 1; — or_insert가 참조를 돌려주고, +=에는 *가 필요합니다.",
  "insert는 매번 1로 덮어쓰고, get은 더할 수 없는 공유 참조를 돌려줍니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.verybasic.15.hashtable"
title = "뒤죽박죽 집계"
story = "럭키 맥의 해시 집계는 출력할 때마다 다른 순서로 나온다."
brief = '''
`counts`는 `HashMap`이라 키를 정해진 순서 없이 돕니다. `keys`는 그 키들을 `Vec`에 담고 있습니다. 집계가 매번 같게 출력되도록 `keys`를 정렬하세요. `Vec`은 제자리에서 정렬됩니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  f e d c b a f
output: a 1
        b 1
        c 1
        d 1
        e 1
        f 2
```
'''
hints = [
  "keys.sort(); — 제자리에서, 오름차순으로.",
  "sorted()는 Vec에 없고, reverse는 무작위 순서를 뒤집을 뿐이며, b.cmp(a)는 내림차순입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.verybasic.16.sets"
title = "도장책"
story = "트램 도장책은 같은 트램이 몇 번을 지나가도 도장을 한 번만 받는다."
brief = '''
`seen`은 `BTreeSet<i64>`입니다. 각 `x`를 넣으세요. 이미 있는 값은 두 번 들어가지 않습니다. 프로그램은 서로 다른 값의 개수와 그 값들을 순서대로 출력합니다. 집합은 insert합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "seen.insert(x); — 집합은 insert하고, 반복은 아무것도 바꾸지 않습니다.",
  "push와 add는 집합의 메서드가 아니고, x * 2는 다른 값입니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.verybasic.17.stack"
title = "나중 것이 먼저"
story = "딤섬 카운터의 깨끗한 접시는 더미 맨 위에서 빠지는데, 더미를 바닥부터 읽고 있다."
brief = '''
`stack`은 스택으로 쓰는 `Vec<i64>`입니다. 빌 때까지 값을 pop해 각각 `out`에 push하면, 프로그램이 출력합니다. 나중 것이 먼저입니다. `pop`은 `Option`을 주므로 `while let`이 루프입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "while let Some(v) = stack.pop() { out.push(v.to_string()); } — None이 루프를 끝낼 때까지 pop이 맨 위를 뺍니다.",
  "Vec에는 pop_front가 없고, 앞에서 순회하거나 0에 넣으면 원래 순서가 그대로 돌아옵니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.verybasic.18.queue"
title = "먼저 온 것이 먼저"
story = "소고 카운터의 번호표는 줄 앞에서 불리는데, 화면은 뒤를 부른다."
brief = '''
`queue`는 `VecDeque<i64>`입니다. 맨 앞의 값을 빼서 `first`에 넣으면, 프로그램이 두 번째를 빼서 둘 다 출력합니다. 덱은 양 끝에서 pop합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 1 2
```
'''
hints = [
  "let first = queue.pop_front().unwrap(); — 앞쪽 끝을, 꺼내면서.",
  "pop_back은 반대쪽이고, front()는 빼지 않고 보기만 해서 두 번째가 같은 값이 되며, VecDeque에 pop은 없습니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.verybasic.19.heap"
title = "가장 작은 것부터"
story = "빅토리아 파크 수도꼭지 명단은 가장 작은 번호표부터 부르는데, 힙은 계속 가장 큰 것을 내놓는다."
brief = '''
`heap`은 `BinaryHeap<Reverse<i64>>`입니다. 모든 값을 `Reverse`로 감싸 최대 힙을 최소 힙으로 바꾼 것입니다. 각 `x`를 넣으면, 프로그램이 가장 작은 것부터 꺼냅니다. 들어가는 것은 감싸야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(std::cmp::Reverse(x)); — 힙은 Reverse<i64>를 담으니 그것을 push합니다.",
  "맨 x는 타입이 틀리고, -x는 가장 큰 것을 부호를 바꿔 먼저 내놓으며, insert는 힙의 메서드가 아닙니다.",
]

