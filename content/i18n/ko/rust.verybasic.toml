id    = "rust.verybasic.22.reverse"
title = "거꾸로"
story = "삼판의 이름은 선미에 거꾸로 칠해지는데 페인터에게는 정방향 사본뿐이다."
brief = '''
한 줄을 읽습니다. 글자 순서를 뒤집은 같은 텍스트 `rev`를 만들면, 프로그램이 출력합니다. 글자는 `chars()`에서 나오고, 이터레이터는 거꾸로 갈 수 있으며, 글자의 이터레이터는 `String`으로 모을 수 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "let rev: String = s.chars().rev().collect(); — 이터레이터에 rev(), String으로 collect().",
  "reverse는 Vec의 메서드이지 이터레이터나 str의 것이 아니고, to_string은 정방향으로 복사합니다.",
