# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.verybasic.23.closures"
title = "봉사료"
story = "푸드코트 프린터는 모든 줄에 같은 봉사료를 더하는데, 첫 줄 전에 그 액수를 잊어버렸다."
brief = '''
`k`를 읽고, 이어서 정수 한 줄을 읽습니다. `add`를 만드세요: `i64`를 받아 `k`를 더해 돌려주는 클로저입니다. 프로그램은 모든 숫자에 그것을 적용합니다. 클로저는 `|args| body`이고, 바깥의 `k`를 쓸 수 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "let add = |x: i64| x + k; — 세로선이 인자를 감싸고, 몸체가 뒤따르며, k는 잡힙니다.",
  "클로저는 몸체 앞에 ->가 없고 fn으로 쓰지 않으며, x - k는 틀린 합입니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "rust.verybasic.24.lambdas"
title = "짝수 테이블"
story = "소고 푸드홀은 짝수 번호 테이블에 번호의 제곱을 청구하는데, 계산대의 체인에는 아무것도 없다."
brief = '''
`nums`는 그 줄의 정수들을 담고 있습니다. 짝수인 값들의 제곱의 합 `total`을 이터레이터 체인 하나로 만드세요. `filter`는 남기고, `map`은 바꾸고, `sum`은 더합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "let total: i64 = nums.iter().filter(|&&x| x % 2 == 0).map(|&x| x * x).sum(); — &&x가 filter가 건네는 두 겹의 참조를 벗깁니다.",
  "x % 2 == 1은 홀수를 남기고, & 패턴이 없으면 참조에 나머지를 취하며, filter가 없으면 모든 수가 제곱됩니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "rust.verybasic.25.threads"
title = "네 개의 계산대"
story = "자딘스 바자는 영수증마다 계산대를 하나씩 여는데, 계산대가 시작되지 않는다."
brief = '''
각 `x`마다 `x * x`를 계산하는 스레드를 spawn하고, 그 핸들을 `handles`에 push하세요. 프로그램은 순서대로 join하고 제곱을 출력합니다. `thread::spawn`은 클로저를 받고, `move`는 스레드에 `x`의 사본을 줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 1 4 9
```
'''
hints = [
  "handles.push(thread::spawn(move || x * x)); — move, 인자 없음, 값은 x * x.",
  "move가 없으면 스레드가 자기보다 오래 못 사는 루프 변수를 빌리고, spawn의 클로저는 인자를 받지 않으며, x + x는 두 배입니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "rust.verybasic.26.mutex"
title = "계산기 하나, 손 여럿"
story = "자딘스 바자의 모든 계산대가 동시에 하나의 계산기에 매출을 더하는데, 계산기는 0을 가리킨다."
brief = '''
`c`는 각 스레드 안에 있는 `Arc<Mutex<i64>>`의 클론입니다. 뮤텍스 안의 숫자에 `x`를 더하세요. 프로그램은 모든 스레드를 join하고 합계를 출력합니다. `lock()`은 가드를 주고, `*`가 숫자에 닿습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 6
```
'''
hints = [
  "*c.lock().unwrap() += x; — lock, 가드를 unwrap, *로 i64에 닿고, 더합니다.",
  "가드 자체에는 더할 수 없고, lock()은 unwrap해야 하는 Result를 돌려주며, = x는 더하지 않고 덮어씁니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "rust.verybasic.27.binary-tree"
title = "자동 완성"
story = "퍼시벌 스트리트 전화 키오스크, 유령 글자가 전에 본 트리를 들고 돌아왔다. 값이 어느 쪽으로 갈지 정하는 그 한 줄만은 완성해 주지 못한다."
brief = '''
`insert`는 `value`를 `n` 아래의 트리에 넣습니다. 작은 값은 왼쪽 서브트리로, 큰 값은 오른쪽으로 가고, 그 서브트리를 다시 대입합니다. 그 한 줄을 쓰세요. 프로그램은 중위 순회와 높이를 출력합니다. `take()`가 자식을 들어 올려 재귀 호출에 건넵니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if value < n.value { n.left = insert(n.left.take(), value); } else { n.right = insert(n.right.take(), value); } — 비교가 고른 쪽에서 take, 재귀, 다시 대입.",
  "다시 대입하지 않으면 서브트리를 잃고, >는 값을 반대로 보내며, &n.right는 함수가 Option 자체를 원하는 자리에 참조를 넣는 것입니다.",
]
