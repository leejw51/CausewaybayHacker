# ---------------------------------------------------------------- 21
[[quest]]
id    = "rust.verybasic.21.sort-by-key"
title = "리더보드"
story = "하이산 플레이스 오락실 보드는 최고 점수를 맨 위에, 동점은 이름순으로 원하는데, 이름순으로만 보여 준다."
brief = '''
`rows`는 이름과 점수의 `Vec<(String, i64)>`입니다. 점수 내림차순, 그다음 이름 오름차순으로 정렬하면, 프로그램이 `name score`를 한 줄씩 출력합니다. `sort_by_key`는 키로 정렬하고, `Reverse`는 그 일부를 뒤집습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
        mei 90
        alex 95
        bo 90
output: alex 95
        bo 90
        mei 90
```
'''
hints = [
  "rows.sort_by_key(|r| (std::cmp::Reverse(r.1), r.0.clone())); — 튜플 키: 뒤집은 점수, 그다음 이름.",
  "r.1만 쓰면 오름차순이고, clone 없는 r.0은 빌린 곳에서 String을 옮겨 내며, 그냥 sort()는 이름순입니다.",
]

