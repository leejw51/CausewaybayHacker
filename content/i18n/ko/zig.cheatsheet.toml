title = "중량 등급"
story = "계근대는 읽은 톤수로 모든 차량을 등급에 넣고, 가장 무거운 등급은 위가 열려 있다."
brief = '''
`t`는 `i64`입니다. 0부터 9까지(9 포함) 모든 값에 `"light"`를 주는 prong은
