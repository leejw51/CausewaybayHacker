hints = [
  "라벨 붙은 루프는 키워드 뒤에 라벨 이름을 — 이름 앞에 콜론을 붙여 — 적어서 빠져나갑니다. 다른 라벨 점프는 다음 행으로 건너뛸 뿐입니다.",
]

