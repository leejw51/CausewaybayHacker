[[quest]]
id    = "zig.cheatsheet.12.errdefer"
title = "실패할 때만"
story = "터널 입구 차단기는 요금이 통과되면 차를 보내고, 안 되면 티켓을 도로 받는다."
brief = '''
`fill`이 실패하면 `buf`를 해제하고, 성공하면 손대지 않은 채 호출자에게
넘기세요.

```
fn load(gpa: std.mem.Allocator, n: usize) ![]u8 {
    const buf = try gpa.alloc(u8, n);
    // ____
    try fill(buf);
    return buf;
}
```
'''
hints = [
  "그냥 `defer`는 성공을 포함해 모든 출구에서 실행됩니다. 에러로 돌아갈 때만 실행되는 형태가 있습니다.",
]

