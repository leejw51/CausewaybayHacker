brief = '''
`tok`은 `"42"`를 담은 `[]const u8`입니다. `n`을 10진법 `i64`로 만들고,
잘못된 토큰의 에러는 호출자에게 넘기세요.
'''
hints = [
  "타입이 먼저, 그다음 글자, 그다음 진법입니다. 에러 유니온을 돌려주니 `try`를 붙입니다.",
]

