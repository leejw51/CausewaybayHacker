[[quest]]
id    = "zig.cheatsheet.20.labeled-break"
title = "두 루프 모두 빠져나가기"
story = "도난 번호판 하나를 찾는 수색은 차선마다, 차마다 돌고, 찾는 순간 수색 전체가 멈춘다."
