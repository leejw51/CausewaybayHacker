# ZIG LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/zig/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks and identifiers are copied verbatim.

pack   = "zig.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet.01.print"
title = "요금 전광판"
story = "06:00, 해저터널 입구. 1번 부스 위 전광판은 누군가 써 줘야 요금을 보여 준다."
brief = '''
`w`는 stdout 위의 버퍼 writer입니다. `n`을 10진수로 출력하고 줄을 바꾸세요.

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

어느 줄일까요?
'''
hints = [
  "인자는 튜플 `.{ ... }`에 넣고, print는 실패할 수 있으니 `try`를 붙입니다.",
]

