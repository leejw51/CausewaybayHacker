# PYTHON LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/python/verybasic.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "python.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.verybasic.01.print"
title = "첫 가격판"
story = "06:00, 보링턴 로드. 하루의 첫 가격판은 비어 있고 마커는 메이의 손에 있다."
brief = '''
프로그램은 한 줄에 정확히 `hello, causewaybay`를 출력해야 합니다. 표준 출력에 한 줄을 쓰는 내장 함수가 하나 있습니다.

맞는 줄을 고르고, `# FILL` 주석이 있는 자리에 그 줄을 치세요.

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 괄호, 그리고 문자열 안의 쉼표.",
  "Python 3에는 print 문이 없고, print는 함수입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.verybasic.02.int-types"
title = "나눠 내는 계산서"
story = "생선 가게 카운터에서 커피 두 잔에 지폐 한 장. 계산대는 몇 개씩인지와 남는 것을 말해야 하는데 아무 말이 없다."
brief = '''
`a`와 `b`는 정수입니다. 프로그램은 정수 몫과 나머지를 공백으로 띄어 한 줄에 출력해야 합니다. Python에는 각각에 연산자가 하나씩 있습니다.

맞는 줄을 고르고, `# FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(a // b, a % b) — 슬래시 둘은 정수로 내려 나누고, 퍼센트는 나머지입니다.",
  "슬래시 하나는 실수를 줍니다. 3이 아니라 3.5.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.verybasic.03.floats"
title = "정확한 몫"
story = "시장 저울은 그램을 소수 세 자리로 보여 주고 영수증은 두 자리를 원한다. 영수증은 비어 있다."
brief = '''
`x`와 `y`는 실수입니다. 프로그램은 `x / y`를 소수점 아래 정확히 두 자리로 출력해야 합니다. f-string은 콜론 뒤에 서식을 담습니다.

맞는 줄을 고르고, `# FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(f\"{x / y:.2f}\") — 콜론 뒤의 .2f가 서식입니다.",
  "round()는 끝의 0을 떨어뜨립니다. 3.50이 아니라 3.5.",
]

