[[quest]]
id    = "python.verybasic.05.bool-if"
title = "짝수냐 홀수냐"
story = "보링턴 로드의 노점 번호는 한쪽이 짝수, 반대쪽이 홀수다. 배달 소년은 번호로 어느 쪽인지 알아야 한다."
brief = '''
