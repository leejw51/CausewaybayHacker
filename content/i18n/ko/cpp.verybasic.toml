# C++ LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/cpp/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "cpp.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.verybasic.01.print"
title = "대포의 첫마디"
story = "12:00, 눈데이 건. 발포 일지는 한 줄로 시작해야 하는데 그 줄이 없다."
brief = '''
프로그램은 정확히 `hello, causewaybay`와 줄바꿈을 출력해야 합니다. C++에서는
표준 출력 스트림으로 보내는 문장 하나입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — 스트림, 문자열, 줄바꿈, 세미콜론.",
  "작은따옴표는 문자 상수를 만듭니다. 문자열에는 큰따옴표가 필요합니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.verybasic.02.int-types"
title = "int에 너무 큰 숫자"
story = "대포 일지는 1860년 이래 쏜 포탄을 100분의 1 단위로 세는데, 그것을 담던 레지스터는 32비트 너비다."
brief = '''
`a`를 읽습니다. 프로그램에는 `a`에 10억을 곱한 값을 담는 64비트 정수 `big`이
필요합니다. `a`가 2보다 크면 `int`에는 들어가지 않는 값입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
output: 3000000000
```
'''
hints = [
  "`long long big = a * 1000000000LL;` — `LL` 접미사가 상수도 64비트로 만듭니다.",
  "`int`는 32비트입니다. 50억은 들어가지 않고 결과는 쓰레기가 됩니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.verybasic.03.floats"
title = "소수로 된 조수"
story = "조석표는 한 측정값을 다른 값으로 나누는데, 항만장은 소수 둘째 자리를 원했건만 정수를 찍는다."
brief = '''
양의 정수 `a`와 `b`를 읽습니다. 프로그램에는 몫을 `double`로 담은 `q`가
필요합니다. 정수를 정수로 나누면 둘 중 하나를 먼저 변환하지 않는 한 정수입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "`double q = static_cast<double>(a) / b;` — 나누기 전에 한쪽을 변환합니다.",
  "정수 둘의 `a / b`는 double이 되기 전에 정수로 내림됩니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.verybasic.04.strings"
title = "이름이 얼마나 긴가"
story = "삼판의 이름은 뱃머리에 칠해져 있고, 항만 일지는 그 길이를 글자 수로 원한다."
brief = '''
한 줄을 `s`에 읽습니다. 프로그램은 그 안에 글자가 몇 개 있는지 출력해야
합니다. `std::string`은 자기 길이를 압니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  kwan lee
output: 8
```
'''
hints = [
  "`std::cout << s.size() << '\\n';` — `size()`는 호출이라 괄호가 필요합니다.",
  "`sizeof(s)`는 문자열 객체 자체의 크기이지, 그 안의 텍스트 크기가 아닙니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.verybasic.05.bool-if"
title = "짝수냐 홀수냐"
story = "선가의 윈치는 삼판을 두 척씩 올리고, 집계표는 마지막 배가 혼자 올라가는지 말해 준다."
brief = '''
`n`을 읽습니다. 프로그램에는 `n`이 2로 나누어떨어질 때 참인 `bool` `even`이
필요합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "`bool even = n % 2 == 0;` — `%`는 나머지, `==`는 비교입니다.",
  "`=` 하나는 대입입니다. 비교에는 두 개가 필요합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.verybasic.06.loops"
title = "예포를 세며"
story = "대포는 n발을 쏘고 일지는 그 번호들을 더하는데, 쓰는 루프가 시작조차 하지 않는다."
brief = '''
`n`을 읽습니다. 프로그램은 `1 + 2 + … + n`을 `sum`에 더해야 합니다. 루프의
본문은 적혀 있고, `i`를 1부터 `n`까지 걷는 `for` 머리가 빈칸입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  10
output: 55
```
'''
hints = [
  "`for (long long i = 1; i <= n; ++i) {` — 세미콜론으로 나뉜 세 절.",
  "`<`는 하나 모자라게 멈춥니다. `<=`는 `n` 자체를 포함합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.verybasic.07.functions"
title = "그것의 제곱"
story = "펌프실 계기는 측정값을 보여 주고 표시판은 그 제곱을 원하는데, 그 일을 할 함수는 쓸모 있는 것을 하나도 돌려주지 않는다."
brief = '''
`square`는 숫자 하나를 받아 그 숫자에 자기 자신을 곱한 값을 돌려줘야 합니다.
본문이 빈칸이고, `main`은 `x`를 읽어 `square(x)`를 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7
output: 49
```
'''
hints = [
  "`return x * x;` — 곱하고, 결과를 돌려줍니다.",
  "C++에서 `^`는 거듭제곱이 아니라 비트 XOR입니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.verybasic.08.structs"
title = "노점 하나, 필드 둘"
story = "태풍 대피항의 노점 대장은 노점마다 이름과 가격을 적는데, 새 노점의 기록이 비어 있다."
brief = '''
`Stall`에는 `name`과 `price`가 있습니다. 프로그램은 둘 다 읽었고, 그것들로
만든 `Stall` `s`가 필요합니다. 집합체는 중괄호로, 필드 순서대로 초기화합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "`Stall s{name, price};` — 중괄호, 그리고 구조체가 선언한 순서의 필드들.",
  "초기화 값이 하나면 첫 필드만 채워지고, 가격은 0이 됩니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.verybasic.09.struct-method"
title = "노점 스스로의 합계"
story = "노점 기록마다 가격과 수량을 아는데, 그 `total()`은 어떤 질문에도 0이라고 답한다."
brief = '''
`Stall::total`은 `price` 곱하기 `qty`를 돌려줘야 합니다. 멤버 함수 안에서는
필드를 이름으로 씁니다. 본문이 빈칸입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "`return price * qty;` — 이름으로 부른 필드들을 곱합니다.",
  "`this`는 포인터라 `this->price`가 될 것입니다. 맨 이름이 더 간단합니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.verybasic.10.enums"
title = "두 노선, 두 색"
story = "대피항 버스 정류장 위 환승 표지판은 MTR 노선 둘을 가리키는데, 열거자를 고르는 전선이 끊어져 있다."
brief = '''
`island`나 `tsuenwan` 중 한 단어를 읽습니다. 프로그램에는 그 단어로 고른
`Line` 열거자 `line`이 필요합니다. 색을 출력하는 `switch`는 적혀 있습니다.
`enum class`의 열거자는 언제나 타입과 함께 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "`Line line = word == \"island\" ? Line::Island : Line::TsuenWan;` — 조건 연산자, 한정된 열거자.",
  "앞에 `Line::`이 없으면 `Island`는 컴파일러가 아는 이름이 아닙니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.verybasic.11.vector"
title = "어획, 하나씩"
story = "삼판들은 어획을 숫자 하나씩 내리는데 집계 벡터는 비어 있는 그대로다."
brief = '''
정수 한 줄을 읽습니다. 각 값 `x`는 읽히는 대로 벡터 `xs`에 덧붙여져야 합니다.
루프와 출력 부분은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "`xs.push_back(x);` — 벡터는 뒤쪽으로 자랍니다.",
  "`push`는 `std::stack`의 것입니다. 벡터는 `push_back`이라고 합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.verybasic.12.vector-edit"
title = "첫 배를 빼고"
story = "윈치 대기열은 삼판 번호의 벡터인데, 첫 배는 이미 올라갔지만 아직 목록에 있다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램은 첫 원소를 지우고 나머지를
출력해야 합니다. `erase`는 버릴 원소를 가리키는 반복자를 받습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "`v.erase(v.begin());` — `begin()`은 첫 원소를 가리키는 반복자입니다.",
  "`pop_back`은 마지막 것을 지웁니다. 벡터에는 `pop_front`가 없습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.verybasic.13.list"
title = "줄의 맨 앞"
story = "대피항의 계류 목록은 연결 리스트이고, 새 삼판은 모두 맨 앞에 들어가야 한다."
brief = '''
정수 한 줄을 읽습니다. 각 `x`는 `std::list` `l`의 맨 앞에 넣어져야 하므로,
마지막에 읽은 것이 가장 먼저 출력됩니다. 루프와 출력 부분은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "`l.push_front(x);` — 리스트는 어느 쪽 끝으로든 상수 시간에 자랍니다.",
  "`push_back`은 입력 순서를 유지합니다. 뒤집는 것은 앞쪽입니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.verybasic.14.maps"
title = "집계판"
story = "태풍 대피항의 집계판은 어획 종류마다 수를 세는데 그 수가 전혀 움직이지 않는다."
brief = '''
단어 한 줄을 읽습니다. 각 단어 `w`마다 `counts`의 수가 하나씩 올라가야 합니다.
`std::map`은 없는 키를 처음 인덱싱할 때 0으로 만들어 줍니다. 루프와 정렬된
출력은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "`++counts[w];` — 인덱싱이 키를 0으로 만들고, 그다음 증가합니다.",
  "`at()`은 아직 없는 키에서 예외를 던집니다. `[]`는 키를 만듭니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.verybasic.15.hashtable"
title = "찾아보거나, 말거나"
story = "노점 가격은 해시 테이블에 있고, 아무도 들어 본 적 없는 노점을 물으면 지어낸 0이 아니라 -1로 답해야 한다."
brief = '''
`table`은 첫 줄로 만든, 노점 이름에서 가격으로의 매핑입니다. 이름 하나 `q`를
읽습니다. 프로그램에는 `price`가 필요합니다. 키가 있으면 테이블의 값이고,
없으면 `-1`입니다. 그리고 `[]`는 조용히 0을 넣어 버립니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "`long long price = table.count(q) ? table[q] : -1;` — 먼저 묻고, 그다음 인덱싱합니다.",
  "없는 키에 `table[q]`를 하면 0으로 들어갑니다. 질의는 -1이 아니라 0을 출력하게 됩니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.verybasic.16.sets"
title = "숫자마다 한 번씩"
story = "계류 번호는 중복을 달고 들어오는데, 대장은 각 번호를 한 번씩, 순서대로 담아야 한다."
brief = '''
정수 한 줄을 읽습니다. 각 `x`는 `std::set` `seen`에 들어가야 하며, 이 집합은
값마다 사본 하나를 오름차순으로 유지합니다. 크기와 값들의 출력은 적혀 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "`seen.insert(x);` — 집합에는 `insert`가 있고, 이미 가진 값은 무시합니다.",
  "`push_back`은 시퀀스의 말입니다. 집합에는 뒤쪽이 없습니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.verybasic.17.stack"
title = "나중 것이 먼저"
story = "대피항 주방의 배식대에는 접시가 쌓이고 맨 위에서부터 빠지는데, 스택이 접시를 하나도 받지 않는다."
brief = '''
정수 한 줄을 읽습니다. 각 `x`는 `std::stack` `st`에 넣어져야 합니다. 그다음
프로그램이 전부 꺼내며, 값들을 나중에 들어간 것부터 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "`st.push(x);` — 스택은 push하고, `top()`은 마지막 push를 봅니다.",
  "`push_back`은 벡터용입니다. `std::stack`은 `push`라고 합니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.verybasic.18.queue"
title = "먼저 온 것이 먼저"
story = "대피항의 국수 노점에 손님들이 줄을 서고 온 순서대로 받는데, 큐가 아무도 받지 않는다."
brief = '''
정수 한 줄을 읽습니다. 각 `x`는 `std::queue` `q`에 넣어져야 합니다. 그다음
