output: 1 2 3 4
```
'''
hints = [
  "`q.push(x);` — 뒤로 넣고, `front()`로 읽고, `pop()`으로 꺼냅니다.",
  "`push_front`는 `deque`의 말입니다. 큐는 뒤로만 넣습니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.verybasic.19.heap"
title = "다음은 가장 작은 것"
story = "윈치는 매번 가장 가벼운 삼판을 다음으로 올리는데, 그 배를 넘겨줄 힙이 거꾸로 뒤집혀 있다."
brief = '''
정수 한 줄을 읽습니다. 프로그램은 그것들을 모두 `pq`에 넣고 하나씩 꺼내는데,
가장 작은 것부터 나와야 합니다. `std::priority_queue`는 비교자로
`std::greater`를 두고 선언하지 않는 한 최대 힙입니다. `pq`의 선언이 빈칸입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "`std::priority_queue<long long, std::vector<long long>, std::greater<long long>> pq;` — 값 타입, 컨테이너, 비교자.",
  "비교자는 세 번째 템플릿 인자입니다. 두 번째는 컨테이너입니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.verybasic.20.sorting"
title = "수심 순서"
story = "계류지는 배가 도착한 순서로 기록되어 있는데, 해도는 수심 순서로, 얕은 것부터 원한다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램은 그것들을 제자리에서
오름차순으로 정렬해야 합니다. 알고리즘은 범위의 경계를 이루는 반복자 한 쌍을
받습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 2
output: 1 2 3 5 8
```
'''
hints = [
  "`std::sort(v.begin(), v.end());` — 범위는 반복자 두 개입니다.",
  "`std::greater`는 내림차순으로 정렬합니다. 기본은 오름차순입니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "cpp.verybasic.21.sort-by-key"
title = "가장 무거운 어획부터"
story = "어획 일지는 삼판마다 이름과 무게를 적고, 게시판은 가장 큰 어획을 맨 위에 원한다."
brief = '''
`rows`에는 `Row{name, score}` 레코드들이 들어 있습니다. 프로그램은 그것들을
`score` 기준으로, 높은 것부터 정렬해야 합니다. `a`가 `b`보다 앞에 올 때를
말해 주는 비교자 람다와 함께 `std::sort`를 씁니다. 점수는 서로 다릅니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
        mei 40
        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "`std::sort(rows.begin(), rows.end(), [](const Row& a, const Row& b) { return a.score > b.score; });` — 람다는 \"a가 먼저 오는가?\"에 답합니다.",
  "`<`는 가장 작은 것을 먼저 둡니다. `>`는 가장 큰 것을 먼저 둡니다.",
]

