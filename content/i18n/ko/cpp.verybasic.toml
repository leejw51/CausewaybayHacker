output: 4 3 2 1
```
'''
hints = [
  "`std::reverse(v.begin(), v.end());` — 메서드가 아니라 범위에 대한 알고리즘입니다.",
  "벡터에는 `reverse()` 멤버가 없습니다. `std::list`에는 있고, 벡터는 알고리즘을 씁니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.verybasic.23.closures"
title = "조수 보정값"
story = "모든 측정값에 같은 보정값이 더해지는데, 그 보정값을 기억해야 할 람다가 그것을 잊었다."
brief = '''
`k`를 읽고, 그다음 정수 한 줄을 읽습니다. 프로그램에는 `k`를 캡처해 인자에
`k`를 더한 값을 돌려주는 람다 `add`가 필요합니다. 그것이 모든 값에 적용되고
결과가 출력됩니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "`auto add = [k](long long x) { return x + k; };` — `[k]`가 캡처입니다.",
  "빈 `[]`로는 람다가 `k`를 전혀 볼 수 없습니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.verybasic.24.lambdas"
title = "짝수 선석을 세라"
story = "방파제를 따라 늘어선 선석 번호가 목록으로 오고, 사무소는 그중 짝수가 몇 개인지 알고 싶어 한다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램에는 `evens`가 필요합니다.
그중 짝수가 몇 개인지를, 어떤 값을 셀지 말해 주는 람다와 함께
`std::count_if`로 셉니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "`long long evens = std::count_if(v.begin(), v.end(), [](long long x) { return x % 2 == 0; });` — 범위, 그다음 검사.",
  "`std::count`는 값 하나를 셉니다. `count_if`는 술어가 예라고 하는 것을 셉니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "cpp.verybasic.25.threads"
title = "윈치 하나, 스레드 하나"
story = "선가는 메인 스레드가 기다리는 동안 두 번째 스레드에서 삼판 무게를 합산하는데, 그 스레드가 시작하지 않는다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있고 `sum_of`가 그것들을 더합니다. 프로그램에는
`sum_of(v)`를 `result`에 저장하는 람다를 실행하는 `std::thread` `t`가
필요합니다. `main`이 그것을 join하고 출력합니다. 람다는 `v`와 `result`에 닿으려면
참조로 캡처해야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "`std::thread t([&] { result = sum_of(v); });` — 스레드는 호출할 수 있는 무언가로 만듭니다.",
  "`[&]`는 참조로 캡처하고, 그래서 람다가 `result`에 쓸 수 있습니다.",
]

