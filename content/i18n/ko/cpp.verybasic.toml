[[quest]]
id    = "cpp.verybasic.26.mutex"
title = "카운터 하나에 손 넷"
story = "펌프실에서 스레드 넷이 카운터 하나에 더하는데, 그들을 차례로 세워야 할 잠금이 첫 바퀴 뒤로 영원히 잡혀 있다."
brief = '''
스레드 넷이 각자 `counter`에 1을 10만 번 더합니다. 루프의 모든 바퀴는 더하는
동안 뮤텍스 `mu`를 잡고 있어야 하고, 바퀴 끝에서 놓아야 합니다. 자리표시자는
잠그기만 하고 풀지 않아서 두 번째 바퀴가 영원히 기다립니다. 락 가드는 스코프를
벗어날 때 풀립니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "`std::lock_guard<std::mutex> lock(mu);` — 지금 잠그고, `}`에서 `lock`이 죽을 때 풉니다.",
  "`mu.lock()`만으로는 절대 되돌려지지 않습니다. 다음 바퀴는 이 스레드가 이미 잡은 뮤텍스에서 막힙니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.verybasic.27.binary-tree"
title = "SEGFAULT"
story = "12:00, 눈데이 건. 발포표는 탐색 트리인데, 오른쪽을 따라 내려가야 할 삽입이 루트에서 멈춘다."
brief = '''
`insert`는 `n`을 루트로 하는 탐색 트리에 `v`를 넣습니다. 빈 경우는 적혀 있고
새 노드를 만듭니다. 빈칸은 `v`를 올바른 쪽으로 내려보내는 한 줄입니다.
`n->val`보다 작으면 왼쪽, 아니면 오른쪽이며, 재귀가 돌려주는 것을 저장합니다.
그다음 중위 순회가 오름차순으로 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "`if (v < n->val) n->left = insert(n->left, v); else n->right = insert(n->right, v);` — 한쪽으로 재귀하고 결과를 저장합니다.",
  "`n`은 포인터입니다: `.`가 아니라 `->`. 그리고 작은 것은 왼쪽으로 갑니다.",
]
