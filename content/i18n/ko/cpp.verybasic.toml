id    = "cpp.verybasic.22.reverse"
title = "앞뒤를 뒤집어"
story = "조수 측정값은 최신 것부터 기록되었는데 해도는 오래된 것부터 읽는다."
brief = '''
`v`에는 그 줄의 정수들이 들어 있습니다. 프로그램은 그것들을 제자리에서 뒤집어야
합니다. 범위 전체에 대해 `<algorithm>`의 알고리즘을 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
