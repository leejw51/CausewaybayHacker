```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — 재귀가 서브트리의 새 뿌리를 돌려주니 저장합니다.",
  "결과를 저장하지 않고 insert를 부르면 nil이 그대로 남고, 아무것도 불평하지 않습니다. nil은 따라가기 전까지는 에러가 아닙니다. v를 빠뜨리면 nil 값을 삽입하고, 그것과의 다음 비교가 에러입니다.",
]
