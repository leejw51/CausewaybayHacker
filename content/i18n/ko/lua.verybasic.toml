# LUA LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/lua/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "lua.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.verybasic.01.print"
title = "첫 등불"
story = "21:00, 원사 스트리트. 용 창고 위의 등불판은 어둡고, 오늘 밤 첫 줄은 메이가 칠 차례다."
brief = '''
프로그램은 한 줄에 정확히 `hello, causewaybay`를 출력해야 합니다. 인자들과 줄바꿈을 표준 출력에 쓰는 내장 함수가 하나 있습니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — 괄호, 그리고 문자열 안의 쉼표.",
  "print \"hello causewaybay\"는 올바른 Lua입니다 — 호출 뒤에 괄호 없이 문자열 리터럴이 올 수 있습니다 — 하지만 쉼표가 빠졌습니다. io.write는 줄바꿈을 쓰지 않고, puts는 Lua가 모르는 이름입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.verybasic.02.int-types"
title = "향 나누기"
story = "린파꿍 문 앞에서 향 다발을 용의 마디마다 나눠 준다. 집계는 마디마다 몇 개씩이고 몇 개가 남는지 말해야 하는데 아무 말이 없다."
brief = '''
`a`와 `b`는 정수입니다. 프로그램은 정수 몫과 나머지를 공백 하나로 띄어 한 줄에 출력해야 합니다. LuaJIT에는 숫자 타입이 하나뿐이고 정수 나눗셈 연산자가 없습니다. `/`는 소수를 주고, `math.floor`가 그것을 떨어뜨리고, `%`가 나머지입니다. `print`는 인자 사이에 TAB을 넣으므로, 둘을 먼저 `..`로 한 문자열로 잇습니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — 나눗셈을 내림하고, 공백으로 잇습니다.",
  "a / b는 3이 아니라 3.5입니다. //는 LuaJIT의 연산자가 아닙니다. 그리고 print(x, y)는 공백이 아니라 탭으로 가릅니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.verybasic.03.floats"
title = "정확한 무게"
story = "스쿨 스트리트 창고의 저울은 짐꾼 한 사람당 용의 무게를 소수 세 자리로 보여 주고, 인쇄된 순서지는 두 자리를 원한다. 순서지의 그 줄은 비어 있다."
brief = '''
`x`와 `y`는 숫자입니다. 프로그램은 `x / y`를 소수점 아래 정확히 두 자리로 출력해야 합니다. `string.format`은 C 스타일 서식을 받습니다. `f`는 고정소수점 숫자이고, 점 뒤의 숫자가 소수 자릿수입니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(string.format(\"%.2f\", x / y)) — 2 앞의 점이 소수 자릿수입니다.",
  "math.floor(x / y * 100) / 100은 여전히 숫자이고, 숫자는 3.50이 아니라 3.5로 출력됩니다. %d는 정수용입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.verybasic.04.strings"
title = "행렬 안내판"
story = "릴리 스트리트 입구의 행렬 안내판은 대문자로 칠해져 있고 일꾼 명단에는 소문자로 적혀 있다. 간판 쓰는 이는 소리쳐 돌려받아야 한다."
brief = '''
`s`는 텍스트 한 줄입니다. 길이 다음에 프로그램은 `s`를 대문자로 출력해야 합니다. 모든 글자를 대문자로 바꾼 사본을 돌려주는 문자열 메서드가 있고, 메서드는 콜론으로 불러서 문자열이 자기 자신을 넘깁니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "print(s:upper()) — 콜론이 s를 첫 번째 인자로 넘깁니다.",
  "점을 쓴 s.upper()는 아무것도 넘기지 않아서 upper가 문자열을 받지 못했다고 불평합니다. toUpperCase는 JavaScript입니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.verybasic.05.bool-if"
title = "짝수냐 홀수냐"
story = "용의 마디는 왼쪽을 짝수 번호가, 오른쪽을 홀수 번호가 멘다. 원사 스트리트의 한 짐꾼은 자기 번호를 알고, 자기 쪽을 알아야 한다."
brief = '''
`n`은 양의 정수입니다. `n`이 2로 나누어떨어지면 `even`, 아니면 `odd`를 출력해야 합니다. 조건은 나머지를 0과 비교하는 `if` 헤더이고, `then`으로 끝납니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "if n % 2 == 0 then — 등호 둘은 비교, 하나는 대입.",
  "n / 2는 소수입니다. 양의 n에서는 결코 0이 아닙니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.verybasic.06.loops"
title = "집계"
story = "오늘 밤 향의 개수는 1 더하기 2 더하기 3, 마지막 마디까지인데 창고의 집계판에는 0이 적혀 있다."
brief = '''
`n`은 양의 정수입니다. 루프는 1부터 `n`까지(포함) 모든 정수를 들러 각각을 `total`에 더해야 합니다. 숫자 `for`는 시작과 끝을 받고, 끝은 포함됩니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: 10
```
'''
hints = [
  "for i = 1, n do — 끝은 포함이므로 n 그 자체입니다.",
  "for i in ...은 다른 루프, 이터레이터 함수를 받는 쪽입니다. 숫자는 이터레이터 함수가 아닙니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.verybasic.07.functions"
title = "짐꾼의 품삯"
story = "원사 스트리트 첫 열 바퀴는 짐꾼에게 바퀴당 5, 그 뒤로는 바퀴당 3을 준다. 품삯 함수는 아무것도 돌려주지 않는다."
brief = '''
`pay(laps)`는 품삯을 돌려줘야 합니다. 첫 열 바퀴는 바퀴당 5, 열 번째 이후의 모든 바퀴는 3입니다. 함수는 키워드 하나로 값을 돌려줍니다. 출력만 하는 함수는 `nil`을 돌려줍니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
output: 15
```
'''
hints = [
  "return math.min(laps, 10) * 5 + math.max(laps - 10, 0) * 3",
  "인자가 하나인 math.max는 그 인자 자체입니다. 짧은 밤에는 max(laps - 10)이 음수가 됩니다. 그리고 pay 안에서 print하면 호출한 쪽은 nil을 출력합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.verybasic.08.structs"
title = "노점 하나, 필드 둘"
story = "빅토리아 파크 등불 장터의 모든 노점 카드에는 이름과 가격이 있다. 카드의 가격은 한 번도 저장되지 않아서 라벨이 노점을 반만 찍는다."
brief = '''
`Stall.new(name, price)`는 `Stall`을 메타테이블로 하는 테이블을 만듭니다 — Lua의 클래스입니다. `name`을 저장하는 것과 같은 방식으로 `price`를 객체에 저장해야 `s.price`가 되읽습니다. 필드는 `self`에 씁니다. 맨 이름은 지역 변수입니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "self.price = price — self가 테이블이고, 맨 이름은 매개변수입니다.",
  "등호 둘은 비교이고, 비교만 홀로 있는 것은 Lua가 받아 주는 문장이 아닙니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.verybasic.09.struct-method"
title = "한 줄 합계"
story = "등불 장터 국수 노점의 모든 주문에서 가격 곱하기 수량은 한 줄인데, 그것을 말해야 할 메서드가 아무 말이 없다."
brief = '''
`Stall:total()`은 가격 곱하기 수량을 돌려줘야 합니다. 콜론으로 선언한 메서드에는 숨은 첫 매개변수 `self`가 있고, 객체의 필드는 그것을 통해 닿습니다. `price`만 쓰면 한 번도 설정되지 않은 전역 변수입니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return self.price * self.qty — 두 필드 모두 self를 통해.",
  "price만 쓰면 전역 변수, 곧 nil이고, nil은 곱할 수 없습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.verybasic.10.enums"
title = "노선 색"
story = "틴하우 출구의 MTR 지도에는 노선 세 개가 있다. 일꾼들에게는 단어가 있고, 그것이 가리키는 상수가 필요하다."
brief = '''
`word`는 `island`, `tsuenwan`, `kwuntong` 중 하나입니다. Lua에는 enum이 없습니다. `Line`은 이름 붙은 숫자들의 테이블로 가장 가까운 대용품이고, `COLOUR`는 그 숫자들을 키로 합니다. 프로그램은 `word`를 맞는 `Line` 멤버로 바꿔야 합니다. 테이블은 키로 인덱스하고, 여기서 키는 대문자입니다. 테이블은 호출할 수 없고, `Line.word`는 `word`라는 철자의 키를 찾습니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 대괄호가 이름으로 키를 찾고, 이름은 대문자입니다.",
  "소문자 그대로의 Line[word]는 키를 찾지 못해 nil을 주고, COLOUR[nil]도 nil입니다. 판에는 nil이 찍힙니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.verybasic.11.vector"
title = "마디 목록"
story = "타이항 로드의 트럭에서 내린 모든 마디는 들어온 순서로 목록에 오르는데, 목록은 비어 있다."
brief = '''
`xs`는 빈 테이블로 시작하고, Lua의 리스트는 키가 1, 2, 3, ...인 테이블입니다. 루프에서 읽은 각 정수 `x`를 입력 순서를 지켜 끝에 더해야 합니다. `table` 라이브러리에 그것을 하는 함수가 있습니다. 인자가 둘이면 끝에 붙이고, 셋이면 가운데 것이 위치입니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "table.insert(xs, x) — 테이블이 먼저, 값 하나를, 끝에.",
  "xs[#xs] = x는 테이블이 비어 있는 동안 인덱스 0에 쓰고, #xs는 계속 0입니다. 위치 1을 주면 하나하나를 앞에 넣어 순서를 뒤집습니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.verybasic.12.vector-edit"
title = "머리가 빠진다"
story = "목록의 첫 마디는 머리이고, 머리는 따로 제 장대에 끼워 들어간다. 목록에서 빠져야 하고, 그 뒤의 모든 것이 하나씩 올라온다."
brief = '''
`xs`는 그 줄의 정수들을 인덱스 1부터 담고 있습니다. 프로그램은 인덱스 1의 원소를 지워 나머지가 앞으로 당겨지게 해야 합니다. `table.remove`는 위치를 받아 뒤따르는 것을 당깁니다. 칸을 `nil`로 두면 더 짧은 리스트가 아니라 구멍이 남습니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "table.remove(xs, 1) — 위치는 두 번째 인자입니다.",
  "위치 없는 table.remove(xs)는 마지막 것을 뺍니다. xs[1] = nil은 리스트에 nil을 남기고, table.concat은 그것을 거부합니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.verybasic.13.list"
title = "사슬의 앞"
story = "등불 사슬은 원사 스트리트를 따라 길게 걸리고 가장 새 등불은 앞에 달린다. 일꾼들은 계속 뒤에 단다."
brief = '''
`chain`은 리스트로 쓰는 테이블입니다. Lua에는 deque가 없습니다. 위치를 준 `table.insert`가 가장 가까운 대용품이고, 그 위치 뒤의 모든 것을 하나씩 뒤로 밉니다. 루프에서 읽은 각 `x`를 앞에 더해, 마지막에 읽은 것이 맨 앞에 오게 해야 합니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "table.insert(chain, 1, x) — 인자 셋: 테이블, 위치, 값.",
  "인자가 둘이면 뒤에 붙습니다. chain[1] = x는 앞을 밀어내는 대신 덮어씁니다. 평범한 테이블에는 콜론으로 부를 insert 메서드가 없습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.verybasic.14.maps"
title = "향 공책"
story = "거리마다 공책 하나, 일꾼들이 태우는 품목마다 한 줄, 옆에 개수. 품목이 처음 나오면 더할 줄이 없다."
brief = '''
`counts`는 단어를 키로 하는 테이블입니다. 단어 `w`마다 프로그램은 처음에는 0에서 시작해 개수에 1을 더해야 합니다. 없는 키는 `nil`로 읽히고, `nil`에는 더할 수 없습니다. `or`가 기본값을 대 주는데, `+`보다 느슨하게 묶이므로 기본값에는 자기 괄호가 필요합니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts[w] = (counts[w] or 0) + 1 — 괄호가 덧셈 전에 기본값을 먼저 정합니다.",
  "괄호가 없으면 counts[w] or 0 + 1은 counts[w] or 1입니다. 처음 나오면 1이고 그 뒤로도 계속 1입니다. 없는 키에 counts[w] + 1을 하면 nil에 대한 산술입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.verybasic.15.hashtable"
title = "조회"
story = "등불 장터의 노점 표는 이름을 번호로 잇는데, 없는 노점을 물으면 판을 비우지 말고 -1이라고 해야 한다."
brief = '''
`stalls`는 이름을 노점 번호에 잇습니다. 단어 `w`에 대해 프로그램은 그 번호를, `w`가 테이블에 없으면 `-1`을 출력해야 합니다. 없는 키는 에러가 아니라 `nil`이고, `or`가 `nil`을 기본값으로 바꿉니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "print(stalls[w] or -1) — or의 오른쪽이 기본값입니다.",
  "stalls[w]만 쓰면 없는 이름에 nil을 출력합니다. stalls.w는 글자 그대로 w라는 노점을 찾습니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.verybasic.16.sets"
title = "서로 다른 가격"
story = "등불 노점 여섯, 서로 다른 가격 셋. 판은 가격이 몇 가지인지 원하는데 6을 찍는다."
brief = '''
`xs`는 그 줄의 정수들을 담고 있습니다. 프로그램은 서로 다른 값이 몇 개인지 출력해야 합니다. Lua에는 집합이 없습니다. 값들을 키로 하는 테이블이 가장 가까운 대용품입니다 — 두 번 저장한 키는 하나의 키입니다 — 그리고 `#`은 1부터의 칸만 세므로, 세는 루프는 이미 `pairs`로 키들을 걷습니다. 각 `x`를 `seen`에 키로 표시해야 합니다.

맞는 줄을 고르고, `-- FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 5 3 8 5 3
output: 3
```
'''
hints = [
  "seen[x] = true — x가 키이고, true는 nil이 아닌 무언가일 뿐입니다.",
  "seen.x는 x라는 철자의 키, 모든 것에 키 하나입니다. table.insert는 끝에 붙여 중복을 남깁니다. seen[x] + 1은 처음에 nil에 대한 산술입니다.",
]

