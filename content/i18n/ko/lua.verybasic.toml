[[quest]]
id    = "lua.verybasic.27.binary-tree"
title = "제로"
story = "21:00, 원사 스트리트의 용 머리. 마디 번호들이 트리에 들어가고, 마디는 1부터 시작하며, `segments[0]`은 `nil`이다 — 머리는 어디에도 없고, 트리의 왼쪽 가지도 같은 어디에도 없으며, 춤은 두 번째 등불에서 시작한다."
brief = '''
마디 번호들은 `segments`에 읽혀 들어가고, 모든 Lua 리스트처럼 1부터 시작합니다 — `segments[0]`은 `nil`이고, 아직 없는 자식도 그렇습니다. 어느 쪽도 따라가기 전까지는 에러가 아닙니다. `insert(n, v)`는 `v`가 들어간 트리의 뿌리를 돌려줍니다. `nil`인 경우와 오른쪽은 적혀 있습니다. 더 작은 `v`에 대해서는 왼쪽 자식을 거기에 삽입한 결과로 바꿔, `nil` 자식이 노드가 되게 해야 합니다.

