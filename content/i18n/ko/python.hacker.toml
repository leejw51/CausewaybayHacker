id    = "python.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "체인 전체에서 하루 동안의 계산대 연산 삼십만 건, 그 절반은 정정이고, 누군가 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만들고 `q`개 연산을
실행하세요. 모두 같은 생성기에서, 감기는 64비트 산술로 (손으로 마스크하세요):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**이 퀘스트는 복잡도를 강제합니다.** 순진한 답 — 질의마다
`sum(values[l:r+1])` — 은 질의당 `O(n)`이고, 슬라이스와 합 모두 C에서
돌아가므로 작은 것에서는 속을 만큼 빠릅니다. 그래서 큰 숨은 케이스는
`n = 500000, q = 300000`이고, 거기서 순진한 답은 `2 × 10^10` 정도의 원소를
건드리며 이 기계에서 10초 실행 제한에 대해 **3분 넘게** 걸렸습니다. 펜윅
트리는 전체를 1초 안에 처리합니다. 둘 다 이 퀘스트의 두 프로그램으로
측정했습니다.

(이 퀘스트의 Rust와 Go 버전은 연산 사백만 개를 실행합니다. 파이썬은 삼십만
개를 실행합니다. 파이썬의 올바른 펜윅 트리도 정직한 어떤 제한 안에서 사백만을
통과하지 못할 것이기 때문입니다 — 그리고 요점은 옳은 구조와 틀린 구조를
가르는 것이지, 파이썬과 C를 가르는 것이 아닙니다.)

교훈은 면접관이 낚으려는 바로 그것입니다: *점 갱신, 구간 합*은 펜윅 트리가
존재하는 바로 그 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두 prefix의
차로서의 range — 이고, `i & -i`가 가장 낮은 켜진 비트만큼 걷는 방법이며,
파이썬 int에서도 2의 보수 정수에서와 똑같이 동작합니다.
'''
hints = [
  "초기값마다 add를 한 번씩 불러 트리를 만드세요. O(n) 상향식 구성은 좋은 최적화이고, 시계가 시험하는 것은 아닙니다.",
  "i & -i는 가장 낮은 켜진 비트를 떼어 냅니다 — 파이썬의 음수 int는 비트 연산에서 2의 보수인 것처럼 동작하므로 wrapping_neg가 필요 없습니다. 그것을 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "range(l, r)는 prefix(r + 1) - prefix(l)이고, 그 한 쌍의 하나 차이를 맞히는 것이 디버깅의 대부분입니다. 루프 안에서 self.tree를 지역 변수에 묶는 것은 CPython에서 실제로 빨라지는 방법이고, 이 퀘스트에 필요한 유일한 미세 최적화입니다.",
]

