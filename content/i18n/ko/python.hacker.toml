[[quest]]
id    = "python.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 통과한 모든 지도는 칸 수를 셌다. 트램은 정류장이 몇 개인지 신경 쓰지 않는다. 얼마나 걸리는지를 신경 쓴다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 가중치 있는 무방향 간선 `m`개.
그래프는 **정확히** 이 생성기로, 감기는 64비트 산술로 직접 만드세요 (손으로
마스크하세요 — 파이썬의 int는 감기지 않습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 도달할 수 있는 모든 정류장까지의 최단 거리의 합 (`0` 자신은
`0`으로 포함)을 출력하고, 그다음 `MAX <the largest of them>`를 출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**이 퀘스트는 복잡도를 강제합니다.** 숨은 케이스 하나는 `n = 100000`,
`m = 200000`입니다. 어느 쪽이든 옳은 알고리즘은 다익스트라이고, 시계가
정하는 것은 우선순위 큐입니다. 방문하지 않은 모든 노드를 훑어 최솟값을 찾는
것은 `O(V²)` — `10^10`단계이고, 파이썬에서 그것은 16초가 아니라 오후 내내입니다
— 이고 실행 제한은 10초입니다. `heapq`는 그것을 `O((V + E) log V)`로 만들고
약 3분의 1초에 끝납니다. 둘 다 이 기계에서, 이 퀘스트에 들어 있는 두
프로그램으로 측정했습니다: 스타터가 훑는 버전입니다.

분명히 볼 가치가 있습니다. 시간 제한 있는 스크린에서 떨어지는 가장 흔한
방식이기 때문입니다: **스타터는 틀리지 않았습니다.** 정확히 맞는 답을
출력합니다. 너무 늦게 도착한다는 이유만으로 거부됩니다.

`heapq`는 최소 힙이므로 `(distance, node)`를 push하면 튜플 순서가 나머지를
합니다. decrease-key가 없고, 필요하지도 않습니다: 개선된 거리를 새 항목으로
push하고, pop한 항목의 거리가 이미 기록한 것보다 나쁘면 건너뛰세요. 그 "낡은
항목" 건너뛰기가 사람들이 잊는 줄이고, 그것이 없으면 힙은 끝없이 자랍니다.
'''
hints = [
  "heapq 안의 (distance, node) 튜플: 거리가 먼저인 것이 항목을 정렬하고, heapq는 이미 최소 힙입니다.",
  "`if d > dist[u]: continue`가 낡은 항목 건너뛰기입니다. 그것이 없어도 알고리즘은 여전히 옳고, 힙은 쓸모없는 항목으로 찹니다.",
  "float(\"inf\")가 정직한 `unreached`입니다: 모든 int보다 크게 비교되고 완화 단계에서 None 검사가 필요 없습니다. 생성기의 신장 트리 절반이 모든 노드에 도달할 수 있음을 보장하므로 마지막 필터는 아무것도 걸러 내지 않습니다 — 그래도 두세요. 도달할 수 없는 노드가 있는 버전이 후속 질문이기 때문입니다.",
]

