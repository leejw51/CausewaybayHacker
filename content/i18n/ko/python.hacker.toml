# PYTHON LAND — HACKER, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/python/hacker.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "python.hacker"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.hacker.01.two-sum"
title = "요금 둘"
story = "7-32호실, 네 번째. 첫 문제는 누구나 받는 그 문제이고, 시계는 들어오는 길에 이미 돌기 시작한다."
brief = '''
첫 줄은 `n target`입니다. 둘째 줄은 정수 `n`개입니다.

합이 `target`이 되는 서로 다른 두 항목의 **1부터 세는** 인덱스 `i j`를,
`i < j`가 되도록 `i j`로 출력하세요. 되는 쌍이 여럿이면 두 번째 인덱스가
가장 작은 것을, 그래도 같으면 첫 번째 인덱스가 가장 작은 것을 고르세요.
되는 쌍이 없으면 `-1`을 출력하세요.

```
input:  4 9
        2 7 11 15
output: 1 2
```

여기의 숨은 케이스는 작습니다: 속도가 아니라 동점 처리와 답이 없는 경우를
검사합니다. 그래도 문제는 여전히 선형 풀이입니다 — 한 번의 순회, dict
하나 — 실제 `n`은 200000이고, 이중 루프는 이 문제가 걸러 내려고 존재하는
바로 그것이기 때문입니다. 이 네 케이스를 우연히 통과하는 답이 아니라 문제가
묻고 있는 답을 쓰세요.
'''
hints = [
  "한 번의 순회. 각 값마다 target에서 그 값을 뺀 것이 이미 나왔는지 물으세요.",
  "seen.setdefault(x, j)는 반복되는 값의 첫 인덱스를 유지하고, 그것이 문제가 요구하는 동점 처리입니다.",
  "찾는 순간 출력하고 돌아가세요 — 훑다가 처음 맞은 것이 이미 가장 작은 두 번째 인덱스입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.hacker.02.window"
title = "반복 없이"
story = "마커를 내려놓기도 전에 두 번째 문제가 칠판에 올라와 있다."
brief = '''
공백 없는 텍스트 한 줄입니다.

반복되는 문자가 하나도 없는 가장 긴 연속 구간의 길이를, 그다음 그 구간
자체를 출력하세요. 길이가 같은 구간이 여럿이면 가장 왼쪽 것을 출력하세요.

```
input:  abcabcbb
output: 3
        abc
```

창은 오로지 오른쪽으로만 움직입니다. 반복을 만난 뒤 처음부터 다시 훑고
있다면 이차 시간 풀이를 쓴 것입니다.

여기의 네 케이스는 기껏해야 열두어 글자이고, 시계는 그 위에서 속도를 재고
있지 않습니다 — 이차 시간 풀이도 통과합니다. 큰 숨은 케이스가 없는 것은
정직하게 만들 수 있는 것이 없기 때문입니다: 글자 종류가 적은 텍스트에서는
가장 긴 구간이 글자 종류 수로 묶이므로, 다시 훑는 비용은 이차가 아니라 상수
배이고, 그것을 벌할 입력은 더 이상 텍스트가 아닙니다. 이 네 케이스가
강제해서가 아니라 그것이 답이기 때문에 한 번의 순회 풀이를 쓰세요.
'''
hints = [
  "각 문자가 마지막으로 나온 인덱스와, 창이 시작하는 인덱스를 유지하세요.",
  "반복은 마지막 위치가 현재 창 안에 있을 때만 의미가 있습니다 — 그것이 `previous >= start` 검사입니다.",
  "최선의 길이*와* 그 시작 위치를 함께 기록하세요. 아니면 끝에서 구간을 출력할 수 없습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.hacker.03.intervals"
title = "근무표"
story = "럭키맥의 근무표를 건네주며 실제로 채워진 시간이 어디인지 묻는다."
brief = '''
첫 줄은 `n`입니다. 다음 `n`줄은 `<start> <end>`이고 `start <= end`입니다.

겹치거나 맞닿는 모든 쌍을 병합하고, 결과를 오름차순으로 한 줄에
`<start> <end>` 하나씩 출력한 뒤 `COUNT <k>`를 출력하세요.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

맞닿는 것도 겹치는 것으로 칩니다: `1 4`와 `4 5`는 `1 5`로 병합됩니다.

여기의 네 케이스는 각각 구간 서너 개이고, 시계는 그 위에서 속도를 재고 있지
않습니다. 정렬하고 훑는 것은 `O(n log n)`이고, 구간마다 병합된 목록을 다시
훑는 버전은 `O(n²)`이며 이 넷을 똑같이 쉽게 통과합니다. 실제 근무표에서는 그
기준이 진짜입니다. 이 케이스들이 검사하는 것은 그것이 아닙니다.
'''
hints = [
  "먼저 시작점으로 정렬하세요. 그 뒤에는 왼쪽에서 오른쪽으로 한 번 지나가면 충분하고, 한 구간 이상 뒤돌아볼 일이 없습니다.",
  "새 시작점이 마지막으로 병합된 구간의 끝 이하이면 그 구간을 늘리고, 아니면 새 구간을 넣으세요. 병합된 구간은 튜플이 아니라 리스트로 저장해야 끝을 그 자리에서 바꿀 수 있습니다.",
  "max(last.end, end)까지 늘리세요 — 긴 구간에 삼켜진 짧은 구간이 그것을 줄여서는 안 됩니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.hacker.04.grid"
title = "건물 밖으로"
story = "화이트보드에 평면도, 먼 모서리에 방화문, 그리고 마커보다 시계를 보고 있는 면접관."
brief = '''
첫 줄은 `r c`입니다. 다음 `r`줄은 바닥입니다: `.`은 열린 칸, `#`은 벽.

왼쪽 위 `(0,0)`에서 출발해 오른쪽 아래 `(r-1, c-1)`에 도달하세요. 열린
칸만 지나서 위, 아래, 왼쪽, 오른쪽으로 움직입니다.

최단 경로의 **걸음 수**를 출력하고, 경로가 없으면 `-1`을 출력하세요.
그다음 `REACHED <k>`를 출력하세요: 출발점에서 도달할 수 있는 열린 칸의 수로,
출발점 자신도 셉니다.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

깊이 우선이 아니라 너비 우선입니다. 깊이 우선 탐색은 *어떤* 경로를
찾습니다. 문제는 가장 짧은 경로를 묻습니다. 그리고 큐는
`collections.deque`입니다 — `list.pop(0)`은 `O(n)`이고 탐색 전체를 이차
시간으로 만듭니다.
'''
hints = [
  "여기서 BFS와 DFS의 차이는 deque.popleft() 하나가 전부입니다. 스택으로 쓰는 리스트라면 다른 쪽이 됩니다.",
  "칸은 pop할 때가 아니라 push할 때 표시하세요. 아니면 같은 칸이 큐에 여러 번 들어갑니다.",
  "거리 격자가 방문 집합을 겸합니다: -1은 아직 못 본 것이므로 두 번째 자료 구조가 필요 없습니다.",
  "r이 0일 때 grid[r - 1]은 예외를 던지지 않습니다. 마지막 행을 읽고, 탐색은 지도 아래쪽으로 새어 나갑니다. nr < 0은 손으로 검사하세요 — 이것은 파이썬이 대신 알려 주지 않는 단 하나의 범위 오류입니다.",
]

