결코 보지 않는 자리에 있을 수 있습니다. 그것은 `ABSENT`입니다 — 질문은 배열을
훑으면 무엇을 찾을지가 아니라 조회가 무엇을 하는지입니다.
'''
hints = [
  "열린 구간 (low, high)를 아래로 넘기세요. 루트는 (None, None)을 받고, 왼쪽 자식은 (low, node), 오른쪽 자식은 (node, high)를 받습니다.",
  "없는 노드는 공허하게 유효합니다 — 그것이 기저 경우이고, False가 아니라 True를 돌려줍니다.",
