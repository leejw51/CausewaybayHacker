[[quest]]
id    = "python.hacker.07.coins"
title = "딱 맞는 거스름돈"
story = "퍼시벌 스트리트의 계산대에는 동전 트레이가 셋 있고, 지폐는 받지 않겠다는 손님이 있다."
brief = '''
첫 줄은 `n target`입니다. 둘째 줄은 동전 값 `n`개입니다. 모든 동전은
무제한으로 있습니다.

`target`을 정확히 만드는 가장 적은 동전 개수를 출력하고, 만들 수 없으면
`-1`을 출력하세요. 그다음 `REACH <k>`를 출력하세요: `0..target`의 금액 중
만들 수 있는 것이 몇 개인지, `0`도 셉니다.

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

숨은 케이스는 작으므로 잡아내는 것은 느림이 아니라 틀림입니다 — 그리고
그중 하나는 흔한 오답을 잡습니다. 들어가는 가장 큰 동전을 집고 반복하는
탐욕법은 `3 4`로 `6`을 만들 때 `4`를 집고는 실패하는데, 정확히 그것을 위한
케이스가 있습니다. 다른 오답인 표 없는 순수 재귀는 여기서 잡히지 않지만
그래도 쓸 것이 아닙니다: 실전에서는 `target`이 100000이고 같은 금액이
수천 번 다시 계산되며, 파이썬에서는 그보다 훨씬 전에 재귀 자체가 프레임
한도에 걸립니다.
'''
hints = [
  "best[0] = 0이고, best[a]는 들어가는 모든 동전에 대한 가장 싼 best[a - coin]보다 하나 큽니다.",
  "파이썬에서 정직한 `unreachable`은 None입니다 — 넘칠 i64::MAX가 없고, `is not None`은 뜻하는 바대로 읽힙니다. 하나를 더하기 전에 그것을 검사하세요.",
  "REACH는 완성된 표에서 아직 None이 아닌 칸의 수일 뿐입니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "python.hacker.08.top-k"
title = "가장 많이 물은 다섯"
story = "몸풀기 라운드. 작년 티켓에서 가장 많이 나온 단어 다섯 개를 묻고, 어쨌든 시간을 잰다."
brief = '''
첫 줄은 `n k`입니다. 둘째 줄은 공백으로 구분된 단어 `n`개입니다.

가장 빈번한 단어 `k`개를, 가장 빈번한 것부터, 동점이면 단어 오름차순으로,
한 줄에 하나씩 출력하세요. 서로 다른 단어가 `k`개 미만이면 전부
출력하세요. 그다음 `DISTINCT <d>`를 출력하세요.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

`Counter`로 세고, 그다음 순위를 매기세요. 동점 처리는 장식이 아닙니다.
`Counter.most_common`은 동점을 **삽입 순서** — 단어가 입력에 처음 나타난
순서 — 로 가르는데, 그것은 문제가 말한 것이 아니고 면접관이 듣고 싶어 하는
것도 아닙니다. 비교를 **전순서**로 만드는 것 — 횟수 내림차순, 그다음 단어
오름차순 — 이 그것을 고치고, 튜플 키를 준 `sorted`가 그것을 말하는
방법입니다.

여기의 네 케이스는 단어 몇 개뿐이고, 시계는 그 위에서 속도를 재고 있지
않습니다: 서로 다른 단어마다 목록 전체를 한 번씩 훑어 세는 것은 `O(n²)`이고
