`PATHS` 수는 늘 있는 이유로 `1000000007`로 나눈 나머지를 취합니다:
`1000 × 1000` 숨은 케이스에서 참값은 육백 자리가 넘습니다. 파이썬은 그것을
담을 것입니다. 그래도 더하면서 줄이세요. 문제가 그렇게 말했고, 줄이지 않은
