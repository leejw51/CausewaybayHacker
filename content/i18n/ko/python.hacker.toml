  "OrderedDict: 맞을 때마다, 덮어쓸 때마다 `move_to_end(key)`, 새 키가 왔는데 캐시가 가득 찼으면 `popitem(last=False)`. 이미 있는 키를 덮어쓰는 것은 내보내기가 아닙니다 — 캐시가 가득 찼다고 판단하기 전에 포함 여부를 확인하세요.",
