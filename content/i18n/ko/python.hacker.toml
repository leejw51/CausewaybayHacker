[[quest]]
id    = "python.hacker.34.stable-sort"
title = "동점은 자리를 지킨다"
story = "두 배달원이 같은 점수로 끝났는데, 순위표는 다시 그릴 때마다 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 배달원 `n`명을 만드세요. 배달원 `i`는
인덱스 `i`와 점수를 가지며, 감기는 64비트 산술로 만듭니다 (손으로
마스크하세요):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

배달원을 점수 **내림차순**으로 정렬하세요. 점수가 같은 배달원은 도착한
순서를 유지해야 합니다. 인덱스를 공백으로 구분해 출력하고, 그다음
`TIES <k>` — 정렬된 순서에서 점수가 같은 인접 쌍이 몇 개인지 — 를
출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 모든 것이 동점이고, 답은 거의 전적으로 그것들에게
무슨 일이 일어나는지로 정해집니다.

**이것은 손에 쥔 정렬이 어떤 것인지 아는 것에 관한 퀘스트입니다.** 파이썬의
`sorted`와 `list.sort`는 언제나 **안정** 정렬입니다 — 팀소트가 그것을
약속합니다 — 그리고 `reverse=True`는 그 약속을 지킨다고 문서화되어 있습니다:
정렬을 뒤집어도 같은 원소들은 원래 순서를 유지합니다. 안정적이지 *않은* 것은
오름차순으로 정렬한 다음 `[::-1]`로 리스트를 뒤집는 것입니다: 그것은 동점도
나머지와 함께 뒤집고, 스타터가 하는 것이 그것입니다. 예시에서는 눈에 보이게
그것들을 뒤섞고, 실제 입력에서는 언제나 그럴 것입니다.

옳은 답은 둘이고, 둘 다 댈 수 있어야 합니다. `reverse=True`나 부호를 뒤집은
키로 내림차순 정렬하고, 나머지는 안정성에 맡기세요. **아니면** 비교를
**전순서**로 만드세요 — `(-score, index)`로 정렬해서 어떤 두 원소도 같게
비교되지 않게 하면 안정성은 더 이상 문제가 아닙니다. 기본으로 손을 뻗어야 할
것은 두 번째입니다. 전순서는 증명할 것이 없습니다.

시계는 여기서 속도를 재고 있지 않고, 잴 것도 없습니다: 둘 중 무엇을 쓰든
`sorted`는 `sorted`입니다. 이 네 케이스는 전적으로 동점에 무슨 일이
일어나는지로 결정됩니다. 이것은 정렬이 얼마나 빨리 약속을 지키는지가 아니라,
당신의 정렬이 무엇을 약속하는지 아는 것에 관한 문제입니다.
'''
hints = [
  "[::-1]을 지우고 reverse=True를 더하세요. 그것이 안정적인 답이고, 문서가 약속합니다: reverse=True는 동점을 뒤집지 않습니다.",
  "다른 답은 key=lambda r: (-r[0], r[1])로 정렬합니다 — 전순서이므로 불안정할 동점이 남지 않습니다. 튜플을 그대로 정렬하지는 마세요: (score, index)는 동점에서 인덱스를 오름차순으로 비교하고, 원한 것은 점수 내림차순에 인덱스 오름차순이었습니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 수는 둘 중 무엇을 썼든 같습니다 — 정체를 드러내는 것은 인덱스 순서입니다.",
]

