id    = "python.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "대나무 비계 때문에 거리 세 곳이 막힌 배달 격자. 가로지르는 방법은 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자는 행 우선 순서로 직접 만들고, 모든
