next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

세 줄을 출력하세요: 분리된 망이 몇 개인지, 가장 큰 것의 크기, 그리고
`REDUNDANT <k>` — 이미 이어져 있던 두 정류장을 잇는 연결이 몇 개였는지.
정류장에서 자기 자신으로의 연결도 그중 하나입니다.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1`에서 다섯 연결은 `6—1`, `4—6`, `2—3`, `2—6`, `1—2`입니다. 마지막
것은 이미 같은 망에 있는 두 정류장을 이으므로 그것이 불필요한 연결이고,
남는 것은 `{1,2,3,4,6}`과 따로 떨어진 정류장 `0`, `5`, `7`입니다.

**이 퀘스트는 복잡도를 강제합니다.** 숨은 케이스 하나는 `n = 200000`, 연결
`m = 200000`개입니다. 유니온-파인드가 아닌 뻔한 답 — 연결마다 `a`에서 망을
걸어 나가 `b`가 이미 그 안에 있는지 보기 — 은 옳고, 연결당 `O(n)`이라 전체
`O(n·m)`입니다: 이 기계에서 10초 실행 제한에 대해 **2분**이 지나도 끝나지
않았습니다. 스타터가 바로 그것입니다. 경로 압축과 크기 기준 합치기를 쓴
유니온-파인드는 같은 200000개 연결을 **0.24초**에 처리합니다. 이 퀘스트에
들어 있는 해답으로 여기서 측정했습니다.

분명히 볼 가치가 있습니다. 시간 제한 있는 스크린에서 떨어지는 가장 흔한
방식이기 때문입니다: **스타터는 틀리지 않았습니다.** 예시와 작은 숨은 케이스
둘 모두에서 정확히 맞는 답을 출력합니다. 너무 늦게 도착한다는 이유만으로
거부됩니다.

유니온-파인드: 모든 정류장은 부모를 가리키고, `find`는 루트까지 걸어가며,
`union`은 한 루트를 다른 루트로 향하게 합니다. `find`에서 돌아 나오는
길에 경로를 압축하면 전체가 질의당 사실상 상수 시간입니다.

`find`는 루프로 쓰세요. 재귀 버전이 교과서 버전이고, 길이 천의 사슬에서
`RecursionError`입니다 — 크기 기준 합치기가 막으려고 존재하는 바로 그
모양이고, 첫 `find`가 압축하기 전의 적대적 입력이 갖는 바로 그 모양입니다.
'''
hints = [
  "연결 목록을 먼저 만들지 말고 진행하면서 두 끝점을 뽑으세요 — 각각 생성기 한 단계씩, 그 순서로. 여기서는 연결이 두 번 필요한 곳이 없습니다.",
  "모든 정류장이 자기 자신의 부모이고 그룹이 n개인 상태로 시작하세요. 성공한 union마다 수가 하나 줄어듭니다.",
  "양 끝이 이미 같은 루트를 가진 연결이 불필요한 것입니다 — 세고 넘어가세요. 자기 연결 a == b는 그 검사에서 저절로 걸립니다.",
  "루트의 크기 항목만 의미가 있으므로, 가장 큰 것은 모든 인덱스가 아니라 루트들에서 읽으세요. max(..., default=0)은 특별한 경우 없이 n = 0을 처리합니다.",
  "parent[x], x = root, parent[x]는 한 줄로 압축합니다: 어느 대입이 일어나기 전에 오른쪽이 전부 평가되므로, 이전 parent[x]는 덮어쓰이기 전에 읽힙니다.",
