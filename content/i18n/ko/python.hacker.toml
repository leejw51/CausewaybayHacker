[[quest]]
id    = "python.hacker.31.palindrome"
title = "거꾸로 해도 같은"
story = "상위 스무 문제 중 하나, 대부분의 스크린에서 어떤 형태로든 나오고, 대부분의 사람이 한 번 써 보고 끝내 이해하지 못한 문제."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열은 감기는 64비트 산술로 직접
만드세요 (손으로 마스크하세요):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

가장 긴 회문 부분 문자열의 길이를 출력하고, 그다음 `AT <index>` — 그 길이의
회문 중 **가장 왼쪽** 것의 0부터 세는 시작 위치 — 를 출력하세요.

```
input:  12 3 5
output: 5
        AT 1
```

각 중심에서 펼쳐 나가세요. 중심은 `n`개가 아니라 `2n - 1`개입니다: 모든 문자는
홀수 길이 회문의 중심이고, 두 문자 사이의 모든 틈은 짝수 길이 회문의
중심입니다. 틈을 잊는 것이 멀쩡해 보이는 풀이가 `abba`에서 `1`을 돌려주는
이유이고 — 스타터가 하는 것이 그것입니다.

**테스트가 강제하는 것과 강제하지 않는 것**, 솔직하게. 일을 하는 숨은 케이스는
**한** 글자 알파벳 위의 `n = 8000`입니다. 중심에서 펼치기의 최악의 경우입니다
— 모든 중심이 문자열 끝까지 달립니다 — 그래서 옳은 답은 거기서 `O(n²)`를 다
하고, 파이썬 루프에서 문자 비교 삼천이백만 번, 약 **1.3초**에 끝납니다. 모든
부분 문자열을 확인하고 하나하나 검사하는 것도 거부합니다:
`s[i:j] == s[i:j][::-1]`은 C에서 돌아가고, 그것이 바로 그 삼차 루프가 작은
입력에서 빠르게 느껴지는 이유이며, `n = 8000`에서는 10초 제한에 대해 여전히
약 **40초**입니다.

(Rust는 이 케이스를 `n = 20000`으로 돌립니다. 파이썬은 `8000`으로 돌립니다.
파이썬 루프의 이차 답은 Rust 크기에서 8초가 걸릴 것이고, 옳은 프로그램이
간신히 통과하는 제한은 제한이 아니기 때문입니다.)

다른 큰 케이스, 두 글자 알파벳 위의 `n = 20000`은 속도가 아니라
**정확성** 케이스입니다: 무작위 이진 문자열에서 회문 검사는 한두 글자 뒤에
실패합니다. 당신의 생성기와 가장 왼쪽 인덱스 동점 처리가 규모에서 우리 것과
일치하는지 검사합니다.

그러니까: 테스트는 삼차를 거부하고 이차를 받아들입니다. `O(n)` 답인
마나커 알고리즘을 요구하지는 **않습니다**. 그것이 존재한다는 것과 무엇을
하는지는 알아 두세요. "이차보다 더 잘할 수 있나요?"가 이 문제가 보통 깔아 두는
후속 질문이기 때문입니다.
'''
hints = [
  "중심마다 펼치기 둘: 홀수 길이는 (c, c), 짝수 길이는 (c, c + 1). 스타터에는 두 번째가 없습니다.",
  "루프가 멈추면 i와 j 모두 회문을 하나 지나쳐 있습니다 — 그래서 시작은 i + 1이고 길이는 j - i - 1입니다.",
  "엄격히 더 긴 회문에서만 갱신하면, 각 길이의 가장 왼쪽 것이 남고, 그것이 AT가 묻는 것입니다. 그리고 `i >= 0`은 손으로 검사해야 합니다: 파이썬에서 s[-1]은 유효한 인덱스이고, 틀린 문자입니다.",
]

