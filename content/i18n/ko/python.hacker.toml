[[quest]]
id    = "python.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구는 문제의 맨 아래에 나오고, 방 안의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. 감기는 64비트 산술로 (손으로 마스크하세요)
`q`개 질의를 생성하세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

각 질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요.
모든 `q`개 답의 합을, 그것도 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리입니다. 파이썬은 실제로 그것을
계산합니다 — `math.comb(200000, 100000)`이 존재하고 전부를 돌려줍니다 — 그리고
그것이 이 언어의 함정입니다: 옳고, 질의마다 수십 밀리초가 걸리고, "소수로 나눈
나머지"가 뜻하는 것이 아닙니다. 모든 곱셈은 하면서 바로 줄입니다. 문제는
나눗셈입니다: `a! / (b! (a-b)!)`는 모듈러 산술에서 의미가 없습니다. 그것을
대신하는 것이 **모듈러 역원**이고, `1000000007`이 소수이므로 페르마의 소정리가
그것을 줍니다: `inverse(v) = v^(p-2) mod p`. 파이썬의 인자 세 개짜리
`pow(v, p - 2, p)`가 그것이고, C에서, 호출 한 번으로 합니다.

그러니까: `factorial[0..n]`을 한 번 미리 계산하고, 각 질의에
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**이 퀘스트는 복잡도를 강제합니다.** 숨은 케이스 하나는 `n = 200000`,
`q = 200000`입니다. 각 계수를 따로 계산하는 것 — 항 `b`개를 곱하고, 항 `b`개로
나누고, 각각 모듈러 역원 하나 — 은 10초 실행 제한 안에 끝나지 않습니다. 그것이
스타터입니다. 공유하는 계승 표 하나는 약 0.5초에 끝납니다. 둘 다 이 기계에서
측정했습니다.

모든 중간값은 `2^30` 미만인 두 값의 곱이므로 `i64`에 들어갈 것입니다.
파이썬에서는 어쨌든 아무것도 넘치지 않고, 곱셈마다 줄이는 이유는 정확성이
아니라 속도입니다. 32비트 `int`를 가진 언어에서는 둘 다일 것이고, 그것이 이
문제가 출제되는 이유의 다른 절반입니다.
'''
hints = [
  "곱셈마다 줄이세요. 파이썬은 넘치지 않지만, 200000자리 중간값은 곱하기 느리고, % P는 모든 수를 2^30 미만으로 유지합니다.",
  "pow(v, P - 2, P)가 모듈러 역원이고, P가 소수이기 때문에만 동작합니다 — 여기서 페르마의 소정리가 말하는 내용의 전부가 그것입니다. 파이썬 3.8 이상은 pow(v, -1, P)도 받는데, 같은 것을 직접 말한 것입니다.",
  "역계승도 inverse(factorial[n])에서 거꾸로 미리 계산하면 질의마다의 pow() 호출 두 번이 없어집니다. 통과하는 데 필요하지는 않고, 소리 내어 말할 가치가 있습니다.",
]

