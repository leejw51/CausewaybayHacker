[[quest]]
id    = "python.hacker.28.lru"
title = "재귀 한도"
story = "7-32호실, 마지막 문제, 네 번째. 면접관이 모니터를 끄고, 화이트보드 위의 언어는 프레임 천 개에서 멈추는 언어다."
brief = '''
첫 줄은 `cap q`이고, 그다음은 `q`줄의 연산 — 각각 `PUT <key> <value>` 또는
`GET <key>` — 이거나, 첫 줄에 **세 번째** 숫자 `seed`가 있으면 더 이상의 줄은
전혀 없고 `q`개 연산은 아래 생성기에서 나옵니다.

가득 찼을 때 **가장 오래 사용되지 않은** 항목을 내보내는 고정 용량 캐시를
구현하세요. `GET`과 `PUT` 모두 키를 사용한 것으로 칩니다. 캐시가 이미 가진
키에 대한 `PUT`은 값을 바꾸고 그 키를 가장 최근 것으로 만듭니다 — 항목을
더하지 않으므로, 캐시가 아무리 가득 차 있어도 아무것도 내보내지 않습니다.

각 `GET`마다 값을 출력하고, 없으면 `-1`을 출력하세요. 끝에 살아남은 키를
가장 최근에 사용한 것부터 공백으로 구분해 출력하고 — 캐시가 비었으면
`-` — 그다음 `EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`이
자리가 필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은
맞고 `3`을 가장 최근 것으로 만들며, 그래서 생존자가 `3 1`로 출력됩니다.

생성되는 형태는 감기는 64비트 산술로 만듭니다 (손으로 마스크하세요):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**스타터는 옳습니다.** 예시에서, 입력할 수 있는 모든 케이스에서 돌려 보면
매번 맞습니다. 연산을 함수형 언어가 하듯이 처리합니다 — 첫 번째를 처리하고,
나머지에 대해 재귀 — 그리고 파이썬은 함수형 언어가 아닙니다. 꼬리 호출
제거가 없고, 모든 호출은 진짜 프레임이며, `sys.getrecursionlimit()`은
`1000`입니다. 생성되는 숨은 케이스에는 연산이 이천 개 있고, 스타터는 거기서
이렇게 죽습니다:

```
RecursionError: maximum recursion depth exceeded
```

그것이 보스입니다. `sys.setrecursionlimit(10000)`은 그것을 사라지게 하고,
틀린 답입니다: 한도가 있는 것은 인터프리터 아래의 C 스택이 유한하기 때문이고,
충분히 높이 올리면 깨끗한 예외가 세그멘테이션 폴트로 바뀝니다. 재귀는 애초에
이 문제의 모양이 아니었습니다. 연산은 나열이고, 나열은 `for` 루프입니다. (그리고
매 호출의 `ops[1:]`은 리스트의 나머지를 복사하므로 재귀 버전은 이차이기도
했는데, 그것이 문제가 될 만큼 멀리 가 본 적이 없어서 아무도 눈치채지
못했습니다.)

그다음은 캐시 자체입니다. 교과서의 답은 이중 연결 리스트로 들어가는 해시
맵이고, 파이썬에는 포인터를 숨긴 채 표준 라이브러리에 그것이 있습니다:
`collections.OrderedDict`. `move_to_end(key)`가 "건드리기"이고
`popitem(last=False)`가 차가운 끝에서의 내보내기이며, 둘 다 `O(1)`이므로
여기의 모든 연산은 `O(1)`이고 얼버무리지 않고 그렇게 말할 수 있습니다. (평범한
`dict`도 3.7부터 삽입 순서를 유지하고 `move_to_end`만 없습니다. 키를 지우고
다시 넣는 것이 같은 요령을 손으로 쓴 것입니다.) 스타터의 캐시는
`(value, stamp)` 쌍의 dict이고 내보낼 때 가장 오래된 스탬프를 훑는데, 그것은
`O(cap)`입니다 — 옳고, 고칠 두 번째 것입니다.
'''
