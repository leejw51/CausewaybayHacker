없음"을 뜻하는 `None`으로 시작하고, `x <= None`은 `TypeError`이므로
`None`에는 따로 검사가 필요합니다.

질의는 **내려가기**로 답합니다: 노드와 비교해서 작으면 왼쪽, 아니면 오른쪽으로
