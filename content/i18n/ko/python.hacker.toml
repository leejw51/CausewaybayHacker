엄격히 작고 오른쪽의 모든 값이 엄격히 큰 이진 탐색 트리인가? 그다음 질의마다
한 줄씩: 트리에 있으면 `<value> FOUND <depth>`, 없으면 `<value> ABSENT`.
루트의 깊이는 1입니다.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

각 노드에서 `left < node < right`를 검사하는 것은 **충분하지 않습니다** —
왼쪽 서브트리 깊숙한 곳의 값이 조상보다 클 수 있습니다. 대신 열린 구간을
