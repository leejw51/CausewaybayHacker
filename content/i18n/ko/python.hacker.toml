  "sys.setrecursionlimit는 수정이 아니고, 왜 아닌지 아는 것이 그들이 원하는 답입니다: 한도를 옮길 뿐 없애지 않으며, 어느 지점을 넘으면 인터프리터는 예외를 던지기를 멈추고 죽기 시작합니다.",
