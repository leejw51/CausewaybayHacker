# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.advanced.29.frozen"
title = "바뀌지 않는다"
story = "오늘 밤의 요금표가 19:00에 readonly 표시를 달고 모든 스크린으로 나가는데, 22:00가 되자 셋이 그 위에 뭔가를 적었고 하나는 없는 열을 추가했다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 형식의 줄 `n`개입니다.

각 줄을 `readonly` 필드를 가진 `Price`로 만드세요. 그다음 가격마다 그
`cents`를 덮어쓰려 하고, 그 시도가 예외를 던지면 `FROZEN <NAME>`을 출력하세요.
다음으로, 필드 `count` 하나를 가진 `Tally`: 그것을 설정하고, 그다음 철자가
틀린 `cuont`를 설정하려 하고, *그것이* 예외를 던지면 `SEALED YES`를
출력하세요. 마지막으로 `IN_SET <k>`, 이름과 센트로 따져 서로 다른 가격이 몇
개인지, 그리고 `TOTAL <sum>`.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SEALED YES
        IN_SET 2
        TOTAL 3300
```

`readonly`는 컴파일러와의 계약이고, 여기의 모든 계약처럼 **지워집니다**.
`price.cents = 0`은 컴파일되지 않습니다 — 그래서 스타터는 넓힌 뷰를 통해
씁니다. `(price as { cents: number }).cents = 0`은 readonly 속성이 가변 속성에
대입 가능하기 때문에 컴파일되고, 실행 시점에는 아무것도 가로막지 않습니다.
요금표에 뭔가가 적히고, `TOTAL`은 `0`입니다. 계약의 실행 시점 쪽 절반은
생성자 끝의 `Object.freeze(this)`입니다: 동결된 객체의 속성에 대입하면 strict
모드에서 `TypeError`를 던지고, `tsc`가 `strict`에서 내보내는 모든 파일은
`"use strict"`로 시작합니다.

`Object.seal(this)`는 또 다른 고정된 모양입니다: 기존 필드는 쓰기 가능하게
남고, 새 필드 — 오타 — 를 추가하면 아무도 읽지 않는 필드를 조용히 만드는 대신
예외를 던집니다. 컴파일러도 `tally.cuont`를 잡아낼 것입니다. 그렇게 두기만
한다면. 스타터는 그렇게 두지 않고, `JSON.parse`도 그렇게 두지 않습니다.

그리고 객체의 `Set`은 값이 아니라 **객체**를 셉니다: `LAM 1200` 가격 둘은
할당이 둘이므로 멤버도 둘입니다. 필드로 만든 문자열 —
`` `${name}:${cents}` `` — 로 집합의 키를 삼으면 하나가 됩니다.
'''
hints = [
  "Price 생성자의 마지막 줄에 Object.freeze(this). 매개변수 속성은 본문이 실행되기 전에 대입되므로, 이미 거기 있어서 동결할 수 있습니다.",
  "Tally 생성자에 Object.seal(this). 클래스 필드는 생성자 본문보다 먼저 초기화되므로, 그때쯤 count는 존재하고 쓰기 가능하게 남습니다.",
  "TOTAL은 원래 센트의 합이고, 그것은 쓰기가 실패했기 때문에만 성립합니다. 스타터에서는 그때쯤 모든 가격이 0이고 TOTAL도 0입니다 — readonly 필드에 뭔가가 적혔고, 아무것도 한마디 하지 않았습니다.",
]

