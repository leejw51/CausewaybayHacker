[[quest]]
id    = "typescript.advanced.30.error-classes"
title = "당신만의 오류"
story = "광고 예약 시스템의 네 계층은 각자 자기 것을 던지고, 예약 화면은 그중 하나를 잡고 나머지에 쓰러진다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이고, 각 줄은 시간 단위 예약 길이여야
합니다.

오류 계층을 정의하세요: 기반으로 `PriceError extends Error`, 그리고 그것을
확장하는 `NotANumber`와 `Negative`. `Negative`는 시간을 지니고 메시지는
`negative hours: <h>`입니다. `NotANumber`의 메시지는 `not a number`입니다.
`price(text)`는 `BigInt(text)`로 텍스트를 변환하고 — 정수가 아닌 것에는
`SyntaxError`를 던집니다 — **`SyntaxError`를 `cause`로 삼아** `NotANumber`를
던지며, 음수 길이를 거부하고, 그 밖에는 `500 + 100 * hours`를 돌려줍니다.

각 가격이나 오류의 메시지를 출력하고, 그다음 `ERRORS <k>`를 출력하세요.
**기반 클래스**로, 한 번만 좁히세요.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative hours: -2
        ERRORS 2
```

스타터는 `err instanceof Negative`로 좁히고 나머지는 전부 다시 던지므로,
`xx` 줄이 잡히지 않은 `NotANumber`로 프로그램을 쓰러뜨립니다.
`err instanceof PriceError`는 계층의 모든 멤버에 대해 참이고, `err.message`가
메시지입니다 — 그것은 핸들러가 아니라 `super(...)`에 넘겨져 클래스 안에
삽니다.

`new NotANumber({ cause })` — `ErrorOptions`는 `es2022` 라이브러리에 있습니다 —
는 아래에 깔린 `SyntaxError`를 기록합니다. 여기서는 아무것도 그것을 출력하지
않습니다. 잡히지 않은 것이라면 스택 트레이스 아래에 `[cause]:` 블록으로 출력할
것입니다. 그 사슬이 그것을 넘기는 이유입니다.

`class X extends Error`와 `instanceof X`가 동작하는 것은 타깃이 `es2022`이기
때문입니다. ES5로 낮춰 컴파일하면 `Error`의 서브클래스는 프로토타입을 잃고
`instanceof`는 조용히 `false`를 돌려줍니다 — 오래된 코드베이스가
`Object.setPrototypeOf(this, new.target.prototype)`로 가득한 이유입니다.
'''
hints = [
  "err instanceof PriceError — 기반 클래스가 두 서브클래스를 다 덮고, 그것이 기반 클래스를 두는 요점입니다.",
  "instanceof 검사 뒤에 err는 PriceError이고 err.message가 타입 검사를 통과합니다. 그 전에는 err가 unknown이고 아무것도 통과하지 않습니다.",
  "타입스크립트의 catch에는 타입 필터가 없으므로, instanceof 검사의 순서가 파이썬 except 절의 순서입니다: 기반 클래스 뒤에 검사하는 서브클래스는 죽은 코드이고, 아무것도 경고하지 않습니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "typescript.advanced.31.iterator"
title = "다음, 멈출 때까지"
story = "리 가든 대기줄의 번호표 기계는 시작 번호에서 일정한 간격으로 번호를 내주고 목록은 남기지 않는데, 대기 화면은 늘 기계가 내준 것보다 한 장 적게 보여 준다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

**이터레이터 프로토콜을 손으로** 구현하는 클래스 `Tickets`를 작성하세요:
`[Symbol.iterator]()`는 `this`를 돌려주고, `next()`는 `count`개의 값 각각에
대해 `{ done: false, value }`를, 그다음에는
`{ done: true, value: undefined }`를 돌려줍니다. 각 값을 한 줄에 하나씩
출력하고, 두 번째 `Tickets`를 훑어서 계산한 `SUM <total>`을 출력하세요.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

이것이 제너레이터가 대신 써 주는 것입니다. `for...of`는 대상에 대해
`[Symbol.iterator]()`를 한 번 부르고, 그 결과에 대해 어떤 결과가 `done: true`라고
말할 때까지 `next()`를 부릅니다 — 그리고 `done: true`라고 말하는 결과는 **value까지
통째로** 다시 보지 않습니다. 펼치기, `Array.from`, 구조 분해도 똑같이 합니다.

스타터의 `next`는 번호표를 써 버린 뒤에 `done`을 정하므로, 마지막 진짜 번호표가
`done: true` 표시를 달고 나가고, `for...of`는 그것을 버립니다. 타입 검사는
통과합니다: `{ done: boolean, value: number }`는 어느 쪽이든
`IteratorResult<number>`에 맞습니다. 계약은 결과가 어떻게 생겼는지를 말할 뿐,
언제 끝났다고 말해도 되는지는 말하지 않습니다.

`this`를 돌려주는 `[Symbol.iterator]()`는 **이터레이터**의 표시입니다: 한 번
훑을 수 있고 그다음엔 소진됩니다. **컨테이너**는 매번 새 이터레이터를 돌려주고
여러 번 훑을 수 있습니다. 이 길의 `Bag`이 그런 것이었습니다. 어느 쪽을 쓰는지
분명히 하세요. 그 차이는 누군가 두 번째로 루프를 돌 때 드러납니다.
'''
hints = [
  "`left === 0`을 먼저 검사해서 { done: true, value: undefined }를 돌려주세요. 그다음에야 번호표를 꺼내 { done: false, value }를 돌려줍니다.",
  "done인 결과의 value는 for...of가 무시합니다. 스타터의 마지막 번호표는 done이라고 말하는 결과 안에 있고, 그래서 화면과 합계가 둘 다 마지막 번호표만큼 모자랍니다.",
  "나아가기 전에 돌려줄 값을 저장해 두세요. 아니면 반대 방향으로 한 걸음 어긋납니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "typescript.advanced.32.containers"
title = "알맞은 컨테이너"
story = "사이니지 사무실은 오늘 밤 재생 기록을 긴 배열 하나에 보관하고, 그에 관한 모든 질문에 맨 위부터 읽어 내려가며 답한다."
brief = '''
표준 입력은 세 줄입니다: 단어 한 줄, 이미 **오름차순으로 정렬된** 정수 한 줄,
그리고 정수 `x` 하나.

네 줄을 출력하세요:

1. `TOP <word> <count>` — 가장 자주 나온 단어, 같으면 단어 오름차순
2. `BISECT <l> <r>` — 정렬된 정수들에서 값이 `x`보다 작지 않은 첫 인덱스와,
   값이 `x`보다 큰 첫 인덱스
3. `SMALLEST3` 뒤에 스타터의 `MinHeap`에서 꺼낸 가장 작은 정수 셋 — 더 적으면
   그만큼
4. `GROUPS` 뒤에 단어의 첫 글자마다 `<letter>:<k>`, 글자 오름차순 — 첫 글자를
   키로 한 `Map<string, string[]>`

```
input:  tram bus tram bus ferry
        1 3 3 5 8
        3
output: TOP bus 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS b:2 f:1 t:2
```

표준 라이브러리에는 이 선반에 `Map`과 `Set`만 있고 다른 것은 없습니다 —
카운터도, 힙도, bisect도 없습니다. 힙은 대신 써 두었습니다. 나머지는 당신
몫입니다.

스타터는 가장 높은 개수를 가진 단어 중 처음 본 것을 유지하는데, 여기서는
`tram`이고 문제는 `bus`라고 말합니다. 원하는 것을 말하는 키로 동점을
깨세요.

두 bisect는 각각 이진 탐색 하나입니다: `lo`와 `hi`를 두고, 가운데를 보고, 한쪽
끝을 옮기세요 — `Math.floor((lo + hi) / 2)` 또는 `(lo + hi) >>> 1`. 둘의
차이가 `x`의 사본이 몇 개인지이고, 어느 쪽도 `x`가 없을 때 실패하지 않습니다.
`indexOf`는 그럴 때 인덱스처럼 보이는 `-1`로 실패합니다. 힙은 가장 작은 몇
개를 거듭해서 원할 때 알맞은 컨테이너입니다: 앞에서 셋을 읽으려고 전부를
정렬하는 것이 힙이 피하려고 존재하는 일입니다.

그룹: `groups.get(letter)`는 `string[] | undefined`입니다. 없으면 목록을
만들고, 설정하고, 그다음 push하세요.
'''
hints = [
  "[word, count] 항목들을 개수 내림차순, 그다음 단어 오름차순으로 정렬하고 첫 번째를 취하세요. 항목 하나를 얻으려고 맵 전체를 정렬하는 것은 이 크기에서는 괜찮습니다. 같은 규칙으로 비교하는 한 번의 순회도 같은 답입니다.",
  "플래그 하나를 둔 bisect 하나: sorted[mid] < x인 동안 lo를 mid 너머로 옮기고 — 오른쪽 bisect에서는 sorted[mid] === x일 때도. indexOf는 x가 없으면 -1을 돌려주고, 숨은 케이스 하나가 정확히 그것입니다.",
  "Map은 객체처럼 삽입 순서를 유지하므로, 출력하기 전에 글자를 정렬하세요. [...groups.keys()].sort()가 문제가 요구하는 순서입니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.advanced.33.cancellation"
title = "그만 기다리기"
story = "관제실은 섬 지도를 다시 그리기 전에 모든 스크린에 상태를 묻는데, 네트워크 카드가 나간 틴하우의 스크린은 결코 답하지 않고, 그래서 지도는 결코 다시 그려지지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<SCREEN> <DOWN>` 형식의 줄 `n`개이고, `DOWN`은
즉시 답하는 스크린이면 `0`, 네트워크 카드가 나가서 아예 답하지 않는 스크린이면
`1`입니다.

스크린마다 그 `ping(screen, down, token)`을 **200 ms** 기한의 `withTimeout`
아래에서 실행하고, 입력 순서대로 `<SCREEN> OK` 또는 `<SCREEN> TIMEOUT`을
출력하세요. 그다음 10 ms 슬립으로 영원히 반복하는 `watch(token)` 태스크를
시작하고, 그 토큰을 취소하고, **그것을 await**해서, 그것이 `catch`에서
`CANCELLED`를, `finally`에서 `CLEANUP`을 출력하게 하세요. 마지막으로
`TIMEOUTS <k>`를 출력하세요.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

프로미스는 취소할 수 없습니다. `.cancel()`은 없고, 타이머와의 `Promise.race`는
누구의 말을 *들을지*만 정합니다 — 진 쪽은 계속 돌고, 아직 걸어 둔 것이 있다면,
타이머든 구독이든, 당신의 마지막 줄 뒤에도 계속 붙들고 있습니다. 그러니
취소는 **넘겨주는** 것입니다: 작업이 확인하거나 구독하는 토큰. 스타터에 하나
있습니다. `cancel()`과 `onCancel(handler)`를 가진 `Token`. `sleep`은 구독하고,
취소되면 자기 타이머를 지우고 `Cancelled`로 거부됩니다. 그리고 `silence` —
죽은 스크린 — 는 취소 말고는 아무것도 확정시키지 않을 프로미스입니다.
(`AbortController`가 같은 것의 플랫폼 버전입니다. 여기서는 선언되어 있지
않습니다.)

`withTimeout(work, ms)`는 토큰을 만들고, `work(token)`을 `Timeout`으로 거부하고
**그리고** 토큰을 취소하는 타이머와 경주시키며, 작업이 이기면 `finally`에서
자기 타이머를 지웁니다. 스타터는 그것을 부르지 않습니다: `ping`을 직접
await하고, `WONG`은 결코 답하지 않습니다. Node가 그럴 때 무엇을 하는지 이미
보았습니다: 누군가를 깨울 수 있는 것이 남지 않았으니 프로세스는 `LAM OK` 뒤에
상태 `0`으로 종료합니다.

스타터는 또 `watch`를 await하지 않고 취소하므로, 감시자가 차례를 얻기 전에
`TIMEOUTS`가 출력됩니다 — 그리고 감시자가 다시 던진 `Cancelled`는 아무에게도
닿지 않고, Node는 그것을 처리되지 않은 거부로 보고하며 상태 `1`로 종료합니다.
`watch` 안에서 `Cancelled`를 처리한 뒤 다시 던지세요: 그것을 삼키는 것이
태스크가 취소 불가능해지는 경로입니다. 태스크를 await한 곳에서 잡으세요.
'''
hints = [
  "withTimeout: setTimeout이 Timeout으로 거부하고 토큰을 취소하는 기한 프로미스, try 안에서 `return await Promise.race([work(token), deadline])`, 그리고 finally에서 clearTimeout.",
  "`await watcher`가 TIMEOUTS가 출력되기 전에 태스크가 catch와 finally를 실행하게 해 줍니다. 그것은 Cancelled를 당신에게 다시 던지므로 그것도 잡으세요 — 그리고 그것만.",
  "finally에서 기한 타이머를 지우세요. 그러지 않으면 답한 스크린마다 200 ms 타이머를 남기고, 프로세스는 종료하기 전에 그 마지막 것을 기다립니다: 출력은 맞고, 매번 더 느립니다. 토큰을 취소하는 것은 반대 방향으로의 같은 예의입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "typescript.advanced.34.event-loop"
title = "이벤트 루프"
story = "사이니지 관제실, 섬의 모든 스크린을 위한 스레드 하나. 콜백 하나가 결코 양보하지 않고, 틴하우에서 하이산까지 모든 전광판이 같은 프레임에서 얼어붙는다."
brief = '''
표준 입력은 정수 `k`와 `n` 둘입니다.

`1..n`을 연속된 덩어리 `k`개로 나누고 — 덩어리 `i`는 `floor(n*i/k) + 1`부터
`floor(n*(i+1)/k)`까지, 양 끝 포함 — 각 덩어리의 제곱의 합을 평범한 루프로,
`bigint`로 구하세요. 어떤 작업이든 시작되기 전에 `main`은 `setImmediate`로
전광판 다시 그리기를 하나 예약하고, 그것은 `BOARD <finished>`를 출력합니다:
전광판이 스레드를 얻었을 때 끝난 덩어리가 몇 개였는지. 전광판은 **첫 덩어리
뒤, 둘째 덩어리 전에** 스레드를 얻어야 합니다. 덩어리마다 인덱스 순서로
`CHUNK <i> <sum>`을 출력하고, 그다음 `TOTAL <sum>`, 그다음 `CHUNKS <k>`를
출력하세요.

```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node는 당신의 자바스크립트를 **스레드 하나**에서 실행하고, 건물의 모든
스크린이 그것을 기다리고 있습니다. 실행 중인 콜백은 돌려주거나 `await`하기
전까지 중단될 수 없습니다 — 타이머에도, I/O에도, 전광판에도. 스타터는 각
덩어리를 `async` 함수로 감싸 전부 `Promise.all`에 넘기고, 동시에 도는 것처럼
보입니다. 그것은 긴 콜백 하나입니다: 안에 `await`가 없는 `async` 함수는
호출되는 순간 처음부터 끝까지 실행됩니다. `main`이 한 번이라도 손을 놓기 전에
`k`개의 덩어리가 전부 더해지고, 전광판은 마지막에 다시 그려져 `BOARD 3`을
보여 주며, `4 2000000`에서는 섬의 모든 스크린이 합이 끝날 때까지 같은 프레임을
보여 줍니다. 여기서 쓸 수 있는 어떤 것도 합을 병렬로 돌게 만들지 못합니다.
그에 대한 Node의 답은 워커 스레드이고, 이 `node.d.ts`는 그것을 선언하지
않습니다. async는 **기다리기** 위한 것입니다. 스레드 하나 위의 CPU 작업은
**예의 바르게** 만들 수 있을 뿐입니다.

그러니 예의 바르게: 덩어리 하나, 그다음 스레드를 돌려주고, 그다음 다음 것.
그리고 올바른 큐에 돌려주세요. `await null`이나 `await Promise.resolve()`는
**마이크로태스크** 큐에 양보하고, Node는 이미디어트나 타이머를 하나라도
실행하기 전에 그 큐를 비울 때까지 돌립니다 — 전광판은 여전히 `BOARD 3`을 볼
것입니다. `await new Promise((r) => setImmediate(r))`는 먼저 큐에 들어간
전광판 뒤, 줄의 맨 뒤로 갑니다.

그리고 작은 버그, 이것은 타이밍과 모든 관계가 있습니다. 스타터는
`total += await work(...)`로 더합니다. 자바스크립트는 `+=`의 왼쪽을 `await`
**전에** 평가합니다: 모든 태스크가 `total`을 `0`으로 읽고, 주차하고, 돌아와서
`0 + 내 것`을 씁니다. 마지막 것이 이기고, `TOTAL`은 마지막 덩어리입니다. 그것은
청구 카운터의 잃어버린 업데이트인데, 읽기와 쓰기 사이에 당신이 볼 수 있는 코드
한 줄조차 없습니다 — 공유 상태의 읽기와 쓰기 사이에 `await`가 있으면 스레드
하나 위에서도 레이스입니다. await 뒤에 total을 읽거나, 잠금을 쥐세요.
'''
hints = [
  "스타터를 실행하고 마지막 줄을 읽으세요: 모든 것 뒤에 출력된 BOARD 3. 전광판은 가장 먼저 예약되었는데도 마지막에 갔습니다. 아무것도 스레드를 돌려주지 않았기 때문입니다.",
  "한 바퀴에 덩어리 하나: 덩어리들을 도는 평범한 for 루프에서 매번 뒤에 `await new Promise((r) => setImmediate(r))`. 전광판의 이미디어트가 먼저 큐에 들어갔으므로 덩어리 0 뒤에 실행됩니다.",
  "`total += await x`는 await하기 전에 total을 읽습니다. `const part = await x; total += part;`는 그 뒤에 읽습니다 — 또는 루프 본문에 await가 아예 없으면 레이스할 것이 없습니다.",
  "n*(n+1)*(2n+1)/6이 합계의 닫힌 형태입니다. TOTAL을 그것과 한 번 대조해 보면 덩어리 경계가 맞는지 알 수 있습니다.",
]
