```

`Sign`은 인터페이스이고, 인터페이스는 **지워집니다**. 실행 시점에는 물어볼
`Sign`이 없습니다 — `x instanceof Sign`은 컴파일되지 않습니다. 오른쪽에 뜻할
것이 아무것도 없기 때문입니다. `unknown`에서 `Sign`으로 가려면 **타입 가드**
