[[quest]]
id    = "typescript.advanced.10.from-entries"
title = "같은 한 번, 키를 달고"
story = "리 가든 쇼핑 앱은 오늘 밤 가격을 가게들이 입력한 순서대로 쌍의 목록으로 받는다. 세일 배너는 그것을 판 하나로 원하고, 그것도 두 번 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<ITEM> <PRICE>` 형식의 줄 `n`개입니다.
`PRICE`는 센트 단위 정수입니다. 한 품목은 많아야 한 번 나오고, `n`은 최소
`1`입니다 — 이름을 댈 가장 싼 품목이 항상 있습니다.

세 줄을 출력하세요:

1. 가격이 **100을 엄격히 넘는** 모든 품목을 `ITEM=PRICE`로, 품목 순으로
   정렬해서 공백 하나로 이어서 — 하나도 없으면 `-`
2. 모든 품목을 가격을 **반으로 나누고 내림해서**, 같은 형식으로, 품목 순으로
   정렬해서
3. `CHEAPEST <item>` — 가장 낮은 가격, 같으면 품목 오름차순

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)`는 `[key, value]` 쌍들로 키가 달린 객체를 식 하나로
만들고, `Object.entries(obj)`는 그것을 다시 분해합니다 —
그러니 `Object.fromEntries(Object.entries(prices).filter(...))`가 걸러진
판이고, 같은 것에 `.map(([k, v]) => [k, Math.floor(v / 2)])`를 쓰면 변환된
판입니다. 어느 쪽도 빈 객체와 그것을 채우는 루프가 필요 없습니다.

정렬되어 보이더라도 출력하기 전에 항목들을 정렬하세요. 객체는 문자열 키를
삽입 순서대로 유지하는데, 배열 인덱스처럼 보이는 키는 **예외**입니다 —
도착한 순서와 상관없이 `"7"`이 `"10"`보다, `"10"`이 `"SCARF"`보다 먼저
옵니다. 상품 번호를 키로 한 판은 스스로 순서를 바꿀 것입니다. 원하는 순서를
직접 말하세요.
'''
hints = [
  "Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100)) — 분해하고, 남기고, 다시 조립합니다.",
  "Object.entries(obj).sort(byKey)는 [key, value] 쌍을 키 순서로 주고, ITEM=PRICE가 원하는 것이 정확히 그것입니다.",
  "가장 싼 것은 가격으로 정렬하고 가격이 같으면 이름으로 넘어가세요: a[1] - b[1] || byKey(a, b). 첫 항목이 이깁니다.",
]

