# TYPESCRIPT LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/typescript/advanced.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, sample input and output and the exact
# strings a program must print are the English pack's and are copied
# verbatim, never translated.

pack   = "typescript.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.advanced.01.conversions"
title = "이름 하나, 모양 하나"
story = "19:00, 30층 관제실. 피드는 타임스 스퀘어 슬롯 가격을 글자로 보내고, 청구 화면은 숫자를 원하고, 대형 스크린은 달러를 원한다."
brief = '''
한 줄을 읽으세요: 센트 단위 금액이 숫자로 적혀 있습니다.

세 줄을 출력하세요:

1. 앞뒤 공백을 뗀 글자 수
2. 금액을 숫자로
3. 금액을 달러로, 소수점 아래 정확히 두 자리

```
input:  1234
output: 4
        1234
        12.34
```

금액은 음수가 아닙니다. 파이썬이라면 이름 하나를 세 번 다시 바인딩할 것입니다.
타입스크립트는 그렇게 두지 않습니다: 이름은 태어날 때의 타입을 계속 지니므로

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

는 한 줄도 실행되기 전에 실패합니다. 그것이 계약이 제 일을 하는 모습입니다.
모양마다 자기 `const`를 주세요 — 글자, 숫자, 달러 — 그러면 읽는 사람이 어떤
이름이 지금 무엇을 담고 있는지 알려고 위로 스크롤할 필요가 없습니다.

달러를 부동소수점을 거쳐 만들지 마세요. `(1234 / 100).toFixed(2)`는 오늘은
우연히 맞고, `0.1 + 0.2`는 매일 `0.30000000000000004`입니다.
`Math.trunc(cents / 100)`과 `cents % 100`이 정확히 두 반쪽이고,
`String(cents % 100).padStart(2, "0")`이 두 번째 반쪽을 채웁니다.
'''
hints = [
  "아직 문자열을 들고 있을 때의 text.length가 첫 줄입니다.",
  "const cents: number = Number(text)는 새 타입을 가진 새 이름입니다. 여기에 `text`를 재사용하면 TS2322이고, 그것은 옛 계약이 아직 유효하다고 컴파일러가 알려 주는 것입니다.",
  "padStart(2, \"0\")은 왼쪽을 채워 너비를 둘로 맞춥니다: 5센트는 0.5가 아니라 0.05입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.advanced.02.control-flow"
title = "몇 번 슬롯"
story = "타임스 스퀘어 스크린은 순환 편성으로 돈다: 세 번째 슬롯마다 광고, 다섯 번째마다 뉴스. 스케줄러는 매번 슬롯 번호를 출력하고, 스크린은 12미터짜리 숫자를 띄운다."
brief = '''
정수 `n` 하나를 읽으세요. `1`부터 `n`까지의 모든 `i`에 대해 한 줄씩 출력하세요:

* `i`가 3과 5 둘 다로 나누어떨어지면 `ADNEWS`
* `i`가 3으로 나누어떨어지면 `AD`
* `i`가 5로 나누어떨어지면 `NEWS`
* 그 밖에는 `i` 자체

그다음 `0`을 읽을 때까지 한 줄에 하나씩 정수를 계속 읽고, 그동안 읽은
0이 아닌 줄의 개수를 `SKIPPED <k>`로 출력하세요.

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

루프 둘, 종류 둘. 첫 번째는 시작하기 전에 몇 번 돌지 압니다:
`for (let i = 1; i <= n; i++)`. 두 번째는 모릅니다: `for (;;)`나
`while (true)`에 `break`를 쓰세요. 횟수는 읽은 값이 정하기 때문입니다.
`i < n`은 하나 모자라게 멈추고, 누구나 여기서 한 번은 쓰는 off-by-one입니다.

표준 입력은 한 덩어리로 도착합니다. `input.split("\n")`이 줄들을 주고,
그 줄들을 따라 내려가는 인덱스가 다른 언어에서라면 있었을 "다음 줄 읽기"입니다.
'''
hints = [
  "둘 다인 경우를 먼저 검사하세요. 아니면 절대 걸리지 않습니다. 3과 5로 나누어떨어지면 15로 나누어떨어집니다.",
  "i < n은 n - 1에서 멈춥니다. 스타터에 그 버그가 있어서 예시 출력이 한 줄 일찍 끝납니다.",
  "==가 아니라 ===. `\"0\" == 0`도 true이고 `\"\" == 0`도 true입니다. 빈 줄이 끝나면 안 되는 루프를 끝내는 경로가 바로 그것입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.advanced.03.arrays"
title = "전광판의 한가운데"
story = "이워 스트리트 트램 정류장 전광판은 저녁의 첫 트램과 마지막 트램을 보여 주고, 배차원은 그 사이 전부에 좌석이 몇 개인지 알고 싶어 한다."
brief = '''
표준 입력의 첫 줄은 개수 `n`이고, 둘째 줄에는 정수 `n`개가 공백으로
구분되어 있습니다. `n`은 최소 `1`이므로 출력할 첫 값과 마지막 값이 항상
있습니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 엄격히 끼어 있는
값들의 합. 값이 셋 미만이면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)`이 한가운데입니다: 복사된 **새 배열**이고, 음수 끝은
뒤에서부터 셉니다. `nums[nums.length - 1]`이 마지막 원소이고
`nums.at(-1)`도 그렇습니다 — 하지만 둘의 타입을 보세요. 인덱스는 `number`라고
말합니다. 컴파일러가 당신을 믿기 때문입니다. `at`은 `number | undefined`라고
말합니다. 배열은 비어 있을 수 있고, 당신의 배열이 비어 있지 않다는 것을
컴파일러는 볼 수 없기 때문입니다. 실행 시점에는 둘 다 같은 값입니다.
그것을 정직하게 말하는 것은 하나뿐입니다.

`reduce((sum, v) => sum + v, 0)`이 한가운데를 더합니다. `0`은 장식이
아닙니다: 빈 배열에 **초깃값 없이** `reduce`를 부르면
`TypeError: Reduce of empty array with no initial value`를 던지고, 원소가
하나인 입력은 한가운데를 비게 만듭니다.
'''
hints = [
  "nums[nums.length - 1]이 마지막 원소입니다. nums.at(-1)도 그렇고, 그 타입은 원소가 없을 수도 있음을 인정합니다.",
  "nums.slice(1, -1)은 첫 값과 마지막 값을 뺀 전부입니다. 값이 하나나 둘이면 []입니다.",
  "reduce의 두 번째 인자로 0이 있어야 합니다. 아니면 빈 한가운데는 아무것도 아닌 합이 되는 대신 예외를 던집니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.advanced.04.strings"
title = "세 가지 길이"
story = "하이산 플레이스의 LED 벽은 자막 예산을 `.length`로 잡는다. 트램 이모지는 2가 들고, 銅鑼灣은 3이 들고, 그 아래 컨트롤러는 9를 센다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. UTF-8로 인코딩한 **바이트** 단위 길이
2. **문자** 단위 길이 (유니코드 코드 포인트)
3. 문자 순서를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

자바스크립트 문자열에는 길이가 셋 있고, `.length`는 요구된 두 가지 중 어느
것도 아닙니다. 그것은 **UTF-16 코드 유닛**을 셉니다: `"銅鑼灣".length`는
`3`이라 맞아 보이고, `"🚋".length`는 `2`라 맞지 않습니다. 문자는
`for (const ch of s)`와 `[...s]`가 훑는 단위입니다 — 문자열 이터레이터는
코드 포인트 단위로 걷습니다 — 그러니 `[...s].length`가 두 번째 줄입니다.

바이트는 세 번째 숫자입니다. 여기에는 `TextEncoder`도 `Buffer`도 없습니다:
`node.d.ts`는 둘 다 선언하지 않고, `tsc`는 `TS2304: Cannot
find name`으로 막을 것입니다. 대신 코드 포인트에서 세세요 —
`ch.codePointAt(0)`이 `0x80` 미만이면 1바이트, `0x800` 미만이면 2,
`0x10000` 미만이면 3, 그 위는 전부 4입니다.

`s.split("").reverse().join("")`은 누구나 손을 뻗는 뒤집기이고, 서로게이트
쌍을 반으로 쪼갭니다. `[...s]`를 뒤집으세요.
'''
hints = [
  "[...line]은 코드 포인트의 배열이고, 그 길이가 문자 수입니다. line.length는 UTF-16 유닛이고, 스타터는 그것을 두 번 출력합니다.",
  "for (const ch of line)도 코드 포인트 단위로 걷습니다. 그래서 ch.codePointAt(0)은 쌍의 절반이 아니라 언제나 문자 전체의 번호입니다.",
  "split(\"\")은 코드 유닛 단위로 쪼개서 이모지를 깨뜨립니다. 펼친 배열을 뒤집으면 각 문자가 온전히 남습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.advanced.05.maps"
title = "벽이 말하는 것"
story = "하이산 플레이스 벽은 오늘 밤 피드가 올려 보내는 단어들의 순위를 매기는데, 거기 적힌 숫자는 전부 NaN이다."
brief = '''
표준 입력 전체를 읽어 공백으로 나누세요.

서로 다른 단어를 하나씩 `<word> <count>`로 출력하되, 개수 내림차순으로,
개수가 같으면 단어 오름차순으로 정렬하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

스타터는 `Record<string, number>`에 세고, 그 타입은 모든 키가 `number`를
담는다고 말합니다. 실행 시점에 아무도 쓰지 않은 키는 `undefined`를 담고,
`undefined + 1`은 `NaN`입니다 — 예외도 경고도 없이, 벽에 틀린 숫자만 뜹니다.
`Map<string, number>`를 쓰세요: `counts.get(word)`의 타입은
`number | undefined`이고, 그것이 사실이며, `?? 0`이 그에 대한 답입니다.

항목들을 비교 함수로 정렬하세요: 개수 내림차순은 `b[1] - a[1]`이고, 그것이
`0`이면 단어로 넘어갑니다. 단어는 `localeCompare`가 아니라 `<`와 `>`로
비교하세요 — `localeCompare`는 기계의 로캘에 묻고, 전광판은 어느 기계에서나
똑같이 읽혀야 합니다.
'''
hints = [
  "스타터가 NaN을 출력하는 것은 += 전에 counts[word]가 undefined였기 때문입니다. Record 타입은 처음부터 없던 숫자를 약속했습니다.",
  "counts.set(word, (counts.get(word) ?? 0) + 1) — get은 없음을 인정하고, ??가 0을 채웁니다.",
  "b[1] - a[1] || wordOrder: 0을 돌려주는 비교 함수는 동점을 || 오른쪽에 넘깁니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.advanced.06.sets"
title = "두 스크린에 다 나오는 것"
story = "이워 스트리트를 사이에 두고 스크린 둘이 마주 보고 있고, 광고주는 같은 교차로에서 어떤 클립에 두 번 돈을 내고 있는지 알고 싶어 한다."
brief = '''
표준 입력은 두 줄이고, 각 줄은 한 스크린의 클립들이 공백으로 구분되어
있습니다. 한 스크린이 같은 클립을 두 번 적을 수도 있는데, 그것은 한 번으로
칩니다.

세 줄을 출력하세요:

1. `BOTH` 뒤에 두 목록 모두에 있는 클립 전부를 정렬해서 공백으로 구분 — 하나도
   없으면 `BOTH -`
2. `ONLY_A <k>`: 첫 목록에는 있고 둘째 목록에는 없는 클립의 수
3. `ALL <k>`: 어느 쪽 목록에든 있는 서로 다른 클립의 수

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

`Set`에는 중복이 없습니다. 그리고 이 랜드가 컴파일할 때 쓰는 `es2023`
라이브러리에서는 `intersection`, `difference`, `union`도 없습니다 — 그것들은
ES2025에 들어왔고, `tsc`는 `TS2339: Property 'intersection'
does not exist`로 그렇게 알려 줄 것입니다. 무엇이 존재하는지는 실행하는
Node 버전이 아니라 컴파일할 때 쓰는 라이브러리가 정합니다. 그러니 직접
쓰세요: `[...a].filter((x) => b.has(x))`가 교집합이고, 같은 것에
`!b.has(x)`를 쓰면 차집합, `new Set([...a, ...b])`가 합집합입니다.

비교 함수 없는 `.sort()`는 문자열을 UTF-16 코드 유닛으로 정렬하고, 이것들에는
정확히 맞고 숫자에는 정확히 틀립니다. 순위판은 두 퀘스트 뒤에 있습니다.
'''
hints = [
  "new Set(tokens)은 들어오는 길에 중복된 sneakers를 버립니다. Set의 개수는 .length가 아니라 .size입니다.",
  "[...a].filter((x) => b.has(x))가 교집합입니다. 차집합은 검사를 뒤집고, 합집합은 둘 다 한 Set에 펼쳐 넣으세요.",
  "both.length > 0 ? both.join(\" \") : \"-\"가 빈 경우를 식 하나로 처리합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.advanced.07.functions"
title = "시간당"
story = "요금표의 스크린 슬롯은 따로 적혀 있지 않으면 전부 시간당이고, 요금표 프린터는 따로 적히지 않은 슬롯마다 밑에 `/undefined`를 찍는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 또는 `<NAME> <CENTS> <UNIT>`
형식의 줄 `n`개입니다.

소수점 아래 두 자리로 `<NAME> $<dollars>/<unit>`을 돌려주는
`tag(name, cents, unit = "hour")`를 작성하고, 한 줄에 태그 하나씩 출력하세요.

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

스타터는 컴파일되고, 실행되고, `TSQ $12.00/undefined`를 출력합니다. 이유를
보세요. `const [name, cents, unit] = line.split(" ")`은 셋 모두를 `string`으로
타입 짓습니다. `split`은 `string[]`을 돌려주고 컴파일러는 그 길이를 모르기
때문입니다. 토큰이 둘인 줄에서 `unit`은 실행 시점에 `undefined`이고, 템플릿
리터럴은 그 단어를 충실히 출력합니다. 타입은 배열이 한 적 없는 약속이었습니다.

**기본 매개변수**가 해결책이고, 알아 둘 만한 이유로 작동합니다: 기본값은 인자가
`undefined`일 때 발동합니다 — 빠졌거나, 명시적으로 `undefined`를 넘겼거나.
여기서 `tag(name, cents, unit)`이 하는 일이 후자입니다. `null`은 발동시키지
않습니다. 시그니처는 호출하는 쪽이 무엇을 생략할 수 있고 생략하면 무엇을
받는지 말하는 계약입니다.
'''
hints = [
  "매개변수 목록에 unit: string = \"hour\". 그게 해결책 전부입니다.",
  "기본값은 undefined에서 발동하고, 일부러 넘긴 undefined도 포함됩니다. 본문 안의 `unit ?? \"hour\"`는 같은 생각을 호출 지점에서 쓴 것입니다.",
  "템플릿 리터럴 안의 `$${...}`는 달러 기호 문자 뒤에 보간이 오는 것입니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.advanced.08.exceptions"
title = "숫자가 아닌 줄"
story = "이워 스트리트 트램 정류장의 도착 안내판은 피드에서 분 단위 숫자 한 열을 읽는데, 그 가운데 한 줄에 `xx`라고 적혀 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수여야 합니다.

각 줄마다 값의 두 배를 출력하거나, 정수가 아니면 `BAD <line>`을 출력하세요.
마지막으로 `SUM <total>`을 출력하는데, total은 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")`는 실패하지 않습니다. `NaN`을 돌려주고, `Number("1.5")`는
`1.5`, `Number("")`는 `0`입니다. 그래서 스타터의 `double`은 글자를 패턴과
대조해서 `NotANumber`를 **던집니다** — 그리고 그래서 스타터는 둘째 줄에서 그
예외로 죽습니다. 아무도 잡지 않기 때문입니다.

던질 수 있는 호출 하나를 `try`/`catch`로 감싸세요. `strict`에서 잡힌 값의
타입은 **`unknown`**입니다: 자바스크립트의 `throw`는 문자열이든 숫자든
`undefined`든 무엇이든 던질 수 있고, 컴파일러는 그렇지 않은 척하지 않습니다.
`catch (NotANumber e)`는 없습니다. 직접 좁히세요 —
`if (err instanceof NotANumber)` — 그리고 당신 것이 아니면 `throw err`로 다시
던지세요. 그래야 당신 코드의 오타가 나쁜 줄로 보고되는 대신 여전히 요란하게
실패합니다.
'''
hints = [
  "스타터는 NotANumber: not a whole number: xx로 죽습니다. 잡아야 할 클래스가 그것입니다.",
  "try 블록은 작게: 실패할 수 있는 호출만 안에 넣고, 출력과 합계는 그 뒤에 두세요.",
  "catch (err: unknown), 그다음 `if (err instanceof NotANumber)`. 그 밖의 것은 `throw err`로 다시 던집니다. 모든 것을 삼키는 catch는 프로그램이 조용히 실패하는 법을 배우는 경로입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.advanced.09.array-methods"
title = "피드를 한 번에"
story = "알렉스는 for 루프 셋과 카운터 셋이면 된다고 말한다. 세 번째 루프가 끝날 무렵이면 하이산 플레이스 벽으로 가는 피드는 이미 다음으로 넘어가 있다."
brief = '''
표준 입력은 공백으로 구분된 정수 한 줄입니다.

세 줄을 출력하세요:

1. 짝수 값들의 합 (하나도 없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로, 순서대로, 공백 하나로 이어서 — 하나도
   없으면 `-`
3. 서로 다른 값의 개수

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

타입스크립트에는 컴프리헨션이 없습니다. 배열 메서드가 있고, 그것들은 같은
생각을 왼쪽에서 오른쪽으로 쓴 것입니다: `filter`는 남기고, `map`은 바꾸고,
`reduce`는 접고, `new Set(...)`은 중복을 없앱니다. 각각 새 값을 돌려주고
어느 것도 인덱스가 필요 없습니다.

`reduce`는 초깃값을 받고, 여기서는 선택이 아닙니다: 예시에는 짝수가 있지만
숨은 케이스 하나에는 없고, `[].reduce((a, b) => a + b)`는 `TypeError: Reduce of empty array with
no initial value`를 던집니다. `reduce((sum, v) => sum + v, 0)`은 아무것도
없는 것을 `0`으로 더합니다.

음수: 자바스크립트에서 `-4 % 2`는 `-0`입니다. `-0 === 0`은 `true`이므로 짝수
검사는 괜찮습니다 — 하지만 숫자는 템플릿 리터럴을 거쳐 출력하세요. 거기서
`` `${-0}` ``은 `"0"`입니다. 맨 `-0`이 `console.log`에 닿게 두지 마세요.
'''
hints = [
  "nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0) — 남기고, 접고, 0을 시작 합으로.",
  "filter 먼저, map은 그다음: 원래 값으로 거르고, 살아남은 것을 두 배로 하세요.",
  "new Set(nums).size가 서로 다른 값의 개수입니다. Set은 숫자를 값으로 비교하므로 12 둘은 하나입니다.",
]

