[[quest]]
id    = "typescript.advanced.12.classes"
title = "오퍼레이터의 수첩"
story = "관제실의 오퍼레이터는 모두 오늘 밤 큐에 넣은 클립을 적는 수첩이 있는데, 야간 근무자의 수첩에는 야간 근무자 누구도 쓰지 않은 연필 테스트가 적혀 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<CLIP> <CENTS>` 형식의 줄 `n`개입니다.

클립들을 모으는 `Notebook` 클래스를 만들고, 각 클립을 도착한 순서대로
`<CLIP> <CENTS>`로 다시 출력한 뒤 `TOTAL <sum>`을, 마지막으로 수첩 자체를
`` console.log(`${book}`) ``으로 출력하세요 — 그 `toString()`은
`Notebook(items=<n>, total=<sum>)`을 만들어야 합니다.

```
input:  2
        TRAILER 600
        PROMO 2800
output: TRAILER 600
        PROMO 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n`은 `0`일 수 있고, 그러면 줄은 `TOTAL 0`과
`Notebook(items=0, total=0)`입니다.

스타터는 `items`를 **`static`**으로 선언합니다: 클래스에 배열 하나, 앞으로
있을 모든 `Notebook`이 공유합니다. `static` 없이 선언한 필드 —
`items: Entry[] = []` — 는 `new`마다 한 번 초기화되고 인스턴스에 속합니다.
스타터의 `main`은 연습용 수첩을 만들어 연필 테스트를 적는데, 그 연필 테스트가
진짜 수첩에 나타납니다.

템플릿 리터럴은 객체의 `toString()`을 부릅니다. 그것이 없으면 기본값
`[object Object]`가 나오고, 스타터가 출력하는 것도 그것입니다.
`console.log(book)`은 다릅니다 — Node가 필드를 검사한 결과를 출력합니다 —
그래서 브리프가 템플릿을 쓰라고 하는 것입니다.
'''
hints = [
