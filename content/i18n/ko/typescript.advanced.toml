# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.advanced.13.unions"
title = "누가 타는가"
story = "리 가든 미니버스 정류장의 요금 화면은 모든 카드에 성인 요금을 매긴다. 성인이 아닌 카드에도, 카드가 아닌 하나에도."
brief = '''
표준 입력은 개수 `n`, 그다음 `<TYPE> <STOPS>` 형식의 줄 `n`개입니다.

기본 요금은 `500 + 100 * STOPS` 센트입니다. 각 줄마다 다음 중 하나를
출력하세요:

* `ADULT` — 기본 요금
* `STUDENT` — 기본 요금의 절반, 내림
* `SENIOR` — 언제나 `200`
* 그 밖의 것 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

줄을 **구별된 유니온**(discriminated union)으로 모델링하세요: 경우마다 객체
타입 하나, 모두 리터럴 `kind` 필드를 공유하고, 날것의 텍스트를 보관하는
`UNKNOWN` 경우가 있습니다. `parse`만이 선에서 온 문자열을 보는 유일한
곳입니다. 그 뒤로는 타입이 `Order`가 될 수 있는 네 가지를 말하고,
`order.kind`에 대한 `switch`가 각 `case` 안에서 `order`를 좁힙니다.

스타터의 `switch`에는 갈래가 하나이고, 나머지 전부에 `UNKNOWN`을 출력하는
`default`가 있습니다 — 알아야 할 두 종류까지 포함해서. 모든 종류에 갈래를
주고, `default`가 남은 것이 없음을 증명하게 하세요:

```ts
default: {
  const unreachable: never = order;
  return unreachable;
}
```

언젠가 다섯 번째 종류가 유니온에 추가되고 switch에는 추가되지 않으면, 그
줄은 컴파일을 멈춥니다. 유니온 자체는 실행 시점에 지워지므로 — `node`는
그것을 보지 못합니다 — 검사는 여기, `tsc`에서 일어나거나 아예 일어나지
않습니다.
'''
hints = [
  "종류마다 case 하나. `case \"STUDENT\":` 안에서 컴파일러는 order에 `stops`가 있음을 압니다. `case \"UNKNOWN\":` 안에서는 order에 `raw`가 있고 `stops`는 없음을 압니다.",
  "Math.floor(x / 2)가 내림한 절반입니다. `/`만 쓰면 홀수 기본 요금에서 450.5가 나오고, 전광판은 그것을 출력할 것입니다.",
  "default 안의 const unreachable: never = order가 망라성 검사입니다 — `_` 갈래 없는 Rust match와 같은 일입니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.advanced.14.generators"
title = "직접 만드는 for 루프"
story = "타임스 스퀘어 스크린의 카운트다운은 일정한 간격으로 숫자에서 숫자로 넘어가고, 그 뒤의 컨트롤러는 숫자 목록을 어디에도 두지 않는다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

`start`에서 시작해 `step`씩 나아가는 값 `count`개를 yield하는 **제너레이터
함수** `ticker(start, step, count)`를 작성하세요. 각 값을 한 줄에 하나씩
출력하고, 두 번째 ticker를 훑어서 계산한 `SUM <total>`을 출력하세요.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        [object Generator]
```

마지막 줄은 스타터의 `main`이 지금 그대로 출력하는
`Object.prototype.toString.call(ticker(...))`입니다. 지금은
`[object Array]`라고 말합니다.

`function*`는 호출해도 실행되지 않습니다. 제너레이터 객체를 돌려주고, 본문은
무언가가 다음 값을 요구할 때마다 — `for...of`, 펼치기, `Array.from` — 한
걸음씩 실행됩니다. 그래서 값 백만 개의 배열이 한 번도 존재하지 않고도 값 백만
개를 기술할 수 있습니다.

스타터는 배열을 만들어 돌려주고, 타입 검사를 통과합니다. 반환 타입은
`Iterable<number>`이고 배열은 그것이기 때문입니다. 계약은 충족되었지만,
질문은 충족되지 않았습니다. 배열은 모든 값을 한꺼번에, 제너레이터는 요청될
때 값 하나를. `push`를 `yield`로 바꾸고 배열을 지우세요.
'''
hints = [
  "출력의 마지막 줄은 객체의 태그이고, 테스트는 [object Generator]를 원합니다. function*가 돌려주는 것이 그것입니다.",
  "값을 yield하고, 그다음 나아가세요. 함수는 yield에서 멈췄다가 다음 요청 때 그 뒤에서 재개합니다.",
  "제너레이터는 한 번만 훑을 수 있습니다. 그래서 main은 첫 루프가 비워 버린 것을 재사용하지 않고 합계용으로 새 ticker를 만듭니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.advanced.15.higher-order"
title = "감싸기"
story = "청구 화면은 요금 함수가 오늘 밤 몇 번 돌았는지 알고 싶어 하고, 요금 함수는 자기가 감시당하고 있다는 것을 알고 싶어 하지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 시간 단위 기간 `n`개입니다.

`price(hours)`는 `500 + 100 * hours`입니다. `price`가 모르게 모든 호출이
세어지도록 `counted`로 감싸세요. 기간마다 가격 하나를 출력하고, 그다음
`CALLS <n>`, 그다음 `NAME <price.name>`을 출력하세요 — 이것은 여전히
`price`라고 말해야 합니다.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

타입스크립트의 `@decorators`는 존재하지만 클래스와 그 멤버에만 붙습니다.
자유 함수는 달 수 없습니다. 데코레이터가 *무엇인지*에는 문법이 필요 없습니다:
함수를 받아 함수를 돌려주는 함수. 그러니
`const price = counted(function price(hours: number) { ... })`가 메커니즘
전부이고, `counted`의 제네릭 — `<A extends unknown[], R>` — 이 어떤
시그니처든 감싸서 같은 것을 돌려줄 수 있게 합니다.

`counted`가 돌려주는 함수는 `wrapper`라는 클로저이고, 따로 말하지 않으면 그
`name`은 `"wrapper"`입니다: 스타터 출력의 마지막 줄. 파이썬에는
`functools.wraps`가 있고, 여기서는 이름을 직접 복사합니다.
`Object.defineProperty(wrapper, "name", { value: fn.name })` — `name`은 읽기
전용이라서 그냥 대입하면 strict 모드에서 예외가 납니다.

횟수는 wrapper에 삽니다: 함수 선언 바로 뒤의 `wrapper.calls = 0`. `tsc`는 그
대입을 보고 함수의 타입에 `calls: number`를 더하므로, `main`에서
`price.calls`가 타입 검사를 통과합니다.
'''
hints = [
  "return 앞에 Object.defineProperty(wrapper, \"name\", { value: fn.name }). 한 줄입니다.",
  "wrapper.name = fn.name은 컴파일되고 나서 TypeError: Cannot assign to read only property 'name'을 던집니다. defineProperty가 그것을 비켜 가는 길입니다.",
  "A extends unknown[]인 (...args: A) => R이 wrapper가 어떤 시그니처든 모르는 채로 전달하는 방법이고, 감싼 뒤에도 price가 (hours: number) => number 타입을 유지하는 방법입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.advanced.16.structural"
title = "모양만 맞으면"
story = "리 가든에서 온 종이 가방. 계산대 화면의 누구도 그게 무엇인지 묻지 않았다. 안에 몇 개가 있는지, 운동화가 있는지, 하나씩 꺼내 보라고 했을 뿐이다."
brief = '''
표준 입력은 공백으로 구분된 물건들 한 줄, 그다음 찾을 단어 하나가 있는 한
줄입니다.

물건들을 `Bag`에 넣어 스타터의 `report`에 넘기세요. `report`는 다음을
출력합니다:

1. `LEN <k>` — `bag.size`에서
2. 물건들, 한 줄에 하나씩 — `for (const item of bag)`에서
3. `HAS <WORD> YES` 또는 `HAS <WORD> NO` — `bag.has(word)`에서
4. `LONGEST <item>` — 가장 긴 것, 같으면 첫 번째

```
input:  cap sneakers tee
        sneakers
output: LEN 3
        cap
        sneakers
        tee
        HAS sneakers YES
        LONGEST sneakers
```

`report`는 `Container<string>`을 받는데, `Bag`은 어디에도
`implements Container`라고 말하지 않습니다. 그럴 필요가 없습니다.
타입스크립트의 타입은 **구조적**입니다: 값은 인터페이스의 이름을 대서가
아니라 멤버를 가져서 그것에 맞습니다. 그것이 덕 타이핑이고, 인터프리터가
거기 도달했을 때가 아니라 프로그램이 돌기 전에 `tsc`가 검사합니다.
`Set<string>`도 `Container<string>`에 맞고, 그것 역시 아무도 적어 두지
않았습니다.

스타터의 `Bag`에는 멤버가 하나도 없어서 컴파일되지 않습니다:

```
error TS2345: Argument of type 'Bag' is not assignable to parameter of type 'Container<string>'.
```

`size` getter, `has` 메서드, 그리고 `[Symbol.iterator]()`를 주세요 —
`for...of`가 그 심볼로 찾는 메서드이고, 파이썬의 `for`가 `__iter__`를 찾는
것과 같은 방식입니다.
'''
hints = [
  "get size(): number { return this.goods.length; } — getter입니다. 인터페이스가 `size`를 메서드가 아니라 속성이라고 말하기 때문입니다.",
  "[Symbol.iterator]()는 배열 자신의 이터레이터를 돌려줘도 됩니다: this.goods[Symbol.iterator](). `*[Symbol.iterator]() { yield* this.goods; }` 제너레이터도 됩니다.",
  "report는 길이가 같은 물건 중 첫 번째를 유지합니다. 엄격히 더 긴 것일 때만 바꾸기 때문입니다 — >=가 아니라 >.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.advanced.17.undefined"
title = "23:59의 요금판"
story = "관제실, 23:59. 요금판이 오늘 밤 켜져 있지 않은 스크린을 피드에 묻고, 피드는 아무것도 아닌 것으로 답하고, 요금판은 그 아무것도 아닌 것의 가격을 읽는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<SCREEN> <CENTS>` 형식의 줄 `n`개 — 오늘 밤
켜져 있는 스크린들 — 그다음 개수 `q`와 조회할 스크린 이름 `q`개입니다.

조회마다 `<SCREEN> <cents>`를 출력하거나, 그 스크린이 켜져 있지 않으면
`<SCREEN> NONE`을 출력하세요. 그다음 `MISSING <k>`와 `CHEAPEST <SCREEN>`을
출력하세요 — 요금이 가장 낮은 스크린, 같으면 이름 순 — 아무것도 켜져 있지
않으면 `CHEAPEST NONE`.

```
input:  2
        TSQ 1200
        HYSAN 900
        3
        HYSAN
        YEEWO
        TSQ
output: HYSAN 900
        YEEWO NONE
        TSQ 1200
        MISSING 1
        CHEAPEST HYSAN
```

스타터는 경고 하나 없이 컴파일되고 `YEEWO`에서 죽습니다:

```
TypeError: Cannot read properties of undefined (reading 'cents')
```

그 줄이 이 맵의 보스입니다. 그것은 결코 버그를 가리키지 않습니다. `undefined`가
마침내 *사용된* 자리를 가리키고, 스타터에서 그 `undefined`는 컴파일러에게
걱정하지 말라고 일러 둔 두 곳에서 만들어졌습니다.

`lookup`은 `Record<string, Screen>`에서 `board[name]`을 돌려주고, 인덱스
타입은 `Screen | undefined`가 아니라 `Screen`이라고 말합니다. 타입스크립트는
읽는 인덱스가 존재하는 인덱스라고 가정하기 때문입니다. 애너테이션은
`Screen`이라 말하고, `tsc`는 그것을 믿고, 실행 시점에 키는 거기 없습니다.
그리고 `cheapest`는 주 경로에 `return`이 없습니다 — 최선의 스크린을 계산하고는
끝으로 떨어져 버립니다 — 그래서 암묵적으로 `undefined`를 돌려주고, 그 타입은
그것을 허용합니다. 그러면 호출하는 쪽은 `!`로 그것을 뚫고 들어갑니다. non-null
단언 — 아무도 확인하지 않는, 컴파일러에게 하는 약속입니다.

두 함수 모두 **일부러** `Screen | undefined`라고 말하게 하세요 —
`Map<string, Screen>`에는 `get`이 있고, 그 타입은 이미 없음을 인정합니다 —
그리고 `undefined`가 떨어지는 곳에서 `=== undefined`로 처리하세요.
`!screen`은 안 됩니다: 객체에는 동작하지만, 이 판이 `Map<string, number>`가
되는 날 `0`센트짜리 무료 스크린이 존재하지 않게 됩니다.
'''
hints = [
  "스택 트레이스를 위에서부터 읽으세요: TypeError는 console.log에 있지만, undefined는 한 줄 앞의 lookup에서, 그 전에는 Record 인덱스에서 나왔습니다.",
  "lookup이 Screen | undefined를 돌려주면 `screen.cents`는 확인하기 전까지 컴파일되지 않습니다. 그 에러는 Record 인덱스가 건너뛴 일을 컴파일러가 하는 것입니다.",
  "cheapest에는 경로가 둘이고 그중 하나만 return합니다. 다른 하나는 끝으로 떨어지고, `Screen | undefined` 반환 타입은 그것을 조용히 허용하며, 호출하는 쪽의 `!`는 그런 일이 없었다고 맹세합니다. `best`를 돌려주고, 호출 지점의 `!`를 지우세요.",
  "`!`와 `as`는 둘 다 컴파일러가 확인할 수 없는 약속입니다. 다른 모든 타입과 함께 실행 시점에 지워지고, 남는 것은 실제로 도착한 값입니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.advanced.18.promise-all"
title = "스크린 열둘, 스레드 하나"
story = "22:00, 사이니지 관제실. 스크린 열두 개에 동시에 프레임 수를 묻는데, 보고서는 그중 어느 하나가 답하기도 전에 출력된다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 async 태스크 하나를 시작하세요. 태스크는 이벤트 루프를 한 바퀴
기다리고, 값의 제곱을 계산해서 `results[i]`에 저장합니다 — 자기 칸이므로
두 태스크가 같은 곳에 쓰는 일은 없습니다. **전부**를 기다린 다음, 결과를
**인덱스 순서대로** 한 줄에 하나씩 출력하고, 그다음 `TASKS <n>`을
출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        TASKS 3
```

`async` 함수를 호출하면 즉시 시작됩니다. 첫 `await`까지는 동기적으로 실행되고,
그 지점에서 `Promise`를 돌려주며 호출한 쪽은 계속 진행합니다. 스레드는
하나입니다: 태스크들은 그사이 다른 어딘가에서 돌고 있는 것이 아니라
**주차되어** 이벤트 루프가 돌아오기를 기다립니다 — 그리고 루프는 지금 돌고
있는 코드가 스레드를 내놓아야만 돌아올 수 있습니다.

스타터는 모든 태스크를 시작하고 곧바로 출력하므로, 어느 태스크도 칸을
채우러 돌아오기 전에 칸들을 출력합니다: `undefined`가 `n`번.
`await Promise.all(tasks)`가 join입니다. 모든 태스크가 확정될 때까지 스레드를
내놓고, 그중 하나라도 예외를 던지면 즉시 거부됩니다 — 그것이 프로미스를
바닥에 버리지 않고 쥐고 있어야 하는 또 다른 이유입니다.
'''
hints = [
  "출력 루프 앞에 await Promise.all(tasks). 스타터는 이미 tasks 배열을 만들어 두었는데, 아무것도 그것을 기다리지 않습니다.",
  "모든 태스크를 시작하고, 그다음 전부를 기다리세요. `for (const t of tasks) await t;`도 여기서는 맞습니다. 첫 await 전에 태스크가 모두 시작되었기 때문입니다.",
  "results는 square의 클로저에 캡처됩니다. main이 출력하는 것과 같은 배열이고, 그래서 join 뒤에 쓴 값이 보입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.advanced.19.mutex"
title = "카운터 하나, 스크린 여덟"
story = "섬의 모든 스크린이 30층의 청구 카운터 하나에 재생 횟수를 보고하는데, 자정에 카운터는 재생 한 번이라고 말하고 모든 스크린은 보고했다고 맹세한다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 async 태스크 하나를, 한꺼번에 시작하세요. 각 태스크는 공유 카운터를
읽고, 청구 서버로 **왕복**을 한 번 하고 (스타터의 `roundTrip()`, 이벤트 루프
한 바퀴), 합계에 자기 값을 더하고 hits에 하나를 더해 카운터를 다시 씁니다.
전부 기다린 다음 `TOTAL <sum>`과 `HITS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

자바스크립트는 스레드가 하나이고, 사람들은 그래서 레이스가 없다고 말할
것입니다. **데이터** 레이스는 없습니다: 두 줄이 같은 순간에 실행되는 일은
결코 없습니다. 다른 종류는 전부 있습니다. 스타터의 태스크들은 모두 카운터를
읽고, 모두 왕복에서 주차하고, 모두 돌아와서 `읽은 것 + 내 것`을 씁니다 —
그리고 각자 읽은 것은 `0`이었습니다. 마지막에 쓴 쪽이 이깁니다: `TOTAL 4`,
`HITS 1`, 결정적으로, 매번. 읽기와 쓰기 사이의 `await`는 문이고, 무엇이든 그
문으로 걸어 들어올 수 있습니다.

왕복은 그대로 두세요. 그게 일입니다. 읽기, 왕복, 쓰기를 잠금으로 감싸세요.
스타터에는 시그니처는 맞고 안에 잠금이 없는 `Mutex` 클래스가 있습니다 —
`run`은 임계 구역을 그냥 호출합니다. 프로미스만으로 진짜로 만드세요: `tail`
프로미스를 하나 두고, 호출하는 쪽마다 tail 뒤에 이어 붙어 그것을 자기 프로미스로
바꾸고, 옛 것을 기다리고, 실행하고, `finally`에서 자기 것을 resolve합니다.
그래야 예외가 잠금을 쥔 채로 남기지 못합니다.
'''
hints = [
  "스타터를 실행하세요: TOTAL은 마지막 값이고 HITS는 1입니다. 어느 태스크가 카운터를 쓰기도 전에 모든 태스크가 그것을 읽었고, 왕복이 그들이 서로 엇갈린 지점입니다.",
  "잠금은 프로미스의 큐입니다. `const ahead = this.tail; this.tail = <a new promise you can resolve>; await ahead;` — 그다음 실행하고, 그다음 자기 것을 resolve하세요.",
  "`finally`에서 resolve하고, try 안에서는 `return await critical()`. 그래야 해제가 임계 구역의 프로미스가 그저 만들어졌을 때가 아니라 임계 구역이 끝난 뒤에 일어납니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.advanced.20.channel"
title = "누가 피드를 닫나"
story = "관제실은 도착 시각을 하나하나 피드로 이워 스트리트 전광판에 밀어 보내는데, 마지막 것 뒤에 전광판은 오지 않을 다음을 기다리며 앉아 있다가 꺼져 버린다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

생산자 태스크 하나가 각 값에 10을 곱해 `Channel`로 보내고, 이벤트 루프 한
바퀴에 하나씩 보낸 뒤 채널을 **닫습니다**. 메인 태스크는 채널이 닫혔다고 말할
때까지 받으면서 각 값을 출력하고 합계를 유지하고, 그다음 `SUM <total>`과
`CLOSED`를 출력합니다.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

스타터의 `Channel`은 완성되어 있습니다: `send`, `receive`, 그리고 기다리는
모든 수신자를 `undefined`로 깨우는 `close`. 생산자는 `close`를 부르지 않으므로,
마지막 값 뒤에 수신자는 아무도 resolve하지 않을 프로미스를 await합니다.

Go에서라면 `fatal error: all goroutines are asleep - deadlock!`입니다.
파이썬에서라면 러너가 죽일 때까지 멈춰 있습니다. Node는 어느 쪽도 하지
않습니다. 이벤트 루프에 무언가를 깨울 수 있는 것이 더는 남지 않으면 — 타이머도,
I/O도, 이미디어트도 없으면 — 프로세스는 그냥 **종료**합니다. 상태 `0`, 당신의
`for (;;)` 한가운데서. `SUM` 줄과 `CLOSED` 줄은 실행되지 않고, 밖에서 보면
성공처럼 보입니다. 그것은 크래시보다 나쁘고, 스타터가 하는 일이 그것입니다.

생산자가 채널을 닫습니다. 소비자는 절대 아닙니다 — 스트림이 끝났다는 것을
아는 쪽이 끝내는 쪽입니다.
'''
hints = [
  "control 끝에 한 줄: feed.close().",
  "수신자는 이미 `=== undefined`를 검사합니다. 생산자가 한 번도 보내지 않은 것을 기다리고 있었던 것입니다. `if (!value) break`도 멈추긴 합니다 — 첫 0에서. 숨은 케이스 하나가 그것을 보냅니다.",
  "undefined가 채널의 진짜 값일 수 있다면, receive는 대신 { done: true } | { done: false, value: T }를 돌려줄 것입니다 — 이터레이터의 next()가 돌려주는 것과 같은 모양이고, 이유도 같습니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.advanced.21.worker-pool"
title = "인코더 여덟"
story = "하이산 플레이스 벽용으로 렌더할 클립이 마흔 개, 랙에 인코더가 여덟 대. 아무도 인코더 마흔 대를 원하지 않는다. 여덟 대가 한시도 쉬지 않기를 원할 뿐이다."
brief = '''
표준 입력은 정수 `w`와 `n`, 그다음 값 `n`개입니다.

워커 `w`개의 풀을 돌리세요. 각 워커는 반복합니다: 아직 아무도 가져가지 않은
다음 인덱스를 가져가고, `await render(index, value)` — 인덱스에 따라 달라지는
이벤트 루프 몇 바퀴 뒤에 `[index, value * value]`를 돌려줍니다 — 그 쌍을
`results`에 push하고, 남은 인덱스가 없을 때까지. 모든 워커를 기다리고,
결과를 인덱스로 정렬하고, `<index> <value>`를 한 줄에 하나씩 출력한 뒤
`WORKERS <w>`를 출력하세요.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

쌍들은 작업이 **끝나는** 순서로 도착하고, 그것은 시작한 순서가 아닙니다.
결과에 인덱스를 실어 나르는 것이 출력을 매번 같게 만드는 것이고, 그것으로
정렬하는 것이 답의 마지막 줄입니다.

`const i = next++`에는 잠금이 필요 없고, 지난 퀘스트 다음이라면 그 이유를 알아
둘 만합니다: `next`를 읽는 것과 올리는 것 사이에 `await`가 없으므로 다른
워커가 끼어들 수 없습니다. 잠금은 `await`를 가로지를 때만 필요했습니다.

스타터는 `workers.forEach(async (w) => {
await w; })`로 워커들을 기다립니다. 컴파일되고, 아무것도 기다리지 않습니다:
`forEach`는 async 콜백을 부르고, 프로미스를 돌려받고, 그것을 버립니다. 콜백들은
하나하나 await합니다. `main`은 그중 아무것도 await하지 않고, 빈 결과를
출력합니다.
'''
hints = [
  "forEach 대신 await Promise.all(pool). forEach는 콜백이 돌려주는 것을, async든 아니든, 결코 기다리지 않습니다.",
  "결과는 끝나는 순서로 도착합니다. 각 쌍의 인덱스가 그것이 어디서 왔는지에 대한 유일한 기록이고, 정렬이 그것을 제자리에 돌려놓습니다.",
  "`for (const running of pool) await running;`도 됩니다. 안 되는 것은 콜백을 받는 배열 메서드 — map, forEach, filter — 를 그것이 콜백을 대신 await해 줄 것처럼 쓰는 것입니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.advanced.22.async-await"
title = "async는 실제로 어디서 도는가"
story = "메이는 4년 동안 `await`를 써 왔지만 그것을 굴리는 물건을 한 번도 본 적이 없다. 관제실에는 루프 하나가 있고, 섬의 모든 스크린이 그 위에서 차례를 기다린다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

`async function double(value)`는 한 번 양보하고 — `await null` — 값의 두 배를
돌려줍니다. `n`개 전부를 `Promise.all`로 실행하고, 각 결과를 입력 순서로
출력한 뒤 `SUM <total>`과 `TASKS <n>`을 출력하세요.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

스타터의 `run`은 값들을 `double`에 map해서 **프로미스**의 배열을 얻고 —
그다음 컴파일러에게 그것이 숫자의 배열이라고 말합니다:

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc`는 그것을 받아들입니다. `as unknown as`가 검사를 멈추라고 말하는
방법이기 때문입니다. 캐스트는 다른 모든 타입과 함께 지워지고, 실행 시점에
배열은 여전히 프로미스입니다: 출력은 `[object Promise]` 세 번, 그리고 그것들을
0에 이어 붙인 문자열인 `SUM`입니다. 캐스트는 변환이 아닙니다. 컴파일러가 믿는
것을 바꿀 뿐 값에 대해서는 아무것도 바꾸지 않습니다.

`Promise.all`은 프로미스들을 받아, 어떤 순서로 끝났든 **넘긴 순서대로** 그
결과들로 resolve됩니다.

그럼 전부 어디서 도는가? 스레드 하나 위에서, 차례로. `await null`은 함수의
나머지를 **마이크로태스크** 큐에 넣고, Node는 타이머, 이미디어트, 어떤 I/O —
매크로태스크 — 도 건드리기 전에 그 큐를 완전히 비웁니다. await 천 개보다 먼저
예약된 `setTimeout(..., 0)`도 그것들 전부 뒤에 실행됩니다. 여기서 병렬인 것은
없습니다. 멈출 수 있다고 말한 자리에서, 차례로 돕니다.
'''
hints = [
  "캐스트를 지우고 tsc가 무엇을 말하는지 보세요: Type 'Promise<number>[]' is not assignable to type 'number[]'. 그 에러가 캐스트가 숨기던 진실이었습니다.",
  "return Promise.all(nums.map((v) => double(v))) — await는 호출하는 쪽, run(nums)을 await하는 곳에 있습니다.",
  "Promise.all은 인자 순서를 지킵니다. 끝나는 순서대로 결과를 원한다면 워커 풀과 똑같이 인덱스를 직접 실어 날라야 합니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.advanced.23.work-queue"
title = "누가 끝났다고 말하나"
story = "오퍼레이터 셋이 스크린 업데이트 큐를 처리하고, 교대 책임자는 큐가 비었다고 말하기를 기다린다. 큐는 절대 그렇게 말하지 않는다. 업데이트 하나가 끝났다고 아무도 알려 주지 않았으니까. 그리고 23:10에 콘솔 전체가 꺼진다."
brief = '''
표준 입력은 정수 `w`와 `n`, 그다음 값 `n`개입니다.

`[index, value]` 쌍을 스타터의 `WorkQueue`에 넣으세요. 쌍을 꺼내고, 한 바퀴
기다리고, `value * 10`을 `results[index]`에 쓰고, `taskDone()`을 호출하는 것을
반복하는 소비자 태스크 `w`개를 시작하세요. 메인 태스크는 `queue.join()`을
await하고, 그다음 큐를 닫아 소비자들의 `get()`이 `undefined`를 돌려주어
멈추게 하고, 그들을 await한 뒤, 결과를 인덱스 순서로 출력하고
`CONSUMERS <w>`를 출력합니다.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join()`은 지금까지 `put`된 모든 항목에 짝이 되는 `taskDone()`이 있을 때
resolve됩니다. 스타터의 소비자들은 그것을 부르지 않습니다. 그래서 `main`은
`join`을 기다리고, 소비자들은 결코 오지 않을 항목을 `get`에서 기다리고,
이벤트 루프에는 누군가를 깨울 수 있는 것이 하나도 남지 않습니다.

그것이 **교착**(deadlock)입니다 — 모두 기다리고, 아무도 움직이지 않는 — 그리고
스레드도 잠금도 필요 없습니다: 서로가 움직이기를 기다리는 프로미스 둘이면
충분합니다. 두 태스크가 async 뮤텍스 둘을 반대 순서로 잡는 것은 격식만 더
갖춘 같은 것입니다. Node의 답은 지난 맵의 그것입니다: 루프가 말라 버리고
프로세스는 상태 `0`으로, 아무것도 출력하지 않은 채 종료합니다.

해결책은 이번에도 한 줄이고, 소비자 쪽에 있습니다.
'''
hints = [
  "각 항목을 처리한 뒤 queue.taskDone(). join은 put과 taskDone의 수를 맞춰 볼 뿐 다른 것은 세지 않습니다.",
  "스타터를 실행하면 아무것도 출력하지 않고 0으로 종료합니다. 크래시도 아니고 멈춤도 아닙니다: 이벤트 루프에서 일어날 수 있는 일이 바닥났습니다.",
  "close()는 get()에 주차된 모든 소비자를 undefined로 깨우고, 그것이 그들의 루프를 끝냅니다. 그래서 main이 join 뒤에 그들을 await할 수 있습니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.advanced.24.finally"
title = "잠금은 어쨌든 다시 걸린다"
story = "관제실은 업데이트마다 광고주의 슬롯 잠금을 풀었다가 끝나면 다시 건다. 22:40에 잘못된 업데이트를 받은 슬롯은 그 뒤로 계속 풀려 있다. 잠그는 코드가 실패한 줄 뒤에 있었기 때문이다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 형식의 줄 `n`개이고, `CENTS`는
정수여야 합니다.

`OPEN <NAME>`을 출력하고, 한 번 yield하고, `SHUT <NAME>`을 출력하는 제너레이터
`opened(name)`을 작성하세요 — **본문이 예외를 던졌든 아니든**. 본문은
센트를 파싱해서 합계에 더하는 `for (const _ of opened(name))` 루프입니다.
센트가 파싱되지 않는 줄은 슬롯이 닫힌 뒤에 `BAD <NAME>`으로 보고됩니다.
마지막으로 `TOTAL <sum>`과 `REJECTED <k>`를 출력하세요.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

제너레이터 위의 `for...of`는 자원 가드이고, 이유는 이렇습니다: 루프 본문이
일찍 빠져나가면 — `break`, `return`, 또는 예외 — `for...of`는 제너레이터의
`return()`을 부르고, 그것은 `yield`가 `return` 문이었던 것처럼 제너레이터를
**`yield`에서** 재개합니다. `yield` 뒤의 코드는 실행되지 않습니다. `yield`를
감싼 `finally` 안의 코드는 실행됩니다. 스타터에는 `finally`가 없고, `WONG`의
슬롯은 결코 닫히지 않습니다.

타입스크립트 5.2에는 바로 이것을 위한 `using`과 `Symbol.dispose`가 있고,
여기에는 없습니다: `es2023` 라이브러리에는 `Symbol.dispose`가 없으므로 `using`은
컴파일되지 않습니다. `try`/`finally`가 `using`을 만드는 재료입니다.

제너레이터 안에서 에러를 잡지 마세요. 호출하는 쪽이 `BAD`를 출력하고 싶어
하고, 그것을 삼킨 제너레이터는 아무 일도 없었던 것처럼 `TOTAL`을 출력할
것입니다.
'''
hints = [
  "try { yield; } finally { console.log(`SHUT ${name}`); } — finally가 모든 경로에서 실행되는 부분입니다.",
  "예외는 return()이 finally를 실행한 뒤 for...of를 빠져나가므로, main의 catch가 여전히 그것을 봅니다 — 그래서 BAD가 SHUT 뒤에 출력됩니다.",
  "제너레이터만이 방법은 아닙니다: `body()`를 try/finally로 감싸는 `withSlot(name, body)` 함수도 같은 일을 합니다. 제너레이터 형태는 for...of가 나가는 길에 무엇을 하는지 보여 주는 형태입니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.advanced.25.pipeline"
title = "피드의 단계들"
story = "이워 스트리트 전광판으로 가는 피드는 30층에서 두 단계를 거친다: 하나는 측정값을 제곱하고, 다음 것은 누적 합계를 유지한다. 그리고 전광판은 23:59에 밤 전체를 한꺼번에가 아니라, 오는 대로 하나씩 보아야 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

**제너레이터**로 두 단계 파이프라인을 만드세요:

1. `squares(values)`는 각 값을 제곱해서 yield합니다
2. `running(stream)`은 아무 `Iterable<number>`나 받아 누적 합계를 유지하고,
   `[value, total]` 쌍을 yield합니다

`main`은 각 쌍을 `<square> <total>`로 출력하고, 그다음 `PIPE <n>`을
출력합니다.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

어느 단계도 배열을 만들지 않습니다. 각 `yield`는 항목 하나를 다음 단계에 건네고
멈춥니다. `main`이 당기고, `running`이 `squares`에서 당기고, `squares`가
입력에서 당깁니다. 원하기 전에는 아무것도 계산되지 않고, 파이프라인 전체에
떠 있는 항목은 하나입니다.

스타터의 두 번째 단계는 이름만 제너레이터입니다. 스트림 전체를 훑고 나서,
끝에서 **한 번**, 마지막 값과 최종 합계로 yield합니다 — 그리고 완벽하게 타입
검사를 통과합니다. `Generator<[number, number]>`는 각 항목이 어떻게 생겼는지를
말할 뿐 몇 개인지는 말하지 않기 때문입니다. 전광판은 자정에 한 줄을 받습니다.
'''
hints = [
  "yield를 루프 안으로 옮기세요: 값마다 한 번씩 yield [value, total].",
  "스타터의 출력은 한 줄과 PIPE 1입니다. 루프 뒤에서 yield하는 단계는 단계만 더 많은 배열입니다.",
  "running(squares(nums))가 합성되는 것은 제너레이터가 Iterable이기 때문입니다. running은 자기 입력이 또 다른 제너레이터라는 것을 알지도, 신경 쓰지도 않습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.advanced.26.toolbox"
title = "선반에 없는 공구함"
story = "관제실 매뉴얼은 똑같은 프레임이 이어지는 구간을 이터레이터 헬퍼로 세라고 한다. 30층의 컴파일러는 그런 것을 들어 본 적이 없고, 야간 오퍼레이터는 손으로 센다."
brief = '''
표준 입력은 정수 한 줄입니다.

세 줄을 출력하되, 각 줄은 직접 만든 제너레이터로 만드세요:

1. `SUMS` 뒤에 누적 합들 — `accumulate(values)`
2. `RUNS` 뒤에 **인접한** 같은 값들의 구간 각각을 `<v>x<k>`로 —
   `runs(values)`
3. `PAIRS <k>`: **서로 다른** 값들의 순서 없는 쌍이 몇 개인지 —
   정렬된 서로 다른 값들에 대한 `pairs(items)`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

파이썬에는 선반에 `itertools`가 있습니다. 자바스크립트에는 이터레이터 헬퍼 —
`Iterator.prototype.map`, `.filter`, `.take` — 가 Node 22부터 있고, 그것들은
이 선반에 **없습니다**: `es2023` 라이브러리가 선언하지 않으므로, 아래의
`node`가 아무리 새것이어도 `tsc`는 `TS2339: Property 'map' does not exist`라고
말합니다. 쓸 수 있는 것은 라이브러리가 선언한 것과 import한 것입니다. 이
파일은 ES `import`로 `"fs"`에서 `readFileSync`를 가져옵니다 — 그것이 파일을
**모듈**로 만들고, 타깃이 CommonJS이므로 `tsc`는 그것을 `require`로
컴파일합니다. 나머지는 전부 직접 씁니다.

`runs`는 **인접한** 같은 항목만 묶습니다. 개수 세기가 아니고, 예시는 둘이
어긋나도록 골랐습니다: `1`은 네 번 나오지만 구간 둘에 나뉘어 있습니다.
스타터는 둘째 줄을 위해 `Map`에 세고, 정확히 그 입력에서 틀립니다.
'''
hints = [
  "accumulate는 합계를 유지하고 값마다 그것을 yield합니다. 마지막으로 yield하는 것이 합입니다.",
  "runs는 진행 중인 구간을 유지합니다. 다음 값이 다르면 끝난 구간을 yield하고 새 구간을 시작하세요 — 그리고 루프가 끝나면 마지막 구간을 yield하세요. 다른 누구도 해 주지 않습니다.",
  "pairs는 j가 i + 1에서 시작하는 중첩 루프 둘입니다. 개수는 n*(n-1)/2이고, 그것을 손으로 확인해 보면 n이 맞는지 알 수 있습니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.advanced.27.memo"
title = "계산한 것을 기억하기"
story = "타임스 스퀘어 스크린의 스케줄러는 자정 전까지 같은 두 숫자로 같은 순환 편성을 만 천 번, 매번 처음부터 계산한다."
brief = '''
표준 입력은 `n k bits`입니다: 정수 둘과 이진 숫자 문자열 하나.

네 줄을 출력하세요:

1. `FIB <fib(n)>` — 직접 만든 메모이제이션 `memo(...)`로 감싼 **재귀**
   `fib`에서
2. `PRODUCT <k!>` — `1..k`에 곱하기로 `reduce`, `k = 0`이 `1`이 되도록 초깃값을
   주고
3. `BIN <value>` — `bits`를 2진수로 읽은 값, 기수를 안에 고정한 인자 하나짜리
   함수 `fromBinary`로
4. `MISSES <m>` — memo가 실제로 본문을 실행한 횟수

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n`은 최대 `400`입니다. 스타터의 wrapper는 호출을 세기만 하고 아무것도 기억하지
않아서, `fib(10)`은 호출 177번, `fib(35)`는 3천만 번이고 `fib(90)`은 끝나지
않습니다. 캐시가 있으면 모든 `fib(i)`가 한 번씩 실행되고 `MISSES`는
`n + 1`입니다.

숫자는 `number`에 들어가지 않습니다. `fib(90)`은 `2880067194370816120`으로
`Number.MAX_SAFE_INTEGER`를 넘고, `number`는 그것을 아무 말 없이 틀리게
출력할 것입니다. **`bigint`**를 쓰세요: `0n`, `1n`, `BigInt(i)`. 템플릿
리터럴은 bigint를 숫자로만 출력하고, `console.log(5n)`만 쓰면 `5n`을
출력합니다.

기수 없는 `parseInt(bits)`는 `1010`을 천십으로 읽습니다. 스타터가 그렇게
합니다. 기수를 클로저 안에 고정하세요 —
`(text: string) => parseInt(text, 2)` — 파이썬의 `functools.partial`이 바로
이것입니다: 인자 일부가 이미 정해진 함수. `bind`는 **앞쪽** 인자에 대해서만
같은 일을 하고, 기수는 두 번째 인자입니다.
'''
hints = [
  "memo는 클로저 안에 인자에서 결과로 가는 Map을 둡니다. 적중하면 Map에서 돌려주고, 빗나가면 본문을 실행하고, 결과를 저장하고, 셉니다.",
  "fib는 재귀에서 메모이제이션된 fib를 불러야 합니다. 아니면 가장 바깥 호출만 캐시됩니다. fib를 타입과 함께 미리 선언하는 것이 화살표 함수가 자기를 참조할 수 있게 해 줍니다.",
  "reduce((a, b) => a * b, 1n) — 두 번째 인자가 시작값이고, 빈 범위가 1n이 되게 하는 것이 그것입니다. 그것도 bigint여야 합니다: 1 * 1n은 조용한 변환이 아니라 TS2365입니다.",
]

