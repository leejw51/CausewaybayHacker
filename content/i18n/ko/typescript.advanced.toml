  "`static` 없는 items: Entry[] = [], 그리고 스타터가 Notebook.items라고 한 곳마다 `this.items`.",
  "toString(): string { return `Notebook(items=..., total=...)` } — main의 템플릿 리터럴이 대신 불러 줍니다.",
