[[quest]]
id    = "cpp.hacker.12.heap"
title = "정렬된 줄 k개"
story = "지점마다 전표를 이미 순서대로 보낸다. 전부를 다시 정렬하지 말고 한 줄로 합쳐라."
brief = '''
첫 줄은 `k`입니다. 그다음 `k`줄이 오는데, 각각은 개수와 그 뒤를 잇는 그만큼의
정수이며, 이미 오름차순으로 정렬되어 있습니다.

전부를 오름차순 한 줄로 합쳐 공백으로 나눠 출력하고, 그다음
`POPS <total count>`를 출력하세요.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`std::priority_queue`는 **최대** 힙입니다. 최소 힙으로 쓰려면 세 번째 템플릿
인자로 `std::greater<>`를 주세요 — 그리고 거기에 가려면 두 번째 인자인
컨테이너를 적어 주어야 합니다:
`std::priority_queue<T, std::vector<T>, std::greater<T>>`. 그것이 C++ 특유의
요령의 전부이고, 이 문제가 검사하는 것입니다.

힙은 원소마다가 아니라 리스트마다 항목 하나를 담으므로, 리스트가 얼마나 길든
크기 `k`를 유지합니다.

여기 케이스는 작고 시계는 속도를 재지 않으며, 이 문제에서는 어떤 케이스도 그럴
수 없습니다. 모든 리스트를 `std::vector` 하나에 붓고 `std::sort`를 부르면 이것들을
통과하고, 큰 것도 통과할 것입니다: 힙의 `O(N log k)`에 대한 `O(N log N)`은 실행
제한이 볼 수 있는 차이가 아닙니다. 검사하는 것은 당신이 최소 힙을 적을 수
있는가입니다. 면접관이 귀 기울이는 것은 리스트마다 항목 하나라는 불변식이고,
그것은 리스트가 한꺼번에 메모리에 들어가지 않을 때 중요한 부분입니다.
'''
hints = [
  "힙 항목은 값이 어디서 왔는지 지니고 있어야 합니다. 아니면 꺼낸 뒤 다시 채울 수 없습니다. std::tuple은 첫 원소부터 정렬하고, 그것이 원하는 것입니다.",
  "std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>> — 세 인자 모두. 아니면 최대 힙이 됩니다.",
  "리스트의 다음 원소는 그 리스트의 원소 하나를 꺼냈을 때만 넣으세요 — 그것이 힙을 k로 유지합니다.",
]

