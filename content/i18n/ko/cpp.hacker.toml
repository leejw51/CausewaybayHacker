id    = "cpp.hacker.27.commands"
title = "입력이 문제다"
story = "계산대 로그는 80열에서 줄바꿈된 채로 기계에서 나오고, 맨 위의 수는 단어가 아니라 명령의 수다."
brief = '''
첫 줄은 뒤따르는 **명령**의 수 `k`입니다. 명령들은 공백으로 나뉜 토큰으로, 나머지
줄들에 걸쳐 어떻게 줄바꿈되었든 채워져 있습니다 — 줄마다 몇 개든, 간격이
얼마든, 끝에 빈 줄이 있을 수도 있습니다.

| 명령 | 토큰 | 효과 |
| --- | --- | --- |
| `ADD <cents>` | 둘 | 항목 하나를 넣는다 |
| `VOID` | 하나 | 마지막 항목을 지운다. 없으면 아무것도 하지 않는다 |
| `TOTAL` | 하나 | 현재 합을 출력한다 |
| `CLEAR` | 하나 | 전부 지운다 |

`k`개의 명령 뒤에 `COMMANDS <k>`와 `ITEMS <how many are left>`를 출력하세요.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k`는 명령을 세고, `ADD`는 토큰 둘로 된 명령 하나입니다 — 그러니 `k`번 돌며
매번 토큰 하나를 읽는 루프는 엉뚱한 곳에서 멈춥니다. 명령 `k`개를 읽고, 인자는
명령에 인자가 있을 때만 꺼내세요.

빈 계산대의 `VOID`와 아무것도 더하기 전의 `TOTAL` 둘 다 동작해야 합니다. 문제에는
그런 일이 일어날 수 없다는 줄이 없고, 실제 코딩 테스트에서는 그 침묵이 명세입니다.
빈 `std::vector`에 대한 `pop_back()`은 정의되지 않은 동작이므로 — 예외도 아니고,
