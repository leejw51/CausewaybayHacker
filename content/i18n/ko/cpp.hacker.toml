# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.hacker.09.linked-list"
title = "사슬"
story = "벡터 없이 해 달라고 한다. 노드를 가리키는 노드들, 그것이 이 질문이 정말로 다루는 모양이기 때문이다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 순서대로의 정수 `n`개입니다.

그것들로 단일 연결 리스트를 만들고 — 링크에는 `std::unique_ptr<Node>`, 답에
벡터는 없음 — 그다음 세 줄을 출력하세요:

1. 뒤집은 리스트, 공백으로 나눠서
2. 가운데 노드의 값(`n`이 짝수이면 둘 중 두 번째)
3. 입력을 믿지 않고 리스트를 걸어서 센 `LEN <n>`

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

가운데는 러너입니다: 포인터 하나는 한 번에 한 걸음, 하나는 한 번에 두 걸음,
그리고 빠른 것이 다 달리면 느린 것이 거기 있습니다. 한 번의 패스.

뒤집기는 `unique_ptr`가 제값을 하는 곳입니다: 노드는 소유자를 정확히 하나만
가질 수 있으므로, 노드를 한 리스트에서 다른 리스트로 옮기는 것은 그 `next`에
대한 `std::move`이고, 두 리스트가 모두 그것을 소유한다고 생각하는 순간은
없습니다. *걷기*에는 여전히 날 `Node*`가 맞습니다 — 보기만 하고 아무것도
소유하지 않습니다.
'''
hints = [
  "뒤에서부터 만드는 것이 쉬운 방향입니다: 새 노드마다 옛 head를 자기 next로 받고, unique_ptr는 복사할 수 없으므로 std::move를 씁니다.",
  "뒤집기: head를 떼어 내고(지역 변수로 std::move), head가 그것이 소유하던 것을 가리키게 하고, 떼어 낸 노드에 옛 뒤집힌 리스트를 걸고, 그것을 새 뒤집힌 head로 만드세요. 노드마다 이동 넷.",
  "가운데를 찾으려면, fast가 두 걸음을 해낸 걸음에서만 slow를 나아가게 하세요.",
]

