# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.hacker.17.lis"
title = "가장 긴 오르막"
story = "하루 매출, 그들이 부르고 싶은 만큼 여러 날, 그리고 그것을 시드에서 직접 만든다. 나아지는 날들의 가장 긴 구간을 원하는데, 그 날들이 연속일 필요는 없다."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에 배열은 없습니다 — **정확히** 이
생성기로, 정의상 감겨 도는 `std::uint64_t` 산술로 직접 만드세요:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

가장 긴 **엄밀히 증가하는 부분 수열**의 길이를 출력하세요 — 값들은 순서를
유지하지만 인접할 필요는 없습니다. 그다음 `TAILS <k>`를 출력하는데, `k`는 그
같은 길이를 페이션스 정렬의 더미 수에서 읽은 것입니다.

```
input:  8 1
output: 3
        TAILS 3
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
이고, 그 안의 가장 긴 오르막은 `93944146 392341189 822192870`입니다. 알고리즘에서
버그를 찾아 나서기 전에 그 줄로 생성기를 확인하세요.

**이 과제는 복잡도를 강제합니다.** 시작 코드는 `O(n²)` 표입니다 — 아무 준비 없이
쓸 수 있어야 하는 답이고, 틀리지 않았습니다. `n = 200000`에서 그것은 빠른 것이
출력하는 것과 같은 `881`을 출력합니다. 시작하고 **32.6초** 뒤에, 5초 실행 제한에
대해 출력하므로, 보이는 것은 오답이 아니라 시간 초과입니다. 그것이 이 문제가
만들어 내려고 존재하는 실패입니다.

`O(n log n)` 버전은 길이마다 그 길이의 부분 수열이 끝날 수 있는 가장 작은 값을
간직합니다 — 언제나 정렬된 목록이므로 새 값의 위치는 이진 탐색이고,
`std::lower_bound`가 그 탐색입니다. 그것은 `n = 200000`을 **0.006초**에 합니다.
둘 다 이 과제에 딸려 오는 두 프로그램으로 이 기계에서 잰 것입니다.

너비에 대해 한마디, 이 문제에서 C++이 더하는 절반이기 때문입니다. 생성된 모든
값은 `2^30` 아래이고 답은 최대 `n`이므로 `int`가 둘 다 담을 수 있습니다 — 하지만
생성기의 `x`는 `std::uint64_t`여야 하고 다른 것은 안 됩니다. 부호 없는
오버플로는 정의상 감겨 돕니다. **부호 있는** 오버플로는 정의되지 않은 동작이므로,
거기에 `long long`을 두면 컴파일러가 무엇이든 할 자격을 얻고, 그것에 대한
`>> 33`은 이 생성기가 뜻하는 논리 시프트가 아니라 산술 시프트가 될 것입니다.
부호 없이 생성하고, 나머지 연산 뒤에 변환하세요.
'''
hints = [
  "tails는 부분 수열이 아닙니다. 그 길이가 답이고, 그 내용은 가장 좋은 끝값들일 뿐입니다.",
  "엄밀히 증가한다는 것은 값 이상인 첫 tail을 바꾼다는 뜻이고, 그것이 정확히 std::lower_bound가 돌려주는 것입니다.",
  "큰 케이스가 시간 초과되어도 답에는 아무 문제가 없습니다 — 여기서는 루프의 모양이 답입니다. 200000개 값에 대한 중첩 루프 둘은 2 x 10^10번의 비교입니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "cpp.hacker.18.edit-distance"
title = "얼마나 떨어져 있나"
story = "서로 다른 두 표지판에 적힌 같은 거리의 두 철자. 그 사이에 한 글자 편집이 몇 번인가."
brief = '''
두 줄, 각각 소문자 단어 하나입니다. 어느 줄이든 **비어** 있을 수 있고, 그러면
답은 다른 쪽의 길이입니다.

**편집 거리**를 출력하세요: 첫째를 둘째로 바꾸는 가장 적은 한 글자 삽입, 삭제,
치환의 수입니다. 그다음 가장 긴 공통 부분 수열의 길이 `LCS <k>`를 출력하세요.

```
input:  horse
        ros
output: 3
        LCS 2
```

같은 두 문자열에 대한 표 둘이고, 둘 다 동점 처리만 다른 같은 세 줄짜리 점화식
입니다. 행 단위로 채우세요. 답은 먼 구석입니다. 편집 표에서 행 `0`과 열 `0`은
0이 아닙니다 — 전부를 지우거나 넣는 비용입니다.

줄은 `>>`가 아니라 `std::getline`으로 읽으세요: 여기서는 빈 줄이 실제 입력이고,
`>>`는 그것을 건너뛰고 다음 단어로 갈 것입니다.
'''
hints = [
  "edit[i][0] = i이고 edit[0][j] = j입니다: 접두사를 아무것도 아닌 것으로 바꾸는 데는 글자마다 삭제 한 번이 듭니다.",
  "맞는 글자는 비용이 없고 대각선으로 나아갑니다. 안 맞으면 하나가 들고 세 이웃 중 가장 싼 것을 취합니다 — 중괄호 목록을 받는 std::min이 셋을 한 번에 받습니다.",
  "LCS는 min 대신 max를 쓰고, 안 맞을 때 대각선 걸음이 없는 같은 걸음입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "cpp.hacker.19.knapsack"
title = "가방에 들어가는 것"
story = "배달원 하나, 가방 하나, 그리고 무게와 팁이 달린 주문판. 탐욕법은 엉뚱한 것들을 고른다."
brief = '''
첫 줄은 `n cap`입니다. 다음 `n`줄은 `<weight> <value>`입니다. 각 물건은 최대
