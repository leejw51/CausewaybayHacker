```

각 중심을 기준으로 펼치세요. 중심은 `n`개가 아니라 `2n - 1`개입니다: 모든 문자는
홀수 길이 회문의 중심이고, 두 문자 사이의 모든 틈은 짝수 길이 회문의 중심입니다.
틈을 잊는 것이 맞아 보이는 해법이 `abba`에서 `1`을 돌려주는 이유이고, 시작 코드가
하는 일이 그것입니다.

**테스트가 강제하는 것과 강제하지 않는 것**, 솔직하게. 일을 하는 숨겨진 케이스는
**한** 글자 알파벳에 대한 `n = 20000`입니다. 그것은 중심 기준 펼치기의 최악의
경우라서 — 모든 중심이 문자열 끝까지 달립니다 — 맞는 답이 거기서 `O(n²)`을 전부
하고도 100분의 몇 초 안에 끝납니다. 그것은 또한 모든 부분 문자열을 하나씩 검사하고
시험하는 방식을 거부하는 것인데, 그것은 삼차 시간이고 5초 안에 돌아오지 않습니다.

다른 큰 케이스, 두 글자 알파벳에 대한 `n = 20000`은 속도가 아니라 **정확성**
케이스입니다. 무작위 이진 문자열에서는 회문 검사가 한두 글자 뒤에 실패하므로,
삼차 답도 통과합니다. 그것은 당신의 생성기와 가장 왼쪽 인덱스 동점 처리가 큰
규모에서 우리 것과 일치하는지 검사합니다.

솔직한 단서 하나, 면접관이 파고들 만한 종류의 것이기 때문입니다: 한 글자 케이스가
거부하는 것은 *모든* 부분 문자열 검사입니다. 지금까지 찾은 가장 좋은 것보다 길지
않은 부분 문자열을 건너뛰는 한 줄을 더하면 같은 삼차 루프가 두 큰 케이스를 모두
