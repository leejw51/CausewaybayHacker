`cap`에 들어가는 가장 좋은 총 가치를 출력하고, 그다음 `GREEDY <v>`를
출력하세요: 여전히 들어가는 것 중 무게당 가치가 가장 좋은 물건을 반복해서
취하면 얻게 될 것입니다.

```
input:  3 10
