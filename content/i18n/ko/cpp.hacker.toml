```

두 숫자가 다르다는 것이 이 퀘스트의 요점의 전부이고, 예시가 그것을 보여 줍니다:
무게당 가치가 가장 좋은 것은 `1.67`인 `6 10` 물건이고, 그것을 취하면 아무것도
들어가지 않는 네 단위의 자리가 남습니다. 그것을 넘기고 `5 7` 물건 둘을 취하면
`14`의 가치입니다. 숨겨진 케이스는 작으므로, 검사하는 것은 표가 빠른지가 아니라
두 숫자를 모두 맞혔는지입니다.
'''
hints = [
