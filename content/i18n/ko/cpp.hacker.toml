output: PATHS 9
        MIN 27
```

행 우선 순서의 한 번 패스가 둘 다 합니다: 한 칸의 경로 수는 위에서 들어오는
경로와 왼쪽에서 들어오는 경로의 합이고, 그 칸의 가장 좋은 비용은 자기 비용
더하기 그 둘 중 더 싼 것입니다. 오른쪽이나 아래로만 움직이므로, 필요한 두 칸은
언제나 이미 끝나 있습니다 — 그래서 이것에는 재귀도 방문 집합도 필요 없습니다.

`PATHS` 수는 늘 그런 이유로 `1000000007`로 나눈 나머지를 취합니다:
`1000 × 1000` 숨겨진 케이스에서 참된 수는 600자리가 넘습니다. 더하면서
줄이세요.

**큰 케이스가 강제하는 것:** 경로를 나열하는 모든 답을 거부합니다. 경로는 방 안의
