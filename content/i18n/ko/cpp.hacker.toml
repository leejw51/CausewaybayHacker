  "나누지 말고 비율을 비교하세요: b.value * a.weight 대 a.value * b.weight. 그러면 답에 부동소수점이 없습니다.",
  "탐욕 패스는 정렬된 물건들에 대한 곧은 루프입니다 — 되돌아가기가 없고, 그것이 정확히 틀린 이유입니다.",
