[[quest]]
id    = "cpp.hacker.11.bst"
title = "정말로 BST인가"
story = "후속 질문. 누구나 두 자식을 검사하고, 누구나 처음에는 틀린다."
brief = '''
지난 퀘스트와 같은 레벨 순서 인코딩입니다: `-1`은 없는 노드이고, `i`의 자식은
`2i+1`과 `2i+2`입니다.

첫 줄은 `n q`입니다. 둘째 줄은 트리 값 `n`개입니다. 셋째 줄은 질의 값
`q`개입니다.

`VALID` 또는 `INVALID`를 출력하세요 — 이것은 왼쪽 서브트리의 모든 값이 노드보다
엄밀히 작고 오른쪽의 모든 값이 엄밀히 큰 이진 탐색 트리인가? 그다음 질의마다
한 줄: 탐색이 찾으면 `<value> FOUND <depth>`, 못 찾으면 `<value> ABSENT`이고,
루트는 깊이 1입니다.

탐색은 트리가 있는 이유인 이진 탐색입니다: 루트에서 시작해, 값이 더 작으면
왼쪽으로, 아니면 오른쪽으로 가고, 그 값에 닿거나 없는 노드 — `-1`, 또는 배열의
끝을 넘은 인덱스 — 에 닿으면 멈춥니다. INVALID 트리에서는 그 걸음이 배열 안에
있는 값을 지나칠 수 있고, 그래도 답은 `ABSENT`입니다: 질의는 배열을 훑으면 무엇을
찾을지가 아니라 조회가 무엇을 찾는지를 묻습니다. 숨겨진 케이스 하나가 정확히
그것입니다.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

각 노드에서 `left < node < right`를 검사하는 것으로는 **충분하지 않습니다** —
왼쪽 서브트리 깊은 곳의 값이 여전히 조상보다 클 수 있습니다. 대신 열린 구간을
아래로 가지고 내려가세요.
'''
hints = [
  "열린 구간 (low, high)를 아래로 넘기세요. 루트는 전체 범위를 받고, 왼쪽 자식은 (low, node)를, 오른쪽 자식은 (node, high)를 받습니다.",
  "없는 노드는 공허하게 유효합니다 — 그것이 기저 경우이고, false가 아니라 true를 돌려줍니다.",
  "조회는 이진 탐색입니다: 작으면 왼쪽, 아니면 오른쪽, 그리고 깊이는 몇 번 건너뛰었는지입니다.",
]

