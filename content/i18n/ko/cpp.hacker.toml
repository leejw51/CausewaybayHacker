[[quest]]
id    = "cpp.hacker.24.inversions"
title = "시계가 잡아내는 것"
story = "오후 라운드의 첫 질문. 순진한 답은 맞고, 그것이 틀린 답이다 — 그리고 이 언어에서는 더 작은 테스트를 속일 만큼 빠르다."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에 배열은 없습니다 — **정확히** 이
생성기로, 정의상 감겨 도는 `std::uint64_t` 산술로 직접 만드세요:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

**역전**을 세세요: `a[i] > a[j]`인 쌍 `i < j`. 그 수를 출력하고, 그다음
`MAX <largest value>`를 출력하세요.

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
입니다.

**이 과제는 복잡도를 강제하며, 그럴 수 있는 유일한 종류입니다.** 시작 코드는
`O(n²)` 이중 루프이고, C++에서 그것은 반전이 있는 함정입니다: `-O2`에서, 경계
검사가 가로막지 않으니 컴파일러가 그것을 벡터화하고, `n = 200000` — 이 면접의
Rust와 Go 버전이 쓰는 크기 — 에서 5초 실행 제한 안인 **1.5초**에 끝납니다. 그래서
C++의 숨겨진 케이스는 `n = 1000000`입니다. 거기서 이중 루프는 `5 × 10^11`번의
비교이고 **38초**가 걸립니다. 병합 정렬 중에 역전을 세는 것은 `O(n log n)`이고
**0.05초**가 걸립니다. 이 기계에서, 이 두 프로그램으로 잰 것입니다.

큰 케이스가 대신 정해 주는 다른 두 가지. `n = 1000000`의 답은 `250046540838`
이고, `int`에 들어가지 않습니다 — 너비가 틀린 누산기는 느린 것이 아니라 조용히
틀립니다. 그리고 생성기는 오버플로가 아니라 감겨 돌아야 합니다: `std::uint64_t`는
정의상 감겨 돌고, 부호 있는 `long long`은 정의되지 않은 동작일 것이며, 컴파일러는
그것으로 무엇이든 할 자격을 얻을 것입니다.
'''
hints = [
  "정렬하기 전에 최댓값을 구하거나, 사본을 정렬하세요. 병합 정렬은 당신 발밑에서 배열의 순서를 바꿉니다.",
  "병합에서 오른쪽 값이 이기면, 왼쪽 절반의 남은 원소는 모두 그보다 큽니다 — 한 번에 mid - left개의 역전이고, 그것이 요령의 전부입니다.",
  "압축된 값에 대한 펜윅 트리가 다른 O(n log n) 답이고 방 안에서 이름을 댈 가치가 있습니다. 시계 아래에서는 병합 정렬이 코드가 더 적습니다.",
]

