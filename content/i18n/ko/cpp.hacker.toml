[[quest]]
id    = "cpp.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 깬 모든 지도는 건너뛴 수를 셌다. 트램은 정류장이 몇 개인지 신경 쓰지 않는다. 얼마나 오래 걸리는지를 신경 쓴다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 방향 없는 가중치 간선 `m`개.
그래프를 **정확히** 이 생성기로, `std::uint64_t`로 직접 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 닿을 수 있는 모든 정류장까지의 최단 거리의 합(`0` 자신은 `0`으로
포함)을 출력하고, 그다음 `MAX <the largest of them>`을 출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서 복잡도는 강제됩니다.** 숨겨진 케이스는 `n = 200000`,
`m = 400000`입니다 — Rust와 Go 면접이 쓰는 크기의 두 배인데, C++은 틀린 답을
충분히 빨리 돌려서 `n = 100000`에서는 5초 선에 걸리고, 통과할지 실패할지가 날씨에
달리게 되기 때문입니다. 어느 쪽이든 다익스트라가 맞는 알고리즘입니다. 시계가
정하는 것은 우선순위 큐입니다. 최솟값을 찾으려고 방문하지 않은 노드를 모두
훑으면 `O(V²)`이고, `n = 200000`에서 5초 실행 제한에 대해 **35초**가 걸립니다.
이진 힙은 그것을 `O((V + E) log V)`로 만들고 **0.09초**에 끝냅니다. 둘 다 이
과제에 딸려 오는 두 프로그램으로 이 기계에서 잰 것입니다: 시작 코드가 훑는
버전입니다.

분명히 볼 가치가 있습니다. 시간 제한 있는 코딩 테스트에서 떨어지는 가장 흔한
방식이기 때문입니다: **시작 코드는 틀리지 않았습니다.** 정확히 맞는 답을
출력합니다. 일곱 배 늦게 도착한다는 이유만으로 거부됩니다.

`std::priority_queue`는 최대 힙이므로, `(distance, node)` 쌍에 대해
`std::greater`로 선언하세요. decrease-key가 없고, 필요도 없습니다: 개선된 거리를
새 항목으로 넣고, 꺼낸 항목의 거리가 이미 기록된 것보다 나쁘면 건너뛰세요. 그
"낡은 항목" 건너뛰기가 사람들이 잊는 줄이고, 그것이 없으면 힙이 끝없이
자랍니다.
'''
hints = [
  "Entry = pair<distance, node>인 std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>>: 쌍은 거리부터 정렬하고, greater가 최대 힙을 뒤집습니다.",
  "if (d > dist[u]) continue;가 낡은 항목 건너뛰기입니다. 그것이 없어도 알고리즘은 여전히 맞지만 힙이 쓸모없는 항목으로 찹니다.",
  "생성기의 신장 트리 절반이 모든 노드에 닿을 수 있음을 보장하므로, INF에 대한 필터는 실제로 아무것도 걸러 내지 않습니다 — 그래도 남겨 두세요. 닿을 수 없는 노드가 있는 버전의 이 질문이 후속 질문이기 때문입니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "체인 전체의 하루치 계산대 연산 4백만 건, 그중 절반이 정정이고, 누군가 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만들고 그다음 연산 `q`개를
실행하세요. 전부 같은 생성기에서, `std::uint64_t`로:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**여기서 복잡도는 강제되며, 그렇게 만드는 데 꽤 공이 들었습니다.** 순진한 답 —
질의마다 범위를 루프 — 은 질의당 `O(n)`이고, 컴파일러가 그것을 놀랄 만큼 빠른
무언가로 벡터화합니다. 작은 케이스로는 잡히지 않습니다. 그래서 큰 숨겨진
케이스는 `n = 500000, q = 4000000`이고, 거기서 순진한 답은 `10^11` 규모의 원소를
건드리며 5초 실행 제한 안에 끝나지 않는 반면, 펜윅 트리는 전체를 1초도 한참 안
걸려 합니다. 둘 다 이 과제의 두 프로그램으로 잰 것입니다.

교훈은 면접관이 낚으려는 바로 그것입니다: *점 갱신, 범위 합*은 펜윅 트리가
존재하는 정확한 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두 접두사의
차로서의 range — 이고, `i & -i`가 가장 낮은 켜진 비트만큼 걷는 방법입니다. 그
식을 위해 인덱스는 부호 있게 두세요. 부호 없는 타입에서 `-i`는 감겨 도는 것이고,
우연히 같은 비트를 주지만 방 안에서 설명해야 할 거리로 만들 것은 아닙니다.
'''
hints = [
