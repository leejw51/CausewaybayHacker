[[quest]]
id    = "cpp.hacker.34.stable-sort"
title = "동점은 제자리를 지킨다"
story = "배달원 둘이 같은 점수로 끝났고, 순위표는 다시 그릴 때마다 그 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 배달원 `n`명을 만드는데, 배달원 `i`는
인덱스 `i`와 점수를 가집니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

배달원들을 점수 **내림차순**으로 정렬하세요. 점수가 같은 배달원들은 도착한 순서를
지켜야 합니다. 그들의 인덱스를 공백으로 나눠 출력하고, 그다음 `TIES <k>` — 정렬된
순서에서 점수가 같은 인접 쌍이 몇 개인지 — 를 출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 모두가 동점이고, 답은 거의 전적으로 그것들에게 무슨
일이 일어나느냐로 정해집니다.

**이것은 당신이 손에 쥔 정렬이 어느 것인지 아는 것에 관한 퀘스트입니다.**
`std::sort`는 **안정적이지 않습니다** — 같은 원소들의 순서에 대해 아무것도
약속하지 않고, 실제 입력에서는 눈에 띄게 그것을 지키지 않을 것입니다: 인트로
정렬이고, 그 분할 단계는 으레 같은 원소들을 피벗 너머로 바꿔 놓습니다.
`std::stable_sort`는 안정적이고, 병합 정렬이며, 그 약속을 위해 메모리를 좀
씁니다. 시작 코드는 점수만 보는 비교자와 함께 `std::sort`를 쓰고, 숨겨진
케이스는 그것이 눈에 띄게 순서를 뒤섞을 만큼 큽니다. (`n = 8`에서는 라이브러리가
삽입 정렬로 물러나 우연히 순서를 지킵니다 — 그래서 작은 테스트로는 아무것도
증명하지 못했을 것이고, 그래서 여기서 작은 케이스는 당신을 판정하는 것이 아니라
*보이는* 것입니다.)

맞는 답은 둘이고 둘 다 낼 수 있어야 합니다. `std::stable_sort`를 쓰세요.
**또는** `std::sort`를 두고 비교를 **전순서**로 만드세요 — 점수 내림차순, 그다음
인덱스 오름차순 — 그러면 어떤 두 원소도 같다고 비교되지 않고 안정성은 더 이상
문제가 되지 않습니다. 기본으로 손을 뻗을 것은 두 번째입니다. 순서가 완전히
명시되면 불안정한 정렬은 증명할 것이 없습니다.
'''
hints = [
  "단어 하나: std::sort가 std::stable_sort가 됩니다. 그것이 안정적인 답입니다.",
  "다른 답은 std::sort를 두고 (점수 내림차순, 그다음 인덱스 오름차순)으로 비교합니다 — 전순서이므로, 불안정할 동점이 남지 않습니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 수는 둘 중 어느 것을 썼든 같습니다 — 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.hacker.28.lru"
title = "링커"
story = "7-32호실, 세 번째 면접, 마지막 질문. 안전망 없는 언어, 더 짧은 시계, 그리고 올바른 것을 내보내야 하는 캐시."
brief = '''
첫 줄은 `cap q`입니다. 다음 `q`줄은 `PUT <key> <value>` 또는 `GET <key>`입니다.

가득 차면 **가장 오래전에 사용된** 항목을 내보내는 고정 용량 캐시를 구현하세요.
`GET`과 `PUT` 둘 다 키를 사용한 것으로 칩니다.

`GET`마다 값을 출력하고, 없으면 `-1`을 출력하세요. 끝에서 살아남은 키들을 가장
최근에 사용된 것부터 공백으로 나눠 출력하고 — 캐시가 비어 있으면 `-` — 그다음
`EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`에 자리가
필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은 적중하고 `3`을
가장 최근 것으로 만들며, 그래서 살아남은 것들이 `3 1`로 출력됩니다.

교과서적인 답은 **이중 연결 리스트**를 가리키는 해시 맵이고, C++에는 진짜가
있습니다: `std::list`, 그 반복자는 다른 원소들이 삽입되고, 지워지고, splice되어도
유효하게 남습니다 — `std::vector`가 할 수 없는 단 하나의 보장이고, 맵이 값으로
`std::list::iterator`를 담을 수 있는 이유의 전부입니다. `push_front`, 앞으로의
`splice`, `back`, `pop_back`은 모두 O(1)이므로, 여기서 모든 연산이 O(1)이고 얼버무리지
않고 그렇게 말할 수 있습니다.

Rust 면접이 요구하지 않았던, 바로잡아야 할 두 가지. 리스트 노드는 값**과 함께**
키도 담습니다. 내보내기는 리스트에서 시작하고 맵의 어느 항목을 지울지 알아야
하기 때문입니다. 그리고 두 지우기의 순서가 중요합니다: 먼저 `back()`에서 키를
읽어 내고, 맵에서 그것을 지우고, *그다음* `pop_back`하세요 — 반대 순서는 더 이상
존재하지 않는 노드를 가리키는 반복자를 통한 읽기이고, 그것이 눈데이 건 이래로
이 랜드가 다뤄 온 바로 그것입니다.

여기 케이스는 작고 시계는 속도를 재지 않습니다: 연산 네 개로는 `std::list`와 앞에서부터
훑는 `std::vector`를 구별할 수 없습니다. 위 문단의 `O(1)`은 방 안에서 소리 내어
말하는 문장이므로, 우연히 네 케이스를 통과한 코드가 아니라 당신이 쓴 코드에 대해
참이어야 합니다.
