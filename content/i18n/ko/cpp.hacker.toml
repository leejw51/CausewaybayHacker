[[quest]]
id    = "cpp.hacker.31.palindrome"
title = "거꾸로 읽어도 같은"
story = "상위 20위 질문, 대부분의 코딩 테스트에서 어떤 형태로든 나오고, 대부분의 사람이 한 번 써 보고 한 번도 이해하지 못한 것."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열을 직접 만드세요:

```
