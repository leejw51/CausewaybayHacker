칸 수에 선형이고 둘 다 여유 있게 통과합니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에서 값을 둘 다 뽑으세요 — 생성기는 그것들을 건너뛰지 않고, 막기만 거부합니다.",
  "위나 왼쪽에 열린 이웃이 없는 열린 칸은 경로 0개로 닿을 수 있고 가장 좋은 비용이 없습니다. INF가 도달 불가를 뜻하게 두고 덧셈을 막으세요. INF 더하기 무엇이든은 부호 있는 오버플로이기 때문입니다.",
  "목적지는 열려 있으면서도 닿을 수 없을 수 있고, 그때가 정확히 PATHS가 0이고 MIN이 -1일 때입니다. 숨겨진 케이스 하나가 그것입니다.",
