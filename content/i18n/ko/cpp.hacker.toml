# ---------------------------------------------------------------- 22
[[quest]]
id    = "cpp.hacker.22.trie"
title = "접두사 상자"
story = "정류장 안내판을 위한 자동 완성 — 정직한 종류, 실제로 목록에 있는 것만 완성하는."
brief = '''
첫 줄은 `n q`입니다. 다음 `n`줄은 넣을 소문자 단어들입니다. 다음 `q`줄은
질의이며, 각각 `WORD <s>` 또는 `PREFIX <s>`입니다.

트라이 — 노드마다 자식을 최대 26개 담는 트리 — 를 만들고 답하세요:

* `WORD <s>` → `s`가 넣어졌으면 `YES`, 아니면 `NO`
* `PREFIX <s>` → 넣어진 `n`개의 단어 중 몇 개가 `s`로 시작하는지

`n`개의 단어가 서로 다르다는 보장은 없고, `PREFIX`는 서로 다른 단어가 아니라
**삽입**을 셉니다: `tram`을 두 번 넣으면 `PREFIX tram`은 `2`입니다. `NODES`는
노드를 세므로, 두 번째 삽입은 아무것도 더하지 않습니다.

그다음 루트를 포함한 트라이의 노드 수 `NODES <k>`를 출력하세요.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

모든 노드에 그것을 지나가는 삽입된 단어의 수를 간직하면, `PREFIX`는 끝에서 셀
것 없는 걷기가 됩니다. 노드들을 `std::vector` 하나에 저장하고 자식은 노드마다
`unique_ptr` 스물여섯 개 대신 인덱스 — 없으면 `-1` — 를 담게 하세요. 더 작고,
더 빠르며, 인덱스는 벡터 안을 가리키는 포인터처럼 증가로 무효화되는 일이 절대
없습니다.
'''
hints = [
  "노드들을 벡터 하나에 저장하고 자식은 인덱스를 담게 하세요. push_back 전에 얻은 벡터 안의 참조는 지난 지도의 반복자 무효화 버그가 모자를 쓴 것입니다.",
  "through는 발을 딛는 노드에서 올라가므로, 루트는 절대 자기 자신을 세지 않습니다.",
  "트라이에서 떨어져 나간 질의는 at == -1을 남기고, -1은 특별한 경우 없이 NO와 0으로 답합니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.hacker.23.prefix-sums"
title = "목표를 맞히는 방법은 몇 가지"
story = "하루치 매출과 감사관이 보고 싶어 하는 숫자 하나. 연속된 시간 구간 중 몇 개가 정확히 그 합이 되는가."
brief = '''
첫 줄은 `n k`입니다. 둘째 줄은 음수일 수 있는 정수 `n`개입니다.

합이 정확히 `k`인 연속 구간이 몇 개인지 출력하고, 그다음 `RANGE <s>`를
출력하세요. 목록 전체의 합이며, 다시 더하는 것이 아니라 마지막 접두사 합에서
읽은 것입니다.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

음수 값은 슬라이딩 윈도를 죽입니다 — 너무 큰 창을 줄여서 고칠 수 없습니다.
살아남는 것은 접두사 합입니다: 구간 `i..j`의 합은 정확히
`prefix[j] - prefix[i] == k`일 때 `k`이므로, 앞선 접두사 중 몇 개가
`prefix[j] - k`와 같은지 세세요. 처음에서 시작하는 구간을 위해 맵을 `0 → 1`로
시작하세요.

여기 케이스는 작고 시계는 속도를 재지 않으며, 여기에는 `O(n²)` 이중 루프를
거부할 케이스가 없습니다 — 실제 `n`에서라면 있을 것입니다. 그 같은 이중 루프는
200000개 값에서 `2 × 10^10`번의 덧셈이고, 5초 실행 제한에 대해, 그리고 그
100분의 1에 끝나는 해시 맵의 한 번 패스에 대해, 이 기계에서 약 6초가 걸립니다.
이 네 개가 검사하는 것은 음수와 처음에서 시작하는 구간이고, 그것이 이 답이
실제로 틀어지는 두 곳입니다. 복잡도는 당신의 양심에 맡깁니다.
