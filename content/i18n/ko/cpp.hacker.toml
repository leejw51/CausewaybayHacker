# ---------------------------------------------------------------- 20
[[quest]]
id    = "cpp.hacker.20.bits"
title = "홀로 있는 것"
story = "전표는 하나만 빼고 전부 두 번씩 스캔된다. 해시 맵도 못 쓰게 하고 정렬도 못 하게 한다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 음이 아닌 정수 `n`개이며, 하나만 빼고 모든 값이
정확히 두 번씩 나옵니다.

네 줄을 출력하세요:

1. 한 번 나오는 값, **xor**와 상수 추가 공간으로 찾아서
2. 그 값에 `1` 비트가 몇 개 켜져 있는지
3. 2의 거듭제곱이면 `POW2 YES`, 아니면 `POW2 NO`(`0`은 아님)
4. 가장 낮은 켜진 비트를 끈 값, 켜진 비트가 없으면 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`이고 `x ^ 0 == x`이며, xor는 어떤 순서로 일어나든 상관하지 않습니다.
그것이 첫 줄의 전부입니다. `x & (x - 1)`은 가장 낮은 켜진 비트를 끄고, 그것이
셋째와 넷째 줄을 공짜로 줍니다. 전부 `unsigned long
long`으로 하세요: 부호 있는 타입에서의 시프트와 뺄셈에는 경계 경우가 있고, 이
문제는 그것에 관한 것이 아닙니다.

여기 케이스는 작고 시계는 속도를 재지 않습니다. 큰 숨겨진 케이스는 없고, 이
팩이 케이스를 만드는 방식으로는 만들 수도 없습니다: 쌍-더하기-하나인 배열은
생성되는 것이 아니라 *구성되는* 것이고, 그것을 구성하는 두 랜드는 같은 배열을
구성하지 않을 것입니다. 그래서 이 케이스들은 네 줄과 그 경계를 검사합니다 —
`0`은 2의 거듭제곱이 아니고, 켜진 비트가 없는 값은 가장 낮은 것을 꺼도 `0`으로
남습니다. 그래도 xor가 답입니다. 중첩 루프로 등장 횟수를 세는 것은 `O(n²)`이고
실제 `n`에서 죽습니다.
'''
hints = [
  "쌍들은 어떤 순서로 오든 서로를 상쇄하므로, 목록에 대한 접기 한 번이면 충분합니다.",
  "가장 낮은 비트를 매번 끄며 비트를 세면 비트 너비만큼이 아니라 켜진 비트마다 한 번 돕니다. <bit>의 std::popcount가 C++20의 한 줄짜리입니다.",
  "2의 거듭제곱은 켜진 비트가 정확히 하나이므로, 가장 낮은 것을 끄면 0이 남습니다 — 그리고 0 자체는 손으로 제외해야 합니다.",
]

