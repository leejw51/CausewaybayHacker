[[quest]]
id    = "cpp.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구는 문제의 맨 아래에 나오고, 방의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. `std::uint64_t`로 질의 `q`개를 생성하세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지로** 계산하세요. `q`개
답 전부의 합을, 그것 역시 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이므로, 계산한 다음 줄이는 일은 절대 없습니다
— 모든 곱셈을 하면서 줄입니다. 문제는 나눗셈입니다: `a! / (b! (a-b)!)`는 모듈러
산술에서 의미가 없습니다. 그것을 대신하는 것이 **모듈러 역원**이고,
`1000000007`이 소수이므로 페르마의 소정리가 그것을 줍니다:
`inverse(v) = v^(p-2) mod p`, 약 서른 번의 제곱으로 된 빠른 거듭제곱으로
계산합니다.

그러니: `factorial[0..=n]`을 한 번 미리 계산하고, 각 질의를
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**여기서 복잡도는 강제됩니다.** 숨겨진 케이스 하나가 `n = 200000`,
`q = 200000`입니다. 계수마다 독립적으로 계산하는 것 — 항 `b`개를 곱하고, 항
`b`개로 나누고, 각각 모듈러 역원 하나 — 은 5초 실행 제한 안에 끝나지 않습니다.
그것이 시작 코드입니다. 공유된 팩토리얼 표 하나는 1초도 한참 안 걸려 끝납니다.
둘 다 이 기계에서 잰 것입니다.

모든 중간값은 `2^30` 아래의 두 값의 곱이므로 `long long`에 들어가고 아무것도
오버플로하지 않습니다. `int`로는 그렇지 않을 것이고 — 여기서 `int`는 32비트입니다
— 그것이 이 질문이 나오는 이유의 다른 절반입니다.
'''
hints = [
  "매 곱셈 뒤에 줄이고, 절대 끝에서 줄이지 마세요. long long은 P 아래 두 값의 곱은 담지만 팩토리얼은 담지 못합니다.",
  "inverse(v)는 power(v, P - 2)이고, P가 소수이기 때문에만 동작합니다 — 여기서 페르마의 소정리의 내용은 그것이 전부입니다.",
  "역팩토리얼도 inverse(factorial[n])에서 거꾸로 미리 계산하면 질의마다의 power() 호출 둘이 없어집니다. 통과하는 데 필요하지는 않고, 소리 내어 말할 가치는 있습니다.",
]

