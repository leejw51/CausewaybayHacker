id    = "pytorch.cheatsheet_advanced.05.modulelist"
title = "등록부에 올리기"
story = "자딘스 바자 위로 똑같은 층이 쌓인 탑. 집주인은 등록부에 있는 층에서만 월세를 걷는다."
