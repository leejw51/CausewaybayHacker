[[quest]]
id    = "pytorch.cheatsheet_advanced.16.grad-scaler"
title = "SCALE, STEP, UPDATE"
story = "랙 3의 카드 위 반정밀도: 손실을 먼저 부풀리고 step이 그것을 알지 않으면 작은 기울기는 언더플로한다."
brief = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
    with torch.autocast(device_type="cuda", dtype=torch.float16):
        loss = loss_fn(model(xb), yb)
    # ____
```

CUDA에서 `float16` 혼합 정밀도. 한 학습 step의 세 호출로 빈칸을 채우세요.
backward는 스케일러가 키운 손실에서 돌고, 옵티마이저는 **스케일된 채인 기울기를
절대 적용하지 않으며** (기울기에 inf가 있는 step은 건너뛰고), 스케일 계수는 그
step 다음에만 조정되도록.
'''
hints = [
  "세 호출 모두 스케일러를 거칩니다. 옵티마이저를 직접 step하면 기울기가 스케일된 채 남고, 스케일러는 스케일한 적 없는 손실은 step하지 않으며, step하기 전에는 update하지 않습니다.",
]

