id    = "pytorch.cheatsheet_advanced.15.scheduler-step"
title = "한 바퀴에 한 번 식히기"
story = "랙의 코사인 어닐링: 학습률은 옵티마이저가 자기 차례를 마친 뒤, 에폭마다 조금씩 내려간다."
brief = '''
```
sched = torch.optim.lr_scheduler.CosineAnnealingLR(opt, T_max=epochs)
for epoch in range(epochs):
    for xb, yb in loader:
        opt.zero_grad()
        loss = loss_fn(model(xb), yb)
        loss.backward()
        opt.step()
    # ____
```

학습률 스케줄이 **에폭당 한 번 전진**하도록 빈칸을 채우세요.
'''
hints = [
  "스케줄러에는 옵티마이저의 것 다음에 부르는 자기만의 step이 있습니다 — 여기서는 에폭당 한 번. 현재 비율을 읽는 것은 아무것도 전진시키지 않고, 옵티마이저는 스케줄러를 소유하지 않습니다.",
]

