'''
hints = [
  "슬라이스는 술어가 성립하는 부분과 성립하지 않는 부분으로 나뉘고, 돌려받는 인덱스는 성립이 멈추는 첫 원소입니다. `t` *아래* 모든 것에 참인 술어를 고르세요.",
]

