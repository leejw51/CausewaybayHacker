]

# ---------------------------------------------------------------- 51
[[quest]]
id    = "rust.cheatsheet.51.ok-question-in-option-fn"
title = "물음표, Option 편"
story = "다이파이동의 주문 쪽지에는 그릇 수가 적혀 있다. 번진 쪽지는 에러 보고가 아니라 그냥 주문 없음이어야 한다."
brief = '''
`fn double(s: &str) -> Option<u32>` 안에서 `s`를 `u32`로 파싱하고, 파싱되지
않으면 `None`으로 멈춥니다. `double("21")`은 `Some(42)`,
`double("x")`는 `None`입니다.

```
let n = ____;
Some(n * 2)
```

빈칸에 들어갈 식은 어느 것일까요?
'''
hints = [
  "`?`는 함수가 돌려주는 것과 같은 종류의 실패만 실어 나릅니다. 이 함수는 Option을 돌려주니 파싱의 Result를 먼저 Option으로 바꾸세요. 그러면 `?`가 그 `None`에서 멈출 수 있습니다.",
]

# ---------------------------------------------------------------- 52
[[quest]]
id    = "rust.cheatsheet.52.both-ways"
title = "갔다가 돌아오기"
story = "타임스스퀘어 상영회의 좌석표는 이름을 좌석 번호에 매핑한 손글씨 HashMap이다. 빠진 이름도 있고, 숫자가 아닌 번호도 있다."
brief = '''
`fn seat(m: &HashMap<&str, &str>, k: &str) -> Result<u32, String>` 안에서:
`k`가 없으면 `Err(format!("no {k}"))`를 돌려주고, 값이 파싱되지 않으면
파싱 에러를 `String`으로 돌려줘야 합니다.

```
let n = ____;
Ok(n)
```

빈칸에 들어갈 식은 어느 것일까요?
'''
hints = [
  "실패가 두 가지, 모양도 두 가지입니다. 조회는 Option을 주니 여기서 `?`를 쓰려면 먼저 Result가 되어야 하고, 파싱은 Result를 주지만 그 에러는 아직 String이 아닙니다.",
]
