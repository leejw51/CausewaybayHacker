[[quest]]
id    = "rust.cheatsheet.22.lower-bound"
title = "작지 않은 첫 번째"
story = "소고의 가격판은 정렬되어 있다. 메이는 값이 `t` 이상인 첫 품목이 어디서 시작하는지 알고 싶다."
