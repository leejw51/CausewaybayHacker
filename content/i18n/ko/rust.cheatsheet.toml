워커에 넣을 수 있도록 `rx`를 감싸는 줄은 어느 것일까요?
'''
hints = [
  "Receiver는 Sync가 아니라서, 스레드 사이에 공유하려면 락이 필요합니다 — 그리고 그 락에는 단일 스레드용이 아니라 스레드 안전한 소유자가 필요합니다.",
]

