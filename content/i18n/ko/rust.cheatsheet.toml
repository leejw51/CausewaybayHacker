[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "레일 하나, 요리사 넷"
story = "럭키 맥의 야간 주방: 주문표 레일 하나에 요리사 넷, 한 번에 한 사람만 읽을 수 있다."
