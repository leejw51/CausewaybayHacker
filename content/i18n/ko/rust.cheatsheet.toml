  "한 메서드는 하나라도 통과하면 true이고, 다른 하나는 하나도 실패하지 않을 때만 true입니다. 엄격한 쪽을 고르고, `.iter()`는 클로저에 참조를 건넨다는 것을 기억하세요.",
]

