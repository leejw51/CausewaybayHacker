# ---------------------------------------------------------------- 19
[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "마지막 사람이 나가면"
story = "록하트 로드의 배달원 넷이 무전기 하나로 보고한다. 배차원은 마지막 한 명이 교신을 끝낸 때를 알아야 한다."
brief = '''
생산자 넷, 소비자 하나. 메시지 넷이 도착하면 `for` 루프가 끝나야 합니다.

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

빈칸에 들어갈 줄은 어느 것일까요?
'''
hints = [
  "루프는 모든 송신자가 사라져야 끝납니다. 복제본 넷은 스레드와 함께 갑니다 — 송신자 하나가 아직 `main`에 앉아 있습니다.",
]

