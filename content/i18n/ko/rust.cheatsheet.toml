[[quest]]
id    = "rust.cheatsheet.27.sub-slice"
title = "가운데서 둘"
story = "퍼시벌 스트리트 옆 차고에 트램 다섯 대가 서 있다. 메이는 두 번째와 세 번째만 보고 싶고, 차고는 다섯 대를 다 둔다."
brief = '''
`v: Vec<i32>`에는 원소가 넷 이상 있습니다. `w`는 인덱스 1과 2의 원소를
**정확히** 빌리는 `&[i32]`입니다 — 원소 둘, 복사 없이.

```
let w: &[i32] = ____;
```

빈칸에 들어갈 식은 어느 것일까요?
'''
hints = [
  "Vec에 범위 인덱스를 쓰면 슬라이스가 나오고, 슬라이스는 빌려야 들고 있을 수 있습니다. `a..b`의 끝은 포함되지 않고, `a..=b`의 끝은 포함됩니다.",
]

