[[quest]]
id    = "remix.cheatsheet.07.recursive-closure"
title = "자기 자신을 부르기"
story = "하이산 플레이스의 엘리베이터: 모든 층을 뒤지려면 탐색이 자기 자신을 불러야 한다."
brief = '''
**Go**에서 클로저 하나가 자기 자신을 불러 그래프를 돕니다.

```
// ____
dfs = func(u int) {
    for _, v := range g[u] { dfs(v) }
}
```

본문이 `dfs`를 참조할 수 있으려면 어떤 줄이 먼저 와야 할까요?
'''
hints = [
  "`:=`를 쓰면 그 이름은 자기 리터럴 안에서 아직 존재하지 않습니다. 함수 타입으로 변수를 먼저 선언하고, 그다음 대입하세요.",
]

