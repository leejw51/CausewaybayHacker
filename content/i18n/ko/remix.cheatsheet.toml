# REMIX LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/remix/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks, identifiers and printed strings are
# copied verbatim.

pack   = "remix.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.cheatsheet.01.flush"
title = "플러시"
story = "06:30, 자딘스 바자. 키오스크는 모든 답을 버퍼에 써 넣었고, 화면은 텅 빈 채였다."
brief = '''
**Go**에서 `main`은 이렇게 시작합니다.

```
in := bufio.NewReader(os.Stdin)
out := bufio.NewWriter(os.Stdout)
// ____
```

바로 그 자리에 들어가서, `main`이 반환될 때 `out`에 쓴 모든 것이 화면에 닿도록 하는 줄은 무엇일까요?
'''
hints = [
  "버퍼가 있는 writer는 플러시될 때만 씁니다. main이 반환되는 순간에 플러시가 일어나도록 예약하세요.",
]

