**Python**에서 `h`는 min-heap인 `heapq`와 함께 쓰는 리스트입니다. 숫자 `x`를 넣되, `heapq.heappop(h)`가 **가장 큰** 값을 먼저 주도록 하세요 (꺼낼 때 부호를 다시 뒤집습니다).
'''
hints = [
  "heapq에는 max-heap이 없습니다. 순서가 뒤집히도록 값을 저장하세요.",
]

