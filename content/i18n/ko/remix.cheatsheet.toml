[[quest]]
id    = "remix.cheatsheet.10.close-results"
title = "모두 끝난 뒤에 닫기"
story = "네 명의 택배 기사가 슈가 스트리트 창고로 소포를 가져온다. 문은 첫 번째가 아니라 마지막 기사 뒤에 닫힌다."
brief = '''
**Go**에서 worker goroutine 네 개가 각각 **버퍼 없는** 채널 `results`로 보내고, 끝나면 `wg.Done()`을 부릅니다. 그다음 `main`이 모읍니다.

```
// ____
for r := range results { all = append(all, r) }
```

루프 바로 앞에서, panic도 deadlock도 없이 루프가 끝나도록 알맞은 순간에 `results`를 닫는 줄은 무엇일까요?
'''
hints = [
  "모든 송신자가 끝난 뒤에만 닫고, 그 기다림은 곧 읽기 시작할 goroutine이 아닌 다른 곳에서 하세요.",
]

