[[quest]]
id    = "python.advanced.17.none"
title = "05:59의 가격판"
story = "05:59, 보링턴 로드. 가격판이 장부에 아직 열지 않은 노점을 물어보고, 장부는 아무것도 아닌 것으로 대답하고, 가격판은 그 아무것도 아닌 것의 가격을 찍는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <CENTS>` 형식의 줄 `n`개 — 문을 연
노점들 — 그다음 개수 `q`와 찾아볼 노점 이름 `q`개입니다.

각 질의에 대해 `<STALL> <cents>`를, 그 노점이 열려 있지 않으면 `<STALL> NONE`을
출력하세요. 그다음 `MISSING <k>`와 `CHEAPEST <STALL>` — 열린 노점 중 가격이
가장 낮은 것, 동률은 이름순 — 을, 아무것도 열려 있지 않으면 `CHEAPEST NONE`을
출력하세요.

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

스타터는 `CHAN`에서 죽습니다:

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

이 줄이 보스입니다. 절대 버그를 가리키지 않습니다. `None`이 마침내 *사용된*
자리를 가리키는데, 그곳은 `None`이 *만들어진* 자리에서 얼마든지 멀 수 있습니다
— 그리고 스타터에서는 서로 다른 두 곳에서 만들어졌습니다. `lookup`은 없는
노점에 대해 의도적으로 `None`을 돌려주는데, 호출자는 묻지도 않고 거기서
`.cents`를 읽습니다. 그리고 `cheapest`는 한 경로에 `return`이 없어서
**암묵적으로** `None`을 돌려주고, 호출자는 그것에도 똑같은 짓을 합니다.

파이썬의 모든 함수는 무언가를 돌려줍니다. 끝까지 흘러 떨어진 함수는 `None`을
돌려줍니다. 기본값 없는 `dict.get`은 `None`을 돌려줍니다. 둘 다 그 시점에는
오류가 아니고, 둘 다 나중에 오류가 됩니다. 고치는 방법은 두 번 다 같습니다:
`None`을 받을 수 있는 코드가 속성을 건드리기 전에 `is None`으로 검사합니다.
`== None`도 아니고 `if not stall`도 아닙니다 — 가격이 `0`인 노점은 진짜
노점이고, `not`은 그것을 내버릴 테니까요.

`lookup`과 `cheapest`가 **의도적으로** `Optional[Stall]`을 돌려주게 하고,
어노테이션에 그렇게 적고, `None`이 떨어지는 자리에서 처리하세요.
'''
hints = [
  "트레이스백을 아래에서 위로 읽으세요: AttributeError는 print에서 났지만, None은 한 줄 위의 lookup에서 나왔고, 그 전에는 board.get에서 나왔습니다.",
  "if stall is None: 이 검사입니다. `is`인 이유는 None이 단 하나의 객체라서 동일성이 정직한 비교이기 때문입니다. `==`는 오버라이드될 수 있고 `not stall`은 거짓이지만 진짜인 값에 대해 틀립니다.",
  "cheapest에는 경로가 둘인데 return은 하나에만 있습니다. 파이썬은 그것을 경고하지 않습니다. 호출자에게 None을 건네고 호출자가 알아내게 둡니다. 빈 경우에 명시적인 `return None`을 넣어서 읽는 사람이 의도된 것임을 알 수 있게 하세요.",
  "어노테이션의 Optional[Stall] 은 인터프리터가 강제하지 않습니다. 읽는 사람과 타입 검사기를 위한 메모이고, 시계를 보고 있는 것은 읽는 사람입니다.",
]

