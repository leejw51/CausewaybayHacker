[[quest]]
id    = "python.advanced.12.frozen"
title = "바뀌지 않는다"
story = "그날의 인쇄된 가격표가 06:00에 모든 노점에 배부되는데, 12:30이 되면 세 곳이 그 위에 뭔가를 적었고 한 곳은 없는 열을 하나 추가했다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 형식의 줄 `n`개입니다.

각 줄을 **frozen** 데이터클래스 `Price(name, cents)`로 만드세요. 그다음
가격마다 그 `cents`를 덮어쓰려 시도하고, 시도가 예외를 내면 `FROZEN <NAME>`을
출력하세요. 다음으로 `__slots__ = ("count",)`를 가진 `Tally` 클래스:
`tally.count`를 설정한 뒤, 철자가 틀린 `tally.cuont`를 설정하려 시도하고,
*그것이* 예외를 내면 `SLOTS YES`를 출력하세요. 마지막으로 가격들로 만든
`set`의 크기인 `IN_SET <k>`와 `TOTAL <sum>`을 출력하세요.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

frozen 데이터클래스가 사 주는 것 셋, 그리고 스타터에는 그중 하나도 없습니다.
`frozen=True`는 필드에 대한 대입이 `FrozenInstanceError`를 내게 하므로,
가격표 위에 뭔가를 적을 수 없습니다. 또한 인스턴스를 **해시 가능**하게 만듭니다
— 가변 데이터클래스는 `__hash__`를 `None`으로 두고, 스타터의 가격들로 `set()`을
만들면 `TypeError: unhashable type`이 납니다. 필드가 같으면 해시가 같으므로,
`LAM 1200` 두 줄은 집합의 원소 하나입니다.

`__slots__`는 또 다른 종류의 고정된 모양입니다: 인스턴스는 정확히 이름이
지정된 속성만 가지고 `__dict__`가 없으므로, 속성 이름의 오타는 아무도 읽지
않는 조용한 새 필드가 아니라 대입 시점의 `AttributeError`입니다. 모든
인스턴스를 더 작게 만들기도 하는데, 그래서 "이게 천만 개 있는데요"에 대한
답이 이것입니다.
'''
hints = [
  "@dataclass(frozen=True). 인자 하나면 루프 안의 대입이 예외를 내기 시작합니다.",
  "클래스 본문에, __init__ 앞에 __slots__ = (\"count\",). 뒤의 쉼표에 주의하세요: (\"count\") 는 튜플이 아니라 문자열입니다.",
  "TOTAL은 원래 센트의 합인데, 그것은 대입이 실패했기 때문에만 성립합니다. 스타터에서는 그 시점에 모든 가격이 0이고 TOTAL은 0입니다 — 변경이 허용되기만 한 게 아니라 실제로 통했습니다.",
]

