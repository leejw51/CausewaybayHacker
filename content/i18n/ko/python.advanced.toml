계층의 모든 구성원을 잡고, `str(err)`가 메시지입니다 — `super().__init__`에
넘긴 인자로부터 `Exception.__str__`이 만들어 주는 것이므로, 메시지는 핸들러가
아니라 클래스 안에 삽니다.

`raise NotANumber() from err`는 `ValueError`를 원인으로 기록합니다. 여기서는
