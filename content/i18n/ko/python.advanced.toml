이것들은 하나같이 지연 이터레이터를 돌려줍니다. 특히 `groupby`의 그룹은 다음
그룹으로 넘어가기 전까지만 유효하므로, 넘어가기 전에 각 그룹을 읽으세요 —
루프 안에서 `len(list(group))`, 나중을 위해 저장해 둔 그룹 리스트가 아니라.
