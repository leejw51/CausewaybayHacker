`__iter__`는 `self`를 돌려주고, `__next__`는 다음 값을 돌려주거나 값
`count`개를 다 나눠 줬으면 `StopIteration`을 일으킵니다. 각 값을 한 줄에
하나씩 출력한 뒤, 두 번째 `Tickets`를 `sum`에 넘겨 계산한 `SUM <total>`을
출력하세요.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

이것이 제너레이터가 대신 써 주는 것입니다. `for` 루프는 그 대상에 `iter()`를
한 번 호출한 뒤, 결과에 `StopIteration`이 날 때까지 `next()`를 호출합니다.
`sum`, `list`, `max`, `in`도 같은 일을 합니다. `__next__`는 있고 `__iter__`는
없는 객체는 `for`가 거부하는 이터레이터이고 — `TypeError: 'Tickets' object
is not iterable` — 그것이 스타터입니다.

`self`를 돌려주는 `__iter__`는 **이터레이터**의 표식입니다: 한 번 걸을 수
있고 그러면 소진됩니다. **컨테이너**는 `__iter__`마다 새 이터레이터를 돌려주고
반복해서 걸을 수 있습니다. 기초 길의 `Bag`이 그것이었습니다. 어느 쪽을 쓰는지
분명히 하세요. 그 차이는 누군가가 두 번째로 루프를 돌 때 드러납니다.
'''
hints = [
  "def __iter__(self): return self. 두 줄이면 for가 동작하기 시작합니다.",
  "StopIteration은 반환하는 것이 아니라 일으키는 것입니다. for 루프가 그것을 잡으며, 당신은 그것을 볼 일이 없습니다.",
  "전진하기 전에 돌려줄 값을 먼저 저장하세요. 아니면 한 스텝 어긋납니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "python.advanced.15.collections"
title = "알맞은 컨테이너"
story = "지하 사무실은 그날의 티켓을 긴 리스트 하나에 두고, 그것에 대한 모든 질문에 맨 위부터 읽어서 답한다."
brief = '''
표준 입력 세 줄: 단어 한 줄, 이미 **오름차순으로 정렬된** 정수 한 줄, 그리고
정수 `x` 하나.

네 줄을 출력하세요:

1. `TOP <word> <count>` — 가장 잦은 단어, 동률은 단어 오름차순 —
   `collections.Counter`로
2. `BISECT <l> <r>` — 정렬된 정수들에서 `x`의 `bisect_left`와 `bisect_right`
3. `SMALLEST3` 뒤에 가장 작은 정수 셋 — `heapq.nsmallest` — 셋보다 적으면
   있는 만큼
4. `GROUPS` 뒤에 단어들의 각 첫 글자에 대해 `<letter>:<k>`, 글자 오름차순 —
   첫 글자를 키로 하는 `collections.defaultdict(list)`

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

`Counter.most_common(1)`은 동률을 **삽입 순서**로 가르는데, 여기서는 `tofu`이고
문제는 `egg`라고 합니다. 스타터는 `most_common`을 믿습니다. 대신 뜻하는 바를
말하는 키로 항목을 정렬하세요.

`bisect`는 루프 없이 "이것이 어디에 들어갈까"에 답합니다: `bisect_left`는
`x`보다 작지 않은 첫 위치, `bisect_right`는 `x`보다 큰 첫 위치이고, 둘의
차이가 `x`의 개수입니다. `heapq.nsmallest`는 `k`는 작고 `n`은 그렇지 않을 때
맞는 호출입니다. 앞에서 값 셋을 읽으려고 리스트 전체를 정렬하는 것이 바로
그것이 피하려고 존재하는 일입니다.
'''
hints = [
  "min(counts.items(), key=lambda item: (-item[1], item[0])) 이 동률 처리를 명시한 최다 단어입니다. 같은 키로 정렬해서 [0] 을 취해도 같은 답입니다.",
  "bisect_left와 bisect_right는 절대 예외를 내지 않습니다. list.index는 x가 없으면 ValueError를 내고, 숨겨진 케이스 하나가 정확히 그것입니다.",
  "defaultdict(list) 는 첫 접근에 리스트를 만들어 주므로 groups[letter].append(w) 에는 검사가 필요 없습니다. 출력 전에 항목을 정렬하세요. defaultdict도 여느 딕셔너리처럼 삽입 순서입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "python.advanced.16.timeouts"
title = "그만 기다리기"
story = "주문판이 노점마다 대기 시간을 물어보는데, 카드 단말기가 죽은 노점은 영영 대답하지 않고, 그래서 주문판은 영영 다시 그려지지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <SECONDS>` 형식의 줄 `n`개이며,
`SECONDS`는 즉시 대답하는 노점이면 `0`, 제때 대답하지 않는 노점이면 `1`입니다.

노점마다 그 `fetch(stall, seconds)` — 그만큼 sleep합니다 — 를 **0.2초**
타임아웃의 `asyncio.wait_for` 아래에서 `await`하고, `<STALL> OK` 또는
`<STALL> TIMEOUT`을 입력 순서로 출력하세요. 그다음 영원히 반복하는 `watch()`
태스크를 시작하고, 취소하고, await해서, 그 `except asyncio.CancelledError`에서
`CANCELLED`를, `finally`에서 `CLEANUP`을 출력하게 하세요. 마지막으로
`TIMEOUTS <k>`를 출력하세요.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for`는 어웨이터블을 기한을 두고 실행합니다. 기한이 지나면 안쪽 태스크를
**취소**하고 당신에게 `asyncio.TimeoutError`를 일으킵니다. 그 이름을 잡으세요
— 3.11 이상에서는 내장 `TimeoutError`이고 3.10에서는 아니지만,
`asyncio.TimeoutError`는 양쪽에서 맞습니다.

스타터는 `fetch`를 직접 await하므로 `WONG`이 꼬박 1초를 쓴 뒤 `OK`를 출력하고,
`watch`를 await하지 않고 취소하므로 루프가 닫히기 전에 태스크의 `except`와
`finally`가 실행될 기회를 얻지 못합니다. 취소된 태스크는 다음에 스케줄되어
안에서 `CancelledError`가 전달되기 전까지는 멈춘 것이 아닙니다. await하는
것이 그 차례를 주는 일입니다. `CancelledError`를 처리한 뒤에는 다시
일으키세요 — 삼키는 것이 태스크가 취소 불가능해지는 길입니다.
'''
hints = [
  "try 안에 asyncio.wait_for(fetch(stall, seconds), timeout=0.2), except asyncio.TimeoutError와 함께.",
  "watcher.cancel() 은 취소를 요청할 뿐입니다. `await watcher` 가 태스크에 except와 finally를 실행할 기회를 줍니다. 그것은 당신에게 CancelledError를 다시 일으키므로, 그것도 잡으세요.",
  "create_task 뒤의 await asyncio.sleep(0) 은 워처에게 실제로 시작할 한 차례를 줘서, 그냥 스케줄만 된 태스크가 아니라 돌고 있는 태스크를 취소하게 합니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "python.advanced.17.gil"
title = "GIL"
story = "SOGO 지하, 노점 열둘, 층 전체에 락 하나. 동시에 일어났어야 할 모든 일이 하나씩 차례로 일어났고, 합계는 아무것도 아닌 것으로 돌아왔다."
brief = '''
표준 입력은 정수 `k`와 `n`입니다.

`1..n`을 연속된 덩어리 `k`개로 나누고 — 덩어리 `i`는 `n*i//k + 1`부터
`n*(i+1)//k`까지, 양 끝 포함 — 각 덩어리를 자기 스레드에 주어 그 범위의
제곱 합을 구하게 하세요: CPU 위주 루프, 라이브러리 호출 없이. 모든 스레드는
자기 결과를 락 아래에서 **하나의 공유 합계**에 더하고, 자기 칸에도 기록합니다.
전부 join하세요. 덩어리마다 인덱스 순서로 `CHUNK <i> <sum>`을 출력한 뒤
`TOTAL <sum>`, 그다음 `THREADS <k>`를 출력하세요.

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

스타터는 타이밍과 아무 상관 없는 이유로 실패합니다. `work`는 합계를 반환하고
`main`은 `t.join()`을 모으는데, `join`은 타깃이 무엇을 반환했든 `None`을
돌려줍니다 — 스레드에는 반환값이 없습니다. 첫 `+=`가 `TypeError`입니다. 그것이
작은 버그입니다. 락 퀘스트에서 한 방식으로 고치세요: 공유 컨테이너, 갱신 주위의
`with lock:`, 그리고 정확히 한 스레드만 쓰는 덩어리별 칸.

큰 것은 보스이고, 당신이 고칠 수 있는 버그가 아닙니다. 이것을 `k = 4`,
`n = 4000000`으로 돌려 시간을 재고, 그다음 `k = 1`로 돌려 보세요. 걸리는
시간이 같습니다. CPython에는 **전역 인터프리터 락**이 있습니다: 어느 순간에도
파이썬 바이트코드를 실행하는 스레드는 하나이고, CPU 위주 스레드는 몇
밀리초마다 락을 내놓아 다른 스레드가 차례를 얻게 합니다. 코어 넷 위의 스레드
넷은 코어 하나에서 번갈아 제곱 합을 구하고, 거기에 전환 비용이 얹힙니다.
파이썬의 스레드는 기다리기 위한 것입니다 — 소켓을, 파일을, `sleep`을 — 기다리는
동안 락이 풀리고 동시성이 진짜가 되는 곳. CPU 작업의 답은 `multiprocessing`이나
`concurrent.futures.
ProcessPoolExecutor`이며, 이것들은 락이 따로 있는 별개의 인터프리터를 돌리고
인자를 복사하는 것으로 그 값을 치릅니다.

출력이 결정적인 이유는 덩어리가 인덱스로 출력되고 합계가 덩어리들의 합이지,
스레드가 끝난 순서가 아니기 때문입니다. `TOTAL`은 칸들을 합쳐서가 아니라 락
아래의 합계에서 출력하세요 — 락이 이 지도가 다루는 것이고, 둘은 일치해야
합니다.
'''
hints = [
  "join() 은 None을 돌려줍니다. work에 인덱스와 쓸 칸, 그리고 더해 넣을 락 걸린 딕셔너리를 주세요. 그것이 스레드에서 값이 나오는 방법입니다.",
  "전부 start, 그다음 전부 join, 그다음 출력. 스레드 안에서 출력하면 뒤섞이지만, join 뒤에 칸에서 출력하면 그럴 수 없습니다.",
  "n*(n+1)*(2n+1)/6 이 합계의 닫힌 식입니다. TOTAL을 그것과 한 번 대조하면 덩어리 경계가 맞는지 알 수 있습니다.",
  "큰 n에서 k=1과 k=4의 시간을 재 보세요. 둘이 같을 때, 당신은 GIL을 만난 것입니다. 그것은 이 퀘스트의 버그가 아닙니다. 이 프로그램의 다음 버전이 ProcessPoolExecutor인 이유입니다.",
]
