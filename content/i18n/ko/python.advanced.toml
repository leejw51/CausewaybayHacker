# of `content/python/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "python.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.threads"
title = "노점 열둘, 바닥 하나"
story = "12:30, SOGO 지하. 노점 열두 곳이 동시에 주문을 받고, 합계를 걷으러 온 심부름꾼은 아무도 적기 전에 게시판을 읽는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 `threading.Thread` 하나를 시작해서 그 제곱을 계산해 `results[i]`에
저장하게 하세요 — 각자의 칸이므로 두 스레드가 같은 자리에 쓰는 일은 없습니다.
모든 스레드를 `join`한 뒤 결과를 **인덱스 순서로** 한 줄에 하나씩 출력하고,
그다음 `THREADS <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

스레드는 아무것도 돌려주지 않습니다. `Thread(target=f)`는 `f`를 실행하고 그
반환값을 버립니다. 그래서 결과는 `join` 뒤에 메인 스레드가 읽을 수 있는 어딘가에
써 두어야 합니다. 스레드마다 칸 하나인 리스트가 그런 자리 중 가장 단순합니다:
모든 인덱스에 정확히 한 스레드만 쓰므로 잠글 것이 없습니다.

스타터의 스레드는 시작하자마자 전부 죽는데, 프로그램은 그래도 끝까지 가서
출력합니다. `args=` 없는 `target=square`는 `square()`를 빈손으로 호출하고,
`TypeError`는 스레드 안에 떨어져 표준 오류로 출력되고, `results`는 `None`으로
가득 찬 채 남습니다. 죽는 스레드는 자기만 데리고 갑니다 — stderr를 읽으세요.
아니면 영영 모릅니다.
'''
hints = [
  "Thread에 args=(i, v). 타깃은 square(*args) 로 호출되는데, 스타터는 아무것도 넘기지 않습니다.",
  "모든 스레드를 start한 다음, 모든 스레드를 join하세요. 같은 루프 반복 안에서 start와 join을 하면 맞긴 하지만 하나씩 차례로 돌아갑니다.",
  "results는 main의 지역 리스트를 붙잡은 클로저입니다. 중첩 함수는 같은 리스트를 보며, 그래서 join 뒤에 쓴 내용이 보이는 것입니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.lock"
title = "서랍 하나, 손 여덟"
story = "지하의 모든 노점이 푸드홀 사무실의 현금 서랍 하나에 돈을 넣는데, 마감 때 서랍은 비어 있고 노점마다 냈다고 맹세한다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 스레드 하나를 시작해서 **하나의 공유 합계**에 더하고 공유 히트 수를
하나 올리게 하세요. 전부 join한 뒤 `TOTAL <sum>`과 `HITS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

스타터는 결정적으로 `TOTAL 0`을 출력하고, 워커마다 stderr에 트레이스백을
남깁니다. 워커 안의 `total += value`는 main의 `total`을 건드리지 않습니다:
`int`는 불변이고, 거기에 `+=`를 하면 이름이 다시 묶이며, 함수 안에서 대입된
이름은 `nonlocal`이라고 말하지 않는 한 그 함수의 **지역** 변수입니다. 워커마다
자기 `total`을 만들어서, 더하고, 버린 것입니다.

고치는 방법은 워커들이 제자리에서 변경하는 컨테이너 — 원소 하나짜리 리스트나
작은 클래스 — **그리고 `Lock`**입니다. 후반부는 선택이 아닙니다. GIL은 한 번에
바이트코드 하나가 실행된다는 것만 보장합니다. `drawer[0] += value`는
바이트코드 셋(load, add, store)이고, load와 store 사이에 스레드가 바뀌면
갱신 하나를 잃습니다. 스레드 넷이 숫자 넷을 더할 때는 일어나지 않습니다.
새벽 2시에 마흔 개일 때 일어납니다.

`with lock:`은 락을 잡고 나가는 길에 풀어 줍니다. 예외로 나가는 길에도요.
'''
hints = [
  "스타터를 실행하세요: UnboundLocalError로 죽습니다. `total += value` 가 total을 pay의 지역 변수로 만들고, 존재하기도 전에 읽기 때문입니다. 그 오류가 진단의 전부입니다.",
  "딕셔너리나 리스트는 제자리에서 변경되므로 `drawer[\"total\"] += value` 는 모든 스레드가 공유하는 그 하나의 객체를 바꿉니다. `nonlocal total` 도 통하며, 그것이 또 하나의 정직한 답입니다.",
  "main에서 threading.Lock() 한 번, 읽고-고치고-쓰기 주위에 `with lock:`. GIL은 당신 데이터의 락이 아닙니다. 인터프리터의 락입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.queue"
title = "누가 창구를 닫나"
story = "로스트 구스 카운터는 모든 주문을 창구로 주방에 넘기는데, 마지막 주문 뒤에도 주방은 영영 오지 않을 다음 것을 기다리며 서 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

생산자 스레드 하나가 각 값에 10을 곱해 `queue.Queue`에 넣고, 그다음
**센티널**을 넣습니다. 메인 스레드는 센티널을 볼 때까지 큐에서 꺼내며 각 값을
출력하고 합계를 유지한 뒤, `SUM <total>`과 `CLOSED`를 출력합니다.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

`queue.Queue`에는 `close`가 없습니다. 큐 위의 어떤 것도 소비자에게 더 이상
없다는 것을 알릴 수 없습니다. 그것은 항목이어야 하고, 보통은 `None`입니다.
스타터는 그것을 절대 보내지 않으므로 `get()`은 기다릴 것이 없는데도 영원히
막히고, 러너가 시간 제한에서 프로그램을 죽입니다. 파이썬에는 교착 상태
감지기가 없습니다. 프로그램이 그냥 응답을 멈추는 것이고, 밖에서 보는 "행"이란
그런 모습입니다.

센티널은 생산자가 보냅니다. 절대 소비자가 아닙니다 — 스트림이 끝났다는 것을
아는 쪽이 끝내는 쪽입니다.
'''
hints = [
  "kitchen 끝에 한 줄: hatch.put(None).",
  "소비자는 이미 `is None` 을 검사하고 있습니다. 생산자가 보내지 않은 것을 기다리고 있었을 뿐입니다.",
  "값이 정당하게 None일 수 있다면 센티널은 비공개 객체입니다: SENTINEL = object(), `is` 로 비교합니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.thread-pool"
title = "짐꾼 여덟"
story = "SOGO 하역장에 상자 마흔 개, 짐꾼 여덟 명. 아무도 짐꾼 마흔 명을 원하지 않는다. 여덟 명이 한 번도 멈춰 서지 않기를 원한다."
brief = '''
표준 입력은 정수 `w`와 `n`, 그다음 값 `n`개입니다.

워커 `w`개짜리 `ThreadPoolExecutor`를 열고, 값마다 `(index, value * value)`를
돌려주는 작업 하나를 `submit`하고, `as_completed`로 결과를 모으세요. 인덱스로
정렬해서 `<index> <value>`를 한 줄에 하나씩 출력하고, 그다음 `WORKERS <w>`를
출력하세요.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

`submit`은 결과가 아니라 `Future`를 돌려줍니다. `as_completed`는 퓨처들을
**끝난** 순서로 — 풀이 내키는 대로의 순서로 — 돌려주고, `future.result()`가
값을 꺼내는 방법입니다 — 아니면 작업이 죽으면서 낸 예외를 다시 일으키는데,
그것이 이 메서드를 호출하는 또 하나의 이유입니다.

스타터는 퓨처를 그대로 출력합니다. 결과에 인덱스를 실어 보내는 것이 출력을
매번 같게 만드는 방법이고, 그것으로 정렬하는 것은 답의 첫 줄이 아니라 마지막
줄입니다.
'''
hints = [
  "스타터는 Future를 언패킹하다 죽습니다: `for index, value in sorted(results)` 는 튜플이 아닌 객체를 언패킹할 수 없습니다. 튜플은 future.result() 안에 있습니다.",
  "as_completed는 작업이 끝나는 대로 내놓습니다. 결과 안의 인덱스가 각각이 어디서 왔는지에 대한 유일한 기록입니다.",
  "with ThreadPoolExecutor(...) as pool: 은 나가는 길에 제출된 모든 작업을 기다리므로, 출력할 때 돌고 있는 것은 없습니다. pool.map 도 여기서 통하고 순서도 지켜 주지만, as_completed를 배우지 못하는 대가가 있습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.asyncio"
title = "async는 실제로 어디서 도는가"
story = "메이는 4년 동안 `async def`를 써 왔지만 그것을 굴리는 물건을 한 번도 본 적이 없다. 지하의 주문판에는 루프 하나가 있고 모든 노점이 그 위에서 차례를 기다린다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

이벤트 루프에 한 번 양보하고 — `await asyncio.sleep(0)` — 값의 두 배를
돌려주는 `async def double(value)`를 작성하세요. `n`개 전부를
`asyncio.gather`로 실행하고, 각 결과를 입력 순서로 출력한 뒤 `SUM <total>`과
`TASKS <n>`을 출력하세요.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`async def`를 호출해도 실행되지 않습니다. **코루틴 객체**를 만들어 돌려줄 뿐,
무언가가 await하기 전까지는 안의 어떤 것도 일어나지 않습니다. 스타터의
리스트는 await되지 않은 코루틴 셋이고, 파이썬은 stderr에 그렇게 말합니다 —
`RuntimeWarning: coroutine 'double' was never awaited` — 그리고 출력은
`<coroutine object double at 0x...>` 세 줄입니다.

`gather`는 코루틴들을 받아 하나의 루프에 전부 스케줄하고, 어떤 순서로 끝났든
**넘긴 순서대로** 결과를 돌려줍니다. 손으로 쓴 `await` 루프 대신 이것을 쓰는
이유가 바로 그것입니다: 루프는 맞지만 순차적이고, `gather`는 맞으면서
교차 실행됩니다.

여기에는 정확히 스레드 하나가 있습니다. `await`는 코루틴이 다른 코루틴이 쓸
수 있도록 루프에 스레드를 돌려주는 지점입니다. 아무것도 병렬로 돌지 않습니다.
멈출 수 있다고 말한 자리에서, **차례로** 돕니다.
'''
hints = [
  "await asyncio.gather(*coroutines) — 별표가 리스트를 인자로 펼치고, await가 그것들을 실행하는 것입니다.",
  "asyncio.run(...) 이 실행기입니다: 루프를 만들고, 코루틴 하나를 끝까지 실행하고, 루프를 닫습니다. 프로그램마다 맨 위에 하나 있습니다.",
  "gather는 인자 순서로 결과를 돌려줍니다. 끝나는 순서대로 필요하다면 그것은 asyncio.as_completed이고, 그때는 스레드 풀과 똑같이 인덱스를 직접 실어 날라야 합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "python.advanced.06.async-queue"
title = "누가 끝났다고 말하나"
story = "심부름꾼 셋이 지하의 주문 큐를 처리하고, 층 매니저는 큐가 비었다고 말하기를 기다린다. 큐는 절대 그렇게 말하지 않는다. 티켓 하나가 끝났다고 아무도 알려 주지 않았으니까."
brief = '''
표준 입력은 정수 `w`와 `n`, 그다음 값 `n`개입니다.

`(index, value)` 쌍을 `asyncio.Queue`에 넣으세요. 쌍을 꺼내서 `value * 10`을
`results[index]`에 쓰고 `task_done()`을 호출하는 것을 영원히 반복하는 소비자
태스크 `w`개를 시작하세요. 메인 코루틴은 `queue.join()`을 await한 뒤, 소비자를
취소하고, 결과를 인덱스 순서로 출력한 다음 `CONSUMERS <w>`를 출력합니다.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`queue.join()`은 `put`된 모든 항목에 짝이 되는 `task_done()`이 있었을 때
돌아옵니다. 스타터의 소비자는 그것을 절대 호출하지 않으므로 `join`은 영원히
기다리고, 루프에는 실행할 다른 것이 없고, 프로그램은 러너가 죽일 때까지
멈춥니다. 스레드 퀘스트와 같은 행, 다른 철자 — 그리고 고치는 것도 다시 한 줄,
소비자 쪽입니다.

소비자는 `while True` 루프입니다. join 뒤에 main이 취소하기 때문에 끝나며,
`queue.get()`에 멈춰 있는 태스크를 취소하는 것은 태스크를 멈추는 정상적이고
의도된 방법입니다. 취소된 태스크를 `gather(..., return_exceptions=True)`로
await해서 취소가 보고되지 않고 수거되게 하세요.
'''
hints = [
  "항목 하나를 처리할 때마다 queue.task_done(). join은 put과 task_done의 수를 맞춰 볼 뿐, 다른 것은 보지 않습니다.",
  "create_task는 await하지 않고 소비자를 스케줄합니다. main이 다음에 무언가를 await할 때 루프가 그것을 실행하는데, 그것이 join입니다.",
  "get()을 await하는 중에 취소된 태스크는 그 안에서 CancelledError가 일어나고, 그것이 while True를 끝냅니다. return_exceptions=True 는 gather가 그것을 당신에게 다시 던지지 않게 합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "python.advanced.07.context-managers"
title = "셔터는 어쨌든 내려온다"
story = "지하의 한 노점은 주문마다 셔터를 올리고 끝나면 내린다. 12:40에 잘못된 주문을 받은 노점은 그때부터 계속 열려 있다. 닫는 코드가 실패한 줄 뒤에 있었으니까."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <CENTS>` 형식의 줄 `n`개이며,
`CENTS`는 정수여야 합니다.

`contextlib.contextmanager`로, 들어갈 때 `OPEN <STALL>`을, 나올 때
`SHUT <STALL>`을 출력하는 컨텍스트 매니저 `opened(stall)`을 작성하세요 —
**본문이 예외를 냈든 아니든**. 그 안에서 센트를 파싱해 합계에 더하세요.
센트가 파싱되지 않는 줄은 셔터가 닫힌 뒤에 `BAD <STALL>`로 보고합니다.
마지막으로 `TOTAL <sum>`과 `REJECTED <k>`를 출력하세요.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager`는 제너레이터를 컨텍스트 매니저로 바꿉니다: `yield` 앞의
전부가 `__enter__`, 뒤의 전부가 `__exit__`입니다. 본문이 예외를 내면 그 예외는
**`yield` 지점에서 제너레이터 안으로** 던져지므로, 그 뒤의 코드는 `yield`가
`try`/`finally` 안에 있을 때만 실행됩니다. 스타터에는 `finally`가 없고,
`WONG`의 셔터는 영영 닫히지 않습니다.

클래스 철자 — `__enter__`와 `__exit__(self, exc_type, exc, tb)` — 는 같은
일을 더 많은 줄로 하고, `True`를 돌려줘서 예외를 삼킬 수 있습니다. 여기서는
삼키지 마세요. 호출자가 `BAD`를 출력하고 싶어 합니다.
'''
hints = [
  "try: yield / finally: print(SHUT). 그 finally가 모든 경로에서 실행되는 __exit__입니다.",
  "예외는 제너레이터를 통과해 with 문 밖으로 나가므로 main의 except가 여전히 그것을 봅니다 — 그래서 BAD가 SHUT 뒤에 출력되는 것입니다.",
  "with opened(stall) as x: 는 제너레이터가 yield하는 것을 묶습니다. 여기서는 아무것도 yield하지 않으며, 그래도 괜찮습니다.",
]

