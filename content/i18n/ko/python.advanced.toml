[[quest]]
id    = "python.advanced.16.duck-typing"
title = "꽥꽥 운다면"
story = "계란 노점에서 온 비닐봉지 하나. 그게 무엇인지는 아무도 묻지 않았다. 몇 개가 들었는지, 오리알이 들었는지, 하나씩 꺼내 볼 수 있는지를 물었다."
brief = '''
표준 입력은 공백으로 구분된 물건 한 줄, 그다음 찾을 단어 하나가 적힌 한 줄입니다.

물건을 `Bag`에 넣고 다음을 출력하세요:

1. `LEN <k>` — `len(bag)`으로
2. 물건들을 한 줄에 하나씩 — `for item in bag`으로
3. `HAS <WORD> YES` 또는 `HAS <WORD> NO` — `word in bag`으로
4. `LONGEST <item>` — `max(bag, key=len)`으로, 길이가 같으면 먼저 나온 것

```
input:  egg duckegg tofu
        duckegg
output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag`은 `list`를 상속하지 않고, 그럴 필요도 없습니다. `len`은 `__len__`을,
`for`는 `__iter__`를, `in`은 `__contains__`를 호출하고, `max`는 `__iter__`만
있으면 됩니다. 파이썬은 어떤 것이 *무엇인지* 절대 묻지 않습니다. 필요한 그
순간에, 그 메서드가 있는지를 묻습니다. 스타터에는 그중 하나도 없고, 첫 오류는
`TypeError: object of type 'Bag' has no len()`입니다.

`__contains__`는 선택입니다: 없으면 `in`은 순회하며 비교하는 방식으로
물러나는데, 맞긴 하지만 더 느립니다. 그래도 작성하세요. 면접관이 "컨테이너로
만들어 보세요"라고 할 때 뜻하는 것이 바로 그것입니다.
'''
hints = [
  "def __len__(self): return len(self._goods) — 한 줄짜리 메서드 셋.",
  "__iter__ 는 iter(self._goods) 를 돌려주면 됩니다. 제너레이터일 필요는 없지만, `yield from self._goods` 도 통합니다.",
  "max(bag, key=len) 은 길이가 같은 항목 중 첫 번째를 유지합니다. 그래서 샘플이 나중 것이 아니라 duckegg라고 하는 것입니다.",
]

