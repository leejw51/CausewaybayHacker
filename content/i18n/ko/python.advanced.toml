[[quest]]
id    = "python.advanced.07.context-managers"
title = "셔터는 어쨌든 내려온다"
story = "지하의 한 노점은 주문마다 셔터를 올리고 끝나면 내린다. 12:40에 잘못된 주문을 받은 노점은 그때부터 계속 열려 있다. 닫는 코드가 실패한 줄 뒤에 있었으니까."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <CENTS>` 형식의 줄 `n`개이며,
`CENTS`는 정수여야 합니다.

`contextlib.contextmanager`로, 들어갈 때 `OPEN <STALL>`을, 나올 때
`SHUT <STALL>`을 출력하는 컨텍스트 매니저 `opened(stall)`을 작성하세요 —
**본문이 예외를 냈든 아니든**. 그 안에서 센트를 파싱해 합계에 더하세요.
센트가 파싱되지 않는 줄은 셔터가 닫힌 뒤에 `BAD <STALL>`로 보고합니다.
마지막으로 `TOTAL <sum>`과 `REJECTED <k>`를 출력하세요.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager`는 제너레이터를 컨텍스트 매니저로 바꿉니다: `yield` 앞의
전부가 `__enter__`, 뒤의 전부가 `__exit__`입니다. 본문이 예외를 내면 그 예외는
**`yield` 지점에서 제너레이터 안으로** 던져지므로, 그 뒤의 코드는 `yield`가
`try`/`finally` 안에 있을 때만 실행됩니다. 스타터에는 `finally`가 없고,
`WONG`의 셔터는 영영 닫히지 않습니다.

클래스 철자 — `__enter__`와 `__exit__(self, exc_type, exc, tb)` — 는 같은
일을 더 많은 줄로 하고, `True`를 돌려줘서 예외를 삼킬 수 있습니다. 여기서는
삼키지 마세요. 호출자가 `BAD`를 출력하고 싶어 합니다.
'''
hints = [
