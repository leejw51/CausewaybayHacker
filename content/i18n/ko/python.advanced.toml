[[quest]]
id    = "python.advanced.10.functools"
title = "계산한 것을 기억하기"
story = "두부 노점은 점심 전까지 같은 두 숫자에서 같은 날의 가격을 만천 번 계산한다. 매번, 처음부터."
brief = '''
표준 입력은 `n k bits`입니다: 정수 둘과 이진 숫자로 된 문자열 하나.

네 줄을 출력하세요:

1. `FIB <fib(n)>` — `functools.lru_cache`로 메모이즈한 **재귀** `fib`에서
2. `PRODUCT <k!>` — `1..k`에 대해 `operator.mul`을 쓴 `functools.reduce`,
   `k = 0`이면 `1`이 나오도록 초깃값을 줘서
3. `BIN <value>` — `base=2`를 준 `int`의 `functools.partial`로 `bits`를 파싱
4. `MISSES <m>` — `fib.cache_info().misses`, 재귀가 실제로 본문을 실행한 횟수

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n`은 최대 `400`이므로 재귀는 파이썬의 프레임 한계 안에 머뭅니다. 캐시가
없으면 `fib(35)`는 약 3천만 번의 호출이고 `fib(90)`은 끝나지 않습니다.
캐시가 있으면 모든 `fib(i)`는 한 번만 실행되고 `MISSES`는 `n + 1`입니다.
`lru_cache`는 데코레이터이며, 인자가 해시 가능하기 때문에 동작합니다 — 리스트
인자는 첫 호출에서 `TypeError`를 냅니다.

`partial`은 함수 인자의 일부를 고정해 새 함수를 줍니다. `reduce`는 두 인자
함수를 시퀀스에 걸쳐 접습니다. 어느 것도 영리하지 않습니다. 둘 다 면접에서
물어봅니다.
'''
hints = [
  "def fib 위에 @functools.lru_cache(maxsize=None). 스타터가 마지막 줄에서 죽는 것은 평범한 함수에는 cache_info가 없기 때문입니다.",
  "functools.reduce(operator.mul, range(1, k + 1), 1) — 세 번째 인자가 시작 값이고, 빈 range가 1을 내놓게 하는 것이 그것입니다.",
  "functools.partial(int, base=2) 는 문자열을 받아 base=2를 스스로 공급하는 호출 가능 객체입니다. functools.cache 는 3.9 이상에서 lru_cache(maxsize=None) 과 같습니다. 어느 이름이든 괜찮습니다.",
]

