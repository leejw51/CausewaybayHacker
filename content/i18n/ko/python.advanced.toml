id    = "python.advanced.11.protocol"
title = "그릴 수만 있으면 된다"
story = "SOGO 지하 안내판은 노점과 카운터를 나열하는데, 둘은 서로 다른 프로그램이 찍어 내고, 안내판은 각각이 자기를 그릴 수 있다는 것만 알고 싶어 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 다음 중 하나인 줄 `n`개입니다

* `STALL <NAME> <AISLE>` — `<NAME> / A<AISLE>`로 렌더링
* `COUNTER <NUMBER>` — `COUNTER <NUMBER>`로 렌더링

메서드 `render()` 하나를 가진 `typing.Protocol`인 `Sign`을 선언하세요.
`Stall`과 `Counter`를 평범한 클래스로 — **`Sign`을 상속하지 않고** — 작성하고,
렌더링을 출력하는 함수 `show(sign: Sign)` 하나를 작성하세요. 모든 표지판을
출력한 뒤, `isinstance(x, Sign)`으로 센 `SIGNS <n>`과 `isinstance(x, Stall)`로
센 `STALLS <k>`를 출력하세요.

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

`Protocol`은 **구조적** 타입입니다: 클래스는 그렇다고 선언해서가 아니라
메서드를 가지고 있어서 그것을 만족합니다. 타입 검사기가 읽을 수 있는 이름이
붙은 덕 타이핑입니다. 실행 시점에 프로토콜은 `@runtime_checkable`로 표시되지
않는 한 아무것도 하지 않으며, 표시되면 `isinstance`가 이름으로 메서드가
있는지 검사합니다. 스타터의 `Sign`에는 그 데코레이터가 없고, `isinstance`는
예외를 냅니다:

```
TypeError: Instance and class checks can only be used with @runtime_checkable protocols
```

`show`는 실행 시점에 속성 조회로 디스패치합니다 — `sign.render()`는 객체가
가진 어떤 `render`든 찾아냅니다. 대신 고를 정적 디스패치는 없습니다. 파이썬에는
메커니즘이 하나뿐이고, 이것이 그것입니다.
'''
hints = [
  "class Sign(Protocol) 위에 @runtime_checkable, typing에서 임포트. 그것이 수정의 전부입니다.",
  "Stall도 Counter도 어디에서도 Sign을 언급하지 않습니다. render() 를 가짐으로써 만족하는 것이고, 구조적이라는 말이 뜻하는 것이 그것입니다.",
  "runtime-checkable 프로토콜에 대한 isinstance는 메서드가 존재하는지만 검사하고, 시그니처나 반환 타입은 검사하지 않습니다. 그것은 타입 검사기가 검사하고, 인터프리터는 절대 하지 않습니다.",
]

