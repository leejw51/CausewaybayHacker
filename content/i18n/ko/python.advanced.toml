# PYTHON LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/python/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "python.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.conversions"
title = "세 모양, 이름 하나"
story = "생선 노점의 장부는 가격을 글자로, 숫자로, 달러로 적어 두고서 셋 다 price라고 부른다."
brief = '''
한 줄을 읽으세요: 센트 단위의 금액이 숫자로 적혀 있습니다.

세 줄을 출력하세요:

1. 공백을 뗀 텍스트의 글자 수
2. 금액을 숫자로
3. 금액을 소수점 아래 정확히 두 자리의 달러로

```
input:  1234
output: 4
        1234
        12.34
```

금액은 음수가 아닙니다. **이름 하나**를 세 번 다시 묶어서 하세요 — `str`,
그다음 `int`, 그다음 다시 `str`. 파이썬은 이름 하나가 무엇이든 담고 마음을
바꾸도록 허용합니다. 그 대가는, 지금 `cents`가 무엇인지 알려 주는 것은 바로 위의
코드를 읽는 것뿐이라는 점입니다.

달러를 만들 때 `float`를 거치지 마세요. `1234 / 100`은 오늘은 `12.34`이지만
`0.1 + 0.2`는 매일 `0.30000000000000004`입니다. 정수 나눗셈과 나머지 연산이
두 부분을 정확하게 주고, `f"{cents % 100:02d}"`가 뒷부분을 채워 줍니다.
'''
hints = [
  "cents가 아직 문자열일 때의 len(cents) 가 첫 줄입니다.",
  "cents = int(cents) 는 제자리 변환이 아닙니다. 새 값을 옛 이름에 묶는 것입니다. 그 뒤로 문자열은 사라집니다.",
  "f-string 안의 :02d 는 너비 2, 0으로 채움, 십진수입니다. 5센트는 0.05이지 0.5가 아닙니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.control-flow"
title = "몇 번 통로"
story = "시장 통로 번호는 바닥에 칠해져 있고, 입구의 안내판은 각 통로에서 무엇을 파는지 알려 줘야 한다. 그런데 매번 번호만 적혀 있다."
brief = '''
정수 `n` 하나를 읽으세요. `1`부터 `n`까지의 모든 `i`에 대해 한 줄씩 출력하세요:

* `i`가 3과 5 둘 다로 나누어떨어지면 `FISHVEG`
* `i`가 3으로 나누어떨어지면 `FISH`
* `i`가 5로 나누어떨어지면 `VEG`
* 그 외에는 `i` 자체

그다음 `0`을 읽을 때까지 한 줄에 하나씩 정수를 계속 읽고, 그동안 읽은 0이 아닌
줄의 수를 `SKIPPED <k>`로 출력하세요.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

루프 두 개, 종류도 두 가지. 첫 번째는 시작하기 전에 몇 번 돌지 알고 있습니다:
`for i in range(1, n + 1)`. 두 번째는 모릅니다: `while True`에 `break`.
횟수는 무엇을 읽느냐에 따라 정해지니까요. 파이썬의 `range`는 끝 값 **앞에서**
멈추며, `range(1, n)`은 누구나 여기서 한 번은 저지르는 하나 차이 실수입니다.
'''
hints = [
  "둘 다인 경우를 먼저 검사하세요. 아니면 절대 걸리지 않습니다. 3과 5로 나누어떨어지면 15로 나누어떨어집니다.",
  "range(1, n) 은 n - 1에서 멈춥니다. 스타터에 그 버그가 있습니다. 샘플 출력이 한 줄 일찍 끝납니다.",
  "while True에 break는 파이썬이 출구가 중간에 있는 루프를 적는 방법입니다. do-while은 없습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.lists"
title = "줄 한가운데"
story = "SOGO 지하 로스트 구스 카운터 앞에 마흔 명이 줄을 선다. 카운터에서는 줄의 맨 앞과 맨 뒤만 보이고 그 사이는 하나도 보이지 않는다."
brief = '''
표준 입력은 첫 줄에 개수 `n`, 둘째 줄에 공백으로 구분된 정수 `n`개입니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 있는(둘을 제외한) 모든
값의 합. 값이 셋보다 적으면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]`이 가운데입니다. 슬라이스이고, **새 리스트**입니다 — 파이썬은
슬라이스할 때 복사합니다. Rust의 슬라이스나 Go의 서브슬라이스와는 다릅니다.
`nums[-1]`은 마지막 원소이고, 음수 인덱스야말로 파이썬에서 절대
`nums[len(nums) - 1]`을 쓰지 않는 이유입니다.

값이 하나면 `nums[1:-1]`은 비어 있고 그 `sum`은 `0`이므로, 다른 언어에서
필요한 방어 코드가 여기서는 공짜입니다. 알아 둘 만한 사실이고, 짐작하기보다
확인해 볼 만한 사실입니다.
'''
hints = [
  "nums[-1] 은 마지막 원소이고, nums[-2] 는 그 앞 원소입니다.",
  "nums[1:-1] 은 첫 번째와 마지막을 제외한 전부이고, 빈 슬라이스의 합은 저절로 0입니다.",
  "sys.stdin.read().split() 은 전체를 한 번에 읽고 아무 공백에서나 나누므로 줄바꿈은 상관없어집니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.strings"
title = "바이트는 글자가 아니다"
story = "SOGO 지하 안내판이 銅鑼灣을 3바이트에서 잘라 글자 하나와 물음표 하나를 찍는다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. UTF-8로 인코딩했을 때의 **바이트** 길이
2. **문자** 길이
3. 문자 순서를 뒤집은 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 문자가 들어 있을 수 있고, 그러면 앞의 두 숫자는 같지
않습니다. 파이썬의 `str`은 코드 포인트의 시퀀스이므로 `len`은 문자 수입니다.
바이트를 얻으려면 `.encode("utf-8")`로 직접 요청해야 하고, **그것**의 `len`이
다른 숫자입니다.

`s[::-1]`은 문자열을 뒤집습니다. 스텝이 `-1`인 슬라이스이며, 어떤 시퀀스에도
통합니다.
'''
hints = [
  "len(line) 은 문자 수입니다. len(line.encode(\"utf-8\")) 은 바이트 수입니다. 스타터는 틀린 쪽을 먼저 출력합니다.",
  "line[::-1] 이 뒤집기의 전부입니다. str을 슬라이스하면 str이 나옵니다.",
  "바이트 문자열을 뒤집으면 멀티바이트 문자가 반으로 잘리지만, str을 뒤집으면 그렇지 않습니다. str 안에는 바이트가 없으니까요.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.dicts"
title = "시장이 외치는 것"
story = "일곱 시의 보링턴 로드: 노점마다 뭔가를 외치고, 캐널 로드 쪽 끝의 안내판은 순위를 원한다."
brief = '''
표준 입력 전체를 읽어 공백 기준으로 나누세요.

서로 다른 단어마다 한 번씩 `<word> <count>`로 출력하되, 횟수 내림차순으로,
횟수가 같으면 단어 오름차순으로 정렬하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

딕셔너리는 삽입 순서를 기억하지만, 그것은 당신이 원하는 순서가 아닙니다.
`sorted`에 튜플을 돌려주는 `key`를 주면 첫 원소로 정렬하고 두 번째 원소로
동률을 가르며, 횟수에 음수를 붙이는 것이 한 필드는 내림차순으로, 다른 필드는
오름차순 그대로 두는 방법입니다.
'''
hints = [
  "스타터는 첫 단어에서 KeyError로 죽습니다: counts[word] += 1 은 쓰기 전에 읽는데, 읽을 것이 없습니다. counts.get(word, 0) 이 0을 채워 줍니다.",
  "sorted(counts.items(), key=...) 는 (word, count) 쌍을 요청한 순서로 줍니다. 딕셔너리 자체는 삽입 순서 그대로입니다.",
  "key=lambda item: (-item[1], item[0]) — 횟수 내림차순, 그다음 단어 오름차순, 튜플 하나로.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "python.advanced.06.sets"
title = "두 노점에 다 있는 것"
story = "통로 양쪽에 채소 노점이 하나씩. 젖은 바닥을 두 번 건너지 않고 어느 쪽에서든 살 수 있는 게 뭔지 알고 싶은 손님."
brief = '''
표준 입력 두 줄, 각 줄은 한 노점의 물건을 공백으로 구분한 것입니다. 한 노점이
같은 것을 두 번 적을 수 있으며, 그것은 한 번으로 셉니다.

세 줄을 출력하세요:

1. `BOTH` 뒤에 두 목록에 모두 있는 것 전부를 정렬해서 공백으로 구분 — 없으면
   `BOTH -`
2. `ONLY_A <k>`: 첫 목록에는 있고 둘째 목록에는 없는 것의 수
3. `ALL <k>`: 어느 한쪽에라도 있는 서로 다른 것의 수

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set`에는 중복도 순서도 없고, `&`, `-`, `|`가 세 가지 연산입니다. 집합에
`sorted`를 쓰면 리스트가 나오며, 집합을 정해진 순서로 출력하는 방법은 그것뿐입니다.
'''
hints = [
  "set(input().split()) 은 토큰에서 바로 집합을 만듭니다. 중복된 tofu는 들어오는 길에 사라집니다.",
  "a & b 는 교집합, a - b 는 차집합, a | b 는 합집합입니다. 각각의 len이 개수입니다.",
  "\" \".join(sorted(both)) 에는 문자열이 필요한데 — 이미 문자열입니다 — `if both else \"-\"` 가 빈 경우를 표현식 하나로 처리합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "python.advanced.07.functions"
title = "한 근에"
story = "보링턴 로드의 가격표는 따로 적혀 있지 않으면 전부 한 근 기준인데, 가격표 프린터는 매번 그것을 말해 달라고 고집한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 또는 `<NAME> <CENTS> <UNIT>`
형식의 줄 `n`개입니다.

`<NAME> $<dollars>/<unit>`을 소수점 아래 두 자리로 돌려주는
`tag(name, cents, unit="catty")`를 작성하고, 한 줄에 가격표 하나씩 출력하세요.

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

스타터의 `tag`에는 기본값이 없어서 토큰이 두 개인 줄에서 죽습니다:
`TypeError: tag() missing 1 required positional argument`. 기본 인자는
함수 계약의 일부입니다 — 호출하는 쪽이 무엇을 생략해도 되는지, 생략하면 무엇을
받는지를 말해 줍니다.

줄을 `.split()`으로 나누고, 센트를 변환한 뒤 조각들을 `tag(*parts)`로
넘기세요. `*`는 리스트를 위치 인자로 풀어 주므로, 원소 두 개짜리 리스트도 세
개짜리 리스트도 하나의 시그니처에 들어맞습니다.
'''
hints = [
  "def 줄에 unit=\"catty\". 그것이 수정의 전부입니다.",
  "기본값이 있는 매개변수는 없는 것들 뒤에 옵니다 — def tag(name, cents, unit=\"catty\") — 그리고 리스트나 딕셔너리인 기본값은 호출 사이에 공유되는데, 그것이 다음 면접 질문입니다.",
  "tag(*parts) 는 리스트를 펼칩니다. 조각이 두 개면 기본값이 세 번째를 채웁니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "python.advanced.08.exceptions"
title = "숫자가 아닌 줄"
story = "생선 노점의 저울이 무게를 한 열로 찍어 내는데, 그 한가운데에 누군가의 전화번호가 들어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수여야 합니다.

각 줄에 대해 값의 두 배를, 또는 파싱되지 않으면 `BAD <line>`을 출력하세요.
마지막으로 `SUM <total>`을 출력하세요. total은 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")`는 `ValueError`를 일으킵니다. 파이썬이 변환 실패를 알려 주는 방법은
그것뿐입니다 — `Result`도 없고 `(value, ok)`도 없습니다. 실패는 예외이고,
숫자를 기대했던 코드가 `try`/`except ValueError`로 그것을 어떻게 할지 말해야
합니다.

`Exception`이 아니라 **`ValueError`**를 잡으세요. 빈 `except:`는
`KeyboardInterrupt`와 당신 코드의 오타까지 삼켜 버리며, 프로그램이 조용히
실패하는 법을 배우는 길이 바로 그것입니다.
'''
hints = [
  "스타터는 xx에서 ValueError: invalid literal for int() with base 10 으로 죽습니다. 그 메시지가 당신이 잡을 예외입니다.",
  "try 블록은 작게 유지하세요: 실패할 수 있는 호출만 안에 넣고, print와 합계는 그 뒤에 둡니다.",
  "except 안의 continue는 그 줄에 대한 루프 본문의 나머지를 건너뛰므로, 잘못된 줄은 아무것도 더하지 않습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "python.advanced.09.comprehensions"
title = "보링턴 로드를 한 번에"
story = "알렉스는 for 루프 세 개면 된다고 한다. 통로는 한 사람 폭이고 바닥은 젖어 있다. 지나갈 기회는 한 번뿐이다."
brief = '''
표준 입력은 공백으로 구분된 정수 한 줄입니다.

세 줄을 출력하세요:

1. 짝수 값의 합 (없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로, 순서대로, 공백 하나로 이어서 — 없으면 `-`
3. 서로 다른 값의 개수

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

인덱스 루프가 아니라 컴프리헨션을 쓰세요: `sum` 안에 제너레이터 표현식, 둘째
줄에는 `if`가 붙은 리스트 컴프리헨션, 셋째 줄에는 집합 컴프리헨션. `if`는 끝에
붙어 걸러 내고, 앞의 표현식은 변환합니다.

`" ".join(...)`은 문자열을 원하므로 두 번째 컴프리헨션은 `v * 2`가 아니라
`str(v * 2)`를 만들어야 합니다. `TypeError: sequence item 0: expected str
instance, int found`는 누구나 이 줄에서 만나는 그 오류입니다.
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — 제너레이터 표현식이 유일한 인자일 때는 괄호를 더 칠 필요가 없습니다.",
  "[str(v * 2) for v in nums if v > 10] — 앞에서 변환하고 뒤에서 거릅니다.",
  "{v for v in nums} 는 집합 컴프리헨션입니다. set(nums) 도 같은 것이고 여기서는 어느 쪽이든 괜찮습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "python.advanced.11.sorting"
title = "순위판"
story = "시장 사무실은 매일 아침 가장 싼 초이삼을 게시하고, 직원은 목록 두 개와 연필로 손수 노점 순위를 매긴다."
brief = '''
표준 입력 두 줄: 첫 줄에 노점 이름들, 둘째 줄에 같은 순서로 센트 단위 가격들.

