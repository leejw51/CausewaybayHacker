`not a number`입니다. `price(text)`는 텍스트를 변환하며, 잡은 `ValueError`
**from**으로 `NotANumber`를 일으키고, 음수 무게를 거부하고, 그 외에는
`500 + 100 * kg`을 돌려줍니다.

