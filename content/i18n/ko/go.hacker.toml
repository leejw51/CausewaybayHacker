output: 4112
        UPDATES 3
```

**여기서 복잡도는 강제되며, 그렇게 만드는 데 꽤 공이 들었습니다.** 순진한 답
— 질의마다 범위를 도는 루프 — 은 질의당 `O(n)`이고, 컴파일러는 그 루프를
놀랄 만큼 빠른 것으로 바꿔 놓습니다. 작은 케이스는 그것을 잡지 못합니다.
그래서 큰 숨겨진 케이스는 `n = 500000, q = 4000000`이고, 거기서 순진한 답은
