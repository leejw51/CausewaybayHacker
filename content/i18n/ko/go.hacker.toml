```

이진 탐색 두 번, 또는 영리한 한 번. 어느 쪽이든, 선형 스캔은 다른 질문에 대한
답입니다.
'''
hints = [
  "피벗은 어떤 값이 그다음 값보다 큰 유일한 자리입니다. mid를 lo가 아니라 hi와 비교하세요.",
  "피벗 루프가 끝나면 lo == hi이고 그것이 가장 작은 값의 인덱스입니다. 회전되지 않은 목록은 0을 줍니다.",
  "각 절반은 그냥 정렬되어 있으므로, 두 번째 탐색은 최대 두 번 실행하는 보통의 이진 탐색입니다.",
]

