# GO LAND — HACKER, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/go/hacker.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.hacker"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.hacker.01.two-sum"
title = "요금 두 개"
story = "같은 방, 같은 첫 질문, 그리고 이번에는 Go로 해 달라고 한다."
brief = '''
첫 줄은 `n target`입니다. 둘째 줄은 정수 `n`개입니다.

합이 `target`이 되는 서로 다른 두 항목의 **1 기반** 인덱스 `i j`를 `i < j`인
`i j` 형태로 출력하세요. 되는 쌍이 여럿이면 두 번째 인덱스가 가장 작은 것을
고르고, 그래도 같으면 첫 번째 인덱스가 가장 작은 것을 고르세요. 되는 쌍이
없으면 `-1`을 출력하세요.

```
input:  4 9
        2 7 11 15
output: 1 2
```

여기 숨겨진 케이스는 작습니다: 속도가 아니라 동점 처리와 답 없음 케이스를
검사합니다. 그래도 문제는 여전히 선형 해법 — 한 번의 패스, 해시 맵 하나 —
입니다. 실제 `n`은 200000이고, 이 문제가 존재하는 이유가 중첩 루프를 걸러
내기 위해서이기 때문입니다. 이 네 케이스를 우연히 통과하는 답이 아니라,
문제가 요구하는 답을 쓰세요.
'''
hints = [
  "한 번의 패스. 각 값마다 target에서 그 값을 뺀 것이 이미 보였는지 맵에 물으세요.",
  "반복되는 값은 첫 인덱스만 기록하세요. 그것이 문제가 요구하는 동점 처리입니다.",
  "comma-ok 형태가 관용구의 전부입니다: i, ok := seen[k].",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.hacker.02.window"
title = "가장 짧은 구간"
story = "연속된 정류장 몇 개면 그 거리를 채우는가. 정류장 수를 원하고, 그다음 어디서 시작하는지를 원한다."
brief = '''
표준 입력은 정수 두 개 `n`과 `seed`입니다. 입력에 배열은 없습니다. **정확히**
이 생성기로, `uint64` 산술로 직접 만드세요. Go에서는 아무 절차 없이 그냥
감깁니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

s = (sum of all n values) / 2
```

이 나눗셈은 정수 나눗셈이고, 답이 항상 존재하는 이유이기도 합니다. 배열 전체는
만들어진 방식 그대로 `s`에 이릅니다.

합이 `s` 이상인 가장 짧은 연속 구간을 찾으세요. 그 길이를 출력하고, 그다음
1 기반 시작 인덱스를 출력하세요. 같은 길이의 구간이 여럿이면 가장 왼쪽 것을
택하세요.

```
input:  8 1
output: 3
        3
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`이고,
합은 `3330417819`, 따라서 `s`는 `1665208909`입니다. 인덱스 `3`에서 시작하는 세
값이 거기에 이르는 가장 짧은 구간입니다.

**이 과제는 복잡도를 강제합니다.** 숨겨진 케이스 하나가 `n = 500000`입니다.
시작 코드는 정직한 이차 해법입니다. 모든 시작점에서 합이 `s`에 이를 때까지 앞으로
걷는데, `s`가 전체 합의 절반이므로 그 걸음은 매번 약 `n / 2`개 원소만큼 깁니다.
`10^11` 규모의 덧셈이고, 5초 실행 제한에 대해 38초가 걸립니다. 양 끝이 오른쪽으로만
움직이는 방법은 `O(n)`이고 — 모든 원소가 한 번 더해지고 한 번 빠집니다 — 같은
케이스가 7밀리초에 돌아옵니다. 이 기계에서, 이 과제의 두 프로그램으로 측정한
값입니다.

케이스가 `200000`이 아니라 `n = 500000`인 이유는 안쪽 루프가 조기 탈출이 붙은 덧셈
하나뿐이고, 컴파일러가 바로 그런 것을 잘하기 때문입니다. `200000`에서는 이차 해법도
6초에 그쳐서 관문으로 삼기에는 제한에 너무 가깝습니다.

그 크기에서 합계는 약 `2.5 × 10^14`입니다. `int64`로 누적하세요. 이 64비트
빌드에서 Go의 `int`는 64비트라 그냥 `int`로도 넘어갑니다. 바로 그래서 그 습관은
컴파일러가 아니라 당신에게서 나와야 합니다.
'''
hints = [
  "누적 합을 유지하세요. 단계마다 nums[right]를 한 번 더하고 절대 다시 계산하지 마세요.",
  "가장 왼쪽 원소를 빼도 창이 여전히 s 이상인 동안 왼쪽에서 줄이세요.",
  "엄격히 더 짧은 구간일 때만 새 최선으로 기록하세요. 그래야 각 길이의 가장 왼쪽 것이 남습니다.",
]

