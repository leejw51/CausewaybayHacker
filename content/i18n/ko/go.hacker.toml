[[quest]]
id    = "go.hacker.06.rotated"
title = "감겨 도는 노선"
story = "아일랜드선 시간표가 엉뚱한 역에서 시작해 한 바퀴 감겨 있는데, 그래도 로그 시간 안의 조회를 원한다."
brief = '''
첫 줄은 `n target`입니다. 둘째 줄은 서로 다른 정수 `n`개입니다: 오름차순으로
정렬된 뒤 어떤 만큼(0일 수도 있음) 왼쪽으로 회전된 목록입니다.

`target`의 **1 기반** 인덱스를 출력하고, 없으면 `-1`을 출력하세요. 그다음
`PIVOT <p>`, 가장 작은 값의 1 기반 인덱스를 출력하세요.

```
input:  7 0
        4 5 6 7 0 1 2
output: 5
