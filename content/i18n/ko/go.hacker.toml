[[quest]]
id    = "go.hacker.04.islands"
title = "블록이 몇 개인가"
story = "화이트보드에 동네 평면도. 블록을 세고, 그다음 어느 것이 가장 큰지 말해 달라고 한다."
brief = '''
첫 줄은 `r c`입니다. 다음 `r`줄은 평면도입니다: `#`은 건물, `.`은 거리입니다.

두 `#` 칸이 위, 아래, 왼쪽, 오른쪽으로 맞닿아 있으면 같은 블록입니다. 대각선은
아닙니다.

블록이 몇 개인지 출력하고, 그다음 가장 큰 블록의 칸 수를 출력하세요. 빈
평면도는 `0`과 `0`입니다.

```
input:  4 5
        ##...
        ##...
        ..#..
        ...##
output: 3
        4
```

모든 칸을 한 번씩 걸으세요. 아직 방문하지 않은 `#`을 찾으면 거기서부터 큐로
블록 전체를 채우면서 세어 나가세요.
'''
hints = [
  "칸은 pop할 때가 아니라 push할 때 본 것으로 표시하세요. 아니면 큐에 여러 번 들어갑니다.",
  "여기서는 queue = queue[1:]도 괜찮은 dequeue입니다. 블록 하나가 끝나면 배킹 배열은 버려집니다.",
  "grid[r][c]는 문자열을 인덱싱하므로 바이트입니다. \"#\"이 아니라 '#'과 비교하세요.",
]

