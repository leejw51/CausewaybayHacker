[[quest]]
id    = "go.hacker.20.lis"
title = "가장 긴 오르막"
story = "다시 일 년치 일일 매출. 이번에는 나아지는 날들의 가장 긴 연속을 원하는데, 연속된 날일 필요는 없다."
brief = '''
표준 입력은 정수 두 개 `n`과 `seed`입니다. 입력에 배열은 없습니다. **정확히**
이 생성기로, `uint64` 산술로 직접 만드세요. Go에서는 아무 절차 없이 그냥
감깁니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007
```

**엄격하게 증가하는** 가장 긴 부분수열의 길이를 출력하세요. 순서는 지키지만 인접할
필요는 없습니다. 그다음 `TAILS <k>`, 더미 개수에서 읽어낸 같은 수를 출력하세요.

```
input:  8 1
output: 3
        TAILS 3
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`이고,
그 안의 `93944146 392341189 822192870`이 가장 긴 오르막 중 하나입니다.

**이 과제는 복잡도를 강제합니다.** 숨겨진 케이스 하나가 `n = 200000`입니다.
`O(n²)` 표 — 모든 값에 대해 앞의 모든 값을 되돌아보는 — 는 눈감고도 쓸 수 있어야
하는 답이고, 시작 코드가 바로 그것입니다. `2 × 10^10`번의 비교, 5초 실행 제한에
대해 39초입니다. 더미 방식은 각 길이마다 그 길이의 부분수열이 끝날 수 있는 가장
작은 값을 유지합니다. 언제나 정렬되어 있는 슬라이스이므로 새 값의 자리를 찾는 일은
이진 탐색입니다. 그것은 `O(n log n)`이고 같은 케이스를 11밀리초에 돌려줍니다. 이
기계에서, 이 과제의 두 프로그램으로 측정했습니다.

그 케이스의 답은 `881`, 대략 `2√n`입니다. 무작위 값 목록에서 가장 긴 오르막은 그
정도로 생겼고, 그 사실은 방 안으로 가져갈 만합니다. 면접관이 말해주기 전에 자기
출력이 헛소리가 아님을 아는 방법이니까요.
'''
hints = [
  "tails는 부분 수열이 아닙니다. 그 길이가 답이고, 그 내용은 가장 좋은 끝값들일 뿐입니다.",
  "엄격히 증가이므로 value 이상인 첫 tail을 교체합니다. 그래서 탐색 조건은 tails[mid] < value입니다.",
  "tails의 끝을 넘어 달려 나가면 이 값이 지금까지의 가장 긴 구간을 늘린다는 뜻입니다. append하세요.",
]

