  "`if cur.dist > dist[cur.node] { continue }`가 낡은 항목 건너뛰기입니다. 없어도 알고리즘은 여전히 옳지만 힙이 쓸모없는 항목으로 찹니다.",
  "생성기의 스패닝 트리 절반이 모든 노드가 도달 가능함을 보장하므로 inf 필터는 아무것도 제거하지 않습니다. 그래도 두세요. 도달 불가 노드 버전이 후속 질문입니다.",
