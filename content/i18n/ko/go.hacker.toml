— 모든 중심이 문자열 끝까지 달립니다 — 라서 맞는 답은 거기서 온전히 `O(n²)`을
하고도 약 0.1초에 끝납니다. 그것은 또한 `O(n³)` 답, 모든 부분 문자열을 확인해
각각 검사하기를 거부하는 것이기도 합니다: 그것은 5초 제한에 대해 20초가
