[[quest]]
id    = "go.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 클리어한 모든 지도는 홉을 셌다. 트램은 정류장이 몇 개인지 상관하지 않는다. 얼마나 걸리는지를 상관한다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 무방향 가중 간선 `m`개. **정확히**
