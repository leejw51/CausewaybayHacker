[[quest]]
id    = "go.hacker.07.anagrams"
title = "같은 글자들"
story = "글자가 뒤섞인 정류장 이름 한 페이지. 같은 이름인 것들끼리 묶어라."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 공백으로 구분된 소문자 단어 `n`개입니다.

서로 애너그램인 단어들을 묶으세요. 각 그룹을 한 줄에 출력하되, 그 단어들을
오름차순으로 정렬해 공백 하나씩으로 이어 붙이세요. 그룹은 첫 단어 기준
오름차순으로 정렬하세요. 그다음 `GROUPS <k>`를 출력하세요.

반복되는 단어는 그 그룹에 두 번 남습니다.

```
input:  6
        eat tea tan ate nat bat
output: ate eat tea
        bat
        nat tan
        GROUPS 3
```

키는 글자를 정렬한 단어입니다. 두 단어는 키가 같을 때 정확히 애너그램이고,
그것은 지금까지 본 모든 것과의 비교가 아니라 맵 조회입니다.
'''
hints = [
  "[]byte(word)에 sort.Slice를 걸고 string(...)으로 되돌리면 키가 나옵니다.",
  "groups[k]에 append하는 것은 없는 키에도 동작합니다. 슬라이스의 제로 값은 nil이고 append는 nil을 처리합니다.",
  "이어 붙인 줄들을 정렬하면 첫 단어로 정렬됩니다. 각 줄이 첫 단어로 시작하기 때문입니다.",
]

