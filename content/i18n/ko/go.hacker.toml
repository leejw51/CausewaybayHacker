만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 도달 가능한 모든 정류장까지의 최단 거리의 합을 출력하고(`0`
자신도 포함하며, 그것은 `0`입니다), 그다음 `MAX <the largest of them>`을
출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서 복잡도는 강제됩니다.** 숨겨진 케이스 하나가 `n = 100000`,
`m = 200000`입니다. 어느 쪽이든 다익스트라가 맞는 알고리즘입니다. 시계가
가르는 것은 우선순위 큐입니다. 최솟값을 찾으려고 방문하지 않은 모든 노드를
훑는 것은 `O(V²)` — `10^10`번의 비교이고, 5초 실행 제한에 대해 16초가
걸립니다. 이진 힙은 `O((V + E) log V)`로 만들고, 같은 케이스가 44밀리초에
돌아옵니다. 둘 다 이 기계에서, 이 과제에 실린 두 프로그램으로 측정한
값입니다: 시작 코드가 훑는 버전이고, 정답을 냅니다. 다만 세 배 늦게.

`{dist, node}` 슬라이스 위의 `container/heap`, `dist` 순서. decrease-key는
없고 필요하지도 않습니다: 개선된 거리를 새 항목으로 push하고, pop한 항목의
거리가 이미 기록한 것보다 나쁘면 건너뛰세요. 그 낡은 항목 건너뛰기가 사람들이
잊는 줄입니다.
'''
hints = [
