[[quest]]
id    = "go.hacker.09.linked-list"
title = "사슬"
story = "슬라이스 없이 해 달라고 한다. 노드를 가리키는 노드. 이 질문이 정말로 묻는 것이 그 모양이기 때문이다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개, 순서대로입니다.

그것들로 `*Node`의 단일 연결 리스트를 만드세요. 정답에 슬라이스는 없습니다.
그다음 세 줄을 출력하세요:

1. 뒤집은 리스트, 공백으로 구분
2. 가운데 노드의 값 (짝수 `n`이면 가운데 둘 중 두 번째)
