[[quest]]
id    = "go.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "체인 전체의 하루치 계산대 작업 사백만 건, 그 절반은 정정이고, 누군가 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만든 뒤 연산 `q`개를
