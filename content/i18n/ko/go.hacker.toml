[[quest]]
id    = "go.hacker.08.kth-largest"
title = "k번째로 큰 것"
story = "워밍업 라운드인데, 그래도 정렬이 아니라 힙을 원한다."
brief = '''
표준 입력은 정수 두 개 `n`과 `seed`입니다. 입력에 목록은 없습니다. **정확히**
이 생성기로, `uint64` 산술로 직접 만드세요. Go에서는 아무 절차 없이 그냥
감깁니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

k = n / 2 + 1
```

이 나눗셈은 정수 나눗셈이라 `n`이 아무리 작아도 `1 <= k <= n`입니다.

`k`번째로 큰 **값**을 출력하세요. 중복도 세므로 `3 3 1`에서 두 번째로 큰 값은
`3`입니다. 그다음 `HEAP <size>`, 끝났을 때 들고 있던 원소의 개수를 출력하세요.

```
input:  8 1
output: 189567123
        HEAP 5
```

`8 1`에 대해 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`이고
`k`는 `5`입니다. 가장 큰 다섯 개는 순서대로
`908834774 822192870 708211027 392341189 189567123`이므로, 답은 그 마지막 값이고
멈춘 시점에 다섯 개를 들고 있습니다.

**큰 케이스가 강제하는 것과 강제하지 않는 것.** 숨겨진 케이스 하나가 `n = 200000`이고
거기서 `k`는 `100001`입니다. 이 케이스는 목록 전체를 `k`번 훑어 최댓값을 계속 꺼내는
답을 거부합니다. 그것은 `O(nk)`, `2 × 10^10`번의 비교이고, 5초 실행 제한에 대해
45초이며, 시작 코드가 하는 일입니다. 반면 목록 전체를 정렬하는 답은 거부하지
**않습니다**. `n log n`은 빠르고 정렬은 여유 있게 통과합니다. 정렬을 썼다면 그렇다고
소리 내어 말하세요. 시계가 그것을 거부한 척하는 편이 더 나쁩니다.

면접관이 듣고 싶은 답은 **크기 k의 최소 힙**입니다. 각 값을 push하고, 힙이 `k`를
넘으면 pop하면, 마지막에 루트가 답입니다. `O(n log k)`이고 `n`이 아니라 `k`개를
들고 있으며, 큰 케이스를 25밀리초에 돌려줍니다. 두 수치 모두 이 기계에서, 이 과제의
두 프로그램으로 측정했습니다.

`container/heap`은 슬라이스 타입에 대한 다섯 개의 메서드입니다. `Len`, `Less`,
`Swap`, `Push`, `Pop`. `Push`와 `Pop`은 포인터 리시버를 받고 나머지 셋은 아닙니다.
그 비대칭이 시계 아래에서 모두가 틀리는 지점입니다.
'''
hints = [
  "Push와 Pop은 날것의 슬라이스 연산입니다. append하고 꼬리를 자르는 것. 체로 거르는 쪽은 heap.Push와 heap.Pop입니다.",
  "h.Push를 직접 호출하지 마세요. heap.Push(h, v)를 호출하세요. 아니면 힙 불변식이 복원되지 않습니다.",
  "루프가 끝나면 큰 k개 중 가장 작은 것이 인덱스 0에 있고, 그것이 전체에서 k번째로 큰 것입니다.",
]

