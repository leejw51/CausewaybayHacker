[[quest]]
id    = "go.hacker.05.brackets"
title = "어디서 깨졌나"
story = "프로젝터에 설정 파일이 떠 있고, 면접관은 깨졌느냐가 아니라 어느 글자가 깨뜨렸느냐를 묻는다."
brief = '''
`(`, `)`, `[`, `]`, `{`, `}`로만 이루어진 한 줄입니다.

모든 괄호가 올바른 순서로 같은 종류에 의해 닫히면 `VALID` 그다음 `0`을
출력하세요.

그렇지 않으면 `INVALID` 그다음 문제의 글자의 **1 기반 인덱스**를 출력하세요:

* 열려 있는 것과 맞지 않는 닫는 괄호 — 그 닫는 괄호 자신의 인덱스
* 열린 것이 없는데 나온 닫는 괄호 — 그 닫는 괄호 자신의 인덱스
* 줄 끝에서 아직 열려 있는 것 — 마지막으로 아직 열려 있는 괄호의 인덱스

```
input:  ([]{})
output: VALID
        0
```
'''
hints = [
  "각 여는 괄호의 글자가 아니라 인덱스를 push하세요. 보고하려면 인덱스가 필요합니다.",
  "닫는 괄호가 틀린 경우는 스택이 비어 있을 때, 또는 맨 위 인덱스의 글자가 짝이 아닐 때입니다.",
  "루프가 끝났는데 스택에 무언가 남아 있으면, 그 맨 위가 마지막으로 닫히지 않은 괄호입니다.",
]

