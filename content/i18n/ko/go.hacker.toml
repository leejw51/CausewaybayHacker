[[quest]]
id    = "go.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구는 문제 맨 아래에 나오고, 방의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. 질의 `q`개를 생성하세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

각 질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요.
`q`개 답의 합을 다시 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이므로, 계산한 뒤 줄이는 것이 아니라 모든
곱셈마다 그때그때 줄입니다. 문제는 나눗셈입니다: `a! / (b! (a-b)!)`는 모듈러
산술에서 의미가 없습니다. 그것을 대신하는 것이 **모듈러 역원**이고,
`1000000007`이 소수이므로 페르마의 소정리가 그것을 줍니다:
`inverse(v) = v^(p-2) mod p`, 약 30번의 제곱으로 하는 빠른 거듭제곱으로
계산합니다.

그러니: `factorial[0..n]`을 한 번 미리 계산하고, 각 질의에
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**여기서 복잡도는 강제됩니다.** 숨겨진 케이스 하나가 `n = 200000`,
`q = 200000`입니다. 각 계수를 독립적으로 계산하기 — 항 `b`개를 곱하고, 항
`b`개로 나누고, 각각 모듈러 역원 하나 — 는 5초 실행 제한 안에 끝나지
않습니다. 그것이 시작 코드입니다. 공유 팩토리얼 표 하나면 1초에 한참 못
미쳐 끝납니다. 둘 다 이 기계에서 측정한 값입니다.

모든 중간값은 `2^30` 미만인 두 값의 곱이므로 `int64`에 들어가고 아무것도
넘치지 않습니다. 여기서 Go의 `int`는 64비트지만, `int64`라고 쓰고 그것을
뜻하세요. 다른 곳에서 돌아가는 이 문제의 버전은 그렇게 너그럽지 않을
겁니다.
'''
hints = [
  "끝에서가 아니라 곱셈마다 줄이세요. int64는 P 미만인 두 값의 곱은 담지만, 팩토리얼은 담지 못합니다.",
  "inverse(v)는 power(v, P-2)이고, P가 소수이기 때문에만 동작합니다. 여기서 페르마의 소정리의 내용은 그게 전부입니다.",
  "inverse(factorial[n])에서 거꾸로 역팩토리얼도 미리 계산하면 질의당 power 호출 둘이 사라집니다. 통과에 필요하진 않지만 소리 내어 말할 가치가 있습니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "go.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "대나무 공사로 거리 셋이 막힌 배달 격자. 가로지르는 방법이 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자를 행 우선 순서로 직접 만들되, 칸마다
값을 **두 개** 뽑으세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

열린 칸을 통해 **오른쪽** 또는 **아래**로만 움직이세요. 출력:

1. `PATHS <k>` — `(0,0)`에서 `(r-1,c-1)`까지 서로 다른 경로가 몇 개인지,
   `1000000007`로 나눈 나머지
2. `MIN <cost>` — 양 끝점을 포함해 센 경로의 최소 총비용, 경로가 없으면 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

행 우선 순서로 한 번 훑으면 둘 다 됩니다: 한 칸의 경로 수는 위와 왼쪽에서
그 칸으로 들어오는 경로 수의 합이고, 최선 비용은 자기 비용에 그 둘 중 더 싼
것을 더한 것입니다. 오른쪽이나 아래로만 움직이므로 필요한 두 칸은 언제나
이미 끝나 있습니다. 재귀도, 방문 집합도 없습니다.

`PATHS` 개수가 `1000000007`로 나눈 나머지인 것은 늘 그렇듯 같은 이유입니다:
`1000 × 1000` 숨겨진 케이스에서 실제 수는 600자리가 넘습니다. 더할 때마다
줄이세요.

**큰 케이스가 강제하는 것:** 경로를 열거하는 모든 답을 거부합니다. 경로는
방 안의 원자보다 많습니다. 상향식 표와 메모이제이션 재귀는 구분하지
않습니다. 둘 다 칸 수에 선형이고 둘 다 넉넉히 통과합니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에 값을 두 개씩 뽑으세요. 생성기는 그 칸들을 건너뛰지 않고, 막기를 거부할 뿐입니다.",
  "위나 왼쪽에 열린 이웃이 없는 열린 칸은 경로 0개로 도달되고 최선 비용이 없습니다. inf가 `도달 불가`를 뜻하게 두고 덧셈을 막으세요.",
  "목적지가 열려 있어도 도달 불가일 수 있고, 정확히 그때 PATHS는 0이고 MIN은 -1입니다. 숨겨진 케이스 하나가 그것입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "go.hacker.34.stable-sort"
title = "동점은 제자리를 지킨다"
story = "라이더 둘이 같은 점수로 마쳤는데 리더보드가 다시 그릴 때마다 둘의 순서를 바꿔 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 라이더 `n`명을 만드세요. 라이더 `i`는
인덱스 `i`와 점수를 갖습니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

라이더를 점수 **내림차순**으로 정렬하세요. 같은 점수의 라이더는 도착한
순서를 유지해야 합니다. 그 인덱스를 공백으로 구분해 출력하고, 그다음
`TIES <k>` — 정렬된 순서에서 인접한 쌍 중 점수가 같은 것이 몇 개인지.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 전부가 동점이고, 답은 거의 전적으로 동점에 무슨
일이 일어나는지로 정해집니다.

**이것은 손에 쥔 정렬이 어느 것인지 아는 것에 대한 과제입니다.**
`sort.SliceStable`은 안정적입니다. 같은 원소는 상대적 순서를 유지합니다.
`sort.Slice`는 **아니고**, 실제 입력에서 눈에 띄게 그렇지 않을 겁니다: 패턴
방어 퀵소트이고, 보통 더 빠르며, 동점에 대해서는 어떤 약속도 하지 않습니다.
시작 코드가 그것을 쓰고, 숨겨진 케이스는 그것이 실증적으로 뒤섞어 놓을 만큼
큽니다. (`n = 8`에서는 우연히 그러지 않습니다. 그래서 작은 테스트로는
아무것도 증명하지 못했을 것이고, 그래서 여기서 작은 케이스는 당신을 판정하는
것이 아니라 *보이는* 것입니다.)

맞는 답은 둘이고 둘 다 말할 수 있어야 합니다. `sort.SliceStable`을 쓰세요.
**또는** `sort.Slice`를 유지하고 비교를 **전순서**로 만드세요. 점수가 같을 때
인덱스를 비교해서, 어떤 두 원소도 같다고 비교되지 않게 하면 안정성은 더
이상 문제가 아닙니다. 기본으로 손이 가야 할 것은 두 번째입니다. 순서가
완전히 명시되어 있으면 불안정 정렬이 증명할 것은 아무것도 없습니다.

현대적인 표기는 `slices.SortFunc`와 `slices.SortStableFunc`이며, 그 비교는
`bool` 대신 음수, 0, 양수를 돌려줍니다. `cmp.Compare`가 정확히 `-1`, `0`, `1`을
주는 것입니다. 리플렉션이 아니라 제네릭이므로 더 빠르고, 같은 안정성 구분이
같은 두 이름으로 적용됩니다. 둘 다 알아 두세요. 이 팩이 `sort`를 쓰는 것은
당신이 건네받을 대부분의 Go에서 읽게 될 것이 그것이기 때문입니다.
'''
hints = [
  "한 단어: sort.Slice를 sort.SliceStable로. 그것이 안정 정렬 답입니다.",
  "다른 답은 sort.Slice를 유지하고 점수가 같을 때 인덱스를 비교합니다. 전순서이므로 불안정할 동점이 남지 않습니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 개수는 둘 중 어느 것을 썼든 같습니다. 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "go.hacker.28.lru"
title = "시계"
story = "같은 방, 마지막 질문, 그리고 벽의 시계는 더 짧은 것으로 바꿔 단 그것이다."
brief = '''
첫 줄은 `cap q`입니다. 다음 `q`줄은 `PUT <key> <value>` 또는 `GET <key>`입니다.

꽉 찼을 때 **가장 오래 쓰이지 않은** 항목을 내보내는 고정 용량 캐시를
구현하세요. `GET`과 `PUT` 모두 키를 쓴 것으로 칩니다.

각 `GET`마다 값을 출력하고, 없으면 `-1`을 출력하세요. 끝에 살아남은 키를 가장
최근에 쓰인 것부터 공백으로 구분해 출력하고 — 캐시가 비어 있으면 `-` —
그다음 `EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

샘플을 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`이
자리를 필요로 할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은
맞고 `3`을 가장 최근 것으로 만드는데, 그래서 살아남은 것이 `3 1`로
출력됩니다.

교과서 답은 **이중 연결 리스트**로 들어가는 해시 맵이고, Go 표준
라이브러리에 하나 있습니다: `container/list`. `PushFront`, `MoveToFront`,
`Back`, `Remove` 모두 O(1)이므로 여기서 모든 연산이 O(1)이고, 얼버무리지 않고
그렇게 말할 수 있습니다. 맵은 `*list.Element`를 담고, 원소의 `Value`는 값과
함께 키도 담습니다. 내보내기는 리스트에서 시작하는데 어느 맵 항목을 지울지
알아야 하기 때문입니다.
'''
hints = [
  "원소의 Value가 키를 실어야 합니다. 아니면 뒤에서 내보낼 때 지울 맵 항목을 찾을 수 없습니다.",
  "이미 있는 키를 덮어쓰는 것은 내보내기가 아닙니다. 캐시가 꽉 찼다고 판단하기 전에 맵을 확인하세요.",
  "Front에서 Back으로 걷는 것이 이미 가장 최근 것부터이므로, 마지막 줄에는 정렬이 필요 없습니다.",
]
