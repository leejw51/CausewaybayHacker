hints = [
  "초기 값마다 Add를 한 번씩 호출해 트리를 만드세요. O(n) 상향식 구축은 좋은 최적화지만 시계가 검사하는 것은 아닙니다.",
  "i & -i는 가장 낮은 켜진 비트를 골라냅니다. 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "Range(l, r)는 Prefix(r+1) - Prefix(l)이고, 그 off-by-one 한 쌍을 맞추는 것이 디버깅의 대부분입니다.",
