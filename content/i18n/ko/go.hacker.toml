[[quest]]
id    = "go.hacker.03.intervals"
title = "교대 근무표"
story = "다시 럭키 맥 근무표. 질문은 여전히 실제로 어느 시간이 채워져 있느냐다."
brief = '''
첫 줄은 `n`입니다. 다음 `n`줄은 `start <= end`인 `<start> <end>`입니다.

겹치거나 맞닿는 모든 쌍을 병합하고, 결과를 오름차순으로 한 줄에 하나씩
`<start> <end>` 형태로 출력한 뒤 `COUNT <k>`를 출력하세요.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

맞닿는 것도 겹치는 것으로 칩니다: `1 4`와 `4 5`는 `1 5`로 병합됩니다.
'''
hints = [
  "먼저 start로 정렬하세요. 그다음에는 왼쪽에서 오른쪽으로 한 번 훑는 것으로 충분합니다.",
  "merged는 포인터가 아니라 구조체의 슬라이스이므로 merged[last].end는 주소를 취할 수 있습니다. 바로 대입하세요.",
  "두 끝 중 더 큰 쪽으로 늘리세요. 긴 구간 안의 짧은 구간이 그것을 줄여서는 안 됩니다.",
]

