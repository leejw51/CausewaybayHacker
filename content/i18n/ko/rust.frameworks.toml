        sogo 12502
        tsui-wah 700
output: 1 LUCKY-MAC 3804 57
        2 SOGO 12502 187
        3 TSUI-WAH 700 10
        TOTAL 17006 254
```

메인 함수는 `#[tokio::main] async fn main()`입니다. 모든 `JoinHandle`을
