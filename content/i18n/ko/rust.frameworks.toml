# of `content/rust/frameworks.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.frameworks"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.frameworks.01.anyhow-context"
title = "물음표 하나"
story = "결제 경로로 돌아온 첫날 아침. 글로스터 로드의 정산 리더가 4,000줄짜리 파일의 3번째 줄에서 죽으면서 하는 말은 'invalid digit found in string'뿐이다."
brief = '''
표준 입력에서 `<ACCOUNT> <CENTS>` 형식의 줄들을 읽어 센트 단위 합계를
`TOTAL <n>`으로 출력하세요.

어떤 줄이 두 필드가 아니거나 센트가 `i64`로 파싱되지 않으면, 대신 다음
한 줄을 출력하고 정상 종료하세요:

```
ERROR: line 3: invalid digit found in string
```

이것은 컨텍스트 한 겹이 붙은 에러를 `anyhow`가 스스로 렌더링한
모양입니다: `format!("{:#}", err)`가 컨텍스트, 콜론, 원인을 차례로
출력합니다. 컨텍스트는 `line <n>`(1부터 셈)입니다. 에러인 경우 그 외에는
아무것도 출력하지 않습니다.

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

실제 일을 하는 함수의 반환 타입은 `anyhow::Result`로, 전파는 `?`로, 어느
줄인지는 `.with_context(|| ...)`로 말하세요. 스타터는 unwrap하고
패닉하는데, 그러면 스택 트레이스가 찍히고 101로 종료됩니다 — 현장의
누구도 읽을 수 있는 메시지가 아닙니다.
'''
hints = [
  "`use anyhow::{Context, Result};` — `Result<T>`는 `Result<T, anyhow::Error>`이고, `?`는 어떤 `std::error::Error`든 그것으로 변환합니다.",
  "`.with_context(|| format!(\"line {n}\"))`는 `Result`에도 *그리고* `Option`에도 됩니다(`Option`은 그 메시지를 가진 에러가 됩니다). `?` 앞에 붙이세요.",
  "`anyhow::Error`에 `{:#}`를 쓰면 `context: cause`를 한 줄로 출력하고, 그냥 `{}`는 가장 바깥 컨텍스트만 출력합니다.",
  "필드가 빠진 것은 파싱 에러가 아니라 `None`입니다: `.ok_or_else(|| anyhow!(\"missing amount\"))`로 에러로 바꾸고 똑같은 `line n` 컨텍스트를 주세요.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.frameworks.02.thiserror-enum"
title = "이름이 있는 에러"
story = "이체 서비스는 모든 거절에 똑같은 문자열 'bad transfer'로 답하고, 두 층 위의 지원 데스크는 어느 종류냐고 엔지니어에게 전화를 걸기 시작했다."
brief = '''
계좌 둘, `A`와 `B`가 첫 줄의 잔액으로 시작합니다. 둘째 줄은 `n`, 그다음
이체 `n`개가 `<FROM> <TO> <CENTS>`로 옵니다.

순서대로 적용하세요. 각 이체마다 `OK <FROM> <TO> <CENTS>`를 출력하거나,
에러를 출력하세요 — 에러는 배리언트 세 개짜리 `thiserror` enum이고, 그
`Display`는 정확히 다음과 같습니다:

* `unknown account X` — `FROM`이나 `TO`가 `A`도 `B`도 아님(`FROM`을 먼저
  검사)
* `insufficient funds in A: need 300, have 100`
* `nothing to move` — 금액이 0 이하

이체가 끝나면 `A <balance>`와 `B <balance>`를 출력하세요.

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

enum에 `#[derive(Debug, thiserror::Error)]`를 달고, 각 메시지를 그
배리언트의 `#[error("...")]` 속성에 넣되 필드를 보간하세요 — 튜플
배리언트는 `{0}`, 이름 있는 필드는 `{need}`. `transfer`는
`Result<(), TransferError>`를 돌려주고, `main`은 `{}`로 출력합니다.
스타터는 로직은 갖고 있지만 모든 것에 `bad transfer`를 출력합니다.
'''
hints = [
  "enum에 `#[derive(Debug, thiserror::Error)]`, 각 배리언트에 `#[error(\"...\")]` — 이것이 `impl Display`와 `impl std::error::Error`의 전부입니다.",
  "속성 안의 `{0}`은 튜플 배리언트의 첫 필드이고, `{need}`와 `{have}`는 구조체 배리언트의 이름 있는 필드입니다.",
  "금액보다 계좌 이름 둘을 먼저, 그리고 `TO`보다 `FROM`을 먼저 검사하세요: 히든 케이스는 `C B 0`을 보내고, 어느 에러가 이기는지는 과제에 적혀 있습니다.",
  "시그니처가 `Result<(), TransferError>`로 바뀌고, `main`의 `println!(\"{e}\")`가 속성의 텍스트를 출력합니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.frameworks.03.serde-derive"
title = "선을 타고 오는 모양"
story = "이워 스트리트의 카드 단말기들은 주문을 JSON으로 올린다. 옛 리더는 쉼표를 세어 금액을 찾았고, 이름에 쉼표가 든 가맹점은 계속 엉뚱한 열로 돈을 받아 왔다."
brief = '''
표준 입력은 주문들의 JSON 배열 하나입니다. 각 주문은 `"id"`(숫자),
`"merchant"`(문자열), `"cents"`(숫자)를 가진 객체입니다.

주문마다 들어온 순서대로 `<id> <merchant> <cents>` 한 줄씩 출력한 뒤
`TOTAL <sum of cents>`를 출력하세요.

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

그 세 필드를 가진 `struct Order`를 정의하고 `#[derive(Deserialize)]`를
단 뒤, 읽기는 `serde_json::from_str::<Vec<Order>>`에 맡기세요. 스타터는
쉼표로 나눕니다. 객체의 키는 어떤 순서로 와도 되고 공백도 얼마든지 있을
수 있으며, 문자열에는 쉼표가 들어 있을 수 있습니다 — 그것이 핵심입니다.
'''
hints = [
  "`use serde::Deserialize;`와 구조체에 `#[derive(Deserialize)]` — 필드 이름이 JSON 키이고, 타입이 각 값이 무엇이어야 하는지를 말합니다.",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` — 왼쪽의 타입이 serde에게 무엇을 만들지 알려 줍니다.",
  "키 순서와 공백은 JSON의 일이지 당신의 일이 아닙니다. serde는 그 세 키를 가진 객체라면 무엇이든 읽습니다. 출력은 이전과 같은 루프입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.frameworks.04.serde-attributes"
title = "은행이 읽는 것"
story = "은행은 이워 스트리트의 정산 파일을 일주일에 두 번 반송한다: 승인된 적 없는 카드가 모두 `\"authCode\":null`로 나가고, 수수료를 올리지 않는 단말기 하나가 파일이 쓰이기도 전에 리더를 멈춰 버린다."
brief = '''
표준 입력은 단말기에서 온 정산 레코드들의 JSON 배열 하나입니다. 각
레코드는 `"terminalId"`(문자열), `"merchant"`(문자열),
`"amountCents"`(숫자)를 갖고, `"feeCents"`(숫자)와
`"authCode"`(문자열)는 있을 수도 없을 수도 있습니다. 키는 어떤 순서로
와도 됩니다.

레코드마다 입력 순서대로 한 줄씩 출력하세요: 은행이 원하는 모양의
레코드를, `serde_json::to_string`의 압축 JSON으로, 키는 이 순서와 이
철자 그대로 — `terminalId`, `merchant`, `amountCents`, `feeCents`,
`authCode`. 빠진 `feeCents`는 `0`으로 쓰고, 빠진 `authCode`는
**빼 버리며**, 절대 `null`로 쓰지 않습니다. 그다음
`NET <sum of amountCents minus feeCents>`를 출력하세요.

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

구조체 하나가 양방향을 다 합니다: snake_case 필드에
`#[derive(Serialize, Deserialize)]`, 구조체에
`#[serde(rename_all = "camelCase")]`, `fee_cents`에 `#[serde(default)]`,
그리고 `auth_code: Option<String>`에
`#[serde(skip_serializing_if = "Option::is_none")]`. `to_string`은
구조체가 선언한 순서대로 필드를 쓰므로 출력이 정확히 맞습니다. 스타터는
필드마다 손으로 이름을 바꾸고, 수수료 없는 레코드를 읽지 못하며,
`null`을 씁니다.
'''
hints = [
  "`use serde::{Deserialize, Serialize};` — 구조체 하나에 derive 둘. 구조체의 `#[serde(rename_all = \"camelCase\")]`가 필드마다 붙이던 `rename`을 전부 대신합니다.",
  "`fee_cents: i64`의 `#[serde(default)]`는 빠진 키를 `i64::default()`, 즉 `0`으로 채웁니다. 이것이 없으면 수수료 없는 레코드는 역직렬화 에러입니다.",
  "`Option<String>`은 빠진 키를 이미 `None`으로 읽습니다. `#[serde(skip_serializing_if = \"Option::is_none\")]`가 필요한 쪽은 *쓰기*이고, 없으면 `null`로 직렬화됩니다.",
  "`serde_json::to_string(record)`는 구조체의 필드 순서대로 압축 JSON을 줍니다. 레코드마다 한 줄씩 `println!`하세요.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.frameworks.05.json-value-walk"
title = "잎 하나에 한 줄"
story = "퍼시벌 스트리트의 새 단말기 업체가 아무도 구조체를 써 두지 않은 중첩 객체를 올리는데, 지원 데스크는 그 안에 무엇이 들었는지 구조체가 나온 뒤가 아니라 오늘 보고 싶어 한다."
brief = '''
표준 입력은 최상위가 객체 또는 배열인 JSON 문서 하나입니다. 모든
잎(leaf) 값을 `<path> = <value>`로 한 줄에 하나씩 출력하세요.

* 객체의 키는 **정렬된 순서**로 방문합니다(키의 바이트 순서 —
  `serde_json::Value::Object`가 순회하는 바로 그 순서). 배열의 요소는
  인덱스 순서입니다.
* 경로는 키를 `.`로 이은 것이고, 배열 인덱스는 `[i]`입니다:
  `terminal.id`, `orders[0].cents`, 루트 배열 안의 배열이면 `[1][0]`.
  키에는 점이나 괄호가 들어 있지 않습니다.
* 문자열은 따옴표 없이 출력합니다. 숫자, `true`, `false`, `null`은
  JSON이 쓰는 그대로 출력합니다(`1.5`는 `1.5`로, `null`은 `null`이라는
  단어로).
* 빈 객체나 빈 배열에는 잎이 없으므로 아무것도 출력하지 않습니다.

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

`serde_json::from_str::<serde_json::Value>`로 파싱하고, `Value::Object`,
`Value::Array`, 그리고 나머지를 match하는 재귀 함수
`walk(path: &str, value: &Value)`를 작성하세요. 스타터는 최상위만 훑어서
거기서 찾은 것을 그대로 출력하므로, 중첩 객체는 JSON 한 줄로 나오고 루트
배열은 패닉입니다.
'''
hints = [
  "`use serde_json::Value;`와 `let doc: Value = serde_json::from_str(&input)?;` — `Value`는 enum입니다: `Null`, `Bool`, `Number`, `String`, `Array(Vec<Value>)`, `Object(Map<String, Value>)`.",
  "재귀가 경로를 들고 갑니다: `fn walk(path: &str, value: &Value)`. 객체에서는 `for (key, child) in map`이 이미 정렬된 키 순서이고, 배열에서는 `iter().enumerate()`가 인덱스를 줍니다.",
  "경로는 한 단계에 한 조각씩 자랍니다: `path`가 비어 있지 않으면 `format!(\"{path}.{key}\")`(비어 있으면 키만), 인덱스는 `format!(\"{path}[{i}]\")`.",
  "`Value::String(s) => println!(\"{path} = {s}\")`가 문자열을 따옴표 없이 출력하고, `other => println!(\"{path} = {other}\")`는 `Value`의 자체 `Display`, 즉 압축 JSON을 씁니다 — `null`, `true`, `1.5`.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.frameworks.06.toml-config"
title = "서비스 설정 파일"
story = "글로스터 로드의 정산 서비스는 설정 테이블을 손으로 인덱싱하고, 두 번째 `[[upstream]]`이 첫 번째를 덮어썼다. 화요일 이후의 모든 정산은 폴백으로 갔다."
brief = '''
표준 입력은 TOML로 적힌 서비스 설정입니다:

* 최상위: `name`(문자열, 필수), `port`(정수, 기본값 `8080`)
* 테이블 `[limits]`(필수): `max_cents`(정수, 필수), `retries`(정수,
  기본값 `3`)
* 테이블 배열 `[[upstream]]`, 0개 이상, 각각 `name`과 `url`(문자열,
  필수), `timeout_ms`(정수, 기본값 `1000`)

요약을 출력하세요 — `SERVICE` 한 줄, `LIMIT` 한 줄, 그다음 테이블마다
파일 순서대로 `UPSTREAM` 한 줄:

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

입력이 유효한 TOML이 아니거나 그 모양이 아니면(필수 키가 빠졌거나 값의
타입이 틀렸으면), 유일한 줄로 정확히 `ERROR: config rejected`를 출력하고
정상 종료하세요. toml 자체의 메시지는 출력하지 마세요.

모양을 구조체로 기술하세요 — `Config`, `Limits`, `Upstream`, 각각
`#[derive(Deserialize)]`, 기본값은 `#[serde(default)]` 또는
`#[serde(default = "fn_name")]` — 그리고
`toml::from_str::<Config>(&input)`으로 읽어 `Result`에 match하세요.
스타터는 `toml::Table`을 읽어 인덱싱하는데, 완전한 파일에서는 동작하고
그 밖의 모든 것에서는 패닉합니다.
'''
hints = [
  "`use serde::Deserialize;` — toml은 serde_json과 같은 serde 포맷이므로 `toml::from_str::<Config>(&input)`은 똑같은 종류의 derive된 구조체를 만듭니다. `[table]`은 구조체 필드이고, `[[array_of_tables]]`는 `Vec<Struct>` 필드입니다.",
  "타입의 `Default`가 아닌 기본값은 함수입니다: `#[serde(default = \"default_port\")]`와 `fn default_port() -> u16 { 8080 }`. `Vec`에 붙인 그냥 `#[serde(default)]`는 빠진 `[[upstream]]`을 빈 목록으로 만듭니다.",
  "`toml::from_str`은 `Result<Config, toml::de::Error>`를 돌려줍니다. 빠진 필수 키, 틀린 타입, 문법 에러가 모두 `Err`에 떨어집니다. 거기에 match해서 당신의 줄을 출력하세요 — 에러를 `{}`로 찍지는 절대 마세요.",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.frameworks.07.clap-derive"
title = "플래그 한 줄"
story = "정산 서버의 운영 도구는 `--limit`를 받는데, 글로스터 로드 데스크의 누군가가 `--limti 50`이라고 쳤다. 도구는 그것을 배치 이름으로 알고 전체를 상대로 돌았다."
brief = '''
`settle`은 다음을 가진 명령줄 도구입니다:

* 필수 위치 인자 `BATCH` 하나(문자열)
* `--limit <N>`, 부호 없는 정수, 기본값 `100`
* `--dry-run`, 플래그

하네스는 인자를 넘기지 않으므로 명령줄은 표준 입력에서 옵니다: 비어 있지
않은 줄 하나가 명령줄 하나이고, 공백으로 나뉘며, 도구 자체의 이름은 줄에
없습니다. 각 줄마다 한 줄을 출력하세요:

* 성공이면 `batch=<BATCH> limit=<N> dry-run=<true|false>`
