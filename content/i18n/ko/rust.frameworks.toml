[[quest]]
id    = "rust.frameworks.08.clap-subcommands"
title = "동사 셋, 도구 하나"
story = "글로스터 로드 정산 서버의 운영 도구는 첫 단어에서 갈라지는 if 분기 셋으로 `pay`, `refund`, `balance`를 키웠다. `refudn`은 마지막 분기로 떨어졌고, 데스크는 거절을 기대한 자리에서 잔액을 읽었다."
brief = '''
`till`은 서브커맨드 세 개를 가진 명령줄 도구입니다:

* `pay <TO> <CENTS>` — `TO`는 문자열, `CENTS`는 부호 없는 정수.
  `PAY <CENTS> to <TO>`를 출력
* `refund <ID> [--reason <WORD>]` — `REFUND <ID>`를 출력하거나, 사유가
  주어지면 `REFUND <ID> because <WORD>`
* `balance [ACCOUNT]` — `ACCOUNT`의 기본값은 `main`.
  `BALANCE <ACCOUNT>`를 출력

전과 같이 하네스는 인자를 넘기지 않습니다: 표준 입력의 비어 있지 않은 줄
하나가 명령줄 하나이고, 공백으로 나뉘며, 도구 이름은 없습니다. 명령줄
하나에 출력 한 줄입니다. 실패하면 `ERROR: ` 뒤에 clap의 `ErrorKind`의
`Debug` 형태를 출력하세요: 모르는 첫 단어는 `ERROR: InvalidSubcommand`,
위치 인자가 빠진 서브커맨드는 `ERROR: MissingRequiredArgument`, 정수가
아닌 `CENTS`는 `ERROR: ValueValidation`, 그 서브커맨드에 없는 옵션은
`ERROR: UnknownArgument`.

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

`#[command(subcommand)]`로 표시한 필드 하나를 가진 구조체에
`#[derive(Parser)]`를 쓰고, 그 필드의 타입은 `#[derive(Subcommand)]`를
단 enum으로 하세요. 각 배리언트의 필드가 그 서브커맨드의 인자이고,
배리언트 이름을 소문자로 쓴 것이 줄의 단어입니다. `help`가 네 번째
동사가 되지 않도록 구조체에
