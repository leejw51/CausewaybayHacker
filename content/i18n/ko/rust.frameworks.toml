[[quest]]
id    = "rust.frameworks.10.chrono-settlement"
title = "다음 영업일"
story = "타임스 스퀘어 단말기들의 금요일 카드 배치가 토요일 날짜로 글로스터 로드의 은행에 갔는데, 은행은 토요일에 열지 않는다. 정산 캘린더는 손으로 쓴 월별 표이고, 그 안의 2월은 매년 28일이다."
brief = '''
표준 입력의 각 줄은 `YYYY-MM-DD` 형식의 거래일(value date)입니다. 빈
줄은 무시합니다. 날짜마다 한 줄을 출력하세요:

```
<value date> -> <settlement date> +<days>
```

여기서 정산일은 거래일 **다음**의 첫 월~금요일이고(금요일은 월요일에,
토요일은 월요일에, 일요일은 월요일에 정산됩니다), `<days>`는 두 날짜
사이의 달력상 일수이며, 두 날짜 모두 `%d %b %Y %a` — `03 Oct 2026 Sat` —
로 출력합니다.

그 형식의 실제 날짜가 아닌 줄 — `2026-13-01`, `2026-02-29`,
`2026-04-31`, `yesterday` — 은 줄의 텍스트를 트림해서
`ERROR: bad date <line>`을 출력하고, 프로그램은 다음 줄로 넘어갑니다.

```
input:  2026-10-02
        2026-10-03
        2026-10-07
        2026-13-01
output: 02 Oct 2026 Fri -> 05 Oct 2026 Mon +3
        03 Oct 2026 Sat -> 05 Oct 2026 Mon +2
        07 Oct 2026 Wed -> 08 Oct 2026 Thu +1
        ERROR: bad date 2026-13-01
```

`chrono::NaiveDate`를 쓰세요: 읽기는 `parse_from_str`, 검사는
`weekday()`, 하루 전진은 `checked_add_days`, 간격은
`signed_duration_since(...).num_days()`, 출력은 `format`. 시계는 절대
읽지 마세요. 스타터는 자기만의 월별 표와 자기만의 요일 공식을 갖고
있는데, 그중 하나가 윤년에 틀립니다.
'''
hints = [
  "`use chrono::{Datelike, Days, NaiveDate, Weekday};` — `weekday()`는 `Datelike` 트레이트에서 오므로, 그 import가 없으면 존재하지 않습니다.",
  "`NaiveDate::parse_from_str(text, \"%Y-%m-%d\")`는 `Result`입니다. `yesterday`뿐 아니라 `2026-02-29`와 `2026-04-31`에도 `Err`이므로, `match` 하나로 모든 잘못된 줄을 처리합니다.",
  "`!matches!(day.weekday(), Weekday::Sat | Weekday::Sun)`이 될 때까지 `date.checked_add_days(Days::new(1)).unwrap()`으로 전진하세요. 간격은 `settles.signed_duration_since(value).num_days()`입니다.",
  "`value.format(\"%d %b %Y %a\")`는 `02 Oct 2026 Fri`를 `println!`에 바로 출력합니다 — `%a`는 요일의 세 글자 이름입니다.",
]

