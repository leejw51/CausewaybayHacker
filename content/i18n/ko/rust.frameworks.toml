[[quest]]
id    = "rust.frameworks.12.indexmap-first-seen"
title = "들어온 순서대로"
story = "이워 스트리트 단말기들의 가맹점 집계는 HashMap이고, 아침 리포트는 돌릴 때마다 가맹점을 다른 순서로 나열한다. 재무팀은 카드를 처음 받은 순서를 원하는데, 그게 어느 가맹점이었는지 아무도 말하지 못한다."
brief = '''
표준 입력의 각 줄은 가맹점 이름입니다(공백이 들어 있을 수 있고, 앞뒤
공백은 트림하며, 빈 줄은 무시합니다). 각 가맹점이 몇 번 나오는지 세세요.

서로 다른 가맹점마다 **처음 본 순서대로** `<merchant> <count>`를 출력한
뒤 `DISTINCT <k>`를 출력하세요. 가맹점이 하나라도 있었다면
`FIRST <merchant>`(처음 본 가맹점)와 `TOP <merchant> <count>`(가장 큰
횟수. 같으면 먼저 본 쪽)도 출력하세요. 빈 입력은 `DISTINCT 0`만
출력합니다.

```
input:  Lucky Mac
        SOGO
        Lucky Mac
        Hysan Place
        Times Square
        SOGO
        Jardine's Bazaar
        Lucky Mac
output: Lucky Mac 3
        SOGO 2
        Hysan Place 1
        Times Square 1
        Jardine's Bazaar 1
        DISTINCT 5
        FIRST Lucky Mac
        TOP Lucky Mac 3
```

`indexmap::IndexMap`은 삽입 순서를 기억하는 해시 맵입니다: `entry`와
`or_insert`는 `HashMap`과 같고, 순회는 키가 삽입된 순서이며, 첫 것은
`get_index(0)`입니다. 스타터는 `std::collections::HashMap` 위의 같은
프로그램이고, 그것은 해셔가 오늘 내키는 순서로 순회합니다.
'''
hints = [
  "`use indexmap::IndexMap;` — `IndexMap<&str, u64>`는 `HashMap`과 같은 `entry(key).or_insert(0)`를 갖고, `&counts`를 순회하면 삽입 순서대로 키를 지나갑니다.",
  "`counts.get_index(0)`은 `Option<(&K, &V)>`: 맨 처음 삽입된 가맹점입니다. 그것을 기억할 두 번째 변수는 필요 없습니다.",
  "`TOP`은 `&counts`를 순서대로 돌며 `*count > best`일 때만 최고를 바꾸세요 — 엄격히 큰 경우만, 그래야 동점 중 가장 이른 것이 남습니다. `max_by_key`는 *마지막* 최댓값을 돌려주는데, 여기서는 그게 틀린 쪽입니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.frameworks.13.rand-seeded-shuffle"
title = "같은 추첨을 두 번"
story = "글로스터 로드의 부정거래 데스크는 그날 이워 스트리트 가맹점들의 무작위 표본을 뽑아 수동 점검한다. 감사인이 어제 표본에 어느 가맹점이 있었냐고 묻는데, 그것을 뽑은 프로그램은 다시 뽑아 보일 수가 없다."
brief = '''
표준 입력은 두 줄입니다. 첫 줄은 시드, 부호 없는 64비트 정수입니다. 둘째
줄은 `<n> <k>`로, `1 <= n <= 99`, `0 <= k <= 20`입니다.

덱 `M01 M02 ... Mnn`(두 자리, 0으로 채움)을 만들고, 그 시드로 시드를 준
**하나의** 난수 생성기로:

1. 덱을 제자리에서 한 번 섞고 `DECK <ids joined by one space>`를
   출력하세요.
2. `1..=100`에서 균등한 `u32` 정수 `k`개를 뽑아 각각 순서대로
   `DRAW <x>`를 출력하세요.
3. `CHECK <first id of the shuffled deck>`를 출력하세요.

생성기는 `SeedableRng::seed_from_u64`로 만든 `rand::rngs::StdRng`이고,
정확히 그 순서 — 섞기 먼저, 그다음 뽑기 — 로 소비하므로 같은 시드는
언제나 같은 줄을 출력합니다. 시드가 `u64`가 아니면
`ERROR: bad seed <text>`(트림)를 출력하고 그 외에는 아무것도 출력하지
마세요.

```
input:  20261006
        6 3
output: DECK M06 M02 M05 M01 M03 M04
        DRAW 4
        DRAW 26
        DRAW 79
        CHECK M06
```

섞기는 `rand::seq::SliceRandom::shuffle`, 뽑기는
`rand::RngExt::random_range` — 둘 다 트레이트이고, 둘 다 import합니다.
스타터는 운영체제에서 시드를 받는 스레드 로컬 생성기 `rand::rng()`를
쓰고, 돌릴 때마다 다른 표본을 출력합니다.
'''
hints = [
  "`use rand::rngs::StdRng; use rand::{RngExt, SeedableRng}; use rand::seq::SliceRandom;` — rand 0.10에서 메서드는 `RngExt`와 `SliceRandom`에, `seed_from_u64`는 `SeedableRng`에 있습니다.",
  "`let mut rng = StdRng::seed_from_u64(seed);`가 수정의 전부입니다: 시드로 만든 생성기 하나를, 뽑는 모든 곳에 `&mut rng`로 건넵니다.",
  "`deck.shuffle(&mut rng);` 그다음 `let draw: u32 = rng.random_range(1..=100);` — 타입 표기가 스트림에서 어떤 정수가 나올지를 정하므로 반드시 `u32`여야 합니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.frameworks.14.rayon-fee-run"
title = "모든 카드를 한 번에"
story = "월말 수수료 정산 작업은 이워 스트리트 단말기들의 카드를 글로스터 로드의 16코어 서버 중 한 코어에서 한 장씩 훑고, 끝나고 보면 은행 수치가 우리 것보다 카드당 1센트쯤 높다."
brief = '''
표준 입력은 0줄 이상의 `<CARD> <CENTS>`입니다: 카드 ID(공백 없음,
고유)와 센트 단위 금액, `0 <= CENTS <= 10_000_000_000`.

결제 한 건의 수수료는
**금액의 1.5%를 다음 정수 센트로 올림한 것에 고정 30센트를 더한 값**입니다.
정수로는 `(cents * 15 + 999) / 1000 + 30`. 199센트 결제는 요율분
2.985센트를 3으로 올리고 30을 더한 수수료 33입니다. 0센트 결제도 고정
30은 냅니다.

카드마다 `<CARD> <FEE>` 한 줄을 **카드 ID로 정렬해서** 출력한 뒤
`TOTAL <sum of the fees>`를 출력하세요. 빈 입력은 `TOTAL 0`만
출력합니다.

```
input:  C3 199
        A1 10000
        B2 3800
output: A1 180
        B2 87
        C3 33
        TOTAL 300
```

카드별 작업은 `rayon`으로 병렬 처리하세요: `use rayon::prelude::*;`,
그다음 순차 `.iter()`가 있던 자리에 `.par_iter()`. `Vec`으로의
`.map(..).collect()`도 `.map(..).sum()`도 병렬 이터레이터에서
동작합니다. `Vec`은 입력 순서로 돌아오므로 출력 전에 정렬하세요 — 병렬
부분 안에서는 절대 출력하지 마세요. 스타터는 순차 버전이고, 그 수수료는
반대 방향으로 반올림합니다.
'''
hints = [
  "`use rayon::prelude::*;`가 모든 `Vec`과 슬라이스에 `par_iter()`를 올려 줍니다. 이미 갖고 있는 클로저는 바뀌지 않고, `.map(...).collect()`와 `.map(...).sum()`은 병렬 이터레이터에도 있습니다.",
  "정수 올림은 `x / 1000`이 아니라 `(x + 999) / 1000`입니다. 스타터는 내림하고, 히든 케이스에는 1.5%가 정수 센트가 아닌 금액이 있습니다.",
  "`Vec`으로의 병렬 `collect()`는 입력 순서를 지키지만 과제는 카드 순서를 원합니다: 출력 루프 전에 `fees.par_sort_unstable()`(또는 그냥 `sort()`). 출력 루프는 순차로 남습니다.",
  "`let total: i64 = fees.par_iter().map(|&(_, f)| f).sum();` — 왼쪽의 타입이 `sum`에게 무엇으로 더해 모을지 알려 줍니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.frameworks.15.parking-lot-ledger"
title = "계산대 넷, 원장 하나"
story = "하이산 플레이스의 계산대 넷은 마감 때 원장 하나에 기록한다. 가맹점마다의 줄에는 마지막으로 끝난 계산대가 본 것만 들어 있고, 나머지 셋이 더한 것은 하나도 없다."
brief = '''
첫 줄은 `<TILLS>`, `1 <= TILLS <= 8`입니다. 그 뒤의 모든 줄은 결제
`<MERCHANT> <CENTS>`입니다(공백 없는 가맹점 토큰, `CENTS > 0`). 결제가
하나도 없을 수도 있습니다.

결제 `i`(0부터, 결제 줄만 셈)는 계산대 `i % TILLS`의 것입니다. 각
계산대는 스레드이고, 각자 자기 결제를 **하나의 공유 원장** — 가맹점별
합계 센트와 건수를 담은 `Mutex<HashMap<String, (i64, u32)>>` — 에
더합니다. 모든 계산대가 끝나면 가맹점마다 `<MERCHANT> <TOTAL> <COUNT>`
한 줄을 가맹점 순으로 정렬해 출력하고, 그다음 결제 줄 수로
`PAYMENTS <n>`을 출력하세요.

```
input:  2
        sogo 500
        luckymac 3800
        sogo 1200
        tsuiwah 4500
        luckymac 200
output: luckymac 4000 2
        sogo 1700 2
        tsuiwah 4500 1
        PAYMENTS 5
```

`parking_lot::Mutex`를 쓰세요. 그 `lock()`은 실패할 수 없으므로 가드
자체를 돌려줍니다 — `.unwrap()`도 없고, 포이즈닝도 없으며,
`into_inner()`는 `Result`가 아니라 값입니다. 계산대는
`std::thread::scope`로 띄워서 `Arc` 없이 원장을 빌릴 수 있게 하세요.
스타터는 `std::sync` 버전이고, 각 계산대의 수치를 원장에 합칠 때 다른
계산대들이 이미 쓴 것을 버리는 방식으로 합칩니다 — 락이 아니라 병합을
읽으세요.
'''
hints = [
  "`std::sync::Mutex` 자리에 `use parking_lot::Mutex;`. `ledger.lock()`이 가드입니다 — 그 뒤의 `.unwrap()`을 모두 지우세요. `into_inner()`는 맵 자체입니다.",
  "`HashMap::extend`는 이미 있는 키를 *교체*합니다. 계산대 0이 쓴 뒤에 계산대 1이 `luckymac`을 쓰면 계산대 0의 합계는 사라집니다. 그것이 스타터의 버그이고, 두 계산대가 모두 본 가맹점이면 어디서든 드러납니다.",
  "`entry`로 병합하세요: `let e = shared.entry(merchant).or_insert((0, 0)); e.0 += cents; e.1 += count;` — 계산대 하나에 `lock()` 한 번, 로컬 맵이 완성된 뒤에 잡아서, 락은 병합 동안만 쥐고 그 외에는 쥐지 않습니다.",
  "`let mut shared = ledger.lock();` 그다음 `for (merchant, (cents, count)) in local` 루프. 가드는 로컬 변수이고 스레드의 클로저가 끝날 때 드롭됩니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.frameworks.16.crossbeam-hatch"
title = "투입구가 닫힌다"
story = "이워 스트리트 단말기 셋이 글로스터 로드 사무실의 투입구 하나에 전표를 올리는데, 그들이 퇴근했다고 투입구에 알려 주는 것은 아무것도 없다. 야간 배치는 아침 여섯 시에도 여전히 기다리고 있다."
brief = '''
첫 줄은 `<PRODUCERS>`, `1 <= PRODUCERS <= 8`입니다. 그 뒤의 모든 줄은
결제 전표 `<CARD> <CENTS>`입니다. 전표 `i`(0부터, 전표만 셈)는 생산자
`i % PRODUCERS`의 것입니다. 정확히 두 필드가 아니거나 센트가 `i64`가
아닌 전표는 불량 전표입니다: 생산자는 그것을 건너뛰고 아무것도 보내지
않습니다.

각 생산자는 자기 정상 전표를 메시지 하나씩 **하나의**
`crossbeam::channel::bounded(4)` 채널로 보내는 스레드입니다. 소비자 하나
— 메인 스레드 — 가 모든 송신자가 사라질 때까지 `for msg in rx`로 채널을
읽은 뒤 출력합니다:

* `MESSAGES <n>` — 받은 메시지 수
* `TOTAL <sum of cents>`
* `LARGEST <CARD> <CENTS>` — 가장 큰 전표 하나. 같으면 더 작은 카드
  ID(문자열 순서). 메시지가 없으면 `LARGEST -`.

```
input:  3
        K1 1200
        K2 350
        K3 oops
        K4 1200
        K5 90
output: MESSAGES 4
        TOTAL 2840
        LARGEST K1 1200
```

`for msg in rx`는 **마지막** `Sender`가 드롭될 때만 끝납니다. 각
생산자는 `tx.clone()`을 받고, 그것들은 스레드가 끝나면 드롭됩니다 —
그러나 원본 `tx`가 여전히 `main`에 앉아 있으므로 루프는 끝나지 않고
실행은 타임아웃입니다. 읽기 시작 전에 드롭하세요. 스타터는 그러지
않습니다.
'''
hints = [
  "`use crossbeam::channel::bounded;` — `bounded(4)`는 `(Sender, Receiver)`를 줍니다. `Sender`는 `Clone`이고, `Receiver`는 채널이 닫히면 끝나는 이터레이터입니다.",
  "채널은 *모든* `Sender`가 드롭되었을 때 닫힙니다. 세어 보세요: 생산자마다 클론 하나, 더하기 `bounded`가 건네준 그 하나 — `main`이 `for slip in rx`에 앉아 있는 동안에도 여전히 소유하고 있는 것.",
  "소비자는 생산자가 띄워지기 전에 돌아서는 안 되고(클론이 필요하니까), 소비자가 시작하기 전에 원본은 사라져야 합니다: 띄우고, 그다음 `drop(tx);`, 그다음 루프.",
  "`thread::scope` 클로저 안, `for p in 0..producers` 루프 바로 뒤에 `drop(tx);`. 그 외에는 아무것도 바뀌지 않습니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.frameworks.17.crossbeam-select-timeout"
title = "300밀리초"
story = "글로스터 로드 게이트웨이 뒤의 카드 발급사 하나가 11:52에 응답을 멈췄다. 소고의 단말기들은 두 시까지 PLEASE WAIT를 띄웠다. 게이트웨이도 함께 기다렸기 때문이다."
brief = '''
표준 입력은 0줄 이상의 `<CARD> <MS>`이고 많아야 스무 줄입니다: 카드 ID와
그 카드의 발급사가 응답하는 데 걸리는 시간(밀리초). `MS`는
**3 이하**(살아 있는 발급사)이거나 **3000 이상**(그렇지 않은
발급사)이고, 한 번의 실행에 느린 쪽은 많아야 세 줄입니다.

카드를 순서대로 처리하세요. 각 카드마다 `MS`밀리초 잠들었다가 카드 ID를
채널로 돌려보내는 워커 스레드를 시작하세요. 답을 **최대 300 ms**
기다리세요: 왔으면 `<CARD> APPROVED`, 안 왔으면 `<CARD> TIMEOUT`을
출력하고 곧바로 다음 카드로 넘어가세요. 마지막 카드 뒤에
`APPROVED <a> TIMEOUT <t>`를 출력하세요.

```
input:  V1 0
        V2 3000
        V3 2
output: V1 APPROVED
        V2 TIMEOUT
        V3 APPROVED
        APPROVED 2 TIMEOUT 1
```

기다림은 수신자 둘에 대한 `crossbeam::channel::select!`입니다: 워커의
것과, 시간이 다 되면 메시지 하나를 전달하는 채널
`after(Duration::from_millis(300))`. **카드마다 자기만의** `bounded(1)`
채널을 주세요. 그래야 3초 늦게 도착한 느린 발급사의 답이 다음 카드의
답으로 오해되지 않습니다. 워커는 `let _ = tx.send(..)`로 보냅니다:
그때는 아무도 듣고 있지 않을 수 있고, 그래도 괜찮습니다. 워커는
`std::thread::spawn`으로 띄우고 절대 join하지 마세요 — `main`이 반환되면
잠든 워커까지 통째로 프로세스가 끝납니다. 스타터는 타임아웃 없이
`rx.recv()`를 호출해서 3초를 꽉 채워 기다린 뒤 카드를 승인합니다.
'''
hints = [
  "`use crossbeam::channel::{after, bounded, select};` — `after(d)`는 지금부터 `d` 뒤에 정확히 메시지 하나를 받는 `Receiver<Instant>`입니다. 다른 것과 똑같은 채널이고, 그 덕에 `select!`가 그것을 기다릴 수 있습니다.",
  "`select!`는 `recv(rx) -> msg => { .. }` 갈래들을 받아 먼저 준비된 수신자의 갈래를 실행합니다. 한 갈래에 워커의 수신자를, 다른 갈래에 `after` 수신자를 두세요.",
  "`recv(rx) -> answer`는 `Result`를 줍니다: 워커에서 온 `Ok(card)`. 타임아웃 갈래의 메시지는 필요 없는 `Instant`입니다: `recv(after(Duration::from_millis(300))) -> _ => { .. }`.",
  "`select! { recv(rx) -> answer => { approved += 1; println!(\"{} APPROVED\", answer.unwrap()); } recv(after(Duration::from_millis(300))) -> _ => { timed_out += 1; println!(\"{card} TIMEOUT\"); } }`",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "rust.frameworks.18.tokio-spawn-join"
title = "줄 하나에 태스크 하나"
story = "글로스터 로드의 정산 검사기는 매입사가 답하는 순간 그 줄을 출력한다. 오늘 아침 파일은 40번째 줄이 1번째 줄 위에 와서 돌아왔고, 소고의 대사 데스크는 그것을 곧장 반송했다."
brief = '''
표준 입력은 최대 50줄의 `<MERCHANT> <CENTS>`입니다: 단어 하나, 그다음
음이 아닌 정수. 빈 줄은 건너뜁니다.

모든 줄은 자기만의 `tokio::spawn`된 태스크가 검사합니다. 검사는
`tokio::join!`으로 함께 하는 두 가지입니다: 태그(가맹점을 대문자로)와
수수료(`cents * 15 / 1000`, 내림). 매입사의 왕복 시간은 시뮬레이션합니다
— 둘이 돌기 전에 `(cents % 5) * 50`밀리초 동안 `tokio::time::sleep` —
스타터에 이미 있으니 그대로 두세요. 그것이 태스크가 시작한 순서대로
끝나지 않는 이유입니다.

입력 줄마다 **입력 순서대로** `<n> <TAG> <cents> <fee>` 한 줄을 `n`은
1부터 세어 출력하고, 그다음 `TOTAL <sum of cents> <sum of fees>`를
