모든 탭은 매입사 둘이 동시에 승인합니다. 각각은 지연 뒤에 코드
`id * 37 % 1000`을 답합니다 — 지연은 `tokio::time::sleep`으로
시뮬레이션하세요:

* primary: `fast` 10 ms, `slow` 3 s
* backup: `fast` 100 ms, `slow` 3 s

먼저 답하는 쪽이 이깁니다: 두 퓨처에 대한 `tokio::select!`. 경주 전체는
**1초**의 `tokio::time::timeout`으로 감쌉니다. 줄은 한 번에 하나씩
순서대로 처리하고, 각각에 대해 출력하세요:

* `DONE <id> primary <code>` 또는 `DONE <id> backup <code>` — 누가
  이겼는지
* `TIMEOUT <id>` — 둘 다 제때 답하지 않음

```
input:  7 fast fast
        8 slow fast
        9 slow slow
output: DONE 7 primary 259
        DONE 8 backup 296
        TIMEOUT 9
```

`timeout(dur, fut).await`는 `Ok(value)` 또는 `Err(Elapsed)`입니다.
`Err`일 때 안의 퓨처는 sleep까지 통째로 드롭된 상태입니다 — 3 s를 끝까지
기다리는 일은 없습니다. 스타터는 primary 하나만, 타임아웃 없이
await하고, backup에게는 묻지 않습니다.
'''
hints = [
  "`use tokio::time::{sleep, timeout};` — `timeout(Duration::from_secs(1), fut).await`는 `Result<T, Elapsed>`를 주고, 안의 퓨처를 드롭하는 것이 곧 취소입니다.",
  "`tokio::select! { a = fut_a => ..., b = fut_b => ... }`는 둘을 폴링해서 먼저 끝난 쪽의 갈래를 실행합니다. 다른 퓨처는 그 자리에서 드롭됩니다.",
  "`select!`를 `async fn authorise(...) -> (&'static str, u64)` 안에 넣고 *그것*을 timeout으로 감싸세요. 그래야 기한 하나가 매입사 둘을 모두 덮습니다.",
  "`match timeout(..).await { Ok((who, code)) => println!(\"DONE {id} {who} {code}\"), Err(_) => println!(\"TIMEOUT {id}\") }`.",
