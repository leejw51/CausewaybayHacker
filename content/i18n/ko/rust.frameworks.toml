[[quest]]
id    = "rust.frameworks.19.tokio-mpsc-drop-sender"
title = "마지막 계산대가 닫힌다"
story = "하이산 플레이스의 계산대 넷이 채널 하나로 시재 집계를 보낸다. 집계는 끝내 출력되지 않는다: 세는 태스크가 마감 시간에 보내기를 멈춘 계산대를 아직 기다리고 있다."
