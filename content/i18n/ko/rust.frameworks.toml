  "송신자를 세어 보세요: 계산대마다 클론 하나, 태스크로 이동되어 태스크가 반환될 때 드롭됩니다 — 그리고 `main`의 원본, 아무도 드롭하지 않는 것.",
  "spawn 루프 바로 뒤에 `drop(tx);`. 그러면 `while let Some(..) = rx.recv().await`는 마지막 계산대가 보내기를 끝낸 바로 그때 끝납니다.",
