[[quest]]
id    = "rust.frameworks.22.log-trait"
title = "현장이 듣는 것"
story = "글로스터 로드의 정산 서비스는 if 더미 뒤의 맨 print로 로그를 찍는다. 누군가 퍼시벌 스트리트 롤아웃을 위해 그것을 warn으로 맞췄더니, 에러는 나오지 않게 되고 debug 줄은 계속 나왔다."
brief = '''
첫 줄은 레벨 단어이고 대소문자는 상관없습니다: `off`, `error`, `warn`,
`info`, `debug`, `trace`. 그 밖의 단어는 `unknown level <word>`를
출력하고 그 외에는 아무것도 출력하지 않습니다. 그 뒤의 모든 줄은
`<ACCOUNT> <AMOUNT>`입니다.

줄을 1부터 번호를 매기며 훑고, `log` 크레이트의 매크로로, 각각 명시적인
target을 주어 로그하세요:

* `trace!(target: "io", "read {raw:?}")` — 원본 줄, `Debug` 따옴표 포함
* `error!(target: "settle", "line {n}: not a number: {amount}")` —
  금액이 `i64`가 아닐 때. 그 줄은 건너뜁니다
* `info!(target: "settle", "line {n}: {account} {cents}")`
* `warn!(target: "settle", "line {n}: large amount {cents}")` —
  `cents > 100000`일 때, `info!` 뒤에
* `debug!(target: "settle", "total so far {total}")` — 더한 뒤에

그다음 레벨이 무엇이든 `println!("TOTAL {total}")`.

레코드는 **표준 출력**에 `[LEVEL] target: message`로 출력되며, 그 레벨이
선택한 레벨 이상일 때만 출력됩니다 — `error`가 맨 위, `trace`가 맨 아래,
`off`는 합계 외에 아무것도 출력하지 않습니다.

```
input:  info
        A 100
        B 250000
        C 7x
        D 1
output: [INFO] settle: line 1: A 100
        [INFO] settle: line 2: B 250000
        [WARN] settle: line 2: large amount 250000
        [ERROR] settle: line 3: not a number: 7x
        [INFO] settle: line 4: D 1
        TOTAL 250101
```

유닛 구조체에 `log::Log`를 구현하세요 — `enabled`는 레코드의 레벨을
`log::max_level()`과 비교하고, `log`는 enabled일 때 출력하고, `flush`는
stdout을 flush합니다 — 그것을 `static LOGGER`에 하나 두고,
`log::set_logger(&LOGGER)`, 그리고 단어를 `LevelFilter`로 파싱해
`log::set_max_level`하세요. 스타터는 자기만의 레벨 표를 갖고 있고 비교
방향이 거꾸로입니다.
'''
hints = [
  "`use log::{Log, Metadata, Record, LevelFilter};` — `impl Log for YourStruct`는 메서드 셋입니다: `enabled`, `log`, `flush`. `\"warn\".parse::<LevelFilter>()`가 대소문자 상관없이 단어를 읽습니다.",
  "`static LOGGER: StdoutLogger = StdoutLogger; log::set_logger(&LOGGER).unwrap(); log::set_max_level(level);` — `set_logger`는 `&'static dyn Log`를 원하고, 그래서 `let`이 아니라 `static`입니다.",
  "`Level`의 순서는 `Error < Warn < Info < Debug < Trace`이므로, 레코드는 `record.level() <= log::max_level()`일 때 원하는 것입니다. 매크로는 당신을 호출하기 전에 이미 `max_level()`을 검사합니다.",
  "`println!(\"[{}] {}: {}\", record.level(), record.target(), record.args())` — `Level`은 `ERROR`, `WARN`, ...으로 표시되고, 각 매크로에 넘긴 `target:`이 `record.target()`이 돌려주는 것입니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "rust.frameworks.23.the-settlement"
title = "정산"
story = "글로스터 로드 결제 경로의 17:30. 그날의 이체가 JSON 파일 하나로 도착하고, 은행은 18:00까지 계좌마다 한 줄을 원하며, 오늘 밤 나가는 파일은 3월에 감사인이 읽는 파일이다."
brief = '''
표준 입력은 JSON 객체 하나입니다: `"date"`(문자열, `YYYY-MM-DD`)와
`"transfers"`, `{"from", "to", "cents"}`의 배열.

정산을 출력하세요:

```
input:  {"date": "2026-10-06", "transfers": [
          {"from": "LUCKYMAC", "to": "BANK", "cents": 3800},
          {"from": "SOGO", "to": "BANK", "cents": 12500},
          {"from": "BANK", "to": "LUCKYMAC", "cents": 300}]}
output: SETTLEMENT Tue 06 Oct 2026
        BANK 16000
        LUCKYMAC -3500
        SOGO -12500
        MOVED 3
```

첫 줄은 `%a %d %b %Y`로 형식화한 날짜입니다. 그다음 어디에든 나타나는
계좌마다 한 줄을 **이름순으로 정렬해서** 그 순액과 함께: 받은 전부에서
낸 전부를 뺀 것. 그다음 `MOVED <number of transfers>`.

또는 `ERROR:` 한 줄만 출력하고 그 외에는 아무것도 출력하지 않습니다.
검사는 이 순서입니다:

* 입력이 그 모양이 전혀 아님 — `ERROR: not a settlement`
* 날짜가 파싱되지 않음 — `ERROR: bad date 2026-13-01`
* 그다음 각 이체를 순서대로, 1부터 세어 — `cents`가 0 이하이면
  `ERROR: transfer 2: nothing to move`, `from`이 `to`와 같으면
  `ERROR: transfer 1: BANK pays itself`

지나온 길로 만드세요: 모양은 `serde`, 날짜는 `chrono`, 에러는 컨텍스트를
붙인 `anyhow`, 그리고 `tokio` — 이체마다 태스크 하나가 그것을 검증하고
양쪽을 `Arc<tokio::sync::Mutex<BTreeMap<String, i64>>>`에 기록하며,
**순서대로** join해서 첫 불량 이체가 보고되는 것이 되게 하세요. 스타터는
파싱하고 띄우지만 받는 쪽만 입금하고, 검증은 전혀 하지 않으며, 날짜는 온
그대로 출력합니다.
'''
hints = [
  "크레이트 넷, 프로그램 하나. 모양은 `serde_json::from_str::<Settlement>`, 날짜는 `NaiveDate::parse_from_str(&s, \"%Y-%m-%d\")`, 출력은 `date.format(\"%a %d %b %Y\")`.",
  "에러는 `anyhow`입니다: 크레이트 자체의 메시지가 새면 안 되는 곳에는 `.map_err(|_| anyhow!(\"not a settlement\"))`, 태스크 안에서는 `bail!(...)`, join하면서 `.with_context(|| format!(\"transfer {}\", i + 1))` — 그리고 `{err:#}`가 `context: cause`를 출력합니다.",
  "각 태스크는 `anyhow::Result<()>`를 돌려주는 `tokio::spawn(post(Arc::clone(&book), transfer))`입니다. `handle.await`는 `Result<Result<()>, JoinError>`를 주므로 `?`가 둘입니다 — 첫 것에는 그것만의 컨텍스트를 붙여서.",
  "핸들을 **띄운 순서대로** join하고 첫 `Err`에서 멈추세요: 이체 2와 3이 모두 불량일 때 `transfer 2`가 보고되게 하는 것이 그것입니다. 맵은 `BTreeMap`이므로 계좌는 공짜로 정렬되어 나옵니다.",
]
