  "`transfers.iter().sorted_by_key(|(account, _)| *account)`는 정렬된 항목들의 이터레이터를 돌려주고 — 안정 정렬이라 한 계좌의 두 이체는 순서를 지킵니다 — 그 위의 `.chunk_by(|(account, _)| *account)`가 연속 구간을 묶습니다.",
  "`ChunkBy`는 참조로 순회합니다: `let grouped = ...chunk_by(...); for (account, group) in &grouped { ... }`. `group`은 그 계좌의 이체들에 대한 이터레이터입니다.",
  "루프 안에서: `let amounts: Vec<i64> = group.map(|(_, cents)| *cents).collect();` 그다음 `println!(\"{account} {}={}\", amounts.iter().join(\"+\"), amounts.iter().sum::<i64>())`.",
