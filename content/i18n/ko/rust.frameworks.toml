# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.frameworks.09.regex-captures"
title = "문장 속의 달러"
story = "지원 데스크는 고객 이메일을 환불 티켓에 붙여 넣고, 금액은 문장 속에 앉아 있다. 그것을 뽑아내는 스캐너가 첫 쉼표에서 멈춰서, 소고에서 HK$1,234.50을 결제한 고객은 1달러를 돌려받으라는 제안을 받았다."
brief = '''
표준 입력은 자유 텍스트이고, 한 줄이 티켓 한 줄입니다. 그 안의 모든 홍콩
달러 금액을 찾으세요. 금액은 `HK$` 바로 뒤에 달러 정수 부분, 그리고
선택적인 센트 부분이 붙은 것입니다:

* 달러 정수 부분: 그냥 숫자(`80`, `1234`)이거나, 세 자리씩 쉼표로 묶인
  숫자(`1,234`, `12,345,678` — 한 자리에서 세 자리, 그다음 `,ddd` 묶음
  하나 이상)
* 센트: `.`와 정확히 두 자리 숫자(`.50`). 뒤에 두 자리가 없는 `.`은
  금액의 일부가 아닙니다(`HK$38.`은 38달러).

그 밖의 것 — `US$9.99`, 덩그러니 놓인 `HK$` — 은 금액이 아닙니다.

금액마다 읽는 순서대로 `<line> <text> <cents>`를 출력하세요: 1부터 세는
줄 번호, 텍스트에 나타난 그대로의 금액, 그리고 정수로 나타낸 센트 값.
마지막 줄 뒤에 `TOTAL <cents>`를 출력하세요. 금액이 없는 티켓은 합계만
출력하고, 빈 입력은 `TOTAL 0`을 출력합니다.

```
input:  Charged HK$1,234.50 twice at SOGO; the second HK$1,234.50 is a duplicate.
        Refund HK$80 and the HK$12.05 fee. The US$9.99 line is not ours.
output: 1 HK$1,234.50 123450
        1 HK$1,234.50 123450
        2 HK$80 8000
        2 HK$12.05 1205
        TOTAL 256105
```

달러와 센트에 이름 붙인 그룹을 둔 `regex::Regex` 하나를 만들어 루프 전에
**한 번만** 컴파일하고(컴파일이 비싼 부분입니다. 루프 본문 안의
`Regex`는 고전적인 실수입니다), 각 줄을 `captures_iter`로 훑으세요. 정수
센트로 계산하세요: `f64` 달러에 100을 곱하는 것이 `HK$0.29`가 28센트가
되는 경위입니다. 스타터는 손으로 스캔하고, 첫 쉼표에서 멈추며,
부동소수점을 곱합니다.
'''
hints = [
  "`use regex::Regex;`와 루프 위에 한 번 `let re = Regex::new(r\"...\").unwrap();`. `re.captures_iter(line)`은 매치마다 `Captures` 하나씩을 왼쪽에서 오른쪽으로 냅니다.",
  '이름 붙인 그룹: `(?P<dollars>...)`와 `(?P<cents>...)`. 패턴에서 `\$`는 리터럴 달러 기호이고, 묶인 형태가 교대(alternation)에서 먼저 와야 하며 쉼표 묶음에는 `+`가 붙어야 합니다. 그렇지 않으면 `HK$1234.50`이 `HK$123`으로 매치됩니다 — regex 크레이트는 가장 긴 대안이 아니라 매치되는 첫 대안을 택합니다.',
  '패턴: `HK\$(?P<dollars>\d{1,3}(?:,\d{3})+|\d+)(?:\.(?P<cents>\d{2}))?`. `&caps[0]`은 매치 전체, `caps["dollars"]`는 그룹의 텍스트이고, `caps.name("cents")`는 그룹이 참여하지 않았을 수 있으므로 `Option<Match>`입니다.',
  "`let dollars: i64 = caps[\"dollars\"].replace(',', \"\").parse().unwrap();` 그다음 `let cents: i64 = caps.name(\"cents\").map_or(0, |m| m.as_str().parse().unwrap());`, 그리고 금액은 `dollars * 100 + cents`입니다.",
]

