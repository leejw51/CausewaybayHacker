보내지 마세요. 스타터는 첫 단어에 match하고 나머지를 인덱싱합니다.
'''
hints = [
  "`use clap::{Parser, Subcommand};` — 구조체는 필드 하나 `#[command(subcommand)] command: Command`를 갖고, `Command`는 `#[derive(Subcommand)]`를 단 enum입니다.",
  "구조체 모양의 배리언트 `Pay { to: String, cents: i64 }`는 위치 인자 둘짜리 서브커맨드이고, `#[arg(long)] reason: Option<String>`은 선택적 `--reason`, `#[arg(default_value = \"main\")] account: String`은 선택적 위치 인자입니다.",
  "구조체에 `#[command(name = \"till\", disable_help_subcommand = true)]` — 그렇지 않으면 clap이 자기 `help` 서브커맨드를 추가하고, `help`라는 줄은 `InvalidSubcommand` 대신 `DisplayHelp`를 출력합니다.",
  "`try_parse_from` 뒤에 `cli.command`에 match하세요: `Command::Refund { id, reason: Some(why) } => ...`와 `Command::Refund { id, reason: None } => ...`는 한 match의 두 갈래입니다.",
