첫 줄은 계산대 수 `P`(1에서 8)입니다. 그 뒤의 모든 줄은
`<TILL> <CENTS>`입니다: 계산대 번호와 정수 금액. 계산대가 `1..=P`에 없는
줄은 바닥에 떨어집니다 — 보내지도 세지도 않습니다.

각 계산대는 생산자 태스크입니다: 계산대마다 `tokio::spawn` 하나,
`tokio::sync::mpsc::channel(4)`의 송신자 클론을 들고, 자기 줄마다
`(till, cents)`를 파일 순서대로 보냅니다. 소비자 하나는 `main`에 있고,
`while let Some((till, cents)) = rx.recv().await`로 받아 집계합니다.

채널이 비워지면 계산대 1부터 P까지 각각 `TILL <k> <count> <sum>`을,
그다음 전체에 대한 `TOTAL <count> <sum>`을 출력하세요.

```
input:  3
        1 1200
        2 3000
        1 800
        3 50
        2 1000
output: TILL 1 2 2000
        TILL 2 2 4000
        TILL 3 1 50
        TOTAL 5 6050
```

`recv()`는 **모든** 송신자가 사라졌을 때만 `None`을 돌려줍니다.
