hints = [
  "칸을 단어에 들어 있을 수 없는 문자로 덮어쓰고, 재귀하고, 원래대로 되돌리세요.",
  "시작 글자는 탐색 전에 별도의 순회로 세세요. 아니면 '#' 표시가 개수를 헷갈리게 합니다.",
  "성공 기저 경우는 `at + 1 == word.len()`입니다 — 이 칸을 맞춘 뒤에 검사하지, 전에 하지 않습니다.",
  "네 방향은 if 넷과 `found` 플래그 대신 `||`로 이으세요: `||`는 이미 처음 성공하는 분기에서 멈추고, 시작 칸들에 대한 `any`도 마찬가지입니다. 맞춘 뒤에도 계속하는 것은 하지 말라고 한 일입니다.",
]

