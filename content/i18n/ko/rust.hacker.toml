[[quest]]
id    = "rust.hacker.31.palindrome"
title = "거꾸로 해도 같은"
story = "상위 스무 개 안의 문제, 대부분의 스크린에서 어떤 형태로든 나오고, 대부분 한 번 써 봤지만 끝내 이해하지 못한 그 문제."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열은 직접 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

가장 긴 회문 부분 문자열의 길이를 출력하고, 그다음 `AT <index>` — 그 길이를
가진 것 중 **가장 왼쪽** 것의 0부터 세는 시작 위치를 출력하세요.

```
input:  12 3 5
output: 5
        AT 1
```

각 중심에서 바깥으로 확장하세요. 중심은 `n`개가 아니라 `2n - 1`개입니다:
모든 문자는 홀수 길이 회문의 중심이고, 두 문자 사이의 모든 틈은 짝수
길이 회문의 중심입니다. 틈을 잊는 것이 맞아 보이는 풀이가 `abba`에 `1`을
돌려주는 이유입니다.

**테스트가 강제하는 것과 강제하지 않는 것**을, 분명히. 실제로 일하는 숨은
케이스는 **한** 글자 알파벳 위의 `n = 20000`입니다. 중심 확장의 최악
경우입니다 — 모든 중심이 문자열 끝까지 달립니다 — 그래서 올바른 답은
거기서 온전한 `O(n²)`를 하고도 **0.08초**에 끝납니다. 그것은 또한
모든-부분문자열-검사를 거부하는 것이기도 합니다: 그것은 5초 제한에 대해
**40초가 지나도 아직 돌고 있었습니다**.

다른 큰 케이스, 두 글자 알파벳 위의 `n = 20000`은 **정확성** 케이스이지
속도 케이스가 아닙니다. 무작위 이진 문자열에서 회문 검사는 한두 글자 만에
실패하므로 세제곱 답도 **0.64초**에 통과합니다. 그것은 당신의 생성기와
가장 왼쪽 인덱스 동점 처리가 큰 규모에서 우리 것과 일치하는지를
검사합니다. 빨랐는지는 검사하지 않습니다. 세 수치 모두 이 기계에서
측정했습니다.

정직한 단서 하나, 면접관이 파고들 만한 종류의 것이기 때문입니다: 한 글자
케이스가 거부하는 것은 *모든* 부분 문자열 검사입니다. 지금까지 찾은 최선보다
길지 않은 부분 문자열을 건너뛰는 한 줄을 더하면 같은 세제곱 루프가 두 큰
케이스를 모두 통과합니다 — 이 입력에서는 그 가지치기가 그것을 `O(n²)`로
무너뜨립니다. 그러니 테스트는 순진한 세제곱을 거부하는 것이지, 최악의
경우에 세제곱인 모든 프로그램을 거부하는 것은 아닙니다.

정리하면: 테스트는 세제곱을 거부하고 제곱을 받아들입니다. `O(n)` 답인
매내커 알고리즘을 **요구하지는 않습니다**. 그것이 존재한다는 것과 무엇을
하는지는 알아 두세요. "그럼 제곱보다 잘할 수 있나요?"가 이 문제를 보통
꺼내는 이유인 후속 질문이니까요.
'''
hints = [
  "중심마다 호출 둘: 홀수 길이는 (c, c), 짝수 길이는 (c, c + 1). 스타터에는 두 번째가 빠져 있습니다.",
  "루프가 멈추면 i와 j 모두 회문에서 한 칸씩 벗어나 있습니다 — 그래서 시작은 i + 1이고 길이는 j - i - 1입니다.",
  "엄격히 더 긴 회문에서만 갱신하고, 각 길이에서 가장 왼쪽 것을 유지하세요. 그것이 AT가 묻는 것입니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구가 문제 맨 아래에 나타나고, 방의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. 질의 `q`개를 감기는 `u64`로 생성하세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

각 질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요.
`q`개 답 전체의 합을, 역시 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이므로 계산한 뒤 줄이는 일은 결코
없습니다 — 곱셈마다 그때그때 줄입니다. 문제는 나눗셈입니다:
`a! / (b! (a-b)!)`는 모듈러 산술에서 의미가 없습니다. 그것을 대신하는 것이
**모듈러 역원**이고, `1000000007`이 소수이므로 페르마의 소정리가 그것을
줍니다: `inverse(v) = v^(p-2) mod p`, 약 서른 번의 제곱으로 하는 빠른
거듭제곱으로 계산합니다.

정리하면: `factorial[0..=n]`을 한 번 미리 계산하고, 각 질의에
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 200000`,
`q = 200000`입니다. 각 계수를 독립적으로 계산하는 것 — 항 `b`개를 곱하고,
항 `b`개로 나누고, 각각 모듈러 역원 하나씩 — 은 5초 실행 제한 안에 끝나지
않습니다. 그것이 스타터입니다. 공유 팩토리얼 표 하나면 약 50밀리초에
끝납니다. 둘 다 이 기계에서 측정했습니다.

모든 중간값은 `2^30` 미만의 두 값의 곱이므로 `i64`에 들어가고 아무것도
오버플로하지 않습니다. 32비트 `int`를 쓰는 언어에서는 그렇지 않고, 그것이
이 질문이 나오는 이유의 나머지 절반입니다.
'''
hints = [
  "곱셈마다 줄이세요. 끝에 가서 하지 마세요. i64는 P 미만인 두 값의 곱은 담지만 팩토리얼은 담지 못합니다.",
  "inverse(v)는 power(v, P - 2)이고, P가 소수이기 때문에만 동작합니다 — 그것이 여기서 페르마의 소정리가 말하는 내용 전부입니다.",
  "역팩토리얼도 inverse(factorial[n])에서 거꾸로 미리 계산해 두면 질의당 power() 호출 둘이 사라집니다. 통과에 필요하지는 않지만 소리 내어 말할 만합니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "rust.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "대나무 비계로 거리 셋이 막힌 배달 격자. 건너가는 방법은 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자는 직접, 행 우선 순서로, 칸마다
값을 **둘** 뽑아서 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

열린 칸을 통해 **오른쪽** 또는 **아래**로만 움직입니다. 출력하세요:

1. `PATHS <k>` — `(0,0)`에서 `(r-1,c-1)`까지 서로 다른 경로가 몇 개인지,
   `1000000007`로 나눈 나머지
2. `MIN <cost>` — 양 끝점을 모두 세어 경로의 가장 작은 총비용, 경로가
   없으면 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

행 우선 순서로 한 번 지나가면 둘 다 됩니다: 한 칸의 경로 수는 위와 왼쪽에서
그 칸으로 들어오는 경로 수의 합이고, 최선 비용은 자기 비용에 그 둘 중 싼
쪽을 더한 것입니다. 오른쪽이나 아래로만 움직이므로 필요한 두 칸은 항상
이미 끝나 있습니다 — 그래서 재귀도 방문 집합도 필요 없습니다.

`PATHS` 수를 `1000000007`로 나눈 나머지로 하는 것은 늘 그렇듯: `1000 × 1000`
숨은 케이스에서 실제 수는 600자리가 넘습니다. 더하면서 줄이세요.

**큰 케이스가 강제하는 것:** 경로를 열거하는 모든 답을 거부합니다. 경로는
이 방의 원자보다 많습니다. 상향식 표와 메모이제이션 재귀는 구별하지
않습니다 — 둘 다 칸 수에 선형이고 둘 다 넉넉히 통과합니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에 값을 둘 뽑으세요 — 생성기는 그 칸들을 건너뛰지 않고, 막기를 거부할 뿐입니다.",
  "위나 왼쪽에 열린 이웃이 없는 열린 칸은 경로 0개로 도달되고 최선 비용이 없습니다. i64::MAX를 `도달 불가`의 뜻으로 유지하고 덧셈을 막으세요.",
  "목적지가 열려 있어도 도달 불가능할 수 있고, 그것이 정확히 PATHS가 0이고 MIN이 -1인 경우입니다. 숨은 케이스 중 하나가 그것입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "rust.hacker.34.stable-sort"
title = "동점은 자리를 지킨다"
story = "라이더 둘이 같은 점수로 끝났는데, 리더보드는 다시 그릴 때마다 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 라이더 `n`명을 만들되, 라이더 `i`는
인덱스 `i`와 점수를 가집니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

라이더를 점수 **내림차순**으로 정렬하세요. 점수가 같은 라이더는 들어온
순서를 지켜야 합니다. 인덱스를 공백으로 구분해 출력하고, 그다음
`TIES <k>` — 정렬된 순서에서 점수가 같은 인접 쌍이 몇 개인지 출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 모든 것이 동점이고, 답은 거의 전적으로 동점에
무슨 일이 일어나는지로 정해집니다.

**이것은 지금 어떤 정렬을 들고 있는지 아는 것에 관한 과제입니다.**
`sort_by_key`는 **안정**합니다 — 같은 원소는 상대 순서를 지킵니다.
`sort_unstable_by_key`는 그렇지 않고, 실제 입력에서는 눈에 띄게 그렇지
않을 것입니다: 패턴 무력화 퀵소트이고, 보통 더 빠르며, 동점에 대해 어떤
약속도 하지 않습니다. 스타터는 그것을 쓰고, 숨은 케이스는 그것이 동점을
뒤섞는 것을 보여 줄 만큼 큽니다. (`n = 8`에서는 우연히 그러지 않습니다 —
작은 테스트로는 아무것도 증명되지 않았을 이유이고, 여기서 작은 케이스가
당신을 채점하는 것이 아니라 *보이는* 케이스인 이유입니다.)

정답은 둘이고, 둘 다 말할 수 있어야 합니다. 안정 정렬을 쓰세요. **또는**
불안정 정렬을 쓰되 비교를 **전순서**로 만드세요 — `(Reverse(score), index)`로
정렬하면 어떤 두 원소도 같다고 비교되지 않으므로 안정성은 더 이상 문제가
아닙니다. 기본으로 손을 뻗을 것은 두 번째입니다. 순서가 완전히 명세되어
있으면 불안정 정렬은 증명할 것이 없습니다.
'''
hints = [
  "한 단어: sort_unstable_by_key를 sort_by_key로. 그것이 안정 정렬 쪽 답입니다.",
  "다른 답은 불안정 정렬을 그대로 두고 (Reverse(score), index)로 정렬합니다 — 전순서이므로 불안정할 동점이 남아 있지 않습니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 수는 둘 중 어느 것을 썼든 같습니다 — 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.hacker.28.lru"
title = "화이트보드"
story = "7-32호실, 마지막 문제, 그리고 면접관이 모니터를 끈다. 강조 표시도, 자동 완성도 없이, 시계 하나."
brief = '''
첫 줄은 `cap q`입니다. 다음 `q`줄은 `PUT <key> <value>` 또는 `GET <key>`입니다.

가득 찼을 때 **가장 오래 사용되지 않은** 항목을 내보내는 고정 용량 캐시를
구현하세요. `GET`과 `PUT` 모두 키를 사용한 것으로 칩니다.

각 `GET`마다 값을 출력하고, 없으면 `-1`을 출력하세요. 끝에 살아남은 키를
가장 최근에 사용한 것부터 공백으로 구분해 출력하고 — 캐시가 비었으면
`-` — 그다음 `EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`이
자리가 필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은
맞고 `3`을 가장 최근 것으로 만들며, 그래서 생존자가 `3 1`로 출력됩니다.

교과서 답은 이중 연결 리스트로 들어가는 해시 맵입니다. Rust에서 `unsafe`나
`Rc<RefCell<_>>` 없이 하는 정직한 버전은 단조 증가하는 스탬프를 실은
`HashMap<i64, (i64, u64)>`이고, 내보낼 때는 가장 오래된 것을 훑어 찾습니다.
그것은 내보내기당 O(1)이 아니라 O(cap)이고, 그렇다고 소리 내어 말하는
것이 아닌 척하는 것보다 면접실에서 더 값집니다.
'''
hints = [
  "연산마다 째깍이는 시계 하나, 그리고 건드린 모든 키가 그 눈금을 기록합니다. 최근성은 그러면 정렬할 숫자 하나일 뿐입니다.",
  "이미 있는 키를 덮어쓰는 것은 내보내기가 아닙니다 — 캐시가 가득 찼다고 판단하기 전에 contains_key를 확인하세요.",
  "마지막 줄은 스탬프 내림차순으로 정렬되므로 마지막에 건드린 키가 먼저 옵니다.",
]
