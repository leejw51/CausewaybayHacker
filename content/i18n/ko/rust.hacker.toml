[[quest]]
id    = "rust.hacker.16.union-find"
title = "누가 누구와 이어져 있나"
story = "전차망, MTR, 미니버스 노선이 한 장에. 실제로 분리된 망은 몇 개인가."
brief = '''
첫 줄은 `n m`입니다: `0..n-1`로 번호 매긴 정류장 `n`개, 무방향 연결
