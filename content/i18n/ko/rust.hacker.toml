길이인데, 페이션스 정렬의 더미 수에서 읽어 낸 것입니다.

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

`O(n²)` 표는 준비 없이도 쓸 수 있어야 하는 답입니다. `O(n log n)` 쪽은 각
길이마다 그 길이의 부분 수열이 끝날 수 있는 가장 작은 값을 유지합니다 —
항상 정렬되어 있는 목록이므로 새 값의 위치는 이진 탐색입니다. 여기서는 어느
쪽이든 통과합니다. 케이스가 작고, 그렇다고 말하고 있습니다. 그래도 두
번째 것을 쓰세요. 후속 질문은 언제나 "그럼 더 빠르게는?"이니까요.
'''
hints = [
  "tails는 부분 수열이 아닙니다. 그 길이가 답이고, 내용물은 최선의 끝 값일 뿐입니다.",
  "엄격히 증가이므로 value 이상인 첫 tail을 교체합니다. 그래서 이진 탐색은 tails[mid] < value를 찾습니다.",
  "tails의 끝을 넘어간다는 것은 이 값이 지금까지의 가장 긴 상승을 늘린다는 뜻입니다 — push하세요.",
]

