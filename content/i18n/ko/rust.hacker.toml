'''
hints = [
  "모든 정류장이 자기 자신의 부모이고 그룹이 n개인 상태로 시작하세요. 성공한 union마다 수가 하나 줄어듭니다.",
  "양 끝이 이미 같은 루트를 가진 간선이 불필요한 것입니다 — 세고 넘어가세요.",
  "루트의 크기 항목만 의미가 있으므로, 가장 큰 것은 모든 인덱스가 아니라 루트들에서 읽으세요.",
]

