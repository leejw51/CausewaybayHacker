[[quest]]
id    = "rust.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 클리어한 모든 지도는 정류장 수를 셌다. 전차는 정류장이 몇 개인지 신경 쓰지 않는다. 얼마나 걸리는지를 신경 쓴다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 가중치 있는 무방향 간선 `m`개.
그래프는 당신이 직접, **정확히** 이 생성기로, 감기는 `u64`로 만드세요:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 도달 가능한 모든 정류장까지의 최단 거리의 합 (`0` 자신도
포함, 그것은 `0`)을 출력하고, 그다음 `MAX <the largest of them>`을
출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 100000`,
`m = 200000`입니다. 다익스트라는 어느 쪽이든 맞는 알고리즘입니다. 시계가
가르는 것은 우선순위 큐입니다. 방문하지 않은 모든 노드를 훑어 최솟값을
찾는 것은 `O(V²)`이고, 5초 실행 제한에 대해 **약 16초**가 걸립니다. 이진
힙이면 `O((V + E) log V)`가 되고 **약 50밀리초**에 끝납니다. 두 수치 모두 이
기계에서, 이 과제에 딸린 두 프로그램으로 측정한 것입니다: 스타터가 훑는
버전입니다.

분명히 봐 둘 만합니다. 시간 제한 스크린에서 떨어지는 가장 흔한 방식이기
때문입니다: **스타터는 틀리지 않았습니다.** 정확히 맞는 답을 출력합니다.
세 배 늦게 도착한다는 이유만으로 거부됩니다.

`std::collections::BinaryHeap`은 최대 힙이므로 `Reverse((distance,
node))`를 push하세요. decrease-key는 없고, 필요하지도 않습니다: 개선된
거리를 새 항목으로 push하고, pop한 항목의 거리가 이미 기록된 것보다
나쁘면 건너뛰세요. 그 "오래된 항목" 건너뛰기가 사람들이 잊는 줄이고, 없으면
힙이 한없이 자랍니다.
'''
hints = [
  "Reverse((distance, node))가 최대 힙을 최소 힙으로 바꾸고, distance를 앞에 두어 그것이 항목의 순서를 정하게 합니다.",
  "`if d > dist[u] { continue; }`가 오래된 항목 건너뛰기입니다. 없어도 알고리즘은 여전히 맞지만 힙이 폐기된 항목으로 채워집니다.",
  "생성기의 신장 트리 절반이 모든 노드의 도달 가능성을 보장하므로 i64::MAX에 대한 필터는 실제로는 아무것도 걸러 내지 않습니다 — 그래도 두세요. 도달 불가능한 노드가 있는 버전의 이 질문이 후속 질문이니까요.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "rust.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "체인 전체의 하루치 계산대 작업 사백만 건, 그중 절반은 정정, 그리고 누군가는 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만든 다음 연산 `q`개를
실행하되, 전부 같은 생성기에서, 감기는 `u64`로 합니다:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**여기서는 복잡도가 강제되고, 그렇게 만드는 데 꽤 애를 썼습니다.** 순진한
답 — 질의마다 범위를 루프로 도는 것 — 은 질의당 `O(n)`인데, 이 기계에서는
컴파일러가 그것을 놀랄 만큼 빠른 것으로 벡터화하기*까지* 합니다. 작은
케이스로는 잡히지 않습니다. 그래서 큰 숨은 케이스는 `n = 500000, q = 4000000`이고,
거기서 순진한 답은 `10^11` 규모의 원소를 건드려 5초 실행 제한 안에 끝나지
않는 반면, 펜윅 트리는 전체를 약 0.1초에 해냅니다. 둘 다 이 과제의 두
프로그램으로 측정했습니다.

교훈은 면접관이 낚으려는 그것입니다: *점 갱신, 구간 합*은 펜윅 트리가
존재하는 정확히 그 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두
prefix의 차로 구하는 range — 그리고 `i & i.wrapping_neg()`가 가장 낮은 켜진
비트만큼 걸음을 옮기는 방법입니다.
'''
hints = [
  "초기 값마다 add를 한 번씩 호출해서 트리를 만드세요. O(n) 상향식 구축은 멋진 최적화이지만 시계가 검사하는 것은 아닙니다.",
  "i & i.wrapping_neg()가 가장 낮은 켜진 비트를 뽑아냅니다. 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "range(l, r)는 prefix(r + 1) - prefix(l)이고, 그 하나 차이 한 쌍을 맞히는 것이 디버깅의 대부분입니다.",
]

