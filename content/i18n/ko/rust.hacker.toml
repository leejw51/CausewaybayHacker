[[quest]]
id    = "rust.hacker.17.lis"
title = "가장 긴 상승"
story = "일 년치 일일 매출. 매출이 나아지는 가장 긴 날들의 흐름을 원하는데, 연속일 필요는 없다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개입니다.

가장 긴 **엄격히 증가하는 부분 수열**의 길이를 출력하세요 — 값들은 순서를
