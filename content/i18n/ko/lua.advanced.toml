[[quest]]
id    = "lua.advanced.12.frozen"
title = "바뀌지 않는다"
story = "오늘 밤의 인쇄된 가격표가 18:00에 모든 노점에 배부되는데, 21:30이 되면 세 곳이 그 위에 뭔가를 적었고 한 곳은 없는 열을 하나 추가했다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 형식의 `n`줄입니다.

각 줄을 **얼린** 레코드 `Price.new(name, cents)`로 만드세요. 그다음 각 가격에 대해 그 `cents`를 덮어쓰려 시도하고, 시도가 던지면 `FROZEN <NAME>`을 출력하세요. 다음으로, 선언된 슬롯 `count` 하나를 가진 `Tally` 클래스: `tally.count`를 설정한 뒤 철자가 틀린 `tally.cuont`를 설정하려 시도하고, *그것이* 던지면 `SLOTS YES`를 출력하세요. 마지막으로 **값**으로 키를 삼은 가격 집합의 크기 `IN_SET <k>`와 `TOTAL <sum>`을 출력하세요.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

Lua 테이블은 언제나 쓸 수 있습니다. 얼리는 것은 메타테이블 요령입니다. 필드는 호출자가 절대 보지 못하는 테이블에 두고, `__index`가 그 필드들인 — 모든 읽기가 그리로 떨어지는 — 그리고 `__newindex`가 던지는 **빈 프록시**를 돌려주세요: 프록시에 없는 키로의 모든 쓰기가 거기로 가는데, 프록시에는 키가 하나도 없습니다. 대입을 감싼 `pcall`이 죽지 않고 시도하는 방법입니다.

집합이 나머지 절반입니다. 테이블은 **동일성으로** 키가 됩니다: 필드가 같은 두 레코드는 두 개의 키이고, 스타터의 `IN_SET`은 `3`이라고 합니다. 얼린 레코드는 키가 필드로 만들어질 때만 — `price:key()` — 자기 값을 대표할 수 있고, 그것이 안전한 것은 바로 그 아래에서 필드가 바뀔 수 없기 때문입니다.

`Tally`의 슬롯도 역시 `__newindex`로, 선언된 이름만 허용합니다: `count`에는 `rawset`, 그 밖의 것에는 에러. 속성 이름의 오타는 아무도 읽지 않는 조용한 새 필드 대신 대입 시점의 에러가 됩니다.
'''
hints = [
  "Price.new는 메타테이블에 __index = 필드들과 에러를 내는 __newindex가 있는 빈 테이블을 돌려줍니다. 읽기는 그리로 떨어지고, 쓰기는 메타메서드 말고는 떨어질 곳이 없습니다.",
  "집합의 키는 필드로 만든 문자열인 price:key()로 삼으세요. 테이블 자체는 자기 자신에게만 키입니다.",
  "TOTAL은 원래 센트의 합인데, 그것은 대입이 실패했기 때문에만 성립합니다. 스타터에서는 그 시점에 모든 가격이 0이고 TOTAL은 0입니다 — 변경이 허용되기만 한 게 아니라 실제로 통했습니다.",
]

