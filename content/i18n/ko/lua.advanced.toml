[[quest]]
id    = "lua.advanced.06.async-queue"
title = "누가 끝났다고 말하나"
story = "심부름꾼 셋이 빅토리아 파크 등불 문의 표 큐를 처리하고, 진행 요원은 큐가 비었다고 말하기를 기다린다. 큐는 절대 그렇게 말하지 않는다. 표 하나가 끝났다고 아무도 알려 주지 않았으니까."
brief = '''
표준 입력은 정수 둘 `w`와 `n`, 그다음 값 `n`개입니다.

대기 중인 것을 세는 큐에 `{ index, value }` 일을 넣으세요. 영원히 돌며 일을 꺼내고, `value * 10`을 `results[index]`에 쓰고, `task_done`을 호출하는 소비자 코루틴 `w`개를 시작하세요. 메인 함수는 `join` — 모든 `put`이 자기 `task_done`을 받을 때까지 소비자를 재개하는 스케줄러 — 을 돌리고, 그다음 소비자를 취소하고, 그다음 결과를 인덱스 순서로 출력한 뒤 `CONSUMERS <w>`를 출력합니다.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join`은 대기 수가 `0`일 때 돌아오고, 그것을 줄이는 것은 `task_done`뿐입니다. 스타터의 소비자는 그것을 한 번도 호출하지 않으므로, 모든 일이 처리되었는데도 수는 여전히 `4`이고, 모든 소비자는 빈 큐 위의 `get`에 세워져 있으며, 무엇이든 바꿀 수 있는 것은 아무것도 남지 않습니다. 감지기가 없는 루프라면 실행기가 프로그램을 죽일 때까지 거기서 헛돌 겁니다. 이 루프는 감지합니다: 어떤 소비자도 수를 줄이지 못한 라운드 하나가 교착이고, `join`은 `error`로 그렇게 말합니다. 창구 퀘스트와 같은 멈춤, 다른 철자 — 그리고 수정은 이번에도 소비자 쪽의 한 줄입니다.

소비자는 `while true` 루프입니다. main이 join 뒤에 취소하기 때문에 끝나고, 여기서 취소란 **신호와 함께 재개하기**입니다: `get`은 큐가 비어 있는 동안 yield하고, 그것을 깨우는 재개가 `"cancel"`을 넘기면 `get`은 `nil`을 돌려주고 소비자는 반환합니다. yield에 세워진 코루틴은 깨어나며 받는 값으로 멈춥니다.
'''
hints = [
  "일을 처리할 때마다 task_done(queue). join은 put과 task_done의 수를 맞춰 볼 뿐, 다른 것은 보지 않습니다.",
  "coroutine.create는 아무것도 스케줄하지 않습니다. 소비자는 join이 처음 재개할 때 돌고, 큐가 빈 것을 본 소비자는 get 안에서 \"idle\"을 yield합니다.",
  "\"cancel\"로 깨워진 소비자는 get에서 nil을 받고 반환하며, 그것이 while true를 끝냅니다. 아무것도 없이 재개하면 다시 세워질 뿐입니다.",
]

