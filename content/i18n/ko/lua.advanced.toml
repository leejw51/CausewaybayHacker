brief = '''
표준 입력은 개수 `n`, 그다음 `<ITEM> <PRICE>` 형식의 `n`줄입니다. `PRICE`는 센트 단위의 정수입니다. 품목은 많아야 한 번 나오고, `n`은 적어도 `1`입니다 — 이름을 댈 가장 싼 품목이 항상 있습니다.

세 줄을 출력하세요:

1. 가격이 **100을 엄격히 넘는** 모든 품목을 `ITEM=PRICE`로, 품목으로 정렬해 공백 하나씩으로 이은 것 — 하나도 없으면 `-`
2. 모든 품목을 가격을 **정수 나눗셈으로 반으로** 해서, 같은 형식으로, 품목으로 정렬
3. `CHEAPEST <item>` — 가장 낮은 가격, 같으면 품목 오름차순

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

지난 노드의 키 버전입니다. Lua에는 dict 컴프리헨션이 없습니다. 가장 가까운 것은 `filter_pairs(t, keep)`와 `map_values(t, f)`로, 각각 같은 키로 새 테이블을 채우는 `pairs` 루프입니다. 첫 줄은 값이 100을 넘는 쌍을 남기고, 둘째 줄은 모든 값을 `math.floor(v / 2)`로 바꾸며 모든 키를 남깁니다. 어느 쪽도 컴프리헨션이 아니고, 둘 다 한 번 쓰는 함수 하나씩입니다.

`pairs`에는 순서가 없으므로 `sorted_keys(t)` — 키를 리스트에 담아 정렬한 것 — 가 세 번째 도우미이고, 출력하는 모든 줄이 그것을 거칩니다. 가장 싼 것은 정렬된 키를 걸으며 엄격히 더 낮은 첫 가격을 남기세요: 키가 알파벳 순으로 오므로, 같은 가격 중 첫 번째가 곧 동률 처리입니다.
'''
hints = [
  "filter_pairs는 keep(key, value)가 true일 때 키를 남기고, map_values는 모든 키에 f(value)를 씁니다. 둘 다 새 테이블을 채웁니다 — 걷고 있는 테이블에는 절대 쓰지 마세요.",
  "sorted_keys(t)는 키 테이블을 정해진 순서로 출력하는 유일한 방법입니다. 가장 싼 것을 포함해 여기의 모든 줄이 그것을 거칩니다.",
  "정렬된 키를 걸으며 엄격히 더 낮은 가격일 때만 최선을 바꾸세요: 같은 가격 중 첫 번째가 알파벳으로 첫 번째이므로 동률은 저절로 정리됩니다.",
]

