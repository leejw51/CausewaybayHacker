[[quest]]
id    = "lua.advanced.17.none"
title = "20:59의 가격판"
story = "20:59, 원사 스트리트, 북은 아직 울리지 않았다. 가격판이 장부에 아직 열지 않은 노점을 물어보고, 장부는 아무것도 아닌 것으로 대답하고, 가격판은 그 아무것도 아닌 것의 가격을 찍는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <CENTS>` 형식의 `n`줄 — 문을 연 노점들 — 그다음 개수 `q`와 조회할 노점 이름 `q`개입니다.

조회마다 `<STALL> <cents>`를, 그 노점이 열지 않았으면 `<STALL> NONE`을 출력하세요. 그다음 `MISSING <k>`와 `CHEAPEST <STALL>` — 문을 연 노점 중 가격이 가장 낮은 것, 같으면 이름으로 — 을, 열린 것이 없으면 `CHEAPEST NONE`을 출력하세요.

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

스타터는 `CHAN`에서 죽습니다:

```
attempt to index local 'stall' (a nil value)
```

그 줄이 이 길 구간의 보스입니다. 그것은 절대 버그를 가리키지 않습니다. `nil`이 마침내 *따라가진* 자리를 가리키는데, 그 자리는 그것이 *만들어진* 자리에서 얼마든지 떨어져 있을 수 있습니다 — 그리고 스타터에서는 두 군데에서 만들어졌습니다. `lookup`은 `board[name]`을 돌려주는데, 없는 노점에 대해서는 설계상 `nil`이고, 호출자는 묻지도 않고 거기서 `.cents`를 읽습니다. 그리고 `cheapest`는 나가는 길에 `return`이 없어서 아무것도 돌려주지 않고, 호출자는 그것을 `nil`로 받아 똑같은 짓을 합니다.

아무도 쓰지 않은 키는 `nil`입니다. 끝까지 흘러내린 함수는 `nil`을 돌려줍니다. 어느 쪽도 그 시점에는 에러가 아니고, 둘 다 나중에 에러가 됩니다. 수정은 두 번 다 같습니다: `nil`을 받을 수 있는 코드가 인덱스하기 전에 `== nil`로 검사합니다. (Lua에서 거짓은 `nil`과 `false`뿐이므로 여기서는 `if not stall`도 맞습니다 — 가격이 `0`인 노점도 여전히 테이블입니다 — 하지만 `== nil`이 뜻하는 바를 말합니다.)

`lookup`과 `cheapest`가 일부러 노점 **또는 nil**을 돌려주게 하고, 주석으로 그렇다고 말하고, `nil`이 떨어지는 곳에서 처리하세요.
'''
hints = [
  "트레이스백을 읽으세요: 에러는 print에서 났지만, nil은 한 줄 위의 lookup에서 나왔고, 그 전에는 board[name]에서 나왔습니다.",
  "if stall == nil then이 검사입니다. cents = 0인 테이블은 nil도 false도 아닙니다. Lua에서 거짓은 nil과 false뿐입니다.",
  "cheapest는 board를 걸은 뒤 return 없이 끝납니다. Lua는 그것을 경고하지 않습니다. 호출자는 nil을 받고 나중에 알게 됩니다. best를 돌려주세요. best가 한 번도 설정되지 않았으니 빈 board는 nil을 돌려줍니다.",
  "pairs는 board를 순서 없이 걷습니다. 그래서 비교가 스스로 동률을 정리해야 합니다: 더 낮은 cents, 그다음 더 작은 이름. 어느 노점이 먼저 왔는지는 절대 믿지 마세요.",
]

