[[quest]]
id    = "lua.advanced.14.iterator"
title = "다음, 멈출 때까지"
story = "빅토리아 파크 등불 문의 번호표 기계는 시작 번호부터 정해진 간격으로 번호를 나눠 주면서 그 목록을 어디에도 두지 않고, 대기 안내판은 그것을 여느 리스트처럼 돌고 싶어 한다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

**이터레이터 프로토콜을 손으로** 구현하는 클래스 `Tickets`를 쓰세요: `next`는 다음 값을, `count`개의 값을 다 나눠 준 뒤에는 `nil`을 돌려주고, `iter`는 범용 `for`에 필요한 것을 돌려줍니다. 각 값을 한 줄에 출력한 뒤, 두 번째 `Tickets`를 `sum`에 넘겨 계산한 `SUM <total>`을 출력하세요.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

이것이 `coroutine.wrap`이 당신 대신 써 주는 것입니다. 범용 `for`는 세 가지 — 함수 `f`, 상태 `s`, 제어 값 — 를 받고, 매 차례 전에 `f(s, control)`을 호출해 첫 결과가 `nil`이면 멈춥니다. `Tickets.next`는 이미 그 모양입니다: `self`가 상태이고, 두 번째 매개변수는 무시해도 되는 제어 값입니다. 그러니 `iter`는 한 줄입니다: `return Tickets.next, self`. `sum`, `collect`, `for`는 모두 같은 춤을 추고, 어느 것도 상태가 무엇인지 상관하지 않습니다.

스타터에는 `next`만 있고 `iter`가 없어서, `for`가 `attempt to call method 'iter' (a nil value)`라고 합니다. 여기서는 `next`의 `nil`이 `StopIteration`입니다. 그래서 번호표는 절대 `nil`일 수 없고, `0`은 멀쩡한 번호표입니다 — `0`은 `nil`이 아닙니다.

`iter`가 상태로 `self`를 돌려주는 것이 **이터레이터**의 표시입니다: 한 번 걸을 수 있고 그러면 다 쓴 것입니다. **컨테이너**는 `iter`에서 매번 새 상태를 돌려주고 되풀이해 걸을 수 있습니다. 이 길 앞쪽의 `Bag`이 그랬습니다. 어느 쪽을 쓰는지 말하세요. 그 차이는 누군가 두 번째로 돌 때 드러납니다.
'''
hints = [
  "function Tickets:iter() return Tickets.next, self end. 값 둘이면 for가 동작하기 시작합니다.",
  "nil은 던지는 것이 아니라 돌려주는 것입니다. for 루프가 그것에서 멈추며, 당신은 그것을 볼 일이 없습니다. 전진하기 전에 돌려줄 값을 먼저 저장하세요. 아니면 한 스텝 어긋납니다.",
  "for value in obj:iter()는 for value in Tickets.next, obj입니다 — 메서드 호출은 그 쌍을 만들 뿐입니다. self를 붙잡은 클로저를 돌려줘도 되지만, 그 쌍이 여분의 함수 없는 프로토콜입니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "lua.advanced.15.collections"
title = "알맞은 컨테이너"
story = "위원회 책상은 오늘 밤의 표를 긴 리스트 하나에 두고, 그것에 대한 모든 질문에 맨 위부터 읽어서 답한다."
brief = '''
표준 입력은 세 줄입니다: 단어 한 줄, 이미 **오름차순으로 정렬된** 정수 한 줄, 그리고 정수 `x` 하나.

네 줄을 출력하세요:

1. `TOP <word> <count>` — 가장 잦은 단어, 같으면 단어 오름차순 — 횟수 테이블에서
2. `BISECT <l> <r>` — 정렬된 정수들에서 `x`의 `bisect_left`와 `bisect_right`: `x`보다 작은 값이 몇 개인지, 그리고 `x`보다 크지 않은 값이 몇 개인지
3. `SMALLEST3` 뒤에 가장 작은 정수 셋 — **힙**에서 꺼낸 것 — 더 적으면 더 적게
4. `GROUPS` 뒤에 단어의 첫 글자마다 `<letter>:<k>`, 글자 오름차순 — 첫 글자를 키로 하고, `__index`가 **첫 접근에 리스트를 만드는** 테이블에서

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

Lua는 컨테이너를 하나만 싣고 오고, 나머지는 모두 테이블에 규율을 더한 것입니다. 스타터의 `TOP`은 최다 횟수에 처음 도달한 단어를 남기는데, 그것은 **삽입 순서**로 `tofu`이고, 문제는 `egg`라고 합니다: 단어를 정렬하고 뜻하는 바를 말하세요. 그 `BISECT`는 `x`의 인덱스를 훑다가 `x`가 없으면 넘어집니다. 정렬된 리스트에 대한 이진 탐색은 절대 던지지 않고, `left`와 `right`는 `x`의 사본이 몇 개인지만큼 다릅니다. 그 `SMALLEST3`은 앞에서 값 셋을 읽으려고 리스트 전체를 정렬하는데, 그것은 `k`가 작고 `n`이 작지 않을 때 힙이 피하려고 존재하는 바로 그 일입니다. 그리고 그 `GROUPS`는 횟수 테이블을 `pairs` 순서로 걷는데, 그것은 전혀 순서가 아닙니다.

`setmetatable({}, { __index = function(t, k) local v = {}; rawset(t, k, v); return v end })`가 Lua의 `defaultdict(list)`입니다: 없는 키를 처음 읽으면 리스트를 만들어 저장하므로, `groups[letter][#... + 1]`에는 검사가 필요 없습니다.
'''
hints = [
  "words 대신 sorted_keys(counts)를 걸으며 엄격히 더 큰 횟수일 때만 top을 바꾸세요. 그러면 동률은 알파벳으로 첫 번째인 egg에게 갑니다.",
  "bisect_left와 bisect_right는 절대 던지지 않습니다. 스타터의 index_of는 x가 없으면 nil을 돌려주고, 숨겨진 케이스 하나가 정확히 그것입니다. 둘은 <를 <=로 바꾼 같은 루프입니다.",
  "힙은 i의 부모가 floor(i / 2)인 리스트입니다: push는 끝에 붙이고 위로 헤엄쳐 올리며, pop은 마지막 항목을 맨 위로 옮겨 가라앉힙니다. 세 번 pop하면 n이 무엇이든 가장 작은 셋입니다.",
  "__index 메타메서드는 없는 키에 대해서만 돕니다. 그 안의 rawset이 새 리스트를 저장하므로 다음 읽기는 평범한 적중입니다. 출력하기 전에 키를 정렬하세요 — 메타테이블이 있는 테이블도 여전히 순서가 없습니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "lua.advanced.16.timeouts"
title = "그만 기다리기"
story = "진행 요원의 게시판이 골목의 노점마다 대기 시간을 물어보는데, 카드 단말기가 죽은 노점은 영영 대답하지 않고, 그래서 게시판은 영영 다시 그려지지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <SECONDS>` 형식의 `n`줄이고, `SECONDS`는 곧바로 대답하는 노점이면 `0`, 제때 대답하지 않는 노점이면 `1`입니다.

여기서 시간은 **틱**입니다: 10분의 1초가 `coroutine.yield()` 한 번이고, `fetch(stall, seconds)`는 초당 열 번 yield한 뒤 `<STALL> OK`를 돌려줍니다. 노점마다 그 `fetch`를 `wait_for(task, 2)` — 두 틱, 0.2초의 기한 — 아래 코루틴으로 돌리고, 입력 순서로 `<STALL> OK` 또는 `<STALL> TIMEOUT`을 출력하세요. 그다음 영원히 도는 `watch()` 코루틴을 시작해 한 차례를 주고, **`"cancel"`과 함께 재개해서** 취소하고, 그것이 자기 처리기에서 `CANCELLED`를, 모든 경로에서 도는 코드에서 `CLEANUP`을 출력하게 하세요. 마지막으로 `TIMEOUTS <k>`를 출력하세요.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for`는 태스크를 많아야 `ticks`번 재개하고 끝났는지 보고합니다. 마지막 차례 뒤에도 여전히 `suspended`라면 그것이 시간 초과이고, 그 태스크는 그냥 다시는 재개되지 않습니다. 스타터는 대신 `fetch`를 끝까지 재개하므로, `WONG`이 열 틱을 다 쓰고 나서 `OK`라고 합니다.

코루틴을 취소하는 것은 그것이 세워져 있는 yield에 값을 배달하는 것입니다. `watch`는 `pcall` 안에서 yield하고, yield가 `"cancel"`을 돌려주면 던집니다. `pcall`이 그것을 잡고 — `CANCELLED`를 출력하는 처리기 — 그다음 정리 줄이 돌고, 그다음 에러가 다시 던져지므로, 취소를 배달한 재개는 `false, "cancelled"`를 돌려받습니다. 스타터는 워처를 만들고, 한 차례 주고, 내버립니다: 아무도 다시 재개하지 않는 코루틴은 영원히 아무것도 실행하지 않고, 두 줄 모두 출력되지 않습니다. 처리한 뒤에는 다시 던지세요 — 취소를 삼키는 것이 태스크가 취소 불가능해지는 방법입니다.
'''
hints = [
  "wait_for(task, 2): 최대 두 번 재개하고, 태스크가 죽었으면 true와 결과를, 아니면 false를 돌려줍니다. 시간 초과된 태스크는 그냥 다시는 재개되지 않습니다.",
  "coroutine.resume(watcher, \"cancel\") — 그 문자열이 워처의 yield가 돌려주는 것이고, 워처 자신의 코드가 그것을 에러로 바꿉니다. 변수를 nil로 두는 것은 아무것도 취소하지 않습니다. 코루틴을 잊을 뿐입니다.",
  "create 뒤의 첫 재개가 워처에게 시작해서 yield에 세워질 차례를 주므로, 취소는 아직 시작도 안 한 함수가 아니라 떨어질 yield를 갖게 됩니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.advanced.17.coroutine"
title = "코루틴"
story = "원사 스트리트, 온 길이로 뻗은 용, 마디마다 향 심부름꾼 하나. 그중 하나가 절대 차례를 넘기지 않고, 북은 계속 울리는데 용 전체가 한 마디에서 멈추고, 합계는 아무것도 아닌 것으로 돌아온다."
brief = '''
표준 입력은 정수 둘 `k`와 `n`입니다.

`1..n`을 연속된 `k`개의 덩어리로 나누고 — 덩어리 `i`는 `floor(n*i/k) + 1`부터 `floor(n*(i+1)/k)`까지(포함) — 각 덩어리를 자기 **코루틴**에 주어 그 범위의 제곱의 합을 구하게 하세요: 평범한 루프, 라이브러리 호출 없이, 10만 개마다 yield해서 다른 것들이 차례를 받게. 모든 심부름꾼은 자기 결과를 yield가 없는 한 구간에서 **공유 합계 하나**에 더하고, 자기 칸에도 기록합니다. 모두가 죽을 때까지 라운드 로빈으로 돌리세요. 덩어리마다 인덱스 순서로 `CHUNK <i> <sum>`을 출력한 뒤 `TOTAL <sum>`, 그다음 `THREADS <k>`를 출력하세요 — 코루틴의 타입 이름은 `thread`이고, 그것이 개수입니다.

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

스타터는 타이밍과 아무 상관 없는 이유로 실패합니다. `local part = coroutine.resume(co, lo, hi)`는 `resume`의 **첫** 결과를 간직하는데, 그것은 `true`이고, 그 뒤에 따라온 답은 바닥에 떨어집니다. 첫 `CHUNK` 줄은 `attempt to concatenate local 'part' (a boolean value)`입니다. 그것이 작은 버그입니다. 서랍 퀘스트가 한 방식으로 고치세요: 읽기와 쓰기 사이에 yield 없이 갱신하는 공유 합계, 정확히 한 심부름꾼만 쓰는 덩어리별 칸, 그리고 락 퀘스트의 스케줄러 — 죽지 않은 모든 심부름꾼이 남은 것이 없을 때까지 차례를 받습니다.

큰 케이스에서 합은 2^53을 넘고, Lua의 숫자는 double입니다: 그 지점을 넘으면 `+`가 반올림합니다. 각 합을 림 둘 — 10^9 미만의 낮은 부분과 나머지인 높은 부분 — 로 들고 다니다가 `%d%09d`로 출력하세요.

큰 것이 보스이고, 그것은 고칠 수 있는 버그가 아닙니다. 이것을 `k = 4`, `n = 4000000`으로 돌려 시간을 재고, 그다음 `k = 1`로 돌려 보세요. 같은 시간이 걸립니다. 그다음 루프에서 yield를 지우고 다시 돌려 보세요: 같은 출력, 같은 시간, 에러 없음. 코루틴은 `yield`라고 말할 때까지 차례를 쥐고 있습니다. 그 말을 절대 하지 않는 심부름꾼은 다른 셋이 기다리는 동안 끝까지 돌고, 아무것도 알려 주지 않습니다. 다른 누구도 그 차례가 필요하지 않았으니까요. 그것이 북은 계속 울리는데 한 마디에서 멈춘 용입니다. 코어 넷 위의 코루틴 넷은 제곱을 차례로, 코어 하나에서, 전환 비용을 더해 합합니다. LuaJIT에는 스레드가 없습니다. 코루틴은 멈출 자리이지 두 번째 코어가 아닙니다. 실행은 각 심부름꾼이 쉴 수 있다고 말한 자리에서 **차례로** 일어납니다. 병렬 작업은 두 번째 프로세스 — `io.popen` — 이거나, LÖVE 클라이언트의 `love.thread`, 즉 아무것도 공유하지 않고 채널로 대화하는 별도의 Lua 상태입니다.

출력이 결정적인 것은 덩어리를 인덱스로 출력하고 합계가 심부름꾼이 끝난 순서가 아니라 덩어리들의 합이기 때문입니다. `TOTAL`은 칸들을 합해서가 아니라 공유 합계에서 출력하세요 — yield 없는 갱신이 이 지도가 다루는 바로 그것이고, 둘은 일치해야 합니다.
'''
hints = [
  "resume은 ok를 먼저, 값은 그 뒤에 돌려줍니다. 더 나은 방법: work에 인덱스와 쓸 칸, 더해 넣을 공유 합계를 주고, 스케줄러가 죽을 때까지 재개하게 하세요. 그러면 resume에서 아무것도 나올 필요가 없습니다.",
  "라운드마다 모두 재개하고, 그다음 출력하세요. 심부름꾼 안에서 출력하면 뒤섞일 수 있고, 루프 뒤에 칸들에서 출력하면 그럴 수 없습니다.",
  "림 둘: lo는 10^9 미만이고, 더할 때마다 올림을 hi로 옮깁니다. 41666791666750000은 hi 41666791과 lo 666750000이고, %d%09d로 출력됩니다.",
  "n*(n+1)*(2n+1)/6이 합계의 닫힌 형태입니다. TOTAL을 그것과 한 번 대조하면 덩어리 경계가 맞다는 것을 압니다. 그다음 큰 n에서 k=1과 k=4의 시간을 재 보세요: 둘이 같다면, 당신은 코루틴을 만난 것입니다.",
]
