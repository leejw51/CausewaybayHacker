[[quest]]
id    = "lua.advanced.13.exceptions"
title = "당신만의 오류"
story = "쌀 카운터 가격 계산의 네 층이 저마다 다른 것을 던지고, 카운터 앞단은 그중 하나를 잡고 나머지에 쓰러진다."
brief = '''
표준 입력은 개수 `n`, 그다음 `n`줄이고, 각 줄은 kg 단위의 무게여야 합니다.

**테이블**로 오류 계층을 정의하세요: 기반으로 `PriceError`, 거기서 `class(PriceError)`로 만든 `NotANumber`와 `Negative`. `Negative`는 무게를 지니고 메시지는 `negative weight: <kg>`이며, `NotANumber`의 메시지는 `not a number`입니다. `price(text)`는 텍스트를 변환하되 파싱 실패를 `cause`로 간직한 `NotANumber`를 던지고, 음수 무게는 거부하고, 그 밖에는 `500 + 100 * kg`을 돌려줍니다.

각 가격 또는 오류의 메시지를 출력한 뒤 `ERRORS <k>`를 출력하세요. `is_a`로 **기반 클래스**를 한 번 잡으세요.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative weight: -2
        ERRORS 2
```

`error`는 어떤 값이든 던지고, 메시지와 원인과 클래스를 지닐 수 있는 것은 테이블입니다. 클래스는 그 메타테이블이고, `is_a(err, cls)`는 거기서부터 `parent` 링크를 따라 올라가며, `if is_a(err, PriceError)` 하나가 계층의 모든 멤버를 잡습니다. 스타터는 `Negative`만 잡고 나머지는 아무것도 잡지 않으므로, `xx` 줄이 잡히지 않은 테이블로 프로그램을 쓰러뜨립니다: `(error object is not a string)`.

`print(err)`는 `tostring(err)`를 출력하고, `tostring`은 `__tostring`을 **메타테이블에서 직접** 찾습니다 — 메타메서드는 `__index` 사슬을 통해 찾아지지 않습니다 — 그래서 `class`는 자기가 만드는 모든 클래스에 하나씩 달아 주어야 합니다. `cause`는 실패한 파싱에서 `pcall`이 건네준 문자열입니다. 여기서는 아무것도 그것을 출력하지 않지만, 디버거라면 둘을 위아래로 보여 줄 겁니다. 그 사슬이 그것을 간직하는 이유입니다.
'''
hints = [
  "elseif is_a(result, PriceError) then — 기반 클래스가 두 서브클래스를 모두 잡고, 기반 클래스를 두는 이유가 그것입니다.",
  "print(result)는 tostring(result)를 출력하는데, 그것은 오류 자신의 클래스에 있는 __tostring입니다. 처리기에서 서식을 만들 필요가 없습니다.",
  "여러 클래스를 검사할 때는 순서가 중요합니다: 기반 클래스 검사 뒤의 서브클래스 검사는 죽은 코드이고, Lua는 경고해 주지 않습니다. 알아보지 못한 것은 삼키지 말고 다시 던지세요 — error(result, 0).",
]

