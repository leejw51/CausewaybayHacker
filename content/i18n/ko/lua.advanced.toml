[[quest]]
id    = "lua.advanced.08.pipeline"
title = "라인 쿡"
story = "타이항 만두 노점의 보 셰프 라인: 한 스테이션이 주문을 제곱하고, 다음 스테이션이 누계를 유지하고, 아무도 한 배치 전체를 기다리지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

**코루틴 이터레이터**로 두 단계 파이프라인을 만드세요:

1. `squares(values)`는 각 값을 제곱해 yield합니다
2. `running(stream)`은 숫자의 어떤 이터레이터든 받아 누계를 유지하며 `value, total` 쌍을 yield합니다

`main`은 각 쌍을 `<square> <total>`로 출력한 뒤 `PIPE <n>`을 출력합니다.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

어느 단계도 리스트를 만들지 않습니다. 각 `coroutine.yield`는 항목 하나를 다음 단계에 건네고 멈춥니다. `main`이 당기고, `running`이 `squares`에서 당기고, `squares`가 입력에서 당깁니다. 원하기 전에는 아무것도 계산되지 않고, 파이프라인 전체가 한 번에 항목 하나만 들고 있습니다. 그것이 같은 세 함수를 1억 줄짜리 파일에서도 동작하게 합니다.

스타터의 두 번째 단계에는 `yield`가 있어야 할 자리에 `return`이 있어서, 최종 합계 — 숫자 — 를 돌려주는 평범한 함수이고, `main`의 `for`는 그것을 호출하려 합니다: `attempt to call a number value`.
'''
hints = [
  "에러는 attempt to call a number value입니다 — running이 for가 호출할 수 있는 이터레이터 대신 합계를 돌려주었습니다.",
  "루프를 coroutine.wrap으로 감싸고 그 안에서 coroutine.yield(value, total). yield는 값을 여럿 실어 나를 수 있고, for는 그것을 여러 변수로 받습니다.",
  "running(squares(nums))이 조합되는 것은 감싼 코루틴이 for가 호출할 수 있는 함수이기 때문입니다. running은 자기 입력이 또 다른 코루틴이라는 것을 알지도 못하고 상관하지도 않습니다.",
]

