input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Lua에는 스레드가 없습니다. 코루틴이 있고, 코루틴에 대한 `type(co)`는 문자열 `thread`이며, 그것이 마지막 줄의 개수입니다. `coroutine.create(f)`는 `f`를 실행하지 않습니다. `coroutine.resume(co, ...)`가 그것을 실행하는데, **첫** 재개에서는 인자들이 `f`의 매개변수가 되고, yield하거나 반환할 때까지 돕니다 — `square`는 한 번도 yield하지 않으므로 재개 한 번이 일의 전부입니다. 결과는 나중에 `main`이 읽을 수 있는 어딘가에 써야 합니다. 심부름꾼마다 칸이 있는 테이블이 그런 곳 중 가장 단순합니다.

스타터의 심부름꾼들은 시작하자마자 모두 죽는데, 프로그램은 그래도 끝까지 가서 출력합니다. 인자 없는 `coroutine.resume(co)`는 `square(nil, nil)`을 호출하고, `nil`에 대한 산술은 코루틴 안에서 터지며, `resume`은 그것을 반환값 — `false`와 메시지 — 으로 알리는데 스타터는 그것을 버립니다. `results`는 비어 있고 모든 줄이 `nil`이라고 합니다. 죽는 코루틴은 자기 자신만 데려갑니다 — `resume`의 두 번째 결과를 읽으세요. 아니면 영영 모릅니다.
'''
hints = [
  "coroutine.resume(co, i, nums[i]) — 첫 재개의 인자들이 square가 받는 것이고, 스타터는 아무것도 넘기지 않습니다.",
  "resume은 ok, ...를 돌려줍니다 — 코루틴이 죽었으면 false와 에러 메시지. 검사하세요. 스타터의 심부름꾼들은 value가 nil인 채로 `value * value`에서 조용히 모두 죽었습니다.",
  "results는 square의 upvalue입니다: 중첩 함수는 main이 보는 것과 같은 테이블을 보며, 그래서 쓴 내용이 나중에 보이는 것입니다.",
]

