[[quest]]
id    = "lua.advanced.12.classes"
title = "노점의 장부"
story = "원사 스트리트의 노점마다 오늘 밤 판매 장부를 따로 두는데, 향 노점의 장부는 모든 줄이 위원회 책상 위의 공용 장부에 적혀 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<ITEM> <CENTS>` 형식의 `n`줄입니다.

품목을 모으는 `Notebook` 클래스를 만들고, 각 품목을 들어온 순서대로 `<ITEM> <CENTS>`로 다시 출력한 뒤 `TOTAL <sum>`을, 마지막으로 `print(book)`으로 장부 자체를 출력하세요 — 그 `__tostring` 메타메서드는 `Notebook(items=<n>, total=<sum>)`을 만들어야 합니다.

```
input:  2
        TOFU 600
        SET 2800
output: TOFU 600
        SET 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n`은 `0`일 수 있고, 그러면 줄들은 `TOTAL 0`과 `Notebook(items=0, total=0)`입니다.

Lua의 클래스는 모든 인스턴스의 메타테이블로 설정된 메서드 테이블이고, `__index`가 자기 자신을 가리킵니다: 인스턴스에 없는 키는 클래스에서 찾습니다. 그 조회가 이 퀘스트의 이름이 된 버그입니다. 스타터는 `items = {}`를 **클래스 테이블**에 두므로, 어느 장부에서든 `self.items`는 모든 장부가 공유하는 하나의 리스트로 떨어지고, 연습용 장부의 `PENCIL`이 진짜 장부에 나타납니다. `new`에서 만들어 인스턴스에 저장한 것은 그 인스턴스의 것이고, 클래스에 있는 것은 앞으로 생길 모든 인스턴스의 것입니다.

`print(book)`은 `tostring`을 호출하고, `tostring`은 메타테이블에서 `__tostring`을 찾습니다. 그것이 없으면 `table: 0x...`가 나오는데, 그것이 스타터의 마지막 줄입니다.
'''
hints = [
  "스타터를 실행하고 출력의 첫 줄을 보세요: PENCIL 0, 아무도 적은 적 없는 장부에서 나온 것입니다. 그것이 __index를 통해 찾은 공유 리스트입니다.",
  "setmetatable({ items = {} }, Notebook) — 리스트는 인스턴스마다, new에서, self가 될 테이블 위에 만들어집니다.",
  "print(book)은 tostring(book)을 호출하고, 그것은 메타테이블의 __tostring을 씁니다. Notebook이 메타테이블이므로 작성할 메서드는 function Notebook:__tostring() 하나입니다. 그 객체를 다시 만들어 낼 생성자 호출처럼 보이게 하세요. 그것이 관례입니다.",
]

