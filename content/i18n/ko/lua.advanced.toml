물건을 `Bag`에 넣고 출력하세요:

1. `LEN <k>` — `bag:len()`에서
2. 물건들, 한 줄에 하나 — `for item in bag:iter()`에서
3. `HAS <WORD> YES` 또는 `HAS <WORD> NO` — `bag:has(word)`에서
4. `LONGEST <item>` — `longest(bag)`에서, 같으면 첫 번째

```
input:  egg duckegg tofu
