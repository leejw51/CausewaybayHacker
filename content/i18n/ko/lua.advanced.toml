```

줄을 레코드 — `Order.new(kind, kg)` — 로 모델링하고, 가격은 **디스패치 테이블 하나**로 정하세요: 종류를 키로 하고 값이 함수인 테이블을 한 번 조회하고, 키가 없으면 빠져나가는 경로를 둡니다. Lua에는 `match`가 없습니다. 태그를 키로 한 팔들의 테이블이 가장 가까운 것이고, `arms[order.kind]`가 `nil`인 것이 와일드카드 경우입니다.

스타터의 테이블에는 팔이 하나뿐이고, 다른 모든 종류 — 알아야 할 셋을 포함해 — 가 `UNKNOWN`으로 빠집니다. 각 팔은 주문을 받는 함수이고, 각각 문자열을 돌려줍니다. `450`과 `"450"`은 똑같이 출력되고, `UNKNOWN` 줄은 어차피 텍스트이기 때문입니다.
'''
hints = [
  "ARMS에 종류마다 항목 하나: STUDENT = function(order) ... end, 등등. 키가 태그이고 값이 팔입니다.",
  "math.floor(x / 2)가 정수 나눗셈입니다. x / 2는 900에 대해 450을 주지만 501에 대해서는 250.5를 주고, 테스트는 온전한 센트를 원합니다.",
  "팔이 없는 종류에 대해 ARMS[order.kind]는 nil이고, if가 UNKNOWN으로 빠집니다 — match의 마지막 팔과 같은 일을 테이블이 합니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.advanced.14.generators"
title = "직접 만드는 for 루프"
story = "향 노점의 시세판은 개장 가격부터 정해진 간격으로 모든 가격을 띄우면서, 그 목록을 어디에도 두지 않는다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

`ticker(start, step, count)`를 **코루틴**으로 쓰세요 — `start`에서 시작해 `step`씩 나아가며 `count`개의 값을 yield하는 함수를 `coroutine.wrap`으로 감싼 것. 각각을 한 줄에 출력한 뒤, 두 번째 ticker를 `sum`에 넘겨 계산한 `SUM <total>`을 출력하세요.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

마지막 줄은 `main`이 `ticker`가 돌려주는 것을 부르는 이름 — 테이블이면 `list`, `coroutine.wrap`이 돌려주는 함수면 `generator` — 이고, 스타터의 `main`이 있는 그대로 출력합니다. 지금은 `list`라고 하는데, 그 한 줄 전에 `for value in ticker(...)`가 이미 `attempt to call a table value`로 실패했습니다: 범용 `for`는 첫 피연산자를 호출하는데, 리스트는 호출할 수 없습니다.

`coroutine.wrap(f)`는 `f`를 실행하지 않습니다. 함수를 돌려주고, 그 함수를 호출할 때마다 `f`를 다음 `coroutine.yield(value)`까지 실행해 그 값을 건네줍니다. `f`가 반환하면 그 함수는 아무것도 돌려주지 않고, `for`는 `nil`을 보고 멈춥니다. 그래서 `for`가 그 위에서 동작하고, `sum`이 동작하며, 백만 개의 값의 리스트가 한 번도 존재하지 않고도 백만 개의 값을 만들어 낼 수 있습니다.

스타터는 리스트를 만들어 돌려줍니다. 덧붙이기를 `yield`로 바꾸고 리스트를 지우세요.
'''
hints = [
  "return coroutine.wrap(function() ... end) — 본문이 yield하고, wrap이 그것을 for가 호출할 수 있는 함수로 바꿉니다.",
  "coroutine.yield(value), 그다음 전진. 본문은 yield에서 멈추고 다음 호출 때 그 뒤에서 재개됩니다.",
  "감싼 코루틴은 한 번만 소비할 수 있고, 죽은 뒤에 호출하면 에러입니다. 그래서 main이 루프가 다 써 버린 것을 재사용하지 않고 합계용으로 새 ticker를 만드는 것입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.advanced.15.decorators"
title = "감싸기"
story = "용 위원회는 오늘 밤 가격 함수가 몇 번 호출됐는지 알고 싶어 하고, 함수는 자기가 감시당하는 줄 알고 싶지 않다."
brief = '''
표준 입력은 개수 `n`, 그다음 kg 단위의 무게 `n`개입니다.

`price(kg)`는 `500 + 100 * kg`입니다. `price`가 모르게 모든 호출이 세어지도록 `counted`로 감싸세요. 무게마다 가격 하나를 출력한 뒤 `CALLS <n>`, 그다음 `NAME <price.name>` — `price`라고 해야 합니다 — 을 출력하세요.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

Lua에는 데코레이터가 없습니다. 가장 가까운 것은 함수를 받아 그 자리에 호출 가능한 무언가를 돌려주는 함수이고, 이 노드는 그것을 가르칩니다. `price = counted(price, "price")`는 이름을 `counted`가 돌려준 것에 다시 묶습니다 — `def` 위의 `@counted`가 하는 바로 그 일입니다.

횟수는 어디에 살까요? Lua 함수는 필드를 지닐 수 없으므로 wrapper는 **테이블** — `{ calls = 0 }` — 이고, 횟수를 올리고 원래 함수를 호출하는 `__call` 메타메서드로 호출 가능하게 만듭니다. 그러면 `price(kg)`는 `__call`을 거치고, `price.calls`는 평범한 필드 읽기입니다.

Lua 함수에는 자기 이름도 없습니다. wrapper는 자기가 대신 서 있는 이름을 들어야 합니다. 스타터는 한 번도 알려 주지 않고, 마지막 줄은 `NAME wrapper`라고 합니다. 그것이 손으로 하는 `functools.wraps`입니다: 감싼 것의 정체를 그것을 대체한 것 위에 복사하는 일.
'''
hints = [
  "price = counted(price, \"price\") — 두 번째 인자가 wrapper가 지니는 이름입니다. 그것이 수정의 전부입니다.",
  "함수 뒤의 price = counted(price)는 그 위의 데코레이터와 같습니다: 이름은 counted가 돌려준 것으로 다시 묶이고, 원래 함수는 클로저 안의 upvalue func로만 살아남습니다.",
  "__call 안의 ...은 어떤 인자든 모르는 채로 전달하고, 그것이 wrapper를 어떤 함수에든 재사용 가능하게 만듭니다.",
]

