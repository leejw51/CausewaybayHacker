output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag`은 리스트 타입을 감싸지 않고, 그럴 필요도 없습니다. `bag:len()`은 호출하는 순간 메타테이블을 거쳐 `len` 키를 조회하는 것이고, 거기 있는 것이 무엇이든 호출됩니다. Lua는 무언가가 무엇*인지* 묻지 않습니다. 필요할 때 그 키가 있는지 묻습니다. 스타터에는 세 메서드 중 아무것도 없고, 첫 에러는 `attempt to call method 'len' (a nil value)`입니다.

`longest`는 `iter()`가 있는 무엇이든 받는 자유 함수입니다 — `Bag`을 한 번도 언급하지 않습니다. 그것이 계약의 전부입니다: 이름 하나와 호출 하나. (LuaJIT는 테이블의 `__len` 메타메서드를 존중하지 않으므로 여기서 길이는 `#bag`이 아니라 메서드입니다. 일하는 메타메서드는 `__index` 하나입니다.)
