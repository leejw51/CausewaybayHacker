[[quest]]
id    = "lua.advanced.10.functools"
title = "계산한 것을 기억하기"
story = "향 노점은 용이 지나가기 전까지 같은 두 숫자에서 같은 밤의 가격을 만천 번 계산한다. 매번, 처음부터."
brief = '''
표준 입력은 `n k bits`입니다: 정수 둘과 이진 숫자의 문자열.

네 줄을 출력하세요:

1. `FIB <fib(n)>` — `memoize`로 감싼 **재귀** `fib`에서
2. `PRODUCT <k!>` — `1..k`에 곱셈으로 `reduce`, `k = 0`이 `1`을 주도록 초기값과 함께
3. `BIN <value>` — 진법을 받는 파서를 진법 `2`로 묶은 `partial`로 파싱한 `bits`
4. `MISSES <m>` — `fib.misses`, 재귀가 실제로 본문을 실행한 횟수

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n`은 많아야 `400`이고, LuaJIT의 스택에는 아무것도 아닙니다. 캐시가 없으면 `fib(35)`는 약 3천만 번의 호출이고 `fib(90)`은 끝나지 않습니다. 캐시가 있으면 모든 `fib(i)`가 한 번씩 돌고 `MISSES`는 `n + 1`입니다. `memoize`는 감싸기 퀘스트의 wrapper에 클로저 안의 캐시를 더한 것입니다: 호출 가능한 테이블이라서 `fib.misses`가 필드이고, `fib = memoize(function ... end)`이라서 안쪽의 재귀도 캐시를 거칩니다. 스타터의 `fib`는 평범한 함수이고, 마지막 줄이 `fib.misses`에서 죽습니다.

`fib(90)`과 `20!`은 2^53을 넘고, Lua의 숫자는 double입니다: 그 너머에서는 자릿수가 조용히 사라집니다. 스타터에는 숫자를 10^7진 림(limb)의 리스트로 담는 `big`이 `add`, `mul_small`, `tostring`과 함께 들어 있습니다. `fib`는 big들을 더하고, 곱은 big 하나에 작은 수를 곱합니다. `partial`은 함수의 앞쪽 인자 몇 개를 고정해 새 함수를 줍니다. `reduce`는 두 인자 함수를 이터레이터 위로 접습니다. 어느 쪽도 영리하지 않습니다. 둘 다 면접에서 묻습니다.
'''
hints = [
  "local fib; fib = memoize(function(n) ... end) — 이름을 먼저 선언해서, 본문 안의 fib가 결국 wrapper를 담게 될 upvalue가 되게 하세요. 스타터가 마지막 줄에서 죽는 것은 평범한 함수에는 misses 필드가 없기 때문입니다.",
  "reduce(big.mul_small, range(1, k), big.from(1)) — 세 번째 인자가 시작 값이고, 빈 range가 1을 내놓게 하는 것이 그것입니다.",
  "partial(parse, 2)는 진법을 스스로 공급하고 텍스트를 받는 함수를 돌려줍니다. unpack(bound, 1, count)이 묶인 인자를 앞에 두고, select(\"#\", ...)은 하나가 nil이어도 그것들을 셉니다.",
]

