id    = "lua.advanced.04.thread-pool"
title = "짐꾼 여덟"
story = "릴리 스트리트 끝에 향 상자 마흔 개, 짐꾼 여덟 명. 아무도 짐꾼 마흔 명을 원하지 않는다. 여덟 명이 한 번도 멈춰 서지 않기를 원한다."
brief = '''
표준 입력은 정수 둘 `w`와 `n`, 그다음 값 `n`개입니다.

짐꾼 `w`명의 **풀**을 돌리세요: 한 번에 많아야 `w`개의 코루틴이 돌고, 각각은 도중에 한 번 yield하고 `(index, value * value)`를 돌려주는 일 하나를 나릅니다. 결과는 일이 **끝나는** 대로 모으고, 인덱스로 정렬해 `<index> <value>`를 한 줄에 하나씩 출력한 뒤 `WORKERS <w>`를 출력하세요.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

코루틴은 결과가 아닙니다. `coroutine.resume(co)`는 `true`와 그 뒤에 일이 yield하거나 반환한 것을 돌려줍니다 — 값이 나오는 문은 그것 하나뿐이고, 그 문은 일을 끝내는 재개에서 열리는데, 그것이 풀의 몇 번째 차례일지는 그때그때 다릅니다. 스타터는 끝난 코루틴 자체 — `thread: 0x...` 값 — 를 모으고, 정렬이 그중 하나를 인덱스하려 합니다.

결과에 인덱스를 실어 나르는 것이 출력을 매번 같게 만듭니다. 그것으로 정렬하는 것은 답의 마지막 줄이지 첫 줄이 아닙니다. 풀은 서랍 퀘스트의 스케줄러에 상한을 단 것입니다: 도는 것을 `w`개까지 채우고, 각각에 한 차례씩 주고, 죽은 것을 은퇴시키고, 일과 도는 것이 둘 다 빌 때까지 반복합니다.
'''
hints = [
  "스타터는 정렬이나 출력에서 죽습니다: attempt to index local 'a' (a thread value). 코루틴은 일이지 그 답이 아닙니다.",
  "local ok, index, value = coroutine.resume(co) — 일을 반환까지 돌리는 재개에서는 반환값이 ok 뒤에 따라옵니다. 상태가 dead일 때 { index, value }를 남기세요.",
  "풀은 자기 순서로 일을 끝내고, 결과 안의 인덱스가 각각이 어디서 왔는지에 대한 유일한 기록입니다. 출력하기 전에 그것으로 정렬하세요.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.advanced.05.asyncio"
title = "async는 실제로 어디서 도는가"
story = "메이는 4년 동안 async 코드를 써 왔지만 그것을 굴리는 물건을 한 번도 본 적이 없다. 오늘 밤 그 루프는 그녀가 읽을 수 있는 while 루프이고, 골목의 모든 심부름꾼이 그 위에서 차례를 기다린다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

`double(value)`를 스케줄러에 한 번 yield하고 — `coroutine.yield()` — 값을 두 배로 해서 돌려주도록 쓰세요. 값마다 코루틴을 하나씩 만들어 `gather`로 모두 돌리고, 각 결과를 입력 순서로 출력한 뒤 `SUM <total>`과 `TASKS <n>`을 출력하세요.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)`는 `f`를 실행하지 않습니다. **코루틴 객체**를 만들어 건네줄 뿐이고, 무언가가 그것을 재개하기 전까지 안에서는 아무 일도 일어나지 않습니다. 스타터의 `run`은 재개하지 않은 코루틴 셋을 돌려주고, 출력은 `thread: 0x...` 세 줄 뒤에 `attempt to perform arithmetic on a thread value`입니다.

`gather`가 이벤트 루프이고, 여기서는 당신이 씁니다: 태스크들을 도는 `while`로, 죽지 않은 각각을 순서대로, 라운드마다, 남은 것이 없을 때까지 재개하며, 각 태스크의 **반환값**을 그 태스크의 칸에 보관합니다. 결과는 끝난 순서와 상관없이 태스크를 넘긴 순서로 나옵니다. 한 태스크를 죽을 때까지 재개하고 나서야 다음 것을 건드리는 루프 대신 이것을 쓰는 이유가 그것뿐입니다: 그 루프는 맞지만 순차적이고, `gather`는 맞으면서 교차합니다.

여기에는 스레드가 정확히 하나 있습니다. `coroutine.yield()`는 태스크가 스레드를 루프에 돌려주어 다른 태스크가 쓸 수 있게 하는 지점입니다. 아무것도 병렬로 돌지 않습니다. 각자 멈출 수 있다고 말한 자리에서, **차례로** 돕니다.
'''
hints = [
  "return tasks 대신 return gather(tasks) — 그리고 gather는 당신이 쓰는 루프입니다: 죽지 않은 모든 태스크를, 하나도 남지 않을 때까지 되풀이해 재개하세요.",
  "태스크를 죽게 만드는 재개는 두 번째 반환값이 그 태스크의 반환값인 재개입니다. 그것을 태스크 자신의 인덱스에 저장하세요. 그것이 결과를 입력 순서로 지켜 줍니다.",
  "결과를 끝나는 대로 원한다면 그것은 지난 퀘스트의 풀이고, 그때는 인덱스를 직접 실어 날라야 합니다.",
]

