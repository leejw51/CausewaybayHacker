[[quest]]
id    = "lua.advanced.09.itertools"
title = "선반 위의 공구함"
story = "린파꿍 위원회 책상에는 아무도 열지 않는 공구 선반이 있고, 직원은 매일 저녁 똑같은 표가 연달아 나온 횟수를 손으로 센다."
brief = '''
표준 입력은 정수 한 줄입니다.

세 줄을 출력하되, 각 줄은 프로그램 맨 위의 `tools` 테이블로만 만들고 손으로 짠 것은 없어야 합니다:

1. `SUMS` 뒤에 누계들 — `tools.accumulate`
2. `RUNS` 뒤에 **인접한** 같은 값의 각 구간을 `<v>x<k>`로 — `tools.groupby`
3. `PAIRS <k>`: **서로 다른** 값의 순서 없는 쌍이 몇 개인지 — 정렬된 서로 다른 값들에 대한 `tools.combinations`

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Lua에는 `itertools`가 없습니다. 모듈은 함수의 테이블이고, `tools`는 `require`로 불러오는 대신 파일 맨 위에 적힌 모듈입니다. 그 세 함수는 이미 거기 있고 — 아무도 열지 않는 선반 — 각각 코루틴 이터레이터를 돌려주므로 곧장 `for`에 들어갑니다.

`groupby`는 **인접한** 같은 항목만 묶습니다. 카운터가 아니고, 샘플은 둘이 어긋나도록 골라져 있습니다: `1`은 네 번, 두 구간에 나옵니다. 스타터는 둘째 줄에 횟수 테이블을 쓰고 바로 그 입력에서 틀립니다 — 그리고 횟수를 `pairs` 순서로 출력하는데, 그것은 순서가 아닙니다.

각 이터레이터는 게으릅니다: `accumulate`는 당길 때마다 누계 하나를 yield하고, `groupby`는 값과 그 구간을 리스트로 yield하므로 `#run`이 길이입니다. `table.concat`이 필요할 때는 이터레이터를 리스트로 모으고, 개수만 필요할 때는 루프로 세세요.
'''
hints = [
  "tools.accumulate(nums)는 원소마다 그 시점의 누계를 yield합니다. table.concat을 위해 리스트로 모으세요.",
  "for value, run in tools.groupby(nums) do — run은 그 구간의 멤버 리스트이고, #run이 그 길이입니다.",
  "tools.combinations(distinct, 2)는 순서 없는 각 쌍을 한 번씩 yield합니다. 세어 보면 n*(n-1)/2이고, 그것을 손으로 확인해 보면 n이 맞는지 알 수 있습니다.",
]

