# LUA LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/lua/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "lua.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.advanced.01.conversions"
title = "세 모양, 이름 하나"
story = "원사 스트리트의 향 노점은 가격을 글자로, 숫자로, 달러로 공책 한 권에, 이름 하나로 적어 둔다."
brief = '''
한 줄을 읽으세요: 센트 단위의 금액이 숫자로 적혀 있습니다.

세 줄을 출력하세요:

1. 공백을 뗀 텍스트의 글자 수
2. 금액을 숫자로
3. 금액을 소수점 아래 정확히 두 자리의 달러로

```
input:  1234
output: 4
        1234
        12.34
```

금액은 음수가 아닙니다. **이름 하나**를 세 번 다시 묶어서 하세요 — 문자열, 그다음 숫자, 그다음 다시 문자열. Lua의 지역 변수는 무엇이든 담고 대입할 때마다 마음을 바꿉니다. 그 대가는, 지금 `cents`가 무엇인지 알려 주는 것은 바로 위의 줄을 읽는 것뿐이라는 점입니다.

달러를 만들 때 나눗셈을 거치지 마세요. `1234 / 100`은 오늘은 `12.34`이고, `0.1 + 0.2`는 출력하면 `0.3`이지만 비교하면 아닙니다. `math.floor`와 `%`가 두 부분을 정확하게 주고, `string.format("%02d", ...)`이 뒷부분을 채워 줍니다. `tonumber`가 변환이고, `#cents`는 아직 문자열인 동안의 문자열 길이입니다.
'''
hints = [
  "cents가 아직 문자열일 때의 #cents가 첫 줄입니다.",
  "cents = tonumber(cents)는 제자리 변환이 아닙니다. 새 값을 옛 이름에 묶는 것입니다. 그 뒤로 문자열은 사라집니다.",
  "string.format 안의 %02d는 너비 2, 0으로 채움, 십진수입니다. 5센트는 0.05이지 0.5가 아닙니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.advanced.02.control-flow"
title = "몇 번 골목"
story = "용의 행렬 경로를 위해 골목 번호가 길바닥에 분필로 적혀 있고, 린파꿍의 진행 요원 게시판은 골목마다 무엇이 있는지 말해 줘야 한다. 그런데 매번 번호만 적혀 있고, 그것도 0부터 시작한다."
brief = '''
정수 `n` 하나를 읽으세요. `1`부터 `n`까지의 모든 `i`에 대해 한 줄씩 출력하세요:

* `i`가 3과 5 둘 다로 나누어떨어지면 `FISHVEG`
* `i`가 3으로 나누어떨어지면 `FISH`
* `i`가 5로 나누어떨어지면 `VEG`
* 그 밖에는 `i` 자체

그다음 `0`을 읽을 때까지 한 줄에 하나씩 정수를 계속 읽고, 그동안 읽은 0이 아닌 줄의 개수를 `SKIPPED <k>`로 출력하세요.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

루프 둘, 종류도 둘. 첫 번째는 시작하기 전에 몇 번 돌지 압니다: `for i = 1, n do`. 두 번째는 모릅니다: 횟수가 읽은 것에 따라 정해지므로 `break`가 있는 `while true do`입니다. Lua의 숫자 `for`는 양 끝이 모두 **포함**됩니다 — `for i = 1, n`은 `n`번 돕니다 — 그리고 스타터는 `0`에서 시작하는데, 그것이 이 랜드의 이름이 된 하나 차이 오류입니다.
'''
hints = [
  "둘 다인 경우를 먼저 검사하세요. 아니면 절대 걸리지 않습니다. 3과 5로 나누어떨어지면 15로 나누어떨어집니다.",
  "for i = 0, n - 1은 하나 일찍 시작해서 하나 일찍 멈춥니다. 스타터에 그 버그가 있습니다. 0은 무엇으로든 나누어떨어지므로 출력의 첫 줄이 FISHVEG입니다.",
  "while true do ... break는 Lua가 출구가 중간에 있는 루프를 적는 방법입니다. 바닥에서 검사하는 repeat ... until도 있습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.advanced.03.lists"
title = "용의 한가운데"
story = "짐꾼 한 줄의 어깨 위에 짚 67미터. 머리의 진행 요원에게는 첫 짐꾼과 마지막 짐꾼만 보이고 그 사이는 하나도 보이지 않는다."
brief = '''
표준 입력은 첫 줄에 개수 `n`, 그다음 둘째 줄에 공백으로 구분된 `n`개의 정수입니다. `n`은 적어도 `1`이므로 출력할 첫 값과 마지막 값은 항상 있습니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 둘 사이에 엄격히 끼인 모든 것의 합. 값이 셋보다 적으면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Lua의 리스트는 키가 `1..n`인 테이블이고, `#nums`가 `n`입니다. 첫 원소는 `nums[1]`, 마지막은 `nums[#nums]`입니다. `nums[-1]`은 없습니다 — 음수 키는 아무것도 저장되지 않은 키일 뿐이고, 읽으면 불평 없이 `nil`을 줍니다 — 그리고 슬라이스도 없습니다: 가운데는 `2`부터 `#nums - 1`까지의 루프이고, 가운데가 없으면 0번 돌므로 다른 언어에 필요한 가드가 여기서는 공짜입니다.

스타터는 `nums[0]`을 출력합니다. Lua에서 그것은 에러가 아닙니다. `nil`이고, `print`는 `nil`이라는 단어를 쓰고, 프로그램은 0으로 종료합니다. 이 랜드는 이것의 이름을 땄습니다.
'''
hints = [
  "nums[#nums]가 마지막 원소이고, nums[#nums - 1]이 그 앞 원소입니다. 음수는 아무것도 통하지 않습니다.",
  "for i = 2, #nums - 1은 첫 번째와 마지막을 제외한 전부이고, 값이 하나면 for i = 2, 0이 되어 저절로 0번 돕니다.",
  "io.read(\"*a\")는 전체를 한 번에 읽고 gmatch(\"%S+\")는 토큰을 걷으므로 줄바꿈은 상관없어집니다. 첫 토큰은 개수입니다. 건너뛰세요.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.advanced.04.strings"
title = "바이트는 글자가 아니다"
story = "빅토리아 파크 노점의 등불 주문서가 銅鑼灣을 3바이트에서 잘라 글자 하나와 물음표 하나를 찍는다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. UTF-8로 인코딩했을 때의 **바이트** 길이
2. **글자** 길이
3. 글자를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 글자가 있을 수 있고, 그러면 처음 두 숫자는 같지 않습니다. Lua의 문자열은 **바이트**의 나열이고 그 밖에는 아무것도 모릅니다: `#s`는 바이트 수이고 `s:reverse()`는 바이트를 뒤집는데, 그러면 모든 멀티바이트 글자가 반으로 잘립니다. 글자는 당신이 정의하는 것입니다. UTF-8에서 글자는 선두 바이트 하나 뒤에 연속 바이트가 몇 개든 붙은 것 — 패턴으로는 `[^\128-\191][\128-\191]*` — 이므로, 선두 바이트를 세면 글자 수이고, `gmatch`로 글자를 걸으며 쌓으면 뒤집기입니다.

스타터는 바이트 수를 두 번, 줄은 들어온 그대로 출력합니다. 세 번째 줄을 고치려고 `line:reverse()`에 손대지 마세요: `causeway`에서는 맞지만, 모두가 실제로 입력하는 샘플에서는 어떤 인코딩으로도 문자열이 아닌 바이트를 출력합니다.
'''
hints = [
  "#line은 바이트입니다. 글자는 세어야 합니다: gsub는 두 번째 결과로 매치 수를 돌려주고, 글자마다 매치 하나면 그것이 글자 수입니다.",
  "연속 바이트는 128..191(10xxxxxx)입니다. 글자는 그것이 아닌 바이트 하나 뒤에 그것인 바이트가 0개 이상 붙은 것입니다: \"[^\\128-\\191][\\128-\\191]*\".",
  "table.insert(reversed, 1, ch)는 앞에 밀어 넣으므로 마지막 글자가 맨 앞에 옵니다. table.concat은 구분자 없이 잇습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.advanced.05.dicts"
title = "골목이 외치는 것"
story = "아홉 시의 원사 스트리트: 노점마다 뭔가를 외치고, 스쿨 스트리트 쪽 끝의 게시판은 순위를 원한다."
brief = '''
표준 입력 전체를 읽고 공백으로 나누세요.

서로 다른 단어마다 한 번씩 `<word> <count>`로 출력하되, 횟수 내림차순으로, 같으면 단어 오름차순으로 정렬하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

단어를 키로 하는 테이블이 카운터이고, `counts[word] + 1`은 처음에 에러 — `attempt to perform arithmetic on a nil value` — 입니다. 아무도 쓰지 않은 키는 `nil`이기 때문입니다. `(counts[word] or 0) + 1`이 0을 채워 줍니다.

`pairs`는 키를 **전혀 순서 없이** 걷고, 그 순서는 실행할 때마다 바뀝니다. 키를 리스트에 복사하고, 횟수 내림차순 다음 단어 오름차순이라고 말하는 비교자로 `table.sort`한 뒤, 리스트에서 출력하세요. 비교자는 첫 인자가 먼저 올 때 `true`를 돌려줍니다.
'''
hints = [
  "스타터는 첫 단어에서 죽습니다: counts[word] + 1은 쓰기 전에 읽는데, 읽을 것이 없습니다. (counts[word] or 0)이 0을 채워 줍니다.",
  "pairs로 키를 리스트에 모은 다음 그 리스트를 table.sort하세요. 테이블 자체에는 고칠 순서가 없습니다.",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — 횟수 내림차순, 그다음 단어 오름차순, 그리고 같은 인자에는 절대 true가 아닙니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.advanced.06.sets"
title = "두 노점에 다 있는 것"
story = "옴스비 스트리트 양쪽에 등불 노점이 하나씩. 용의 행렬 경로를 두 번 건너지 않고 어느 쪽에서든 살 수 있는 게 뭔지 알고 싶은 손님."
brief = '''
표준 입력은 두 줄이고, 각 줄은 한 노점의 물건을 공백으로 구분한 것입니다. 노점은 같은 것을 두 번 적을 수 있고, 그것은 한 번으로 셉니다.

세 줄을 출력하세요:

1. `BOTH` 뒤에 두 목록 모두에 있는 모든 것을 정렬해 공백으로 구분 — 아무것도 없으면 `BOTH -`
2. `ONLY_A <k>`: 첫 목록에는 있고 둘째에는 없는 것의 개수
3. `ALL <k>`: 어느 한쪽 목록에라도 있는 서로 다른 것의 개수

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua에는 집합 타입이 없습니다. 집합은 **키**가 멤버이고 값이 `true`인 테이블입니다: `tofu`를 두 번 쓰면 같은 키를 두 번 쓰는 것이고, 중복은 들어오는 길에 사라집니다. 멤버십은 `a[x]`이고, `true` 아니면 `nil`입니다. 교집합, 차집합, 합집합은 한 집합의 키를 돌며 다른 집합에 묻는 루프 셋입니다 — 함수로 써 두면 세 줄은 호출 셋이 됩니다.

`#`은 집합의 키를 세지 않습니다. 리스트 부분을 세는데, 그것은 비어 있습니다. `pairs`를 도는 루프로 세고, `pairs`에는 순서가 없으니 출력하기 전에 멤버를 리스트로 정렬하세요.
'''
hints = [
  "모든 토큰에 대해 set[word] = true가 집합을 만듭니다. 중복된 tofu는 같은 키를 두 번 쓴 것입니다.",
  "교집합은 pairs(a)를 돌며 b[key]가 true인 키를 남기는 루프입니다. 차집합은 그것이 nil인 키를 남깁니다. 합집합은 두 집합의 키를 한 테이블에 씁니다.",
  "문자열 키만 있는 테이블에서 #set은 0입니다. pairs로 키를 리스트에 복사하고 table.sort하면, #list가 개수이고 table.concat(list, \" \")가 그 줄입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.advanced.07.functions"
title = "한 근에"
story = "원사 스트리트의 가격표는 따로 적혀 있지 않으면 전부 한 근 기준인데, 향 노점의 가격표 프린터는 매번 그것을 말해 달라고 고집한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<NAME> <CENTS>` 또는 `<NAME> <CENTS> <UNIT>` 형식의 `n`줄입니다.

`<NAME> $<dollars>/<unit>`을 소수 두 자리로 돌려주는 `tag(name, cents, unit)`을 쓰세요. `unit`이 없으면 `catty`를 뜻합니다. 한 줄에 가격표 하나씩 출력하세요.

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua에는 기본 인자가 없습니다. 호출자가 빠뜨린 매개변수는 `nil`이고, 스타터의 `tag`는 그것을 이어 붙입니다: `attempt to concatenate local 'unit' (a nil value)`. 관용구는 함수의 첫 줄 — `unit = unit or "catty"` — 입니다. `or`는 왼쪽이 `nil`이나 `false`가 아니면 왼쪽을 돌려주기 때문입니다. 그것이 Lua의 기본 인자 메커니즘의 전부이고, `def` 줄이 그렇듯 함수 계약의 일부입니다.

줄을 토큰 리스트로 나누고, 센트를 변환한 뒤 `tag(unpack(parts))`로 조각들을 넘기세요. `unpack`은 리스트를 인자로 펼치므로, 원소 둘인 리스트도 셋인 리스트도 시그니처 하나에 맞습니다.
'''
hints = [
  "tag의 첫 줄로 unit = unit or \"catty\". 그것이 수정의 전부입니다.",
  "`x or default`가 Lua의 기본 인자입니다. 이것이 실패하는 값이 하나 있습니다: 호출자가 일부러 false를 넘기면 or는 그것도 바꿔 버리고, 그것이 다음 질문입니다.",
  "tag(unpack(parts))는 리스트를 펼칩니다. 조각이 두 개면 세 번째 매개변수는 nil이고 or가 그것을 채웁니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.advanced.08.exceptions"
title = "숫자가 아닌 줄"
story = "포멜로 노점의 저울이 무게를 한 열로 찍어 내는데, 그 한가운데에 누군가의 전화번호가 들어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `n`줄입니다. 각 줄은 정수여야 합니다.

각 줄에 대해 두 배로 한 값을 출력하거나, 파싱되지 않으면 `BAD <line>`을 출력하세요. 마지막으로 `SUM <total>`을 출력하는데, total은 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")`는 조용히 `nil`이고, `tonumber("1.5")`는 `1.5`로 정수가 아니며, 스타터의 `double`은 두 경우 모두 `error`로 던집니다. `error`는 Lua 함수가 거절하는 방법입니다 — `Result`도 없고, 함수 자신이 주는 `(value, ok)`도 없습니다 — 그리고 숫자를 기대했던 호출자는 그것을 어떻게 할지 `pcall`로 말해야 합니다: `pcall`은 대신 함수를 호출하고, 에러가 올라가게 두는 대신 `true, result` 또는 `false, message`를 돌려줍니다.

`pcall`은 실패할 수 있는 호출 하나만 감싸세요. 루프 본문 전체를 감싸면 당신 자신의 `print`에 있는 오타까지 삼켜 버리는데, 프로그램이 조용히 실패하는 법을 배우는 것이 그렇게 해서입니다.
'''
hints = [
  "스타터는 xx에서 main.lua:3: not an integer: xx로 죽습니다. 그 메시지가 pcall이 죽는 대신 두 번째 결과로 건네주는 것입니다.",
  "local ok, value = pcall(double, line) — pcall은 함수와 그 인자를 따로 받습니다. pcall(double(line))은 double을 먼저 호출해서 pcall이 돌기도 전에 죽습니다.",
  "ok가 false면 value가 메시지입니다. BAD를 출력하고 넘어가세요. 잘못된 줄은 합계에 아무것도 더하지 않습니다.",
]

