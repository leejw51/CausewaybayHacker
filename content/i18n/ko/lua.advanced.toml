[[quest]]
id    = "lua.advanced.16.duck-typing"
title = "꽥꽥 운다면"
story = "스쿨 스트리트 계란 노점에서 온 빨간 비닐봉지 하나. 그게 무엇인지는 아무도 묻지 않았다. 몇 개가 들었는지, 오리알이 들었는지, 하나씩 꺼내 보자고 했다."
brief = '''
