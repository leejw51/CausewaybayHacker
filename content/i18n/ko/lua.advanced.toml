[[quest]]
id    = "lua.advanced.09.comprehensions"
title = "원사 스트리트를 한 번에"
story = "알렉스는 for 루프 세 개면 된다고 한다. 골목은 용 한 마리 폭이고 향에는 불이 붙었다. 지나갈 기회는 한 번뿐이다."
brief = '''
표준 입력은 공백으로 구분된 정수 한 줄입니다.

세 줄을 출력하세요:

1. 짝수 값의 합(하나도 없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로 해서, 순서대로, 공백 하나씩으로 이은 것 — 하나도 없으면 `-`
3. 서로 다른 값이 몇 개인지

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua에는 컴프리헨션이 없습니다. 가장 가까운 것은 테이블에서 테이블을 만드는 함수이고, 이 노드는 그것을 가르칩니다. `filter(list, keep)`과 `map(list, f)`를 한 번씩 쓰면 — 각각 새 테이블을 채우는 루프입니다 — 세 줄은 호출이 됩니다: `sum(filter(nums, even))`, `map(filter(nums, big), double)`, 그리고 값들로 만든 집합을 센 것. 술어와 변환은 인자로 넘기는 함수이고, 그것이 컴프리헨션의 `if`와 식에 해당합니다.

`table.concat`은 문자열뿐 아니라 숫자도 받으므로 둘째 줄에는 변환이 필요 없습니다. 다만 리스트가 비었을 때는 `-`가 필요한데, `table.concat({}, " ")`는 빈 문자열이기 때문입니다.
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end)가 짝수를 남깁니다. 그것의 sum이 첫 줄입니다.",
  "map(filter(nums, big), double) — 먼저 거르고 그다음 변환합니다. 컴프리헨션의 뒤쪽 if와 앞쪽 식과 같습니다.",
  "집합은 값을 키로 하는 테이블입니다. #set은 키를 세지 않고, pairs 루프가 셉니다.",
