[[quest]]
id    = "lua.advanced.11.protocol"
title = "그릴 수만 있으면 된다"
story = "빅토리아 파크 등불 안내판은 노점과 카운터를 나열하는데, 둘은 서로 다른 프로그램이 만들고, 안내판은 각각이 자기를 그릴 수 있다는 것만 알고 싶어 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `n`줄이고, 각 줄은 다음 중 하나입니다

* `STALL <NAME> <AISLE>` — `<NAME> / A<AISLE>`로 그려짐
* `COUNTER <NUMBER>` — `COUNTER <NUMBER>`로 그려짐

프로토콜 `Sign`을 메서드 이름의 리스트 — `{ "render" }` — 로 선언하고, 객체가 그 이름들 모두에 함수를 가지고 있으면 참인 `implements(object, protocol)`을 선언하세요. `Stall`과 `Counter`는 평범한 클래스로 — **`Sign`은 언급하지 않고** — 쓰고, 그려진 것을 출력하는 함수 `show(sign)` 하나를 쓰세요. 모든 표지를 출력한 뒤, `implements(x, Sign)`으로 센 `SIGNS <n>`, 그다음 메타테이블을 비교하는 `is_a(x, Stall)`로 센 `STALLS <k>`를 출력하세요.

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

프로토콜은 **구조적** 타입입니다: 클래스는 그렇다고 말해서가 아니라 메서드를 가짐으로써 그것을 만족합니다. Lua에는 그것을 부르는 이름이 없는데, Lua가 가진 타입이 그 종류뿐이기 때문입니다. 검사는 실행 시점에 이름으로 하는 조회이고, **호출이 하는 것과 같은 조회**여야 합니다: `object[name]`, 이것은 `__index`를 거쳐 메서드가 사는 클래스까지 갑니다. 스타터는 인스턴스 자신만 들여다보는 `rawget`으로 검사해서, 어느 것에서도 `render`를 찾지 못하고 `SIGNS 0`을 보고합니다.

`show`는 그 조회로 실행 시점에 디스패치합니다 — `sign:render()`는 메타테이블 사슬에 있는 `render`가 무엇이든 찾습니다. 대신 고를 정적 디스패치는 없습니다. Lua에는 메커니즘이 하나 있고, 이것이 그것입니다.
'''
hints = [
  "rawget(object, name) 대신 object[name]. 그것이 수정의 전부입니다: rawget은 메타테이블을 건너뛰고, 메서드는 __index 뒤의 클래스에 있습니다.",
  "Stall도 Counter도 어디에서도 Sign을 언급하지 않습니다. render()를 가짐으로써 만족하는 것이고, 구조적이라는 말이 뜻하는 것이 그것입니다.",
  "implements는 그 이름에 함수가 있는지만 검사하고, 인자 개수나 무엇을 돌려주는지는 검사하지 않습니다. Lua에서는 아무것도 그것을 검사하지 않습니다. 호출이 알아냅니다.",
]

