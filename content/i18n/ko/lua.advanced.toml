[[quest]]
id    = "lua.advanced.07.context-managers"
title = "셔터는 어쨌든 내려온다"
story = "원사 스트리트의 한 노점은 주문마다 셔터를 올리고 끝나면 내린다. 21:40에 잘못된 주문을 받은 노점은 그때부터 계속 열려 있다. 닫는 줄이 실패한 줄 뒤에 있었으니까."
brief = '''
표준 입력은 개수 `n`, 그다음 `<STALL> <CENTS>` 형식의 `n`줄이고, `CENTS`는 정수여야 합니다.

`opened(stall, body)` — 블록을 함수로 받는 함수 — 를 쓰세요. 들어가는 길에 `OPEN <STALL>`을 출력하고, `body`를 실행하고, 나가는 길에 **본문이 던졌든 아니든** `SHUT <STALL>`을 출력합니다. 본문 안에서는 센트를 파싱해 합계에 더합니다. 센트가 파싱되지 않는 줄은 셔터가 닫힌 뒤에 `BAD <STALL>`로 보고합니다. 마지막으로 `TOTAL <sum>`과 `REJECTED <k>`를 출력하세요.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

Lua에는 `with`도 `finally`도 없습니다. 가장 가까운 것은 본문을 클로저로 받는 함수와, 호출을 감싸는 `pcall`입니다. `pcall` 앞의 모든 것이 진입이고, 뒤의 모든 것이 퇴장이며, `pcall`이 에러를 `SHUT` 너머로 올라가게 두는 대신 반환값으로 바꾸므로 퇴장은 두 경로 모두에서 실행됩니다. 스타터는 `body()`를 맨몸으로 호출하고, `WONG`의 셔터는 영영 닫히지 않습니다.

셔터가 내려간 뒤에는 에러가 다시 올라갑니다: `error(err, 0)`이 그것을 다시 던지고 — `0`은 `error`가 메시지 앞에 위치를 한 번 더 붙이지 않게 합니다 — 호출자 자신의 `pcall`이 그것을 보고 `BAD`를 출력합니다. `opened`에서 삼키지 마세요: 호출자는 알고 싶어 합니다.
'''
hints = [
  "local ok, err = pcall(body) 그다음 print(SHUT) 그다음 if not ok then error(err, 0) end. 그 pcall이 finally입니다.",
  "에러는 opened를 통과해 main의 pcall까지 나가므로 main의 BAD는 여전히 출력됩니다 — SHUT이 다시 던지기 전에 출력되었으니 SHUT 뒤에.",
  "total = total + parse_cents(cents)는 오른쪽을 먼저 평가합니다. parse_cents가 던지면 아무것도 대입되지 않으므로 잘못된 줄은 아무것도 더하지 않습니다.",
]

