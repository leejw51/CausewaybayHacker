        1 2 3 4
output: TOTAL 10
        HITS 4
```

스타터는 샘플에서 결정적으로 `TOTAL 4`를 출력합니다. 모든 심부름꾼이 서랍을 읽고, **yield**하고, 그다음 읽은 것에 자기 값을 더해 되씁니다. 첫 번째가 쓸 무렵에는 넷 모두 `0`을 읽었고, 마지막 쓰기가 이깁니다: 한 노점의 돈과 횟수 넷. 그것이 잃어버린 갱신이고, 스레드 하나 위에서, 잊어버릴 락이 언어에 없는데도 일어났습니다.

Lua에 `Lock`이 없는 것은 선점이 없기 때문입니다. 코루틴은 `coroutine.yield()`라고 말할 때까지 돌고, 그 사이에 다른 것은 돌지 않습니다. 임계 구역은 yield가 없는 모든 코드 구간이고, 버그는 읽기와 쓰기 사이의 yield입니다. yield를 가운데에서 빼내세요 — 먼저 차례를 기다리고, 그다음 한 구간에서 읽고, 더하고, 쓰기 — 그러면 서랍이 맞습니다. 갱신이 정말로 가운데에서 yield해야 할 때(소켓을 기다린다든가)는 락이 플래그입니다: `while busy do coroutine.yield() end`, 세우고, 일하고, 내리기. 그것이 풀어 쓴 뮤텍스입니다.

스케줄러는 프로그램 안에 적혀 있습니다: 심부름꾼들을 돌며 `dead`가 아닌 각각을 재개하는 루프를, 한 라운드 전체에서 살아 있는 것을 하나도 찾지 못할 때까지.
'''
hints = [
  "스타터를 실행하세요: TOTAL 4, HITS 4. 심부름꾼 넷이 0을 읽고, yield하고, 각자 0에 자기 값을 더해 씁니다. 마지막 쓰기가 합계입니다.",
  "읽기와 쓰기 사이에 yield 없이 total = total + value. yield는 pay에 남아 있어도 됩니다. 갱신의 한가운데에만 있으면 안 됩니다.",
