[[quest]]
id    = "lua.cheatsheet_advanced.03.lt-sort"
title = "스스로 줄을 선다"
story = "북 팀에 점수가 매겨진다. 진행 요원은 매번 비교자를 쓰지 않고 정렬하고 싶다."
brief = '''
`Score`는 클래스(`Score.__index = Score`)이고, 각 인스턴스에는 숫자 필드
`v`가 있습니다. `scores`는 그것들의 리스트입니다. `table.sort(scores)` —
**비교자 없이** — 가 가장 작은 `v`부터 정렬하도록 메타메서드 줄을 쓰세요.
'''
hints = [
  "비교자가 없으면 sort는 `<`로 비교하고, 테이블 둘에 대한 `<`는 그 메타테이블에 특정 필드 하나를 묻습니다.",
]

