[[quest]]
id    = "lua.cheatsheet_advanced.15.resume-value"
title = "러너가 가져오는 것"
story = "러너는 숫자 하나를 용 위로 건네고, 끝내기 전에 하나가 내려오기를 기다린다."
brief = '''
```
local co = coroutine.create(function(a)
  local b = coroutine.yield(a * 2)
  return b + 1
end)
```

`co`는 `5`로 한 번 시작되었습니다. 그 호출은 `true, 10`을 돌려줬고,
`coroutine.status(co)`는 이제 `"suspended"`입니다. `ok, v`가 `true, 8`이
되고 코루틴이 끝나도록(`"dead"`) 다음 줄을 쓰세요.
'''
hints = [
  "두 번째 resume의 인자가 대기 중인 yield의 결과가 됩니다 — 정확히 그 인자들, 더는 없이.",
]

