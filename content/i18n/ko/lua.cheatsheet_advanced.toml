[[quest]]
id    = "lua.cheatsheet_advanced.04.eq"
title = "같은 점, 테이블 둘"
story = "러너 둘이 타이항 로드의 같은 지점을 별개의 테이블 둘에 표시하고, 지도는 둘을 같다고 불러야 한다."
brief = '''
`P`는 인스턴스에 숫자 필드 `x`와 `y`가 있는 클래스(`P.__index = P`)입니다.
