[[quest]]
id    = "lua.cheatsheet_advanced.05.call"
title = "클래스 자체를 호출"
story = "메이는 `Pad(5)`가 책상 위의 LÖVE 코드처럼 생성자로 읽히길 원한다."
brief = '''
`Pad`는 `Pad.__index = Pad`와 생성자 `Pad.new(n)`이 있는 클래스입니다.
`mt`는 이미 **`Pad` 자신의** 메타테이블로 설치된 테이블입니다
