쓰세요.
'''
hints = [
  "`Pad`를 호출하면 `Pad` 자신이 아니라 `Pad`의 메타테이블을 참조합니다 — 그리고 핸들러는 호출된 테이블을 첫 인자로 받습니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet_advanced.06.newindex-rawset"
title = "적어 두고, 그다음 저장"
story = "향 장부의 새 항목은 모두 먼저 기록된다. 그 뒤에도 장부는 여전히 그것을 담고 있어야 한다."
brief = '''
`log`는 리스트입니다. `t`는 메타테이블에 다음이 있는 빈 테이블입니다:

```
__newindex = function(t, k, v)
  log[#log + 1] = k
  -- ____
end
```

값이 정말 `t`에 저장되도록(나중의 `t[k]`가 그것을 되읽음) — 이 핸들러를
두 번째로 실행하지 **않고** — 빈칸을 채우세요.
'''
hints = [
  "핸들러가 실행될 때 키는 아직 없으므로 평범한 대입은 핸들러를 다시, 영원히 부릅니다. 저장은 메타테이블을 지나쳐 가야 합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet_advanced.07.rawget-default"
title = "한 번이라도 쓰였나"
story = "카운트 테이블은 어떤 이름에도 0이라고 답한다. 진행 요원은 어느 이름이 실제로 입력됐는지 알고 싶다."
brief = '''
`counts`는 다음처럼 만들어져

```
local counts = setmetatable({}, {__index = function() return 0 end})
```

없는 키는 모두 `0`으로 읽힙니다. `k`가 `counts`에 **정말** 저장되어 있을
때만 참인 `if`를 여세요 — 저장된 `0`은 저장된 것으로 치고, 한 번도 쓰이지
않은 키는 아닙니다.
'''
hints = [
  "보통의 읽기는 기본값을 거칩니다. 메타테이블을 건너뛰는 읽기는 메서드가 아니라 전역 함수입니다.",
]

