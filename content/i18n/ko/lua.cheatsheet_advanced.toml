# LUA LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/lua/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks and identifiers are
# copied verbatim.

pack   = "lua.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet_advanced.01.class-index"
title = "대답하는 테이블"
story = "21:00, 원사 거리. 용의 마디 하나하나가 테이블이고, 메이는 메서드를 한곳에 모아 두고 싶다."
brief = '''
`Dragon`은 메서드의 테이블(`Dragon.length`, …)이고 생성자는 이미 작성되어
있습니다:

```
function Dragon.new(n)
  return setmetatable({n = n}, Dragon)
end
```

`Dragon.new(3):length()`가 `Dragon.length`를 찾게 하는 줄 하나를, 생성자
앞에 두세요.
'''
hints = [
  "인스턴스의 메타테이블은 `Dragon`입니다. 없는 키는 그 메타테이블의 조회 필드가 가리키는 곳에서 찾습니다 — 그리고 그것은 클래스 자신을 가리킬 수 있습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet_advanced.02.inherit"
title = "등불 아래의 마디"
story = "등불은 위에 불꽃이 붙은 마디다. 스스로 못 하는 것은 아래의 마디가 한다."
brief = '''
`Segment`는 자기 메타테이블 필드가 없는 평범한 함수 테이블(`Segment.burn`,
…)입니다. `Lantern`은 보통 패턴의 클래스입니다(`Lantern.__index = Lantern`,
인스턴스는 `setmetatable({}, Lantern)`으로 만듦). `Lantern`이 정의하지 않은
어떤 메서드든 등불이 `Segment`로 되돌아가게 하는 — `Lantern` 자신의
메서드는 유지하면서 — 줄 하나를 쓰세요.
'''
hints = [
  "클래스 자신에게 메타테이블이 필요합니다. `Segment`에는 조회 필드가 없으므로 그대로는 그 메타테이블이 될 수 없습니다.",
]

