id    = "lua.cheatsheet_advanced.22.sort-strict"
title = "크래시 없는 동점"
story = "북 팀 마흔, 대부분 같은 점수, 그리고 정렬이 심판들 앞에서 `invalid order function`을 일으켰다."
brief = '''
`t`는 숫자 필드 `score`가 있는 레코드의 리스트이고, **그중 많은 것이
동점**입니다. LuaJIT가 `invalid order function for sorting`을 일으키지 않게
점수가 높은 것부터 정렬하세요.
'''
hints = [
  "비교자는 엄격한 순서여야 합니다: 같은 원소에는 false, 그리고 숫자가 아니라 불리언. (정렬은 안정적이지 않습니다. 동점 레코드는 어떤 순서로든 나올 수 있습니다.)",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet_advanced.23.next-empty"
title = "장부에 아무것도 없다"
story = "장부는 메는 사람의 이름으로 키가 매겨진다. `#`는 비었든 가득 찼든 0이라고 말한다."
brief = '''
`t`는 메는 사람의 이름으로 키가 매겨집니다 — 문자열 키만 — 그래서 `#t`는
무언가를 담고 있든 아니든 `0`입니다. `t`에 항목이 **전혀** 없을 때만 참인
`if`를 여세요.
'''
hints = [
  "`pairs` 뒤의 이터레이터 원시 함수는 테이블의 첫 키를, 없으면 `nil`을 돌려줍니다. 모든 테이블은 자기만의 값이므로 `{}`는 아무것과도 같지 않습니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet_advanced.24.big-digits"
title = "자릿수 전부"
story = "등불 카운트가 열여섯 자리에 닿았고 출력물은 과학적 표기법으로 돌아왔다."
brief = '''
`n`은 `2^50` — 숫자 `1125899906842624` — 입니다. 모든 자릿수를 지수 없이
출력하세요(LuaJIT의 `print`는 `1.1258999068426e+15`를 보여 줍니다).
'''
hints = [
  "여기서 모든 숫자는 double이고, 기본 변환은 `%.14g`입니다. `format`의 정수 변환은 열여섯 자리 전부를 씁니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet_advanced.25.bit-test"
title = "플래그가 올라갔나"
story = "마디마다의 상태는 플래그들로 된 숫자 하나다. 진행 요원은 `lit`에 해당하는 한 비트를 확인한다."
brief = '''
`flags`는 비트의 행으로 쓰이는 숫자이고 `i`는 `0`부터 세는 비트
위치입니다. LuaJIT의 `bit` 라이브러리는 `bit`으로 로드되어 있습니다.
`flags`의 비트 `i`가 켜져 있을 때 정확히 참인 `if`를 여세요.
'''
hints = [
  "LuaJIT에는 이것을 위한 연산자가 없습니다 — 라이브러리 호출 둘입니다 — 그리고 Lua에서 `0`은 참이므로 결과를 여전히 비교해야 합니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet_advanced.26.goto-continue"
title = "이것은 건너뛰기"
story = "짝수 번호 마디는 이번 바퀴에 쉰다. 루프는 본문 전체를 `if` 안에 넣지 않고 그것들을 지나쳐 걷는다."
brief = '''
```
for _, v in ipairs(t) do
  -- ____
  io.write(v, " ")
  ::continue::
end
```

짝수 값은 건너뛰고 루프가 계속되도록 빈칸을 채우세요(LuaJIT 2.1).
'''
hints = [
  "Lua에는 `continue` 키워드가 없습니다. LuaJIT에는 5.2의 점프 문이 있고, 본문 끝의 레이블이 그 목적지입니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.cheatsheet_advanced.27.local-function"
title = "자기 이름을 아는 함수"
story = "스쿨 스트리트의 팩토리얼은 지역이고 재귀였으며, 두 번째 호출에서 죽었다 — `attempt to call global 'fact'`."
brief = '''
본문이 다음인 **지역** 함수로 `fact`를 선언하세요:

```
  if n <= 1 then return 1 end
  return n * fact(n - 1)
```

재귀 호출이 그것을 찾도록(`fact`라는 전역은 없습니다). 여는 줄을 쓰세요.
'''
hints = [
  "`local x = <expr>`에서 이름은 식 뒤에야 스코프에 들어오므로, 그렇게 대입된 함수 값은 자기 자신을 볼 수 없습니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet_advanced.28.ffi-array"
title = "진짜 C 배열"
story = "LÖVE 클라이언트 아래의 지갑 바인딩은 C와 대화한다. 넘기는 버퍼는 Lua 테이블이 아니라 C 배열이어야 한다."
brief = '''
`ffi`는 `require("ffi")`이고 `n`은 런타임에만 알려지는 숫자입니다. `buf`를
`int` `n`개의 C 배열로 — 0으로 채워지고, `0`부터 인덱싱되며, 크기가 `n`인
— 만드세요.
'''
hints = [
  "C 타입 문자열에는 Lua 변수가 들어갈 수 없습니다. 가변 길이 배열은 자리표시자로 선언되고 개수를 다음 인자로 받습니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet_advanced.29.weak-cache"
title = "놓아주는 캐시"
story = "렌더 캐시는 등불 객체로 키가 매겨진다. 다 탄 등불이 자기 캐시 항목 때문에 살아 있어서는 안 된다."
brief = '''
`cache`는 객체(키로 쓰이는 테이블)를 계산된 값에 매핑합니다. 다른
아무것도 참조하지 않는 객체가 수거될 수 있도록 — 그 항목도 함께 사라지며
— 그러면서 살아 있는 객체에 저장된 값은 남도록 만드세요.
'''
hints = [
  "약함은 문자열을 담은 메타테이블 필드입니다. 어떤 글자가 들어 있느냐가 키, 값, 둘 다 중 무엇이 약한지 정합니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet_advanced.30.sandbox"
title = "달을 위한 샌드박스"
story = "자정. 마지막 도전은 낯선 사람이 입력한 Lua 한 줄이고, `x` 말고는 아무것도 없는 방에서 실행된다."
brief = '''
`src`는 Lua 문자열 `"return x * 2"`이고 `env`는 `{x = 10}`입니다. 전역이
**오직** `env`뿐인 함수 `f`로 컴파일하세요 — 그래서 `f()`는 `20`을
돌려주고 안에서 `print`는 보이지 않습니다. 한 줄, LuaJIT.
'''
hints = [
  "문자열을 컴파일하면 함수가(또는 nil과 메시지가 — 그래서 단언) 나옵니다. 함수의 전역 테이블을 바꾸는 5.1 호출은 바로 그 함수를 돌려줍니다.",
]
