[[quest]]
id    = "cpp.advanced.07.atomic"
title = "한 워드, 잠금 없이"
story = "회전문 카운트에는 잠금이 필요 없다. 펌프실의 나머지 전부에는 필요하고, 그 둘을 가려내는 것이 일이다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 스레드를 하나씩 시작하세요. 각각은 자기 값을 공유된
`std::atomic<long long>`에 더하고 공유된 `std::atomic<int>`를 하나 올립니다 —
어디에도 뮤텍스는 없습니다. 모두 join하고 `TOTAL <sum>`과 `HITS <n>`을
출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

스타터는 컴파일되지 않습니다: 람다가 두 아토믹을 **값으로** 캡처하는데,
`std::atomic`에는 복사 생성자가 없습니다. 그것은 의도된 것입니다. 아토믹은
여러 스레드가 한 번에 명령 하나씩 갱신하기로 합의한 위치입니다. 그것의 사본은
다른 위치일 것이고, 공유는 사라질 것입니다. 참조로 캡처하세요.

아토믹은 더 싼 뮤텍스가 아닙니다. 그것은 다른 도구이고, 명령 하나로
읽고-수정하고-쓰는 기계 워드 하나를 위한 것입니다. `fetch_add`가 그 명령입니다.
두 필드가 서로 맞아야 하는 순간 잠금이 돌아옵니다 — "이 두 가지를 함께"를 위한
아토믹은 없고, 그래서 앞 퀘스트의 `Counter`에는 뮤텍스가 있었고 이것에는
없습니다.

`std::memory_order_relaxed`로 여기서 충분한 것은, 이 증가들이 다른 어떤 쓰기에
비해 *언제* 보이게 되는지에 기대는 것이 없고, 하나도 잃지 않는 것만이 중요하기
때문입니다. 그 문장이 후속 질문입니다.
'''
hints = [
  "오류는 std::atomic의 복사 생성자가 삭제되었다고 말합니다. [&total, &hits, value]로 캡처하고 mutable을 빼세요.",
  "fetch_add는 이전 값을 돌려주고 덧셈을 원자적으로 적용합니다. 잠금도 가드도 없습니다.",
  "아토믹에 대한 total += value도 원자적이고 역시 괜찮습니다. total = total + value는 그렇지 않습니다 — 그것은 사이에 틈이 있는 load와 store입니다.",
]

