부터 `(i + 1) * n / k` 직전까지의 인덱스를 덮습니다 — 그리고 스레드 `i`가 자기
덩어리를 `partial[i]`에 더하게 하세요. 모두 join하고, 그다음 덩어리마다 순서대로
