        TOTAL 15
```

이것이 스레드로 실제로 더 빨라지는 모양이고, 이 지도에서 유일한 것입니다: 각
스레드는 자기 범위를 읽고 자기 칸에 쓰므로, 잠금도 아토믹도 없고, 입력 말고는
공유되는 것이 없습니다. 덩어리 경계 공식이 분할을 정확하게 만듭니다 — 마지막
덩어리는 언제나 `n`에서 끝나고, `k > n`이면 덩어리가 비어 있을 수 있는데, 숨겨진
케이스 중 하나가 그렇게 짜여 있습니다.
'''
hints = [
  "두 경계를 main에서 계산하고 값으로 캡처하세요. 스레드는 분할이 어떻게 정해졌는지 알 필요가 없어야 합니다.",
  "스레드 안의 지역 합계와 끝에서의 partial[i] 쓰기 한 번이 공유 벡터를 스레드마다 정확히 한 번만 건드리게 합니다.",
  "k > n이면 일부 덩어리가 빕니다 — begin == end — 그리고 루프는 그냥 돌지 않습니다. 특별한 경우는 없습니다.",
