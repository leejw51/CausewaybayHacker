  "이동 생성자는 일부러 noexcept로 표시되어 있습니다: std::vector는 이동이 던질 수 없을 때만 재할당 중에 원소를 이동하고, 아니면 예외 안전을 지키려고 복사합니다.",
  "두 벡터의 reserve(n)이 수를 정확하게 만듭니다. 그것이 없으면 재할당이 이미 저장된 모든 원소를 이동(또는 복사)할 것이고, 숫자가 증가 정책에 달리게 됩니다.",
