```

큐는 FIFO이므로, 스케줄러가 무엇을 하든 순서는 입력 순서입니다.
`std::condition_variable`은 소비자가 잠금 위에서 맴도는 대신 할 일이 생길 때까지
자는 방법입니다: `cv.wait(lock, predicate)`는 뮤텍스를 풀고, 자고, 깨어날
때마다 술어를 다시 검사합니다 — 그것이 가짜 깨어남을 대신 처리해 주고, 그래서
술어 형태가 써야 할 유일한 형태입니다.

스타터는 멈춰 버립니다. 생산자는 전부 넣고 `done`을 설정하지도 알리지도 않은 채
돌아가므로, 소비자는 마지막 값에 깨어나 큐를 비우고, 오지 않을 신호를
기다립니다. 모든 생산자/소비자 쌍에는 *더는 없다*고 말할 방법이 필요합니다 —
그것이 `done`입니다.
'''
hints = [
  "생산자의 루프 뒤에: 잠그고, done = true를 설정하고, 풀고, cv.notify_all(). 네 줄이면 프로그램이 끝납니다.",
  "done은 뮤텍스 아래의 wait 술어 안에서 읽히므로 쓸 때도 뮤텍스 아래에서 써야 합니다 — 잠금 없이 쓴 플래그는 데이터 경쟁입니다.",
  "cv.wait는 lock_guard가 아니라 std::unique_lock을 받습니다. wait가 그것을 풀었다가 다시 잠가야 하기 때문입니다. 술어는 깨어날 때마다 다시 검사됩니다.",
]

