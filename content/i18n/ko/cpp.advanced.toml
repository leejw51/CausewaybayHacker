pack   = "cpp.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.advanced.01.getline"
title = "삼판 일지"
story = "태풍 대피항의 항만장은 삼판마다 한 줄씩 적는다: 이름, 그리고 그 배가 내린 것. 숫자가 몇 개가 되든."
brief = '''
첫 줄은 개수 `n`입니다. 다음 `n`줄은 각각 배 이름 하나와 그 뒤를 잇는 0개
이상의 정수이며, 공백으로 나뉩니다.

배마다 `<NAME> <how many numbers> <their sum>` 형태로 한 줄씩 출력하고, 그다음
`BOATS <n>`을 출력하세요.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

여기서 단위는 토큰이 아니라 줄입니다. `std::cin >> x`는 공백에서 멈추고
줄바꿈에는 신경 쓰지 않으므로, 한 배가 어디서 끝나고 다음 배가 어디서
시작하는지 알려 줄 수 없습니다. `std::getline`은 줄 전체를 줍니다. 그다음 그
줄 위의 `std::istringstream`이 다시 `>>`를 주지만, 그 줄 안에서만입니다.

누구나 한 번은 물리는 것이 하나 있습니다: `std::cin >> n` 뒤에도 그 첫 줄 끝의
줄바꿈은 스트림에서 여전히 기다리고 있고, 첫 번째 `getline`은 그것을 빈 줄로
읽습니다.
'''
hints = [
  "n을 읽은 뒤 std::getline(std::cin, junk)를 한 번 하면 >>가 남겨 둔 줄바꿈을 버립니다.",
  "std::istringstream fields(line); fields >> name; 그다음 while (fields >> value)가 나머지를 걷습니다 — 파싱할 것이 남지 않으면 루프가 끝납니다.",
  "이름은 그 줄의 첫 토큰이고, 이름만 있는 줄은 0 0이 됩니다. 특별한 경우는 필요 없습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.advanced.02.references"
title = "사본은 그 물건이 아니다"
story = "요트 클럽 선가의 윈치 기사는 짐을 하나씩 장부의 사본에 적고, 벽에 걸린 장부는 절대 바뀌지 않는다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

함수 `load`를 통해 모든 값을 하나의 `std::vector<long long>`에 넣고, 그다음 세
줄을 출력하세요: `LOADED <how many>`, 읽기만 하는 함수 `total`로 구한
`TOTAL <sum>`, 그리고 `FIRST <value>` — 아무것도 없으면 `FIRST NONE`.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

스타터는 컴파일되고 `LOADED 0`을 출력합니다. `load`는 벡터를 **값으로**
받으므로, 호출마다 자기 사본을 받아 거기에 넣고 돌아갈 때 버립니다. C++은
따로 말하지 않는 한 복사합니다.

`&`로 따로 말하세요: `std::vector<long long>&` 타입의 매개변수는 호출자의
벡터의 사본이 아니라 그것에 대한 참조입니다. `total`은
`const std::vector<long long>&`를 받아야 합니다 — 보기만 하면 되고 건드릴
필요는 없으며, `const`는 그것을 시그니처에 말하는 방법이라 컴파일러가 당신을
그 말에 묶어 둡니다.

`FIRST`는 포인터입니다: `long long* first`는 첫 원소의 주소이거나 `nullptr`
이고, `nullptr`는 따라가기 전에 반드시 검사해야 하는 단 하나의 값입니다. 이
랜드 전체가 이 한 줄에 있습니다.
'''
hints = [
  "글자 하나가 load를 고칩니다: std::vector<long long>& sheet. 호출하는 쪽은 바뀌지 않습니다. 참조는 적힌 그대로의 인자에 묶입니다.",
  "total은 const std::vector<long long>&를 받아야 합니다 — const는 약속이고, 컴파일러가 그것을 검사합니다.",
  "&sheet.front()는 첫 원소의 주소이고 원소가 있을 때만 의미가 있습니다. *first를 쓰기 전에 nullptr를 검사하세요.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.advanced.03.vector"
title = "뗏목의 한가운데"
story = "태풍 대피항에 삼판 마흔 척이 뗏목처럼 붙어 있다. 항만장에게는 가장 바깥 배와 가장 안쪽 배만 보이고 그 사이는 아무것도 보이지 않는다."
brief = '''
표준 입력은 첫 줄의 개수 `n`과 그다음 둘째 줄의, 공백으로 나뉜 정수 `n`개
입니다. `n`은 최소 `1`입니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 엄밀히 끼인 모든
것의 합. 값이 셋보다 적으면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector`가 시퀀스입니다. `front()`와 `back()`이 양 끝이고, `begin() + 1`
부터 `end() - 1`까지가 가운데이며, 그 범위에 대한 `std::accumulate`가
합입니다 — 넘겨주는 시작값이 `long long`인 한에서요.
`std::accumulate(first, last, 0)`은 `0`이 `int`라서 `int`로 더하고, 숨겨진
케이스 중 하나는 가운데가 거기에 들어가지 않습니다.
'''
hints = [
  "nums.begin() + 1과 nums.end() - 1은 반복자이고, 반복자 한 쌍이 <numeric>과 <algorithm>이 범위를 부르는 방식입니다.",
  "값이 하나나 둘이면 그 범위는 비어 있거나 거꾸로입니다 — 만들기 전에 nums.size()에 대한 if로 막으세요.",
  "0LL이 중요합니다: accumulate는 결과 타입을 초깃값에서 추론하고, 그냥 0은 int입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.advanced.04.strings"
title = "바이트는 글자가 아니다"
story = "태풍 대피항 게시판은 銅鑼灣을 3바이트에서 자르고 한 글자를 얻는다."
brief = '''
한 줄을 읽습니다. 세 줄을 출력하세요:

1. **바이트** 단위의 길이
2. **문자** 단위의 길이 — UTF-8 코드 포인트
3. 문자 순서를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 바깥의 문자가 있을 수 있고, 그러면 처음 두 숫자가 같지 않습니다.
`std::string::size()`는 바이트입니다. 언제나 그랬습니다. `std::string`은
인코딩에 대해 아무것도 모릅니다. 그것은 `char`의 시퀀스이고, `char`는
바이트입니다.

UTF-8은 디코딩하지 않고도 세기 쉽습니다: 모든 코드 포인트는 `10xxxxxx` 형태가
**아닌** 바이트로 시작하고, 모든 연속 바이트는 그 형태입니다. 그러니 바이트
`c`는 정확히 `(c & 0xC0) != 0x80`일 때 문자를 시작합니다. 바이트가 아니라
문자를 뒤집으세요 — 문자열 자체에 `std::reverse`를 하면 `銅`을 세 조각으로
잘라 거꾸로 출력할 것입니다.
'''
hints = [
  "바이트를 unsigned char로 루프하세요. 그냥 char는 부호가 있을 수 있고, 그러면 0x7F보다 큰 것에 대한 비트 검사가 틀어집니다.",
  "각 문자를 저마다 작은 std::string으로 모으고, 그 벡터를 뒤집고, 이어 붙이세요.",
  "(c & 0xC0) != 0x80인 바이트를 세면 아무것도 디코딩하지 않고 문자 수가 나옵니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.advanced.05.classes"
title = "선가 장부"
story = "요트 클럽 선가는 인양마다 요금을 매기고 그 줄들을 한곳에 모아 둔다. 아니, 제안이 클래스를 주석 하나로 바꿔 버리기 전까지는 그랬다."
brief = '''
첫 줄은 `<BOAT> <n>`입니다. 다음 `n`줄은 `<ITEM> <CENTS>`입니다.

항목들을 모으는 그 배의 `Ledger`를 만들고, 그다음 각 항목을 도착한 순서대로
`<ITEM> <CENTS>`로 다시 출력하고, 그다음 `TOTAL <sum>`, 그다음
`BOAT <name> <count>`를 출력하세요.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n`은 `0`일 수 있고, 그러면 출력은 마지막 두 줄뿐입니다.

`class`는 `public:`이라고 말하지 않는 한 멤버가 private인 `struct`입니다.
생성자는 본문이 실행될 기회를 얻기 전에 돌아가므로, 멤버는 중괄호 안의
대입이 아니라 **초기화 리스트**에서 설정됩니다 —
`Ledger(std::string boat) : boat_(std::move(boat)) {}`. `total()`은 아무것도
바꾸지 않으므로 `const`로 선언되고, 그것이 `const Ledger&`에서 호출될 수 있는
유일한 이유입니다.
'''
hints = [
  "std::vector<std::pair<std::string, long long>> 하나면 충분합니다. 클래스는 장부가 자기 줄들을 소유하도록 있는 것입니다.",
  "초기화 리스트 — : boat_(std::move(boat)) — 는 멤버를 생성되는 그 순간에 설정합니다. 중괄호 안에서 대입하면 먼저 빈 문자열을 만들고 나서 덮어씁니다.",
  "main이 벡터를 복사하지 않고 걸을 수 있도록 항목들을 const 참조로 돌려주고, 장부를 수정하지 않는 메서드는 모두 const로 표시하세요.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.advanced.06.enum-class"
title = "누가 키를 잡았나"
story = "요트 클럽 출입구는 모든 카드에 회원 요금을 매긴다. 회원이 아닌 카드에도, 카드가 아닌 것에도."
brief = '''
표준 입력은 개수 `n`, 그다음 `<TYPE> <HOURS>` 형태의 `n`줄입니다.

기본 요금은 `500 + 100 * HOURS` 센트입니다. 각 줄마다 다음 중 하나를
출력하세요:

* `MEMBER` — 기본 요금
* `CREW` — 기본 요금의 절반, 정수 나눗셈
* `JUNIOR` — 언제나 `200`
* 그 밖의 것 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

카드를 값 네 개짜리 `enum class Card`로 모델링하고, 그중 하나를 `Other`로
두세요. `enum class`의 값은 몰래 `int`로 변환되지 않고 자기 이름들을 바깥
스코프로 흘리지도 않습니다 — 둘 다 그냥 `enum`이 하는 일이고, 둘 다
`enum class`를 써야 하는 이유입니다.

C++ enum은 페이로드를 실을 수 없으므로, 알아보지 못한 태그는 그 옆에 붙어
다닙니다: 작은 `struct Tag { Card card; std::string raw; }`. 요금은 `switch`
하나로 정하세요. 모든 열거자를 다루면 컴파일러가 경고할 것이 없고, 하나를
빠뜨리면 `-Wall`이 어느 것인지 알려 줍니다.
'''
hints = [
  "Card::Other가 네 번째 열거자입니다. 그것이 알아보지 못한 문자열은 그 옆의 Tag::raw에 삽니다.",
  "열거자마다 case를 둔 switch (tag.card), 그리고 각 case 안에서 return — 모든 갈래가 return하면 break는 필요 없습니다.",
  "std::to_string이 숫자를 std::string으로 바꿉니다. UNKNOWN 줄은 +로 하는 문자열 연결입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.advanced.07.maps"
title = "대피항이 외치는 것"
story = "정오의 태풍 대피항: 삼판마다 무언가를 외치고, 항만장은 그 순위를 원한다."
brief = '''
표준 입력 전체를 읽어 공백으로 나누세요.

서로 다른 단어를 각각 한 번씩 `<word> <count>` 형태로, 횟수 내림차순으로,
동점이면 단어 오름차순으로 출력하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std::map<std::string, long long>`은 키로 정렬되고, `std::unordered_map`은
아무것으로도 정렬되지 않으며, 둘 다 횟수로 정렬되지는 않습니다 — 그러니 순위는
별도의 단계입니다: 항목들을 쌍의 `std::vector`에 복사하고 비교자와 함께
`std::sort`하세요. 없는 키에 `counts[word]++`를 하면 먼저 값 `0`으로 그 키를
넣는데, 세는 루프가 원하는 것이 정확히 그것입니다.
'''
hints = [
  "while (std::cin >> word)는 입력이 끝날 때까지 공백으로 나뉜 모든 토큰을 읽습니다. counts[word]++가 세는 루프의 전부입니다.",
  "벡터는 맵의 begin()과 end()로 바로 만들 수 있습니다. 각 원소는 std::pair<const std::string, long long>입니다.",
  "비교자는 a가 b보다 앞에 와야 할 때 true를 돌려주는 람다입니다: 먼저 횟수 내림차순, 동점이면 단어 오름차순.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.advanced.08.hashtable"
title = "순서가 전혀 없다"
story = "대피항의 점호는 알파벳순으로 돌아오고, 항만장은 배들이 실제로 대답한 순서대로 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 배 이름 하나씩인 `n`줄입니다. `n`은 최소 `1`
이고, 이름은 공백 아닌 문자들의 연속 하나입니다. 이름은 여러 번 나올 수
있습니다.

서로 다른 이름을 각각 한 번씩 `<name> <count>` 형태로, **그 이름이 처음 나온
순서대로** 출력하세요. 그다음 `DISTINCT <k>`를 출력하세요.

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

어느 컨테이너도 혼자서는 이것을 주지 않으며, 그것이 이 퀘스트의 전부입니다.

`std::map`은 트리입니다: 순회하면 이름들을 **정렬해서** 돌려주는데, 그것은
대답한 순서가 아닙니다. `std::unordered_map`은 해시 테이블입니다: 조회는
O(log n) 대신 평균 O(1)이지만, 순회하면 **전혀 정해지지 않은 순서로**
돌려줍니다 — 정렬도 아니고 삽입 순서도 아니며, 두 번 같은 순서라는 보장도
없습니다. 표준은 순서를 약속하지 않으므로, `unordered_map`을 걸으며 출력하는
프로그램은 출력이 빌드한 라이브러리에 달린 프로그램입니다. 스타터가 정확히 그
일을 하고, 서로 다른 이름이 하나뿐인 케이스는 통과하기까지 합니다 — 그것이
단서입니다: 순서들을 구별하지 못하는 테스트는 순서가 맞다는 증거가 아닙니다.

두 일을 두 컨테이너에 맡기세요: `std::vector<std::string>`은 이름이 처음 보인
순서를 기억하고, `std::unordered_map<std::string, long
long>`은 셉니다. 출력은 벡터를 걸으며 하세요.
'''
hints = [
  "해시 테이블은 빨리 찾아보기 위한 것입니다. 벡터는 순서를 기억하기 위한 것입니다. 둘 다 필요합니다.",
  "`count[name]++ == 0`은 이름마다 정확히 한 번 — 삽입할 때 — 참입니다. operator[]가 값을 0으로 기본 생성하기 때문입니다.",
  "출력은 벡터를 걸으며 각 횟수를 맵에 물어서 하세요. 절대 맵을 걸으며 하지 마세요.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.advanced.09.set-and-pair"
title = "누가 어디에 매여 있나"
story = "계류 게시판은 같은 삼판을 같은 선석에 두 번 적어 두었고, 어느 줄이 중복인지 아무도 말하지 못한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<BERTH> <NAME>` 형태의 `n`줄입니다.

서로 다른 `<BERTH> <NAME>` 짝을 각각 한 번씩, 선석 순서로 그리고 이름
순서로 출력하고, 그다음 `DISTINCT <k>`와 `DUPES <n - k>`를 출력하세요.

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

`std::set<std::pair<int, std::string>>` 하나가 세 가지 일을 한 번에 합니다:
이미 들어 있는 것의 두 번째 사본을 거부하고, 스스로 정렬된 상태를 유지하며,
`std::pair`는 이미 출력이 원하는 방식으로 비교합니다 — 첫 원소, 그다음 둘째.
범위 `for`로 걷고, 각 쌍을 `.first`와 `.second` 대신 **구조적 바인딩**
`const auto& [berth, name]`으로 풀어내세요.
'''
hints = [
  "컨테이너를 바꾸세요: std::set<std::pair<int, std::string>>. 중복을 넣는 것은 오류가 아니라 아무 일도 하지 않는 것입니다.",
  "집합은 원소 타입의 operator<로 정렬되고, std::pair는 first 다음 second로 비교합니다 — 출력이 원하는 선석 다음 이름 순서입니다.",
  "for (const auto& [berth, name] : moorings)는 각 쌍을 두 이름으로 풀어냅니다. n에서 집합의 크기를 뺀 것이 중복 수입니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.advanced.10.algorithms"
title = "선가를 한 번에 내려가며"
story = "윈치 일지는 짐 무게가 한 열로 적힌 것이다. 알렉스는 for 루프 셋이라고 한다. 메이는 표준 라이브러리가 이미 그것들을 써 두었다고 한다."
brief = '''
표준 입력은 공백으로 나뉜 정수 한 줄입니다.

네 줄을 출력하세요:

1. 짝수 값들의 합(없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로 해서, 순서대로, 공백 하나로 이어서 —
   없으면 `-`
3. 서로 다른 값이 몇 개인지
4. `FIRST_BIG <i>` — `10`보다 큰 첫 값의 0 기반 인덱스, 없으면 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

인덱스 루프가 아니라 `<algorithm>`과 `<numeric>`을 쓰세요: 첫 줄은 람다와 함께
`std::accumulate`, 둘째 줄은 `std::copy_if`와 `std::transform`, 셋째 줄은
`std::sort` 다음 `std::unique`, 넷째 줄은 `std::find_if`. 모두 반복자 한 쌍을
받고, 결정이 필요한 곳에서는 람다를 받습니다. 요점은 루프가 쓰기 어렵다는 것이
아니라, 이름이 그 루프가 무엇을 위한 것인지 말해 준다는 것입니다.
'''
hints = [
  "accumulate의 네 번째 인자는 이항 함수 (acc, x) -> acc입니다. x가 짝수일 때만 x를 더하게 하세요.",
  "copy_if에는 쓸 곳이 필요합니다 — std::back_inserter(big)이 가면서 벡터를 늘립니다. transform은 같은 범위 위에 다시 쓸 수 있습니다.",
  "std::unique는 중복을 끝으로 옮기고 그것들이 시작하는 곳의 반복자를 돌려줍니다. begin()에서 거기까지의 거리가 서로 다른 값의 수입니다. 인접한 중복만 보므로, 먼저 사본을 정렬하세요.",
  "find_if는 못 찾으면 end()를 돌려주고, 찾았을 때는 반복자에서 begin()을 뺀 것이 인덱스입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.advanced.11.templates"
title = "한 번만 써라"
story = "펌프실 계기판에는 largest가 네 번 적혀 있다 — 리터용, 분용, 펌프용, 펌프 이름용 — 그리고 다섯 번째는 조수가 바뀌기 전에 필요하다."
brief = '''
표준 입력은 두 줄입니다: 첫 줄에 정수들, 둘째 줄에 단어들.

둘 다에 통하는 `largest`를 **하나** 쓰고, `larger()`와 `smaller()`를 가진 클래스
템플릿 `Pair<T>`를 쓰세요.

가장 큰 정수, 가장 큰 단어를 출력하고, 그다음 처음 두 정수로 만든 `Pair`에
대해 `PAIR <larger> <smaller>`를 출력하세요. 동점이면 `a`가 더 큰 것으로
칩니다.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

스타터는 컴파일되지 않습니다: `largest`는 `long long`에 못 박혀 있어서, 단어를
넘기면 *no matching function*입니다. **함수 템플릿**
`template <typename T> T largest(const std::vector<T>& xs)`는 호출되는
타입마다 한 번씩 찍혀 나옵니다 — `T`는 인자에서 추론되고, 본문이 `T`에
요구하는 것은 `>`가 통한다는 것 하나뿐입니다.

`Pair<T>`는 클래스에 대한 같은 생각입니다. 그 메서드들은 읽기만 하고 쓰지
않으므로 `const`이고, 호출자는 보기만 원하므로 사본이 아니라 `const T&`를
돌려줍니다. 두 시그니처 모두 무엇을 약속하는지 말하고, 컴파일러가 그 약속을
지키게 합니다.
'''
hints = [
  "largest 앞에 template <typename T>, 그리고 그 안의 모든 long long 자리에 T. 호출은 바뀌지 않습니다. T는 추론됩니다.",
  "std::string에는 이미 operator>가 있으므로, 같은 템플릿 본문이 아무것도 더하지 않고 단어에 대해서도 컴파일됩니다.",
  "Pair<T>는 클래스 템플릿입니다. 쓰는 자리에서 타입을 밝히고 — Pair<long long> — 메서드들은 비교만 하므로 const입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.advanced.12.lambdas"
title = "출입문 카운트"
story = "요트 클럽 회전문은 누가 들어오고 누가 나가는지 세고, 매니저는 그사이 무슨 일이 있었든 마감 때의 숫자를 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 각각 `IN` 또는 `OUT`인 `n`줄입니다.

절대 0 아래로 내려가지 않는 누적 카운트를 유지하고 명령마다 그것을
출력하세요. 그다음 `INS <k>` — `std::count_if`와 람다로 센, `IN`이었던 명령의
수 — 와 `CLOSED <final>`을 출력하세요.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

카운터는 클로저입니다: `make_counter`는 자기 합계를 소유하는 람다를 돌려줍니다.
람다는 기본적으로 복사로 캡처하고, 사본은 본문 안에서 `const`입니다 — 매개변수
목록 뒤의 `mutable`이 캡처한 합계를 호출 사이에 바꿀 수 있게 해 줍니다.
**초기화 캡처** `[total = 0LL]`은 캡처할 변수를 바깥 스코프가 아니라 바로 그
대괄호 안에서 선언하므로, 람다 바깥에는 다른 누가 건드릴 것이 아무것도
없습니다.

다른 캡처인 `[&]`는 모든 것을 참조로 가져갑니다. 이 퀘스트에는 둘 다
적힙니다. 어느 쪽을 뜻했는지 아는 것이 면접관이 귀 기울이는 부분입니다.
'''
hints = [
  "[total = 0LL](long long delta) mutable { ... } — 초기화 캡처가 total을 선언하고, mutable이 본문이 거기에 대입할 수 있게 합니다.",
  "mutable이 없으면 본문은 클로저 타입의 const 멤버 함수이고, total += delta는 조용히 아무것도 안 하는 것이 아니라 컴파일 오류입니다.",
  "std::count_if(begin, end, predicate)는 술어가 받아들인 원소의 수를 돌려줍니다. 술어는 명령 하나를 받는 람다입니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "cpp.advanced.13.optional-variant"
title = "숫자가 아닌 줄"
story = "펌프실 검침원은 숫자 한 열을 제출하는데, 그 한가운데에 누군가의 점심 주문이 끼어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `n`줄입니다. 각 줄은 정수여야 합니다.

각 줄마다 두 배로 한 값을 출력하거나, 파싱되지 않으면 `BAD <line>`을
출력하세요. 마지막으로 `SUM <total>`을 출력하는데, 합계는 출력한 값들의
합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

답은 두 타입이 나릅니다. `std::optional<long long> parse(const std::string&)`
는 *숫자이거나 아무것도 아님*이고, `std::from_chars`가 그것을 채웁니다: 예외를
던지는 대신 오류 코드를 돌려주고, 어디서 멈췄는지 알려 주므로 `xx`뿐 아니라
`4x`도 거부할 수 있습니다.

`std::variant<long long, std::string> doubled(const std::string&)`는 *두 배 한
값이거나 실패한 줄*입니다 — 정확히 두 타입 중 하나이고, 절대 둘 다가 아니며,
절대 둘 다 아닌 것도 아닙니다. `std::get_if<long long>(&result)`는 안에 든
것이 숫자면 그것을 가리키는 포인터를, 아니면 `nullptr`를 주는데, 그것이 `main`
에 필요한 두 갈래 분기입니다. 이 프로그램 어디에도 예외는 없습니다. 실패는
값이고, 값이 가는 곳으로 갑니다.
'''
hints = [
  "std::from_chars(first, last, value)는 ptr과 ec를 가진 구조체를 돌려줍니다. 성공은 ec == std::errc() 그리고 ptr == last입니다. 아니면 4x 같은 줄이 반만 파싱됩니다.",
  "optional은 값을 가질 때 참이므로 if (auto v = parse(text))가 분기의 전부이고, *v가 그 숫자입니다.",
  "같은 함수에서 long long이나 std::string을 돌려주는 것은 합법입니다. 반환 타입이 둘 다 담을 수 있는 variant이기 때문입니다. main에서 get_if가 갈래를 고릅니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "cpp.advanced.14.exceptions"
title = "당신만의 오류"
story = "계류 요금 서비스의 네 계층은 저마다 다른 것을 던지고, 그 위에서는 아무것도 그것을 잡지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 각각 km 단위 거리여야 하는 `n`줄입니다.

`fare(text)`는 `std::stoll`로 파싱하고 — 이것은 `xx`에서
`std::invalid_argument`를 **던집니다** — 음수 거리는 직접 만든
`NegativeDistance`를 던져서 거부합니다. 이것은 `std::runtime_error`에서 파생된
클래스이고 그 `what()`은 `negative distance: <km>`라고 읽힙니다. 그 밖에는
`500 + 100 * km`를 돌려줍니다.

입력 줄마다 한 줄을 출력하세요: 요금, 또는 파싱되지 않으면 `not a number`,
또는 거리가 음수이면 `NegativeDistance`의 `what()`. 그다음 실패한 줄의 수인
`ERRORS <k>`를 출력하세요.

파싱 실패는 예외의 말이 아니라 당신의 말을 출력합니다.
`std::invalid_argument::what()`은 라이브러리가 하고 싶은 대로 하는 말이기
때문입니다 — libstdc++에서는 `stoll`, libc++에서는 `stoll: no conversion` — 그리고
기대 출력은 그것에 기댈 수 없습니다.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

스타터는 컴파일되고 `xx`에서 죽습니다: 아무도 잡지 않은 예외는 `main`의
꼭대기에 닿고 런타임이 `std::terminate`를 호출하는데, 그것이 보이는 abort
입니다. `catch` 갈래 두 개를 가진 `try` 블록이 그것을 고칩니다 — 더 구체적인
타입이 먼저입니다. 갈래는 순서대로 시도되고, `std::runtime_error`가 먼저 오면
`NegativeDistance`를 삼켜 버리기 때문입니다. 언제나 `const&`로 잡으세요: 값으로
잡으면 파생 예외가 기반 클래스로 잘려 나가고 던진 메시지를 잃습니다.
'''
hints = [
  "호출을 try { ... }로 감싸고 catch (const NegativeDistance& e) 그다음 catch (const std::invalid_argument&)를 추가하세요 — 그 순서로.",
  "e.what()은 생성자에서 만든 메시지입니다. std::runtime_error가 그것을 대신 저장합니다.",
  "잡히지 않은 예외는 std::terminate를 호출하고, 이미 나간 것 너머로는 아무 출력도 비우지 않은 채 프로세스를 중단합니다. 스타터가 둘째 줄에서 하는 일이 그것입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.advanced.15.iterators"
title = "당신만의 for 루프"
story = "펌프실 계기는 교대 시작부터 끝까지 모든 측정값을 짚어 가는데, 그중 어느 것도 어디에도 저장하지 않는다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

`Stops`에 반복자를 주어, 그것에 대한 범위 `for`가 `start`에서 시작해 `step`
씩 나아가는 `count`개의 값을 내게 하세요. 각각을 한 줄씩 출력하고, 그다음 같은
`begin()`/`end()`에 대한 `std::accumulate`로 계산한 `SUM <total>`을
출력하세요.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

스타터는 컴파일되지 않습니다: 범위 `for`는 컴파일러가 `begin()`과 `end()` 호출로
다시 쓰는데, `Stops`에는 둘 다 없습니다. 상속할 트레이트도 없고 선언할
인터페이스도 없습니다. 루프는 `begin()`이 돌려주는 무엇에든 세 가지를 이름으로
요구합니다 — `operator*`, 전위 `operator++`, `operator!=` — 그리고 그것들이
있으면 동작합니다. 그것이 계약의 전부이고, `std::accumulate`와 다른 모든
알고리즘이 쓰는 것과 같은 계약입니다.
'''
hints = [
  "반복자는 그 자체로 작은 구조체입니다: 현재 값, 보폭, 그리고 남은 개수.",
  "end()는 남은 것이 없는 반복자입니다. operator!=는 카운트다운만 비교하므로, end() 안의 값은 상관없습니다.",
  "std::accumulate는 for 루프와 같은 세 연산자를 걷습니다 — begin()/end()가 생기면 둘 다 한 줄 더 없이 동작합니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "cpp.advanced.16.raii"
title = "스스로 뒷정리를 한다"
story = "펌프실 일지는 교대가 끝나면 올바른 순서로 스스로 닫힌다. 누가 기억했든 안 했든."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

`main`의 **맨 위**에 `first`와 `second`라는 이름의 `Guard` 값 둘을 선언하고,
그 소멸자가 `DROP <name>`을 출력하게 하세요. 중첩 블록 안에서, 소멸자가
`TALLY <count> <sum>`을 출력하는 `Tally`에 값들을 넣으세요. 블록 뒤에서
`DONE`을 출력하세요. `main` 자신은 그 밖에 아무것도 출력하지 않습니다.

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

`DONE`을 뺀 모든 줄은 소멸자가 출력합니다. `Tally`는 자기 블록의 닫는
중괄호에서 죽으므로 `TALLY`가 `DONE`보다 먼저 옵니다. 두 가드는 `main`이
돌아갈 때 선언의 **역순**으로 죽으므로 `second`가 `first`보다 먼저 갑니다.
그중 어느 것도 당신이 일정을 잡지 않습니다. 스코프가 일정을 잡습니다.

그것이 RAII이고, 이름이 개념보다 못합니다: 자원은 객체의 수명에 묶이고,
소멸자가 해제입니다. `std::lock_guard`는 이렇게 잠금을 풀고,
`std::unique_ptr`는 이렇게 해제하고, `std::ofstream`은 이렇게 닫으며, 이른
`return`이든 던져진 예외든 그 하나하나를 정확히 똑같이 실행합니다. 셋 모두 다음
