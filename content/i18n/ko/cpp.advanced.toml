[[quest]]
id    = "cpp.advanced.13.template-class"
title = "어떤 짐이든 싣는 링"
story = "계기는 최근 측정값 몇 개를 간직하고 항만장은 최근 배 이름 몇 개를 간직하는데, 알렉스는 같은 링 버퍼를 두 번 썼다."
brief = '''
첫 줄은 용량 `cap`입니다. 둘째 줄은 정수 목록, 셋째 줄은 단어 목록입니다.

클래스 템플릿 `Ring<T>`를 **하나** 쓰세요: 넣어진 항목 중 가장 최근 `cap`개를
간직하고, 가장 오래된 것을 덮어쓰며, 도착 순서로 걸을 수 있는 고정 용량
버퍼입니다. 정수들을 `Ring<long long>`에, 단어들을 `Ring<std::string>`에 넣고,
각 링의 내용을 한 줄씩 출력하고, 그다음 `DROPPED <k>` — 모두 합쳐 몇 항목이
밀려났는지 — 를 출력하세요.

```
input:  2
        1 2 3 4
        hku tram bus
output: 3 4
        tram bus
        DROPPED 3
```

스타터는 컴파일되지 않습니다: `Ring`은 `long long`용으로 쓰여 있어서 단어들이 갈
곳이 없습니다. 클래스 템플릿은 타입마다 인스턴스화되는 하나의 정의이고, 기초
길의 함수 템플릿과 정확히 같으며, `Ring<T>` 전체는 `T`가 무엇인지 모른 채
쓰입니다 — 기본 생성되고, 복사되고, 출력될 수 있다는 것만 압니다.

`begin()`/`end()`도 주세요. 링은 도착 순서로 저장되어 있지 않습니다 — 가장
오래된 항목은 쓰기 헤드가 막 덮어쓰려는 곳에 있습니다 — 그래서 반복자가 산술을
해야 하고, 그것이 읽기보다 직접 써 볼 가치가 있는 부분입니다.
'''
hints = [
  "클래스 위에 template <typename T>, 칸에는 std::vector<T>, push에는 const T&. 그다음 쓰는 두 자리에 Ring<long long>과 Ring<std::string>.",
  "가장 오래된 항목은 (head + cap - count) % cap에 있습니다. 도착 순서로 k번째 항목은 (oldest + k) % cap입니다. 반복자는 k만 가지고 다니면 됩니다.",
  "함수 템플릿 print(const Ring<T>&)는 인자에서 T를 추론하므로, 출력기 하나가 두 링을 모두 맡습니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "cpp.advanced.14.invalidation"
title = "걸으면서 지우기"
story = "항만장은 계류 목록을 읽어 내려가며 삼판을 지워 나가는데, 지울 때마다 그다음 배를 건너뛴다."
brief = '''
첫 줄은 `n t`입니다. 둘째 줄은 정수 `n`개입니다.

벡터에서 `t`보다 작은 모든 값을 **제자리에서** 지우고, 남은 것을 한 줄에
출력하고(아무것도 없으면 `-`), 그다음 `REMOVED <k>`를 출력하세요.

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

스타터는 누구나 한 번은 쓰는 버그입니다: 인덱스로 걷다가 `i`에서 지우고, 그다음
`++i`를 합니다 — 그러면 `i` 칸으로 미끄러져 들어온 원소는 한 번도 검사되지
않습니다. 인접한 작은 값 둘이면 두 번째 것이 살아남습니다. 그 버그는 적어도
잘 정의되어 있습니다. 그것의 반복자 쌍둥이는 그렇지 않습니다: `erase(it)`는
`it`와 그 뒤의 모든 반복자를 무효화하므로, 안에 `erase`가 있는
`for (auto it = v.begin(); ...; ++it)`
는 **정의되지 않은 동작**입니다 — 보통 끝을 넘어 걸어 나가고 가끔은 동작하는
것처럼 보이는데, 그쪽이 더 나쁩니다.

`erase`는 지운 원소 다음 원소의 반복자를 돌려줍니다. 그것을 쓰세요: 걸리면
`it = v.erase(it)`, 아니면 `++it`, 그리고 절대 둘 다는 아닙니다. C++20에는
`std::erase_if(v, predicate)`도 있는데, 호출 하나로 일 전체를 하고 먼저 내놓을
답입니다. 루프는 그들이 `erase_if`가 무엇을 하는지 물을 때 내놓을 답입니다.
'''
hints = [
  "for 머리에서 증가를 빼세요. 지우지 않은 갈래에서만 ++it로 나아가세요. 다른 갈래에서는 it = erase(it)가 이미 나아갔습니다.",
  "인덱스 버전도 고칠 수 있습니다 — 지운 뒤에 ++i를 하지 않기 — 하지만 알아 둘 것은 반복자 형태입니다. std::list와 std::map에서도 같기 때문입니다.",
  "std::erase_if(vector, pred)는 몇 개를 지웠는지 돌려주고, 그것이 정확히 REMOVED 줄입니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "cpp.advanced.15.undefined-behaviour"
title = "컴파일러는 가정했다"
story = "펌프실의 리터 카운터는 int이고, 2147483647리터에서 컴파일러는 이미 거기까지 가지 않으리라 가정해 두었다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개이며, 각각은 `long long`에 들어갑니다.
그것들의 누적 합계도 `long long`에 들어갑니다.

두 줄을 출력하세요: 가는 길의 모든 누적 합계가 32비트 `int`에 들어가면
`INT32 OK`, 아니면 그것을 밀어낼 첫 값의 0 기반 인덱스와 함께
`INT32 OVERFLOW <i>`. 그다음 `INT64 <total>`.

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

스타터는 합계를 `int`에 두고 무슨 일이 있어도 `INT32 OK`를 출력합니다. 뻔한
검사 — `if (total + v < total)` — 를 더해서는 고칠 수 없습니다. 그 검사는
찾으려는 오버플로 자체로 쓰여 있고, **부호 있는 오버플로는 정의되지 않은
동작**이기 때문입니다. 컴파일러는 UB가 일어나지 않는다고 가정할 자격이 있으므로,
양수 `v`에 대한 `total + v < total`은 컴파일러가 보기에 *언제나 거짓*이고,
`-O2`에서 gcc와 clang 모두 그 검사를 지웁니다. 틀린 숫자는 옵티마이저의 버그가
아닙니다. 그것이 계약입니다.

이 랜드가 돌아가는 규칙: 정의되지 않은 동작은 "어떤 값"이 아닙니다. 그것은
컴파일러가 어떤 일이 불가능하다고 가정하고 거기서부터 추론하는 것입니다. 그러니
오버플로를 일으켜서 감지하는 일은 절대 없습니다. 덧셈 *전에*, 더 넓은 타입에서
또는 한계 — `std::numeric_limits<int>` — 와 비교해서 감지하며, 이 프로그램의 기대
출력은 정의되지 않은 어떤 것에도 기대지 않습니다.
'''
hints = [
  "합계를 long long에 두고 덧셈마다 std::numeric_limits<int>::min()과 max()에 비교하세요. int 산술은 한 번도 일어나지 않습니다.",
  "범위를 벗어나는 첫 인덱스만 기록하세요. 나중 값이 합계를 다시 안으로 데려올 수 있고, 질문은 처음 벗어난 곳을 물었습니다.",
  "꼭 int 둘을 더해야 하고 그것이 안전한지 알고 싶다면: 더한 뒤 합의 부호가 아니라, 더하기 전에 v > INT_MAX - total을 검사하세요. 앞의 것은 정의되어 있고, 뒤의 것은 컴파일러가 지우는 것입니다.",
]

