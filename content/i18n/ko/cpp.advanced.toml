[[quest]]
id    = "cpp.advanced.11.shared-ptr"
title = "누가 또 이것을 쥐고 있나"
story = "계기 둘이 파이프 하나로 같은 탱크를 읽고, 파이프는 마지막 계기가 사라질 때까지 남아 있어야 한다. 그리고 단 1초도 더는 안 된다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값들을 `std::shared_ptr`가 소유하는 `std::vector<long long>`에 넣고, 같은 벡터에
대한 **두 번째** `shared_ptr`와 그것을 지켜보는 `std::weak_ptr`를 만드세요. 네
줄을 출력하세요:

1. `REF <sum>` — 두 번째 핸들을 통해 읽은 합
2. `SHARED <k>` — 두 핸들이 모두 살아 있는 동안의 `use_count()`
3. `ALIVE yes` — 그것들이 살아 있는 동안의 `!watch.expired()`
4. `ALIVE no` — 두 핸들이 모두 `reset()`된 뒤

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

`unique_ptr`는 소유자 하나였습니다. `shared_ptr`는 객체 옆에 보관되는 소유자의
수이고, 수가 0에 닿으면 객체가 해제됩니다 — 마지막으로 간 핸들이 어느
것이든 그것에 의해. 핸들을 복사하면 수가 오르고, reset하거나 파괴하면 수가
내려갑니다. 수는 아토믹이므로 두 스레드가 각자 핸들을 안전하게 쥘 수 있습니다.
그렇다고 *객체*가 스레드 안전해지지는 않으며, 그것을 건드리려면 앞 지도들의
뮤텍스가 여전히 필요합니다.

`weak_ptr`는 수를 세지 **않는** 핸들입니다. 객체가 아직 있는지 볼 수 있고, 있으면
`lock()`으로 `shared_ptr`로 승격될 수 있지만, 객체를 살려 둘 수는 없습니다.
그것이 순환을 깨는 것이고 — 서로에 대한 `shared_ptr`를 쥔 두 객체는 절대 0에
닿지 않습니다 — 이 길의 마지막 지도가 다루는 것입니다.
'''
hints = [
  "std::shared_ptr<...> mirror = ledger;는 핸들을 복사하고 수를 2로 올립니다. mirror->begin()은 같은 벡터에 닿습니다.",
  "weak_ptr는 shared_ptr로 바로 생성되고 수를 절대 바꾸지 않습니다. expired()가 그것에 묻는 질문의 전부입니다.",
  "두 핸들 모두에 reset()하면 수가 0으로 내려갑니다. 첫 reset만으로는 아무것도 해제되지 않고, 방 안의 힌트 하나는 그 이유를 말하는 것입니다.",
]

