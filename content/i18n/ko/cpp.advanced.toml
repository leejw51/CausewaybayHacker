[[quest]]
id    = "cpp.advanced.16.jthread"
title = "요청받으면 멈춰라"
story = "야간 펌프는 누군가 멈추라고 할 때까지 돈다. 그리고 이번 교대 전까지는 아무도 그럴 수 없었다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

`std::jthread` 둘을 시작하세요. 첫째는 값들을 더해 결과를 저장합니다. 둘째는
`std::stop_token`을 받아 거기에 플래그를 설정하는 `std::stop_callback`을 등록하고,
그다음 `stop_requested()`까지 루프합니다. `main`에서 둘째 스레드에
`request_stop()`을 호출하고, 둘 다 join하고, 출력하세요:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std::jthread`는 `std::thread`에 두 가지를 더한 것이고, 둘 다 RAII입니다. 그
소멸자는 **join하므로**, 스타터의 중단 — joinable인 채로 파괴된 `std::thread` —
은 일어날 수 없습니다. 그리고 `std::stop_source`를 지니고 다닙니다: 스레드 함수가
첫 매개변수로 `std::stop_token`을 받으면 `jthread`가 하나를 넘겨주고,
`request_stop()`이 그것을 뒤집으며, 소멸자는 join하기 전에 `request_stop()`을
호출합니다. 자기 토큰을 검사하는 스레드는 언제나 끌 수 있는 스레드입니다.
검사하지 않는 것이 스타터입니다.

`stop_callback`은 막혀 있는 스레드가 알아차리는 방법입니다 — 멈춤이 요청되는
순간, 요청한 스레드 위에서 실행되고, 보통의 일은 작업자가 잠들어 있는 조건 변수를
깨우는 것입니다.
'''
hints = [
  "summer를 std::thread에서 std::jthread로 바꾸면 join을 더하기 전에도 중단이 사라집니다 — 그래도 sum을 읽기 전에 join하세요.",
  "첫 매개변수가 std::stop_token인 람다는 그것을 실행하는 jthread에게서 자동으로 하나를 받습니다. 그것이 연결의 전부입니다.",
  "std::stop_callback on_stop(token, fn)은 객체입니다: 생성자에서 등록하고 소멸자에서 등록을 해제하므로, 루프 동안만 살고 그 이상은 살지 않습니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.advanced.17.dangling"
title = "댕글링"
story = "빅토리아 공원의 펌프실, 분수대 아래 두 층. 펌프 스레드가 교대가 끝날 때 방이 해제한 버퍼를 아직도 읽고 있다."
brief = '''
첫 줄은 `w n`입니다: 펌프 `w`대와 측정값 `n`개. 둘째 줄은 측정값들입니다.

`pump(w, buffer)`는 스레드 `w`개를 시작합니다. 스레드 `i`는 `i * n / w`부터
`(i + 1) * n / w`까지의 측정값을 `partial[i]`에 더하고, `pump`는 부분합들을
돌려줍니다. `main`은 각각에 대해 `PUMP <i> <sum>`을, `TOTAL <sum>`을 출력하고,
그다음 모든 것이 끝났을 때 버퍼가 해제되어 있으면 `FREED yes`를 출력합니다 —
`std::weak_ptr`를 통해 관찰해서.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

스타터는 중단됩니다. `pump`는 지역 벡터에 스레드들을 만들고 그것들이 여전히
joinable인 채로 돌아가므로, 벡터의 소멸자가 `std::terminate`를 호출합니다.
대신 그것이 하려던 일을 읽어 보세요: 그 스레드들은 `buffer`에 대한 **참조**를
쥐고 있고, `pump`의 호출자는 `buffer`를 막 죽게 두려는 참입니다. 소멸자가 실행된
뒤에 벡터를 읽는 스레드는 해제된 메모리를 읽고 있는 것입니다. 가끔은 옛 숫자를
얻습니다. 가끔은 다음 할당을 얻습니다. 가끔은 할당자가 이미 페이지를 돌려주어서
세그폴트가 납니다. 그것은 정의되지 않은 동작이고, 가장 비싼 종류입니다. 실수가
있는 곳에서 실패하지 않기 때문입니다.

증상이 아니라 소유권을 고치세요. 버퍼는
`std::shared_ptr<const std::vector<long long>>`이고, 모든 스레드가 **핸들의 자기
사본**을 캡처하며, 버퍼는 그것을 쥔 마지막 스레드만큼 정확히 오래 삽니다 —
`pump`가 어떻게 돌아가든, 스레드들이 어떤 순서로 끝나든. 돌아가기 전에
join하세요. `main`은 `weak_ptr`를 간직하고, `pump`가 돌아가 자기 핸들을 놓은 뒤
`expired()`가 증거입니다: 측정값은 한 번, 마지막으로 끝난 펌프에 의해 해제되었고,
아무도 여전히 읽고 있지 않았습니다.

그것이 이 랜드 전체를 한 프로그램에 담은 것입니다. 아무것도 당신을 검사하지
않았습니다. 당신이 수명을 사용에 맞췄고, 그것을 하는 도구들 — 세는 스마트
포인터, 기다리는 join — 은 기초 길에서 만난 바로 그 RAII입니다.
'''
hints = [
  "pump에서 두 가지를 바꾸세요: readings를 참조로 캡처하는 대신 buffer(shared_ptr)를 값으로 캡처하고, return 전에 모든 스레드를 join하세요 — 자기 블록 안의 std::vector<std::jthread>가 닫는 중괄호에서 join을 합니다.",
  "람다가 가진 shared_ptr의 사본이 벡터를 살려 두는 것입니다. 그것은 pump가 돌아갈 때가 아니라 스레드 함수가 돌아갈 때 풀립니다. 그것이 참조와 소유자의 차이입니다.",
  "partial은 여전히 참조로 캡처되고, 그것이 맞습니다: pump가 그것을 소유하고, 돌려주기 전에 join하며, 각 스레드는 자기 칸에만 씁니다.",
  "main은 일부러 자기 핸들을 pump 안으로 이동합니다. 하나를 간직했다면 FREED는 no일 것입니다 — main이 여전히 쥐고 있어서 버퍼가 살아 있을 테니까요. 그리고 그것이 이 보스가 당신이 설명할 수 있기를 받아들이는 다른 답입니다.",
]
