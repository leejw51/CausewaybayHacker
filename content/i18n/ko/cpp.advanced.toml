[[quest]]
id    = "cpp.advanced.09.async"
title = "그 수를 약속해 줘"
story = "윈치 기사는 숫자마다 소년을 하나씩 보내 가져오게 하고 거기 서서 기다리지 않는다. 숫자는 올 때 온다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 `std::launch::async`로 `std::async` 작업을 하나씩 띄워 그 값의 제곱을
돌려주게 하세요. `std::future`들을 벡터에 모으고 **순서대로** `get()`해 각각을
출력하세요. 그다음 `std::promise<int>`를 스레드 하나에 더 넘겨 그것을 `n`으로
설정하게 하고, 짝이 되는 future에서 `READY <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

future는 아직 여기 없는 값입니다. `std::async`는 함수의 반환값에 대해 그것을
하나 줍니다. `get()`은 그것이 존재할 때까지 막았다가 한 번 넘겨줍니다. future를
순서대로 부르는 것이 출력을 순서대로 놓습니다 — 작업 자체는 끝날 때 끝납니다.

`std::promise`는 같은 파이프의 다른 쪽 끝이고, 감쌀 반환값이 없을 때를 위한
것입니다: 한쪽이 `set_value`를 부르고, 다른 쪽이 그것을 `get`합니다. 그것이
스레드가 뮤텍스도 큐도 플래그도 없이 결과 하나를 보고하는 방법입니다.

`std::launch::async`를 소리 내어 말하세요. 그것이 없으면 구현은 `deferred`를
고를 수 있는데, 그것은 작업을 `get()` 안에서 호출한 스레드 위에서 게으르게
실행합니다 — 여기서는 여전히 맞지만, `async`를 읽는 누구도 기대하는 것이
아닙니다.
'''
hints = [
  "std::async(std::launch::async, lambda)는 람다가 돌려주는 것의 std::future를 돌려줍니다. 그것을 벡터에 넣으세요.",
  "get()은 future마다 정확히 한 번 부를 수 있고 값이 생길 때까지 막습니다. 벡터를 순서대로 걸으면 출력이 순서대로 나옵니다.",
  "promise는 스레드 안으로 이동되거나 참조되고, 거기서 set_value(n)이 호출되며, main의 ready.get()이 그것을 기다립니다. main이 돌아가기 전에 스레드를 join하세요.",
]

