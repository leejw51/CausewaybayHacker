[[quest]]
id    = "cpp.advanced.10.unique-ptr"
title = "컴파일러가 말할 수 있는 크기"
story = "태풍 대피항의 계류 사슬: 고리마다 다음 고리를 붙잡고, 닻까지 쭉 내려가며, 어떤 고리도 두 번 붙잡는 이는 없다."
brief = '''
표준 입력은 개수 `n`, 그다음 센트 단위 금액 `n`개입니다.

그것들을 사슬에, 금액마다 노드 하나씩, 도착한 순서대로 담으세요:

```
struct Entry {
    long long cents;
    std::unique_ptr<Entry> next;
};
```

세 줄을 출력하세요:

1. 금액들을 순서대로, 공백으로 나눠서, 없으면 `-`
2. 사슬에 대한 **재귀** 함수로 구한 `SUM <total>`
3. `LAST <cents>` — 마지막 노드의 금액 — 또는 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

스타터는 컴파일되지 않고, 그 오류가 포인터가 존재하는 이유입니다. `Entry next;`
라고 쓰면 컴파일러는 `Entry`를 메모리에 배치해야 합니다: `cents`에 8바이트,
더하기 `Entry`의 크기가 얼마이든 — 그것이 바로 알아내려는 것입니다. *Field has
incomplete type.*

`std::unique_ptr<Entry>`는 포인터이고, 포인터에는 컴파일러가 이미 아는 크기가
있습니다. 그것은 가리키는 것을 **소유합니다**: 소유자는 정확히 하나, 소멸자에서
`delete`되고, 복사할 수 없고, 이동할 수 있습니다. 날 `Entry*`는 다른 종류의
포인터입니다 — 보기만 하고 아무것도 소유하지 않습니다 — 그리고 출력하려고 사슬을
걷는 것이 정확히 날 포인터가 있는 이유입니다. `nullptr`는 사슬의 끝이자 빈
사슬이므로, 어디에도 따로 빈 경우가 없습니다.
'''
hints = [
  "한 줄이 컴파일 오류를 고칩니다: std::unique_ptr<Entry> next; — 이제 구조체는 무엇을 가리키든 16바이트입니다.",
  "뒤에서부터 만드세요: head = std::make_unique<Entry>(Entry{value, std::move(head)}). std::move는 필수입니다. unique_ptr는 복사할 수 없고, 넘겨줄 수만 있습니다.",
  "head.get()에서 얻은 const Entry*로 걷고, walk->next.get()으로 나아가세요. 날 포인터는 빌리고, unique_ptr는 여전히 소유하며, 아무것도 두 번 해제되지 않습니다.",
  "재귀 합은 두 줄입니다: nullptr는 0, 아니면 cents 더하기 나머지의 합.",
]

