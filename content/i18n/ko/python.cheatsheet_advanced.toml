```
def retry(times):
    def deco(fn):
        def inner(*a, **kw):
            ...
        return inner
    return deco
```

`fetch`는 데코레이터 없이 이미 정의되어 있습니다. `fetch`를 손으로 다시
묶어 세 번 재시도되게 하세요 — `@retry(3)`이 할 것과 같은 일.
'''
hints = [
  "층이 셋입니다. 바깥 호출은 숫자를 받아 진짜 데코레이터를 돌려주고, 함수는 거기로 들어갑니다.",
]

