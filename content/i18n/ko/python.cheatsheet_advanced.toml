[[quest]]
id    = "python.cheatsheet_advanced.05.three-layers"
title = "세 번째에 행운"
story = "록하트 로드의 배달원은 포기하기 전에 세 번 벨을 누르고, 배차원은 그 규칙을 @ 설탕 없이 배선한다."
brief = '''
`retry`는 인자를 받는 데코레이터입니다: `def` 위의 `@retry(3)`은 그 함수가
