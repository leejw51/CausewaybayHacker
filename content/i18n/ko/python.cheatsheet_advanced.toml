# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.cheatsheet_advanced.01.yield-from"
title = "상자 속의 상자"
story = "자딘스 바자 위층 워크업으로 배달: 상자 안에 상자, 그리고 비단뱀은 바닥에 물건을 하나씩 전부 꺼내 놓고 싶다."
brief = '''
`flatten`은 임의로 중첩된 리스트의 모든 잎을 순서대로 내는 제너레이터여야
합니다: `list(flatten([1, [2, [3, 4]], 5]))`는 `[1, 2, 3, 4, 5]`입니다.
빈칸에 들어갈 줄은 어느 것일까요?

```
def flatten(xs):
    for x in xs:
        if isinstance(x, list):
            # ____
        else:
            yield x
```
'''
hints = [
  "재귀 호출은 제너레이터를 돌려줍니다. 원하는 것은 그 항목들을 하나씩 위로 건네는 것 — 그것을 위한 두 단어짜리 형태가 있습니다.",
]

