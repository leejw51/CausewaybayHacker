# GO LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/go/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "go.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet_advanced.01.buffered"
title = "한 자리"
story = "12:30 럭키맥의 패스 창구: 요리사가 쟁반을 내밀고 있는데 아무도 받지 않아, 그 뒤의 주방 전체가 멈춘다."
brief = '''
이 세 줄은 `main`에서 실행되고, 살아 있는 다른 고루틴은 없습니다. 송신이
통과해서 수신이 `1`을 출력하게 하는 선언은 어느 것일까요?

```
// ____
ch <- 1
fmt.Println(<-ch)
```
'''
hints = [
  "버퍼 없는 송신은 수신자를 기다리는데, 여기서 수신자는 한 줄 아래의 같은 고루틴입니다. 채널에 값을 둘 자리를 주세요.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet_advanced.02.wg-launch"
title = "가기 전에 세어라"
story = "라이더 마흔 명이 럭키맥을 동시에 떠나고, 배차원은 누가 나갔는지 명단이 적히기도 전에 가게를 닫는다."
brief = '''
`go.mod`에 `go 1.22`라고 되어 있으므로 반복마다 자기 `i`가 있습니다. 모든
`i`에 대해 `work(i)`를 고루틴에서 시작하고, 마지막 `Wait`가 `n`개 전부를
정말로 기다리게 하세요 — 어느 것도 카운터와 경쟁해서는 안 됩니다.

```
var wg sync.WaitGroup
for i := range n {
    // ____
}
wg.Wait()
```
'''
hints = [
  "카운터는 `Wait`를 부를 고루틴에서, `go` 앞에서 올라갑니다. 새 고루틴 안에서 defer로 내려가고, `defer`에는 호출이 필요합니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.cheatsheet_advanced.03.close-range"
title = "마지막 접시, 셔터 내리기"
story = "패스가 점심 러시의 마지막 접시를 내보내는데 러너는 계속 거기 서 있다. 아무도 주방이 끝났다고 말해 주지 않았으니까."
brief = '''
`main`의 소비자는 `for v := range ch { ... }`를 돌고 나서 `done`을
출력합니다. 생산자의 끝에서 그 루프가 끝나게 하는 줄은 어느 것일까요?
모든 값은 전달되고, 기다리다 남는 고루틴은 없어야 합니다.

```
func produce(ch chan<- int) {
    for i := range 3 {
        ch <- i
    }
    // ____
}
```
'''
hints = [
  "채널에 대한 range는 채널이 닫히고 비워져야만 끝납니다. 센티널 값은 값 하나가 더해진 것일 뿐이고, 루프는 계속 기다립니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.cheatsheet_advanced.04.worker-sig"
title = "들어오는 길 하나, 나가는 길 하나"
story = "럭키맥 라인의 요리사 넷이 레일 하나에서 주문을 받아 다른 레일에 접시를 올린다. 신입은 자꾸 주문을 레일에 도로 올린다."
brief = '''
워커 풀: `main`이 `jobs`와 `results`를 평범한 `chan int`로 만들고, 워커
넷을 시작하고, 일 아홉 개를 보내고, `jobs`를 닫은 다음, `<-results`로
결과 아홉 개를 모읍니다. 이 본문으로 컴파일되면서 — 워커 안에서 `jobs`로의
송신이나 `results`에서의 수신을 컴파일러가 거부하게 하는 시그니처는 어느
것일까요?

```
// ____
    for j := range jobs {
        results <- j * j
    }
}
```
'''
hints = [
  "화살표는 데이터가 흐르는 쪽에 붙습니다: `chan` 앞이면 꺼내기만, `chan` 뒤면 넣기만. 양방향 채널은 어느 쪽으로든 변환됩니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.cheatsheet_advanced.05.try-send"
title = "버리고 기다리지 마라"
story = "틴하우의 도착 안내판은 들은 열차를 모두 기록한다. 로그가 꽉 차도 안내판 자체가 멈춰서는 안 된다."
brief = '''
`ch`는 용량 2의 `chan string`이고 여러 고루틴이 거기로 보냅니다. `log(v)`
안에서, 자리가 있으면 `v`를 채널에 건네고 없으면 버리세요 — 호출자는 절대
막혀서는 안 되고, 송신에서 기다리다 남는 고루틴도 없어야 합니다.
'''
hints = [
  "대비책 분기가 있는 `select`는 절대 막히지 않습니다. 그 대비책은 다른 송신이 아니라 아무것도 하지 않아야 합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.cheatsheet_advanced.06.timeout-case"
title = "2초, 그다음 포기"
story = "코즈웨이베이의 플랫폼 스크린은 다음 열차 신호를 기다린다. 2초를 기다리거나 영원히 기다리거나 — 펌웨어도 어느 쪽인지 확신이 없었다."
brief = '''
`ch`는 `<-chan int`이고 `ctx`는 `context.Context`입니다. 2초 동안 아무것도
오지 않으면 함수가 포기하도록 셋째 case를 채우세요.

```
select {
case v := <-ch:
    use(v)
    return nil
case <-ctx.Done():
    return ctx.Err()
// ____
    return errTimeout
}
```
'''
hints = [
  "select의 case는 송신이거나 수신이어야 합니다. `time`에는 `Duration` 뒤에 발화하는 채널을 돌려주는 함수가 있고, 맨 `2`는 2나노초입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.cheatsheet_advanced.07.defer-cancel"
title = "나가는 길에 놓아주기"
story = "애드미럴티의 요금 조회는 하나하나가 3초 타이머를 열고 아무도 멈추지 않는다. 저녁 러시가 되면 게이트는 타이머 만 개를 들고 있다."
brief = '''
`fetch(ctx)`는 3초 제한이 아직 살아 있는 채로 실행되어야 하고, 타이머의
자원은 `get`이 어떻게 반환하든 — 조기 반환, 에러, 성공 — 해제되어야
합니다. (`WithCancel`도 같은 쌍을 돌려줍니다.)

```
func get() error {
    ctx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
    // ____
    return fetch(ctx)
}
```
'''
hints = [
  "cancel 함수를 지금 부르면 `fetch`가 보기도 전에 `ctx`가 취소됩니다. `get`이 반환될 때로 호출을 예약하세요 — 그리고 `defer`는 괄호까지 포함한 호출을 원합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.cheatsheet_advanced.08.mutex-inc"
title = "읽기 잠금이 아니라 쓰기 잠금"
story = "코즈웨이베이 환승역의 게이트 쉰 개가 승객을 숫자 하나로 세는데, 그 숫자가 아무도 재현할 수 없는 만큼 모자란다."
brief = '''
고루틴 쉰 개가 `Inc`를 각각 천 번 호출합니다. 그 뒤 `Get`은 `50000`을
돌려줘야 합니다.

```
type Ctr struct {
    mu sync.RWMutex
    n  int
}
func (c *Ctr) Get() int { c.mu.RLock(); defer c.mu.RUnlock(); return c.n }
// ____
```
'''
hints = [
  "쓰기에는 공유 잠금이 아니라 배타 잠금이 필요합니다. 값 리시버는 잠금까지 포함해 struct를 복사하므로 진짜 `n`은 꿈쩍도 하지 않습니다.",
]

