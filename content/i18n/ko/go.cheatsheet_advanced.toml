```
func safe(f func()) (err error) {
    // ____
    f()
    return nil
}
```
'''
hints = [
  "defer된 함수 안에서만 동작합니다 — 내장 함수 자체를 defer하면 아무 일도 없습니다 — 그리고 밖으로 내보내는 유일한 길은 이름 붙은 결과에 대입하는 것입니다.",
]

