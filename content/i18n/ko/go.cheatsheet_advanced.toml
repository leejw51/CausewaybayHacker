]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.cheatsheet_advanced.30.errc"
title = "첫 번째 나쁜 소식"
story = "아일랜드선의 역 여덟 곳에 동시에 핑을 보낸다. 하나가 다운을 보고하는 순간 관제실은 다음으로 넘어가고, 핑을 보낸 일곱은 아무도 열어 주지 않을 창 앞에 계속 서 있다."
brief = '''
여기에 `errgroup`은 없습니다 — std만. `n`개의 고루틴 각각이 `errc`로
`error` 하나(대개 `nil`)를 정확히 한 번 보냅니다. `checkAll`은 나머지를
기다리지 않고 첫 non-nil 에러를 돌려주고, 그 뒤에 송신에서 막힌 채 남는
고루틴은 없어야 합니다. `errc`를 선언하세요.

```
func checkAll(n int) error {
    // ____
    for i := range n {
        go func() { errc <- check(i) }()
    }
    for range n {
        if err := <-errc; err != nil {
            return err
        }
    }
    return nil
}
```
'''
hints = [
  "`checkAll`이 반환되고 나면 아무도 더 받지 않습니다. 모든 송신자가 수신자 없이 자기 한 번의 송신을 끝낼 수 있어야 합니다 — 버퍼를 전부에 맞게 잡으세요.",
]
