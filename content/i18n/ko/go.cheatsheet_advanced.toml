'''
hints = [
  "없는 키는 nil 슬라이스로 읽히고, nil 슬라이스에 append하는 것은 괜찮습니다. 결과는 같은 값 키 아래에 다시 저장해야 합니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.cheatsheet_advanced.27.builder-ptr"
title = "빌더를 복사하지 마라"
story = "아일랜드선 안내 방송은 조각조각 조립되는데, 마지막 조각을 더하는 헬퍼가 불법 복사라는 메시지와 함께 죽는다."
brief = '''
`sb`는 이미 `"Island"`를 담은 `strings.Builder`입니다. `add(…, " Line")` —
