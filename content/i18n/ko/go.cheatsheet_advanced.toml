'''
hints = [
  "타입에 직접 쓴 메서드는 마지막 원소를 떼어 낼 뿐입니다. 루트를 꺼내고 다시 힙으로 만드는 것은 패키지 함수입니다. 그것은 `any`를 돌려줍니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "go.cheatsheet_advanced.29.iota"
title = "0, 1, 2"
story = "애드미럴티 안내판의 MTR 세 노선이 전부 0번이고, 색 조회는 하나같이 아일랜드선 파랑으로 칠한다."
