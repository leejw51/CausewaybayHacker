[[quest]]
id    = "go.cheatsheet_advanced.09.once"
title = "워밍업은 한 번만"
story = "라이더 스무 명이 같은 초에 럭키맥 앱을 열고, 백엔드는 데이터베이스 연결 스무 개를 연다. 하나씩, 전부 첫 번째라면서."
brief = '''
`initDB()`는 패키지 수준의 `db`를 설정하는 `func()`입니다. `conn()`은
고루틴 스무 개에서 동시에 호출됩니다. `initDB`는 정확히 한 번 실행되어야
하고, 모든 호출자는 완성된 `db`를 봐야 합니다.

```
var once sync.Once
func conn() *DB {
    // ____
    return db
}
```
'''
hints = [
  "`Once`는 함수를 호출한 결과가 아니라 함수 자체를 받습니다 — 그리고 클로저 안의 맨 이름은 쓰이지 않은 값이라 컴파일되지 않습니다.",
]

