]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "go.cheatsheet_advanced.22.omitempty"
title = "빈칸은 빼기"
story = "럭키맥 앱이 내보내는 라이더 프로필에는 걸어 다니는 사람마다 빈 `bike` 필드가 있고, 대시보드는 빈 자전거 마흔 대를 그린다."
brief = '''
`json.Marshal(Rider{Name: "Alex"})`는 `{"name":"Alex"}`를,
`json.Marshal(Rider{Name: "Alex", Bike: "e-7"})`는
