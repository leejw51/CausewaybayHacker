'''
hints = [
  "0이 아닌 `Builder`를 값으로 넘기면 복사되고, 사본에 대한 첫 쓰기가 패닉합니다. 빌더에는 `+=`가 없습니다. 값 둘을 돌려주는 메서드가 있고, 무시하는 것은 괜찮지만 역참조는 안 됩니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "go.cheatsheet_advanced.28.heap-pop"
title = "힙의 꼭대기"
story = "럭키맥 배차원의 우선순위 목록은 가장 급한 주문을 내주는데, 세 번째로 내준 주문이 마감이 가장 늦은 것이다."
