# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.cheatsheet_advanced.11.fan-in"
title = "여러 노선, 플랫폼 하나"
story = "췬완과 콴통에서 온 열차가 애드미럴티의 플랫폼 하나로 들어온다. 병합은 밤의 마지막 열차까지는 잘 되는데, 그때 플랫폼이 영영 비워지지 않는다."
brief = '''
팬인. `go.mod`에 `go 1.22`라고 되어 있으므로 반복마다 자기 `c`가 있습니다.
입력마다 그것을 `out`으로 복사한 뒤 자기가 끝났다고 세는 전달자를
시작해서, 아래의 closer가 `out`을 닫을 수 있게 하세요.

```
func merge(ins ...<-chan int) <-chan int {
    out := make(chan int)
    var wg sync.WaitGroup
    wg.Add(len(ins))
    for _, c := range ins {
        // ____
    }
    go func() { wg.Wait(); close(out) }()
    return out
}
```
'''
hints = [
  "자기 고루틴에서 돌아야 하고(`go` 키워드와 끝의 호출), 끝나면 그룹에 알려야 합니다 — 아니면 `Wait`는 절대 돌아오지 않고 `out`은 절대 닫히지 않습니다.",
]

