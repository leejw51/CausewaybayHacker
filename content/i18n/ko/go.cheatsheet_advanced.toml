]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "go.cheatsheet_advanced.26.struct-key"
title = "같은 칸, 같은 버킷"
story = "라이더들은 기다리는 격자 칸으로 묶이는데, 이워 스트리트 같은 모퉁이의 두 번째 라이더가 첫 번째를 지운다."
brief = '''
`type pt struct{ r, c int }`이고 `m`은 `map[pt][]int`입니다 (비교 가능한
