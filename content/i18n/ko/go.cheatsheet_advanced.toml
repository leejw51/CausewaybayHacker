[[quest]]
id    = "go.cheatsheet_advanced.12.defer-args"
title = "그건 언제 읽혔나?"
story = "틴하우 매표소는 나가는 길에 시재 합계를 찍는데, 교대가 시작된 순간의 합계를 찍는다."
