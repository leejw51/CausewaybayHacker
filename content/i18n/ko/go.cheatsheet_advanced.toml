같은 항목들이 원래의 상대 순서를 지키는 것이 보장되도록 `ps`를 `S`로
정렬하세요.
'''
hints = [
  "`less`는 인덱스를 받으므로 `slices`가 아니라 `sort` 패키지의 슬라이스 함수에 맞습니다 — 그리고 두 슬라이스 정렬 중 하나만 동점을 제자리에 두겠다고 약속합니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.cheatsheet_advanced.25.duration"
title = "나노초가 아니라 밀리초"
story = "코즈웨이베이의 정차 시간이 텍스트 `250`으로 도착하고, 문은 열린 지 250나노초 뒤에 닫힌다."
