[[quest]]
id    = "go.cheatsheet_advanced.16.promoted"
title = "빌린 목소리"
story = "코즈웨이베이역의 상태 서버는 안에 로거를 품고 있고, 서버의 로깅을 건네받은 러너는 접두사 없이 찍는다."
