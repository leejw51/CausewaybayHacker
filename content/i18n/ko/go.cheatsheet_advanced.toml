[[quest]]
id    = "go.cheatsheet_advanced.19.generic-stack"
title = "남는 PUSH"
story = "아일랜드선 안내 방송 뒤의 역 이름 스택은 모든 push를 받아들이는데, 누가 볼 때마다 비어 있다."
brief = '''
`type Stack[T any] struct{ items []T }`. `var s Stack[string]` 뒤에
`s.Push("Tin Hau")`와 `s.Push("Causeway Bay")`를 하면 `len(s.items)`는
`2`여야 합니다.
'''
hints = [
  "제네릭 타입의 리시버는 타입 매개변수를 되풀이하고, 변경하는 메서드는 포인터 형태가 아니면 사본을 고칩니다. `append`는 새 슬라이스를 돌려주니 무언가가 그것을 간직해야 합니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "go.cheatsheet_advanced.20.sort-desc-safe"
title = "큰 것부터, 오버플로 없이"
story = "코즈웨이베이 요금 잔액 순위표에는 `int`의 맨 꼭대기 계좌 하나와 맨 바닥 계좌 하나가 있고, 정렬이 그 둘을 거꾸로 놓는다."
brief = '''
`xs`는 `math.MaxInt`와 `math.MinInt`를 둘 다 담은 `[]int`입니다. 제자리에서
큰 것부터 정렬하세요 — 그 둘에 대해서도 올바르게.
'''
hints = [
  "멀리 떨어진 int 둘을 빼면 오버플로가 나 부호가 뒤집힙니다. `cmp`에 삼방 비교가 있습니다. 그리고 `sort.Slice`의 함수는 원소가 아니라 인덱스를 받습니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "go.cheatsheet_advanced.21.bisect"
title = "반으로 가르기"
story = "아일랜드선 관제실의 정렬된 열차 id 목록에는 항목이 천만 개이고, 조회는 매번 그 전부를 걷는다."
brief = '''
`xs`는 오름차순으로 정렬된 `[]int`입니다. 한 줄로, O(log n)에, `i`를
