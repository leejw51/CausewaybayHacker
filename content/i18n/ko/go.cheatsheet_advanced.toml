[[quest]]
id    = "go.cheatsheet_advanced.14.errors-as"
title = "어떤 종류의 잘못인가"
story = "럭키맥 조회에서 라이더 id가 세 겹의 문맥에 싸여 돌아오고, 데스크는 문장이 아니라 빠진 키를 원한다."
