[[quest]]
id    = "go.cheatsheet_advanced.13.recover"
title = "떨어지는 길에 잡기"
story = "럭키맥 라인의 나쁜 주문 하나가 나무 주걱을 던지고, 그 접시 하나가 실패로 표시되어 돌아오는 대신 주방 전체가 어두워진다."
brief = '''
`f`는 패닉할 수 있습니다. `safe`는 패닉을 삼키고 대신 `errPanic`을 돌려줘야
