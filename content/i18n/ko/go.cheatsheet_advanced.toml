할까요?

```
type Rider struct {
    Name string `json:"name"`
    // ____
}
```
'''
hints = [
  "옵션은 이름과 같은 따옴표 안에, 쉼표로 구분되어 들어갑니다 — 그리고 export되지 않은 필드는 아예 마샬되지 않습니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "go.cheatsheet_advanced.23.scanner-buffer"
title = "줄보다 긴 줄"
story = "아일랜드선 게이트 로그의 야간 내보내기는 10만 글자짜리 한 줄이고, 리더는 아무것도 돌려주지 않고 아무도 찍지 않은 에러도 없다."
brief = '''
`sc := bufio.NewScanner(os.Stdin)`. 다음 입력 줄은 10만 바이트 길이입니다.
첫 `sc.Scan()` 앞에 놓으면 그 스캔이 성공하게 하는 줄은 어느 것일까요?
'''
hints = [
  "기본 토큰 한도는 64 KiB입니다. 스캐너에는 초기 바이트 슬라이스와 최대 크기를 받는 메서드가 있습니다 — 인자 하나가 아니라 둘 — 그리고 split 함수는 이것과 무관합니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "go.cheatsheet_advanced.24.stable"
title = "동점은 제자리에"
story = "애드미럴티의 게이트 직원 이백 명이 근무표용으로 연차별로 묶이는데, 연차가 같은 사람들이 출력할 때마다 자리를 바꾼다."
brief = '''
`ps`는 이백 항목의 `[]P`이고
