title = "보스: 위치 패턴"
story = "마지막 노드, 타임스 스퀘어. 비단뱀의 평범한 클래스는 어느 속성이 세어지고 어떤 순서인지 말하기 전까지 위치로 매치되지 않는다."
brief = '''
