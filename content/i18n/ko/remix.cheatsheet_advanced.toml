# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.cheatsheet_advanced.06.counter-python"
title = "한 번에 하나, GIL이 말했다"
story = "7-32호실은 야간 근무 티켓을 스레드 넷으로 센다. GIL은 `+=`에 대해 아무것도 약속하지 않는다."
brief = '''
**Python**에서 `lock = threading.Lock()`은 모든 스레드가 공유하는 하나의
잠금이고 `n = 0`은 전역입니다:

```
def work():
    global n
    for _ in range(100_000):
        # ____
            n += 1
```

스레드 넷이 `work`를 돌립니다. 매 실행마다 `n`이 정확히 400000이 되게 하는
— 모든 스레드가 **같은** 잠금을 번갈아 잡으면서 — 줄은 어느 것일까요?
'''
hints = [
  "잠금 객체는 그 자체가 컨텍스트 매니저입니다. acquire()가 돌려주는 것은 아닙니다.",
]

