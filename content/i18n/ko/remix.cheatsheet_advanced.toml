[[quest]]
id    = "remix.cheatsheet_advanced.07.wait-go"
title = "넷 다 복귀"
story = "슈거 스트리트 창고에서 배달원 넷이 떠난다. 문은 넷 모두가 복귀 서명을 해야만 잠긴다."
brief = '''
**Go**(1.22, 그래서 `i`는 반복마다 새것)에서:

```
var wg sync.WaitGroup
for i := 0; i < 4; i++ {
    wg.Add(1)
    // ____
}
wg.Wait()
```

`wg.Wait()`가 `work` 호출 넷이 모두 **끝났을** 때 정확히 돌아오도록 —
교착도, 조기 반환도 없이 — `work(i)`를 자기 고루틴에서 시작하는 줄은 어느
것일까요?
'''
hints = [
  "work가 반환된 뒤 무언가가 Done을 불러야 하고, 그 일을 한 고루틴에서 불러야 하며, go 문에는 호출이 필요합니다.",
]

