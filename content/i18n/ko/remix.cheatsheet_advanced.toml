id    = "remix.cheatsheet_advanced.01.handoff-go"
title = "넘겨주기"
story = "06:50, 자딘스 바자. 메이가 키오스크에 숫자 하나를 요청하고, 키오스크는 만들기도 전에 메이가 받아 가기를 기다린다."
