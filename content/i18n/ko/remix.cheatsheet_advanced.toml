        self.x = x
        self.y = y
```

구멍이 없으면 `case Pt(a, b):`는
`TypeError: Pt() accepts 0 positional sub-patterns`를 일으킵니다. 클래스
본문의 어느 줄이 `case Pt(a, b):`가 `a`를 `x`에, `b`를 `y`에 묶게 할까요?
'''
hints = [
  "정확히 이것을 위한 던더가 있고, 인터프리터는 그것이 속성 이름의 튜플이어야 한다고 고집합니다 — dataclass는 그것을 대신 써 줍니다.",
]
