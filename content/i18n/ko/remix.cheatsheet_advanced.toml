**Go**에서 `main`에는 `ch := make(chan int)` — **버퍼 없음** — 가 있고
나중에 `x := <-ch`를 합니다. `compute()`는 `int`를 돌려줍니다. 그 둘 사이에
놓여 `main`이 교착하지 않고 `compute()`의 결과를 `x`에 전달하는 줄은 어느
것일까요?
'''
