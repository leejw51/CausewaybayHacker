hints = [
  "타입 없는 매개변수는 암묵적 `any`이고, strict는 그것을 거부합니다. `return`이 없는 본문은 `undefined`를 냅니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.cheatsheet.24.join"
title = "풀"
story = "소고의 안내 방송이 당첨 노점을 소리 내어 읽는다: 이름 사이에 공백 하나, 쉼표는 없이."
brief = '''
`xs: string[]`는 `["a", "b", "c"]`입니다. `a b c`를 출력하세요 — 원소 사이를 **공백
