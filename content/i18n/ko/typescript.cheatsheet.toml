id    = "typescript.cheatsheet.29.queue-front"
title = "줄의 맨 앞"
story = "빅토리아 파크에서 뻗어 나가는 BFS: 먼저 들어간 정류장이 먼저 나오고, 큐를 떠난다."
brief = '''
`q: number[]`는 `[1, 2, 3]`이고 FIFO 큐로 씁니다. 맨 앞 항목을 **제거**해 `x`에
넣으세요 — 그래서 `x`는 `1`이고 `q`는 `[2, 3]`으로 남습니다.
'''
hints = [
  "`pop`은 끝에서 꺼내고, 인덱싱은 제거 없이 읽기만 합니다. 앞에서 꺼내는 메서드는 나머지 전부를 한 칸씩 앞으로 당깁니다.",
]

