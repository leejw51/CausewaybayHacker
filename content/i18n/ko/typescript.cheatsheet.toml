hints = [
  "메서드는 구분자가 아니라 배열에 있습니다 — 그리고 인자 없이 호출하면 구분자는 쉼표입니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.cheatsheet.25.empty-check"
title = "줄에 아무도"
story = "03:00의 자딘스 바자 버스 정류장. 누가 기다리고 있나? 빈 줄도 여전히 줄이다."
brief = '''
`a: number[]`. `a`에 원소가 하나도 없을 때**만** 들어가는 `if`를 여세요. `strict`가
