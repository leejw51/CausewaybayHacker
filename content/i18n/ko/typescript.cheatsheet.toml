# TYPESCRIPT LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/typescript/cheatsheet.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live
# in the English pack, and are never translated. Code blocks, identifiers
# and printed strings are copied verbatim.

pack   = "typescript.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet.01.read-all"
title = "피드 전체"
story = "19:00, 타임스 스퀘어 위. 대형 스크린의 피드가 한꺼번에 도착하고, 전부를 원한다."
brief = '''
Node에서 표준 입력 **전체**를 하나의 `string`으로 `input`에 읽으세요.
'''
hints = [
  "파일 디스크립터 0이 stdin입니다. 인코딩을 주지 않으면 문자열이 아니라 Buffer가 옵니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet.02.lines"
title = "유령 줄은 없다"
story = "이와 스트리트의 전광판은 모든 메시지를 줄바꿈으로 끝내고, 마지막 줄은 늘 비어 있다."
brief = '''
`input`은 줄바꿈으로 끝납니다. 끝에 빈 문자열이 **없도록** `lines`로 나누세요.
'''
hints = [
  "`\"a\\nb\\n\"`를 줄바꿈으로 나누면 세 조각이 나오고, 마지막은 비어 있습니다. 먼저 trim하세요.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.cheatsheet.03.numbers"
title = "글자를 숫자로"
story = "록하트 로드의 복권 가판대는 당첨 번호를 글자 띠에서 읽는다."
brief = '''
`lines[1]`은 `"3 1 2"`입니다. `nums`를 `number[]` `[3, 1, 2]`로 만드는 줄은?
'''
hints = [
  "`map`은 두 번째 인자로 인덱스를 넘기고, `parseInt`는 그걸 진법으로 받습니다. `Number`는 인자를 하나만 받습니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.cheatsheet.04.to-fixed"
title = "소수 둘째 자리"
story = "헤네시 로드의 환전소는 모든 환율을 정확히 소수 둘째 자리까지 보여 준다."
brief = '''
`const x = 3.14159;` `3.14`를 출력하세요 — **소수점 아래** 정확히 두 자리.
'''
hints = [
  "`toPrecision`은 유효 숫자를 셉니다. 소수 자릿수를 세는 건 다른 메서드입니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet.05.floor-div"
title = "반쪽 표는 없다"
story = "트램 토큰 일곱 개를 두 사람이 나눈다. 반쪽 토큰을 받는 사람은 없다."
brief = '''
`a = 7`, `b = 2`, 둘 다 음이 아닌 정수입니다. `q`는 `3`이어야 합니다 — 정수 나눗셈.
'''
hints = [
  "모든 number는 실수입니다: `/`는 3.5를 줍니다. 내림하세요.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.cheatsheet.06.for-of"
title = "키가 아니라 값"
story = "그레이트 조지 스트리트의 간판을 하나씩 읽는다 — 번지수가 아니라 이름을."
brief = '''
`arr: number[]`의 **값**(인덱스가 아니라)을 도는 반복문을 시작하세요.
'''
hints = [
  "`in`은 키를 돕니다 — 문자열로 된 인덱스를. `of`가 값을 돕니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.cheatsheet.07.sort"
title = "9 다음에 10"
story = "소고 카운터의 대기표: 알파벳이 뭐라 하든 10은 9 다음이다."
brief = '''
`arr: number[]`에 `[10, 9, 1]`이 있습니다. **값 기준 오름차순**으로 제자리 정렬하세요.
'''
hints = [
  "비교자가 없으면 `sort`는 문자열로 비교하므로 \"10\" < \"9\"입니다. 비교자는 숫자를 돌려줍니다: 음수면 `a`가 앞에 남습니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.cheatsheet.08.count"
title = "집계"
story = "다이파이동은 요리별로 주문을 세고, 새 요리는 0에서 시작한다."
brief = '''
`m: Map<string, number>`. 키 `w`의 개수에 1을 더하되, 아직 없으면 0에서 시작하세요. `strict`가 켜져 있습니다.
'''
hints = [
  "`get`은 `number | undefined`를 돌려줍니다. 없는 경우의 기본값을 `??`로 주세요.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.cheatsheet.09.grid"
title = "층별 평면도"
story = "윈저 하우스, 층마다 가게마다: 모든 칸이 비어 있는 n×m 평면도 — 그리고 층마다 제 것."
brief = '''
`n`×`m`의 0으로 된 격자 `g`를 만드세요. `g[0][0] = 1`을 쓰면 **그 한 칸만** 바뀌어야 합니다.
'''
hints = [
  "`fill`에 배열을 주면 모든 칸에 같은 배열이 들어갑니다. 인덱스마다 새 행을 만드세요.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.cheatsheet.10.heap-parent"
title = "위에 있는 건 누구"
story = "표준 라이브러리에 힙이 없어서, 미니버스 줄은 자기 힙을 직접 관리한다 — 평범한 배열로."
brief = '''
이진 힙이 0부터 시작하는 배열 `h`에 있습니다: 인덱스 `p`의 자식은 `2*p + 1`과 `2*p + 2`입니다. `i > 0`일 때 `i`의 부모를 구하는 줄은?
'''
hints = [
  "자식 공식을 거꾸로: 1을 빼고 반으로, 내림. `i = 2`로 시험해 보세요.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet.11.char-code"
title = "A는 0"
story = "코즈웨이베이 플라자 로비의 우편함은 a부터 z까지 글자로, 0부터 번호가 매겨져 있다."
brief = '''
`s`는 전부 소문자입니다. 인덱스 `i`의 글자를 0..25 범위의 `k`로 바꾸세요. `'a'`가 0입니다.
'''
hints = [
  "문자열은 빼기가 안 됩니다. 먼저 글자의 코드를 숫자로 얻으세요. 'a'는 97입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet.12.unknown-catch"
title = "알 수 없는 throw"
story = "자정 전에 도착하는 피드가 뭔가를 던진다. 그게 Error라고 약속한 사람은 없다."
brief = '''
`strict`에서 `catch (e) { … }`의 `e`는 `unknown` 타입입니다. 컴파일되고 절대 터지지 않는 방식으로 그 `message`를 출력하세요.
'''
hints = [
  "`unknown`에서는 속성을 읽을 수 없습니다. 먼저 런타임 검사로 좁히세요.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet.13.map-entries"
title = "키와 개수"
story = "다이파이동의 집계가 끝났다. 이제 주인이 요리 하나하나를 그 옆의 개수와 함께 읽어 내려간다."
brief = '''
`m: Map<string, number>`. `m`의 **모든** 쌍을 키는 `k`로, 값은 `v`로 받으며
방문하는 반복문을 시작하세요.
'''
hints = [
  "Map은 쌍으로 순회됩니다 — 각각을 구조 분해하세요. `Object.entries`는 자기 속성만 보는데, Map에는 그런 것이 없습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.cheatsheet.14.head-tail"
title = "머리와 꼬리"
story = "자딘스 바자 줄의 첫 버스는 지금 떠난다. 뒤의 모두는 함께 기다린다."
brief = '''
`a: number[]`는 `[5, 6, 7]`입니다. 선언 하나로 `first`를 숫자 `5`로, `rest`를
`number[]` `[6, 7]`로 만드세요.
'''
hints = [
  "대괄호로 구조 분해하세요. 꼬리는 점 두 개도 별표도 아닌 점 세 개로 모읍니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.cheatsheet.15.zero-is-a-value"
title = "0도 값이다"
story = "하이산 플레이스의 0층은 진짜 층이다. 엘리베이터 패널이 당신을 기본값으로 보내서는 안 된다."
brief = '''
`x: number | undefined`. `x`가 정의되어 있으면 — **`x`가 `0`일 때도** — `d`를
`x`와 같게, `x`가 `undefined`일 때만 `10`으로 만드세요.
'''
hints = [
  "`0`은 falsy라서 \"truthy인가?\"를 묻는 것은 무엇이든 0을 버립니다. 대신 \"null이나 undefined인가?\"를 물으세요.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.cheatsheet.16.await-all"
title = "한꺼번에"
story = "배달 기사 여섯이 슈가 스트리트를 함께 떠났다. 주방은 하나씩 차례로가 아니라 여섯 모두를 기다린다."
brief = '''
`async` 함수 안, `ps: Promise<number>[]`. `rs`를 모든 결과의 `number[]`로
만들되, 전부를 함께 기다리세요.
'''
hints = [
  "배열을 await하면 같은 프로미스 배열이 돌아옵니다. 먼저 하나의 프로미스로 합치고, 그것을 await하세요.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.cheatsheet.17.param-property"
title = "한 줄 클래스"
story = "눈데이 건은 한 번 만들어지고 구경은 고정되며, 포대 바깥의 누구도 그 설정을 읽지 못한다."
brief = '''
`class P { … }`의 본문에는 생성자 한 줄밖에 없습니다. `x: number`를 받아
**private**이고 (클래스 바깥에서 `p.x`를 읽으면 컴파일 에러) **읽기 전용**인
(나중에 `this.x`에 대입하면 컴파일 에러) 필드 `x`로 저장합니다. `strict`가 켜져
있습니다.
'''
hints = [
  "생성자 매개변수의 한정자가 필드를 선언하고 대입합니다. 접근 한정자가 읽기 전용 한정자보다 앞에 옵니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.cheatsheet.18.typeof-narrow"
title = "문자열인가"
story = "패터슨 스트리트의 간판은 어떤 때는 이름이고 어떤 때는 숫자다. 이름만 대문자로 외친다."
brief = '''
`v: string | number`, `strict`가 켜져 있습니다. 그 안에서 `v.toUpperCase()`가
컴파일되는 `if`를 여세요.
'''
hints = [
  "원시값은 무엇의 인스턴스도 아닙니다. 원시값을 좁히는 런타임 검사는 소문자 문자열과 비교합니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.cheatsheet.19.bigint"
title = "안전선을 넘어"
story = "코즈웨이베이 태풍 대피항은 1883년부터의 모든 파도를 센다. float는 오래전에 셈을 잃었다."
brief = '''
`target`은 ES2022입니다. `big`을 정확히 `9223372036854775807` — 2의 63제곱
빼기 1 — 을 담은 `bigint`로 만드세요.
'''
hints = [
  "`number`는 64비트 float입니다: 2^53 위에서는 반올림되고, 나중에 변환해도 반올림은 남습니다. 모든 피연산자에 `n`이 필요합니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.cheatsheet.20.toward-zero"
title = "0 쪽으로"
story = "자정의 해저터널 요금소: 8달러 환불을 셋이 나누는데, 요금소의 C 프로그래머는 0 쪽으로 반올림한다."
brief = '''
`a = -8`, `b = 3`, 둘 다 정수입니다. `q`는 `-2`여야 합니다 — C, Go, Rust에서
정수에 `/`가 하는 방식대로, **0 쪽으로** 버린 몫.
'''
hints = [
  "내림도 반올림도 여기서는 -3에 떨어집니다. 부호가 어떻든 소수 부분을 잘라 내야 합니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.cheatsheet.21.push"
title = "줄 맨 뒤"
story = "탕룽 스트리트의 미니버스 줄에 승객 하나가 더 선다 — 승객이 서는 자리, 맨 뒤에."
brief = '''
`a: number[]`, `x: number`. `x`를 `a`의 **끝**에 제자리에서 추가해, 그 뒤에 `a`가
원소 하나만큼 길어지게 하세요. `strict`가 켜져 있습니다.
'''
hints = [
  "`concat`은 새 배열을 만들고 `a`는 그대로 둡니다. 제자리 메서드는 배열이 아니라 새 길이를 돌려줍니다 — 그것을 다시 대입하지 마세요.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet.22.inclusive-loop"
title = "1부터 10까지"
story = "리 가든의 승강기는 1층부터 10층까지 모든 층에 서고, 10층은 선택이 아니다."
brief = '''
본문이 `i = 1, 2, … 10`에 대해 — **열** 번, `10`을 포함해 — 실행되는 루프를
여세요. `i`는 다른 어디에도 선언되어 있지 않습니다. `strict`가 켜져 있습니다.
'''
hints = [
  "카운터는 바뀔 수 있는 것으로 선언하고, 마지막 값이 아직 통과하도록 비교하세요.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.cheatsheet.23.add-function"
title = "숫자 둘 들어옴"
story = "헤네시 로드의 환전소는 금액 둘을 더한다. strict 아래서는 그것이 어떤 종류의 금액인지도 알고 싶어 한다."
brief = '''
`add(2, 3)`이 `5`이고 파일이 `strict` 아래서 컴파일되도록 (`noImplicitAny`가
