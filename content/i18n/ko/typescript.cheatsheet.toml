]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet.28.reverse-string"
title = "거꾸로"
story = "퍼시벌 스트리트의 네온 간판을 트램 2층에서 뒤에서부터 읽는다."
brief = '''
`s`는 `"abc"`입니다. `r`을 **문자열** `"cba"`로 만드세요.
