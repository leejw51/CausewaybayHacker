[[quest]]
id    = "typescript.cheatsheet.30.wrap-modulo"
title = "랩"
story = "다시 자정의 해저터널 요금소: 7달러 부족, 차선은 셋, 그래도 차선 인덱스는 0, 1, 2 중 하나여야 한다."
brief = '''
`b = 3`. `a`는 `-7`, `0`, `4`일 수 있는 정수입니다. `r`을 수학적 나머지로 만드세요 —
언제나 `0..b-1` 안에, 그래서 `-7`은 `2`, `0`은 `0`, `4`는 `1`을 줍니다.
'''
hints = [
  "`%`는 왼쪽 피연산자의 부호를 유지하므로 `%` 한 번은 -7에 -1을 줍니다. `b`를 더하면 음수는 고쳐지지만 `0`과 양수는 망가집니다. 그것에 대해 무언가를 하세요.",
]
