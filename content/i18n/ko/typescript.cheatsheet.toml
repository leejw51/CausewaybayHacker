]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet.26.max-of-array"
title = "가장 높은 것"
story = "글로스터 로드를 따라 선 타워들 중 직원은 가장 높은 것을 원한다 — 한 쌍이 아니라 목록에서."
brief = '''
