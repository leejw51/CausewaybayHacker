]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet.27.copy"
title = "자기만의 사본"
story = "타임스 스퀘어의 입장권 목록이 야간 근무조를 위해 복사된다. 한 목록의 변경이 다른 목록에 나타나면 안 된다."
