[[quest]]
id    = "lua.basic.04.strings"
title = "용의 이름"
story = "깃발 화가는 용 머리 맡은 이의 이름을 재고, 외치고, 사당 제단 뒤 거울을 위해 거꾸로 쓰길 원하는데, 장부에는 바른 방향으로 한 번만 적혀 있다."
brief = '''
문자열은 `#s`로 자기 길이를 알고, `s:upper()`로 대문자 사본을, `s:reverse()`로 뒤집은 사본을 만듭니다. 콜론이 메서드 호출입니다: `s:upper()`는 `string.upper(s)`이고, `s`가 첫 인자로 알아서 넘어갑니다. 문자열은 결코 제자리에서 바뀌지 않습니다 — 이것들은 각각 새 문자열이고, `s`는 원래 그대로입니다.

```
print(#s)
print(s:upper())
print(s:reverse())
```

`s`는 읽혀 있고 길이는 출력됩니다. 두 번째와 세 번째 `print` 줄을 보이는 그대로 입력하세요.

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "print(s:upper()) 그다음 print(s:reverse()) — 메서드 호출 둘, 콜론과 빈 괄호.",
  "점을 쓴 s.upper()는 아무것도 넘기지 않고, string.upper는 문자열이 있어야 할 자리의 nil을 두고 불평합니다.",
]

