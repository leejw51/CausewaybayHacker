[[quest]]
id    = "lua.basic.22.reverse"
title = "앞뒤를 뒤집어"
story = "마감 시트에는 가격 사다리를 위에서 아래로 읽어야 하고 노점 이름은 등불 유리에 거울처럼 칠해져 있는데, 장부에는 둘 다 바른 방향으로 적혀 있다."
brief = '''
`table.reverse`는 없습니다. 리스트는 양 끝을 안쪽으로 맞바꿔 **제자리에서** 뒤집고, Lua의 맞바꾸기는 양쪽에 이름이 둘씩 있는 대입 하나입니다: `a, b = b, a`는 오른쪽을 먼저 평가하고 그다음 저장합니다. 맞바꾸기는 길이의 절반, `math.floor(#v / 2)`번이고, `v[#v - i + 1]`이 `v[i]`의 거울입니다. 문자열은 바꿀 수 없으니 새 문자열을 주는 `s:reverse()`로 뒤집습니다.

```
for i = 1, math.floor(#v / 2) do v[i], v[#v - i + 1] = v[#v - i + 1], v[i] end
local r = s:reverse()
```

`v`와 `s`는 읽혀 있고 두 출력은 적혀 있습니다. 두 자리표시자 자리에 위의 두 줄을 그대로 입력하세요.

```
input:  1 2 3
        gau
output: 3 2 1
        uag
```
'''
hints = [
  "for i = 1, math.floor(#v / 2) do v[i], v[#v - i + 1] = v[#v - i + 1], v[i] end를 한 줄에, 그다음 local r = s:reverse().",
  "절반 대신 #v까지 가면 모든 쌍을 두 번 맞바꿔 리스트가 원래대로 돌아옵니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.basic.14.sort-by-key"
title = "순위표"
story = "린파꿍 사당은 오늘 밤 시주 액수로 노점들을 높은 순으로 붙이고, 액수가 같은 둘은 알파벳 순으로 올라가는데, 핀 보드는 들어온 순서대로 보여 준다."
brief = '''
`table.sort`는 비교자를 받습니다: 두 행을 받아 첫 번째가 두 번째보다 앞에 오면 `true`를 돌려주는 함수입니다. 한 필드로 정렬하고 다른 필드로 동점을 가르는 것은 그 안의 두 줄입니다 — 점수가 다르면 큰 것이 먼저, 아니면 이름이 작은 것이 먼저. 어느 쪽으로 비교해도 같은 두 행은 `false`를 줘야 합니다. 그러지 않으면 정렬이 잘못된 순서 함수라고 불평합니다.

```
table.sort(rows, function(a, b)
  if a.score ~= b.score then return a.score > b.score end
  return a.name < b.name
end)
```

`rows`는 `{ name = ..., score = ... }` 테이블의 리스트이고, 빈 비교자를 가진 `table.sort` 호출과 print는 적혀 있습니다. `FILL` 주석 자리에 비교자의 두 줄을 보이는 그대로 입력하세요.

```
input:  3
        mei 40
        alex 55
        ken 40
output: alex 55
        ken 40
        mei 40
```
'''
hints = [
  "if a.score ~= b.score then return a.score > b.score end, 그다음 return a.name < b.name — 동점 가르기는 점수가 같을 때만 실행됩니다.",
  "~=는 Lua의 같지 않음입니다. a.score >= b.score를 돌려주면 같은 두 행이 서로 상대보다 앞에 온다고 말하게 되고, sort는 그것을 거부합니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.basic.15.closures"
title = "마진"
story = "등불 노점은 저녁 시트의 모든 도매가에 같은 마진을 더하는데, 마진을 기억해야 할 함수가 nil로 돌아온다."
brief = '''
다른 함수 안에서 정의된 함수는 바깥 함수의 지역 변수를 쓸 수 있고, 바깥 함수가 반환한 뒤에도 계속 씁니다. 그것이 클로저입니다: 안쪽 함수가 `k`를 upvalue로 지니고 다닙니다. 바깥 함수는 안쪽 함수를 돌려줍니다 — 호출한 결과가 아니라, 다른 것과 같은 값인 함수 그 자체를.

```
local function make_adder(k)
  local function add(x)
    return x + k
  end
  return add
end
```

`make_adder`와 그 안의 `local function add(x)`는 적혀 있고, `main`은 결과를 모든 숫자에 적용합니다. 두 자리 표시 대신 두 `return` 줄을 보이는 그대로 입력하세요.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "add 안에 return x + k, 그다음 make_adder의 마지막 줄로 return add(괄호 없이).",
  "return add()는 인자 없이 호출해서 nil + k에서 실패합니다. 이름만 쓰면 함수 그 자체입니다. 스타터의 return nil 때문에 main이 attempt to call local 'add' (a nil value)로 죽습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.basic.16.lambdas"
title = "짝수 제곱"
story = "공원 사무소는 짝수 번호 노점에 번호의 제곱만큼 부과하는데, 서기의 시트에는 합계가 있어야 할 자리에 0이 있다."
brief = '''
Lua에는 `lambda` 키워드가 없습니다. 이름 없는 작은 함수는 쓰이는 바로 그 자리에 `function(x) return x * x end`처럼 온전히 씁니다. `filter(f, xs)`는 `f`가 `true`라고 한 값만 남기고, `map(f, xs)`는 각 값을 `f(value)`로 바꾸며, `sum(xs)`는 남은 것을 더합니다 — 셋 다 내장이 아니라서 `main` 위에 적혀 있습니다. 안쪽부터 바깥으로 읽으세요.

```
local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs)))
```

`xs`는 읽혀 있고 print는 적혀 있습니다. `local total = ...` 줄을 보이는 그대로 입력하세요.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs))) — filter 먼저, 다음 map, 다음 sum.",
  "익명 함수에는 return과 end가 필요합니다: function(x) x * x end는 문법 에러입니다. Lua의 %는 내림 나머지라서 -4 % 2는 0이고 음수도 셉니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.basic.17.threads"
title = "심부름꾼 열둘이 동시에"
story = "북이 처음 울릴 때 용을 따라 늘어선 향 심부름꾼 모두가 사당 장부를 위해 자기 마디의 개수를 동시에 제곱하는데, 아무도 그들이 끝나기를 기다리지 않아서 장부는 온통 0으로 돌아온다."
brief = '''
LuaJIT에는 스레드가 없습니다. 코루틴이 가장 가까운 것입니다 — 자기 스택을 가진 함수로, 재개될 때 돌고 `yield`마다 멈춥니다. `coroutine.create(f)`는 하나를 만들고 아무것도 실행하지 않습니다. `coroutine.resume(co)`는 그것을 시작하거나 마지막 yield에서 이어 가고, 다시 yield하거나 끝나면 돌아옵니다. `coroutine.status(co)`는 끝나고 나면 `"dead"`이므로, join은 그렇게 될 때까지 재개하는 것입니다. 모든 심부름꾼을 먼저 시작하고, 그다음 모두를 끝내세요 — 시작 루프 안에서 끝내면 한 번에 하나씩 돌게 됩니다.

```
for _, co in ipairs(workers) do
  coroutine.resume(co)
end
for _, co in ipairs(workers) do
  while coroutine.status(co) ~= "dead" do coroutine.resume(co) end
end
```

`square(i)`는 한 번 yield한 뒤 `results[i]`를 채우고, 워커 리스트는 만들어져 있으며, 두 print는 두 번째 루프 뒤에 실행됩니다. 첫 루프 본문으로 `resume`을, 둘째 루프 본문으로 `while` 줄을 보이는 그대로 입력하세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "첫 루프에 coroutine.resume(co), 둘째 루프에 while coroutine.status(co) ~= \"dead\" do coroutine.resume(co) end.",
  "한 번도 재개하지 않은 코루틴은 절대 돌지 않고, 한 번만 재개한 코루틴은 제곱을 아직 쓰지 않은 채 yield에서 멈춥니다. 어느 쪽인지는 status가 알려 줍니다.",
]

