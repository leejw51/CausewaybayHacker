hints = [
  "table.sort(asc)와 table.sort(desc, function(a, b) return a > b end) — 비교자는 end까지 포함한 함수 하나 전체입니다.",
  "asc = table.sort(asc)는 asc를 nil로 만듭니다: sort는 아무것도 돌려주지 않습니다. 비교자는 엄격해야 합니다: >=는 잘못된 순서 함수가 됩니다.",
