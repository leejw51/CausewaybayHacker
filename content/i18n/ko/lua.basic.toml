brief = '''
리스트는 스택이고, 맨 위에서 고쳐집니다: `t[#t + 1] = x`는 값을 올리고(마지막 위치 하나 다음이 새 마지막입니다), `table.remove(t)`는 맨 위를 떼며, `t[#t] = x`는 맨 위를 제자리에서 바꿉니다. 같은 테이블도 앞에서 꺼내면 큐가 됩니다, `table.remove(t, 1)` — 그쪽은 적혀 있습니다.

