[[quest]]
id    = "lua.basic.10.byte-slices"
title = "앞 세 바이트"
story = "등불 꼬리표 프린터는 용 맡은 이의 이름 앞 세 바이트와 뒤에 표시 하나를 원하고, 글자로 찍기 전에 바이트를 16진수로 보여 준다."
brief = '''
Lua의 문자열은 그 자체가 바이트**입니다**: 따로 된 bytes 타입이 없고, `#s`는 바이트를 세며, `s:sub`는 바이트를 자릅니다. `s:byte(i, j)`는 `i`부터 `j`까지의 바이트를 숫자로, 하나당 반환값 하나로 돌려주고, `{ ... }`가 그것을 테이블로 모읍니다. `-1`은 마지막 위치를 뜻하므로 `s:byte(1, -1)`은 모든 바이트입니다. `string.char(...)`는 반대 방향 — 숫자가 들어가고 문자열이 나옴 — 이고, `unpack(t)`은 테이블을 그 함수가 원하는 인자들로 펼칩니다.

```
local bytes = { head:byte(1, -1) }
print(string.char(unpack(bytes)))
```

`head`는 `s`의 앞 세 바이트 끝에 `"!"`를 붙인 것이고, 16진수 줄은 `bytes`에서 출력됩니다. 두 자리표시자 자리에 위의 두 줄을 그대로 입력하세요.

```
input:  kwan lee
output: 6b776121
        kwa!
```
'''
hints = [
  "local bytes = { head:byte(1, -1) }, 그다음 print(string.char(unpack(bytes))) — byte는 한쪽으로, char는 다른 쪽으로 갑니다.",
  "인자 없는 head:byte()는 첫 바이트뿐입니다. 1, -1이 전부를 달라고 합니다.",
]

