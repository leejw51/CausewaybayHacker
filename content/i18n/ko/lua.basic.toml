[[quest]]
id    = "lua.basic.16.list"
title = "주문 사슬"
story = "심부름꾼은 향 주문을 하나씩 트럭 위 사슬 끝에 끼우고 번호표를 앞에 끼우는데, 사슬이 빈 채로 걸려 있다."
brief = '''
Lua에는 deque가 없습니다. 테이블은 같은 두 함수와 위치로 양 끝에서 고쳐집니다. `table.insert(t, 1, x)` — 인자 셋 — 는 `x`를 위치 1에 두고 나머지를 뒤로 밀고, 위치 없는 `table.remove(t)`는 **마지막** 값을 떼며, `t[1] = x`는 맨 앞을 바꾸고, `table.sort(t)`는 제자리에서 정렬하므로 네 번째 줄은 리스트의 것과 같습니다.

```
table.insert(chain, 1, 0)
table.remove(chain)
chain[1] = 9
table.sort(chain)
```

`chain`에는 한 줄의 정수들이 들어 있고 각 단계 뒤에 출력됩니다. 네 개의 `-- FILL` 자리 표시자 대신 네 줄을 그 순서대로 입력하세요.

```
input:  3 1 2
output: 0 3 1 2
        0 3 1
        9 3 1
        1 3 9
```
'''
hints = [
  "table.insert(chain, 1, 0), 다음 table.remove(chain), 다음 chain[1] = 9, 다음 table.sort(chain) — 자리 표시자마다 하나씩, 그 순서로.",
  "인자가 둘이면 table.insert는 끝에 붙입니다. 위치는 가운데에 갑니다. 위치 없는 table.remove는 끝이고, table.remove(chain, 1)이라면 맨 앞일 겁니다.",
]

