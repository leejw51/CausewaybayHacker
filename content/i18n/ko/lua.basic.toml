[[quest]]
id    = "lua.basic.18.binary-tree"
title = "NIL"
story = "23:59, 사당의 등불판. 등불 번호 트리는 아래에 아무것도 없는 루트 하나이고, 첫 조회가 attempt to index a nil value (field 'left')로 죽는다."
brief = '''
이진 탐색 트리는 노드의 왼쪽 서브트리에 더 작은 값을, 오른쪽에 더 큰 값을 둡니다. 삽입은 재귀입니다: 빈 서브트리(`nil`)는 새 `Node`가 되고, 아니면 값은 한쪽으로 내려가며, 돌아온 것을 다시 그 자식으로 저장합니다. 그 자식이 방금 전까지 `nil`이었을 수 있기 때문입니다 — 없는 키는 nil이고, nil은 따라가기 전까지는 에러가 아닙니다. `nil`에서 `.left`를 따라가는 것이 이 길의 이름이 된 바로 그 충돌입니다. `nil` 검사가 먼저이고, 그것은 적혀 있습니다.

```
if v < n.val then
  n.left = insert(n.left, v)
else
  n.right = insert(n.right, v)
end
```

`Node`, `insert`의 `nil` 경우와 `if v < n.val then` / `else` 뼈대, `inorder`, `height`, `main`은 적혀 있습니다. 두 자리 표시 대신 재귀 두 줄을 보이는 그대로 입력하세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if 아래에 n.left = insert(n.left, v), else 아래에 n.right = insert(n.right, v).",
  "대입이 핵심입니다: insert는 서브트리의 루트를 돌려주는데, 자식이 nil이었다면 그것은 새 Node입니다. 새 Node에는 left나 right 키가 아예 없습니다 — 읽으면 nil이고, 그 안으로 인덱스하기 전까지는 괜찮습니다.",
]
