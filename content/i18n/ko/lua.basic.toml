[[quest]]
id    = "lua.basic.10.maps"
title = "집계 공책"
story = "월병 노점의 모든 판매는 단어 하나로 공책에 들어가고, 북이 처음 울릴 때 주인은 월병마다 개수가 적힌 한 줄을 원하는데, 페이지는 외친 순서대로의 단어들뿐이다."
brief = '''
테이블은 키로 고쳐집니다. `counts[k] = v`는 키 아래에 값을 저장하고 — 새 키는 추가되고, 있는 키는 덮어써집니다 — `counts[k] = nil`은 키를 지우며(delete는 없습니다. nil이 없음입니다),
`counts[k] = counts[k] + n`은 키의 값을 읽어 바꿔서 되씁니다. 테이블은 순서를 **전혀** 지키지 않습니다: `pairs`는 제멋대로의 순서로 걷기 때문에, 스타터는 처음 본 순서를 따로 리스트에 담아 두고, 키를 정렬해 출력하려면 리스트로 모아 `table.sort`합니다.

```
counts["tofu"] = 1
counts[first] = nil
counts["tofu"] = counts["tofu"] + 4
table.sort(ks)
```

`counts`는 단어별 개수를 담고, `first`는 줄의 첫 단어이며, `order`는 처음 본 순서의 단어들 끝에 `"tofu"`를 붙인 것이고, `show(counts, order)`는 각 수정 뒤에 없어진 키는 건너뛰며 그 순서로 집계를 출력합니다. 처음 세 개의 `-- FILL` 자리 표시자 대신 세 수정을 입력하고, 네 번째 자리에는 마지막 루프 앞에 `table.sort(ks)`를 입력하세요.

```
input:  siu mai har gau siu mai
output: siu=2 mai=2 har=1 gau=1 tofu=1
        mai=2 har=1 gau=1 tofu=1
        mai=2 har=1 gau=1 tofu=5
        gau 1
        har 1
        mai 2
        tofu 5
```
'''
hints = [
  "counts[\"tofu\"] = 1, 다음 counts[first] = nil, 다음 counts[\"tofu\"] = counts[\"tofu\"] + 4, 다음 마지막 루프 앞에 table.sort(ks).",
  "nil을 대입하는 것이 키를 지우는 유일한 방법입니다. +=는 없습니다: 값을 읽고, 더하고, 같은 키 아래에 되쓰세요.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.basic.18.hashtable"
title = "노점 번호"
story = "공원 사무소는 노점 이름에서 노점 번호로 가는 표를 두는데, 등불 카운터의 모든 조회가 빈손으로 돌아온다."
brief = '''
Lua의 테이블은 해시 테이블입니다: 키가 슬롯으로 해시되므로 저장, 삭제, 조회 모두 키가 몇 개든 비용이 같습니다. `numbers[k] = v`는 저장하고(새 키는 추가), `numbers[k] = nil`은 키를 지우며, `numbers[k] = numbers[k] + n`은 키의 값을 제자리에서 고칩니다. 없는 키는 `nil`이고 `nil or -1`은 `-1`입니다: `numbers[w] or -1`이 기본값이 있는 조회입니다 — 그리고 `0 or -1`은 `0`인데, 여기서 거짓은 `nil`과 `false`뿐이기 때문입니다.

```
numbers["bread"] = 99
numbers[first] = nil
numbers[last] = numbers[last] + 10
print(numbers[w] or -1)
```

`numbers`는 첫 줄의 각 노점 이름을 사무소가 매기듯 0부터 센 위치에 대응시킵니다. `first`와 `last`는 첫 이름과 마지막 이름입니다. 둘째 줄의 이름들은 수정 뒤에 조회돼 출력되고, 없으면 `-1`입니다. 그다음 전체 테이블이 키로 정렬되어 출력됩니다. 네 개의 `-- FILL` 자리 표시자 대신 네 줄을 그 순서대로 입력하세요.

```
input:  tofu fish gau
        gau bread tofu fish
output: 12
        99
        -1
        1
        bread=99 fish=1 gau=12
```
'''
hints = [
  "numbers[\"bread\"] = 99, 다음 numbers[first] = nil, 다음 numbers[last] = numbers[last] + 10, 다음 루프 안에 print(numbers[w] or -1).",
  "or는 왼쪽이 nil이나 false가 아니면 왼쪽을 돌려줍니다. 번호가 0인 노점은 여전히 0입니다. += 줄은 키가 있어야 하는데 last는 있습니다.",
]

