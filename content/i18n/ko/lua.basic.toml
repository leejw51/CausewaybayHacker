[[quest]]
id    = "lua.basic.08.enums"
title = "노선 셋, 색 셋"
story = "사당 문 옆에 핀으로 꽂힌 MTR 지도에는 노선 셋이 있고, 등불 장수의 아들은 어느 색이 사람들을 집에 데려다주는지 말해야 하는데, 그 아래 게시판은 비어 있다."
brief = '''
Lua에는 `enum`이 없습니다. 가장 가까운 것은 이름 붙은 상수의 테이블입니다 — `Line.ISLAND`는 `1`이고, 값은 다른 값처럼 다른 테이블의 키가 될 수 있습니다. 문자열로 인덱스하면 이름을 찾습니다: `Line["ISLAND"]`는 `Line.ISLAND`와 같으므로, 입력의 단어는 대문자로 바꿔 그것으로 인덱스하면 멤버가 됩니다. 없는 이름은 에러가 아니라 `nil`을 줍니다 — 따라가기 전까지는.

```
local Line = { ISLAND = 1 }

local line = Line[word:upper()]
```

`Line`, 멤버에서 색깔로 가는 `COLOUR` 테이블, print는 적혀 있습니다. `local line = ...` 줄을 보이는 그대로 입력하세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — 대괄호가 문자열로 키를 찾고, 이름은 대문자입니다.",
  "Line.word는 w-o-r-d라는 철자의 키를 찾을 겁니다. 읽어 들인 문자열을 받는 것은 대괄호 형태뿐입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.basic.09.vector"
title = "마디 목록"
story = "용 머리 맡은 이가 마디 무게를 하나씩 외치는데, 장부에는 목록 대신 빈칸 넷이 있다: 추가 뒤, 제거 뒤, 교체 뒤, 정렬 뒤."
brief = '''
`1, 2, 3, ...`에 값이 있는 테이블이 리스트이고, 제자리에서 고쳐집니다. `table.insert(t, x)`는 끝에 값을 추가하고, `table.remove(t, i)`는 위치의 값을 빼며(뒤의 것들이 앞으로 당겨집니다), `t[i] = x`는 위치의 값을 바꾸고, `table.sort(t)`는 값을 제자리에서 오름차순으로 정렬합니다. 네 연산, 네 줄, 그리고 리스트는 각 줄 뒤마다 다른 리스트입니다.

```
table.insert(xs, 100)
table.remove(xs, 1)
xs[1] = 7
table.sort(xs)
```

`xs`에는 한 줄의 정수들이 들어 있고 각 단계 뒤에 출력됩니다. 네 개의 `-- FILL` 자리 표시자 대신 네 줄을 그 순서대로 입력하세요.

```
input:  16 8 15 4
output: 16 8 15 4 100
        8 15 4 100
        7 15 4 100
        4 7 15 100
```
'''
hints = [
  "table.insert(xs, 100), 다음 table.remove(xs, 1), 다음 xs[1] = 7, 다음 table.sort(xs) — 자리 표시자마다 하나씩, 그 순서로.",
  "첫 위치는 0이 아니라 1입니다: xs[0] = 7은 리스트가 세지 않는 키에 7을 둡니다. table.sort는 아무것도 돌려주지 않으니 대입하지 마세요.",
]

