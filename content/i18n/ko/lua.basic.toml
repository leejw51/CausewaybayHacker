[[quest]]
id    = "lua.basic.11.sets"
title = "서로 다른 가격"
story = "등불 노점은 밤새 같은 가격 셋을 외치고, 게시판은 외침이 몇 번이었는지가 아니라 서로 다른 가격이 몇 개였는지 알고 싶어 한다."
brief = '''
Lua에는 집합이 없습니다. 값이 `true`이고 값들 자체를 키로 하는 테이블이 집합입니다. `seen[x] = true`는 값을 넣고(두 번은 한 번), `seen[x] = nil`은 값을 빼며(없었으면 아무것도 안 합니다), "이 값을 바꿔라"는 없습니다 — 집합은 키 하나를 지우고 다른 키를 넣어서 수정합니다. 집합에서 `#seen`은 **0**인데, `#`은 위치 `1, 2, 3, ...`만 세기 때문입니다. 집합은 `pairs`로 세고 나열하며, `pairs`는 모든 키를 특별한 순서 없이 걷습니다.

```
seen[100] = true
seen[first] = nil
seen[100] = nil; seen[101] = true
for v in pairs(seen) do vals[#vals + 1] = v end
```

`seen`은 한 줄의 서로 다른 정수들을 담고, `first`는 첫 번째이며, 각 수정 뒤에 `size(seen)`이 출력되고, `vals`는 마지막에 정렬되어 출력됩니다. 네 개의 `-- FILL` 자리 표시자 대신 네 줄을 그 순서대로 입력하세요.

```
input:  8 3 8 5 3
output: 4
        3
        3
        3 5 101
```
'''
hints = [
  "seen[100] = true, 다음 seen[first] = nil, 다음 seen[100] = nil; seen[101] = true, 다음 for v in pairs(seen) do vals[#vals + 1] = v end.",
  "pairs는 키를 먼저 줍니다. for에 이름이 하나면 받는 것은 그것입니다. 순서는 테이블 자신의 것이고, 그래서 vals를 출력하기 전에 정렬합니다.",
]

