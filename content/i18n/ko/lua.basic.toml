[[quest]]
id    = "lua.basic.08.string-slices"
title = "앞 몇 글자"
story = "등불 꼬리표 프린터는 짧은 꼬리표로 거리 이름의 앞 글자들을 가져와 표시를 붙이고, 행렬 안내판의 전체 이름은 있던 그대로 두어야 한다."
brief = '''
`s:sub(1, n)`은 부분 문자열입니다: `s`의 앞 `n`글자를 새 문자열로 — 위치는 1부터 세고 양 끝이 포함됩니다. 문자열은 바꿀 수 없으니 부분 문자열은 언제나 복사이고, 조각으로 무엇을 하든 `s`는 손대지 않습니다. `..`는 두 문자열을 이어 새 문자열을 만들고, 그것을 다시 `head`에 대입하는 것이 덧붙이는 방법입니다.

```
local head = s:sub(1, n)
head = head .. "!"
```

`s`와 `n`은 읽혀 있고 두 출력은 적혀 있습니다. 두 자리표시자 자리에 위의 두 줄을 그대로 입력하세요.

```
input:  causeway bay
        8
output: causeway!
        causeway bay
```
'''
hints = [
  "local head = s:sub(1, n), 그다음 head = head .. \"!\" — sub는 복사하고, ..는 또 하나를 만듭니다.",
  "s:sub(0, n)은 s:sub(1, n)과 같습니다. 0은 시작으로 당겨집니다. Lua에는 +=가 없습니다: 이름을 양쪽에 쓰세요.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.basic.09.int-slices"
title = "위에서 둘"
story = "행렬 안내판은 둘째와 셋째 마디 번호를 베껴 쓰고 마지막 둘을 뒤에 붙이되, 원래 목록은 적힌 그대로 두라고 한다."
brief = '''
Lua에는 슬라이스가 없습니다. 가장 가까운 것은 `unpack(v, i, j)`로, `i`부터 `j`까지의 값을 따로따로 돌려주고, 그것을 감싼 `{ ... }`가 **새 테이블**로 모읍니다 — 그것을 바꿔도 `v`는 절대 바뀌지 않습니다. 위치는 1부터 세고 양 끝이 포함되므로 둘째와 셋째 값은 `2, 3`입니다. `table.insert(t, x)`는 `x`를 끝에 붙입니다. `#v`는 마지막 위치이므로 `v[#v - 1]`과 `v[#v]`가 마지막 둘입니다.

```
local part = { unpack(v, 2, 3) }
table.insert(part, v[#v - 1]); table.insert(part, v[#v])
```

`v`는 그 줄의 정수들을 담고 있고 두 출력은 적혀 있습니다. 두 자리표시자 자리에 위의 두 줄을 그대로 입력하세요.

```
input:  1 2 3 4 5
output: 2 3 4 5
        1 2 3 4 5
```
'''
hints = [
  "local part = { unpack(v, 2, 3) }, 그다음 table.insert(part, v[#v - 1]); table.insert(part, v[#v]) — 한 줄에 문장 둘, 사이에 세미콜론.",
  "unpack은 LuaJIT에서 전역입니다(table.unpack은 Lua 5.2입니다). 중괄호로 감싸지 않으면 두 값은 어디로도 가지 않습니다.",
]

