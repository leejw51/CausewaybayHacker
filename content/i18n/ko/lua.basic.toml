[[quest]]
id    = "lua.basic.05.loops"
title = "마디 세기"
story = "용의 마디는 머리부터 1에서 n까지 번호가 붙는데, 마디 번호들의 집계와 세 번째 자리마다 북을 싣는 마디의 집계는 개수 아래 빈 줄이다."
brief = '''
숫자 `for`가 대신 세어 줍니다: `for i = 1, n do`는 `i`를 `1`에서 시작해 `n`까지 **포함해** 값마다 본문을 한 번씩 실행합니다 — 마지막 값도 셈에 들어가고, 이것이 Lua가 `range`와 가장 먼저 다른 점입니다. 본문은 `end`에서 끝납니다.

```
for i = 1, n do
  total = total + i
  if i % 3 == 0 then threes = threes + 1 end
end
```

`n`은 읽혀 있고, `total`과 `threes`는 `0`에서 시작하며, 루프 본문은 적혀 있습니다. 본문 위에 `for` 줄을 보이는 그대로 입력하세요.

```
input:  10
output: 55
        3
```
'''
hints = [
  "for i = 1, n do — 두 번째 숫자는 i의 마지막 값이지, 그 하나 다음이 아닙니다.",
  "for i = 1, 0은 0번 돕니다: 시작이 끝을 지난 루프에는 실행할 본문이 없습니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.basic.06.functions"
title = "심부름꾼의 품삯"
story = "향 노점은 심부름꾼에게 트럭까지 한 번 다녀올 때마다 삯을 주고 열 번째 뒤로는 더 싸게 주는데, 그것을 계산하던 장부 페이지는 이름만 있고 아래가 비어 있다."
brief = '''
`function`이 함수를 만듭니다: 이름, 괄호 안의 매개변수, 본문, 그리고 `end`. `return`은 호출한 쪽에 값을 돌려줍니다. 본문은 답 전체를 식 하나로 담은 `return` 한 줄이어도 됩니다. `math.min`과 `math.max`는 인자 중 작은 것과 큰 것입니다.

```
local function fare(rides)
  return math.min(rides, 10) * 5 + math.max(rides - 10, 0) * 3
end
```

처음 열 번은 한 번에 `5`, 그 뒤는 한 번에 `3`입니다. `main`은 `n`을 읽어 `fare(n)`을 출력합니다. `fare`의 `return` 줄을 보이는 그대로 입력하세요.

```
input:  12
output: 56
```
'''
hints = [
  "return math.min(rides, 10) * 5 + math.max(rides - 10, 0) * 3 — min은 비싼 횟수를 열 번에서 자르고, max는 나머지가 음수가 되지 않게 합니다.",
  "함수의 일은 return에서 끝납니다. 본문에서 그 뒤의 것은 실행되지 않고, return은 자기 블록의 마지막 문장이어야 합니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.basic.07.structs"
title = "노점 하나, 필드 셋"
story = "향 노점 카드에는 이름, 가격, 개수가 있는데, 계산대는 카드를 낱말 셋으로 읽고 아무것도 더하지 않는다."
brief = '''
Lua에는 `class`가 없습니다. 객체는 테이블이고, 그 뒤의 메타테이블이 키가 없을 때 어디를 볼지 말해 줍니다. `Stall.__index = Stall`은 모든 노점이 메서드를 `Stall`에서 찾게 하고, `setmetatable({...}, Stall)`이 그것을 붙이며, `function Stall:total()`은 `self`라는 숨은 첫 매개변수가 있는 메서드를 정의합니다 — 정의에도 호출에도 콜론. 안에서는 필드를 `self`를 통해 읽습니다.

```
local Stall = {}
Stall.__index = Stall

function Stall.new(name, price, qty)
  return setmetatable({ name = name, price = price, qty = qty }, Stall)
end

function Stall:total()
  return self.price * self.qty
end
```

`Stall`, 그 `new`, `main`은 적혀 있습니다. `total`의 `return` 줄을 보이는 그대로 입력하세요.

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty — 필드는 테이블에 살고, 콜론 메서드 안에서는 self가 그 테이블입니다.",
  "total() 안에서 price 홀로는 이름이 아닙니다. 전역 변수가 될 텐데, 아무도 설정하지 않은 전역은 nil입니다.",
]

