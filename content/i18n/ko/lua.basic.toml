  "stack[#stack + 1] = 100, 다음 table.remove(stack), 다음 stack[#stack] = 9 — 자리 표시자마다 하나씩, 그 순서로.",
  "위치 없는 table.remove는 끝, 즉 맨 위를 뗍니다. #stack은 대입을 위해 같은 칸을 가리킵니다.",
]

