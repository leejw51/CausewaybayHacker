brief = '''
`q`는 번호표를 순서대로 담은 배열입니다. 프로그램은 첫째 것을 떼어 `first`에 넣어야 합니다. 배열은 메서드 하나로 앞에서 지웁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
