[[quest]]
id    = "typescript.verybasic.06.loops"
title = "집계"
story = "30층 관제실은 랙을 따라 스크린을 하나 더하기 둘 더하기 셋으로 더해 가는데, 콘솔의 합계는 0이다."
brief = '''
`n`은 양의 정수입니다. 루프는 1부터 `n`까지(포함) 모든 정수를 돌며 각각을 `total`에 더해야 합니다. `for` 머리에는 시작, 매번 돌기 전에 검사하는 조건, 그리고 증가가 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: 10
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — 작거나 같음이니 n 자신도 돕니다.",
  "for...in은 객체의 키를 돕니다. 숫자에는 키가 없고, tsc는 시도조차 하게 두지 않습니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.verybasic.07.functions"
title = "광고 슬롯 요율"
story = "타임스 스퀘어 스크린은 오늘 밤 첫 열 개의 광고 슬롯에 각각 5, 그 뒤로는 각각 3을 청구한다. 청구 함수는 숫자를 약속하는데, tsc가 빌드하지 않는다."
brief = '''
`fare(rides)`는 요금을 돌려줘야 합니다. 처음 열 번은 각각 5, 열 번째 이후는 각각 3입니다. 시그니처가 `: number`라고 하니, 아무것도 돌려주지 않는 본문은 컴파일되지 않습니다. 함수는 키워드 하나로 값을 돌려줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
output: 15
```
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "`: number`로 타입이 붙은 함수가 돌려주지 않고 출력만 하면 컴파일되지 않습니다. tsc는 값을 돌려줘야 한다고 말합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.verybasic.08.structs"
title = "카드 하나, 필드 둘"
story = "리 가든 앱의 모든 상품 카드에는 이름과 가격이 있다. 생성자는 가격을 한 번도 설정하지 않고, 빌드는 가격을 약속한 줄에서 멈춘다."
brief = '''
`Stall`의 생성자는 `name`과 `price`를 받습니다. 클래스는 `price: number`를 선언하고, `strict`에서는 선언된 모든 필드가 생성자에서 대입되어야 합니다. `name`을 저장하는 것과 같은 방식으로 `price`를 객체에 저장해서 `s.price`가 그것을 다시 읽게 해야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "this.price = price; — this가 객체이고, 그냥 이름은 매개변수입니다.",
  "this.price = name;은 컴파일되지 않습니다. name은 문자열이고 필드는 숫자입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.verybasic.09.struct-method"
title = "장바구니 한 줄"
story = "가격 곱하기 수량은 리 가든 앱의 모든 장바구니의 한 줄인데, 그것을 말해야 할 메서드는 숫자를 약속하고 아무것도 돌려주지 않는다."
brief = '''
`Stall.total()`은 가격 곱하기 수량을 돌려줘야 합니다. 생성자의 `public` 매개변수는 필드를 선언하고 한 번에 저장합니다. 메서드 안에서 객체의 필드는 `this`를 통해 닿습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return this.price * this.qty; — 두 필드 모두 this를 통해.",
  "메서드 안의 그냥 price는 필드가 아닙니다. 클래스 밖에서 입력으로 읽은 price, 즉 문자열이고, tsc는 문자열을 곱하지 않습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.verybasic.10.enums"
title = "노선 색"
story = "하이산 벽의 코즈웨이베이 출구 위 MTR 패널은 세 노선의 이름을 띄운다. 피드는 단어를 보내고, 패널에는 그 단어가 가리키는 열거형 멤버가 필요하다."
brief = '''
`word`는 `island`, `tsuenwan`, `kwuntong` 중 하나입니다. 프로그램은 그것을 맞는 `Line` 멤버로 바꿔야 합니다. 열거형은 멤버의 이름으로 인덱스할 수 있지만, tsc가 그 이름 중 하나라고 아는 키로만 됩니다. `keyof typeof Line`이 그 이름들의 집합이고, `as`는 그 문자열이 그중 하나라고 tsc에 알립니다. 이 단언은 런타임에 지워집니다. 아무것도 검사하지 않으니, 문자열이 맞아야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line = Line[word.toUpperCase() as keyof typeof Line]; — 이름은 대문자입니다.",
  "Line[word as keyof typeof Line]은 컴파일됩니다. `as`는 tsc가 믿고 받아들이는 약속이니까요. 런타임에 Line[\"tsuenwan\"]은 undefined입니다.",
]

