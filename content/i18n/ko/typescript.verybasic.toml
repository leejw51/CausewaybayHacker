  "console.log(new Set(xs).size); — new가 집합을 만들고, size가 셉니다.",
  "new 없는 Set은 호출할 수 없습니다. tsc는 new를 넣으려던 것 아니냐고 묻습니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.verybasic.17.stack"
title = "오버레이 스택"
story = "하이산 플레이스 벽에는 오버레이가 쌓이고 위에서부터 벗겨지는데, 렌더러는 자꾸 맨 아래 것을 벗겨 낸다."
brief = '''
`stack`은 스택으로 쓰는 배열입니다. 프로그램은 맨 위(마지막) 원소를 떼어 `top`에 넣어야 합니다. 배열 메서드 하나가 마지막 항목을 지우고 돌려줍니다. 스택이 비어 있었을 수 있으므로 그 타입은 `number | undefined`입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 4
        1 2 3
```
'''
hints = [
  "const top = stack.pop(); — 인자 없음. 언제나 마지막 것입니다.",
  "stack[stack.length - 1]은 맨 위를 읽지만 더미에 그대로 둡니다.",
]

