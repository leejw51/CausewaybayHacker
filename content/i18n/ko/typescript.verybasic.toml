id    = "typescript.verybasic.19.heap"
title = "가장 급한 것부터"
story = "장애는 아무 순서로나 관제실에 닿고, 벽은 매번 가장 급한 것을 다음으로 보여 줘야 한다. 그것들을 담아 둔 목록은 어느 것이 그것인지 전혀 모른다."
brief = '''
TypeScript 표준 라이브러리에는 힙이 없어서, 스타터에 작은 `MinHeap`이 들어 있습니다. `push`는 값을 넣고 위로 올려 자리를 잡고, `pop`은 가장 작은 것을 꺼냅니다. 나중에 `pop`이 가장 작은 것부터 돌려주도록, 각 `x`는 힙 자신의 메서드로 들어가야 합니다. `items`에 직접 쓰면 올리기를 건너뛰어 순서가 깨집니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
