# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.verybasic.24.lambdas"
title = "짝수 층"
story = "주차장의 짝수 층 스크린은 지하층까지 포함해 층 번호의 제곱만큼 임대료를 내고, 홀수 층은 아무것도 내지 않는다. 장부는 합계 하나를 원한다."
brief = '''
`xs`는 그 줄의 정수들을 담고 있습니다. `total`은 짝수 값들의 제곱의 합이어야 하고, `filter`, `map`, `reduce`와 화살표 함수 셋으로 만듭니다. `reduce`에는 시작값이 필요합니다. 없으면 빈 배열은 시작할 것이 없습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "const total = xs.filter((x) => x % 2 === 0).map((x) => x * x).reduce((a, b) => a + b, 0);",
  "0이 없는 reduce는 빈 배열에서 TypeError를 던집니다. 모든 값이 홀수였고, 더할 것이 없었던 것입니다.",
]

