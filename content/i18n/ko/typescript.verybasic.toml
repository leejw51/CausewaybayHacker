[[quest]]
id    = "typescript.verybasic.25.threads"
title = "모든 패널을 한꺼번에"
story = "하이산 플레이스 벽의 모든 패널은 자기 프레임을 렌더링하는데, 벽은 그중 하나라도 끝나기 전에 불이 켜진다."
brief = '''
여기에는 스레드가 없습니다. 이벤트 루프 하나뿐이고, `square`는 잠드는 동안 그 루프에 차례를 돌려줍니다. 모든 호출은 이미 시작되었고 그 프로미스는 `tasks`에 있습니다. 결과를 출력하기 전에 `main`은 그것들이 모두 끝나기를 기다려야 합니다. `Promise`에는 프로미스의 배열을 하나로 만드는 함수가 있고, `await`가 그것을 기다립니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "await Promise.all(tasks); — 모두를 위한 프로미스 하나, 그리고 그것을 await합니다.",
  "await 없는 Promise.all(tasks)는 프로미스를 만들고 그대로 지나칩니다. tasks.join()은 배열 메서드이고 아무것도 합치지 않습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.verybasic.26.mutex"
title = "카운터 하나, 피드 넷"
story = "판매 피드 넷이 관제실 콘솔의 카운터 하나에 더한다. 락은 있는데, 아무도 읽기 전에 그것을 기다리지 않는다."
brief = '''
스레드는 하나인데도 경쟁이 있습니다. 각 워커는 `counter`를 읽고, `await`하고, 다시 쓰는데, 그 틈에 다른 워커들이 돕니다. `lock`은 작은 비동기 락입니다. 읽기 전에 각 워커는 락을 잡고 그것을 얻을 때까지 기다려야 합니다. 해제는 쓰기 뒤에 이미 적혀 있습니다. `acquire`는 락이 당신 것이 되면 끝나는 프로미스를 돌려줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1000
output: 4000
```
'''
hints = [
  "await lock.acquire(); — 그다음 읽기와 쓰기, 그다음 이미 있는 해제.",
  "await 없는 lock.acquire()는 락을 요청하고는, 얻기도 전에 카운터를 그냥 읽습니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.verybasic.27.binary-tree"
title = "ANY"
story = "23:59, 30층 관제실. 피드는 `any` 타입으로 들어오고, 모든 검사가 통과하고, 타임스 스퀘어 스크린에는 40피트 높이의 글자로 `undefined`가 뜬다. 타입 표기 하나면 잡혔을 것이다."
brief = '''
스크린 id들은 이진 탐색 트리에 들어가고, 모든 자식에는 `any`가 아니라 `TreeNode | null`이 표기되어 있어서, tsc는 빈 경우를 하나의 경우로 다루게 합니다. `insert(n, v)`는 `v`가 들어간 트리의 뿌리를 돌려줍니다. `null` 경우와 오른쪽은 적혀 있습니다. 더 작은 `v`에 대해서는 왼쪽 자식을 그 안에 넣은 결과로 바꿔야 하고, 그래야 `null` 자식이 노드가 됩니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v); — 재귀가 서브트리의 새 뿌리를 돌려주니 저장합니다.",
  "결과를 저장하지 않고 insert를 호출하면 null이 제자리에 남고, tsc는 그것을 보지 못합니다. 타입은 모두 맞으니까요.",
]
