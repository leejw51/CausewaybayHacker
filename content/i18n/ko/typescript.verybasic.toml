output: 1 2 3 4 5
```
'''
hints = [
  "heap.push(x); — 힙의 메서드이고, x를 제자리까지 위로 올립니다.",
  "heap.items.push(x)는 x를 배열 끝에 넣고 올리기를 건너뜁니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.verybasic.20.sorting"
title = "요금 사다리"
story = "이워 스트리트 안내판의 요금은 노선이 추가된 순서로 있고, 안내판은 그것을 텍스트로 정렬한다. 10이 9보다 앞이다."
brief = '''
`xs`는 그 줄의 정수들을 담고 있습니다. 프로그램은 출력하기 전에 `xs`를 제자리에서 오름차순으로 정렬해야 합니다. 배열의 `sort`는 비교 함수를 받습니다. 음수면 첫 인자가 앞에 남습니다. 비교 함수가 없으면 `sort`는 숫자를 문자열로 비교합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 1 1 3 4
```
'''
hints = [
  "xs.sort((a, b) => a - b); — a 빼기 b가 오름차순입니다.",
  "비교 함수 없는 xs.sort()는 10을 9보다 앞에 둡니다. \"1\"이 \"9\"보다 앞이니까요.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.verybasic.21.sort-by-key"
title = "리더보드"
story = "타임스 스퀘어 스크린의 탭 게임 리더보드는 점수가 높은 순, 같으면 이름 순인데, 사람들이 참가한 순서를 보여 주고 있다."
brief = '''
`rows`는 `[string, number][]`, 즉 타입이 붙은 튜플의 배열이고, 각 튜플은 이름 다음에 점수입니다. 점수 내림차순, 그다음 이름 오름차순으로 정렬해야 합니다. 비교 함수는 화살표 함수입니다. `||`는 첫 비교가 0을 낼 때만 두 번째 비교로 넘어가고, `byName`은 두 문자열을 비교합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3
        mei 7
        alex 9
        bo 7
output: alex 9
        bo 7
        mei 7
```
'''
hints = [
  "rows.sort((a, b) => b[1] - a[1] || byName(a[0], b[0])); — 점수 내림차순이라 b가 a보다 앞입니다.",
  "튜플의 원소 1이 숫자이고 원소 0이 문자열입니다. tsc는 어느 것이 어느 것인지 알고, byName(a[1], b[1])은 컴파일되지 않습니다.",
]

