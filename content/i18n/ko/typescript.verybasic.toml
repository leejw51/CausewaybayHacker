[[quest]]
id    = "typescript.verybasic.11.vector"
title = "재생 목록"
story = "관제실이 받는 모든 클립은 들어온 순서대로 오늘 밤 재생 목록에 올라가야 하는데, 재생 목록은 비어 있다."
brief = '''
`xs`는 빈 채로 시작하는 `number[]`입니다. 루프에서 읽은 각 정수 `x`를 입력 순서를 지키며 끝에 넣어야 합니다. 배열에는 그것을 하는 메서드가 하나 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs.push(x); — 값 하나를 끝에.",
  "unshift(x)는 앞에 넣어 순서를 뒤집습니다.",
]

