[[quest]]
id    = "typescript.verybasic.16.sets"
title = "서로 다른 광고주"
story = "타임스 스퀘어 로테이션에 슬롯 여섯, 서로 다른 광고주 셋. 청구서는 몇 곳이 서로 다른지 원하는데, 여섯이라고 한다."
brief = '''
`xs`는 그 줄의 정수들을 담고 있습니다. 프로그램은 서로 다른 값이 몇 개인지 출력해야 합니다. `Set`은 각각을 하나씩만 담고, `length`가 아니라 속성 하나로 개수를 셉니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
