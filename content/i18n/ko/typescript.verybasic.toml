# TYPESCRIPT LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/typescript/verybasic.toml`, quest by quest, and nothing
# else. The question is the brief; the four choices are code, live in the
# English pack, and are never translated. Code blocks, identifiers and printed
# strings are copied verbatim.

pack   = "typescript.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.verybasic.01.print"
title = "첫 화면"
story = "19:00, 타임스 스퀘어 위. 대형 스크린이 검게 켜지고, 오늘 밤의 첫 줄은 손으로 쳐야 한다."
brief = '''
프로그램은 정확히 `hello, causewaybay`를 한 줄에 출력해야 합니다. 전역 `console`의 메서드 하나가 표준 출력에 한 줄을 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
output: hello, causewaybay
```
'''
hints = [
  "console.log(\"hello, causewaybay\"); — 괄호, 그리고 문자열 안의 쉼표.",
  "여기에는 print()가 없습니다. tsc는 처음 보는 이름에 무엇이 실행되기도 전에 TS2304로 답합니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.verybasic.02.int-types"
title = "나뉜 재생 목록"
story = "하이산 플레이스의 LED 벽은 오늘 밤 클립들을 패널에 나눠 싣는다. 스케줄러는 패널마다 몇 개씩, 몇 개가 남는지 말해야 하는데 아무 말도 없다."
brief = '''
`a`와 `b`는 정수입니다. 프로그램은 정수 몫과 나머지를 공백으로 구분해 한 줄에 출력해야 합니다. TypeScript에는 `number` 타입 하나뿐이고 정수 나눗셈 연산자가 없습니다. `/`는 언제나 소수를 내고, `Math.trunc`가 소수 부분을 버리며, `%`가 나머지입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3 1
```
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); — console.log는 인자 사이에 공백을 넣습니다.",
  "a / b는 3이 아니라 3.5입니다. 모든 숫자가 double이니까요. 그리고 여기서 //는 연산자가 아니라 주석의 시작입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.verybasic.03.floats"
title = "대기 시간"
story = "이워 스트리트의 트램 안내판은 대기 시간을 소수 둘째 자리까지 보여 주는데, 오늘 밤은 3.5를 띄우고 마지막 숫자 자리가 비어 있다."
brief = '''
`x`와 `y`는 숫자입니다. 프로그램은 `x / y`를 소수점 아래 정확히 두 자리로 출력해야 합니다. 숫자에는 정해진 소수 자릿수로 서식을 맞춰 문자열을 돌려주는 메서드가 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "console.log((x / y).toFixed(2)); — 괄호가 나눗셈을 먼저 하게 합니다.",
  "Math.round(x / y * 100) / 100은 여전히 숫자이고, 숫자는 3.50이 아니라 3.5로 출력됩니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.verybasic.04.strings"
title = "배너"
story = "리 가든 앱의 배너는 마케팅팀에서 소문자로 오고 브랜드 가이드는 대문자를 원한다. 배너는 친 그대로 올라간다."
brief = '''
`s`는 텍스트 한 줄입니다. 프로그램은 그 길이 다음에 `s`를 대문자로 출력해야 합니다. 문자열 메서드 하나가 모든 글자를 대문자로 바꾼 사본을 돌려줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "console.log(s.toUpperCase()); — camelCase이고, 괄호를 붙여 호출합니다.",
  "s.upper()는 Python입니다. 문자열 타입에는 그런 메서드가 없고 tsc가 그렇게 말해 줍니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.verybasic.05.bool-if"
title = "동쪽이냐 서쪽이냐"
story = "이워 스트리트의 도착 안내판은 짝수 정류장에서는 동쪽을, 홀수 정류장에서는 서쪽을 향한다. 사다리 위의 설치 기사는 정류장 번호를 알고, 방향이 필요하다."
brief = '''
`n`은 양의 정수입니다. 프로그램은 `n`이 2로 나누어떨어지면 `even`, 아니면 `odd`를 출력해야 합니다. 조건은 나머지를 0과 비교하는 `if`이고, 비교에는 세 글자짜리 엄격한 동등 연산자를 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "if (n % 2 === 0) { — 등호 셋은 비교이고, 하나는 대입입니다.",
  "n % 2는 숫자이고, tsc는 숫자를 문자열 \"0\"과 비교하기를 거부합니다. 두 타입에 겹치는 부분이 없으니까요.",
]

