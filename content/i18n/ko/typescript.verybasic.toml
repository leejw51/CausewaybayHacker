[[quest]]
id    = "typescript.verybasic.13.list"
title = "자막 띠의 맨 앞"
story = "속보는 타임스 스퀘어 스크린 아래 자막 띠의 맨 앞에 올라가는데, 가장 새 소식이 자꾸 맨 뒤에 붙는다."
brief = '''
`chain`은 `number[]`입니다. TypeScript에는 덱이 없고, 배열이 양쪽 끝을 다 합니다. 루프에서 읽은 각 `x`를 맨 앞에 넣어야 하니, 마지막으로 읽은 것이 첫째가 됩니다. 배열에는 그쪽 끝을 위한 메서드가 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "chain.unshift(x); — push의 앞쪽 짝입니다.",
  "push(x)는 뒤에 붙습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.verybasic.14.maps"
title = "탭 집계"
story = "리 가든 앱은 상품마다 한 줄씩 탭을 센다. 무엇이든 첫 탭은 더할 줄을 찾지 못한다."
brief = '''
`counts`는 `Map<string, number>`입니다. 프로그램은 각 단어 `w`의 횟수에 1을 더해야 하고, 처음에는 0부터 시작합니다. 키가 없을 수 있으므로 `get`의 타입은 `number | undefined`이고, `??`는 없을 때 쓸 값을 대 줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts.set(w, (counts.get(w) ?? 0) + 1); — 기본값은 괄호 안에, 그다음 더합니다.",
  "counts.get(w)! + 1은 컴파일됩니다. !가 tsc에 값이 있다고 말하니까요. 그리고 런타임에 undefined + 1은 NaN입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.verybasic.15.hashtable"
title = "조회"
story = "관제실의 테이블은 정류장 이름을 안내판 번호로 잇는다. 없는 정류장을 물으면 이워 스트리트 안내판을 비울 게 아니라 -1이라고 해야 한다."
brief = '''
`table`은 이름을 안내판 번호로 잇고, 안내판 번호는 0일 수 있습니다. 단어 `w`에 대해 프로그램은 그 번호를, `w`가 테이블에 없으면 `-1`을 출력해야 합니다. `get`은 없는 키에 `undefined`를 돌려줍니다. 연산자 하나가 정확히 `null`과 `undefined`만 바꾸고 다른 것은 바꾸지 않습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "console.log(table.get(w) ?? -1); — ??는 undefined나 null일 때만 나섭니다.",
  "||는 모든 falsy 값에 나서고, 0은 falsy입니다. 0번 안내판이 -1로 읽힐 겁니다.",
]

