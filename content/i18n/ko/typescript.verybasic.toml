[[quest]]
id    = "typescript.verybasic.12.vector-edit"
title = "내려진 클립"
story = "하이산 플레이스 재생 목록의 첫 클립은 방송 전에 내려졌다. 그것은 빠져야 하고, 뒤의 모든 것이 한 칸씩 당겨진다."
brief = '''
`xs`는 그 줄의 정수들을 담고 있습니다. 프로그램은 인덱스 0의 원소를 지워 나머지가 앞으로 당겨지게 해야 합니다. 배열 메서드 하나가 시작 인덱스와 개수로 지웁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "xs.splice(0, 1); — 인덱스 0부터, 원소 하나.",
  "delete xs[0]은 원소가 있던 자리에 구멍을 남기고, 길이는 바뀌지 않습니다.",
]

