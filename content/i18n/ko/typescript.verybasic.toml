[[quest]]
id    = "typescript.verybasic.22.reverse"
title = "거꾸로"
story = "하이산 플레이스 벽은 텍스트를 오른쪽에서 왼쪽으로 흘리고, 운영자는 올리기 전에 문자열을 거꾸로 저장해 두기를 원한다."
brief = '''
`s`는 텍스트 한 줄입니다. 프로그램은 그것을 뒤집어 출력해야 합니다. 문자열에는 자기 reverse가 없습니다. 문자의 배열로 펼치고, 배열을 뒤집고, 다시 문자열로 이어 붙이세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

