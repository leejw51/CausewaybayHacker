# GO LAND — VERY BASIC, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/go/verybasic.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "go.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.verybasic.01.print"
title = "첫 줄"
story = "틴하우, 06:00, 셔터가 반쯤 올라갔다. 발권기 화면은 인사를 해야 하는데 빈 줄을 찍는다."
brief = '''
한마디를 하는 프로그램에는 `fmt`의 호출 하나가 필요합니다. 인자를 출력하고 줄을 끝내는 그것입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  
output: hello, causewaybay
```
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — 큰따옴표 안의 문자열, 소문자, 쉼표 하나.",
  "fmt 없는 print는 stderr에 쓰고, ln 없는 Print는 줄을 끝내지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.verybasic.02.int-types"
title = "넓은 숫자"
story = "틴하우의 옥토퍼스 리더는 탭을 int32로 세는데 하루 합계가 거기에 들어가지 않는다."
brief = '''
`n`은 `int32`입니다. 여기에 40억을 곱하려면 먼저 더 넓은 타입이 필요합니다. `n`을 `int64`로 변환한 뒤 곱하세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7
output: 28000000000
```
'''
hints = [
  "wide := int64(n) * 4000000000 — 먼저 변환하고, 넓은 타입에서 곱합니다.",
  "n * 4000000000은 int32에서 계산되고 상수가 들어가지 않아 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.verybasic.03.floats"
title = "소수로 된 요금"
story = "안내판의 요금은 글자다. 리더는 두 배로 만들기 전에 float64로 가져야 한다."
brief = '''
`s`는 문자열로 된 요금입니다. `strconv`가 숫자와 오류를 돌려주는 호출 하나로 `float64`로 바꿉니다. 숫자는 남기고 오류는 버리세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  0.1
output: 0.100000000
        0.20
```
'''
hints = [
  "x, _ := strconv.ParseFloat(s, 64) — 결과가 둘이고, 64가 원하는 너비입니다.",
  "32를 쓰면 값이 먼저 float32로 반올림되고, 아홉째 소수에서 드러납니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.verybasic.04.strings"
title = "대문자 역 이름"
story = "틴하우 승강장 표지판은 역 이름을 대문자로 원하는데 리더에는 소문자 형태뿐이다."
brief = '''
`line`은 텍스트 한 줄입니다. `strings` 패키지에 그것을 대문자로 돌려주는 함수가 있습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tin hau
output: TIN HAU
        7
```
'''
hints = [
  "up := strings.ToUpper(line) — 문자열을 받는 패키지 함수이지, 문자열의 메서드가 아닙니다.",
  "Go 문자열에는 대소문자 메서드가 없고, strings.Title은 단어 첫 글자만 올리니 같지 않습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.verybasic.05.bool-if"
title = "짝수 칸"
story = "짝수 번호 칸은 넓은 승강장에 서는데, 안내판은 열차마다 한 번씩 틀린 칸을 고른다."
brief = '''
`n`은 칸 번호입니다. `n`을 2로 나눠 남는 것이 없으면 `even`, 아니면 `odd`를 출력합니다. `if` 줄에 나머지 검사가 필요합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: even
```
'''
hints = [
  "if n%2 == 0 { — %가 나머지, ==가 비교입니다.",
  "= 하나는 대입이고, n/2는 몫이지 나머지가 아닙니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.verybasic.06.loops"
title = "정류장 세기"
story = "노선에 정류장이 n개이고 집계판은 1부터 n까지 더하는데, 돌리는 루프가 하나 앞에서 멈춘다."
brief = '''
`n`을 읽었습니다. 루프는 `i`를 1부터 `n`까지(포함) 돌리며 각 `i`를 `sum`에 더해야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5
output: 15
```
'''
hints = [
  "for i := 1; i <= n; i++ { — 세 절, 그리고 <=가 n을 포함시킵니다.",
  ":= 없는 i = 1은 아무것도 선언하지 않고, < n은 하나 일찍 멈춥니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.verybasic.07.functions"
title = "라이더의 요율"
story = "배달마다 5달러, 하룻밤에 한 번 3달러 보너스. 요율 함수는 아직 아무것도 돌려주지 않는다."
brief = '''
`fare`는 배달 횟수를 받아 건당 5에 3을 더해 돌려줘야 합니다. 그 `return` 줄을 쓰세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4
output: 23
```
'''
hints = [
  "return rides*5 + 3 — 먼저 곱하고, 그다음 보너스를 더합니다.",
  "rides * (5 + 3)은 건당 8이고, rides + 5*3은 횟수에 15를 더합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.verybasic.08.structs"
title = "노점 하나, 필드 둘"
story = "럭키 맥 노점 카드에는 이름과 가격이 있는데, 주문 화면은 두 필드를 비운 채 만든다."
brief = '''
`Stall`에는 `Name`과 `Price` 필드가 있습니다. 키를 적는 구조체 리터럴로 `name`과 `price`에서 하나를 만드세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  noodles 12
output: noodles 24
```
'''
hints = [
  "s := Stall{Name: name, Price: price} — 필드 이름, 콜론, 쉼표.",
  "값이 셋이면 하나가 남고, 필드에는 값이 맞춰야 하는 타입이 있습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.verybasic.09.struct-method"
title = "노점의 합계"
story = "노점은 가격과 수량을 아는데, Total 메서드가 모든 주문에 0을 돌려준다."
brief = '''
`Total`은 `Stall`의 메서드입니다. 그 `return` 줄은 리시버 `s`를 통해 읽은 가격 곱하기 수량을 줘야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 4
output: 12
```
'''
hints = [
  "return s.Price * s.Qty — 필드는 리시버를 통해 닿습니다.",
  "Price 하나만 쓰면 범위에 없고, 리시버 s가 메서드가 자기 구조체를 보는 방법입니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.verybasic.10.enums"
title = "세 번째 노선"
story = "환승 표지판은 노선을 0, 1, 2로 번호 매기고, 이름을 부르기 전에 숫자를 다시 노선으로 바꾼다."
brief = '''
`Line`은 `Island`, `TsuenWan`, `KwunTong`을 가진 `iota` 타입입니다. 아래의 `switch`가 비교할 수 있도록 정수 `n`을 `Line`으로 바꾸세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  2
output: kwuntong
```
'''
hints = [
  "line := Line(n) — 타입에 함수 호출처럼 쓰는 변환입니다.",
  "line := n은 int이고, switch는 Line 상수와 비교하므로 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.verybasic.11.vector"
title = "칸 목록"
story = "선으로 들어오는 모든 칸 번호는 목록 끝에 들어가야 하는데, 목록은 비어 있다."
brief = '''
`xs`는 int의 슬라이스입니다. 루프 안에서 슬라이스를 늘리는 내장 함수로 각 `v`를 끝에 넣으세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "xs = append(xs, v) — append는 늘어난 슬라이스를 돌려주니 다시 대입합니다.",
  "슬라이스에는 메서드가 없고, append는 슬라이스를 먼저 받는 내장 함수입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.verybasic.12.vector-edit"
title = "두 번째 칸 빼기"
story = "2번 칸이 열차에서 빠진다. 목록은 엉뚱한 것을 빼거나, 아무것도 빼지 않는다."
brief = '''
`xs`는 그 줄의 정수, 넷 이상을 담고 있습니다. 인덱스 1 앞의 슬라이스와 뒤의 슬라이스를 이어 붙여 그 원소를 지우세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 3 4 1
```
'''
hints = [
  "xs = append(xs[:1], xs[2:]...) — ...가 꼬리를 append에 펼칩니다.",
  "... 없이는 append가 int를 원하는 자리에 슬라이스를 받아 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "go.verybasic.13.list"
title = "연결된 라이더 줄"
story = "라이더들이 차례로 출근 도장을 찍는데 문 앞의 연결 리스트는 아무도 남기지 않는다."
brief = '''
`l`은 `container/list`입니다. 각 `v`를 뒤에 넣으세요. `Front`부터 도는 순회가 순서대로 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  4 5 6
output: 4 5 6
```
'''
hints = [
  "l.PushBack(v) — container/list에 덧붙이는 메서드입니다.",
  "PushFront도 있지만, 그러면 거꾸로 출력됩니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.verybasic.14.maps"
title = "주문 집계"
story = "럭키 맥에서 주문된 모든 요리는 자기 횟수에 1을 더해야 하는데, 집계가 움직이지 않는다."
brief = '''
`counts`는 `map[string]int`입니다. 루프 안에서 `w`의 횟수에 1을 더하세요. 없는 키는 0으로 읽히니 식 하나면 됩니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  rice tea rice bun
output: bun 1
        rice 2
        tea 1
```
'''
hints = [
  "counts[w]++ — 맵을 인덱스하고, ++가 있는 것(없으면 0)에 1을 더합니다.",
  "counts[w] = 1은 반복될 때마다 잊어버립니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.verybasic.15.hashtable"
title = "이름에서 번호로"
story = "라이더 명부는 이름을 상수 시간에 번호로 잇는데, 조회가 모두에게 -1을 답한다."
brief = '''
`table`은 `map[string]int`, Go의 해시 테이블입니다. 첫 루프에서 각 `name`을 인덱스 `i`와 함께 저장하세요. 아래 조회는 콤마-ok 형태를 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  alex mei kit
        mei kit bo
output: 1
        2
        -1
```
'''
hints = [
  "table[name] = i — 대괄호 안 왼쪽에 키, 오른쪽에 값.",
  "키는 문자열이어야 하고, table[i]는 int로 인덱스하니 맵의 키 타입이 아닙니다.",
]

