[[quest]]
id    = "go.verybasic.18.queue"
title = "앞에서 둘"
story = "손님들이 계산대에 줄을 서 앞에서 빠지는데, 화면은 같은 손님을 두 번 부른다."
brief = '''
`queue`는 큐로 쓰는 슬라이스입니다. `front`는 첫 원소입니다. 다음 줄은 인덱스 1부터 다시 슬라이싱해 그 원소를 떼어 내야 합니다.

