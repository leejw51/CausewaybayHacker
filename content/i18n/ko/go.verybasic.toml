[[quest]]
id    = "go.verybasic.16.sets"
title = "서로 다른 라이더"
story = "배달 40건, 라이더 8명. 서로 다른 라이더를 세야 할 집합이 아무것도 세지 않는다."
brief = '''
`seen`은 `map[int]struct{}`, 즉 집합입니다. 각 `v`를 기록하세요. 빈 구조체가 비용이 없는 값입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  8 3 8 5 3 8
output: 3
```
'''
hints = [
  "seen[v] = struct{}{} — 타입, 그다음 하나를 만드는 중괄호 한 쌍.",
  "true는 bool이고, 맵의 값 타입은 struct{}입니다.",
]

