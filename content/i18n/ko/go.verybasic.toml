[[quest]]
id    = "go.verybasic.17.stack"
title = "위에서 둘"
story = "접시가 패스에 쌓이고 위에서 빠지는데, 계산대는 맨 위 접시를 두 번 읽고 한 번도 빼지 않는다."
brief = '''
`stack`은 스택으로 쓰는 슬라이스입니다. `top`은 끝에서 읽었습니다. 다음 줄은 다시 슬라이싱해 그 마지막 원소를 떼어 내야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 1
        4
        2
```
'''
hints = [
  "stack = stack[:len(stack)-1] — 마지막 원소만 뺀 전부.",
  "stack[1:]은 앞을 떼는데, 그것은 스택이 아니라 큐의 동작입니다.",
]

