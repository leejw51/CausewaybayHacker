[[quest]]
id    = "go.verybasic.22.reverse"
title = "거꾸로 도는 노선"
story = "막차는 역을 거꾸로 도는데 안내판은 아직 정방향으로 나열한다."
brief = '''
`xs`는 int의 슬라이스입니다. `slices` 패키지가 호출 하나로 제자리에서 뒤집습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  3 1 4 1
output: 1 4 1 3
```
'''
hints = [
  "slices.Reverse(xs) — 제자리에서, 돌려주는 값 없음.",
  "슬라이스 자체를 받지 포인터를 받지 않고, 결과를 대입하면 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "go.verybasic.23.closures"
title = "추가 요금"
story = "야간 안내판의 모든 요금에 같은 추가 요금이 붙는데, 더하는 함수가 액수를 잊었다."
brief = '''
`k`를 먼저 읽습니다. `add`는 int를 받아 `k`를 더해 돌려주는 함수 리터럴, 즉 `k`를 잡는 클로저여야 합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "add := func(x int) int { return x + k } — 매개변수 타입, 결과 타입, 그리고 바깥의 k.",
  "결과 타입이 없으면 리터럴은 아무것도 돌려주지 않고, x * k는 다른 함수입니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "go.verybasic.24.lambdas"
title = "모든 문, 제곱"
story = "승강장 모형은 모든 문 번호의 제곱을 원하는데, 문들에 함수를 적용하는 도우미가 아무것도 받지 못한다."
brief = '''
`apply`는 슬라이스와 함수를 받아 적용된 슬라이스를 돌려줍니다. 인자를 제곱하는 함수 리터럴로 `xs`에 호출하세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3
output: 1 4 9
```
'''
hints = [
  "ys := apply(xs, func(x int) int { return x * x }) — 리터럴 전체가 인자입니다.",
  "x * x만으로는 함수가 아니고, 결과 타입 없는 리터럴은 아무것도 돌려주지 않습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "go.verybasic.25.threads"
title = "주문마다 라이더 하나"
story = "주문 여덟 개가 자전거 여덟 대에 실려 동시에 주방을 나서는데, 안내판은 아무도 기다리지 않는다."
brief = '''
숫자마다 고루틴 하나: 각각 자기 `x`를 `results[i]`에 제곱해 넣고 끝나면 `WaitGroup`에 알립니다. `i`와 `x`를 넘기며 `go` 키워드로 시작하세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 1 4 9 16
        30
```
'''
hints = [
  "go func(i, x int) { defer wg.Done(); results[i] = x * x }(i, x) — 리터럴, 그다음 루프 값으로 호출.",
  "Done이 없으면 WaitGroup이 영영 돌아오지 않고, (i, x)가 없으면 리터럴은 호출되지 않습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "go.verybasic.26.mutex"
title = "합계 하나, 손 여럿"
story = "모든 라이더가 동시에 하나의 합계에 요금을 더하는데, 합계가 아무도 재현할 수 없는 만큼 틀린다."
brief = '''
`total`은 모든 고루틴이 공유합니다. `x`를 더하는 줄은 `mu.Lock()`과 `mu.Unlock()` 사이에 있어야 합니다. 여기서는 셋을 한 줄에 씁니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "mu.Lock(); total += x; mu.Unlock() — 잠그고, 공유 값을 건드리고, 풉니다.",
  "Unlock 없는 Lock은 다른 모든 고루틴을 영원히 붙잡고, WaitGroup도 함께 붙잡습니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "go.verybasic.27.binary-tree"
title = "NULLPTR"
story = "11:55, 럭키 맥의 앞쪽 계산대가 모든 주문을 번호로 트리에 정리하는데, 왼쪽 가지는 정리하고는 버려진다."
brief = '''
`insert`는 `v`를 `n`이 뿌리인 서브트리에 넣고 그 서브트리의 뿌리를 돌려줍니다. `if` 가지는 더 작은 `v`를 다룹니다. 왼쪽 자식으로 재귀하고, 돌아온 것을 저장하세요.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.Left = insert(n.Left, v) — 재귀 호출이 서브트리의 뿌리를 돌려주니 다시 대입합니다.",
  "insert(n.Left, v)만으로는 새 노드를 버립니다. 아무것도 저장하지 않으니까요.",
]
