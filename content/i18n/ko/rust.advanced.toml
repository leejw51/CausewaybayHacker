# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.advanced.09.pipeline"
title = "라인 쿡"
story = "보 셰프의 야간 주방은 라인으로 돌아간다: 한 스테이션이 주문을 제곱하고, 다음 스테이션이 누적 합계를 지키며, 아무도 배치 전체를 기다리지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

`mpsc` 채널 둘과 스레드 둘로 2단계 파이프라인을 만드세요:

1. 1단계는 각 값의 제곱을 보냅니다
2. 2단계는 그것을 받아 누적 합계를 유지하며 `(square, total)`을 보냅니다

`main`은 받은 쌍마다 `<square> <total>`로 출력한 뒤 `PIPE <n>`을 출력합니다.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

각 단계의 송신자는 자기 스레드 안으로 **이동되므로** 스레드가 끝날 때
드롭되고, 그래서 다음 단계의 `for` 루프가 끝납니다. 어디든 사본을 하나
남겨 두면 프로그램이 멈춥니다.
'''
hints = [
  "nums를 첫 스레드로 옮기기 전에 개수를 받아 두세요.",
  "두 번째 스레드 안의 for square in rx1은 1단계가 tx1을 드롭할 때 끝나는 수신 루프입니다.",
  "main의 rx2 루프는 두 번째 스레드가 끝날 때 끝나고, 그래서 그 뒤에 join해도 멈추지 않습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.async"
title = "async는 실제로 어디서 도는가"
story = "메이는 async Rust를 4년 동안 썼지만 그것을 움직이는 것을 단 한 번도 본 적이 없다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

여기에는 런타임이 없습니다 — tokio도, 크레이트도 전혀 없습니다. 실행기를
직접 쓰세요.

퓨처가 `Ready`가 될 때까지 poll하고 값**과 poll한 횟수**를 돌려주는
`block_on`을 완성하세요. 그다음 각 값에 대해 순서대로 `double(v)`를
await하며 결과를 하나씩 출력하는 `async` 블록을 `block_on`하고, `SUM <total>`과
`POLLS <k>`를 출력하세요.

`double`은 반환하기 전에 한 번 양보하므로 값마다 poll이 하나씩 더 듭니다:
`POLLS`는 `n + 1`입니다.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        POLLS 4
```

`async fn`은 `Future`를 구현하는 상태 기계이고, `.await`는 "안쪽 것을
poll한다; `Pending`이면 `Pending`을 돌려주고 어디까지 왔는지 기억한다"입니다.
무언가가 poll하기 전에는 아무것도 돌지 않습니다. 그 무언가는 서른 줄이고,
한 번 직접 써 보는 것이 다섯 번 읽는 것보다 값집니다.
'''
hints = [
  "Box::pin은 unsafe 없이 Pin<Box<F>>를 주고, .as_mut()이 그것을 poll이 원하는 Pin<&mut F>로 바꿉니다.",
  "Context::from_waker(&waker)가 의식의 전부입니다 — Waker는 진짜 런타임이 당신을 다시 스케줄할 때 쓰는 것입니다.",
  "이 실행기는 Pending에서 바쁜 루프를 돕니다. 진짜 실행기라면 waker가 울릴 때까지 스레드를 재울 텐데, 흥미로운 차이는 그것 하나뿐입니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.send-sync"
title = "왜 건너가지 못하는가"
story = "같은 코드, 같은 Vec, 단어 하나가 다르고, 둘 중 하나는 컴파일되지 않는다. 어느 단어인지, 왜인지 말하라."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

공유 합계 하나를 통해 스레드 둘로 나눠 합산한 뒤 출력하세요:

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

마지막 두 줄은 `assert_send`와 `assert_sync`가 핸들을 받아들일 때만
출력됩니다 — 그리고 그 두 함수는 실행 시점에는 아무것도 하지 않습니다.
`fn assert_send<T: Send>(_: &T) {}`입니다: 검사는 바운드이고, 컴파일 시점에
일어나거나 아예 일어나지 않습니다.

스타터는 컴파일되지 않고, 그 에러가 교훈입니다. `Rc`는 `Send`가 아닙니다.
참조 카운트가 원자적이지 않은 평범한 정수이기 때문입니다 — 두 스레드가
`Rc` 하나를 클론하면 거기서 경쟁하므로, 컴파일러는 `Rc`가 스레드 경계를
넘는 것을 아예 거부합니다. `Arc`는 카운트가 원자적인 같은 물건이고,
`Send`입니다.

`Sync`는 나머지 절반입니다: `&T`가 `Send`일 때 `T`는 `Sync`입니다.
`Mutex<T>`는 `T: Send`인 모든 `T`에 대해 `Sync`인데, 공유 접근을 안전하게
만드는 것이 바로 잠금이기 때문입니다.
'''
hints = [
  "에러는 E0277: `Rc<Mutex<i64>>` cannot be sent between threads safely입니다. 타입 이름 하나가 바뀌고, import 하나가 함께 바뀝니다.",
  "Rc의 참조 카운트는 평범한 usize이고 Arc의 것은 AtomicUsize입니다. 그 차이 하나가 한쪽은 Send이고 다른 쪽은 아닌 이유의 전부입니다.",
  "assert_sync(&*total)은 둘러싼 Arc가 아니라 Mutex 자체에 대해 묻습니다 — Mutex<T>는 T가 Send이면 언제나 Sync입니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.advanced.12.dispatch"
title = "지금이냐 나중이냐"
story = "같은 두 가게 정면, 같은 렌더링, 그리고 면접관은 두 철자를 한꺼번에 게시판에 올리기를 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `SHOP <NAME> <FLOOR>` 또는 `STOP <ROUTE>` 형식의
줄 `n`개입니다.

모든 표지판을 **두 번** 렌더링하세요: 한 번은
`render_static<T: Sign>(sign: &T)`를 통해, 한 번은
`render_dynamic(sign: &dyn Sign)`을 통해, 그 순서로 — 정적인 것 전부, 그다음
동적인 것 전부. 그다음 `Vec<Box<dyn Sign>>`의 길이 `DYNAMIC <k>`를 출력하세요.

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        HYSAN / F4
        TRAM 2
        SOGO / F1
        DYNAMIC 3
```

둘은 똑같은 텍스트를 내놓지만 같은 것이 아닙니다. `render_static`은
단형화됩니다: 컴파일러가 구체 타입마다 사본을 하나씩 찍어 내고 호출은
직접 호출이며 인라인될 수 있습니다 — 다만 타입이 **호출 지점에서** 알려져
있어야 하고, 그래서 정적 렌더링은 무엇을 만들었는지 아직 아는 파싱 분기
안에서 해야 합니다.

`render_dynamic`은 팻 포인터 — 데이터에 vtable을 더한 것 — 를 받아 메서드를
실행 시점에 찾아보고, 무엇을 들고 있는지 신경 쓰지 않습니다. `Vec` 하나가
둘 다를 담을 수 있는 유일한 이유가 그것입니다.
'''
hints = [
  "render_static은 구체 타입이 아직 보이는 곳에서 호출해야 합니다 — match 갈래 안, 값이 박싱되기 전.",
  "sign.as_ref()가 &Box<dyn Sign>을 &dyn Sign으로 바꿉니다. 박스 자체를 넘기면 deref가 한 번 더 필요합니다.",
  "두 함수의 본문은 같은 한 줄입니다. 차이는 전부 시그니처에, 그리고 전부 메서드 조회가 어디서 일어나는지에 있습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.interior-mutability"
title = "공유 참조를 통한 변경"
story = "문에 달린 카운터는 코드 네 군데가 그것을 보기만 하는 동안에도 올라가야 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

네 줄을 출력하세요:

1. `CELL <k>` — 값마다 한 번씩 올리고 `.get()`으로 읽어 온 `Cell<usize>`,
   전부 평범한 `&` 참조를 통해서
2. `REF <sum>` — 값들로 채운 뒤 합산한 장부
3. `RC <k>` — 장부는 `Rc<RefCell<Vec<i64>>>`이고 당신은 그것의 핸들을
   **둘** 들고 있습니다. 둘 다 살아 있는 동안 `Rc::strong_count`를 출력하세요
4. `DOUBLE panic` — 같은 `RefCell`에 `borrow_mut()`를 동시에 둘 잡으세요.
   일부러요. 그리고 그 패닉을 `std::panic::catch_unwind`로 잡으세요

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T`는 보통 아무도 바꿀 수 없다는 뜻입니다. `Cell`과 `RefCell`은 공인된
예외이고, 서로 다른 화폐로 그 값을 치릅니다: `Cell`은 값 전체를 통째로
넣고 빼기만 하므로 검사가 전혀 필요 없습니다. `RefCell`은 진짜 참조를
내주므로 빌림 규칙을 강제해야 합니다 — 컴파일 시점의 에러 대신 실행 시점의
패닉으로.

`Rc<RefCell<T>>`는 누구나 결국 손을 뻗는 조합이고, 각 절반이 무엇을 하는지
말할 수 있어야 합니다. `Rc`는 값에 소유자를 둘 이상 줍니다 — 원자적이지
않은 참조 카운트이므로 `Send`가 아니고 스레드를 건너지 않습니다
(`send-sync` 지도가 그것이었습니다). `RefCell`은 그 소유자들에게 변경할
권리를 줍니다. 어느 쪽도 `Mutex`가 아닙니다. 공유되면서 **동시에** 변경
가능한 것은 빌림 검사기가 컴파일 시점에 정확히 거부하는 것이므로, 이 패턴은
그것을 실행 시점에 되사 오고 틀리면 패닉을 물립니다.

그 패닉은 과제의 버그가 아닙니다. 그것이 치르는 값이고, 한 번 직접 보는
것이 핵심입니다.
'''
hints = [
  "Cell에는 borrow()가 없습니다: get()으로 복사본을 꺼내고 set()으로 값 전체를 넣습니다. 그래서 실행 시점 장부가 필요 없습니다.",
  "ledger.borrow_mut().push(v)를 한 문장으로 쓰면 가드가 세미콜론에서 드롭되고, 그것이 루프를 합법으로 유지합니다.",
  "catch_unwind는 클로저가 &RefCell을 캡처하므로 클로저 둘레에 AssertUnwindSafe가 필요합니다. 패닉 메시지는 여전히 stderr로 가고, 테스트는 그것을 읽지 않습니다.",
  "Rc::clone(&ledger)라고 쓰는 것은 .clone()이 아니라 그렇게 써야 읽는 사람이 Vec이 아니라 핸들을 복사한다는 것을 볼 수 있기 때문입니다. Rc::strong_count는 두 핸들이 살아 있는 동안 2를 읽고, 패닉 테스트의 두 borrow_mut()는 핸들 하나에서 하나씩 나와도 됩니다 — 같은 RefCell이고, 함께 셉니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "rust.advanced.14.custom-error"
title = "당신만의 에러"
story = "요금 서비스의 네 계층이 각자 자기 실패 타입을 만들어 냈고, 어느 것도 서로 변환되지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이고, 각 줄은 km 단위 거리여야 합니다.

`enum FareError { NotANumber, Negative(i64) }`를 정의하고, 거기에 `Display`와
`std::error::Error`를 구현하고, `?`가 스스로 변환하도록
`From<std::num::ParseIntError> for FareError`를 구현하세요.

`fare(text) -> Result<i64, FareError>`는 `?`로 파싱하고, 음수 거리를
거부하며, 그 외에는 `500 + 100 * km`를 돌려줍니다. 각 결과 또는 에러의
