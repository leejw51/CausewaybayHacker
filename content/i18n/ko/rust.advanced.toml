```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

스타터는 컴파일되지 않습니다. `?`는 단순히 전파만 하지 않습니다 — 나가는
길에 `From::from`을 호출하고, 그 impl이 없으면 `ParseIntError`에서 당신의
타입으로 가는 길이 없습니다. `From`을 구현하는 것이 `?`를 계층 경계 너머로
동작하게 하는 것이고, 에러 enum을 둘 가치가 있는 이유의 전부입니다.

`map_err`는 답의 나머지 절반으로, 타입을 변환하기보다 문맥을 붙이고 싶을
때 씁니다. 물어보면 언급하세요. 여기서는 필요 없습니다.
'''
hints = [
  "에러는 `?`에서 나는 E0277: the trait From<ParseIntError> is not implemented for FareError.",
  "여섯 줄: impl From<ParseIntError> for FareError에 FareError::NotANumber를 돌려주는 fn from.",
  "Display는 {}가 출력하는 것, Debug는 {:?}가 출력하는 것, Error 트레이트는 Box<dyn Error>에 들어갈 수 있게 하는 것입니다. 셋 다 가질 만하지만 여기서는 하나만 필요합니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.advanced.15.atomics"
title = "한 워드, 잠금 없이"
story = "개찰구 카운트에는 잠금이 필요 없다. 기계실의 다른 모든 것에는 필요하고, 그 둘을 가려내는 것이 일이다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 스레드를 하나씩 띄우세요. 각 스레드는 자기 값을 공유 `AtomicI64`에
더하고 공유 `AtomicUsize`를 하나 올립니다 — `Mutex`는 어디에도 없습니다.
전부 join하고 `TOTAL <sum>`과 `HITS <n>`을 출력하세요.

그다음: `main`의 **맨 위**에 `first`와 `second`라는 이름의 `Guard` 값 둘을
선언하고, 그 `Drop`이 `DROP <name>`을 출력하게 하세요. 이들은 `main`의 끝,
다른 모든 것 뒤에, 선언의 역순으로 실행됩니다.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
        DROP second
        DROP first
```

원자적 연산은 더 싼 뮤텍스가 아닙니다. 기계어 한 워드를 명령어 하나로
읽고-고치고-쓰기 위한 다른 도구입니다. 두 필드가 서로 맞아야 하는
순간 잠금이 돌아옵니다 — "이 두 가지를, 함께"를 위한 원자적 연산은
없습니다.

여기서는 `Ordering::Relaxed`로 충분합니다. 이 증가들이 다른 어떤 쓰기에
비해 *언제* 보이게 되는지에 아무것도 의존하지 않고, 하나도 잃어버리지
않는다는 것만 중요하기 때문입니다. 그 문장이 후속 질문이고, `Relaxed`가
뜻하는 것의 전부입니다.
'''
hints = [
  "fetch_add는 이전 값을 돌려주고 덧셈을 원자적으로 적용합니다. 잠금도 가드도 없습니다.",
  "Arc는 여전히 필요합니다 — 원자적 연산이 안전하게 만드는 것은 *접근*이지 *공유*가 아닙니다.",
  "Drop은 선언의 역순으로 실행되므로 `second`가 먼저 갑니다. _first와 _second로 바인딩하면 main 끝까지 살아 있습니다. 그냥 `_`로 두면 즉시 드롭됩니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.closure-kinds"
title = "세 종류의 클로저"
story = "면접관이 칠판에 `Fn`, `FnMut`, `FnOnce`를 쓰고 콜백은 어느 것이어야 하느냐고 묻는다. 정답이 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개이고, `n`은 1 이상입니다.

종류마다 클로저를 하나씩 쓰세요:

* `apply_fn<F: Fn(i64) -> i64>` — 첫 값을 복사로 캡처해서 모든 값에
  더합니다. 결과를 각각 출력하세요.
* `apply_fn_mut<F: FnMut(i64)>` — `main`에 사는 카운터를 올립니다.
  `SEEN <k>`를 출력하세요.
* `apply_once<F: FnOnce() -> String>` — 캡처에서 `String`을 **이동해
  꺼내** 돌려줍니다. `TAKEN <s>`를 출력하되, 문자열은 `<n> items`입니다.

```
input:  3
        10 20 30
output: 20
        30
        40
        SEEN 3
        TAKEN 3 items
```

세 트레이트는 메뉴가 아니라 계층입니다: 모든 `Fn`은 `FnMut`이고 모든
`FnMut`은 `FnOnce`입니다. 클로저가 무엇을 구현하는지는 캡처한 것으로
무엇을 *하느냐*로 정해집니다 — 읽으면 (`Fn`), 변경하면 (`FnMut`),
소비하면 (`FnOnce`) — 그리고 `move`는 어떻게 캡처하는지를 바꾸지, 어느
트레이트가 나오는지를 바꾸지 않습니다.

스타터는 컴파일되지 않습니다. `apply_once`가 `Fn`을 요구하는데, 자기
`String`을 내주는 클로저는 한 번만 호출될 수 있으므로 `FnOnce`이고 그 이상은
아닙니다. 호출 지점이 감당할 수 있는 가장 약한 바운드를 취하세요: 한 번만
호출한다면 `FnOnce`를 요구하세요. 그러면 다른 모든 클로저를 이유 없이
배제하지 않은 것입니다.
'''
hints = [
  "에러는 E0525: expected a closure implementing Fn, but this one only implements FnOnce입니다.",
  "단어 하나가 바뀝니다: apply_once의 바운드. 클로저는 이미 맞습니다.",
  "apply_fn_mut은 `mut f: F`를 받습니다 — 클로저가 자기 캡처를 변경하려면 매개변수 자체가 가변이어야 합니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.advanced.17.deadlock"
title = "교착"
story = "타임스 스퀘어 기계실, 두 층 아래. 잠금 둘, 스레드 둘, 그리고 에스컬레이터 두 대가 같은 순간에 멈췄다."
brief = '''
계좌 둘, `A`와 `B`, 각각 `Arc<Mutex<i64>>`입니다.

표준 입력은 첫 줄에 시작 잔액들, 둘째 줄에 개수 `n`, 그다음
`<FROM> <TO> <AMOUNT>` 형식의 줄 `n`개이고 `FROM`/`TO`는 `{A, B}` 중
하나입니다.

이체마다 자기 스레드에서 실행하고, 전부 join한 뒤 `A <balance>`,
`B <balance>`, `MOVED <n>`을 출력하세요.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

스타터에는 잘못된 것이 둘 있고, 출력에 드러나는 것은 그중 하나뿐입니다.
출금 계좌에서 빼고 입금 계좌에는 결코 넣지 않습니다 — 그것이 보이는
버그입니다. 다른 하나는 모양입니다: *출금 계좌를 먼저* 잠그면 반대 방향의
이체 둘이 각각 잠금 하나를 쥔 채 서로를 영원히 기다릴 수 있습니다.

두 잠금을 **항상 같은 전역 순서로** — 돈이 어느 쪽으로 가든 `A` 다음 `B` —
잡으면 순환은 생길 수 없습니다.
'''
hints = [
  "어느 쪽 잔액이든 건드리기 전에 두 계좌를 모두 잠그고, 항상 같은 순서로 잠그세요.",
  "어느 가드가 빼기를 받는지는 돈의 방향이 정하지, 어느 잠금을 먼저 잡았는지가 정하지 않습니다.",
  "두 가드는 transfer 끝에서 역순으로 드롭되고, 그건 괜찮습니다 — 중요한 것은 획득 순서입니다.",
]
