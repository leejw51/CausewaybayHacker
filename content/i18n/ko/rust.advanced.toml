[[quest]]
id    = "rust.advanced.04.mutex"
title = "서랍 하나, 손 여덟"
story = "두 계산대가 같은 서랍에서 현금을 꺼내 가고, 마감 때 서랍은 둘 모두와 맞지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 그 값을 **하나의 공유 합계**에 더하는 스레드를 하나씩 띄우세요. 전부
join한 뒤 `TOTAL <sum>`과 `THREADS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

스타터는 컴파일되지만 틀렸습니다: `i64`는 `Copy`이므로 `move` 클로저마다
자기만의 합계를 받아서 버렸습니다. 하나를 공유하고, 잠그세요.
'''
hints = [
  "Arc가 공유 소유이고 Mutex가 배타적 접근입니다. 둘 다, 그 순서로 필요합니다: Arc<Mutex<i64>>.",
  "루프 안, move 클로저 앞에서 Arc::clone(&total) — 그 클론이 각 스레드가 가져가는 것입니다.",
  "lock()의 가드는 값으로 deref됩니다. *guard += value, 그리고 가드는 스코프를 벗어날 때 잠금을 풉니다.",
]

