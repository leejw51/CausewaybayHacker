[[quest]]
id    = "rust.advanced.10.async"
title = "async는 실제로 어디서 도는가"
story = "메이는 async Rust를 4년 동안 썼지만 그것을 움직이는 것을 단 한 번도 본 적이 없다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

여기에는 런타임이 없습니다 — tokio도, 크레이트도 전혀 없습니다. 실행기를
직접 쓰세요.

퓨처가 `Ready`가 될 때까지 poll하고 값**과 poll한 횟수**를 돌려주는
`block_on`을 완성하세요. 그다음 각 값에 대해 순서대로 `double(v)`를
await하며 결과를 하나씩 출력하는 `async` 블록을 `block_on`하고, `SUM <total>`과
`POLLS <k>`를 출력하세요.

`double`은 반환하기 전에 한 번 양보하므로 값마다 poll이 하나씩 더 듭니다:
`POLLS`는 `n + 1`입니다.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        POLLS 4
```

`async fn`은 `Future`를 구현하는 상태 기계이고, `.await`는 "안쪽 것을
poll한다; `Pending`이면 `Pending`을 돌려주고 어디까지 왔는지 기억한다"입니다.
무언가가 poll하기 전에는 아무것도 돌지 않습니다. 그 무언가는 서른 줄이고,
한 번 직접 써 보는 것이 다섯 번 읽는 것보다 값집니다.
'''
hints = [
  "Box::pin은 unsafe 없이 Pin<Box<F>>를 주고, .as_mut()이 그것을 poll이 원하는 Pin<&mut F>로 바꿉니다.",
  "Context::from_waker(&waker)가 의식의 전부입니다 — Waker는 진짜 런타임이 당신을 다시 스케줄할 때 쓰는 것입니다.",
  "이 실행기는 Pending에서 바쁜 루프를 돕니다. 진짜 실행기라면 waker가 울릴 때까지 스레드를 재울 텐데, 흥미로운 차이는 그것 하나뿐입니다.",
]

