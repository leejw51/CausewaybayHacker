[[quest]]
id    = "rust.advanced.05.rwlock"
title = "읽는 이 여럿, 쓰는 이 하나"
story = "하이산 플레이스 안내판은 분당 삼백 번 읽히고 하루에 두 번 바뀌는데, 잠금은 그 차이를 모른다."
brief = '''
표준 입력은 개수 `n`, 그다음 단어 `n`개입니다.

`Arc<RwLock<HashMap<String, i64>>>`를 들고 있으세요. 단어마다 **쓰기**
잠금을 잡고 그 단어의 횟수를 올리는 스레드를 하나씩 띄우세요. 전부 join한
뒤 **읽기** 잠금을 한 번 잡아 `<word> <count>`를 단어순으로 정렬해 출력하고,
그다음 `TOTAL <sum>`을 출력하세요.

```
input:  3
        tram
        bus
        tram
output: bus 1
        tram 2
        TOTAL 3
```

스타터는 컴파일되지 않습니다. 읽기 잠금을 잡고 그것을 통해 쓰려고 하는데,
`RwLockReadGuard`는 `&mut`를 내주지 않습니다.
'''
hints = [
  "write()는 &mut로 deref되는 가드를 돌려주고, read()는 &로만 deref되는 가드를 돌려줍니다.",
  "Vec<(&String, &i64)>를 정렬하면 단어가 먼저 기준이 되고, 그것이 출력이 원하는 바입니다.",
  "읽기 가드는 순회하는 동안 바인딩에 붙들어 두세요. 아니면 임시값이 끝나기도 전에 드롭됩니다.",
]

