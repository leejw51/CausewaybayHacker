# RUST LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/rust/advanced.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, sample input and output and the exact strings a program
# must print are the English pack's and are copied verbatim, never translated.

pack   = "rust.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.advanced.01.threads"
title = "계산대 둘, 카운터 하나"
story = "타임스 스퀘어 지점은 정오에 두 번째 계산대를 열고, 줄이 마침내 움직인다. 가게의 다른 것은 아무것도 바뀌지 않았다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 제곱을 계산하는 스레드를 하나씩 띄우세요. **띄운 순서대로** join하고
결과를 한 줄에 하나씩 출력한 뒤 `THREADS <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

순서대로 join하기 때문에 출력이 매번 같습니다. 스레드가 각자 출력한다면
그렇지 않을 것입니다.
'''
hints = [
  "thread::spawn은 JoinHandle<T>를 돌려주고, T는 클로저가 반환하는 것입니다.",
  "join()은 Result<T, _>를 줍니다 — Err는 패닉이고, 여기서는 unwrap이 정직한 선택입니다.",
  "개수는 루프 전에 받아 두세요. Vec은 값으로 순회하면 소비됩니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.advanced.02.move"
title = "가지고 가라"
story = "알렉스는 유일한 전표에 적힌 주소를 라이더에게 건네고는, 카운터에 그것을 다시 읽어 달라고 한다."
brief = '''
표준 입력은 개수 `n`, 그다음 텍스트 줄 `n`개입니다.

줄마다 그 줄을 대문자로 바꿔 돌려주는 스레드를 하나씩 띄우세요. 순서대로
join해서 각각 출력한 뒤 `DONE`을 출력하세요.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

스타터는 컴파일되지 않습니다: 클로저가 `line`을 빌리는데, `thread::spawn`은
스레드가 얼마나 오래 돌지 전혀 모르므로 그 빌림이 스레드보다 오래 산다는
것을 증명할 수 없습니다. 스레드에 문자열의 뷰가 아니라 문자열 자체를
주세요.
'''
hints = [
  "에러는 E0373: closure may outlive the current function입니다.",
  "클로저 앞의 키워드 하나가 빌림을 소유로 바꿉니다.",
  "line은 이미 반복마다 새로 만든 String이므로, 넘겨줘도 비용이 없습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.advanced.03.channels"
title = "창구 하나, 라이더 여럿"
story = "라이더 마흔 명, 타임스 스퀘어 주방 뒤편의 배식구 하나. 모든 것이 배식구를 지나가고 배식구는 결코 막히지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 스레드를 하나씩 띄우세요. 각 스레드는 `(index, value * 10)`을
`mpsc` 채널 하나로 보냅니다. 메인 스레드는 전부 받아서 인덱스로 정렬하고
`<index> <value>`를 한 줄에 하나씩 출력한 뒤 `RECV <n>`을 출력합니다.

```
input:  3
        1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```

`rx`를 순회해서 받는 것은 **모든** 송신자가 드롭되어야 끝납니다 — `main`이
아직 들고 있는 것도 셉니다. 드롭하세요. 아니면 프로그램이 영영 끝나지
않습니다.
'''
hints = [
  "스레드마다 자기 Sender가 필요합니다: move 클로저 앞에서 tx.clone().",
  "루프 뒤에 drop(tx). 없으면 수신자는 main에 가만히 앉아 있는 송신자를 영원히 기다립니다.",
  "rx.iter()는 채널이 닫힐 때까지 값을 내므로 collect()가 수신 루프의 전부입니다.",
]

