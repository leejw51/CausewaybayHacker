[[quest]]
id    = "rust.advanced.04.strings"
title = "바이트는 글자가 아니다"
story = "타임스 스퀘어 안내판이 銅鑼灣을 세 글자에서 자르는데, 나오는 것은 한 글자 반이다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. **바이트** 단위 길이
2. **문자** 단위 길이
3. 문자 순서를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 문자가 들어 있을 수 있고, 그러면 앞의 두 숫자는 서로
다릅니다. 그것이 핵심입니다.
'''
hints = [
  "str::len은 바이트 길이입니다. 원래부터 그랬습니다.",
  "chars()는 스칼라 값을 하나씩 훑으므로 chars().count()가 다른 쪽 숫자입니다.",
  "chars().rev().collect::<String>()은 안전하게 뒤집습니다. 바이트를 뒤집으면 그렇지 않습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.advanced.05.structs"
title = "계산대"
story = "럭키 맥의 앞 계산대는 주문의 모든 줄을 한곳에 모아 둔다. 제안 텍스트가 구조체를 주석으로 바꿔 놓기 전까지는 그랬다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<ITEM> <CENTS>` 형식의 줄 `n`개입니다.

항목을 모아 두는 `Till`을 만들고, 각 항목을 들어온 순서대로 한 줄에 하나씩
`<ITEM> <CENTS>`로 다시 출력한 뒤, 마지막에 `TOTAL <sum>`을 출력하세요.

```
input:  2
        HASHBROWN 600
        SET 2800
output: HASHBROWN 600
        SET 2800
        TOTAL 3400
```

`n`은 `0`일 수 있으며, 그때는 `TOTAL 0` 한 줄만 출력합니다.
'''
hints = [
  "(String, i64)의 Vec이면 충분합니다. 구조체는 계산대가 자기 줄들을 스스로 소유하게 하려고 있는 것입니다.",
  "add는 계산대를 바꾸므로 &mut self를 받고, total은 읽기만 하므로 &self를 받습니다.",
  "&till.items를 순회하면 빌리는 것이고, 그게 원하는 바입니다 — 출력한다고 계산대가 비면 안 되니까요.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.advanced.06.enums"
title = "누가 타고 있나"
story = "코즈웨이베이 개찰구는 모든 카드에 성인 요금을 물린다. 성인이 아닌 카드에도, 카드가 아닌 것에도."
brief = '''
표준 입력은 개수 `n`, 그다음 `<TYPE> <KM>` 형식의 줄 `n`개입니다.

기본 요금은 `500 + 100 * KM` 센트입니다. 각 줄마다 다음 중 하나를 출력하세요:

* `ADULT` — 기본 요금
* `STUDENT` — 기본 요금의 절반, 정수 나눗셈
* `SENIOR` — 항상 `200`
* 그 밖의 것 — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

탑승자를 배리언트 네 개짜리 `enum`으로 모델링하되, 그중 하나는 인식되지
않은 태그를 담게 하고, 요금은 `match` 하나로 정하세요.
'''
hints = [
  "배리언트는 데이터를 담을 수 있습니다: Other(String)이 어디에도 맞지 않은 태그를 담습니다.",
  "&str에 대한 match의 마지막 갈래는 남은 전부를 바인딩합니다: `other => ...`.",
  "&Rider에 대해 match하면 Other 갈래에서 &String을 얻습니다 — format!은 그것으로 충분합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.advanced.07.maps"
title = "바자가 외치는 것"
story = "아홉 시의 자딘스 바자: 노점마다 뭔가를 외치고 있고, 간판은 순위를 원한다."
brief = '''
표준 입력 전체를 읽어 공백 기준으로 나누세요.

서로 다른 단어를 각각 한 번씩 `<word> <count>`로 출력하되, 횟수 내림차순으로
정렬하고, 횟수가 같으면 단어 오름차순으로 정하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```
'''
hints = [
  "*counts.entry(word).or_insert(0) += 1이 세는 루프의 전부입니다.",
  "HashMap에는 순서가 없습니다. 출력하기 전에 Vec으로 모으세요.",
  "Ordering::then이 동점 처리를 이어 줍니다: 횟수 내림차순, 그다음 단어 오름차순.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.advanced.08.errors"
title = "숫자가 아닌 줄"
story = "빅토리아 파크의 검침원이 숫자 열을 제출했는데, 그 한가운데에 누군가의 점심 주문이 끼어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수여야 합니다.

각 줄마다 값의 두 배를 출력하거나, 파싱되지 않으면 `BAD <line>`을
출력하세요. 마지막에 `SUM <total>`을 출력하되, total은 당신이 출력한
값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`?`를 쓰는 `fn double(text: &str) -> Result<i64, ParseIntError>`를 작성하고,
두 가지 결과는 `main`의 `match`로 처리하세요.
'''
hints = [
  "Result에 붙인 `?`는 에러를 함수 밖으로 대신 돌려보내므로, double의 본문은 두 줄입니다.",
  "match double(line)에는 갈래가 정확히 둘입니다. Ok(value)와 Err(_).",
  "SUM은 당신이 출력한 것의 합입니다 — 원래 값이 아니라 두 배로 만든 값.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.advanced.09.iterators"
title = "이워 스트리트 한 번에 통과"
story = "알렉스는 for 루프 세 개면 된다고 한다. 당신은 이워 스트리트의 교통을 겪어 봤다. 한 번에 지나가야 한다."
brief = '''
표준 입력은 공백으로 구분된 정수 한 줄입니다.

세 줄을 출력하세요:

1. 짝수 값들의 합 (없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로, 순서대로, 공백 하나씩으로 이어서 —
   없으면 `-`
3. 서로 다른 값의 개수

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

인덱스 루프 대신 이터레이터 어댑터 — `filter`, `map`, `sum`, `collect` —
를 쓰세요.
'''
hints = [
  "nums.iter()는 &i64를 내고 filter는 그것의 참조를 클로저에 건네므로 인자는 &&i64입니다. 본문에 별표가 몇 개 필요한지 짐작하지 말고 패턴에서 풀어내세요 — |&&n| n % 2 == 0.",
  "join에는 문자열이 필요하니, Vec<String>으로 collect하기 전에 각 숫자를 to_string()으로 map하세요.",
  "이터레이터에서 바로 만든 HashSet의 len()이 서로 다른 값의 개수입니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.str-and-string"
title = "첫 번째 질문"
story = "홍콩의 모든 Rust 면접은 이 질문으로 시작하고, 메이는 두 번이나 형편없이 답했다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. 공백으로 구분된 첫 단어를, **빌린** `&str`로 — 할당 없이,
   `to_string()` 없이
2. 그 단어를 대문자로 바꾼 것. 대문자 버전은 이미 존재하는 어떤 것의
   슬라이스도 아니므로 소유된 `String`이어야 합니다
3. 둘이 같으면 `SAME YES`, 아니면 `SAME NO`

```
input:  lucky mac
output: lucky
        LUCKY
        SAME NO
```

`&str`은 다른 누군가가 소유한 텍스트를 들여다보는 뷰입니다. `String`은
늘어날 수 있는 버퍼를 소유합니다. `first_word`는 뷰를 돌려주므로 반환
타입은 인자에서 빌려 오고 아무것도 할당하지 않습니다 — 그것이 그들이 정말로
묻고 있는 질문의 답 전부입니다.
'''
hints = [
  "split_whitespace().next()는 Option<&str>을 주고, 거기에 unwrap_or를 붙이면 빈 줄이 빈 단어가 됩니다.",
  "to_uppercase는 &str이 아니라 String을 돌려줍니다 — 결과가 입력의 일부가 아니므로 할당해야만 합니다.",
  "&str과 String은 바로 비교됩니다. 표준 라이브러리가 둘 사이의 동등 비교를 구현해 두었으므로 as_str()은 필요 없습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.combinators"
title = "unwrap 하나 없이"
story = "알렉스는 Rust 쪽은 온통 unwrap이라고 자꾸 말한다. 실패할 수 있는 부분에 unwrap을 하나도 쓰지 않고 열 읽기를 다시 써 보라."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이고, 각 줄은 정수여야 합니다.

각 줄마다 값의 두 배를 출력하거나, 파싱되지 않으면 `-1`을 출력하세요.
그다음 파싱된 개수 `SOME <k>`와, 처음으로 파싱된 값 `FIRST <v>` —
없으면 `FIRST NONE` — 을 출력하세요.

```
input:  3
        21
        xx
        -4
output: 42
        -1
        -8
        SOME 2
        FIRST 21
```

콤비네이터로 하세요: `.ok()`는 `Result`를 `Option`으로 바꾸고,
`.map(|v| v * 2)`는 값이 있을 때만 그 값에 작용하며, `.unwrap_or(-1)`은
없을 때의 답을 공급합니다. `find_map`이면 마지막 줄을 한 번에 얻습니다.

`unwrap()`도 파싱되는 줄에서는 "동작"하겠지만, 그러다 `xx`에서 프로그램
전체를 무너뜨립니다. `unwrap_or`는 패닉할 수 없습니다. 어느 것이 어느
것인지 아는 것이 이 과제입니다.
'''
hints = [
  "여기서는 parse::<i64>()에 터보피시가 필요합니다. 뒤쪽에서 컴파일러에게 타입을 고정해 주는 것이 아무것도 없기 때문입니다.",
  ".ok()는 에러를 일부러 버립니다 — 왜 실패했는지가 아니라 실패했다는 것만 보고하는 겁니다.",
  "find_map은 클로저가 Some을 돌려줄 때까지 실행되므로, 처음 파싱되는 줄에서 멈춥니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.advanced.12.matching"
title = "그것의 모양"
story = "배달 앱은 명령 네 개를 받는데, 옛 코드는 그것을 아홉 겹으로 중첩된 if로 검사했다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이고, 각 줄은 `<COMMAND>` 또는
`<COMMAND> <ARG>`입니다.

각 줄마다 출력하세요:

* `n`이 0보다 큰 `GO <n>`에는 `FORWARD <n>`
* `n`이 0 이하인 `GO <n>`에는 `STAY`
* `STOP`에는 `HALT`
* 그 밖의 것에는 `UNKNOWN <COMMAND>`

그다음 앞으로 간 거리의 합 `MOVED <total>`을 출력하세요.

```
input:  4
        GO 3
        GO -1
        STOP
        JUMP 9
output: FORWARD 3
        STAY
        HALT
        UNKNOWN JUMP
        MOVED 3
```

나눈 줄에 대한 `match` 하나, 그리고 `GO` 갈래에 **가드**를 달아 두 번째
분기 없이 두 경우를 가르세요. 슬라이스 패턴 — `["GO", arg]` — 으로
매칭하면 줄의 인자 개수가 손으로 쓴 길이 검사 대신 패턴의 일부가 됩니다.
'''
hints = [
  "parts.as_slice()가 Vec을 슬라이스 패턴으로 매칭할 수 있는 것으로 바꿔 줍니다.",
  "패턴 뒤의 `if`가 매치 가드입니다 — 모양이 같은 두 갈래를 갈라 줍니다.",
  "`[command, ..]`는 첫 요소를 바인딩하고 나머지는 무시합니다. `[]`는 여전히 처리해야 하는 빈 줄입니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.modules"
title = "누가 이것을 봐도 되는가"
story = "요금표가 파일 세 개로 새어 나갔고 그중 둘에서 고쳐졌다. 문 뒤에 넣어라."
brief = '''
표준 입력은 개수 `n`, 그다음 km 단위 거리 `n`개입니다.

요금 로직을 모듈로 정리하세요:

* **공개** `adult(km) -> i64`와, `adult`가 호출하는 **비공개** `base(km)`
  — `500 + 100 * km` — 를 가진 `mod fares`
* `50000`을 돌려주는 공개 `monthly() -> i64`를 가진 중첩 모듈 `mod fares::pass`

거리마다 성인 요금 하나씩 출력한 뒤 `MONTHLY <x>`를 출력하세요.

```
input:  3
        1 2 3
output: 600
        700
        800
        MONTHLY 50000
```

스타터는 컴파일되지 않습니다: 항목은 있지만 아무것도 `pub`이 아니고,
모듈의 내용물은 기본적으로 그 모듈 안에서만 보입니다. 그 기본값이 바로
기능입니다 — `base`는 인터페이스가 아니고, 그것을 그렇게 지켜 주는 것이
컴파일러입니다. 중첩 모듈은 안의 함수만이 아니라 `mod` 줄 자체에도 `pub`이
필요합니다.
'''
hints = [
  "에러는 E0603: 항목은 존재하지만 비공개일 뿐입니다. pub 키워드 세 개면 파일 전체가 고쳐집니다.",
  "base는 일부러 비공개로 둡니다 — 여기서 다른 누구와도 상관없는 유일한 것입니다.",
  "함수를 공개로 만든다고 문이 공개되지는 않습니다: `mod pass`에도 pub이 필요합니다.",
]

