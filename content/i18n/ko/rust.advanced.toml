[[quest]]
id    = "rust.advanced.06.lifetimes"
title = "그건 언제까지 유효한가"
story = "출발 안내판은 시간표의 복사본이 아니라 뷰를 들고 있는데, 시간표가 언제 버려지는지는 아무도 적어 두지 않았다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다.

입력에서 **빌린** `&str` 슬라이스를 들고 있는 `Board`를 만드세요 —
`String` 없이, 복사 없이 — 그리고 `longest()`(동점이면 앞 줄이 이김)와
`bytes()`를 주세요.

가장 긴 줄, 그다음 줄 수, 그다음 그 줄들의 총 바이트 길이를 출력하세요.

```
input:  3
        tram
        percival street
        mtr
output: percival street
        3
        22
```

스타터는 컴파일되지 않습니다: 참조를 들고 있는 구조체는 그 참조가 언제까지
유효한지 말해야 합니다. 그것이 E0106이고, 고치는 법은 구조체에, `impl`에,
그리고 `longest`가 돌려주는 것에 수명 매개변수를 다는 것입니다.
'''
hints = [
  "struct Board<'a> { lines: Vec<&'a str> } — 구조체가 이제 수명에 대해 제네릭입니다.",
  "impl<'a> Board<'a> — 타입 매개변수와 마찬가지로 쓰기 전에 선언하세요.",
  "longest는 &str이 아니라 &'a str을 돌려줍니다: 답은 self의 빌림보다 오래 살고, 입력에 속합니다.",
]

