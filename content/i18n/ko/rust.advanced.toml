  "next는 남은 것이 없으면 None을 돌려주고, 그 None이 for 루프를 끝내는 것입니다.",
  "나아가기 전에 돌려줄 값을 먼저 저장하세요. 아니면 한 걸음 어긋납니다.",
  "left가 카운트다운입니다. 값을 하나 내줄 때마다 줄이세요.",
