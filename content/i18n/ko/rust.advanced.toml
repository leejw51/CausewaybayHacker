[[quest]]
id    = "rust.advanced.14.smart-pointers"
title = "컴파일러가 말할 수 있는 크기"
story = "럭키 맥의 전표 꽂이: 전표마다 그 아래 전표에 꽂혀 있고, 계산대까지 죽 이어진다."
brief = '''
표준 입력은 개수 `n`, 그다음 센트 단위 금액 `n`개입니다.

금액 하나에 노드 하나씩, 들어온 순서대로 사슬로 들고 있으세요:

```
struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}
```

세 줄을 출력하세요:

1. 금액들을 순서대로 공백으로 구분해서, 없으면 `-`
2. 사슬 위를 도는 **재귀** 함수로 구한 `SUM <total>`
3. 마지막 노드의 금액 `LAST <cents>` — 없으면 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

스타터는 컴파일되지 않고, 그 에러가 바로 `Box`가 존재하는 이유입니다.
`next: Option<Entry>`라고 쓰면 컴파일러는 `Entry`를 메모리에 배치해야
합니다: `cents`에 `8`바이트, 거기에 `Entry`의 크기만큼 — 그런데 그 크기가
바로 지금 알아내려는 것입니다. E0072, *recursive type has infinite size*.

`Box<Entry>`는 힙 할당을 가리키는 포인터이고, 포인터의 크기는 컴파일러가
이미 압니다. 가리키는 것을 소유합니다: 소유자는 정확히 하나, `Box`가
드롭될 때 해제되며, 세지도 않고 공유되지도 않습니다. `Option<Box<Entry>>`는
사슬의 끝이자 사슬 속 노드를 포인터 크기 값 하나로 나타냅니다 — `None`은
별도의 태그 바이트가 아니라 null 주소로 저장되므로 `Box` 하나보다 더 드는
비용이 없습니다.
'''
hints = [
  "컴파일 에러는 한 단어로 고쳐집니다: Option<Entry>를 Option<Box<Entry>>로 바꾸고, 생성자에 Box::new를 더하세요.",
  "뒤에서 앞으로 만드세요 — 금액을 거꾸로 순회하며 새 노드마다 이미 갖고 있던 사슬을 next로 주세요. 앞에서 뒤로 만들려면 꼬리를 가리키는 커서가 필요한데, 그것은 아직 겪을 필요 없는 빌림 싸움입니다.",
  "소비하지 않고 걸어가려면 Option<&Box<Entry>>를 들고 있으세요: 시작은 head.as_ref(), 한 걸음은 entry.next.as_ref(). .as_ref()는 &Option<T>를 Option<&T>로 바꾸며, 그것이 사슬을 온전히 지키는 수입니다.",
  "재귀 합에는 mut도 루프도 필요 없습니다: Some(entry) => entry.cents + sum(&entry.next), None => 0.",
]

