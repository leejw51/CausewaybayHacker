[[quest]]
id    = "rust.advanced.08.iterator"
title = "당신만의 for 루프"
story = "전차는 사우케이완에서 케네디 타운까지 모든 정류장을 나열하지만, 그 목록을 어디에도 보관하지 않는다."
brief = '''
표준 입력은 정수 세 개입니다: `start`, `step`, `count`.

`Stops`에 `Iterator`를 구현해서 `start`에서 시작해 `step`씩 나아가는 값을
