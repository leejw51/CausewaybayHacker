[[quest]]
id    = "rust.advanced.07.generics"
title = "한 번만 써라"
story = "알렉스는 largest를 네 번 썼다 — 요금용, 분 단위용, 라이더용, 정류장 이름용 — 그리고 다섯 번째가 교대 끝나기 전까지다."
brief = '''
표준 입력은 두 줄입니다: 첫 줄에 정수들, 둘째 줄에 단어들.

둘 모두에 동작하는 **하나의** `largest`와, `larger()`와 `smaller()`를 가진
제네릭 `Pair<T>`를 작성하세요.

가장 큰 정수, 가장 큰 단어, 그다음 처음 두 정수로 만든 `Pair`에 대해
`PAIR <larger> <smaller>`를 출력하세요. 동점이면 `a`가 더 큰 것으로 칩니다.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

스타터는 컴파일되지 않습니다: `largest`가 `i64`에 못 박혀 있어서 단어를
넘기면 E0308입니다.
'''
hints = [
  "largest<T: PartialOrd + Copy> — 비교하려면 PartialOrd, 루프가 슬라이스에서 값을 꺼내 오므로 Copy.",
  "&str은 Copy이고 PartialOrd이므로 같은 함수가 단어 목록을 그대로 받습니다.",
  "바운드는 구조체가 아니라 impl 블록에 붙습니다: impl<T: PartialOrd> Pair<T>.",
]

