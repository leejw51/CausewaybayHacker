[[quest]]
id    = "python.basic.07.structs"
title = "가판대 하나, 필드 셋"
story = "두부 가판대 카드에는 이름, 가격, 개수가 있는데, 계산기는 카드를 낱말 셋으로 읽고 아무것도 더하지 않는다."
brief = '''
`class`는 필드와 그것을 다루는 함수를 묶습니다. `__init__`은 객체가 만들어질 때
실행되어 필드를 `self`에 저장하고, 다른 메서드는 `self`를 첫 인자로 받아 그것을
통해 필드를 읽습니다. `this`는 없습니다 — 객체는 매개변수 목록의 첫 이름이
무엇이든 그것입니다.

```
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        return self.price * self.qty
```

`Stall`과 그 `__init__`은 적혀 있습니다. `total`의 `return` 줄을 보이는 그대로
입력하세요.

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty — 필드는 self에 살므로 메서드 안에서는 self.price와 self.qty입니다.",
  "total() 안에서 price 홀로는 이름이 아닙니다. 넘어오는 것은 self뿐입니다.",
]

