[[quest]]
id    = "python.basic.10.exceptions"
title = "숫자가 아닌 줄"
story = "생선 노점의 저울이 무게를 한 열로 찍어 내는데, 그 한가운데에 누군가의 전화번호가 들어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개입니다. 각 줄은 정수여야 합니다.

각 줄에 대해 값의 두 배를, 또는 파싱되지 않으면 `BAD <line>`을 출력하세요.
마지막으로 `SUM <total>`을 출력하세요. total은 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")`는 `ValueError`를 일으킵니다. 파이썬이 변환 실패를 알려 주는 방법은
그것뿐입니다 — `Result`도 없고 `(value, ok)`도 없습니다. 실패는 예외이고,
숫자를 기대했던 코드가 `try`/`except ValueError`로 그것을 어떻게 할지 말해야
합니다.

`Exception`이 아니라 **`ValueError`**를 잡으세요. 빈 `except:`는
`KeyboardInterrupt`와 당신 코드의 오타까지 삼켜 버리며, 프로그램이 조용히
실패하는 법을 배우는 길이 바로 그것입니다.
'''
hints = [
