[[quest]]
id    = "python.basic.11.sets"
title = "서로 다른 가격"
story = "과일 가판대는 아침 내내 같은 가격 셋을 외치고, 게시판은 외침이 몇 번이었는지가 아니라 서로 다른 가격이 몇 개였는지 알고 싶어 한다."
brief = '''
`set`은 각 값을 한 번만 담고, 값으로 고쳐집니다: `.add(x)`는 값을 넣고, `.discard(x)`는 값을
빼며(없었으면 아무것도 안 하고), "이 값을 바꿔라"는 없습니다 — 집합은 한 값을 지우고 다른
값을 넣어서 수정합니다, `.remove(a); .add(b)`. 집합은 자체 순서를 지키지 않으므로
`sorted(seen)`으로 보여 주는데, 그것이 네 번째 줄입니다.

```
seen.add(100)
seen.discard(first)
seen.remove(100); seen.add(101)
print(*sorted(seen))
```

`seen`은 한 줄의 서로 다른 정수들을 담고, `first`는 첫 번째이며, 각 수정 뒤에 `len(seen)`이
출력됩니다. 네 개의 `# FILL` 자리 표시자 대신 네 줄을 그 순서대로 입력하세요.

```
input:  8 3 8 5 3
output: 4
        3
        3
        3 5 101
```
'''
hints = [
  "seen.add(100), 다음 seen.discard(first), 다음 seen.remove(100); seen.add(101), 다음 print(*sorted(seen)) — 자리 표시자마다 하나씩, 그 순서로.",
  "discard는 없는 값을 무시하고, remove는 KeyError를 냅니다. sorted(seen)은 리스트이고, * 가 그것을 print에 펼칩니다.",
]

