id    = "python.basic.09.vector"
title = "아침 목록"
story = "달걀 가판대가 아침 가격을 하나씩 외치는데 공책에는 목록 대신 빈칸 넷이 있다: 몇 개, 첫 번째, 마지막, 합계."
brief = '''
리스트는 제자리에서 고쳐집니다. `.append(x)`는 끝에 값을 추가하고, `del xs[i]`는 인덱스의
