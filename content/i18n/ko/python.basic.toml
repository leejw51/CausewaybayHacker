[[quest]]
id    = "python.basic.07.dicts"
title = "시장이 외치는 것"
story = "일곱 시의 보링턴 로드: 노점마다 뭔가를 외치고, 캐널 로드 쪽 끝의 안내판은 순위를 원한다."
brief = '''
표준 입력 전체를 읽어 공백 기준으로 나누세요.

서로 다른 단어마다 한 번씩 `<word> <count>`로 출력하되, 횟수 내림차순으로,
횟수가 같으면 단어 오름차순으로 정렬하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

딕셔너리는 삽입 순서를 기억하지만, 그것은 당신이 원하는 순서가 아닙니다.
`sorted`에 튜플을 돌려주는 `key`를 주면 첫 원소로 정렬하고 두 번째 원소로
동률을 가르며, 횟수에 음수를 붙이는 것이 한 필드는 내림차순으로, 다른 필드는
오름차순 그대로 두는 방법입니다.
'''
hints = [
  "스타터는 첫 단어에서 KeyError로 죽습니다: counts[word] += 1 은 쓰기 전에 읽는데, 읽을 것이 없습니다. counts.get(word, 0) 이 0을 채워 줍니다.",
  "sorted(counts.items(), key=...) 는 (word, count) 쌍을 요청한 순서로 줍니다. 딕셔너리 자체는 삽입 순서 그대로입니다.",
  "key=lambda item: (-item[1], item[0]) — 횟수 내림차순, 그다음 단어 오름차순, 튜플 하나로.",
]

