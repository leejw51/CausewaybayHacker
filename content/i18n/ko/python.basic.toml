[[quest]]
id    = "python.basic.08.sets"
title = "두 노점에 다 있는 것"
story = "통로 양쪽에 채소 노점이 하나씩. 젖은 바닥을 두 번 건너지 않고 어느 쪽에서든 살 수 있는 게 뭔지 알고 싶은 손님."
brief = '''
표준 입력 두 줄, 각 줄은 한 노점의 물건을 공백으로 구분한 것입니다. 한 노점이
같은 것을 두 번 적을 수 있으며, 그것은 한 번으로 셉니다.

세 줄을 출력하세요:

1. `BOTH` 뒤에 두 목록에 모두 있는 것 전부를 정렬해서 공백으로 구분 — 없으면
   `BOTH -`
2. `ONLY_A <k>`: 첫 목록에는 있고 둘째 목록에는 없는 것의 수
3. `ALL <k>`: 어느 한쪽에라도 있는 서로 다른 것의 수

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set`에는 중복도 순서도 없고, `&`, `-`, `|`가 세 가지 연산입니다. 집합에
`sorted`를 쓰면 리스트가 나오며, 집합을 정해진 순서로 출력하는 방법은 그것뿐입니다.
'''
hints = [
  "set(input().split()) 은 토큰에서 바로 집합을 만듭니다. 중복된 tofu는 들어오는 길에 사라집니다.",
  "a & b 는 교집합, a - b 는 차집합, a | b 는 합집합입니다. 각각의 len이 개수입니다.",
  "\" \".join(sorted(both)) 에는 문자열이 필요한데 — 이미 문자열입니다 — `if both else \"-\"` 가 빈 경우를 표현식 하나로 처리합니다.",
]

