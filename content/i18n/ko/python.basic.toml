[[quest]]
id    = "python.basic.06.strings"
title = "바이트는 글자가 아니다"
story = "SOGO 지하 안내판이 銅鑼灣을 3바이트에서 잘라 글자 하나와 물음표 하나를 찍는다."
brief = '''
한 줄을 읽으세요. 세 줄을 출력하세요:

1. UTF-8로 인코딩했을 때의 **바이트** 길이
2. **문자** 길이
3. 문자 순서를 뒤집은 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 문자가 들어 있을 수 있고, 그러면 앞의 두 숫자는 같지
않습니다. 파이썬의 `str`은 코드 포인트의 시퀀스이므로 `len`은 문자 수입니다.
바이트를 얻으려면 `.encode("utf-8")`로 직접 요청해야 하고, **그것**의 `len`이
다른 숫자입니다.

`s[::-1]`은 문자열을 뒤집습니다. 스텝이 `-1`인 슬라이스이며, 어떤 시퀀스에도
통합니다.
'''
hints = [
  "len(line) 은 문자 수입니다. len(line.encode(\"utf-8\")) 은 바이트 수입니다. 스타터는 틀린 쪽을 먼저 출력합니다.",
  "line[::-1] 이 뒤집기의 전부입니다. str을 슬라이스하면 str이 나옵니다.",
  "바이트 문자열을 뒤집으면 멀티바이트 문자가 반으로 잘리지만, str을 뒤집으면 그렇지 않습니다. str 안에는 바이트가 없으니까요.",
]

