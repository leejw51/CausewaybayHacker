  "xs.append(100), 다음 del xs[0], 다음 xs[0] = 7, 다음 xs.sort() — 자리 표시자마다 하나씩, 그 순서로.",
  "del은 값이 아니라 인덱스를 받습니다; xs.sort()는 제자리에서 정렬하고 None을 돌려주니 대입하지 마세요.",
