```

이 줄이 보스입니다. 절대 버그를 가리키지 않습니다. `None`이 마침내 *사용된*
자리를 가리키는데, 그곳은 `None`이 *만들어진* 자리에서 얼마든지 멀 수 있습니다
— 그리고 스타터에서는 서로 다른 두 곳에서 만들어졌습니다. `lookup`은 없는
노점에 대해 의도적으로 `None`을 돌려주는데, 호출자는 묻지도 않고 거기서
