[[quest]]
id    = "python.basic.05.lists"
title = "줄 한가운데"
story = "SOGO 지하 로스트 구스 카운터 앞에 마흔 명이 줄을 선다. 카운터에서는 줄의 맨 앞과 맨 뒤만 보이고 그 사이는 하나도 보이지 않는다."
brief = '''
표준 입력은 첫 줄에 개수 `n`, 둘째 줄에 공백으로 구분된 정수 `n`개입니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 있는(둘을 제외한) 모든
값의 합. 값이 셋보다 적으면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]`이 가운데입니다. 슬라이스이고, **새 리스트**입니다 — 파이썬은
슬라이스할 때 복사합니다. Rust의 슬라이스나 Go의 서브슬라이스와는 다릅니다.
`nums[-1]`은 마지막 원소이고, 음수 인덱스야말로 파이썬에서 절대
`nums[len(nums) - 1]`을 쓰지 않는 이유입니다.

값이 하나면 `nums[1:-1]`은 비어 있고 그 `sum`은 `0`이므로, 다른 언어에서
필요한 방어 코드가 여기서는 공짜입니다. 알아 둘 만한 사실이고, 짐작하기보다
확인해 볼 만한 사실입니다.
'''
hints = [
  "nums[-1] 은 마지막 원소이고, nums[-2] 는 그 앞 원소입니다.",
  "nums[1:-1] 은 첫 번째와 마지막을 제외한 전부이고, 빈 슬라이스의 합은 저절로 0입니다.",
  "sys.stdin.read().split() 은 전체를 한 번에 읽고 아무 공백에서나 나누므로 줄바꿈은 상관없어집니다.",
]

