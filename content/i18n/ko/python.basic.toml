hints = [
  "스타터는 세 번째 print에서 죽습니다: TypeError, can't multiply sequence by non-int of type 'str'. 메시지를 읽으세요. n이 무엇인지 알려 주고 있습니다.",
  "int(input()) 은 읽으면서 바로 변환합니다. int() 는 앞뒤 공백도 알아서 떼어 줍니다.",
  "음수 n을 제곱하면 양수입니다. 테스트는 그것을 알고 있습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.basic.03.conversions"
title = "세 모양, 이름 하나"
story = "생선 노점의 장부는 가격을 글자로, 숫자로, 달러로 적어 두고서 셋 다 price라고 부른다."
brief = '''
한 줄을 읽으세요: 센트 단위의 금액이 숫자로 적혀 있습니다.

세 줄을 출력하세요:

1. 공백을 뗀 텍스트의 글자 수
2. 금액을 숫자로
3. 금액을 소수점 아래 정확히 두 자리의 달러로

```
input:  1234
output: 4
        1234
        12.34
```

금액은 음수가 아닙니다. **이름 하나**를 세 번 다시 묶어서 하세요 — `str`,
그다음 `int`, 그다음 다시 `str`. 파이썬은 이름 하나가 무엇이든 담고 마음을
바꾸도록 허용합니다. 그 대가는, 지금 `cents`가 무엇인지 알려 주는 것은 바로 위의
코드를 읽는 것뿐이라는 점입니다.

달러를 만들 때 `float`를 거치지 마세요. `1234 / 100`은 오늘은 `12.34`이지만
`0.1 + 0.2`는 매일 `0.30000000000000004`입니다. 정수 나눗셈과 나머지 연산이
두 부분을 정확하게 주고, `f"{cents % 100:02d}"`가 뒷부분을 채워 줍니다.
'''
hints = [
  "cents가 아직 문자열일 때의 len(cents) 가 첫 줄입니다.",
  "cents = int(cents) 는 제자리 변환이 아닙니다. 새 값을 옛 이름에 묶는 것입니다. 그 뒤로 문자열은 사라집니다.",
  "f-string 안의 :02d 는 너비 2, 0으로 채움, 십진수입니다. 5센트는 0.05이지 0.5가 아닙니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.basic.04.control-flow"
title = "몇 번 통로"
story = "시장 통로 번호는 바닥에 칠해져 있고, 입구의 안내판은 각 통로에서 무엇을 파는지 알려 줘야 한다. 그런데 매번 번호만 적혀 있다."
brief = '''
정수 `n` 하나를 읽으세요. `1`부터 `n`까지의 모든 `i`에 대해 한 줄씩 출력하세요:

* `i`가 3과 5 둘 다로 나누어떨어지면 `FISHVEG`
* `i`가 3으로 나누어떨어지면 `FISH`
* `i`가 5로 나누어떨어지면 `VEG`
* 그 외에는 `i` 자체

그다음 `0`을 읽을 때까지 한 줄에 하나씩 정수를 계속 읽고, 그동안 읽은 0이 아닌
줄의 수를 `SKIPPED <k>`로 출력하세요.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

루프 두 개, 종류도 두 가지. 첫 번째는 시작하기 전에 몇 번 돌지 알고 있습니다:
`for i in range(1, n + 1)`. 두 번째는 모릅니다: `while True`에 `break`.
횟수는 무엇을 읽느냐에 따라 정해지니까요. 파이썬의 `range`는 끝 값 **앞에서**
멈추며, `range(1, n)`은 누구나 여기서 한 번은 저지르는 하나 차이 실수입니다.
'''
hints = [
  "둘 다인 경우를 먼저 검사하세요. 아니면 절대 걸리지 않습니다. 3과 5로 나누어떨어지면 15로 나누어떨어집니다.",
  "range(1, n) 은 n - 1에서 멈춥니다. 스타터에 그 버그가 있습니다. 샘플 출력이 한 줄 일찍 끝납니다.",
  "while True에 break는 파이썬이 출구가 중간에 있는 루프를 적는 방법입니다. do-while은 없습니다.",
]

