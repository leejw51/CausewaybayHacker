  "return min(rides, 10) * 5 + max(rides - 10, 0) * 3 — min은 싼 탑승을 열 번에서 자르고, max는 나머지가 음수가 되지 않게 합니다.",
  "함수의 일은 return에서 끝납니다. 본문에서 그 뒤의 것은 실행되지 않습니다.",
