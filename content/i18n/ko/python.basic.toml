title = "여섯 시"
story = "06:00, 보링턴 로드. 셔터가 올라가고 바닥은 이미 젖어 있는데, 오늘 첫 가격판은 비어 있다."
brief = '''
정확히 다음을 출력하세요:

```
hello, causewaybay
```

소문자, 쉼표 하나, 공백 하나, 한 줄. 그 외에는 아무것도 없어야 합니다.

`print`는 줄바꿈을 알아서 붙입니다. 인자 사이에 공백도 알아서 넣는데, 이것이
사람들이 `print`에서 가장 먼저 틀리는 부분입니다: `print("hello,",
"causewaybay")`는 괜찮지만, `print("hello, ", "causewaybay")`에는 공백이
두 개 들어갑니다.
'''
hints = [
  "print(\"hello, causewaybay\") 가 프로그램의 전부입니다.",
  "문자열은 정확해야 합니다: 소문자, 쉼표 하나, 그 뒤 공백 하나.",
  "맨 아래의 `main()` 호출은 그대로 두세요. 한 번도 호출되지 않는 함수는 아무것도 출력하지 않고, 스타터가 딱 그 상태입니다.",
]

