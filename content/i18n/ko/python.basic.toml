[[quest]]
id    = "python.basic.02.price-board"
title = "가격판"
story = "두부 노점의 가격판에는 숫자 하나만 있고, 두 모 가격과 한 판 가격이 있던 자리는 두 칸 모두 비어 있다."
brief = '''
표준 입력에서 정수 `n` 하나를 읽으세요.

세 줄을 출력하세요: `n`, 그다음 `n`의 두 배, 그다음 `n`에 `n`을 곱한 값.

`n`은 음수일 수 있습니다. 크기는 파이썬이 알아서 감당합니다. 파이썬 정수에는
