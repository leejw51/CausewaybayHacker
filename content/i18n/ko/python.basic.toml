id    = "python.basic.05.loops"
title = "봉지 세기"
story = "봉지 가판대는 매일 아침 비닐봉지에 1부터 n까지 번호를 매기고, 몇 개가 나갔고 어느 것이 세 번째마다 공짜였는지의 집계는 숫자 아래 빈 줄이다."
brief = '''
`for` 루프는 시퀀스를 걷고, `range`는 그것을 필요할 때 만듭니다.
`range(1, n + 1)`은 `1`부터 `n`까지 포함해 셉니다 — 끝 값은 절대 포함되지
않으므로 원하는 마지막 숫자보다 하나 크게 씁니다.

```
for i in range(1, n + 1):
    total += i
    if i % 3 == 0:
        threes += 1
```

`n`은 읽혀 있고, `total`과 `threes`는 `0`에서 시작하며, 루프 본문은 적혀
있습니다. 본문 위에 `for` 줄을 보이는 그대로 입력하세요.

```
input:  10
output: 55
        3
```
'''
hints = [
  "for i in range(1, n + 1): — range는 두 번째 인자 앞에서 멈추므로 n + 1이어야 n이 마지막 값이 됩니다.",
  "range(n)은 0부터 n - 1까지 셉니다. 합이 n만큼 모자라게 됩니다.",
]

