[[quest]]
id    = "python.basic.10.maps"
title = "집계 공책"
story = "채소 가판대의 모든 판매는 단어 하나로 공책에 들어가고, 09:00에 상인은 채소마다 개수가 적힌 한 줄을 원하는데, 페이지는 외친 순서대로의 단어들뿐이다."
brief = '''
dict는 키로 고쳐집니다. `counts[k] = v`는 키 아래에 값을 저장하고 — 새 키는 추가되고, 있는
키는 덮어써집니다 — `del counts[k]`는 키와 값을 지우고, `counts[k] += n`은 키의 값을 읽어
바꿔서 되씁니다. dict는 삽입 순서를 지킵니다; `sorted(counts)`는 키를 오름차순으로 돌려주므로,
그렇게 출력하는 루프에 씁니다. 집계는 만들어져 있고, 이 네 줄이 그것을 바꾼 뒤 정렬합니다.

```
counts["tofu"] = 1
del counts[first]
counts["tofu"] += 4
for k in sorted(counts):
```

`counts`는 단어별 개수를 담고, `first`는 줄의 첫 단어이며, `show(counts)`가 각 수정 뒤에
삽입 순서로 집계를 출력합니다. 세 개의 `# FILL` 자리 표시자 대신 세 수정을 입력하고,
마지막 루프의 헤더를 정렬된 것으로 바꾸세요.

```
input:  siu mai har gau siu mai
output: siu=2 mai=2 har=1 gau=1 tofu=1
        mai=2 har=1 gau=1 tofu=1
        mai=2 har=1 gau=1 tofu=5
        gau 1
        har 1
        mai 2
        tofu 5
```
'''
hints = [
  "counts[\"tofu\"] = 1, 다음 del counts[first], 다음 counts[\"tofu\"] += 4, 다음 마지막 루프의 헤더로 for k in sorted(counts):.",
  "sorted(counts)는 키를 오름차순으로; 루프 본문 print(k, counts[k])는 이미 있습니다.",
]

