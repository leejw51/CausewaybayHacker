story = "차찬텡에서 더치페이: 총액을 영수증에서 읽은 뒤 반으로 나눈다 — 그리고 홀수 총액은 공평하게 반으로 나눌 수 없다."
brief = '''
`parsed: Result<u32, String>`은 파싱된 총액이고,
`fn half(n: u32) -> Result<u32, String>`은 홀수에서 실패합니다. `r`은
절반이거나, 먼저 나온 에러여야 합니다 — `"8"`은 `Ok(4)`, `"7"`은
`Err("7 is odd")`가 됩니다.

```
let r: Result<u32, String> = ____;
```

빈칸을 채우는 식은 어느 것일까요?
'''
hints = [
  "그 단계 자체가 Result를 반환합니다. 그것으로 값을 변환하면 Result 안에 Result가 중첩되고, 체이닝은 둘을 하나로 평평하게 만듭니다.",
]

# ---------------------------------------------------------------- 55
[[quest]]
id    = "rust.cheatsheet_advanced.55.map-err-variant"
title = "에러 타입이 다르다"
story = "하이산 플레이스 영화관의 예매 시스템에는 자체 에러 enum이 있는데, 티켓 파서는 그 말을 하지 못한다."
brief = '''
`enum MyErr { Parse(ParseIntError), Missing }`에는 `From` impl이 없습니다.
`fn seats(s: Option<&str>) -> Result<u32, MyErr>` 안에서 `s`는 이미
`&str`로 unwrap되어 있습니다. 그것을 `u32`로 파싱하고, 잘못된 파싱은
`MyErr::Parse(e)`로 바꾸세요.

```
let n = ____;
Ok(n)
```

빈칸을 채우는 식은 어느 것일까요?
'''
hints = [
  "튜플 구조체 형태의 enum variant는 이미 그 필드에서 enum으로 가는 함수이므로, 클로저가 필요한 자리에 넘길 수 있습니다 — 호출하지도, 감싸지도 않고.",
]

# ---------------------------------------------------------------- 56
[[quest]]
id    = "rust.cheatsheet_advanced.56.result-has-no-filter"
title = "Result에는 filter가 없다"
story = "빅토리아 공원 입구의 인원 계수기는 숫자나 고장을 보고한다. 0이라는 수치는 계수기가 한 번도 눌리지 않았다는 뜻이다."
brief = '''
`r: Result<u32, ParseIntError>`. `v`는 `r`이 `n > 0`인 `Ok(n)`일 때
`Some(n)`, 그 외에는 `None`이어야 합니다 — 파싱 에러일 때도, 0일 때도.

```
let v: Option<u32> = ____;
```

빈칸을 채우는 식은 어느 것일까요?
'''
hints = [
  "테스트를 통과할 때만 값을 남기는 것은 Option의 메서드입니다. Result에는 그런 메서드가 없는데, 테스트가 실패하면 무엇이 될지 에러가 필요하기 때문입니다. 먼저 Option으로 내려가세요. 클로저는 참조를 빌려받습니다.",
]

# ---------------------------------------------------------------- 57
[[quest]]
id    = "rust.cheatsheet_advanced.57.bool-option-result"
title = "BOOL, OPTION, RESULT"
story = "리 시어터의 좌석판: 좌석 번호는 판에 있거나 없거나 둘 중 하나이고, 매표소는 없을 때 문장 하나를 원한다."
brief = '''
`fn pick(xs: &[u32], i: usize) -> Result<u32, String>` 안에서: `i`가 범위 안이면
`xs[i]`를 반환하고, 아니면 `Err(format!("no item {i}"))`
— 절대 패닉하지 않고, 메시지는 필요할 때만 만듭니다.

```
let v = ____;
Ok(v)
```

빈칸을 채우는 식은 어느 것일까요?
'''
hints = [
  "세 타입이 차례로: bool은 Option이 되고(지연으로, 아니면 인덱스가 패닉), Option은 Result가 되며(지연으로, 그래야 메시지가 필요할 때만 포맷됨), 그제야 Result 함수 안의 `?`가 그것을 쓸 수 있습니다.",
]
