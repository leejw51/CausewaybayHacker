[[quest]]
id    = "rust.cheatsheet_advanced.04.next-signature"
title = "FIB가 건네는 것"
story = "헤네시 로드의 트램 번호는 한 번에 하나씩 나오고, 하나하나가 앞의 둘에서 만들어진다."
brief = '''
`Fib { a: u64, b: u64 }`가 `u64`를 내는 이터레이터가 됩니다:

```
impl Iterator for Fib {
    type Item = u64;
    // ____
        let r = self.a;
        self.a = self.b;
        self.b += r;
        Some(r)
    }
}
```

빈칸의 메서드에 트레이트가 요구하는 시그니처는 어느 것일까요?
'''
hints = [
  "이 메서드는 상태를 전진시키므로 `self`의 배타적 빌림이 필요합니다. 그리고 더 이상 없다고 말할 수 있어야 하므로, 항목을 맨몸이 아니라 감싸서 돌려줍니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.cheatsheet_advanced.05.box-dyn-error"
title = "두 종류의 말썽"
story = "글로스터 로드 옆 결제 경로는 파서에서도 장부에서도 실패할 수 있고, `main`은 `?` 하나로 둘 다 삼켜야 한다."
brief = '''
`AppError`는 커스텀 에러입니다:

```
impl fmt::Display for AppError {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, "app: {}", self.0) }
}
impl std::error::Error for AppError {}
```

이것이 impl의 전부입니다 — `AppError`에는 `From` 변환이 **없습니다**.
`main` 안에서 `?`가 `ParseIntError`**와** `AppError`에 모두 쓰입니다.
둘 다 컴파일되게 하는 `main`의 시그니처는 어느 것일까요?
'''
hints = [
  "서로 다른 에러 타입 둘이 `?` 하나를 지나가려면 둘 다 변환될 수 있는 반환 타입이 필요합니다: 트레이트 객체, 그것도 크기가 정해진 것 — 그래서 포인터 뒤에 둡니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.cheatsheet_advanced.06.from-for-question-mark"
title = "변환기"
story = "자딘스 바자의 계산대는 파싱 실패를 자기 말로 보고한다. 장부는 그것을 줄마다 `map_err`를 쓰지 않고 자기 enum으로 받고 싶다."
brief = '''
`enum AppError { Parse(ParseIntError), Neg }`. 아래 함수는 적힌 그대로
컴파일되어야 합니다 — 변환은 `?`가 합니다:

```
fn read(s: &str) -> Result<i32, AppError> {
    let n: i32 = s.trim().parse()?;
    if n < 0 { return Err(AppError::Neg); }
    Ok(n)
}
```

안에 `fn from(e: ParseIntError) -> Self { AppError::Parse(e) }`를 둔
어느 impl 헤더가 그렇게 해 줄까요?
'''
hints = [
  "`?`는 에러를 변환할 때 특정 트레이트 하나를 호출하고, 그것은 대상 타입 위에 원본 타입에 대해 구현됩니다 — 반대 방향도 아니고, 거울상 사촌도 아닙니다.",
]

