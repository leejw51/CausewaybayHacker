for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "receiver의 블로킹 이터레이터는 모든 sender가 사라져야만 끝납니다. 하나가 `main`에 남아 있으니 개수로 멈추세요. 논블로킹 이터레이터는 지금까지 도착한 것만 돌려줍니다 — 아무것도 없을 수도 있습니다.",
]

