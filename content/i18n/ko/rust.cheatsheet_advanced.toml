[[quest]]
id    = "rust.cheatsheet_advanced.03.where-bound"
title = "무엇이든 가장 큰 것"
story = "소고의 가격판은 가격을 f64로, 재고 수를 i32로 들고 있고, 페리스는 함수 둘을 쓰지 않고 어느 쪽에서든 가장 큰 것을 원한다."
