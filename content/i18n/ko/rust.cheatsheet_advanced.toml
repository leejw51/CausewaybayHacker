# RUST LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC §12.1):
# the prose of `content/rust/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "rust.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet_advanced.01.default-method"
title = "덤으로 한 줄"
story = "06:50, 자딘스 바자 위층. 메이의 목록에 있는 가게는 모두 자기 이름을 말할 수 있다. 메이는 가게마다 인사말을 따로 쓰지 않고도 모두가 인사하길 원한다."
brief = '''
`Greet`는 이미 `name`을 요구합니다. `impl Greet for Shop`이 **오직** `name`만
쓰고도 `Shop.hello()`가 여전히 컴파일되고 `name`이 돌려주는 것을 그대로
돌려주도록, 트레이트에 `hello`를 추가하세요.

```
trait Greet {
    fn name(&self) -> String;
    // ____
}
impl Greet for Shop { fn name(&self) -> String { "Sogo".into() } }
```
'''
hints = [
  "본문이 있는 트레이트 메서드는 구현하는 쪽에서 선택 사항이고, 시그니처만 있는 것은 그렇지 않습니다. 그것을 위한 키워드는 없습니다 — 본문이 있다는 것 자체가 신호의 전부입니다.",
]

