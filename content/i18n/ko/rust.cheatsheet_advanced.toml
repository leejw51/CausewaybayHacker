  "Vec 하나에 서로 다른 구체 타입 둘을 담으려면 트레이트 객체를 가리키는 포인터가 필요합니다. 제네릭 매개변수는 타입을 둘 중 하나로 고정해 버리고, 트레이트 이름만 쓴 것은 타입이 아예 아닙니다.",
]

