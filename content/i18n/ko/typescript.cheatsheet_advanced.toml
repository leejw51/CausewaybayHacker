# TYPESCRIPT LAND — CHEATSHEET ADVANCED, in Korean. A translation pack (SPEC
# §12.1): the prose of `content/typescript/cheatsheet_advanced.toml`, quest
# by quest, and nothing else. The question is the brief; the four choices are
# code, live in the English pack, and are never translated. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "typescript.cheatsheet_advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet_advanced.01.generic-bound"
title = "ID가 있는 것이면 무엇이든"
story = "19:10, 30층의 관제실. 섬의 모든 스크린에는 id가 있다. 조회 테이블은 그것들의 어떤 목록이든 받아야 하고, 바꿀 수는 없어야 한다."
brief = '''
`xs`는 `readonly Screen[]`(즉 `ReadonlyArray<Screen>`)이고 `Screen`에는
`id: string`이 있습니다. 본문이 다음과 같은 제네릭 함수 `byId`를 여세요.

```ts
return new Map(xs.map(x => [x.id, x] as const));
```

`xs` — 그리고 문자열 `id`를 가진 것들의 다른 어떤 읽기 전용 배열이든 — 를
받아들이고 그 본문이 컴파일되게 해야 합니다. `strict`가 켜져 있습니다.
'''
hints = [
  "맨 `T`에는 `id`가 없습니다. 매개변수에 바운드를 주세요. 그리고 읽기 전용 배열은 가변 배열이 요구되는 자리를 통과하지 못합니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet_advanced.02.mapped-draft"
title = "모든 키를, 아마도"
story = "하이산 플레이스의 스크린 설정 초안은 반만 채워진 채로 편집될 수 있다. 모양은 진짜 것을 키 하나하나 그대로 따른다."
brief = '''
`Draft<T>`를 손으로 쓰세요 — 이것을 해 주는 내장 유틸리티 타입이 아니라:
`T`와 같은 키, 전부 선택적, 각각 자기 타입을 유지하고, 여전히 쓰기 가능.
`type Screen = { id: string; w: number }`에서
`const d: Draft<Screen> = { w: 3 };`와 `d.w = 5;`가 모두 컴파일됩니다.
'''
hints = [
  "매핑된 타입은 `keyof T`를 걷습니다. 대괄호 뒤의 `?`는 각 키를 선택적으로 만들고(그것이 손으로 쓴 `Partial<T>`), `-?`는 필수로 만들며(`Required<T>`), 그 앞의 `readonly`는 얼립니다(`Readonly<T>`).",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.cheatsheet_advanced.03.as-const-union"
title = "단어 셋, enum 없이"
story = "이워 스트리트 도착 안내판은 세 종류의 패널을 보여 주고, 아무도 그 목록을 둘 네 번째 파일을 원하지 않는다."
brief = '''
```ts
const KINDS = ["ad", "news", "tram"] as const;
```

`KINDS`에서 `Kind`를 끌어내 정확히 그 세 문자열의 유니언이 되게 하세요 —
`const k: Kind = "ad";`는 컴파일되고 `const b: Kind = "bus";`는 안 됩니다.
enum이 아니라 리터럴의 유니언.
'''
hints = [
  "값은 타입이 아닙니다: 먼저 값*의* 타입을 요청한 다음, 튜플을 `number`로 인덱싱해서 원소가 될 수 있는 것을 얻으세요.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.cheatsheet_advanced.04.pick-card"
title = "앞면만"
story = "리 가든 앱은 스크린마다 카드 하나를 보여 준다: id와 제목. feed 필드는 관제실에 남는다."
brief = '''
`Screen`에는 `id`, `title`, `feed`, `w`가 있습니다. `Card`를 `id`와
`title`**만** 있는 객체 타입으로, `Screen`이 바뀌면 따라가도록 유틸리티
타입으로 `Screen`에서 만들어 선언하세요.
'''
hints = [
  "한 유틸리티는 이름 붙은 키를 남기고, 그 쌍둥이는 떨어뜨립니다. 둘 다 키를 별개의 인자가 아니라 유니언 하나로 받습니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.cheatsheet_advanced.05.awaited-return"
title = "LOAD가 돌려주는 것"
story = "30층의 피드 로더는 스프린트마다 모양이 바뀐다. 그 결과를 이름 붙이는 타입은 다시 타이핑되는 게 아니라 함께 바뀌어야 한다."
brief = '''
```ts
async function load() { return { items: [1, 2], at: Date.now() }; }
```

`Feed`를 `load`가 resolve하는 **벗겨 낸** 객체 타입 —
`{ items: number[]; at: number }` — 으로, `load` 자체에서 끌어내 선언해서
`const f: Feed = { items: [1], at: 0 };`가 컴파일되게 하세요.
'''
hints = [
  "`load`는 값이므로 먼저 그 타입이 필요합니다. 나오는 것은 `Promise`입니다. 유틸리티 하나가 더 그 promise를 벗겨 냅니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.cheatsheet_advanced.06.infer-elem"
title = "상자 안에 든 것"
story = "타임스 스퀘어 스크린용 패널 상자: 라벨은 패널 하나가 무엇인지 말해야 하고, 상자가 아니면 아무 말도 하지 않아야 한다."
brief = '''
`Elem<T>`를 쓰세요: 배열 타입이면 그 원소 타입(`Elem<string[]>`은
`string`), 배열이 **아닌** 것이면 `never`.
'''
hints = [
  "조건부 타입은 매치한 조각에 이름을 붙일 수 있지만 앞에 키워드가 있을 때만입니다 — 그리고 배열 접미사에는 괄호가 필요합니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.cheatsheet_advanced.07.template-id"
title = "SCREEN 대시 숫자"
story = "섬의 모든 보드는 screen-무언가라는 이름이고, 그 무언가는 숫자다. 컴파일러가 그 선을 지킬 수 있다."
brief = '''
`"screen-12"`는 대입할 수 있고 `"screen-x"`도 `"led-12"`도 대입할 수
없도록 `ScreenId`를 선언하세요.
'''
hints = [
  "타입은 템플릿 리터럴일 수 있습니다: 백틱과, 타입이 원시 타입인 자리표시자. 보통 따옴표는 평범한 문자열 리터럴을 만듭니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.cheatsheet_advanced.08.satisfies-palette"
title = "검사하되 넓히지 않는다"
story = "LED 벽의 팔레트는 계약과 대조해 검사된다 — 하지만 빨강은 셰이더가 인덱싱하므로 여전히 삼중쌍으로 남는다."
brief = '''
`type Palette = Record<string, [number, number, number] | string>`.
`r: [255, 0, 0]`과 `s: "#8cf"`로 `p`를 선언하되 `Palette`와 대조해
검사되고 — 모양이 틀린 값, 예컨대 `r: [255, 0]`은 컴파일 오류 — 그러면서도
그 뒤에 `p.r.map(x => x / 255)`와 `p.s.toUpperCase()`가 컴파일되어야
합니다: `p`는 리터럴 자신의 더 좁은 타입을 유지합니다. TypeScript 5.
'''
hints = [
  "어노테이션이나 캐스트는 리터럴의 타입을 `Palette`로 대체하고, 그러면 모든 값이 `tuple | string`입니다. 검사만 하는 연산자(4.9+)가 있습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.cheatsheet_advanced.09.labeled-rest-tuple"
title = "명령과 그 숫자들"
story = "관제실 콘솔은 동사 하나와 그 동사에 필요한 만큼의 숫자를 받는다. `show 1 2 3`, `clear`, 절대 `1 2`는 아니다."
brief = '''
레이블 붙은 튜플로 타입이 지정된 rest 매개변수 `args` **하나**를 받는 함수
`run`을 여세요: 먼저 `cmd: string`, 그다음 몇 개든 `nums: number`.
`run("show", 1, 2, 3)`과 `run("clear")`는 컴파일되고 `run(1, 2)`는 안
됩니다.
'''
hints = [
  "레이블은 튜플 안에 들어가고, 열린 꼬리는 그 자체가 rest 원소입니다 — 점 셋과 배열 타입.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.cheatsheet_advanced.10.declaration-merging"
title = "필드 하나 더, 같은 이름"
story = "벤더의 스크린 타입에는 밝기가 없고, 벤더의 파일은 읽기 전용이다. 관제실은 오늘 밤 모든 스크린에 밝기가 필요하다."
brief = '''
`interface Screen { id: string }`은 당신이 편집하면 안 되는 파일에 선언되어
있습니다. 당신 파일에서 바로 그 `Screen`에 필드 하나 `brightness: number`를
더 주어, `{ id: "a", brightness: 3 }`이 어디서나 `Screen`이 되게 하세요 —
새 이름이 아니라(`interface Big extends Screen { … }`도
`type Big = Screen & { … }`도 새 이름을 만듭니다), 그리고 중복 식별자
오류 없이.
'''
hints = [
  "한 인터페이스의 선언 둘은 병합됩니다. `type` 별칭은 병합되지 않고, 인터페이스는 자기 자신을 extend할 수 없습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet_advanced.11.hash-private"
title = "런타임에도 숨겨진다"
story = "트램 정류장 카운터의 집계는 누구의 일도 아니다: 서브클래스도, 직렬화기도, `Object.keys`도."
brief = '''
```ts
abstract class Panel { abstract draw(): string; }
interface Tally { bump(): void }

class Counter extends Panel implements Tally {
  // the field goes here
  protected label = "c";
  get value(): number { /* returns the field */ }
  set value(v: number) { /* stores v in the field */ }
  bump() { /* adds one to the field */ }
  draw() { return `${this.label}=${this.value}`; }
}
```

`0`에서 시작하는 `count` 필드를, 컴파일 시간만이 아니라 **런타임**에도
숨겨지도록 추가하세요: `new Counter()` 뒤에 `Object.keys(c)`도
`JSON.stringify(c)`도 그것을 보여서는 안 됩니다. `strict`가 켜져 있습니다.
'''
hints = [
  "`private` 키워드는 타입과 함께 지워집니다. 필드는 JavaScript에 그대로 있습니다. `#` 이름은 엔진 자체에서 private입니다 — 그리고 접근 제한자를 받지 않으며 초기화식이 필요합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.cheatsheet_advanced.12.overload-impl"
title = "오버로드 아래의 줄"
story = "도착 안내판의 `parse`는 양방향이다: 문자열이 들어오면 숫자를, 숫자가 들어오면 문자열을 준다. 약속 둘, 본문 하나."
brief = '''
```ts
function parse(x: string): number;
function parse(x: number): string;
```

그 두 오버로드 뒤에 오는 구현 줄을, 본문
`return typeof x === "string" ? Number(x) : String(x);`와 함께 쓰세요 —
`strict` 아래에서 `parse("42")`는 `number`이고 `parse(7)`은 `string`이
되도록.
'''
hints = [
  "구현 시그니처는 모든 오버로드를 덮을 만큼 넓어야 하고, 본문이 있어야 하며, `strict` 아래에서는 매개변수를 타입 없이 둘 수 없습니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.cheatsheet_advanced.13.nullish-assign"
title = "빈 것도 캐시된 것"
story = "하이산 벽의 자막 캐시: 어떤 스크린은 일부러 자막이 비어 있고, 그것을 프레임마다 다시 로드한 것이 지난 화요일에 벽을 얼린 원인이다."
brief = '''
`cache: Record<string, string>`; `load(k)`는 비쌉니다. 키가 **한 번도**
설정된 적 없을 때만 `cache[k]`를 `load(k)`로 채우세요 — 캐시된 `""`는
진짜 유효한 값이고 다시 로드를 일으켜서는 안 됩니다. 문장 하나.
'''
hints = [
  "`\"\"`는 falsy입니다. \"truthy인가?\"를 묻는 것은 무엇이든 다시 로드합니다. \"null이거나 undefined인가?\"를 묻는 대입 연산자는 그렇지 않습니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.cheatsheet_advanced.14.find-last-chain"
title = "마지막 광고, 있다면"
story = "타임스 스퀘어 로테이션의 최신 광고는 목록의 마지막 것이고, 오늘 밤 그중 하나는 일부러 너비가 0픽셀이다."
brief = '''
`xs: S[]`는 `feeds.flatMap(f => f.panels)`이고, `S`에는 `kind: string`과
`width: number`가 있습니다. `w`를 kind가 `"ad"`인 **마지막** 원소의 너비로,
없으면 `-1`로 만드세요. 너비 `0`은 `0`으로 나와야 합니다. non-null 단언
없이, `strict`가 켜져 있습니다. Node 22.
'''
hints = [
  "끝에서 시작하는 검색이 있습니다(Node 18+). `xs.at(-1)`은 마지막 *원소*일 뿐 마지막 매치가 아닙니다. 그 결과는 `undefined`일 수 있으므로 프로퍼티 읽기에는 옵셔널 체인이 필요하고 — 기본값이 0을 삼켜서는 안 됩니다.",
]

