hints = [
  "객체 패턴에서는 프로퍼티 이름이 먼저 오고 새 바인딩이 콜론 뒤에 옵니다 — 보이는 것과 반대 — 그리고 기본값은 바인딩 뒤에 `=`로 따라옵니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.cheatsheet_advanced.16.range-from-length"
title = "0부터 N 빼기 1까지"
story = "하이산 벽의 패널 다섯 개, 0부터 번호. 그 번호의 목록은 어느 하나에 불이 들어오기 전에 필요하다."
brief = '''
`n: number`. `ix: number[]`를 식 하나로 리스트 `[0, 1, …, n - 1]`로 만들되,
모든 원소가 정말 있어야 합니다 — `ix`를 순회하면 `n`개의 숫자를 방문해야
합니다.
'''
hints = [
  "`Array(n)`은 구멍 `n`개이고, `map`은 구멍을 건너뜁니다. `length`가 있는 유사 배열에서 만드세요. 그리고 매퍼의 **둘째** 인자가 인덱스입니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "typescript.cheatsheet_advanced.17.sorted-two-keys"
title = "많은 것부터, 그다음 이름순"
story = "타임스 스퀘어 스크린의 순위표: 조회 수가 많은 것부터, 동점은 이름으로 — 그리고 피드 자체의 목록은 다른 스크린들 밑에서 재정렬되어서는 안 된다."
brief = '''
`rs: { id: string; n: number }[]`는 `Record<string, number>` 집계에서
`Object.entries(tally).map(([id, n]) => ({ id, n }))`으로 만들어졌습니다 —
항목은 `[string, number][]`입니다. `top`의 식: 행을 `n` **내림차순**으로,
동점은 로케일 문자열 순서에서 `id` 오름차순으로 — 그리고 `rs` 자체는
정확히 그대로여야 합니다. Node 22, `strict` 켜짐.
'''
hints = [
  "Node 20+에는 사본을 돌려주는 정렬이 있습니다. 비교자는 숫자를 돌려줘야 하므로 문자열의 동점 처리는 `<`일 수 없습니다 — 문자열에는 비교해서 숫자를 돌려주는 메서드가 있습니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "typescript.cheatsheet_advanced.18.map-group-push"
title = "맞는 버킷으로"
story = "이워 스트리트의 자정: 모든 패널이 kind별 버킷으로 분류된다. 고전적인 버그는 아무도 간직하지 않는 버킷에 push한다."
brief = '''
`m: Map<string, string[]>`, 처음에는 비어 있습니다.
`for (const [k, v] of pairs)` 안에서 `k` 아래에 저장된 리스트에 `v`를
추가하고, `k`를 처음 볼 때 그 리스트를 만드세요 — 문장 **하나**로, 그래서
그 뒤에 `m`이 정말 모든 값을 담도록. `strict`가 켜져 있습니다.
'''
hints = [
  "`get`은 리스트 아니면 `undefined`를 돌려줍니다. `?? []`는 push할 무언가를 주지만, 새 `[]`는 당신이 넣지 않는 한 맵에 없습니다(`has` 다음 `set`은 문장 둘입니다). Map에는 `[k]`가 없고 `get`은 기본값을 받지 않습니다 — 그리고 JSON으로 나갈 때는 `Object.fromEntries(m)`이 출구입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.cheatsheet_advanced.19.deep-copy"
title = "사본다운 사본"
story = "하이산 벽의 리허설 피드는 오늘 밤 것의 진짜 사본이어야 한다 — id의 Set, 숫자의 행들 — 그래서 리허설이 거기 낙서할 수 있도록."
brief = '''
`feed`는 `{ ids: Set<string>; rows: number[][] }`입니다. `copy`를 **깊은**
사본으로 만드세요: `copy.ids.add("c")`와 `copy.rows[0].push(9)`가 `feed`를
건드리지 않아야 하고 — `copy.ids`는 여전히 `add`가 있는 `Set`이어야
합니다. Node 22.
'''
hints = [
  "스프레드와 `Object.assign`은 한 단계만 복사합니다. JSON 왕복은 Set을 잃습니다(`{}`가 됩니다). Node 17+에는 플랫폼 자체의 깊은 복사가 있습니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.cheatsheet_advanced.20.bigint-sum"
title = "카운터에서 섞지 않기"
story = "태풍 대피항의 파도 카운트는 2의 63제곱을 넘었다. 오늘 밤의 일곱 파도는 평범한 number이고, 합은 정확해야 한다."
brief = '''
`big`은 2의 63제곱을 넘는 `bigint`이고, `n`은 `number` —
`today.reduce<number>((s, w) => s + w, 0)` — 로 작은 정수를
담습니다(`Number.isInteger(n)`이 true). `total`을 그 둘의 **정확한** 합으로
만드세요. `number`는 2의 53제곱 위에서 반올림되고, `|0`은 32비트에서
감깁니다.
'''
hints = [
  "피연산자는 같은 종류여야 하고, 캐스트는 변환이 아닙니다. 작은 쪽을 위로 변환하세요 — 리터럴에만 통하는 `n` 접미사가 아니라 함수로.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.cheatsheet_advanced.21.named-groups"
title = "줄 안의 모든 연도"
story = "눈데이 건 아래의 명판 피드: 건조, 개장, 예정. 그 안의 네 자리 연도는 모두 보드에 오른다."
brief = '''
`s`는 `"built 1998, refit 2015, due 2031"`이고 `ys: string[]`는 비어
있습니다(각 연도는 나중에 `y.slice(-2).padStart(2, "0")`으로 표시됩니다).
네 자리 숫자의 이름 붙은 그룹 `y`의 **모든** 매치를 도는 루프를 열어, 이
본문이 각 연도를 모으게 하세요:

```ts
  ys.push(m.groups?.y ?? "");
```

Node 22, TypeScript 5.
'''
hints = [
  "메서드 하나가 그룹과 함께 모든 매치를 돌려줍니다 — 그리고 패턴에 global 플래그가 없으면 런타임에 throw합니다. 이름 붙은 그룹은 `(?<name>…)`입니다. Python의 `P`는 여기서 문법 오류입니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet_advanced.22.loop-closure"
title = "각자 자기 번호"
story = "하이산 벽의 패널 셋이 나중에 각자 자기 번호로 켜지도록 준비된다. 셋 다 3이라고 말하는 버그는 스카이넷이 처음으로 제안한 것이었다."
brief = '''
```ts
class Board {
  q: (() => void)[] = [];
  show(i: number) { /* lights panel i */ }
  arm(n: number) {
    // the loop goes here
  }
}
```

`arm(n)` 안에서 `this.q`에 클로저 `n`개를 push하세요. k번째 것은 **나중에**
호출될 때 자기 `k`로 `this.show(k)`를 불러야 합니다 — `arm(3)` 뒤에 전부
실행하면 `3, 3, 3`이 아니라 `0, 1, 2`가 켜집니다. `strict`가 켜져
있습니다.
'''
hints = [
  "`var`는 루프 전체에 변수 하나입니다. 블록 스코프 바인딩은 바퀴마다 새것입니다. 그리고 `function () {}`에는 자기 `this`가 있고, strict 모드는 그것을 추측하기를 거부합니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.cheatsheet_advanced.23.type-only-import"
title = "흔적을 남기지 않는 IMPORT"
story = "스크린 모듈은 로드되는 순간 관제실에 로그를 찍는다. 앱은 그 타입만 원하고, 아무도 빌드 시간에 그 로그를 원하지 않는다."
brief = '''
`screen.ts`에는 `export interface Screen { … }` — **이름 붙은** export,
default 없음 — 와 모듈이 로드될 때마다 실행되는 최상위 `console.log`가
있습니다. `verbatimModuleSyntax`가 켜져 있습니다. 내보내진 JavaScript에
import의 **아무것도** 남지 않도록 타입 어노테이션에 쓸 `Screen`을
import하세요: 로그가 찍혀서는 안 됩니다.
'''
hints = [
  "`verbatimModuleSyntax` 아래에서 타입의 평범한 import는 오류이고, 중괄호 *안의* `type` 제한자는 여전히 모듈을 로드하는 `import {}`를 남깁니다. 제한자를 문장 전체에 두세요.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.cheatsheet_advanced.24.error-cause"
title = "원본을 지켜라"
story = "피드 fetch가 세 층 아래에서 TypeError로 실패했다. 관제실은 위에 자기 에러를, 아래에 진짜 에러를 여전히 붙여 두길 원한다."
brief = '''
`catch (e: unknown)` 안에서, 메시지가 `"feed failed"`이고 `e`를 원래
원인으로 붙여 두는(ES2022) **새** `Error`를 throw하세요. 호출자가 붙어 있는
것에 여전히 `instanceof TypeError`를 돌릴 수 있도록. `strict`가 켜져
있습니다.
'''
hints = [
  "`Error`는 둘째 인자를 받습니다 — 에러 자체가 아니라 옵션 객체. 그리고 `e`는 `unknown`입니다: 좁히지 않고는 `.message`를 읽어 낼 수 없습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.cheatsheet_advanced.25.all-settled"
title = "도착한 것만 세기"
story = "슈거 스트리트에서 라이더 여섯이 떠났다. 하나는 비에 막혔다. 주방은 도착한 것을 더하고, 못 온 하나 때문에 밤을 버리지 않는다."
brief = '''
`ps: Promise<number>[]`이고 `rs = await Promise.allSettled(ps)`입니다.
`for (const r of rs)` 안에서, **성공한** 모든 promise의 값을 `total`에
더하고 실패한 것은 건너뛰세요 — `strict` 아래에서 컴파일되는 한 줄로.
'''
hints = [
  "각 결과는 `status`에 대한 판별 유니언입니다. 성공 분기에만 `value`가 있습니다. 두 status 문자열은 스펙이 쓰는 것이고, \"resolved\"도 `ok`도 아닙니다. (`Promise.all`은 첫 실패에서 throw했을 것이고, `Promise.race`는 하나만 돌려줍니다.)",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet_advanced.26.for-await"
title = "하나씩 도착하는 대로"
story = "이워 스트리트 보드의 틱 피드는 하나씩, 각각 기다림 뒤에 온다. 합계는 전부 들어온 뒤가 아니라 오는 대로 자란다."
brief = '''
`ticks()`는 `AsyncGenerator<number>`를 돌려줍니다. `async` 함수 안에서, 각
`t`를 도착하는 대로 받는 루프를 열어 본문 `sum += t;`가 `strict` 아래에서
컴파일되게 하세요.
'''
hints = [
  "비동기 이터러블에는 `[Symbol.iterator]`가 없으므로 평범한 `for…of`는 거부됩니다 — 그리고 제너레이터 객체를 await해도 소용없습니다. `await`는 `for`에 붙습니다.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet_advanced.27.iterable-stack"
title = "스택을 펼쳐라"
story = "관제실의 undo 스택은 배열로 펼쳐지고 바닥의 다른 무엇처럼 `for…of`로 걸어져야 한다."
brief = '''
```ts
class Stack<T> {
  #items: T[] = [];
  push(x: T) { this.#items.push(x); }
  pop(): T | undefined { return this.#items.pop(); }
  // one more method goes here
}
```

`s.push(1); s.push(2)` 뒤에 `[...s]`가 `[1, 2]`를 주고 `for (const x of s)`가
컴파일되게 하는 메서드 하나를 추가하세요. `strict`가 켜져 있습니다.
'''
hints = [
  "메서드의 이름은 대괄호 안의 잘 알려진 심볼이고, 제너레이터(별표)여야 하며, `yield*`로 배열에 위임하면 항목을 하나씩 내줍니다 — 평범한 `yield`는 배열 전체를 항목 하나로 내줍니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet_advanced.28.exhaustive-never"
title = "네 번째 종류가 빌드를 깬다"
story = "오늘은 패널 두 종류. 다음 스프린트에 누군가 세 번째를 추가하면 빌드가 이 switch에서 실패해야 한다 — 19:00의 타임스 스퀘어 스크린이 아니라."
brief = '''
`Shape`는 `{ kind: "ad"; w: number } | { kind: "news"; len: number }`이고
`area(s: Shape): number`는 `s.kind`로 switch합니다. `case "ad"`와
`case "news"`가 각각 `return`한 뒤에, 함수가 오늘 컴파일되**고** `Shape`에
세 번째 kind가 추가되는 날 컴파일을 멈추도록 `default`를 쓰세요.
`strict`가 켜져 있습니다.
'''
hints = [
  "모든 case가 반환한 뒤 `s`는 바닥 타입입니다. 그것을 그 타입의 변수에 대입하는 것은 오늘은 공짜이고, 종류 하나가 남는 순간 타입 오류입니다. 캐스트나 `any`는 아무것도 검사하지 않고, `throw`는 19:00에야 알게 됩니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.cheatsheet_advanced.29.type-guard"
title = "선을 타고 내려온 것"
story = "JSON이 30층에 닿았고 타입은 사라졌다. 함수 하나가 런타임에 그것을 보고 컴파일러에게 무엇을 봤는지 말해야 한다."
brief = '''
`data: unknown`은 `JSON.parse`에서 왔고 `Screen`은
`{ id: string; w: number }`입니다. 본문이 다음인 함수 `isScreen`을 여세요.

```ts
return typeof x === "object" && x !== null && "id" in x && "w" in x;
```

그래서 `if (isScreen(data)) console.log(data.id.toUpperCase());`가
컴파일되도록 — `if` 안에서 `data`는 `Screen`입니다. `strict`가 켜져
있습니다.
'''
hints = [
  "`boolean`을 돌려주는 것은 컴파일러에게 `x`에 대해 아무것도 말해 주지 않습니다. 반환 자리의 타입 술어는 말해 줍니다 — 매개변수 이름, 그 단어, 타입. 매개변수는 `unknown`을 받아야 하고, 단언 시그니처는 `if` 안에 앉을 수 없습니다.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.cheatsheet_advanced.30.asserts-defined"
title = "단언"
story = "자정. 섬의 스크린이 꺼지기 전 마지막 조회: 값이 있거나 밤이 throw된 Error로 끝나거나, 그리고 그 줄 뒤로 컴파일러는 그녀의 말을 믿어야 한다."
brief = '''
본문은 `if (x === undefined || x === null) throw new Error("missing");`
입니다. 다음 뒤에

```ts
const v = m.get("a");   // m: Map<string, number>, so v: number | undefined
must(v);
```

`v + 1` 줄이 컴파일되도록 제네릭 함수 `must`를 여세요 — `must`는 그때부터
`v`가 `null`도 `undefined`도 아니라고 컴파일러에게 약속합니다. `strict`가
켜져 있습니다.
'''
hints = [
  "아무것도 돌려주지 않는 함수는 타입 술어일 수 없습니다. 단언 시그니처는 될 수 있습니다. 그리고 `x is T`를 단언하는 것은 아무것도 좁히지 않습니다 — 타입에서 `null`과 `undefined`를 벗겨 내는 유틸리티가 단언할 것입니다.",
]
