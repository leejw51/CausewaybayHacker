[[quest]]
id    = "typescript.cheatsheet_advanced.15.destructure-rename"
title = "WIDTH, 이름은 W"
story = "자페 로드의 간판 가게는 피드에서 스크린의 사양을 읽는다: kind는 그대로, width는 짧은 이름으로, 아무도 채우지 않았으면 100."
