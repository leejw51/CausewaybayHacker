[[quest]]
id    = "zig.advanced.28.refcount"
title = "누가 또 이것을 쥐고 있나"
story = "계기 둘이 장부 하나를 통해 같은 동전 트레이를 읽고, 장부는 마지막 계기가 사라질 때까지 남아 있어야 하며 그보다 1초도 더 있어서는 안 된다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값들을 **자기를 쥔 쪽을 세는** `Ledger`가 소유한 슬라이스에 넣으세요:
`share()`는 핸들을 내주고 수를 올리며, `release(gpa)`는 수를 내리고 그것이 0에
닿으면 슬라이스를 해제합니다. 핸들 둘을 가져가고, 세지 않는 관찰자 하나를
두세요. 네 줄을 출력하세요:

1. `REF <sum>` — 두 번째 핸들을 통해 읽은 합
2. `SHARED <k>` — 두 핸들이 모두 살아 있는 동안의 수
3. `ALIVE yes` — 그것들이 살아 있는 동안의 `watch.alive()`
4. `ALIVE no` — 두 핸들이 모두 release된 뒤

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig에는 `shared_ptr`가 없습니다. 가장 가까운 것은 `shared_ptr`의 속에 있는 것을
눈에 보이는 곳에 쓴 것입니다. 지난 퀘스트는 소유자가 하나였습니다. 이번 것은
객체 옆에 두는 소유자의 수이고, 객체는 그 수가 0에 닿을 때 해제됩니다 — 마침
마지막으로 떠난 핸들이 무엇이든 그것에 의해. `share()`는 수를 올리고,
`release()`는 내립니다. 둘 중 어느 것도 대신 해 주는 것은 없습니다: 닫는
중괄호에서 실행되는 소멸자가 없으므로, 모든 `share()`에는 당신이 쓴
`release()`가 짝지어져야 하고, 그렇지 않으면 슬라이스가 새고 `main`이 돌아갈
때 `-O Debug`의 할당자가 stderr에 그렇다고 말합니다.

관찰자는 `Ledger` 그 자체를, 세지 않고 들여다본 것입니다. 그것은 슬라이스가
아직 거기 있는지 볼 수 있고 — `items`는 `?[]i64`이고, 마지막 release 뒤의
`null`이 "사라졌음"에 대해 타입이 주는 **영값**입니다 — 슬라이스를 살려 둘
수는 없습니다. 그것이 순환을 끊는 것이고, 이 길의 마지막 지도가 다루는
것입니다.
'''
hints = [
  "share()는 두 줄입니다: self.refs += 1; return self. 두 번 호출하면 SHARED 2가 되고, mirror.items.?는 같은 슬라이스에 닿습니다.",
  "release()는 수를 내리고, 0에 닿았을 때에만 슬라이스를 해제하고 items를 null로 정합니다 — 그 null이 alive()가 읽는 것입니다.",
  "두 핸들을 모두 release하세요. 첫 release만으로는 아무것도 해제되지 않고, 두 번째가 해제합니다. 왜 그런지 소리 내어 말하세요: 그것이 이 퀘스트가 정말로 묻는 질문입니다.",
]

