[[quest]]
id    = "zig.advanced.29.take"
title = "가지고 가라"
story = "감독관은 모든 전표를 배달원에게 건네기 전에 복사하고, 복사기는 요금소에서 가장 느린 물건이다."
brief = '''
표준 입력은 개수 `n`, 그다음 텍스트 `n`줄입니다.

줄마다 `Docket`을 하나씩 리스트 `pile`에 만들고, 그다음 모든 전표를 두 번째
리스트 `sent`로 넘기고, `sent`에서 각각의 텍스트를 대문자로 출력하고, 그다음
`SENT <n>`, `COPIES <c>`, `MOVES <m>`을 출력하세요.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        SENT 2
        COPIES 0
        MOVES 2
```

`Docket`은 자기 텍스트 — 자기가 할당한 `[]u8` — 를 소유하고, 그것에 일어나는
일을 셉니다: `copy(gpa)`는 바이트를 복제하고 전역 하나를 올리며, `take()`는 다른
하나를 올립니다. 스타터는 `COPIES 2`를 보고합니다:
`sent.append(gpa, try d.copy(gpa))`가 모든 전표를 바이트까지 통째로 복제합니다.

Zig에는 이동 의미론도 이동 생성자도 없습니다. 가장 가까운 것은 규율이고, 이
퀘스트가 그것을 풀어 씁니다. 구조체를 대입하면 그 헤더가 복사되므로 —
`Docket`이라면 텍스트의 포인터와 길이 — `sent.append
(gpa, d)`는 둘 다 같은 바이트를 소유한다고 믿는 전표 **둘**을 남기고, 그중
두 번째 `free`가 충돌입니다. `take()`가 정직한 넘겨주기입니다: 텍스트를 쥔
전표를 돌려주고 원본에는 **빈 슬라이스**를 남기므로, 원본은 여전히 해제될 수
있고 — 아무것도 해제하지 않으면서 — 아직 텍스트를 가진 것처럼 읽힐 수는 결코
없습니다. 그것이 C++의 *유효하지만 명시되지 않은* 이동된 뒤의 상태를, 당신이
고른 값으로 풀어 쓴 것입니다.
'''
hints = [
  "호출 하나가 바뀝니다: sent.append(gpa, d.take()). take는 *Docket이 필요하고, 그래서 루프는 이미 |*d|로 pile을 걷습니다.",
  "pile의 deinit 루프는 여전히 모든 전표에 대해 돕니다. take 뒤에는 각각이 빈 슬라이스를 쥐고 있고, deinit은 빈 것에 대해서는 free를 건너뜁니다. 두 번 해제되는 것은 없습니다.",
  "sent.append(gpa, d.*)는 컴파일되고 COPIES 0 MOVES 0을 출력할 것입니다 — 그리고 main의 끝에서 두 리스트가 같은 바이트를 해제할 것입니다. 카운터는 정직한 넘겨주기와 이중 해제가 똑같아 보이지 않도록 존재합니다.",
]

