[[quest]]
id    = "zig.advanced.30.generic-ring"
title = "어떤 짐이든 싣는 링"
story = "차축 계기는 최근 측정값 몇 개를 지니고 감독관은 최근 번호판 몇 개를 지니는데, 알렉스는 같은 링 버퍼를 두 번 썼다."
brief = '''
첫 줄은 용량 `cap`입니다. 두 번째 줄은 정수 목록이고, 세 번째 줄은 단어
목록입니다.

`Ring(comptime T: type) type`을 **하나** 쓰세요: 넣은 것 중 가장 최근의 `cap`개를
지니고, 가장 오래된 것을 덮어쓰며, 도착 순서로 걸을 수 있는 고정 용량 버퍼입니다.
정수들은 `Ring(i64)`에, 단어들은 `Ring([]const u8)`에 넣고, 각 링의 내용을 한
줄에 출력하고, 그다음 `DROPPED <k>` — 모두 합쳐 몇 개가 밀려났는지 — 를
출력하세요.

```
input:  2
        1 2 3 4
        hku tram bus
output: 3 4
        tram bus
        DROPPED 3
```

스타터는 컴파일되지 않습니다: `Ring`은 `i64`용으로 쓰여 있고, 단어들은 갈
곳이 없습니다. Zig의 제네릭 타입은 **구조체를 돌려주는 함수**이고, 이 길 앞에서
본 `Pair(T)`와 똑같습니다: `fn Ring(comptime T:
type) type { return struct { ... }; }`, 칸에는 `[]T`, `push`에는 `T`. 그
전체가 `T`가 무엇인지 모른 채 — 복사될 수 있다는 것만 알고 — 쓰이며,
`Ring(i64)`와 `Ring([]const u8)`는 하나의 정의에서 찍혀 나온 서로 다른 두
타입입니다.

이터레이터도 주세요. 링은 도착 순서로 저장되어 있지 않습니다 — 가장 오래된
것은 쓰기 머리가 막 덮어쓰려는 곳에 있습니다 — 그래서 `next()`가 산술을 해야
하고, 그것이 읽기보다 쓸 가치가 있는 부분입니다. 출력에는 `T`에 대한 `comptime`
가지 하나가 필요합니다. 단어는 `{s}`이고 숫자는 `{d}`이기 때문입니다.
'''
hints = [
  "구조체를 감싸는 fn Ring(comptime T: type) type { return struct { ... }; }, 칸에는 []T, push에는 T, 그리고 안에서 구조체에 이름을 붙이는 const Self = @This(). 그다음 두 사용 지점에서 Ring(i64).init과 Ring([]const u8).init.",
  "가장 오래된 것은 (head + cap - count) % cap에 있습니다. 도착 순서로 k번째 것은 (oldest + k) % cap입니다. 이터레이터는 k와 링을 가리키는 포인터만 지니면 됩니다.",
  "fn printRing(w, comptime T: type, ring: *const Ring(T))가 이터레이터를 걷습니다. if (comptime T == []const u8)가 {d} 대신 {s}를 고르고, 그 T에 대해 다른 가지는 결코 분석되지 않습니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "zig.advanced.31.invalidation"
title = "걸으면서 지우기"
story = "감독관은 정차대 목록을 읽어 내려가면서 밴을 지우고, 지울 때마다 그다음 것을 건너뛴다."
brief = '''
첫 줄은 `n t`입니다. 두 번째 줄은 정수 `n`개입니다.

목록에서 `t`보다 작은 모든 값을 **제자리에서** 지우고, 남은 것을 한 줄에 출력하고
(아무것도 없으면 `-`), 그다음 `REMOVED <k>`를 출력하세요.

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

스타터는 누구나 한 번은 쓰는 버그입니다: 인덱스로 걸으며 `orderedRemove(i)`를
호출하고, 그다음 `i += 1`을 합니다 — 그러면 칸 `i`로 미끄러져 들어온 원소는
한 번도 보지 않습니다. 작은 값 둘이 붙어 있으면, 두 번째 것이 살아남습니다. 그
버그는 적어도 잘 정의되어 있습니다. 그 슬라이스 쌍둥이는 그렇지 않습니다: `for
(list.items) |v|`는 슬라이스를 포인터와 길이째 **한 번** 가져가고, 루프 안의
`orderedRemove`는 그 발밑에서 리스트를 줄입니다. 루프는 옛 길이만큼 계속
걸으며 새 끝 너머의 칸 — 리스트가 아직 소유하지만 더 이상 아무 의미도 두지
않는 메모리 — 을 읽고, 바이트가 할당 영역 안에 있으므로 어떤 Debug 검사도
울리지 않습니다. 대개는 제대로 된 것처럼 보이고, 그것이 더 나쁩니다.

`orderedRemove(i)`는 `i` 뒤의 모든 것을 한 칸씩 당기고 지운 것을 돌려줍니다.
그러니: 걸리면 지우고 나아가지 **않습니다**. 빗나가면 `i += 1`. 둘 다는 절대
아닙니다. 증가가 가지 안에 있는 `while` 루프가 그 모양이고, 연결 리스트에서도
해시 맵에서도 같은 모양입니다.
'''
hints = [
  "while에서 : (i += 1)을 떼어 내세요. 지우지 않은 가지에서만 i += 1로 나아가세요. 다른 가지에서는 orderedRemove가 이미 다음 원소를 칸 i로 옮겼습니다.",
  "moorings.items.len은 루프 검사마다 다시 읽히고, 그것이 while을 올바르게 만듭니다: 슬라이스에 대한 for였다면 처음에 길이를 얼려 버렸을 것입니다.",
  "끝에서부터 거꾸로 걷는 것이 또 하나의 올바른 답입니다 — i에서 지워도 그 아래 칸들은 결코 흐트러지지 않습니다 — 그리고 가지 없는 판을 물어 올 때 내놓을 답이 그것입니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "zig.advanced.32.overflow"
title = "멈춘 카운터"
story = "요금소의 리터 카운터는 i32이고, 2147483647리터에서 부스 화면에 panic: integer overflow가 뜨며 차단기가 내려온다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개이며, 각각은 `i64`에 들어갑니다. 그
누적 합계도 `i64`에 들어갑니다.

두 줄을 출력하세요: 도중의 모든 누적 합계가 `i32`에 들어가면 `INT32 OK`, 아니면
그것을 밖으로 밀어냈을 첫 값의 0부터 센 인덱스와 함께 `INT32 OVERFLOW <i>`.
그다음 `INT64 <total>`.

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

스타터는 합계를 `i32`에 두고 두 번째 값에서 패닉합니다:
`panic: integer overflow`. 그것은 Zig가 이 랜드가 약속한 바로 그 일을 하는
것입니다 — `-O Debug`에서 오버플로한 정수는 그렇다고 말하고 멈추며, 넓은
케이스는 한 줄 더 일찍, `5000000000`을 잘라 버렸을 `@intCast`에서 멈춥니다.
패닉을 선물로 읽고, 그다음 계약의 나머지를 읽으세요: `+%`는 감싸 돌고, `+|`는
포화하며, 맨 `+`는 Debug에서 패닉하고 **`-O ReleaseFast`에서는 정의되지 않은
동작**입니다. 거기서는 검사가 꺼져 있고 최적화기는 그런 일이 결코 일어나지
않는다고 가정합니다 — 그래서 양수 `v`에 대한 `total + v < total`은 거기서 *언제나
거짓*이고, 그 검사는 지워집니다. gcc와 clang이 C++에서 그것을 지우는 것과
똑같이.

그러니 오버플로를 일으켜서 감지해서는 절대 안 됩니다. 좁은 덧셈 *전에*, 더
넓은 타입에서 또는 한계 — `std.math.minInt(i32)`와 `std.math.maxInt(i32)` —
와 비교해서 감지하며, 이 프로그램의 기대 출력은 어떤 빌드 모드도 정의되지 않은
채로 두는 것에 전혀 기대지 않습니다.
'''
hints = [
  "합계를 i64에 두고 덧셈마다 std.math.minInt(i32)와 maxInt(i32)와 비교하세요. i32 산술은 한 번도 일어나지 않으므로 패닉할 것도 정의되지 않은 것도 없습니다.",
  "범위를 벗어난 첫 인덱스만 기록하세요 — 한 번만 정해지는 ?usize — 나중 값이 합계를 다시 안으로 되돌릴 수 있고, 질문은 그것이 처음 벗어난 곳을 물었기 때문입니다.",
  "i32 둘을 꼭 더해야 하고 그것이 안전한지 알고 싶다면: @addWithOverflow(a, b)는 감싸 돈 합과 캐리 비트를 돌려주며, 모든 빌드 모드에서 정의되어 있습니다. 그것이 검사입니다. 맨 합의 부호는 최적화기가 지우는 것입니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "zig.advanced.33.stop-flag"
title = "요청받으면 멈춰라"
story = "야간 차로는 누군가 멈추라고 할 때까지 돌아가는데, 이번 근무 전까지는 아무도 그럴 수 없었다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

스레드 둘을 시작하세요. 첫째는 값들을 더해 결과를 저장합니다. 둘째는 **정지
플래그** `*std.atomic.Value(bool)`를 받아 그것이 `true`로 읽힐 때까지 돕니다.
그렇게 읽히면 두 번째 플래그를 세우는 `onStop` 함수를 실행하고, 그다음 자기가
멈췄다고 기록합니다. `main`에서 정지 플래그를 세우고, 둘 다 join하고,
출력하세요:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread`에는 `stop_token`도 `jthread`도 없습니다. 가장 가까운 것은 그것들을
이루는 재료를 손으로 넘기는 것입니다. 정지 요청은 요청하는 쪽이 쓰고 워커가
읽는 `bool`이고, 두 스레드가 건드리므로 아토믹입니다: 한쪽에서는
`stop.store(true, .release)`, 다른 쪽 워커의 루프에서는 `stop.load(.acquire)`.
자기 플래그를 확인하는 스레드는 언제든 끌 수 있는 스레드입니다. 그러지 않는
스레드는 스타터의 야간 차로이고, 그 `join`은 결코 돌아오지 않을 것입니다.

C++의 `stop_callback`은 정지가 요청되는 순간 요청한 스레드에서 실행됩니다.
여기서는 워커가 플래그를 볼 때 `onStop`을 스스로 실행하는데, 그것은 같은 약속
— *정지가 요청되었기 때문에 무언가 일어난다* — 을 반대편에서 지키는 것입니다.
`store` 뒤의 `join`이 풀어 쓴 `jthread` 소멸자입니다: 요청하고, 그다음 기다리기.
루프 안의 `std.Thread.yield()`는 코어를 원하는 다른 누군가에게 넘겨줍니다. 맨
스핀도 통과하고, 코어 하나를 낭비하기도 합니다.
'''
hints = [
  "차로 스레드는 세 플래그를 포인터로 받습니다. 그 루프는 while (!stop.load(.acquire)) std.Thread.yield() catch {};이고, 루프 뒤에 onStop을 호출하고 stopped를 저장합니다.",
  "플래그를 세우기 전에 차로를 spawn하고, 그 뒤에 join하세요. 스레드가 시작하기 전에 세운 플래그는 괜찮습니다 — 첫 확인에서 멈춥니다 — 하지만 store 없는 join은 결코 돌아오지 않습니다.",
  "store의 .release와 load의 .acquire는 store 전에 일어난 일을 load 뒤에 보이게 만드는 짝입니다. 여기서는 .monotonic도 통과할 것이고, 면접관은 왜인지 물을 것입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.advanced.34.unreachable"
title = "UNREACHABLE"
story = "07:59, 캐널 로드 고가도로. 차로 모델은 가지 하나를 도달 불가로 표시하고, 아침 교통이 거기에 도달하고, 모든 차로가 한꺼번에 닫힌다 — 차로 스레드 하나가 요금소가 이미 돌려준 버퍼를 아직 읽고 있는 동안에."
brief = '''
첫 줄은 `w n`입니다: 차로 `w`개와 측정값 `n`개. 두 번째 줄은 측정값들입니다.

`pump(gpa, w, ledger)`는 참조 계수되는 `Ledger`(세 퀘스트 전의 그것)가 쥔
측정값들에 대해 스레드 `w`개를 시작합니다. 스레드 `i`는 `i * n / w`부터
`(i + 1) * n / w`까지의 측정값을 `partial[i]`에 더하고, `pump`는 부분합들을
돌려줍니다. `main`은 각각에 대해 `PUMP <i> <sum>`, `TOTAL <sum>`, 그리고 모든
것이 끝났을 때 측정값들이 release되어 있으면 `FREED yes`를 출력합니다 — 장부의
`alive()`로 관찰합니다.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

스타터는 두 번 실패하고, 그 두 실패가 이 랜드의 두 반쪽입니다.

첫 번째는 차로 모델입니다. `pump`는 각 차로의 경계를 계산하고 그다음
`if (begin == end) unreachable;`이라고 말합니다 — *교통이 없는 차로는 일어날 수
없다*. 측정값 둘에 차로 셋이면, 그것은 일어납니다. `unreachable`은 주석도
assert도 아닙니다: Zig에서 **가정하라**를 뜻하는 단 하나의 줄입니다.
`-O Debug`에서 거기에 닿으면 `panic: reached unreachable code`이고, 요금소는
화면에 이유를 띄운 채 멈춥니다. `-O ReleaseFast`에서 컴파일러는 당신을
*믿습니다* — 그 가지는 지워지고, 그리로만 이어질 수 있는 모든 것도 함께
지워집니다 — 그리고 거기에 닿는 프로그램은 정의되지 않습니다. 댕글링 포인터를
통해 읽는 C++ 프로그램이 정의되지 않는 것과 똑같이. 패닉은 같은 계약의 정직한
판입니다. 그 주장을 지우고 그 경우를 다루세요: 빈 차로의 합은 `0`입니다.

두 번째는 소유권입니다. 스타터의 `pump`는 차로들을 시작하기 전에 장부를
**release합니다** — *워커들은 자기 슬라이스를 가졌으니 핸들은 필요 없다* —
그리고 그 release가 마지막 것이라 측정값들이 해제되고, 워커들은 어쨌든 그것을
읽습니다. Debug에서 할당자는 돌려받은 메모리를 모든 바이트 `0xAA`로 칠하므로,
각 측정값은 `-6148914691236517206`으로 돌아오고, 그것을 둘 더하는 첫 차로가
`panic: integer overflow`로 요금소를 멈춥니다 — 그것이 보이는 케이스가 보여 주는
실패로, 거기서는 모든 차로에 교통이 있어 `unreachable`에 결코 닿지 않습니다:
입력의 어떤 측정값으로도 오버플로할 수 없는 합, 그리고 실수가 아닌 줄을
가리키는 트레이스. ReleaseFast에는 칠도 검사도 없습니다: 차로들은 다음 할당이
거기 둔 무엇이든, 또는 커널이 가져가 버린 페이지를 읽습니다. 그것이 댕글링
읽기이고, 가장 비싼 종류의 버그입니다. 실수가 있는 곳에서 실패하지 않기
때문입니다.

증상이 아니라 소유권을 고치세요. 모든 차로는 시작하기 전에 장부의 **몫을 가져가고**
끝나면 그것을 release하므로, 측정값들은 그것을 쥔 마지막 스레드만큼 정확히
살아 있습니다 — 차로들이 어떤 순서로 끝나든. `pump`는 돌아가기 전에 join하고
`main`이 준 핸들을 마지막으로 release합니다. `main`으로 돌아오면 `alive()`는
`false`입니다: 측정값들은 마지막 release — join 뒤의 `pump` 자신의 것 — 에 의해
한 번 해제되었고, 아직 읽고 있던 사람은 아무도 없었습니다. 차로들의 release가
서로 경쟁하므로 수는 아토믹입니다. 장부 자체는 스레드 안전하지 않고 그럴 필요도
없습니다. 아무도 측정값들에 쓰지 않기 때문입니다.

그것이 프로그램 하나에 담긴 이 랜드 전체입니다. 검사는 당신이 틀릴 때마다
당신을 멈췄고, 당신을 옳게 만드는 도구들 — 누가 이것을 쥐고 있는지 말하는 수,
기다리는 join, 해제하는 `defer` — 은 기초의 길에서 만난 바로 그것들입니다.
'''
hints = [
  "unreachable을 지우고 빈 차로가 돌게 두세요: begin == end는 빈 슬라이스이고, 그 합은 0입니다. 증명할 수 없는 주장은 해서는 안 되는 주장입니다.",
  "각 차로에 몫을 주세요: ledger.share()로 spawn하고 차로가 ledger.release(gpa)를 defer하게 하세요. 차로의 몫이 측정값들을 살려 두는 것이고, 그것은 pump가 아니라 차로의 함수가 돌아갈 때 release됩니다.",
  "pump 자신의 release는 pump 맨 위의 defer로 옮겨 가므로 join 뒤에 — 측정값들이 읽힌 뒤에 — 실행되고, 그것이 release하는 것은 main이 내준 핸들입니다.",
  "partial은 칸 단위로 차로들에 건네지고, 그것은 옳습니다: pump가 그것을 소유하고, pump는 그것을 돌려주기 전에 join하며, 각 차로는 자기 칸에만 씁니다. main이 몫을 하나 쥐고 있었다면 FREED는 no일 것입니다 — main이 아직 쥐고 있으므로 측정값들이 살아 있는 것이고, 그것이 이 보스가 당신이 설명할 수 있다면 받아 주는 또 하나의 답입니다.",
]
