# ZIG LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/zig/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers and printed strings are copied verbatim.

pack   = "zig.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.advanced.01.lines"
title = "부스 일지"
story = "1번 부스의 근무 일지는 차량마다 한 줄씩 적는다: 직원이 들은 이름, 그리고 그 차가 낸 것. 동전이 몇 개가 되든. 프린터는 터널보다 오래되었고 지금도 페이지를 페리 회사의 말로 끝낸다."
brief = '''
첫 줄은 개수 `n`입니다. 다음 `n`줄은 각각 이름 하나와 그 뒤를 잇는 0개
이상의 정수이며, 공백으로 나뉩니다.

차량마다 `<NAME> <how many numbers> <their sum>` 형태로 한 줄씩 출력하고,
그다음 `BOATS <n>`을 출력하세요 — 요금소의 프린터가 페리 회사 것이던 시절부터
모든 페이지를 끝내 온 집계 줄입니다.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

여기서 단위는 토큰이 아니라 줄입니다. 입력 전체에 대한 `std.mem.tokenizeAny`
하나는 공백에서 멈추고 줄바꿈에는 신경 쓰지 않으므로, 한 차량이 어디서
끝나고 다음 차량이 어디서 시작하는지 알려 줄 수 없습니다. 먼저 입력을 줄로
자르세요 — `std.mem.splitScalar(u8, input, '\n')`은 `next()`가
`?[]const u8`인 이터레이터를 주어 한 번에 한 줄씩 내줍니다 — 그리고 그다음
그 줄 **안에서** 토큰화하세요.

그 슬라이스들은 모두 `input` 안을 가리킵니다. 아무것도 복사되지 않습니다:
줄은 당신이 이미 소유한 바이트를 들여다보는 창이고, 그래서 그것들을 모두 다 쓸
때까지 `input`이 살아 있어야 하며, 그래서 `defer gpa.free(input)`이 가장
마지막에 실행됩니다.
'''
hints = [
  "'\\n'에 대한 splitScalar는 next()마다 한 줄을 건네줍니다. 그 줄에 대해 \" \\r\\t\"를 구분자로 한 tokenizeAny는 그 토큰들을 걷고, 그 끝 너머로는 가지 않습니다.",
  "이름은 첫 토큰이므로 루프 앞에서 fields.next() 한 번으로 가져오세요. 그러면 while (fields.next()) |tok|는 숫자만 봅니다.",
  "이름만 있는 줄은 특별한 경우 없이 0 0이 됩니다: while 루프가 그냥 한 번도 돌지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.advanced.02.pointers"
title = "사본은 그 물건이 아니다"
story = "부스 감독관은 동전 트레이마다 집계를 장부의 사본에 적고, 그녀 뒤 벽에 걸린 장부는 절대 바뀌지 않는다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

함수 `load`를 통해 모든 값을 하나의 `std.ArrayList(i64)`에 넣고, 그다음 세
줄을 출력하세요: `LOADED <how many>`, 읽기만 하는 함수 `total`로 구한
`TOTAL <sum>`, 그리고 `FIRST <value>` — 아무것도 없으면 `FIRST NONE`.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

스타터는 컴파일되고 `LOADED 0`을 출력합니다. `load`는 리스트를 **값으로**
받고, Zig의 매개변수는 불변이므로, 스타터는 사람들이 다음에 하는 일을 합니다:
`var mine = sheet;` — 리스트 헤더의 사본 — 그리고 거기에 덧붙입니다. 사본이
자라고, 사본은 돌아갈 때 죽고, 벽의 장부는 손대지 않은 채로 남습니다.

`*`로 뜻하는 바를 말하세요: `*std.ArrayList(i64)` 타입의 매개변수는 호출자의
리스트의 주소이고, 그것을 통한 `sheet.append(gpa, value)`는 호출자의 리스트에
내려앉습니다. `total`은 `[]const i64` — 리스트의 `.items` — 를 받아야
합니다. 보기만 하면 되고 건드릴 필요는 없으며, 타입 안의 `const`는 컴파일러가
당신을 그 말에 묶어 두는 방법입니다.

`FIRST`는 옵셔널 포인터입니다: `?*const i64`는 첫 원소의 주소이거나 `null`이고,
`null`은 Zig가 먼저 묻지 않고는 그것을 통해 읽게 두지 않는 단 하나의
값입니다 — `if (first) |p|`가 그 물음입니다. 이 랜드 전체가 그 한 줄에
들어 있습니다.
'''
hints = [
  "두 글자가 load를 고칩니다: 시그니처의 sheet: *std.ArrayList(i64)와 호출할 때의 &sheet. 포인터를 통한 메서드 호출 문법에는 화살표가 필요 없습니다. sheet.append(gpa, v)는 같은 줄입니다.",
  "total은 []const i64를 받고 sheet.items로 호출되어야 합니다 — const는 약속이고, 컴파일러가 그것을 확인합니다.",
  "&sheet.items[0]은 첫 원소의 주소이고, 원소가 있을 때에만 말이 됩니다. if (first) |p|가 옵셔널을 풀고, p.*가 그 뒤의 값입니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.advanced.03.slices"
title = "줄의 한가운데"
story = "여섯 시 전에 4번 부스 앞에 차량 마흔 대가 밀렸다. 감독관에게는 맨 앞 범퍼와 마지막 후미등이 보이고, 그 사이는 아무것도 보이지 않는다."
brief = '''
표준 입력은 첫 줄의 개수 `n`과, 두 번째 줄의 공백으로 나뉜 정수 `n`개입니다.
`n`은 적어도 `1`입니다.

세 줄을 출력하세요: 첫 값, 마지막 값, 그리고 그 둘 사이에 엄격히 들어 있는
모든 것의 합. 값이 셋보다 적으면 그 합은 `0`입니다.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

슬라이스가 곧 그 수열입니다. `nums[0]`과 `nums[nums.len - 1]`이 양 끝이고,
`nums[1 .. nums.len - 1]`이 가운데로, 복사 없이 같은 바이트 위에 놓인 **새
슬라이스**이며, 그것에 대한 `for`가 합입니다. 슬라이싱은 인덱싱처럼 검사됩니다:
원소가 하나인 줄의 가운데를 계산하면 나오는 `nums[1..0]`은
`panic: start index 1 is larger than end index 0`이므로, `nums.len`에 대한
가드는 슬라이스 뒤가 아니라 앞에 옵니다.

`i64`로 더하세요. 숨겨진 케이스 하나는 가운데가 `i32`에 들어가지 않고,
`-O Debug`에서 오버플로한 `i32`는 감싸 돌지 않습니다 — 패닉합니다.
'''
hints = [
  "nums[1 .. nums.len - 1]이 양 끝 사이의 슬라이스이고, 그것에 대한 for가 그 합을 구합니다. 그것은 nums와 메모리를 공유합니다.",
  "값이 하나나 둘이면 그 범위는 비어 있거나 거꾸로이고, 거꾸로 된 슬라이스는 Debug에서 패닉입니다 — 쓰기 전에 nums.len에 대한 if로 막으세요.",
  "가운데는 i64입니다: 넓은 케이스는 30억짜리 값 둘을 더하고, i32 누산기는 integer overflow로 패닉할 것입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.advanced.04.strings"
title = "바이트는 글자가 아니다"
story = "요금소 머리 위 표지판은 銅鑼灣을 세 바이트에서 잘라 한 글자만 보여 준다."
brief = '''
한 줄을 읽습니다. 세 줄을 출력하세요:

1. 그 길이, **바이트** 단위
2. 그 길이, **글자** 단위 — UTF-8 코드 포인트
3. 글자를 뒤집은 그 줄

```
input:  causeway
output: 8
        8
        yawesuac
```

줄에는 ASCII 밖의 글자가 있을 수 있고, 그러면 처음 두 숫자는 같지 않습니다.
Zig 문자열은 `[]const u8`입니다: 바이트의 슬라이스이고, `.len`은 바이트입니다.
언제나 그랬습니다. 이 수준에서 언어는 인코딩에 대해 아무것도 모릅니다. `u8`은
바이트입니다.

UTF-8은 디코딩하지 않고도 세기 쉽습니다: 모든 코드 포인트는 `10xxxxxx` 형태가
**아닌** 바이트로 시작하고, 모든 연속 바이트는 그 형태입니다. 그러니 바이트
`c`는 정확히 `(c & 0xC0) != 0x80`일 때 글자를 시작합니다. 바이트가 아니라
글자를 뒤집으세요 — `std.mem.reverse(u8, line)`은 `銅`을 세 조각으로 잘라
거꾸로 출력할 것입니다.
'''
hints = [
  "for (line, 0..) |c, i|는 인덱스와 함께 바이트를 걷습니다. (c & 0xC0) != 0x80이 모든 글자의 첫 바이트를 골라냅니다.",
  "모든 글자의 시작 인덱스를 std.ArrayList(usize)에 모으세요. 그 길이가 아무것도 디코딩하지 않은 글자 수입니다.",
  "시작 인덱스를 거꾸로 걸으며 각 글자의 바이트 — line[from..to] — 를 std.ArrayList(u8)에 appendSlice하고, 그다음 그 .items를 {s}로 출력하세요.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.advanced.05.structs"
title = "부스 장부"
story = "2번 부스는 차축마다 요금을 받고 그 줄들을 장부 양식 하나에 적는다. 아니, 제안이 구조체의 함수들을 주석 하나로 바꿔 버리기 전까지는 그랬다."
brief = '''
첫 줄은 `<NAME> <n>`입니다. 다음 `n`줄은 `<ITEM> <CENTS>`입니다.

그 이름에 대해 항목들을 모으는 `Ledger`를 만들고, 그다음 각 항목을 도착한
순서대로 `<ITEM> <CENTS>`로 다시 출력하고, 그다음 `TOTAL <sum>`, 그다음
`BOAT <name> <count>`를 출력하세요 — 장부 양식은 페리 회사의 것이고, 그 이름
칸에는 아직도 `BOAT`라고 적혀 있습니다.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n`은 `0`일 수 있고, 그러면 출력은 마지막 두 줄뿐입니다.

Zig에는 `class`가 없습니다. 가장 가까운 것은 안에 함수를 선언한 `struct`이고,
그것이 전부입니다. 등 뒤에서 실행되는 생성자는 없습니다: `init`은 당신이 쓰는,
값을 돌려주는 평범한 함수입니다. 숨겨진 `this`도 없습니다: `self`는 첫
매개변수로 명시되며 — 함수가 장부에 쓰면 `*Ledger`, 읽기만 하면
`*const Ledger` — 그것이 눈에 보이게 된 메서드의 `const`입니다. `private:`도
없습니다. 필드는 파일 어디서든 닿을 수 있고, `main`을 `items` 밖에 두는
것은 구조체가 `total()`과 `count()`를 제공하고 그것들을 돌아갈 이유가 없다는
사실입니다.
'''
hints = [
  "std.ArrayList(Item)으로 충분합니다. 구조체는 장부가 자기 줄들을 소유하도록 거기 있습니다. add는 append 하나입니다: self.items.append(gpa, .{ .name = name, .cents = cents }).",
  "add는 쓰므로 self: *Ledger, total과 count는 읽기만 하므로 self: *const Ledger. ledger.add(...)는 어느 쪽이든 같은 호출입니다 — Zig가 주소를 대신 가져갑니다.",
  "항목 이름은 input의 슬라이스이므로 장부를 채우는 데는 비용이 들지 않고 input이 장부보다 오래 살아야 합니다 — main의 defer 순서가 이미 그것을 보장합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.advanced.06.tagged-union"
title = "누가 운전대를 잡았나"
story = "오토톨 차로는 모든 태그에 회원 요금을 매긴다. 회원이 아닌 것들에도, 그리고 태그가 아닌 하나에도."
brief = '''
표준 입력은 개수 `n`, 그다음 `<TYPE> <HOURS>` 형태의 `n`줄입니다.

기본 요금은 `500 + 100 * HOURS` 센트입니다. 줄마다 다음 중 하나를 출력하세요:

* `MEMBER` — 기본 요금
* `CREW` — 기본 요금의 절반, 정수 나눗셈
* `JUNIOR` — 언제나 `200`
* 그 밖의 것 — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

태그를 네 경우를 가진 `union(enum)`으로 모델링하고, 그중 하나는 `other`로
하세요. C++의 `enum class`는 페이로드를 실을 수 없어서 알아보지 못한 텍스트가
그 옆에 따로 다녀야 했습니다. Zig의 태그드 유니언은 그것을 경우 **안에**
싣습니다: `other: []const u8`, 그리고 나머지 세 경우는 아무것도 싣지 않습니다.
`union(enum)`의 경우는 등 뒤에서 정수로 변환되지 않고 그 이름을 둘러싼
스코프로 흘리지도 않는데, 그 두 가지가 `enum class`가 존재했던 이유입니다.

요금은 `switch` 하나로 정하세요. 태그드 유니언에 대한 `switch`는 모든 경우를
덮어야 합니다 — 하나를 빠뜨리면 컴파일되지 않고, 경고 플래그도 필요 없습니다
— 그리고 `.other => |raw|`가 페이로드를 그것이 든 경우에서 꺼내는
방법입니다.
'''
hints = [
  "other: []const u8이 네 번째 경우이고, .{ .other = raw }가 그것을 만듭니다. void인 세 경우는 .member, .crew, .junior로 만듭니다.",
  "std.mem.eql(u8, raw, \"MEMBER\")는 두 슬라이스를 비교합니다. 슬라이스에 대한 ==는 포인터를 비교하고, 그것은 결코 당신이 뜻하는 바가 아닙니다.",
  "@divTrunc(base, 2)는 명시적으로 쓴 정수 나눗셈입니다. 부호 있는 정수에 대한 맨 /는 결과가 정확하지 않을 수 있으면 컴파일되지 않습니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.advanced.07.maps"
title = "요금소가 외치는 것"
story = "06:30의 요금소: 부스마다 차로 건너편으로 무언가를 외치고, 감독관은 그 순위를 원한다."
brief = '''
표준 입력 전체를 읽어 공백으로 나누세요.

서로 다른 단어마다 한 번씩 `<word> <count>`로 출력하되, 수의 내림차순으로,
같으면 단어의 오름차순으로 정렬하세요.

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)`는 아무것으로도 정렬되어 있지 않습니다 — 키로도,
수로도, 도착 순서로도 — 그래서 순위는 별도의 단계입니다: 항목들을 작은
구조체의 `std.ArrayList`로 복사하고 비교자와 함께 `std.mem.sort`하세요.
`getOrPut(word)`는 칸을 찾거나 넣고 어느 쪽이었는지를 `found_existing`으로
알려 주는데, 그것이 바로 세는 루프가 원하는 것입니다. 새 칸의 `value_ptr`은
당신이 쓰기 전까지 초기화되지 않은 상태입니다.

Zig에는 람다가 없습니다. 비교자는 이름으로 넘기는 평범한 함수이고, 첫
매개변수는 그것이 캡처했을 컨텍스트입니다 — 여기서는 `void` 타입의 `{}`이고,
아무것도 캡처하지 않기 때문입니다. 키는 `input`의 슬라이스이므로 `input`을
해제하기 전에 맵을 `deinit`해야 합니다: 올바른 순서의 `defer`가 아무 생각
없이도 그것을 해 줍니다.
'''
hints = [
  "getOrPut(word)는 found_existing과 value_ptr을 가진 칸을 돌려줍니다. 새것이면 value_ptr.* = 0으로 정하고, 그다음 하나 더하세요. 그것이 세는 루프의 전부입니다.",
  "counts.iterator()가 항목들을 걷습니다. 각 항목에는 key_ptr과 value_ptr이 있습니다. 항목마다 Row 하나를 std.ArrayList(Row)에 덧붙이세요.",
  "비교자는 fn byRank(_: void, a: Row, b: Row) bool입니다 — 먼저 수의 내림차순, 그다음 std.mem.order(u8, a.word, b.word) == .lt — 그리고 std.mem.sort(Row, rows.items, {}, byRank)가 그것을 적용합니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.advanced.08.hashtable"
title = "순서가 전혀 없다"
story = "요금소의 점호는 해시 테이블 마음대로의 순서로 돌아오고, 감독관은 부스들이 실제로 대답한 순서를 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 부스 이름이 하나씩 적힌 `n`줄입니다. `n`은
적어도 `1`이고, 이름은 공백 아닌 문자가 이어진 한 덩어리입니다. 이름은 한 번
넘게 나올 수 있습니다.

서로 다른 이름마다 한 번씩 `<name> <count>`로, **그 이름이 처음 나온
순서대로** 출력하세요. 그다음 `DISTINCT <k>`를 출력하세요.

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

컨테이너가 이것을 저절로 주지는 않으며, 그것이 이 퀘스트의 전부입니다.

`std.StringHashMap`은 해시 테이블입니다: 조회는 평균 O(1)이지만,
`iterator()`는 항목들을 **버킷 순서**로 돌려줍니다 — 정렬된 순서도, 삽입
순서도 아니고, 테이블이 자라는 순간 달라집니다. 어떤 순서도 약속되지 않으므로,
해시 맵을 걸으며 출력하는 프로그램은 그 출력이 해시 함수에 달린
프로그램입니다. 스타터는 정확히 그렇게 하고, 서로 다른 이름이 하나뿐인
케이스는 통과하기까지 합니다 — 그것이 바로 단서입니다: 순서를 구별할 수 없는
테스트는 순서가 맞다는 증거가 아닙니다.

두 가지 일을 두 컨테이너에 맡기세요: `std.ArrayList([]const u8)`는 이름이
처음 보인 순서를 기억하고, `std.StringHashMap(i64)`는 셉니다. 출력하려면
리스트를 걸으세요.
'''
hints = [
  "해시 테이블은 빠르게 찾기 위한 것입니다. 리스트는 순서를 기억하기 위한 것입니다. 둘 다 필요합니다.",
  "found_existing은 이름마다 정확히 한 번 — 삽입할 때 — false이고, 그때가 그 이름을 순서 리스트에 덧붙일 순간입니다.",
  "리스트를 걸으며 각 수를 count.get(name).?로 맵에 물어 출력하세요. 맵을 걸어서는 절대 안 됩니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.advanced.09.set-and-sort"
title = "누가 어디에 서 있나"
story = "고가도로 아래 정차대 게시판에는 같은 밴이 같은 칸에 두 번 적혀 있고, 어느 줄이 중복인지 아무도 말하지 못한다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<BERTH> <NAME>` 형태의 `n`줄입니다.

서로 다른 `<BERTH> <NAME>` 짝을 한 번씩, 칸 번호 그다음 이름 순으로 출력하고,
그다음 `DISTINCT <k>`와 `DUPES <n - k>`를 출력하세요.

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig에는 짝의 정렬된 집합이 없습니다. 가장 가까운 것은 저마다 한 가지 일을
하는 도구 둘입니다. `std.StringHashMap(void)`는 집합이고 — 값이 자리를
차지하지 않는 맵 — **줄 그 자체**, `2 KWAN`을 키로 삼으면 이미 들어 있는
짝의 두 번째 사본을 거부합니다. 작은 구조체 `{ berth, name }`의
`std.ArrayList`가 집합이 통과시킨 것들을 모으고, 비교자와 함께 한
`std.mem.sort`가 그것들을 칸 번호 그다음 이름 순으로 놓습니다. 짝을 분해할
구조적 바인딩은 없습니다. 구조체의 필드에 이미 이름이 있습니다.
'''
hints = [
  "std.StringHashMap(void)가 집합입니다. getOrPut(line).found_existing은 어떤 줄의 두 번째 사본에서 true이고 첫 번째에서 false입니다.",
  "집합이 통과시킨 줄만 리스트에 들어가므로, 리스트의 길이가 DISTINCT이고 n에서 그것을 뺀 것이 DUPES입니다.",
  "비교자는 먼저 칸 번호로, 같으면 std.mem.order(u8, a.name, b.name) == .lt로 정렬합니다. std.mem.sort(Mooring, moorings.items, {}, byBerthThenName)이 그것을 적용합니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.advanced.10.comptime-fn"
title = "차로를 한 번에 내려가며"
story = "차축 일지는 숫자들의 한 열이다. 알렉스는 for 루프 넷이라고 말한다. 메이는 이름이 붙은 for 루프 넷이라고 말하고, 그 이름들은 함수다."
brief = '''
표준 입력은 공백으로 나뉜 정수 한 줄입니다.

네 줄을 출력하세요:

1. 짝수 값들의 합 (없으면 `0`)
2. `10`보다 큰 모든 값을 두 배로 해서, 순서대로, 공백 하나로 이어서 —
   없으면 `-`
3. 서로 다른 값이 몇 개인지
4. `FIRST_BIG <i>` — `10`보다 큰 첫 값의 0부터 센 인덱스, 또는 `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig에는 `<algorithm>`도 람다도 없고, 가장 가까운 것은 들리는 것보다
가깝습니다: **다른 함수를 `comptime` 매개변수로** 받는 함수입니다.
`fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64`는 술어를 가진
`accumulate`입니다. `isEven`을 이름으로 넘기면 컴파일러가 호출을 인라인한
`sumIf`의 한 버전을 찍어 내고, 실행 시간에는 함수 포인터가 없습니다.
`sumIf`, `keepDoubled`, 사본에 대한 `std.mem.sort`에 인접한 짝에 대한 한 번의
훑기를 더한 서로 다른 값 세기, 그리고 `indexOfFirst`를 쓰세요. 요점은 루프가
쓰기 어렵다는 것이 아닙니다. 이름이 그 루프가 무엇을 위한 것인지 말하고,
술어가 읽을 수 있는 값이라는 것입니다.
'''
hints = [
  "comptime keep: fn (i64) bool이 매개변수 타입입니다. 본문 안에서 keep(x)는 평범한 호출이고, 호출하는 곳에서는 괄호 없이 isEven을 넘깁니다.",
  "keepDoubled에는 쓸 곳이 필요합니다: 호출자가 deinit하는 std.ArrayList(i64)를 돌려주고, append가 실패해도 새지 않도록 안에서 그 deinit을 errdefer하세요.",
  "gpa.dupe(i64, xs)가 정렬할 사본입니다. 정렬된 슬라이스에서는 중복이 붙어 있으므로, 값은 바로 앞의 것과 다를 때 정확히 새것입니다.",
  "indexOfFirst는 ?usize를 돌려줍니다. if (indexOfFirst(...)) |i|가 찾은 것을 출력하고, else 가지가 -1을 출력합니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.advanced.11.generics"
title = "한 번만 써라"
story = "요금소의 계기판에는 largest가 네 번 적혀 있다 — 차축용, 분용, 차로용, 차로 이름용 — 그리고 다섯 번째가 첫 트램 전까지 나와야 한다."
brief = '''
표준 입력은 두 줄입니다: 첫 줄에는 정수들, 두 번째 줄에는 단어들.

둘 모두에 동작하는 `largest`를 **하나** 쓰고, `larger()`와 `smaller()`를
가진 타입 `Pair(T)`를 쓰세요.

가장 큰 정수, 가장 큰 단어, 그다음 첫 두 정수로 만든 `Pair`에 대한
`PAIR <larger> <smaller>`를 출력하세요. 같으면 `a`가 더 큰 쪽으로 칩니다.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

스타터는 컴파일되지 않습니다: `largest`가 `i64`에 못 박혀 있으므로, 거기에
단어를 넘기면 *expected type '[]const i64', found '[][]const u8'*입니다.
Zig의 제네릭 함수는 **`comptime T: type`** 매개변수를 가진 함수입니다:
`fn largest(comptime T: type, xs: []const T) T`는 호출되는 타입마다 한 번씩
찍혀 나오고, `T`는 추론되는 것이 아니라 호출하는 곳에서 적습니다 —
`largest([]const u8, words)`.

단어에는 `>`가 없습니다. 슬라이스는 `std.mem.order`로 비교합니다. 제네릭
안에서 `if (comptime T == []const u8)`가 컴파일 시간에 비교 방법을 고릅니다
— 해당하지 않는 가지는 분석조차 되지 않으며, 그것은 템플릿 특수화와 같은
발상이되 그 장치는 하나도 없습니다.

`Pair(T)`는 타입에 대한 같은 요령입니다: `type`을 받아 **구조체를 돌려주는**
함수입니다. 따로 클래스 템플릿 문법은 없습니다. 타입은 컴파일 시간의 값이고,
함수는 그것을 만들 수 있습니다.
'''
hints = [
  "첫 매개변수로 comptime T: type, 안의 모든 곳에서 i64 대신 T, 그러면 호출은 largest(i64, nums.items)와 largest([]const u8, words.items)가 됩니다.",
  "x > best는 슬라이스에 대해 컴파일되지 않습니다. if (comptime T == []const u8) std.mem.order(u8, x, best) == .gt else x > best가 인스턴스마다 맞는 비교를 고릅니다.",
  "fn Pair(comptime T: type) type { return struct { ... }; } — 안에서 const Self = @This()가 만들어지는 구조체에 이름을 붙이고, Pair(i64){ .a = ..., .b = ... }가 하나를 만듭니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.advanced.12.function-values"
title = "차단기 카운트"
story = "5번 부스의 차단기는 누가 들어오고 누가 후진해 나가는지 세고, 감독관은 그 사이에 무슨 일이 있었든 근무가 끝날 때의 숫자를 원한다."
brief = '''
표준 입력은 개수 `n`, 그다음 각각 `IN` 또는 `OUT`인 `n`줄입니다.

결코 0 아래로 내려가지 않는 누적 카운트를 유지하고 명령마다 그것을
출력하세요. 그다음 `INS <k>` — 제네릭 `countIf`와 술어 함수로 센, `IN`인
명령의 수 — 와 `CLOSED <final>`을 출력하세요.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Zig에는 클로저가 없고 — 람다도, 캡처도 없고 — 가장 가까운 것은 눈에 보이는
곳에 풀어 씁니다. 카운터는 **자기 합계를 쥐고 있는 구조체**이고, `add`는
`*Counter`에 대한 메서드입니다: C++ 람다가 `[total = 0LL]`로 캡처하고
`mutable`로 표시했을 상태는 필드이고, 그것을 바꾸는 호출은 구조체를 포인터로
받습니다. 구조체 밖의 어떤 것도 `add`를 통하지 않고는 합계에 닿을 수
없습니다.

술어는 **`comptime` 매개변수로 넘긴 함수**입니다: `countIf(commands, isIn)`은
`isIn`을 이름으로 부르고 컴파일러가 그것을 인라인합니다. 캡처할 것이 없으니
아무것도 캡처되지 않고, 면접관이 `[&]` 대 `[=]`에 대해 물을 질문은 여기에
숨을 곳이 없습니다.
'''
hints = [
  "add는 세 줄입니다: self.total += delta, 0에서 잘라 내기, return self.total. 쓰기 때문에 *Counter를 받습니다. count.add(...)가 주소를 대신 넘깁니다.",
  "var count = Counter{}로 선언한 Counter는 필드 기본값 덕분에 0에서 시작합니다. const인 것에는 더할 수 없을 것입니다.",
  "fn countIf(items: []const []const u8, comptime pred: fn ([]const u8) bool) usize는 슬라이스를 걸으며 pred가 받아들이는 항목을 셉니다. isIn은 이름으로 넘기세요.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.advanced.13.optional-union"
title = "숫자가 아닌 줄"
story = "차축 카운터의 리더가 숫자 한 열을 건네는데, 그 한가운데에 누군가의 아침 주문이 들어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `n`줄입니다. 각 줄은 정수여야 합니다.

줄마다 두 배로 한 값을, 또는 파싱되지 않으면 `BAD <line>`을 출력하세요.
마지막으로 `SUM <total>`을 출력하는데, 합계는 당신이 출력한 값들의 합입니다.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

두 타입이 답을 나릅니다. `fn parse(text: []const u8) ?i64`는 *숫자이거나
아무것도 아닌 것*입니다: `std.fmt.parseInt`는 오류 유니언을 돌려주고, `catch return
null`이 그 오류를 옵셔널의 `null` 쪽으로 바꿉니다. 그것은 문자열 전체를
받아들이거나 전혀 받아들이지 않으므로, `xx`뿐 아니라 `4x`도 거부됩니다.

`fn doubled(text: []const u8) Doubled`는 `union(enum) { value: i64,
bad: []const u8 }`를 돌려줍니다 — *두 배로 한 값이거나 실패한 줄*, 정확히 두
경우 중 하나이고, 결코 둘 다가 아니며, 결코 둘 다 아닌 것도 아닙니다. 그것에
대한 `switch`는 어느 경우가 있든 거기서 페이로드를 꺼냅니다:
`.value => |v|`, `.bad => |line|`. `main` 어디에도 `try`는 없습니다. 실패는
값이고, 값이 가는 곳으로 갑니다. 스타터의 `main`은 이미 그 switch이고,
`parse`와 `doubled`가 빈 껍데기이며, 그것들이 쓰이기 전까지는 모든 줄이
`BAD`로 나옵니다.
'''
hints = [
  "std.fmt.parseInt(i64, text, 10) catch return null이 parse의 전부입니다: 성공하면 값이 옵셔널의 페이로드로 흘러 나가고, 어떤 오류든 나면 함수가 null을 돌려줍니다.",
  "옵셔널은 if (parse(text)) |value|로 풉니다. else 쪽이 null이고, 거기서 .bad 경우를 만듭니다.",
  "같은 함수에서 .{ .value = v }나 .{ .bad = text }를 돌려주는 것은 반환 타입이 둘 중 하나를 담는 유니언이기 때문에 합법입니다. main의 switch가 가지를 고르고, 페이로드는 |v|나 |text|로 붙잡힙니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.advanced.14.error-sets"
title = "당신만의 오류"
story = "요금 서비스의 네 계층이 저마다 다른 것을 돌려주고, 그 위의 누구도 그 어느 것도 잡지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 각각 km 단위 거리여야 하는 `n`줄입니다.

`fare(text)`는 `std.fmt.parseInt`로 파싱하고 — 이것은 `xx`에서
`error.InvalidCharacter`로 **실패하며**, `fare` 안에서 자기 자신의
`error.NotANumber`로 옮겨집니다 — 음수 거리는 당신만의 두 번째 오류
`error.NegativeDistance`로 거부합니다. 둘 다 이름 붙은 오류 집합 하나,
`FareError`에서 옵니다. 그렇지 않으면 `500 + 100 * km`을 돌려줍니다.

입력 줄마다 한 줄을 출력하세요: 요금, 또는 파싱되지 않으면 `not a number`,
또는 거리가 음수이면 `negative distance: <km>`. 그다음 실패한 줄의 수
`ERRORS <k>`를 출력하세요.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

스타터는 컴파일되고 `xx`에서 죽습니다: `main`의 `try fare(text)`가 오류를 위로
넘기는데, `main` 위에는 아무도 없습니다 — 프로그램은 `error:
NotANumber`와 트레이스를 출력하고 `1`로 종료합니다. 그것이 Zig의 오류 이야기
전부입니다: 오류는 반환 타입 `!i64` 안의 값이고, 모든 호출 지점은 그것을 위로
`try`하거나 `catch`합니다. 실패할 수 있다고 말하지 않은 함수를 지나 풀려 나가는
것은 아무것도 없습니다.

Zig의 오류는 객체가 아니라 **이름**입니다: 메시지도 페이로드도 싣지 않고,
그래서 `negative distance: <km>`은 아직 텍스트를 쥐고 있는 호출자가
만듭니다. `catch |e| switch (e) { ... }`가 두 갈래 catch이고, 그 switch는
집합의 모든 오류를 이름으로 대야 합니다 — 파생된 것을 조용히 삼켜 버릴 C++의
`catch (const
std::runtime_error&)`에는 대응하는 것이 없습니다. 잘라 낼 계층이 없기
때문입니다.
'''
hints = [
  "if (fare(text)) |cents| { ... } else |e| switch (e) { ... }가 catch 갈래 둘을 가진 try 블록입니다. 성공의 페이로드는 cents이고, 오류는 e입니다.",
  "메시지는 당신이 만드는 것입니다: 오류는 아무것도 싣지 않지만, text는 아직 스코프 안에 있고 메시지가 원하는 km으로 출력됩니다.",
  "main의 꼭대기에 닿은 오류는 error: <Name>과 트레이스를 출력하고 1로 종료합니다. 스타터가 두 번째 줄에서 하는 일이 그것이고, 그것은 좋은 결과입니다 — 프로그램이 어디서 멈췄는지 말했으니까요.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.advanced.15.iterators"
title = "당신만의 while 루프"
story = "요금소의 차축 계기는 근무 시작부터 끝까지 모든 측정값을 딸깍거리며 지나가고, 그중 어느 것도 어디에도 저장하지 않는다."
brief = '''
표준 입력은 정수 셋입니다: `start`, `step`, `count`.

`Stops`에 이터레이터를 주어, 그것에 대한 `while` 루프가 `start`에서 시작해
`step`씩 나아가는 `count`개의 값을 내게 하세요. 각각을 한 줄에 출력하고,
그다음 같은 `Stops`에서 새로 만든 이터레이터에 대해 `total` 함수로 구한
`SUM <total>`을 출력하세요.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

스타터는 컴파일되지 않습니다: `main`은 `stops.iter()`를 호출하는데 `Stops`에는
그런 함수가 없습니다. Zig에는 이터레이터 프로토콜도 상속할 트레잇도 없습니다.
이터레이터는 **옵셔널을 돌려주는 `next` 메서드를 가진 구조체**이고 — 여기서는
`?i64` — 그것을 걷는 루프는 `while
(it.next()) |value| { ... }`로, 첫 `null`에서 멈춥니다. 그것이 계약의 전부이고,
`std.mem.tokenizeAny`와 이 길에서 써 온 모든 `std` 이터레이터가 지키는
계약입니다.

`total`은 같은 계약을 같은 `while`로 걷습니다. 새 이터레이터를 주세요. `null`에
닿은 이터레이터는 거기 머물기 때문입니다.
'''
hints = [
  "이터레이터는 중첩된 구조체입니다: const Iter = struct { value, step, left, fn next(self: *Iter) ?i64 }. next는 이터레이터를 움직이므로 *Iter를 받습니다.",
  "next는 left가 0이면 null을 돌려줍니다. 그렇지 않으면 현재 값을 기억하고, 나아가고, 하나 줄이고, 기억한 것을 돌려줍니다.",
  "루프 변수는 var여야 합니다 — var walk = stops.iter() — 그렇지 않으면 next가 그 주소를 가져갈 수 없습니다. total은 두 번째 stops.iter()로 자기 것을 만듭니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.advanced.16.defer"
title = "스스로 뒷정리를 한다"
story = "요금소 일지는 근무가 끝나면 올바른 순서로 스스로 닫힌다. 누가 기억했든 안 했든."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

`main`의 **맨 위**에 `first`와 `second`라는 이름의 `Guard` 값 둘을 선언하고,
각각의 `drop`을 `defer`하세요. `drop`은 `DROP <name>`을 출력합니다. 중첩된
블록 안에서 값들을 `Tally`에 먹이는데, 그 지연된 `report`는
`TALLY <count> <sum>`을 출력합니다. 블록 뒤에 `DONE`을 출력하세요. `main`
자신은 그 밖에 아무것도 출력하지 않습니다.

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

`DONE`을 뺀 모든 줄은 `defer`가 출력합니다. Zig에는 소멸자가 없습니다. 가장
가까운 것은 `defer`이고, 그것은 이 점에서 더 정직합니다: 해제하는 줄이
획득하는 줄 바로 옆에 적히고, **블록**이 끝날 때 — 닫는 중괄호에서, `return`에서,
`try`를 통해 나가는 오류에서 — `defer`들의 **역순**으로 실행됩니다. `Tally`의
`defer`는 안쪽 블록에 있으므로 `TALLY`가 `DONE`보다 먼저 나옵니다. 두 가드의
`defer`는 `main`의 블록에 있고, `second`가 마지막에 지연되었으므로 먼저
실행됩니다. 그 어느 것도 당신이 일정을 잡지 않습니다. 스코프가 잡습니다.

바로잡아야 할 것 하나: `defer w.flush()`는 `main`의 첫 `defer`이므로 **마지막에**
실행됩니다 — 가드들이 자기 줄을 버퍼에 쓴 뒤에. 그것을 가드들 뒤에 두면
`DROP` 줄들은 아무도 비우지 않는 버퍼에 쓰입니다. `defer gpa.free(input)`,
`defer list.deinit(gpa)`, 다음 지도의 `defer m.unlock(io)`: 이 길의 모든
해제는 같은 발상입니다.
'''
hints = [
  "first를 선언한 바로 뒤에 defer first.drop(w);, second도 마찬가지. drop을 당신이 직접 호출하는 일은 없습니다. main의 끝이 합니다.",
  "안쪽 중괄호가 TALLY가 DONE보다 먼저 출력되는 이유의 전부입니다: 그 안의 defer tally.report(w)는 그 닫는 중괄호에서 실행됩니다. 중괄호를 없애면 뒤에 출력됩니다.",
  "defer는 언제나 역순으로 실행되고, 그래서 second가 first보다 먼저 갑니다 — 그리고 그래서 가장 먼저 지연된 flush가 그 둘 다보다 뒤에 실행됩니다.",
  "tally.report는 defer가 적힌 순간이 아니라 실행되는 순간의 집계를 읽습니다: defer는 미뤄진 문장이고, 그것이 부르는 인자들은 그때 평가됩니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.advanced.17.past-the-end"
title = "마지막 부스 하나 너머"
story = "06:00:00, 터널 입구. 6번 부스 옆의 신호판은 해안에서 터지는 모든 것의 발사표를 지니고 있고, 그 체크섬 루프는 표의 끝 너머로 항목 하나를 더 읽는다."
brief = '''
첫 줄은 `n`입니다. 다음 `n`줄은 발사표, `<NAME> <SECONDS>`입니다. 그다음 줄
`q`, 그리고 찾아볼 이름 `q`개.

이름마다 `<NAME> FIRES AT <seconds>` 또는 `<NAME> UNKNOWN`을 출력하세요. 그다음
`LOADED <n> CHECKSUM <sum of every SECONDS in the table>`을 출력하세요.

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

스타터는 깨끗하게 컴파일되고 서로 다른 두 이유로 두 번 패닉하며, 당신은 둘 다
찾아야 합니다.

첫 번째는 `lookup`입니다. 그것은 `?*Shell` — 맞는 항목의 주소, 또는 `null` —
을 돌려주고, 호출자는 들여다보지도 않고 그것에 `.?`를 씁니다. `.?`는 *이것이
null이 아님을 안다*는 뜻이고, null이면 `-O Debug`는
`panic: attempt to use null value`로 프로그램을 멈춥니다. 옵셔널을 검사하세요:
`if (lookup(...))
|shell|`이 그 뒤에 있는 것에 닿는 유일한 방법이고, `else` 가지가 `UNKNOWN`이
사는 곳입니다.

두 번째는 체크섬 루프입니다. 그것은 `1..=n`을 걸으며 `table[i]`를 읽고,
인덱스 `n`은 끝보다 하나 너머입니다: `panic: index out of bounds: index 2, len 2`.
루프를 고치세요. 그다음 그 패닉이 당신에게 무엇을 사 주었는지 이해하세요: 이
퀘스트의 C++ 판은 검사 없이 `table[n]`을 읽고, 그 주소에 마침 있는 것 — 힙의
다음 객체, 또는 아무것도 아닌 것 — 을 얻어, 아무도 재현할 수 없는 만큼 틀린
체크섬을 출력합니다. Zig는 Debug에서 모든 인덱스와 모든 `.?`를 검사하고,
`-O ReleaseFast`에서는 둘 다 검사하지 않습니다: 거기서는 같은 두 줄이 C++에서와
똑같이 정의되지 않은 동작이 됩니다. 그것이 이 랜드의 거래입니다: 빌드하는 동안
검사가 켜져 있고, 그것이 꺼질 때쯤에는 그것이 한 번도 필요하지 않았도록 하는
것이 당신의 일입니다.
'''
hints = [
  "lookup 결과를 바인딩하고 검사하세요: if (lookup(table, name)) |shell| { ... } else { UNKNOWN }. 옵셔널은 답이면서 동시에 물음입니다.",
  "유효한 인덱스는 0부터 len - 1까지입니다. 1에서 시작해 len까지 도는 루프는 양 끝에서 하나씩 어긋나 있고, 위쪽 끝만 패닉합니다. 슬라이스에 대한 for에는 틀릴 인덱스가 없습니다.",
  "두 패닉 모두 Debug 모드의 검사입니다. 스타터를 -O ReleaseFast로 빌드하면 어느 줄도 멈추지 않습니다: 체크섬은 끝 너머를 읽고, null은 주소 0까지 따라갑니다. 검사가 당신이 사는 것이고, 고침이 그 값으로 치르는 것입니다.",
  "패닉은 stderr에 메시지와 스택 트레이스를 출력하고 134로 종료합니다. 채점기는 stdout을 읽으므로, 패닉 전에 출력된 모든 것은 여전히 거기 있고 여전히 틀립니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.advanced.18.threads"
title = "차로 둘, 카운터 하나"
story = "07:00에 고가도로가 두 번째 차로를 열고 입구의 줄이 마침내 빠진다. 요금소의 다른 것은 아무것도 바뀌지 않았다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 `std.Thread`를 하나씩 시작해, 그 제곱을 계산하고 `out[i]`에 쓰게
하세요 — 자기 칸이므로 두 스레드가 같은 원소를 건드리는 일은 없습니다. 모두
join하고, 그다음 각 결과를 한 줄에 하나씩, 그다음 `THREADS <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

`std.Thread.spawn(.{}, worker, .{ args })`는 그 인자들로 새 OS 스레드에서
`worker`를 시작하고 핸들을, 또는 오류를 돌려줍니다. 인자들은 스레드 안으로
복사되므로, 넘긴 슬라이스는 `main`의 메모리를 들여다보는 뷰이고 넘긴 인덱스는 그
스레드 자신의 것입니다. 잘못된 것을 참조로 캡처할 클로저는 없습니다: 스레드가 볼
수 있는 모든 것은 튜플 안에, 당신이 읽을 수 있는 곳에 있습니다.

스레드들은 스케줄러 마음대로의 순서로 끝납니다. 인덱스로 쓰고 join 뒤에
출력하는 것이 출력을 매번 같게 만드는 것입니다. 스스로 출력하는 스레드라면
그렇지 않을 것입니다.
'''
hints = [
  "std.Thread.spawn(.{}, square, .{ nums, out, i })는 스레드를 즉시 시작하고 그 핸들을 돌려줍니다. join할 수 있도록 핸들을 std.Thread의 슬라이스에 보관하세요.",
  "for (threads, 0..) |*t, i|는 인덱스와 함께 핸들 칸들을 걷습니다. t.* = try std.Thread.spawn(...)이 각 칸을 채웁니다.",
  "out을 읽기 전에 모든 스레드를 join하세요. join()은 그 스레드가 끝날 때까지 막고, 그 뒤에는 쓴 것들이 보입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.advanced.19.join"
title = "서명 없이 떠나는 사람은 없다"
story = "차로 스레드 하나가 근무를 마치고, 반장은 그 핸들을 챙기지 않은 채 부스를 걸어 나가고, 요금소 전체의 전원이 나간다."
brief = '''
표준 입력은 개수 `n`, 그다음 텍스트 `n`줄입니다.

줄마다 스레드를 하나씩 시작해 그 줄을 대문자로 바꿔 자기 칸에 넣게 하세요.
모두 join하고, 줄들을 순서대로 출력하고, 그다음 `DONE`을 출력하세요.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

스타터는 컴파일되지 않고, 그 오류가 곧 교훈입니다. `std.Thread.spawn`은
`!std.Thread` — 핸들, 또는 오류 — 를 돌려주는데, 스타터는 그것을 맨 문장으로
바닥에 떨어뜨립니다: *error union is ignored*. Zig는 오류일지도 모르는 값이
검사되지 않은 채 지나가도록 두지 않으며, 그것은 당신에게 호의를 베푸는
것입니다: 핸들은 `join`하는 **유일한** 방법이고, 아무도 join하지 않은 스레드는
`main`이 돌아갈 때 아직 실행 중인 스레드입니다 — 프로세스가 그 발밑에서 끝나고,
스케줄러에 따라 줄들은 절반만 대문자가 되거나 전혀 되지 않습니다. C++는
join 가능한 채로 파괴된 `std::thread`에서 abort합니다. Zig는 당신 손에 핸들을
쥐여 주고 그것으로 무엇을 할 셈이었는지 묻습니다.

그러니 모든 핸들을 보관하고, 그 일의 결과를 읽기 전에 모든 스레드를 join합니다
(또는 `detach`하는데, 그것은 거의 절대 당신이 원하는 것이 아닙니다). 모양은
할당자의 것입니다: `std.Thread`의 슬라이스를 `alloc`하고, 채우고, join하고,
`free`합니다 — 그리고 join 루프는 C++ 소멸자가 서 있던 자리에 섭니다.
'''
hints = [
  "컴파일러는 spawn의 반환값을 들여다보길 원합니다. t.* = try std.Thread.spawn(...)은 핸들을 보관하고 어떤 오류든 위로 넘기는데, 그것이 두 쪽 모두에 대해 정직한 처리입니다.",
  "핸들은 n 크기의 std.Thread 슬라이스에 보관하세요. 무엇이든 출력하기 전에 for (threads) |t| t.join();.",
  "먼저 모두 spawn하고, 그다음 모두 join하세요. spawn 루프 안의 join도 여기서는 통과합니다 — 그리고 스레드를 한 번에 하나씩 실행하는데, 그것은 스레드가 있는 이유가 아닙니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.advanced.20.mutex"
title = "트레이 하나, 부스 여덟"
story = "부스마다 받은 것을 요금소 벽의 합계 하나에 더하는데, 한 시간이 끝날 때 벽은 그 모두와 어긋난다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 스레드를 하나씩 시작해 그 값을 **공유된 합계 하나**에 더하게 하세요.
모두 join하고, 그다음 `TOTAL <sum>`과 `THREADS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

스타터는 컴파일되고 `TOTAL 0`을 출력합니다. 워커는 `total`을 **값으로**
받습니다 — 스레드의 인자 튜플로 복사된 `i64` — 그리고 자기 사본에 더하고 그것을
버립니다. 포인터 `*i64`를 넘기면 다른 버그가 생기는데, 이만큼 작은 테스트에서는
드러나지 않는 것입니다: 여러 스레드에서 동시에 하는 `total.* += value`는
**데이터 레이스**입니다. Zig의 Debug 검사는 그것을 잡지 않습니다. 레이스는
여기서도 C++에서와 똑같이 정의되지 않은 동작이지, 그저 틀린 숫자가 아닙니다.

합계 옆에 두고, 그것을 건드리는 모든 스레드가 잠그는 `std.Io.Mutex`가
답입니다: `m.lockUncancelable(io)`가 그것을 잡고, `defer m.unlock(io)`가 그
사이에 무슨 일이 있든 블록 끝에서 돌려줍니다. 워커는 뮤텍스에 필요하므로
`io: std.Io`를 매개변수로 받습니다 — 0.16에서 잠금은 스레드 라이브러리가 아니라
I/O 런타임의 일부이고, `std.Thread.Mutex`는 더 이상 존재하지 않습니다.
`defer`는 C++의 `lock_guard`를, 잠금이 풀릴 바로 그 자리에 풀어 쓴 것입니다.
'''
hints = [
  "total이 아니라 &total을 넘기세요: 워커의 매개변수는 total: *i64가 되고 더하기는 total.* += value가 됩니다. 스레드는 자기 합계가 아니라 main의 합계를 바꿔야 합니다.",
  "main에 var total_mutex: std.Io.Mutex = .init;, 튜플에 &total_mutex, 그리고 워커에서 더하기 전에 m.lockUncancelable(io); defer m.unlock(io);.",
  "모든 join 뒤에 total을 읽는 것은 잠금 없이도 안전합니다: join()은 동기화 지점이고, 쓸 스레드가 남아 있지 않습니다.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.advanced.21.counter"
title = "스스로 잠그는 카운터"
story = "3번 부스의 차축 카운터는 서로 맞아야 하는 숫자 둘을 지니고 있고, 두 사람이 동시에 그것을 읽고 있다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

`Counter`를 완성하세요: `add`는 잠금을 잡고, 합계에 더하고, 적중 수를 올립니다.
`snapshot`은 잠금을 잡고 둘을 함께 돌려줍니다. 값마다 스레드를 하나씩 시작하고,
join하고, 그다음 `TOTAL <sum>`과 `HITS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

뮤텍스는 구조체 **안에**, 그것이 지키는 필드들 옆에 살고, 그것들을 건드리는
모든 함수가 그것을 잡습니다. 그것이 그 모양입니다: 잠금은 객체의 일부이지,
호출자가 기억해 주리라 믿는 무언가가 아닙니다.

스타터는 컴파일되지 않고, 그 이유는 잠깐 들여다볼 만합니다. `snapshot`은
`self: Counter`를 받습니다 — 값으로, 읽기만 하는 메서드를 흔히 쓰는 방식대로 —
그런데 뮤텍스를 잠그는 것은 *뮤텍스를 바꾸는* 일이므로,
`self.mutex.lockUncancelable(io)`는 `*std.Io.Mutex`를 원하고 값으로 받은
`self`에서 얻을 수 있는 것은 `*const`뿐입니다. 더 나쁜 것은, 값으로 받은
`self`가 카운터의 **사본**이라는 점입니다: 컴파일된다 해도 잠금의 사본을
잠글 것이고, 그것은 아무것도 잠그지 않습니다. 고침은 `self: *Counter`입니다.
손을 뻗을 `mutable` 키워드는 없습니다. 돌아갈 `const` 메서드가 없기
때문입니다: 잠금을 잡아야 하는 메서드는 시그니처에서 그렇다고 말하고, 시그니처가
약속의 전부입니다.
'''
hints = [
  "한 글자가 컴파일 오류를 고칩니다: fn snapshot(self: *Counter, io: std.Io) Snapshot. counter.snapshot(io)는 여전히 똑같이 읽힙니다. Zig가 주소를 대신 가져갑니다.",
  "값으로 받은 self는 뮤텍스까지 포함한 Counter 전체의 사본이었을 것입니다. 사본을 잠그는 것은 아무것도 지키지 않고, 그래서 컴파일러의 거부가 불편이 아니라 옳은 답입니다.",
  "Counter.add는 첫 매개변수가 *Counter인 평범한 함수이므로, std.Thread.spawn(.{}, Counter.add, .{ &counter, io, value })가 스레드가 메서드를 호출하는 방법입니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.advanced.22.lock-order"
title = "잠금 둘, 순서 하나"
story = "차양 아래 동전 트레이 둘, 잠금 둘, 부스 둘, 그리고 두 차단기가 같은 초에 멈췄다."
brief = '''
트레이 둘, `A`와 `B`, 각각 자기 `std.Io.Mutex`를 가진 `i64`입니다.

표준 입력은 첫 줄의 시작 잔량, 두 번째 줄의 개수 `n`, 그리고 `FROM`/`TO`가
`{A, B}` 안에 있는 `<FROM> <TO> <AMOUNT>` 형태의 `n`줄입니다.

모든 이체를 각자의 스레드에서 실행하고, 모두 join하고, 그다음 `A <level>`,
`B <level>`, `MOVED <n>`을 출력하세요.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

스타터에는 잘못된 것이 둘 있고, 출력에 드러나는 것은 하나뿐입니다. 그것은
출발지에서 빼고 도착지에는 결코 더하지 않습니다 — 그것이 보이는 버그입니다.
다른 하나는 모양입니다: *출발지를 먼저* 잠그는 것은 반대 방향의 두 이체가 각각
잠금 하나를 쥐고 다른 하나를 영원히 기다릴 수 있다는 뜻입니다. 그것이
교착이고, 테스트에서는 드러나지 않습니다. 어느 화요일 07:59에 드러납니다.

Zig에는 여러 뮤텍스를 한 번에 잡는 `scoped_lock`이 없습니다. 가장 가까운 것은
그것이 구현하는 규칙을 손으로 지키는 것입니다. 두 잠금을 **하나의 전역 순서**로
잡으세요 — 동전이 어느 쪽으로 움직이든, 모든 스레드에서 `A`의 뮤텍스 그다음
`B`의 것 — 그러면 순환이 생길 수 없습니다. `lockUncancelable` 둘, `defer unlock`
둘, 그리고 defer는 역순으로 풀어 주는데, 그것은 `scoped_lock`이 썼을 순서이기도
합니다.
'''
hints = [
  "어느 잔량이든 건드리기 전에 두 트레이를 모두 잠그세요: a의 뮤텍스, 그다음 b의 것, 모든 스레드에서 그 순서로, 각각 뒤에 그 defer unlock.",
  "동전의 방향은 어느 잔량에서 빼는지를 정하지, 어느 잠금을 먼저 잡는지를 정하지 않습니다.",
  "defer 둘은 역순으로 풉니다: b의 잠금이 먼저 돌아가고, 그다음 a의 것. 그것이 C++ scoped_lock이 썼을 순서이고, 규칙은 같습니다 — 모든 스레드가 순서에 합의합니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.advanced.23.queue"
title = "창구"
story = "부스 하나가 창구를 통해 계수실로 동전을 넣고 직원 하나가 그것을 꺼내는데, 직원은 06:40부터 빈 창구를 기다리고 있다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

생산자는 각 값을 `std.Io.Queue(i64)`에 넣고, 소비자는 그것들을 하나씩 꺼내 각각
두 배로 해서 출력합니다. 생산자가 모두 넣고 나면 `main`이 큐를 **닫고**,
소비자는 큐가 비고 닫히면 멈춥니다. 둘 다 await하고, 그다음 `CONSUMED <n>`을
출력하세요.

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

C++는 이것을 `std::queue`, 뮤텍스, 조건 변수, 그리고 `done` 플래그로
지었습니다. Zig 0.16은 그 전체를 타입 하나로 내놓습니다. `std.Io.Queue(T)`는
당신이 소유한 버퍼 위의 크기가 정해진 채널입니다: `putOneUncancelable(io, v)`는
가득 차 있는 동안 막히고, `getOneUncancelable(io)`는 비어 있는 동안 막히며,
`close(io)` 뒤에 빈 큐에 대한 `get`은 `error.Closed`를 돌려줍니다 — 그것이
소비자가 멈추라는 신호이고, 루프는 `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}`입니다. 큐는 FIFO이므로,
스케줄러가 무엇을 하든 순서는 입력 순서입니다.

`io.concurrent(func, .{ args })`는 런타임 자신의 풀에서 `func`를 시작하고 —
자기만의 동시성 단위가 보장되며, 그렇지 않으면 호출이 실패합니다 — 퓨처를
돌려줍니다. 그것에 대한 `.await(io)`가 join입니다. 스타터는 멈춰 버립니다.
생산자는 모두 넣고 돌아가고, 아무도 큐를 닫지 않으며, 소비자는 마지막 값에
깨어나 큐를 비우고, 오지 않을 다음 것을 기다립니다. 모든 생산자/소비자 짝에는
*더는 없을 것*이라고 말할 방법이 필요합니다 — 그것이 `close`입니다.
'''
hints = [
  "feeding.await(io) 뒤에 한 줄: hatch.close(io). 그러면 taking.await(io)가 돌아오고, 프로그램이 끝납니다.",
  "close는 아직 큐에 있는 것을 버리지 않습니다. 소비자는 큐가 빌 때까지 계속 값을 받고, 그다음에야 error.Closed를 봅니다.",
  "소비자가 실행되는 동안 출력하는 것은 그것뿐이고, main은 taking.await(io) 뒤에야 CONSUMED를 출력합니다 — 그 순서가 잠금 없이 라이터를 안전하게 지킵니다.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.advanced.24.atomic"
title = "한 워드, 잠금 없이"
story = "차축 수에는 잠금이 필요 없다. 계수실의 다른 모든 것에는 필요하고, 그 둘을 구별하는 것이 일이다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 스레드를 하나씩 시작하세요. 각각은 자기 값을 공유된
`std.atomic.Value(i64)`에 더하고 공유된 `std.atomic.Value(i64)`를 하나
올립니다 — 뮤텍스는 어디에도 없습니다. 모두 join하고 `TOTAL <sum>`과
`HITS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

스타터는 컴파일되지 않습니다: 워커는 두 아토믹을 **값으로** 받는데,
`fetchAdd`는 `*std.atomic.Value(i64)`를 원합니다 — 값으로 받은 매개변수가 줄
수 있는 것은 `*const`뿐입니다. 그것은 의도된 것입니다. 아토믹은 여러 스레드가
한 번에 명령어 하나씩 갱신하기로 합의한 장소입니다. 그 사본은 다른 장소일
것이고, 공유는 사라질 것입니다. 주소를 넘기세요.

아토믹은 더 싼 뮤텍스가 아닙니다. 명령어 하나로 읽고-바꾸고-쓰는 기계 워드
하나를 위한, 다른 도구입니다. `fetchAdd(v, .monotonic)`가 그 명령어입니다. 두
필드가 서로 맞아야 하는 순간 잠금이 돌아옵니다 — "이 두 가지를 함께"에 대한
아토믹은 없고, 그래서 앞 퀘스트의 `Counter`에는 뮤텍스가 있었고 이것에는
없습니다.

여기서 `.monotonic`으로 충분한 것은, 이 증가들이 다른 어떤 쓰기에 비해 *언제*
보이게 되는지에 달린 것이 아무것도 없고, 하나도 잃어버리지 않기만 하면 되기
때문입니다. 그 문장이 후속 질문입니다.
'''
hints = [
  "오류는 *atomic.Value(i64)를 원하는데 *const인 것을 가졌다고 말합니다. 두 매개변수를 모두 포인터로 만들고 튜플에 &total과 &hits를 넘기세요.",
  "fetchAdd는 이전 값을 돌려주고 더하기를 아토믹하게 적용합니다. _ =가 반환값을 버리고, 잠금도 defer도 없습니다.",
  "total.raw += value는 컴파일될 것이고 그것이 레이스일 것입니다. fetchAdd는 레이스가 아닌 단 하나의 명령어입니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.advanced.25.parallel-sum"
title = "요금소를 나눠라"
story = "차축 측정값 만이천 개와 부스 넷. 감독관은 부스마다의 몫과 합계를 원하고, 합계는 매번 실행할 때마다 똑같이 나와야 한다."
brief = '''
첫 줄은 `k n`입니다: 스레드 `k`개와 값 `n`개. 두 번째 줄은 그 `n`개의 값입니다.

값들을 `k`개의 연속된 덩어리로 나누고 — 덩어리 `i`는 정수 산술로 `i * n / k`부터
`(i + 1) * n / k`는 포함하지 않고 그 앞까지의 인덱스를 덮습니다 — 스레드 `i`가 자기
덩어리를 `partial[i]`에 더하게 하세요. 모두 join하고, 그다음 덩어리마다 순서대로
`CHUNK <i> <sum>`을, 그리고 `TOTAL <sum of partials>`를 출력하세요.

```
input:  2 5
        1 2 3 4 5
output: CHUNK 0 3
        CHUNK 1 12
        TOTAL 15
```

이것이 스레드로 실제로 빨라지는 모양이고, 이 지도에서 유일한 것입니다: 각
스레드는 자기 서브슬라이스를 읽고 자기 칸에 쓰므로, 잠금도, 아토믹도, 입력 말고
공유되는 것도 없습니다. 스레드에게 서브슬라이스 그 자체를 건네세요 —
`nums[begin..end]`는 뷰이고, 읽는 쪽에게는 뷰를 주어야 합니다 — 그리고 그 한
칸을 가리키는 포인터를. 덩어리 경계의 공식이 나누기를 정확하게 만듭니다 —
마지막 덩어리는 언제나 `n`에서 끝나고, `k > n`이면 덩어리가 비어 있을 수 있는데,
숨겨진 케이스 하나가 그렇게 짜여 있습니다. 빈 슬라이스는 특별한 경우 없이 합이
`0`입니다.
'''
hints = [
  "begin과 end를 main에서 계산하고 거기서 자르세요: nums[begin..end]가 스레드가 받는 뷰이고, &partial[i]가 그것이 쓸 수 있는 단 하나의 칸입니다.",
  "스레드 안의 지역 합계와 끝에서 slot.*에 한 번 쓰기가 공유 슬라이스를 스레드마다 정확히 한 번만 건드리게 합니다.",
  "k > n이면 어떤 덩어리는 비고 — begin == end — nums[begin..end]는 for 루프가 그냥 돌지 않는 빈 슬라이스입니다. 특별한 경우는 없습니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.advanced.26.futures"
title = "그 수를 약속해 줘"
story = "감독관은 숫자마다 심부름꾼을 보내고 창구에 서서 기다리지 않는다. 숫자들은 돌아올 때 돌아온다."
brief = '''
표준 입력은 개수 `n`과 그다음 정수 `n`개입니다.

값마다 그 제곱을 돌려주는 `io.concurrent` 작업을 하나씩 시작하세요. 퓨처들을
리스트에 모으고 **순서대로** `await`하며 각각을 출력하세요. 그다음 칸이 하나인
`std.Io.Queue(i64)`를 스레드 하나에 더 건네 거기에 `n`을 넣게 하고, 나온 것으로
`READY <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

퓨처는 아직 여기 없는 값입니다. `io.concurrent(square, .{ v })`는 런타임의
풀에서 `square`를 시작하고 그 반환값에 대한 `std.Io.Future(i64)`를 줍니다.
`.await(io)`는 그것이 존재할 때까지 막고 그다음 한 번 건네줍니다. 퓨처를 순서대로
await하는 것이 출력을 순서대로 놓는 것입니다 — 작업들 자체는 끝날 때 끝납니다.

Zig에는 `std::promise`가 없습니다. 가장 가까운 것은 같은 파이프의 다른
끝이고, 0.16에는 이미 그 파이프가 있습니다. **원소 하나짜리** 버퍼 위의
`std.Io.Queue(i64)`가 약속입니다: 한쪽이 값을 넣고, 다른 쪽이 그것을 꺼내며,
꺼내는 쪽은 그것이 거기 있을 때까지 막힙니다. 그것이 스레드가 뮤텍스도, 플래그도,
감쌀 반환값도 없이 결과 하나를 보고하는 방법이고 — 세 퀘스트 전의 창구와 같은
타입에 버퍼가 하나일 뿐입니다.

`io.concurrent`는 작업이 따로 실행된다고 약속합니다 — 런타임이 스레드를 줄 수
없으면 `error.ConcurrencyUnavailable`로 실패합니다 — 반면 `io.async`는 더 약한
약속을 합니다: 두 번째 스레드를 내줄 수 없는 런타임에서는 함수가 `async`가
돌아오기 전에 바로 그 자리에서 호출될 *수도* 있습니다. 그것을 뜻할 때는
`concurrent`라고 소리 내어 말하세요.
'''
hints = [
  "try io.concurrent(square, .{v})는 std.Io.Future(i64)를 돌려줍니다. 가는 대로 리스트에 덧붙이고, 퓨처는 절대 복사하지 마세요 — 포인터를 통해 await하세요, for (squares.items) |*f|.",
  "f.await(io)는 퓨처마다 정확히 한 번 호출할 수 있고 값이 거기 있을 때까지 막힙니다. 리스트를 순서대로 걸으면 출력이 순서대로 나옵니다.",
  "보고하는 스레드는 &ready와 n을 받습니다. main의 ready.getOneUncancelable(io)는 put이 일어날 때까지 막힙니다. main이 돌아가기 전에 그 스레드를 join하세요.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.advanced.27.optional-pointer"
title = "컴파일러가 말할 수 있는 크기"
story = "2번 부스 꽂이에 꽂힌 통행 영수증의 사슬: 영수증마다 다음 것을 쥐고 있고, 근무의 첫 영수증까지 죽 이어지며, 누구도 어떤 영수증을 두 번 쥐지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 센트 단위 금액 `n`개입니다.

그것들을 사슬에, 금액마다 노드 하나씩, 도착한 순서대로 담으세요:

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

세 줄을 출력하세요:

1. 금액들을 순서대로, 공백으로 나눠서, 또는 없으면 `-`
2. `SUM <total>`, 사슬에 대한 **재귀** 함수로 구한 것
3. `LAST <cents>` — 마지막 노드의 금액 — 또는 `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

스타터는 컴파일되지 않고, 그 오류가 포인터가 존재하는 이유입니다.
`next: Entry`라고 쓰면 컴파일러는 `Entry`를 메모리에 배치해야 합니다: `cents`를
위한 8바이트 더하기 `Entry`가 얼마나 크든 그만큼 — 그것이 바로 컴파일러가
알아내려는 것입니다. *struct 'Entry' depends on itself.*

`?*Entry`는 포인터이고, 포인터에는 컴파일러가 이미 아는 크기가 있습니다.
Zig에는 `unique_ptr`가 없습니다. 가장 가까운 것은 그것이 강제하던 규칙을 손으로
지키는 것입니다: **할당자가 소유자입니다.** `gpa.create(Entry)`는 노드를
건네주고 `gpa.destroy(node)`는 그것을 정확히 한 번 돌려주며, *누가* 그것을
파괴하는가라는 물음은 관례로 답합니다 — 사슬이 자기 노드들을 소유하므로,
`main`은 돌아가기 전에 사슬을 걸으며 해제합니다. `?`는 컴파일러가 실제로
검사하는 부분입니다: `null`은 사슬의 끝이면서 빈 사슬이고, 아무것도 풀지 않고는
`?*Entry`를 통해 읽을 수 없으므로, 따로 빈 경우는 어디에도 없습니다.
'''
hints = [
  "한 줄이 컴파일 오류를 고칩니다: next: ?*Entry — 그러면 이제 구조체는 무엇을 가리키든 16바이트입니다.",
  "뒤에서 앞으로 만드세요: node = try gpa.create(Entry); node.* = .{ .cents = v, .next = head }; head = node. 옛 head가 새 노드의 꼬리가 됩니다.",
  "while (walk) |node| : (walk = node.next)로 걸으세요. 옵셔널은 한 걸음마다 한 번 풀리고 루프는 null에서 끝납니다. 재귀 합은 두 줄입니다: null이면 0, 아니면 cents 더하기 나머지의 합.",
  "head를 선언한 바로 뒤에 defer freeChain(gpa, head): defer는 실행될 때, 즉 사슬이 완성된 main의 끝에서 head를 읽습니다.",
]

