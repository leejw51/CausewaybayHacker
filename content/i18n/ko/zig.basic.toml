[[quest]]
id    = "zig.basic.17.threads"
title = "부스마다 하나씩"
story = "요금소의 모든 트럭이 저마다 부스를 하나씩 얻고, 모두 한꺼번에 세며, 집계는 마지막 차단기가 내려간 뒤에야 읽힌다."
brief = '''
`std.Thread.spawn(.{}, f, .{ args })`는 만들어지는 순간 `f`를 자기 스레드에서
실행하고 `std.Thread`를 돌려줍니다. `join()`은 그것이 끝나기를 기다립니다.
인자는 복사되어 들어가는 튜플입니다: `x`는 값으로, 그리고 그 스레드 자신의
칸을 가리키는 포인터 `&results[i]`. 그래서 아무것도 공유되지 않습니다.
스레드들은 모두 join할 수 있도록 리스트에 보관되고, 모든 `join()`이 돌아올
때까지 아무것도 출력되지 않습니다.

```
try threads.append(gpa, try std.Thread.spawn(.{}, square, .{ x, &results[i] }));
for (threads.items) |t| t.join();
```

`square`, `results`(숫자마다 칸 하나), 그리고 출력은 적혀 있습니다. 자리를
채우던 것을 바꾸어 루프 안의 `// FILL`에 첫 줄을, 그 뒤의 `// FILL`에 두
번째 줄을 입력하세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "루프 안에는 try threads.append(gpa, try std.Thread.spawn(.{}, square, .{ x, &results[i] }));, 그 뒤에는 for (threads.items) |t| t.join();.",
  "spawn도 실패할 수 있고 append도 그렇기에 한 줄에 try가 둘입니다. 앞의 .{}는 spawn 설정이고, .{ x, &results[i] }가 인자 튜플입니다.",
  "join하지 않은 스레드는 results를 출력할 때 그 칸이 아직 비어 있을 수 있는 스레드입니다. 출력 전에 모두 join하세요.",
