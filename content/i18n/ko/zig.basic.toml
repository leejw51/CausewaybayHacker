[[quest]]
id    = "zig.basic.10.maps"
title = "집계판"
story = "요금소의 집계판은 밤새 지나간 모든 차종을 차량 한 대에 한 단어씩 적어 두고, 감사는 차종마다 한 줄씩 수와 함께 원한다."
brief = '''
Zig의 std에는 트리로 정렬된 맵이 없습니다: `std.StringHashMap(i64)`가
사전이고, 할당자를 기억하도록 `.init(gpa)`로 만들며, 그 키는 그것보다 오래
사는 `input`의 슬라이스입니다. `put(k, v)`는 키를 추가합니다(있는 키면
덮어씁니다). `remove(k)`는 하나를 꺼내고 그것이 있었는지 말합니다 — `_ =`가
그 대답을 버립니다. `getPtr(k)`는 있는 키의 값을 가리키는 포인터이거나,
없으면 `null`이므로, `.?.* = 9`가 그것을 풀고 그것을 통해 씁니다. 해시 맵은
키를 아무 순서로나 걸으므로, 뼈대가 키들을 복사해 내어 출력 전에
정렬합니다. 다음 노드에서는 그 줄을 당신이 쓰게 됩니다.

```
try counts.put("crab", 1);
_ = counts.remove("rice");
counts.getPtr("fish").?.* = 9;
```

`counts`는 이미 그 줄의 모든 단어를 집계하고 있고, 모든 줄에는 `fish`가
있습니다. `// FILL` 표시에 그 세 줄을 입력하세요: `crab`을 `1`로 추가하고,
`rice`를 제거하고, 그다음 `fish`를 `9`로 정합니다. 정렬된 출력은 적혀
있습니다.

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
'''
hints = [
  "try counts.put(\"crab\", 1); _ = counts.remove(\"rice\"); counts.getPtr(\"fish\").?.* = 9; — 추가, 제거, 수정.",
  "put은 없는 키를 만듭니다. getPtr는 그러기를 거부하고 대신 null을 돌려줍니다. 키가 반드시 이미 있어야 할 때 getPtr를 쓰세요 — .?는 그렇다는 약속입니다.",
]

