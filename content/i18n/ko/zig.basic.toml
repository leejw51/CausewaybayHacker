[[quest]]
id    = "zig.basic.16.lambdas"
title = "짝수 차로, 제곱해서"
story = "짝수 번호 차로는 번호의 제곱만큼 내고 홀수 차로는 아무것도 내지 않는데, 장부에는 합계를 위한 줄이 하나 있다."
brief = '''
Zig의 std에는 `accumulate`가 없습니다. 접기(fold)는 다른 함수를 받는
