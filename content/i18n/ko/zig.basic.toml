# ---------------------------------------------------------------- 20
[[quest]]
id    = "zig.basic.12.stack-queue"
title = "나중 것이 먼저, 먼저 것도 먼저"
story = "트럭들은 도착한 순서대로 고장 차량 대기소에 쌓인다: 마지막에 들어온 것이 가장 먼저 나갈 수 있고, 요금 차로에 가장 먼저 들어온 것이 가장 먼저 처리된다."
brief = '''
Zig의 std에는 스택 타입이 없습니다. ArrayList가 곧 스택이기 때문입니다:
`append(gpa, x)`가 push이고, `pop()`은 맨 위를 꺼내 옵셔널로 돌려주며,
`items[items.len - 1]`이 맨 위입니다 — 거기에 대입하면 맨 위를 제자리에서
수정합니다. 큐는 `std.Deque(i64)`입니다: 뒤에는 `pushBack(gpa, x)`, 앞에는
`popFront()`, 둘 다 대신 적혀 있습니다.

```
try st.append(gpa, 0);
_ = st.pop();
st.items[st.items.len - 1] = 99;
```

모든 숫자는 이미 `st`와 `q` 양쪽에 넣어져 있습니다. `// FILL` 표시에 그 세
줄을 입력하세요: 맨 위에 `0`을 추가하고, 그것을 다시 꺼내고, 그다음 맨 위를
`99`로 덮어씁니다. 그다음 스택을 비우며 출력하고, 큐의 앞 두 개를
가져옵니다.

```
input:  1 2 3 4
output: 99 3 2 1
        1 2
```
'''
hints = [
  "try st.append(gpa, 0); _ = st.pop(); st.items[st.items.len - 1] = 99; — 스택에 대한 추가, 제거, 수정. 큐는 건드리지 않습니다.",
  "items.len - 1이 맨 위이므로, 거기에 대입하면 다음 pop()이 돌려줄 원소가 바뀝니다.",
]

