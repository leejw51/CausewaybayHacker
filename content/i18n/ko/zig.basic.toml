[[quest]]
id    = "zig.basic.16.list"
title = "앞이냐 뒤냐"
story = "번호판이 짝수인 트럭은 오토톨 차로의 뒤에, 홀수인 트럭은 앞에 줄을 서는데, 차로 목록은 그저 뒤에만 계속 덧붙인다."
brief = '''
Zig의 `std.DoublyLinkedList`는 침습형이고 — 연결이 당신 자신의 구조체 안에
삽니다 — 정렬할 수 없으므로, 양 끝에서 하는 연습은 ArrayList로 합니다.
`insert(gpa, 0, x)`는 값을 맨 앞에 넣고 나머지를 한 칸씩 밉니다. `pop()`은
마지막 것을 꺼내 옵셔널로 돌려주고, `_ =`가 그것을 버립니다. `items[0]`이
맨 앞이고, 거기에 대입하면 첫 원소가 바뀝니다. `std.mem.sort`는 슬라이스를
정렬합니다.

```
try l.insert(gpa, 0, 0);
_ = l.pop();
l.items[0] = 99;
std.mem.sort(i64, l.items, {}, std.sort.asc(i64));
```

`l`에는 이미 그 줄의 정수들이 순서대로 들어 있습니다. `// FILL` 표시에 그
네 줄을 입력하세요: 맨 앞에 `0`을 추가하고, 마지막 원소를 제거하고, 맨 앞을
`99`로 덮어쓰고, 그다음 정렬합니다. 리스트가 출력됩니다.

```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "try l.insert(gpa, 0, 0); _ = l.pop(); l.items[0] = 99; std.mem.sort(i64, l.items, {}, std.sort.asc(i64)); — 한 줄에 하나씩, 그 순서로.",
  "insert는 할당자, 인덱스, 그다음 값을 받습니다. pop은 ?i64를 돌려주고, _ =는 그것을 원하지 않는다고 말합니다.",
]

