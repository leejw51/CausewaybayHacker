[[quest]]
id    = "zig.basic.09.vector"
title = "아침, 순서대로"
story = "부스마다 요금소 건너편으로 자기 수를 한 번에 하나씩 외치고, 근무 직원은 마지막 부스가 들어올 때까지 그것들을 둘 곳이 없다."
brief = '''
`std.ArrayList(i64)`는 자랄 수 있는 배열이고, 그것에 하는 일은 넷입니다:
추가, 제거, 수정, 정렬. `append(gpa, x)`는 끝에 추가합니다.
`orderedRemove(i)`는 인덱스 `i`의 원소를 제거하고, 빈틈을 메우고, 그 원소를
돌려줍니다 — `_ =`가 그것을 버립니다. Zig는 값이 말없이 바닥에 떨어지게
두지 않기 때문입니다. `items[i] = x`는 거기 있는 것을 덮어씁니다.
`std.mem.sort(i64, xs.items, {}, std.sort.asc(i64))`는 슬라이스를
오름차순으로 정렬합니다. 인덱스 `0`이 맨 앞입니다.

```
try xs.append(gpa, 99);
_ = xs.orderedRemove(0);
xs.items[0] = 700;
std.mem.sort(i64, xs.items, {}, std.sort.asc(i64));
```

`xs`에는 그 줄의 정수들이 들어 있습니다. 네 `// FILL` 표시에 그 네 줄을
입력하세요: 끝에 `99`를 추가하고, 첫 원소를 제거하고, 새 첫 원소를 `700`으로
정하고, 그다음 정렬합니다. 리스트가 출력되고, 그다음 그 길이가 출력됩니다.

```
input:  4 8 15 16
output: 15 16 99 700
        4
```
'''
hints = [
  "try xs.append(gpa, 99); _ = xs.orderedRemove(0); xs.items[0] = 700; std.mem.sort(i64, xs.items, {}, std.sort.asc(i64)); — 추가, 제거, 수정, 정렬.",
  "append는 실패할 수 있으므로(할당할 수도 있으니) try합니다. orderedRemove는 원소를 돌려주므로 _에 대입합니다. 정렬은 리스트가 아니라 슬라이스 xs.items를 받습니다.",
]

