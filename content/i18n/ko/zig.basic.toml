[[quest]]
id    = "zig.basic.18.binary-tree"
title = "NULL"
story = "06:00, 코즈웨이베이 터널 입구. 밤새의 영수증은 금액의 트리인데, 직원은 한 번도 있었던 적 없는 왼쪽 자식을 풀어 버렸다 — panic: attempt to use null value, 코즈웨이베이에서 틀려서는 안 되는 단 하나의 부스에서."
brief = '''
이진 탐색 트리는 값 하나와 옵셔널 자식 포인터 둘, `?*Node`를 가진 노드들이며,
무언가 매달리기 전까지 그것은 `null`입니다: 작은 값은 `left` 아래에, 큰 값은
`right` 아래에 삽니다. 삽입은 재귀적입니다: 빈 서브트리(`null`)는
`gpa.create`로 만든 새 노드가 되고, 그렇지 않으면 값은 한쪽으로 내려갑니다
— 그리고 그쪽이 무엇이 되든 다시 저장합니다. 그쪽이 조금 전까지 `null`이었을
수 있기 때문입니다. `n orelse { ... }`가 null인 경우를 먼저 다루는
방법이고, 아무도 확인하지 않은 자식에 대한 `.?`는
`panic: attempt to use null value`입니다 — 그것이 보스이고, 자리를 채우던
두 줄이 하는 일이 바로 그것입니다.

```
cur.left = try insert(gpa, cur.left, v);
cur.right = try insert(gpa, cur.right, v);
```

`Node`, `null`인 경우, `inorder`, `height`, `freeTree`, 그리고 `main`은
적혀 있습니다. 자리를 채우던 것들을 바꾸어, 두 `// FILL` 표시에 내려가는 두
줄을 입력하세요: 왼쪽 것은 `if`에, 오른쪽 것은 `else`에.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "왼쪽에는 cur.left = try insert(gpa, cur.left, v);, 오른쪽에는 cur.right = try insert(gpa, cur.right, v);.",
  "결과를 다시 저장하세요: 자식은 null이었을 수 있고, 새 노드는 insert가 돌려주는 것입니다. insert는 할당에 실패할 수 있으므로 호출을 try합니다.",
  "자리를 채우던 것은 거기에 아무것도 매달리기 전에 .?로 자식을 풉니다 — 그것이 패닉입니다. 진짜 줄은 null을 insert에 넘기고, insert의 orelse가 그 확인입니다.",
]
