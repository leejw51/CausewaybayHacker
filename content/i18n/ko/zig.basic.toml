줄입니다.

```
return if (@rem(v, 2) == 0) acc + v * v else acc;
const total = fold(xs.items, 0, evenSquare);
```

`fold`는 적혀 있고, 숫자들은 `xs`에 있으며, `total`이 출력됩니다.
`evenSquare` 안의 `// FILL`에 첫 줄을, `main` 안의 것에 두 번째 줄을
입력하세요: step은 `v`가 짝수이면 `v`의 제곱을 더하고, 아니면 `acc`를 바꾸지
않고 돌려줍니다.

```
input:  1 2 3 4 5
output: 20
```
'''
hints = [
  "evenSquare에는 return if (@rem(v, 2) == 0) acc + v * v else acc;, main에는 const total = fold(xs.items, 0, evenSquare);.",
