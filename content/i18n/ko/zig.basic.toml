  "byScore에는 if (a.score != b.score) return a.score > b.score; 그다음 return std.mem.lessThan(u8, a.name, b.name);, main에는 std.mem.sort(Row, rows.items, {}, byScore);.",
  "비교자는 \"a가 b보다 앞에 가는가\"에 대답합니다: 점수가 높은 쪽이 먼저, 같으면 작은 이름. 그 아래의 자리를 채우던 return은 지우세요.",
  "컨텍스트가 없으므로 컨텍스트 매개변수는 _: void이고, 정렬은 그 자리에 {}를 넘깁니다.",
