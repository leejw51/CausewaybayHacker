const desc: number[] = xs.toSorted((a, b) => b - a);
```

`xs`는 읽혀 있고 두 print는 모두 적혀 있습니다. 두 자리 표시자 대신 두 줄을
보이는 그대로 입력하세요.

```
input:  5 3 9 1
output: 1 3 5 9
        9 5 3 1
```
'''
hints = [
  "const asc: number[] = xs.toSorted((a, b) => a - b); 그리고 const desc: number[] = xs.toSorted((a, b) => b - a);",
  "둘 다 xs.sort(...)로 쓰면 xs 자체를 정렬하고, asc와 desc는 같은 배열이 됩니다: 둘 다 마지막 순서를 출력합니다.",
]

