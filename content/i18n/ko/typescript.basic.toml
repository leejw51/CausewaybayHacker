[[quest]]
id    = "typescript.basic.15.closures"
title = "지연"
story = "섬의 모든 스크린은 관제실 시계보다 몇 초씩 늦게 도는데, 스크린마다 지연을 기억해야 할 함수가 시각을 바꾸지 않은 채 돌려준다."
brief = '''
다른 함수 안에서 정의된 함수는 바깥 함수의 이름을 쓸 수 있고, 바깥 함수가
반환한 뒤에도 계속 씁니다. 그것이 클로저입니다: 안쪽 함수가 `k`를 지니고
다닙니다. 바깥 함수는 안쪽 함수를 돌려줍니다 — 호출한 결과가 아니라 함수 그
자체를 — 그리고 반환 타입이 그렇다고 말합니다: `(x: number) => number`는
숫자에서 숫자로 가는 함수의 타입입니다.

```
function makeAdder(k: number): (x: number) => number {
  function add(x: number): number {
    return x + k;
  }
  return add;
}
```

`makeAdder`와 그 안의 `function add`는 적혀 있고, `main`은 결과를 모든 숫자에
적용합니다. 두 자리 표시자 대신 두 `return` 줄을 보이는 그대로 입력하세요.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "add 안에 return x + k;, 그다음 makeAdder의 마지막 줄로 return add;(괄호 없이).",
  "return add()는 인자 없이 호출하고, tsc는 Expected 1 arguments, but got 0이라고 말합니다; 이름만 쓰면 함수 그 자체입니다.",
]

