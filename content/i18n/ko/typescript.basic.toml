[[quest]]
id    = "typescript.basic.14.sort-by-key"
title = "순위표"
story = "하이산 플레이스 벽면은 저녁의 가게들을 앱 탭 수로 많은 순서대로 매기고, 탭 수가 같은 두 가게는 알파벳 순으로 올라가는데, 벽면은 피드에 들어온 순서대로 보여 준다."
brief = '''
`interface`는 값의 모양에 이름을 붙입니다 — 여기서는 `name`과 `score`를 가진
`Row` — 그리고 런타임에는 완전히 지워집니다. `sort`는 두 행에 대한 비교 함수를
받습니다. `b.score - a.score`는 큰 점수를 먼저 둡니다; 그것이 `0`이면 점수가
같은 것이고, `||`가 두 번째 비교인 이름으로 넘어갑니다. 이름은 `<`와 `>`로
비교합니다(`localeCompare`가 아닙니다. 그 답은 기계의 로케일에 따라 달라집니다).

```
rows.sort((a, b) => b.score - a.score || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
```

`rows`는 `Row`의 배열이고 print는 적혀 있습니다. `// FILL` 주석 자리에 `sort`
줄을 보이는 그대로 입력하세요.

```
input:  3
        mei 40
        alex 55
        ken 40
output: alex 55
        ken 40
        mei 40
```
'''
hints = [
  "rows.sort((a, b) => b.score - a.score || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)); — 점수가 먼저, 뒤집어서; 이름은 같을 때만.",
  "비교 함수는 숫자를 돌려줍니다: 음수면 a가 먼저, 양수면 b가 먼저, 0이면 같습니다. 0 || x는 x이므로, 같으면 이름으로 넘어갑니다.",
]

