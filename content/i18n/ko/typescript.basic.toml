[[quest]]
id    = "typescript.basic.17.threads"
title = "모든 스크린이 동시에"
story = "23:00, 섬의 모든 스크린이 같은 순간에 관제실로 부하를 보고하는데, 대시보드는 그중 어느 것도 기다리지 않아서 0만 한 줄 찍는다."
brief = '''
여기서는 시작할 스레드가 없습니다: 스레드 하나와 이벤트 루프 하나뿐입니다.
`async` 함수를 호출하면 곧바로 시작되고 `Promise`를 돌려줍니다 — 일이 나중에
끝난다고 말하는 값입니다. `square`는 쓰기 전에 잠들므로, 호출이 돌아올 때
결과는 아직 없습니다. 모든 promise를 모아 두고,
`await Promise.all(tasks)`로 그것들이 모두 끝날 때까지 기다립니다 — 먼저 전부
시작하고, 그다음 한 번 기다립니다. 스레드를 시작한 뒤 join하는 것과 같은
방식입니다.

```
for (let i = 0; i < nums.length; i++) {
  tasks.push(square(i));
}
await Promise.all(tasks);
```

`square(i)`가 `results[i]`를 채우고, 루프와 두 print는 적혀 있으며, `main`은
`await`할 수 있도록 `async`입니다. 루프 본문으로 `tasks.push(square(i));`를,
그 아래에 `await` 줄을 보이는 그대로 입력하세요.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "루프 안에 tasks.push(square(i));, 그 뒤에 await Promise.all(tasks); — 모두 시작하고, 그다음 한 번 기다립니다.",
  "아무도 await하지 않는 promise도 실행은 되지만, main은 그것이 끝나기 전에 출력합니다; 루프 안의 await square(i)는 하나씩 차례로 실행합니다.",
]

