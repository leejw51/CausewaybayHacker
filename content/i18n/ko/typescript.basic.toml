[[quest]]
id    = "typescript.basic.04.strings"
title = "거울"
story = "리 가든의 창문 스크린은 가게마다 이름을 재고, 외치고, 비치는 유리를 위해 거꾸로 보여 줘야 하는데, 오늘 밤에는 이름을 바른 방향으로 한 번만 보여 준다."
brief = '''
문자열은 `.length`로 자기 길이를 알고, `.toUpperCase()`로 대문자 사본을
만듭니다. `reverse`는 없습니다: 그것은 배열의 것입니다. 그러니 문자열을 문자
배열로 펼치고, 배열을 뒤집고, 다시 잇습니다 — `[...s].reverse().join("")`.

```
console.log(s.length);
console.log(s.toUpperCase());
console.log([...s].reverse().join(""));
```

`s`는 읽혀 있고 길이는 출력됩니다. 두 번째와 세 번째 `console.log` 줄을
보이는 그대로 입력하세요.

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
hints = [
  "console.log(s.toUpperCase()); 그다음 console.log([...s].reverse().join(\"\")); — 메서드 호출 하나, 그다음 펼치기, 뒤집기, 잇기.",
  "인자 없는 join()은 글자 사이에 쉼표를 넣고, join(\"\")은 아무것도 넣지 않습니다.",
]

