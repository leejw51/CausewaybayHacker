[[quest]]
id    = "typescript.basic.06.floats"
title = "소수 셋째 자리"
story = "이워 스트리트 트램 정류장의 조도 센서는 소수 셋째 자리까지 읽고, 그 값을 받는 LED 드라이버는 단정밀도만 지니는데, 로그는 둘 다 0으로 보여 준다."
brief = '''
`number`는 64비트 double — 다른 랜드의 `f64` — 입니다. 32비트 float 타입은
없지만 볼 수는 있습니다: `Math.fround(x)`는 `x`를 가장 가까운 단정밀도 값으로
반올림하는데, 그것이 `Float32Array`가 저장할 값입니다. `.toFixed(3)`은 소수
세 자리를 출력하고, `.toFixed(10)`은 반올림이 보일 만큼 출력합니다.

```
const x: number = Number(s);
const y: number = Math.fround(x);
```

`s`는 읽혀 있고 두 print는 모두 적혀 있습니다. 두 자리 표시자 대신 위의 두
줄을 입력하세요.

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
hints = [
  "const x: number = Number(s); 그다음 const y: number = Math.fround(x); — fround는 float-round, 즉 단정밀도로의 반올림입니다.",
  "new Float32Array([x])[0]도 같은 y를 줍니다. Math.fround는 그것을 호출 하나로 쓰는 방법입니다.",
]

