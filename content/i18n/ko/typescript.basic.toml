[[quest]]
id    = "typescript.basic.08.string-slices"
title = "앞의 몇 글자"
story = "이워 스트리트 트램 정류장의 도착 안내판에는 행선지의 앞 몇 글자와 표시 하나가 들어갈 자리밖에 없고, 안내판이 읽는 피드는 전체 이름을 정확히 그대로 지켜야 한다."
brief = '''
`s.slice(0, n)`은 `s`의 처음 `n`글자를 새 문자열로 줍니다. 문자열은 바뀔 수
없으므로 슬라이스는 언제나 사본입니다 — 조각으로 무엇을 하든 `s`는
그대로입니다. 문자열에 `+=`를 쓰면 새 문자열을 만들어 이름을 다시 묶는데,
그것이 덧붙이는 방법이고, 그래서 `head`가 `let`입니다.

```
let head: string = s.slice(0, n);
head += "!";
```

`s`와 `n`은 읽혀 있고 두 print는 적혀 있습니다. 두 자리 표시자 대신 위의 두
줄을 입력하세요.

```
input:  causeway bay
        8
output: causeway!
        causeway bay
```
'''
hints = [
  "let head: string = s.slice(0, n); 그다음 head += \"!\"; — 슬라이스는 사본이고, +=는 또 하나를 만듭니다.",
  "slice(start, end)는 end 앞에서 멈추므로 slice(0, n)은 정확히 n글자입니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.basic.09.int-slices"
title = "앞에서 둘"
story = "트램 안내판은 둘째와 셋째 도착 시각을 베껴 내고 그 뒤에 마지막 둘을 붙이길 원하며, 피드 자신의 목록은 들어온 그대로 두어야 한다."
brief = '''
`v.slice(1, 3)`은 배열의 슬라이스입니다: 인덱스 1과 2의 항목을 **새 배열**로
줍니다 — 그것을 바꿔도 `v`는 절대 바뀌지 않습니다. `.push(...other)`는
`other`의 모든 항목을 끝에 펼쳐 넣습니다. 슬라이스는 0부터 세고 두 번째 숫자
앞에서 멈추며, 음수 시작은 끝에서부터 세므로 `v.slice(-2)`는 마지막 둘입니다.

```
const part: number[] = v.slice(1, 3);
part.push(...v.slice(-2));
```

`v`는 읽혀 있고 두 print는 모두 적혀 있습니다. 두 자리 표시자 대신 위의 두
줄을 입력하세요.

```
input:  1 2 3 4 5
output: 2 3 4 5
        1 2 3 4 5
```
'''
hints = [
  "const part: number[] = v.slice(1, 3); 그다음 part.push(...v.slice(-2)); — slice는 복사하고, push는 제자리에서 덧붙입니다.",
  "... 없는 part.push(v.slice(-2))는 숫자 둘이 아니라 배열 하나를 넣고, tsc가 그렇다고 말합니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.basic.10.byte-slices"
title = "처음 세 바이트"
story = "하이산 플레이스 벽면의 타일은 저마다 가게 이름의 처음 세 바이트와 그 뒤의 표시 하나를 받아, 바이트를 16진수로 로그에 남긴 뒤 글자로 밝히는데, 오늘 밤 모든 타일이 꺼져 있다."
brief = '''
`Uint8Array`는 바이트의 줄로, 칸마다 0부터 255까지의 숫자 하나입니다. 여기의
캡션은 평범한 ASCII이므로, 적혀 있는 줄이 `charCodeAt`으로 한 글자씩 바이트를
만듭니다. (이 랜드에는 `TextEncoder`가 없습니다: 퀘스트가 볼 수 있는 Node는
`node.d.ts`뿐입니다.) `.slice(0, 3)`은 처음 세 바이트의 **사본**입니다 —
`.subarray`라면 같은 메모리를 보는 뷰가 됩니다. 타입 배열은 길이가 고정되어
늘어날 수 없으므로, 덧붙이려면 새 배열을 만들어야 합니다:
`Uint8Array.of(...head, 0x21)`, 여기서 `0x21`은 `"!"`입니다.

```
let head: Uint8Array = bytes.slice(0, 3);
head = Uint8Array.of(...head, 0x21);
```

`s`와 `bytes`는 읽혀 있고 두 print는 모두 적혀 있습니다. 두 자리 표시자 대신
위의 두 줄을 입력하세요.

```
input:  kwan lee
output: 6b776121
        kwa!
```
'''
hints = [
  "let head: Uint8Array = bytes.slice(0, 3); 그다음 head = Uint8Array.of(...head, 0x21); — 복사하고, 그다음 더 긴 것을 만듭니다.",
  "Uint8Array에는 push가 없습니다: 길이는 만들어질 때 고정됩니다. Uint8Array.of는 원하는 바이트를, 펼친 것까지 그대로 받습니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.basic.05.loops"
title = "프레임 세기"
story = "타임스 스퀘어 스크린은 루프마다 프레임에 1부터 n까지 번호를 매기고, 운영자는 그 합과 세 번째마다 걸리는 프레임이 몇 개인지 원하는데, 미리보기 아래 카운터는 0을 두 번 읽는다."
brief = '''
세는 `for` 루프는 괄호 안에 세 부분이 있습니다: 시작, 매번 돌기 전에 확인하는
조건, 그리고 한 걸음. `for (let i = 1; i <= n; i++)`는 `1`부터 `n`까지
포함해 셉니다 — `<=`가 `n` 자신을 마지막 값으로 만듭니다.

```
for (let i = 1; i <= n; i++) {
  total += i;
  if (i % 3 === 0) {
    threes += 1;
  }
}
```

`n`은 읽혀 있고, `total`과 `threes`는 `0`에서 시작하며, 루프 본문은 적혀
있습니다. 본문 위에 `for` 줄을 보이는 그대로 입력하세요.

```
input:  10
output: 55
        3
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — 시작, 조건, 한 걸음을 세미콜론으로 나눕니다.",
