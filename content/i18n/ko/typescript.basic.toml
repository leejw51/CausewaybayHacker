[[quest]]
id    = "typescript.basic.18.binary-tree"
title = "UNDEFINED"
story = "23:59, 30층 관제실: 스크린 id의 트리는 아래에 아무것도 없는 루트 하나이고, 첫 조회가 Cannot read properties of undefined (reading 'left')로 죽는다."
brief = '''
이진 탐색 트리는 노드의 왼쪽 서브트리에 더 작은 값을, 오른쪽에 더 큰 값을
둡니다. 삽입은 재귀입니다: 빈 서브트리(`undefined`)는 새 `TreeNode`가 되고,
아니면 값은 한쪽으로 내려가며, 돌아온 것을 다시 그 자식으로 저장합니다. 그
자식이 방금 전까지 `undefined`였을 수 있기 때문입니다. `undefined`에서
`.left`를 따라가는 것이 이 길의 이름이 된 바로 그 충돌입니다.
`TreeNode | undefined` 타입은 자식이 없을 수 있다고 말하는 계약이고, strict
tsc는 `undefined` 검사를 통과하기 전까지 `n.val`을 읽게 해 주지 않습니다 — 그
검사가 먼저이고, 그것은 적혀 있습니다.

```
if (v < n.val) {
  n.left = insert(n.left, v);
} else {
  n.right = insert(n.right, v);
}
```

`TreeNode`, `insert`의 `undefined` 경우와 `if (v < n.val)` / `else` 뼈대,
`inorder`, `height`, `main`은 적혀 있습니다. 두 `// FILL` 자리 표시자 대신 재귀
두 줄을 보이는 그대로 입력하세요.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "if 아래에 n.left = insert(n.left, v);, else 아래에 n.right = insert(n.right, v);.",
  "대입이 핵심입니다: insert는 서브트리의 루트를 돌려주는데, 자식이 undefined였다면 그것은 새 TreeNode입니다.",
]
