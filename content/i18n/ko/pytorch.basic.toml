파라미터를 학습 가능으로 표시하고, 순전파를 실행하고, 손실에 대해 `backward()`를 호출하세요. `w * w`의 기울기는 `2w`이므로, `4.0`에서 `w.grad`에 `8.0`으로 들어옵니다.

`.grad`는 역전파가 실행되기 전까지 `None`입니다. 첫 훈련 루프가 `None`을 출력하고 멈추는 흔한 이유가 그것입니다.

```
output: 8.0
```
'''
hints = [
  "loss.backward() — 그래프의 끝에 대해 호출하며, 절대 파라미터에 대해 호출하지 않습니다.",
  "기울기는 w.grad에 들어옵니다. backward() 자체는 아무것도 돌려주지 않습니다.",
]

