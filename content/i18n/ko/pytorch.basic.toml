[[quest]]
id    = "pytorch.basic.05.layer-by-hand"
title = "풀어 쓴 층"
story = "층은 클래스가 되기 전에 연산 두 개이고, 야간 근무조는 아무것도 가리지 않은 채 그것을 한 번 보고 싶어 한다."
brief = '''
선형 층은 행렬 곱 하나와 편향 덧셈 하나이고, 그 밖에는 아무것도 없습니다. 모양 `(batch, in)`인 배치 `x`와 모양 `(out, in)`인 가중치 `W`(torch가 저장하는 모양)에 대해, 출력은 `x @ W.t() + b`입니다.

`W.t()`는 `(in, out)`이므로 안쪽 차원이 맞고, 모양 `(out,)`인 `b`는 배치 전체에 브로드캐스트됩니다.

그것을 풀어 쓰고, 모양과 반올림한 결과를 출력하세요.

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
hints = [
  "x @ W.t() + b — 안쪽 차원을 맞춰 주는 것이 전치입니다.",
  "x @ W도 여기서는 행렬이 정사각이라 실행되지만, 엉뚱한 것을 계산합니다.",
]

