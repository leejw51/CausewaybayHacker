[[quest]]
id    = "pytorch.basic.16.optimiser"
title = "세 줄"
story = "지금까지 작성된 모든 훈련 루프는 같은 세 줄을 같은 순서로 담고 있는데, 야간 근무조가 베낀 것은 순서가 다르다."
