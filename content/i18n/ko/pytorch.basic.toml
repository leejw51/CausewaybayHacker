[[quest]]
id    = "pytorch.basic.03.normalise"
title = "아무도 합의하지 않은 척도"
story = "한 특징은 도 단위로, 다음 특징은 와트 단위로 잰다. 모델은 훈련의 모든 걸음을 와트가 더 크다는 걸 배우는 데 쓴다."
brief = '''
특징을 표준화한다는 것은 평균을 빼고 표준편차로 나누는 것이며, 그러면 모든 열이 0을 중심으로 퍼짐 1을 갖게 됩니다.

`dim=0`에 대한 평균은 열마다 숫자 하나(모양 `(features,)`)이고, 이것을 `(batch, features)`에서 빼면 행들을 따라 아래로 브로드캐스트됩니다. 표준편차도 마찬가지입니다.

그다음 반올림한 열 평균을 출력하세요. 구성상 0입니다.

```
input: 1 10 2 20 3 30
output: [0.0, 0.0] [1.0, 1.0]
```
'''
hints = [
  "(x - x.mean(dim=0)) / x.std(dim=0) — dim=0은 행을 접어서 열마다 숫자 하나를 남깁니다.",
  "dim=0이 없으면 텐서 전체의 평균이 나오고, 두 특징이 뒤섞입니다.",
]

