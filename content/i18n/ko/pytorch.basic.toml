[[quest]]
id    = "pytorch.basic.04.split-xy"
title = "레이블 열"
story = "캡처 파일은 레이블을 마지막 열로 붙여 놓았고, 모델은 그동안 답을 보며 훈련해 왔다."
brief = '''
날것의 표는 보통 레이블을 특징과 함께 담고 있습니다. 나누는 것은 슬라이스 두 개입니다. 마지막 열 전까지의 모든 것, 그리고 마지막 열 하나.

`x[:, :-1]`은 모든 행, 마지막을 뺀 모든 열입니다. `x[:, -1]`은 모든 행의 마지막 열이고, 열 축이 사라지므로 행마다 숫자 하나로 나옵니다.

두 모양을 출력하고, 그다음 레이블을 출력하세요.

```
input: 1 2 0 3 4 1
output: (2, 2) (2,) [0.0, 1.0]
```
'''
hints = [
  "table[:, :-1]과 table[:, -1] — 슬라이스는 축을 남기고, 인덱스 하나는 축을 없앱니다.",
  "table[:, -1:]은 열 축을 남겨서 (2, 1)을 주는데, 같은 모양이 아닙니다.",
]

