id    = "pytorch.basic.13.the-gradient"
title = "이 점에서의 기울기"
story = "파라미터는 4.0이고, 손실은 그것의 제곱이며, 훈련 걸음이 묻는 질문은 언제나 하나, 어느 쪽이 내리막이냐다."
