# PYTORCH LAND — BASIC, in Korean. A translation pack (SPEC §12.1): the
# prose of `content/pytorch/basic.toml`, quest by quest, and nothing else.
# Code blocks, identifiers, sample input and output and the exact strings a
# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "pytorch.basic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.basic.01.night-shift"
title = "야간 근무"
story = "기계실, 23:00. 콘솔에서 읽기값 한 줄이 텍스트로 나오는데, 아래층의 모든 도구는 텐서를 원한다."
brief = '''
표준 입력으로 공백으로 구분된 숫자 한 줄이 들어옵니다. 그것을 **float** 텐서로 바꾸고, 모양을 튜플로, 그리고 합계를 출력하세요.

`input().split()`은 문자열 리스트를 주고, `float(t)`는 그중 하나를 변환합니다. 이 둘에 대한 리스트 컴프리헨션 하나가 변환의 전부이고, `torch.tensor`가 그 리스트를 받습니다.

합계는 0차원 텐서에서 파이썬 숫자를 꺼내는 `.item()`으로 출력하며, 순환소수가 자기 자신과 어긋나지 않도록 소수점 아래 네 자리로 반올림합니다.

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
hints = [
  "torch.tensor([float(t) for t in input().split()]) — 쪼개고, 변환하고, 감쌉니다.",
  "1차원 모양은 끝에 쉼표가 붙어 출력됩니다: (4)가 아니라 (4,).",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.basic.02.the-batch"
title = "여섯을 둘로"
story = "숫자 여섯 개가 회선에서 납작하게 들어온다. 모델은 특징 셋짜리 샘플 둘을 위해 작성되었고, 납작한 한 줄은 거부한다."
brief = '''
모델은 납작한 한 줄을 원하는 일이 거의 없습니다. `(batch, features)`를 원합니다. `reshape`는 같은 숫자들에 새 모양을 주고, 한 자리에 놓인 `-1`은 *이것은 나머지로부터 계산하라*는 뜻입니다.

납작한 읽기값을 세 개씩의 행으로, 행이 몇 개가 되든 그렇게 바꾸고, 모양과 첫 행의 마지막 숫자를 출력하세요.

```
input: 1 2 3 4 5 6
output: (2, 3) 3.0
```
'''
hints = [
  "flat.reshape(-1, 3) — 열은 셋이고, 행 수는 추론됩니다.",
  "reshape(3, -1)은 몇 개씩인지 모를 세 행이 되고, 그건 반대 방향입니다.",
]

