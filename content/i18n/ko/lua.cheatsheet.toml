hints = [
  "Lua는 값의 목록을 이름의 목록에 대입하고, 무엇이든 저장하기 전에 오른쪽 전부를 먼저 평가합니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "lua.cheatsheet.28.error"
title = "북을 멈춰라"
story = "향이 없는 막대는 결함이고, 점화수는 계속 가는 대신 메시지와 함께 줄을 멈춰야 한다."
