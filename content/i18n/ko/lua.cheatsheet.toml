  "string.format은 C의 printf 코드를 받습니다. 정밀도는 점 뒤에 씁니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.cheatsheet.08.sort-desc"
title = "큰 사람부터"
story = "장대를 메는 사람들이 키 순서로 선다. 가장 큰 사람이 앞에."
brief = '''
`t`는 숫자 리스트입니다. **내림차순**으로, 제자리에서 정렬하세요.
'''
hints = [
  "table.sort는 `a`가 `b`보다 앞에 오는지를 말해 주는 함수를 받습니다.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.cheatsheet.09.closure"
title = "계수기"
story = "연화궁 문 앞의 진행 요원은 기억하는 계수기로 등을 센다."
brief = '''
`counter()`는 호출할 때마다 1씩 세어 올라가는 함수를 돌려줍니다:

```
local function counter()
  local n = 0
  -- ____
end
local c = counter()
print(c(), c())  -- 1  2
```
'''
hints = [
  "안쪽 함수가 바깥의 `n` 자체를 바꾸고 돌려줍니다. Lua에는 `+=`가 없습니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.cheatsheet.10.setmetatable"
title = "새 스택"
story = "향은 창고 탁자 위에 쌓여 있고, 마디마다 자기 더미를 원한다."
brief = '''
`s`를 메서드 조회가 `Stack`으로 넘어가는 새 빈 테이블로 만드세요.

```
local Stack = {}
Stack.__index = Stack
function Stack:push(x) self[#self + 1] = x end
-- ____
s:push(5)
```
'''
hints = [
  "없는 키는 메타테이블의 `__index`를 통해 찾습니다. setmetatable이 그것을 설정하고 테이블을 돌려줍니다.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.cheatsheet.11.colon"
title = "콜론"
story = "향 하나를 더 올린다. 호출은 그게 누구의 더미인지 알아야 한다."
brief = '''
`Stack.push`는 `function Stack:push(x)`로 정의되었고, `s`는 스택입니다.
`s`에 5를 넣으세요.
'''
hints = [
  "`:`로 정의한 메서드에는 숨은 첫 매개변수 `self`가 있습니다. 호출이 그 자리에 테이블을 넘겨야 합니다.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.cheatsheet.12.pcall"
title = "용의 머리"
story = "자정. 용의 머리가 사원 계단을 오른다. 나쁜 향 하나가 그것을 무너뜨려선 안 된다."
brief = '''
`f(x)`는 에러를 낼 수 있습니다. 에러가 잡히도록 호출하세요: 실패하면 `ok`는
`false`, `err`는 메시지입니다.
'''
hints = [
  "pcall에 함수와 인자를 따로 넘기세요. 호출은 pcall이 직접 하고, 상태가 먼저 옵니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "lua.cheatsheet.13.pop"
title = "맨 위에서"
story = "향이 한 개씩 더미에 올라간다. 불 붙이는 사람은 맨 위 것을 다시 집어 간다."
brief = '''
`t`는 스택으로 쓰는 리스트이고, 향은 `table.insert(t, x)`로 올라갑니다. `t`의
**맨 위**(마지막) 원소를 꺼내 `top`에 담아, `#t`가 하나 줄게 하세요.
'''
hints = [
  "붙이는 라이브러리가 떼기도 하고, 위치를 주지 않으면 끝에서 가져갑니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.cheatsheet.14.gmatch-numbers"
title = "한 줄 위의 숫자들"
story = "마디 개수가 공백으로 띄운 숫자 한 줄로 도착한다: `3 14 15`."
brief = '''
`line`은 `"3 14 15"`이고 `t`는 빈 테이블입니다. `t`를 세 **숫자** 3, 14, 15로
채워 — `t[1] == 3`이 참이고 `#t`가 3이 되게 하세요.
'''
hints = [
  "패턴 반복자는 연속된 숫자 글자를 문자열로 건넵니다. 연속이란 하나 이상이고, 문자열은 아직 숫자가 아닙니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "lua.cheatsheet.15.sub"
title = "앞 세 글자"
story = "코즈웨이베이의 노선 안내판은 거리 이름마다 앞 세 글자만 보여 준다."
brief = '''
`s`는 `"CausewayBay"`입니다. `head`를 그 앞 세 글자 `"Cau"`로 만드세요.
'''
hints = [
  "Lua 문자열은 1부터 세고, 부분 문자열 메서드는 시작과 끝(포함)을 받습니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.cheatsheet.16.pairs"
title = "모든 키"
story = "향 장부는 번호가 아니라 메는 사람 이름으로 적혀 있고, 진행 요원은 모든 항목을 읽어 주길 원한다."
brief = '''
`t`는 `{ann = 3, bo = 5, cy = 2}`입니다 — 문자열 키, 리스트 부분 없음. **모든**
항목을 키는 `k`로, 값은 `v`로 받으며 도는 루프를 여세요.
'''
hints = [
  "ipairs는 1, 2, 3, …을 걷다가 첫 빈 인덱스에서 멈춥니다. 이 테이블에는 `t[1]`이 아예 없습니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "lua.cheatsheet.17.select"
title = "몇 명이 왔나"
story = "메는 사람들이 이름을 외쳐 점호에 답한다. 몇몇은 아무 말도 안 하는데, 진행 요원은 그들도 센다."
brief = '''
`count`는 인자를 몇 개든 받습니다. `n`을 넘어온 인자의 개수로 — `nil`도
**포함해서** — 만드세요:

```
local function count(...)
  -- ____
  return n
end
print(count(1, nil, 3))  -- 3
```
'''
hints = [
  "가변 인자를 테이블에 담으면 구멍이 사라집니다. 위치로 인자를 고르는 내장 함수에는 개수만 세는 특별한 첫 인자가 있습니다.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "lua.cheatsheet.18.concat"
title = "이름 한 줄"
story = "순서지는 장대를 메는 사람들을 한 줄에, 이름 사이에 공백 하나씩 두고 나열한다."
brief = '''
`parts`는 `{"Tai", "Hang", "Road"}`입니다. `s`를 하나의 문자열
