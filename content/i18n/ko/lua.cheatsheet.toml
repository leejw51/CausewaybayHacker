# LUA LAND — CHEATSHEET, in Korean. A translation pack (SPEC §12.1): the prose
# of `content/lua/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks and identifiers are copied verbatim.

pack   = "lua.cheatsheet"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet.01.read-line"
title = "첫 줄"
story = "21:00, 원사 거리. 대원 명단이 한 줄씩 들어온다."
brief = '''
표준 입력에서 한 줄을 줄바꿈 없이 문자열로 `line`에 읽으세요.
'''
hints = [
  "io.read는 형식을 받습니다: 한 줄용, 숫자용, 전부용이 따로 있습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet.02.not-equal"
title = "같지 않다"
story = "두 사람이 용의 같은 마디를 메겠다고 한다. 진행 요원이 번호가 다른지 확인한다."
brief = '''
`a`와 `b`가 **같지 않을** 때 참인 `if`를 여세요.
'''
hints = [
  "Lua는 '같지 않다'를 느낌표가 아니라 물결표로 씁니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.cheatsheet.03.last"
title = "꼬리"
story = "용의 머리는 1번 마디다. 진행 요원은 오늘 밤 용이 얼마나 길든 꼬리를 원한다."
brief = '''
`t`는 `{10, 20, 30}` 같은 리스트입니다. 길이가 얼마든 `last`를 마지막 원소로
만드세요.
'''
hints = [
  "리스트는 1부터 시작하니, 길이가 곧 마지막 원소의 인덱스입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.cheatsheet.04.local"
title = "여기에만"
story = "마디마다 자기 향 개수를 따로 센다. 거리의 다른 누구도 보면 안 된다."
brief = '''
`count`를 0에서 시작하고 현재 블록 안에서만 보이는 변수로 만드세요 — 전역이
아니라.
'''
hints = [
  "새 이름에 그냥 대입하면 전역이 됩니다. 범위를 좁히는 데는 키워드 하나면 됩니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.cheatsheet.05.concat"
title = "이름표"
story = "메는 사람마다 종이 이름표를 받는다: 단어, 대시, 그리고 번호."
brief = '''
`n`은 숫자 7입니다. `s`를 문자열 `"id-7"`로 만드세요.
'''
hints = [
  "Lua에서 `+`는 산술일 뿐입니다. 문자열은 점 두 개로 잇습니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet.06.ipairs"
title = "머리부터 꼬리까지"
story = "점호는 머리부터 마디 하나하나 순서대로 간다."
brief = '''
리스트 `t`를 1, 2, 3, … 순서로, 인덱스는 `i`로 원소는 `v`로 받으며
순회하세요.
'''
hints = [
  "테이블 자체는 반복자가 아닙니다. 리스트 부분을 순서대로 돌며 인덱스, 값을 주는 내장 함수가 하나 있습니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet.07.format"
title = "소수 둘째 자리"
story = "인쇄된 순서지는 각자 몫의 향을 소수 둘째 자리까지 적는다."
