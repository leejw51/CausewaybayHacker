'''
hints = [
  "table 라이브러리는 문자열 리스트를 호출 한 번에 잇습니다. 구분자는 두 번째 인자입니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "lua.cheatsheet.19.floor-div"
title = "몫과 나머지"
story = "향을 셋씩 나눠 준다. 창고가 연화궁에 몇 개를 빌려 주는 바람에 개수가 음수가 되었다."
brief = '''
`a`는 `-7`, `b`는 `3`입니다. `q`를 **내림**한 몫(`-3`)으로, `r`을 **음이 아닌**
나머지(`2`)로 만들어, `q * b + r == a`가 되게 하세요.
'''
hints = [
  "LuaJIT에는 정수 나눗셈 연산자가 없고, `/`는 언제나 실수입니다. `%`는 이미 음의 무한대 쪽으로 내립니다. fmod는 그렇지 않습니다.",
]

# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.cheatsheet.20.shift-letter"
title = "용이 돈다"
story = "타이항 로드의 자정. 용의 머리가 블록을 돌고, `z`를 멘 사람이 앞으로 나와 다시 `a`가 된다."
brief = '''
`c`는 소문자 한 글자, `k`는 음이 아닌 숫자입니다. `out`을 알파벳에서 `k`자리
뒤의 글자로, 끝에 닿으면 처음으로 돌아가게 만드세요 — `"z"`에 `k = 1`이면
`"a"`입니다. 소문자 `a`는 바이트 97입니다.
'''
hints = [
  "문자열에는 산술이 없습니다. 바이트를 얻고, 그것을 0..25 안에서 옮긴 다음, 바이트를 다시 한 글자짜리 문자열로 돌리세요.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "lua.cheatsheet.21.insert"
title = "이름 하나 더"
story = "늦게 온 메는 사람이 원사 거리의 창고에 도착하고, 그의 이름은 명단 끝에 오른다."
brief = '''
`t`는 이름의 리스트입니다. table 라이브러리로 `x`를 `t`의 **끝**에 넣어 — 인덱스
