'''
hints = [
  "빈 테이블도 여전히 테이블이고, 모든 테이블은 truthy입니다. 서로 다른 두 테이블은 결코 같지 않습니다. 개수를 물으세요.",
]

# ---------------------------------------------------------------- 27
[[quest]]
