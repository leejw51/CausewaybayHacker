  return math.floor(a / b), a % b
end
-- ____
print(q, r)  -- 2  1
```
'''
hints = [
  "호출은 여러 값을 돌려줄 수 있고, 쉼표로 구분한 이름 목록이 오는 대로 받습니다 — 래퍼도 괄호도 없이.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.cheatsheet.26.empty"
title = "아직 아무도"
story = "첫 북소리 전에, 진행 요원은 명단에 누가 서명하기는 했는지 확인한다."
brief = '''
`t`는 구멍 없는 리스트이고 비어 있을 수 있습니다. `t`에 원소가 **없을** 때
