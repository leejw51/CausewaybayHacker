hints = [
  "리스트를 키우는 라이브러리 호출은 테이블을 먼저 받습니다. 위치를 주지 않으면 값을 마지막 것 다음에 둡니다.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "lua.cheatsheet.22.countdown"
title = "열에서 하나로"
story = "용의 머리에 불을 붙이는 카운트다운이 열에서 하나까지, 타이항 로드 건너편으로 외쳐진다."
brief = '''
