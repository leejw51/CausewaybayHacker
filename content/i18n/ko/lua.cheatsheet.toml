  "숫자 for는 세 번째 값이 달리 말하지 않으면 하나씩 올라갑니다 — 그리고 세 번째 값 없이 시작이 끝보다 크면 0번 돕니다.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.cheatsheet.23.tally"
title = "집계"
story = "진행 요원은 메는 사람마다 향을 몇 개 가져갔는지 이름별로 집계한다. 빈 장부에서 시작해서."
brief = '''
`seen`은 비어 있는 채로 시작하는 테이블이고 `k`는 메는 사람의 이름입니다.
