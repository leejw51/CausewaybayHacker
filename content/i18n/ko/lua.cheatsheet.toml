]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "lua.cheatsheet.29.and-or"
title = "둘 중 하나"
story = "향을 열 개 넘게 든 사람은 창고에서 5달러 부담금을 내고, 나머지는 모두 8달러를 낸다."
brief = '''
`n`은 숫자입니다. `fee`를 `n > 10`이면 5, 아니면 8로 만드세요 — 식 하나로, `if` 문
없이.
'''
hints = [
  "한 키워드는 왼쪽이 참일 때 오른쪽을 내놓고, 다른 키워드는 그렇지 않을 때 채워 넣습니다. 어느 값이 어디에 떨어지는지 읽으세요.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "lua.cheatsheet.30.copy"
title = "두 번째 명단"
story = "자정. 진행 요원은 오늘 밤 명단을 복사해, 내일의 수정이 불용 밤의 기록을 건드리지 않게 한다."
brief = '''
`src`는 숫자의 리스트입니다. `cp`를 같은 원소를 가진 **새** 리스트로 만들어,
`cp[1] = 99`가 `src[1]`을 그대로 두게 하세요. 이 땅은 LuaJIT (Lua 5.1)로 돕니다.
'''
hints = [
  "테이블을 대입하면 테이블이 아니라 참조가 복사됩니다. 리스트의 값들을 새 생성자에 펼쳐 넣으세요 — 그리고 5.1에서 펼치는 것은 `table`의 필드가 아니라 전역입니다.",
]
