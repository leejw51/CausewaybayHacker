에러가 아니라 1이 됩니다.
'''
hints = [
  "nil에 대한 산술은 에러를 일으키고, `+`는 `or`보다 더 세게 묶입니다. 기본값은 덧셈 뒤가 아니라 앞에 주세요.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.cheatsheet.24.function"
title = "둘의 합"
story = "두 창고가 향을 합치고, 그 합계에는 온 거리가 부를 수 있는 이름 있는 함수가 필요하다."
brief = '''
`add`를 숫자 둘의 합을 돌려주는 **지역** 함수로, 한 줄에 정의하세요.
'''
hints = [
  "Lua의 본문은 저절로는 아무것도 돌려주지 않고, `function`으로 연 것은 중괄호가 아니라 단어로 닫습니다.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.cheatsheet.25.two-returns"
title = "한꺼번에 둘"
story = "창고는 향을 세 개씩 묶어 나눠 주고, 진행 요원은 묶음 수와 낱개 수를 한 번에 원한다."
brief = '''
`divmod`는 값 둘을 돌려줍니다. 둘 다 받으세요:

```
