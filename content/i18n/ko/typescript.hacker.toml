[[quest]]
id    = "typescript.hacker.31.palindrome"
title = "거꾸로 해도 같은"
story = "상위 스무 개 안의 문제, 대부분의 스크린에서 어떤 형태로든 나오고, 대부분 한 번 써 봤지만 끝내 이해하지 못한 그 문제."
brief = '''
표준 입력은 `n alphabet seed`입니다. 문자열은 직접, 감기는 64비트 산술로
만드세요 (`bigint`를 `BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

가장 긴 회문 부분 문자열의 길이를 출력하고, 그다음 `AT <index>` — 그 길이를
가진 것 중 **가장 왼쪽** 것의 0부터 세는 시작 위치를 출력하세요.

```
input:  12 3 5
output: 5
        AT 1
```

각 중심에서 바깥으로 확장하세요. 중심은 `n`개가 아니라 `2n - 1`개입니다:
모든 문자는 홀수 길이 회문의 중심이고, 두 문자 사이의 모든 틈은 짝수
길이 회문의 중심입니다. 틈을 잊는 것이 맞아 보이는 풀이가 `abba`에 `1`을
돌려주는 이유입니다 — 그리고 스타터가 하는 일이 그것입니다.

**테스트가 강제하는 것과 강제하지 않는 것**을, 분명히. 실제로 일하는 숨은
케이스는 **한** 글자 알파벳 위의 `n = 8000`입니다. 중심 확장의 최악
경우입니다 — 모든 중심이 문자열 끝까지 달립니다 — 그래서 올바른 답은
거기서 온전한 `O(n²)`, 문자 비교 삼천이백만 번을 하고, 이 기계에서 약
0.1초에 끝납니다. 그것은 또한 모든 부분 문자열을 하나씩 검사하는 답을
거부합니다. 그것은 세제곱입니다: 이 크기에서 `10^11` 규모의 비교이고, 제한은
10초입니다.

다른 큰 케이스, 두 글자 알파벳 위의 `n = 20000`은 **정확성** 케이스이지
속도 케이스가 아닙니다: 무작위 이진 문자열에서 회문 검사는 한두 글자 만에
실패합니다. 그것은 당신의 생성기와 가장 왼쪽 인덱스 동점 처리가 큰
규모에서 우리 것과 일치하는지를 검사합니다.

정리하면: 테스트는 세제곱을 거부하고 제곱을 받아들입니다. `O(n)` 답인
매내커 알고리즘을 **요구하지는 않습니다**. 그것이 존재한다는 것과 무엇을
하는지는 알아 두세요. "그럼 제곱보다 잘할 수 있나요?"가 이 문제를 보통
꺼내는 이유인 후속 질문이니까요.
'''
hints = [
  "중심마다 확장 둘: 홀수 길이는 (c, c), 짝수 길이는 (c, c + 1). 스타터에는 두 번째가 빠져 있습니다.",
  "루프가 멈추면 i와 j 모두 회문에서 한 칸씩 벗어나 있습니다 — 그래서 시작은 i + 1이고 길이는 j - i - 1입니다.",
  "엄격히 더 긴 회문에서만 갱신하면, 각 길이에서 가장 왼쪽 것이 남습니다. 그리고 여기서 범위 검사는 선택 사항이 아닙니다: 양쪽 끝을 동시에 벗어나면 `s[i]`와 `s[j]`가 둘 다 `undefined`이고, `undefined === undefined`는 참이며, 한 글자 문자열에서 루프는 결코 멈추지 않습니다.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "typescript.hacker.32.modular"
title = "10억 7로 나눈 나머지"
story = "그 문구가 문제 맨 아래에 나타나고, 방의 절반은 그것이 무엇을 하라는 것인지 모른다."
brief = '''
표준 입력은 `n q seed`입니다. 질의 `q`개를 감기는 64비트 산술로 생성하세요
(`bigint`를 `BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

각 질의마다 이항 계수 `C(a, b)`를 **1000000007로 나눈 나머지**로 계산하세요.
`q`개 답 전체의 합을, 역시 `1000000007`로 나눈 나머지로 출력하고, 그다음
`LAST <the final query's answer>`를 출력하세요.

```
input:  10 5 3
output: 209
        LAST 1
```

이 크기에서 `C(a, b)`는 수십만 자리이므로 곱셈마다 그때그때 줄입니다.
문제는 나눗셈입니다: `a! / (b! (a-b)!)`는 모듈러 산술에서 의미가 없습니다.
그것을 대신하는 것이 **모듈러 역원**이고, `1000000007`이 소수이므로
페르마의 소정리가 그것을 줍니다: `inverse(v) = v^(p-2) mod p`, 반복 제곱으로
계산합니다.

정리하면: `factorial[0..n]`을 한 번 미리 계산하고, 각 질의에
`f[a] * inv(f[b]) * inv(f[a-b])`로 답하세요.

**그리고 이 언어가 더하는 함정이 여기 있습니다.** 두 인수는 모두 `2^30`
미만이므로 곱은 `2^60` 미만입니다 — 그리고 `number`는 double이라 `2^53`까지만
정확합니다. 평범한 number에서 `a * b % P`는 오버플로하지 않고, 예외도 던지지
않으며, 틀립니다: 그것으로는 예시조차 `504334178`로 나옵니다. 곱셈을
`bigint`로 하거나, 한 인수를 15비트 절반 둘로 쪼개 어떤 중간값도 `2^46`을
넘지 않게 하세요 — 스타터에는 그 `mulmod`가 이미 들어 있고, 직접 유도할 수
있을 만한 가치가 있습니다.

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 200000`,
`q = 200000`입니다. 각 계수를 독립적으로 계산하는 것 — 항 `b`개를 곱하고,
항 `b`개로 나누고, 각각 모듈러 역원 하나씩 — 은 여기서 10초 실행 제한에 대해
30초가 지나도 끝나지 않았습니다. 그것이 스타터입니다. 공유 팩토리얼 표
하나면 약 0.1초에 끝납니다. 둘 다 이 기계에서 측정했습니다.
'''
hints = [
  "곱셈마다 줄이고, 두 나머지를 맨 `*`로 곱하지 마세요: 2^53을 넘으면 double은 높은 비트를 지키고 낮은 비트를 버리는데, 답은 낮은 비트입니다.",
  "`powmod(v, P - 2)`가 모듈러 역원이고, P가 소수이기 때문에만 동작합니다 — 그것이 여기서 페르마의 소정리가 말하는 내용 전부입니다.",
  "역팩토리얼도 미리 계산하면 — `inverse[n] = powmod(factorial[n], P - 2)`, 그다음 내려가며 `inverse[i - 1] = inverse[i] * i` — 모든 질의에서 pow 둘이 사라집니다. 질의당 `mulmod` 두 번만 남습니다.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "typescript.hacker.33.grid-paths"
title = "블록을 가로질러, 결코 뒤로는 말고"
story = "대나무 비계로 거리 셋이 막힌 배달 격자. 건너가는 방법은 몇 가지이고, 어느 길이 가장 싼가."
brief = '''
표준 입력은 `r c pct seed`입니다. 격자는 직접, 행 우선 순서로, 칸마다
값을 **둘** 뽑아서, 감기는 64비트 산술로 만드세요 (`bigint`를
`BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

열린 칸을 통해 **오른쪽** 또는 **아래**로만 움직입니다. 출력하세요:

1. `PATHS <k>` — `(0,0)`에서 `(r-1,c-1)`까지 서로 다른 경로가 몇 개인지,
   `1000000007`로 나눈 나머지
2. `MIN <cost>` — 양 끝점을 모두 세어 경로의 가장 작은 총비용, 경로가
   없으면 `-1`

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

행 우선 순서로 한 번 지나가면 둘 다 됩니다: 한 칸의 경로 수는 위와 왼쪽에서
그 칸으로 들어오는 경로 수의 합이고, 최선 비용은 자기 비용에 그 둘 중 싼
쪽을 더한 것입니다. 오른쪽이나 아래로만 움직이므로 필요한 두 칸은 항상
이미 끝나 있습니다 — 그래서 재귀도 방문 집합도 필요 없습니다. 메모이제이션
재귀도 칸 수에 선형이겠지만, `1000 × 1000` 케이스에서는 프레임 이천 개
깊이가 됩니다. node의 스택은 그것을 버티지만, 그것이 답이라는 뜻은 아닙니다:
루프에는 깊이가 아예 없고, `2000 × 2000` 후속 질문은 질문 하나 거리에
있습니다.

`PATHS` 수를 `1000000007`로 나눈 나머지로 하는 것은 늘 그렇듯: `1000 × 1000`
숨은 케이스에서 실제 수는 600자리가 넘습니다. 여기서 그것은 스타일 문제가
아닙니다. `number`는 처음 몇십 행 안에 `2^53`을 넘어 정확성을 잃고, 그다음
조용히 틀린 나머지를 출력할 것이므로, 더하면서 줄이세요 — `1000000007`
미만인 두 나머지의 합은 `2^31` 미만이고, 그것은 정확합니다.

**큰 케이스가 강제하는 것:** 경로를 열거하는 모든 답을 거부합니다. 경로는
이 방의 원자보다 많습니다.

`number[][]` 안의 칸 백만 개는 배열 천 개에 흩어진 박싱된 슬롯 백만 개입니다.
`i * c + j`로 인덱싱하는 평평한 `Float64Array(r * c)`는 메모리 한 덩어리이고
코드는 같습니다.
'''
hints = [
  "두 모서리를 포함해 모든 칸에 값을 둘 뽑으세요 — 생성기는 그 칸들을 건너뛰지 않고, 막기를 거부할 뿐입니다.",
  "위나 왼쪽에 도달 가능한 이웃이 없는 열린 칸은 경로 0개로 도달되고 최선 비용이 없습니다. `Infinity`가 정직한 도달 불가입니다: `Math.min`은 그것을 무시하고 `Infinity + cost`는 여전히 `Infinity`입니다.",
  "목적지가 열려 있어도 도달 불가능할 수 있고, 그것이 정확히 PATHS가 0이고 MIN이 -1인 경우입니다. 숨은 케이스 중 하나가 그것입니다.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.hacker.34.stable-sort"
title = "동점은 자리를 지킨다"
story = "라이더 둘이 같은 점수로 끝났는데, 타임스 스퀘어 스크린의 리더보드는 다시 그릴 때마다 둘을 다른 순서로 놓는다."
brief = '''
표준 입력은 `n buckets seed`입니다. 라이더 `n`명을 만들되, 라이더 `i`는
인덱스 `i`와 점수를 가지며, 감기는 64비트 산술로 만드세요 (`bigint`를
`BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

라이더를 점수 **내림차순**으로 정렬하세요. 점수가 같은 라이더는 들어온
순서를 지켜야 합니다. 인덱스를 공백으로 구분해 출력하고, 그다음
`TIES <k>` — 정렬된 순서에서 점수가 같은 인접 쌍이 몇 개인지 출력하세요.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets`가 작으므로 거의 모든 것이 동점이고, 답은 거의 전적으로 동점에
무슨 일이 일어나는지로 정해집니다.

**이것은 지금 어떤 정렬을 들고 있는지 아는 것에 관한 퀘스트입니다.**
`Array.prototype.sort`는 ES2019부터 **안정**할 것이 요구되었고, V8은
2018년부터 그 약속을 지켜 왔습니다. 안정하지 *않은* 것은 오름차순으로 정렬한
다음 `.reverse()`를 호출하는 것입니다: 그것은 다른 모든 것과 함께 동점도
뒤집고, 스타터가 하는 일이 그것입니다. 예시에서 눈에 띄게 뒤섞고, 실제
입력에서는 언제나 그럴 것입니다.

정답은 둘이고, 둘 다 말할 수 있어야 합니다. 비교자로 내림차순 정렬하고 —
`(a, b) => b.score - a.score` — 나머지는 안정성에 맡기세요. **또는** 비교를
**전순서**로 만드세요 — `b.score - a.score || a.index - b.index` — 그러면
어떤 두 원소도 같다고 비교되지 않으므로 안정성은 더 이상 문제가 아닙니다.
기본으로 손을 뻗을 것은 두 번째입니다. 전순서는 증명할 것이 없고, 그 약속보다
오래된 엔진에서도 마찬가지입니다.

그리고 비교자는 선택 사항이 아닙니다. 비교자 없는 `sort()`는 라이더들을
`toString`이 주는 문자열로 비교하고, 객체의 그것은 모두에게
`[object Object]`입니다.

여기서 시계는 속도를 재고 있지 않고, 잴 것도 없습니다: 둘 중 어느 것을 쓰든
`sort`는 `sort`입니다. 이 네 케이스는 전적으로 동점에 무슨 일이 일어나는지로
정해집니다. 이 퀘스트는 당신의 정렬이 얼마나 빨리 약속을 지키는지가 아니라,
무엇을 약속하는지 아는 것에 관한 것입니다.
'''
hints = [
  "`.reverse()`를 지우고 비교자를 `b.score - a.score`로 뒤집으세요. 그것이 안정 정렬 쪽 답이고, 언어가 그것을 약속합니다.",
  "다른 답은 `b.score - a.score || a.index - b.index`입니다 — 전순서이므로 불안정할 동점이 남아 있지 않습니다.",
  "TIES는 완성된 순서에서 인접한 같은 점수를 세고, 그 수는 둘 중 어느 것을 썼든 같습니다 — 당신을 드러내는 것은 인덱스 순서입니다.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "typescript.hacker.28.lru"
title = "소거"
story = "여섯 번째 면접, 7-32호실. 타입은 런타임에 사라지고, 시계는 사라지지 않는다."
brief = '''
첫 줄은 `cap q`이고, 그다음은 `q`줄의 연산 — 각각 `PUT <key> <value>` 또는
`GET <key>` — 이거나, 첫 줄에 **세 번째** 숫자 `seed`가 있으면 더 이상의 줄은
전혀 없고 `q`개 연산은 아래 생성기에서 나옵니다.

가득 찼을 때 **가장 오래 사용되지 않은** 항목을 내보내는 고정 용량 캐시를
구현하세요. `GET`과 `PUT` 모두 키를 사용한 것으로 칩니다. 캐시가 이미 가진
키에 대한 `PUT`은 값을 바꾸고 그 키를 가장 최근 것으로 만듭니다 — 항목을
더하지 않으므로, 캐시가 아무리 가득 차 있어도 아무것도 내보내지 않습니다.

각 `GET`마다 값을 출력하고, 없으면 `-1`을 출력하세요. 끝에 살아남은 키를
가장 최근에 사용한 것부터 공백으로 구분해 출력하고 — 캐시가 비었으면
`-` — 그다음 `EVICTED <k>`를 출력하세요.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

예시를 따라가 보세요: `GET 1`이 `1`을 다시 최근 것으로 만들므로, `PUT 3`이
자리가 필요할 때 나가는 것은 `2`입니다. `GET 2`는 빗나갑니다. `GET 3`은
맞고 `3`을 가장 최근 것으로 만들며, 그래서 생존자가 `3 1`로 출력됩니다.

생성되는 형태는 감기는 64비트 산술로 만듭니다 (`bigint`를
`BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**스타터는 `strict` 아래에서 깨끗하게 컴파일되고, 틀렸습니다.** 캐시를
`Record<number, number>`에 두고, 누구나 반쯤 기억하는 사실에 기댑니다: 객체는
키를 삽입 순서로 유지한다. 그래서 건드리기는 삭제 후 다시 삽입이고, 가장 차가운
항목은 `Object.keys(cache)[0]`입니다. 예시로 돌려 보면 `GET 2`가 `20`을
출력합니다.

그것이 보스입니다. 타입은 키가 `number`라고 했고, 타입은 런타임에 사라집니다:
객체의 키는 **문자열**이고, `Object.keys`는 그것들을 `"1"`과 `"2"`로
돌려주며, 삽입 순서 규칙에는 바로 이런 키들을 위해 언어에 적힌 예외가
있습니다 — **정수처럼 생긴 키는 어디에 삽입되었든 숫자 오름차순으로 맨 앞에
옵니다**. `1`을 지우고 다시 넣어도 그것이 정렬되는 자리는 조금도 바뀌지
않습니다. 내보내기는 가장 차가운 키가 아니라 가장 작은 키를 제거하고, tsc는
그것에 대해 한마디도 할 수 없습니다. 프로그램의 어느 것도 타입이 잘못되지
않았기 때문입니다. tsc가 검사한 모든 것은 검사한 시점에는 참이었습니다.

고치는 것은 스타터가 가정한 것을 실제로 뜻하는 구조입니다: `Map`. 그 키는
`number`로 남고, 순회 순서는 예외 없는 삽입 순서입니다. `delete`와 `set`이
건드리기이고, `cache.keys().next().value`가 차가운 끝이며,
`[...cache.keys()].reverse()`가 가장 최근 것부터입니다 — 그리고 전부 연산당
`O(1)`입니다. 다른 언어에서는 이중 연결 리스트로 들어가는 해시 맵이 주는
것을, 여기서는 `Map`이 포인터를 숨긴 채 줍니다.

(이 면접의 Python 버전에서는 보스가 재귀 한계였고, 이천 연산짜리 숨은
케이스는 여기에도 여전히 있습니다. node의 스택은 프레임 만 개 정도 깊이이므로
머리를 처리하고 꼬리로 재귀하는 버전도 통과하겠지만 — 그것은 이 입력에 대한
사실이지, 그렇게 쓸 이유가 아닙니다. 연산의 나열은 `for` 루프입니다.)
'''
hints = [
  "스타터에 대고 예시를 손으로 돌려 보면서 연산마다 `Object.keys(cache)`를 출력하세요. 보이는 순서는 삽입한 순서가 아닙니다.",
  "`Record<number, V>`는 타입입니다. 그 아래의 객체는 문자열 키를 가지고, 정수처럼 생긴 문자열 키는 다른 모든 키보다 먼저 숫자 오름차순으로 나열됩니다. 그 규칙은 엔진의 버릇이 아니라 명세에 있습니다.",
  "`new Map<number, number>()`: 맞을 때마다, 덮어쓸 때마다 `delete` 다음 `set`을 하고, 가득 찬 캐시에 새 키가 오면 `cache.keys().next().value`를 지우세요. 이미 있는 키를 덮어쓰는 것은 내보내기가 아닙니다 — 캐시가 가득 찼다고 판단하기 전에 `has`를 확인하세요.",
  "생존자는 뜨거운 끝에서 읽은 Map입니다: `[...cache.keys()].reverse()`, 정렬도 스탬프도 없이.",
