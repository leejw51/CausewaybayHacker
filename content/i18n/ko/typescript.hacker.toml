]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.hacker.15.topo-sort"
title = "어떤 순서로 빌드되는가"
story = "사이니지 제어실 빌드 뒤의 패키지 열한 개와 의존성 그래프. 설치 순서를 대거나, 순서가 없다는 뜻인 순환을 대라."
brief = '''
첫 줄은 `n m`입니다: `0..n-1`로 번호 매긴 작업 `n`개와 간선 `m`개. 다음
