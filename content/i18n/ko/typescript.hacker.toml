[[quest]]
id    = "typescript.hacker.20.bits"
title = "혼자인 것"
story = "모든 전표가 두 번 스캔되는데 하나만 아니다. Map도 못 쓰게 하고 정렬도 못 하게 한다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 음수가 아닌 정수 `n`개이고, 모든 값이 정확히
두 번 나오되 하나만 예외입니다.

네 줄을 출력하세요:

1. 한 번만 나오는 값. **xor**와 상수 추가 공간으로 찾으세요
2. 그 값에 켜진 `1` 비트가 몇 개인지
3. 2의 거듭제곱이면 `POW2 YES`, 아니면 `POW2 NO` (`0`은 아닙니다)
4. 가장 낮은 켜진 비트를 끈 값, 켜진 비트가 없으면 `0`

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0`이고 `x ^ 0 == x`이며, xor는 순서를 따지지 않습니다. 그것이
첫 줄의 전부입니다. `x & (x - 1)`은 가장 낮은 켜진 비트를 끄고, 그것이
셋째와 넷째 줄을 공짜로 줍니다.

여기의 모든 비트 연산자는 피연산자를 먼저 **32비트 부호 있는** 정수로
변환합니다. 이 케이스들의 값은 작아서 그것은 아무 비용이 없습니다 — 하지만
`2 ** 31 | 0`은 `-2147483648`이고, `2^31` 이상의 값은 아무 말 없이 음수가
되거나 잘려서 나옵니다. 그 선 너머에서는 `bigint`가 폭 제한 없이 같은
연산자를 가집니다. 면접관이 묻기 전에 그 선이 어디인지 아세요.

여기의 네 케이스는 많아야 숫자 다섯 개이고, 시계는 그 위에서 속도를 재고
있지 않습니다: 개수를 세는 `Map`도 모두 통과하고, 정렬도 마찬가지일
것입니다. 더 큰 케이스여도 그것은 바뀌지 않습니다. 이 문제가 세우는 기준은
**공간** — 누산기 하나, 그 외에는 없음 — 이고, 어떤 실행 제한도 상수 공간
답과 `Map`을 구별하지 못하기 때문입니다. 그것은 당신의 양심에, 그리고
물어볼 면접관에게 달려 있습니다.
'''
hints = [
