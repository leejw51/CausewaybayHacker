[[quest]]
id    = "typescript.hacker.12.heap"
title = "정렬된 줄 k개"
story = "하이산 플레이스 벽의 모든 스크린이 재생 목록을 이미 순서대로 보낸다. 전부를 다시 정렬하지 않고 한 줄로 합쳐라."
brief = '''
첫 줄은 `k`입니다. 그다음 `k`줄, 각 줄은 개수 뒤에 그 개수만큼의 정수가
이미 오름차순으로 정렬되어 있습니다.

전부를 오름차순 한 줄로 병합해 공백으로 구분해 출력하고, 그다음
`POPS <total count>`를 출력하세요.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

표준 라이브러리에는 힙이 없으므로 힙이 답의 일부입니다: `i`의 자식이
`2i+1`과 `2i+2`인 배열, 새 항목을 위로 올리는 `push`, 마지막 항목을 루트로
옮겨 아래로 내리는 `pop`. 스물다섯 줄이고, 그것을 준비 없이 쓸 수 있는 것이
이 퀘스트의 목적입니다. 항목은 `[value, which list, how far into it]`이고,
비교는 값 먼저, 그다음 리스트 인덱스입니다 — 동점에서의 순서는 *어떤*
순서이기만 하면 무엇이든 됩니다.

힙은 원소마다가 아니라 리스트마다 항목 하나를 들므로, 리스트가 아무리
길어도 크기 `k`를 유지합니다.

여기의 네 케이스는 리스트 두세 개에 걸친 숫자 몇 개뿐이고, 시계는 그 위에서
속도를 재고 있지 않습니다: 전부를 배열 하나에 쏟아붓고 정렬하는 것도 넷 모두를
통과하고, 매 단계 `k`개의 머리를 전부 다시 훑는 것도 마찬가지입니다. `k`가 클
때 `O(N log k)`를 지켜 주는 것이 힙이고, 그것은 이 케이스들에 들어 있지 않은
입력에 대한 약속입니다.
'''
hints = [
  "힙 항목은 값이 어디서 왔는지를 실어야 합니다. 아니면 pop한 뒤 다시 채울 수 없습니다. 이름 붙은 튜플 `[value: number, which: number, at: number]`은 그것을 타입으로 말합니다.",
  "위로 올리기: 항목이 부모 `(i - 1) >> 1`보다 작은 동안 둘을 교환하세요. 아래로 내리기: 자식이 더 작은 동안 더 작은 자식과 교환하세요. `[h[i], h[p]] = [h[p], h[i]]`는 임시 변수 없이 교환합니다.",
  "`pop`에서는 루트를 받아 두고, 그다음 배열에서 마지막 항목을 `pop()`하세요. 무언가 남아 있으면 그 항목을 루트에 놓고 아래로 내리세요. 이 순서를 틀리면 항목 하나짜리 힙이 유일한 항목을 두 번 돌려줍니다.",
  "어떤 리스트의 원소를 pop할 때만 그 리스트의 다음 원소를 push하세요 — 그래야 힙이 k를 유지합니다.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.hacker.13.backtracking"
title = "모든 조합"
story = "가게를 배치할 수 있는 모든 방법을 나열하라. 전부, 정해진 순서로, 같은 것을 두 번 출력하지 말고."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 **이미 오름차순으로 정렬된** 서로 다른 정수
`n`개입니다.

모든 부분집합을 한 줄에 하나씩, 값은 공백으로 구분해서, 빈 부분집합은
`-`로 출력하세요. 순서는 자연스러운 재귀가 만들어 내는 대로: 각 위치에서
원소를 **취하는** 분기 먼저, 그다음 건너뛰는 분기. 그다음 `SUBSETS <2^n>`을
출력하세요.

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

push, 재귀, **pop**. pop이 사람들이 빼먹는 부분이고, 증상은 첫 줄 이후
모든 줄이 너무 길어지는 것입니다. 공유되는 `chosen` 배열 하나가 핵심입니다:
호출마다 `[...chosen, x]`를 해도 옳기는 하지만, 한 줄을 쓰지 않으려고 매
단계에서 선택 전체를 복사합니다. 여기서의 순서는 재귀 자신의 순서이고,
검사되는 것이 그것입니다.

`2^n`에 대해 `1 << n`은 32비트 시프트이고 `n = 31`부터 틀립니다. 어차피
출력한 줄의 수가 정직한 숫자입니다.
'''
hints = [
  "원소마다 재귀 호출 둘: 하나는 push한 채로, 하나는 없이. 취하는 쪽을 먼저 하면 예시의 순서가 저절로 나옵니다.",
  "`chosen.pop()`은 두 호출 사이에 들어갑니다. 그것이 시도-재귀-되돌리기의 `undo`입니다.",
  "기저 경우는 `at === nums.length`이고, 거기서의 빈 선택이 빈 부분집합이며, 그것도 셉니다. 빈 배열에 `chosen.join(\" \")`을 하면 빈 문자열이므로 `-`는 당신이 써야 합니다.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.hacker.14.word-search"
title = "그 단어가 격자에 있는가"
story = "글자판 하나와 이름 하나. 그 이름이 판에 적혀 있는지 알고 싶어 하고, 막다른 길의 수도 원한다."
brief = '''
첫 줄은 `r c`입니다. 다음 `r`줄은 소문자 격자입니다. 마지막 줄은 단어입니다.

**인접한** 칸 사이를 위, 아래, 왼쪽, 오른쪽으로 움직여 철자를 이어 갈 수
