  "LCS는 min 대신 max를 쓰고 불일치에서 대각선 걸음이 없는 같은 순회입니다. 그리고 `Array.from`에는 함수를 넘기고, 배열로 `fill`하지 마세요 — `fill`은 모든 칸에 같은 객체를 넣습니다.",
]

# ---------------------------------------------------------------- 19
[[quest]]
id    = "typescript.hacker.19.knapsack"
title = "가방에 들어가는 것"
story = "라이더 하나, 가방 하나, 그리고 무게와 팁이 각각 적힌 주문판. 탐욕법은 엉뚱한 것을 고른다."
brief = '''
첫 줄은 `n cap`입니다. 다음 `n`줄은 `<weight> <value>`입니다. 각 품목은
최대 **한 번**만 담을 수 있습니다.

`cap`에 들어가는 최선의 총 가치를 출력하고, 그다음 `GREEDY <v>`를
출력하세요: 아직 들어가는 것 중 무게당 가치가 가장 좋은 품목을 반복해서
집었을 때 얻는 값. 무게당 가치가 같으면 더 가벼운 품목이 먼저입니다.

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

두 숫자가 다르다는 것이 이 퀘스트의 핵심 전부이고, 예시가 그것을 보여 줍니다:
무게당 가치가 가장 좋은 것은 `1.67`인 `6 10` 품목이고, 그것을 집으면
남는 네 칸에 아무것도 들어가지 않습니다. 그것을 포기하고 `5 7` 둘을 집으면
`14`입니다. 숨은 케이스는 작으므로 검사하는 것은 표가 빠른지가 아니라 두
숫자를 모두 맞혔는지입니다.

비율은 정확히 비교하세요. 여기에는 분수 타입이 없고, `value /
weight`는 double입니다: 종이 위에서 같은 두 비율이 이진수에서는 조금 어긋나게
나올 수 있고, 그러면 동점 처리가 결코 실행되지 않습니다. 대신 교차 곱을
하세요 — `a.value * b.weight` 대 `b.value * a.weight` — 곱이 `2^53` 미만에
머무는 한 정수에서 정확합니다.
'''
hints = [
