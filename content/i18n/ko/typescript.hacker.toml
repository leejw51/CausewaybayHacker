[[quest]]
id    = "typescript.hacker.10.tree-walk"
title = "트리를 도는 세 가지 방법"
story = "화이트보드에 트리 하나, 그리고 아무도 두 번 생각할 필요가 없어야 하는 질문: 세 가지 순서의 이름을 대라."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 **레벨 순서**의 값 `n`개이고, `-1`은 "여기
노드 없음"입니다 — 그러니까 트리는 힙처럼 저장됩니다: 인덱스 `i`의
자식은 `2i+1`과 `2i+2`입니다.

네 줄을 출력하세요: **전위**, **중위**, **후위** 순회를 각각 공백으로
구분해서, 그다음 `DEPTH <d>` — 가장 긴 루트-잎 경로 위의 노드 수.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

전위는 노드, 왼쪽, 오른쪽. 중위는 왼쪽, 노드, 오른쪽. 후위는 왼쪽,
오른쪽, 노드. 재귀는 매번 같은 세 줄이고 `push`의 위치만 움직입니다. 여기서
재귀는 트리 깊이만큼 깊고, 힙 모양 배열에서 그것은 `log n`이므로 node의
스택 — 기본으로 프레임 만 개 정도 — 은 걱정거리가 아닙니다. 그것을 소리 내어
말하세요. 물어볼 테니까요.

배열 끝을 넘으면 `tree[i]`는 `-1`이 아니라 `undefined`입니다. 타입은
`number`라고 합니다. 기저 경우는 값뿐 아니라 인덱스도 검사해야 합니다.
'''
hints = [
  "push가 세 자리 중 하나에 놓이는 재귀 함수 하나가 거의 똑같은 함수 셋보다 낫습니다.",
  "기저 경우는 두 조건을 한꺼번에 봅니다: 배열 끝을 넘었거나, -1 위에 앉아 있거나.",
  "깊이는 1 + 두 자식 중 더 깊은 쪽이고, 없는 노드는 0입니다.",
]

