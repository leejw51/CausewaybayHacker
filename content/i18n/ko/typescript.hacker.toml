[[quest]]
id    = "typescript.hacker.22.trie"
title = "접두사 상자"
story = "트램 정류장 안내판용 자동 완성 — 정직한 종류, 실제로 목록에 있는 것만 완성하는."
brief = '''
첫 줄은 `n q`입니다. 다음 `n`줄은 삽입할 소문자 단어입니다. 다음 `q`줄은
질의이고, 각각 `WORD <s>` 또는 `PREFIX <s>`입니다.

트라이 — 각 노드가 글자에서 자식으로 가는 맵을 가진 노드들의 트리 — 를
만들고 답하세요:

* `WORD <s>` → `s`가 삽입되었으면 `YES`, 아니면 `NO`
* `PREFIX <s>` → 삽입된 `n`개 단어 중 `s`로 시작하는 것이 몇 개인지

`n`개 단어가 서로 다르다는 보장은 없고, `PREFIX`는 서로 다른 단어가 아니라
**삽입 횟수**를 셉니다: `tram`을 두 번 삽입하면 `PREFIX tram`은 `2`입니다.
`NODES`는 노드를 세므로 두 번째 삽입은 아무것도 더하지 않습니다.

그다음 `NODES <k>`, 루트를 포함한 트라이의 노드 수를 출력하세요.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

모든 노드에 삽입된 단어가 몇 개 지나가는지 세어 두면, `PREFIX`는 끝에서
세는 일 없이 걸어가기만 하면 됩니다. 노드는 작은 클래스이고, 자식은 글자를
키로 하는 `Map<string, TrieNode>`입니다. 평범한 `{}`도 한 글자 키에서는
버티겠지만, 문제는 그 습관입니다: 단어 전체를 키로 쓰면 `"constructor" in {}`는
이미 `true`이고, 당신이 삽입한 적 없는 프로토타입이 답합니다. `Map`에는 발에
