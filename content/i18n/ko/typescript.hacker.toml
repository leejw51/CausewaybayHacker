[[quest]]
id    = "typescript.hacker.23.prefix-sums"
title = "목표를 맞히는 방법은 몇 가지"
story = "하루의 매출과 감사관이 보고 싶어 하는 숫자 하나. 연속된 시간들의 합이 정확히 그 숫자가 되는 구간은 몇 개인가."
brief = '''
첫 줄은 `n k`입니다. 둘째 줄은 정수 `n`개이고, 음수일 수 있습니다.

합이 정확히 `k`인 연속 구간이 몇 개인지 출력하고, 그다음 `RANGE <s>`,
목록 전체의 합을 출력하세요. 다시 더하지 말고 마지막 접두사 합에서
읽으세요.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

음수 값은 슬라이딩 윈도를 죽입니다 — 너무 커진 창은 줄여서 고칠 수
없습니다. 살아남는 것은 접두사 합입니다: 구간 `i..j`의 합이 `k`인 것은
정확히 `prefix[j] - prefix[i] == k`일 때이므로, `prefix[j] - k`와 같은
이전 접두사가 몇 개인지 세세요. 처음부터 시작하는 구간을 위해 맵에
`0 → 1`을 미리 심어 두세요.

키는 `Map<number, number>`로 두세요. 평범한 객체도 접두사를 키로 받기는
하지만, 그것을 **문자열**로 돌려줍니다: `{ [-2]: 1 }`의 `Object.keys`는
`["-2"]`입니다. 타입은 `number`라고 했지만, 런타임은 그것을 지키지 않았습니다.

여기의 네 케이스는 많아야 숫자 다섯 개이고, 시계는 그 위에서 속도를 재고
있지 않습니다: 모든 시작과 모든 끝에 대한 `O(n²)` 이중 루프도 넷 모두를
통과합니다. 기준은 진짜입니다 — 하루치 매출에서 그 이중 루프는 몇 분이
걸립니다 — 그리고 이 케이스들이 검사하는 것은 그것이 아닙니다. 검사하는
것은 틀리기 쉬운 부분입니다: `0 → 1` 초기값, 그리고 기록하기 전에 찾아보기.
'''
hints = [
  "현재 접두사를 기록하기 *전에* 이전 접두사를 찾으세요. 아니면 k가 0일 때 길이 0인 구간이 자기 자신을 셉니다.",
  "처음에 `new Map([[0, 1]])`을 해 두는 것이 인덱스 0에서 시작하는 구간을 찾을 수 있게 하는 것입니다.",
  "`seen.get(prefix - k) ?? 0` — `||`가 아니라 `??`입니다. `||`도 여기서는 맞지만, 그것이 대신하는 개수가 0이라는 우연 덕분일 뿐입니다.",
]

