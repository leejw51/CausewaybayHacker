[[quest]]
id    = "typescript.hacker.29.dijkstra"
title = "모든 거리의 길이가 같지는 않다"
story = "지금까지 클리어한 모든 지도는 정류장 수를 셌다. 트램은 정류장이 몇 개인지 신경 쓰지 않는다. 얼마나 걸리는지를 신경 쓴다."
brief = '''
표준 입력은 `n m seed`입니다: 정류장 `n`개, 가중치 있는 무방향 간선 `m`개.
그래프는 당신이 직접, **정확히** 이 생성기로, 감기는 64비트 산술로 만드세요
(`bigint`를 `BigInt.asUintN(64, …)`로 감습니다 — `number`로는 상태를 담을 수
없습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

정류장 `0`에서 도달 가능한 모든 정류장까지의 최단 거리의 합 (`0` 자신도
포함, 그것은 `0`)을 출력하고, 그다음 `MAX <the largest of them>`을
출력하세요.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**여기서는 복잡도가 강제됩니다.** 숨은 케이스 하나는 `n = 100000`,
`m = 200000`입니다. 다익스트라는 어느 쪽이든 맞는 알고리즘입니다. 시계가
가르는 것은 우선순위 큐입니다. 방문하지 않은 모든 노드를 훑어 최솟값을
찾는 것은 `O(V²)` — `10^10`걸음이고, 이 기계에서 10초 실행 제한에 대해
**26초**가 걸렸습니다. 이진 힙이면 `O((V + E) log V)`가 되고 약 0.25초에
끝납니다. 두 수치 모두 이 기계에서, 이 퀘스트에 딸린 두 프로그램으로 측정한
것입니다: 스타터가 훑는 버전입니다.

분명히 봐 둘 만합니다. 시간 제한 스크린에서 떨어지는 가장 흔한 방식이기
때문입니다: **스타터는 틀리지 않았습니다.** 정확히 맞는 답을 출력합니다.
너무 늦게 도착한다는 이유만으로 거부됩니다.

표준 라이브러리에는 우선순위 큐가 없습니다. 힙은 당신의 몫이고, 병합
퀘스트와 같은 것에 거리로 순서를 매기는 `[distance, node]` 항목을 넣습니다.
decrease-key는 필요 없습니다: 개선된 거리를 새 항목으로 push하고, pop한
항목의 거리가 이미 기록된 것보다 나쁘면 건너뛰세요. 그 "오래된 항목"
건너뛰기가 사람들이 잊는 줄이고, 없으면 힙이 한없이 자랍니다.
'''
hints = [
  "`[distance, node]` 항목을 거리만으로 비교하세요. `Float64Array(n).fill(Infinity)`가 거리 표이고, Infinity가 정직한 미도달입니다.",
  "`if (d > dist[u]) continue;`가 오래된 항목 건너뛰기입니다. 없어도 알고리즘은 여전히 맞지만 힙이 폐기된 항목으로 채워집니다.",
  "생성기의 신장 트리 절반이 모든 노드의 도달 가능성을 보장하므로 끝에서 Infinity를 걸러 내도 실제로는 아무것도 빠지지 않습니다 — 그래도 두세요. 도달 불가능한 노드가 있는 버전의 이 질문이 후속 질문이니까요.",
]

