첫 줄이 비어 있으면 `input.trim().split(/\s+/)`는 둘째 단어를 첫 단어로
건네줍니다. 이번에는 토큰이 아니라 줄 단위로 — `input.split("\n")` — 읽으세요.

그리고 각 표는 행 하나씩 만드세요. `new Array(h).fill(new Array(w).fill(0))`은
**한** 행에 대한 참조 `h`개이므로, 모든 쓰기가 모든 행에 떨어집니다.
`Array.from({ length: h }, () => new Array(w).fill(0))`은 행마다 함수를 한 번
호출합니다.
'''
hints = [
