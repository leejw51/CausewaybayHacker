[[quest]]
id    = "typescript.hacker.11.bst"
title = "정말 BST인가"
story = "후속 질문. 누구나 자식 둘만 검사하고, 누구나 처음에는 틀린다."
brief = '''
지난 퀘스트와 같은 레벨 순서 인코딩입니다: `-1`은 없는 노드, `i`의 자식은
`2i+1`과 `2i+2`.

첫 줄은 `n q`입니다. 둘째 줄은 트리 값 `n`개입니다. 셋째 줄은 질의 값
`q`개입니다.

`VALID` 또는 `INVALID`를 출력하세요 — 왼쪽 서브트리의 모든 값이 노드보다
엄격히 작고 오른쪽의 모든 값이 엄격히 큰 이진 탐색 트리인가? 그다음 질의마다
한 줄씩: 트리에 있으면 `<value> FOUND <depth>`, 없으면 `<value> ABSENT`.
루트의 깊이는 1입니다.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

각 노드에서 `left < node < right`를 검사하는 것은 **충분하지 않습니다** —
왼쪽 서브트리 깊숙한 곳의 값이 조상보다 클 수 있습니다. 대신 열린 구간을
아래로 내려보내세요. 여기의 모든 값은 `number`이고, `number`에는
`-Infinity`와 `Infinity`가 들어 있습니다: 그것들이 "아직 한계 없음"의
경계이고, 모든 값과 올바르게 비교되며, `null` 검사가 필요 없습니다.

질의는 **내려가기**로 답합니다: 노드와 비교해서 작으면 왼쪽, 아니면 오른쪽으로
가고, 트리에서 떨어지면 `ABSENT`를 보고하세요. 이것이 중요한 이유는 트리가
BST라는 보장이 없기 때문이고, BST가 아닌 트리에서는 값이 배열 안의 내려가기가
결코 보지 않는 자리에 있을 수 있습니다. 그것은 `ABSENT`입니다 — 질문은
`tree.includes(value)`가 무엇을 찾을지가 아니라 조회가 무엇을 하는지입니다.
'''
hints = [
  "열린 구간 (low, high)를 아래로 넘기세요. 루트는 (-Infinity, Infinity)를 받고, 왼쪽 자식은 (low, node), 오른쪽 자식은 (node, high)를 받습니다.",
  "없는 노드는 공허하게 유효합니다 — 그것이 기저 경우이고, false가 아니라 true를 돌려줍니다.",
  "조회가 곧 이진 탐색입니다: 작으면 왼쪽, 아니면 오른쪽, 깊이는 몇 번 뛰었는지입니다. 못 찾으면 `null`을 돌려주고 타입을 `number | null`로 매기세요. 그러면 호출하는 쪽이 못 찾은 경우를 잊을 수 없습니다.",
]

