  "가장 낮은 비트를 매번 끄며 세는 것은 비트 폭이 아니라 켜진 비트 수만큼만 돕니다.",
  "2의 거듭제곱은 켜진 비트가 정확히 하나이므로 가장 낮은 것을 끄면 0이 남습니다 — 그리고 0 자체는 손으로 제외해야 합니다.",
]

