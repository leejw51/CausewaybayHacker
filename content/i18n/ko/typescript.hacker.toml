칸의 알고리즘: 각 작업이 몇 개를 기다리는지 세고, 아무것도 기다리지 않는
것부터 시작해서, 작업 하나를 꺼낼 때 그것에 의존하는 작업들의 수를
줄이세요. 작업이 남은 채 끝나면 그 작업들이 순환입니다. 준비된 집합은 작업
번호의 최소 힙이므로 "가장 번호가 낮은"은 훑기가 아니라 `log n`의 비용이
듭니다 — 병합 퀘스트와 같은 스물몇 줄이고, 이번에는 평범한 숫자 위에서입니다.
