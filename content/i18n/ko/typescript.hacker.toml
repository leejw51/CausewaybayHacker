[[quest]]
id    = "typescript.hacker.09.linked-list"
title = "사슬"
story = "배열 없이 해 보라고 한다. 노드가 노드를 가리키는 것. 그것이 이 문제가 정말로 묻는 모양이기 때문이다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개, 순서대로입니다.

그것으로 단일 연결 리스트를 만들고 — `value`와
`next: ListNode | null`을 가진 클래스 — 그다음 노드들로부터 답하세요.
뒤집기, 가운데, 길이는 모두 입력을 읽어 들인 배열이 아니라 사슬을 걸어서
얻습니다. 출력을 배열에 모아 마지막에 `join`하는 것은 괜찮습니다. 세 줄을
출력하세요:

1. 리스트를 뒤집어서, 공백으로 구분
2. 가운데 노드의 값 (`n`이 짝수면 가운데 둘 중 두 번째)
3. 입력을 믿지 않고 리스트를 걸어서 센 `LEN <n>`

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

가운데는 러너로 찾습니다: 포인터 하나는 한 번에 한 걸음, 다른 하나는 한
번에 두 걸음, 빠른 쪽이 끝에 닿으면 느린 쪽이 거기 있습니다. 한 번의
순회입니다.

재귀가 아니라 루프로 뒤집으세요. 재귀로 뒤집는 것은 예쁜 세 줄이고, 노드
만 개쯤을 넘어가면 `RangeError: Maximum call stack size exceeded`입니다.
그리고 실제로 출제되는 것은 노드 백만 개짜리 버전입니다.

`strictNullChecks`가 켜져 있고, 이 퀘스트에서 그것은 제 몫을 합니다:
`slow.next`는 `ListNode | null`이고, tsc는 그것이 `null`일 때 어떻게 되는지
당신이 말하기 전까지는 그 위로 발을 옮기게 두지 않습니다.
'''
hints = [
  "뒤에서 앞으로 만드는 것이 쉬운 방향입니다: 새 노드마다 이전 head를 next로 받습니다.",
  "덮어쓰기 전에 `cursor.next`를 저장하세요. `cursor.next`가 뒤를 가리키는 순간, 이전 리스트의 나머지에는 닿을 수 없습니다.",
  "가운데를 찾을 때는 fast가 두 걸음을 해낸 단계에서만 slow를 전진시키세요. tsc는 `!== null` 검사 뒤에 `fast`를 좁히고, 다시 대입하면 그것을 잊습니다 — 그것은 정확히 잊어야 할 것입니다.",
]

