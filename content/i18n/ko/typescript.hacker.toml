[[quest]]
id    = "typescript.hacker.30.range-queries"
title = "계속 바뀌는 합계"
story = "체인 전체의 하루치 계산대 작업 사백만 건, 그중 절반은 정정, 그리고 누군가는 누적 합계를 원한다."
brief = '''
표준 입력은 `n q seed`입니다. 값 `n`개의 배열을 만든 다음 연산 `q`개를
실행하되, 전부 같은 생성기에서, 감기는 64비트 산술로 합니다 (`bigint`를
`BigInt.asUintN(64, …)`로 감습니다):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

모든 질의 답의 누적 합계를 출력하고, 그다음 `UPDATES <k>`를 출력하세요.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**여기서는 복잡도가 강제됩니다.** 순진한 답 — 질의마다 `values[l..r]`를
더하는 것 — 은 질의당 `O(n)`이고, 빽빽한 배열 위의 촘촘한 루프는 작은
입력에서라면 속을 만큼 빠릅니다. 그래서 큰 숨은 케이스는
`n = 500000, q = 4000000`, Rust, Go, C++가 실행하는 것과 같은 크기입니다. 이
퀘스트의 Python 버전이 쓰는 크기인 삼십만 연산에서 순진한 루프는 여기서
**17초**가 걸려 이미 10초 실행 제한을 넘었고, 큰 케이스는 그것의 열세 배입니다.
펜윅 트리는 사백만 전체를 **0.5초** 안에 해냅니다. 둘 다 이 퀘스트의 두
프로그램으로 측정했습니다.

교훈은 면접관이 낚으려는 그것입니다: *점 갱신, 구간 합*은 펜윅 트리가
존재하는 정확히 그 모양입니다. 짧은 함수 셋 — add, prefix, 그리고 두
prefix의 차로 구하는 range — 그리고 `i & -i`가 가장 낮은 켜진 비트만큼
걸음을 옮기는 방법입니다. 그것은 32비트 연산이고, 모든 인덱스가 `2^31`
미만이므로 여기서는 정확합니다. 합계는 그렇지 않습니다: 큰 케이스에서
`2^32`를 넘고, `number`가 그것을 정확히 담는 것은 `2^53` 아래에 머물기
때문일 뿐입니다.
'''
hints = [
  "초기 값마다 add를 한 번씩 호출해서 트리를 만드세요. O(n) 상향식 구축은 멋진 최적화이지만 시계가 검사하는 것은 아닙니다.",
  "`i & -i`가 가장 낮은 켜진 비트를 뽑아냅니다. 더하면 트리를 올라가고, 빼면 내려갑니다.",
  "`range(l, r)`는 `prefix(r + 1) - prefix(l)`이고, 그 하나 차이 한 쌍을 맞히는 것이 디버깅의 대부분입니다. 트리를 담는 `Float64Array(n + 1)`은 합을 정확히 담고, 결코 타입이 섞인 배열로 바뀌지 않습니다.",
]

