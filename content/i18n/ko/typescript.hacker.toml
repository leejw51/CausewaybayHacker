]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.hacker.16.union-find"
title = "누가 누구와 이어져 있나"
story = "트램망, MTR, 미니버스 노선이 한 장에. 실제로 분리된 망은 몇 개인가."
brief = '''
표준 입력은 `n m seed`입니다: `0..n-1`로 번호 매긴 정류장 `n`개, 무방향 연결
`m`개. 입력에 연결은 없습니다 — **정확히** 이 생성기로, 감기는 64비트
산술로 직접 만드세요 (`number`로는 담을 수 없습니다 — `bigint`와
`BigInt.asUintN(64, …)`를 쓰세요):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

세 줄을 출력하세요: 분리된 망이 몇 개인지, 가장 큰 것의 크기, 그리고
`REDUNDANT <k>` — 이미 이어져 있던 두 정류장을 잇는 연결이 몇 개였는지.
정류장에서 자기 자신으로의 연결도 그중 하나입니다.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

`8 5 1`에서 다섯 연결은 `6—1`, `4—6`, `2—3`, `2—6`, `1—2`입니다. 마지막
것은 이미 같은 망에 있는 두 정류장을 이으므로 그것이 불필요한 연결이고,
남는 것은 `{1,2,3,4,6}`과 따로 떨어진 정류장 `0`, `5`, `7`입니다.

이 언어가 처음 무는 곳은 생성기입니다. `number`는 double이고 `2^53`까지만
정확한데, `x * 6364136223846793005`는 그것을 한참 넘습니다: `number` 산술에서는
상태가 첫 단계부터 조용히 틀립니다. `bigint`에서는 정확하고,
`BigInt.asUintN(64, …)`가 감기이며, `x >> 33n`은 `2^31` 미만이므로
`Number(x >> 33n)`이 나머지 모든 것을 위해 그것을 정확한 `number`로
되돌립니다.

**이 퀘스트는 복잡도를 강제합니다.** 숨은 케이스 하나는 `n = 200000`, 연결
`m = 200000`개입니다. 유니온-파인드가 아닌 뻔한 답 — 연결마다 `a`에서 망을
걸어 나가 `b`가 이미 그 안에 있는지 보기 — 은 옳고, 연결당 `O(n)`이라 전체
`O(n·m)`입니다: 이 기계에서 10초 실행 제한에 대해 **1분**이 지나도 끝나지
않았습니다. 스타터가 바로 그것입니다. 경로 압축과 크기 기준 합치기를 쓴
유니온-파인드는 같은 200000개 연결을 약 **0.1초**에 처리합니다. 이 퀘스트에
들어 있는 해답으로 여기서 측정했습니다.

분명히 볼 가치가 있습니다. 시간 제한 있는 스크린에서 떨어지는 가장 흔한
방식이기 때문입니다: **스타터는 틀리지 않았습니다.** 예시와 작은 숨은 케이스
둘 모두에서 정확히 맞는 답을 출력합니다. 너무 늦게 도착한다는 이유만으로
거부됩니다.

유니온-파인드: 모든 정류장은 부모를 가리키고, `find`는 루트까지 걸어가며,
`union`은 한 루트를 다른 루트로 향하게 합니다. `find`에서 돌아 나오는
길에 경로를 압축하면 전체가 질의당 사실상 상수 시간입니다.

`find`는 루프로 쓰세요. 재귀 버전이 교과서 버전이고, 길이 만 개쯤의 사슬에서
`RangeError: Maximum call stack size exceeded`입니다 — 크기 기준 합치기가
막으려고 존재하는 바로 그 모양이고, 첫 `find`가 압축하기 전의 적대적 입력이
갖는 바로 그 모양입니다.
'''
hints = [
  "연결 목록을 먼저 만들지 말고 진행하면서 두 끝점을 뽑으세요 — 각각 생성기 한 단계씩, 그 순서로. 여기서는 연결이 두 번 필요한 곳이 없습니다.",
  "모든 정류장이 자기 자신의 부모이고 그룹이 n개인 상태로 시작하세요. 성공한 union마다 수가 하나 줄어듭니다. 부모를 담는 `Int32Array`는 가장 빠르고, 무엇을 담는지 말해 줍니다.",
  "양 끝이 이미 같은 루트를 가진 연결이 불필요한 것입니다 — 세고 넘어가세요. 자기 연결 a === b는 그 검사에서 저절로 걸립니다.",
  "루트의 크기 항목만 의미가 있으므로, 가장 큰 것은 모든 인덱스가 아니라 루트들에서 읽으세요.",
  "bigint 줄의 모든 리터럴에는 `n` 접미사가 붙습니다 — `6364136223846793005n` — 그리고 한 식 안에서 `bigint`와 `number`를 섞는 것은 변환이 아니라 컴파일 오류입니다. 그 오류는 tsc가 제 일을 하는 것입니다.",
]

