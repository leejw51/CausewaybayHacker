[[quest]]
id    = "typescript.hacker.26.statistics"
title = "소수점 아래 여섯 자리"
story = "당신 언어가 우연히 출력하는 방식이 아니라 명세가 말하는 방식으로 반올림한 숫자를 원한다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 정수 `n`개입니다.

세 줄을 각각 **소수점 아래 여섯 자리**로 출력하세요: 평균, **모**표준편차
(`n - 1`이 아니라 `n`으로 나눔), 그리고 중앙값 — `n`이 짝수면 가운데 두
값의 평균입니다.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

이 퀘스트는 `match = "float:1e-6"`으로 채점되므로 비교는 수치적입니다:
`3.8`과 `3.800000`은 둘 다 통과하고, `1e-7`만큼 어긋난 값도 통과합니다.
의도된 것입니다 — 핵심은 서식 지정자가 아니라, `Math.floor(sum / n)`은
`3`을 준다는 것과, 짝수 길이의 중앙값은 시계 앞에서 사람들이 틀리는
경계라는 것입니다.

표본이 아니라 모집단입니다. 여기에는 통계 모듈이 없으므로 공식은 당신의
몫입니다: 편차 제곱의 평균, 그다음 `Math.sqrt`. `n - 1`로 나누면 표본
편차가 되고, 실제 스크린에서는 둘의 차이가 제출물 전체입니다.
`x.toFixed(6)`이 소수점 아래 여섯 자리입니다.

중앙값을 위해 값을 정렬해야 하고, **숫자로** 정렬해야 합니다: 비교자 없는
`values.sort()`는 `10`을 `9` 앞에 둡니다.
'''
hints = [
  "두 number에 대한 `/`는 이미 진짜 나눗셈입니다 — 실수로 빠질 정수 나눗셈이 없습니다. 스타터는 `Math.floor`로 일부러 그렇게 해서 소수 부분을 버렸습니다.",
  "모표준편차: `Math.sqrt(sum of (v - mean) ** 2 / n)`. n - 1로 나누는 것은 표본 쪽이고 여기서는 틀립니다.",
  "짝수 개수의 중앙값은 `values[n / 2 - 1]`과 `values[n / 2]`의 평균이고, 그 뺄셈이 하나 차이 오류가 사는 곳입니다. 먼저 `(a, b) => a - b`로 정렬하세요.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.hacker.27.commands"
title = "입력이 문제다"
story = "트램 정류장 안내판의 로그가 80열에서 줄 바꿈된 채 기계에서 나오고, 맨 위의 숫자는 단어가 아니라 명령의 수다."
brief = '''
첫 줄은 `k`, 뒤따르는 **명령**의 수입니다. 명령은 공백으로 구분된
토큰들이고, 나머지 줄에 걸쳐 어떻게 줄 바꿈되었든 그대로 채워져 있습니다 —
한 줄에 몇 개든, 간격은 얼마든, 마지막에 빈 줄이 있을 수도 있습니다.

| 명령 | 토큰 | 효과 |
| --- | --- | --- |
| `ADD <cents>` | 둘 | 항목 하나를 넣음 |
| `VOID` | 하나 | 마지막 항목을 제거, 없으면 아무것도 하지 않음 |
| `TOTAL` | 하나 | 현재 합계를 출력 |
| `CLEAR` | 하나 | 전부 제거 |

`k`개 명령 뒤에 `COMMANDS <k>`와 `ITEMS <how many are left>`를 출력하세요.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k`는 명령을 세고, `ADD`는 토큰 둘로 된 명령 하나입니다 — 그러니 `k`번
돌며 한 번에 토큰 하나를 읽는 루프는 엉뚱한 곳에서 멈춥니다. 명령 `k`개를
읽되, 인자는 명령에 인자가 있을 때만 꺼내세요: 토큰 배열로의 인덱스
`tokens[at++]`가 커서이고, `tokens[at++] ?? ""`는 입력의 끝을 `undefined`
대신 하나의 값으로 만듭니다.

빈 계산대에서의 `VOID`와 아무것도 넣기 전의 `TOTAL`은 둘 다 동작해야
합니다. 그런 일이 일어날 수 없다고 말하는 줄은 문제에 없고, 실제
스크린에서는 그 침묵이 명세입니다. 이 언어에서는 그 가장자리에서 다르게
동작하는 것이 둘 있습니다: 빈 배열에 `items.pop()`을 하면 예외를 던지지 않고
`undefined`를 돌려줍니다 — 여기서는 무해하지만, 그것으로 산술을 하는 순간
`NaN`입니다 — 그리고 시작값 없는 `items.reduce((a, b) => a + b)`는 빈
배열에서 예외를 **던집니다**. `reduce`에 `0`을 주세요.
'''
hints = [
  "`input.split(/\\s+/).filter((t) => t !== \"\")`는 공백, 탭, 줄 바꿈의 모든 연속을 합치므로, 줄 단위로 읽기를 그만두는 순간 파일의 줄 바꿈은 상관없어집니다.",
  "ADD의 인자는 ADD 갈래 안에서, 같은 커서에서 꺼내세요. 루프 카운터는 토큰이 아니라 명령을 셉니다.",
  "`items.reduce((sum, v) => sum + v, 0)` — 그 `0`이 빈 계산대에서 TOTAL이 `Reduce of empty array with no initial value`를 던지는 대신 0을 출력하게 만드는 것입니다.",
]

