[[quest]]
id    = "typescript.hacker.18.edit-distance"
title = "얼마나 떨어져 있나"
story = "한 트램 전광판에는 Yee Wo Street, 다음 것에는 Yee Woo Street. 그 사이에 한 글자 편집이 몇 번인가."
brief = '''
두 줄, 각 줄에 소문자 단어 하나입니다. 어느 줄이든 **비어 있을** 수 있고,
그때 답은 다른 쪽의 길이입니다.

**편집 거리**를 출력하세요: 첫 단어를 둘째 단어로 바꾸는 데 필요한 가장
적은 한 글자 삽입, 삭제, 치환의 수. 그다음 `LCS <k>`, 두 단어의 최장 공통
부분 수열의 길이를 출력하세요.

```
input:  horse
        ros
output: 3
        LCS 2
```

같은 두 문자열 위의 표 둘, 그리고 둘 다 동점 처리만 다른 같은 세 줄짜리
점화식입니다. 행 단위로 채우세요. 답은 먼 모서리입니다. 편집 표에서 행
