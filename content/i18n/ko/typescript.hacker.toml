빌드 순서를 한 줄에 공백으로 구분해 출력하세요. 여러 작업이 동시에 준비되면
**가장 번호가 낮은** 것을 택해서 답이 유일하게 하세요. 순서가 존재하지
않으면 대신 `CYCLE`을 출력하세요. 그다음 `DONE <how many you ordered>`를
