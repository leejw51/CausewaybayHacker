[[quest]]
id    = "typescript.hacker.24.inversions"
title = "시계에 걸리는 것"
story = "오후 라운드의 첫 문제. 순진한 답은 맞고, 그리고 그것은 틀린 답이다."
brief = '''
표준 입력은 정수 둘, `n`과 `seed`입니다. 입력에 배열은 없습니다 — 당신이
**정확히** 이 생성기로, 감기는 64비트 산술로 만듭니다:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

**반전**을 세세요: `a[i] > a[j]`인 쌍 `i < j`. 개수를 출력하고, 그다음
`MAX <largest value>`를 출력하세요.

```
input:  8 1
output: 19
        MAX 908834774
```

`8 1`에 대한 배열은
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`입니다.

**이 퀘스트는 복잡도를 강제하고, 그렇게 할 수 있는 유일한 종류입니다.** 숨은
케이스 하나는 `n = 200000`입니다. `O(n²)` 이중 루프 — 스타터가 바로
그것입니다 — 는 `2 × 10^10`번의 비교이고, 이 기계에서 10초 실행 제한에 대해
**42초**가 걸렸습니다. 병합 정렬 도중에 반전을 세면 `O(n log n)`이고 약
0.1초에 끝납니다. 이 기계에서, 이 두 프로그램으로 측정한 값입니다.

이 언어가 다르게 정하는 것이 셋 있습니다. 생성기 상태는 `number`에 들어가지
않습니다 — double이고 `2^53`까지만 정확합니다 — 그래서 `bigint`이고, 매
단계 뒤에 `BigInt.asUintN(64, …)`로 감습니다. 답 `9990744366`은 32비트
정수에 들어가지 않습니다. `number`는 그것을 정확히 담고, 아무것도 거기에
`| 0`이나 `>>`를 적용하지 않는 동안만 정확하게 남습니다. 그리고
`Math.max(...values)`는 인자 이십만 개를 호출 스택에 펼치는데, 이 기계에서는
답이 되기 전에 `RangeError`가 됩니다: 최댓값은 루프로 구하세요.
'''
hints = [
  "정렬 전에 루프로 최댓값을 구하거나 사본을 정렬하세요: 제자리에서 동작하는 병합 정렬은 원래 배열을 재배열해 둡니다. 그리고 200000개 값을 `Math.max`에 펼치지 마세요.",
  "병합에서 오른쪽 값이 이기면 왼쪽 절반의 남은 원소 전부가 그것보다 큽니다 — 그것이 한 번에 `mid - i`개의 반전이고, 요령의 전부입니다.",
  "재귀는 log2(200000), 약 열여덟 프레임 깊이입니다 — 한계 근처에도 가지 않습니다. 단계마다 새 배열을 slice하지 말고 한 번 할당한 임시 버퍼 하나를 통해 병합하세요. 압축된 값 위의 펜윅 트리가 다른 O(n log n) 답이고 면접실에서 이름을 댈 만합니다.",
]

