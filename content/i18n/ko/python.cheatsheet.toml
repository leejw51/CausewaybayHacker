[[quest]]
id    = "python.cheatsheet.30.short-list"
title = "짧은 목록"
story = "다이파이동의 마감 집계: 팔린 요리만 내일 준비분으로 두 배가 되고, 안 팔린 것은 목록에서 아예 빠진다."
brief = '''
`a = [3, -1, 4, 0]`. `b`를 리스트 `[6, 8]`로 만드세요: 양수 항목은 모두 두 배로,
양수가 아닌 것은 **빼고** — 그래서 `len(b)`는 `len(a)`가 아니라 양수의
개수입니다.
'''
hints = [
  "필터는 컴프리헨션의 꼬리에 옵니다. 머리의 if-else는 값이고, 모든 항목을 남깁니다.",
]
