story = "소고 지하의 오락실이 점수판을 다시 찍는데, 바뀌어야 하는 것은 판 자체다 — 그 복사본이 아니라."
brief = '''
`a = [3, 1, 2]`. 이 한 줄 뒤에 `a` 자체가 리스트 `[3, 2, 1]`이어야 합니다 — 가장
큰 것부터.
'''
hints = [
  "하나는 새 리스트를 만들고는 버리고, 하나는 옛 리스트를 버리며, 하나는 뒤집기만 합니다.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "python.cheatsheet.26.bounds"
title = "울타리 안"
story = "빅토리아 파크의 가로등 n개에는 0부터 번호가 붙어 있다. 정비 앱은 어느 쪽 끝이든 벗어난 번호를 거부해야 한다."
brief = '''
`a`에는 항목이 `n`개 있고 인덱스는 `0 … n-1`입니다. `i`가 `a`의 유효한 인덱스일
때 정확히 참인 `if` 줄은 어느 것일까요?
'''
hints = [
  "Python은 비교를 이어 쓰므로 `and` 없이 한 번에 양쪽 경계를 적을 수 있습니다 — 어느 끝이 포함되고 어느 끝이 아닌지에 유의하세요.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "python.cheatsheet.27.empty"
title = "선반에 아무것도"
story = "이우 스트리트의 세븐일레븐은 물건을 채우기 전에 선반을 확인한다. 없는 선반이 아니라, 빈 선반."
brief = '''
`a`는 언제나 리스트입니다 — `None`인 적이 없습니다. `a`에 항목이 하나도 없을 때
정확히 본문이 실행되는 `if` 줄은 어느 것일까요?
'''
hints = [
  "빈 컨테이너는 그 자체로 falsy입니다. `is`는 동일성을 비교하고, 새 `[]` 리터럴은 결코 `a`와 같은 객체가 아닙니다.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "python.cheatsheet.28.mirror"
title = "거울 간판"
story = "자페 로드 국숫집의 네온은 길에서 읽히고, 창문의 거울은 그것을 거꾸로 보여 준다 — 두 번째 간판으로, 첫 번째는 건드리지 않은 채."
brief = '''
`s = "stressed"`. `r`을 `str` `"desserts"` — `s`를 뒤집은 것 — 로 만들고, `s`는
그대로 두세요.
'''
hints = [
  "문자열에는 뒤집는 메서드가 없고, 내장 함수는 str가 아니라 반복자를 줍니다. 음수 step의 슬라이스는 거꾸로 걷습니다.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "python.cheatsheet.29.raise"
title = "위로 올려 보내기"
story = "헤네시 로드의 금은방은 0 아래의 무게를 거부한다. 점원은 어깨를 으쓱하지 않는다 — 매니저를 부르고, 판매는 멈춘다."
brief = '''
`w`가 음수입니다. 함수를 바로 여기서 멈추고 메시지 `bad weight`를 실은
`ValueError`를 호출한 쪽으로 올려 보내는 줄은 어느 것일까요?
'''
hints = [
  "키워드는 C 계열의 것이 아니고, Python 2의 쉼표 형태는 더 이상 파싱되지 않으며, 예외 객체를 공손히 돌려주는 것은 아무것도 멈추지 않습니다.",
]

