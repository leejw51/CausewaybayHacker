[[quest]]
id    = "python.cheatsheet.19.ripples"
title = "물결"
story = "빅토리아 파크에서 비가 한 블록씩 넘쳐 나온다. 물은 먼 거리보다 가까운 거리에 먼저 닿고, 지도는 블록마다 몇 걸음 걸렸는지 말해야 한다."
brief = '''
격자 위의 BFS: `dist`는 `(sr, sc)`에서의 **최단** 걸음 수를 담아야 하므로, 칸은
들어간 순서대로, O(1)에 꺼내야 합니다. 빈칸에 들어갈 줄은 어느 것입니까?

```
q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
hints = [
  "deque는 양쪽 끝 어디서든 O(1)에 pop합니다. 어느 끝에서 꺼내느냐가 이것이 큐인지 스택인지를 정합니다.",
]

