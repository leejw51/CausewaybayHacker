id    = "pytorch.cheatsheet.26.max-values"
title = "최고 점수, 그 자리는 말고"
story = "빅토리아 파크 체스 테이블의 심판들은 선수마다 최고 점수를 게시한다. 어느 판에서 나왔는지는 다른 열이다."
brief = '''
`logits`의 모양은 `(B, C)`입니다. `best`를 **각 행의 최대 점수**로, 모양 `(B,)`의
텐서로 주는 줄은 어느 것일까요 — 어느 열에 있었는지가 아니라 점수 자체를?
'''
hints = [
  "`dim`을 주면 max 메서드는 쌍을 돌려줍니다 — 값과 그 위치 — 그러니 원하는 절반을 이름으로 고르세요. `dim` 없이는 텐서 전체에 대한 숫자 하나를 받습니다.",
]

