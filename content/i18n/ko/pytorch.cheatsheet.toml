id    = "pytorch.cheatsheet.30.accuracy"
title = "판 위의 점수"
story = "중앙도서관의 시험 밤이 끝났다. 메이는 로그 한 줄에 쓸 분수 하나를 원한다: 배치 중 신경망이 맞힌 개수."
brief = '''
`pred`와 `yb`는 둘 다 모양 `(B,)`의 `int64` 텐서입니다 — 샘플마다 예측한 클래스와
실제 클래스. `acc`를 올바르게 예측한 샘플의 **비율**로, 0차원 float 텐서로 주는
줄은 어느 것일까요?
'''
hints = [
  "비교는 불리언을 주고, 불리언에 대해서는 평균을 낼 수 없습니다 — 먼저 타입을 바꾸세요. 합은 비율이 아니라 개수이고, 괄호가 어디서 닫히는지 살피세요.",
]
