id    = "pytorch.cheatsheet.27.sequential"
title = "가운데 층"
story = "타임스 스퀘어 에스컬레이터 세 층: 올라가고, 층계참, 다시 올라간다. 층계참은 설계도가 아니라 발을 딛고 서는 것이다."
brief = '''
`model`이 두 층 사이에 ReLU가 있는 2층 신경망이 되도록, `nn.Sequential`로
빈칸을 채우세요:

```
model = nn.Sequential(
    nn.Linear(4, 8),
    # ____
    nn.Linear(8, 2),
)
```
'''
hints = [
  "Sequential은 모듈만 받습니다 — 클래스도 맨 함수도 아닌 인스턴스. 선택지 둘은 활성화 함수의 이름만 적고 만들지 않으며, 하나는 입력이 빠진 함수입니다.",
]

