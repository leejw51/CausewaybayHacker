story = "히산 플레이스 지하 서버실의 온도조절기는 0 아래로 맞출 수 없지만, 다이얼은 40까지 돌아간다."
brief = '''
`x`에는 `-40.`과 `40.` 사이 어디든 값이 있습니다. 모든 **음수** 항목은 `0.`이 되고
다른 항목은 모두 **정확히 그대로** 유지되는 `y`를 만드는 줄은 어느 것일까요?
'''
hints = [
  "값을 범위에 고정하는 텐서 메서드가 있습니다. 바닥만 주세요. 한 선택지는 천장까지 주고, 하나는 텐서를 원하는 함수에 Python int를 건네며, 하나는 메서드를 호출하지 않습니다.",
]

