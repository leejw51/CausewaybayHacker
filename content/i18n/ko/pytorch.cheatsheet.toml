[[quest]]
id    = "pytorch.cheatsheet.28.linear"
title = "입력 먼저, 출력 다음"
story = "홍콩 스타디움의 28×28 입장권 조각은 모두 784개의 숫자로 펴지고, 게이트에는 회전문이 열 개다."
brief = '''
