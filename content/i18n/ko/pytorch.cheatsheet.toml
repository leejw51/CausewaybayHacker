'''
hints = [
  "생성자는 평범한 정수 둘을 받습니다: 들어오는 것의 크기, 그다음 나가는 것의 크기. 한 선택지는 순서가 거꾸로이고, 하나는 튜플로 감쌌으며, 하나는 Keras 식 철자입니다.",
]

