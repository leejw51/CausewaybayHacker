[[quest]]
id    = "remix.verybasic.05.strings-rust"
title = "문자열 — RUST"
story = "주문서는 쉼표로 구분된 이름 한 줄이고, 주방은 그 이름들을 크게 외치고, 나누고, 글자 단위로 세기를 원한다. Ferris는 Rust로 주문한다."
brief = '''
문자열은 구분자로 여러 조각으로 나뉘고, 조각들은 다른 구분자로 다시 이어지며, 문자열 전체는 호출 한 번으로 대문자가 됩니다. 함정은 길이입니다. 악센트가 있는 이름은 문자보다 바이트가 많고, 둘 중 사람이 세는 것은 하나뿐입니다. 프로그램은 쉼표로 구분된 이름 한 줄을 읽어 이름이 몇 개인지, 대문자로 바꿔 ` | `로 이은 이름들, 그리고 그 줄의 문자 수를 출력합니다.

Rust에서 `split(',')`은 이터레이터라서 `Vec<&str>`로 `collect`합니다. 벡터에 `join(" | ")`을 하면 `String`이 되고, `to_uppercase()`가 또 하나를 만듭니다. `len()`은 바이트 수입니다. 문자 수는 `chars().count()`입니다. `&str`은 UTF-8 바이트이고 `chars()`가 그것을 디코딩하기 때문입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "let names: Vec<&str> = line.split(',').collect(); 다음 names.join(\" | \").to_uppercase(). 개수는 line.chars().count()입니다.",
  "line.len()은 바이트 수입니다. Zoë는 바이트로 넷, 문자로 셋이고, 숨은 테스트는 알고 있습니다.",
]

