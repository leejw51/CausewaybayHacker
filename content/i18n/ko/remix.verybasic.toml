[[quest]]
id    = "remix.verybasic.10.closures-go"
title = "클로저 — GO"
story = "주문마다 번호표가 붙는다. 번호를 나눠 주는 카운터는 그것을 만든 함수 안에 살고, 아무도 손댈 수 없다. Gogo는 Go로 주문한다."
brief = '''
클로저는 자신이 만들어진 스코프의 변수를 캡처해서, 그 스코프가 반환된 뒤에도 살려 두는 함수입니다. `counter()`가 하나를 만듭니다. 돌려준 클로저를 호출할 때마다 다음 번호를 나눠 줍니다. 프로그램은 단어들을 읽어 1부터 번호를 매기고, 그다음 클로저가 나눠 줄 번호를 출력합니다.

Go에서 함수 리터럴 `func() int { ... }`는 `n`을 참조로 캡처하므로, 안쪽의 `n++`는 바깥의 `n`을 바꾸고, `counter`는 그 리터럴을 `func() int` 타입의 값으로 돌려줍니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "return func() int { n++; return n }을 네 줄에 걸쳐 — 리터럴이 n을 캡처합니다.",
  "counter의 반환 타입이 func() int이므로 리터럴도 int라고 써야 합니다.",
]

