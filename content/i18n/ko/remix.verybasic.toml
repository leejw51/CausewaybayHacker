# program must print are the English pack's and are copied verbatim, never
# translated.

pack   = "remix.verybasic"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.verybasic.01.numbers-go"
title = "정수와 부동소수점 수 — GO"
story = "1번 테이블. 주문서에 숫자가 둘 있고, 계산서를 나눠야 한다. 한 사람에 몇 개씩인지, 몇 개가 남는지, 그리고 센트 단위까지 정확한 1인당 몫. Gogo는 Go로 주문한다."
brief = '''
정수와 부동소수점 수는 서로 다른 타입이고, 두 정수를 나누면 정수가 나옵니다. 0 쪽으로 버린 몫이고, 나머지는 `%`가 맡습니다. 정확한 몫을 얻으려면 먼저 변환하고 그다음에 나눕니다. 프로그램은 `a`와 `b`를 읽어 그 합을 출력하고, 이어서 몫과 나머지를 한 줄에, 마지막으로 `a / b`를 부동소수점 수로 소수 둘째 자리까지 출력합니다.

Go에서 두 `int64` 값 사이의 `/`는 정수 나눗셈이고 `%`는 나머지입니다. `float64(a)`가 변환입니다. 함수처럼 생긴 캐스트이고, 양쪽이 모두 `float64`가 되어야 비로소 `/`가 정확하게 나눕니다. `Printf`의 `%.2f`는 소수 둘째 자리까지 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "q := a / b 다음 r := a % b — 둘 다 int64로 남습니다. f := float64(a) / float64(b)는 나누기 전에 변환합니다.",
  "float64(a) / b는 컴파일되지 않습니다. Go는 한 식 안에서 int64와 float64를 절대 섞지 않습니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.verybasic.02.numbers-rust"
title = "정수와 부동소수점 수 — RUST"
story = "1번 테이블. 주문서에 숫자가 둘 있고, 계산서를 나눠야 한다. 한 사람에 몇 개씩인지, 몇 개가 남는지, 그리고 센트 단위까지 정확한 1인당 몫. Ferris는 Rust로 주문한다."
brief = '''
정수와 부동소수점 수는 서로 다른 타입이고, 두 정수를 나누면 정수가 나옵니다. 0 쪽으로 버린 몫이고, 나머지는 `%`가 맡습니다. 정확한 몫을 얻으려면 먼저 변환하고 그다음에 나눕니다. 프로그램은 `a`와 `b`를 읽어 그 합을 출력하고, 이어서 몫과 나머지를 한 줄에, 마지막으로 `a / b`를 부동소수점 수로 소수 둘째 자리까지 출력합니다.

Rust에서 두 `i64` 값 사이의 `/`는 정수 나눗셈이고 `%`는 나머지입니다. `a as f64`가 변환이고 `/`보다 먼저 결합하므로, `a as f64 / b as f64`는 두 부동소수점 수를 나눕니다. `println!`의 `{:.2}`는 소수 둘째 자리까지 출력합니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "let q = a / b; 다음 let r = a % b; — 둘 다 i64입니다. let f = a as f64 / b as f64;는 나누기 전에 변환합니다.",
  "a as f64 / b는 컴파일되지 않습니다. f64를 i64로 나눌 수는 없습니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "remix.verybasic.03.numbers-python"
title = "정수와 부동소수점 수 — PYTHON"
story = "1번 테이블. 주문서에 숫자가 둘 있고, 계산서를 나눠야 한다. 한 사람에 몇 개씩인지, 몇 개가 남는지, 그리고 센트 단위까지 정확한 1인당 몫. 비단뱀은 Python으로 주문한다."
brief = '''
정수와 부동소수점 수는 서로 다른 타입이고, 두 정수를 나누면 정수가 나옵니다. 0 쪽으로 버린 몫이고, 나머지는 `%`가 맡습니다. 정확한 몫을 얻으려면 먼저 변환하고 그다음에 나눕니다. 프로그램은 `a`와 `b`를 읽어 그 합을 출력하고, 이어서 몫과 나머지를 한 줄에, 마지막으로 `a / b`를 부동소수점 수로 소수 둘째 자리까지 출력합니다.

Python에서 `/`는 두 int 사이에서도 항상 부동소수점 수를 내므로, 정확한 몫에는 변환이 전혀 필요 없습니다. 정수 몫은 *다른* 연산자 `//`이고, `%`는 나머지입니다. `f"{f:.2f}"`는 소수 둘째 자리까지 출력합니다.

맞는 줄을 고르고, `# FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "정수는 q = a // b 다음 r = a % b. f = a / b는 이미 부동소수점 수입니다.",
  "float(a) / b도 동작하고, Go나 Rust에 익은 손은 그렇게 칩니다. Python에서는 필요 없습니다.",
]

