[[quest]]
id    = "remix.verybasic.07.loops-go"
title = "반복문 — GO"
story = "한 단골이 주방이 주문을 반으로 나누거나 세 배로 늘리기를 몇 번 해야 1이 되는지, 그리고 도중에 얼마나 커졌는지 센다. Gogo는 Go로 주문한다."
brief = '''
반복문은 조건이 참인 동안 돌고, 분기는 두 갈래 중 하나를 고르며, 카운터는 한 바퀴마다 하나씩 올라갑니다. 프로그램은 `n`을 읽고 따라갑니다. 짝수면 반으로, 홀수면 세 배 하고 하나를 더하며, 1에서 멈춥니다. 걸음 수와 도중에 본 가장 큰 값을 출력합니다.

Go에는 반복 키워드가 하나뿐입니다. `for cond { }`가 Go의 while 반복문이고, `steps++`는 증가 문입니다. 식이 아니라 문이므로 더 큰 식 안에 들어갈 수 없습니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  6
output: 8
        16
```
'''
hints = [
  "for n != 1 { — Go의 while — 그리고 안쪽 첫 줄에 steps++.",
  "Go에는 while이 없습니다. 조건 하나짜리 for가 그것입니다.",
]

