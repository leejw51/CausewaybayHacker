Rust의 컴프리헨션은 이터레이터 체인입니다. `.iter()`가 돌고, `.filter(|x| ...)`가 남기고, `.map(|x| ...)`가 변환하고, `.collect()`가 `Vec`을 만듭니다. 지연 실행이라 `collect` 전에는 아무것도 돌지 않습니다. 클로저는 `&i64`를 보므로 `*x`입니다.

