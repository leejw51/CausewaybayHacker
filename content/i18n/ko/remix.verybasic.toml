Go에서 리스트는 슬라이스입니다. `append`는 늘어난 슬라이스를 돌려주므로 다시 대입해야 합니다. `nums[1:]`은 다시 슬라이싱해서 앞을 떨어뜨립니다. `nums[len(nums)-1]`이 마지막이고(음수 인덱스는 없습니다), `nums[1:3]`은 배열을 공유하는 부분 슬라이스입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

