id    = "remix.verybasic.06.strings-python"
title = "문자열 — PYTHON"
story = "주문서는 쉼표로 구분된 이름 한 줄이고, 주방은 그 이름들을 크게 외치고, 나누고, 글자 단위로 세기를 원한다. 비단뱀은 Python으로 주문한다."
brief = '''
문자열은 구분자로 여러 조각으로 나뉘고, 조각들은 다른 구분자로 다시 이어지며, 문자열 전체는 호출 한 번으로 대문자가 됩니다. 함정은 길이입니다. 악센트가 있는 이름은 문자보다 바이트가 많고, 둘 중 사람이 세는 것은 하나뿐입니다. 프로그램은 쉼표로 구분된 이름 한 줄을 읽어 이름이 몇 개인지, 대문자로 바꿔 ` | `로 이은 이름들, 그리고 그 줄의 문자 수를 출력합니다.

Python에서는 메서드가 문자열에 붙어 있습니다. `line.split(",")`은 리스트를 주고, `" | ".join(names)`은 *구분자* 쪽에서 호출하며, `.upper()`는 새 문자열을 돌려줍니다. `len(s)`는 바이트가 아니라 문자를 셉니다. Python `str`은 이미 디코딩되어 있기 때문입니다. 바이트 수는 `len(s.encode())`입니다.

