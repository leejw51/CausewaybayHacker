[[quest]]
id    = "remix.verybasic.04.strings-go"
title = "문자열 — GO"
story = "주문서는 쉼표로 구분된 이름 한 줄이고, 주방은 그 이름들을 크게 외치고, 나누고, 글자 단위로 세기를 원한다. Gogo는 Go로 주문한다."
brief = '''
문자열은 구분자로 여러 조각으로 나뉘고, 조각들은 다른 구분자로 다시 이어지며, 문자열 전체는 호출 한 번으로 대문자가 됩니다. 함정은 길이입니다. 악센트가 있는 이름은 문자보다 바이트가 많고, 둘 중 사람이 세는 것은 하나뿐입니다. 프로그램은 쉼표로 구분된 이름 한 줄을 읽어 이름이 몇 개인지, 대문자로 바꿔 ` | `로 이은 이름들, 그리고 그 줄의 문자 수를 출력합니다.

Go에서는 `strings` 패키지가 일을 합니다. `strings.Split`은 `[]string`을 주고, `strings.Join`은 그것을 다시 받아 잇고, `strings.ToUpper`는 새 문자열을 돌려줍니다. `len(s)`는 바이트 수입니다. 문자 수는 `utf8.RuneCountInString(s)`입니다. Go 문자열은 바이트이고, 룬은 그것을 디코딩한 결과이기 때문입니다.

맞는 줄을 고르고, `// FILL` 주석이 있는 자리에 그 줄을 치세요.

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "strings.Split(line, \",\") 다음 strings.ToUpper(strings.Join(names, \" | \")). 개수는 utf8.RuneCountInString(line)입니다.",
  "len(line)은 바이트 수입니다. Zoë는 바이트로 넷, 문자로 셋이고, 숨은 테스트는 알고 있습니다.",
]

