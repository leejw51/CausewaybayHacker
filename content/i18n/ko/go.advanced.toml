hints = [
  "독자는 RLock/RUnlock, 쓰는 쪽은 Lock/Unlock. 뒤섞어도 컴파일은 되고, 조용히 이점만 사라집니다.",
  "각 고루틴은 answers[slot]에 쓰고 어느 둘도 슬롯을 공유하지 않으므로, 그 슬라이스에는 자체 락이 필요 없습니다.",
  "맵 읽기의 comma-ok 형태가 `missing`과 `present and zero`를 구분해 주는 것입니다.",
