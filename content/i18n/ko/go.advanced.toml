output: bus 1
        zzz MISSING
        SIZE 3
```

`RLock`은 얼마든지 많은 독자가 동시에 잡을 수 있고, 쓰는 쪽에 대해서만
막힙니다. 그것이 RWMutex가 존재하는 이유 전부이고, 독자가 `Lock`을 잡으면
아무 가치도 없습니다.

쓰기가 순차적인 것은 의도입니다: 같은 단어에 대한 동시 `Set` 호출은 저장된
인덱스를 마지막에 간 고루틴의 것으로 만들 텐데, 답이 스케줄러에 달린 과제는
무작위로 실패하는 과제입니다.
