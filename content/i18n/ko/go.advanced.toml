# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.advanced.14.happens-before"
title = "이건 왜 안전한가"
story = "화이트보드에 코드 조각 넷. 셋은 올바르게 동기화됐고 하나는 아니며, 레이스 검출기도 동의한다."
brief = '''
표준 입력은 정수 `n` 하나입니다.

올바르게 동기화된 네 가지를 만들고 각각이 낸 것을 출력하세요:

1. `CHAN <v>` — 고루틴이 평범한 `int`를 쓰고 **그다음** 채널에 보냅니다.
   수신이 그 쓰기를 보이게 만드는 것입니다. `42`를 쓰세요.
2. `ONCE <k>` — 고루틴 `n`개가 모두 하나의 `sync.Once`를 호출합니다. `k`는
   함수가 실제로 실행된 횟수입니다.
3. `MUTEX <k>` — 고루틴 `n`개가 `sync.Mutex` 아래에서 카운터를 증가시킵니다.
4. `WG <k>` — 고루틴 `n`개가 각자 슬라이스의 자기 슬롯에 쓰고, `wg.Wait()`가
   `n`개의 쓰기 전부를 읽는 쪽에 보이게 만드는 것입니다.

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

이 각각이 *happens-before* 간선이고, 필요한 모양은 이 넷뿐입니다: 송신은
대응하는 수신이 완료되기 전에 일어납니다. `Once.Do`는 그 한 번의 호출이 끝난
뒤에야 반환합니다. unlock은 다음 lock 전에 일어납니다. `wg.Wait`는 짝이 되는
`Done` 호출들 뒤에야 반환합니다.

여기서 타이밍 덕분에 안전한 것은 하나도 없습니다. 간선 하나를 아무거나 빼면
`-race`가 그것을 찾아냅니다. 단 한 번도 틀린 숫자를 낸 적 없는 기계에서도요.
'''
hints = [
  "close(ready) 그다음 <-ready는 Go에서 가장 값싼 공개 간선이고, 고루틴이 그 전에 한 모든 쓰기를 실어 나릅니다.",
  "once.Do 안의 runs++는 자체 락이 필요 없습니다. Once가 이미 정확히 한 번, 그리고 다른 모든 Do가 반환하기 전에 일어남을 보장합니다.",
  "각 고루틴이 슬롯 하나를 소유하므로 어느 둘도 같은 메모리를 건드리지 않습니다. 필요한 간선은 전부를 읽기 전의 Wait 하나뿐입니다.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.advanced.15.generic-constraints"
title = "타입이 약속해야 하는 것"
story = "헬퍼 셋, 서로 다른 약속 셋, 그중 타입이 무엇을 할 수 있는지 신경 쓰는 것은 하나뿐이다."
brief = '''
첫 줄은 `n`입니다. 둘째 줄은 소문자 단어 `n`개입니다.

각각 다른 종류의 제약을 가진 제네릭 헬퍼 세 개를 작성하세요:

* `Names[T Named](xs []T) []string` — **메서드**가 있는 제약
* `Max[T Ordered](xs []T) T` — **타입 집합**인 제약, `~string | ~int64`
* `Distinct[T comparable](xs []T) int` — 내장 제약

각 단어를 `Name() string` 메서드가 있는 `Stop`으로 감싸세요. 이름들을
공백으로 이어 출력한 뒤, `MAX <w>`(사전순으로 가장 큰 단어)와
`DISTINCT <k>`를 출력하세요.

```
input:  3
        tram bus mtr
output: tram bus mtr
        MAX tram
        DISTINCT 3
```

제약은 타입 매개변수 자리에 쓰인 인터페이스이고, 보통의 인터페이스가 담을
수 없는 두 가지를 담을 수 있습니다: **타입 집합**(`~string`은 밑바탕 타입이
`string`인 모든 타입과 맞습니다)과 미리 선언된 `comparable`.

`interface{ Name() string }` **매개변수**와의 차이는 소리 내어 말할 가치가
있는 것입니다: `Names[T Named]`는 단형화되고 호출은 정적이며 박싱이 필요
없습니다. `func Names(xs []Named)`였다면 호출하는 곳마다 손으로 다른
슬라이스를 만들어야 했을 겁니다.
'''
hints = [
  "Names 안에서 x.Name()이 타입 검사를 통과하는 것은 제약이 그 메서드를 약속했기 때문입니다. 그것이 메서드 제약이 사 주는 것입니다.",
  "Max가 >를 쓸 수 있는 것은 오직 Ordered가 그것을 지원하는 타입들의 타입 집합이기 때문입니다. `any`였다면 컴파일되지 않습니다.",
  "map[T]struct{}는 T가 comparable이어야 하는데, 그게 정확히 그 제약이고, struct{}는 `맵이 아니라 집합`이라고 말하는 폭 0의 값입니다.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "go.advanced.16.gotchas"
title = "보이는 것과 다른 세 가지"
story = "알고리즘 문제가 아니다. 코드 조각 셋, 그리고 면접관은 각각이 무엇을 출력하는지만 알고 싶어 한다."
brief = '''
표준 입력은 개수 `n`(최소 4), 그다음 정수 `n`개입니다.

`a := make([]int, n, n+4)`를 만들고 채우세요. 그다음 정확히 네 줄을 내세요:

1. `ALIAS <a[2]>` — `b := a[:2]` 그리고 `b = append(b, 99)` 뒤의 값.
2. `NILIFACE <bool>` — **nil `*Thing`**을 `Fooer` 인터페이스 변수에 대입하고
   그 변수가 `!= nil`인지 보고.
3. `DEFER_CLOSURE <v>` — `x`를 읽는 `defer func(){ ... }()`에서.
4. `DEFER_ARG <v>` — `defer fmt.Printf(..., x)`에서.

두 defer가 등록되기 **전에** `x := a[0]`을 설정하고, `main`의 맨 끝에서
`x = a[n-1]`을 설정하세요. (`n`이 최소 4인 것은 `a[n-1]`이 앨리어싱 단계가
덮어쓰는 칸이 되는 일이 결코 없게 하기 위해서입니다. `n = 3`이면 그렇게
되는데, 그것은 이 과제가 일부러 치워 둔 네 번째 놀라움입니다.)

```
input:  4
        1 2 3 4
output: ALIAS 99
        NILIFACE true
        DEFER_CLOSURE 4
        DEFER_ARG 1
```

세 답 모두 사람들을 놀라게 하고, 셋 다 원인이 같습니다: Go는 무언가를 보이는
것보다 더 이르게, 또는 더 늦게 평가합니다.

**앨리어싱.** `a[:2]`는 `a`의 배킹 배열을 공유하고 그 용량을 그대로
갖습니다. 그래서 `append`는 자리가 있고, 할당하는 대신 `a[2]`에 써 넣습니다.
슬라이싱은 복사가 아닙니다. 세 인덱스 형태인 `a[:2:2]`는 용량을 제한하며,
이것이 이를 막는 방법입니다.

**타입 있는 nil.** 인터페이스 값은 (타입, 값) 쌍입니다. 거기에 nil `*Thing`을
넣으면 `(*Thing, nil)`이 되는데, 이것은 nil *인터페이스*가 아닙니다. nil
구체 오류 포인터를 돌려준 함수에 대해 `if err != nil`이 발동하는 이유가
이것이고, Go에서 가장 비싼 두 줄입니다.

**Defer.** 지연된 호출의 인자는 호출이 실행될 때가 아니라 **`defer`가 실행될
때** 평가됩니다. 인자를 받지 않는 지연된 클로저는 대신 호출 시점에 변수를
읽습니다. 두 defer는 같은 `x`를 봅니다. 둘의 답이 다른 것은 한쪽이 이미
복사본을 만들었기 때문입니다. 그리고 LIFO로 실행되므로 두 번째로 적힌 것이
먼저 출력됩니다.
'''
hints = [
  "x가 바뀌기 전에 두 defer를 모두 등록하고, 나중에 들어온 것이 먼저 실행된다는 것을 기억하세요.",
  "cap(a[:2])는 2가 아니라 cap(a)입니다. 그것이 앨리어싱 답의 전부입니다. 나중에 a[:2:2]를 시도해 보고 ALIAS가 원래 값이 되는 것을 지켜보세요.",
  "boxed는 (*Thing, nil)을 담고 있습니다. nil과 비교하면 쌍을 비교하는데, 타입 쪽 절반은 nil이 아닙니다.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "go.advanced.17.race"
title = "레이스"
story = "코즈웨이베이 환승역, 2번 승강장. 카운터 둘, 숫자 하나, 그리고 그 숫자는 아무도 두 번 재현할 수 없는 만큼 틀려 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 `<IN|OUT> <K>` 형식의 줄 `n`개입니다.

줄마다 고루틴을 하나씩 시작하세요. 각각은 자기 카운터를 `K`번 증가시키되,
한 번에 하나씩입니다. `+= K`가 아니라 한 번에 하나씩입니다. 개찰구가 그렇게
하기 때문입니다. 전부 기다린 뒤 `IN <a>`, `OUT <b>`, `NET <a-b>`를 출력하세요.

```
input:  2
        IN 3
        OUT 1
output: IN 3
        OUT 1
        NET 2
```

숨겨진 케이스에서 `K`는 여섯 자리에 이르는데, 그것이 요점입니다: 여러
