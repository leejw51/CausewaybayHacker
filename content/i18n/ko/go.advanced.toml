# GO LAND — ADVANCED, in Korean. A translation pack (SPEC §12.1): the prose of
# `content/go/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.advanced"
locale = "ko"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.advanced.01.goroutines"
title = "라이더 마흔 명"
story = "12:30. 자전거 여덟 대, 주문 마흔 건, 그리고 배차 담당은 아직도 하나씩 차례로 불러 주고 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 고루틴을 하나씩 시작하세요. 각각은 채널 하나에 `{index, value * value}`를
보냅니다. 결과 `n`개를 모두 모아 인덱스로 정렬하고, `<index> <value>`를 한 줄에
하나씩 출력한 뒤 `GOROUTINES <n>`을 출력하세요.

```
input:  3
        2 3 4
output: 0 4
        1 9
        2 16
        GOROUTINES 3
```

결과는 스케줄러 마음대로의 순서로 도착합니다. 인덱스를 함께 실어 보내는 것이
프로그램의 답을 매 실행마다 같게 만드는 방법입니다.

이 팩의 모든 고루틴은 루프 변수를 **매개변수**로 받습니다. Go 1.22부터는 —
그리고 `go` 지시문이 `1.22` 이상이라고 말하는 모듈 안에서만 — `for` 루프가
반복마다 자기만의 `i`와 `v`를 주므로 거기서는 직접 붙잡아도 안전합니다. 그
밖의 모든 곳에서는, 그것을 붙잡는 것이 Go에서 가장 흔한 버그 하나입니다.
넘겨주는 방식은 어떤 버전에서든 옳고, 고루틴이 봐도 되는 것을 시그니처에
정확히 이름 붙입니다.
'''
hints = [
  "용량 n의 버퍼 채널이면 어떤 송신자도 막히지 않으므로, 일찍 멈춰도 새는 고루틴이 없습니다.",
  "정확히 n번 수신하세요. 여기서 전부 끝났음을 아는 다른 방법은 없습니다.",
  "인덱스에 대한 sort.Slice가 스케줄러가 빼앗아 간 순서를 되돌려 줍니다.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.advanced.02.waitgroup"
title = "아무도 먼저 가지 않는다"
story = "배차 담당은 마지막 라이더가 체크인하기도 전에 게시판을 읽고, 게시판은 반이 비어 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 단어 `n`개입니다.

단어마다 고루틴을 하나씩 시작해 단어를 대문자로 바꿔 `out[i]`에 쓰게 하세요.
자기 자신의 인덱스이므로 두 고루틴이 같은 원소를 건드리는 일은 없습니다.
`sync.WaitGroup`으로 전부 기다린 뒤 `out`을 순서대로 출력하고 `WAITED <n>`을
출력하세요.

```
input:  2
        lucky
        mac
output: LUCKY
        MAC
        WAITED 2
```

`go` 앞에서 `wg.Add(1)`, 고루틴 안에서 맨 먼저 `defer wg.Done()`, 무엇이든
읽기 전에 `wg.Wait()`. 고루틴 안에서 Add하는 것은 `Wait` 자체와의
경쟁입니다.
'''
hints = [
  "여러 고루틴에서 out[i]에 쓰는 것이 안전한 이유는 모든 i가 정확히 하나의 고루틴에 의해서만 쓰이기 때문입니다.",
  "고루틴의 첫 줄에 defer wg.Done()을 두세요. 그래야 패닉이 나도 대기가 풀립니다.",
  "wg.Add(1)은 루프 안, go 문 앞에 들어갑니다. 고루틴 안이 아닙니다.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.advanced.03.close"
title = "누가 창구를 닫는가"
story = "마지막 주문이 나간 뒤에도 주방 창구는 열려 있고, 카운터는 하나 더 나오길 기다리며 그 앞에 서 있다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

고루틴 하나가 각 값에 10을 곱해 보내고 나서 채널을 **닫습니다**. `main`은
채널을 range로 돌며 각 값을 출력하고 합계를 유지한 뒤, `SUM <total>`과
`CLOSED`를 출력합니다.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

채널에 대한 `range`는 채널이 닫혀야 끝나고, 그전에는 끝나지 않습니다.
`close`를 잊으면 Go 런타임이 무슨 일이 일어났는지 정확히 말해 줍니다:
*all goroutines are asleep — deadlock!*

닫는 쪽은 송신자입니다. 수신자는 절대 아닙니다.
'''
hints = [
  "한 줄, 보내는 고루틴의 끝에.",
  "고루틴 맨 위의 defer close(ch)도 같은 일을 하고, 일찍 반환해도 살아남습니다.",
  "수신 쪽에서 닫으면 송신자가 보내다 패닉이 납니다. 그래서 규칙이 송신자가 닫는다인 것입니다.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.advanced.04.select"
title = "승강장 두 개"
story = "1번 승강장과 2번 승강장이 같은 대합실 카운터로 흘러드는데, 카운터는 한 번에 한쪽만 볼 수 있다."
brief = '''
표준 입력은 정수 두 개 `a`와 `b`입니다.

고루틴 하나가 트램 채널에 값 `a`개를 보내고 닫습니다. 다른 하나가 MTR 채널에
`b`개를 보내고 닫습니다. `main`은 `select` 루프 하나로 **양쪽** 모두를 비우며
어디서 무엇이 왔는지 셉니다.

`TRAM <a>`, `MTR <b>`, `TOTAL <a+b>`를 출력하세요.

```
input:  3 2
output: TRAM 3
        MTR 2
        TOTAL 5
```

닫힌 채널에서의 수신은 즉시, 영원히 반환됩니다. 그래서 그 갈래를 그대로 둔
`select`는 헛돌게 됩니다. 요령은 이렇습니다: `v, ok := <-ch`, 그리고 `ok`가
false가 되면 그 채널 변수를 `nil`로 설정하세요. **nil** 채널에서의 수신은
영원히 막히는데, `select` 안에서 그것은 그 갈래가 그냥 꺼진다는 뜻입니다.
둘 중 하나라도 아직 nil이 아닌 동안 반복하세요.
'''
hints = [
  "select case 안의 v, ok := <-ch: ok는 채널이 닫히고 다 비워진 바로 그 순간부터 false입니다.",
  "채널 변수를 nil로 설정하면 그 case가 비활성화됩니다. nil 채널은 결코 준비되지 않습니다.",
  "루프 조건은 `tramCh != nil || mtrCh != nil`이므로, 양쪽 갈래가 모두 꺼지면 끝납니다.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.advanced.05.mutex"
title = "서랍 하나, 손 여덟"
story = "두 계산대가 같은 서랍에서 현금을 꺼내고, 영업 마감 때 서랍은 둘 어느 쪽과도 맞지 않는다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

`Counter`를 완성하세요: `Add`는 락을 잡고 합계에 더하고 히트 수를 올립니다.
`Snapshot`은 락을 잡고 둘 다 돌려줍니다. 값마다 고루틴을 하나씩 시작하고,
기다린 뒤 `TOTAL <sum>`과 `HITS <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

뮤텍스는 자기가 보호하는 구조체 **안에**, 지키는 필드들 바로 옆에 살고, 그
필드를 건드리는 모든 메서드가 그것을 잡습니다. 포인터 리시버를 잊는 순간
`Counter`는 값으로 복사됩니다. `go vet`이 그렇게 말해 줄 겁니다.
'''
hints = [
  "c.mu.Lock() 그다음 defer c.mu.Unlock()이 패턴의 전부이고, defer는 일찍 반환해도 살아남습니다.",
  "Snapshot은 필드 두 개를 읽습니다. 한 락 아래에서 읽는 것이 그 둘을 일관되게 만듭니다.",
  "두 메서드 모두 포인터 리시버가 필요합니다. 아니면 호출마다 뮤텍스의 복사본을 잠그고 아무것도 지키지 못합니다.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.advanced.06.atomic"
title = "한 번, 딱 한 번만"
story = "모든 라이더의 앱이 시작할 때마다 차고 연결을 여는데, 차고에는 이제 연결이 마흔 개이고 소켓은 하나다."
brief = '''
표준 입력은 개수 `n`, 그다음 정수 `n`개입니다.

값마다 고루틴을 하나씩 시작하세요. 그 모두가 같은 `sync.Once`를 호출하고,
그것이 `INIT`을 출력합니다. 그래서 어느 고루틴이 먼저 닿았든 `INIT`은 정확히
한 번 나타납니다. 그다음 각각은 자기 값을 `atomic.Int64` 합계에 더하고
`atomic.Int64` 카운트를 올립니다.

전부 끝난 뒤 `TOTAL <sum>`과 `COUNT <n>`을 출력하세요.

```
input:  4
        1 2 3 4
output: INIT
        TOTAL 10
        COUNT 4
```

원자적 카운터는 값싼 뮤텍스가 아닙니다. 정확히 이런 일을 위한 다른
도구입니다: 워드 하나, 읽고-고치고-쓰기, 그 주위에 임계 구역 없음. 워드
하나보다 넓은 것은 여전히 뮤텍스를 원합니다.
'''
hints = [
  "once.Do(func(){ ... })는 첫 번째에 인자를 실행하고, 그것이 끝날 때까지 나머지를 막습니다.",
  "atomic.Int64에는 Add와 Load 메서드가 있습니다. 주소 연산자도, 뮤텍스도 없습니다.",
  "INIT은 항상 TOTAL보다 먼저 나옵니다. 출력이 고루틴 안에서 일어나고 TOTAL은 Wait 뒤에 일어나기 때문입니다.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.advanced.07.context"
title = "그만 보내"
story = "손님은 세 블록 전에 앱을 닫았는데 주방은 아직도 그 주문을 조리하고 있다."
brief = '''
표준 입력은 정수 두 개 `n`과 `k`입니다.

**버퍼 없는** 채널에 `1..n`을 하나씩 보내려 하되, 자기 `context`가 취소되는
순간 멈추고 실제로 몇 개를 보냈는지 보고하는 생산자 고루틴을 시작하세요.

`main`은 정확히 `k`개의 값을 받아 출력하고, `cancel()`을 호출하고,
`CANCELLED`를 출력한 뒤, 생산자로부터 받은 `SENT <count>`를 출력합니다.

```
input:  5 3
output: 1
        2
        3
        CANCELLED
        SENT 3
```

생산자의 루프 본문은 갈래가 둘인 `select`입니다: `<-ctx.Done()`과 송신.
아무도 받고 있지 않으면 송신은 결코 준비되지 않으므로, 발동할 수 있는 것은
취소뿐입니다. 그것이 이 프로그램을 운이 아니라 결정적으로 만드는 것입니다.
'''
hints = [
  "ctx.Done()은 cancel이 호출될 때 닫히는 채널이므로, 거기서의 수신은 다른 것과 다를 바 없는 select 갈래입니다.",
  "생산자는 두 경로 모두에서 보고해야 합니다: 취소된 반환과 루프의 끝.",
  "main의 defer cancel()은 직접 cancel을 호출하더라도 선택 사항이 아닙니다. 그것이 컨텍스트를 해제하는 것입니다.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.advanced.08.worker-pool"
title = "자전거 여덟 대"
story = "주문 마흔 건에 자전거 여덟 대. 아무도 자전거 마흔 대를 원하지 않는다. 여덟 대가 한시도 서 있지 않기를 원한다."
brief = '''
표준 입력은 정수 두 개 `w`와 `n`, 그다음 값 `n`개입니다.

워커 풀을 만드세요: `jobs` 채널을 range로 도는 워커 `w`개, 각각은
`{index, value * value}`를 `results` 채널에 밀어 넣습니다. 고루틴 하나가
작업을 공급하고 `jobs`를 닫습니다. 다른 하나가 워커들을 기다렸다가 `results`를
닫습니다. `main`은 `results`가 닫힐 때까지 range로 돌고, 인덱스로 정렬해
`<index> <value>`를 출력한 뒤 `WORKERS <w>`를 출력합니다.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

close 세 번, 동작하는 유일한 순서로: 공급자가 `jobs`를 닫아 워커들의 `range`가
끝납니다. 워커들이 끝나 `WaitGroup`이 풀립니다. 기다리던 쪽이 `results`를
닫아 `main`의 `range`가 끝납니다.
'''
hints = [
  "워커에게는 자기만의 인덱스가 필요 없습니다. 작업이 그것을 실어 옵니다.",
  "close(results)는 워커 안에서 일어날 수 없습니다. 워커는 w개인데 close는 한 번만 합법입니다.",
  "그것이 추가 고루틴의 용도입니다: main이 아직 비우는 동안 wg.Wait() 그다음 close(results).",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.advanced.09.errors-in-flight"
title = "누군가의 점심 주문"
story = "전표 마흔 장을 한꺼번에 파싱하는데 그중 하나는 죽에 대한 손글씨 메모다."
brief = '''
표준 입력은 개수 `n`, 그다음 줄 `n`개이며 각 줄은 정수여야 합니다.

**동시에** 파싱하세요. 줄마다 고루틴 하나씩이며, 채널 하나에
`{index, value, err}`를 보냅니다. `n`개를 모두 모아 인덱스로 정렬하고, 각각에
대해 값의 두 배 또는 `BAD <line>`을 출력하세요. 그다음 출력한 것의 합
`SUM <total>`과 `ERRORS <count>`를 출력하세요.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
        ERRORS 1
```

고루틴에서 나온 오류는 다른 결과와 똑같이 이동해야 합니다. `go` 문에서
`return err`를 할 수는 없고, 잘못된 줄에서 패닉이 나는 고루틴은 프로그램
전체를 데리고 갑니다.
'''
hints = [
  "오류는 결과 구조체의 필드입니다. 그것이 아이디어의 전부입니다: 오류는 값과 함께 이동합니다.",
  "파싱이 실패해도 보내세요. main은 정확히 n번의 수신을 세고 있고, 아니면 하나 모자란 채 멈춥니다.",
  "출력하기 전에 인덱스로 정렬하세요. 아니면 출력은 스케줄러가 정한 대로입니다.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.advanced.10.context-tree"
title = "아래로 취소된다"
story = "손님 한 명이 앱을 닫았는데 상류의 아홉 가지가 아직도 조리하고, 배차하고, 결제하고 있다."
brief = '''
표준 입력은 정수 `n` 하나입니다.

`context.WithCancel`로 부모 컨텍스트를 만드세요. 거기서 자식 `n`개를
파생하세요: **짝수** 번째는 `context.WithCancel(parent)`로, **홀수** 번째는
`context.WithDeadline(parent, <한 시간 전>)`으로.

자식마다 `<-child.Done()`을 기다렸다가 자기 인덱스와 `child.Err().Error()`를
보고하는 고루틴을 하나씩 시작하세요. 부모를 취소하고, 보고 `n`개를 모두
모아 인덱스순으로 정렬해 출력하세요. 그다음 부모 자신의 오류를 출력하고,
`errors.Is(parent.Err(), context.Canceled)`이면 `IS_CANCELED YES`를
출력하세요.

```
input:  3
output: 0 context canceled
        1 context deadline exceeded
        2 context canceled
        PARENT context canceled
        IS_CANCELED YES
```

취소는 컨텍스트 트리를 **아래로** 흐르고 절대 위로 흐르지 않습니다. 데드라인이
이미 지난 자식은 부모가 무엇을 하든 만들어지는 순간 죽어 있습니다. 그래서
홀수 번째는 다른 오류를 보고하고, 그래서 출력이 경쟁이 아니라 매 실행마다
같습니다.

만드는 모든 컨텍스트에 `defer cancel()`을 하는 것은 예의가 아닙니다. 끝내
취소하지 않는 컨텍스트는 부모의 자식 목록을 계속 불리고, 그것은 고루틴 하나
없는 누수입니다.
'''
hints = [
  "`done`을 n만큼 버퍼링해서, 데드라인이 이미 지난 자식이 수신자를 기다리지 않고 보고할 수 있게 하세요.",
  "모으기 시작하기 전에 부모를 취소하세요. 아니면 채널에서 막힐 때 짝수 자식들은 아직 기다리는 중입니다.",
  "ctx.Err()는 context.Canceled 또는 context.DeadlineExceeded이고, 문자열을 비교하는 대신 errors.Is로 둘을 구분합니다.",
]

