story = "Room 7-32, poslední otázka, a tazatel vypne monitor. Žádné zvýraznění, žádné doplňování, jen hodiny."
brief = '''
První řádek je `cap q`. Dalších `q` řádků je `PUT <key> <value>` nebo
`GET <key>`.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle
nepoužitou** položku. `GET` i `PUT` se počítají jako použití klíče.

Pro každý `GET` vypiš hodnotu, nebo `-1`, když tam není. Na konci vypiš
přeživší klíče, nejčerstvěji použité první, oddělené mezerami — nebo `-`,
když je cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá `1` znovu čerstvým, takže když `PUT 3`
potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá `3`
nejčerstvějším, a proto se přeživší vypíšou jako `3 1`.

Učebnicová odpověď je hashovací mapa do obousměrně spojového seznamu. V Rustu,
bez `unsafe` nebo `Rc<RefCell<_>>`, je poctivá verze `HashMap<i64, (i64, u64)>`
s monotónně rostoucím razítkem, a vyhazování hledá to nejstarší. To je O(cap)
na vyhození místo O(1), a říct to v místnosti nahlas má větší cenu než
předstírat opak.
'''
hints = [
  "Jedny hodiny, které tiknou při každé operaci, a každý dotčený klíč si zapíše jejich stav. Čerstvost je pak jen číslo, podle kterého se řadí.",
  "Přepsání klíče, který už tam je, není vyhození — zkontroluj contains_key dřív, než rozhodneš, že je cache plná.",
  "Poslední řádek je seřazený podle razítka sestupně, takže klíč dotčený naposledy jde první.",
]
