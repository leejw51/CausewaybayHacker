# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.hacker.01.two-sum"
title = "Dvě jízdenky"
story = "Room 7-32. První otázka je ta, kterou dostane každý, a hodiny se spustí už cestou dovnitř."
brief = '''
První řádek je `n target`. Druhý řádek je `n` celých čísel.

Vypiš indexy `i j` (**od 1**) dvou různých položek, které dají dohromady
`target`, jako `i j` s `i < j`. Pokud vyhovuje víc dvojic, dej tu, jejíž
druhý index je nejmenší; pokud je i tak shoda, nejmenší první index. Pokud
nevyhovuje žádná dvojice, vypiš `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

Skryté případy jsou tu malé: kontrolují rozhodnutí při shodě a případ bez
odpovědi, ne tvou rychlost. Otázka je pořád ta lineární — jeden průchod,
jedna hashovací mapa — protože skutečné `n` je 200000 a vnořená smyčka je
přesně to, co má tahle otázka vytřídit. Napiš odpověď, na kterou se otázka
ptá, ne tu, která náhodou projde těmito čtyřmi případy.
'''
hints = [
  "Jeden průchod. U každé hodnoty se zeptej, jestli už bylo viděno target minus ona.",
  "entry(x).or_insert(j) si u opakované hodnoty nechá první index, a to je rozhodnutí při shodě, které zadání žádá.",
  "Vypiš a vrať se v okamžiku, kdy ji najdeš — první zásah při průchodu už má nejmenší druhý index.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.hacker.02.window"
title = "Bez opakování"
story = "Druhá otázka je na tabuli dřív, než stihneš odložit fixu."
brief = '''
Jeden řádek textu, bez mezer.

Vypiš délku nejdelšího úseku znaků, ve kterém se nic neopakuje, pak
samotný úsek. Pokud je víc úseků stejně dlouhých, vypiš ten nejvíc vlevo.

```
input:  abcabcbb
output: 3
        abc
```

Okno se pohybuje jen doprava. Pokud zjistíš, že po opakování procházíš
znovu od začátku, napsal jsi tu kvadratickou.

Případy jsou tu malé a hodiny je neměří — a neměřily by ani větší případ.
Generovaný řetězec kvadratickou odpověď nechytí: na 200000 náhodných
písmenech je nejdelší úsek bez opakování devatenáct znaků dlouhý, takže
„začni znovu na každé pozici a prodlužuj až k opakování“ udělá asi devatenáct
kroků na začátek a dorazí za šest milisekund, stejně jako okno. Kvadratickou
verzi potrestá text s dlouhými úseky bez opakování, a to je nepřátelský
vstup, ne náhodný. Napiš okno proto, že skutečný vstup je nepřátelský, ne
proto, že na něm trvaly tyhle čtyři případy.
'''
hints = [
  "Drž index, kde byl každý znak naposledy viděn, a index, kde začíná okno.",
  "Opakování se počítá jen tehdy, když jeho poslední pozice leží uvnitř aktuálního okna — to je test `previous >= start`.",
  "Zaznamenej nejlepší délku *i* to, kde začala, jinak úsek na konci nevypíšeš.",
]

