[[quest]]
id    = "rust.hacker.03.intervals"
title = "Rozpis směn"
story = "Podají ti rozpis směn v Lucky Mac a ptají se, které hodiny jsou skutečně pokryté."
brief = '''
První řádek je `n`. Dalších `n` řádků je `<start> <end>` se `start <= end`.

Slouč každou dvojici, která se překrývá nebo dotýká, a vypiš výsledek
vzestupně, jeden `<start> <end>` na řádek, pak `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Dotyk se počítá jako překryv: `1 4` a `4 5` se sloučí do `1 5`.
'''
hints = [
  "Nejdřív seřaď podle začátku. Pak stačí jeden průchod zleva doprava a nikdy se nedíváš zpátky víc než o jeden interval.",
  "Když je nový začátek <= konci posledního sloučeného intervalu, prodluž ho; jinak vlož nový.",
  "Prodlužuj na max(last.end, end) — krátký interval pohlcený dlouhým ho nesmí zkrátit.",
]

