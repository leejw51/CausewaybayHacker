[[quest]]
id    = "rust.hacker.33.grid-paths"
title = "Přes blok, nikdy zpátky"
story = "Doručovací mřížka se třemi ulicemi zavřenými kvůli bambusovému lešení. Kolika cestami se dá projít a která je nejlevnější."
brief = '''
Na standardním vstupu je `r c pct seed`. Mřížku si postav sám, po řádcích,
s **dvěma** losovanými hodnotami na každé políčko:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Pohybuj se jen **doprava** nebo **dolů**, přes volná políčka. Vypiš:

1. `PATHS <k>` — kolik různých cest vede z `(0,0)` do `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — nejmenší celkovou cenu cesty, včetně obou koncových bodů,
   nebo `-1`, když žádná cesta není

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

Jeden průchod po řádcích udělá obojí: cesty do políčka jsou součtem cest do
něj shora a zleva a jeho nejlepší cena je jeho vlastní cena plus levnější z
těch dvou. Protože se pohybuješ jen doprava nebo dolů, obě políčka, která
potřebuješ, jsou vždycky už hotová — a proto to nepotřebuje rekurzi ani
množinu navštívených.

Počet `PATHS` se bere modulo `1000000007` z obvyklého důvodu: na skrytém
případu `1000 × 1000` má skutečné číslo přes šest set číslic. Redukuj při
sčítání.

**Co velký případ vynucuje:** odmítne každou odpověď, která cesty vyjmenovává.
Je jich víc, než je v místnosti atomů. Nerozliší tabulku zdola nahoru od
memoizované rekurze — obě jsou lineární v počtu políček a obě projdou s
rezervou.
'''
hints = [
  "Losuj obě hodnoty pro každé políčko, včetně dvou rohů — generátor je nepřeskakuje, jen je odmítá zablokovat.",
  "Volné políčko bez volného souseda shora ani zleva je dosažitelné nula cestami a nemá nejlepší cenu; nech i64::MAX znamenat `unreachable` a sčítání ohlídej.",
  "Cíl může být volný a přesto nedosažitelný, a přesně tehdy je PATHS 0 a MIN -1. Jeden ze skrytých případů je tohle.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "rust.hacker.34.stable-sort"
title = "Shody si drží místo"
story = "Dva kurýři skončili se stejným skóre a žebříček je při každém překreslení dá v jiném pořadí."
brief = '''
Na standardním vstupu je `n buckets seed`. Postav `n` kurýrů, kde kurýr `i`
má index `i` a skóre:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď kurýry podle skóre **sestupně**. Kurýři se stejným skóre si musí
nechat pořadí, v jakém přišli. Vypiš jejich indexy, oddělené mezerami, pak
`TIES <k>` — kolik sousedních dvojic ve tvém seřazeném pořadí má stejné
skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda a odpověď je skoro celá
rozhodnutá tím, co se s nimi stane.

**Tohle je quest o tom, vědět, které řazení držíš v ruce.**
`sort_by_key` je **stabilní** — stejné prvky si drží vzájemné pořadí.
`sort_unstable_by_key` není, a na skutečném vstupu ho viditelně neudrží: je
to pattern-defeating quicksort, bývá rychlejší a o shodách neslibuje vůbec
nic. Starter ho používá a skryté případy jsou dost velké, aby je
prokazatelně zamíchal. (Při `n = 8` se to náhodou nestane — a proto by malý
test nic nedokázal a proto je malý případ tady ten *viditelný*, ne ten,
který tě posuzuje.)

Správné odpovědi jsou dvě a měl bys umět dát obě. Použij stabilní řazení.
**Nebo** nech to nestabilní a udělej porovnání **úplné** — řaď podle
`(Reverse(score), index)`, aby se žádné dva prvky nikdy neporovnaly jako
stejné a stabilita přestala být otázkou. To druhé je to, po čem sahat ve
výchozím stavu; nestabilní řazení nemá co dokazovat, když je pořadí úplně
určené.
'''
hints = [
  "Jedno slovo: sort_unstable_by_key se změní na sort_by_key. To je ta stabilní odpověď.",
  "Druhá odpověď nechá nestabilní řazení a řadí podle (Reverse(score), index) — úplné pořadí, takže nezbydou žádné shody, u kterých by šlo být nestabilní.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal kteroukoli z těch dvou — prozradí tě pořadí indexů.",
]

