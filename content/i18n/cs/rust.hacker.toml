[[quest]]
id    = "rust.hacker.23.prefix-sums"
title = "Kolika způsoby trefit cíl"
story = "Den tržeb a číslo, které chce auditor vidět. Kolik úseků po sobě jdoucích hodin dá dohromady přesně tohle."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu není
žádný seznam a ani cíl — obojí postavíš sám, **přesně** tímto generátorem, v
aritmetice `u64`, která se přetáčí:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

k = (next() % 9) - 4                  # the target, drawn first
values[i] = (next() % 9) - 4          for i in 0..n
```

Vypiš, kolik souvislých úseků má součet přesně `k`, pak `RANGE <s>`, součet
celého seznamu, odečtený z posledního prefixového součtu, ne dalším
sčítáním.

```
input:  8 1
output: 4
        RANGE 0
```

Pro `8 1` je cíl `1` a hodnoty jsou `-1 -1 -1 -4 4 1 3 -1`.

Záporné hodnoty zabijí posuvné okno — okno, které je moc velké, se
zmenšením opravit nedá. Přežijí prefixové součty: úsek `i..j` má součet `k`
přesně tehdy, když `prefix[j] - prefix[i] == k`, takže spočítej, kolik
dřívějších prefixů se rovná `prefix[j] - k`. Mapu osaď s `0 → 1` pro úseky,
které začínají na začátku.

**Tenhle quest vynucuje svou složitost.** Jeden skrytý případ je
`n = 500000`. Sčítat každý úsek od jeho vlastního začátku je `1.25 × 10^11`
sčítání — to je starter, je správně a trvá **51 sekund** proti limitu běhu
pět sekund. Odpověď s prefixy a mapou je jeden průchod, `O(n)`, a doběhne za
**14 milisekund**. Obojí změřeno na tomhle stroji, se dvěma programy v tomhle
questu.

`n` je 500000, a ne 200000, které si dvojitá smyčka obvykle zaslouží, a ten
důvod stojí za to znát. Naivní vnitřní smyčka je tu jedno sčítání a jedno
porovnání přes souvislý řez, který kompilátor ochotně vektorizuje: při 200000
dorazila pořád za **méně než devět sekund** — přes limit, ale ne dvojnásobně,
a rychlejší stroj by ji pustil dál. Laťka, kterou přeskočíš koupí lepšího
notebooku, není laťka.

Počet je velký — `53075531` u velkého případu — a do `i32` se pořád vejde,
stejně jako průběžný prefix, protože hodnoty jsou v `-4..4` a 500000 z nich
dá dohromady pár tisíc. Nic tu není potichu špatně kvůli špatné šířce. Je to
jen pomalé.
'''
hints = [
  "Dřívější prefix vyhledej *dřív*, než zaznamenáš ten aktuální, jinak se úsek nulové délky při k rovném 0 započítá sám.",
  "seen.insert(0, 1) hned na začátku je to, co vůbec umožní najít úsek, který začíná na indexu 0.",
  "Poslední prefix je celkový součet, takže druhý řádek nic navíc nestojí.",
]

