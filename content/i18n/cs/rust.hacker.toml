[[quest]]
id    = "rust.hacker.11.bst"
title = "Je to opravdu BST"
story = "Doplňující otázka. Každý zkontroluje ty dva potomky a každý se napoprvé mýlí."
brief = '''
Stejné kódování po úrovních jako v minulém questu: `-1` je chybějící uzel,
potomci `i` jsou `2i+1` a `2i+2`.

První řádek je `n q`. Druhý řádek je `n` hodnot stromu. Třetí řádek je `q`
hodnot dotazů.

Vypiš `VALID` nebo `INVALID` — je to binární vyhledávací strom, kde každá
hodnota v levém podstromu je ostře menší než uzel a každá v pravém ostře
větší? Pak jeden řádek na dotaz: `<value> FOUND <depth>`, když je ve stromu,
`<value> ABSENT`, když není, kde kořen má hloubku 1.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Kontrola `left < node < right` v každém uzlu **nestačí** — hodnota hluboko v
levém podstromu může být pořád větší než předek. Nes místo toho dolů
otevřený interval.
'''
hints = [
  "Předávej dolů otevřený interval (low, high). Kořen dostane celý rozsah; levý potomek dostane (low, node), pravý potomek (node, high).",
  "Chybějící uzel je triviálně platný — to je bázový případ a vrací true, ne false.",
  "Vyhledání je binární hledání: menší jde doleva, jinak doprava, a hloubka je, kolik skoků to trvalo.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.hacker.12.heap"
title = "K seřazených front"
story = "Každá pobočka Lucky Mac posílá své lístky už seřazené. Slouč je do jedné řady, aniž bys to celé řadil znovu."
brief = '''
První řádek je `k`. Pak `k` řádků, každý počet a za ním tolik celých čísel,
už seřazených vzestupně.

Vypiš je všechny sloučené do jednoho vzestupného řádku, oddělené mezerami,
pak `POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`BinaryHeap` je **max**-halda. Aby posloužila jako min-halda, vkládej
`std::cmp::Reverse(x)` a na cestě ven `Reverse` rozbal — to je celý trik
specifický pro Rust, a právě ten otázka kontroluje.

Halda drží jednu položku na seznam, ne jednu na prvek, takže zůstává
velikosti `k`, ať jsou seznamy jakkoli dlouhé.

Případy jsou tu malé a hodiny je neměří. Halda je pořád ta odpověď —
procházení všech `k` hlav pro každý prvek je `O(N·k)` a skutečné `k` jde do
tisíců — ale nic v těchto čtyřech případech není dost velké, aby ty dvě
