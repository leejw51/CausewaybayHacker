input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

Prostředek je běžec: jeden ukazatel po jednom kroku, druhý po dvou, a když
rychlému dojde cesta, pomalý je tam. Jeden průchod.
