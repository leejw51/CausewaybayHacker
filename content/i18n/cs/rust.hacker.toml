[[quest]]
id    = "rust.hacker.07.coins"
title = "Přesně na drobné"
story = "Pokladna na Percival Street má tři přihrádky na mince a zákazníka, který si bankovku nevezme."
brief = '''
První řádek je `n target`. Druhý řádek je `n` hodnot mincí. Každá mince je k
dispozici v neomezeném množství.

Vypiš nejmenší počet mincí, který dá přesně `target`, nebo `-1`, když se to
složit nedá. Pak vypiš `REACH <k>`: kolik z částek `0..=target` se dá složit
vůbec, včetně `0`.

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

Skryté případy jsou malé, takže chytají spíš špatnost než pomalost — a jeden
z nich chytá obvyklou špatnou odpověď. Hladový algoritmus, který bere
největší minci, která se vejde, a opakuje, skládá `6` z `3 4` tak, že
chňapne `4` a pak selže, a na přesně tohle případ je. Druhá špatná odpověď,
obyčejná rekurze bez tabulky, tu chycená není a pořád to není ta, kterou
psát: `target` je ve skutečnosti 100000 a tatáž částka se přepočítává
tisíckrát.
'''
hints = [
  "best[0] = 0 a best[a] je o jedna víc než nejlevnější best[a - coin] přes každou minci, která se vejde.",
  "Než k buňce přičteš jedna, ohlídej, že nečteš nedosažitelnou, jinak přeteče.",
  "REACH je prostě to, kolik buněk hotové tabulky není pořád označených jako nedosažitelné.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.hacker.08.top-k"
title = "Pět nejčastějších"
story = "Rozehřívací kolo. Chtějí pět slov, která se loni v tiketech objevovala nejčastěji, a stejně to měří."
brief = '''
První řádek je `n k`. Druhý řádek je `n` slov oddělených mezerami.

Vypiš `k` nejčastějších slov, nejčastější první, při shodě podle slova
vzestupně, jedno na řádek. Pokud je různých slov méně než `k`, vypiš
všechna. Pak vypiš `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Počítej do hashovací mapy, pak řaď. Rozhodnutí při shodě není ozdoba.
`HashMap` vydává své položky v pořadí, které je v každém procesu náhodné,
takže komparátor, který se dívá jen na počet, nechá slova se stejným počtem v
pořadí, jaké mapa zrovna vyrobila — tentýž program vypíše při dalším běhu
jinou odpověď a žádná *stabilita* řazení ho nezachrání, protože vstup řazení
už byl libovolný. Opraví to až **úplné** porovnání — počet sestupně, pak
slovo vzestupně — a to je odpověď, na kterou tazatel čeká.

Skryté případy jsou tu malé: kontrolují rozhodnutí při shodě a `k` větší než
počet různých slov, a o rychlosti vůbec nic. Vstup jsou slova, a to je jediný
tvar, který generátor přesvědčivě vyrobit nedokáže — takže laťka, kterou tahle
otázka klade, je ta laťka správnosti výše, a drží ji poctivě, ne hodinami.
'''
hints = [
  "Jeden průchod na počítání, jedno řazení na pořadí. Nesnaž se při počítání udržovat pořadí aktuální.",
  "b.1.cmp(&a.1) je počet sestupně; .then(a.0.cmp(b.0)) je rozhodnutí při shodě podle slova vzestupně.",
  "take(k) je bezpečné, i když jich je méně než k — zastaví se na konci, místo aby zpanikařilo.",
]

