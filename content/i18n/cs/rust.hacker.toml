[[quest]]
id    = "rust.hacker.32.modular"
title = "Modulo miliarda sedm"
story = "Ta fráze se objeví na konci zadání a polovina místnosti neví, co po nich chce."
brief = '''
Na standardním vstupu je `n q seed`. Vygeneruj `q` dotazů, v přetáčivém
`u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo
1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak
`LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic, takže se nikdy
nespočítá a pak nezredukuje — každé násobení se redukuje průběžně. Problém je
dělení: `a! / (b! (a-b)!)` nemá v modulární aritmetice smysl. Nahradí ho
**modulární inverze**, a protože `1000000007` je prvočíslo, dá ti ji malá
Fermatova věta: `inverse(v) = v^(p-2) mod p`, spočítaná rychlým umocňováním
za asi třicet umocnění na druhou.

Takže: jednou předpočítej `factorial[0..=n]` a na každý dotaz odpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Počítání každého koeficientu zvlášť — vynásobit `b` členů,
vydělit `b` členy, na každý jedna modulární inverze — nedoběhne v limitu běhu
pět sekund; to je starter. Jedna sdílená tabulka faktoriálů doběhne asi za
padesát milisekund. Obojí změřeno na tomhle stroji.

Každý mezivýsledek je součin dvou hodnot pod `2^30`, takže se vejde do `i64`
a nic nepřeteče. V jazyce s 32bitovým `int` by se nevešel, a to je druhá
polovina toho, proč se tahle otázka klade.
'''
hints = [
  "Redukuj po každém násobení, nikdy až na konci. i64 udrží součin dvou hodnot pod P; faktoriál neudrží.",
  "inverse(v) je power(v, P - 2) a funguje jen proto, že P je prvočíslo — to je tu celý obsah malé Fermatovy věty.",
  "Předpočítat i inverzní faktoriály, směrem dolů od inverse(factorial[n]), odstraní z každého dotazu obě volání power(). Pro projití to není potřeba, a stojí za to to říct nahlas.",
]

