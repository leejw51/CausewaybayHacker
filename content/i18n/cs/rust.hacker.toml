[[quest]]
id    = "rust.hacker.04.grid"
title = "Ven z budovy"
story = "Půdorys na tabuli, požární dveře v protějším rohu a tazatel, který sleduje hodiny, a ne fixu."
brief = '''
První řádek je `r c`. Dalších `r` řádků je podlaží: `.` je volno, `#` je zeď.

Začni vlevo nahoře `(0,0)` a dostaň se vpravo dolů `(r-1, c-1)`, pohybem
nahoru, dolů, doleva nebo doprava jen přes volná políčka.

Vypiš počet **kroků** na nejkratší cestě, nebo `-1`, když žádná není. Pak
vypiš `REACHED <k>`: kolik volných políček je ze startu dosažitelných,
včetně samotného startu.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Do šířky, ne do hloubky. Průchod do hloubky najde *nějakou* cestu; otázka
chce tu nejkratší.
'''
hints = [
  "VecDeque použitá jako fronta je tady celý rozdíl mezi BFS a DFS.",
  "Políčko označ, když ho vkládáš, ne když ho vybíráš, jinak se do fronty dostane několikrát.",
  "Mřížka vzdáleností zároveň slouží jako množina navštívených: -1 znamená ještě neviděno, takže druhou strukturu nepotřebuješ.",
  "Jedno pole čtyř posunů je lepší než čtyři kopie těla. Souseda spočítej v i64 a meze zkontroluj dřív, než přetypuješ zpátky: řádek i sloupec jsou usize a `r - 1` při `r` rovném 0 v debug buildu zpanikaří a v release se přetočí na zhruba 1.8e19.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.hacker.05.binary-search"
title = "Jak velká dodávka"
story = "Depo chce nejmenší dodávku, která odveze denní zásilky ve dnech, které mají. Neřeknou ti, která dodávka to je; řeknou ti, jestli ta, kterou jmenuješ, je moc malá."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné
hmotnosti nejsou — postavíš je sám, **přesně** tímto generátorem, v
aritmetice `u64`, která se přetáčí:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

weights[i] = next() % 1000 + 1        for i in 0..n
```

Depo má vždycky **tři** dny. Najdi nejmenší kapacitu dodávky, která odveze
všech `n` balíků nejvýš za tři dny, při nakládání v pořadí, v jakém je
generátor vyrobil, bez přeuspořádání a bez dělení balíku.

Vypiš kapacitu, pak `MAX <heaviest package>`.

```
input:  8 1
output: 1702
        MAX 903
```

Pro `8 1` jsou hmotnosti `775 154 197 871 35 796 131 903`. Dodávka `1701`
potřebuje čtyři dny; `1702` to zvládne za tři.

Neprohledáváš seznam. Prohledáváš **odpověď**: kapacity od `max(weight)` do
`sum(weights)`, na kterých je „vejde se to do tří dní“ nepravda, nepravda,
nepravda a pak navždy pravda. Na to pusť binární hledání.

**Tenhle quest vynucuje svou složitost.** Jeden skrytý případ je
`n = 200000`, kde odpověď je `33355734` a nejtěžší balík je `1000` — takže
hledaná kapacita leží třicet tři milionů kroků nad místem, kde hledání
začíná. Stoupat po jedné kapacitě je správně, je to starter a **nedoběhlo to
ani za dvě minuty** proti limitu běhu pět sekund. Půlení rozsahu je místo
toho dvacet sedm zkoušek po `O(n)` a doběhne za **10 milisekund**. Obojí
změřeno na tomhle stroji, se dvěma programy v tomhle questu.

Oba konce rozsahu jsou součty, ne jednotlivé hodnoty: `sum(weights)` je u
velkého případu těsně nad `10^8`. To se do `i32` pořád vejde, ale jen proto,
že generátor omezuje balík na `1000`. Drž to v `i64` a otázka přestane být
zajímavá, a přesně to od ní chceš.
'''
hints = [
  "Dolní mez je nejtěžší jednotlivý balík — nic menšího ho nikdy neunese.",
  "Horní mez je celkový součet: jeden den, všechno naráz.",
  "low + (high - low) / 2, a při úspěchu posuň `high` dolů na `mid`, abys udržel nejmenší kapacitu, která fungovala.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.hacker.06.stack"
title = "Další větší"
story = "Sloupec jízdného na tabuli a jedna otázka: pro každé z nich, které další za ním je větší."
brief = '''
První řádek je `n`. Druhý řádek je `n` celých čísel.

Pro každou položku vypiš první položku **napravo od ní**, která je ostře
větší, nebo `-1`, když žádná není. Dej je na jeden řádek, oddělené mezerou.
Pak vypiš `NONE <k>`, kolik z nich bylo `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Drž zásobník pozic, jejichž odpověď je ještě neznámá, a ten zůstává odspodu
nahoru klesající. Každá pozice se jednou vloží a jednou vyjme, takže celé je
to jeden průchod, ať to vypadá jakkoli.

Případy jsou tu malé: kontrolují plató a úplně sestupnou řadu, ne tvou
rychlost. Velký náhodný případ by nepomohl taky. Vzdálenost od hodnoty k
další větší je v průměru asi `ln n`, takže procházení doprava z každé pozice
udělá na 200000 náhodných hodnotách 2.1 milionu vnitřních kroků a doběhne za
šest milisekund — k nerozeznání od zásobníku. Vstup, na kterém je ta odpověď
kvadratická, je sestupný seznam, a generátor by musel být postavený tak, aby
ho vyrobil, ne aby na něj náhodou narazil. Zásobník je pořád ta odpověď,
jedno vložení a jedno vyjmutí na pozici, ať jsou data jakákoli; jen to tady
neříkají hodiny.
'''
hints = [
  "Zásobník drží indexy, které ještě čekají na odpověď, ne hodnoty.",
  "Když nová hodnota přebije hodnotu na vrcholu zásobníku, odpověď toho indexu je nová hodnota — a vybírej dál, může jich přebít několik.",
  "Ostře větší, takže stejné hodnoty se navzájem nevyřeší; naskládají se a vyřeší se později spolu.",
]

