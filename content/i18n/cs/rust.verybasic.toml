# RUST LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/rust/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, the quiz's four choices, sample input and output and the exact
# strings a program must print are the English pack's and are never translated.

pack   = "rust.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.verybasic.01.print"
title = "První světlo"
story = "06:40 nad Jardine's Bazaar. Kiosek zná jméno zákazníka a nezdraví nikoho."
brief = '''
Přečti jeden řádek, jméno. Vypiš `hello, ` a za tím jméno, na jeden řádek.
`println!` je makro, které vypíše řádek; `{}` je místo, kam přijde hodnota.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  mei
output: hello, mei
```
'''
hints = [
  "println!(\"hello, {}\", name); — makro si nechává svůj !, a {} bere name.",
  "Bez ! je to funkce, která neexistuje; bez argumentu nemá {} co vypsat.",
]

