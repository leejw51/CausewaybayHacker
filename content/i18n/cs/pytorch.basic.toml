[[quest]]
id    = "pytorch.basic.26.loss-goes-down"
title = "Učí se to vůbec"
story = "Smyčka běží, ventilátory se roztočí a o čtyři hodiny později nikdo neumí říct, jestli se něco stalo. Nic se nezaznamenalo."
brief = '''
Nejlevnější test, jaký trénovací smyčka může mít: zaznamenej ztrátu na začátku a na konci a ověř, že klesla. Smyčka, která běží a neučí se, vypadá přesně jako smyčka, která se učí, dokud se tohle nevypíše.

Zaznamenej první a poslední ztrátu a vypiš, jestli je ta druhá menší.

```
output: True True
```
'''
hints = [
  "Zaznamenej loss.item() v kroku 0 do first a v každém kroku do last.",
  "Drž si float, ne tenzor: kdo drží tenzor, drží s ním naživu celý graf.",
]

