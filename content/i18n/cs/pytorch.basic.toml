[[quest]]
id    = "pytorch.basic.25.holdout"
title = "Část, kterou nikdy neviděl"
story = "Model má sto procent na datech, na kterých se trénoval, a to je jediné číslo, které nikdy nic nepředpovědělo."
brief = '''
Přesnost na trénovacích datech není výsledek. Před tréninkem odlož řez stranou, nikdy ho optimalizátoru neukaž a hodnoť na něm.

Čtyřicet vzorků: prvních třicet trénuje, posledních deset je testovací sada. Vypiš oba tvary a přesnost na odložených datech.

```
output: (30, 2) (10, 2) 1.0
```
'''
hints = [
  "x[:30] a x[30:] — stejné rozdělení se musí použít i na labely, jinak má každý řádek špatný label.",
  "Míchání se dělá před rozdělením; rozdělení datasetu seřazeného podle tříd dá testovací sadu jedné třídy.",
]

