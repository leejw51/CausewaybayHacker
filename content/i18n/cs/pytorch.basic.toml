[[quest]]
id    = "pytorch.basic.05.layer-by-hand"
title = "Vrstva, rozepsaná"
story = "Než je vrstva třída, jsou to dvě operace, a noční směna je chce jednou vidět, aniž by je cokoli schovávalo."
brief = '''
Lineární vrstva je maticové násobení a přičtení biasu, a nic jiného. Pro dávku `x` tvaru `(batch, in)` a váhu `W` tvaru `(out, in)` — v tomhle tvaru ji torch ukládá — je výstup `x @ W.t() + b`.

`W.t()` je `(in, out)`, takže vnitřní rozměry sedí, a `b` tvaru `(out,)` se broadcastuje přes dávku.

Rozepiš to a vypiš tvar a zaokrouhlený výsledek.

```
output: (2, 2) [[1.0, 2.0], [3.0, 6.0]]
```
'''
hints = [
  "x @ W.t() + b — transpozice je to, co nechá vnitřní rozměry potkat se.",
  "x @ W by tady taky proběhlo, protože matice je čtvercová, a spočítá to špatnou věc.",
]

