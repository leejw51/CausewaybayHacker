[[quest]]
id    = "pytorch.basic.03.normalise"
title = "Měřítko, na kterém se nikdo nedohodl"
story = "Jeden příznak se měří ve stupních a další ve wattech. Model tráví každý krok tréninku tím, že se učí, že watty jsou větší."
brief = '''
Standardizovat příznak znamená odečíst jeho průměr a vydělit jeho směrodatnou odchylkou, takže každý sloupec vyjde vycentrovaný na nulu s rozptylem jedna.

Průměr přes `dim=0` je jedno číslo na sloupec — tvar `(features,)` — a jeho odečtení od `(batch, features)` se broadcastuje dolů přes řádky. Totéž pro směrodatnou odchylku.

Nakonec vypiš zaokrouhlené průměry sloupců; z principu jsou nulové.

```
input: 1 10 2 20 3 30
output: [0.0, 0.0] [1.0, 1.0]
```
'''
hints = [
  "(x - x.mean(dim=0)) / x.std(dim=0) — dim=0 sbalí řádky a nechá jedno číslo na sloupec.",
  "Bez dim=0 dostaneš průměr celého tenzoru, který oba příznaky smíchá dohromady.",
]

