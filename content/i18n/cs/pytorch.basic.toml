[[quest]]
id    = "pytorch.basic.27.xor"
title = "Přímka"
story = "Čtyři body, dvě třídy a model, který se trénoval hodinu a pořád dva ze čtyř plete. Žádné množství tréninku to nespraví; žádná přímka je neoddělí."
brief = '''
XOR je nejstarší důkaz v oboru, že hloubka není ozdoba. `(0,0)` a `(1,1)` jsou jedna třída; `(0,1)` a `(1,0)` jsou ta druhá, a žádná přímka ty dvě dvojice nedá na opačné strany. Jediný `Linear` to nedokáže při žádné rychlosti učení, za žádný počet kroků.

Skrytá vrstva s nelinearitou mezi to dokáže, a to je celá síť ze suterénu v jednom uzlu: postav `2 → 8 → 1` s ohybem uprostřed.

Trénovací smyčka je napsaná. Postav model a vypiš jeho čtyři predikce při prahu 0.5.

```
output: [0, 1, 1, 0] True
```
'''
hints = [
  "nn.Sequential(nn.Linear(2, 8), nn.Tanh(), nn.Linear(8, 1)) — dva dovnitř, osm skrytých, jeden ven.",
  "Bez aktivace se ty dva Lineary slijí v jeden a dva ze čtyř zůstanou špatně navždy.",
  "Tanh je na tak malém problému hladší než ReLU a malá vrstva s ReLU může začít mrtvá a už se nevzpamatovat.",
]
