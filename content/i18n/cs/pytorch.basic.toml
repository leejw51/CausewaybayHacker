# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.basic.01.night-shift"
title = "Noční směna"
story = "23:00 ve strojovně. Z konzole přijde řádek měření jako text a každý nástroj o patro níž chce tenzor."
brief = '''
Na standardní vstup přijde jeden řádek čísel oddělených mezerami. Udělej z něj **float** tenzor a vypiš jeho tvar jako n-tici a jeho součet.

`input().split()` dá seznam řetězců; `float(t)` převede jeden z nich. List comprehension nad těmi dvěma je celý převod a `torch.tensor` ten seznam vezme.

Součet se vypíše přes `.item()`, které vytáhne pythonové číslo z 0-rozměrného tenzoru, zaokrouhlené na čtyři místa, aby periodické desetinné číslo nemohlo nesouhlasit samo se sebou.

```
input: 1 2 3 4
output: (4,) 10.0
```
'''
hints = [
  "torch.tensor([float(t) for t in input().split()]) — rozdělit, převést, zabalit.",
  "Jednorozměrný tvar se vypíše s čárkou na konci: (4,), ne (4).",
]

