    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result { write!(f, "app: {}", self.0) }
}
impl std::error::Error for AppError {}
```

To jsou jeho jediné impl bloky — `AppError` **nemá** žádné konverze `From`.
Uvnitř `main` se `?` používá na `ParseIntError` **a** na `AppError`.
Která signatura `main` nechá zkompilovat obojí?
'''
hints = [
  "Dva různé typy chyb přes jedno `?` potřebují návratový typ, na který jdou převést oba: trait object, a to takový, který má velikost — takže sedí za ukazatelem.",
]

