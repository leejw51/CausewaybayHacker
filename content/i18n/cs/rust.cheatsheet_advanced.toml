  "Výpůjčka Optionu dá Option s referencí na `String`, ne na `str`; jedna metoda si vnitřek půjčí a dereferencuje v jediném kroku. Map podle hodnoty přesune String a klon je dočasná hodnota, která zanikne na konci řádku.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "rust.cheatsheet_advanced.32.ok-or-else"
title = "JEN KDYŽ JE PRÁZDNO"
story = "Skříňky ve stanici MTR Causeway Bay zapíšou auditní řádek za každou prázdnou přihrádku, kterou hlásí — a Alex říká, že plná přihrádka nesmí zapsat žádný."
brief = '''
`slot: Option<u32>`. `audit(tag: &str) -> String` zapíše řádek do auditního
logu stanice **při každém zavolání** a vrátí text chyby. `r` je `Ok(n)` pro
`Some(n)` a `Err` s auditním textem pro `None` — a plná přihrádka musí log
nechat beze změny.

```
let r: Result<u32, String> = ____;
```

Který výraz vyplní mezeru?
'''
hints = [
  "Převod Optionu na Result potřebuje chybovou hodnotu a argument se vyhodnotí před voláním, i když se nikdy nepoužije — takže vedlejší efekt v něm proběhne pokaždé. Předejte místo toho něco k zavolání, ne hodnotu, a ne closure tam, kam patří hodnota.",
]

# ---------------------------------------------------------------- 33
