id    = "rust.cheatsheet_advanced.06.from-for-question-mark"
title = "PŘEVODNÍK"
story = "Pokladna na Jardine's Bazaar hlásí selhání parsování vlastními slovy; účetní kniha ho chce ve svém enumu, bez `map_err` na každém řádku."
brief = '''
`enum AppError { Parse(ParseIntError), Neg }`. Funkce níže se musí
zkompilovat přesně tak, jak je napsaná — konverzi dělá `?`:

```
