[[quest]]
id    = "rust.cheatsheet_advanced.30.dijkstra-pop"
title = "NEJMENŠÍ VZDÁLENOST VEN"
story = "Dijkstra přes síť ulic Causeway Bay: halda drží (vzdálenost, uzel) zabalené tak, aby nejbližší vyšel první, a smyčka musí rozbalit obojí."
brief = '''
`heap: BinaryHeap<Reverse<(u64, usize)>>` drží dvojice `(distance, node)`
tak, aby jako první vyšla **nejmenší vzdálenost**. Napiš hlavičku smyčky,
která odebírá, dokud halda není prázdná, a váže `d` a `u`:

```
heap.push(Reverse((0u64, 0usize)));
// ____
    if d > dist[u] { continue; }
    for &(v, w) in &adj[u] { /* relax */ }
}
```
'''
hints = [
  "Pop dává Option; uvnitř je obal a uvnitř obalu je n-tice — tři vrstvy, a obal má přesně jednu položku.",
]
