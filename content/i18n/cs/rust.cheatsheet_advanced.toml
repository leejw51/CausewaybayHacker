id    = "rust.cheatsheet_advanced.05.box-dyn-error"
title = "DVA DRUHY POTÍŽÍ"
story = "Platební cesta u Gloucester Road může selhat v parseru nebo v účetní knize a `main` musí spolknout obojí jedním `?`."
brief = '''
`AppError` je vlastní chyba:

```
