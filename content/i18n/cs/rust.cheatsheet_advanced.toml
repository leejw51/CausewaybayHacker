# ---------------------------------------------------------------- 37
[[quest]]
id    = "rust.cheatsheet_advanced.37.transpose"
title = "NEPOVINNÉ, ALE NE ŠPATNĚ"
story = "Políčko pro spropitné na účtence z Lockhart Road je nepovinné; když tam je, musí to být číslo, a nečitelné spropitné pošle účtenku zpátky."
