hints = [
  "Map parsování dá Option s Resultem uvnitř, ale `?` tady potřebuje Result venku — jedna metoda obě vrstvy prohodí. `?` uvnitř closure nemá kam jít a zahození chyby přes `ok()` ztratí přesně ten případ, který musí selhat.",
]

