Uvnitř `fn tip(raw: Option<&str>) -> Result<Option<u32>, ParseIntError>`.
`n` je `None`, když je `raw` `None`, a `Some(t)`, když se dá parsovat — a
špatné číslo způsobí, že `tip` tu chybu vrátí.

