id    = "rust.cheatsheet_advanced.27.take-n-messages"
title = "PŘESNĚ ČTYŘI, BEZ ZASEKNUTÍ"
story = "Čtyři kurýři na Lockhart Road každý vysílačkou ohlásí jedno číslo; dispečerka si nechává vlastní vysílačku zapnutou a přesto musí po čtyřech přestat poslouchat."
brief = '''
`n: usize = 4`. Čtyři vlákna dostala každé `tx.clone()` a každé po nějaké
práci pošle **jedno** `u64`. Původní `tx` se **nezahazuje** a `main`
si ho nechává. `r` drží všechny čtyři zprávy a `main` se nesmí
zaseknout.

```
let (tx, rx) = mpsc::channel::<u64>();
for id in 0..n as u64 {
    let tx = tx.clone();
    thread::spawn(move || { work(); tx.send(id * id).unwrap() });
}
// ____
```
'''
hints = [
  "Blokující iterátor přes přijímač končí, až když je pryč každý odesílatel; s jedním stále v `main` ho zastav počtem. Neblokující iterátor vrátí, co zatím dorazilo — třeba nic.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "rust.cheatsheet_advanced.28.global-counter"
title = "JEDNO ČÍSLO PRO CELOU BUDOVU"
story = "Jediné počítadlo vstupů pro celý Times Square, navyšované ze všech dveří naráz, a radši ať to není čerstvá kopie v každé ruce."
brief = '''
Počítadlo pro celý program, sdílené všemi vlákny, nikde žádné `unsafe`.
`fn hit() { HITS.fetch_add(1, Ordering::Relaxed); }` se volá 1000krát
z každého ze čtyř vláken a po jejich joinu musí
`HITS.load(Ordering::Relaxed)` být `4000`.

Která deklarace `HITS` na úrovni modulu to dělá?
'''
hints = [
  "Jedna z chybných variant se zkompiluje a vypíše 0: `const` se při každém použití vloží jako čerstvá hodnota, takže každé `fetch_add` navyšuje kopii. To jedno místo v paměti potřebuje druhé klíčové slovo pro položku — a jeho měnitelná podoba je na dotek `unsafe`.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "rust.cheatsheet_advanced.29.take-the-batch"
title = "PŘEDAT VŠECHNO"
story = "Šéfkuchař Bo předá celou lištu s lístky běžci a nechá si prázdnou lištu — žádné kopírování lístků a lišta zůstává jeho."
brief = '''
`Batch { items: Vec<String> }`. `flush(&mut self) -> Vec<String>` vrátí
všechno z `items` a nechá `self.items` **prázdný**, bez klonování.

```
fn flush(&mut self) -> Vec<String> {
    // ____
}
```
'''
hints = [
  "Položku nelze přesunout ven zpoza `&mut self`, ale `std::mem` umí položku vyměnit za její výchozí hodnotu a dát ti tu starou — přes měnitelnou referenci na položku.",
]

