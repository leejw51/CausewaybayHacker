```

Který výraz vyplní mezeru?
'''
hints = [
  "Verze s jedním voláním bere dvě closure a stejně jako její dychtivý bratranec má náhradní větev na prvním místě. Na Resultu dostane ta náhradní větev chybu, takže bere jeden argument — a prohozená dvojice se tu taky přeloží, jen vytiskne špatný řádek.",
]

