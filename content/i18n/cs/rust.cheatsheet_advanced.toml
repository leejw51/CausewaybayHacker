    let n: i32 = s.trim().parse()?;
    if n < 0 { return Err(AppError::Neg); }
    Ok(n)
}
```

Která hlavička impl bloku, s `fn from(e: ParseIntError) -> Self { AppError::Parse(e) }`
uvnitř, to zařídí?
'''
hints = [
  "`?` volá na převod chyby jeden konkrétní trait a ten se implementuje na cílovém typu, pro zdrojový typ — ne naopak, a ne jeho zrcadlový bratránek.",
]

