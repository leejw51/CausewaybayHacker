id    = "rust.cheatsheet_advanced.31.as-deref"
title = "JMÉNO JEN PŮJČENÉ"
story = "Mei si v cha chaan teng vede na účtu jméno štamgasta jako `Option<String>`; tiskárna účtenek chce `&str` a účet si jméno nechává."
