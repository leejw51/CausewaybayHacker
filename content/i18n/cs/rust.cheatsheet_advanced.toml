# ---------------------------------------------------------------- 39
[[quest]]
id    = "rust.cheatsheet_advanced.39.collect-result-try"
title = "PRVNÍ ŠPATNÝ LÍSTEK VEN"
story = "Alex sčítá pořadové lístky u Soga uvnitř funkce, která může selhat; jeden rozmazaný lístek a funkce předá chybu rovnou nahoru."
