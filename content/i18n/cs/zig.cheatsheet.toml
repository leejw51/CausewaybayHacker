# ZIG LAND — CHEATSHEET, in Czech. A translation pack (SPEC §12.1): the prose
# of `content/zig/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks and identifiers are copied verbatim.

pack   = "zig.cheatsheet"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet.01.print"
title = "TABULE S MÝTNÝM"
story = "06:00 u vjezdu do tunelu pod přístavem v Causeway Bay. Tabule nad budkou 1 ukáže mýtné, jen když ho tam někdo zapíše."
brief = '''
`w` je bufferovaný writer nad stdout. Vypište `n` v desítkové soustavě a pak
nový řádek.

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

Který řádek to je?
'''
hints = [
  "Argumenty patří do n-tice `.{ ... }` a print může selhat, takže před ním je `try`.",
]

