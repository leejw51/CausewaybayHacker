[[quest]]
id    = "zig.cheatsheet.02.parse-int"
title = "MINCE NA ČÍSLA"
story = "Tácek na mince v budce 2 počítá v textu. Pokladna chce celé číslo."
brief = '''
`tok` je `[]const u8` s obsahem `"42"`. Udělejte z něj `n` typu `i64` v
