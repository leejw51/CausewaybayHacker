]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.cheatsheet.12.errdefer"
title = "JEN PŘI SELHÁNÍ"
story = "Závora u ústí tunelu pustí auto, když mýtné projde, a vezme lístek zpět, když ne."
brief = '''
Uvolněte `buf`, když `fill` selže, ale při úspěchu ho nedotčený předejte
volajícímu.

```
fn load(gpa: std.mem.Allocator, n: usize) ![]u8 {
    const buf = try gpa.alloc(u8, n);
    // ____
    try fill(buf);
    return buf;
}
```
'''
hints = [
  "Obyčejný `defer` proběhne při každém odchodu, i při úspěchu. Existuje tvar, který proběhne jen při návratu s chybou.",
]

