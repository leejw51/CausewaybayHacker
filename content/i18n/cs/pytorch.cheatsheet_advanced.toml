[[quest]]
id    = "pytorch.cheatsheet_advanced.30.multihead-attention"
title = "MASKA, KTERÁ ZNAMENÁ OPAK"
story = "Poslední blok ve sklepě je attention modul přímo z knihovny a jeho booleovská maska čte True jako zakázáno. Mei kontroluje znaménko dvakrát."
brief = '''
```
attn = nn.MultiheadAttention(embed_dim=64, num_heads=4, batch_first=True)
causal = torch.triu(torch.ones(T, T, dtype=torch.bool), diagonal=1)
```

`x` má tvar `(B, T, 64)`. V tomhle modulu je booleovský `attn_mask`
`True` tam, kde je attention **zakázaný**, a `causal` je `True` přísně
nad diagonálou. Který řádek dá `out`, výstup self-attention tvaru
`(B, T, 64)`, ve kterém žádný token nečte dopředu?
'''
hints = [
  "Modul chce query, key a value jako tři poziční tenzory a vrací dvojici — rozbal ji. Maska se předá přesně tak, jak je postavená, protože True tady už znamená zablokováno; její invertování nechá každý token číst jen budoucnost.",
]
