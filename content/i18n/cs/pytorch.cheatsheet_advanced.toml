]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "pytorch.cheatsheet_advanced.29.checkpoint"
title = "TEĎ ZAPOMENOUT, POZDĚJI DOPOČÍTAT"
story = "Čtrnáct tisíc parametrů se na notebook vejde; aktivace každého bloku ne. Vyměň výpočet za paměť, blok po bloku."
brief = '''
```
from torch.utils.checkpoint import checkpoint

def forward(self, h):
    for block in self.blocks:
        # ____
    return h
```

Doplň mezeru tak, aby se aktivace každého bloku v dopředném průchodu
**neukládaly**, ale dopočítaly během backwardu — **nereentrantní**
varianta.
'''
hints = [
  "Funkce checkpoint bere volatelný objekt a jeho vstupy jako oddělené argumenty a zavolá ho za tebe. Předání výstupu bloku znamená, že forward už proběhl, a modul není volatelný.",
]

