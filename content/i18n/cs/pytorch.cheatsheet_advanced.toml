        loss = loss_fn(model(xb), yb)
    # ____
```

Smíšená přesnost ve `float16` na CUDA. Doplň mezeru třemi voláními jednoho
tréninkového kroku tak, aby backward běžel na ztrátě, kterou scaler zvětšil,
optimalizátor **nikdy nepoužil stále naškálované gradienty** (a krok, jehož
