id    = "pytorch.cheatsheet_advanced.26.masked-fill"
title = "MÍNUS NEKONEČNO PRO BUDOUCNOST"
story = "Blok ve sklepě nesmí číst dopředu. Každé skóre nad diagonálou jde na mínus nekonečno, než ho uvidí softmax."
brief = '''
`scores` má tvar `(B, T, T)` a `mask = torch.tril(torch.ones(T, T))`
— **float** tenzor, `1.` kde je attention dovolený, `0.` nad diagonálou.
Který řádek nahradí každé zakázané skóre mínus nekonečnem, aby softmax,
který následuje, dal těm pozicím nulovou váhu?
'''
hints = [
  "Výplň chce booleovskou masku, která je True tam, kde má být díra — porovnej float masku, abys ji dostal — a pythonovský float pro mínus nekonečno. `where` na tenzoru ponechá hodnoty tam, kde je jeho podmínka True.",
]

