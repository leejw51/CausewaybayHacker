tomto kroku.
'''
hints = [
  "Všechna tři volání jdou přes scaler. Přímé krokování optimalizátoru nechá gradienty naškálované; scaler odmítne krokovat ztrátu, kterou nikdy neškáloval, a odmítne aktualizovat, dokud nekrokoval.",
]

