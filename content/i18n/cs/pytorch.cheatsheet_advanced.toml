id    = "pytorch.cheatsheet_advanced.16.grad-scaler"
title = "ŠKÁLOVAT, KROK, AKTUALIZOVAT"
story = "Poloviční přesnost na kartě v racku 3: malé gradienty podtečou, pokud se ztráta napřed nenafoukne a krok o tom neví."
brief = '''
```
scaler = torch.amp.GradScaler("cuda")
for xb, yb in loader:
    opt.zero_grad(set_to_none=True)
