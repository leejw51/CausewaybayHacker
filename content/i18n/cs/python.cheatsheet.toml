[[quest]]
id    = "python.cheatsheet.19.ripples"
title = "VLNKY"
story = "Déšť se valí z Victoria Parku blok po bloku; voda dorazí do blízkých ulic dřív než do vzdálených a mapa musí říct, kolik bloků to každé trvalo."
brief = '''
BFS v mřížce: `dist` musí obsahovat **nejkratší** počet kroků od
`(sr, sc)`, takže buňky se musí vybírat v pořadí, v jakém přišly, v
O(1). Který řádek patří do mezery?

```
q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
hints = [
  "Deque odebírá z obou konců v O(1); který konec vezmete, rozhoduje, zda je to fronta, nebo zásobník.",
]

