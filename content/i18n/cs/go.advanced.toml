[[quest]]
id    = "go.advanced.14.json"
title = "Tag je smlouva"
story = "API depa posílá klíče malými písmeny a Go exportuje pole velkými, a týden nikdo neviděl, proč je každá objednávka prázdná."
brief = '''
Na standardním vstupu je jeden řádek: JSON pole objednávek, každá s řetězcem
`item` a číslem `cents`.

Rozbal ho pomocí Unmarshal, vypiš jeden řádek na objednávku jako
`<ITEM> <CENTS>`, pak zabal pomocí Marshal a vypiš souhrnný objekt přesně
s klíči `count` a `total`, v tomto pořadí. Pokud vstup není platný JSON,
vypiš `BAD JSON` a nic jiného.

```
input:  [{"item":"SET","cents":2800},{"item":"PIE","cents":900}]
output: SET 2800
        PIE 900
        {"count":2,"total":3700}
```

Aby `encoding/json` pole vůbec vidělo, musí být **exportované** — pole
s malým písmenem je pro marshaller neviditelné, a to potichu. Tag struktury
pak říká, jak se jmenuje na drátě. `Marshal` zapisuje pole v pořadí
deklarace, takže pořadí klíčů souhrnu určuješ ty, ne mapa.
'''
hints = [
  "Tag jde do zpětných apostrofů za typ: Item string `json:\"item\"`.",
  "Unmarshal bere ukazatel na cíl — &orders, ne orders — jinak nemá co vyplnit.",
  "Zkontroluj chybu z Unmarshal. Při špatném vstupu zůstane orders prázdné a program, který chybu ignoruje, vesele vypíše nulový souhrn.",
]

