[[quest]]
id    = "go.advanced.08.closures"
title = "Počítadlo u dveří"
story = "Lucky Mac počítá, kdo vejde a kdo odejde, a vedoucí chce při zavírání číslo, ať se mezitím stane cokoli."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků, každý `IN` nebo `OUT`.

Veď průběžný počet, který nikdy neklesne pod nulu. Po každém příkazu ho vypiš.
Když se `main` vrací, vypiš `CLOSED <final>` — z `defer`, ne z konce funkce.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        CLOSED 2
```

Samotné počítadlo je uzávěr: funkce, která vrací funkci, se součtem zachyceným
mezi nimi. V řešení není žádná proměnná na úrovni balíčku.
'''
hints = [
  "total žije v rámci makeCounter a vrácená funkce ho drží naživu. To je ten uzávěr.",
  "defer func(){ ... }() se spustí při návratu a uzávěr čte `last` až tehdy — ne ve chvíli, kdy byl defer zapsán.",
  "defer, který by bral argument, by hodnotu zachytil ve chvíli deferu. Zkus obojí a sleduj, jak se to změní.",
]

