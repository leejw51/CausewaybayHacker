# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.advanced.10.defer-panic-recover"
title = "Spadlo to a zase vstalo"
story = "Jeden špatný lístek dřív shodil celou pokladnu a s ní i celou směnu."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků. Každý je celé číslo, slovo
`BOOM`, nebo něco jiného.

Napiš `run(text string) (out string)`, která vrátí dvojnásobek hodnoty, nebo
`BAD <text>`, pokud se nedá naparsovat — a při `BOOM` **zpanikaří**, přičemž
se v odložené funkci zotaví, takže volající dostane `RECOVERED boom` místo
mrtvého programu. Vypiš jeden řádek na každý vstup a na konci, z `defer`
v `main`, vypiš `CLOSED <n>`.

```
input:  4
        21
        BOOM
        xx
        -4
output: 42
        RECOVERED boom
        BAD xx
        -8
        CLOSED 4
```

Tři fakta, a všechna tři jsou ta otázka: `recover` dělá něco jen uvnitř
odložené funkce; **pojmenovaná** návratová hodnota je to, co odložené funkci
dovolí změnit, co se po panice vrátí; a `defer` v `main` se spustí při
návratu, takže `CLOSED` je poslední, ať smyčka dopadla jakkoli.
'''
hints = [
  "Návratová hodnota musí být pojmenovaná — out string — jinak odložená funkce nemá do čeho přiřadit.",
  "recover() vrací nil, když žádná panika nebyla, takže if je způsob, jak ty dvě cesty rozlišit.",
  "Odložený uzávěr v main čte `done` ve chvíli, kdy běží, ne kdy byl zapsán, takže vidí konečný počet.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.advanced.11.zero-values"
title = "Nic není nic"
story = "Mapa rozpisu směn nikdy nevznikla a kód z ní celé dopoledne četl, aniž si jednou postěžoval."
brief = '''
Na standardním vstupu je počet `n` a pak `n` slov.

Vypiš čtyři řádky, v tomto pořadí:

1. `READ <v>` — co ti **nil** mapa dá pro klíč, který nemá
2. `LEN <k>` — délku po přidání všech `n` slov do **nil** slice
3. `WRITE <ok|panic>` — jestli přiřazení do té nil mapy zpanikařilo
   (zotav se z toho; nenech program umřít)
4. `FOUND <k>` — kolik ze slov je klíčem *inicializované* mapy naplněné
   hodnotami `a` a `b`

```
input:  3
        a b c
output: READ 0
        LEN 3
        WRITE panic
        FOUND 2
```

Nil mapa a nil slice nejsou stejný druh ničeho. Číst z nil mapy je legální
a dává nulovou hodnotu typu hodnoty; zápis do ní zpanikaří, protože není
žádná tabulka, do které by se zapisovalo. `append` do nil slice je legální
a alokuje — proto je `var s []T` idiomatický prázdný slice a `var m map[K]V`
idiomatická prázdná mapa není.
'''
hints = [
  "empty[\"missing\"] na nil mapě není chyba — je to nulová hodnota int, tedy 0.",
  "append si s nil slicem poradí: první podkladové pole alokuje za tebe, a proto nikdy nepotřebuješ make() jen kvůli začátku.",
  "Zápis se musí odehrát uvnitř funkce s odloženým recover, jinak panika ukončí program dřív než čtvrtý řádek.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.advanced.12.embedding"
title = "Nezdědilo nic"
story = "Konečná je zastávka s něčím navíc. Alex ji napsal dvakrát, což je jednou moc."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků, každý `STOP <NAME>` nebo
`TERM <NAME> <LINES>`.

Dej `Stop` metodu `Describe() string`, která vrací jeho jméno. Nech `Terminus`
**vnořit** `Stop` a přidat `Lines int`, a dej mu vlastní `Describe`, která
zavolá tu vnořenou a přidá `(<lines> lines)`.

Vypiš `Describe()` každého z nich, pak `TERMINI <k>` spočítané typovým
switchem nad `[]Describer`.

```
input:  3
        STOP CAUSEWAY
        TERM KENNEDY 2
        STOP TINHAU
output: CAUSEWAY
        KENNEDY (2 lines)
        TINHAU
        TERMINI 1
```

Vnoření není dědičnost. `Terminus` se *nestane* `Stop`; obsahuje ho, a metody
obsažené hodnoty jsou **povýšeny** na vnější typ, pokud si vnější typ
nedeklaruje vlastní. `t.Stop.Describe()` je způsob, jak se dostat k té, kterou
jsi zastínil, a žádné `super` neexistuje.
'''
hints = [
  "Vnořené pole nemá vlastní jméno — píše se `Stop` uvnitř literálu i v t.Stop.Describe().",
  "Terminus splňuje Describer díky vlastní Describe; bez ní by ho splňoval přes povýšenou metodu Stop.",
  "d.(Terminus) s tvarem comma-ok je typová aserce; typový switch dělá tutéž práci, když jsou možnosti víc než dvě.",
]

