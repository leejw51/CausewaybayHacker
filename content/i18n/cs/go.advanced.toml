        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

Na tabulku nesahej; je to specifikace. Tohle **je** tabulkový test v Go, jen
bez harnessu: ve skutečném balíčku je to `func TestFare(t *testing.T)`
s `for _, c := range cases` a `t.Run(c.name, ...)` a spouští ho `go test`.
Tabulka je v obou případech stejná.
'''
hints = [
  "Tabulka je specifikace. Funkce je to, co je špatně.",
  "Tři ze čtyř případů selžou a ten, který projde, je km = 0, což je přesně důvod, proč jeden testovací případ nic nedokazuje.",
  "V balíčku je to func TestFare(t *testing.T) s t.Run(c.name, func(t *testing.T){ ... }), aby se selhání samo pojmenovalo.",
]

