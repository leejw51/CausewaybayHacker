# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.advanced.01.control-flow"
title = "Tramvaj, nebo metro"
story = "Tabule ve vestibulu Causeway Bay má hlásit, který spoj právě jede. Místo toho každou minutu hlásí číslo minuty."
brief = '''
Načti jedno celé číslo `n`. Pro každé `i` od `1` do `n` vypiš jeden řádek:

* `TRAMMTR`, pokud je `i` dělitelné třemi i pěti
* `TRAM`, pokud je `i` dělitelné třemi
* `MTR`, pokud je `i` dělitelné pěti
* jinak samotné `i`

```
input:  5
output: 1
        2
        TRAM
        4
        MTR
```

`switch` bez výrazu bere v Go v každé větvi jednu booleovskou podmínku a
nepropadává dál. Použij ho.
'''
hints = [
  "Nejdřív otestuj případ „obojí“, jinak nikdy nenastane.",
  "switch { case cond: } nepotřebuje výraz a nepotřebuje break.",
  "Dělitelné třemi a pěti je totéž co dělitelné patnácti.",
]

