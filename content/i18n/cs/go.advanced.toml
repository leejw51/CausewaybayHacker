   příjem je to, co zápis zviditelní. Zapiš `42`.
2. `ONCE <k>` — `n` gorutin volá jeden `sync.Once`; `k` je, kolikrát funkce
   skutečně běžela.
3. `MUTEX <k>` — `n` gorutin inkrementuje počítadlo pod `sync.Mutex`.
4. `WG <k>` — `n` gorutin zapíše každá do vlastního slotu slice a `wg.Wait()`
   je to, co všech `n` zápisů zviditelní čtenáři.

```
input:  4
output: CHAN 42
        ONCE 1
        MUTEX 4
        WG 4
```

Každá z těchto věcí je hrana *happens-before* a jsou to jediné čtyři tvary,
které potřebuješ: odeslání se stane před dokončením odpovídajícího příjmu;
`Once.Do` se vrátí až po skončení toho jednoho volání; odemknutí se stane
před dalším zamknutím; `wg.Wait` se vrátí až po odpovídajících voláních
`Done`.

Nic tady není bezpečné díky načasování. Odeber kteroukoli hranu a `-race` ji
najde, na stroji, který ani jednou nevyprodukoval špatné číslo.
'''
hints = [
  "close(ready) a pak <-ready je nejlevnější publikační hrana v Go a nese každý zápis, který gorutina před ním udělala.",
  "runs++ uvnitř once.Do nepotřebuje vlastní zámek — Once už zaručuje, že se stane přesně jednou a dřív, než se vrátí kterékoli jiné Do.",
  "Každá gorutina vlastní jeden slot, takže žádné dvě nikdy nesáhnou na stejnou paměť; jediná potřebná hrana je Wait před čtením všech.",
]

