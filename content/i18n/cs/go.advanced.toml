id    = "go.advanced.15.testing"
title = "Dokaž si to sám"
story = "V 06:40 ti tohle nikdo nezkontroluje. Tabulka je přímo tady; rozsviť ji zeleně."
brief = '''
Program drží tabulku čtyř známých správných dvojic `(km, fare)` a ověřuje
