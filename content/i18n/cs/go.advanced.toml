[[quest]]
id    = "go.advanced.07.errors"
title = "Řádek, který není číslo"
story = "Výpis jezdců se vrací z depa a uprostřed sloupce má něčí objednávku oběda."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků. Každý řádek má být celé
číslo.

Pro každý řádek vypiš buď dvojnásobek hodnoty, nebo `BAD <line>`, pokud se
nedá naparsovat. Nakonec vypiš `SUM <total>`, součet hodnot, které jsi
vypsal.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Definuj sentinelovou chybu `var ErrNotANumber = errors.New(...)`, obal ji
pomocí `fmt.Errorf("...: %w", ErrNotANumber)` a v `main` ji rozpoznej pomocí
`errors.Is`. Chyba je hodnota; tohle je to, co ti to přináší.
'''
hints = [
  "strconv.ParseInt(s, 10, 64) vrací (int64, error) — na druhou hodnotu se podívat není nepovinné.",
  "%w ve fmt.Errorf nechá obalenou chybu dohledatelnou; %v by ji zploštilo na text.",
  "errors.Is prochází řetěz obalení, takže shoda platí i po tom, co byla zpráva doplněna.",
]

