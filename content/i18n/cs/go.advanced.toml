[[quest]]
id    = "go.advanced.13.variadics"
title = "Kolik jich máš"
story = "Někdy jsou to dvě objednávky a někdy celý stojan, a funkci to nemá zajímat."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Napiš `total(values ...int64) (sum int64, count int)` — variadickou,
s pojmenovanými návratovými hodnotami — a zavolej ji třemi způsoby. Vypiš:

1. `ALL <sum> <count>` — celý slice, rozbalený pomocí `...`
2. `NONE <sum> <count>` — volání úplně bez argumentů
3. `TWO <sum> <count>` — první dvě hodnoty předané jednotlivě, nebo tolik,
   kolik jich je

```
input:  4
        1 2 3 4
output: ALL 10 4
        NONE 0 0
        TWO 3 2
```

Uvnitř funkce je `values` obyčejný `[]int64`, a bez argumentů je `nil` —
s čímž si `range` i `len` poradí bez zvláštního případu. `total(list...)`
předá existující slice, místo aby ho kopíroval do nového; `total(list)` by se
nezkompilovalo, a vědět proč je ta otázka.
'''
hints = [
  "Holý `return` s pojmenovanými výsledky vrátí to, co sum a count právě drží.",
  "total(list...) rozbaluje; total(list) se pokusí předat []int64 jako jediný int64 a nezkompiluje se.",
  "Bez argumentů je values nil a len(nil slice) je 0 — žádnou pojistku nepotřebuješ.",
]

