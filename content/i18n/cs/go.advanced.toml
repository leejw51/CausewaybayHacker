Omezení je rozhraní použité na místě typového parametru a může nést dvě věci,
které obyčejné rozhraní nemůže: **množinu typů** (`~string` odpovídá
jakémukoli typu, jehož podkladový typ je `string`) a předdeklarované
`comparable`.

Rozdíl oproti **parametru** typu `interface{ Name() string }` stojí za to
říct nahlas: `Names[T Named]` je monomorfizovaná a volání je statické
a nepotřebuje žádné balení. `func Names(xs []Named)` by potřebovala jiný
