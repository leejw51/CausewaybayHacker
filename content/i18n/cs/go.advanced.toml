id    = "go.advanced.09.generics"
title = "Jedna funkce, jakýkoli seznam"
story = "Alex napsal Sum čtyřikrát — pro objednávky, pro jezdce, pro minuty a pro centy — a pátá je na řadě."
brief = '''
Na standardním vstupu je jeden řádek celých čísel oddělených mezerami.

Vypiš tři řádky:

1. každou hodnotu zdvojenou, spojené jednotlivými mezerami
2. součet původních hodnot
3. kolik z nich je větších než `10`

```
input:  1 2 3 4 12
output: 2 4 6 8 24
        22
        1
```

Napiš tři generické pomocné funkce a použij je: `MapSlice[T, U any]`,
`Sum[T Number]` nad omezením `~int64 | ~float64` a `Count[T any]`, která bere
