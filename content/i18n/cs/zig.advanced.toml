[[quest]]
id    = "zig.advanced.21.counter"
title = "Počítadlo, které se zamyká samo"
story = "Počítadlo náprav u budky 3 drží dvě čísla, která spolu musí souhlasit, a dva lidé je čtou ve stejnou chvíli."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Dokonči `Counter`: `add` vezme zámek, přičte k součtu a zvedne
počet zásahů; `snapshot` vezme zámek a vrátí obojí zároveň. Spusť jedno
vlákno na hodnotu, počkej na ně přes join, pak vypiš `TOTAL <sum>` a `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

Mutex žije **uvnitř** struktury, vedle polí, která hlídá, a
každá funkce, která na ně sahá, ho bere. To je ten tvar: zámek je
součástí objektu, ne něčím, co si mají pamatovat volající.

Startovní kód se nepřeloží a ten důvod stojí za minutu. `snapshot`
bere `self: Counter` — hodnotou, tak jak se metoda, která jen čte,
obvykle píše — a zamčení mutexu *mění mutex*, takže
`self.mutex.lockUncancelable(io)` chce `*std.Io.Mutex` a jediné, co může
dostat z `self` předaného hodnotou, je `*const`. Horší je, že `self` předaný hodnotou je
**kopie** počítadla: i kdyby se to přeložilo, zamkl by kopii
zámku, což nezamkne nic. Oprava je `self: *Counter`. Není tu žádné
klíčové slovo `mutable`, po kterém sáhnout, protože není žádná `const` metoda, kterou by šlo
obejít: metoda, která musí vzít zámek, to říká ve své signatuře, a
signatura je celý slib.
'''
hints = [
  "Chybu překladu opraví jeden znak: fn snapshot(self: *Counter, io: std.Io) Snapshot. counter.snapshot(io) se pořád čte stejně; Zig za tebe vezme adresu.",
  "self předaný hodnotou by byl kopií celého Counter, včetně mutexu. Zamčení kopie nechrání nic, a proto je odmítnutí překladače správná odpověď, a ne nepohodlí.",
  "Counter.add je obyčejná funkce, jejímž prvním parametrem je *Counter, takže std.Thread.spawn(.{}, Counter.add, .{ &counter, io, value }) je způsob, jak vlákno zavolá metodu.",
