# ZIG LAND — ADVANCED, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/zig/advanced.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "zig.advanced"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.advanced.01.lines"
title = "Kniha budky"
story = "Záznam směny budky 1 uvádí každé vozidlo jako jeden řádek: jméno, které úředník zaslechl, a pak cokoli, co zaplatilo, ať to vyjde na kolik mincí chce. Tiskárna je starší než tunel a pořád končí stránku slovem trajektové společnosti."
brief = '''
Na prvním řádku je počet `n`. Každý z dalších `n` řádků je jméno následované
žádným nebo více celými čísly, oddělenými mezerami.

Vypiš jeden řádek na vozidlo jako `<NAME> <how many numbers> <their sum>`, pak
`BOATS <n>` — řádek se součtem, kterým tiskárna mýtnice končí každou stránku
od dob, kdy patřila trajektové společnosti.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

Jednotkou je tu řádek, ne token. Jeden `std.mem.tokenizeAny` přes celý
vstup se zastaví na bílých znacích a o konce řádků se nestará, takže ti
neřekne, kde jedno vozidlo končí a další začíná. Napřed vstup rozřež
na řádky — `std.mem.splitScalar(u8, input, '\n')` ti dá iterátor,
jehož `next()` je `?[]const u8`, jeden řádek po druhém — a pak tokenizuj
**uvnitř** řádku.

Každý z těch řezů ukazuje do `input`. Nic se nekopíruje: řádek je okno
do bajtů, které už vlastníš, a proto musí `input` zůstat naživu,
dokud s nimi se všemi neskončíš, a proto je `defer gpa.free(input)`
poslední věc, která se spustí.
'''
hints = [
  "splitScalar na '\\n' ti dá jeden řádek na každé next(); tokenizeAny na tom řádku, s \" \\r\\t\" jako oddělovači, projde jeho tokeny a nic za jeho koncem.",
  "Jméno je první token, takže ho vezmi jedním fields.next() před smyčkou; while (fields.next()) |tok| pak vidí jen čísla.",
  "Řádek jen se jménem dá 0 0 bez zvláštního případu: smyčka while se prostě nikdy nespustí.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.advanced.02.pointers"
title = "Kopie není ta věc"
story = "Vedoucí budek zapisuje každou misku mincí do kopie listu a list na zdi za ní se nikdy nezmění."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Vlož každou hodnotu do jednoho `std.ArrayList(i64)` přes funkci `load`,
pak vypiš tři řádky: `LOADED <how many>`, `TOTAL <sum>` z funkce
`total`, která jen čte, a `FIRST <value>` — nebo `FIRST NONE`, když
nic není.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

Startovní kód se přeloží a vypíše `LOADED 0`. `load` bere seznam **hodnotou**
a parametr v Zigu je neměnný, takže startovní kód udělá to, co lidé
udělají pak: `var mine = sheet;` — kopii hlavičky seznamu — a
připojuje do ní. Kopie roste, kopie při návratu umře a list na
zdi zůstane netknutý.

Řekni, co myslíš, pomocí `*`: parametr typu `*std.ArrayList(i64)` je
adresa volajícího seznamu a `sheet.append(gpa, value)` přes něj přistane
ve volajícího seznamu. `total` má brát `[]const i64` — `.items` seznamu —
protože se potřebuje dívat a nepotřebuje sahat, a `const`
v typu je způsob, jak tě u toho překladač drží.

`FIRST` je volitelný ukazatel: `?*const i64` je buď adresa
prvního prvku, nebo `null`, a `null` je jediná hodnota, přes kterou tě Zig
nenechá číst, aniž by ses napřed zeptal — `if (first) |p|` je to ptaní. To je
celá tahle země v jednom řádku.
'''
hints = [
  "load opraví dva znaky: sheet: *std.ArrayList(i64) v signatuře a &sheet při volání. Volání metody přes ukazatel nepotřebuje šipku; sheet.append(gpa, v) je tentýž řádek.",
  "total má brát []const i64 a volat se se sheet.items — const je slib a překladač ho kontroluje.",
  "&sheet.items[0] je adresa prvního prvku a dává smysl, jen když nějaký je; if (first) |p| rozbalí volitelnou hodnotu a p.* je hodnota za ní.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.advanced.03.slices"
title = "Uprostřed fronty"
story = "Před šestou se u budky 4 nahromadilo čtyřicet vozidel. Vedoucí vidí přední nárazník a poslední koncové světlo a nic mezi nimi."
brief = '''
Standardní vstup je počet `n` na prvním řádku a pak `n` celých čísel na
druhém, oddělených mezerami. `n` je nejméně `1`.

Vypiš tři řádky: první hodnotu, poslední hodnotu a součet všeho
striktně mezi nimi. Při méně než třech hodnotách je ten součet `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Řez je ta posloupnost. `nums[0]` a `nums[nums.len - 1]` jsou konce;
`nums[1 .. nums.len - 1]` je prostředek, **nový řez** na tytéž bajty
bez jakékoli kopie, a `for` přes něj je součet. Řezání se kontroluje jako
indexování: `nums[1..0]`, což vyjde jako prostředek jednoprvkové fronty,
je `panic: start index 1 is larger than end index 0`, takže
podmínka na `nums.len` jde před řez, ne za něj.

Sčítej v `i64`. Jeden ze skrytých případů má prostředek, který se do
`i32` nevejde, a v `-O Debug` `i32`, který přeteče, nepřetočí — zpanikaří.
'''
hints = [
  "nums[1 .. nums.len - 1] je řez mezi konci; for přes něj ho sečte. Sdílí paměť s nums.",
  "S jednou nebo dvěma hodnotami je ten rozsah prázdný nebo obrácený a obrácený řez je v Debug panika — ohlídej ho pomocí if na nums.len dřív, než ho napíšeš.",
  "Prostředek je i64: široký případ sčítá dvě hodnoty po třech miliardách a akumulátor i32 by zpanikařil s integer overflow.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.advanced.04.strings"
title = "Bajty nejsou písmena"
story = "Cedule nad mýtnicí ořízne 銅鑼灣 na tři bajty a ukáže jeden znak."
brief = '''
Načti jeden řádek. Vypiš tři řádky:

1. jeho délku v **bajtech**
2. jeho délku ve **znacích** — kódových bodech UTF-8
3. řádek s obráceným pořadím znaků

```
input:  causeway
output: 8
        8
        yawesuac
```

Řádek může obsahovat znaky mimo ASCII a pak první dvě čísla
nejsou stejná. Řetězec v Zigu je `[]const u8`: řez bajtů, a
`.len` jsou bajty. Vždycky byly. Jazyk o kódováních na této úrovni
nic neví; `u8` je bajt.

UTF-8 se dá spočítat bez dekódování: každý kódový bod začíná
bajtem, který **není** tvaru `10xxxxxx`, a každý pokračovací bajt jím je.
Bajt `c` tedy začíná znak právě tehdy, když `(c & 0xC0) != 0x80`. Obracej
znaky, ne bajty — `std.mem.reverse(u8, line)` by rozsekal `銅`
na tři kusy a vypsal je pozpátku.
'''
hints = [
  "for (line, 0..) |c, i| projde bajty s jejich indexem; (c & 0xC0) != 0x80 vybere první bajt každého znaku.",
  "Posbírej počáteční index každého znaku do std.ArrayList(usize); jeho délka je počet znaků bez jakéhokoli dekódování.",
  "Projdi počáteční indexy pozpátku a appendSlice bajty každého znaku — line[from..to] — do std.ArrayList(u8), pak vypiš jeho .items pomocí {s}.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.advanced.05.structs"
title = "Kniha budky 2"
story = "Budka 2 účtuje každou nápravu a vede řádky na jednom formuláři knihy, nebo vedla, než návrh nahradil funkce struktury komentářem."
brief = '''
Na prvním řádku je `<NAME> <n>`. Dalších `n` řádků je `<ITEM> <CENTS>`.

Postav pro to jméno `Ledger`, který sbírá položky, pak vypiš každou položku
zpátky jako `<ITEM> <CENTS>` v pořadí, v jakém přišla, pak `TOTAL <sum>`, pak
`BOAT <name> <count>` — formulář knihy je trajektové společnosti a jeho pole
se jménem pořád říká `BOAT`.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` může být `0`, a pak jsou výstupem jen poslední dva řádky.

Zig nemá `class`; nejbližší je `struct` s funkcemi deklarovanými
uvnitř, a to je celé. Není žádný konstruktor, který běží
za tvými zády: `init` je obyčejná funkce, kterou napíšeš a která vrátí
hodnotu. Není žádné skryté `this`: `self` je první parametr, vypsaný —
`*Ledger`, když funkce do knihy zapisuje, `*const Ledger`, když
jen čte — a to je `const` na metodě, zviditelněné. Není ani
`private:`; pole je dosažitelné odkudkoli v souboru a to, co
drží `main` mimo `items`, je, že struktura nabízí `total()` a
`count()` a není důvod je obcházet.
'''
hints = [
  "std.ArrayList(Item) stačí; struktura je tu proto, aby kniha vlastnila své řádky. add je jedno append: self.items.append(gpa, .{ .name = name, .cents = cents }).",
  "self: *Ledger pro add, protože zapisuje; self: *const Ledger pro total a count, protože jen čtou. ledger.add(...) je tak či tak totéž volání — Zig za tebe vezme adresu.",
  "Jména položek jsou řezy input, takže plnění knihy nic nestojí a input ji musí přežít — což pořadí defer v main už zaručuje.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.advanced.06.tagged-union"
title = "Kdo je u volantu"
story = "Pruh autotoll účtuje každému štítku členskou sazbu, včetně těch, které členy nejsou, a toho, který štítkem není."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<TYPE> <HOURS>`.

Základní sazba je `500 + 100 * HOURS` centů. Pro každý řádek vypiš jedno z:

* `MEMBER` — základní sazbu
* `CREW` — polovinu základní sazby, celočíselným dělením
* `JUNIOR` — vždy `200`
* cokoli jiného — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

Vymodeluj štítek jako `union(enum)` se čtyřmi případy, jedním z nich `other`.
`enum class` v C++ nemůže nést data a nerozpoznaný text musel
cestovat vedle něj; tagovaný union v Zigu ho nese **uvnitř** případu:
`other: []const u8`, a ostatní tři případy nenesou vůbec nic. Případ
`union(enum)` se za tvými zády nepřevede na celé číslo a
nevypustí svá jména do okolního rozsahu, což jsou ty dva důvody,
proč `enum class` existoval.

Rozhodni o jízdném jedním `switch`. `switch` na tagovaném unionu musí pokrýt
každý případ — vynech jeden a nepřeloží se to, žádný přepínač varování není potřeba —
a `.other => |raw|` je způsob, jak data vyjdou z případu, ve kterém jsou.
'''
hints = [
  "other: []const u8 je čtvrtý případ a .{ .other = raw } ho postaví; tři případy void se staví jako .member, .crew, .junior.",
  "std.mem.eql(u8, raw, \"MEMBER\") porovná dva řezy; == na řezech porovnává ukazatele, což nikdy není, co myslíš.",
  "@divTrunc(base, 2) je vypsané celočíselné dělení; holé / na znaménkových celých číslech se nepřeloží, když by výsledek mohl být nepřesný.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.advanced.07.maps"
title = "Co křičí mýtnice"
story = "Mýtnice v 06:30: každá budka něco volá přes pruhy a vedoucí chce pořadí."
brief = '''
Načti celý standardní vstup a rozděl ho podle bílých znaků.

Vypiš každé různé slovo jednou, jako `<word> <count>`, seřazené podle počtu
sestupně a při shodě podle slova vzestupně.

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)` není seřazená podle ničeho — ani podle klíče, ani podle počtu,
ani podle příchodu — takže pořadí je samostatný krok: zkopíruj položky do
`std.ArrayList` malých struktur a `std.mem.sort` ho s porovnávačem.
`getOrPut(word)` najde místo, nebo ho vloží, a řekne ti které pomocí
`found_existing`, což je přesně to, co počítací smyčka chce; `value_ptr`
čerstvého místa je neinicializovaný, dokud do něj nezapíšeš.

Zig nemá lambdu. Porovnávač je obyčejná funkce, předaná jménem,
s prvním parametrem pro kontext, který by zachytila — tady `{}`,
typu `void`, protože nic nezachytává. Klíče jsou řezy `input`,
takže mapa musí dostat `deinit` dřív, než se uvolní `input`: `defer` ve správném
pořadí to udělá bez jediné myšlenky.
'''
hints = [
  "getOrPut(word) vrátí místo s found_existing a value_ptr; nastav value_ptr.* = 0, když je nové, pak přičti jedna. To je celá počítací smyčka.",
  "counts.iterator() prochází položky; každá má key_ptr a value_ptr. Připoj Row za každou položku do std.ArrayList(Row).",
  "Porovnávač je fn byRank(_: void, a: Row, b: Row) bool — napřed počet sestupně, pak std.mem.order(u8, a.word, b.word) == .lt — a std.mem.sort(Row, rows.items, {}, byRank) ho použije.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.advanced.08.hashtable"
title = "Žádné pořadí"
story = "Prezence mýtnice se vrací v jakémkoli pořadí, jaké se hašovací tabulce zachtělo, a vedoucí ji chce v pořadí, v jakém budky doopravdy odpověděly."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků, na každém jméno budky. `n` je
nejméně `1` a jméno je jeden úsek znaků, které nejsou mezerou. Jméno se může
objevit víckrát.

Vypiš každé různé jméno jednou, jako `<name> <count>`, **v pořadí, v jakém se
jméno poprvé objevilo**. Pak vypiš `DISTINCT <k>`.

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

Kontejner ti tohle sám od sebe nedá a o tom je celý
úkol.

`std.StringHashMap` je hašovací tabulka: vyhledání je v průměru O(1), ale
`iterator()` vrací položky v **pořadí košů** — ne seřazeně, ne podle
vložení, a jinak ve chvíli, kdy tabulka naroste. Nic žádné pořadí
neslibuje, takže program, který vypisuje hašovací mapu jejím procházením, je program, jehož
výstup závisí na hašovací funkci. Startovní kód dělá přesně to a dokonce
projde případy jen s jedním různým jménem — což je to prozrazení: test,
který pořadí nerozliší, není důkaz, že je pořadí správně.

Drž ty dvě práce ve dvou kontejnerech: `std.ArrayList([]const u8)` si pamatuje
pořadí, v jakém bylo jméno poprvé viděno, a `std.StringHashMap(i64)` počítá.
Pro výpis projdi seznam.
'''
hints = [
  "Hašovací tabulka je na rychlé vyhledávání. Seznam je na pamatování pořadí. Potřebuješ obojí.",
  "found_existing je false právě jednou na jméno — při vložení — a to je chvíle připojit jméno do seznamu pořadí.",
  "Vypisuj procházením seznamu a ptej se mapy na každý počet pomocí count.get(name).?, nikdy procházením mapy.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.advanced.09.set-and-sort"
title = "Kdo parkuje kde"
story = "Tabule odstavného pruhu pod estakádou uvádí tutéž dodávku na tomtéž stání dvakrát a nikdo nedokáže říct, které z řádků jsou duplikáty."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<BERTH> <NAME>`.

Vypiš každou různou dvojici `<BERTH> <NAME>` jednou, seřazenou podle stání a pak
podle jména, pak `DISTINCT <k>` a `DUPES <n - k>`.

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig nemá seřazenou množinu dvojic; nejbližší jsou dva nástroje, každý na jednu
práci. `std.StringHashMap(void)` je množina — mapa, jejíž hodnoty nezabírají
místo — a když je klíčem **řádek sám**, `2 KWAN`, odmítne druhou kopii
jakékoli dvojice, která v ní už je. `std.ArrayList` malé struktury
`{ berth, name }` posbírá ty, které množina propustila, a `std.mem.sort`
s porovnávačem je dá do pořadí stání-pak-jméno. Žádná strukturovaná
vazba na rozebrání dvojice není; pole struktury už jména mají.
'''
hints = [
  "std.StringHashMap(void) je množina; getOrPut(line).found_existing je true u druhé kopie řádku a false u první.",
  "Do seznamu jdou jen řádky, které množina propustila, takže délka seznamu je DISTINCT a n minus ona je DUPES.",
  "Porovnávač řadí napřed podle stání a při shodě podle std.mem.order(u8, a.name, b.name) == .lt; std.mem.sort(Mooring, moorings.items, {}, byBerthThenName) ho použije.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.advanced.10.comptime-fn"
title = "Jedním průchodem po pruhu"
story = "Záznam náprav je sloupec počtů. Alex říká čtyři smyčky for. Mei říká čtyři smyčky for se jmény a ta jména jsou funkce."
brief = '''
Standardní vstup je jeden řádek celých čísel oddělených mezerami.

Vypiš čtyři řádky:

1. součet sudých hodnot (`0`, když žádné nejsou)
2. každou hodnotu větší než `10`, zdvojenou, v pořadí, spojené jednou mezerou —
   nebo `-`, když žádné nejsou
3. kolik je různých hodnot
4. `FIRST_BIG <i>` — index od 0 první hodnoty větší než `10`,
   nebo `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig nemá `<algorithm>` ani lambdu a to nejbližší je blíž, než
to zní: funkce, která bere **jinou funkci jako parametr `comptime`**.
`fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64`
je `accumulate` s predikátem; `isEven` předáš jménem, překladač
vyrazí verzi `sumIf` s vloženým voláním a za běhu není žádný
ukazatel na funkci. Napiš `sumIf`, `keepDoubled`, počet různých hodnot
ze `std.mem.sort` na kopii plus jeden průchod přes sousední dvojice a
`indexOfFirst`. Nejde o to, že by smyčka byla těžká na napsání; jde o to, že
jméno říká, k čemu smyčka je, a predikát je hodnota, kterou umíš
přečíst.
'''
hints = [
  "comptime keep: fn (i64) bool je typ parametru; uvnitř těla je keep(x) obyčejné volání a v místě volání předáš isEven bez závorek.",
  "keepDoubled potřebuje kam psát: vrať std.ArrayList(i64), na který volající zavolá deinit, a uvnitř na jeho deinit dej errdefer, aby selhání append neuniklo.",
  "gpa.dupe(i64, xs) je kopie k seřazení; seřazený řez má duplikáty vedle sebe, takže hodnota je nová právě tehdy, když se liší od té před ní.",
