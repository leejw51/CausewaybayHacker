# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.advanced.23.queue"
title = "Průlez"
story = "Jedna budka posílá mince průlezem do počítací místnosti a jeden úředník je vybírá, a ten úředník čeká u prázdného průlezu od 06:40."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Producent vloží každou hodnotu do `std.Io.Queue(i64)`; konzument je
vybírá po jedné a každou vypíše zdvojenou. Když producent vloží
všechno, `main` frontu **zavře** a konzument skončí, když je
fronta vyprázdněná a zavřená. Počkej na oba, pak vypiš `CONSUMED <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

C++ to postavilo z `std::queue`, mutexu, podmínkové proměnné a
příznaku `done`; Zig 0.16 dodává celou věc jako jeden typ. `std.Io.Queue(T)`
je omezený kanál nad bufferem, který vlastníš: `putOneUncancelable(io, v)`
blokuje, dokud je plný, `getOneUncancelable(io)` blokuje, dokud je prázdný,
a po `close(io)` vrátí `get` na vyprázdněné frontě `error.Closed` —
což je pro konzumenta signál skončit, a smyčka je `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}`. Fronta je FIFO, takže
pořadí je pořadí vstupu, ať plánovač dělá cokoli.

`io.concurrent(func, .{ args })` spustí `func` ve vlastním poolu runtime —
má zaručenou vlastní jednotku souběhu, jinak volání selže — a vrátí
future; `.await(io)` na něm je join. Startovní kód se zasekne.
Producent vloží všechno a vrátí se, nikdo frontu nezavře a
konzument se probudí pro poslední hodnotu, frontu vyprázdní a čeká na další,
která nepřijde. Každá dvojice producent/konzument potřebuje způsob, jak říct *už
nic nebude* — a to je `close`.
'''
hints = [
  "Jeden řádek za feeding.await(io): hatch.close(io). Pak se taking.await(io) vrátí a program skončí.",
  "close nezahodí, co je ve frontě ještě uvnitř; konzument dostává hodnoty, dokud není prázdná, a teprve pak uvidí error.Closed.",
  "Konzument je jediný, kdo během běhu vypisuje, a main vypíše CONSUMED až po taking.await(io) — to pořadí drží zapisovač v bezpečí bez zámku.",
]

