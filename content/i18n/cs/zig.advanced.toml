# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.advanced.12.function-values"
title = "Počítání u závory"
story = "Závora u budky 5 počítá, kdo vjede a kdo vycouvá, a vedoucí chce číslo na konci směny, ať se mezitím stalo cokoli."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků, každý `IN` nebo `OUT`.

Veď průběžný počet, který nikdy neklesne pod nulu, a vypiš ho po každém
příkazu. Pak vypiš `INS <k>` — kolik příkazů bylo `IN`, spočítané
generickým `countIf` a predikátovou funkcí — a `CLOSED <final>`.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Zig nemá uzávěry — žádnou lambdu, žádné zachycení — a to nejbližší je
vypsané tam, kde to vidíš. Počítadlo je **struktura, která drží svůj
vlastní součet**, a `add` je metoda na `*Counter`: stav, který by lambda v C++
zachytila pomocí `[total = 0LL]` a označila `mutable`, je pole,
a volání, které ho mění, bere strukturu přes ukazatel. Nic mimo
strukturu se k součtu nedostane jinak než přes `add`.

Predikát je **funkce předaná jako parametr `comptime`**:
`countIf(commands, isIn)` jmenuje `isIn` a překladač ho vloží. Není
co zachytit, takže se nic nezachytí, a otázka, kterou by se pohovorující
zeptal na `[&]` proti `[=]`, se tu nemá kde schovat.
'''
hints = [
  "add jsou tři řádky: self.total += delta, ořízni na nule, return self.total. Bere *Counter, protože zapisuje; count.add(...) za tebe předá adresu.",
  "Counter deklarovaný jako var count = Counter{} začíná na nule díky výchozí hodnotě pole; do const by se přičítat nedalo.",
  "fn countIf(items: []const []const u8, comptime pred: fn ([]const u8) bool) usize projde řez a spočítá položky, které pred přijme; isIn předej jménem.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.advanced.13.optional-union"
title = "Řádek, který není číslo"
story = "Čtečka počítadla náprav předá sloupec čísel a uprostřed něj něčí objednávku snídaně."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků. Každý řádek má být
celé číslo.

Pro každý řádek vypiš buď zdvojenou hodnotu, nebo `BAD <line>`, když se
nedá rozparsovat. Nakonec vypiš `SUM <total>`, kde součet je součet hodnot,
které jsi vypsal.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Odpověď nesou dva typy. `fn parse(text: []const u8) ?i64` je *číslo,
nebo nic*: `std.fmt.parseInt` vrací chybové sjednocení a `catch return
null` promění chybu v polovinu `null` volitelné hodnoty. Odmítne
celý řetězec, nebo nic, takže `4x` se zamítne stejně jako `xx`.

`fn doubled(text: []const u8) Doubled` vrací `union(enum) { value: i64,
bad: []const u8 }` — *buď zdvojenou hodnotu, nebo řádek, který selhal*,
jeden z přesně dvou případů, nikdy oba, nikdy žádný. `switch` na něm vytáhne
data z toho případu, který tam je: `.value => |v|`, `.bad => |line|`.
Nikde v `main` žádné `try`; selhání je hodnota a jde tam, kam jdou
hodnoty. `main` startovního kódu už je ten switch; `parse` a `doubled` jsou
kostry, a dokud nejsou napsané, vyjde každý řádek jako `BAD`.
'''
hints = [
  "std.fmt.parseInt(i64, text, 10) catch return null je celé parse: při úspěchu hodnota propadne jako obsah volitelné hodnoty, při jakékoli chybě funkce vrátí null.",
  "Volitelná hodnota se rozbalí pomocí if (parse(text)) |value|; cesta else je ten null a tam se staví případ .bad.",
  "Vrátit .{ .value = v } nebo .{ .bad = text } z téže funkce je legální, protože návratový typ je union, který drží jedno či druhé; switch v main vybere větev, s obsahem zachyceným v |v| nebo |text|.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.advanced.14.error-sets"
title = "Vlastní chyba"
story = "Čtyři vrstvy mýtné služby vrací každá něco jiného a nic nad nimi nic z toho nechytá."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků, každý má být vzdálenost
v km.

`fare(text)` parsuje pomocí `std.fmt.parseInt` — které **selže** s
`error.InvalidCharacter` na `xx`, uvnitř `fare` přeloženým na vlastní
`error.NotANumber` — a zápornou vzdálenost odmítne druhou vlastní
chybou, `error.NegativeDistance`. Obě pocházejí z jedné pojmenované množiny chyb,
`FareError`. Jinak vrátí `500 + 100 * km`.

Vypiš jeden řádek na každý vstupní řádek: jízdné, nebo `not a number`, když se
nedá rozparsovat, nebo `negative distance: <km>`, když je vzdálenost záporná. Pak
vypiš `ERRORS <k>`, kolik řádků selhalo.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

Startovní kód se přeloží a na `xx` umře: `try fare(text)` v `main` předá
chybu nahoru a nad `main` nikdo není — program vypíše `error:
NotANumber` a trasu a skončí s `1`. To je celý příběh chyb v Zigu:
chyba je hodnota v návratovém typu, `!i64`, a každé místo volání
ji buď pomocí `try` pošle výš, nebo ji `catch` chytí. Nic se neodvíjí přes
funkci, která neřekla, že může selhat.

Chyba v Zigu je **jméno**, ne objekt: nenese žádnou zprávu ani žádná
data, a proto `negative distance: <km>` staví volající, který
text pořád drží. `catch |e| switch (e) { ... }` je dvouramenný catch
a switch musí jmenovat každou chybu v množině — `catch (const
std::runtime_error&)` z C++, který by potichu spolkl tu odvozenou, nemá
obdobu, protože tu není žádná hierarchie, kterou by šlo oříznout.
'''
hints = [
  "if (fare(text)) |cents| { ... } else |e| switch (e) { ... } je blok try se dvěma rameny catch; obsah úspěchu je cents, chyba je e.",
  "Zprávu si postavíš sám: chyba nenese nic, ale text je pořád v rozsahu a vypíše se jako km, které zpráva chce.",
  "Chyba, která dojde až na vrchol main, vypíše error: <Name> a trasu a skončí s 1. To dělá startovní kód na druhém řádku a je to ten dobrý výsledek — program řekl, kde se zastavil.",
]

