brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel, z nichž se každé vejde do
`i64`. Jejich průběžný součet se do `i64` vejde také.

Vypiš dva řádky: `INT32 OK`, když se každý průběžný součet po cestě vejde do
`i32`, nebo `INT32 OVERFLOW <i>` s indexem od 0 první hodnoty,
která by ho vytlačila ven; pak `INT64 <total>`.

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

Startovní kód drží součet v `i32` a na druhé hodnotě zpanikaří:
`panic: integer overflow`. To Zig dělá přesně to, co tahle země slíbila
— v `-O Debug` celé číslo, které přeteče, to řekne a zastaví se, a široký
případ se zastaví o řádek dřív, na `@intCast`, který by oříznul
`5000000000`. Čti tu paniku jako dar a pak si přečti zbytek
smlouvy: `+%` přetáčí, `+|` saturuje a obyčejné `+` v Debug panikaří a je
**nedefinované chování v `-O ReleaseFast`**, kde je kontrola vypnutá a
optimalizátor předpokládá, že se to nikdy nestane — takže `total + v < total` s kladným
`v` je tam *vždy nepravda* a test se smaže, přesně jako ho gcc a
clang smažou pro C++.

Přetečení tedy nikdy neodhaluješ tím, že ho způsobíš. Odhalíš ho *před*
úzkým sčítáním, v širším typu nebo porovnáním s mezemi —
`std.math.minInt(i32)` a `std.math.maxInt(i32)` — a očekávaný výstup tohoto programu
nezávisí na ničem, co by kterýkoli režim sestavení nechal nedefinované.
'''
hints = [
