# ---------------------------------------------------------------- 16
[[quest]]
id    = "zig.advanced.16.defer"
title = "Uklidí po sobě"
story = "Kniha mýtnice se na konci směny zavře sama, ve správném pořadí, ať si na to někdo vzpomněl, nebo ne."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Deklaruj dvě hodnoty `Guard` na **začátku** `main`, jménem `first` a
`second`, a na `drop` každé z nich dej `defer`; `drop` vypíše `DROP <name>`. Uvnitř
vnořeného bloku nasyp hodnoty do `Tally`, jehož odložený `report` vypíše
`TALLY <count> <sum>`. Za blokem vypiš `DONE`. Nic jiného `main`
sám nevypisuje.

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

Každý řádek kromě `DONE` vypíše nějaký `defer`. Zig nemá destruktor;
nejbližší je `defer` a je v tom poctivější: řádek, který
uvolňuje, se píše vedle řádku, který získává, a spustí se, když skončí
**blok** — u zavírací složené závorky, při `return`, při chybě odcházející
přes `try` — v **obráceném** pořadí `defer`ů. `defer` od `Tally` je
ve vnitřním bloku, takže `TALLY` přijde před `DONE`; `defer`y obou strážců
jsou v bloku `main` a `second` byl odložen poslední, takže běží první.
Nic z toho neplánuješ ty. Plánuje to rozsah.

Jedna věc, kterou je třeba udělat správně: `defer w.flush()` je první `defer` v `main`, takže
běží **poslední** — až strážci zapíšou své řádky do bufferu.
Dej ho za ně a řádky `DROP` se zapíšou do bufferu, který nikdo nevyprázdní.
`defer gpa.free(input)`, `defer list.deinit(gpa)`, `defer m.unlock(io)` na
příští mapě: každé uvolnění na této cestě je tatáž myšlenka.
'''
hints = [
  "defer first.drop(w); hned za deklarací first a totéž pro second. drop nikdy nevoláš sám; volá ho konec main.",
  "Vnitřní složené závorky jsou celý důvod, proč se TALLY vypíše před DONE: defer tally.report(w) uvnitř nich běží u jejich zavírací závorky. Odstraň je a vypíše se až potom.",
  "Defery běží vždycky obráceně, a proto second jde před first — a proto flush, odložený jako první, běží až po obou.",
  "tally.report čte stav v okamžiku, kdy defer běží, ne v okamžiku, kdy byl napsán: defer je odložený příkaz a argumenty, které jmenuje, se vyhodnotí až tehdy.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.advanced.17.past-the-end"
title = "O jedno za poslední budkou"
story = "06:00:00 u portálu. Signální tabule vedle budky 6 drží tabulku výstřelů pro všechno, co na nábřeží odpálí, a její smyčka kontrolního součtu čte jednu položku za jejím koncem."
brief = '''
Na prvním řádku je `n`. Dalších `n` řádků je tabulka výstřelů, `<NAME> <SECONDS>`.
Pak řádek `q` a `q` jmen k vyhledání.

Pro každé jméno vypiš `<NAME> FIRES AT <seconds>` nebo `<NAME> UNKNOWN`. Pak
vypiš `LOADED <n> CHECKSUM <sum of every SECONDS in the table>`.

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

Startovní kód se čistě přeloží a zpanikaří dvakrát, ze dvou různých důvodů,
a ty musíš najít oba.

První je `lookup`. Vrací `?*Shell` — adresu odpovídající
položky, nebo `null` — a volající na něj napíše `.?`, aniž by se podíval. `.?`
znamená *vím, že to není null*, a když to null je, `-O Debug` program zastaví
s `panic: attempt to use null value`. Otestuj volitelnou hodnotu: `if (lookup(...))
|shell|` je jediný způsob, jak se dostat k tomu, co je za ní, a větev `else`
je místo, kde žije `UNKNOWN`.

Druhý je smyčka kontrolního součtu. Prochází `1..=n` a čte `table[i]`, a
index `n` je o jedno za koncem: `panic: index out of bounds: index 2, len 2`.
Oprav smyčku. Pak pochop, co ti ta panika koupila: verze tohoto úkolu v C++
čte `table[n]` bez kontroly, dostane cokoli, co zrovna na té
adrese je — další objekt na haldě, nebo nic — a vypíše kontrolní
součet, který je špatně o hodnotu, kterou nikdo nezopakuje. Zig v Debug kontroluje každý
index a každé `.?`, a v `-O ReleaseFast` nekontroluje ani jedno:
tytéž dva řádky se tam stanou nedefinovaným chováním, přesně jako v C++. To
je v této zemi dohoda: kontrola je zapnutá, dokud stavíš, a tvoje práce je
nepotřebovat ji ani jednou do chvíle, kdy je vypnutá.
'''
hints = [
  "Navaž výsledek lookup a otestuj ho: if (lookup(table, name)) |shell| { ... } else { UNKNOWN }. Volitelná hodnota je odpověď i otázka zároveň.",
  "Platné indexy jdou od 0 do len - 1. Smyčka, která začíná na 1 a běží do len, je o jedno vedle na obou koncích a panikaří jen horní konec. for přes řez nemá žádný index, který by šel splést.",
  "Obě paniky jsou kontroly režimu Debug. Postav startovní kód s -O ReleaseFast a ani jeden řádek se nezastaví: kontrolní součet čte za konec a null se následuje na adresu nula. Kontrola je to, za co platíš, a oprava je to, čím za ni platíš.",
  "Panika vypíše zprávu a trasu zásobníku na stderr a skončí s 134; soudce čte stdout, takže všechno vypsané před panikou tam pořád je a pořád je to špatně.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.advanced.18.threads"
title = "Dva pruhy, jedno počítadlo"
story = "Estakáda v 07:00 otevře druhý pruh a fronta u portálu konečně odteče. Nic jiného se na mýtnici nezměnilo."
