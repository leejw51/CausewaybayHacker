by byla jiné místo a sdílení by bylo pryč. Předej
adresy.

Atomická hodnota není levnější mutex; je to jiný nástroj, pro jedno strojové
slovo přečtené, změněné a zapsané jedinou instrukcí. `fetchAdd(v, .monotonic)`
je ta instrukce. Ve chvíli, kdy spolu musí souhlasit dvě pole,
se zámek vrací — neexistuje atomická hodnota pro „tyhle dvě věci, dohromady“,
a proto měl `Counter` z předchozích úkolů mutex a tenhle
nemá.

`.monotonic` tu stačí, protože nic nezávisí na tom, *kdy* se tato
zvýšení stanou viditelnými vůči jakémukoli jinému zápisu, jen na tom, že se žádné
neztratí. Ta věta je doplňující otázka.
'''
hints = [
