# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.advanced.28.refcount"
title = "Kdo to ještě drží"
story = "Dvě měřidla čtou tutéž misku mincí přes jednu knihu a ta kniha musí zůstat, dokud nezmizí poslední měřidlo, a ani o vteřinu déle."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Dej hodnoty do řezu, který vlastní `Ledger`, jenž **počítá své držitele**:
`share()` vydá popisovač a zvedne počet, `release(gpa)` počet sníží
a uvolní řez, když dojde na nulu. Vezmi dva popisovače a drž
pozorovatele, který se nepočítá. Vypiš čtyři řádky:

1. `REF <sum>` — součet, přečtený přes druhý popisovač
2. `SHARED <k>` — počet, dokud jsou oba popisovače naživu
3. `ALIVE yes` — `watch.alive()`, dokud jsou
4. `ALIVE no` — poté, co byly oba popisovače uvolněny

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig nemá `shared_ptr`; nejbližší je to, čím `shared_ptr` je
uvnitř, napsané tam, kde to vidíš. Minulý úkol byl jeden vlastník.
Tenhle je počet vlastníků, držený vedle objektu, a objekt se
uvolní, když počet dojde na nulu — tím popisovačem, který zrovna odešel poslední.
`share()` zvedne počet; `release()` ho sníží. Ani jedno za tebe nic
nedělá: žádný destruktor neběží u zavírací složené závorky, takže každému `share()` odpovídá
`release()`, který jsi napsal, jinak řez uteče a alokátor `-O Debug` to
řekne na stderr, když `main` vrátí.

Pozorovatel je sám `Ledger`, na který se někdo dívá, aniž by se počítal. Vidí,
jestli tam řez ještě je — `items` je `?[]i64` a `null` po
posledním uvolnění je **nulová hodnota**, kterou ti typ dává pro „pryč“ — a
řez naživu udržet nemůže. To je to, co přeruší cyklus, a o tom je
poslední mapa na této cestě.
'''
hints = [
  "share() jsou dva řádky: self.refs += 1; return self. Dvě volání dají SHARED 2 a mirror.items.? dosáhne na tentýž řez.",
  "release() sníží počet a teprve když dojde na nulu, uvolní řez a nastaví items na null — ten null je to, co čte alive().",
  "Uvolni oba popisovače; první uvolnění samo nic neuvolní, druhé ano. Řekni nahlas proč: to je otázka, na kterou se tenhle úkol doopravdy ptá.",
]

