# ---------------------------------------------------------------- 33
[[quest]]
id    = "zig.advanced.33.stop-flag"
title = "Zastav se, když tě požádají"
story = "Noční pruh běží, dokud mu někdo neřekne, ať přestane, a až do téhle směny to nikdo nedokázal."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Spusť dvě vlákna. První sečte hodnoty a uloží výsledek.
Druhé bere **příznak zastavení**, `*std.atomic.Value(bool)`, a točí se ve smyčce, dokud
nepřečte `true`; když ho přečte, spustí funkci `onStop`, která nastaví
druhý příznak, a pak zaznamená, že se zastavilo. Z `main` nastav příznak
zastavení, počkej na obě přes join a vypiš:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread` nemá `stop_token` ani `jthread`; nejbližší je
to, z čeho jsou udělané, předané ručně. Žádost o zastavení je `bool`, který
žadatel zapíše a worker čte, a protože na něj sahají dvě vlákna, je to
atomická hodnota: `stop.store(true, .release)` na jedné straně, `stop.load(.acquire)`
ve smyčce workera na druhé. Vlákno, které kontroluje svůj příznak, je vlákno,
které jde vždycky vypnout; to, které nekontroluje, je noční pruh startovního kódu,
a jeho `join` by se nikdy nevrátil.

`stop_callback` v C++ běží na vlákně žadatele ve chvíli, kdy se o zastavení
požádá; tady si worker spustí `onStop` sám, když příznak uvidí,
což je tentýž slib — *něco se stane, protože se požádalo o zastavení*
— dodržený z druhé strany. `join` za `store` je destruktor `jthread`,
vypsaný: požádej, pak čekej. `std.Thread.yield()` uvnitř
smyčky dá jádro komukoli dalšímu, kdo ho chce; holé točení taky projde a
taky promrhá jádro.
'''
hints = [
  "Vlákno pruhu bere tři příznaky přes ukazatel; jeho smyčka je while (!stop.load(.acquire)) std.Thread.yield() catch {}; a za smyčkou zavolá onStop a uloží stopped.",
  "Spusť pruh dřív, než nastavíš příznak, a počkej na něj přes join až potom. Příznak nastavený dřív, než vlákno začne, je v pořádku — zastaví se při první kontrole — ale join bez store se nikdy nevrátí.",
  ".release na store a .acquire na load jsou ta dvojice, která zviditelní, co se stalo před store, po load; .monotonic by tu taky prošlo a pohovorující se zeptá proč.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.advanced.34.unreachable"
title = "Unreachable"
story = "07:59 na estakádě Canal Road. Model pruhů označí jednu větev za nedosažitelnou, ranní provoz na ni dosáhne a všechny pruhy se naráz zavřou — zatímco vlákno pruhu pořád čte buffer, který už mýtnice vrátila."
brief = '''
Na prvním řádku je `w n`: `w` pruhů a `n` odečtů. Na druhém řádku jsou odečty.

`pump(gpa, w, ledger)` spustí `w` vláken nad odečty, které drží
`Ledger` s počítáním odkazů (ten z doby před třemi úkoly); vlákno `i` sečte
odečty od `i * n / w` až po `(i + 1) * n / w` do `partial[i]` a
`pump` vrátí dílčí součty. `main` vypíše `PUMP <i> <sum>` pro každý,
`TOTAL <sum>` a pak `FREED yes`, jestli byly odečty uvolněny do
chvíle, kdy je všechno hotové — pozorováno přes `alive()` knihy.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

Startovní kód selže dvakrát a ta dvě selhání jsou dvě poloviny této
země.

První je model pruhů. `pump` spočítá hranice každého pruhu a pak
řekne `if (begin == end) unreachable;` — *pruh bez provozu se nemůže
stát*. Tři pruhy nad dvěma odečty, a stane se. `unreachable`
není komentář ani assert: je to ten jediný řádek v Zigu, který znamená
**předpokládej**. V `-O Debug` je dosažení `panic: reached unreachable code`
a mýtnice se zastaví s důvodem na obrazovce. V `-O ReleaseFast` ti
překladač *uvěří* — větev se smaže a všechno, co mohlo
vést jen k ní, se smaže s ní — a program, který na ni dosáhne, je
nedefinovaný, přesně jako je nedefinovaný program v C++, který čte přes visící ukazatel.
Panika je poctivá verze téže smlouvy. Smaž
to tvrzení a obsluž ten případ: prázdný pruh má součet `0`.

Druhé je vlastnictví. `pump` startovního kódu **uvolní** knihu
dřív, než spustí pruhy — *workeři mají svůj řez, popisovač není
potřeba* — a to uvolnění je poslední, takže se odečty uvolní
a workeři je stejně čtou. V Debug alokátor natře paměť, kterou
vzal zpátky, hodnotou `0xAA`, každý bajt, takže každý odečet se vrátí jako
`-6148914691236517206` a první pruh, který dva z nich sečte, zastaví
mýtnici s `panic: integer overflow` — to je selhání, které ukazuje viditelný případ,
kde má každý pruh provoz a na `unreachable` se nikdy nedosáhne:
součet, který na žádném odečtu ze vstupu přetéct nemůže, a trasa ukazující
na řádek, který chybou není. V ReleaseFast žádný nátěr ani
kontrola není:
pruhy čtou cokoli, co tam dala další alokace, nebo stránku, kterou jádro
vzalo pryč. To je čtení přes visící ukazatel a je to nejdražší druh
chyby, protože neselže tam, kde je chyba.

Oprav vlastnictví, ne příznak. Každý pruh si **vezme podíl**
knihy dřív, než začne, a uvolní ho, když skončí, takže odečty
žijí přesně tak dlouho jako poslední vlákno, které je drží — ať
pruhy skončí v jakémkoli pořadí. `pump` počká přes join, než vrátí, a uvolní popisovač,
který mu `main` dal, jako poslední. Zpátky v `main` je `alive()` `false`: odečty
byly uvolněny, jednou, posledním uvolněním — vlastním uvolněním `pump`, po joinech —
a nikdo je pořád nečetl. Počet je atomický, protože uvolnění pruhů
spolu závodí;
kniha sama vláknově bezpečná není a být nemusí, protože nikdo
do odečtů nezapisuje.

To je celá země v jednom programu. Kontroly tě zastavily pokaždé,
když ses mýlil, a nástroje, které tě dělají správným — počet, který říká, kdo
tohle drží, join, který čeká, `defer`, který uvolňuje — jsou
tytéž, které jsi potkal na základní cestě.
'''
hints = [
  "Smaž unreachable a nech prázdný pruh běžet: begin == end je prázdný řez a jeho součet je nula. Tvrzení, které nedokážeš dokázat, není tvrzení, které se má dělat.",
  "Dej každému pruhu podíl: spusť ho s ledger.share() a nech ho dát defer ledger.release(gpa). Podíl pruhu je to, co drží odečty naživu; uvolní se, když funkce pruhu vrátí, ne když vrátí pump.",
  "Vlastní uvolnění v pump se přesune do defer na začátku pump, takže běží po joinech — až budou odečty přečtené — a uvolňuje popisovač, který main odevzdal.",
  "partial se pruhům předává po místech, a to je správně: pump ho vlastní, pump počká přes join, než ho vrátí, a každý pruh zapisuje jen do svého místa. Kdyby si main nechal podíl, FREED by bylo no — odečty by byly naživu, protože je main pořád držel, a to je ta druhá odpověď, u které tenhle boss přijme, že ji umíš vysvětlit.",
]
