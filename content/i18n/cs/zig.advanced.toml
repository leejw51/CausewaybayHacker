# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.advanced.26.futures"
title = "Slib mi ten počet"
story = "Vedoucí posílá běžce pro každé číslo a nestojí u průlezu a nečeká; čísla se vrátí, až se vrátí."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Spusť jednu úlohu `io.concurrent` na hodnotu, která vrátí její druhou mocninu.
Posbírej futures do seznamu a počkej na ně pomocí `await` **v pořadí**, každou vypiš.
Pak dej jednomístnou `std.Io.Queue(i64)` ještě jednomu vláknu, které do ní vloží `n`,
a vypiš `READY <n>` z toho, co vyjde.

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

Future je hodnota, která tu ještě není. `io.concurrent(square, .{ v })`
spustí `square` v poolu runtime a dá ti `std.Io.Future(i64)`
pro jeho návratovou hodnotu; `.await(io)` blokuje, dokud neexistuje, a pak ji
předá, jednou. Čekání na futures v pořadí je to, co dá výstup do pořadí —
samotné úlohy skončí, kdy skončí.

Zig nemá `std::promise`; nejbližší je druhý konec téže
trubky a 0.16 tu trubku už má. `std.Io.Queue(i64)` nad **jedno-
prvkovým** bufferem je slib: jedna strana hodnotu vloží, druhá
ji vybere a ten, kdo vybírá, blokuje, dokud tam není. Tak vlákno
ohlásí jeden výsledek bez mutexu, příznaku nebo návratové hodnoty k obalení — a
je to týž typ, jakým byl průlez před třemi úkoly, s bufferem o jednom místě.

`io.concurrent` slibuje, že úloha poběží sama — selže s
`error.ConcurrencyUnavailable`, když jí runtime nemůže dát vlákno —
zatímco `io.async` dává slabší slib: funkce *může* být zavolána
hned tam, dřív než se `async` vrátí, na runtime, který nemá druhé
vlákno, které by nabídl. Když myslíš `concurrent`, řekni to nahlas.
'''
hints = [
  "try io.concurrent(square, .{v}) vrací std.Io.Future(i64); průběžně ji připojuj do seznamu a future nikdy nekopíruj — čekej na ni přes ukazatel, for (squares.items) |*f|.",
  "f.await(io) se dá zavolat přesně jednou na každou future a blokuje, dokud tam hodnota není; procházení seznamu v pořadí ti dá výstup v pořadí.",
  "Hlásící vlákno dostane &ready a n; ready.getOneUncancelable(io) v main blokuje, dokud se put nestalo. Než main vrátí, počkej na vlákno přes join.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.advanced.27.optional-pointer"
title = "Velikost, kterou kompilátor umí pojmenovat"
story = "Řetěz mýtných stvrzenek na bodci v budce 2: každá stvrzenka drží tu další, až dolů k první ze směny, a nikdo nedrží žádnou stvrzenku dvakrát."
brief = '''
Standardní vstup je počet `n`, pak `n` částek v centech.

Drž je v řetězu, jeden uzel na částku, v pořadí, v jakém přišly:

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

Vypiš tři řádky:

1. částky v pořadí, oddělené mezerou, nebo `-`, když žádné nejsou
2. `SUM <total>`, z **rekurzivní** funkce nad řetězem
3. `LAST <cents>` — částku na posledním uzlu — nebo `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

Startovní kód se nepřeloží a ta chyba je důvod, proč ukazatele existují.
Napiš `next: Entry` a překladač musí rozložit `Entry` v paměti: osm
bajtů pro `cents` plus kolik je velké `Entry` — což je právě to, co se
snaží zjistit. *struct 'Entry' depends on itself.*

`?*Entry` je ukazatel a ukazatel má velikost, kterou překladač už
zná. Zig nemá `unique_ptr`; nejbližší je pravidlo, které vynucoval,
dodržované ručně: **vlastníkem je alokátor.** `gpa.create(Entry)` ti dá
uzel a `gpa.destroy(node)` ho vrátí, přesně jednou, a na
otázku, *kdo* ho zničí, odpovídá konvence — řetěz vlastní
své uzly, takže `main` řetěz projde a uvolní ho, než vrátí.
`?` je ta část, kterou překladač kontroluje: `null` je konec
řetězu i prázdný řetěz a nic nečte přes `?*Entry`, aniž by ho
rozbalilo, takže nikde není žádný samostatný prázdný případ.
'''
hints = [
  "Chybu překladu opraví jeden řádek: next: ?*Entry — a teď má struktura šestnáct bajtů, ať ukazuje na cokoli.",
  "Stav ho odzadu dopředu: node = try gpa.create(Entry); node.* = .{ .cents = v, .next = head }; head = node. Stará hlava se stane ocasem nového uzlu.",
  "Procházej pomocí while (walk) |node| : (walk = node.next); volitelná hodnota se rozbalí jednou za krok a smyčka skončí na null. Rekurzivní součet jsou dva řádky: null je 0, jinak cents plus součet zbytku.",
