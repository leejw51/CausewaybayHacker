[[quest]]
id    = "zig.advanced.20.mutex"
title = "Jedna miska, osm budek"
story = "Každá budka přičítá, co vybrala, k jednomu součtu na zdi mýtnice, a na konci hodiny zeď nesouhlasí ani s jednou z nich."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Spusť jedno vlákno na hodnotu, které ji přičte k **jednomu sdílenému součtu**. Počkej
na všechna přes join, pak vypiš `TOTAL <sum>` a `THREADS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

Startovní kód se přeloží a vypíše `TOTAL 0`. Worker bere `total` **hodnotou**
— `i64` zkopírované do n-tice argumentů vlákna — přičte do své vlastní
kopie a zahodí ji. Předej ukazatel, `*i64`, a máš jinou
chybu, tu, která se v tak malém testu neukáže: `total.* += value`
z několika vláken naráz je **datový závod**. Kontroly Debug v Zigu ho
nechytí; závod je tu nedefinované chování přesně jako v C++, ne
jen špatné číslo.

`std.Io.Mutex` vedle součtu, zamčený každým vláknem, které na něj sahá,
je odpověď: `m.lockUncancelable(io)` ho vezme, `defer m.unlock(io)`
ho vrátí na konci bloku, ať se mezitím stane cokoli. Worker
bere `io: std.Io` jako parametr, protože ho mutex potřebuje — v
0.16 je zámek součástí I/O runtime, ne knihovny vláken, a
`std.Thread.Mutex` už neexistuje. `defer` je `lock_guard` z C++,
vypsaný tam, kde se odemkne.
'''
hints = [
  "Předej &total, ne total: z parametru workera se stane total: *i64 a přičtení je total.* += value. Vlákno má měnit součet v main, ne svůj vlastní.",
  "var total_mutex: std.Io.Mutex = .init; v main, &total_mutex v n-tici a ve workeru m.lockUncancelable(io); defer m.unlock(io); před přičtením.",
  "Číst total po všech joinech je bezpečné bez zámku: join() je synchronizační bod a žádné vlákno, které by zapisovalo, nezbylo.",
