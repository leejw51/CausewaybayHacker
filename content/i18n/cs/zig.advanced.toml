přežije. Ta chyba je aspoň dobře definovaná. Její dvojče s řezem ne: `for
(list.items) |v|` vezme řez **jednou**, ukazatel a délku, a
`orderedRemove` uvnitř smyčky seznam pod ní zkrátí. Smyčka
dál prochází starou délku, čte místo za novým koncem — paměť, kterou
