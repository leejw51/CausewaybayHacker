  "Zaznamenej jen první index, který opustí rozsah — ?usize, který se nastaví jednou — protože pozdější hodnota může součet vrátit dovnitř a otázka zněla, kde ho poprvé opustil.",
  "Když musíš sečíst dvě i32 a chceš vědět, jestli je to bezpečné: @addWithOverflow(a, b) vrátí přetočený součet a bit přenosu, definované v každém režimu sestavení. To je ta kontrola; znaménko obyčejného součtu je to, co optimalizátor smaže.",
