```

Na startovním kódu jsou špatně dvě věci a ve výstupu se ukáže jen jedna.
Odečte ze zdroje a nikdy nepřipíše do cíle — to je viditelná
chyba. Druhá je tvar: zamykat *napřed zdroj* znamená, že dva protisměrné
