Startovní kód se nepřeloží: `largest` je přibité k `i64`, takže předat mu
slova je *expected type '[]const i64', found '[][]const u8'*.
Generická funkce v Zigu je funkce s parametrem **`comptime T: type`**:
`fn largest(comptime T: type, xs: []const T) T` se vyrazí
jednou pro každý typ, se kterým se volá, a `T` se vypíše při volání —
