# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.advanced.19.join"
title = "Nikdo neodchází bez odhlášení"
story = "Vlákno pruhu dokončí směnu a předák odejde z budky, aniž by vzal jeho popisovač, a celé mýtnici vypadne proud."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků textu.

Spusť jedno vlákno na řádek, které ho převede na velká písmena do vlastního místa. Počkej
na všechna přes join, vypiš řádky v pořadí, pak `DONE`.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

Startovní kód se nepřeloží a ta chyba je lekce. `std.Thread.spawn`
vrací `!std.Thread` — popisovač, nebo chybu — a startovní kód ho upustí
na zem jako holý příkaz: *error union is ignored*. Zig odmítá
nechat hodnotu, která může být chybou, bez prozkoumání, a dělá ti tím
laskavost: popisovač je **jediný** způsob, jak zavolat `join`, a vlákno, na které nikdo nečeká,
je vlákno, které pořád běží, když `main` vrátí — proces pod ním skončí
a řádky jsou napůl velkými písmeny, nebo vůbec, podle
plánovače. C++ zavolá abort na `std::thread` zničené, dokud je joinable; Zig tě nutí
držet popisovač v ruce a ptá se, co jsi s ním chtěl udělat.

Takže se každý popisovač uchová a na každé vlákno se počká přes join (nebo se
`detach`ne, což skoro nikdy nechceš), než se přečte jeho práce. Tvar je
tvar alokátoru: `alloc` řez `std.Thread`, vyplň ho, projdi ho joinem, `free` ho —
a smyčka s join stojí tam, kde stál destruktor v C++.
'''
hints = [
  "Překladač chce, aby se někdo podíval na návratovou hodnotu spawn. t.* = try std.Thread.spawn(...) popisovač uchová a případnou chybu předá výš, což je poctivé zacházení s oběma polovinami.",
  "Drž popisovače v řezu std.Thread o velikosti n; for (threads) |t| t.join(); dřív, než se cokoli vypíše.",
  "Napřed všechna spusť, pak na všechna počkej. Join uvnitř smyčky se spawn tady taky projde — a pouští vlákna jedno po druhém, a na to vlákno není.",
]

