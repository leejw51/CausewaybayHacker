```

`tag` ve starteru nemá výchozí hodnotu, takže ji dvoutokenové řádky shodí:
`TypeError: tag() missing 1 required positional argument`. Výchozí hodnota
argumentu je součást smlouvy funkce — říká, co volající smí vynechat a co
dostane, když to udělá.

Rozděl řádek pomocí `.split()` a po převedení centů předej kousky přes
`tag(*parts)`. `*` rozbalí seznam do pozičních argumentů, takže se do jedné
signatury vejde dvouprvkový i tříprvkový seznam.
'''
hints = [
  "unit=\"catty\" na řádku s def. To je celá oprava.",
  "Výchozí hodnoty jdou až za parametry bez nich — def tag(name, cents, unit=\"catty\") — a výchozí hodnota, která je seznam nebo dict, se sdílí mezi voláními, což je doplňující otázka.",
  "tag(*parts) rozprostře seznam; při dvou kouscích doplní třetí výchozí hodnota.",
]

