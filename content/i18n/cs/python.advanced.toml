id    = "python.advanced.06.sets"
title = "Co mají oba stánky"
story = "Dva zelinářské stánky, po jednom na každé straně uličky, a zákaznice, která chce vědět, co dostane u kteréhokoli z nich, aniž by dvakrát přecházela mokrou podlahu."
brief = '''
Dva řádky standardního vstupu, každý je zboží jednoho stánku oddělené
mezerami. Stánek může tutéž věc uvést dvakrát; počítá se jednou.

Vypiš tři řádky:

1. `BOTH` a za ním všechno, co je na obou seznamech, seřazené, oddělené
   mezerami — nebo `BOTH -`, pokud není nic
2. `ONLY_A <k>`: kolik věcí je na prvním seznamu a ne na druhém
3. `ALL <k>`: kolik různých věcí je na kterémkoli z obou seznamů

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

`set` nemá duplicity ani pořadí a `&`, `-` a `|` jsou ty tři operace.
`sorted` na množině ti dá seznam, což je jediný způsob, jak ji vypsat
