id    = "python.advanced.17.gil"
title = "GIL"
story = "Suterén SOGO, dvanáct stánků, jeden zámek na celé patro. Všechno, co se mělo stát najednou, se stalo po jednom, a součty se vrátily jako vůbec nic."
brief = '''
Na standardním vstupu jsou dvě celá čísla `k` a `n`.

Rozděl `1..n` na `k` souvislých úseků — úsek `i` je od `n*i//k + 1` do
`n*(i+1)//k` včetně — a každý úsek dej vlastnímu vláknu, které sečte druhé
mocniny svého rozsahu: cyklus zatěžující CPU, žádné volání knihovny. Každé
vlákno přičte svůj výsledek k **jednomu sdílenému součtu**, pod zámkem, a
zapíše ho i do vlastní přihrádky. Všechna joinni. Vypiš `CHUNK <i> <sum>`
pro každý úsek v pořadí indexů, pak `TOTAL <sum>`, pak `THREADS <k>`.

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

Starter selhává z důvodu, který s časováním nemá nic společného. `work`
vrací svůj součet a `main` sbírá `t.join()`, jenže `join` vrací `None`, ať
target vrátil cokoli — vlákno nemá návratovou hodnotu. První `+=` je
`TypeError`. To je ta malá chyba. Oprav ji tak, jak to udělal quest se
zámkem: sdílený kontejner, `with lock:` kolem aktualizace a přihrádka na
úsek zapisovaná přesně jedním vláknem.

Ta velká věc je boss a není to chyba, kterou bys mohl opravit. Spusť to
s `k = 4` a `n = 4000000` a změř to, pak to spusť s `k = 1`. Trvají stejně
dlouho. CPython má **globální zámek interpretu**: v každém okamžiku běží
bajtkód Pythonu v jednom vlákně a vlákno zatěžující CPU zámek každých pár
milisekund pustí, aby se ostatní mohla vystřídat. Čtyři vlákna na čtyřech
jádrech sčítají druhé mocniny na střídačku, na jednom jádře, plus cena za
přepínání. Vlákna v Pythonu jsou na čekání — na sockety, na soubory, na
`sleep` — kde se zámek během čekání uvolní a souběžnost je skutečná. Na
práci CPU je odpověď `multiprocessing` nebo `concurrent.futures.
ProcessPoolExecutor`, které spouštějí oddělené interprety s oddělenými
zámky a platí za to kopírováním argumentů.

Výstup je deterministický, protože úseky se vypisují podle indexu a součet
je součet úseků, ne pořadí, v jakém vlákna skončila. `TOTAL` vypiš ze
zamčeného součtu, ne ze sečtení přihrádek — zámek je to, o čem tahle mapa
je, a ta dvě čísla se musí shodovat.
'''
hints = [
  "join() vrací None. Dej work index a přihrádku k zápisu a zamčený dict, do kterého přičítá; takhle se hodnota dostane z vlákna ven.",
  "Spusť všechna, pak joinni všechna, pak vypisuj. Vypisování uvnitř vláken by se prokládalo; vypisování po joinech, z přihrádek, nemůže.",
  "n*(n+1)*(2n+1)/6 je uzavřený vzorec pro celkový součet. Zkontroluj proti němu TOTAL jednou a víš, že hranice úseků jsou správně.",
  "Změř k=1 proti k=4 na velkém n. Když se shodují, potkal jsi GIL. To není chyba v tomhle questu; je to důvod, proč je příští verze tohohle programu ProcessPoolExecutor.",
]
