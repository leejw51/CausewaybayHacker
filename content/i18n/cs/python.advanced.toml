[[quest]]
id    = "python.advanced.07.functions"
title = "Za catty"
story = "Každá cenovka na Bowrington Road je za catty, pokud neříká jinak, a tiskárna cenovek trvá na tom, aby jí to někdo řekl pokaždé."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků ve tvaru `<NAME> <CENTS>`
nebo `<NAME> <CENTS> <UNIT>`.

Napiš `tag(name, cents, unit="catty")`, která vrací `<NAME> $<dollars>/<unit>`
