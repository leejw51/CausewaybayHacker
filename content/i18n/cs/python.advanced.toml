[[quest]]
id    = "python.advanced.09.comprehensions"
title = "Jedním průchodem po Bowrington Road"
story = "Alex říká, že to jde třemi cykly for. Ulička je široká na jednoho člověka a podlaha je mokrá; máš jeden průchod."
brief = '''
Na standardním vstupu je jeden řádek celých čísel oddělených mezerami.

Vypiš tři řádky:

1. součet sudých hodnot (`0`, pokud žádné nejsou)
2. každou hodnotu větší než `10`, zdvojenou, v pořadí, spojené jednotlivými
   mezerami — nebo `-`, pokud žádné nejsou
3. kolik je různých hodnot

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Použij comprehension, ne indexové cykly: generátorový výraz uvnitř `sum`,
list comprehension s `if` pro druhý řádek a set comprehension pro třetí.
`if` jde na konec a filtruje; výraz vpředu transformuje.

`" ".join(...)` chce řetězce, takže druhá comprehension musí vyrábět
`str(v * 2)`, ne `v * 2`. Ten `TypeError: sequence item 0: expected str
instance, int found` je ten, který na tomhle řádku potká každý.
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — generátorový výraz nepotřebuje další závorky, když je jediným argumentem.",
  "[str(v * 2) for v in nums if v > 10] — transformace vpředu, filtr vzadu.",
  "{v for v in nums} je set comprehension; set(nums) je totéž a tady je v pořádku obojí.",
]

