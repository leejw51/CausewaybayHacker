[[quest]]
id    = "python.advanced.05.dicts"
title = "Co tržnice křičí"
story = "Bowrington Road v sedm: každý stánek něco vyvolává a tabule na konci u Canal Road chce pořadí."
brief = '''
Načti celý standardní vstup a rozděl ho na bílých znacích.

Vypiš každé různé slovo jednou, jako `<word> <count>`, seřazené podle počtu
sestupně a při shodě podle slova vzestupně.

```
input:  tram tram bus
output: tram 2
        bus 1
```

Dict si pamatuje pořadí vkládání, a to není pořadí, které chceš. `sorted`
s `key`, který vrací n-tici, řadí podle prvního prvku a shody rozhoduje
podle druhého, a negace počtu je způsob, jak dostat sestupné pořadí v jednom
poli, zatímco druhé zůstane vzestupné.
'''
hints = [
  "Starter umře s KeyError na prvním slově: counts[word] += 1 čte dřív, než zapíše, a není co číst. counts.get(word, 0) dodá tu nulu.",
  "sorted(counts.items(), key=...) ti dá dvojice (word, count) v pořadí, o které sis řekl. Dict sám zůstává v pořadí vkládání.",
  "key=lambda item: (-item[1], item[0]) — počet sestupně, pak slovo vzestupně, v jedné n-tici.",
]

