# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.threads"
title = "Dvanáct stánků, jedno patro"
story = "12:30 v suterénu SOGO. Dvanáct stánků bere objednávky najednou a poslíček, který sbírá součty, čte tabuli dřív, než na ni kterýkoli z nich něco napsal."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Spusť pro každou hodnotu jedno `threading.Thread`, které spočítá její druhou
mocninu a uloží ji do `results[i]` — do vlastní přihrádky, takže žádná dvě
vlákna nezapisují na stejné místo. Každé vlákno `join`ni, pak vypiš výsledky
**v pořadí indexů**, jeden na řádek, a pak `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Vlákno nic nevrací. `Thread(target=f)` spustí `f` a její návratovou hodnotu
zahodí, a proto se výsledek musí zapsat někam, odkud ho hlavní vlákno po
`join` přečte. Seznam s přihrádkou na vlákno je nejjednodušší takové místo:
každý index zapisuje přesně jedno vlákno, takže není co zamykat.

Vlákna ve starteru všechna spadnou v okamžiku startu a program přesto
doběhne a vypíše. `target=square` bez `args=` zavolá `square()` bez ničeho,
`TypeError` dopadne ve vlákně a vypíše se na standardní chybový výstup, a
`results` zůstane plný `None`. Vlákno, které umře, vezme s sebou jen samo
sebe — čti stderr, jinak se to nikdy nedozvíš.
'''
hints = [
  "args=(i, v) na Threadu. Target se volá jako square(*args) a starter nepředává nic.",
  "Nejdřív spusť každé vlákno, pak každé joinni. Start a join ve stejné iteraci cyklu je správně a spouští je po jednom.",
  "results je uzávěr nad lokálním seznamem v main; vnořená funkce vidí tentýž seznam, a proto jsou zápisy po join vidět.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.lock"
title = "Jedna zásuvka, osm rukou"
story = "Každý stánek v suterénu platí do jedné pokladní zásuvky v kanceláři jídelního patra a při zavírání v ní nic není a každý stánek přísahá, že zaplatil."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Spusť pro každou hodnotu jedno vlákno, které ji přičte k **jednomu
sdílenému součtu** a zvýší sdílený počet zásahů. Všechna joinni, pak vypiš
`TOTAL <sum>` a `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

Starter vypíše `TOTAL 0`, deterministicky, s tracebackem na stderr z každého
workeru. `total += value` uvnitř workeru se `total` z main nedotkne: `int`
je neměnný, `+=` na něm jméno znovu naváže, a jméno přiřazené uvnitř funkce
je pro tu funkci **lokální**, pokud neřekne `nonlocal`. Každý worker si
udělal vlastní `total`, přičetl k němu a zahodil ho.

Oprava je kontejner, který workery mění na místě — jednoprvkový seznam nebo
malá třída — **a `Lock`**. Druhá půlka není nepovinná. GIL zaručuje, že
běží jeden bajtkód naráz; `drawer[0] += value` jsou tři bajtkódy (load, add,
store) a přepnutí vlákna mezi loadem a storem jednu aktualizaci ztratí. Ve
čtyřech vláknech sčítajících čtyři čísla se to nestane. Stane se to ve dvě
ráno se čtyřiceti.

`with lock:` ho vezme a cestou ven uvolní, včetně cesty ven přes výjimku.
'''
hints = [
  "Spusť starter: umře s UnboundLocalError, protože `total += value` dělá z total lokální proměnnou pay a čte ji dřív, než existuje. Ta chyba je celá diagnóza.",
  "Dict nebo seznam se mění na místě, takže `drawer[\"total\"] += value` mění ten jeden objekt, který všechna vlákna sdílejí. `nonlocal total` by fungoval také a je to druhá poctivá odpověď.",
  "threading.Lock() jednou v main, `with lock:` kolem čtení-úpravy-zápisu. GIL není zámek na tvých datech; je to zámek na interpretu.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.queue"
title = "Kdo zavře okénko"
story = "Pult s pečenou husou posílá každou objednávku okénkem do kuchyně a po té poslední tam kuchyně stojí a čeká na další, která nikdy nepřijde."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Jedno producentské vlákno dá každou hodnotu vynásobenou deseti na
`queue.Queue` a pak dá **sentinel**. Hlavní vlákno bere z fronty, dokud
neuvidí sentinel, každou hodnotu vypíše a vede si součet, pak vypíše
`SUM <total>` a `CLOSED`.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

`queue.Queue` nemá `close`. Nic na ní neumí konzumentovi říct, že už nic
dalšího nebude; musí to být položka a `None` je ta obvyklá. Starter ji nikdy
nepošle, takže `get()` blokuje navěky, když už není na co čekat, a runner
program zabije na časovém limitu. V Pythonu žádný detektor deadlocků není.
Program prostě přestane odpovídat a takhle zvenku vypadá „zaseknutí“.

Sentinel posílá producent. Nikdy konzument — strana, která ví, že proud
skončil, je strana, která ho ukončí.
'''
hints = [
  "Jeden řádek, na konci kitchen: hatch.put(None).",
  "Konzument už `is None` kontroluje. Čekal na něco, co producent nikdy neposlal.",
  "Kdyby hodnoty mohly legitimně být None, je sentinel soukromý objekt: SENTINEL = object(), porovnávaný přes `is`.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "python.advanced.04.thread-pool"
title = "Osm nosičů"
story = "Čtyřicet beden na nakládací rampě SOGO a osm nosičů. Nikdo nechce čtyřicet nosičů; chtějí, aby těch osm nikdy nestálo."
brief = '''
Na standardním vstupu jsou dvě celá čísla `w` a `n` a pak `n` hodnot.

Otevři `ThreadPoolExecutor` s `w` workery, přes `submit` zadej jednu úlohu na
hodnotu, která vrací `(index, value * value)`, a výsledky posbírej pomocí
`as_completed`. Seřaď podle indexu, vypiš `<index> <value>`, jedno na řádek,
a pak `WORKERS <w>`.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

`submit` vrací `Future`, ne výsledek. `as_completed` vrací futures v pořadí,
v jakém **doběhly**, což je pořadí, jaké se poolu zrovna zachtělo, a
`future.result()` je to, co z něj dostane hodnotu — nebo znovu vyhodí
výjimku, na kterou úloha umřela, což je druhý důvod, proč ho volat.

Starter vypisuje futures. Nést index ve výsledku je to, díky čemu je výstup
každý běh stejný; řazení podle něj je poslední řádek odpovědi, ne první.
'''
hints = [
  "Starter umře při rozbalování Future: `for index, value in sorted(results)` nemůže rozbalit objekt, který není n-tice. N-tice je uvnitř future.result().",
  "as_completed vydává úlohy tak, jak končí; index ve výsledku je jediný záznam o tom, odkud která přišla.",
  "with ThreadPoolExecutor(...) as pool: cestou ven počká na každou zadanou úlohu, takže při vypisování už nic neběží. pool.map by tu fungoval také a pořadí ti udrží sám, za cenu toho, že se nenaučíš as_completed.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "python.advanced.05.asyncio"
title = "Kde async doopravdy běží"
story = "Mei píše `async def` čtyři roky a ani jednou neviděla to, co to pohání. Objednávková tabule v suterénu má jednu smyčku a každý stánek se na ní střídá."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Napiš `async def double(value)`, která jednou předá řízení smyčce událostí —
`await asyncio.sleep(0)` — a vrátí hodnotu zdvojenou. Spusť všech `n`
pomocí `asyncio.gather`, vypiš každý výsledek v pořadí vstupu, pak
`SUM <total>` a `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

Zavolání `async def` ji nespustí. Postaví **objekt korutiny** a vrátí ho, a
nic uvnitř se nestane, dokud ho něco neawaitne. Seznam ve starteru jsou tři
korutiny, neawaitnuté, a Python to na stderr říká — `RuntimeWarning:
coroutine 'double' was never awaited` — zatímco výstup jsou tři řádky
`<coroutine object double at 0x...>`.

`gather` vezme korutiny, naplánuje je všechny na tu jednu smyčku a vrátí
jejich výsledky **v pořadí, v jakém jsi je předal**, ať doběhly v jakémkoli
pořadí. To je celý důvod, proč po něm sáhnout místo ručně psaného cyklu
`await`ů: cyklus by byl správně a sekvenční, `gather` je správně a
prokládaný.

Je tu přesně jedno vlákno. `await` je místo, kde korutina vrací vlákno
smyčce, aby ho mohla použít jiná. Nic neběží paralelně; věci běží
**po řadě**, na místech, kde řekly, že se mohou zastavit.
'''
hints = [
  "await asyncio.gather(*coroutines) — hvězdička rozprostře seznam do argumentů a await je to, co je spustí.",
  "asyncio.run(...) je exekutor: vytvoří smyčku, doběhne jednu korutinu do konce a smyčku zavře. Na program je jeden, úplně nahoře.",
  "gather vrací výsledky v pořadí argumentů. Kdybys je potřeboval tak, jak končí, je to asyncio.as_completed, a pak si index neseš sám, přesně jako u thread poolu.",
]

