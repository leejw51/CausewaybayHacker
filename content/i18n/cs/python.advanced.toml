id    = "python.advanced.08.exceptions"
title = "Řádek, který není číslo"
story = "Váha u stánku s rybami tiskne sloupec hmotností a uprostřed něj je něčí telefonní číslo."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků. Každý řádek má být celé
číslo.

Pro každý řádek vypiš buď hodnotu zdvojenou, nebo `BAD <line>`, pokud se
nedá načíst. Nakonec vypiš `SUM <total>`, kde total je součet hodnot, které
jsi vypsal.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")` vyhodí `ValueError`. To je jediný způsob, jak ti Python řekne, že
převod selhal — není žádný `Result`, žádné `(value, ok)`; selhání je
výjimka a kód, který čekal číslo, musí říct, co s tím udělá, pomocí
`try`/`except ValueError`.

Chytej **`ValueError`**, ne `Exception`. Holé `except:` by spolklo i
`KeyboardInterrupt` a překlep ve tvém vlastním kódu, a tak se programy učí
selhávat potichu.
