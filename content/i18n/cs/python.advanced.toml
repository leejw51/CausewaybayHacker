hints = [
  "Starter umře na xx s ValueError: invalid literal for int() with base 10. Ta hláška je výjimka, kterou chytáš.",
  "Blok try drž malý: dovnitř patří jen volání, které může selhat, a print i součet jdou až za něj.",
  "continue uvnitř except přeskočí zbytek těla cyklu pro ten řádek, takže špatný řádek nic nepřičte.",
]

