[[quest]]
id    = "python.advanced.04.strings"
title = "Bajty nejsou písmena"
story = "Orientační tabule v suterénu SOGO usekne 銅鑼灣 po třech bajtech a vypíše jeden znak a otazník."
brief = '''
Načti jeden řádek. Vypiš tři řádky:

1. jeho délku v **bajtech**, zakódovaného v UTF-8
2. jeho délku ve **znacích**
3. řádek se znaky v obráceném pořadí

```
input:  causeway
output: 8
        8
        yawesuac
```

Řádek může obsahovat znaky mimo ASCII a pak si první dvě čísla nejsou
rovna. `str` v Pythonu je posloupnost kódových bodů, takže `len` je počet
znaků; o bajty si musíš říct, přes `.encode("utf-8")`, a `len` **z toho** je
to druhé číslo.

`s[::-1]` obrátí řetězec. Je to řez s krokem `-1` a funguje na jakékoli
posloupnosti.
'''
hints = [
  "len(line) jsou znaky. len(line.encode(\"utf-8\")) jsou bajty. Starter vypisuje jako první to nesprávné.",
  "line[::-1] je celé obrácení. Řez ze str dává str.",
  "Obrácený bajtový řetězec by rozsekl vícebajtový znak napůl; obrácení str ne, protože str v sobě žádné bajty nemá.",
]

