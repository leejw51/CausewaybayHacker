# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.advanced.01.conversions"
title = "Tři podoby, jedno jméno"
story = "Sešit u stánku s rybami drží cenu jako text, jako číslo a jako dolary, a všem třem říká price."
brief = '''
Načti jeden řádek: částku v centech, jako číslice.

Vypiš tři řádky:

1. kolik znaků má oříznutý text
2. částku jako číslo
3. částku v dolarech s přesně dvěma desetinnými místy

```
input:  1234
output: 4
        1234
        12.34
```

Částka je nezáporná. Udělej to s **jedním jménem**, třikrát znovu
navázaným — `str`, pak `int`, pak zase `str`. Python dovolí, aby jméno drželo
cokoli a rozmyslelo si to; cena za to je, že nic ti neřekne, co `cents`
zrovna teď je, kromě přečtení kódu nad tím.

Na dolary nechoď přes `float`. `1234 / 100` je dnes `12.34`, ale
`0.1 + 0.2` je `0.30000000000000004` každý den. Celočíselné dělení a modulo
ti dají obě poloviny přesně a `f"{cents % 100:02d}"` tu druhou doplní nulou.
'''
hints = [
  "len(cents), dokud je cents ještě řetězec, je první řádek.",
  "cents = int(cents) není převod na místě; je to nová hodnota navázaná na staré jméno. Řetězec je po něm pryč.",
  ":02d uvnitř f-stringu je šířka dva, doplněno nulami, desítkově. 5 centů je 0.05, ne 0.5.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.advanced.02.control-flow"
title = "Která ulička"
story = "Čísla uliček na tržnici jsou namalovaná na podlaze a cedule u dveří má říkat, co se ve které uličce prodává. Říká pokaždé jen to číslo."
brief = '''
Načti jedno celé číslo `n`. Pro každé `i` od `1` do `n` vypiš jeden řádek:

* `FISHVEG`, pokud je `i` dělitelné třemi i pěti
* `FISH`, pokud je `i` dělitelné třemi
* `VEG`, pokud je `i` dělitelné pěti
* jinak samotné `i`

Pak čti dál celá čísla, jedno na řádek, dokud nenačteš `0`, a vypiš
`SKIPPED <k>` — kolik nenulových řádků jsi cestou přečetl.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

Dva cykly, dva druhy. První ví, kolikrát poběží, ještě než začne:
`for i in range(1, n + 1)`. Druhý to neví: `while True` s `break`, protože
o počtu rozhoduje to, co načteš. `range` v Pythonu se zastaví **před** svým
koncem a `range(1, n)` je chyba o jedničku, kterou tady každý jednou napíše.
'''
hints = [
  "Nejdřív otestuj případ „obojí“, jinak se nikdy nespustí. Dělitelné třemi a pěti znamená dělitelné patnácti.",
  "range(1, n) končí na n - 1. Starter tuhle chybu má; ukázkový výstup končí o řádek dřív.",
  "while True s break je způsob, jak Python zapisuje cyklus, jehož východ je uprostřed. Žádné do-while není.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.advanced.03.lists"
title = "Prostředek fronty"
story = "Čtyřicet lidí stojí frontu na pečenou husu v suterénu SOGO. Pult vidí začátek fronty a její konec a nic mezi tím."
brief = '''
Na standardním vstupu je na prvním řádku počet `n` a na druhém `n` celých
čísel oddělených mezerami.

Vypiš tři řádky: první hodnotu, poslední hodnotu a součet všeho ostře mezi
nimi. Při méně než třech hodnotách je ten součet `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` je prostředek: řez (slice), což je **nový seznam** — Python při
řezání kopíruje, na rozdíl od slice v Rustu nebo sub-slice v Go. `nums[-1]`
je poslední prvek a záporné indexy jsou celý důvod, proč v Pythonu nikdy
nepíšeš `nums[len(nums) - 1]`.

S jedinou hodnotou je `nums[1:-1]` prázdné a `sum` z něj je `0`, takže
ochrana, kterou ostatní jazyky potřebují, je tady zadarmo. To stojí za to
vědět — a stojí za to si to ověřit, ne předpokládat.
'''
hints = [
  "nums[-1] je poslední prvek; nums[-2] je ten před ním.",
  "nums[1:-1] je všechno kromě prvního a posledního a prázdný řez dá sám od sebe součet 0.",
  "sys.stdin.read().split() načte všechno naráz a rozdělí to na libovolných bílých znacích, takže na koncích řádků přestane záležet.",
]

