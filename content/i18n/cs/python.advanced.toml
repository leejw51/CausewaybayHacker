'''
hints = [
  "set(input().split()) postaví množinu rovnou z tokenů; duplicitní tofu zmizí už cestou dovnitř.",
  "a & b je průnik, a - b je rozdíl, a | b je sjednocení. len každého z nich je ten počet.",
  "\" \".join(sorted(both)) potřebuje řetězce — a to už jsou — a `if both else \"-\"` pokryje prázdný případ v jednom výrazu.",
]

