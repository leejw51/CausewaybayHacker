[[quest]]
id    = "cpp.hacker.32.modular"
title = "Modulo miliarda a sedm"
story = "Ta fráze stojí dole pod zadáním a půlka místnosti neví, co po nich chce."
brief = '''
Na standardním vstupu je `n q seed`. Vygeneruj `q` dotazů, v `std::uint64_t`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo
1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak
`LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic, takže se nikdy
nespočítá a pak nezredukuje — každé násobení se redukuje za pochodu. Problém
je dělení: `a! / (b! (a-b)!)` nemá v modulární aritmetice význam. Co ho
nahrazuje, je **modulární inverze**, a protože `1000000007` je prvočíslo,
dává ti ji malá Fermatova věta: `inverse(v) = v^(p-2) mod p`, spočítaná
rychlým umocňováním asi za třicet umocnění na druhou.

Takže: jednou předpočítej `factorial[0..=n]` a na každý dotaz odpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Spočítat každý koeficient zvlášť — vynásobit `b` členů,
vydělit `b` členy, jedna modulární inverze na každý — v pětisekundovém
limitu běhu nedoběhne; to je startovní kód. Jedna sdílená tabulka faktoriálů
doběhne hluboko pod sekundu. Obojí změřeno na tomto stroji.

Každý mezivýsledek je součin dvou hodnot pod `2^30`, takže se vejde do
`long long` a nic nepřeteče. S `int` by se nevešel — `int` je tu 32 bitů —
a to je ta druhá polovina toho, proč se tahle otázka klade.
'''
hints = [
  "Redukuj po každém násobení, nikdy až na konci. long long udrží součin dvou hodnot pod P; faktoriál neudrží.",
  "inverse(v) je power(v, P - 2) a funguje to jen proto, že P je prvočíslo — to je tady celý obsah malé Fermatovy věty.",
  "Předpočítání i inverzních faktoriálů, pozpátku od inverse(factorial[n]), odstraní dvě volání power() na dotaz. K projití to není potřeba a stojí za to to říct nahlas.",
]

