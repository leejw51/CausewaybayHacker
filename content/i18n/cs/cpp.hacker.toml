title = "Následuje T testovacích případů"
story = "Tvar, který používá každé výběrové kolo, a chyba, kterou každý kandidát napíše aspoň jednou: druhý případ si pamatuje první."
brief = '''
První řádek je `T`, počet nezávislých testovacích případů. Každý případ je
řádek s `n` a pak řádek s `n` celými čísly — a když je `n` rovno `0`, ten
