[[quest]]
id    = "cpp.hacker.20.bits"
title = "Ten, který je sám"
story = "Každý lístek je naskenovaný dvakrát kromě jednoho. Nedovolí ti použít hashovací mapu a nedovolí ti řadit."
brief = '''
První řádek je `n`. Druhý řádek je `n` nezáporných celých čísel, ve kterých se
každá hodnota objevuje přesně dvakrát kromě jedné.

Vypiš čtyři řádky:

1. hodnotu, která se objevuje jednou, nalezenou pomocí **xor** a s konstantní
   pamětí navíc
2. kolik bitů `1` je v ní nastavených
3. `POW2 YES`, pokud je to mocnina dvou, jinak `POW2 NO` (`0` není)
4. hodnotu s vynulovaným nejnižším nastaveným bitem, nebo `0`, pokud žádný
   nemá

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` a `x ^ 0 == x` a xor nezajímá, v jakém pořadí se děje. To je celý
první řádek. `x & (x - 1)` vynuluje nejnižší nastavený bit, což ti dá třetí
a čtvrtý řádek zadarmo. Dělej všechno v `unsigned long long`: posuny
a odčítání na typu se znaménkem mají okrajové případy a otázka není o nich.

Případy jsou tu malé a hodiny neměří rychlost. Žádný velký skrytý případ
není a ani být nemůže, pokud se staví tak, jak je staví tenhle balíček: pole,
které je dvojice plus jedna, se *konstruuje*, ne generuje, a dvě země by ho
nezkonstruovaly stejně. Tyhle případy tedy kontrolují ty čtyři řádky a jejich
okraje — `0` není mocnina dvou a hodnota bez nastavených bitů zůstane `0`,
když vynuluješ ten nejnižší. Xor je pořád odpověď; počítání výskytů ve
vnořené smyčce je `O(n²)` a při skutečném `n` umře.
'''
hints = [
  "Dvojice se navzájem vyruší, ať přijdou v jakémkoli pořadí, takže stačí jedno složení přes seznam.",
  "Počítání bitů vynulováním nejnižšího pokaždé proběhne jednou na nastavený bit, ne jednou na šířku. std::popcount v <bit> je jednořádková verze z C++20.",
  "Mocnina dvou má nastavený přesně jeden bit, takže vynulování nejnižšího nechá nulu — a samotnou nulu je třeba vyloučit ručně.",
