# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.hacker.17.lis"
title = "Nejdelší cesta vzhůru"
story = "Denní tržby, kolik jich chtějí jmenovat, a vyrobíš si je sám ze semínka. Chtějí nejdelší řadu zlepšujících se dní, a nemusí jít po sobě."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole
není — postavíš ho sám, **přesně** tímto generátorem, v aritmetice
`std::uint64_t`, která z definice přetéká dokola:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Vypiš délku nejdelší **ostře rostoucí podposloupnosti** — hodnoty si drží
pořadí, ale nemusí sousedit. Pak vypiš `TAILS <k>`, kde `k` je tatáž délka,
odečtená z počtu hromádek patience sortu.

```
input:  8 1
output: 3
        TAILS 3
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
a nejdelší cesta vzhůru v něm je `93944146 392341189 822192870`. Než začneš
hledat chybu v algoritmu, zkontroluj svůj generátor proti tomuhle řádku.

**Tenhle quest vynucuje svou složitost.** Startovní kód je tabulka `O(n²)` —
odpověď, kterou bys měl umět napsat z hlavy, a není špatná. Při
`n = 200000` vypíše totéž `881`, co vypíše ta rychlá. Vypíše ho **32.6 s**
po startu, proti pětisekundovému limitu běhu, takže uvidíš vypršení času,
ne špatnou odpověď. To je selhání, kvůli kterému tahle otázka existuje.

Ta `O(n log n)` si pro každou délku drží nejmenší hodnotu, na které může
podposloupnost té délky skončit — seznam, který je vždycky seřazený, takže
pozice nové hodnoty je binární vyhledávání a `std::lower_bound` je to
vyhledávání. `n = 200000` zvládne za **0.006 s**. Obojí změřeno na tomto
stroji, s těmi dvěma programy, které jsou v tomhle questu.

Jedna poznámka k šířkám, protože je to ta polovina otázky, kterou přidává
C++. Každá vygenerovaná hodnota je pod `2^30` a odpověď je nejvýš `n`, takže
`int` by udržel obojí — ale `x` generátoru musí být `std::uint64_t` a nic
jiného. Přetečení bez znaménka se z definice přetočí; přetečení **se
znaménkem** je nedefinované chování, takže `long long` tam kompilátoru dává
právo udělat cokoli, a `>> 33` na něm by byl aritmetický posun, a ne ten
logický, který tenhle generátor myslí. Generuj bez znaménka, převáděj až po
modulu.
'''
hints = [
  "tails není podposloupnost. Jeho délka je odpověď; jeho obsah jsou jen nejlepší koncové hodnoty.",
  "Ostře rostoucí znamená, že nahradíš první tail, který je >= hodnotě, což je přesně to, co vrací std::lower_bound.",
  "Pokud velký případ vyprší, s tvou odpovědí není nic špatně — odpovědí je tady tvar tvé smyčky. Dvě vnořené smyčky přes 200000 hodnot jsou 2 x 10^10 porovnání.",
]

