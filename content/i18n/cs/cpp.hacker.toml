Pro každý případ vypiš **druhou největší různou** hodnotu, nebo `NONE`, pokud
jsou různé hodnoty méně než dvě. Po všech vypiš `CASES <T>`.

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

Tohle je standardní obal soutěžních výběrových kol a kandidáti na něm padají
z jednoho důvodu: stav, který měl být pro každý případ zvlášť, byl
deklarovaný před smyčkou. Každý střádač, každý set, každé `best` patří
**dovnitř** `for`.

Čti po tokenech oddělených bílými znaky pomocí `>>`, ne po řádcích, a prázdný
řádek pro `n = 0` přestane být zvláštním případem úplně — a to je ta druhá
věc, kterou tenhle tvar učí.
'''
hints = [
  "Přesuň set dovnitř smyčky. To je celá oprava a je to celý quest.",
  "std::set je seřazený a bez duplikátů naráz, takže *std::next(rbegin()) je druhá největší různá hodnota.",
  "Nejdřív ohlídej size() < 2: std::next na reverzním iterátoru za konec je nedefinované, a v téhle zemi nedefinované neznamená chybovou hlášku.",
]

