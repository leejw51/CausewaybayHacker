# ---------------------------------------------------------------- 23
[[quest]]
id    = "cpp.hacker.23.prefix-sums"
title = "Kolika způsoby zasáhnout cíl"
story = "Den tržeb a číslo, které chce vidět auditor. Kolik úseků po sobě jdoucích hodin dá dohromady přesně tohle."
brief = '''
První řádek je `n k`. Druhý řádek je `n` celých čísel, která můžou být záporná.

Vypiš, kolik souvislých úseků má součet přesně `k`, pak `RANGE <s>`, součet
celého seznamu, odečtený z posledního prefixového součtu, ne novým sčítáním.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

Záporné hodnoty zabijí posuvné okno — okno, které je moc velké, se zmenšením
opravit nedá. Přežijí prefixové součty: úsek `i..j` má součet `k` právě tehdy,
když `prefix[j] - prefix[i] == k`, takže spočítej, kolik dřívějších prefixů se
rovná `prefix[j] - k`. Naplň mapu na začátku `0 → 1` kvůli úsekům, které
začínají na začátku.

Případy jsou tu malé a hodiny neměří rychlost, a není tu žádný případ, který
by odmítl dvojitou smyčku `O(n²)` — při skutečném `n` by byl. Tatáž dvojitá
smyčka přes 200000 hodnot je `2 × 10^10` sčítání a na tomto stroji trvá asi
šest sekund, proti pětisekundovému limitu běhu a proti jedinému průchodu
s hashovací mapou za setinu toho. Tyhle čtyři kontrolují záporné hodnoty
a úseky, které začínají na začátku, což jsou ta dvě místa, kde se tahle
odpověď doopravdy kazí. Složitost je na tvou čest.
'''
hints = [
  "Dřívější prefix vyhledej dřív, než zaznamenáš ten aktuální, jinak se úsek nulové délky započítá sám, když je k 0.",
  "seen[0] = 1 hned na začátku je to, co vůbec dovolí najít úsek, který začíná na indexu 0.",
  "Poslední prefix je celkový součet, takže druhý řádek nestojí nic navíc.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "cpp.hacker.24.inversions"
title = "Ten, který chytnou hodiny"
story = "První otázka odpoledního kola. Naivní odpověď je správná, a je to špatná odpověď — a v tomhle jazyce je dost rychlá na to, aby oklamala menší test."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole
není — postavíš ho sám, **přesně** tímto generátorem, v aritmetice
`std::uint64_t`, která z definice přetéká dokola:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Spočítej **inverze**: dvojice `i < j`, kde `a[i] > a[j]`. Vypiš počet, pak
`MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**Tenhle quest vynucuje svou složitost, a je to jediný druh, který to
dokáže.** Startovní kód je dvojitá smyčka `O(n²)` a v C++ je to past se
zvratem: při `-O2`, bez kontrol mezí v cestě, ji kompilátor vektorizuje a při
`n = 200000` — velikosti, kterou používají verze tohoto pohovoru v Rustu
a Go — doběhne za **1.5 s**, uvnitř pětisekundového limitu běhu. Proto je
skrytý případ v C++ `n = 1000000`. Tam je dvojitá smyčka `5 × 10^11`
porovnání a trvá **38 s**. Počítání inverzí během merge sortu je
`O(n log n)` a trvá **0.05 s**. Změřeno, na tomto stroji, s těmito dvěma
programy.

Dvě další věci za tebe rozhodne velký případ. Odpověď pro `n = 1000000` je
`250046540838`, což se do `int` nevejde — střádač špatné šířky je potichu
špatně, ne pomalý. A generátor se musí přetočit, ne přetéct: `std::uint64_t`
se z definice přetočí, `long long` se znaménkem by bylo nedefinované chování
a kompilátor by s ním směl udělat cokoli.
'''
hints = [
  "Maximum vezmi před řazením, nebo řaď kopii. Merge sort ti pole pod rukama přeuspořádá.",
  "Když v merge vyhraje hodnota zprava, každý zbývající prvek levé poloviny je větší než ona — to je mid - left inverzí naráz a je to celý trik.",
  "Fenwickův strom nad komprimovanými hodnotami je ta druhá odpověď O(n log n) a stojí za to ji v místnosti jmenovat; merge sort je pod hodinami méně kódu.",
]

