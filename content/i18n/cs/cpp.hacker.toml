[[quest]]
id    = "cpp.hacker.34.stable-sort"
title = "Shody drží své místo"
story = "Dva jezdci skončili se stejným skóre a žebříček je při každém překreslení seřadí jinak."
brief = '''
Na standardním vstupu je `n buckets seed`. Postav `n` jezdců, kde jezdec `i`
má index `i` a skóre:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď jezdce podle skóre **sestupně**. Jezdci se stejným skóre si musí
zachovat pořadí, v jakém přišli. Vypiš jejich indexy oddělené mezerou, pak
`TIES <k>` — kolik sousedních dvojic ve tvém seřazeném pořadí má stejné
skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda, a odpověď je téměř celá
rozhodnutá tím, co se se shodami stane.

**Tohle je quest o tom, vědět, které řazení držíš v ruce.** `std::sort`
**není stabilní** — nedává žádný slib o pořadí stejných prvků a na skutečném
vstupu ho viditelně neudrží: je to introsort a jeho krok rozdělení běžně
prohazuje stejné prvky přes pivot. `std::stable_sort` stabilní je, je to
merge sort a za ten slib stojí trochu paměti. Startovní kód používá
`std::sort` s komparátorem, který se dívá jen na skóre, a skryté případy jsou
dost velké, aby je prokazatelně zamíchal. (Při `n = 8` knihovna přejde na
řazení vkládáním a náhodou pořadí udrží — a proto by malý test nic
nedokázal a proto je malý případ tady ten *viditelný*, ne ten, který tě
posuzuje.)

Správné odpovědi jsou dvě a měl bys umět dát obě. Použij
`std::stable_sort`. **Nebo** nech `std::sort` a udělej porovnání **úplné** —
skóre sestupně, pak index vzestupně — takže se žádné dva prvky nikdy
neporovnají jako stejné a stabilita přestane být otázkou. Po té druhé sáhni
ve výchozím stavu; nestabilní řazení nemá co dokazovat, když je pořadí úplně
určené.
'''
hints = [
  "Jedno slovo: std::sort se změní na std::stable_sort. To je ta stabilní odpověď.",
  "Druhá odpověď nechá std::sort a porovnává (skóre sestupně, pak index vzestupně) — úplné uspořádání, takže nezbudou žádné shody, u kterých by mohlo být nestabilní.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal kteroukoli z obou — prozradí tě pořadí indexů.",
