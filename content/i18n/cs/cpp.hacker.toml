id    = "cpp.hacker.33.grid-paths"
title = "Přes blok, nikdy zpátky"
story = "Rozvozová mřížka se třemi ulicemi zavřenými kvůli bambusovému lešení. Kolika způsoby napříč a která cesta je nejlevnější."
brief = '''
Na standardním vstupu je `r c pct seed`. Mřížku si postav sám, po řádcích,
a pro každé pole vytáhni **dvě** hodnoty:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Pohybuj se jen **doprava** nebo **dolů**, přes volná pole. Vypiš:

1. `PATHS <k>` — kolik různých tras vede z `(0,0)` do `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — nejmenší celkovou cenu trasy, včetně obou koncových bodů,
   nebo `-1`, pokud žádná trasa není

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

Jeden průchod po řádcích udělá obojí: trasy do pole jsou součet tras do něj
shora a zleva a jeho nejlepší cena je jeho vlastní cena plus levnější z těch
dvou. Protože se pohybuješ jen doprava nebo dolů, ta dvě pole, která
potřebuješ, jsou vždycky už hotová — a proto to nepotřebuje žádnou rekurzi
a žádnou množinu navštívených.

Počet `PATHS` se bere modulo `1000000007` z obvyklého důvodu: na skrytém
případu `1000 × 1000` má skutečné číslo přes šest set číslic. Redukuj za
pochodu sčítání.

**Co velký případ vynucuje:** odmítne každou odpověď, která trasy
vyjmenovává. Je jich víc, než je v místnosti atomů. Nerozliší tabulku zdola
nahoru od rekurze s memoizací — obě jsou lineární v počtu polí a obě projdou
s rezervou.
'''
