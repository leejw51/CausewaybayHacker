id    = "cpp.hacker.27.commands"
title = "Problém je ten vstup"
story = "Log pokladny vypadne ze stroje zalomený na osmdesát sloupců a počet nahoře je počet příkazů, ne slov."
brief = '''
První řádek je `k`, počet **příkazů**, které následují. Příkazy jsou tokeny
oddělené bílými znaky, nacpané přes zbylé řádky tak, jak se zrovna zalomily —
libovolný počet na řádek, libovolné mezery, možná prázdný řádek na konci.

| příkaz | tokeny | účinek |
| --- | --- | --- |
| `ADD <cents>` | dva | vlož položku |
| `VOID` | jeden | odstraň poslední položku, nebo nedělej nic, pokud žádná není |
| `TOTAL` | jeden | vypiš aktuální součet |
| `CLEAR` | jeden | odstraň všechno |

Po `k` příkazech vypiš `COMMANDS <k>` a `ITEMS <how many are left>`.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
