# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.hacker.28.lru"
title = "Linker"
story = "Room 7-32, třetí pohovor, poslední otázka. Jazyk bez záchranné sítě, kratší hodiny a cache, která musí vyhodit tu správnou věc."
brief = '''
První řádek je `cap q`. Dalších `q` řádků je `PUT <key> <value>` nebo
`GET <key>`.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle
nepoužitý** záznam. `GET` i `PUT` se oba počítají jako použití klíče.

Pro každý `GET` vypiš hodnotu, nebo `-1`, pokud tam není. Na konci vypiš
přeživší klíče, naposledy použitý první, oddělené mezerou — nebo `-`, pokud
je cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá z `1` zase nedávný klíč, takže když `PUT 3`
potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá z `3`
ten nejnovější, a proto se přeživší vypíšou jako `3 1`.

Učebnicová odpověď je hashovací mapa do **obousměrně zřetězeného seznamu**
a C++ má tu skutečnou věc: `std::list`, jehož iterátory zůstávají platné, když
se jiné prvky vkládají, mažou nebo přesouvají pomocí splice — to je ta jediná
záruka, kterou `std::vector` dát nemůže, a celý důvod, proč mapa může jako
hodnotu držet `std::list::iterator`. `push_front`, `splice` na začátek,
`back` a `pop_back` jsou všechny O(1), takže každá operace tady je O(1)
a můžeš to říct bez vytáček.

Dvě věci, které je třeba udělat správně a na které se pohovor v Rustu neptal.
Uzel seznamu drží klíč **i** hodnotu, protože vyhazování začíná ze seznamu
a musí vědět, který záznam mapy smazat. A na pořadí těch dvou mazání záleží:
nejdřív přečti klíč z `back()`, smaž ho z mapy, *pak* `pop_back` — opačně je
to čtení přes iterátor na uzel, který už neexistuje, a to je ta věc, o které
tahle země je od Poledního děla.

Případy jsou tu malé a hodiny neměří rychlost: čtyři operace nedokážou
rozlišit `std::list` od `std::vector`, který procházíš odpředu. `O(1)`
v odstavci výše je věta, kterou řekneš nahlas v místnosti, takže musí platit
o kódu, který jsi napsal, ne o kódu, který náhodou prošel čtyřmi případy.
'''
hints = [
  "recent.splice(recent.begin(), recent, it) přesune uzel, na který it ukazuje, na začátek, v O(1), a it potom pořád ukazuje na tentýž uzel. Na téhle operaci stojí celý návrh.",
  "Přepsání klíče, který už tam je, není vyhození — zkontroluj mapu dřív, než rozhodneš, že je cache plná.",
  "Vyhození: vezmi back().first, smaž ten klíč z mapy, pak pop_back. Po pop_back je iterátor, který mapa držela, visící, takže záznam mapy musí jít první.",
  "Procházení seznamu odpředu dozadu už je naposledy použitý první, takže poslední řádek nepotřebuje žádné řazení.",
]
