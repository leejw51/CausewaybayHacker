# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.hacker.01.two-sum"
title = "Dvě jízdenky"
story = "Room 7-32, potřetí. První otázka je ta, kterou dostane každý, a tentokrát ti kompilátor neřekne, když se spleteš."
brief = '''
První řádek je `n target`. Druhý řádek je `n` celých čísel.

Vypiš indexy `i j` (**od 1**) dvou různých položek, které dají dohromady
`target`, jako `i j` s `i < j`. Pokud vyhovuje víc dvojic, dej tu, jejíž
druhý index je nejmenší; pokud je i tak shoda, nejmenší první index. Pokud
nevyhovuje žádná dvojice, vypiš `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

Skryté případy jsou tu malé: kontrolují rozhodnutí při shodě a případ bez
odpovědi, ne tvou rychlost. Otázka je pořád ta lineární — jeden průchod,
jedna `std::unordered_map` — protože skutečné `n` je 200000 a vnořená smyčka
je přesně to, co má tahle otázka vytřídit. Napiš odpověď, na kterou se otázka
ptá, ne tu, která náhodou projde těmito čtyřmi případy.
'''
hints = [
  "Jeden průchod. Pro každou hodnotu se zeptej, jestli už bylo viděno target minus ona.",
  "seen.emplace(x, j) neudělá nic, pokud tam x už je, což u opakované hodnoty zachová první index — rozhodnutí při shodě, které zadání žádá.",
  "Vypiš a vrať se ve chvíli, kdy ji najdeš — první zásah při procházení už je nejmenší druhý index.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.hacker.02.window"
title = "Bez opakování"
story = "Druhá otázka je na tabuli dřív, než stihneš odložit fixu."
brief = '''
Jeden řádek textu, bez mezer.

Vypiš délku nejdelšího úseku znaků, ve kterém se nic neopakuje, a pak ten
úsek samotný. Pokud je několik úseků stejně dlouhých, vypiš ten nejvíc vlevo.

```
input:  abcabcbb
output: 3
        abc
```

Okno se vždycky posouvá jen doprava. Pokud zjistíš, že po opakování znovu
procházíš od začátku, napsal jsi tu kvadratickou verzi.

Případy jsou tu malé a hodiny neměří rychlost. Ani nemůžou: na náhodném
řetězci verze, která prochází znovu, nikdy nemá víc než pár znaků k znovu
projití, než narazí na opakování, takže doběhne stejně rychle jako okno, při
jakékoli velikosti — změřeno na tomto stroji při `n = 200000`, ne
předpokládáno. Tyhle čtyři případy kontrolují délku, rozhodnutí při shodě
nejvíc vlevo a samotný úsek. Napiš okno i tak. Je `O(n)` na každém vstupu,
ne jen na většině z nich, a vstup, který ti dá skutečné výběrové kolo, je
vybraný tak, aby nebyl laskavý.
'''
hints = [
  "Drž index, kde byl každý znak naposledy viděn, a index, kde okno začíná.",
  "Opakování má význam, jen když je jeho poslední pozice uvnitř aktuálního okna — to je ten test previous >= start.",
  "Zaznamenej nejlepší délku a kde začínala, jinak úsek na konci nevypíšeš; substr(start, len) udělá zbytek.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.hacker.03.intervals"
title = "Rozpis směn"
story = "Podají ti rozpis směn strojovny čerpadel a ptají se, které hodiny jsou skutečně pokryté."
brief = '''
První řádek je `n`. Dalších `n` řádků je `<start> <end>` se `start <= end`.

Slij každou dvojici, která se překrývá nebo dotýká, a vypiš výsledek ve
vzestupném pořadí, jeden `<start> <end>` na řádek, pak `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Dotyk se počítá jako překryv: `1 4` a `4 5` se slijí do `1 5`.
'''
hints = [
  "Nejdřív seřaď podle začátku — std::sort na vektoru dvojic to už dělá. Potom stačí jeden průchod zleva doprava.",
  "Prodluž poslední slitý interval, když je nový začátek <= jeho konci; jinak vlož nový.",
  "Prodlužuj na max(last.end, end) — krátký interval pohlcený dlouhým ho nesmí zkrátit.",
]

