        COMMANDS 5
        ITEMS 1
```

`k` počítá příkazy a `ADD` je jeden příkaz ze dvou tokenů — takže smyčka,
která proběhne `k`-krát a v každém kole přečte jeden token, se zastaví na
špatném místě. Přečti `k` příkazů a argument vytáhni, jen když ho příkaz má.

`VOID` na prázdné pokladně i `TOTAL` dřív, než se cokoli přidalo, musí
fungovat. V zadání není žádný řádek, který by říkal, že se to stát nemůže,
a ve skutečném výběrovém kole je to mlčení specifikace. `pop_back()` na
prázdném `std::vector` je nedefinované chování — ne výjimka, ne operace,
která nic neudělá — takže podmínku musíš napsat ty.
'''
hints = [
  "operator>> přeskočí každý úsek mezer, tabulátorů a nových řádků, takže zalomení v souboru přestane hrát roli ve chvíli, kdy přestaneš číst řádky.",
  "Argument ADD vytáhni uvnitř větve ADD, ze stejného proudu. Čítač smyčky počítá příkazy, ne tokeny.",
  "Ohlídej pop_back pomocí empty(). Na prázdném vektoru je to nedefinované chování a ten jediný případ, kdy se zdá, že to funguje, je ten jediný, kdy se to netestuje.",
