[[quest]]
id    = "cpp.hacker.29.dijkstra"
title = "Ne každá ulice je stejně dlouhá"
story = "Každá mapa, kterou jsi dosud splnil, počítala skoky. Tramvaj nezajímá, kolik je zastávek; zajímá ji, jak dlouho trvají."
brief = '''
Na standardním vstupu je `n m seed`: `n` zastávek, `m` neorientovaných
ohodnocených hran. Graf si postav sám, **přesně** tímto generátorem,
v `std::uint64_t`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Vypiš součet nejkratších vzdáleností ze zastávky `0` do každé dosažitelné
zastávky (včetně samotné `0`, která je `0`), pak `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**Složitost se tu vynucuje.** Skrytý případ je `n = 200000`, `m = 400000` —
dvojnásobek velikosti, kterou používají pohovory v Rustu a Go, protože C++
spouští špatnou odpověď tak rychle, že při `n = 100000` přistane přímo na
pětisekundové čáře a prošla by nebo neprošla podle počasí. Dijkstra je
správný algoritmus tak či tak; hodiny rozhodují o prioritní frontě. Projít
každý nenavštívený uzel kvůli minimu je `O(V²)` a při `n = 200000` to trvá
**35 s** proti pětisekundovému limitu běhu. Binární halda z toho udělá
`O((V + E) log V)` a doběhne za **0.09 s**. Obojí změřeno na tomto stroji,
s těmi dvěma programy, které jsou v tomhle questu: startovní kód je ta
procházející verze.

Stojí za to to vidět jasně, protože je to nejčastější způsob, jak neprojít
výběrovým kolem na čas: **startovní kód není špatně.** Vypíše přesně správnou
odpověď. Odmítnutý je jen proto, že dorazí sedmkrát pozdě.

`std::priority_queue` je max-halda, takže ji deklaruj s `std::greater` nad
dvojicí `(distance, node)`. Nemá decrease-key a ty ho nepotřebuješ: vlož
zlepšenou vzdálenost jako nový záznam a přeskoč každý vyjmutý záznam, jehož
vzdálenost je už horší než ta, kterou máš zaznamenanou. To přeskočení
„zastaralého záznamu“ je řádek, na který lidé zapomínají, a bez něj halda
roste bez omezení.
'''
hints = [
  "std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>> s Entry = pair<distance, node>: dvojice se řadí nejdřív podle vzdálenosti a greater max-haldu obrátí.",
  "if (d > dist[u]) continue; je přeskočení zastaralého záznamu. Bez něj je algoritmus pořád správný a halda se plní zastaralými záznamy.",
  "Polovina generátoru s kostrou zaručuje, že je dosažitelný každý uzel, takže filtr na INF ve skutečnosti nikdy nic neodstraní — nech ho tam i tak, protože verze téhle otázky s nedosažitelným uzlem je ta doplňující.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "cpp.hacker.30.range-queries"
title = "Součty, které se pořád mění"
story = "Čtyři miliony operací pokladny z jednoho dne napříč celým řetězcem, polovina z nich opravy, a někdo chce průběžné součty."
brief = '''
Na standardním vstupu je `n q seed`. Postav pole `n` hodnot a pak proveď `q`
operací, vše z téhož generátoru, v `std::uint64_t`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

Vypiš průběžný součet odpovědí na všechny dotazy, pak `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**Složitost se tu vynucuje, a dalo to práci.** Naivní odpověď — projít rozsah
pro každý dotaz — je `O(n)` na dotaz a kompilátor ji vektorizuje do něčeho
překvapivě rychlého. Malé případy ji nechytí. Proto je velký skrytý případ
`n = 500000, q = 4000000`, kde naivní odpověď sáhne řádově na `10^11` prvků
a v pětisekundovém limitu běhu nedoběhne, zatímco Fenwickův strom zvládne
celé hluboko pod sekundu. Obojí změřeno, s těmi dvěma programy v tomhle
questu.

Poučení je to, na které tazatel rybaří: *bodová aktualizace, součet rozsahu*
je přesně ten tvar, pro který Fenwickův strom existuje. Tři krátké funkce —
add, prefix a range jako rozdíl dvou prefixů — a `i & -i` je způsob, jak
krokovat o nejnižší nastavený bit. Drž index pro ten výraz se znaménkem; na
typu bez znaménka je `-i` přetočení, které náhodou dá stejné bity a není to
věc, kterou bys chtěl v místnosti vysvětlovat.
'''
hints = [
  "Strom postav voláním add jednou na každou počáteční hodnotu. Stavba zdola nahoru v O(n) je pěkná optimalizace a není to, co hodiny testují.",
  "i & -i izoluje nejnižší nastavený bit. Přičtením jdeš stromem nahoru; odečtením dolů.",
  "range(l, r) je prefix(r + 1) - prefix(l) a trefit tu dvojici chyb o jedna je většina ladění.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.hacker.31.palindrome"
title = "Pozpátku stejné"
story = "Otázka z první dvacítky, v nějaké podobě položená na většině výběrových kol, a ta, kterou většina lidí jednou napsala a nikdy nepochopila."
brief = '''
Na standardním vstupu je `n alphabet seed`. Řetězec si postav sám:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

Vypiš délku nejdelšího palindromického podřetězce, pak `AT <index>` —
začátek (od 0) toho **nejvíc vlevo** s touto délkou.

```
input:  12 3 5
output: 5
        AT 1
```

Rozšiřuj kolem každého středu. Středů je `2n - 1`, ne `n`: každý znak je
středem pro palindromy liché délky a každá mezera mezi dvěma znaky je středem
pro ty sudé délky. Zapomenout na mezery je důvod, proč správně vypadající
řešení vrátí na `abba` hodnotu `1`, a je to přesně to, co dělá startovní kód.

**Co testy vynucují a co ne**, na rovinu. Skrytý případ, který odvede práci,
je `n = 20000` nad **jednopísmennou** abecedou. Je to nejhorší případ pro
rozšiřování kolem středu — každý střed běží až na konec řetězce — takže
správná odpověď tam udělá celé své `O(n²)` a stejně doběhne za pár setin
sekundy. Je to zároveň to, co odmítne
projdi-každý-podřetězec-a-každý-otestuj, což je kubické a do pěti sekund se
nevrátí.

Ten druhý velký případ, `n = 20000` nad dvoupísmennou abecedou, je případ
**správnosti**, ne rychlosti. Na náhodném binárním řetězci test palindromu
selže po znaku nebo dvou, takže ho projde i kubická odpověď. Kontroluje, že
tvůj generátor a tvé rozhodnutí o indexu nejvíc vlevo se ve velkém shodují
s našimi.

Jedna poctivá výhrada, protože je to ten druh věci, na který by tazatel
zatlačil: to, co jednopísmenný případ odmítá, je projdi-*každý*-podřetězec.
Přidej jediný řádek, který přeskočí každý podřetězec, jenž není delší než
dosud nalezený nejlepší, a tatáž kubická smyčka projde oběma velkými případy
— na tomhle vstupu to prořezání srazí na `O(n²)`. Testy tedy odmítají naivní
kubickou odpověď, ne každý program, který je v nejhorším případě kubický.

Takže: testy odmítají kubické a přijímají kvadratické. **Nevyžadují**
Manacherův algoritmus, což je odpověď `O(n)`. Věz, že existuje a co dělá,
protože „a zvládneš to líp než kvadraticky?“ je doplňující otázka, kterou tahle
otázka obvykle připravuje.
'''
hints = [
  "Dvě volání na střed: (c, c) pro liché délky a (c, c + 1) pro sudé. Startovnímu kódu chybí to druhé.",
  "Když se smyčka zastaví, i a j se oba posunuly o jedna za palindrom — takže začíná na i + 1 a jeho délka je j - i - 1.",
  "Aktualizuj jen při ostře delším palindromu a z každé délky ti zůstane ten nejvíc vlevo, což je to, na co se ptá AT.",
]

