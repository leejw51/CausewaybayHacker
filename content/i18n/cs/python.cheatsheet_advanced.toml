id    = "python.cheatsheet_advanced.05.three-layers"
title = "DO TŘETICE VŠEHO DOBRÉHO"
story = "Kurýr na Lockhart Road zazvoní třikrát, než to vzdá, a dispečer to pravidlo zapojí dál bez cukru v podobě @."
brief = '''
