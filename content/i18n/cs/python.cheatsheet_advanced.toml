id    = "python.cheatsheet_advanced.01.yield-from"
title = "KRABICE V KRABICÍCH"
story = "Zásilka do bytu nad Jardine's Bazaar: kartony v kartonech, a python chce každou položku na podlaze, jednu po druhé."
brief = '''
`flatten` musí být generátor, který vydá každý list libovolně vnořeného
