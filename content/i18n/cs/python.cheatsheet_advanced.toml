    def deco(fn):
        def inner(*a, **kw):
            ...
        return inner
    return deco
```

`fetch` je už definována bez jakéhokoli dekorátoru. Převažte `fetch` ručně
tak, aby se opakovala třikrát — totéž, co by udělalo `@retry(3)`.
'''
hints = [
  "Jsou tu tři vrstvy. Vnější volání bere číslo a vrací skutečný dekorátor; funkce jde do něj.",
]

