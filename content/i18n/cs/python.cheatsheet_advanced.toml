id    = "python.cheatsheet_advanced.27.all-at-once"
title = "TŘI NARÁZ, NE JEDNA PO DRUHÉ"
story = "Tři rozvozy objednané z bytu na Lockhart Road, každý jízda na jednu sekundu; objednat je jeden po druhém znamená, že python čeká tři."
brief = '''
`fetch(u)` je `async def`, která awaitne `asyncio.sleep(1)` a vrátí
`u`. Uvnitř `async def main()`, spouštěné přes `asyncio.run(main())`, udělejte z
`results` seznam výsledků pro `urls` v pořadí — všechna tři stažení
**souběžně**, aby `main` trvalo zhruba jednu sekundu, ne tři.
'''
hints = [
  "Awaitnout každou korutinu po řadě je serializuje. Kombinátor bere awaitovatelné objekty jako samostatné argumenty, ne jako jeden seznam, a sám musí být awaitnut.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "python.cheatsheet_advanced.28.generic-first"
title = "PRVNÍ Z ČEHOKOLI"
story = "Lékárna na Hennessy Road chce jedno `first`, které funguje na polici s pilulkami i na polici s náplastmi, a štítek musí říct, co dostalo."
brief = '''
Python 3.12. `from collections.abc import Sequence` je provedeno a **žádný**
`TypeVar` nebyl nikde deklarován. Napište řádek `def` generické
funkce `first`, která bere `Sequence[T]` a vrací `T`, s `T` deklarovaným
na funkci samotné.
'''
hints = [
  "3.12 dovoluje funkci deklarovat vlastní typový parametr, v hranatých závorkách hned za jejím jménem.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "python.cheatsheet_advanced.29.shared-bag"
title = "SÁČEK, KTERÝ SE NIKDY NEVYPRÁZDNÍ"
story = "Výchozí \"nový sáček\" v dai pai dongu je jeden sáček, vyrobený jednou, když se tiskl jídelní lístek — a každá objednávka, která mu věří, v něm najde hůlky od minulého stolu."
brief = '''
`add(x, xs)` připojí `x` k `xs` a vrátí `xs`. Zavoláno dvakrát bez
druhého argumentu, `add(1)` a pak `add(2)` musí dát `[1]` a pak
`[2]` — pokaždé čerstvý seznam. Tělo před připojením nahradí **vynechané**
`xs` novým prázdným seznamem. Který řádek `def` je správný?
'''
hints = [
  "Výchozí hodnota se vyhodnotí jednou, v čase `def`, a sdílí ji každé volání. Použijte sentinel a seznam postavte uvnitř.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "python.cheatsheet_advanced.30.late-binding"
title = "TŘI VRÁTNÍ, JEDNO ČÍSLO"
story = "Třem vrátným na Jaffe Road bylo řečeno \"pamatuj si své číslo\" — ale všichni si pamatují jméno toho čísla, a do zavíračky je to pro všechny 2."
brief = '''
Postavte `fs`, seznam tří funkcí bez argumentů, tak, aby
`[f() for f in fs]` bylo `[0, 2, 4]` — každá zdvojnásobí to `i`, se kterým
byla vyrobena.
'''
hints = [
  "Uzávěr (closure) hledá `i` až při zavolání, a to už je cyklus u konce. Výchozí argument se vyhodnotí v okamžiku, kdy lambda vzniká.",
]
