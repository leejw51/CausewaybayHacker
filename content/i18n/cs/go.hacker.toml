[[quest]]
id    = "go.hacker.20.lis"
title = "Nejdelší cesta vzhůru"
story = "Zase rok denních tržeb. Tentokrát chtějí nejdelší řadu zlepšujících se dní, a nemusí jít po sobě."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole
není — postavíš ho sám, **přesně** tímto generátorem, v aritmetice `uint64`,
která v Go přetéká bez jakýchkoli okolků:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007
```

Vypiš délku nejdelší **ostře rostoucí** podposloupnosti — pořadí zůstává,
sousednost se nevyžaduje. Pak vypiš `TAILS <k>`, totéž číslo přečtené z počtu
hromádek.

```
input:  8 1
output: 3
        TAILS 3
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
a `93944146 392341189 822192870` je jeden z nejdelších výstupů v něm.

**Tahle ulice vynucuje svou složitost.** Jeden skrytý případ je `n = 200000`.
Tabulka `O(n²)` — pro každou hodnotu se ohlédnout po všech předchozích — je ta,
kterou musíš umět napsat zpaměti, a je to přesně to, co je ve startovním kódu:
`2 × 10^10` porovnání, třicet devět sekund proti pětisekundovému limitu běhu.
Verze s hromádkami si pro každou délku pamatuje nejmenší hodnotu, na které
podposloupnost té délky může skončit — slice, který je vždycky setříděný, takže
umístit novou hodnotu je binární vyhledávání. To je `O(n log n)` a tentýž případ
vrátí za jedenáct milisekund. Změřeno, na tomto stroji, s těmi dvěma programy,
které jsou v této ulici.

Odpověď na ten případ je `881`, což je zhruba `2√n`. Takhle vypadá nejdelší
výstup v seznamu náhodných hodnot a stojí za to si to odnést do místnosti: je to
způsob, jak víš, že tvůj vlastní výstup nedává nesmysl, dřív než ti to řekne
tazatel.
'''
hints = [
  "tails není podposloupnost. Jeho délka je odpověď; jeho obsah jsou jen nejlepší koncové hodnoty.",
  "Ostře rostoucí znamená, že nahradíš první tail, který je >= value, takže podmínka hledání je tails[mid] < value.",
  "Vyběhnout za konec tails znamená, že tahle hodnota prodlužuje dosud nejdelší řadu — přidej ji pomocí append.",
]

