brief = '''
První řádek je `cap q`. Dalších `q` řádků je `PUT <key> <value>` nebo
`GET <key>`.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle
nepoužitou** položku. `GET` i `PUT` se oba počítají jako použití klíče.

Pro každý `GET` vypiš hodnotu, nebo `-1`, pokud chybí. Na konci vypiš
přeživší klíče, naposledy použitý první, oddělené mezerami — nebo `-`, pokud
je cache prázdná — pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi ukázku krok za krokem: `GET 1` udělá `1` zase čerstvou, takže když
`PUT 3` potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` trefí a udělá
z `3` naposledy použitou, a proto se přeživší vypíšou jako `3 1`.

Učebnicová odpověď je hashovací mapa do **obousměrně zřetězeného seznamu**
a Go jeden má ve standardní knihovně: `container/list`. `PushFront`,
