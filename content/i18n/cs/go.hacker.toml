[[quest]]
id    = "go.hacker.05.brackets"
title = "Kde se to rozbilo"
story = "Konfigurační soubor na projektoru a tazatel se neptá, jestli je rozbitý, ale který znak ho rozbil."
brief = '''
Jeden řádek složený jen z `(`, `)`, `[`, `]`, `{`, `}`.

Vypiš `VALID` a pak `0`, pokud je každá závorka uzavřena svým vlastním druhem
ve správném pořadí.

Jinak vypiš `INVALID` a pak **index od 1** provinilého znaku:

* uzavírací závorka, která neodpovídá tomu, co je otevřené — vlastní index
  té uzavírací
* uzavírací závorka, když není nic otevřené — vlastní index té uzavírací
* něco na konci řádku zůstalo otevřené — index poslední stále otevřené
  závorky

```
input:  ([]{})
output: VALID
        0
```
'''
hints = [
  "Na zásobník vkládej index každé otevírací závorky, ne znak — index potřebuješ, abys ho ohlásil.",
  "Uzavírací závorka je špatně, když je zásobník prázdný, nebo když znak na vrcholovém indexu není její partner.",
  "Pokud smyčka skončí a na zásobníku něco zbylo, jeho vrchol je poslední neuzavřená závorka.",
]

