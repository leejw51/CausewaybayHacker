[[quest]]
id    = "go.hacker.03.intervals"
title = "Rozpis směn"
story = "Zase rozpis v Lucky Mac a otázka je pořád stejná: které hodiny jsou skutečně pokryté."
brief = '''
První řádek je `n`. Dalších `n` řádků je `<start> <end>` se `start <= end`.

Slij každou dvojici, která se překrývá nebo dotýká, a vypiš výsledek ve
vzestupném pořadí, jeden `<start> <end>` na řádek, pak `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Dotyk se počítá jako překryv: `1 4` a `4 5` se slijí do `1 5`.
'''
hints = [
  "Nejdřív seřaď podle začátku. Potom stačí jeden průchod zleva doprava.",
  "merged[last].end je adresovatelné, protože merged je slice struktur, ne ukazatelů — přiřazuj rovnou do něj.",
  "Prodluž na větší z obou konců; krátký interval uvnitř dlouhého ho nesmí zkrátit.",
]

