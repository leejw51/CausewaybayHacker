[[quest]]
id    = "go.hacker.07.anagrams"
title = "Stejná písmena"
story = "Stránka názvů zastávek s promíchanými písmeny. Seskup ty, které jsou stejný název."
brief = '''
První řádek je `n`. Druhý řádek je `n` slov malými písmeny oddělených
mezerami.

Seskup slova, která jsou navzájem anagramy. Vypiš každou skupinu na jeden
řádek, její slova seřazená vzestupně a spojená jednotlivými mezerami. Skupiny
seřaď podle jejich prvního slova, vzestupně. Pak vypiš `GROUPS <k>`.

Opakované slovo zůstává ve své skupině dvakrát.

```
input:  6
        eat tea tan ate nat bat
output: ate eat tea
        bat
        nat tan
        GROUPS 3
```

Klíč je slovo se seřazenými písmeny. Dvě slova jsou anagramy přesně tehdy,
když se jejich klíče rovnají, a to je vyhledání v mapě, ne porovnání se vším,
co jsi dosud viděl.
'''
hints = [
  "sort.Slice nad []byte(word) a pak zpět string(...) ti dá klíč.",
  "append do groups[k] funguje i na chybějícím klíči: nulová hodnota slice je nil a append si s nil poradí.",
  "Seřazení spojených řádků řadí podle prvního slova, protože každý řádek prvním slovem začíná.",
]

