[[quest]]
id    = "go.hacker.09.linked-list"
title = "Řetěz"
story = "Chtějí to bez slice. Uzly, které ukazují na uzly, protože o ten tvar v té otázce doopravdy jde."
brief = '''
První řádek je `n`. Druhý řádek je `n` celých čísel, v pořadí.

Postav z nich jednosměrně zřetězený seznam `*Node` — v řešení žádný slice —
a pak vypiš tři řádky:

1. seznam obráceně, oddělený mezerami
2. hodnotu v prostředním uzlu (pro sudé `n` ten druhý ze dvou)
3. `LEN <n>` spočítané průchodem seznamu

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

Střed je běžec: jeden ukazatel po jednom kroku, druhý po dvou, a když tomu
rychlému dojde seznam, ten pomalý je na místě. Jeden průchod, a tytéž dva
ukazatele odhalí cyklus, kdyby se tě někdy zeptali.
'''
hints = [
  "Stavět odzadu dopředu je ten snadný směr: každý nový uzel si vezme starou hlavu jako Next.",
  "Ulož si cursor.Next dřív, než ho přepíšeš, jinak je zbytek seznamu pryč.",
  "Posuň slow jednou za každé dva kroky, které fast zvládne; když je fast nebo fast.Next nil, zastav.",
]

