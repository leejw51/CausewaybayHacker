[[quest]]
id    = "go.hacker.04.islands"
title = "Kolik je bloků"
story = "Plán čtvrti na tabuli. Spočítej bloky a pak jim řekni, který je největší."
brief = '''
První řádek je `r c`. Dalších `r` řádků je plán: `#` je budova, `.` je ulice.

Dvě buňky `#` jsou ve stejném bloku, pokud se dotýkají nahoře, dole, vlevo
nebo vpravo — ne diagonálně.

Vypiš, kolik je bloků, a pak kolik buněk má ten největší. Prázdný plán je `0`
a `0`.

```
input:  4 5
        ##...
        ##...
        ..#..
        ...##
output: 3
        4
```

Projdi každou buňku jednou. Když najdeš nenavštívené `#`, zaplav z něj celý
blok pomocí fronty a průběžně ho počítej.
'''
hints = [
  "Označ buňku jako viděnou, když ji vkládáš do fronty, ne když ji vybíráš, jinak se do fronty dostane několikrát.",
  "queue = queue[1:] je tady jako dequeue v pořádku — podkladové pole se uvolní, jakmile je celý blok hotový.",
  "grid[r][c] indexuje řetězec, takže je to bajt: porovnávej s '#', ne s \"#\".",
]

