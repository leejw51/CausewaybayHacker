[[quest]]
id    = "go.hacker.08.kth-largest"
title = "K-tý největší"
story = "Zahřívací kolo, a stejně chtějí haldu, ne řazení."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádný
seznam není — postavíš si ho sám, **přesně** tímto generátorem, v aritmetice
`uint64`, která v Go přetéká bez jakýchkoli okolků:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

k = n / 2 + 1
```

To dělení je celočíselné, takže `1 <= k <= n` platí, ať je `n` jakkoli malé.

Vypiš `k`-tou největší **hodnotu** — duplicity se počítají, takže v `3 3 1` je
2. největší `3`. Pak vypiš `HEAP <size>`, počet prvků, které jsi držel, když
jsi skončil.

```
input:  8 1
output: 189567123
        HEAP 5
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`
a `k` je `5`. Pět největších je po řadě
`908834774 822192870 708211027 392341189 189567123`, takže odpověď je poslední
z nich a v ruce máš pět hodnot.

**Co velký případ vynucuje a co ne.** Jeden skrytý případ je `n = 200000`,
kde `k` je `100001`. Odmítne odpověď, která `k`-krát projde celý seznam a
pokaždé z něj vytáhne největší hodnotu: to je `O(nk)`, `2 × 10^10` porovnání,
čtyřicet pět sekund proti pětisekundovému limitu běhu — a je to přesně to, co
dělá startovní kód. **Neodmítne** ale seřazení celého seznamu: `n log n` je
rychlé a sort tudy projde s přehledem. Jestli píšeš sort, řekni to nahlas;
předstírat, že ho odmítly hodiny, je horší.

Odpověď, na kterou se ptají, je **min-halda velikosti k**: každou hodnotu
vlož, a když halda přeroste `k`, jednu vyhoď — na konci je kořen ta odpověď.
Je to `O(n log k)`, drží `k` hodnot místo `n` a velký případ vrátí za dvacet
pět milisekund. Obě čísla změřena na tomto stroji, s těmi dvěma programy,
které jsou v této ulici.

`container/heap` je pět metod na sliceovém typu: `Len`, `Less`, `Swap`,
`Push`, `Pop`. `Push` a `Pop` berou ukazatelový receiver, ostatní tři ne — a
právě tahle asymetrie je to, co pod hodinami splete každého.
'''
hints = [
  "Push a Pop jsou surové operace nad slicem — append a useknutí konce. heap.Push a heap.Pop jsou ty, které prosívají.",
  "Nikdy nevolej h.Push přímo; volej heap.Push(h, v), jinak se invariant haldy neobnoví.",
  "Po smyčce je nejmenší z k největších na indexu 0, a to je k-tý největší celkově.",
]

