[[quest]]
id    = "go.hacker.10.tree-walk"
title = "Třikrát kolem stromu"
story = "Strom na tabuli a otázka, nad kterou by nikdo neměl přemýšlet dvakrát: pojmenuj tři pořadí."
brief = '''
První řádek je `n`. Druhý řádek je `n` hodnot v **pořadí po úrovních**, kde
`-1` znamená „tady uzel není“ — strom je tedy uložený jako halda: děti indexu
`i` jsou `2i+1` a `2i+2`.

Vypiš čtyři řádky: průchody **preorder**, **inorder** a **postorder**, každý
oddělený mezerami, a pak `DEPTH <d>` — počet uzlů na nejdelší cestě od kořene
k listu.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

Preorder je uzel, levý, pravý. Inorder je levý, uzel, pravý. Postorder je
levý, pravý, uzel. Jedna rekurzivní funkce zvládne všechny tři; posouvá se
jen místo, kde je append.
'''
hints = [
  "out je *[]int64, protože append může realokovat — obyčejný parametr []int64 by zápisy ztratil.",
  "Základní případ jsou obě podmínky najednou: za koncem slice, nebo na -1.",
  "Hloubka je 1 + hlubší dítě, a 0 pro chybějící uzel.",
]

