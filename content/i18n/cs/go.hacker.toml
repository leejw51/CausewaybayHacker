# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.hacker.01.two-sum"
title = "Dvě jízdenky"
story = "Stejná místnost, stejná první otázka, a tentokrát ji chtějí v Go."
brief = '''
První řádek je `n target`. Druhý řádek je `n` celých čísel.

Vypiš indexy `i j` (**od 1**) dvou různých položek, které dají dohromady
`target`, jako `i j` s `i < j`. Pokud vyhovuje víc dvojic, dej tu, jejíž
druhý index je nejmenší; pokud je i tak shoda, nejmenší první index. Pokud
nevyhovuje žádná dvojice, vypiš `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

Skryté případy jsou tu malé: kontrolují rozhodnutí při shodě a případ bez
odpovědi, ne tvou rychlost. Otázka je pořád ta lineární — jeden průchod,
jedna hashovací mapa — protože skutečné `n` je 200000 a vnořená smyčka je
přesně to, co má tahle otázka vytřídit. Napiš odpověď, na kterou se otázka
ptá, ne tu, která náhodou projde těmito čtyřmi případy.
'''
hints = [
  "Jeden průchod. Pro každou hodnotu se zeptej mapy, jestli už viděla target minus tuhle hodnotu.",
  "U opakované hodnoty zaznamenej jen první index — to je rozhodnutí při shodě, které zadání žádá.",
  "Tvar comma-ok je celý idiom: i, ok := seen[k].",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.hacker.02.window"
title = "Nejkratší úsek"
story = "Kolik nejméně po sobě jdoucích zastávek pokryje vzdálenost. Chtějí počet zastávek a pak to, kde začíná."
brief = '''
Na standardním vstupu jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole
není — postavíš ho sám, **přesně** tímto generátorem, v aritmetice `uint64`,
která v Go přetéká bez jakýchkoli okolků:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407
    next value = (x >> 33) % 1000000007

s = (sum of all n values) / 2
```

To dělení je celočíselné, a je to také důvod, proč odpověď vždycky existuje:
celé pole na `s` z podstaty své konstrukce dosáhne.

Najdi nejkratší souvislý úsek, jehož součet je nejméně `s`. Vypiš jeho délku
a pak jeho počáteční index od 1. Pokud je několik úseků stejně krátkých,
vezmi ten nejvíc vlevo.

```
input:  8 1
output: 3
        3
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`,
jeho součet je `3330417819`, takže `s` je `1665208909` a tři hodnoty od indexu
`3` jsou nejkratší úsek, který na něj dosáhne.

**Tahle ulice vynucuje svou složitost.** Jeden skrytý případ je `n = 500000`.
Ve startovním kódu je poctivá kvadratická odpověď — z každého začátku jdi
dopředu, dokud součet nedosáhne `s` — a protože `s` je polovina celkového
součtu, každá taková procházka je dlouhá asi `n / 2` prvků. To je řádově
`10^11` sčítání a proti pětisekundovému limitu běhu to trvá třicet osm sekund.
Když se oba konce posouvají jen doprava, je to `O(n)` — každý prvek se jednou
přičte a jednou odečte — a tentýž případ se vrátí za sedm milisekund. Změřeno,
na tomto stroji, s těmi dvěma programy, které jsou v této ulici.

Případ je `n = 500000` a ne `200000` proto, že vnitřní smyčka je jediné sčítání
s předčasným ukončením a přesně na tohle je překladač dobrý: na `200000`
kvadratická odpověď pořád doběhne za šest sekund, což je na limit příliš blízko,
než aby to byla závora.

Součet je při té velikosti kolem `2.5 × 10^14`. Sčítej ho do `int64`. V tomhle
64bitovém sestavení je `int` v Go 64 bitů, takže s obyčejným `int` ti to
projde — právě proto musí ten návyk přijít od tebe, ne od překladače.
'''
hints = [
  "Veď průběžný součet. Přičti nums[right] jednou za krok a nikdy ho nepřepočítávej.",
  "Zužuj zleva, dokud by vypuštění nejlevějšího prvku ještě nechalo okno na s nebo nad.",
  "Nové nejlepší zaznamenej jen u ostře kratšího úseku, aby ti z každé délky zůstal ten nejvíc vlevo.",
]

