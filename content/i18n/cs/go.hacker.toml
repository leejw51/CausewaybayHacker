story = "Tvar, který používá každé výběrové kolo, a chyba, kterou každý kandidát napíše aspoň jednou: druhý případ si pamatuje první."
brief = '''
První řádek je `T`, počet nezávislých testovacích případů. Každý případ je
řádek s `n` a pak řádek s `n` celými čísly — a když je `n` rovno `0`, je ten
druhý řádek prázdný.

Pro každý případ vypiš **druhou největší různou** hodnotu, nebo `NONE`, pokud
jsou méně než dvě různé hodnoty. Po všech vypiš `CASES <T>`.

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

Tohle je standardní obal soutěžních výběrových kol a kandidáty potápí
z jednoho důvodu: stav, který měl být na každý případ zvlášť, byl
deklarován před smyčkou. Každý akumulátor, každá mapa, každé `best` patří
**dovnitř** `for`.

`bufio.Scanner` se `ScanWords` čte po tokenech, ne po řádcích, a prázdný
řádek pro `n = 0` přestává být zvláštním případem úplně — což je druhá věc,
kterou tenhle tvar učí.
'''
hints = [
  "Přesuň mapu dovnitř smyčky. To je celá oprava a je to celá ulice.",
  "map[int64]struct{} je idiomatická množina; struct{} nezabírá místo a říká `jen členství`.",
  "Procházení mapy je záměrně neuspořádané, takže posbírej a seřaď, než můžeš mluvit o `druhé největší`.",
