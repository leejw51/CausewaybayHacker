[[quest]]
id    = "go.hacker.31.palindrome"
title = "Pozpátku stejné"
story = "Otázka z první dvacítky, v nějaké podobě položená na většině výběrových kol, a ta, kterou většina lidí jednou napsala a nikdy nepochopila."
brief = '''
Na standardním vstupu je `n alphabet seed`. Řetězec si postav sám:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

Vypiš délku nejdelšího palindromického podřetězce, pak `AT <index>` —
začátek (od 0) toho **nejlevějšího** z té délky.

```
input:  12 3 5
output: 5
        AT 1
```

Rozšiřuj kolem každého středu. Středů je `2n - 1`, ne `n`: každý znak je
středem pro palindromy liché délky a každá mezera mezi dvěma znaky je středem
pro ty sudé délky. Zapomenout na mezery je důvod, proč správně vypadající
řešení vrátí `1` na `abba`.

**Co testy vynucují a co ne**, na rovinu. Skrytý případ, který dělá tu práci,
je `n = 20000` nad **jedno**písmennou abecedou. Je to nejhorší případ pro
rozšiřování kolem středu — každý střed doběhne až na konec řetězce — takže
správná odpověď tam odvede celé své `O(n²)` a přesto doběhne asi za desetinu
sekundy. Zároveň je to, co odmítne odpověď `O(n³)`, zkontroluj-každý-
podřetězec-a-každý-otestuj: ta proti pětisekundovému limitu běží ještě po
dvaceti sekundách.

Druhý velký případ, `n = 20000` nad dvoupísmennou abecedou, je případ na
**správnost**, ne na rychlost. Na náhodném binárním řetězci test na palindrom
selže po jednom dvou znacích, takže ho i kubická odpověď zvládne pod sekundu.
Kontroluje, že tvůj generátor a tvé rozhodování o nejlevějším indexu souhlasí
s našimi ve velkém. Nekontroluje, že jsi byl rychlý. Obě čísla změřena na
tomto stroji.

Takže: testy odmítají kubickou a přijímají kvadratickou. **Nevyžadují**
Manacherův algoritmus, což je odpověď `O(n)`. Věz, že existuje, protože
„a umíš to lépe než kvadraticky?“ je doplňující otázka, kvůli které se tahle
otázka obvykle pokládá.
'''
hints = [
  "Dvě volání na střed: (c, c) pro liché délky a (c, c+1) pro sudé. Ve startovním kódu to druhé chybí.",
  "Když se smyčka zastaví, i a j se obě posunuly o jedna za palindrom — takže začíná na i+1 a jeho délka je j-i-1.",
  "Aktualizuj jen u ostře delšího palindromu a z každé délky si nech ten nejvíc vlevo, což je to, na co se AT ptá.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "go.hacker.32.modular"
title = "Modulo miliarda a sedm"
story = "Ta fráze stojí dole pod zadáním a půlka místnosti neví, co po nich chce."
brief = '''
Na standardním vstupu je `n q seed`. Vygeneruj `q` dotazů:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo 1000000007**.
Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak
`LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic, takže se nikdy
nespočítá a pak nezredukuje — každé násobení se redukuje průběžně. Problém je
dělení: `a! / (b! (a-b)!)` nemá v modulární aritmetice žádný význam. Co ho
nahrazuje, je **modulární inverze**, a protože `1000000007` je prvočíslo,
dává ti ji malá Fermatova věta: `inverse(v) = v^(p-2) mod p`, spočítaná
rychlým umocňováním asi ve třiceti umocněních na druhou.

Takže: předpočítej jednou `factorial[0..n]` a každý dotaz zodpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**Složitost je tu vynucená.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Počítat každý koeficient nezávisle — vynásobit `b` členů,
vydělit `b` členy, jedna modulární inverze na každý — nedoběhne
v pětisekundovém limitu běhu; to je startovní kód. Jedna sdílená tabulka
faktoriálů doběhne hluboko pod sekundu. Obojí změřeno na tomto stroji.

Každý mezivýsledek je součin dvou hodnot pod `2^30`, takže se vejde do
`int64` a nic nepřeteče. `int` v Go je tu 64 bitů, ale napiš `int64` a mysli
to vážně — verze této otázky, která poběží někde jinde, tak velkorysá nebude.
'''
hints = [
  "Redukuj po každém násobení, nikdy až na konci. int64 pojme součin dvou hodnot pod P; nepojme faktoriál.",
  "inverse(v) je power(v, P-2) a funguje to jen proto, že P je prvočíslo — to je tady celý obsah malé Fermatovy věty.",
  "Předpočítání i inverzních faktoriálů, pozpátku od inverse(factorial[n]), odstraní dvě volání power na dotaz. K projití to není potřeba a stojí za to to říct nahlas.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "go.hacker.33.grid-paths"
title = "Přes blok, nikdy zpátky"
story = "Rozvozová mřížka se třemi ulicemi zavřenými kvůli bambusovému lešení. Kolika způsoby napříč a která cesta je nejlevnější."
brief = '''
Na standardním vstupu je `r c pct seed`. Mřížku si postav sám, po řádcích,
a pro každou buňku vytáhni **dvě** hodnoty:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Pohybuj se jen **doprava** nebo **dolů**, přes volné buňky. Vypiš:

1. `PATHS <k>` — kolik různých cest vede z `(0,0)` do `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — nejmenší celkovou cenu cesty, včetně obou koncových bodů,
   nebo `-1`, pokud žádná cesta není

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

Jeden průchod po řádcích zvládne obojí: cesty do buňky jsou součet cest do ní
shora a zleva a její nejlepší cena je její vlastní cena plus levnější z těch
dvou. Protože se vždy pohybuješ jen doprava nebo dolů, jsou ty dvě buňky,
které potřebuješ, vždy už hotové — žádná rekurze, žádná množina navštívených.

Počet `PATHS` je modulo `1000000007` z obvyklého důvodu: na skrytém případu
`1000 × 1000` má skutečné číslo přes šest set číslic. Redukuj při sčítání.

**Co velký případ vynucuje:** odmítne každou odpověď, která cesty vyjmenovává.
Je jich víc než atomů v místnosti. Nerozlišuje tabulku zdola nahoru od
memoizované rekurze — obě jsou lineární v počtu buněk a obě pohodlně projdou.
'''
hints = [
  "Vytáhni obě hodnoty pro každou buňku, včetně obou rohů — generátor je nepřeskakuje, jen je odmítá zablokovat.",
  "Volná buňka bez volného souseda nahoře ani vlevo je dosažitelná nula cestami a nemá nejlepší cenu; nech inf znamenat `nedosažitelné` a ohlídej sčítání.",
  "Cíl může být volný a přesto nedosažitelný, což je přesně případ, kdy PATHS je 0 a MIN je -1. Jeden ze skrytých případů je takový.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "go.hacker.34.stable-sort"
title = "Shody drží své místo"
story = "Dva jezdci skončili se stejným skóre a žebříček je při každém překreslení seřadí jinak."
brief = '''
Na standardním vstupu je `n buckets seed`. Postav `n` jezdců, kde jezdec `i`
má index `i` a skóre:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď jezdce podle skóre **sestupně**. Jezdci se stejným skóre si musí
zachovat pořadí, v jakém přišli. Vypiš jejich indexy oddělené mezerami, pak
`TIES <k>` — kolik sousedních dvojic v tvém seřazeném pořadí má stejné skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda, a odpověď je téměř celá
určena tím, co se s nimi stane.

**Tohle je ulice o tom, vědět, který sort držíš v ruce.** `sort.SliceStable`
je stabilní — stejné prvky si zachovají vzájemné pořadí. `sort.Slice` **není**
a na skutečném vstupu to viditelně nezachová: je to pattern-defeating
quicksort, obvykle je rychlejší a o shodách neslibuje vůbec nic. Startovní
kód ho používá a skryté případy jsou dost velké, aby je prokazatelně
zamíchal. (Při `n = 8` se to náhodou nestane — a proto by malý test nic
nedokázal a proto je tu malý případ ten *viditelný*, a ne ten, který tě
posuzuje.)

Správné odpovědi jsou dvě a měl bys umět dát obě. Použij `sort.SliceStable`.
**Nebo** si nech `sort.Slice` a udělej porovnání **úplné** — když jsou skóre
stejná, porovnej index, takže se žádné dva prvky nikdy neporovnají jako
stejné a stabilita přestane být otázkou. Ta druhá je to, po čem sáhnout
standardně; nestabilní sort nemá co dokazovat, když je pořadí plně určeno.

Moderní zápisy jsou `slices.SortFunc` a `slices.SortStableFunc`, jejichž
porovnání vrací záporné číslo, nulu nebo kladné číslo místo `bool` —
`cmp.Compare` je to, které ti dá přesně `-1`, `0` nebo `1`. Jsou generické,
ne reflektivní, takže jsou rychlejší, a totéž rozlišení stability platí se
stejnými dvěma jmény. Znej obojí — tenhle balíček píše `sort`, protože to je
to, co budeš číst ve většině Go, které ti někdo předá.
'''
hints = [
  "Jedno slovo: ze sort.Slice se stane sort.SliceStable. To je stabilní odpověď.",
  "Druhá odpověď si nechá sort.Slice a při stejném skóre porovná index — úplné uspořádání, takže nezbudou žádné shody, u kterých by bylo co dělat nestabilně.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal kteroukoli z těch dvou — prozradí tě pořadí indexů.",
]

