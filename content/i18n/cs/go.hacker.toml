[[quest]]
id    = "go.hacker.13.permutations"
title = "Každé pořadí"
story = "Vypiš každé pořadí, v jakém můžou jezdci vyrazit. Všechna, ve slovníkovém pořadí, a žádné neopakuj."
brief = '''
