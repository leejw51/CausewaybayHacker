[[quest]]
id    = "go.hacker.29.dijkstra"
title = "Ne každá ulice je stejně dlouhá"
story = "Každá mapa, kterou jsi dosud splnil, počítala skoky. Tramvaj nezajímá, kolik je zastávek; zajímá ji, jak dlouho trvají."
brief = '''
Na standardním vstupu je `n m seed`: `n` zastávek, `m` neorientovaných
ohodnocených hran. Graf si postav sám, **přesně** tímto generátorem,
v `uint64` (které v Go přetéká bez jakýchkoli okolků):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Vypiš součet nejkratších vzdáleností ze zastávky `0` do každé dosažitelné
zastávky (včetně samotné `0`, která je `0`), pak `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**Složitost je tu vynucená.** Jeden skrytý případ je `n = 100000`,
`m = 200000`. Dijkstra je správný algoritmus tak či tak; o čem rozhodují
hodiny, je prioritní fronta. Projít každý nenavštívený uzel kvůli minimu je
`O(V²)` — `10^10` porovnání a proti pětisekundovému limitu běhu to trvá
šestnáct sekund. Binární halda z toho udělá `O((V + E) log V)` a stejný
případ se vrátí za čtyřicet čtyři milisekund. Obojí změřeno na tomto stroji,
s těmi dvěma programy, které se s touto ulicí dodávají: startovní kód je ta
prohledávací verze a dostane správnou odpověď — jen třikrát pozdě.

`container/heap` nad slicem `{dist, node}`, řazeným podle `dist`. Žádné
decrease-key neexistuje a nepotřebuješ ho: vlož zlepšenou vzdálenost jako
nový záznam a přeskoč každý vybraný záznam, jehož vzdálenost je už horší než
ta, kterou máš zaznamenanou. To přeskočení zastaralého záznamu je řádek, na
který lidé zapomínají.
'''
hints = [
  "Less porovnává dist, takže container/heap ti dá min-haldu přímo — žádné Reverse není potřeba, na rozdíl od BinaryHeap v Rustu.",
  "`if cur.dist > dist[cur.node] { continue }` je přeskočení zastaralého záznamu. Bez něj je algoritmus pořád správný a halda se plní zastaralými záznamy.",
  "Polovina generátoru s kostrou zaručuje, že každý uzel je dosažitelný, takže filtr na inf nikdy nic neodstraní — stejně ho tam nech, protože verze s nedosažitelnými uzly je ta doplňující otázka.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "go.hacker.30.range-queries"
title = "Součty, které se pořád mění"
story = "Čtyři miliony operací pokladny z jednoho dne napříč celým řetězcem, polovina z nich opravy, a někdo chce průběžné součty."
brief = '''
Na standardním vstupu je `n q seed`. Postav pole `n` hodnot a pak spusť `q`
operací, všechno ze stejného generátoru:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r] inclusive) to a running total
```

Vypiš průběžný součet všech odpovědí na dotazy, pak `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**Složitost je tu vynucená, a dalo to práci.** Naivní odpověď — pro každý
dotaz projít rozsah smyčkou — je `O(n)` na dotaz a kompilátor z té smyčky
udělá něco překvapivě rychlého. Malé případy ji nechytnou. Velký skrytý
případ je proto `n = 500000, q = 4000000`, kde naivní odpověď sáhne řádově
na `10^11` prvků a nedoběhne v pětisekundovém limitu běhu, zatímco Fenwickův
strom zvládne celou věc asi za desetinu sekundy. Obojí změřeno, s těmi dvěma
programy v této ulici.

*Bodová aktualizace, součet přes rozsah* je přesně ten tvar, pro který
Fenwickův strom existuje. Tři krátké metody — add, prefix a range jako
rozdíl dvou prefixů — a `i & -i` je způsob, jak krokovat po nejnižším
nastaveném bitu.
'''
hints = [
  "Strom postav voláním Add jednou na každou počáteční hodnotu. Stavba zdola nahoru v O(n) je pěkná optimalizace a není to, co hodiny testují.",
  "i & -i izoluje nejnižší nastavený bit. Jeho přičtení jde stromem nahoru; odečtení jde dolů.",
  "Range(l, r) je Prefix(r+1) - Prefix(l) a trefit tuhle dvojici chyb o jedničku je většina ladění.",
]

