[[quest]]
id    = "go.hacker.11.bst"
title = "Je to opravdu BST"
story = "Doplňující otázka. Každý zkontroluje dvě děti a každý to má napoprvé špatně."
brief = '''
Stejné kódování po úrovních jako v minulé ulici: `-1` je chybějící uzel, děti
`i` jsou `2i+1` a `2i+2`.

První řádek je `n q`. Druhý řádek je `n` hodnot stromu. Třetí řádek je `q`
hodnot dotazů.

Vypiš `VALID` nebo `INVALID` — každá hodnota v levém podstromu ostře menší než
uzel, každá hodnota v pravém ostře větší. Pak jeden řádek na dotaz:
`<value> FOUND <depth>` s kořenem v hloubce 1, nebo `<value> ABSENT`.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Kontrola `left < node < right` v každém uzlu **nestačí** — hodnota hluboko
v levém podstromu může být pořád větší než nějaký předek. Místo toho nes dolů
otevřený interval.

Vyhledání je **sestup BST**, ne prohledání celého stromu: od kořene jdi
doleva, když je cíl menší, a doprava, když je větší, a zastav, když
vypadneš. Na `INVALID` stromu může ten sestup projít rovnou kolem hodnoty,
která v poli sedí — a přesto musí ohlásit `ABSENT`, protože sestup je jediné,
co vyhledání v BST smí stát. Jeden skrytý případ je přesně takový strom.
'''
hints = [
  "Předávej dolů otevřený interval. Kořen dostane celý rozsah int64; levé dítě dostane (low, node), pravé dítě (node, high).",
  "Chybějící uzel je triviálně platný — základní případ vrací true.",
  "Vyhledání je binární hledání: menší jde doleva, jinak doprava, a hloubka je počet skoků, které to stálo.",
]

