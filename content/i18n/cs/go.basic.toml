# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.int-slices"
title = "Kus jízdního řádu"
story = "Kurýr si vezme z denního jízdního řádu druhou a třetí zastávku, se kterými bude pracovat, a kopie v telefonu jsou dvě nuly."
brief = '''
`xs[1:3]` je okno na druhý a třetí prvek — stejná paměť, ne kopie.
`copy(dst, src)` přesune hodnoty do řezu, který jsi udělal pomocí `make`,
takže `dst` je vlastní; a `append` ho zvětší. Změň potom `dst` a `xs` se
nepohne.

```
copy(dst, xs[1:3])
dst = append(dst, 99)
```

`xs` se načte ze stdin a `dst` je `make([]int, 2)`. Napiš copy a append
místo dvou zástupných řádků; vytiskne se `dst` a nedotčené `xs`.

```
input:  1 2 3 4 5
output: [2 3 99]
        [1 2 3 4 5]
```
'''
hints = [
  "copy(dst, xs[1:3]) a potom dst = append(dst, 99).",
  "copy naplní tolik prvků, kolik má kratší strana; dst byl vytvořen s místem pro dva.",
