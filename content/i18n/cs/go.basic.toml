# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.basic.18.nil-and-order"
title = "Nullptr"
story = "11:55 u přední pokladny Lucky Mac. Každá objednávka projde, některé z nich neexistují, a pokladna je stejně čte."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků. Každý je buď
`<NAME> <CENTS>`, nebo samotné `-`, což znamená, že objednávka nikdy
nedorazila: nil `*Order` ve slice.

Vypiš skutečné objednávky seřazené podle centů **sestupně**, při shodě podle
jména vzestupně, jako `<NAME> <CENTS>`. Pak vypiš `NIL <count>` — kolik jich
chybělo.

```
input:  4
        SET 2800
        -
        PIE 900
        TEA 1200
output: SET 2800
        TEA 1200
        PIE 900
        NIL 1
```

Každý nil se musí najít dřív, než ho cokoli dereferencuje, včetně porovnávací
funkce, kterou předáš `sort.Slice`. To je celý boss.
'''
hints = [
  "Nil *Order ve slice je v pořádku, dokud z něj něco nečte pole. Nejdřív filtruj, pak řaď.",
  "strings.Fields na \"-\" dá jedno pole, takže len(fields) < 2 je tvůj test chybějící objednávky.",
  "Sestupně je > ve funkci less; rozhodnutí při shodě je druhé porovnání za ním.",
]
