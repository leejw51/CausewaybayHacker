[[quest]]
id    = "go.basic.16.lambdas"
title = "Jen sudé dveře"
story = "Senzory na nástupišti v Admiralty hlásí každé dveře, model chce jen ty se sudým číslem umocněné a sečtené, a tablet má filter a map, do kterých není nic zapojené."
brief = '''
Funkční literál se dá předat přímo do jiné funkce jako argument, úplně
beze jména. `filter` ponechá prvky, kterým `func(int) bool` řekne ano;
`mapInts` každý prvek nahradí tím, co `func(int) int` vrátí. Obě jsou
napsané nad `main`; ty dodáš jen ty dva literály.

```
evens := filter(xs, func(x int) bool { return x%2 == 0 })
squares := mapInts(evens, func(x int) int { return x * x })
```

Napiš dvě volání: ponech sudá čísla, pak je umocni na druhou. Jejich součet
se sečte a vypíše za tebe.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "filter(xs, func(x int) bool { return x%2 == 0 }) a mapInts(evens, func(x int) int { return x * x }).",
  "Signatura literálu musí přesně odpovídat parametru: func(int) bool pro keep, func(int) int pro f.",
