# ---------------------------------------------------------------- 10
[[quest]]
id    = "go.basic.10.byte-slices"
title = "Bajty slova"
story = "Tiskárna lístků u Lucky Mac pracuje v bajtech, ne v písmenech: tři bajty pro kód nahoře, jméno se dvěma vykřičníky za ním, a vytiskla tři mezery."
brief = '''
`[]byte(s)` zkopíruje řetězec do řezu bajtů, který můžeš měnit. Řež ho
jako kterýkoli řez — `b[:3]` jsou první tři bajty — a zvětšuj ho pomocí
`append`, další řez do něj rozprostři pomocí `...`. `hex.EncodeToString`
ukáže bajty jako hexadecimální dvojice; `string(b)` z nich udělá zpět
text.

```
b := []byte(s)
b = append(b, []byte("!!")...)
```

`s` je slovo ze stdin. Napiš převod do `b` a append místo dvou zástupných
řádků; vytiskne se hex prvních tří bajtů a celé `b` jako text.

```
input:  gopher
output: 676f70
        gopher!!
```
'''
hints = [
  "b := []byte(s) a potom b = append(b, []byte(\"!!\")...).",
  "Ty ... za řezem rozprostřou jeho prvky jako samostatné argumenty; bez nich append chce jednotlivé bajty.",
]

