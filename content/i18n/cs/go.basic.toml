# `content/go/basic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "go.basic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.basic.01.package-main"
title = "První balíček"
story = "Tin Hau, východ A. Alex ti podává notebook se souborem, ve kterém je řádek package a pod ním nic."
brief = '''
Vypiš přesně:

```
hello, causewaybay
```

Startovní kód nemá žádné importy. Přidat ten jeden, který potřebuješ, je celá
ulice — v Go je import, který nepoužiješ, chyba kompilace, a import, který
potřebuješ a nemáš, je `undefined`.
'''
hints = [
  "Println bydlí v balíčku fmt.",
  "import \"fmt\" patří mezi řádek package a func main.",
  "Println přidá odřádkování; Print ne.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.basic.02.vars"
title = "Čtečka Octopus"
story = "Čtečka na Tin Hau ukáže zůstatek a pak dvě prázdná místa tam, kde býval denní strop a záloha."
brief = '''
Proměnná se deklaruje pomocí `var`, nebo se vytvoří na místě pomocí `:=`,
které si vezme typ z pravé strany. `fmt.Println` vypíše své argumenty s
mezerou mezi nimi a novým řádkem za nimi. Aritmetika na `int64` zůstává
`int64`: `n * n` je další celé číslo.

```
fmt.Println(n * n)
```

Zůstatek `n` je načten a vypsán, stejně jako `n * 2`. Napiš třetí výpis:
`n` vynásobené samo sebou.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "fmt.Println(n * n)",
  "Stejný tvar jako řádek nad ním: z n * 2 se stane n * n.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.basic.03.types"
title = "Jízdné napůl"
story = "Dva kurýři si dělí jeden účet z Lucky Macu u pultu v Tin Hau a účtenka tiskne podíl jako celé číslo, zbytek a potom skutečnou částku."
brief = '''
Go za tebe číslo nikdy nepřevede. `a / b` na dvou celých číslech je
celočíselné dělení (zaokrouhluje k nule) a `a % b` je zbytek. Aby vyšel
skutečný podíl, převedeš nejdřív obě strany pomocí `float64(...)`, a
`fmt.Printf` s `%.2f` vypíše float přesně se dvěma číslicemi za tečkou.

```
fmt.Printf("%.2f\n", float64(a)/float64(b))
```

Celočíselný podíl a zbytek se vypisují. Napiš třetí řádek: skutečný podíl,
dvě desetinná místa.

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "fmt.Printf(\"%.2f\\n\", float64(a)/float64(b))",
  "Převeď obě strany: float64(a) / b se nepřeloží, protože float64 a int64 nelze dělit.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.basic.04.strings"
title = "Název stanice"
story = "Cedule na nástupišti v Causeway Bay ukazuje název stanice jednou, potom prázdné místo, kde mají být velká písmena, a prázdné místo, kde má běžet pozpátku pro zrcadlovou stranu."
brief = '''
`string` je jen pro čtení, řez bajtů. `len(s)` je jeho délka v bajtech,
balíček `strings` obsahuje běžné transformace a k průchodu znak po znaku
ho převedeš na `[]rune`. Pomocná funkce `reverse` níže ten průchod dělá;
ty ji jen zavoláš.

```
fmt.Println(strings.ToUpper(line))
fmt.Println(reverse(line))
```

Délka se vypisuje. Napiš další dva řádky: jméno velkými písmeny a pak jméno
pozpátku.

```
input:  causeway bay
output: 12
        CAUSEWAY BAY
        yab yawesuac
```
'''
hints = [
  "fmt.Println(strings.ToUpper(line)) a potom fmt.Println(reverse(line)).",
  "Řádek _ = strings.ToUpper jen udržoval import použitý; smaž ho, jakmile strings.ToUpper zavoláš doopravdy.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "go.basic.05.loops"
title = "Každý třetí vlak"
story = "Odjezdová tabule v Admiralty má sečíst ranní vlaky a říct, kolik z nich byl expres jedoucí jako každý třetí. Ukazuje dvě nuly."
brief = '''
Go má jedno klíčové slovo pro smyčku. `for init; podminka; krok { }`
počítá a `if` uvnitř nepotřebuje závorky, jen složené závorky. `sum += i`
přičítá k proměnné na místě a `i%3 == 0` je způsob, jak se zeptat, zda je
`i` násobkem tří.

```
for i := 1; i <= n; i++ {
	sum += i
	if i%3 == 0 { threes++ }
}
```

Hlavička smyčky je napsaná. Doplň její tělo: přičti `i` k `sum` a započítej
ho do `threes`, když je násobkem tří (jeden `if` na jednom řádku stačí).

```
input:  10
output: 55
        3
```
'''
hints = [
  "sum += i na jednom řádku, pak if i%3 == 0 { threes++ } na dalším.",
  "if potřebuje složené závorky i pro jeden příkaz; kulaté závorky nepotřebuje.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.basic.06.functions"
title = "Sazba kurýra"
story = "Alexova doručovací aplikace platí prvních deset jízd směny jednou sazbou a zbytek jinou, a funkce pro výplatu na kuchyňském tabletu vrací všem nulu."
brief = '''
Funkce pojmenuje své parametry s typy za nimi a typ výsledku za
závorkami. `return` ji ukončí s hodnotou; `return` uvnitř `if` ji ukončí
předčasně, takže řádek za `if` se provede jen tehdy, když podmínka
neplatila.

```
func fare(rides int) int {
	if rides <= 10 { return rides * 5 }
	return 50 + (rides-10)*3
}
```

Prvních deset jízd stojí po 5 a každá další po 3. `fare` je deklarována a
volána; napiš její tělo: předčasný `return` pro deset jízd a méně a
`return` pro zbytek.

```
input:  12
output: 56
```
'''
hints = [
  "if rides <= 10 { return rides * 5 } a potom return 50 + (rides-10)*3.",
  "Deset jízd po 5 je 50; odtud druhý vzorec začíná počítat.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "go.basic.07.structs"
title = "Jeden řádek objednávky"
story = "Obrazovka objednávek v Lucky Macu má řádek pro každou položku — název, cenu, kolik — a sloupec s celkem hlásí na každém řádku nulu."
brief = '''
`struct` seskupuje pojmenovaná pole. Jeho hodnota se staví literálem,
který pojmenuje pole, a metoda je funkce s příjemcem před svým jménem:
`func (it Item) Total() int` se volá jako `it.Total()` a čte pole přes
`it`.

```
it := Item{Name: name, Price: price, Qty: qty}
return it.Price * it.Qty
```

`Item` a jeho metoda `Total` jsou deklarovány. Napiš literál, který postaví
`it` ze tří načtených hodnot, a jednořádkové tělo `Total`.

```
input:  tea 12 3
output: tea: 36
```
'''
hints = [
  "it := Item{Name: name, Price: price, Qty: qty} — a v Total return it.Price * it.Qty.",
  "Smaž řádek _, _, _ =, jakmile literál ta tři jména použije; Go odmítá nepoužitou proměnnou.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "go.basic.08.enums"
title = "Barva linky"
story = "Mapa přestupů v Admiralty zná tři linky podle jména a každou z nich maluje šedě."
brief = '''
Go nemá klíčové slovo `enum`. Idiom je pojmenovaný celočíselný typ a blok
`const` s `iota`, které konstanty čísluje 0, 1, 2, jak jde dolů. `switch`
nad takovou hodnotou vyjmenuje jeden `case` na konstantu a `case` může
sedět na jednom řádku i se svým `return`.

```
type Line int

const (
	Island Line = iota
	TsuenWan
	KwunTong
)

switch l {
case Island: return "blue"
case TsuenWan: return "red"
case KwunTong: return "green"
}
```

`Line`, jeho tři konstanty a `parse` jsou napsané a `colour` už odpovídá
`blue` pro `Island`. Přidej dva chybějící případy: `TsuenWan` je `red`,
`KwunTong` je `green`.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "case TsuenWan: return \"red\" a case KwunTong: return \"green\", každý na vlastním řádku pod případem Island.",
  "Switch v Go nepropadává: každý case končí sám od sebe, žádný break není potřeba.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "go.basic.09.vector"
title = "Počet ve vagonech"
story = "Nástupiště 2 v Causeway Bay čte počet nastupujících z každých dveří a žádný si nenechá: ani celkem, ani první dveře, ani poslední."
brief = '''
Slice je rostoucí seznam v Go a tři věci, které s ním děláte, jsou ty tři
řádky níže. `append` přidá na konec a vrátí slice, takže ho vždy přiřadíte
zpátky. Odebrání indexu 1 je zase `append`: část před ním spojená s částí
za ním. Úprava je obyčejné indexování — `xs[0] = 99` přepíše první prvek
na místě. A `sort.Ints` seřadí celý slice vzestupně, na místě.

```
xs = append(xs, v)
xs = append(xs[:1], xs[2:]...)
xs[0] = 99
sort.Ints(xs)
```

Každý počet dveří `v` se čte ve smyčce (aspoň dva). Napište `append` do
smyčky a odebrání, úpravu a řazení za ni, místo čtyř zástupných řádků;
vypíše se délka a slice.

```
input:  3 7 2 5
output: 3
        2 5 99
```
'''
hints = [
  "xs = append(xs, v) ve smyčce; pak xs = append(xs[:1], xs[2:]...), xs[0] = 99 a sort.Ints(xs) za ní.",
  "xs[:1] je všechno před indexem 1 a xs[2:] všechno za ním; append je spojí a ... rozprostře druhý slice do argumentů.",
]

