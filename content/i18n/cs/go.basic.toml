[[quest]]
id    = "go.basic.08.string-slices"
title = "První čtyři písmena"
story = "Cedule stanice na Causeway Bay ukazuje první čtyři písmena jména a za nimi příponu linky, a cedule ukazuje příponu samotnou."
brief = '''
Řetězec se dá řezat jako cokoli jiného: `s[0:4]` jsou jeho první čtyři
