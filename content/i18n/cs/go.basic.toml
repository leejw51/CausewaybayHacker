id    = "go.basic.16.json"
title = "Tag je smlouva"
story = "API depa posílá klíče malými písmeny a Go exportuje pole velkými, a týden nikdo neviděl, proč je každá objednávka prázdná."
brief = '''
Na standardním vstupu je jeden řádek: JSON pole objednávek, každá s řetězcem
