[[quest]]
id    = "go.basic.09.errors"
title = "Řádek, který není číslo"
story = "Výpis jezdců se vrací z depa a uprostřed sloupce má něčí objednávku oběda."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků. Každý řádek má být celé
číslo.

Pro každý řádek vypiš buď dvojnásobek hodnoty, nebo `BAD <line>`, pokud se
