# ---------------------------------------------------------------- 11
[[quest]]
id    = "go.basic.11.sets"
title = "Různí kurýři"
story = "Za dopoledne projde dveřmi Lucky Macu čtyřicet čísel kurýrů, většinou těch samých osmi lidí, a tabule směny počítá každý příchod jako nového kurýra."
brief = '''
Go nemá typ množina; idiomem je mapa, jejíž hodnotou je prázdná struktura.
Přidání je `seen[v] = struct{}{}`; odebrání je `delete`. Množina nemá
úpravu — člen buď je, nebo není — takže změna `3` na `4` je odebrání a
přidání, tady napsané na jednom řádku. `len(seen)` je počet odlišných;
klíče vycházejí bez pořadí, takže se sesbírají do slice (napsáno za vás)
a `sort.Ints` je seřadí.

```
seen[v] = struct{}{}
delete(seen, 8)
delete(seen, 3); seen[4] = struct{}{}
sort.Ints(keys)
```

Každé číslo jezdce `v` se čte ve smyčce. Napište přidání do smyčky,
odebrání `8` a úpravu `3` na `4` za ni a řazení, jakmile je `keys`
postavené, místo čtyř zástupných řádků; vypíše se počet odlišných a
seřazená čísla.

```
input:  8 3 8 5 3 8
output: 2
        4 5
```
'''
hints = [
  "seen[v] = struct{}{} ve smyčce; delete(seen, 8) a delete(seen, 3); seen[4] = struct{}{} za ní; sort.Ints(keys), jakmile je keys postavené.",
  "delete hodnoty, která tam není, nic nedělá, a přidání té, která už tam je, nic nezmění: obě půlky úpravy lze bezpečně spustit, ať vstup obsahoval cokoli.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "go.basic.12.stack-queue"
title = "Talíře a fronta"
story = "Čisté talíře se u výdejního pultu Lucky Macu vrší a berou se shora; zákazníci stojí u pokladny ve frontě a odcházejí zepředu. Obrazovka dělá obojí stejně."
brief = '''
Slice je zásobník. Push je `append`; pop je odříznutí posledního prvku
přeslicováním; a vršek je `stack[len(stack)-1]`, do kterého lze přiřadit —
úprava horního talíře bez jeho sundání. Strana fronty, která bere zepředu
pomocí `queue = queue[1:]`, je napsaná za vás. Zásobník se nikdy neřadí —
pořadí *je* jeho smysl — takže tenhle drill má tři řádky, ne čtyři.

```
stack = append(stack, v)
stack = stack[:len(stack)-1]
stack[len(stack)-1] = 99
```

Čísla se načtou do `xs` (aspoň dvě). Napište push do smyčky přes `xs`,
pak pop a úpravu vršku za ni, místo tří zástupných řádků; vypíše se
zásobník a první dva z fronty.

```
input:  1 2 3 4
output: 1 2 99
        1 2
```
'''
hints = [
  "stack = append(stack, v) ve smyčce; pak stack = stack[:len(stack)-1] a stack[len(stack)-1] = 99 za ní.",
  "Pop slice zúží; nic se nekopíruje a nic neuvolňuje. Po popu len(stack)-1 pojmenovává prvek, který býval druhý shora.",
]

