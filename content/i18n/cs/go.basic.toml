[[quest]]
id    = "go.basic.16.list"
title = "Řada objednávek"
story = "Objednávky u výdejního pultu Lucky Mac visí na řetězu, nejnovější vzadu, značka vpředu, a řetěz visí prázdný."
brief = '''
`container/list` je obousměrně zřetězený seznam. `PushBack` zavěsí
hodnotu na konec. `Remove` sundá prvek, ať je kdekoli — `l.Front()` je ten
první. Úprava jde přes prvek: `e.Value` je pole, do kterého lze přiřadit,
takže `l.Front().Value = 99` přepíše první objednávku na místě. Seznam
vlastní řazení nemá: průchod od `l.Front()` přes `e.Next()` zkopíruje
hodnoty do slice `vals` (napsáno za vás) a `sort.Ints` ho seřadí.

```
l.PushBack(v)
l.Remove(l.Front())
l.Front().Value = 99
sort.Ints(vals)
```

Každé číslo `v` se čte ve smyčce (aspoň dvě). Napište `PushBack` do
smyčky, odebrání a úpravu za ni a řazení až za průchod, místo čtyř
zástupných řádků; vypíše se délka a seřazené hodnoty.

```
input:  3 1 2
output: 2
        2 99
```
'''
hints = [
  "l.PushBack(v) ve smyčce; l.Remove(l.Front()) a l.Front().Value = 99 za ní; sort.Ints(vals) za průchodem.",
  "Remove bere *Element, ne hodnotu, proto dostane l.Front(); potom je bývalý druhý prvek novou hlavou a právě ten se upraví. e.Value je interface{}, proto průchod píše e.Value.(int).",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "go.basic.18.hashtable"
title = "Čárkovací tabulka minus jedna"
story = "Kuchyně čárkuje každé slovo zavolané na výdej, škrtne slovo the a čte tabulku zpátky každý večer v jiném pořadí."
brief = '''
Mapa v Go je hashovací tabulka: klíč se zahashuje na slot, takže přidání,
odebrání i vyhledání stojí stejně, ať je klíčů deset nebo deset milionů
— a cenou je, že průchod vychází v žádném pevném pořadí. Přidání je
`counts[w]++`; odebrání je `delete`; bezpečná úprava záznamu je tvar
comma-ok, `n, ok := counts[k]`, který řekne, zda klíč existoval, než ho
zapíšete zpátky. Klíče se sesbírají do slice (napsáno za vás) a
`sort.Strings` je seřadí, jinak by se součet každý večer četl jinak.

```
counts[w]++
delete(counts, "the")
if n, ok := counts["tram"]; ok { counts["tram"] = n * 100 }
sort.Strings(keys)
```

Každé slovo `w` se čte ve smyčce. Napište počítání do smyčky, `delete`
a comma-ok úpravu za ni a řazení, jakmile je `keys` postavené, místo čtyř
zástupných řádků; vypíše se velikost a seřazený součet.

```
input:  the tram the wire the
output: 2
        tram 100
        wire 1
```
'''
hints = [
  "counts[w]++ ve smyčce; delete(counts, \"the\") a if n, ok := counts[\"tram\"]; ok { counts[\"tram\"] = n * 100 } za ní; sort.Strings(keys), jakmile je keys postavené.",
  "Čtení comma-ok nikdy nevkládá: když \"tram\" chybí, ok je false a nic se nezapíše — obyčejné čtení counts[\"tram\"] by vrátilo 0 a přiřazení by klíč vytvořilo.",
]

