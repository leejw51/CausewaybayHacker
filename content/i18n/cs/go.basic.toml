[[quest]]
id    = "go.basic.13.sorting"
title = "Tabule příjezdů"
story = "Tabule příjezdů v Tin Hau vypisuje další vlaky v pořadí, v jakém přišla data, což není žádné pořadí."
brief = '''
Balíček `sort` řadí řez na místě. `sort.Ints(xs)` dá celá čísla do
vzestupného pořadí. Pro sestupné žádné `sort.IntsDesc` není; místo toho
zabalíš řez jako `sort.IntSlice`, obrátíš jeho uspořádání přes
`sort.Reverse` a předáš to `sort.Sort`.

```
sort.Ints(xs)
sort.Sort(sort.Reverse(sort.IntSlice(xs)))
```

Napiš vzestupné řazení před první výpis a sestupné před druhý. Výpis je
napsaný.

```
input:  5 2 9 1
output: 1 2 5 9
        9 5 2 1
```
'''
hints = [
  "Nejdřív sort.Ints(xs); potom sort.Sort(sort.Reverse(sort.IntSlice(xs))).",
  "sort.IntSlice(xs) je převod, ne kopie — řazení se pořád děje uvnitř xs.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "go.basic.14.sort-by-key"
title = "Žebříček kurýrů"
story = "Tabule směny v Lucky Macu má řadit kurýry podle doručení, nejlepší první, remízy podle jména, a vypisuje je v pořadí, v jakém si píchli příchod."
brief = '''
`sort.Slice` seřadí libovolný řez, když dostane funkci `less(i, j)`, která
říká, zda má prvek `i` být před prvkem `j`. Pro dvouúrovňové pořadí
porovnáš první klíč a jen při shodě propadneš k druhému. Sestupně je prostě
porovnání naopak.

```
sort.Slice(entries, func(i, j int) bool {
	a, b := entries[i], entries[j]
	if a.Score != b.Score { return a.Score > b.Score }
	return a.Name < b.Name
})
```

Volání `sort.Slice` a začátek funkce jsou napsané. Napiš její dva řádky:
skóre sestupně, když se skóre liší, jméno vzestupně, když jsou stejná.

```
input:  4
        alex 12
        mei 15
        bo 12
        sam 9
output: mei 15
        alex 12
        bo 12
        sam 9
```
'''
hints = [
  "if a.Score != b.Score { return a.Score > b.Score } a potom return a.Name < b.Name.",
  "less odpovídá na otázku „jde i první?“: vyšší skóre jde první a mezi stejnými skóre jde menší jméno.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "go.basic.15.closures"
title = "Příplatek"
story = "Každé jízdné přes turnikety v Causeway Bay má dnes večer stejný příplatek a sčítačka turniketu byla napsaná dřív, než jí někdo řekl číslo."
brief = '''
Funkční literál je funkce bez jména, vytvořená tam, kde je potřeba, a
uložená do proměnné jako každá jiná hodnota. Může používat proměnné kolem
sebe — tady `k` — a používá je i potom: to je closure. Volá se jako
`add(x)`, stejně jako každá funkce.

```
add := func(x int) int { return x + k }
```

Napiš jeden řádek, který vytvoří `add`: funkční literál beroucí `int` a
vracející ho plus `k`. Použije se na každé jízdné a vypíše za tebe.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "add := func(x int) int { return x + k }",
  "k není parametr; literál prostě sáhne ven a přečte ho. Smaž řádek _ = k, jakmile to udělá.",
]

