id    = "typescript.hacker.23.prefix-sums"
title = "Kolika způsoby trefit cíl"
story = "Den tržeb a číslo, které chce auditor vidět. Kolik úseků po sobě jdoucích hodin dá dohromady přesně tohle."
brief = '''
První řádek je `n k`. Druhý řádek je `n` celých čísel, která můžou být
záporná.

Vypiš, kolik souvislých úseků má součet přesně `k`, pak `RANGE <s>`, součet
celého seznamu, odečtený z posledního prefixového součtu, ne dalším
sčítáním.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

Záporné hodnoty zabijí posuvné okno — okno, které je moc velké, se
zmenšením opravit nedá. Přežijí prefixové součty: úsek `i..j` má součet `k`
přesně tehdy, když `prefix[j] - prefix[i] == k`, takže spočítej, kolik
dřívějších prefixů se rovná `prefix[j] - k`. Mapu osaď s `0 → 1` pro úseky,
které začínají na začátku.

Klíčuj ji přes `Map<number, number>`. Obyčejný objekt by prefix jako klíč
vzal taky a vrátil by ho jako **řetězec**: `Object.keys` z `{ [-2]: 1 }` je
`["-2"]`. Typ říkal `number`; běh si to nenechal.

Čtyři případy tady mají nanejvýš pět čísel a hodiny na nich rychlost neměří:
dvojitá smyčka `O(n²)` přes každý začátek a každý konec projde všemi
čtyřmi. Ta laťka je skutečná — na dni tržeb jsou to u dvojité smyčky minuty
— a není to to, co tyhle případy kontrolují. Kontrolují tu část, kterou je
snadné pokazit: osazení `0 → 1` a vyhledání před zaznamenáním.
'''
hints = [
  "Dřívější prefix vyhledej *dřív*, než zaznamenáš ten aktuální, jinak se úsek nulové délky při k rovném 0 započítá sám.",
  "`new Map([[0, 1]])` hned na začátku je to, co vůbec umožní najít úsek, který začíná na indexu 0.",
  "`seen.get(prefix - k) ?? 0` — `??` a ne `||`, které by tu bylo taky správně, ale jen náhodou, protože počet, který nahrazuje, je 0.",
