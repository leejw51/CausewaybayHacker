# ---------------------------------------------------------------- 20
[[quest]]
id    = "typescript.hacker.20.bits"
title = "Ten, který je sám"
story = "Každá zásilka je naskenovaná dvakrát kromě jedné. Nenechají tě použít Map a nenechají tě řadit."
brief = '''
První řádek je `n`. Druhý řádek je `n` nezáporných celých čísel, ve kterých
se každá hodnota objeví přesně dvakrát kromě jedné.

Vypiš čtyři řádky:

1. hodnotu, která se objeví jednou, nalezenou přes **xor** s konstantním
   místem navíc
2. kolik bitů `1` je v ní nastaveno
3. `POW2 YES`, když je mocninou dvojky, jinak `POW2 NO` (`0` jí není)
4. hodnotu s vynulovaným nejnižším nastaveným bitem, nebo `0`, když žádný
   nemá

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` a `x ^ 0 == x` a xor je jedno, v jakém pořadí se děje. To je
celý první řádek. `x & (x - 1)` vynuluje nejnižší nastavený bit, což ti dá
třetí a čtvrtý řádek zadarmo.

Každý bitový operátor tu nejdřív převede operandy na **32bitové celé číslo
se znaménkem**. Hodnoty v těchto případech jsou malé, takže to nic nestojí —
ale `2 ** 31 | 0` je `-2147483648` a hodnota na `2^31` nebo za ní by vyšla
záporná nebo oříznutá bez jediného slova. Za tou čarou má `bigint` tytéž
operátory úplně bez šířky. Věz, kde ta čára je, dřív než se tazatel zeptá.

Čtyři případy tady mají nanejvýš pět čísel a hodiny na nich rychlost neměří:
`Map` s počty projde každým a stejně tak řazení. Nezměnil by to ani větší
případ, protože laťka, kterou tahle otázka klade, je **místo** — jeden
akumulátor a nic jiného — a žádný limit běhu nerozliší odpověď s
konstantním místem od `Map`. Tohle je na tvé cti, a na tazateli, který se
zeptá.
'''
hints = [
  "Páry se samy vyruší, ať přijdou v jakémkoli pořadí, takže stačí jedno složení přes pole. `nums.reduce((acc, v) => acc ^ v, 0)` je tatáž smyčka na jednom řádku.",
  "Počítání bitů tak, že se pokaždé vynuluje ten nejnižší, proběhne jednou na nastavený bit, ne jednou na šířku v bitech.",
  "Mocnina dvojky má nastavený přesně jeden bit, takže vynulování nejnižšího nechá nulu — a samotnou nulu je třeba vyloučit ručně.",
]

