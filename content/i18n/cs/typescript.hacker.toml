```

Otočení je to, které se dělá na místě: transponovat, pak obrátit každý
řádek. Říct to nahlas je půlka otázky. `row.reverse()` obrací na místě a
vrací totéž pole, což je tady přesně to, co chceš, a překvapení všude, kde
sis chtěl nechat originál.

Spirála chce mřížku tak, jak byla, takže ji před otočením zkopíruj: kopii
každého řádku, `grid.map((row) => row.slice())`. `[...grid]` zkopíruje vnější
pole a každý řádek sdílí s originálem, a otočení pak píše skrz obojí.
'''
hints = [
