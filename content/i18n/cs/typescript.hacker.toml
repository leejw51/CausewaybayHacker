[[quest]]
id    = "typescript.hacker.32.modular"
title = "Modulo miliarda sedm"
story = "Ta fráze se objeví na konci zadání a polovina místnosti neví, co po nich chce."
brief = '''
Na standardním vstupu je `n q seed`. Vygeneruj `q` dotazů, v 64bitové
aritmetice, která přetéká (`bigint`, přetočený přes `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo
1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak
`LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic, takže každé
násobení se redukuje průběžně. Problém je dělení: `a! / (b! (a-b)!)` nemá v
modulární aritmetice smysl. Nahradí ho **modulární inverze**, a protože
`1000000007` je prvočíslo, dá ti ji malá Fermatova věta:
`inverse(v) = v^(p-2) mod p`, opakovaným umocňováním na druhou.

Takže: jednou předpočítej `factorial[0..n]` a na každý dotaz odpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**A tady je past, kterou přidává tenhle jazyk.** Oba činitelé jsou pod
`2^30`, takže jejich součin je pod `2^60` — a `number` je double, přesný jen
do `2^53`. `a * b % P` v obyčejných číslech nepřeteče, nevyhodí výjimku a je
špatně: s ním vyjde i ukázka jako `504334178`. Buď násob v `bigint`, nebo
rozděl jednoho činitele na dvě 15bitové poloviny, aby žádný mezivýsledek
nepřelezl `2^46` — starter ten `mulmod` už nese a stojí za to umět ho
odvodit.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Počítání každého koeficientu zvlášť — vynásobit `b` členů,
vydělit `b` členy, na každý jedna modulární inverze — tady nedoběhlo ani za
třicet sekund, proti limitu běhu deset sekund; to je starter. Jedna sdílená
tabulka faktoriálů doběhne asi za desetinu sekundy. Obojí změřeno na tomhle
stroji.
'''
hints = [
  "Redukuj po každém násobení a nikdy nenásob dva zbytky holým `*`: za 2^53 si double nechá vysoké bity a zahodí nízké, a ty nízké jsou odpověď.",
  "`powmod(v, P - 2)` je modulární inverze a funguje jen proto, že P je prvočíslo — to je tu celý obsah malé Fermatovy věty.",
  "Předpočítat i inverzní faktoriály — `inverse[n] = powmod(factorial[n], P - 2)`, pak `inverse[i - 1] = inverse[i] * i` směrem dolů — odstraní z každého dotazu obě umocnění. Zbudou dva `mulmod` na dotaz.",
]

