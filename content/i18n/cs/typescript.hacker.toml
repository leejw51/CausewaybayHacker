id    = "typescript.hacker.27.commands"
title = "Problém je ve vstupu"
story = "Log tabule tramvajové zastávky vyjede ze stroje zalomený na osmdesát sloupců a počet nahoře je počet příkazů, ne slov."
brief = '''
První řádek je `k`, počet **příkazů**, které následují. Příkazy jsou tokeny
oddělené bílými znaky, nacpané do zbývajících řádků, jak se zrovna zalomily
— jakýkoli počet na řádek, jakékoli mezery, možná prázdný řádek na konci.

| příkaz | tokeny | účinek |
| --- | --- | --- |
| `ADD <cents>` | dva | vloží položku |
| `VOID` | jeden | odstraní poslední položku, nebo nic, když žádná není |
| `TOTAL` | jeden | vypíše aktuální součet |
| `CLEAR` | jeden | odstraní všechno |

Po `k` příkazech vypiš `COMMANDS <k>` a `ITEMS <how many are left>`.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` počítá příkazy a `ADD` je jeden příkaz ze dvou tokenů — takže smyčka,
která proběhne `k`krát a za každé kolo přečte jeden token, se zastaví na
špatném místě. Čti `k` příkazů a argument vytáhni jen tehdy, když ho příkaz
má: index do pole tokenů, `tokens[at++]`, je kurzor a
