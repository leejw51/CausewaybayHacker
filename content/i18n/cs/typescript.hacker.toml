title = "Otoč půdorys"
story = "Plán je vzhůru nohama a na stole není místo na jeho druhou kopii."
brief = '''
První řádek je `n`. Dalších `n` řádků je mřížka `n × n` celých čísel.

Vypiš mřížku otočenou o **90° po směru hodinových ručiček**, `n` řádků
hodnot oddělených mezerami. Pak vypiš její hodnoty ve **spirálovém pořadí**
