brief = '''
První řádek je `cap q` a pak buď `q` řádků operací, každá
`PUT <key> <value>` nebo `GET <key>` — nebo, když první řádek nese **třetí**
číslo `seed`, už žádné další řádky a `q` operací pochází z generátoru níže.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle
nepoužitou** položku. `GET` i `PUT` se počítají jako použití klíče. `PUT`
klíče, který cache už drží, nahradí jeho hodnotu a udělá z něj ten
nejčerstvější — nepřidá žádnou položku, takže nic nevyhodí, ať je cache
jakkoli plná.

Pro každý `GET` vypiš hodnotu, nebo `-1`, když tam není. Na konci vypiš
přeživší klíče, nejčerstvěji použité první, oddělené mezerami — nebo `-`,
když je cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá `1` znovu čerstvým, takže když `PUT 3`
potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá `3`
nejčerstvějším, a proto se přeživší vypíšou jako `3 1`.

Generovaná forma, v 64bitové aritmetice, která přetéká (`bigint`, přetočený
přes `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**Starter se pod `strict` zkompiluje čistě, a je špatně.** Drží cache v
`Record<number, number>` a opírá se o fakt, který si každý napůl pamatuje:
objekty drží své klíče v pořadí vložení. Takže dotyk je smazat a znovu
vložit a nejstudenější položka je `Object.keys(cache)[0]`. Spusť ho na
ukázce a `GET 2` vypíše `20`.

To je boss. Typ říkal, že klíče jsou `number`y, a typy jsou za běhu pryč:
klíče objektu jsou **řetězce**, `Object.keys` je vrací jako `"1"` a `"2"` a
pravidlo pořadí vložení má výjimku zapsanou v jazyce přesně pro tyhle klíče
— **klíče vypadající jako celá čísla jdou první, vzestupně podle čísla**, ať
byly vloženy kdekoli. Smazat `1` a vrátit ho zpátky nezmění nic na tom, kam
se zařadí. Vyhazování odstraní nejmenší klíč, ne ten nejstudenější, a tsc o
tom nemůže říct ani slovo, protože nic v programu není špatně typované.
Všechno, co zkontroloval, byla v tu chvíli pravda.

Oprava je struktura, která znamená to, co starter předpokládal: `Map`. Její
klíče zůstanou `number`y a její pořadí procházení je pořadí vložení bez
výjimek. `delete` a `set` je dotyk, `cache.keys().next().value` je studený
konec, `[...cache.keys()].reverse()` je od nejčerstvějšího — a všechno je to
`O(1)` na operaci, což ti v jiných jazycích dá hashovací mapa do obousměrně
spojového seznamu a tady ti to dá `Map` se skrytými ukazateli.

(V pythonní verzi tohoto pohovoru byl bossem limit rekurze a skrytý případ
se dvěma tisíci operacemi je tu pořád. Zásobník Node je řádově deset tisíc
rámců hluboký, takže verze hlava-a-pak-rekurze-na-zbytek
by jím prošla — což je fakt o tomhle vstupu, ne důvod ji psát. Posloupnost
operací je smyčka `for`.)
'''
hints = [
  "Projdi ukázku ručně proti starteru a po každé operaci vypiš `Object.keys(cache)`. Pořadí, které uvidíš, není pořadí, ve kterém jsi vkládal.",
  "`Record<number, V>` je typ; objekt pod ním má řetězcové klíče a řetězcové klíče vypadající jako celá čísla se vyjmenují vzestupně podle čísla před všemi ostatními klíči. To pravidlo je ve specifikaci, není to vrtoch enginu.",
  "`new Map<number, number>()`: `delete` a pak `set` při každém zásahu a každém přepsání, a když nový klíč dorazí do plné cache, smaž `cache.keys().next().value`. Přepsání klíče, který už tam je, není vyhození — zkontroluj `has` dřív, než rozhodneš, že je cache plná.",
  "Přeživší jsou Map čtená od horkého konce: `[...cache.keys()].reverse()`, bez řazení a bez razítek.",
]
