id    = "typescript.hacker.30.range-queries"
title = "Součty, které se pořád mění"
story = "Čtyři miliony pokladních operací z jednoho dne v celém řetězci, polovina z nich opravy, a někdo chce průběžné součty."
brief = '''
Na standardním vstupu je `n q seed`. Postav pole `n` hodnot a pak spusť `q`
operací, vše z téhož generátoru, v 64bitové aritmetice, která přetéká
(`bigint`, přetočený přes `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

Vypiš průběžný součet odpovědí na všechny dotazy, pak `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**Složitost se tu vynucuje.** Naivní odpověď — sečíst `values[l..r]` pro
každý dotaz — je `O(n)` na dotaz a těsná smyčka přes hutné pole je na
čemkoli malém dost rychlá, aby klamala. Takže velký skrytý případ je
`n = 500000, q = 4000000`, stejná velikost, jakou pouští Rust, Go a C++. Při
třech stech tisících operací — velikosti, kterou používá pythonní verze
tohoto questu — trvala naivní smyčka tady **sedmnáct sekund**, už za
limitem běhu deset sekund, a velký případ jich má třináctkrát víc. Fenwickův
strom zvládne celé čtyři miliony za méně než **půl sekundy**. Obojí
změřeno, se dvěma programy v tomhle questu.

Ponaučení je to, na které tazatel chytá: *bodová aktualizace, součet
rozsahu* je přesně ten tvar, pro který Fenwickův strom existuje. Tři krátké
funkce — add, prefix a range jako rozdíl dvou prefixů — a `i & -i` je
způsob, jak krokovat po nejnižším nastaveném bitu. To je 32bitová operace a
tady je přesná, protože každý index je pod `2^31`. Součet ne: na velkém
případu přeleze `2^32` a `number` ho drží přesně jen proto, že zůstane pod
`2^53`.
'''
hints = [
  "Strom postav zavoláním add jednou na každou počáteční hodnotu. Stavba zdola nahoru v O(n) je pěkná optimalizace a není to to, co hodiny testují.",
  "`i & -i` izoluje nejnižší nastavený bit. Přičtení jde stromem nahoru; odečtení dolů.",
  "`range(l, r)` je `prefix(r + 1) - prefix(l)` a trefit tu dvojici chyb o jedničku je většina ladění. `Float64Array(n + 1)` pro strom drží součty přesně a nikdy se nezmění v pole smíšených typů.",
