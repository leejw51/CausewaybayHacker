```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

Spočítej **inverze**: dvojice `i < j`, kde `a[i] > a[j]`. Vypiš počet, pak
`MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**Tenhle quest vynucuje svou složitost a je to jediný druh, který to umí.**
Jeden skrytý případ je `n = 200000`. Dvojitá smyčka `O(n²)` — což je to, čím
starter je — je `2 × 10^10` porovnání a na tomhle stroji trvala
**čtyřicet dva sekund**, proti limitu běhu deset sekund. Počítání inverzí
během merge sortu je `O(n log n)` a doběhne asi za desetinu sekundy.
Změřeno, na tomhle stroji, s těmito dvěma programy.

Tři věci tenhle jazyk rozhoduje jinak. Stav generátoru se do `number`
nevejde — je to double, přesný jen do `2^53` — takže je to `bigint`,
přetočený přes `BigInt.asUintN(64, …)` po každém kroku. Odpověď,
`9990744366`, by se do 32bitového celého čísla nevešla; `number` ji drží
přesně, a přesná zůstane jen tak dlouho, dokud na ni nic nepoužije `| 0`
nebo `>>`. A `Math.max(...values)` rozloží dvě stě tisíc argumentů na
zásobník volání, což je na tomhle stroji `RangeError` dřív, než je to
odpověď: maximum vezmi smyčkou.
'''
hints = [
  "Maximum vezmi smyčkou před řazením, nebo řaď kopii: merge sort, který pracuje na místě, nechá původní pole přeházené. A nerozkládej 200000 hodnot do `Math.max`.",
  "Když slučování vyhraje hodnota zprava, každý zbývající prvek levé poloviny je větší než ona — to je `mid - i` inverzí naráz, a to je celý trik.",
  "Rekurze je log2(200000), asi osmnáct rámců hluboko — nikde blízko limitu. Slučuj přes jeden pomocný buffer alokovaný jednou, místo krájení nových polí na každé úrovni. Fenwickův strom nad zkomprimovanými hodnotami je ta druhá odpověď O(n log n) a stojí za to ji v místnosti zmínit.",
]

