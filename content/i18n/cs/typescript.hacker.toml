  "`grid.map((row) => row.slice())` je pro mřížku čísel dost hluboká kopie; `grid.slice()` a `[...grid]` jsou o úroveň mělčí.",
  "Dvě stráže `if` uvnitř spirálové smyčky jsou to, co zabrání, aby se jediný prostřední řádek nebo sloupec prošel dvakrát.",
