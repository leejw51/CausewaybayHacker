**Co velký případ vynucuje:** odmítne každou odpověď, která cesty vyjmenovává.
Je jich víc, než je v místnosti atomů.

Milion políček v `number[][]` je milion zabalených přihrádek v tisíci polích;
plochý `Float64Array(r * c)` indexovaný `i * c + j` je jeden blok paměti a
tentýž kód.
'''
hints = [
  "Losuj obě hodnoty pro každé políčko, včetně dvou rohů — generátor je nepřeskakuje, jen je odmítá zablokovat.",
  "Volné políčko bez dosažitelného souseda shora ani zleva je dosažitelné nula cestami a nemá nejlepší cenu. `Infinity` je poctivé nedosažitelné: `Math.min` ho ignoruje a `Infinity + cost` je pořád `Infinity`.",
  "Cíl může být volný a přesto nedosažitelný, a přesně tehdy je PATHS 0 a MIN -1. Jeden ze skrytých případů je tohle.",
