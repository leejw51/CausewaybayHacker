Poměry porovnávej přesně. Zlomkový typ tu není a `value /
weight` je double: dva poměry, které jsou na papíře stejné, můžou v binárním
zápisu vyjít trochu jinak a pak rozhodnutí při shodě nikdy neproběhne.
Místo toho násob křížem — `a.value * b.weight` proti `b.value * a.weight` —
