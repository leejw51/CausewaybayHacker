# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.hacker.34.stable-sort"
title = "Shody si drží místo"
story = "Dva kurýři skončili se stejným skóre a žebříček na obrazovce Times Square je při každém překreslení dá v jiném pořadí."
brief = '''
Na standardním vstupu je `n buckets seed`. Postav `n` kurýrů, kde kurýr `i`
má index `i` a skóre, v 64bitové aritmetice, která přetéká (`bigint`,
přetočený přes `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď kurýry podle skóre **sestupně**. Kurýři se stejným skóre si musí
nechat pořadí, v jakém přišli. Vypiš jejich indexy, oddělené mezerami, pak
`TIES <k>` — kolik sousedních dvojic ve tvém seřazeném pořadí má stejné
skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda a odpověď je skoro celá
rozhodnutá tím, co se s nimi stane.

**Tohle je quest o tom, vědět, které řazení držíš v ruce.**
`Array.prototype.sort` musí být od ES2019 **stabilní** a V8 ten slib drží od
roku 2018. Co stabilní *není*, je seřadit vzestupně a pak zavolat
`.reverse()`: to obrátí shody spolu se vším ostatním a přesně to dělá
starter. Na ukázce je viditelně zamíchá; na skutečném vstupu to udělá vždycky.

Správné odpovědi jsou dvě a měl bys umět dát obě. Seřaď sestupně s
komparátorem — `(a, b) => b.score - a.score` — a zbytek nech na stabilitě.
**Nebo** udělej porovnání **úplné** —
`b.score - a.score || a.index - b.index` — aby se žádné dva prvky nikdy
neporovnaly jako stejné a stabilita přestala být otázkou. To druhé je to,
po čem sahat ve výchozím stavu; úplné pořadí nemá co dokazovat, ani na
enginu starším než ten slib.

A komparátor není volitelný. `sort()` bez něj porovnává kurýry jako
řetězce, které dá jejich `toString`, a u objektu je to `[object Object]` pro
každého z nich.

Hodiny tu rychlost neměří a nemají co měřit: `sort` je `sort`, ať napíšeš
kteroukoli z těch dvou. Tyhle čtyři případy rozhoduje výhradně to, co se
stane se shodami. Tenhle je o tom, vědět, co tvoje řazení slibuje, ne o tom,
jak rychle ten slib drží.
'''
hints = [
  "Smaž `.reverse()` a obrať komparátor na `b.score - a.score`. To je ta stabilní odpověď a jazyk ji slibuje.",
  "Druhá odpověď je `b.score - a.score || a.index - b.index` — úplné pořadí, takže nezbydou žádné shody, u kterých by šlo být nestabilní.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal kteroukoli z těch dvou — prozradí tě pořadí indexů.",
]

