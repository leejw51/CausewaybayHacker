`0..m-1` — pro `x = -7, m = 3` to je `2`.
'''
hints = [
  "V C++ znaménko `%` následuje dělenec, takže záporné `x` dá záporný zbytek — o krok vedle správného slotu. Jednou přičíst `m` nestačí pro každé `x`; přičtěte ho a pak znovu zredukujte.",
]
