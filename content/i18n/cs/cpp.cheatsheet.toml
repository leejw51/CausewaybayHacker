# C++ LAND — CHEATSHEET, in Czech. A translation pack (SPEC §12.1): the prose
# of `content/cpp/cheatsheet.toml`, quest by quest, and nothing else. The
# question is the brief; the four choices are code, live in the English pack,
# and are never translated. Code blocks, identifiers and printed strings are
# copied verbatim.

pack   = "cpp.cheatsheet"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet.01.fast-io"
title = "OTEVŘI STAVIDLA"
story = "06:00, tajfunový přístav. Milion řádků s cenami ryb dorazí naráz a výchozí proudy jsou na to příliš zdvořilé."
brief = '''
Hned na začátku `main`, před jakýmkoli vstupem a výstupem: vypněte synchronizaci `cin`/`cout` se stdio jazyka C a odvažte `cin` od `cout`, aby čtení nevyprazdňovalo výstup.

Který řádek to je?
'''
hints = [
  "Synchronizace se vypíná hodnotou `false`; `tie` bere ukazatel na proud, který se má vyprázdnit, a `nullptr` znamená žádný.",
]

