# ---------------------------------------------------------------- 30
[[quest]]
id    = "cpp.cheatsheet.30.positive-mod"
title = "PŘETOČENÍ, KTERÉ ŠLO DO MÍNUSU"
story = "Kruhový buffer polední salvy má tři sloty a krok o sedm zpět ze slotu nula musí dopadnout na slot dva — ne na slot mínus jedna, na kterém celé dopoledne sedí ptakopysk."
brief = '''
`int x, m;` s `m > 0`; `x` může být **jakýkoli** `int`, včetně `-7` nebo
