# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.cheatsheet.17.ordering"
title = "MÍSTO V MNOŽINĚ"
story = "Každý sampan v tajfunovém přístavišti je kotviště (řádek, sloupec) a přístavní kancelář je drží v std::set — který odmítne cokoli, co neumí seřadit."
brief = '''
```cpp
struct Pt { int r, c; };
std::set<Pt> taken;
```

Tohle se zatím nepřeloží. Přidejte do `Pt` **jeden člen** tak, aby `taken`
fungovalo a řadilo podle `r` a při shodě podle `c`. C++20, `<tuple>` je
vložený.
'''
hints = [
  "Množina porovnává `const` prvky a lexikografické pořadí znamená, že druhé pole hraje roli jen tehdy, když je první shodné.",
]

