# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.cheatsheet_advanced.11.hash-private"
title = "SKRYTÉ I ZA BĚHU"
story = "Do počtu na čítači tramvajové zastávky nikomu nic není: ani podtřídě, ani serializéru, ani `Object.keys`."
brief = '''
```ts
abstract class Panel { abstract draw(): string; }
interface Tally { bump(): void }

class Counter extends Panel implements Tally {
  // the field goes here
  protected label = "c";
  get value(): number { /* returns the field */ }
  set value(v: number) { /* stores v in the field */ }
  bump() { /* adds one to the field */ }
  draw() { return `${this.label}=${this.value}`; }
}
```

Přidej pole `count`, začínající na `0`, skryté i za **běhu**, nejen při
kompilaci: po `new Counter()` ho nesmí ukázat ani `Object.keys(c)`, ani
`JSON.stringify(c)`. `strict` je zapnuto.
'''
hints = [
  "Klíčové slovo `private` se vymaže spolu s typy; v JavaScriptu to pole pořád je. Jméno s `#` je privátní v samotném enginu — a nebere žádný modifikátor přístupu a potřebuje svůj inicializátor.",
]

