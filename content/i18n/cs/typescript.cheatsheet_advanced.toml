id    = "typescript.cheatsheet_advanced.25.all-settled"
title = "SPOČÍTEJ TY, CO DORAZILY"
story = "Šest kurýrů vyjelo ze Sugar Street; jednoho smetl déšť. Kuchyně sečte, co dorazilo, a nezahodí celou noc kvůli tomu jednomu, co nedorazil."
brief = '''
`ps: Promise<number>[]` a `rs = await Promise.allSettled(ps)`. Uvnitř
`for (const r of rs)` přičti k `total` hodnotu každého promise, který
**uspěl**, a ty neúspěšné přeskoč — na jednom řádku, který se zkompiluje
pod `strict`.
'''
hints = [
  "Každý výsledek je discriminated union podle `status`; jen úspěšná větev má `value`. Ty dva stavové řetězce jsou ty, které používá spec, ne \"resolved\" a ne `ok`. (`Promise.all` by při prvním selhání vyhodil chybu a `Promise.race` vrací jen jeden.)",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.cheatsheet_advanced.26.for-await"
title = "JAK KAŽDÝ DORAZÍ"
story = "Feed tiků z tabulí na Yee Wo Street chodí po jednom, každý po čekání. Součet roste, jak přicházejí, ne až když jsou všechny uvnitř."
brief = '''
`ticks()` vrací `AsyncGenerator<number>`. Uvnitř `async` funkce otevři
smyčku, která přijímá každé `t`, jak dorazí, tak aby se tělo `sum += t;`
zkompilovalo pod `strict`.
'''
hints = [
  "Asynchronní iterable nemá `[Symbol.iterator]`, takže prosté `for…of` je odmítnuto — a await na objektu generátoru nepomůže. To `await` patří k `for`.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.cheatsheet_advanced.27.iterable-stack"
title = "ROZLOŽ ZÁSOBNÍK"
story = "Zásobník undo ve velínu se má rozložit do pole a projít ve `for…of` jako cokoli jiného na patře."
brief = '''
```ts
class Stack<T> {
  #items: T[] = [];
  push(x: T) { this.#items.push(x); }
  pop(): T | undefined { return this.#items.pop(); }
  // one more method goes here
}
```

Přidej tu jednu metodu, díky které `[...s]` dá `[1, 2]` po
`s.push(1); s.push(2)` a `for (const x of s)` se zkompiluje. `strict`
je zapnuto.
'''
hints = [
  "Jméno metody je well-known symbol v hranatých závorkách, musí to být generátor (hvězdička) a delegování na pole přes `yield*` vydává položky po jedné — prosté `yield` vydá celé pole jako jednu položku.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.cheatsheet_advanced.28.exhaustive-never"
title = "ČTVRTÝ DRUH ROZBIJE BUILD"
story = "Dnes dva druhy panelů. Až někdo příští sprint přidá třetí, musí build spadnout na tomhle switchi — ne obrazovka na Times Square v 19:00."
brief = '''
`Shape` je `{ kind: "ad"; w: number } | { kind: "news"; len: number }`
a `area(s: Shape): number` dělá switch na `s.kind`. Poté, co `case "ad"` a
`case "news"` každý dělají `return`, napiš `default` tak, aby se funkce
zkompilovala dnes **a** přestala kompilovat v den, kdy se do `Shape` přidá
třetí druh. `strict` je zapnuto.
'''
hints = [
  "Poté, co každý case vrátil, má `s` spodní typ (bottom). Přiřadit ho do proměnné toho typu je dnes zadarmo a typová chyba ve chvíli, kdy jeden druh zbude. Přetypování nebo `any` nekontrolují nic; `throw` se to dozví až v 19:00.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.cheatsheet_advanced.29.type-guard"
title = "CO PŘIŠLO PO DRÁTĚ"
story = "JSON dorazil do třicátého patra a typy jsou pryč. Jedna funkce se na něj musí za běhu podívat a říct kompilátoru, co viděla."
brief = '''
`data: unknown` přišlo z `JSON.parse` a `Screen` je
`{ id: string; w: number }`. Otevři funkci `isScreen` s tělem

```ts
return typeof x === "object" && x !== null && "id" in x && "w" in x;
```

tak, aby se `if (isScreen(data)) console.log(data.id.toUpperCase());`
zkompilovalo — uvnitř toho `if` je `data` `Screen`. `strict` je zapnuto.
'''
hints = [
  "Vrácení `boolean` kompilátoru o `x` neřekne nic. Typový predikát na místě návratového typu ano — jméno parametru, to slovo, typ. Parametr musí přijmout `unknown` a assertion signatura nemůže sedět v `if`.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.cheatsheet_advanced.30.asserts-defined"
title = "ASERCE"
story = "Půlnoc. Poslední vyhledání, než obrazovky ostrova zhasnou: hodnota tam je, nebo noc skončí vyhozenou Error, a po tom řádku jí kompilátor musí věřit na slovo."
brief = '''
Tělo je `if (x === undefined || x === null) throw new Error("missing");`.
Otevři generickou funkci `must` tak, aby po

```ts
const v = m.get("a");   // m: Map<string, number>, so v: number | undefined
must(v);
```

řádek `v + 1` zkompiloval — `must` kompilátoru slibuje, že `v` od té
chvíle není ani `null`, ani `undefined`. `strict` je zapnuto.
'''
hints = [
  "Funkce, která nic nevrací, nemůže být typový predikát; může být assertion signatura. A asertovat `x is T` nezúží nic — asertovat se má ta utilita, která z typu odstraní `null` a `undefined`.",
]
