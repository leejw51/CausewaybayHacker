# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.cheatsheet_advanced.22.loop-closure"
title = "KAŽDÝ SVOJE VLASTNÍ ČÍSLO"
story = "Tři panely na stěně Hysan jsou nastavené, aby se rozsvítily později, každý se svým vlastním číslem. Chyba, kde všechny tři říkají 3, byla první věc, kterou kdy Skynet navrhl."
brief = '''
```ts
class Board {
  q: (() => void)[] = [];
  show(i: number) { /* lights panel i */ }
  arm(n: number) {
    // the loop goes here
  }
}
```

Uvnitř `arm(n)` pushni na `this.q` `n` closures. Ta k-tá musí, když se
zavolá **později**, zavolat `this.show(k)` se svým vlastním `k` — spuštění
všech po `arm(3)` rozsvítí `0, 1, 2`, ne `3, 3, 3`. `strict` je zapnuto.
'''
hints = [
  "`var` je jedna proměnná pro celou smyčku; blokově vázaná vazba je v každém kole čerstvá. A `function () {}` má svoje vlastní `this`, které strict mode odmítá hádat.",
]

