id    = "typescript.cheatsheet_advanced.03.as-const-union"
title = "TŘI SLOVA, ŽÁDNÝ ENUM"
story = "Příjezdové tabule na Yee Wo Street ukazují tři druhy panelů a nikdo nechce čtvrtý soubor, ve kterém by se ten seznam držel."
brief = '''
```ts
