[[quest]]
id    = "typescript.cheatsheet_advanced.05.awaited-return"
title = "CO LOAD VRACÍ"
story = "Loader feedu ve třicátém patře mění tvar každý sprint. Typ, který pojmenovává jeho výsledek, se má měnit s ním, ne se znovu vypisovat."
