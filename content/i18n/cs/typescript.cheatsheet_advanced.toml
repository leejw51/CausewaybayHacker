[[quest]]
id    = "typescript.cheatsheet_advanced.12.overload-impl"
title = "ŘÁDEK POD PŘETÍŽENÍMI"
story = "`parse` na příjezdové tabuli jde oběma směry: řetězec dovnitř dá číslo, číslo dovnitř dá řetězec. Dva sliby, jedno tělo."
brief = '''
```ts
function parse(x: string): number;
function parse(x: number): string;
```

Napiš implementační řádek, který následuje po těch dvou přetíženích, s
tělem `return typeof x === "string" ? Number(x) : String(x);` — tak, aby
`parse("42")` bylo `number` a `parse(7)` `string`, pod `strict`.
'''
hints = [
  "Implementační signatura musí být dost široká, aby pokryla každé přetížení, musí mít tělo a pod `strict` její parametr nemůže zůstat bez typu.",
]

