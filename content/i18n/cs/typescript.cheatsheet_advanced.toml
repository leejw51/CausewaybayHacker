# TYPESCRIPT LAND — CHEATSHEET ADVANCED, in Czech. A translation pack (SPEC §12.1):
# the prose of `content/typescript/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
