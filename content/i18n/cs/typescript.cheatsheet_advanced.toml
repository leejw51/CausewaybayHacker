# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.cheatsheet_advanced.01.generic-bound"
title = "COKOLI S ID"
story = "19:10, velín ve třicátém patře. Každá obrazovka na ostrově má id; vyhledávací tabulka má brát jakýkoli jejich seznam a nesmí ho smět měnit."
brief = '''
`xs` je `readonly Screen[]` (tedy `ReadonlyArray<Screen>`) a `Screen` má
`id: string`. Otevři generickou funkci `byId`, jejíž tělo je

```ts
return new Map(xs.map(x => [x.id, x] as const));
```

Musí přijmout `xs` — a jakékoli jiné pole jen pro čtení s věcmi, které
nesou řetězcové `id` — a nechat to tělo zkompilovat. `strict` je zapnuto.
'''
hints = [
  "Holé `T` žádné `id` nemá; dej parametru omezení (bound). A pole jen pro čtení neprojde tam, kde se žádá měnitelné.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.cheatsheet_advanced.02.mapped-draft"
title = "KAŽDÝ KLÍČ, MOŽNÁ"
story = "Koncept konfigurace obrazovky v Hysan Place může být vyplněný napůl a pořád se dá upravovat. Tvar kopíruje ten skutečný, klíč po klíči."
brief = '''
Napiš `Draft<T>` ručně — ne vestavěným utility typem, který to dělá:
stejné klíče jako `T`, každý nepovinný, každý si nechá svůj vlastní typ, a
pořád zapisovatelné. S `type Screen = { id: string; w: number }` se
zkompiluje jak `const d: Draft<Screen> = { w: 3 };`, tak `d.w = 5;`.
'''
hints = [
  "Mapped type prochází `keyof T`; `?` za hranatou závorkou dělá každý klíč nepovinným (to je `Partial<T>` ručně), `-?` ho dělá povinným (`Required<T>`) a `readonly` před ní ho zmrazí (`Readonly<T>`).",
]

