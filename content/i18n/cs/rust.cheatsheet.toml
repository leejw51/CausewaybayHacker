[[quest]]
id    = "rust.cheatsheet.22.lower-bound"
title = "PRVNÍ, CO NENÍ MENŠÍ"
story = "Cenová tabule v Sogu je seřazená; Mei chce vědět, kde začíná první položka za aspoň `t`."
brief = '''
`v: Vec<i64>` je seřazený vzestupně a může obsahovat duplicity; `t: i64`
v něm být může i nemusí. `i` je index **prvního prvku ≥ `t`**
(`v.len()`, pokud žádný není) — klasický lower bound, v O(log n), bez
paniky.
'''
hints = [
  "Řez se dělí na část, kde predikát platí, a část, kde neplatí; vrácený index je první prvek, kde platit přestává. Vyber predikát, který je pravdivý pro všechno *pod* `t`.",
]

