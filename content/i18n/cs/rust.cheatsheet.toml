[[quest]]
id    = "rust.cheatsheet.19.drop-tx"
title = "POSLEDNÍ ODCHÁZÍ"
story = "Čtyři kurýři na Lockhart Road se hlásí přes jednu vysílačku a dispečer musí vědět, kdy se odhlásil poslední z nich."
brief = '''
Čtyři producenti, jeden konzument. Smyčka `for` musí skončit, jakmile
dorazí všechny čtyři zprávy.

```
let (tx, rx) = mpsc::channel();
for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

Který řádek patří do mezery?
'''
hints = [
  "Smyčka skončí, až když zmizí každý odesílatel. Čtyři klony odejdou se svými vlákny — jeden odesílatel ale pořád sedí v `main`.",
]

