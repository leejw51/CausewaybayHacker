# RUST LAND — CHEATSHEET, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/rust/cheatsheet.toml`, quest by quest, and nothing else. The question
# is the brief; the four choices are code, live in the English pack, and are
# never translated. Code blocks, identifiers and printed strings are copied
# verbatim.

pack   = "rust.cheatsheet"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.cheatsheet.01.read-all"
title = "CELÁ PÁSKA"
story = "06:30, Jardine's Bazaar. Vstup kiosku přichází najednou a kiosek chce všechno."
brief = '''
Načti **celý** stdin do `s` jedním voláním.

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

Který řádek to je?
'''
hints = [
  "`read_to_string` vezme `&mut String` a naplní ho; vrací Result, takže ho rozbal přes unwrap.",
]

