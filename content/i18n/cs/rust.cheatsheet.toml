[[quest]]
id    = "rust.cheatsheet.20.shared-receiver"
title = "JEDNA LIŠTA, ČTYŘI KUCHAŘI"
story = "Noční kuchyně u Lucky Mac: jedna lišta na objednávky, čtyři kuchaři a číst z ní může v jednu chvíli jen jeden."
brief = '''
`rx: Receiver<u64>` je fronta úloh. Čtyři pracovní vlákna, každé spuštěné
s `move`, musí všechna brát úlohy z tohoto **jediného** příjemce. Který řádek
