for id in 0..4 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(id).unwrap());
}
// ____
for m in rx { println!("{m}"); }
```

Který řádek patří do mezery?
'''
hints = [
  "Smyčka skončí, až když zmizí každý odesílatel. Čtyři klony odejdou se svými vlákny — jeden odesílatel ale pořád sedí v `main`.",
]

