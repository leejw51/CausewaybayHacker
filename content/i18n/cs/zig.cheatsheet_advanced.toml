[[quest]]
id    = "zig.cheatsheet_advanced.07.error-merge"
title = "DVA SEZNAMY ZPŮSOBŮ, JAK SELHAT"
story = "Čtení lístku může selhat dvěma způsoby, jeho naúčtování třetím. Účtovací funkce jmenuje všechny tři v jedné množině."
