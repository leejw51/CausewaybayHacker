```
var total: i64 = 0;
var cur = head;
// ____
    total += node.v;
}
```
'''
hints = [
  "Podmínka je sám optional, zachycení je rozbalený ukazatel a pokračovací výraz za dvojtečkou posouvá optional, ne zachycení.",
]

