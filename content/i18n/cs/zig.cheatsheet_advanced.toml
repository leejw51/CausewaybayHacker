id    = "zig.cheatsheet_advanced.10.union-payload"
title = "JAK ZAPLATILI"
story = "Auto platí mincemi, kartou Octopus, nebo je mávnutím puštěno. Součet přičítá mince v nominální hodnotě a kartu dvojnásobně."
