[[quest]]
id    = "zig.cheatsheet_advanced.30.packed-bitcast"
title = "OSM PŘÍZNAKŮ V JEDNOM BAJTU"
story = "Řídicí jednotka závory bere jeden bajt na auto: zaplaceno, označeno, tříbitový pruh, tři bity volné. Struktura je rozložená bit po bitu a posílá se jako ten bajt."
brief = '''
`Flags` je `packed struct(u8)` — `@sizeOf(Flags)` je 1, na rozdíl od
`extern struct`, který je rozložený jako v C. `f` je `Flags`. Udělej z
`bits` `u8`, jehož bitový vzor je vzorem `f`, aby mohl ven na drát.

```
const Flags = packed struct(u8) {
    paid: bool,
    flagged: bool,
    lane: u3,
    _pad: u3 = 0,
};
```
'''
hints = [
  "Celočíselná přetypování chtějí na vstupu celé číslo; packed struct se bit po bitu přeinterpretuje přetypováním, které bere jeden argument a cíl si bere z vazby.",
]
