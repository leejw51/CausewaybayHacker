# ZIG LAND — CHEATSHEET ADVANCED, in Czech. A translation pack (SPEC §12.1):
# the prose of `content/zig/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "zig.cheatsheet_advanced"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.cheatsheet_advanced.01.generic-fn"
title = "VĚTŠÍ Z LIBOVOLNÝCH DVOU"
story = "22:00 u portálu. Velín porovnává dvě jízdná, dvě hmotnosti, dvě časové značky a chce to porovnání napsat jen jednou."
brief = '''
`max` vrací větší ze dvou hodnot jednoho typu a volá se s typem uvedeným
výslovně: `max(i64, 3, 7)`, `max(f64, 2.5, 1.0)`. Který řádek ji
otevírá?

```
// ____
    return if (a > b) a else b;
}
```
'''
hints = [
  "Typ je první argument, známý při překladu, a zbylé dva parametry i návratový typ se píší pomocí něj.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.cheatsheet_advanced.02.this"
title = "TYP, KTERÝ JEŠTĚ NEMÁ JMÉNO"
story = "Stoh kontejnerů vezme jakýkoli náklad. Uvnitř potřebují metody jméno pro struct, ve kterém se právě píší."
brief = '''
Uvnitř structu, který `Stack` vrací, naváž `Self` na typ toho structu
samého, aby `push` mohl brát `self: *Self`.

```
fn Stack(comptime T: type) type {
    return struct {
        // ____
        items: std.ArrayList(T) = .empty,
        pub fn push(self: *Self, gpa: std.mem.Allocator, v: T) !void {
            try self.items.append(gpa, v);
        }
    };
}
```
'''
hints = [
  "Anonymní struct nemá jméno, kterým by se na sebe odkázal; jedna vestavěná funkce vrací nejvnitřnější právě definovaný struct, enum nebo union.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.cheatsheet_advanced.03.fn-pointer"
title = "KTERÉ PRAVIDLO DNES V NOCI"
story = "Pravidlo pro jízdné v budce 2 se o půlnoci vymění: před ní zdvojnásobit, po ní negovat. Budka drží pravidlo v proměnné a volá ho."
brief = '''
`double` i `negate` jsou obě `fn (i32) i32`. Deklaruj **běhovou
proměnnou** `f`, která začíná jako `double`, dá se později přepsat na
`negate` a volá se jako `f(3)`.
'''
hints = [
  "Holý typ `fn` existuje jen při překladu a nemůže žít ve `var`; běhová funkční hodnota je ukazatel na funkci, a funkce je `const`.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.cheatsheet_advanced.04.inline-for-fields"
title = "KAŽDÉ POLE, JMÉNEM"
story = "Noční audit vypíše každé pole každého záznamu, který dostane, ať je to jakýkoli struct, aniž by mu někdo řekl jména polí."
brief = '''
`dump` vypíše jméno a hodnotu každého pole libovolného structu, který
dostane. Otevři smyčku přes pole tak, aby se `f.name` dalo použít
v `@field` (Zig 0.16: značka v type-info se píše malými písmeny).

```
fn dump(v: anytype) void {
    const T = @TypeOf(v);
    if (@typeInfo(T) != .@"struct") @compileError("not a struct: " ++ @typeName(T));
    // ____
        std.debug.print("{s}: {any}\n", .{ f.name, @field(v, f.name) });
    }
}
```
'''
hints = [
  "Seznam polí jsou data známá při překladu, takže obyčejná smyčka ho indexovat nemůže; smyčka se musí rozbalit, a `struct` je klíčové slovo, které jako jméno pole potřebuje uvozovky.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.cheatsheet_advanced.05.has-field"
title = "MÁ TO ZNAČKU"
story = "Auta mají značku, kola ne. Jedna funkce na štítky dostane obojí a musí při překladu vědět, co právě drží."
brief = '''
`label` se volá s `Car` (který má pole `plate`) a s `Bike` (který nemá
pole `plate` ani deklaraci toho jména). Otevři `if`, jehož větev se
vezme pro `Car` a pro `Bike` se odřízne, takže `v.plate` se přeloží jen
tam, kde existuje.

```
fn label(v: anytype) []const u8 {
    const T = @TypeOf(v);
    // ____
        return v.plate;
    } else return "no plate";
}
```
'''
hints = [
  "Jedna vestavěná funkce se ptá typu, zda má pole daného jména, zadaného jako řetězec; ta, která se ptá na deklarace, u pole odpoví ne.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.cheatsheet_advanced.06.comptime-var"
title = "SPOČÍTÁNO PŘED SESTAVENÍM"
story = "Pět tabulek se čtverci pruhů je vyplněno dřív, než program vůbec běží; smyčku, která je plní, rozbalí překladač."
brief = '''
Uvnitř **běhové** funkce deklaruj počítadlo smyčky `i` tak, aby se
`inline while` níže rozbalilo, s `i` známým při překladu v každé
iteraci.

```
fn squares() [5]u32 {
    var out: [5]u32 = undefined;
    // ____
    inline while (i < 5) : (i += 1) {
        out[i] = @intCast(i * i);
    }
    return out;
}
```
'''
hints = [
  "Běhová `var` nemůže řídit inline smyčku, `const` se nedá posouvat; klíčové slovo, které vynutí proměnlivou hodnotu při překladu, stojí před `var`.",
]

