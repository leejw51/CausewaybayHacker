[[quest]]
id    = "zig.cheatsheet_advanced.09.walk-optional"
title = "PO ŘETĚZU DOLŮ"
story = "Noční účtenky jsou zřetězený seznam, každý uzel ukazuje na další nebo na nic. Audit ho projde až na konec a sečte."
