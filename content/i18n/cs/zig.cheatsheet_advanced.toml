'''
hints = [
  "Množiny chyb se slučují dvouznakovým operátorem; jedna svislice je bitové or a typy nebere.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.cheatsheet_advanced.08.switch-on-error"
title = "KUDY TO SELHALO"
story = "Rozmazaný lístek nemá žádnou cenu; lístek s příliš mnoha číslicemi má cenu maxima. Budka rozhoduje podle chyby, kterou zachytila."
brief = '''
`std.fmt.parseInt(i64, tok, 10)` selže s `InvalidCharacter` nebo
`Overflow`. Chyba se zachytí a udělá se na ní switch. Která větev dá 0
za špatný znak?

```
return std.fmt.parseInt(i64, tok, 10) catch |e| switch (e) {
    // ____
    error.Overflow => std.math.maxInt(i64),
};
```
'''
hints = [
  "Switch přes množinu chyb jmenuje každý případ s předponou `error.`; tečkový tvar enum literálu je jiný typ.",
]

