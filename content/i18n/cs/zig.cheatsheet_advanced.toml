id    = "zig.cheatsheet_advanced.28.io-mutex"
title = "JEDEN TÁCEK, DVĚ RUCE"
story = "Dvě budky přičítají do jednoho součtu tržby. Zámek kolem něj patří v 0.16 I/O runtimu a std.Thread.Mutex zmizel."
brief = '''
Zig 0.16. `m` je `*std.Io.Mutex` a `io` je `std.Io`. Vezmi zámek před
přičtením; `defer` níže ho vrací. `add` vrací `void` a chybu
propagovat nemůže.

```
fn add(io: std.Io, m: *std.Io.Mutex, total: *i64, value: i64) void {
    // ____
    defer m.unlock(io);
    total.* += value;
}
```
'''
hints = [
  "Obyčejný `lock` mutexu z 0.16 bere `io` a může vrátit `error.Canceled`, což funkce vracející `void` nemůže `try`; jeho sourozenec, který se zrušit nedá, nevrací nic.",
]

