[[quest]]
id    = "zig.cheatsheet_advanced.12.labeled-block"
title = "PRVNÍ TĚŽKÝ"
story = "Záznam mostní váhy se prohledává po první hodnotu přes sto tun; odpověď je hodnota, ne skok ven z funkce."
