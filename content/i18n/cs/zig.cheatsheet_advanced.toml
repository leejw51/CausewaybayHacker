[[quest]]
id    = "zig.cheatsheet_advanced.14.to-owned-slice"
title = "PŘEDEJ SEZNAM"
story = "Sudé pruhy se sbírají do seznamu a volající chce holý řez, který po použití uvolní přes gpa.free."
brief = '''
`list` je `std.ArrayList(i64)` naplněný přes `gpa`. Vrať jeho obsah
jako `[]i64`, který volající uvolní přes `gpa.free`, tak aby `list`
neměl co uvolňovat a nic se nekopírovalo (Zig 0.16: seznam žádný
alokátor nedrží).

```
fn evens(gpa: std.mem.Allocator, xs: []const i64) ![]i64 {
    var list: std.ArrayList(i64) = .empty;
    errdefer list.deinit(gpa);
    for (xs) |x| if (@rem(x, 2) == 0) try list.append(gpa, x);
    // ____
}
```
'''
hints = [
  "`.items` pořád vlastní seznam a uvolnilo by se dvakrát nebo nikdy; volání, které předává vlastnictví, zmenšuje na míru, takže může selhat a bere alokátor.",
]

