[[quest]]
id    = "zig.cheatsheet_advanced.11.enum-from-int"
title = "ČÍSLO Z DRÁTU"
story = "Senzor náprav posílá třídu pruhu jako bajt. Tabulka poplatků je klíčovaná enumem, který zná svůj poplatek sám."
brief = '''
`n` je běhové `u8` držící platnou hodnotu značky. Udělej z `lane`
odpovídající `Lane`, aby se `lane.fee()` přeložilo.

```
const Lane = enum(u8) {
    car, van, truck, bus,
    pub fn fee(self: Lane) i64 {
        return switch (self) { .car, .van => 10, .truck => 20, .bus => 15 };
    }
};
// ____
return lane.fee();
```
'''
hints = [
  "Vestavěná funkce bere jen celé číslo; enum, kterým se stane, je typ výsledku, takže ho musí uvést vazba. Opačný směr je `@intFromEnum`.",
]

