```

Čtyři vlákna spouštějí `work`. Který řádek zajistí, že `n` bude při každém
běhu přesně 400000 — každé vlákno se střídá na **tomtéž** zámku?
'''
hints = [
  "Objekt zámku je sám o sobě kontextový manažer; to, co vrací acquire(), kontextový manažer není.",
]

