id    = "remix.cheatsheet_advanced.28.match-go"
title = "JEDEN TYP NA CASE"
story = "Alex napíše dva celočíselné typy do jednoho case, aby ušetřil řádek, a `v` se mu zpátky promění v interface."
brief = '''
V **Go**,

```
func describe(x any) string {
    switch v := x.(type) {
    // ____
        return strconv.Itoa(v * 2)
    case string:
        return v
    }
    return "?"
}
```

Který řádek s case zajistí, že `describe(21)` vrátí `"42"` — a zkompiluje
se?
'''
hints = [
  "`v` dostane typ case jen tehdy, když case jmenuje přesně jeden typ; jmenuj dva a `v` je pořád `any`, které se nedá násobit.",
]

