[[quest]]
id    = "rust.advanced.14.custom-error"
title = "Vlastní chyba"
story = "Čtyři vrstvy služby jízdného si každá vymyslely vlastní typ selhání a žádná z nich se nechce převést."
brief = '''
Na standardním vstupu je počet `n` a potom `n` řádků, každý má být vzdálenost
v km.

Definuj `enum FareError { NotANumber, Negative(i64) }`, implementuj pro něj
`Display` a `std::error::Error` a implementuj
`From<std::num::ParseIntError> for FareError`, aby `?` převáděl sám.

`fare(text) -> Result<i64, FareError>` parsuje pomocí `?`, odmítne zápornou
vzdálenost a jinak vrací `500 + 100 * km`. Vypiš každý výsledek nebo text
chyby z `Display`, potom `ERRORS <k>`.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

Startovní kód se nezkompiluje. `?` chybu jen nepropaguje — cestou ven volá
`From::from`, a bez toho impl neexistuje cesta od `ParseIntError` k tvému
typu. Implementace `From` je to, co nechá `?` fungovat přes hranici vrstvy, a
je to celý důvod, proč mít chybové enumy.

`map_err` je druhá polovina odpovědi, pro případ, že chceš přidat kontext,
a ne převést typ. Zmiň ho, když se zeptají; tady potřeba není.
'''
hints = [
  "Chyba je E0277 na tom `?`: the trait From<ParseIntError> is not implemented for FareError.",
  "Šest řádků: impl From<ParseIntError> for FareError s fn from, která vrací FareError::NotANumber.",
  "Display je to, co vypisuje {}; Debug je to, co vypisuje {:?}; trait Error je to, co ho pustí do Box<dyn Error>. Všechny tři stojí za to mít a jen jeden je tu potřeba.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.advanced.15.atomics"
title = "Jedno slovo, žádný zámek"
story = "Počítadlo turniketu zámek nepotřebuje. Všechno ostatní ve strojovně ano, a rozeznat je od sebe je ta práce."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel.

Spusť jedno vlákno na každou hodnotu. Každé přičte svou hodnotu ke sdílenému
`AtomicI64` a zvýší sdílený `AtomicUsize` o jedna — nikde žádný `Mutex`.
Připoj je všechna a vypiš `TOTAL <sum>` a `HITS <n>`.

Potom: deklaruj dvě hodnoty `Guard` **na začátku** `main`, pojmenované `first`
a `second`, jejichž `Drop` vypíše `DROP <name>`. Proběhnou na konci `main`, po
všem ostatním, v obráceném pořadí deklarace.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
        DROP second
        DROP first
```

Atomik není levnější mutex; je to jiný nástroj, pro jedno strojové slovo
přečtené, změněné a zapsané v jediné instrukci. Ve chvíli, kdy potřebuješ, aby
spolu souhlasily dvě položky, je zámek zpátky — pro „tyhle dvě věci dohromady“
žádný atomik není.

`Ordering::Relaxed` tu stačí, protože nic nezávisí na tom, *kdy* se tyhle
přírůstky stanou viditelnými vůči jakémukoli jinému zápisu, jen na tom, že se
žádný neztratí. Tahle věta je doplňující otázka a je to celé, co `Relaxed`
znamená.
'''
hints = [
  "fetch_add vrací předchozí hodnotu a přičtení provede atomicky; není tu žádný zámek ani strážce.",
  "Arc je pořád potřeba — atomik dělá bezpečným *přístup*, ne *sdílení*.",
  "Drop běží v obráceném pořadí deklarace, takže `second` jde první. Navázání jako _first a _second je udrží naživu do konce main; holé `_` by je zahodilo okamžitě.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.closure-kinds"
title = "Tři druhy uzávěr"
story = "Zkoušející napíše na tabuli `Fn`, `FnMut` a `FnOnce` a ptá se, který z nich má být ten callback. Správná odpověď existuje."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel, `n` aspoň jedna.

Použij jednu uzávěru od každého druhu:

* `apply_fn<F: Fn(i64) -> i64>` — zachytí první hodnotu kopií a přičte ji
  ke každé hodnotě. Vypiš každý výsledek.
* `apply_fn_mut<F: FnMut(i64)>` — zvyšuje počítadlo, které žije v `main`.
  Vypiš `SEEN <k>`.
* `apply_once<F: FnOnce() -> String>` — **přesune** `String` ven ze svého
  zachycení a vrátí ho. Vypiš `TAKEN <s>`, kde ten řetězec je
  `<n> items`.

```
input:  3
        10 20 30
output: 20
        30
        40
        SEEN 3
        TAKEN 3 items
```

Ty tři traity jsou hierarchie, ne nabídka: každé `Fn` je `FnMut` a každé
`FnMut` je `FnOnce`. Co uzávěra implementuje, rozhoduje to, co se svými
zachycenými hodnotami *dělá* — čte je (`Fn`), mění je (`FnMut`), nebo je
spotřebuje (`FnOnce`) — a `move` mění, jak se zachytí, ne který trait z toho
vyjde.

Startovní kód se nezkompiluje. `apply_once` chce `Fn`, a uzávěra, která svůj
`String` dává pryč, se dá zavolat jen jednou, takže je `FnOnce` a nic víc.
Ber nejslabší mez, se kterou místo volání vyžije: chtěj `FnOnce`, když voláš
jednou, a nevyloučil jsi bezdůvodně každou jinou uzávěru.
'''
hints = [
  "Chyba je E0525: expected a closure implementing Fn, but this one only implements FnOnce.",
  "Mění se jedno slovo: mez na apply_once. Uzávěra je už správně.",
  "apply_fn_mut bere `mut f: F` — parametr sám musí být měnitelný, aby uzávěra mohla měnit své vlastní zachycené hodnoty.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.advanced.17.deadlock"
title = "Uváznutí"
story = "Strojovna v Times Square, dvě patra pod zemí. Dva zámky, dvě vlákna a oba eskalátory se zastavily v téže vteřině."
brief = '''
Dva účty, `A` a `B`, každý `Arc<Mutex<i64>>`.

Na standardním vstupu jsou počáteční zůstatky na prvním řádku, počet `n` na
druhém a potom `n` řádků `<FROM> <TO> <AMOUNT>` s `FROM`/`TO` z `{A, B}`.

Spusť každý převod ve vlastním vlákně, připoj je všechna, potom vypiš
`A <balance>`, `B <balance>`, `MOVED <n>`.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

Ve startovním kódu jsou špatně dvě věci a jen jedna z nich je vidět na
výstupu. Odečte ze zdroje a nikdy nepřičte cíli — to je ta viditelná chyba. Ta
druhá je tvar: zamykat *nejdřív zdroj* znamená, že dva opačné převody mohou
každý držet jeden zámek a čekat na druhý, navždy.

Vezmi oba zámky, **vždy ve stejném globálním pořadí** — `A`, potom `B`, ať
peníze jdou kterýmkoli směrem — a cyklus nemůže vzniknout.
'''
hints = [
  "Zamkni oba účty, než sáhneš na kterýkoli zůstatek, a vždy ve stejném pořadí.",
  "Který strážce dostane minus, rozhoduje směr peněz, ne to, který zámek se bere první.",
  "Oba strážci se na konci transfer zahodí, v obráceném pořadí, což je v pořádku — záleží na pořadí získání.",
]
