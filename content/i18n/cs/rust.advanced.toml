  "thread::spawn vrací JoinHandle<T>, kde T je cokoli, co vrací uzávěra.",
  "join() ti dá Result<T, _> — Err je panika a unwrap je tu poctivý.",
  "Vezmi si počet před smyčkou; iterace hodnotou ten Vec spotřebuje.",
]

