# ---------------------------------------------------------------- 10
[[quest]]
id    = "rust.advanced.10.async"
title = "Kde async doopravdy běží"
story = "Mei píše asynchronní Rust čtyři roky a ani jednou neviděla tu věc, která ho pohání."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel.

Žádný runtime tu není — žádné tokio, vůbec žádné crate. Napiš exekutor.

Dokonči `block_on`, který polluje future, dokud není `Ready`, a vrátí hodnotu
**a kolikrát polloval**. Potom přes `block_on` spusť blok `async`, který pro
každou hodnotu v pořadí awaitne `double(v)`, vypíše každý výsledek, a vypiš
`SUM <total>` a `POLLS <k>`.

`double` jednou předá řízení (yield), než vrátí, takže každá hodnota stojí
jeden poll navíc: `POLLS` je `n + 1`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        POLLS 4
```

`async fn` je stavový automat, který implementuje `Future`, a `.await` je
„pollni ten vnitřní; když je `Pending`, vrať `Pending` a zapamatuj si, kde
jsem byl“. Nic neběží, dokud to něco nepolluje. To něco je třicet řádků a
napsat je jednou má větší cenu než pětkrát si o tom číst.
'''
hints = [
  "Box::pin ti dá Pin<Box<F>> bez jakéhokoli unsafe a .as_mut() z něj udělá Pin<&mut F>, který poll chce.",
  "Context::from_waker(&waker) je celý ten obřad — Waker je to, čím by tě skutečný runtime znovu naplánoval.",
  "Tento exekutor při Pending točí naprázdno. Skutečný by vlákno uspal, dokud se waker neozve, a to je jediný zajímavý rozdíl.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.send-sync"
title = "Proč to nepřejde"
story = "Stejný kód, stejný Vec, jedno slovo jinak, a jeden z těch dvou se nezkompiluje. Řekni které slovo a proč."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel.

Sečti je ve dvou vláknech přes jeden sdílený součet, potom vypiš:

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

Poslední dva řádky se vypíší jen tehdy, když `assert_send` a `assert_sync`
ten handle přijmou — a ty dvě funkce za běhu nedělají nic. Jsou to
`fn assert_send<T: Send>(_: &T) {}`: kontrolou je ta mez a odehraje se při
kompilaci, nebo vůbec.

Startovní kód se nezkompiluje a ta chyba je lekce. `Rc` není `Send`, protože
jeho počítadlo referencí je obyčejné neatomické celé číslo — dvě vlákna
klonující jeden `Rc` by na něm soupeřila, takže kompilátor `Rc` přes hranici
vlákna vůbec nepustí. `Arc` je totéž s atomickým počítadlem a `Send` je.

`Sync` je druhá polovina: `T` je `Sync`, když `&T` je `Send`. `Mutex<T>` je
`Sync` pro každé `T: Send`, protože právě zámek dělá sdílený přístup
bezpečným.
'''
hints = [
  "Chyba je E0277: `Rc<Mutex<i64>>` cannot be sent between threads safely. Změní se jeden název typu a s ním jeden import.",
  "Počítadlo v Rc je obyčejné usize; v Arc je to AtomicUsize. Ten jediný rozdíl je celý důvod, proč jeden je Send a druhý ne.",
  "assert_sync(&*total) se ptá na samotný Mutex, ne na Arc kolem něj — Mutex<T> je Sync, kdykoli T je Send.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "rust.advanced.12.dispatch"
title = "Teď, nebo později"
story = "Stejné dvě výlohy, stejné vykreslení, a zkoušející chce na tabuli obě podoby naráz."
brief = '''
Na standardním vstupu je počet `n` a potom `n` řádků `SHOP <NAME> <FLOOR>` nebo
`STOP <ROUTE>`.

Vykresli každou značku **dvakrát**: jednou přes
`render_static<T: Sign>(sign: &T)` a jednou přes
`render_dynamic(sign: &dyn Sign)`, v tomto pořadí — všechny statické, potom
všechny dynamické. Potom vypiš `DYNAMIC <k>`, délku
`Vec<Box<dyn Sign>>`.

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: HYSAN / F4
        TRAM 2
        SOGO / F1
        HYSAN / F4
        TRAM 2
        SOGO / F1
        DYNAMIC 3
```

Obě dají stejný text a nejsou totéž. `render_static` je monomorfizovaná:
kompilátor vyrazí jednu kopii na každý konkrétní typ a volání je přímé a dá se
inlinovat — ale typ musí být známý **na místě volání**, a proto se statický
průchod musí odehrát uvnitř parsovací větve, kde ještě víš, co jsi postavil.

`render_dynamic` bere tlustý ukazatel — data plus vtable — vyhledá metodu za
běhu a je jí jedno, co drží. To je jediný důvod, proč jeden `Vec` může držet
obojí.
'''
hints = [
  "render_static se musí volat tam, kde je konkrétní typ ještě vidět — uvnitř větve match, než se hodnota zabalí do Box.",
  "sign.as_ref() promění &Box<dyn Sign> v &dyn Sign; předání samotného boxu by potřebovalo druhou dereferenci.",
  "Obě funkce mají stejné jednořádkové tělo. Rozdíl je celý v signatuře a celý v tom, kde se metoda vyhledává.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "rust.advanced.13.interior-mutability"
title = "Změna přes sdílenou referenci"
story = "Počítadlo na dveřích musí růst, zatímco čtyři různé kusy kódu se na něj jen dívají."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel.

Vypiš čtyři řádky:

1. `CELL <k>` — `Cell<usize>` zvýšený jednou na každou hodnotu, přečtený zpět
   přes `.get()`, to vše přes obyčejnou referenci `&`
2. `REF <sum>` — kniha (ledger) naplněná hodnotami a sečtená
3. `RC <k>` — kniha je `Rc<RefCell<Vec<i64>>>` a držíš k ní **dva** handly;
   vypiš `Rc::strong_count`, dokud jsou oba naživu
4. `DOUBLE panic` — vezmi dva `borrow_mut()` na stejném `RefCell` naráz,
   schválně, a chyť paniku přes `std::panic::catch_unwind`

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T` normálně znamená, že to nikdo nemůže změnit. `Cell` a `RefCell` jsou
povolená výjimka a platí za ni každý jinou měnou: `Cell` jen přesouvá celé
hodnoty dovnitř a ven, takže nepotřebuje vůbec žádnou kontrolu; `RefCell`
vydává skutečné reference, a proto musí vynucovat pravidla výpůjček — za běhu,
panikou, místo při kompilaci chybou.

`Rc<RefCell<T>>` je dvojice, po které nakonec sáhne každý, a stojí za to umět
říct, co dělá která polovina. `Rc` dává hodnotě víc než jednoho vlastníka —
neatomické počítadlo referencí, takže není `Send` a nepřejde přes vlákno (to
byla mapa `send-sync`). `RefCell` dává těm vlastníkům právo měnit. Ani jedno
není `Mutex`. Sdílené **a** měnitelné je přesně to, co borrow checker při
kompilaci odmítá, takže tenhle vzor si to kupuje zpátky za běhu a účtuje ti
paniku, když to uděláš špatně.

Ta panika není chyba v úloze. Je to ta cena a vidět ji jednou je celý smysl.
'''
hints = [
  "Cell nemá borrow(): přes get() dostaneš kopii ven a přes set() vložíš celou hodnotu dovnitř. Proto nepotřebuje žádnou evidenci za běhu.",
  "ledger.borrow_mut().push(v) jako jeden příkaz nechá strážce zahodit u středníku, což je to, co drží smyčku legální.",
  "catch_unwind potřebuje kolem uzávěry AssertUnwindSafe, protože zachytává &RefCell; hlášení paniky jde stejně na stderr, který testy nečtou.",
  "Rc::clone(&ledger) se píše takhle, a ne .clone(), aby čtenář viděl, že se kopíruje handle, a ne Vec. Rc::strong_count ukazuje 2, dokud jsou oba handly naživu, a ty dva borrow_mut() v testu paniky mohou přijít po jednom z každého handlu — je to stejný RefCell a počítá je dohromady.",
]

