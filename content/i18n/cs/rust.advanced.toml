[[quest]]
id    = "rust.advanced.01.threads"
title = "Dvě pokladny, jeden pult"
story = "Pobočka v Times Square v poledne otevře druhou pokladnu a fronta se konečně pohne. Nic jiného se v obchodě nezměnilo."
brief = '''
Na standardním vstupu je počet `n` a potom `n` celých čísel.

Spusť jedno vlákno na každou hodnotu, které spočítá její druhou mocninu.
Připoj je (join) **v pořadí, v jakém jsi je spustil**, a vypiš každý výsledek
na vlastní řádek, potom `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Právě připojení v pořadí dělá výstup stejný při každém běhu. Vlákno, které by
vypisovalo samo za sebe, by takové nebylo.
'''
