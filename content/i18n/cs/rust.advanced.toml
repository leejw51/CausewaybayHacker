cenu než harness, který nedokážeš.
'''
hints = [
  "Tabulka je specifikace. Funkce je to, co je špatně.",
  "Tři ze čtyř případů selžou a ten jediný, který projde, je km = 0 — a přesně proto jeden testovací případ nic nedokazuje.",
  "V crate je to #[cfg(test)] mod tests s #[test] fn fares() a assert_eq!(fare(arg), want).",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.advanced.16.traits"
title = "Trait, který je jen její"
story = "Telefonní kiosek v Percival Street dopíše každý řádek dřív, než ho máš. Pro trait, který sis pojmenoval sám, žádné doplnění nemá."
brief = '''
Na standardním vstupu je počet `n` a potom `n` řádků, každý buď

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` — `ROUTE` je číslo

Vypiš jeden řádek na značku jako `<tag> <rendering>`, potom `SIGNS <n>`:

* `Shop` se vykreslí jako `<NAME> / F<FLOOR>` a jeho tag je `SIGN`
* `Stop` se vykreslí jako číslo své linky a jeho tag je `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

Deklaruj jeden trait a implementuj ho pro dvě různé struktury:

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` je **výchozí metoda**. `Shop` o ní nic neříká a dostane `SIGN`;
`Stop` si napíše vlastní a dostane `TRAM`. To je ta polovina traitů, na
kterou lidé na pohovoru zapomínají: trait není jen seznam signatur, může nést
chování, a přepsání je dobrovolné.

Vypisuj přes **jednu** funkci, `fn show<T: Sign>(sign: &T)`. Ta mez je
smlouva — `show` neví nic o `Shop` ani `Stop`, jen že cokoli dostala, má
`render` a `tag`. Kompilátor vyrazí jednu kopii `show` na každý konkrétní typ
a volání jsou přímá.

Startovní kód se nezkompiluje. Trait je deklarovaný a struktury existují, a to
samo o sobě nic nekupuje: `show(&Shop { .. })` je E0277, *the trait
bound `Shop: Sign` is not satisfied*. Deklarovat trait a implementovat ho jsou
dva oddělené úkony a v Rustu se ten druhý vždycky vypisuje.

Obě značky v jednom `Vec` by byly jiný mechanismus — `Box<dyn Sign>`, ukazatel
plus vtable, vyhledaná za běhu. Tady ho nepotřebuješ, protože na každém místě
volání je konkrétní typ pořád vidět. To je otázka příští mapy, a vědět, který
z těch dvou držíš, je to, na co se ptá.
'''
hints = [
  "impl Sign for Shop patří mimo strukturu. Trait říká co; impl říká jak; a kompilátor to druhé z prvního neodvodí.",
  "Nech tag v impl pro Shop úplně vynechaný a vezme si verzi z traitu. Napiš ho v impl pro Stop a vyhraje ta ze Stop. To je celé, co výchozí metoda znamená.",
  "show<T: Sign>(sign: &T) je generická, takže typ musí být známý tam, kde se volá — což je uvnitř větve match, dokud ještě vidíš, co jsi právě postavil.",
  "Jeden Vec držící obojí by potřeboval Box<dyn Sign>, a to je jiný mechanismus s vyhledáním za běhu. Nikdo to po tobě nechce a sáhnout po něm tady by byla špatná odpověď na otázku o traitech.",
]

