id    = "rust.advanced.01.shadowing"
title = "Tři jména, jedno jméno"
story = "Kiosek u přechodu před Sogo drží cenu jako text, jako číslo a jako peníze a všem třem říká price."
brief = '''
Přečti jeden řádek: částku v centech, zapsanou číslicemi.

Vypiš tři řádky:

1. kolik znaků má oříznutý text
2. částku jako číslo
3. částku v dolarech s přesně dvěma desetinnými místy

```
input:  1234
output: 4
        1234
        12.34
```

Částka je nezáporná a vejde se do `i64`. Udělej to s jedním jménem,
dvakrát zastíněným — `&str`, potom `i64`, potom `String`.
'''
hints = [
  "Druhé `let cents = ...` nepřiřazuje; vytvoří novou vazbu, která tu starou schová, a může mít jiný typ.",
  "Proto zastínění není `mut`: `mut` typ zachovává, zastínění ne.",
  "Dvě desetinná místa s úvodní nulou je šířkový příznak {:02}.",
]

