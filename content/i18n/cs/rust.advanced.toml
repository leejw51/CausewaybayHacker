[[quest]]
id    = "rust.advanced.10.str-and-string"
title = "První otázka"
story = "Každý pohovor na Rust v Hongkongu jí začíná a Mei na ni už dvakrát odpověděla špatně."
brief = '''
Přečti jeden řádek. Vypiš tři řádky:

1. jeho první slovo (oddělené bílými znaky) jako **vypůjčený** `&str` — žádná
   alokace, žádné `to_string()`
2. totéž slovo velkými písmeny, což musí být vlastněný `String`, protože verze
   velkými písmeny není řezem ničeho, co už existuje
3. `SAME YES`, pokud se ta dvě rovnají, jinak `SAME NO`

```
input:  lucky mac
output: lucky
        LUCKY
        SAME NO
```

`&str` je pohled do textu, který vlastní někdo jiný. `String` vlastní buffer,
který může růst. `first_word` vrací pohled, takže si jeho návratový typ půjčuje
z argumentu a nic nealokuje — a to je celá odpověď na otázku, kterou ve
skutečnosti kladou.
'''
hints = [
  "split_whitespace().next() dává Option<&str> a unwrap_or na něm promění prázdný řádek v prázdné slovo.",
  "to_uppercase vrací String, ne &str — musí alokovat, protože výsledek není kusem vstupu.",
  "&str a String se porovnávají přímo; standardní knihovna mezi nimi rovnost implementuje, takže as_str() nepotřebuješ.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "rust.advanced.11.combinators"
title = "Bez jediného unwrapu"
story = "Alex pořád tvrdí, že v Rustu je to samý unwrap. Napiš čtečku sloupce znovu, bez unwrapu v části, která může selhat."
brief = '''
Na standardním vstupu je počet `n` a potom `n` řádků, každý má být celé číslo.

Pro každý řádek vypiš dvojnásobek hodnoty, nebo `-1`, pokud se nedá naparsovat.
Potom vypiš `SOME <k>`, kolik se jich naparsovalo, a `FIRST <v>` — první
hodnotu, která se naparsovala — nebo `FIRST NONE`.

```
input:  3
        21
        xx
        -4
output: 42
        -1
        -8
        SOME 2
        FIRST 21
```

Udělej to kombinátory: `.ok()` promění `Result` v `Option`,
`.map(|v| v * 2)` působí jen na hodnotu, která tam je, a `.unwrap_or(-1)`
dodá odpověď, když tam není. `find_map` ti dá poslední řádek jedním
průchodem.

`unwrap()` by na řádcích, které se naparsují, také „fungoval“ — a na `xx` by
pak shodil celý program. `unwrap_or` panikařit nemůže. Vědět, co je co, je
tahle ulice.
'''
hints = [
  "parse::<i64>() tu potřebuje turbofish, protože nic dál po proudu typ pro kompilátor nefixuje.",
  ".ok() chybu zahodí schválně — nehlásíš, proč to selhalo, jen že to selhalo.",
  "find_map spouští uzávěru, dokud jedna nevrátí Some, takže se zastaví na prvním řádku, který se naparsuje.",
]

