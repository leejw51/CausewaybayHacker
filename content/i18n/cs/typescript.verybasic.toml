[[quest]]
id    = "typescript.verybasic.19.heap"
title = "Nejnaléhavější první"
story = "Poruchy chodí do velína v libovolném pořadí a stěna má pokaždé ukázat jako další tu nejnaléhavější; seznam, na kterém se drží, netuší, která to je."
