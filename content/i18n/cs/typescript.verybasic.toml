  "const line = Line[word.toUpperCase() as keyof typeof Line]; — jména jsou velkými písmeny.",
  "Line[word as keyof typeof Line] se zkompiluje, protože `as` je slib, který tsc bere na důvěru; za běhu je Line[\"tsuenwan\"] undefined.",
]

