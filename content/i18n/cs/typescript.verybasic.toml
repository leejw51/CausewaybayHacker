id    = "typescript.verybasic.24.lambdas"
title = "Sudá patra"
story = "Obrazovky na sudých patrech parkovacího domu platí nájem podle čtverce patra, suterény včetně, a lichá patra neplatí nic; účetní kniha chce jeden součet."
brief = '''
`xs` drží celá čísla z řádku. `total` musí být součet druhých mocnin SUDÝCH hodnot, postavený z `filter`, `map` a `reduce` a tří arrow funkcí. `reduce` potřebuje počáteční hodnotu, jinak prázdné pole nemá od čeho začít.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "const total = xs.filter((x) => x % 2 === 0).map((x) => x * x).reduce((a, b) => a + b, 0);",
  "reduce bez 0 hodí na prázdném poli TypeError: každá hodnota byla lichá a nebylo co sčítat.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.verybasic.25.threads"
title = "Všechny panely najednou"
story = "Každý panel stěny Hysan Place renderuje svůj vlastní snímek a stěna se rozsvítí dřív, než kterýkoli z nich skončí."
brief = '''
Žádná vlákna tu nejsou: jedna smyčka událostí a `square` jí vrací řízení, zatímco spí. Každé volání už bylo spuštěno a jeho promise je v `tasks`. Než se vypíšou výsledky, musí `main` POČKAT, až se všechny vyřídí. `Promise` má funkci, která z pole promisů udělá jeden, a `await` na něj čeká.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "await Promise.all(tasks); — jeden promise pro všechny a na něj await.",
  "Promise.all(tasks) bez await promise postaví a rovnou ho mine; tasks.join() je metoda pole a nic nespojí.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.verybasic.26.mutex"
title = "Jeden čítač, čtyři feedy"
story = "Čtyři prodejní feedy přičítají do jednoho čítače na konzoli velína; zámek existuje a nikdo na něj před čtením nečeká."
brief = '''
Jedno vlákno, a přesto souběh: každý worker přečte `counter`, udělá `await` a zapíše ho zpátky, a ostatní workery běží v té mezeře. `lock` je malý asynchronní zámek. Před čtením musí každý worker zámek VZÍT a počkat, dokud ho nemá; uvolnění je už napsané za zápisem. `acquire` vrací promise, který se vyřídí, když je zámek tvůj.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1000
output: 4000
```
'''
hints = [
  "await lock.acquire(); — pak čtení a zápis, pak uvolnění, které už tam je.",
  "lock.acquire() bez await o zámek požádá a čítač přečte stejně, dřív než ho má.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "typescript.verybasic.27.binary-tree"
title = "Any"
story = "23:59 ve velínu ve třicátém patře: feed přijde s typem `any`, každá kontrola projde a obrazovka na Times Square ukáže `undefined` dvanáctimetrovými písmeny. Jedna anotace by to chytila."
brief = '''
Id obrazovek jdou do binárního vyhledávacího stromu a každý potomek má anotaci `TreeNode | null` — ne `any` — takže tsc udělá z prázdného případu případ. `insert(n, v)` vrací kořen stromu, ve kterém je `v`; případ `null` a pravá strana jsou napsané. Pro menší `v` se levý potomek musí nahradit výsledkem vložení do něj, aby se z potomka `null` stal uzel.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v); — rekurze vrací nový kořen podstromu; ulož ho.",
  "Volání insert bez uložení výsledku nechá null tam, kde byl, a tsc to nevidí: typy spolu všechny souhlasí.",
]
