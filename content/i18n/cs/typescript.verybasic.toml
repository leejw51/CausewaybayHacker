id    = "typescript.verybasic.06.loops"
title = "Součet"
story = "Velín ve třicátém patře sčítá své obrazovky jedna plus dvě plus tři dolů po racku a součet na konzoli ukazuje nulu."
brief = '''
`n` je kladné celé číslo. Smyčka musí projít každé celé číslo od 1 až po `n` včetně a každé přičíst do `total`. Hlavička `for` má začátek, podmínku kontrolovanou před každým průchodem a krok.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  4
output: 10
```
'''
