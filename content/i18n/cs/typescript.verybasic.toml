[[quest]]
id    = "typescript.verybasic.10.enums"
title = "Barva linky"
story = "Panel MTR nad východem Causeway Bay na stěně Hysan jmenuje tři linky; feed posílá slovo a panel potřebuje člen enumu, který mu odpovídá."
brief = '''
`word` je jedno z `island`, `tsuenwan`, `kwuntong`. Program z něj musí udělat odpovídající člen `Line`. Enum se dá indexovat jménem člena, ale jen klíčem, o kterém tsc ví, že je jedním z jeho jmen: `keyof typeof Line` je ta množina jmen a `as` řekne tsc, že řetězec jedním z nich je. Aserce se za běhu vymaže — nic nekontroluje, takže řetězec by měl sedět.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  tsuenwan
output: red
```
