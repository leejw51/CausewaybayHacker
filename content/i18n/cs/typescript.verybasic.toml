  "for (let i = 1; i <= n; i++) { — menší nebo rovno, takže se projde i samotné n.",
  "for...in prochází klíče objektu; číslo žádné nemá a tsc to nenechá zkusit.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.verybasic.07.functions"
title = "Sazba za slot"
story = "Obrazovka na Times Square účtuje prvních deset reklamních slotů noci po pěti a každý další po třech; účtovací funkce slibuje číslo a tsc ji nesestaví."
brief = '''
`fare(rides)` musí vrátit platbu: prvních deset jízd po 5, každou jízdu po desáté po 3. Signatura říká `: number`, takže tělo, které nic nevrátí, se nezkompiluje. Funkce vrací hodnotu jedním klíčovým slovem.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  3
output: 15
```
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "Funkce s typem `: number`, která vypisuje místo vracení, se nezkompiluje: tsc řekne, že musí vrátit hodnotu.",
]

