[[quest]]
id    = "typescript.verybasic.08.structs"
title = "Jedna karta, dvě pole"
story = "Každá produktová karta v aplikaci Lee Garden má jméno a cenu; konstruktor cenu nikdy nenastaví a build se zastaví na řádku, který ji sliboval."
brief = '''
Konstruktor `Stall` dostane `name` a `price`. Třída deklaruje `price: number` a pod `strict` musí být každé deklarované pole přiřazeno v konstruktoru. Musí uložit `price` na objekt stejně, jako se ukládá `name`, aby ho `s.price` přečetlo zpátky.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "this.price = price; — this je objekt; holé jméno je parametr.",
  "this.price = name; se nezkompiluje: name je řetězec a pole je číslo.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.verybasic.09.struct-method"
title = "Řádek košíku"
story = "Cena krát množství je jeden řádek každého košíku v aplikaci Lee Garden a metoda, která to má říct, slibuje číslo a nevrací žádné."
brief = '''
`Stall.total()` musí vrátit cenu krát množství. Parametry konstruktoru s `public` deklarují pole a rovnou je uloží; uvnitř metody se k polím objektu dostaneš přes `this`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  tofu 12 3
output: tofu: 36
```
'''
