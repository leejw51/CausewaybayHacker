# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.verybasic.14.maps"
title = "Počet ťuknutí"
story = "Aplikace Lee Garden počítá ťuknutí na produkt, jeden řádek na produkt; první ťuknutí na cokoli nenajde řádek, ke kterému by přičetlo."
brief = '''
`counts` je `Map<string, number>`. Pro každé slovo `w` musí program přičíst jedničku k jeho počtu, poprvé od nuly. `get` má typ `number | undefined`, protože klíč může chybět, a `??` dodá hodnotu, která se použije, když chybí.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts.set(w, (counts.get(w) ?? 0) + 1); — výchozí hodnota v závorkách, pak přičíst.",
  "counts.get(w)! + 1 se zkompiluje — ! řekne tsc, že hodnota tam je — a za běhu je undefined + 1 NaN.",
]

