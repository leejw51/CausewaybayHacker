# TYPESCRIPT LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the
# prose of `content/typescript/verybasic.toml`, quest by quest, and nothing
# else. Code blocks, identifiers, the quiz's four choices, sample input and
# output and the exact strings a program must print are the English pack's and
# are never translated.

pack   = "typescript.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.verybasic.01.print"
title = "První obrazovka"
story = "19:00 nad Times Square. Velká obrazovka se rozsvítí načerno a první řádek noci se musí napsat ručně."
brief = '''
Program musí vypsat přesně `hello, causewaybay` na jeden řádek. Jedna metoda na globálním objektu `console` zapíše řádek na standardní výstup.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
output: hello, causewaybay
```
'''
hints = [
  "console.log(\"hello, causewaybay\"); — závorky a čárka uvnitř řetězce.",
  "Žádné print() tu není; na jméno, které nikdy neviděl, odpoví tsc chybou TS2304 dřív, než se cokoli spustí.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.verybasic.02.int-types"
title = "Rozdělený playlist"
story = "LED stěna Hysan Place rozděluje klipy noci mezi své panely; plánovač má říct, kolik dostane každý panel a kolik jich zbude, a neříká nic."
brief = '''
`a` a `b` jsou celá čísla. Program musí vypsat celočíselný podíl a zbytek na jeden řádek, oddělené mezerou. TypeScript má jediný typ `number` a žádný operátor celočíselného dělení: `/` dá vždy zlomek, `Math.trunc` ho zahodí a `%` je zbytek.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7 2
output: 3 1
```
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); — console.log dá mezi své argumenty mezeru.",
  "a / b je 3.5, ne 3: každé číslo je double. A // tu není operátor; začíná komentář.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.verybasic.03.floats"
title = "Čekací doba"
story = "Tramvajová tabule na Yee Wo Street ukazuje čekání na dvě desetinná místa a dnes večer ukazuje 3.5 s mezerou tam, kam patří poslední číslice."
brief = '''
`x` a `y` jsou čísla. Program musí vypsat `x / y` s přesně dvěma číslicemi za tečkou. Číslo má metodu, která ho naformátuje s pevným počtem desetinných míst a vrátí řetězec.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "console.log((x / y).toFixed(2)); — závorky zajistí, že se nejdřív dělí.",
  "Math.round(x / y * 100) / 100 je pořád číslo a číslo se vypíše jako 3.5, ne 3.50.",
]

