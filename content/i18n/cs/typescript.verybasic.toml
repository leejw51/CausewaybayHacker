brief = '''
`xs` drží celá čísla z řádku. Program musí `xs` seřadit na místě, vzestupně, než se vypíše. Metoda pole `sort` bere komparátor: záporný výsledek nechá první argument první. Bez něj `sort` porovnává čísla jako řetězce.

