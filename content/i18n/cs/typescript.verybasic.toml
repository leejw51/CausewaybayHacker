[[quest]]
id    = "typescript.verybasic.05.bool-if"
title = "Východ, nebo západ"
story = "Příjezdové tabule na Yee Wo Street míří na sudých zastávkách na východ a na lichých na západ; montér na žebříku má číslo zastávky a potřebuje stranu."
brief = '''
`n` je kladné celé číslo. Program musí vypsat `even`, když je `n` dělitelné dvěma, a jinak `odd`. Podmínka je `if`, který porovná zbytek s nulou operátorem striktní rovnosti, dlouhým tři znaky.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  4
output: even
```
'''
