```
output: (2, 5, 5) (2, 5, 4) 1.0
```
'''
hints = [
  "torch.softmax(q @ k.transpose(-2, -1) / d ** 0.5, dim=-1), pak att @ v.",
  "dim=-1 u softmaxu: každá query rozdělí svou attention mezi keys, takže poslední osa dává dohromady jedničku.",
]

