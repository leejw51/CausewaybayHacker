id    = "pytorch.advanced.10.retain-graph"
title = "Pokus o backward dvakrát"
story = "Dvě ztráty na jednom dopředném průchodu a druhý backward hází chybu, že buffery už byly uvolněné."
brief = '''
`backward()` graf uvolňuje, jak jím prochází. Druhý `backward()` přes tentýž dopředný průchod proto vyhodí chybu — buffery jsou pryč — a `retain_graph=True` je to, co je zachová.

Poctivá oprava je obvykle ztráty sečíst a zavolat `backward()` jednou; `retain_graph` je pro případ, kdy opravdu potřebuješ dva samostatné průchody, a stojí paměť.

Spusť druhý průchod se zachovaným grafem a vypiš nasčítaný gradient: `d(w²)/dw + d(3w)/dw` při `w = 2` je `4 + 3`.

```
output: caught 7.0
```
'''
hints = [
  "first.backward(retain_graph=True) — pak má druhý průchod pořád graf, kterým může projít.",
  "Gradienty se sčítají, takže vypsané číslo je součet obou derivací.",
]

