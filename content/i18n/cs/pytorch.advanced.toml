[[quest]]
id    = "pytorch.advanced.06.masked-fill"
title = "Minus nekonečno"
story = "Na vyplňovací místa v dávce se dává attention, jako by to byla slova, a model se naučil předpovídat padding."
brief = '''
Chceš-li pozici vyřadit ze softmaxu, nastav její skóre na `-inf` **před** softmaxem, ne její pravděpodobnost na nulu po něm: `exp(-inf)` je 0 a zbylé pravděpodobnosti se pořád sečtou na jedničku. Vynulování potom nechá řádek, který dává dohromady méně než jedna.

`scores.masked_fill(mask, float("-inf"))` vyplní místa, kde je booleovská maska `True`.

Zamaskuj poslední pozici a vypiš zaokrouhlené pravděpodobnosti a součet řádku.

```
output: [0.7311, 0.2689, 0.0] 1.0
```
'''
hints = [
  "scores.masked_fill(keep_out, float(\"-inf\")) — vyplnit tam, kde je maska True.",
  "Zamaskovaná položka měla největší skóre; maskování po softmaxu by ji nechalo dominovat.",
]

