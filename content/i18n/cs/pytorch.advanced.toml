id    = "pytorch.advanced.17.layernorm"
title = "Po tokenech, ne po dávce"
story = "Transformer v racku normalizuje každý token sám o sobě a verze napsaná tady normalizuje podle dávky a ujíždí, kdykoli se dávka změní."
