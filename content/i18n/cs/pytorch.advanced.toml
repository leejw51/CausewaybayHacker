[[quest]]
id    = "pytorch.advanced.07.keepdim"
title = "Osa, která zmizela"
story = "Odečtení maxima každého řádku od řádku udělá z obdélníkového tenzoru čtvercový a nic nevyhodí chybu."
brief = '''
Redukce odstraní osu, kterou redukovala. `x.max(dim=1).values` na `(2, 3)` dá `(2,)` a jeho odečtení od `(2, 3)` se broadcastuje podél **špatné** osy — postaví tu 2 na místo té 3, a když čísla náhodou sedí, potichu spočítá nesmysl.

`keepdim=True` nechá osu na místě s velikostí 1, a to je to, co broadcasting chce.

Vypiš tvar bez keepdim, s ním a maxima řádků po odečtení, která jsou nulová.

```
output: (2,) (2, 1) [0.0, 0.0]
```
'''
hints = [
  "x.max(dim=1).values a x.max(dim=1, keepdim=True).values — max vrací pojmenovanou n-tici, ne tenzor.",
  "Přesně tohle odečtení je první řádek numericky stabilního softmaxu.",
]

