`gather` vybere z každého řádku jeden prvek podle indexu, bez smyčky. Na tenzoru pravděpodobností `(batch, classes)` a tenzoru labelů `(batch,)` je `probs.gather(1, labels.unsqueeze(1)).squeeze(1)` pravděpodobnost, kterou model dal správné třídě, pro každý vzorek.

`unsqueeze` není ozdoba: index pro `gather` musí mít stejný počet rozměrů jako zdroj.

