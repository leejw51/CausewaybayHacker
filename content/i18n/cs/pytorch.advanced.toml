Rozdělení na více hlav je jediný díl, který jsi ještě neviděl, a je to jen reshape: z `(B, t, D)` se stane `(B, H, t, D/H)`, takže dávkové maticové násobení z uzlu 8 udělá každou hlavu najednou.

