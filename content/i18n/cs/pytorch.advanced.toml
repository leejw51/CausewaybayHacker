brief = '''
Scaled dot-product attention je jeden výraz: `softmax(QKᵀ / √d) V`. Škálování tam je, protože skalární součin dvou `d`-rozměrných vektorů roste s `d` a bez něj se softmax nasytí a gradienty zmizí.

Každý řádek matice attention dává dohromady jedničku — je to vážený průměr přes values, a nic víc.

