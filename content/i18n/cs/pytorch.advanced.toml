Vypiš dtype a hodnoty skutečného dělení, celočíselného dělení a explicitního převodu na float.

```
output: torch.float32 [0.5, 1.0, 1.5] torch.int64 [0, 1, 1] torch.float32 [0.5, 1.0, 1.5]
```
'''
