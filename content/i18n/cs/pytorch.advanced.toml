id    = "pytorch.advanced.05.gather"
title = "Skóre, které dal správné odpovědi"
story = "Jistota pro správnou třídu u každého vzorku, z dávky logitů, a smyčka, která to dělá, je nejpomalejší řádek celé evaluace."
