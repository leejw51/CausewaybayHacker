# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.advanced.01.view-contiguous"
title = "View, který odmítl"
story = "Dávka se cestou dovnitř transponuje a zploštění, které rok fungovalo, hází chybu o souvislosti paměti."
brief = '''
`view` vyžaduje, aby paměť tenzoru už byla rozložená tak, jak to nový tvar potřebuje. Transpozice žádnou paměť nepřesouvá — mění jen strides — takže `view` na transponovaném tenzoru vyhodí `RuntimeError`, a to je jedna z těch dvou tří chyb, na které se pohovor na PyTorch ptá vždycky.

`reshape` kopíruje, když musí, a funguje tak či tak. `contiguous()` udělá kopii explicitně, a tím je `view` zase přípustný.

Vypiš, jak `view` na transponovaném tenzoru selže, a pak oba způsoby, jak zploštění stejně dostat.

```
output: RuntimeError True True
```
'''
hints = [
  "x.reshape(6) kopíruje, když musí; x.contiguous().view(6) nejdřív udělá kopii a pak view.",
  "Transpozice mění strides, ne paměť — a přesně to view nesnese.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.advanced.02.in-place"
title = "Podtržítko"
story = "Někdo ušetřil paměť tím, že přidal podtržítko, a zpětný průchod teď hází chybu, že proměnná potřebná pro gradient byla změněna."
brief = '''
Podtržítko na konci znamená *na místě*: `relu_`, `add_`, `mul_`. Operace na místě ušetří alokaci a zničí hodnotu, kterou zpětný průchod bude potřebovat, a autograd to chytí — v čase `backward()`, daleko od řádku, který to způsobil.

Udělej tu samou aritmetiku mimo místo, aby zpětný průchod přežil, a vypiš gradient.

`y = w * 2`, pak `y = y + 1`, pak `loss = y.sum()`: gradient ztráty podle `w` je `2` pro každý prvek.

```
output: [2.0, 2.0, 2.0] caught
```
'''
hints = [
  "y = y + 1 převáže jméno na nový tenzor; y += 1 by měnilo na místě a rozbilo graf.",
  "Přičtení konstanty gradient nemění — d(2w + 1)/dw je pořád 2.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "pytorch.advanced.03.detach-clone"
title = "Kopie a řez"
story = "Logovací kód si nechal tenzor ztráty místo jeho čísla a ve 04:00 jsou čtyři hodiny grafů pořád v paměti."
brief = '''
`clone()` zkopíruje data a **zůstane v grafu** — gradienty jím protékají. `detach()` data sdílí a **graf opustí** — zpátky nic neteče. Nejsou to alternativy; odpovídají na různé otázky.

`x.detach().clone()` je to, co chceš na snímek: nová paměť, žádný graf.

Pro každou ze tří možností vypiš, jestli vyžaduje grad a jestli sdílí úložiště s originálem.

```
output: clone True False detach False True snapshot False False
```
'''
hints = [
  "x.clone(), x.detach(), x.detach().clone() — v tomhle pořadí.",
  "detach sdílí tu samou paměť, takže zápis do něj zapisuje i do originálu.",
]

