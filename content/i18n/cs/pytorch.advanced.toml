[[quest]]
id    = "pytorch.advanced.08.batched-matmul"
title = "Jedno násobení na hlavu"
story = "Čtyři attention hlavy a kód přes ně jede smyčkou v Pythonu. Profiler říká, že ta smyčka je celý model."
brief = '''
`@` na tenzorech s víc než dvěma rozměry je **dávkové** maticové násobení: poslední dvě osy jsou matice, všechno před nimi je dávka a osy dávky se broadcastují.

`(B, H, T, d) @ (B, H, d, T)` dá `(B, H, T, T)` — a to je přesně tenzor attention skóre, každá hlava každé sekvence najednou, bez smyčky.

Postav ho a vypiš tvar a jestli sedí s odpovědí ze smyčky.

```
output: (2, 4, 5, 5) True
```
'''
hints = [
  "q @ k.transpose(-2, -1) — záporné osy, takže stejný řádek funguje bez ohledu na počet os dávky.",
  "k.t() funguje jen na 2-D tenzoru a na 4-D vyhodí chybu.",
]

