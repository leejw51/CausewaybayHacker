[[quest]]
id    = "typescript.basic.05.loops"
title = "Počítání snímků"
story = "Obrazovka na Times Square čísluje snímky každé smyčky od 1 do n, operátor chce jejich součet a kolik jich připadlo na každý třetí, a čítač pod náhledem ukazuje dvakrát nulu."
brief = '''
Počítací smyčka `for` má v závorkách tři části: začátek, podmínku
kontrolovanou před každým průchodem a krok. `for (let i = 1; i <= n;
i++)` počítá od `1` až po `n` včetně — `<=` je to, co z `n` dělá
poslední hodnotu.

```
for (let i = 1; i <= n; i++) {
  total += i;
  if (i % 3 === 0) {
    threes += 1;
  }
}
```

`n` je načteno, `total` a `threes` začínají na `0` a tělo smyčky je
napsané. Napiš řádek `for` nad tělo přesně tak, jak je ukázán.

```
input:  10
output: 55
        3
```
'''
hints = [
  "for (let i = 1; i <= n; i++) { — začátek, podmínka, krok, oddělené středníky.",
  "i < n by skončilo na n - 1; součtu by chybělo n.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "typescript.basic.06.functions"
title = "Sazba za slot"
story = "Velín účtuje inzerentovi za každý slot na velké obrazovce, po desátém levněji, a faktura ve třicátém patře říká nulu všem."
brief = '''
`function` vytvoří funkci: jméno, parametry s jejich typy, návratový typ
za dvojtečkou a tělo ve složených závorkách. `return` vrátí hodnotu tomu,
kdo ji zavolal. Typy jsou smlouva — tsc proti nim zkontroluje každé volání
a pak je vymaže; tělo může pořád být jediný `return` s celou odpovědí jako
jedním výrazem.

```
function fare(slots: number): number {
  return Math.min(slots, 10) * 5 + Math.max(slots - 10, 0) * 3;
}
```

Prvních deset slotů stojí `5` za kus a každý slot potom `3`. `main` načte
`n` a vypíše `fare(n)`. Napiš řádek `return` ve `fare` přesně tak, jak je
ukázán.

```
input:  12
output: 56
```
'''
hints = [
  "return Math.min(slots, 10) * 5 + Math.max(slots - 10, 0) * 3; — min omezí levné sloty na deset, max nedovolí zbytku jít do záporu.",
  "Práce funkce končí u return; nic za ním v těle neproběhne.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "typescript.basic.07.structs"
title = "Jedna nabídka, tři pole"
story = "Karta nabídky v aplikaci Lee Garden má jméno, cenu a počet a řádek pokladny pod kartou ukazuje nulu na každém telefonu ve frontě."
brief = '''
`class` sdružuje typovaná pole a metody, které s nimi pracují. Pole se
deklarují s typy nahoře, `constructor` proběhne, když se objekt vytvoří
přes `new`, a vyplní je, a metoda je čte přes `this`. `this` není
volitelné: holé `price` uvnitř metody je jméno, které tsc nenajde.

```
class Offer {
  name: string;
  price: number;
  qty: number;
  // constructor(...) { ... } is written

  total(): number {
    return this.price * this.qty;
  }
}
```

`Offer`, jeho pole a konstruktor jsou napsané a `main` vypíše kartu přes
template literal. Napiš řádek `return` v `total` přesně tak, jak je
ukázán.

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return this.price * this.qty; — pole žijí na objektu, takže uvnitř metody jsou this.price a this.qty.",
  "Samotné price není v total() jméno; tsc odpoví Cannot find name 'price'.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "typescript.basic.08.enums"
title = "Tři linky, tři barvy"
story = "Obrazovka MTR u východu na Yee Wo Street maluje každou linku její vlastní barvou a dnes večer na ní každá linka vyjede modře jako Island."
brief = '''
`enum` je uzavřená množina pojmenovaných členů a je to jediný typ
TypeScriptu, který za běhu pořád existuje: tsc z něj udělá objekt, takže
`Line.TSUENWAN` je `1` a `Line["TSUENWAN"]` najde člena podle jména.
Kompilátor ho nechá indexovat jen jménem, které zná, takže řetězci
načtenému ze vstupu se řekne, jakými jmény smí být, přes `as keyof typeof Line`
— slib dávaný tsc, ne kontrola. `switch` přes členy je napsaný.

```
enum Line {
  ISLAND,
}

const line: Line = Line[word.toUpperCase() as keyof typeof Line];
```

Napiš řádek `const line` přesně tak, jak je ukázán.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = Line[word.toUpperCase() as keyof typeof Line]; — hranaté závorky najdou člena podle jména a jména jsou velkými písmeny.",
  "Bez as keyof typeof Line tsc odmítne: obyčejný řetězec může být jakékoli jméno a enum má jen tři.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "typescript.basic.09.vector"
title = "Playlist"
story = "Playlist na Times Square je řada délek reklam v sekundách; operátor jednu přidá, první zahodí, další upraví a seřadí je, a seřazený seznam dá 100 před 4."
brief = '''
Pole se upravuje na místě. `.push(x)` přidá hodnotu na konec,
`.splice(i, 1)` odstraní jednu hodnotu na indexu (ty za ní se posunou
dolů), `xs[i] = x` nahradí hodnotu na indexu a `.sort()` seřadí hodnoty,
na místě. **Výchozí řazení porovnává jako text**, takže
`[4, 100].sort()` je `[100, 4]`: čísla potřebují komparátor, funkci, která
vrátí záporné číslo, když má jít `a` první.

```
xs.push(100);
xs.splice(0, 1);
xs[0] = 7;
xs.sort((a, b) => a - b);
```

`xs` drží celá čísla z řádku a vypíše se po každém kroku. Napiš čtyři
řádky místo čtyř značek `// FILL`, v tomto pořadí.

```
input:  16 8 15 4
output: 16 8 15 4 100
        8 15 4 100
        7 15 4 100
        4 7 15 100
```
'''
hints = [
  "xs.push(100); pak xs.splice(0, 1); pak xs[0] = 7; pak xs.sort((a, b) => a - b); — jeden na každou značku, v tomto pořadí.",
  "xs.sort() bez komparátoru vypíše 100 15 4 7: seřadilo číslice jako text. (a, b) => a - b je seřadí jako čísla.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "typescript.basic.16.list"
title = "Ticker"
story = "Zpravodajský pás na úpatí stěny Hysan Place bere horkou zprávu na začátek a nejstarší shazuje z konce, a dnes večer pás běží prázdný."
brief = '''
