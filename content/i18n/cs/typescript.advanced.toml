[[quest]]
id    = "typescript.advanced.15.higher-order"
title = "Zabalené"
story = "Účtovací obrazovka chce vědět, kolikrát dnes večer proběhla funkce sazby, a funkce sazby nechce vědět, že ji někdo sleduje."
brief = '''
Na standardním vstupu je počet `n`, pak `n` délek v hodinách.

`price(hours)` je `500 + 100 * hours`. Zabal ji do `counted` tak, aby se
každé volání počítalo, aniž by o tom `price` věděla. Vypiš jednu cenu na
každou délku, pak `CALLS <n>`, pak `NAME <price.name>` — což musí pořád
říkat `price`.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

`@decorators` v TypeScriptu existují, ale jen na třídách a jejich členech;
volná funkce žádný nosit nemůže. To, čím dekorátor *je*, žádnou syntaxi
nepotřebuje: funkce, která bere funkci a vrací funkci. Takže
`const price = counted(function price(hours: number) { ... })` je celý
mechanismus a generika na `counted` — `<A extends unknown[], R>` — jsou
to, co mu dovolí zabalit jakoukoli signaturu a vrátit tutéž.

Funkce, kterou `counted` vrací, je closure jménem `wrapper`, a pokud neřekneš
jinak, její `name` je `"wrapper"`: poslední řádek výstupu starteru. Python
má `functools.wraps`; tady jméno zkopíruješ sám přes
`Object.defineProperty(wrapper, "name", { value: fn.name })` — `name` je
jen pro čtení, takže obyčejné přiřazení by ve striktním režimu vyhodilo
výjimku.

Počet žije na wrapperu: `wrapper.calls = 0` hned za deklarací funkce. `tsc`
to přiřazení vidí a přidá do typu funkce `calls: number`, takže
`price.calls` v `main` projde typovou kontrolou.
'''
hints = [
  "Object.defineProperty(wrapper, \"name\", { value: fn.name }) před return. Jeden řádek.",
  "wrapper.name = fn.name se zkompiluje a pak vyhodí TypeError: Cannot assign to read only property 'name'. defineProperty je cesta kolem.",
  "(...args: A) => R s A extends unknown[] je způsob, jak wrapper předá jakoukoli signaturu, aniž by ji znal, a jak si price po zabalení nechá typ (hours: number) => number.",
]

