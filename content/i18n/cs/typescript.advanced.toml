`Channel` ve starteru je hotový: `send`, `receive` a `close`, který probudí
každého čekajícího příjemce s `undefined`. Producent nikdy nezavolá
`close`, takže po poslední hodnotě příjemce čeká na promise, který nikdo
nikdy nevyřeší.

V Go je to `fatal error: all goroutines are asleep - deadlock!`. V Pythonu
je to zaseknutí, dokud to runner nezabije. Node nedělá ani jedno. Když ve
smyčce událostí nezbude nic, co by kdy mohlo cokoli probudit — žádné
časovače, žádné I/O, žádné immediates — proces prostě **skončí**, se
stavem `0`, uprostřed tvého `for (;;)`. Řádek `SUM` ani řádek `CLOSED`
nikdy neproběhnou a zvenku to vypadá jako úspěch. To je horší než pád, a
přesně to starter dělá.

Kanál zavírá producent. Nikdy konzument — strana, která ví, že proud
skončil, je strana, která ho ukončí.
'''
hints = [
  "Jeden řádek, na konci control: feed.close().",
  "Příjemce už kontroluje `=== undefined`. Čekal na něco, co producent nikdy neposlal. `if (!value) break` by se taky zastavilo — na první 0, kterou jeden skrytý případ posílá.",
  "Kdyby undefined mohlo být v kanálu skutečnou hodnotou, receive by vracel { done: true } | { done: false, value: T } — tentýž tvar, jaký vrací next() iterátoru, a ze stejného důvodu.",
]

# ---------------------------------------------------------------- 21
[[quest]]
id    = "typescript.advanced.21.worker-pool"
title = "Osm enkodérů"
story = "Čtyřicet klipů k vyrenderování pro stěnu Hysan Place a osm enkodérů v racku. Nikdo nechce čtyřicet enkodérů; chtějí, aby těch osm nikdy nestálo."
brief = '''
Na standardním vstupu jsou dvě celá čísla `w` a `n`, pak `n` hodnot.

Spusť pool `w` workerů. Každý worker ve smyčce: vezme další nezabraný index,
`await render(index, value)` — což vrátí `[index, value * value]` po pár
kolech smyčky událostí, jejichž počet závisí na indexu — a vloží dvojici do
`results`, dokud žádný index nezbývá. Počkej na každého workera, seřaď
výsledky podle indexu, vypiš `<index> <value>` jeden na řádek, pak
`WORKERS <w>`.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

Dvojice přicházejí v pořadí, v jakém úlohy **skončí**, což není pořadí, v
jakém začaly; nést index ve výsledku je to, co dělá výstup při každém běhu
stejným, a řazení podle něj je poslední řádek odpovědi.

`const i = next++` žádný zámek nepotřebuje, a po posledním questu stojí za
to vědět proč: mezi čtením `next` a jeho zvýšením není žádné `await`, takže
se mezi ně žádný jiný worker nedostane. Zámek byl vždycky potřeba jen přes
`await`.

Starter čeká na workery přes `workers.forEach(async (w) => {
await w; })`. Zkompiluje se a nečeká na nic: `forEach` zavolá asynchronní
callback, dostane zpátky promise a zahodí ho. Každý z callbacků čeká;
`main` nečeká na žádný z nich a vypíše prázdný výsledek.
'''
hints = [
  "await Promise.all(pool) místo forEach. forEach nikdy nečeká na nic, co jeho callback vrátí, asynchronní nebo ne.",
  "Výsledky přicházejí v pořadí dokončení; index v každé dvojici je jediný záznam o tom, odkud přišla, a řazení ji vrátí na místo.",
  "`for (const running of pool) await running;` funguje taky. Nefunguje žádná metoda pole, která bere callback — map, forEach, filter — použitá, jako by za tebe na callback čekala.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "typescript.advanced.22.async-await"
title = "Kde async vlastně běží"
story = "Mei píše `await` čtyři roky a ještě nikdy neviděla tu věc, která ho pohání. Velín má jednu smyčku a každá obrazovka na ostrově se na ní střídá."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

`async function double(value)` jednou ustoupí — `await null` — a vrátí
hodnotu zdvojenou. Spusť všech `n` přes `Promise.all`, vypiš každý výsledek
v pořadí vstupu, pak `SUM <total>` a `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`run` ve starteru prožene hodnoty přes `double` a dostane pole **promisů** —
a pak kompilátoru řekne, že je to pole čísel:

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc` to přijme, protože `as unknown as` je způsob, jak mu říct, ať přestane
kontrolovat. Přetypování se vymaže se všemi ostatními typy a za běhu je pole
pořád plné promisů: výstup je třikrát `[object Promise]` a `SUM`, který je
řetězcem z nich přilepených k nule. Přetypování není převod. Mění, čemu
kompilátor věří, a nic na hodnotě.

`Promise.all` vezme promisy a vyřeší se na jejich výsledky **v pořadí, v
jakém jsi je předal**, ať skončily v jakémkoli pořadí.

Kde to všechno běží? Na tom jednom vlákně, na střídačku. `await null` dá
zbytek funkce do fronty **microtasků**, kterou Node úplně vyprázdní, než
sáhne na časovač, immediate nebo jakékoli I/O — macrotasky.
`setTimeout(..., 0)` naplánovaný před tisícem awaitů pořád proběhne až po
všech. Nic tu není paralelní; věci běží na střídačku, na místech, kde
řekly, že se můžou zastavit.
'''
hints = [
  "Smaž přetypování a podívej se, co řekne tsc: Type 'Promise<number>[]' is not assignable to type 'number[]'. Ta chyba byla pravda, kterou přetypování skrývalo.",
  "return Promise.all(nums.map((v) => double(v))) — await je u volajícího, kde se čeká na run(nums).",
  "Promise.all drží pořadí argumentů. Kdybys chtěl výsledky tak, jak končí, nesl bys index sám, přesně jako v poolu workerů.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "typescript.advanced.23.work-queue"
title = "Kdo řekne, že je hotovo"
story = "Tři operátoři vyřizují frontu aktualizací obrazovek a vedoucí směny čeká, až fronta řekne, že je prázdná. Nikdy to neřekne, protože jí nikdo neřekl, že je aktualizace hotová, a ve 23:10 zhasne celá konzole."
brief = '''
Na standardním vstupu jsou dvě celá čísla `w` a `n`, pak `n` hodnot.

Dej dvojice `[index, value]` do `WorkQueue` ze starteru. Spusť `w`
konzumentských úloh, které ve smyčce berou dvojici, počkají jedno kolo,
zapíšou `value * 10` do `results[index]` a zavolají `taskDone()`. Hlavní
úloha čeká na `queue.join()`, pak frontu zavře, aby `get()` konzumentů
vrátilo `undefined` a oni skončili, počká na ně, pak vypíše výsledky v
pořadí indexů a `CONSUMERS <w>`.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join()` se vyřeší, když každá položka, která kdy prošla `put`, měla
odpovídající `taskDone()`. Konzumenti ve starteru ho nikdy nevolají. Takže
`main` čeká na `join`, konzumenti čekají v `get` na položky, které nikdy
nepřijdou, a ve smyčce událostí nezbylo nic, co by kohokoli probudilo.

To je **deadlock** — všichni čekají, nikdo se nehne — a nepotřebuje žádná
vlákna ani zámky: stačí dva promisy, z nichž každý čeká, až se pohne ten
druhý. Dva asynchronní mutexy vzaté dvěma úlohami v opačném pořadí jsou
totéž s větším obřadem. Odpověď Node na to je ta z minulé mapy: smyčka
vyschne a proces skončí, se stavem `0`, aniž by vůbec něco vypsal.

Oprava je zase jeden řádek, na straně konzumenta.
'''
hints = [
  "queue.taskDone() po zpracování každé položky. join počítá puty proti taskDone a nic jiného.",
  "Spusť starter a nevypíše nic a skončí s 0. Ne pád, ne zaseknutí: smyčce událostí došly věci, které by se kdy mohly stát.",
  "close() probudí každého konzumenta zaparkovaného v get() s undefined, což ukončí jejich smyčky; proto na ně main může po joinu počkat.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "typescript.advanced.24.finally"
title = "Zámek se zamkne stejně"
story = "Velín pro každou aktualizaci odemkne slot inzerenta a potom ho zase zamkne. Ten, který ve 22:40 dostal špatnou aktualizaci, je od té doby odemčený, protože zamykací kód byl za řádkem, který selhal."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků `<NAME> <CENTS>`, kde
`CENTS` má být celé číslo.

Napiš generátor `opened(name)`, který vypíše `OPEN <NAME>`, jednou vydá a
vypíše `SHUT <NAME>` — **ať tělo vyhodilo výjimku, nebo ne**. Tělo je smyčka
`for (const _ of opened(name))`, která naparsuje centy a přičte je k
součtu. Řádek, jehož centy se naparsovat nedají, se ohlásí jako `BAD <NAME>`
až poté, co se slot zavřel. Nakonec vypiš `TOTAL <sum>` a `REJECTED <k>`.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`for...of` přes generátor je strážce zdroje, a tady je proč: když tělo
smyčky skončí předčasně — `break`, `return` nebo výjimka — `for...of`
zavolá `return()` generátoru, který ho obnoví **u `yield`**, jako by
`yield` byl příkaz `return`. Kód za `yield` neproběhne. Kód ve `finally`
kolem `yield` ano. Starter žádné `finally` nemá a slot `WONG` se nikdy
nezavře.

TypeScript 5.2 má přesně na tohle `using` a `Symbol.dispose`, a tady nejsou:
knihovna `es2023` nemá `Symbol.dispose`, takže `using` se nezkompiluje.
`try`/`finally` je to, z čeho je `using` postavené.

Nechytej chybu uvnitř generátoru. Volající chce vypsat `BAD` a generátor,
který by ji spolkl, by vypsal `TOTAL`, jako by se nic nestalo.
'''
hints = [
  "try { yield; } finally { console.log(`SHUT ${name}`); } — finally je ta část, která proběhne na každé cestě.",
  "Výjimka projde ven skrz for...of poté, co return() spustil finally, takže ji catch v main pořád uvidí — proto se BAD vypíše za SHUT.",
  "Generátor není jediná cesta: funkce `withSlot(name, body)` s try/finally kolem `body()` dělá stejnou práci. Generátorová forma je ta, která ukazuje, co dělá for...of na cestě ven.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "typescript.advanced.25.pipeline"
title = "Stupně feedu"
story = "Feed pro tabule na Yee Wo Street prochází ve třicátém patře dvěma stupni: jeden umocní odečet na druhou, další drží průběžný součet, a tabule má vidět každý, jak přijde, ne celou noc ve 23:59."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Postav dvoustupňovou pipeline z **generátorů**:

1. `squares(values)` vydá každou hodnotu na druhou
2. `running(stream)` bere jakýkoli `Iterable<number>`, drží průběžný součet
   a vydává dvojice `[value, total]`

`main` vypíše každou dvojici jako `<square> <total>`, pak `PIPE <n>`.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

Ani jeden stupeň nestaví pole. Každý `yield` předá jednu položku dalšímu
stupni a zastaví se; `main` tahá, `running` tahá ze `squares`, `squares`
tahá ze vstupu. Nic se nespočítá dřív, než je to potřeba, a celá pipeline
drží v letu jednu položku.

Druhý stupeň ve starteru je generátor jen podle jména. Projde celý proud a
pak vydá **jednou**, na konci, s poslední hodnotou a konečným součtem — což
projde typovou kontrolou dokonale, protože `Generator<[number, number]>`
říká, jak každá položka vypadá, a nic o tom, kolik jich je. Tabule dostane
jeden řádek o půlnoci.
'''
hints = [
  "Přesuň yield dovnitř smyčky: yield [value, total] jednou na každou hodnotu.",
  "Výstup starteru je jeden řádek a PIPE 1. Stupeň, který vydává až za svou smyčkou, je pole s kroky navíc.",
  "running(squares(nums)) jde skládat, protože generátor je Iterable; running nikdy neví ani ho nezajímá, že jeho vstup je další generátor.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "typescript.advanced.26.toolbox"
title = "Nářadí, které není na polici"
story = "Manuál velína říká počítat běhy stejných snímků pomocí iterator helpers. Kompilátor ve třicátém patře o nich nikdy neslyšel a noční operátor počítá ručně."
brief = '''
Na standardním vstupu je jeden řádek celých čísel.

Vypiš tři řádky, každý postavený vlastním generátorem:

1. `SUMS` a za ním průběžné součty — `accumulate(values)`
2. `RUNS` a za ním každý běh **sousedních** stejných hodnot jako `<v>x<k>` —
   `runs(values)`
3. `PAIRS <k>`: kolik je neuspořádaných dvojic **různých** hodnot —
   `pairs(items)` přes seřazené různé hodnoty

```
input:  1 1 2 1 1 3
output: SUMS 1 2 4 5 6 9
        RUNS 1x2 2x1 1x2 3x1
        PAIRS 3
```

Python má na polici `itertools`. JavaScript má iterator helpers —
`Iterator.prototype.map`, `.filter`, `.take` — v Node od verze 22, a na
téhle polici **nejsou**: knihovna `es2023` je nedeklaruje, takže `tsc` řekne
`TS2339: Property 'map' does not exist`, ať je `node` pod tím jakkoli nový.
Použít můžeš to, co knihovna deklaruje, a to, co importuješ. Tenhle soubor
importuje `readFileSync` z `"fs"` přes ES `import` — což ze souboru dělá
**modul** a `tsc` ho zkompiluje na `require`, protože cíl je CommonJS.
Všechno ostatní napíšeš sám.

`runs` seskupuje jen **sousední** stejné položky. Není to počet a ukázka je
vybraná tak, aby se ty dva rozcházely: `1` se objeví čtyřikrát, ve dvou
bězích. Starter pro druhý řádek počítá do `Map` a na přesně tom vstupu je
špatně.
'''
hints = [
  "accumulate drží součet a vydá ho po každé hodnotě; poslední, co vydá, je celkový součet.",
  "runs drží rozpracovaný běh. Když se další hodnota liší, vydej hotový běh a začni nový — a za smyčkou vydej poslední běh, protože nic jiného to neudělá.",
  "pairs jsou dvě vnořené smyčky s j začínajícím na i + 1. Počet je n*(n-1)/2 a ruční kontrola je způsob, jak zjistit, že máš správné n.",
]

# ---------------------------------------------------------------- 27
