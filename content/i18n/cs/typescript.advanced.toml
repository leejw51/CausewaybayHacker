id    = "typescript.advanced.27.memo"
title = "Pamatuj si, co jsi spočítal"
story = "Plánovač obrazovky na Times Square počítá tutéž rotaci ze stejných dvou čísel jedenáct tisíckrát před půlnocí, pokaždé od nuly."
