Na standardním vstupu je `n k bits`: dvě celá čísla a řetězec binárních
číslic.

Vypiš čtyři řádky:

1. `FIB <fib(n)>` — z **rekurzivní** `fib`, zabalené do vlastního
   memoizujícího `memo(...)`
2. `PRODUCT <k!>` — `reduce` s násobením přes `1..k`, s počáteční hodnotou,
   aby `k = 0` dalo `1`
3. `BIN <value>` — `bits` přečtené v základu 2 funkcí `fromBinary`,
   jednoargumentovou funkcí se základem pevně uvnitř
4. `MISSES <m>` — kolikrát memo doopravdy spustilo tělo

