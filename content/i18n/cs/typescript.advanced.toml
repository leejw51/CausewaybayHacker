# ---------------------------------------------------------------- 01
[[quest]]
id    = "typescript.advanced.01.conversions"
title = "Jedno jméno, jeden tvar"
story = "19:00, velín ve třicátém patře. Feed posílá cenu slotu na Times Square jako text, účtovací obrazovka ji chce jako číslo a velká obrazovka v dolarech."
brief = '''
Načti jeden řádek: částku v centech, jako číslice.

Vypiš tři řádky:

1. kolik znaků má oříznutý text
2. částku jako číslo
3. částku v dolarech s přesně dvěma desetinnými místy

```
input:  1234
output: 4
        1234
        12.34
```

Částka je nezáporná. V Pythonu bys jedno jméno třikrát přeřadil.
TypeScript tě nenechá: jméno si drží typ, se kterým se narodilo, takže

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

selže dřív, než proběhne jediný řádek. To smlouva dělá svou práci. Dej
každému tvaru vlastní `const` — text, číslo, dolary — a čtenář nikdy
nemusí rolovat nahoru, aby zjistil, co jméno právě drží.

Na dolary nechoď přes plovoucí čárku. `(1234 / 100).toFixed(2)` dnes náhodou
funguje a `0.1 + 0.2` je `0.30000000000000004` každý den.
`Math.trunc(cents / 100)` a `cents % 100` jsou přesně ty dvě poloviny a
`String(cents % 100).padStart(2, "0")` doplní tu druhou.
'''
hints = [
  "text.length, dokud máš ještě řetězec, je první řádek.",
  "const cents: number = Number(text) je nové jméno s novým typem. Použít na to znovu `text` je TS2322, a to ti kompilátor říká, že stará smlouva pořád platí.",
  "padStart(2, \"0\") doplní zleva na šířku dva: 5 centů je 0.05, ne 0.5.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "typescript.advanced.02.control-flow"
title = "Který slot"
story = "Obrazovka na Times Square jede v rotaci: každý třetí slot reklama, každý pátý zprávy. Plánovač pokaždé vypíše číslo slotu a obrazovka ukazuje číslo dvanáctimetrovými číslicemi."
brief = '''
Načti jedno celé číslo `n`. Pro každé `i` od `1` do `n` vypiš jeden řádek:

* `ADNEWS`, pokud je `i` dělitelné třemi i pěti
* `AD`, pokud je `i` dělitelné třemi
* `NEWS`, pokud je `i` dělitelné pěti
* jinak samotné `i`

Pak čti dál celá čísla, jedno na řádek, dokud nepřečteš `0`, a vypiš
`SKIPPED <k>`, kolik nenulových řádků jsi cestou přečetl.

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

Dvě smyčky, dva druhy. První ví, kolikrát proběhne, dřív než začne:
`for (let i = 1; i <= n; i++)`. Druhá to neví: `for (;;)` nebo
`while (true)` s `break`, protože počet určuje to, co přečteš.
`i < n` skončí o jedno dřív a je to chyba o jedničku, kterou tu každý jednou
napíše.

Standardní vstup přijde v jednom kuse. `input.split("\n")` ti dá řádky a
index, který jimi jde dolů, je to „přečti další řádek“, které bys měl v
kterémkoli jiném jazyce.
'''
hints = [
  "Nejdřív otestuj případ „obojí“, jinak nikdy nenastane. Dělitelné třemi a pěti je dělitelné patnácti.",
  "i < n skončí na n - 1. Starter tu chybu má; ukázkový výstup končí o řádek dřív.",
  "=== ne ==. `\"0\" == 0` je true a `\"\" == 0` je true taky, a tak prázdný řádek ukončí smyčku, kterou ukončit neměl.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "typescript.advanced.03.arrays"
title = "Prostředek tabule"
story = "Tabule na tramvajové zastávce Yee Wo Street ukazuje první a poslední tramvaj večera a dispečer chce vědět, kolik míst je ve všem mezi nimi."
brief = '''
Na standardním vstupu je na prvním řádku počet `n` a na druhém `n` celých
čísel oddělených mezerami. `n` je nejméně `1`, takže vždycky existuje první
a poslední hodnota k vypsání.

Vypiš tři řádky: první hodnotu, poslední hodnotu a součet všeho, co leží
ostře mezi nimi. Při méně než třech hodnotách je ten součet `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)` je prostředek: **nové pole**, zkopírované, se záporným
koncem počítaným odzadu. `nums[nums.length - 1]` je poslední prvek a
`nums.at(-1)` taky — ale podívej se na jejich typy. Index říká `number`,
protože ti kompilátor věří; `at` říká `number | undefined`, protože pole
může být prázdné a kompilátor nevidí, že tvoje není. Za běhu jsou obě
stejná hodnota. Jen jedna z nich je k tomu upřímná.

`reduce((sum, v) => sum + v, 0)` sečte prostředek. Ta `0` není ozdoba:
`reduce` na prázdném poli **bez počáteční hodnoty** vyhodí
`TypeError: Reduce of empty array with no initial value` a vstup s jedním
prvkem udělá prostředek prázdný.
'''
hints = [
  "nums[nums.length - 1] je poslední prvek. nums.at(-1) taky, a jeho typ přiznává, že tam nemusí být.",
  "nums.slice(1, -1) je všechno kromě prvního a posledního; s jednou nebo dvěma hodnotami je to [].",
  "reduce potřebuje 0 jako druhý argument, jinak prázdný prostředek vyhodí výjimku místo součtu na nic.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "typescript.advanced.04.strings"
title = "Tři délky"
story = "LED stěna na Hysan Place rozpočítává svůj ticker podle `.length`. Emoji tramvaje ji stojí dva, 銅鑼灣 tři a řadič pod ní počítá devět."
brief = '''
Načti jeden řádek. Vypiš tři řádky:

1. jeho délku v **bajtech**, zakódovanou jako UTF-8
2. jeho délku ve **znacích** (Unicode code pointech)
3. řádek s obráceným pořadím znaků

```
input:  causeway
output: 8
        8
        yawesuac
```

Řetězec v JavaScriptu má tři délky a `.length` není ani jedna z těch dvou
požadovaných. Počítá **UTF-16 code units**: `"銅鑼灣".length` je `3`, což
vypadá správně, a `"🚋".length` je `2`, což ne. Znaky jsou to, čím prochází
`for (const ch of s)` a `[...s]` — iterátor řetězce kráčí po code pointech
— takže `[...s].length` je druhý řádek.

Bajty jsou třetí číslo. `TextEncoder` ani `Buffer` tu nejsou:
`node.d.ts` nedeklaruje ani jedno a `tsc` by tě zastavil s `TS2304: Cannot
find name`. Spočítej je místo toho z code pointů — `ch.codePointAt(0)`
pod `0x80` je jeden bajt, pod `0x800` dva, pod `0x10000` tři a cokoli
výš čtyři.

`s.split("").reverse().join("")` je obrácení, po kterém sáhne každý, a
rozdělí surrogate pair napůl. Obrať `[...s]`.
'''
hints = [
  "[...line] je pole code pointů; jeho délka je počet znaků. line.length jsou UTF-16 jednotky a starter ji vypíše dvakrát.",
  "for (const ch of line) kráčí taky po code pointech, takže ch.codePointAt(0) je číslo celého znaku, nikdy půlky páru.",
  "split(\"\") dělí po code unitech a rozbije emoji; obrácení rozloženého pole nechá každý znak celý.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "typescript.advanced.05.maps"
title = "Co říká stěna"
story = "Stěna Hysan Place řadí slova, která feed dnes večer posílá nahoru, a každý počet na ní ukazuje NaN."
brief = '''
Načti celý standardní vstup a rozděl ho podle bílých znaků.

Vypiš každé různé slovo jednou jako `<word> <count>`, seřazené podle počtu
sestupně, při shodě podle slova vzestupně.

```
input:  tram tram bus
output: tram 2
        bus 1
```

Starter počítá do `Record<string, number>` a typ říká, že každý klíč drží
`number`. Za běhu drží klíč, který nikdo nezapsal, `undefined` a
`undefined + 1` je `NaN` — žádná výjimka, žádné varování, jen špatné číslo
na stěně. Použij `Map<string, number>`: `counts.get(word)` má typ
`number | undefined`, což je pravda, a `?? 0` je na ni odpověď.

Seřaď položky komparátorem: počet sestupně je `b[1] - a[1]`, a když je to
`0`, propadni ke slovu. Slova porovnávej přes `<` a `>`, ne přes
`localeCompare` — `localeCompare` se ptá locale stroje a tabule musí na
každém stroji vypadat stejně.
'''
hints = [
  "Starter vypíše NaN, protože counts[word] bylo před += undefined. Typ Record sliboval číslo, které tam nikdy nebylo.",
  "counts.set(word, (counts.get(word) ?? 0) + 1) — get přizná, že klíč chybí, ?? dodá nulu.",
  "b[1] - a[1] || wordOrder: komparátor, který vrátí 0, předá shodu pravé straně ||.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "typescript.advanced.06.sets"
title = "Co hrají obě obrazovky"
story = "Dvě obrazovky stojí proti sobě přes Yee Wo Street a inzerentka chce vědět, které klipy platí za to, aby běžely dvakrát na téže křižovatce."
brief = '''
Dva řádky standardního vstupu, každý klipy jedné obrazovky oddělené
mezerami. Obrazovka může mít stejný klip dvakrát; počítá se jednou.

Vypiš tři řádky:

1. `BOTH` a za ním každý klip, který je na obou seznamech, seřazené, oddělené
   mezerou — nebo `BOTH -`, když žádný není
2. `ONLY_A <k>`: kolik klipů je na prvním seznamu a ne na druhém
3. `ALL <k>`: kolik různých klipů je na kterémkoli seznamu

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

`Set` nemá duplikáty. V knihovně `es2023`, proti které se tahle země
kompiluje, nemá ani `intersection`, `difference` nebo `union` — ty přišly v
ES2025 a `tsc` by ti to řekl přes `TS2339: Property 'intersection'
does not exist`. Co existuje, rozhoduje knihovna, proti které kompiluješ, ne
verze Node, na které běžíš. Tak je vypiš: `[...a].filter((x) => b.has(x))`
je průnik, totéž s `!b.has(x)` rozdíl a `new Set([...a, ...b])`
sjednocení.

`.sort()` bez komparátoru řadí řetězce podle UTF-16 code unitů, což je pro
tyhle přesně správně a pro čísla přesně špatně. Žebříček je o dva questy
dál.
'''
hints = [
  "new Set(tokens) zahodí duplicitní sneakers už na vstupu. Počet v Set je .size, ne .length.",
  "[...a].filter((x) => b.has(x)) je průnik; neguj test pro rozdíl; rozlož obě do jednoho Set pro sjednocení.",
  "both.length > 0 ? both.join(\" \") : \"-\" pokryje prázdný případ jedním výrazem.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "typescript.advanced.07.functions"
title = "Za hodinu"
story = "Každý slot obrazovky v ceníku je za hodinu, pokud neříká jinak, a tiskárna ceníku píše `/undefined` pod každý, který nic neřekl."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků `<NAME> <CENTS>` nebo
`<NAME> <CENTS> <UNIT>`.

Napiš `tag(name, cents, unit = "hour")`, který vrací `<NAME> $<dollars>/<unit>`
se dvěma desetinnými místy, a vypiš jeden tag na řádek.

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

Starter se zkompiluje, proběhne a vypíše `TSQ $12.00/undefined`. Podívej se
proč. `const [name, cents, unit] = line.split(" ")` dá všem třem typ
`string`, protože `split` vrací `string[]` a kompilátor neví, jak je dlouhé.
Na řádku se dvěma tokeny je `unit` za běhu `undefined` a template literal to
slovo věrně vypíše. Typ byl slib, který pole nikdy nedalo.

Opravou je **výchozí parametr** a funguje z důvodu, který stojí za to znát:
výchozí hodnota se použije, když je argument `undefined` — chybí, nebo je
výslovně předán jako `undefined`, což tu dělá `tag(name, cents, unit)`.
`null` by ji nespustil. Signatura je smlouva, která říká, co smí volající
vynechat a co dostane, když to udělá.
'''
hints = [
  "unit: string = \"hour\" v seznamu parametrů. To je celá oprava.",
  "Výchozí hodnota se použije při undefined, i při undefined předaném schválně. `unit ?? \"hour\"` uvnitř těla je stejný nápad zapsaný v místě volání.",
  "`$${...}` v template literalu je doslovný znak dolaru a za ním interpolace.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "typescript.advanced.08.exceptions"
title = "Řádek, který není číslo"
story = "Příjezdová tabule na tramvajové zastávce Yee Wo Street čte z feedu sloupec minut a jeden řádek uprostřed říká `xx`."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků. Každý řádek má být celé
číslo.

Pro každý řádek vypiš buď hodnotu zdvojenou, nebo `BAD <line>`, když to
není celé číslo. Nakonec vypiš `SUM <total>`, kde total je součet hodnot,
které jsi vypsal.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")` neselže. Vrátí `NaN`, a `Number("1.5")` je `1.5` a
`Number("")` je `0`. Proto `double` ve starteru kontroluje text proti vzoru
a **vyhazuje** `NotANumber` — a proto starter na druhém řádku umře na tu
výjimku, protože ji nic nechytá.

Obal to jedno volání, které může vyhodit, do `try`/`catch`. Pod `strict` má
chycená hodnota typ **`unknown`**: `throw` v JavaScriptu může vyhodit
cokoli, řetězec, číslo nebo `undefined`, a kompilátor nebude předstírat
opak. Žádné `catch (NotANumber e)` neexistuje. Zúžíš si to sám —
`if (err instanceof NotANumber)` — a když to není tvoje, znovu `throw err`,
aby překlep ve tvém vlastním kódu pořád selhal nahlas, místo aby se hlásil
jako špatný řádek.
'''
hints = [
  "Starter umře s NotANumber: not a whole number: xx. Tahle třída je ta, kterou chytáš.",
  "Blok try měj malý: dovnitř jde jen volání, které může selhat, a výpis i součet jdou za něj.",
  "catch (err: unknown), pak `if (err instanceof NotANumber)`. Cokoli jiného se znovu vyhodí přes `throw err`; catch, který spolkne všechno, je způsob, jak se programy učí selhávat potichu.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "typescript.advanced.09.array-methods"
title = "Jeden průchod feedem"
story = "Alex říká, že to jde třemi smyčkami for a třemi čítači. Feed na stěnu Hysan Place už je jinde, když ta třetí doběhne."
brief = '''
Na standardním vstupu je jeden řádek celých čísel oddělených mezerami.

Vypiš tři řádky:

1. součet sudých hodnot (`0`, když žádné nejsou)
2. každou hodnotu větší než `10`, zdvojenou, v pořadí, spojené jednou
   mezerou — nebo `-`, když žádné nejsou
3. kolik je různých hodnot

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

TypeScript nemá comprehensions. Má metody pole a ty jsou tentýž nápad
zapsaný zleva doprava: `filter` nechává, `map` přetváří, `reduce` skládá a
`new Set(...)` odstraňuje duplikáty. Každá vrací novou hodnotu a žádná z
nich nepotřebuje index.

`reduce` bere počáteční hodnotu a tady není volitelná: ukázka sudá čísla
má, ale jeden ze skrytých případů ne a
`[].reduce((a, b) => a + b)` vyhodí `TypeError: Reduce of empty array with
no initial value`. `reduce((sum, v) => sum + v, 0)` sečte nic na `0`.

Záporná čísla: `-4 % 2` je v JavaScriptu `-0`. `-0 === 0` je `true`, takže
test sudosti je v pořádku — ale čísla vypisuj přes template literal, kde
`` `${-0}` `` je `"0"`, a nikdy nenech holou `-0` dojít do `console.log`.
'''
hints = [
  "nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0) — nechat, pak složit, s 0 jako počátečním součtem.",
  "Nejdřív filter, pak map: filtruj podle původní hodnoty, pak zdvoj, co přežilo.",
  "new Set(nums).size je počet různých. Set porovnává čísla podle hodnoty, takže ty dvě 12 jsou jedna.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "typescript.advanced.10.from-entries"
title = "Tentýž průchod, podle klíče"
story = "Nákupní aplikace Lee Garden dostává dnešní ceny jako seznam dvojic v pořadí, v jakém je obchody napsaly. Banner výprodeje je chce jako jednu tabuli, a chce ji dvakrát."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků `<ITEM> <PRICE>`. `PRICE`
je celý počet centů. Každá položka se objeví nejvýš jednou a `n` je nejméně
`1` — vždycky je co jmenovat jako nejlevnější.

Vypiš tři řádky:

1. každou položku s cenou **ostře nad 100** jako `ITEM=PRICE`, seřazené
   podle položky, spojené jednou mezerou — nebo `-`, když žádná není
2. každou položku s cenou **poloviční, zaokrouhlenou dolů**, ve stejném
   formátu, seřazené podle položky
3. `CHEAPEST <item>` — nejnižší cena, při shodě podle položky vzestupně

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)` postaví objekt podle klíčů z dvojic
`[key, value]` jedním výrazem a `Object.entries(obj)` ho zase rozebere —
takže `Object.fromEntries(Object.entries(prices).filter(...))` je
filtrovaná tabule a totéž s `.map(([k, v]) => [k, Math.floor(v / 2)])` je
přetvořená. Ani jedno nepotřebuje prázdný objekt a smyčku, která ho plní.

Seřaď položky, než je vypíšeš, i když vypadají seřazené. Objekt drží
řetězcové klíče v pořadí vložení, **kromě** klíčů, které vypadají jako
indexy pole — `"7"` před `"10"` před `"SCARF"`, ať přišly v jakémkoli
pořadí. Tabule s klíči podle čísla produktu by se sama přeházela. Řekni,
jaké pořadí chceš.
'''
hints = [
  "Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100)) — rozebrat, nechat, složit zpátky.",
  "Object.entries(obj).sort(byKey) dá dvojice [key, value] v pořadí klíčů, což je přesně to, co chce ITEM=PRICE.",
  "Pro nejlevnější řaď podle ceny a při shodě cen propadni ke jménu: a[1] - b[1] || byKey(a, b). Vyhrává první položka.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "typescript.advanced.11.sorting"
title = "Žebříček"
story = "Reklamní kancelář ve třicátém patře řadí dnešní nabídky na obrazovku Times Square a dva inzerenti, kteří nabídli stejně, vyjdou v pořadí, v jakém zavolali."
brief = '''
Dva řádky standardního vstupu: na prvním jména inzerentů, na druhém jejich
nabídky v centech, ve stejném pořadí. Aspoň jeden inzerent tam je.

Vypiš inzerenty seřazené od nejlevnějšího jako `<rank>. <NAME> <cents>`,
s pořadím od `1`, při shodě podle jména vzestupně. Pak vypiš
