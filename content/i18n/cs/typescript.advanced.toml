input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` je nejvýš `400`. Wrapper ve starteru počítá volání a nepamatuje si nic,
takže `fib(10)` je 177 volání, `fib(35)` třicet milionů a `fib(90)`
nedoběhne. S cache proběhne každé `fib(i)` jednou a `MISSES` je `n + 1`.

Čísla se do `number` nevejdou. `fib(90)` je `2880067194370816120`, za
`Number.MAX_SAFE_INTEGER`, a `number` by ho bez jediného slova vypsal
špatně. Použij **`bigint`**: `0n`, `1n`, `BigInt(i)`. Template literal
vypíše bigint jako jeho číslice; samotné `console.log(5n)` vypíše `5n`.

`parseInt(bits)` bez základu přečte `1010` jako tisíc deset. Starter to
dělá. Zafixuj základ uvnitř closure —
`(text: string) => parseInt(text, 2)` — což je to, čím je v Pythonu
`functools.partial`: funkce, u které jsou některé argumenty už rozhodnuté.
`bind` dělá totéž jen pro **počáteční** argumenty a základ je ten druhý.
'''
hints = [
  "memo drží ve své closure Map z argumentu na výsledek; zásah vrací z Map, minutí spustí tělo, uloží výsledek a započítá se.",
  "fib musí ve své rekurzi volat memoizovanou fib, jinak se cachuje jen nejvnější volání. Deklarace fib s typem předem je to, co arrow funkci dovolí se na ni odkázat.",
  "reduce((a, b) => a * b, 1n) — druhý argument je počáteční hodnota a je to, co dá prázdnému rozsahu 1n. Musí to být taky bigint: 1 * 1n je TS2365, ne tichý převod.",
]

# ---------------------------------------------------------------- 28
[[quest]]
id    = "typescript.advanced.28.type-guard"
title = "Stačí, když se vykreslí"
story = "Obrazovka s adresářem v Lee Garden vypisuje obchody a servisní přepážky, které přicházejí tímtéž feedem ze dvou různých systémů, a chce jen vědět, že se každý z nich umí vykreslit."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků, každý buď

* `SHOP <NAME> <LEVEL>` — vykreslí se jako `<NAME> / L<LEVEL>`
* `COUNTER <NUMBER>` — vykreslí se jako `COUNTER <NUMBER>`

`parse` ve starteru udělá z každého řádku to, co by poslal feed: instanci
`Shop` pro obchod a **obyčejný objekt** s metodou `render` pro přepážku.
Předá je jako `unknown[]`, protože to je upřímný typ čehokoli, co přišlo po
drátě. Vypiš každou položku, která je `Sign`, přes `show`, pak `SIGNS <k>` a
`SHOPS <k>` — to druhé spočítané přes `instanceof Shop`.

```
input:  3
        SHOP LAM 4
        COUNTER 2
        SHOP WONG 1
output: LAM / L4
        COUNTER 2
        WONG / L1
        SIGNS 3
        SHOPS 2
```

`Sign` je interface a interfaces se **vymažou**. Za běhu není žádný `Sign`,
kterého by ses mohl zeptat — `x instanceof Sign` se nezkompiluje, protože na
pravé straně není nic, co by to mohlo znamenat. Abys se dostal z `unknown`
na `Sign`, napíšeš **type guard**, `function isSign(x: unknown): x is Sign`,
a kompilátor uvěří čemukoli, co vrátí. Sám nic nekontroluje.

Guard ve starteru vrací `x instanceof Shop`. To se zkompiluje, je to naprosto
dobrý boolean a je to špatně: přepážka je `Sign` tvarem a instancí ničeho.
Guard lhal, kompilátor mu uvěřil a přepážky z adresáře zmizí. Kontroluj
místo toho tvar — `typeof x === "object"`, `x !== null`, `"render" in x` a
`typeof x.render === "function"` — což je přesně to, co interface slíbil, a
nic víc.

`show(sign)` rozhoduje za běhu: `sign.render()` najde ten `render`, který
objekt má, na svém prototypu nebo na sobě.
'''
hints = [
  "Celá oprava je tělo isSign. Přepážka je objektový literál; nic, čeho je instancí, nemá jméno.",
  "\"render\" in x zúží x na něco s vlastností render typu unknown; typeof x.render === \"function\" ho zúží zbytek cesty. Obojí jsou skutečné kontroly za běhu, a to je rozdíl oproti starteru.",
  "Type guard je jen tak upřímný jako jeho tělo. `return true` se taky zkompiluje. Kompilátor věří `x is Sign` tak, jako věří `as` a `!` — a všechny tři se vymažou spolu s typy.",
]

# ---------------------------------------------------------------- 29
[[quest]]
id    = "typescript.advanced.29.frozen"
title = "Nemění se"
story = "Noční ceník odchází v 19:00 na každou obrazovku označený jako readonly a ve 22:00 do něj tři z nich napsaly a jedna přidala sloupec, který tam není."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků `<NAME> <CENTS>`.

Postav z každého řádku `Price` s poli `readonly`. Pak pro každou cenu zkus
přepsat její `cents` a vypiš `FROZEN <NAME>`, když pokus vyhodí výjimku.
Dále `Tally` s jedním polem, `count`: nastav ho, pak zkus nastavit
přepsané `cuont` a vypiš `SEALED YES`, když vyhodí výjimku *tohle*. Nakonec
`IN_SET <k>`, kolik je různých cen podle jména a centů, a `TOTAL <sum>`.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SEALED YES
        IN_SET 2
        TOTAL 3300
```

`readonly` je smlouva s kompilátorem a jako každá smlouva tady se
**vymaže**. `price.cents = 0` se nezkompiluje — takže starter píše přes
rozšířený pohled, `(price as { cents: number }).cents = 0`, což se
zkompiluje, protože vlastnost readonly je přiřaditelná do měnitelné, a za
běhu nic nestojí v cestě. Do ceníku se napíše a `TOTAL` je `0`. Běhová
polovina smlouvy je `Object.freeze(this)` na konci konstruktoru: přiřazení
do vlastnosti zmrazeného objektu ve striktním režimu vyhodí `TypeError` a
každý soubor, který `tsc` pod `strict` vydá, začíná `"use strict"`.

`Object.seal(this)` je ten druhý pevný tvar: existující pole zůstanou
zapisovatelná a přidání nového — překlepu — vyhodí výjimku, místo aby
potichu vzniklo pole, které nikdo nečte. Kompilátor by `tally.cuont` taky
chytil, kdybys ho nechal; starter ho nenechá, a `JSON.parse` taky ne.

A `Set` objektů počítá **objekty**, ne hodnoty: ty dvě ceny `LAM 1200` jsou
dva členy, protože jsou to dvě alokace. Dej množině klíč jako řetězec
složený z polí — `` `${name}:${cents}` `` — a je to jedna.
'''
hints = [
  "Object.freeze(this) jako poslední řádek konstruktoru Price. Parametrové vlastnosti se přiřadí dřív, než tělo proběhne, takže už jsou tam a dají se zmrazit.",
  "Object.seal(this) v konstruktoru Tally. Pole třídy se inicializují před tělem konstruktoru, takže count v tu chvíli existuje a zůstane zapisovatelné.",
  "TOTAL je součet původních centů, což platí jen proto, že zápisy selhaly. Ve starteru je v tu chvíli každá cena 0 a TOTAL je 0 — do polí readonly se napsalo a nikdo neřekl ani slovo.",
]

# ---------------------------------------------------------------- 30
[[quest]]
id    = "typescript.advanced.30.error-classes"
title = "Vlastní chyba"
story = "Čtyři vrstvy rezervačního systému reklam vyhazují každá něco svého a rezervační obrazovka jedno z toho chytí a ostatní ji shodí."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků, každý má být délka
rezervace v hodinách.

Definuj hierarchii chyb: `PriceError extends Error` jako základ, a
`NotANumber` a `Negative`, které ho rozšiřují. `Negative` nese hodiny a
jeho zpráva je `negative hours: <h>`; zpráva `NotANumber` je
`not a number`. `price(text)` převede text přes `BigInt(text)` — což
vyhodí `SyntaxError` na čemkoli, co není celé číslo — a vyhodí
`NotANumber` **se `SyntaxError` jako jeho `cause`**, odmítne zápornou délku
a jinak vrátí `500 + 100 * hours`.

Vypiš každou cenu nebo zprávu chyby, pak `ERRORS <k>`. Zužuj na **základní
třídu**, jednou.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative hours: -2
        ERRORS 2
```

Starter zužuje přes `err instanceof Negative` a všechno ostatní znovu
vyhodí, takže řádek `xx` shodí program nechyceným `NotANumber`.
`err instanceof PriceError` je true pro každého člena hierarchie a
`err.message` je zpráva — která žije ve třídě, předaná do `super(...)`, ne
v handleru.

`new NotANumber({ cause })` — `ErrorOptions` je v knihovně `es2022` —
zaznamená `SyntaxError` pod ní. Nic tady ji nevypisuje; nechycená by to
udělala, jako blok `[cause]:` pod stack tracem. Ten řetěz je důvod ji
předávat.

`class X extends Error` a `instanceof X` fungují, protože cíl je `es2022`.
Při kompilaci dolů do ES5 podtřída `Error` ztratí svůj prototyp a
`instanceof` potichu vrací `false` — důvod, proč jsou starší codebase plné
`Object.setPrototypeOf(this, new.target.prototype)`.
'''
hints = [
  "err instanceof PriceError — základní třída pokryje obě podtřídy, a o to u základní třídy jde.",
  "Po kontrole instanceof je err PriceError a err.message projde typovou kontrolou. Předtím je err unknown a neprojde nic.",
  "catch v TypeScriptu nemá typový filtr, takže pořadí tvých kontrol instanceof je pořadí klauzulí except v Pythonu: podtřída testovaná po své základní třídě je mrtvý kód a nic tě nevaruje.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "typescript.advanced.31.iterator"
title = "Next, dokud to nepřestane"
story = "Automat na lístky u fronty v Lee Garden vydává čísla od začátku v pevných krocích a nedrží si jejich seznam, a obrazovka fronty vždycky ukazuje o jeden lístek méně, než automat vydal."
brief = '''
Na standardním vstupu jsou tři celá čísla: `start`, `step`, `count`.

Napiš třídu `Tickets`, která implementuje **iterátorový protokol ručně**:
`[Symbol.iterator]()` vrací `this` a `next()` vrací
`{ done: false, value }` pro každou z `count` hodnot a pak
`{ done: true, value: undefined }`. Vypiš každou hodnotu na vlastní řádek,
pak `SUM <total>` spočítaný průchodem druhým `Tickets`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

Tohle za tebe píše generátor. `for...of` na věci jednou zavolá
`[Symbol.iterator]()`, pak na výsledku `next()`, dokud výsledek neřekne
`done: true` — a na výsledek, který říká `done: true`, se už nedívá,
**i s hodnotou**. Rozložení, `Array.from` a destrukturování dělají totéž.

`next` ve starteru rozhoduje o `done` až poté, co lístek spotřeboval, takže
poslední skutečný lístek odejde označený `done: true` a `for...of` ho
zahodí. Typová kontrola projde: `{ done: boolean, value: number }` pasuje
na `IteratorResult<number>` tak i tak. Smlouva říká, jak výsledek vypadá,
ne kdy smíš říct, že jsi skončil.

`[Symbol.iterator]()`, který vrací `this`, je znak **iterátoru**: dá se
projít jednou a pak je vyčerpaný. **Kontejner** vrací pokaždé čerstvý
iterátor a dá se procházet opakovaně; `Bag` na téhle cestě jím byl. Řekni,
který píšeš; rozdíl se ukáže, až někdo projde smyčkou podruhé.
'''
hints = [
  "Nejdřív zkontroluj `left === 0` a vrať { done: true, value: undefined }. Teprve pak vezmi lístek a vrať { done: false, value }.",
  "Hodnotu výsledku s done for...of ignoruje. Poslední lístek starteru je ve výsledku, který říká done, a proto obrazovce i součtu chybí poslední lístek.",
  "Hodnotu, kterou se chystáš vrátit, si ulož dřív, než se posuneš, jinak jsi o krok vedle na druhou stranu.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "typescript.advanced.32.containers"
title = "Správný kontejner"
story = "Kancelář signage drží noční log přehrání v jednom dlouhém poli a na každou otázku o něm odpovídá tak, že ho čte odshora."
brief = '''
Tři řádky standardního vstupu: řádek slov, řádek celých čísel už
**seřazených vzestupně** a jedno celé číslo `x`.

Vypiš čtyři řádky:

1. `TOP <word> <count>` — nejčastější slovo, při shodě podle slova vzestupně
2. `BISECT <l> <r>` — první index, jehož hodnota není menší než `x`, a
   první index, jehož hodnota je větší než `x`, v seřazených celých číslech
3. `SMALLEST3` a za ním tři nejmenší celá čísla, vyndaná z `MinHeap` ze
   starteru — nebo méně, když jich je méně
4. `GROUPS` a za ním `<letter>:<k>` pro každé první písmeno slov, písmena
   vzestupně — `Map<string, string[]>` s klíčem podle prvního písmene

```
input:  tram bus tram bus ferry
        1 3 3 5 8
        3
output: TOP bus 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS b:2 f:1 t:2
```

Standardní knihovna má na téhle polici `Map` a `Set` a nic jiného — žádný
counter, žádnou haldu, žádný bisect. Halda je napsaná za tebe. Zbytek je
tvůj.

Starter si nechá první slovo, které uvidí s nejvyšším počtem, což je tady
`tram`, a zadání říká `bus`. Rozhodni shodu klíčem, který říká, co myslíš.

Obě bisekce jsou každá jedno binární hledání: drž `lo` a `hi`, podívej se
doprostřed, posuň jeden konec — `Math.floor((lo + hi) / 2)` nebo
`(lo + hi) >>> 1`. Jejich rozdíl je, kolik kopií `x` tam je, a ani jedna
neselže, když `x` chybí, což `indexOf` dělá s `-1`, které vypadá jako
index. Halda je správný kontejner, když chceš těch pár nejmenších, znovu a
znovu: seřadit je všechny, abys ze začátku přečetl tři hodnoty, je přesně
to, čemu se má vyhnout.

Skupiny: `groups.get(letter)` je `string[] | undefined`. Při minutí seznam
vytvoř, nastav ho, pak do něj vlož.
'''
hints = [
  "Seřaď položky [word, count] podle počtu sestupně, pak podle slova vzestupně, a vezmi první. Seřadit celou mapu kvůli jedné položce je při téhle velikosti v pořádku; jeden průchod, který porovnává stejným pravidlem, dá stejnou odpověď.",
  "Jeden bisect s příznakem: posouvej lo za mid, dokud sorted[mid] < x — a pro pravou bisekci taky dokud sorted[mid] === x. indexOf vrací -1, když x chybí, a jeden ze skrytých případů je přesně tohle.",
  "Map drží pořadí vložení jako objekt, takže písmena před výpisem seřaď. [...groups.keys()].sort() je pořadí, které zadání chce.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "typescript.advanced.33.cancellation"
title = "Přestaň čekat"
story = "Velín pingne každou obrazovku kvůli stavu, než překreslí mapu ostrova, a obrazovka v Tin Hau, které nejde síťová karta, nikdy neodpoví, takže se mapa nikdy nepřekreslí."
brief = '''
Na standardním vstupu je počet `n`, pak `n` řádků `<SCREEN> <DOWN>`, kde
`DOWN` je `0` pro obrazovku, která odpoví hned, a `1` pro takovou, které
nejde síťová karta a neodpoví vůbec nikdy.

Pro každou obrazovku spusť její `ping(screen, down, token)` pod `withTimeout` s termínem **200 ms** a vypiš
`<SCREEN> OK` nebo `<SCREEN> TIMEOUT`, v pořadí vstupu. Pak spusť úlohu
`watch(token)`, která donekonečna smyčkuje na 10ms spánku, zruš její token,
**počkej na ni** a nech ji vypsat `CANCELLED` ze svého `catch` a `CLEANUP`
ze svého `finally`. Nakonec vypiš `TIMEOUTS <k>`.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

Promise se zrušit nedá. Žádné `.cancel()` není a `Promise.race` proti
časovači jen rozhodne, koho *posloucháš* — poražený běží dál a cokoli, co
má ještě rozpracované, časovač nebo odběr, se drží i po tvém posledním
řádku. Takže zrušení je něco, co **předáš dovnitř**: token, který práce
kontroluje, nebo k jehož odběru se přihlásí. Starter jeden má, `Token`, s
`cancel()` a `onCancel(handler)`; `sleep` se přihlásí k odběru a při
zrušení vymaže svůj časovač a odmítne s `Cancelled`, a `silence` — mrtvá
obrazovka — je promise, který nikdy nevyřeší nic kromě zrušení.
(`AbortController` je platformní verze téže věci. Tady deklarovaný není.)

`withTimeout(work, ms)` vytvoří token, nechá `work(token)` závodit s
časovačem, který odmítne s `Timeout` **a** zruší token, a vymaže svůj
vlastní časovač ve `finally`, když vyhraje práce. Starter ho nikdy nevolá:
čeká na `ping` přímo a `WONG` nikdy neodpoví. Viděl jsi, co s tím Node
udělá: nezbylo nic, co by kohokoli probudilo, takže proces skončí, se
stavem `0`, po `LAM OK`.

Taky zruší `watch`, aniž by na ni počkal, takže `TIMEOUTS` se vypíše dřív,
než přišel watcher na řadu — a znovu vyhozené `Cancelled` watcheru
nedopadne na nikoho, což Node nahlásí jako unhandled rejection a skončí se
stavem `1`. `Cancelled` uvnitř `watch` po ošetření znovu vyhoď: spolknout
ho je způsob, jak se z úlohy stane nezrušitelná. Chyť ho tam, kde jsi na
úlohu čekal.
'''
hints = [
  "withTimeout: promise termínu, jehož setTimeout odmítne s Timeout a zruší token, `return await Promise.race([work(token), deadline])` v try a clearTimeout ve finally.",
  "`await watcher` je to, co nechá úlohu proběhnout její catch a finally dřív, než se vypíše TIMEOUTS; znovu na tebe vyhodí Cancelled, takže chyť i to — a jen to.",
  "Vymaž časovač termínu ve finally. Bez toho každá obrazovka, která odpověděla, pořád nechá za sebou 200ms časovač a proces před skončením čeká na poslední z nich: správný výstup, při každém běhu pomalejší. Zrušení tokenu je stejná zdvořilost opačným směrem.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "typescript.advanced.34.event-loop"
title = "Smyčka událostí"
story = "Velín signage, jedno vlákno pro každou obrazovku na ostrově. Jeden callback nikdy neustoupí a každá tabule od Tin Hau po Hysan zamrzne na stejném snímku."
brief = '''
Na standardním vstupu jsou dvě celá čísla `k` a `n`.

Rozděl `1..n` na `k` souvislých kusů — kus `i` je
`floor(n*i/k) + 1` až `floor(n*(i+1)/k)` včetně — a sečti druhé mocniny
každého kusu obyčejnou smyčkou, jako `bigint`. Než začne jakákoli práce,
`main` naplánuje jedno překreslení tabule přes `setImmediate`, které vypíše
`BOARD <finished>`: kolik kusů bylo hotových, když tabule dostala vlákno.
Tabule ho musí dostat **po prvním kusu a před druhým**. Vypiš
`CHUNK <i> <sum>` pro každý kus v pořadí indexů, pak `TOTAL <sum>`, pak
`CHUNKS <k>`.

```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node pouští tvůj JavaScript na **jednom vlákně** a každá obrazovka v budově
na něj čeká. Callback, který běží, se nedá přerušit — ne časovačem, ne I/O,
ne tabulí — dokud se nevrátí nebo neudělá `await`. Starter zabalí každý kus
do `async` funkce a všechny je předá `Promise.all`, a vypadá to souběžně.
Je to jeden dlouhý callback: `async` funkce bez `await` uvnitř proběhne od
začátku do konce v okamžiku, kdy je zavolána. Všech `k` kusů je sečteno
dřív, než `main` vůbec pustí, tabule se překreslí poslední a ukáže
`BOARD 3`, a na `4 2000000` ukazuje každá obrazovka na ostrově po celou
dobu součtu tentýž snímek. Nic, co tady napíšeš, nepustí součty paralelně;
odpovědí Node na to je worker thread, který tenhle `node.d.ts` nedeklaruje.
Async je na **čekání**. Práci CPU na jednom vlákně lze udělat jen
**zdvořilou**.

Tak buď zdvořilý: jeden kus, pak vrať vlákno, pak další. A vrať ho do
správné fronty. `await null` nebo `await Promise.resolve()` ustoupí do
fronty **microtasků**, kterou Node vyprázdní, než spustí jediný immediate
nebo časovač — tabule by pořád viděla `BOARD 3`.
`await new Promise((r) => setImmediate(r))` jde na konec řady za tabuli,
která byla zařazena první.

A ta malá chyba, která má s načasováním všechno společné. Starter sčítá
přes `total += await work(...)`. JavaScript vyhodnotí levou stranu `+=`
**před** `await`: každá úloha přečte `total` jako `0`, zaparkuje a vrátí se
zapsat `0 + moje`. Vyhraje ta poslední a `TOTAL` je poslední kus. To je
ztracená aktualizace z účtovacího čítače bez jediného řádku kódu mezi
čtením a zápisem, na kterém bys ji viděl — čtení a zápis sdíleného stavu s
`await` mezi nimi je souběh na jednom vlákně. Čti součet až po await, nebo
drž zámek.
'''
hints = [
  "Spusť starter a přečti poslední řádek: BOARD 3, vypsané až po všem. Tabule byla naplánovaná první a stejně šla poslední, protože nic nikdy nevrátilo vlákno.",
  "Jeden kus za kolo: obyčejná smyčka for přes kusy s `await new Promise((r) => setImmediate(r))` po každém. Immediate tabule byl zařazen první, takže proběhne po kusu 0.",
  "`total += await x` přečte total dřív, než čeká. `const part = await x; total += part;` ho přečte potom — nebo, bez jakéhokoli await v těle smyčky, není o co závodit.",
  "n*(n+1)*(2n+1)/6 je uzavřený vzorec pro součet. Jednou proti němu zkontroluj TOTAL a víš, že hranice kusů jsou správně.",
]
