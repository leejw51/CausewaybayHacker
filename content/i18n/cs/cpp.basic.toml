[[quest]]
id    = "cpp.basic.06.functions"
title = "Sazba za skluz"
story = "Naviják jachtklubu účtuje pět za vytažení za prvních deset vytažení dne a tři za každé další, a tabule se sazbou říká jen fare."
brief = '''
Funkce pojmenovává kus práce: její návratový typ, jméno, parametry a tělo,
které končí na `return`. `long long fare(long long rides)` bere jedno číslo
a jedno vrací. Funkce může udělat `return` předčasně zevnitř `if` a cokoli
