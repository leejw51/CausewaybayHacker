[[quest]]
id    = "cpp.basic.08.string-slices"
title = "Krátké jméno"
story = "Tabule správce přístavu má místo na čtyři písmena jména sampanu a značku za nimi, a písař opisuje celé jméno."
brief = '''
`s.substr(pos, n)` je řez řetězce: `n` znaků od `pos`, a je to **kopie** —
nový `std::string`, který s `s` nesdílí paměť. Připojení k řetězci je `+=`,
nebo `append(...)`, a řetězec roste na místě.

```
std::string t = s.substr(0, 4);
t += "...";
```

`s` je načtený řádek (nejméně čtyři znaky). Napiš ty dva řádky na
`// FILL`, místo zástupného `t`.

```
input:  causewaybay
output: caus...
```
'''
hints = [
  "std::string t = s.substr(0, 4); — začni na 0, vezmi 4; výsledek je vlastní řetězec.",
  "t += \"...\"; — připojení na místě; t.append(\"...\") je totéž.",
]

