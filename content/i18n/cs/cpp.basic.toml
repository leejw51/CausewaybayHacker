[[quest]]
id    = "cpp.basic.09.int-slices"
title = "Dva z prostředka"
story = "Záznam skluzu chce druhý a třetí odečet opsané zvlášť a za nimi připojené celé dopoledne, a kopie je celé dopoledne dvakrát."
brief = '''
`std::vector` nemá syntaxi pro řez; řez je nový vektor postavený ze dvou
iterátorů — `begin() + 1` až po `begin() + 3`, bez něj — a je to **kopie**
(`std::span` ze `<span>` je pohled, který nekopíruje).
`insert(where, first, last)` připojí celý rozsah, když `where` je `end()`.

```
std::vector<long long> part(v.begin() + 1, v.begin() + 3);
part.insert(part.end(), v.begin(), v.end());
```

`v` drží celá čísla z řádku (nejméně tři). Napiš ty dva řádky na
`// FILL`, místo zástupného `part`.

```
input:  1 2 3 4
output: 2 3 1 2 3 4
```
'''
hints = [
  "std::vector<long long> part(v.begin() + 1, v.begin() + 3); — rozsahový konstruktor; konec je o jedna za posledním vzatým prvkem.",
  "part.insert(part.end(), v.begin(), v.end()); — vložit rozsah na konec je připojení.",
]

