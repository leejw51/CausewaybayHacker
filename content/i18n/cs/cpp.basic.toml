[[quest]]
id    = "cpp.basic.10.byte-slices"
title = "První tři bajty"
story = "Drát děla nese jméno jako bajty, přijímač si nechá první tři a poslední dva přilepí na konec, a buffer, který vypíše, je celé jméno."
