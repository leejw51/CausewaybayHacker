# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.basic.01.first-light"
title = "První světlo"
story = "12:00 na nábřeží Gloucester Road. Polední dělo vystřelí, protože něco zapsalo na správnou adresu, a deska vedle něj je prázdná."
brief = '''
Vypiš přesně:

```
hello, causewaybay
```

Malá písmena, jedna čárka, jedna mezera, jeden řádek. Nic jiného.

`std::cout` žije v `<iostream>` a `'\n'` je konec řádku. `std::endl` funguje
také a také vyprázdní buffer, což tady nepotřebuješ a později nebudeš chtít.
'''
hints = [
  "std::cout << \"...\" je celý program. Include už tam je.",
  "Řetězec musí být přesný: malá písmena, jedna čárka, za ní jedna mezera.",
  "main vrací int; dojít na konec main bez return je v pořádku a znamená 0.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.basic.02.bindings"
title = "Mosazná deska"
story = "Deska vedle děla ukazuje jedno číslo a pak dvě prázdná místa tam, kde býval počet dní a rok."
brief = '''
Proměnná se v C++ deklaruje s typem napřed: `long long n = 0;` vytvoří
64bitové celé číslo jménem `n`. `std::cin >> n` do něj načte další číslo
ze standardního vstupu a `std::cout << n << '\n'` ho vypíše s koncem řádku.
Aritmetika na tom jméně je prostě aritmetika: `n * 2`, `n * n`.

```
std::cout << n * n << '\n';
```

Program načte `n` a vypíše ho a jeho dvojnásobek. Napiš ten řádek na
`// FILL`: třetí výpis, `n * n`.

```
input:  12
output: 12
        24
        144
```
'''
hints = [
  "std::cout << n * n << '\\\\n'; — stejný tvar jako řádek nad ním.",
  "long long udrží 3000000000 na druhou; int by neudržel, a proto deska říká long long.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.basic.03.types"
title = "Tabulka přílivu"
story = "Tabulka přílivu správce přístavu dělí hloubku útočiště počtem sampanů a odpověď vychází jako celé číslo, vždycky, i když celá není."
brief = '''
Dvě celá čísla dělená dají celé číslo: `7 / 2` je `3` a `7 % 2` je zbytek,
`1`. Aby vyšlo `3.5`, musí být jedna strana napřed číslo s plovoucí čárkou,
a `static_cast<double>(a)` je explicitní způsob, jak to říct. K výpisu
s pevným počtem desetinných míst má `<iomanip>` `std::fixed`
a `std::setprecision(2)`.

```
std::cout << a / b << '\n';
std::cout << a % b << '\n';
std::cout << std::fixed << std::setprecision(2) << static_cast<double>(a) / b << '\n';
```

Celočíselné dělení a zbytek se vypisují. Napiš třetí řádek na `// FILL`:
dělení jako `double` se dvěma desetinnými místy.

```
input:  7 2
output: 3
        1
        3.50
```
'''
hints = [
  "std::cout << std::fixed << std::setprecision(2) << static_cast<double>(a) / b << '\\\\n';",
  "Přetypování potřebuje jen jeden operand: double dělený long long je double.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.basic.04.int-types"
title = "Šířky registrů"
story = "Registr výstřelů děla je široký 32 bitů a registr přístavních hodin 64; počet zkopírovaný z jednoho do druhého si zachová hodnotu, jen když to někdo řekne."
brief = '''
`<cstdint>` pojmenovává celá čísla podle šířky: `int32_t` a `int64_t` jsou
se znaménkem, `uint32_t` a `uint64_t` bez znaménka. Hodnota přechází mezi
šířkami pomocí `static_cast<...>`, který nahlas říká, že se děje převod.
`std::numeric_limits<T>::max()` z `<limits>` je největší hodnota, kterou
šířka udrží.

```
uint64_t b = static_cast<uint64_t>(a);
std::cout << std::numeric_limits<uint64_t>::max() << '\n';
```

`a` se načte jako `int32_t`. Napiš řádek s přetypováním na první `// FILL`
a druhý řádek s výpisem na druhý.

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
hints = [
  "uint64_t b = static_cast<uint64_t>(a); — přetypování jmenuje šířku, do které jde.",
  "std::numeric_limits<uint64_t>::max() je 18446744073709551615; řádek s int32_t nad ním je stejné volání s druhým typem.",
]

