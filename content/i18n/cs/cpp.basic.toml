if (rides <= 10) return rides * 5;
return 50 + (rides - 10) * 3;
```

Sazba: prvních 10 jízd stojí po 5, každá další jízda stojí 3. `main` načte
`n` a vypíše `fare(n)`. Napiš ty dva řádky jako tělo `fare` na `// FILL`,
místo `return 0;`.

```
input:  13
output: 59
```
'''
hints = [
  "if (rides <= 10) return rides * 5; — a pak, na dalším řádku, return 50 + (rides - 10) * 3;",
