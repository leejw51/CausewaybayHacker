# ---------------------------------------------------------------- 15
[[quest]]
id    = "cpp.basic.09.vector"
title = "Úlovek, v pořadí"
story = "Každý sampan volá svůj úlovek přes vodu po jednom čísle a správce přístavu je nemá kam dát, dokud není poslední loď doma."
brief = '''
`std::vector<long long>` je rostoucí pole a čtyři věci, které s ním děláš,
jsou přidat, odebrat, upravit a seřadit. `push_back(x)` připojí na konec;
`erase(v.begin() + i)` odebere prvek na indexu `i` a mezeru zavře;
`v[i] = x` přepíše, co už tam je; `std::sort` z `<algorithm>` dá celou věc
do vzestupného pořadí. Index `0` je začátek.

```
xs.push_back(99);
xs.erase(xs.begin());
xs[0] = 700;
std::sort(xs.begin(), xs.end());
```

`xs` drží celá čísla z řádku. Napiš ty čtyři řádky na čtyři značky
`// FILL`: přidej `99` na konec, odeber první prvek, nastav nový první
prvek na `700`, pak seřaď. Vypíše se vektor a pak jeho velikost.

```
input:  4 8 15 16
output: 15 16 99 700
        4
```
'''
hints = [
  "xs.push_back(99); xs.erase(xs.begin()); xs[0] = 700; std::sort(xs.begin(), xs.end()); — přidat, odebrat, upravit, seřadit.",
  "erase a sort berou iterátory (xs.begin(), xs.end()); [] bere index.",
]

