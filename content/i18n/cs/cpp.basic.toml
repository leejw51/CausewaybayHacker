[[quest]]
id    = "cpp.basic.16.list"
title = "Dopředu, nebo dozadu"
story = "Sampany se sudým číslem se vážou vzadu v útočišti a liché vpředu, a seznam kotvišť prostě pořád přidává dozadu."
brief = '''
`std::list` z `<list>` je obousměrně zřetězený seznam: přidání nebo
odebrání na kterémkoli konci je konstantní čas, což vektor na začátku
neumí. `push_front(x)` přidá na začátek, `pop_back()` odebere poslední
prvek, `front()` je reference — přiřaď do ní a první prvek se změní —
a seznam se řadí vlastním členem `sort()`, protože `std::sort` potřebuje
náhodný přístup a zřetězený seznam žádný nemá.

```
l.push_front(0);
l.pop_back();
l.front() = 99;
l.sort();
```

`l` už drží celá čísla z řádku v pořadí. Napiš ty čtyři řádky na značky
`// FILL`: přidej `0` na začátek, odeber poslední prvek, přepiš začátek na
`99`, pak seřaď. Seznam se vypíše.

```
input:  1 2 3 4 5
output: 1 2 3 4 99
```
'''
hints = [
  "l.push_front(0); l.pop_back(); l.front() = 99; l.sort(); — po jednom řádku, v tomto pořadí.",
  "std::sort neumí seřadit std::list (žádný náhodný přístup); vlastní l.sort() seznamu ano.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "cpp.basic.10.maps"
title = "Sčítací tabule"
story = "Sčítací tabule útočiště vypisuje každou rybu, kterou flotila vyložila, jedno slovo na rybu, a kupec chce jeden řádek na druh s počtem."
brief = '''
`std::map<std::string, int>` je slovník držený v pořadí klíčů. `m[k] = v`
přidá klíč (nebo přepíše existující); `erase(k)` klíč odebere a nedělá nic,
když chybí; `at(k)` je záznam pro klíč, který už musí existovat — přiřaď do
něj a upravíš ho, a vyhodí výjimku, místo aby si klíč vymyslel. Průchod
mapou navštíví klíče seřazené — `std::map` je vždy v pořadí klíčů, takže
tu žádný řádek s řazením není.

```
counts["crab"] = 1;
counts.erase("rice");
counts.at("fish") = 9;
```

`counts` už sčítá každé slovo na řádku a každý řádek má na sobě `fish`.
Napiš ty tři řádky na značky `// FILL`: přidej `crab` s `1`, odeber `rice`,
pak nastav `fish` na `9`. Seřazený výpis je napsaný.

```
input:  fish rice fish tea
output: crab 1
        fish 9
        tea 1
```
