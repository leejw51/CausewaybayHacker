output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` a `x ^ 0 == x` a xor je jedno, v jakém pořadí se děje. To je
celý první řádek. `x & (x - 1)` vynuluje nejnižší nastavený bit, což ti dá
