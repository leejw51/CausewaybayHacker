Vypiš čtyři řádky:

1. hodnotu, která se objeví jednou, nalezenou přes **xor** s konstantním
   místem navíc
2. kolik bitů `1` je v ní nastaveno
3. `POW2 YES`, když je mocninou dvojky, jinak `POW2 NO` (`0` jí není)
