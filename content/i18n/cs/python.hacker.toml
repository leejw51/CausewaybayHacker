[[quest]]
id    = "python.hacker.16.union-find"
title = "Kdo je spojený s kým"
story = "Tramvajová síť, MTR a linky minibusů na jednom listu. Kolik oddělených sítí tam doopravdy je."
brief = '''
Na standardním vstupu je `n m seed`: `n` zastávek číslovaných `0..n-1`, `m`
neorientovaných spojení. Ve vstupu žádná spojení nejsou — postavíš je sám,
**přesně** tímto generátorem, v 64bitové aritmetice, která přetéká (maskuj
ručně — pythonní int to za tebe neudělá):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

Vypiš tři řádky: kolik je oddělených sítí, velikost té největší a
`REDUNDANT <k>` — kolik spojení spojilo dvě zastávky, které už spojené byly.
Spojení zastávky se sebou samou je jedno z nich.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

Pro `8 5 1` je těch pět spojení `6—1`, `4—6`, `2—3`, `2—6`, `1—2`. To
poslední spojuje dvě zastávky, které už jsou v téže síti, takže je to to
nadbytečné, a zbude `{1,2,3,4,6}` plus zastávky `0`, `5` a `7` samy o sobě.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000` s
`m = 200000` spojeními. Zřejmá odpověď, která není union-find — projít síť
od `a` a podívat se, jestli v ní už je `b`, jednou na každé spojení — je
správná, a je `O(n)` na spojení, a tedy `O(n·m)` celkem: na tomhle stroji
nedoběhla ani za **dvě minuty**, proti limitu běhu deset sekund. To je to,
čím starter je. Union-find s kompresí cesty a spojováním podle velikosti
zvládne týchž 200000 spojení za **0.24 sekundy**, změřeno tady s řešením,
které se s tímhle questem dodává.

Stojí za to to vidět jasně, protože je to nejčastější způsob, jak neprojít
časovaným testem: **starter není špatně.** Na ukázce i na obou malých
skrytých případech vypíše přesně správnou odpověď. Odmítnut je jen za to,
že dorazí příliš pozdě.

Union-find: každá zastávka ukazuje na rodiče, `find` dojde ke kořeni,
`union` nasměruje jeden kořen na druhý. Na cestě ven z `find` cestu
zkomprimuj a celé je to v praxi konstantní čas na dotaz.

`find` napiš jako smyčku. Rekurzivní je učebnicová verze a na řetězu dlouhém
tisíc je to `RecursionError` — což je přesně ten tvar, kterému má spojování
podle velikosti bránit, a přesně ten tvar, který má nepřátelský vstup dřív,
než ho první `find` vůbec zkomprimuje.
'''
hints = [
  "Oba konce losuj průběžně — každý jeden krok generátoru, v tomhle pořadí — místo abys nejdřív stavěl seznam spojení. Nic tady spojení nepotřebuje dvakrát.",
  "Začni s každou zastávkou jako vlastním rodičem a n skupinami; každé úspěšné union sníží počet o jedna.",
  "Spojení, jehož oba konce už mají stejný kořen, je to nadbytečné — započítej ho a jdi dál. Smyčka na sebe, a == b, z toho testu vypadne sama.",
  "Smysl má jen položka velikosti u kořene, takže největší čti z kořenů, ne z každého indexu. max(..., default=0) pokryje n = 0 bez zvláštního případu.",
  "parent[x], x = root, parent[x] komprimuje na jednom řádku: pravá strana se vyhodnotí celá dřív, než proběhne kterékoli přiřazení, takže staré parent[x] se přečte dřív, než se přepíše.",
]

