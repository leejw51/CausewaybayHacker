[[quest]]
id    = "python.hacker.12.heap"
title = "K seřazených front"
story = "Každá pobočka Lucky Mac posílá své lístky už seřazené. Slouč je do jedné řady, aniž bys to celé řadil znovu."
brief = '''
První řádek je `k`. Pak `k` řádků, každý počet a za ním tolik celých čísel,
už seřazených vzestupně.

Vypiš je všechny sloučené do jednoho vzestupného řádku, oddělené mezerami,
pak `POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`heapq` je **min**-halda nad obyčejným seznamem a n-tice řadí tak, jak se
n-tice porovnávají: nejdřív první prvek. Takže položka je
`(value, which list, how far into it)` a rozhodnutí při shodě stejných
hodnot je index seznamu — což je v pořádku, protože to musí být jen
*nějaké* pořadí.

Halda drží jednu položku na seznam, ne jednu na prvek, takže zůstává
velikosti `k`, ať jsou seznamy jakkoli dlouhé. `heapq.merge` dělá přesně
tohle a v produkci je to odpověď na jeden řádek; tady napiš smyčku, protože
ta smyčka je ta otázka.

Čtyři případy tady jsou hrstka čísel ve dvou nebo třech seznamech a hodiny
na nich rychlost neměří: vysypat všechno do jednoho seznamu a seřadit ho
projde všemi čtyřmi, a stejně tak procházení všech `k` hlav v každém kroku.
Halda je to, co to drží na `O(N log k)`, když je `k` velké, a to je slib o
vstupu, který tyhle případy neobsahují.
'''
hints = [
  "Položka haldy musí nést, odkud hodnota přišla, jinak po jejím vyjmutí nemůžeš doplnit.",
  "(value, which, at) se řadí nejdřív podle hodnoty, což je přesně to, co chceš; jedno heapify po osazení je levnější než k vložení.",
  "Další prvek seznamu vlož jen tehdy, když vyjmeš jeden z jeho prvků — to drží haldu na k.",
]

