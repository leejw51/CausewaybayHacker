id    = "python.hacker.29.dijkstra"
title = "Ne každá ulice je stejně dlouhá"
story = "Každá mapa, kterou jsi dosud prošel, počítala skoky. Tramvaji je jedno, kolik je zastávek; zajímá ji, jak dlouho trvají."
