[[quest]]
id    = "python.hacker.10.tree-walk"
title = "Třikrát kolem stromu"
story = "Strom na tabuli a otázka, nad kterou by nikdo neměl přemýšlet dvakrát: vyjmenuj ta tři pořadí."
brief = '''
První řádek je `n`. Druhý řádek je `n` hodnot v **pořadí po úrovních**, kde
`-1` znamená „tady žádný uzel“ — takže strom je uložený tak, jak se ukládá
halda: potomci indexu `i` jsou `2i+1` a `2i+2`.

Vypiš čtyři řádky: průchody **preorder**, **inorder** a **postorder**, každý
oddělený mezerami, a pak `DEPTH <d>` — počet uzlů na nejdelší cestě od
kořene k listu.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

Preorder je uzel, levý, pravý. Inorder je levý, uzel, pravý. Postorder je
levý, pravý, uzel. Rekurze jsou pokaždé tytéž tři řádky a posouvá se jen
pozice `append`. Rekurze je tu tak hluboká jako strom, což je pro pole ve
tvaru haldy `log n`, takže limit rámců není starost — řekni to nahlas,
protože se na to zeptají.
'''
hints = [
  "Jedna rekurzivní funkce s append na třech možných místech je lepší než tři skoro stejné funkce.",
  "Bázový případ jsou obě podmínky najednou: za koncem pole, nebo na -1.",
  "Hloubka je 1 + hlubší z obou potomků a 0 pro chybějící uzel.",
]

