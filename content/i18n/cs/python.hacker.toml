[[quest]]
id    = "python.hacker.06.stack"
title = "Další větší"
story = "Sloupec jízdného na tabuli a jedna otázka: pro každé z nich, které další za ním je větší."
brief = '''
První řádek je `n`. Druhý řádek je `n` celých čísel.

Pro každou položku vypiš první položku **napravo od ní**, která je ostře
větší, nebo `-1`, když žádná není. Dej je na jeden řádek, oddělené mezerou.
Pak vypiš `NONE <k>`, kolik z nich bylo `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Drž zásobník pozic, jejichž odpověď je ještě neznámá, a ten zůstává odspodu
nahoru klesající. Každá pozice se jednou vloží a jednou vyjme, takže celé je
to jeden průchod, ať to vypadá jakkoli. Pythonní seznam je ten zásobník:
`append` i `pop` na konci jsou `O(1)`.

Pět případů tady má nanejvýš šest čísel a hodiny na nich rychlost neměří.
Neměřily by ani na větším, a to stojí za to vědět: naivní odpověď — pro
každou položku jdi doprava, dokud se neobjeví něco většího — je kvadratická
jen na vstupu, který je už skoro sestupný. Na náhodném vstupu skončí v
průměru asi po `ln(n)` krocích. Na 200000 položkách z generátoru, který
tenhle balíček používá jinde, prošla naivní verze na tomhle stroji za
**0.09 sekundy** proti **0.05** u zásobníku, takže je neoddělí žádný limit
běhu. Zásobník je pořád ta odpověď, protože je `O(n)` na každém vstupu
včetně sestupného — ale v tomhle questu je to tvrzení, které musíš přijmout
na základě argumentu, a ne hodin.
'''
hints = [
  "Zásobník drží indexy, které ještě čekají na odpověď, ne hodnoty.",
  "Když nová hodnota přebije hodnotu na vrcholu zásobníku, odpověď toho indexu je nová hodnota — a vybírej dál, může jich přebít několik.",
  "Ostře větší, takže stejné hodnoty se navzájem nevyřeší; naskládají se a vyřeší se později spolu.",
]

