# ---------------------------------------------------------------- 01
[[quest]]
id    = "python.hacker.01.two-sum"
title = "Dvě jízdenky"
story = "Room 7-32, počtvrté. První otázka je ta, kterou dostane každý, a hodiny se spustí už cestou dovnitř."
brief = '''
První řádek je `n target`. Druhý řádek je `n` celých čísel.

Vypiš indexy `i j` (**od 1**) dvou různých položek, které dají dohromady
`target`, jako `i j` s `i < j`. Pokud vyhovuje víc dvojic, dej tu, jejíž
druhý index je nejmenší; pokud je i tak shoda, nejmenší první index. Pokud
nevyhovuje žádná dvojice, vypiš `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

Skryté případy jsou tu malé: kontrolují rozhodnutí při shodě a případ bez
odpovědi, ne tvou rychlost. Otázka je pořád ta lineární — jeden průchod,
jeden dict — protože skutečné `n` je 200000 a vnořená smyčka je přesně to,
co má tahle otázka vytřídit. Napiš odpověď, na kterou se otázka ptá, ne tu,
která náhodou projde těmito čtyřmi případy.
'''
hints = [
  "Jeden průchod. U každé hodnoty se zeptej, jestli už bylo viděno target minus ona.",
  "seen.setdefault(x, j) si u opakované hodnoty nechá první index, a to je rozhodnutí při shodě, které zadání žádá.",
  "Vypiš a vrať se v okamžiku, kdy ji najdeš — první zásah při průchodu už má nejmenší druhý index.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "python.hacker.02.window"
title = "Bez opakování"
story = "Druhá otázka je na tabuli dřív, než stihneš odložit fix."
brief = '''
Jeden řádek textu, bez mezer.

Vypiš délku nejdelšího úseku znaků, ve kterém se nic neopakuje, pak
samotný úsek. Pokud je víc úseků stejně dlouhých, vypiš ten nejvíc vlevo.

```
input:  abcabcbb
output: 3
        abc
```

Okno se pohybuje jen doprava. Pokud zjistíš, že po opakování procházíš
znovu od začátku, napsal jsi tu kvadratickou.

Čtyři případy tady mají nanejvýš tucet znaků a hodiny na nich rychlost
neměří — kvadratická je projde taky. Žádný velký skrytý případ není,
protože se nedá poctivě postavit: na textu s malou abecedou je nejdelší
úsek omezený abecedou, takže procházení znovu stojí konstantní faktor, ne
kvadratický, a vstup, který by ho potrestal, už není text. Napiš
jednoprůchodovou odpověď, protože je to ta odpověď, ne protože ji tyhle
čtyři případy vynutí.
'''
hints = [
  "Drž index, kde byl každý znak naposledy viděn, a index, kde začíná okno.",
  "Opakování se počítá jen tehdy, když jeho poslední pozice leží uvnitř aktuálního okna — to je test `previous >= start`.",
  "Zaznamenej nejlepší délku *i* to, kde začala, jinak úsek na konci nevypíšeš.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "python.hacker.03.intervals"
title = "Rozpis směn"
story = "Podají ti rozpis směn Lucky Mac a ptají se, které hodiny jsou skutečně pokryté."
brief = '''
První řádek je `n`. Dalších `n` řádků je `<start> <end>` se `start <= end`.

Slouč každou dvojici, která se překrývá nebo dotýká, a vypiš výsledek
vzestupně, jeden `<start> <end>` na řádek, pak `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Dotyk se počítá jako překryv: `1 4` a `4 5` se sloučí do `1 5`.

Čtyři případy tady mají každý tři nebo čtyři intervaly a hodiny na nich
rychlost neměří. Seřazení a zametení je `O(n log n)`; verze, která pro
každý interval znovu prochází sloučený seznam, je `O(n²)` a projde těmi
čtyřmi stejně snadno. Na skutečném rozpisu směn je ta laťka skutečná. Není
to to, co tyhle případy kontrolují.
'''
hints = [
  "Nejdřív seřaď podle začátku. Pak stačí jeden průchod zleva doprava a nikdy se nedíváš zpátky víc než o jeden interval.",
  "Když je nový začátek <= konci posledního sloučeného intervalu, prodluž ho; jinak přidej nový. Sloučené intervaly ukládej jako seznamy, ne n-tice, aby se konec dal změnit na místě.",
  "Prodlužuj na max(last.end, end) — krátký interval pohlcený dlouhým ho nesmí zkrátit.",
]

