        LEN 5
```

Prostředek je běžec: jeden ukazatel po jednom kroku, druhý po dvou, a když
rychlému dojde cesta, pomalý je tam. Jeden průchod.

Obracej smyčkou, ne rekurzí. Rekurzivní obrácení jsou tři hezké řádky a
`RecursionError` u tisíce uzlů, a verze téhle otázky se sto tisíci uzly je
ta, která se ptá.
'''
hints = [
  "Stavět odzadu dopředu je ten snadný směr: každý nový uzel vezme starou hlavu jako svůj next.",
  "Ulož cursor.next dřív, než ho přepíšeš. Jakmile cursor.next ukazuje dozadu, zbytek starého seznamu je nedosažitelný.",
  "Pro prostředek posuň slow jen na krocích, kde fast zvládl dva.",
]

