[[quest]]
id    = "python.hacker.08.top-k"
title = "Pět nejčastějších"
story = "Rozehřívací kolo. Chtějí pět slov, která se loni v tiketech objevovala nejčastěji, a stejně to měří."
brief = '''
První řádek je `n k`. Druhý řádek je `n` slov oddělených mezerami.

Vypiš `k` nejčastějších slov, nejčastější první, při shodě podle slova
vzestupně, jedno na řádek. Pokud je různých slov méně než `k`, vypiš
všechna. Pak vypiš `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Počítej přes `Counter`, pak řaď. Rozhodnutí při shodě není ozdoba.
`Counter.most_common` rozhoduje shody podle **pořadí vložení** — v pořadí,
v jakém se slova poprvé objevila ve vstupu — což není to, co říká zadání, a
není to to, co tazatel chce slyšet. Opraví to až **úplné** porovnání —
počet sestupně, pak slovo vzestupně — a `sorted` s klíčem v podobě n-tice je
způsob, jak to říct.

Čtyři případy tady jsou hrstka slov a hodiny na nich rychlost neměří:
počítání, které projde celý seznam jednou pro každé různé slovo, je `O(n²)`
a projde všemi čtyřmi. Na roce tiketů by neprošlo. Tyhle případy kontrolují
rozhodnutí při shodě, což je ta část, kterou lidé opravdu kazí.
'''
hints = [
  "Counter(words) je celá počítací smyčka. Nesnaž se při počítání udržovat pořadí aktuální.",
  "key=lambda item: (-item[1], item[0]) — počet sestupně tím, že ho zneguješ, pak slovo vzestupně.",
  "ranked[:k] je bezpečné, i když jich je méně než k — řez za koncem se na konci zastaví, místo aby vyhodil výjimku.",
]

