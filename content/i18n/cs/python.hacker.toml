title = "Řetěz"
story = "Chtějí to bez seznamu. Uzly, které ukazují na uzly, protože to je tvar, o kterém otázka doopravdy je."
brief = '''
První řádek je `n`. Druhý řádek je `n` celých čísel, v pořadí.

Postav z nich jednosměrně spojový seznam — třídu `Node` s `value` a `next`
— a pak odpovídej z uzlů. Obrácení, prostředek i délka pocházejí z
procházení řetězu, ne ze seznamu, do kterého jsi načetl vstup; posbírat
