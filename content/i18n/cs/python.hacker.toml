'''
hints = [
  "best[0] = 0 a best[a] je o jedna víc než nejlevnější best[a - coin] přes každou minci, která se vejde.",
  "None je v Pythonu poctivé `unreachable` — žádné i64::MAX, které by přeteklo, a `is not None` se čte tak, jak to myslí. Zkontroluj ho dřív, než přičteš jedničku.",
  "REACH je prostě to, kolik buněk hotové tabulky už není None.",
]

