odpoledne — proti limitu běhu deset sekund. `heapq` z toho udělá
`O((V + E) log V)` a doběhne asi za třetinu sekundy. Obojí změřeno na
tomhle stroji, se dvěma programy, které se s tímhle questem dodávají:
starter je ta procházející verze.

Stojí za to to vidět jasně, protože je to nejčastější způsob, jak neprojít
časovaným testem: **starter není špatně.** Vypíše přesně správnou odpověď.
Odmítnut je jen za to, že dorazí příliš pozdě.

`heapq` je min-halda, takže vkládej `(distance, node)` a zbytek zařídí
