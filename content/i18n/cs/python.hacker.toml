vypadá správně, vrátí na `abba` `1` — a je to to, co dělá starter.

**Co testy vynucují a co ne**, na rovinu. Skrytý případ, který dělá tu
práci, je `n = 8000` nad **jednopísmennou** abecedou. Je to nejhorší případ
pro rozšiřování kolem středu — každý střed doběhne na konec řetězce — takže
správná odpověď tam udělá svých plných `O(n²)`, třicet dva milionů
porovnání znaků v pythonní smyčce, a doběhne asi za **1.3 s**. Taky odmítne
projít-každý-podřetězec-a-každý-otestovat: `s[i:j] == s[i:j][::-1]` běží v
C, a právě proto se ta kubická smyčka na malých vstupech zdá rychlá, a při
`n = 8000` je to pořád asi **čtyřicet sekund** proti limitu deset sekund.

(Rust pouští tenhle případ s `n = 20000`. Python ho pouští s `8000`, protože
kvadratická odpověď v pythonní smyčce by při rustí velikosti trvala osm
sekund, a limit, kterým správný program projde o vlásek, není limit.)

Druhý velký případ, `n = 20000` nad dvoupísmennou abecedou, je případ
**správnosti**, ne rychlosti: na náhodném binárním řetězci test palindromu
selže po znaku nebo dvou. Kontroluje, že tvůj generátor a tvoje rozhodování
o nejlevějším indexu souhlasí s našimi ve velkém.

Takže: testy odmítnou kubické a přijmou kvadratické. **Nežádají**
Manacherův algoritmus, který je odpovědí `O(n)`. Věz, že existuje a co dělá,
protože „a dokážeš to líp než kvadraticky?“ je doplňující otázka, kterou má
tahle otázka obvykle připravit.
'''
hints = [
  "Dvě rozšíření na střed: (c, c) pro liché délky a (c, c + 1) pro sudé. Starteru chybí to druhé.",
  "Když se smyčka zastaví, i a j se oba posunuly o jedno za palindrom — takže začíná na i + 1 a jeho délka je j - i - 1.",
  "Aktualizuj jen při ostře delším palindromu a nejlevější z každé délky je ten, který si necháš, a na ten se AT ptá. A `i >= 0` se musí kontrolovat ručně: s[-1] je v Pythonu platný index a je to špatný znak.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "python.hacker.32.modular"
title = "Modulo miliarda sedm"
story = "Ta fráze se objeví na konci zadání a polovina místnosti neví, co po nich chce."
brief = '''
Na standardním vstupu je `n q seed`. Vygeneruj `q` dotazů, v 64bitové
aritmetice, která přetéká (maskuj ručně):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo
1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak
`LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic. Python by ho
opravdu spočítal — `math.comb(200000, 100000)` existuje a vrátí celé číslo —
a to je v tomhle jazyce ta past: je to správně, trvá to desítky milisekund
na dotaz a není to to, co „modulo prvočíslo“ znamená. Každé násobení se
redukuje průběžně. Problém je dělení: `a! / (b! (a-b)!)` nemá v modulární
aritmetice smysl. Nahradí ho **modulární inverze**, a protože `1000000007`
je prvočíslo, dá ti ji malá Fermatova věta: `inverse(v) = v^(p-2) mod p`.
Pythonní `pow(v, p - 2, p)` se třemi argumenty je přesně tohle, v C, jedním
voláním.

Takže: jednou předpočítej `factorial[0..n]` a na každý dotaz odpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Počítání každého koeficientu zvlášť — vynásobit `b` členů,
vydělit `b` členy, na každý jedna modulární inverze — do limitu běhu deset
sekund nedoběhne; to je starter. Jedna sdílená tabulka faktoriálů doběhne
asi za půl sekundy. Obojí změřeno na tomhle stroji.

Každý mezivýsledek je součin dvou hodnot pod `2^30`, takže by se vešel do
`i64`; v Pythonu nepřeteče nic tak jako tak a důvodem redukovat po každém
násobení je rychlost, ne správnost. V jazyce s 32bitovým `int` by to bylo
obojí, a to je ta druhá polovina toho, proč se na tuhle otázku ptají.
'''
hints = [
  "Redukuj po každém násobení. Python nepřeteče, ale násobit mezivýsledek s 200000 číslicemi je pomalé a % P drží každé číslo pod 2^30.",
  "pow(v, P - 2, P) je modulární inverze a funguje jen proto, že P je prvočíslo — to je tu celý obsah malé Fermatovy věty. Python 3.8 a novější přijme i pow(v, -1, P), což je totéž řečené napřímo.",
  "Předpočítat i inverzní faktoriály, směrem dolů od inverse(factorial[n]), odstraní z každého dotazu obě volání pow(). K projití to potřeba není, a stojí za to to říct nahlas.",
]

# ---------------------------------------------------------------- 32
[[quest]]
id    = "python.hacker.33.grid-paths"
title = "Přes blok, nikdy zpátky"
story = "Doručovací mřížka se třemi ulicemi zavřenými kvůli bambusovému lešení. Kolika cestami se dá projít a která je nejlevnější."
brief = '''
Na standardním vstupu je `r c pct seed`. Mřížku si postav sám, po řádcích,
s **dvěma** losovanými hodnotami na každé políčko, v 64bitové aritmetice,
která přetéká (maskuj ručně):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Pohybuj se jen **doprava** nebo **dolů**, přes volná políčka. Vypiš:

1. `PATHS <k>` — kolik různých cest vede z `(0,0)` do `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — nejmenší celkovou cenu cesty, včetně obou koncových bodů,
   nebo `-1`, když žádná cesta není

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

Jeden průchod po řádcích udělá obojí: cesty do políčka jsou součtem cest do
něj shora a zleva a jeho nejlepší cena je jeho vlastní cena plus levnější z
těch dvou. Protože se pohybuješ jen doprava nebo dolů, obě políčka, která
potřebuješ, jsou vždycky už hotová — a proto to nepotřebuje rekurzi ani
množinu navštívených. Memoizovaná rekurze by byla taky lineární v počtu
políček a na případu `1000 × 1000` by byla taky dva tisíce rámců hluboká,
což je dvojnásobek pythonního limitu; smyčka je tu odpovědí i z tohoto
důvodu, nejen z toho obvyklého.

Počet `PATHS` se bere modulo `1000000007` z obvyklého důvodu: na skrytém
případu `1000 × 1000` má skutečné číslo přes šest set číslic. Python by ho
udržel. Redukuj při sčítání stejně; zadání to řeklo a neredukované číslo je
špatná odpověď.

**Co velký případ vynucuje:** odmítne každou odpověď, která cesty vyjmenovává.
Je jich víc, než je v místnosti atomů.
'''
hints = [
  "Losuj obě hodnoty pro každé políčko, včetně dvou rohů — generátor je nepřeskakuje, jen je odmítá zablokovat.",
  "Volné políčko bez volného souseda shora ani zleva je dosažitelné nula cestami a nemá nejlepší cenu; None je poctivé `unreachable` a `is not None` je stráž, než porovnáš nebo přičteš.",
  "Cíl může být volný a přesto nedosažitelný, a přesně tehdy je PATHS 0 a MIN -1. Jeden ze skrytých případů je tohle.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "python.hacker.34.stable-sort"
title = "Shody si drží místo"
story = "Dva kurýři skončili se stejným skóre a žebříček je při každém překreslení dá v jiném pořadí."
brief = '''
Na standardním vstupu je `n buckets seed`. Postav `n` kurýrů, kde kurýr `i`
má index `i` a skóre, v 64bitové aritmetice, která přetéká (maskuj ručně):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď kurýry podle skóre **sestupně**. Kurýři se stejným skóre si musí
nechat pořadí, v jakém přišli. Vypiš jejich indexy, oddělené mezerami, pak
`TIES <k>` — kolik sousedních dvojic ve tvém seřazeném pořadí má stejné
skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda a odpověď je skoro celá
rozhodnutá tím, co se s nimi stane.

**Tohle je quest o tom, vědět, které řazení držíš v ruce.** Pythonní
`sorted` i `list.sort` jsou **stabilní**, vždycky — Timsort to slibuje — a
o `reverse=True` je zdokumentované, že ten slib drží: stejné prvky zůstanou
v původním pořadí, i když je řazení obrácené. Co stabilní *není*, je seřadit
vzestupně a pak seznam převrátit přes `[::-1]`: to obrátí shody spolu se
vším ostatním a přesně to dělá starter. Na ukázce je viditelně zamíchá; na
skutečném vstupu to udělá vždycky.

Správné odpovědi jsou dvě a měl bys umět dát obě. Seřaď sestupně s
`reverse=True`, nebo se zneguovaným klíčem, a zbytek nech na stabilitě.
**Nebo** udělej porovnání **úplné** — řaď podle `(-score, index)`, aby se
žádné dva prvky nikdy neporovnaly jako stejné a stabilita přestala být
otázkou. To druhé je to, po čem sahat ve výchozím stavu; úplné pořadí nemá
co dokazovat.

Hodiny tu rychlost neměří a nemají co měřit: `sorted` je `sorted`, ať
napíšeš kteroukoli z těch dvou. Tyhle čtyři případy rozhoduje výhradně to,
co se stane se shodami. Tenhle je o tom, vědět, co tvoje řazení slibuje, ne
o tom, jak rychle ten slib drží.
'''
hints = [
  "Smaž [::-1] a přidej reverse=True. To je ta stabilní odpověď a dokumentace ji slibuje: reverse=True shody neobrací.",
  "Druhá odpověď řadí podle key=lambda r: (-r[0], r[1]) — úplné pořadí, takže nezbydou žádné shody, u kterých by šlo být nestabilní. Nikdy neřaď holé n-tice: (score, index) při shodě porovná index, vzestupně, a ty jsi chtěl sestupné skóre se vzestupným indexem.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal kteroukoli z těch dvou — prozradí tě pořadí indexů.",
]

