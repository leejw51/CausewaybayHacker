[[quest]]
id    = "python.hacker.28.lru"
title = "Limit rekurze"
story = "Room 7-32, poslední otázka, počtvrté. Tazatel vypne monitor a jazyk na tabuli je ten, který se zastaví na tisíci rámcích."
brief = '''
První řádek je `cap q` a pak buď `q` řádků operací, každá
`PUT <key> <value>` nebo `GET <key>` — nebo, když první řádek nese **třetí**
číslo `seed`, už žádné další řádky a `q` operací pochází z generátoru níže.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle
nepoužitou** položku. `GET` i `PUT` se počítají jako použití klíče. `PUT`
klíče, který cache už drží, nahradí jeho hodnotu a udělá z něj ten
nejčerstvější — nepřidá žádnou položku, takže nic nevyhodí, ať je cache
jakkoli plná.

Pro každý `GET` vypiš hodnotu, nebo `-1`, když tam není. Na konci vypiš
přeživší klíče, nejčerstvěji použité první, oddělené mezerami — nebo `-`,
když je cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá `1` znovu čerstvým, takže když `PUT 3`
potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá `3`
nejčerstvějším, a proto se přeživší vypíšou jako `3 1`.

Generovaná forma, v 64bitové aritmetice, která přetéká (maskuj ručně):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**Starter je správně.** Spusť ho na ukázce a na každém případu, který
dokážeš napsat, a pokaždé je správně. Zpracovává operace tak, jak by to
udělal funkcionální jazyk — obsloužit první, zanořit se na zbytek — a
Python funkcionální jazyk není. Nemá eliminaci koncových volání, každé
volání je skutečný rámec a `sys.getrecursionlimit()` je `1000`. Skrytý
generovaný případ má dva tisíce operací a starter na něm umře s

```
RecursionError: maximum recursion depth exceeded
```

To je boss. `sys.setrecursionlimit(10000)` ho nechá zmizet, a je to špatná
odpověď: ten limit tam je, protože zásobník C pod interpretem je konečný, a
zvednout ho dost vysoko udělá z čisté výjimky segmentation fault. Rekurze
nikdy nebyla tvarem tohohle problému. Operace jsou posloupnost; posloupnost
je smyčka `for`. (A `ops[1:]` při každém volání zkopíruje zbytek seznamu,
takže rekurzivní verze byla taky kvadratická, čehož si nikdo nevšiml,
protože se nikdy nedostala dost daleko, aby na tom záleželo.)

Pak samotná cache. Učebnicová odpověď je hashovací mapa do obousměrně
spojového seznamu a Python ji má ve standardní knihovně se skrytými
ukazateli: `collections.OrderedDict`. `move_to_end(key)` je ten „dotyk“ a
`popitem(last=False)` je vyhození ze studeného konce, obojí `O(1)`, takže
každá operace tady je `O(1)` a můžeš to říct bez vytáček. (Obyčejný `dict`
drží pořadí vložení od verze 3.7 a chybí mu jen `move_to_end`; smazat klíč a
znovu ho vložit je tentýž trik napsaný ručně.) Cache starteru je dict
dvojic `(value, stamp)` s procházením kvůli nejstaršímu razítku při
vyhazování, což je `O(cap)` — správně, a druhá věc k opravě.
'''
hints = [
  "Přečti si traceback: končí na RecursionError a je to tisíc řádků téže funkce. Oprava téhle poloviny je smyčka for přes ops a nic jiného se nemění.",
  "OrderedDict: `move_to_end(key)` při každém zásahu a každém přepsání, `popitem(last=False)`, když dorazí nový klíč a cache je plná. Přepsání klíče, který už tam je, není vyhození — zkontroluj členství dřív, než rozhodneš, že je cache plná.",
  "Přeživší jsou OrderedDict čtený od horkého konce: reversed(cache) je od nejčerstvějšího, takže poslední řádek nepotřebuje žádné řazení ani razítka.",
  "sys.setrecursionlimit není oprava, a vědět proč je ta odpověď, kterou chtějí: limit posune, neodstraní, a od určitého bodu interpret přestane vyhazovat výjimky a začne padat.",
]
