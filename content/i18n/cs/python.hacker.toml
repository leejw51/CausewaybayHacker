```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Vypiš součet nejkratších vzdáleností ze zastávky `0` ke každé dosažitelné
zastávce (včetně samotné `0`, která je `0`), pak `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 100000`,
`m = 200000`. Dijkstra je správný algoritmus tak jako tak; hodiny rozhodují
