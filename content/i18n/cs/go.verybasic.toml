# GO LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/go/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, the quiz's four choices, sample input and output and the exact
# strings a program must print are the English pack's and are never translated.

pack   = "go.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.verybasic.01.print"
title = "První řádek"
story = "Tin Hau, 06:00, roleta napůl nahoře. Obrazovka na automatu na lístky má zdravit a místo toho tiskne prázdný řádek."
brief = '''
Program, který říká jednu věc, potřebuje jedno volání z `fmt`: to, které vypíše svůj argument a ukončí řádek.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  
output: hello, causewaybay
```
'''
hints = [
  "fmt.Println(\"hello, causewaybay\") — řetězec v dvojitých uvozovkách, malými písmeny, jedna čárka.",
  "print bez fmt píše na stderr a Print bez ln neukončí řádek.",
]

