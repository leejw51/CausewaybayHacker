**úplným** — skóre sestupně, pak index vzestupně — aby se žádné dva prvky nikdy
nerovnaly a stabilita přestala být otázkou. Ta druhá je to, po čem
sáhnout ve výchozím stavu; nestabilní řazení nemá co dokazovat, když je pořadí
plně určené.
