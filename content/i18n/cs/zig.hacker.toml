[[quest]]
id    = "zig.hacker.32.modular"
title = "Modulo miliarda a sedm"
story = "Ta fráze se objeví na konci zadání a polovina místnosti neví, co po nich chce."
brief = '''
Standardní vstup je `n q seed`. Vygeneruj `q` dotazů, v přetáčejícím `u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo
1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`,
pak `LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má při těchto velikostech stovky tisíc číslic, takže se nikdy
nespočítá a pak nezredukuje — každé násobení se redukuje průběžně.
Problém je dělení: `a! / (b! (a-b)!)` nemá v modulární
aritmetice žádný význam. Nahrazuje ho **modulární inverze**, a protože
`1000000007` je prvočíslo, dá ti ji malá Fermatova věta:
`inverse(v) = v^(p-2) mod p`, spočítané rychlým umocňováním zhruba ve třiceti
umocněních na druhou.

Takže: jednou předpočítej `factorial[0..=n]` a každý dotaz odpověz jako
`f[a] * inv(f[b]) * inv(f[a-b])`.

**Složitost je tu vynucená.** Jeden skrytý případ je `n = 200000`,
`q = 200000`. Počítat každé kombinační číslo nezávisle — vynásobit `b` členů,
vydělit `b` členy, jedna modulární inverze za každé — nedoběhne v limitu běhu pět
sekund; to je startovní kód. Jedna sdílená tabulka faktoriálů skončí za
**0.07 s** v sestavení Debug. Obojí změřené na tomto stroji.

Každý mezivýsledek je součin dvou hodnot pod `2^30`, takže se vejde do
`u64` a nic nepřeteče — a tady je to tvrzení, které za tebe kontroluje
sestavení. Redukuj po každém násobení: součin, který se dostane přes `2^64`,
není potichu špatně, je to `panic: integer overflow`, což je ta druhá polovina
důvodu, proč se tahle otázka klade.
'''
hints = [
  "Redukuj po každém násobení, nikdy na konci. u64 udrží součin dvou hodnot pod P; neudrží faktoriál a přetečení je panika.",
  "inverse(v) je power(v, P - 2) a funguje to jen proto, že P je prvočíslo — to je tady celý obsah malé Fermatovy věty.",
  "Předpočítat i inverzní faktoriály, pozpátku od inverse(factorial[n]), odstraní dvě volání power() na dotaz. K projití to potřeba není a stojí za to to říct nahlas.",
]

