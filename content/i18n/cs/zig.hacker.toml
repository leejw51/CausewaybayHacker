# ---------------------------------------------------------------- 34
[[quest]]
id    = "zig.hacker.28.lru"
title = "Mýtné"
story = "Room 7-32, sedmý pohovor, poslední otázka. Cache, která musí vyhodit tu správnou věc, každý uzel zaplacený a vrácený, a hodiny."
brief = '''
První řádek je `cap q`. Dalších `q` řádků je `PUT <key> <value>` nebo
`GET <key>`.

Implementuj cache s pevnou kapacitou, která vyhodí **nejdéle nepoužitou** položku,
když je plná. `GET` i `PUT` se oba počítají jako použití klíče.

Pro každé `GET` vypiš hodnotu, nebo `-1`, když tam není. Na konci vypiš
přeživší klíče, od naposledy použitého, oddělené mezerou — nebo `-`, když je
cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá z `1` znovu nedávný, takže když `PUT 3`
potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá z `3`
nejnovější, a proto se přeživší vypíšou jako `3 1`.

Učebnicová odpověď je hašovací mapa do **obousměrně propojeného seznamu** a Zig má
tu skutečnou věc, bez ničeho skrytého: `std.DoublyLinkedList` je **intruzivní**.
Seznam nealokuje uzly; vložíš `std.DoublyLinkedList.Node` —
dva ukazatele, `prev` a `next` — do své vlastní struktury, kterou vytvoříš pomocí `create`
s alokátorem a zničíš pomocí `destroy` sám. `remove` a pak `prepend` na tom
uzlu je `std::list::splice` na začátek, `pop()` vrátí poslední uzel
a každé z nich je O(1) bez jediného bajtu alokace, takže můžeš říct
O(1) na operaci nahlas bez vytáček. Abys se z `*Node` dostal zpátky k
položce, která drží klíč, `@fieldParentPtr("node", node_ptr)` posune
ukazatel zpátky o posun pole. Mapa je pak
`std.AutoHashMap(i64, *Entry)`.

**Startovní kód je boss.** Má mapu, seznam, `create` i
`destroy` a vypíše `20` pro `GET 2` v ukázce. Nikdy na klíč
*nesáhne*: `GET` čte hodnotu tam, kde leží, přepis ji zapíše na
místě a seznam zůstává v pořadí, v jakém klíče přišly. Závora si tedy
pamatuje, kdo přijel první, a toho pustí ven první — fronta, ne
cache — a vyhodí `1`, který byl použit před chvílí, místo `2`. Oprava
jsou ty dva řádky, ke kterým učebnice kreslí šipku: při každém zásahu uzel `remove`
a `prepend`.

Dvě věci, které je třeba udělat správně a na které se pohovor v Rustu neptal.
Položka drží klíč **stejně jako** hodnotu, protože vyhazování začíná od
seznamu a musí vědět, kterou položku mapy odstranit. A na pořadí
těch tří kroků záleží: `pop()` uzel, přečti klíč přes
`@fieldParentPtr`, `remove` ho z mapy, *pak* `gpa.destroy` položku
— obráceně je to čtení přes ukazatel, který si alokátor už
vzal zpátky, a nic to čtení za tebe nechytí: vrátí cokoli, co
v té paměti teď je, což je ta jediná chyba v této zemi, která se
neohlásí. Každá položka, kterou jsi vytvořil, je zničená do chvíle, kdy `main`
vrátí; co `DebugAllocator` za `init.gpa` *jmenuje*, je každá,
na kterou zapomeneš, a ten seznam je to mýtné.

Případy jsou tu malé a hodiny neměří rychlost: čtyři operace
