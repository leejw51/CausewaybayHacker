# ---------------------------------------------------------------- 28
[[quest]]
id    = "zig.hacker.29.dijkstra"
title = "Ne každá ulice je stejně dlouhá"
story = "Každá mapa, kterou jsi zatím prošel, počítala skoky. Tramvaji je jedno, kolik je zastávek; zajímá ji, jak dlouho trvají."
brief = '''
Standardní vstup je `n m seed`: `n` zastávek, `m` neorientovaných ohodnocených hran. Postav
graf sám, **přesně** tímto generátorem, v přetáčejícím `u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Vypiš součet nejkratších vzdáleností ze zastávky `0` do každé dosažitelné zastávky
(včetně `0` samotné, která je `0`), pak `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**Složitost je tu vynucená.** Skrytý případ je `n = 200000`,
`m = 400000` — velikost, na které se ustálil pohovor v C++, ponechaná tu, aby
odpověď byla táž odpověď. Dijkstra je správný algoritmus tak či tak; hodiny
rozhodují o prioritní frontě. Procházet každý nenavštívený uzel kvůli
minimu je `O(V²)` a při `n = 200000` je to `4 × 10^10` čtení s
kontrolou mezí na každém z nich, což se nevrátí v limitu běhu pět sekund.
Binární halda z toho udělá `O((V + E) log V)` a skončí za
**0.17 s**. Měřeno na tomto stroji, se dvěma programy, které se s tímto
úkolem dodávají: startovní kód je ta procházející verze.

Stojí za to to jasně vidět, protože je to nejčastější způsob, jak neprojít
pohovorem na čas: **startovní kód není špatně.** Vypíše přesně správnou odpověď. Je
odmítnut jen proto, že dorazí příliš pozdě.

Dvě poznámky ve tvaru Zigu. Sousednost není seznam na uzel: při této velikosti
stojí dvě stě tisíc samostatných `ArrayList` víc než algoritmus, takže
startovní kód už staví **komprimovanou** sousednost — tři ploché řezy,
kde hrany `u` jsou `to[start[u] .. start[u + 1]]` — a verze s haldou
čte tytéž řezy. A `std.PriorityQueue` je min-halda na
jakémkoli uspořádání, které jí dáš, takže položka `(distance, node)` řazená podle
vzdálenosti nepotřebuje žádné obrácení. Nemá decrease-key a nepotřebuješ ho:
vlož zlepšenou vzdálenost jako novou položku a přeskoč každou vybranou položku, jejíž
vzdálenost je už horší než ta, kterou máš zaznamenanou. To přeskočení
„zastaralé položky“ je řádek, na který lidé zapomínají, a bez něj halda roste bez omezení.
'''
hints = [
  "std.PriorityQueue(Entry, void, byDistance) s Entry = { d, u } a byDistance vracející std.math.order(a.d, b.d): halda je min-halda na uspořádání, které jí dáš, takže nic není třeba obracet.",
  "if (top.d > dist[top.u]) continue; je přeskočení zastaralé položky. Bez něj je algoritmus pořád správný a halda se plní zastaralými položkami.",
