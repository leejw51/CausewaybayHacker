next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď jezdce podle skóre **sestupně**. Jezdci se stejným skóre si musí ponechat
pořadí, v jakém přijeli. Vypiš jejich indexy, oddělené mezerou, pak
`TIES <k>` — kolik sousedních dvojic v tvém seřazeném pořadí má stejné skóre.

