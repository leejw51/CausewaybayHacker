  "AutoHashMap(i64, void) je množina: put(value, {}) vkládá a count() je počet různých hodnot.",
  "Napřed ohlídej count() < 2: s méně než dvěma klíči je druhá největší pořád minInt a vypsat ji je ten špatný druh správně.",
