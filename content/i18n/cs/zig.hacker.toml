# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.hacker.24.inversions"
title = "Ten, který chytnou hodiny"
story = "První otázka odpoledního kola. Naivní odpověď je správná a je to ta špatná odpověď — a sestavení Debug ji nedělá o nic méně správnou, jen pomalejší."
brief = '''
Standardní vstup jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole není
— postavíš si ho sám, **přesně** tímto generátorem, v aritmetice `u64` s
přetáčejícími operátory `*%` a `+%`:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Spočítej **inverze**: dvojice `i < j`, kde `a[i] > a[j]`. Vypiš počet,
pak `MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**Tento úkol vynucuje svou složitost a je to jediný druh, který to umí.**
Startovní kód je dvojitá smyčka `O(n²)`. Skrytý případ je `n = 1000000`,
velikost, na které se ustálil pohovor v C++, protože jeho optimalizátor vektorizoval smyčku
do limitu běhu při čemkoli menším. Tam je dvojitá smyčka `5 × 10^11`
porovnání a sestavení Debug s kontrolou mezí na každém z nich se
nevrátí v limitu běhu pět sekund. Počítání inverzí během
merge sortu je `O(n log n)` a při té velikosti trvá **0.19 s**, měřeno na
tomto stroji s programem, který se s tímto úkolem dodává.

Dvě další věci za tebe rozhodne velký případ. Odpověď pro `n = 1000000`
je `250046540838`, což se do 32 bitů nevejde — akumulátor
špatné šířky tu není potichu špatně, je to `panic: integer overflow`, takže
počítej v `u64`. A generátor musí přetáčet, ne přetékat: obyčejné `*`
na `u64`, které přeteče, je tatáž panika v prvním kroku a `*%` je
operátor, který znamená přetočení.
'''
hints = [
  "Maximum vezmi před řazením, nebo řaď kopii. Merge sort ti řez pod rukama přeuspořádá.",
  "Když při slučování vyhraje hodnota zprava, každý zbývající prvek levé poloviny je větší než ona — to je mid - left inverzí naráz a je to celý trik.",
  "Fenwickův strom nad zkomprimovanými hodnotami je ta druhá odpověď O(n log n) a stojí za to ho v místnosti jmenovat; merge sort je méně kódu pod tlakem hodin.",
]

