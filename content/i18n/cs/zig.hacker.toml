# ---------------------------------------------------------------- 29
[[quest]]
id    = "zig.hacker.30.range-queries"
title = "Součty, které se pořád mění"
story = "Čtyři miliony operací budek z jednoho rána přes celou mýtnici, polovina z nich opravy, a někdo chce průběžné součty."
brief = '''
Standardní vstup je `n q seed`. Postav pole `n` hodnot a pak proveď `q`
operací, všechno z téhož generátoru, v přetáčejícím `u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..=r]) to a running total
```

Vypiš průběžný součet všech odpovědí na dotazy, pak `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**Složitost je tu vynucená.** Naivní odpověď — smyčka přes rozsah
pro každý dotaz — je `O(n)` na dotaz a malé případy ji nechytí. Proto
je velký skrytý případ `n = 500000, q = 4000000`, kde naivní odpověď
sáhne na řádově `10^11` prvků a nedoběhne v limitu běhu pět
sekund, zatímco Fenwickův strom udělá celou věc za **0.39 s** v
sestavení Debug. Obojí změřené, se dvěma programy v tomto úkolu.

Lekce je ta, kterou pohovorující loví: *bodová změna, součet rozsahu*
je přesně ten tvar, pro který Fenwickův strom existuje. Tři krátké funkce — add,
prefix a range jako rozdíl dvou prefixů — a nejnižší nastavený bit
je to, čím se kráčí. Na `usize` je ten bit `i & (~i + 1)`: `-i`, které
píše odpověď v C++, na bezznaménkovém typu tady neexistuje a `~i + 1` jsou tytéž
bity řečené způsobem, který překladač přijme. Nebo napiš `i & (0 -% i)` —
přetočení je ten význam, takže to operátor říká.
'''
hints = [
  "Postav strom voláním add jednou pro každou počáteční hodnotu. Stavba O(n) zdola nahoru je pěkná optimalizace a není to, co hodiny testují.",
  "i & (~i + 1) izoluje nejnižší nastavený bit usize. Jeho přičítání jde stromem nahoru; odečítání dolů.",
  "range(l, r) je prefix(r + 1) - prefix(l) a trefit tu dvojici chyb o jedno je většina ladění.",
]

