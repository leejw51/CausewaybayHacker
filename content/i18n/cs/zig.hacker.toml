story = "Každá náprava se počítá dvakrát kromě jedné. Nedovolí ti použít hašovací mapu a nedovolí ti řadit."
brief = '''
První řádek je `n`. Druhý řádek je `n` nezáporných celých čísel, ve kterých se každá hodnota
objeví přesně dvakrát kromě jedné.

Vypiš čtyři řádky:

1. hodnotu, která se objeví jednou, nalezenou pomocí **xor** a konstantní paměti navíc
2. kolik bitů `1` je v ní nastavených
3. `POW2 YES`, když je mocninou dvou, jinak `POW2 NO` (`0` není)
4. hodnotu s vynulovaným nejnižším nastaveným bitem, nebo `0`, když žádný nemá

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` a `x ^ 0 == x` a xor je jedno, v jakém pořadí se děje.
To je celý první řádek. `x & (x - 1)` vynuluje nejnižší nastavený bit, což
ti dá třetí a čtvrtý řádek zadarmo. Dělej všechno v `u64` — a
to odečtení napiš jako `x -% 1`, protože `0 - 1` na `u64` je v této zemi `panic:
integer overflow` a `-%` je způsob, jak říct, že jsi myslel
přetočení. Nulový případ stejně ohlídej; přetočení je tam jen proto, aby byl výraz
legální.

Případy jsou tu malé a hodiny neměří rychlost. Žádný velký
skrytý případ není a nemůže být postavený tak, jak tento balík staví ty ostatní:
pole, které je dvojice-plus-jedna, se *konstruuje*, negeneruje, a dvě země
by při jeho konstrukci nezkonstruovaly totéž pole. Tyto případy tedy kontrolují
čtyři řádky a jejich okraje — `0` není mocnina dvou a hodnota bez
nastavených bitů zůstane `0`, když vynuluješ ten nejnižší. Xor je pořád odpověď;
počítání výskytů ve vnořené smyčce je `O(n²)` a při skutečném `n` umře.
'''
hints = [
  "Dvojice se vyruší samy, ať přijdou v jakémkoli pořadí, takže stačí jedno složení přes řez.",
  "Počítání bitů vynulováním nejnižšího pokaždé běží jednou na nastavený bit, ne jednou na šířku v bitech. @popCount je vestavěná jednořádková verze.",
  "Mocnina dvou má nastavený přesně jeden bit, takže vynulování nejnižšího nechá nulu — a nulu samotnou je třeba vyloučit ručně, jinak se její x -% 1 přetočí na všechny nastavené bity.",
]

