# ---------------------------------------------------------------- 17
[[quest]]
id    = "zig.hacker.17.lis"
title = "Nejdelší cesta vzhůru"
story = "Denní tržby, kolik jich chtějí jmenovat, a vyrobíš si je sám ze semínka. Chtějí nejdelší úsek zlepšujících se dnů a ty dny nemusí jít po sobě."
brief = '''
Standardní vstup jsou dvě celá čísla, `n` a `seed`. Ve vstupu žádné pole není
— postavíš si ho sám, **přesně** tímto generátorem, v aritmetice `u64` s
**přetáčejícími** operátory `*%` a `+%`:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Vypiš délku nejdelší **ostře rostoucí podposloupnosti** — hodnoty
si drží pořadí, ale nemusí sousedit. Pak vypiš
`TAILS <k>`, kde `k` je tatáž délka, odečtená z počtu hromádek
patience sortu.

```
input:  8 1
output: 3
        TAILS 3
```

Pro `8 1` je pole
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`,
a nejdelší cesta vzhůru v něm je `93944146 392341189 822192870`. Zkontroluj svůj
generátor proti tomu řádku dřív, než začneš hledat chybu v algoritmu.

**Tento úkol vynucuje svou složitost.** Startovní kód je tabulka `O(n²)` —
odpověď, kterou bys měl umět napsat zpaměti, a není špatná. Při `n = 200000`
by vypsala totéž `881`, co vypíše ta rychlá, po `2 × 10^10`
porovnáních, a v sestavení Debug se zapnutou každou kontrolou mezí se nevrátí
v limitu běhu pět sekund. Co uvidíš, je překročení času, ne
špatná odpověď. To je selhání, kvůli kterému tahle otázka existuje.

Ta `O(n log n)` si pro každou délku drží nejmenší hodnotu, na které může
podposloupnost té délky končit — seznam, který je vždy seřazený, takže pozice
nové hodnoty je binární vyhledávání a `std.sort.lowerBound` je to hledání.
Zvládne `n = 200000` za **0.04 s**, měřeno na tomto stroji s programem,
který se s tímto úkolem dodává.

Jedna poznámka ke generátoru, protože to je ta polovina otázky, kterou přidává Zig.
Obyčejné `*` nebo `+` na `u64`, které přeteče, tu není přetočení: je to
`panic: integer overflow`, v Debug, hned v prvním kroku. Generátor myslí
přetočení, a tak to říká — `x *% 6364136223846793005 +% 1442695040888963407`
— a překladač tě u toho rozdílu drží. Generuj v `u64`, vezmi
modulo, pak `@intCast` na `i64`.
'''
hints = [
  "tails není podposloupnost. Jeho délka je odpověď; jeho obsah jsou jen nejlepší koncové hodnoty.",
  "Ostře rostoucí znamená, že nahradíš první konec, který je >= hodnotě, což je přesně to, co vrací std.sort.lowerBound — jeho kontext je hodnota a jeho porovnání je std.math.order(value, item).",
  "Pokud velký případ překročí čas, s tvou odpovědí není nic špatně — odpovědí je tu tvar tvé smyčky. Dvě vnořené smyčky přes 200000 hodnot jsou 2 x 10^10 porovnání.",
]

