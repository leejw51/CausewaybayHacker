se do pěti sekund.

Druhý velký případ, `n = 20000` nad dvoupísmennou abecedou, je případ
**správnosti**, ne rychlosti. Na náhodném binárním řetězci test palindromu selže
po znaku nebo dvou, takže ho projde i kubická odpověď. Kontroluje, že
tvůj generátor a tvoje rozhodnutí o nejlevějším indexu souhlasí s našimi ve velkém.

