[[quest]]
id    = "cpp.advanced.09.async"
title = "Slib mi ten počet"
story = "Obsluha navijáku pošle kluka pro každý údaj a nestojí tam a nečeká; údaje se vrátí, až se vrátí."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Spusť pro každou hodnotu jednu úlohu `std::async` s `std::launch::async`,
která vrátí druhou mocninu hodnoty. Posbírej `std::future` do vektoru
a zavolej na ně `get()` **v pořadí** a každý výsledek vypiš. Pak předej
`std::promise<int>` ještě jednomu vláknu, které ho nastaví na `n`, a vypiš
`READY <n>` z odpovídajícího future.

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

Future je hodnota, která tu ještě není. `std::async` ti ji dá pro návratovou
hodnotu funkce; `get()` blokuje, dokud neexistuje, a pak ji předá, jednou.
Volat futures v pořadí je to, co dá výstup do pořadí — samotné úlohy skončí,
kdy skončí.

`std::promise` je druhý konec téže roury, pro případ, kdy není žádná
návratová hodnota k obalení: jedna strana zavolá `set_value`, druhá si ji
vezme přes `get`. Je to způsob, jak vlákno ohlásí jeden výsledek bez mutexu,
fronty nebo příznaku.

Řekni `std::launch::async` nahlas. Bez něj si implementace smí vybrat
`deferred`, které úlohu spustí líně na volajícím vlákně uvnitř `get()` —
tady to pořád funguje správně, a není to to, co kdokoli čtoucí `async`
očekává.
'''
hints = [
  "std::async(std::launch::async, lambda) vrací std::future čehokoli, co lambda vrací; vlož ho do vektoru.",
  "get() se dá na každý future zavolat právě jednou a blokuje, dokud tam hodnota není; procházení vektoru v pořadí ti dá výstup v pořadí.",
  "Promise se do vlákna přesune nebo předá referencí, tam se zavolá set_value(n) a ready.get() v main na něj počká. Připoj vlákno dřív, než main vrátí.",
]

