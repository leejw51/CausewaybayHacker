[[quest]]
id    = "cpp.advanced.11.shared-ptr"
title = "Kdo to ještě drží"
story = "Dvě měřidla čtou tutéž nádrž jednou trubkou a trubka musí zůstat, dokud nezmizí poslední měřidlo, a ani o vteřinu déle."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Dej hodnoty do `std::vector<long long>` vlastněného `std::shared_ptr`, vezmi
si **druhý** `shared_ptr` na tentýž vektor a `std::weak_ptr`, který ho
