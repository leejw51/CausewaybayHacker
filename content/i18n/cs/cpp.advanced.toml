Ber oba zámky v **jednom globálním pořadí** a cyklus nemůže vzniknout. C++17
ti to pořadí dá zadarmo: `std::scoped_lock lock(a_mutex, b_mutex)` získá
libovolný počet mutexů algoritmem, který se deadlocku vyhýbá, a ve svém
destruktoru je všechny uvolní. Dva `lock_guard`y brané vždy `A` a pak `B`
jsou tatáž odpověď napsaná ručně.
'''
hints = [
  "Zamkni obě nádrže dřív, než sáhneš na kteroukoli hladinu. std::scoped_lock lock(a.mutex, b.mutex); to udělá na jednom řádku a v bezpečném pořadí.",
  "Směr vody rozhoduje o tom, která hladina dostane minus, ne o tom, který zámek se vezme první.",
  "Dva objekty std::lock_guard, vždy mutex A a pak mutex B, jsou tatáž odpověď; pravidlo je, že se na pořadí shodne každé vlákno.",
]

