# ---------------------------------------------------------------- 32
[[quest]]
id    = "cpp.advanced.15.undefined-behaviour"
title = "Kompilátor předpokládal"
story = "Počítadlo litrů ve strojovně čerpadel je int a u 2147483647 litrů už kompilátor předpokládal, že se tam nikdy nedostane."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel, z nichž se každé
vejde do `long long`. Jejich průběžný součet se do `long long` vejde taky.

Vypiš dva řádky: `INT32 OK`, pokud se každý průběžný součet po cestě vejde do
32bitového `int`, nebo `INT32 OVERFLOW <i>` s indexem (od 0) první hodnoty,
která by ho vytlačila ven; pak `INT64 <total>`.

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

Starter drží součet v `int` a vypíše `INT32 OK`, ať se stane cokoli. Nedá se
opravit přidáním té zřejmé kontroly — `if (total + v < total)` — protože ta
kontrola je napsaná pomocí přetečení, které hledá, a **přetečení se znaménkem
je nedefinované chování**. Kompilátor smí předpokládat, že k UB nedochází,
takže `total + v < total` s kladným `v` je z jeho pohledu *vždy nepravda*
a pod `-O2` gcc i clang ten test smažou. Špatné číslo není chyba
v optimalizátoru. Je to smlouva.

Pravidlo, na kterém tahle země běží: nedefinované chování není „nějaká
hodnota“. Je to kompilátor, který předpokládá, že je nějaká věc nemožná,
a uvažuje od toho dál. Takže přetečení nikdy neodhaluješ tím, že ho
způsobíš. Odhaluješ ho *před* sčítáním, v širším typu nebo porovnáním
s mezemi — `std::numeric_limits<int>` — a očekávaný výstup tohoto programu
nezávisí na ničem, co je nedefinované.
'''
hints = [
  "Drž součet v long long a po každém přičtení ho porovnej s std::numeric_limits<int>::min() a max(). Žádná aritmetika v int se nikdy nestane.",
  "Zaznamenej jen první index, který opustí rozsah; pozdější hodnota může součet vrátit zpátky dovnitř a otázka se ptala, kde ho poprvé opustil.",
  "Když už musíš sečíst dva int a chceš vědět, jestli je to bezpečné: zkontroluj v > INT_MAX - total před sčítáním, ne znaménko součtu po něm. To první je definované; to druhé je ta věc, kterou kompilátor smaže.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "cpp.advanced.16.jthread"
title = "Zastav se, když tě požádají"
story = "Noční čerpadlo běží, dokud mu někdo neřekne, ať přestane, a až do téhle směny to nikdo nedokázal."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Spusť dvě `std::jthread`. První sečte hodnoty a výsledek uloží. Druhé vezme
`std::stop_token`, zaregistruje na něm `std::stop_callback`, který nastaví
příznak, a pak se točí ve smyčce, dokud neplatí `stop_requested()`. Z `main`
zavolej `request_stop()` na druhém vlákně, připoj obě a vypiš:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std::jthread` je `std::thread` se dvěma přidanými věcmi, obě jsou RAII.
Jeho destruktor **připojuje**, takže abort ze starteru — `std::thread`
zničené, dokud je joinable — se nemůže stát. A nese `std::stop_source`:
pokud funkce vlákna bere jako první parametr `std::stop_token`, `jthread` jí
ho předá, `request_stop()` ho přepne a destruktor zavolá `request_stop()`
dřív, než připojí. Vlákno, které kontroluje svůj token, je vlákno, které se
dá vždycky vypnout; to, které ho nekontroluje, je starter.

`stop_callback` je způsob, jak se o tom dozví zablokované vlákno — spustí se
ve chvíli, kdy je zastavení vyžádáno, na vlákně, které o ně žádá, a jeho
obvyklá práce je probudit podmínkovou proměnnou, na které pracovník spí.
'''
hints = [
  "Změň std::thread na std::jthread pro summer a abort zmizí dřív, než vůbec přidáš join — ale stejně ho připoj, než přečteš sum.",
  "Lambda, jejíž první parametr je std::stop_token, ho automaticky dostane od jthread, které ji spouští; to je celé propojení.",
  "std::stop_callback on_stop(token, fn) je objekt: registruje se ve svém konstruktoru a odregistruje ve svém destruktoru, takže žije po dobu smyčky a ne déle.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "cpp.advanced.17.dangling"
title = "Visící reference"
story = "Strojovna čerpadel ve Victoria Parku, dvě patra pod fontánou. Vlákno čerpadla pořád čte buffer, který místnost uvolnila, když skončila směna."
brief = '''
První řádek je `w n`: `w` čerpadel a `n` údajů. Druhý řádek jsou údaje.

`pump(w, buffer)` spustí `w` vláken; vlákno `i` sečte údaje od `i * n / w`
až po `(i + 1) * n / w` do `partial[i]` a `pump` vrátí dílčí součty. `main`
vypíše `PUMP <i> <sum>` pro každý, `TOTAL <sum>` a pak `FREED yes`, pokud byl
buffer uvolněn ve chvíli, kdy je všechno hotovo — pozorováno přes
`std::weak_ptr`.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

Starter skončí abortem. `pump` postaví svá vlákna v lokálním vektoru a vrátí
se, dokud jsou pořád joinable, takže destruktor vektoru zavolá
`std::terminate`. Přečti si, co se místo toho chystalo udělat: ta vlákna
drží **referenci** na `buffer` a volající `pump` se chystá nechat `buffer`
umřít. Vlákno, které čte vektor poté, co proběhl jeho destruktor, čte
uvolněnou paměť. Někdy dostane stará čísla. Někdy dostane další alokaci.
Někdy už alokátor stránky vrátil a ono spadne na chybu segmentace. Je to
nedefinované chování a je to ten nejdražší druh, protože neselže tam, kde je
chyba.

Oprav vlastnictví, ne příznak. Buffer je
`std::shared_ptr<const std::vector<long long>>`, každé vlákno si zachytí
**vlastní kopii handlu** a buffer žije přesně tak dlouho jako poslední
vlákno, které ho drží — ať `pump` vrátí jakkoli a ať vlákna skončí v jakémkoli
pořadí. Připoj před návratem. `main` si drží `weak_ptr` a poté, co
`pump` vrátila a zahodila svůj vlastní handle, je `expired()` důkaz: údaje
byly uvolněny, jednou, tím čerpadlem, které skončilo poslední, a nikdo už je
nečetl.

To je celá země v jednom programu. Nic tě nekontrolovalo. Sladil jsi
životnost s použitím a nástroje, které to dělají — chytrý ukazatel, který
počítá, join, který čeká — jsou totéž RAII, které jsi potkal na základní
cestě.
'''
hints = [
  "Dvě změny v pump: zachyť buffer (ten shared_ptr) hodnotou místo readings referencí a před return připoj každé vlákno — std::vector<std::jthread> ve vlastním bloku připojí na uzavírací závorce.",
  "Kopie shared_ptr v lambdě je to, co drží vektor naživu; uvolní se, když funkce vlákna vrátí, ne když vrátí pump. To je rozdíl mezi referencí a vlastníkem.",
  "partial je pořád zachycený referencí, a to je správně: pump ho vlastní, pump před jeho vrácením připojí a každé vlákno zapisuje jen do svého slotu.",
  "main svůj handle do pump přesouvá záměrně. Kdyby si jeden nechal, FREED by bylo no — buffer by byl naživu, protože ho main pořád drží, a to je ta druhá odpověď, u které tenhle boss přijímá, že ji umíš vysvětlit.",
]
