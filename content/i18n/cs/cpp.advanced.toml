# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.advanced.01.getline"
title = "Kniha sampanů"
story = "Správce přístavu v tajfunovém útočišti zapisuje každý sampan jako jeden řádek: jeho jméno a pak cokoli vyložil, ať z toho vyjde kolik chce čísel."
brief = '''
První řádek je počet `n`. Každý z dalších `n` řádků je jméno lodi, za kterým
následuje nula nebo více celých čísel oddělených mezerami.

Pro každou loď vypiš jeden řádek ve tvaru `<NAME> <how many numbers> <their sum>`
a nakonec `BOATS <n>`.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

Jednotkou je tady řádek, ne token. `std::cin >> x` se zastaví na bílém znaku
a na konce řádků nehledí, takže ti nedokáže říct, kde jedna loď končí a další
začíná. `std::getline` ti dá celý řádek; `std::istringstream` nad tím řádkem
ti pak zase dá `>>`, ale jen v jeho rámci.

Jedna věc kousne každého jednou: po `std::cin >> n` na konci prvního řádku
v proudu pořád čeká znak nového řádku a první `getline` ho přečte jako
prázdný řádek.
'''
hints = [
  "Jedno std::getline(std::cin, junk) po načtení n zahodí nový řádek, který tam >> nechal.",
  "std::istringstream fields(line); fields >> name; a pak while (fields >> value) projde zbytek — smyčka skončí, když už není co parsovat.",
  "Jméno je první token řádku a řádek jen se jménem dá 0 0, žádný zvláštní případ není potřeba.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.advanced.02.references"
title = "Kopie není ta věc"
story = "Obsluha navijáku na skluzu jachtklubu zapisuje každý náklad na kopii archu a arch na zdi se nikdy nezmění."
brief = '''
Na standardním vstupu je počet `n` a pak `n` celých čísel.

Vlož každou hodnotu do jednoho `std::vector<long long>` přes funkci `load`
a pak vypiš tři řádky: `LOADED <how many>`, `TOTAL <sum>` z funkce `total`,
která jen čte, a `FIRST <value>` — nebo `FIRST NONE`, když nic není.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

Starter se zkompiluje a vypíše `LOADED 0`. `load` bere vektor **hodnotou**,
takže každé volání dostane vlastní kopii, vloží do ní a při návratu ji zahodí.
C++ kopíruje, dokud neřekneš jinak.

Jinak se to řekne pomocí `&`: parametr typu `std::vector<long long>&` je
reference na vektor volajícího, ne jeho kopie. `total` by měla brát
`const std::vector<long long>&` — potřebuje se dívat, nepotřebuje sahat,
a `const` je způsob, jak to říct v signatuře, aby tě na tom kompilátor držel.

`FIRST` je ukazatel: `long long* first` je buď adresa prvního prvku, nebo
`nullptr`, a `nullptr` je ta jediná hodnota, na kterou musíš otestovat, než
ho následuješ. To je celá tahle země na jednom řádku.
'''
hints = [
  "load opraví jeden znak: std::vector<long long>& sheet. Místo volání se nemění; reference se naváže na argument tak, jak je napsaný.",
  "total by měla brát const std::vector<long long>& — const je slib a kompilátor ho kontroluje.",
  "&sheet.front() je adresa prvního prvku a dává smysl, jen když nějaký je; otestuj nullptr, než napíšeš *first.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "cpp.advanced.03.vector"
title = "Uprostřed voru"
story = "Čtyřicet sampanů svázaných v tajfunovém útočišti. Správce přístavu vidí ten úplně vnější a ten úplně vnitřní a nic mezi nimi."
brief = '''
Na standardním vstupu je na prvním řádku počet `n` a na druhém `n` celých
čísel oddělených mezerami. `n` je nejméně `1`.

Vypiš tři řádky: první hodnotu, poslední hodnotu a součet všeho, co leží
ostře mezi nimi. Při méně než třech hodnotách je ten součet `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector` je posloupnost. `front()` a `back()` jsou konce;
`begin() + 1` až `end() - 1` je prostředek a `std::accumulate` přes ten
rozsah je součet — pokud počáteční hodnota, kterou mu předáš, je
`long long`. `std::accumulate(first, last, 0)` sčítá v `int`, protože `0` je
`int`, a jeden ze skrytých případů má prostředek, který se do něj nevejde.
'''
hints = [
  "nums.begin() + 1 a nums.end() - 1 jsou iterátory a dvojice iterátorů je způsob, jak <numeric> a <algorithm> pojmenovávají rozsah.",
  "S jednou nebo dvěma hodnotami je ten rozsah prázdný nebo obrácený — ohlídej ho pomocí if na nums.size(), než ho sestavíš.",
  "Na 0LL záleží: accumulate odvozuje typ výsledku z počáteční hodnoty a obyčejná 0 je int.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "cpp.advanced.04.strings"
title = "Bajty nejsou písmena"
story = "Nástěnka tajfunového útočiště ořízne 銅鑼灣 na tři bajty a dostane jeden znak."
brief = '''
Načti jeden řádek. Vypiš tři řádky:

1. jeho délku v **bajtech**
2. jeho délku ve **znacích** — kódových bodech UTF-8
3. ten řádek se znaky v obráceném pořadí

```
input:  causeway
output: 8
        8
        yawesuac
```

Řádek může obsahovat znaky mimo ASCII, a pak si první dvě čísla nejsou
rovna. `std::string::size()` jsou bajty. Vždycky byly. `std::string`
o kódováních nic neví; je to posloupnost `char` a `char` je bajt.

UTF-8 se dá snadno spočítat bez dekódování: každý kódový bod začíná bajtem,
který **není** tvaru `10xxxxxx`, a každý pokračovací bajt tvaru `10xxxxxx` je.
Bajt `c` tedy začíná znak právě tehdy, když `(c & 0xC0) != 0x80`. Obracej
znaky, ne bajty — `std::reverse` na samotném řetězci by rozsekl `銅` na tři
kusy a vypsal je pozpátku.
'''
hints = [
  "Procházej bajty jako unsigned char; obyčejný char může být se znaménkem a pak bitový test na čemkoli nad 0x7F vyjde špatně.",
  "Posbírej každý znak jako vlastní malý std::string, obrať vektor těch znaků a spoj ho.",
  "Počet bajtů, pro které platí (c & 0xC0) != 0x80, je počet znaků bez jakéhokoli dekódování.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "cpp.advanced.05.classes"
title = "Kniha skluzu"
story = "Skluz jachtklubu účtuje každé vytažení lodi a drží řádky na jednom místě, nebo držel, než návrh nahradil třídu komentářem."
brief = '''
První řádek je `<BOAT> <n>`. Dalších `n` řádků je `<ITEM> <CENTS>`.

Sestav pro loď `Ledger`, který posbírá položky, a pak vypiš každou položku
zpátky jako `<ITEM> <CENTS>` v pořadí, v jakém přišla, potom `TOTAL <sum>`
a potom `BOAT <name> <count>`.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` může být `0` a pak výstup tvoří jen poslední dva řádky.

`class` je `struct`, jehož členy jsou soukromé, dokud neřekneš `public:`.
Konstruktor proběhne dřív, než se k tomu dostane tělo, takže členy se
nastavují v **inicializačním seznamu** —
`Ledger(std::string boat) : boat_(std::move(boat)) {}` — a ne přiřazením
uvnitř složených závorek. `total()` nic nemění, takže je deklarovaná jako
`const`, a to je jediný důvod, proč se dá zavolat na `const Ledger&`.
'''
hints = [
  "Stačí std::vector<std::pair<std::string, long long>>. Třída je tu proto, aby kniha vlastnila své řádky.",
  "Inicializační seznam — : boat_(std::move(boat)) — nastaví člen už při jeho konstrukci; přiřazení uvnitř závorek napřed postaví prázdný řetězec a pak ho přepíše.",
  "Vracej položky jako const referenci, aby je main mohl projít bez kopírování vektoru, a každou metodu, která knihu nemění, označ const.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "cpp.advanced.06.enum-class"
title = "Kdo je u kormidla"
story = "Brána jachtklubu účtuje každé kartě členskou sazbu, včetně těch, které nejsou členské, a té jedné, která není karta."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků `<TYPE> <HOURS>`.

Základní sazba je `500 + 100 * HOURS` centů. Pro každý řádek vypiš jedno z:

* `MEMBER` — základní sazbu
* `CREW` — polovinu základní sazby, celočíselným dělením
* `JUNIOR` — vždy `200`
* cokoli jiného — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

Modeluj kartu jako `enum class Card` se čtyřmi hodnotami, z nichž jedna je
`Other`. Hodnota `enum class` se za tvými zády nepřevede na `int` a nepouští
svá jména do obklopujícího rozsahu — obojí obyčejný `enum` dělá a obojí je
důvod, proč psát právě tenhle.

Enum v C++ nemůže nést data, takže nerozpoznaný tag cestuje vedle něj: malá
`struct Tag { Card card; std::string raw; }`. Jízdné rozhodni jedním
`switch`. Pokryj každý enumerátor a kompilátor nemá před čím varovat; jeden
vynech a `-Wall` ti řekne který.
'''
hints = [
  "Card::Other je čtvrtý enumerátor; řetězec, který nerozpoznal, žije hned vedle v Tag::raw.",
  "switch (tag.card) s case pro každý enumerátor a return uvnitř každého case — když každá větev vrací, break není potřeba.",
  "std::to_string udělá z čísla std::string; řádek UNKNOWN je spojení řetězců pomocí +.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "cpp.advanced.07.maps"
title = "Co křičí útočiště"
story = "Tajfunové útočiště v poledne: každý sampan na něco volá a správce přístavu chce pořadí."
brief = '''
Načti celý standardní vstup a rozděl ho podle bílých znaků.

Vypiš každé různé slovo jednou jako `<word> <count>`, seřazené podle počtu
sestupně, při shodě podle slova vzestupně.

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std::map<std::string, long long>` je seřazená podle klíče,
`std::unordered_map` podle ničeho a ani jedna podle počtu — takže pořadí je
samostatný krok: zkopíruj záznamy do `std::vector` dvojic a seřaď ho
`std::sort` s komparátorem. `counts[word]++` na klíči, který tam není, ho
nejdřív vloží s hodnotou `0`, což je přesně to, co počítací smyčka chce.
'''
hints = [
  "while (std::cin >> word) čte každý token oddělený bílými znaky, dokud vstup neskončí; counts[word]++ je celá počítací smyčka.",
  "Vektor se dá postavit rovnou z begin() a end() mapy; každý prvek je std::pair<const std::string, long long>.",
  "Komparátor je lambda, která vrací true, když a musí být před b: nejdřív počet sestupně, při shodě slovo vzestupně.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "cpp.advanced.08.hashtable"
title = "Žádné pořadí"
story = "Apel v útočišti se vrátí seřazený podle abecedy a správce přístavu ho chce v pořadí, v jakém lodě skutečně odpověděly."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků, na každém jedno jméno
lodi. `n` je nejméně `1` a jméno je jeden úsek znaků bez mezer. Jméno se
může objevit víckrát.

Vypiš každé různé jméno jednou jako `<name> <count>`, **v pořadí, v jakém se
jméno poprvé objevilo**. Pak vypiš `DISTINCT <k>`.

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

Ani jeden kontejner ti to sám nedá, a o tom je celý quest.

`std::map` je strom: při procházení vrací jména **seřazená**, což není pořadí,
v jakém odpovídala. `std::unordered_map` je hashovací tabulka: vyhledávání je
v průměru O(1) místo O(log n), ale při procházení je vrací **v žádném
určeném pořadí** — ne seřazená, ne v pořadí vložení a ani nutně dvakrát
stejně. Standard žádné neslibuje, takže program, který vypisuje
`unordered_map` jejím procházením, je program, jehož výstup závisí na
knihovně, se kterou byl sestaven. Starter dělá přesně tohle a dokonce projde
případy s jediným různým jménem — a to je to prozrazení: test, který pořadí
nerozliší, není důkaz, že je pořadí správně.

Drž ty dvě práce ve dvou kontejnerech: `std::vector<std::string>` si pamatuje
pořadí, v jakém bylo jméno poprvé viděno, a `std::unordered_map<std::string,
long long>` počítá. Pro výpis procházej vektor.
'''
hints = [
  "Hashovací tabulka je na rychlé vyhledávání. Vektor je na pamatování pořadí. Potřebuješ obojí.",
  "`count[name]++ == 0` platí pro každé jméno právě jednou — při vložení — protože operator[] hodnotu výchozím způsobem zkonstruuje na 0.",
  "Vypisuj procházením vektoru a u každého jména se zeptej mapy na počet, nikdy procházením mapy.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "cpp.advanced.09.set-and-pair"
title = "Kdo kotví kde"
story = "Tabule kotvišť uvádí stejný sampan u stejného stání dvakrát a nikdo nedokáže říct, které řádky jsou ty duplicitní."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků `<BERTH> <NAME>`.

Vypiš každou různou dvojici `<BERTH> <NAME>` jednou, seřazenou podle stání
a pak podle jména, potom `DISTINCT <k>` a `DUPES <n - k>`.

```
input:  4
        2 KWAN
        1 LEE
        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

`std::set<std::pair<int, std::string>>` udělá všechny tři práce naráz:
odmítne druhou kopii čehokoli, co už v něm je, udržuje se seřazený
a `std::pair` se už porovnává tak, jak výstup chce — první prvek, pak druhý.
Projdi ho range-`for` a každou dvojici rozeber **strukturovaným navázáním**,
`const auto& [berth, name]`, místo `.first` a `.second`.
'''
hints = [
  "Změň kontejner: std::set<std::pair<int, std::string>>. Vložení duplikátu není chyba, je to operace, která nic neudělá.",
  "Set je seřazený podle operator< svého typu prvku a std::pair porovnává první, pak druhý — což je pořadí stání, pak jméno, které výstup chce.",
  "for (const auto& [berth, name] : moorings) rozbalí každou dvojici do dvou jmen; n minus velikost setu je počet duplikátů.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.advanced.10.algorithms"
title = "Jedním průchodem po skluzu"
story = "Kniha navijáku je sloupec nákladů. Alex říká tři smyčky for. Mei říká, že standardní knihovna je už napsala."
brief = '''
Na standardním vstupu je jeden řádek celých čísel oddělených mezerami.

Vypiš čtyři řádky:

1. součet sudých hodnot (`0`, pokud žádné nejsou)
2. každou hodnotu větší než `10`, zdvojenou, v pořadí, spojené jednou mezerou —
   nebo `-`, pokud žádné nejsou
3. kolik je různých hodnot
4. `FIRST_BIG <i>` — index (od 0) první hodnoty větší než `10`, nebo `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Použij `<algorithm>` a `<numeric>`, ne smyčky přes indexy: `std::accumulate`
s lambdou pro první řádek, `std::copy_if` a `std::transform` pro druhý,
`std::sort` a pak `std::unique` pro třetí, `std::find_if` pro čtvrtý. Každý
z nich bere dvojici iterátorů a tam, kde potřebuje rozhodnutí, lambdu. Nejde
o to, že by se smyčka těžko psala; jde o to, že jméno říká, k čemu smyčka je.
'''
hints = [
  "Čtvrtý argument accumulate je binární funkce (acc, x) -> acc; ať přičte x, jen když je x sudé.",
  "copy_if potřebuje kam psát — std::back_inserter(big) vektor za pochodu zvětšuje. transform může psát zpátky přes tentýž rozsah.",
  "std::unique přesune duplikáty na konec a vrátí iterátor na místo, kde začínají; vzdálenost od begin() je počet různých. Vidí jen sousední duplikáty, takže napřed seřaď kopii.",
  "find_if při neúspěchu vrátí end() a při zásahu je iterátor minus begin() index.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "cpp.advanced.11.templates"
title = "Napiš to jednou"
story = "Tabule měřidel ve strojovně čerpadel má largest napsanou čtyřikrát — pro litry, pro minuty, pro čerpadla a pro jména čerpadel — a pátá má přijít dřív, než se otočí příliv."
brief = '''
Na standardním vstupu jsou dva řádky: na prvním celá čísla, na druhém slova.

Napiš **jednu** `largest`, která funguje na obojí, a šablonu třídy `Pair<T>`
s `larger()` a `smaller()`.

Vypiš největší celé číslo, největší slovo a pak `PAIR <larger> <smaller>`
pro `Pair` prvních dvou celých čísel. Při shodě se za větší počítá `a`.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

Starter se nezkompiluje: `largest` je přibitá k `long long`, takže předat jí
slova je *no matching function*. **Šablona funkce**,
`template <typename T> T largest(const std::vector<T>& xs)`, se vyrazí
jednou pro každý typ, se kterým je zavolána — `T` se odvodí z argumentu
a jediné, co tělo od `T` požaduje, je, aby na něm fungovalo `>`.

`Pair<T>` je stejná myšlenka pro třídu. Její metody jsou `const`, protože
čtou a nezapisují, a vracejí `const T&` místo kopie, protože volající se chce
jen podívat. Obě signatury říkají, co slibují, a kompilátor je na tom drží.
'''
hints = [
  "template <typename T> před largest a T místo long long všude uvnitř. Volání se nemění; T se odvodí.",
  "std::string už operator> má, takže totéž tělo šablony se pro slova zkompiluje, aniž bys cokoli přidal.",
  "Pair<T> je šablona třídy; typ pojmenuješ v místě použití — Pair<long long> — a metody jsou const, protože jen porovnávají.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "cpp.advanced.12.lambdas"
title = "Počítání u dveří"
story = "Turniket jachtklubu počítá, kdo vejde a kdo odejde, a vedoucí chce číslo při zavírání, ať se mezitím stalo cokoli."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků, každý `IN` nebo `OUT`.

Veď průběžný počet, který nikdy neklesne pod nulu, a vypiš ho po každém
příkazu. Pak vypiš `INS <k>` — kolik příkazů bylo `IN`, spočítáno pomocí
`std::count_if` a lambdy — a `CLOSED <final>`.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Počítadlo je uzávěr: `make_counter` vrací lambdu, která vlastní svůj součet.
