2. `SHARED <k>` — `use_count()`, dokud jsou oba handly naživu
3. `ALIVE yes` — `!watch.expired()`, dokud jsou
4. `ALIVE no` — poté, co byly oba handly resetovány pomocí `reset()`

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

`unique_ptr` byl jeden vlastník. `shared_ptr` je počet vlastníků, držený
vedle objektu, a objekt se uvolní, když počet klesne na nulu — tím handlem,
