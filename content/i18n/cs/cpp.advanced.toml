`weak_ptr` je handle, který se **nepočítá**. Vidí, jestli tam objekt pořád je,
a pokud ano, dá se pomocí `lock()` povýšit na `shared_ptr`; objekt naživu
udržet nedokáže. To je to, co rozbije cyklus — dva objekty, které na sebe
