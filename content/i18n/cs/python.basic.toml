# ---------------------------------------------------------------- 16
[[quest]]
id    = "python.basic.16.decorators"
title = "Zabalené"
story = "Kancelář tržnice chce vědět, kolikrát se dnes volala funkce s cenou, a ta funkce nechce vědět, že ji někdo sleduje."
brief = '''
Na standardním vstupu je počet `n` a pak `n` hmotností v kg.

`price(kg)` je `500 + 100 * kg`. Ozdob ji dekorátorem `@counted` tak, aby
se každé volání počítalo, aniž by o tom `price` věděla. Vypiš jednu cenu na
hmotnost, pak `CALLS <n>`, pak `NAME <price.__name__>` — a to musí pořád
říkat `price`.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

Dekorátor je funkce, která bere funkci a vrací funkci. Ta vrácená je obvykle
uzávěr jménem `wrapper`, který něco udělá a pak zavolá originál — a pokud
neřekneš jinak, je `wrapper` to, na co teď jméno `price` ukazuje,
i s `__name__`. `functools.wraps` zkopíruje jméno a docstring originálu na
wrapper. Starter na to zapomněl a poslední řádek říká `NAME wrapper`.

Kde má počítadlo žít? Ne v globální proměnné. Připni ho na wrapper —
`wrapper.calls = 0` — a potom čti `price.calls`. Funkce je objekt a bere
atributy jako kterýkoli jiný.
'''
hints = [
  "@functools.wraps(func) na řádku nad def wrapper. Jeden dekorátor uvnitř tvého dekorátoru.",
  "@counted nad def price je totéž jako price = counted(price) za ní. Jméno se znovu naváže na to, co counted vrátil.",
  "*args, **kwargs je způsob, jak wrapper přepošle jakoukoli signaturu, aniž by ji znal, a to dělá dekorátor znovupoužitelným.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "python.basic.17.duck-typing"
title = "Když to kváká"
story = "Igelitka od stánku s vejci. Nikdo se neptal, co to je; ptali se, kolik toho v ní je, jestli jsou uvnitř kachní vejce, a chtěli ji projít kus po kuse."
brief = '''
Na standardním vstupu je jeden řádek zboží odděleného mezerami a pak jeden
řádek s jediným slovem, které se má hledat.

Dej zboží do `Bag` a vypiš:

1. `LEN <k>` — z `len(bag)`
2. zboží, jeden kus na řádek — z `for item in bag`
3. `HAS <WORD> YES` nebo `HAS <WORD> NO` — z `word in bag`
4. `LONGEST <item>` — z `max(bag, key=len)`, při shodě ten první

```
input:  egg duckegg tofu
        duckegg
output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag` nedědí z `list` a nemusí. `len` volá `__len__`, `for` volá `__iter__`,
`in` volá `__contains__` a `max` potřebuje jen `__iter__`. Python se nikdy
neptá, co věc *je*; ptá se, jestli má tu metodu, ve chvíli, kdy ji potřebuje.
Starter nemá ani jednu a první chyba je `TypeError: object of type 'Bag'
has no len()`.

`__contains__` je nepovinné: bez něj `in` spadne na iterování a porovnávání,
což je správně a pomaleji. Napiš ho stejně, protože přesně to má člověk
u pohovoru na mysli, když řekne „udělej z toho kontejner“.
'''
hints = [
  "def __len__(self): return len(self._goods) — tři metody, každá na jeden řádek.",
  "__iter__ může vrátit iter(self._goods); nemusí to být generátor, i když `yield from self._goods` funguje také.",
  "max(bag, key=len) si nechá první z položek stejné délky, a proto ukázka říká duckegg a ne něco pozdějšího.",
]

# ---------------------------------------------------------------- 18
[[quest]]
id    = "python.basic.18.none"
title = "None"
story = "05:59 na Bowrington Road. Cenová tabule se ptá sešitu na stánek, který ještě neotevřel, sešit odpoví ničím a tabule vypíše cenu toho ničeho."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků ve tvaru `<STALL> <CENTS>`
— stánky, které otevřely — pak počet `q` a `q` jmen stánků k vyhledání.

Pro každý dotaz vypiš `<STALL> <cents>`, nebo `<STALL> NONE`, pokud ten
stánek není otevřený. Pak vypiš `MISSING <k>` a `CHEAPEST <STALL>` — otevřený
stánek s nejnižší cenou, při shodě podle jména — nebo `CHEAPEST NONE`, pokud
není otevřeno nic.

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

Starter spadne na `CHAN`:

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

Tenhle řádek je boss. Nikdy neukazuje na chybu. Ukazuje na místo, kde bylo
`None` nakonec *použito*, a to může být libovolně daleko od místa, kde
*vzniklo* — a ve starteru vzniklo na dvou různých místech. `lookup` vrací
`None` pro stánek, který tam není, záměrně, a volající z něj čte `.cents`,
aniž by se zeptal. A `cheapest` na jedné cestě nemá `return`, takže vrací
`None` **implicitně**, a volající tomu udělá totéž.

Každá funkce v Pythonu něco vrací. Funkce, která doběhne na konec, vrací
`None`. `dict.get` bez výchozí hodnoty vrací `None`. Ani jedno není chyba
v tu chvíli; obojí se chybou stane později. Oprava je v obou případech
stejná: kód, který může `None` dostat, ho zkontroluje, pomocí `is None`,
dřív než sáhne na atribut. Ne `== None`, ne `if not stall` — stánek s cenou
`0` je skutečný stánek a `not` by ho zahodil.

Ať `lookup` a `cheapest` vracejí `Optional[Stall]` **záměrně**, řekni to
v anotaci a `None` ošetři tam, kam dopadne.
'''
hints = [
  "Čti traceback odspodu nahoru: AttributeError je na printu, ale None vyšlo z lookup o řádek dřív a z board.get ještě před tím.",
  "if stall is None: je ta kontrola. `is`, protože None je jediný objekt a identita je poctivé porovnání; `==` se dá přepsat a `not stall` je špatně pro hodnotu, která je falsy, ale skutečná.",
  "cheapest má dvě cesty a jen jedna z nich má return. Python na to neupozorní; podá volajícímu None a nechá ho, ať na to přijde. Dej prázdnému případu explicitní `return None`, aby čtenář viděl, že to bylo myšleno.",
  "Optional[Stall] v anotaci interpret nevynucuje. Je to poznámka pro čtenáře a pro type checker, a čtenář je ten, komu běží čas.",
]
