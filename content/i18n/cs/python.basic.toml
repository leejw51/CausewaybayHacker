# ---------------------------------------------------------------- 15
[[quest]]
id    = "python.basic.15.closures"
title = "Přirážka"
story = "Ovocný stánek přičítá ke každé velkoobchodní ceně na ranním listu stejnou přirážku a funkce, která si ji měla pamatovat, vrací None."
brief = '''
Funkce definovaná uvnitř jiné funkce může používat jména té vnější a
používá je i potom, co se vnější funkce vrátila. To je closure: vnitřní
funkce si nese `k` s sebou. Vnější funkce vrací tu vnitřní — funkci
samotnou, ne její volání.

```
def make_adder(k):
    def add(x):
        return x + k
    return add
```

`make_adder` a její vnitřní `def add(x):` jsou napsané a `main` použije
výsledek na každé číslo. Napiš oba řádky `return` přesně tak, jak jsou
ukázány, místo dvou zástupných.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return x + k uvnitř add, pak return add (bez závorek) jako poslední řádek make_adder.",
  "return add() by ji zavolalo bez argumentu a selhalo; holé jméno je ta funkce.",
]

