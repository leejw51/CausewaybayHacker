[[quest]]
id    = "python.basic.03.types"
title = "Účet napůl"
story = "Dva stánkaři si u brány na Bowrington Road dělí bednu vajec a v sešitě je třikrát stejné číslo tam, kde má být podíl, zbytek a cena za kus."
brief = '''
Python má dvě dělení. `//` je celočíselné dělení a zaokrouhluje dolů; `%`
