[[quest]]
id    = "python.basic.07.structs"
title = "Jeden stánek, tři pole"
story = "Karta stánku s tofu má jméno, cenu a počet, a pokladna čte kartu jako tři volná slova a nic nesčítá."
brief = '''
`class` sdružuje pole a funkce, které s nimi pracují. `__init__` se
spustí při vytvoření objektu a uloží pole na `self`; každá další metoda
bere `self` jako první a pole přes něj čte. Žádné `this` není — objekt je
to jméno, které je v seznamu parametrů první.

```
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        return self.price * self.qty
```

`Stall` a jeho `__init__` jsou napsané. Napiš řádek `return` v `total`
přesně tak, jak je ukázán.

```
input:  tofu 8 5
output: tofu: 40
```
'''
hints = [
  "return self.price * self.qty — pole žijí na self, takže uvnitř metody jsou to self.price a self.qty.",
  "price samo o sobě v total() není jméno; předává se jen self.",
]

