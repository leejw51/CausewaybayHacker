[[quest]]
id    = "python.basic.11.comprehensions"
title = "Jedním průchodem po Bowrington Road"
story = "Alex říká, že to jde třemi cykly for. Ulička je široká na jednoho člověka a podlaha je mokrá; máš jeden průchod."
brief = '''
Na standardním vstupu je jeden řádek celých čísel oddělených mezerami.

