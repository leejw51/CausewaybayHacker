[[quest]]
id    = "python.basic.04.control-flow"
title = "Která ulička"
story = "Čísla uliček na tržnici jsou namalovaná na podlaze a cedule u dveří má říkat, co se ve které uličce prodává. Říká pokaždé jen to číslo."
brief = '''
Načti jedno celé číslo `n`. Pro každé `i` od `1` do `n` vypiš jeden řádek:

* `FISHVEG`, pokud je `i` dělitelné třemi i pěti
* `FISH`, pokud je `i` dělitelné třemi
* `VEG`, pokud je `i` dělitelné pěti
* jinak samotné `i`

Pak čti dál celá čísla, jedno na řádek, dokud nenačteš `0`, a vypiš
`SKIPPED <k>` — kolik nenulových řádků jsi cestou přečetl.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

Dva cykly, dva druhy. První ví, kolikrát poběží, ještě než začne:
`for i in range(1, n + 1)`. Druhý to neví: `while True` s `break`, protože
o počtu rozhoduje to, co načteš. `range` v Pythonu se zastaví **před** svým
koncem a `range(1, n)` je chyba o jedničku, kterou tady každý jednou napíše.
'''
hints = [
  "Nejdřív otestuj případ „obojí“, jinak se nikdy nespustí. Dělitelné třemi a pěti znamená dělitelné patnácti.",
  "range(1, n) končí na n - 1. Starter tuhle chybu má; ukázkový výstup končí o řádek dřív.",
  "while True s break je způsob, jak Python zapisuje cyklus, jehož východ je uprostřed. Žádné do-while není.",
]

