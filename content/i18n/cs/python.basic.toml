`" ".join(...)` chce řetězce, takže druhá comprehension musí vyrábět
`str(v * 2)`, ne `v * 2`. Ten `TypeError: sequence item 0: expected str
instance, int found` je ten, který na tomhle řádku potká každý.
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — generátorový výraz nepotřebuje další závorky, když je jediným argumentem.",
  "[str(v * 2) for v in nums if v > 10] — transformace vpředu, filtr vzadu.",
  "{v for v in nums} je set comprehension; set(nums) je totéž a tady je v pořádku obojí.",
]

