[[quest]]
id    = "python.basic.03.conversions"
title = "Tři podoby, jedno jméno"
story = "Sešit u stánku s rybami drží cenu jako text, jako číslo a jako dolary, a všem třem říká price."
brief = '''
Načti jeden řádek: částku v centech, jako číslice.

Vypiš tři řádky:

1. kolik znaků má oříznutý text
2. částku jako číslo
3. částku v dolarech s přesně dvěma desetinnými místy

```
input:  1234
output: 4
        1234
        12.34
```

Částka je nezáporná. Udělej to s **jedním jménem**, třikrát znovu
navázaným — `str`, pak `int`, pak zase `str`. Python dovolí, aby jméno drželo
cokoli a rozmyslelo si to; cena za to je, že nic ti neřekne, co `cents`
zrovna teď je, kromě přečtení kódu nad tím.

Na dolary nechoď přes `float`. `1234 / 100` je dnes `12.34`, ale
`0.1 + 0.2` je `0.30000000000000004` každý den. Celočíselné dělení a modulo
ti dají obě poloviny přesně a `f"{cents % 100:02d}"` tu druhou doplní nulou.
'''
hints = [
  "len(cents), dokud je cents ještě řetězec, je první řádek.",
  "cents = int(cents) není převod na místě; je to nová hodnota navázaná na staré jméno. Řetězec je po něm pryč.",
  ":02d uvnitř f-stringu je šířka dva, doplněno nulami, desítkově. 5 centů je 0.05, ne 0.5.",
]

