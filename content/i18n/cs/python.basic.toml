id    = "python.basic.14.dataclasses"
title = "Kdo kupuje"
story = "Pult s rýží v suterénu SOGO účtuje každé kartě plnou cenu, včetně těch, které nejsou dospělé, a té jedné, která není karta."
brief = '''
Na standardním vstupu je počet `n` a pak `n` řádků ve tvaru `<TYPE> <KG>`.

Základní cena je `500 + 100 * KG` centů. Pro každý řádek vypiš jedno z:

* `ADULT` — základní cenu
* `STUDENT` — polovinu základní ceny, celočíselným dělením
* `SENIOR` — vždy `200`
* cokoli jiného — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

Namodeluj řádek jako zmrazený `@dataclass` — `Order(kind: str, kg: int)` —
a o ceně rozhodni **jedním** `match` nad objednávkou. `match` umí dataclass
rozložit podle klíčových slov — `case Order(kind="ADULT", kg=kg):` — a jeho
poslední větev, `case Order(kind=other):`, naváže cokoli, co se nechytilo.

`match` ve starteru má jednu větev a pak propadové `case _:`, které vypíše
`UNKNOWN` pro všechno, včetně těch tří druhů, které má znát. Větve se
zkoušejí po pořadě a vyhraje první shoda, takže zástupný vzor musí být
poslední a musí být jediný, který je zástupný.
'''
hints = [
  "Jedna case na druh: case Order(kind=\"STUDENT\"): a tak dále. Dataclass se porovnává podle jmen svých polí.",
  "// je celočíselné dělení; / by ti dalo 450.0 a test chce 450.",
  "case Order(kind=other): je zachytávací vzor — vždy se shodne a naváže značku — takže jde poslední, přesně jako větev `other =>` v matchi v Rustu.",
]

