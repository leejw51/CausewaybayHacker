[[quest]]
id    = "python.basic.17.threads"
title = "Dvanáct stánků najednou"
story = "V 06:30 každý stánek v suterénu SOGO umocňuje svůj stav zásob pro objednávkový formulář ve stejnou chvíli a formulář se vrací samá nula, protože nikdo na nikoho nepočkal."
brief = '''
`threading.Thread(target=f, args=(i,))` vytvoří vlákno, které zavolá
`f(i)`; nic neběží až do `.start()`. `.join()` počká, až to vlákno skončí.
Nejdřív spusť každé vlákno, pak každé připoj — join uvnitř spouštěcí
smyčky by je pouštěl po jednom.

```
