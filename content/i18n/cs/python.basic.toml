story = "Ticker u stánku s rybami vypisuje každou cenu od otevírací výš v pevných krocích a nikde si o nich nevede seznam."
brief = '''
Na standardním vstupu jsou tři celá čísla: `start`, `step`, `count`.

Napiš **generátor** `ticker(start, step, count)`, který dává (yield) `count`
hodnot počínaje `start` a postupujících o `step`. Každou vypiš na vlastní
řádek, pak `SUM <total>` spočítaný tak, že druhý ticker předáš do `sum`.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

Poslední řádek je `type(ticker(...)).__name__`, který vypisuje `main` ze
starteru tak, jak je. Teď říká `list`.

Funkce, ve které je `yield`, se při zavolání nespustí. Vrátí generátor a
tělo běží po jednom kroku, pokaždé když si někdo řekne o další hodnotu.
Proto na něm funguje `for`, proto na něm funguje `sum` a proto dokáže vyrobit
milion hodnot, aniž by kdy existoval seznam o milionu hodnot.

Starter seznam postaví a vrátí ho, což je správně a není to ta otázka.
Seznam jsou všechny hodnoty naráz; generátor je jedna hodnota na požádání.
Změň `append` na `yield` a seznam smaž.
'''
