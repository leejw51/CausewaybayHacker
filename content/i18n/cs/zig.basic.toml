[[quest]]
id    = "zig.basic.05.loops"
title = "Počítání náprav"
story = "Budka 3 počítá jednu nápravu za tik, tabulka chce průběžný součet a to, které z tiků připadly na třetí nápravu."
brief = '''
Počítaná smyčka je v Zigu `while` s pokračovacím výrazem: `while (i
<= n) : (i += 1)` otestuje, provede tělo, pak udělá `i += 1` a testuje
znovu. Počítadlo je `var` deklarovaná před ní, takže `i` projde `1`
až `n` včetně. `@rem(i, 3) == 0` říká „násobek 3“ — `%` na
znaménkových celých číslech tady není.

```
while (i <= n) : (i += 1) {
```

Tělo je napsané: přičte `i` do `sum` a počítá násobky 3.
Napiš ten řádek `while` na `// FILL`, místo toho, který končí o jedno
dřív.

```
input:  10
output: 55
        3
```
'''
hints = [
  "while (i <= n) : (i += 1) { — test, tělo, pak pokračovací výraz za dvojtečkou.",
  "<= n, ne < n: počet zahrnuje n-tou nápravu.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.basic.06.functions"
title = "Mýtný tarif"
story = "Mýtnice účtuje pět za nápravu za prvních deset náprav a tři za každou další, a tabule s tarifem říká jen fare."
brief = '''
Funkce pojmenovává kus práce: `fn`, její jméno, parametry s jejich
typy, návratový typ a tělo, které končí `return`. `fn
fare(rides: i64) i64` bere jedno číslo a jedno vrací. Funkce může
`return` předčasně zevnitř `if` a všechno za tím řádkem je
druhý případ. Zig odmítne řádek, o kterém dokáže, že se nikdy nespustí,
a proto zástupné `return` zmizí, jakmile přijdou dva skutečné řádky.

```
if (rides <= 10) return rides * 5;
return 50 + (rides - 10) * 3;
```

Tarif: prvních 10 jízd stojí 5 za kus, každá další jízda stojí
3. `main` načte `n` a vypíše `fare(n)`. Napiš ty dva řádky jako tělo
`fare` na `// FILL`, místo `return rides;`.

```
input:  13
output: 59
```
'''
hints = [
  "if (rides <= 10) return rides * 5; — pak na dalším řádku return 50 + (rides - 10) * 3;",
  "Deset jízd po 5 je 50 a každá jízda za desátou k tomu přidá 3.",
  "Smaž return rides; — se dvěma returny nad ním ho překladač nazve nedosažitelným kódem a zastaví se.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.basic.07.structs"
title = "Jedna budka, tři pole"
story = "Budka 5 píše jméno pruhu, mýtné a počet vozidel na tři oddělené tabulky a nikdo je nedal na jednu."
brief = '''
`struct` seskupí pojmenovaná pole do jedné hodnoty a `fn` deklarovaná uvnitř
je metoda: `s.total()` předá `s` jako `self` a pole se čtou přes něj,
`self.price`. Při sestavení se jmenuje každé pole, v libovolném
pořadí: `Stall{ .name = name, .price = price, .qty = qty }`. Zig nemá
poziční tvar; zapomenuté pole je chyba překladu, ne nula.

```
return self.price * self.qty;
const s = Stall{ .name = name, .price = price, .qty = qty };
```

`Stall` má jméno, cenu a množství a `main` vypíše
`name: total`. Napiš ty dva řádky na dvě značky `// FILL`: první je tělo
`total()`, druhý staví `s` v `main`.

```
input:  fish 12 3
output: fish: 36
```
'''
hints = [
  "return self.price * self.qty; uvnitř total() a const s = Stall{ .name = name, .price = price, .qty = qty }; v main.",
  "Každé pole se jmenuje s tečkou na začátku: .name = name. Není tu pořadí, které by šlo splést, jen jméno, které jde vynechat.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.basic.08.enums"
title = "Barvy linek"
story = "Přestupní cedule u ústí tunelu jmenuje tři linky MTR pro autobusy, které vyjíždějí, a barevný proužek vedle každé je přetřený."
brief = '''
`enum` je uzavřená množina pojmenovaných hodnot: `.island`, `.tsuen_wan`,
`.kwun_tong` a nic jiného. `switch` nad ním je výraz, který vybere
větev pro hodnotu, kterou drží, a každá větev je `.name => value,`.
Switch musí pokrýt každou hodnotu: větev `else` pokryje ty, které jsi
nejmenoval, a jakmile pojmenuješ všechny, Zig odmítne `else`, na které
nikdy nedojde — takže `else => "",` zmizí, jakmile přijdou ty dvě větve.

```
.tsuen_wan => "red",
.kwun_tong => "green",
```

`parse` převede slovo na `Line` a větev `.island` je napsaná.
Napiš ty dvě větve na značky `// FILL`, pod tu pro `.island`,
a smaž `else`.

```
input:  island
output: blue
```
'''
hints = [
  ".tsuen_wan => \"red\", a .kwun_tong => \"green\", — stejný tvar jako větev .island, i s čárkou.",
  "Hodnota výčtu se píše s tečkou na začátku, když je typ známý: .tsuen_wan, nikdy Line::TsuenWan.",
  "Smaž else => \"\", — jakmile jsou pojmenované všechny tři, překladač ohlásí nedosažitelnou větev else a zastaví se.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.basic.09.vector"
title = "Ráno, v pořadí"
story = "Každá budka hlásí svůj počet přes mýtnici po jednom čísle a úředník směny je nemá kam dát, dokud se neozve poslední budka."
brief = '''
`std.ArrayList(i64)` je rostoucí pole a čtyři věci, které se s ním dělají,
jsou přidat, odebrat, upravit a seřadit. `append(gpa, x)` přidá na konec;
`orderedRemove(i)` odebere prvek na indexu `i`, zavře mezeru a
prvek vrátí — `_ =` ho zahodí, protože Zig nedovolí, aby hodnota
