id    = "go.cheatsheet_advanced.08.mutex-inc"
title = "ZÁMEK PRO ZÁPIS, NE PRO ČTENÍ"
story = "Padesát turniketů v přestupní stanici Causeway Bay počítá cestující do jednoho čísla a to číslo vychází o kousek méně, který nikdo nedokáže zopakovat."
