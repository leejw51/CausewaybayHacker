[[quest]]
id    = "go.cheatsheet_advanced.09.once"
title = "JEN JEDNO ZAHŘÁTÍ"
story = "Dvacet kurýrů otevře aplikaci Lucky Mac v tutéž sekundu a backend otevře dvacet databázových spojení, každému jedno, a všechna se jmenují první."
