'''
hints = [
  "`select` se záložní větví nikdy neblokuje; záložní větev nesmí dělat vůbec nic, ne další odeslání.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "go.cheatsheet_advanced.06.timeout-case"
title = "DVĚ SEKUNDY, PAK KONEC"
story = "Obrazovka na nástupišti v Causeway Bay čeká na signál dalšího vlaku. Čeká dvě sekundy, nebo čeká navždy — firmware si nebyl jistý, co z toho."
brief = '''
`ch` je `<-chan int` a `ctx` je `context.Context`. Doplňte třetí case
tak, aby to funkce po dvou sekundách, kdy nic nedorazí, vzdala.

```
select {
case v := <-ch:
    use(v)
    return nil
case <-ctx.Done():
    return ctx.Err()
// ____
    return errTimeout
}
```
'''
hints = [
  "Case v select musí být odeslání nebo příjem. V `time` je funkce, která vrací kanál, jenž vystřelí po uplynutí `Duration`, a holé `2` jsou dvě nanosekundy.",
]

