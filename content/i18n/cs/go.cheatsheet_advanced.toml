id    = "go.cheatsheet_advanced.05.try-send"
title = "ZAHOĎ, NEČEKEJ"
story = "Tabule příjezdů v Tin Hau loguje každý vlak, o kterém se doslechne; když se log zaplní, tabule sama nesmí zamrznout."
