`ch` je `chan string` s kapacitou 2 a posílá na něj několik gorutin.
V `log(v)` předejte `v` kanálu, pokud je místo, jinak ho zahoďte —
volající nesmí nikdy blokovat a žádná gorutina nesmí zůstat čekat
