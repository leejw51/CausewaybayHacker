[[quest]]
id    = "go.cheatsheet_advanced.07.defer-cancel"
title = "PUSŤ TO CESTOU VEN"
story = "Každé vyhledání jízdného v Admiralty otevře třísekundový časovač a nikdo ho nikdy nezastaví; do večerní špičky drží brána deset tisíc časovačů."
brief = '''
`fetch(ctx)` musí běžet s ještě živým třísekundovým limitem a prostředky
časovače se musí uvolnit, ať už se `get` vrátí jakkoli — předčasným
návratem, chybou nebo úspěchem. (`WithCancel` vrací stejnou dvojici.)

```
func get() error {
    ctx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
    // ____
    return fetch(ctx)
}
```
'''
hints = [
  "Zavolat funkci cancel hned by `ctx` zrušilo dřív, než ho `fetch` uvidí. Naplánujte volání na chvíli, kdy se `get` vrací — a `defer` chce volání, včetně závorek.",
]

