# GO LAND — CHEATSHEET ADVANCED, in Czech. A translation pack (SPEC §12.1):
# the prose of `content/go/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "go.cheatsheet_advanced"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet_advanced.01.buffered"
title = "MÍSTO PRO JEDNOHO"
story = "Výdejní okénko Lucky Mac ve 12:30: kuchař drží tác v natažené ruce, nikdo si ho nebere a celá kuchyně za ním stojí."
brief = '''
Tyto tři řádky běží v `main` a žádná jiná gorutina nežije. Která
deklarace nechá odeslání projít, aby příjem vypsal `1`?

```
// ____
ch <- 1
fmt.Println(<-ch)
```
'''
hints = [
  "Nebufferované odeslání čeká na příjemce a příjemce je tady tatáž gorutina, o řádek dál. Dejte kanálu místo, kam hodnotu odložit.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "go.cheatsheet_advanced.02.wg-launch"
title = "NAPOČÍTEJ, NEŽ VYRAZÍŠ"
story = "Čtyřicet kurýrů vyjíždí z Lucky Mac najednou a dispečer zavírá krám dřív, než je seznam, kdo vyjel, vůbec napsaný."
brief = '''
`go.mod` říká `go 1.22`, takže každá iterace má vlastní `i`. Spusťte
`work(i)` pro každé `i` v gorutině a zajistěte, aby závěrečný `Wait`
opravdu počkal na všech `n` — nic nesmí závodit s počítadlem.

```
var wg sync.WaitGroup
for i := range n {
    // ____
}
wg.Wait()
```
'''
hints = [
  "Počítadlo jde nahoru v gorutině, která bude volat `Wait`, ještě před `go`; dolů jde uvnitř té nové, odloženě, a `defer` potřebuje volání.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "go.cheatsheet_advanced.03.close-range"
title = "POSLEDNÍ TALÍŘ, ROLETA DOLŮ"
story = "Z výdeje odchází poslední talíř obědového návalu a runner tam dál stojí, protože mu nikdo neřekl, že kuchyně skončila."
brief = '''
Konzument v `main` prochází `for v := range ch { ... }` a pak vypíše
`done`. Který řádek na konci producenta tu smyčku ukončí, se všemi
hodnotami doručenými a bez gorutiny, která by zůstala čekat?

```
func produce(ch chan<- int) {
    for i := range 3 {
        ch <- i
    }
    // ____
}
```
'''
hints = [
  "Range přes kanál končí, až když je kanál zavřený a vyprázdněný. Zarážková hodnota je jen další hodnota; smyčka čeká dál.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "go.cheatsheet_advanced.04.worker-sig"
title = "JEDNA CESTA DOVNITŘ, JEDNA VEN"
story = "Čtyři kuchaři na lince Lucky Mac berou objednávky z jedné lišty a staví talíře na druhou; nováček pořád vrací objednávky zpátky na lištu."
brief = '''
Worker pool: `main` vytvoří `jobs` a `results` jako obyčejné `chan int`,
spustí čtyři workery, pošle devět úloh, zavře `jobs` a pak posbírá devět
výsledků přes `<-results`. Která signatura se s tímhle tělem zkompiluje —
a přiměje kompilátor odmítnout odeslání na `jobs` nebo příjem z `results`
uvnitř workeru?

```
// ____
    for j := range jobs {
        results <- j * j
    }
}
```
'''
hints = [
  "Šipka stojí na straně, kam data tečou: před `chan` jen pro vybírání, za `chan` jen pro vkládání. Obousměrný kanál se převede na obojí.",
]

