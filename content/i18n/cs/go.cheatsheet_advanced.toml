[[quest]]
id    = "go.cheatsheet_advanced.11.fan-in"
title = "MNOHO LINEK, JEDNO NÁSTUPIŠTĚ"
story = "Vlaky z Tsuen Wan a Kwun Tong se sjíždějí na jedno nástupiště v Admiralty; sloučení funguje až do posledního nočního vlaku, kdy se nástupiště nikdy nevyprázdní."
brief = '''
Fan-in. `go.mod` říká `go 1.22`, takže každá iterace má vlastní `c`.
Spusťte pro každý vstup přeposílač, který ho zkopíruje do `out` a pak
se odhlásí jako hotový, aby zavírač níže mohl `out` zavřít.

```
func merge(ins ...<-chan int) <-chan int {
    out := make(chan int)
    var wg sync.WaitGroup
    wg.Add(len(ins))
    for _, c := range ins {
        // ____
    }
    go func() { wg.Wait(); close(out) }()
    return out
}
```
'''
hints = [
  "Musí to běžet ve vlastní gorutině (klíčové slovo `go` a volání na konci) a musí to skupině oznámit, až to skončí — jinak se `Wait` nikdy nevrátí a `out` se nikdy nezavře.",
]

