# ZIG LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/zig/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "zig.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "zig.verybasic.01.print"
title = "První slovo budky"
story = "06:00 u portálu v Causeway Bay. Displej budky 1 má zahájit směnu jedním řádkem a ten řádek chybí."
brief = '''
Program musí vypsat přesně `hello, causewaybay` a konec řádku. `w` je
bufferovaný zapisovač na stdout; jeho `print` bere formátovací řetězec
a n-tici argumentů — prázdnou n-tici, `.{}`, když žádné nejsou — a může
selhat, takže volání musí mít `try`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "try w.print(\"hello, causewaybay\\n\", .{}); — try, formátovací řetězec, prázdná n-tice.",
  "print bere vždy dva argumenty; a volání, které může selhat, nesmí svou chybu zahodit.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "zig.verybasic.02.int-types"
title = "Počet, který se do i32 nevejde"
story = "Výroční zpráva mýtného počítá průjezdy v miliardách a registr, který to číslo držel, byl široký 32 bitů."
brief = '''
Načti `a`, `i32`. Program potřebuje `big`, `i64` držící `a` krát
jednu miliardu — hodnotu, kterou `i32` neudrží, jakmile je `a` větší než 2.
Zig počítá v typu svých operandů a v `-O Debug` se zastaví s
`panic: integer overflow`, když se výsledek nevejde; `a` se proto musí
rozšířit na `i64` před násobením, ne až po něm.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  3
output: 3000000000
```
'''
hints = [
  "const big: i64 = @as(i64, a) * 1000000000; — napřed rozšiř a, pak násob v 64 bitech.",
  "a * 1000000000 je i32 krát konstanta, která se do i32 vejde, takže i součin je i32 — a tři miliardy nejsou: panic: integer overflow.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "zig.verybasic.03.floats"
title = "Mýtné v desetinách"
story = "Zpráva ze směny dělí ranní tržbu počtem projetých vozidel a tiskne celé dolary tam, kde vedoucí chtěl centy."
brief = '''
Načti dvě kladná celá čísla `a` a `b`. Program potřebuje `q`, podíl jako
`f64`. Zig za tebe nikdy číslo nepřevede: dvě celá čísla vydělená jsou celé
číslo a `@floatFromInt` udělá z celého čísla desetinné jen tehdy, když se
mu řekne, jaké, pomocí `@as(f64, ...)` kolem něj.
Výpis s `{d:.2}` už je napsaný.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "const q: f64 = @as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b)); — každá strana se stane f64 před dělením.",
  "@floatFromInt(a) / @floatFromInt(b) se nepřeloží: uprostřed výrazu nemá vestavěná funkce žádný výsledný typ, kterým by se stala. @divTrunc(a, b) je 3 dřív, než se z něj vůbec stane float.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "zig.verybasic.04.strings"
title = "Jak dlouhé je jméno"
story = "Jméno účtu Autotoll je jeden řádek registru a audit chce jeho délku ve znacích."
brief = '''
`s` je vstupní řádek s oříznutým koncem řádku — `[]const u8`, řez
bajtů. Program musí vypsat, kolik bajtů drží. Řez nese svou délku jako
pole, ne jako metodu.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  kwan lee
output: 8
```
'''
hints = [
  "try w.print(\"{d}\\n\", .{s.len}); — len je pole řezu, takže bez závorek.",
  "@sizeOf([]const u8) je velikost samotného řezu — ukazatel a délka, 16 bajtů — ne textu, na který ukazuje.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "zig.verybasic.05.bool-if"
title = "Sudý, nebo lichý"
story = "Mýtnice posílá sudé počty náprav do levých pruhů a liché do pravých a počítadlo, které to rozhoduje, nikdy nezmění názor."
brief = '''
Načti `n`, `i64`. Program potřebuje `even`, `bool`, který je pravdivý, když
je `n` dělitelné dvěma beze zbytku. Na znaménkovém celém čísle Zig operátor
`%` odmítne — znaménko zbytku je nejednoznačné — a chce `@mod` nebo `@rem`
jménem.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  4
output: even
```
'''
hints = [
  "const even = @mod(n, 2) == 0; — zbytek jménem, pak porovnání.",
  "n % 2 se na i64 nepřeloží: znaménková celá čísla musí použít @rem nebo @mod. A @divTrunc(n, 2) je podíl, ne to, co zbude.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "zig.verybasic.06.loops"
title = "Počítání náprav"
story = "Budkou 2 projede n vozidel a záznam sčítá jejich čísla, jenže smyčka, kterou používá, začíná o jedno dřív a končí o jedno dřív."
brief = '''
Načti `n`. Program musí sečíst `1 + 2 + … + n` do `sum`. Tělo smyčky je
napsané; hlavička `for`, která vede `i` od 1 do `n`, je díra. `for` přes
rozsah `a..b` začíná na `a` a končí před `b` a hodnota se zachytí pomocí
`|i|` za závorkami.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  10
output: 55
```
'''
hints = [
  "for (1..n + 1) |i| { — konec rozsahu je vyloučený, takže o jedno za n.",
  "1..n skončí na n - 1; ..= v Zigu není; a for přes rozsah musí svou hodnotu zachytit, jinak se nepřeloží.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "zig.verybasic.07.functions"
title = "Druhá mocnina"
story = "Senzor v pruhu hlásí odečet a displej chce jeho druhou mocninu, jenže funkce, která to má udělat, vrátí odečet rovnou zpátky."
brief = '''
`square` bere `i64` a musí vrátit to číslo vynásobené samo sebou.
Jeho `return` je díra; `main` načte `x` a vypíše `square(x)`. Každý
příkaz v Zigu končí středníkem a `^` není mocnina.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7
output: 49
```
'''
hints = [
  "return x * x; — vynásob a vrať výsledek.",
  "^ je v Zigu bitový XOR, ne mocnina: 7 ^ 2 je 5.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "zig.verybasic.08.structs"
title = "Jeden lístek, dvě pole"
story = "Stravenka obsluhy budek drží jméno a cenu každé položky a záznam nové objednávky se nikdy nesestaví."
brief = '''
`Item` má `name` a `price`. Program obojí načetl a potřebuje
`s`, `Item` sestavený z nich — struktura se inicializuje složenými
závorkami a každé pole se pojmenuje s tečkou, `.field = value`; vynechané
pole je chyba překladu, ne nula.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  fish 40
output: fish 40
```
'''
hints = [
  "const s = Item{ .name = name, .price = price }; — složené závorky, každé pole jménem s tečkou na začátku.",
  "Item{ name, price } není struktura: poziční pole patří n-ticím. Item{ .name = name } nechá price chybět a Zig ho hádat nebude.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "zig.verybasic.09.struct-method"
title = "Vlastní součet lístku"
story = "Každá stravenka zná svou cenu a množství a její `total()` odpoví jen cenou."
brief = '''
`Item.total` musí vrátit `price` krát `qty`. Metoda je funkce
deklarovaná uvnitř struktury, jejímž prvním parametrem je struktura sama,
a k polím se dostane přes ten parametr — žádné implicitní `this` není.
Díra je `return`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  fish 40 3
output: fish: 120
```
'''
hints = [
  "return self.price * self.qty; — obě pole přes self, vynásobená.",
  "Holé price není uvnitř total jméno, které by překladač znal: k polím se dá dostat jen přes parametr.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "zig.verybasic.10.enums"
title = "Dvě linky, dvě barvy"
story = "Cedule u výjezdu z tunelu v Causeway Bay jmenuje dvě linky MTR a drát, který vybírá výčtovou hodnotu, je přestřižený."
brief = '''
Načti jedno slovo, `island` nebo `tsuenwan`. Program potřebuje `line`, `Line`
vybranou podle slova; `switch`, který vypíše barvu, je napsaný. V Zigu je
`if` výraz, takže může stát na pravé straně deklarace, a dva řezy se
porovnávají pomocí `std.mem.eql`, nikdy `==`. Když je typ deklarovaný, dá
se hodnota výčtu napsat jen jako `.island`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "const line: Line = if (std.mem.eql(u8, word, \"island\")) .island else .tsuen_wan; — výraz if, řezy porovnané podle obsahu.",
  "word == \"island\" porovnává řez s ukazatelem a nepřeloží se; operátor ? : v Zigu není, výrazem je if/else.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "zig.verybasic.11.vector"
title = "Mince, jedna po druhé"
story = "Mince padají do misky budky 4 jedna po druhé a seznam s počty nikdy neroste."
brief = '''
Načti řádek celých čísel. Každá hodnota `x` se musí při čtení připojit do
`std.ArrayList` `xs`; smyčka i výpis jsou napsané. ArrayList nevlastní
žádný alokátor: každé volání, které ho může zvětšit, dostane `gpa`, a může
selhat, takže má `try`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4
output: 4
        1 2 3 4
```
'''
hints = [
  "try xs.append(gpa, x); — napřed alokátor, pak hodnota, a try vpředu.",
  "Samotné append(x) má o argument méně: seznam si alokátor nepamatuje. Bez try je chybové sjednocení ignorované, a to je chyba překladu.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "zig.verybasic.12.vector-edit"
title = "První už projel"
story = "Fronta u závory je seznam čísel vozidel a první už projel, ale v seznamu pořád je."
brief = '''
`v` drží celá čísla z řádku. Program musí odstranit první prvek
a vypsat zbytek, v pořadí. ArrayList má odstranění, které zachová pořadí
zbytku, a jedno, které mezeru zaplní posledním prvkem; obě vrací odstraněnou
hodnotu, a hodnotu Zig nedovolí jen tak upustit na zem — musí se přiřadit,
do `_`, když ji nikdo nechce.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4
output: 2 3 4
```
'''
hints = [
  "_ = v.orderedRemove(0); — index 0, zbytek posunutý dolů, vrácená hodnota úmyslně zahozená.",
  "swapRemove(0) přesune poslední prvek na místo 0 a pořadí je pryč; pop() vezme poslední; a orderedRemove bez _ = je ignorovaná hodnota, která se nepřeloží.",
]

# ---------------------------------------------------------------- 13
[[quest]]
id    = "zig.verybasic.13.list"
title = "Na začátek řady"
story = "Odstavný pruh drží svá hlášení v propojeném seznamu a každé nové má jít na začátek."
brief = '''
Načti řádek celých čísel. Každý `item` se musí napojit na ZAČÁTEK
`std.DoublyLinkedList` `l`, aby se poslední načtený vypsal první. Seznam
je intruzivní: propojuje pole `node` vložené v každém `Item`, přes
ukazatel, a průchod, který je vypíše, je napsaný.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3
output: 3 2 1
```
'''
hints = [
  "l.prepend(&item.node); — seznam propojuje vložený uzel, přes ukazatel.",
  "append zachová pořadí vstupu; obrací ho až začátek. A seznam bere *Node, takže & není volitelné.",
]

# ---------------------------------------------------------------- 14
[[quest]]
id    = "zig.verybasic.14.maps"
title = "Sčítací tabule"
story = "Sčítací tabule mýtnice počítá každou třídu projetých vozidel a počet se nikdy nepohne."
brief = '''
Načti řádek slov. Pro každé `word` musí počet v `counts`,
`std.StringHashMap(i64)`, stoupnout o jedna. `get` odpoví volitelnou
hodnotou — `null` pro slovo, které ještě nepadlo, a z toho udělá `orelse`
nulu — a `put` uloží nový počet. Smyčka i seřazený výpis jsou napsané.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  fish crab fish
output: crab 1
        fish 2
```
'''
hints = [
  "try counts.put(word, (counts.get(word) orelse 0) + 1); — čti s výchozí hodnotou, přičti jedna, ulož.",
  "counts.get(word) + 1 se nepřeloží: get vrací ?i64 a k volitelné hodnotě se nedá nic přičíst, dokud ji orelse nerozbalí.",
]

# ---------------------------------------------------------------- 15
[[quest]]
id    = "zig.verybasic.15.hashtable"
title = "Najdi to, nebo ne"
story = "Tabulka mýtného je hašovací mapa podle třídy vozidla a dotaz na třídu, o které nikdo neslyšel, musí odpovědět minus jedna, ne vymyšlenou nulou."
brief = '''
`table` mapuje jména na ceny, sestavená z prvního řádku. Načti jedno jméno
`q`. Program potřebuje `price`: hodnotu z tabulky, když tam klíč je,
`-1`, když není. `get` vrátí volitelnou hodnotu a volitelná hodnota není
číslo, dokud se nerozbalí — `orelse` dá výchozí hodnotu,
`.?` na `null` zpanikaří.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  fish 40 crab 120
        fish
output: 40
```
'''
hints = [
  "const price = table.get(q) orelse -1; — volitelná hodnota a co použít, když je null.",
  "table.get(q).? na chybějícím klíči je panic: attempt to use null value; a holé ?i64 se s {d} vypsat nedá.",
]

