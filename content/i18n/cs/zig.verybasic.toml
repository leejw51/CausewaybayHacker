# ---------------------------------------------------------------- 21
[[quest]]
id    = "zig.verybasic.21.sort-by-key"
title = "Nejvytíženější budka první"
story = "Přehled tržeb uvádí jméno a součet každé budky a tabule chce ten největší nahoře."
brief = '''
`rows` drží záznamy `Row{name, score}`. Program je musí seřadit podle
`score`, od nejvyššího. Zig nemá lambdy: komparátor je pojmenovaná
funkce, `byScoreDesc`, předaná `std.mem.sort` jménem, a odpoví `true`,
když `a` jde před `b`. Díra je její `return`. Skóre jsou
navzájem různá.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  3
        mei 40
        alex 90
        sam 65
output: alex 90
        sam 65
        mei 40
```
'''
hints = [
  "return a.score > b.score; — komparátor odpovídá na „jde a první?“.",
  "< dá nejmenší na začátek, což dělá startovní kód; dva Row se nedají porovnat pomocí > celé.",
]

# ---------------------------------------------------------------- 22
[[quest]]
id    = "zig.verybasic.22.reverse"
title = "Odzadu dopředu"
story = "Odečty náprav se zapisovaly od nejnovějšího a zpráva je čte od nejstaršího."
brief = '''
`v` drží celá čísla z řádku. Program musí obrátit `v.items` na místě —
funkcí z `std.mem` přes celý řez, které se napřed dá typ prvku.
ArrayList žádné vlastní obracení nemá.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4
output: 4 3 2 1
```
'''
hints = [
  "std.mem.reverse(i64, v.items); — typ prvku, pak řez.",
  "v.items[1..] nechá první prvek, kde je; a žádné v.reverse() k zavolání není.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "zig.verybasic.23.closures"
title = "Příplatek"
story = "Ke každému mýtnému se přičítá stejný příplatek a věc, která si ho měla pamatovat, ho zapomněla."
brief = '''
Načti `k`, pak řádek celých čísel. Ke každé hodnotě se přičte `k` a
výsledky se vypíšou. Zig nemá uzávěry — funkce nevidí lokální proměnné
kolem sebe — takže to nejbližší je napsané tady: `Adder`, struktura,
která nese `k` v poli, s metodou `call`, která se k němu dostane přes
`self`. Díra je `return` té metody.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return x + self.k; — k je to, které nese struktura, dostupné přes self.",
  "x + k se nepřeloží: k z main není uvnitř call vidět, protože v Zigu nic nezachytává. Zachycením je pole struktury.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "zig.verybasic.24.lambdas"
title = "Spočítej sudé pruhy"
story = "Čísla pruhů podél mýtnice přicházejí v seznamu a kancelář chce vědět, kolik z nich je sudých."
brief = '''
`v` drží celá čísla z řádku. Program potřebuje `evens`: kolik z nich
je sudých, spočítané funkcí `countIf`, která bere řez a predikát —
ukazatel na funkci, `*const fn (i64) bool`. Odpovědí Zigu na lambdu je
funkce deklarovaná uvnitř anonymní struktury a vybraná z ní jménem, celé
na jednom řádku: `struct { fn f(...) ... }.f`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4 6
output: 3
```
'''
hints = [
  "const evens = countIf(v.items, struct { fn f(x: i64) bool { return @mod(x, 2) == 0; } }.f); — funkce, deklarovaná ve struktuře a vybraná jménem.",
  "Bez .f je argumentem typ, ne funkce; holé fn je deklarace a nemůže stát uvnitř volání; == 1 počítá liché.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "zig.verybasic.25.threads"
title = "Jedna budka, jedno vlákno"
story = "Budka 7 sčítá tržbu na druhém vlákně, zatímco hlavní čeká, a to vlákno se nikdy nespustí."
brief = '''
`v` drží celá čísla z řádku a `sumInto(xs, out)` je sečte do
`out`. Program potřebuje `t`, vlákno OS spuštěné tak, aby běželo `sumInto`
nad `v.items` s ukazatelem na `result`; `main` na něj počká přes join a vypíše.
`std.Thread.spawn` bere konfiguraci (`.{}` pro výchozí), funkci
a její argumenty jako n-tici, a může selhat.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3 4
output: 10
```
'''
hints = [
  "const t = try std.Thread.spawn(.{}, sumInto, .{ v.items, &result }); — konfigurace, funkce, argumenty v n-tici.",
  "sumInto chce *i64, takže argument je &result, ne result; a spawn může selhat, takže bez try není na co čekat.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "zig.verybasic.26.mutex"
title = "Čtyři ruce na jednom počítadle"
story = "Čtyři budky přičítají do jednoho počítadla v kanceláři mýtnice a mutex se v každém průchodu vrací, aniž by ho kdy kdo vzal."
brief = '''
Čtyři vlákna každé přičtou jedničku do `counter` stotisíckrát. Každý
průchod smyčkou musí při přičítání držet mutex `mu`. `defer`, který
odemkne u zavírací složené závorky, je napsaný; díra je řádek, který zámek
vezme. `std.Io.Mutex` se zamyká s `io` v ruce — `lock` se dá zrušit a
vrací chybové sjednocení, a prostá nezrušitelná podoba nevrací nic.
Odemknout mutex, který nikdo nedrží, je `unreachable`, a v `-O Debug`
je to panika.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "mu.lockUncancelable(io); — zamkne hned; defer, který už tam je, odemkne na konci průchodu.",
  "mu.lock(io) vrací chybové sjednocení, které work nemůže ignorovat ani vrátit; mu.unlock(io) na mutexu, který nikdo nedrží, je dosažený nedosažitelný kód.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "zig.verybasic.27.binary-tree"
title = "Přetečení"
story = "06:00, budka 3. Počítadlo náprav bylo `u8`, dvěstěpadesátá šestá náprava rána prošla jako `panic: integer overflow` a závora je dole; stvrzenky od půlnoci se musí přeindexovat ručně, do vyhledávacího stromu dost širokého, aby je pojal."
brief = '''
`val` je tentokrát `i64`: dost široké. `insert` vloží `v` do
vyhledávacího stromu s kořenem v `n`, volitelném ukazateli: případ `null` je
napsaný a udělá nový uzel z arény. Díra je ten jeden řádek, který pošle
`v` dolů na správnou stranu — doleva, když je menší než `node.val`,
jinak doprava — a uloží, co vrátí rekurze; volání alokuje, takže má
`try`. Potomek je `?*Node` a předává se dolů tak, jak je — nikdy se
nerozbaluje pomocí `.?` dřív, než se někdo podíval.
Průchod inorder pak vypíše vzestupně.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); — zanoř se do jedné strany a ulož výsledek.",
  "node.left.? je prázdný potomek rozbalený dřív, než se někdo podíval — panic: attempt to use null value při druhém vložení. Potomek jde dolů jako volitelná hodnota, kterou je; a menší jde doleva.",
]
