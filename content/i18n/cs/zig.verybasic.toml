# ---------------------------------------------------------------- 18
[[quest]]
id    = "zig.verybasic.18.queue"
title = "První dovnitř, první ven"
story = "Vozidla se řadí u budky 6 a obsluhují se v pořadí, v jakém přijela, jenže fronta nikoho nebere."
