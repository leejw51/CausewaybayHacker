input:  3 1 3 2 1
output: 3
        1 2 3
```
'''
hints = [
  "try seen.put(x, {}); — klíč a jediná hodnota typu void.",
  "put bere klíč a hodnotu, i když hodnota je nic; append je slovo seznamu a mapa nemá konec, na který by se připojovalo.",
]

