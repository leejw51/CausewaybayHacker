[[quest]]
id    = "zig.verybasic.16.sets"
title = "Každá značka jednou"
story = "Čísla značek chodí z kamery s opakováním a registr má každé držet jednou, v pořadí."
brief = '''
Načti řádek celých čísel. Každé `x` musí jít do `seen`, množiny. Standardní
