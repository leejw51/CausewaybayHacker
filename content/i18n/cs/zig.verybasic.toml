# ---------------------------------------------------------------- 19
[[quest]]
id    = "zig.verybasic.19.heap"
title = "Nejlehčí jako další"
story = "Mostní váha bere jako další vždycky nejlehčí náklaďák a halda, která ho má vydat, je obráceně."
brief = '''
Načti řádek celých čísel. Program je všechna vloží do `pq`,
