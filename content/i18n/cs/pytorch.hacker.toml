# ---------------------------------------------------------------- 01
[[quest]]
id    = "pytorch.hacker.01.pairwise"
title = "Každá dvojice, žádná smyčka"
story = "Room 7-32, popáté. První otázka je ta, kterou dostane každý, a hodiny se rozběhnou už cestou dovnitř."
brief = '''
První řádek je `n d`. Pak `n` řádků po `d` floatech.

Vypiš matici `n × n` eukleidovských vzdáleností, každou zaokrouhlenou na tři místa, jeden řádek matice na řádek výstupu, hodnoty oddělené jednou mezerou.

Odpověď, kterou hledají, v sobě nemá žádnou pythonovou smyčku. Broadcasting `(n, 1, d)` proti `(1, n, d)` dá všechny rozdíly najednou.

```
input:  3 2
        0 0
        3 4
        0 4
output: 0.0 5.0 4.0
        5.0 0.0 3.0
        4.0 3.0 0.0
```
'''
hints = [
  "(x.unsqueeze(1) - x.unsqueeze(0)) má tvar (n, n, d) — každý rozdíl každé dvojice.",
  "torch.cdist(x, x) je odpověď z knihovny; pohovor obvykle chce broadcasting rozepsaný.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "pytorch.hacker.02.topk-accuracy"
title = "V první pětce"
story = "Článek tvrdí top-5 a kód počítá top-1. Nikdo si toho nevšiml, dokud si recenzent neřekl o to číslo."
brief = '''
První řádek je `n c k`. Pak `n` řádků po `c` logitech. Poslední řádek je `n` celočíselných labelů.

Vypiš přesnost top-1 a přesnost top-`k`, každou zaokrouhlenou na čtyři místa, oddělené mezerou. Vzorek se do top-`k` počítá, pokud je jeho label mezi `k` největšími logity jeho řádku.

`topk` vrací hodnoty a indexy; o indexech je tahle otázka.

```
input:  3 4 2
        1 2 3 0
        5 1 0 2
        0 1 4 3
        2 0 3
output: 0.6667 1.0
```
'''
hints = [
  "logits.topk(k, dim=1).indices je (n, k), už seřazené od nejlepšího, takže sloupec 0 je predikce top-1.",
  "(idx == want.unsqueeze(1)).any(dim=1) — unsqueeze je to, co nechá label broadcastovat přes k sloupců.",
]

