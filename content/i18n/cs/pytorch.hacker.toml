[[quest]]
id    = "pytorch.hacker.18.adam"
title = "Napiš Adam"
story = "Napiš Adam zpaměti a zařiď, aby se po třech krocích shodoval s knihovnou. Otázka je korekce vychýlení."
brief = '''
První řádek je `steps lr`. Druhý řádek je `steps` gradientů, jeden na krok, aplikovaných na skalární parametr začínající na `0`.

Vypiš svůj parametr po krocích zaokrouhlený na šest míst, pak ten z torche, pak `True`, pokud se shodují na `1e-6`.

Adam, s `β₁ = 0.9`, `β₂ = 0.999`, `eps = 1e-8`:

```
m = b1*m + (1-b1)*g
v = b2*v + (1-b2)*g*g
mh = m / (1 - b1**t)
vh = v / (1 - b2**t)
w = w - lr * mh / (sqrt(vh) + eps)
```

