[[quest]]
id    = "pytorch.hacker.11.dropout"
title = "Napiš dropout"
story = "Napiš dropout, řeknou, a pak: co dělá při inferenci? Ta druhá otázka je ta skutečná."
brief = '''
První řádek je `n p seed`, kde `p` je pravděpodobnost zahození.

Vypiš podíl, který přežil, a průměr výstupu, každý zaokrouhlený na **jedno** místo, a `True`, pokud se zachovala očekávaná hodnota — tedy pokud byly přeživší prvky přeškálované o `1/(1-p)`.

Jedno místo, protože přesný los je věc generátoru, a ne otázky: kontroluje se, že výstup má v průměru pořád 1 poté, co se podíl `p` z něj zahodil.

Tohle je **invertovaný** dropout, a ten implementuje každý framework: škálování se děje při tréninku, takže inference je jen identita, bez čehokoli k zapamatování a bez čehokoli k vypínání.

```
input:  1000 0.5 0
output: 0.5 1.0 True
```
'''
hints = [
  "Na trénovací cestě vyděl (1 - p); v tom je celý rozdíl mezi dropoutem a prostým nulováním.",
  "Bez škálování se aktivace zmenší faktorem (1 - p) a každá další vrstva při inferenci vidí špatné měřítko.",
]

