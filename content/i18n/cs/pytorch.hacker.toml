Absolutní člen vznikne připojením sloupce jedniček a řešení je `(XᵀX)⁻¹Xᵀy`. Použij `torch.linalg.lstsq`, který to udělá bez sestavení inverze; tazatel vezme obojí, pokud tam sloupec pro bias je.

