id    = "pytorch.hacker.05.cross-entropy"
title = "Napiš cross-entropy"
story = "Teď napiš ztrátu a zařiď, aby se s knihovnou shodovala na pět desetinných míst na dávce, kterou ti podají."
brief = '''
