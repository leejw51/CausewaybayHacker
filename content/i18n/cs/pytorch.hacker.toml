Vypiš svou vyhlazenou ztrátu zaokrouhlenou na pět míst, pak `True`, pokud se s `nn.CrossEntropyLoss(label_smoothing=eps)` shoduje na `1e-5`.

Label smoothing nahradí one-hot cíl hodnotou `1 - eps` na správné třídě a `eps / c` rozprostřeným přes **všech** `c` tříd — včetně té správné, a to je detail, který rozhodne, jestli se tvoje číslo s knihovnou shoduje.

