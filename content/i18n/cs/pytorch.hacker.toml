[[quest]]
id    = "pytorch.hacker.04.stable-softmax"
title = "Napiš softmax"
story = "Napiš softmax. Je to první, na co se ptají, a odpověď, na kterou čekají, je to odečtení, které nikdo nenapíše na první pokus."
