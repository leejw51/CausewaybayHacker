[[quest]]
id    = "pytorch.hacker.12.gelu"
title = "Ta z transformeru"
story = "MLP v bloku nepoužívá ani ReLU, ani sigmoidu, a kandidát má napsat tu, kterou používá."
brief = '''
První řádek je `n`. Druhý řádek je `n` floatů.

Vypiš svou přesnou GELU zaokrouhlenou na čtyři místa, pak `True`, pokud se s `nn.GELU()` shoduje na `1e-5`.

Přesná GELU je `x · Φ(x)`, kde `Φ` je distribuční funkce standardního normálního rozdělení: `0.5 · (1 + erf(x/√2))`. Tvar s `tanh` je aproximace a s výchozí verzí se na `1e-5` **neshoduje**, a v tom je past té otázky.

```
input:  3
        -1 0 1
output: -0.1587 0.0 0.8413 True
```
'''
hints = [
  "x * 0.5 * (1 + torch.erf(x / 2 ** 0.5)) — torch.erf je chybová funkce.",
  "nn.GELU(approximate=\"tanh\") je ta druhá; výchozí je přesná a s tou se musíš shodovat.",
]

