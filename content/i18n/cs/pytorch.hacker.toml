[[quest]]
id    = "pytorch.hacker.03.cosine"
title = "Úhel, ne délka"
story = "Vyhledávání řadí podle skalárního součinu a nejdelší vektor vyhraje každý dotaz bez ohledu na to, co říká."
brief = '''
První řádek je `n m d`. Pak `n` řádků dotazů po `d` floatech, pak `m` řádků dokumentů po `d` floatech.

Vypiš matici kosinové podobnosti `n × m`, zaokrouhlenou na čtyři místa, jeden řádek matice na řádek výstupu.

Kosinová podobnost je skalární součin **normalizovaných** vektorů. Nejdřív normalizovat a pak násobit je odpověď, která zůstane jedním maticovým násobením; dělit až potom chce vnější součin norem a tam lidé ztrácejí nit.

```
input:  2 2 2
        1 0
        0 2
        1 0
        1 1
output: 1.0 0.7071
        0.0 0.7071
```
'''
hints = [
  "q / q.norm(dim=1, keepdim=True) — keepdim je to, co nechá dělení broadcastovat dolů přes řádky.",
  "Pak jedno maticové násobení: qn @ kn.t(). Nulový vektor by dělil nulou, a na to je eps ve F.normalize.",
]

