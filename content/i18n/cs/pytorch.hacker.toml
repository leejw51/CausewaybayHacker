  "t začíná na 1, takže enumerate(gs, start=1) — t rovné 0 dělí nulou hned při první korekci.",
  "S konstantním gradientem je korigované mh/sqrt(vh) skoro přesně 1, takže každý krok posune zhruba o lr.",
]

