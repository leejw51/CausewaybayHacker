Cross-entropy dávky je průměr přes řádky z `-log_softmax(logits)[row, label]`. Napsaná takhle je stabilní, je to jeden `gather` a je to odpověď, kterou chtějí. Napsaná jako `-log(softmax(x))` je to odpověď, která na skrytém případu vrátí `inf`.

