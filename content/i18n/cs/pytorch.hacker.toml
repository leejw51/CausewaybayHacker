Pro každý řádek vypiš softmax zaokrouhlený na čtyři místa — spočítaný **bez** `torch.softmax`.

`exp` velkého logitu přeteče do `inf` a z řádku se stane `nan`. Odečíst nejdřív maximum každého řádku matematicky nezmění nic a numericky všechno, protože největší exponent se stane `exp(0)`.

```
input:  2 3
        1 2 3
        1000 1000 1000
output: 0.09 0.2447 0.6652
        0.3333 0.3333 0.3333
```
'''
hints = [
  "x - x.max(dim=1, keepdim=True).values, pak exp, pak vydělit součtem řádku.",
  "max(dim=...) vrací hodnoty a indexy; .values je ta polovina, kterou chceš, a keepdim drží broadcasting poctivý.",
]

