Focal loss je `-(1 - p_t)^γ · log(p_t)`, kde `p_t` je pravděpodobnost, kterou model dal **správnému** labelu. Sebejistá, správná predikce má `p_t` blízko 1, takže `(1 - p_t)^γ` je blízko nuly a přestane přispívat.

