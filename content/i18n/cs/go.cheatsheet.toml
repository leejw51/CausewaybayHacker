[[quest]]
id    = "go.cheatsheet.12.close-results"
title = "POSLEDNÍ ZHASÍNÁ"
story = "Čtyři kurýři pracují v noci ze zadní místnosti na Percival Street. Někdo musí zamknout, až se vrátí poslední — a ne dřív."
