for w := 0; w < 4; w++ { wg.Add(1); go worker(jobs, results, &wg) }
// ____
for r := range results { fmt.Println(r) }
```
'''
hints = [
  "Čekání musí běžet vedle čtenáře, ne před ním: workeři visí na nebufferovaném odeslání, dokud `main` nečte.",
]

