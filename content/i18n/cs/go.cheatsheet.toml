# GO LAND — CHEATSHEET, in Czech. A translation pack (SPEC §12.1): the prose
# of `content/go/cheatsheet.toml`, quest by quest, and nothing else. The four
# choices are code, live in the English pack, and are never translated. Code
# blocks, identifiers and printed strings are copied verbatim.

pack   = "go.cheatsheet"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "go.cheatsheet.01.flush"
title = "FLUSH, NEBO NIC"
story = "06:30, Jardine's Bazaar. Kiosek celou noc tiskl do bufferu a nikdo neviděl ani řádek."
brief = '''
Výstup jde přes bufferovaný writer. Který řádek zajistí, že všechno zapsané
do `out` se opravdu objeví na obrazovce, až `main` skončí?

```
out := bufio.NewWriter(os.Stdout)
// ____
fmt.Fprintln(out, ans)
```
'''
hints = [
  "`bufio.Writer` drží bajty, dokud není vyprázdněn, a `defer` potřebuje volání i se závorkami.",
]

