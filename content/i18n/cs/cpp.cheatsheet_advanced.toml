[[quest]]
id    = "cpp.cheatsheet_advanced.13.move-ctor"
title = "VEZMI KLÍČE, NIC NENECH"
story = "Zastavárna na Yee Wo Street přebírá obsah skříňky; starý lístek musí zůstat ukazovat na nic, jinak se skříňka vyprázdní dvakrát."
brief = '''
```cpp
struct Buf {
  int* data; int n;
  explicit Buf(int n) : data(new int[n]), n(n) {}
  ~Buf() { delete[] data; }
  Buf(const Buf&) = delete;
  Buf& operator=(const Buf&) = delete;
  // the move constructor goes here
};
```

Přidej přesouvací konstruktor: `Buf b(std::move(a));` musí převzít pole
z `a` a vyprázdněné `a` musí být **bezpečné ke zničení**. `<utility>` je
vložen.
'''
hints = [
  "Parametr je rvalue reference a nemůže být `const`, když ho hodláš vyprázdnit. Jedna utilita uloží novou hodnotu a vrátí tu starou v jediném výrazu.",
]

