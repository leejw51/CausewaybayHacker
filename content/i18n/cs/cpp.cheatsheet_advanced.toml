id    = "cpp.cheatsheet_advanced.06.if-constexpr"
title = "JEN JEDNA VĚTEV"
story = "Mostní váha na molu tajfunového přístaviště bere počet beden nebo štítek — a odmítá zkompilovat větev, která pro to, co dostala, nedává smysl."
brief = '''
```cpp
