```

`Shape* s` ukazuje na nějaký tvar. Nastav `c` tak, aby na něj ukazoval
**jako na `Circle`**, když jím opravdu je, a jinak byl `nullptr`.
'''
hints = [
  "Jen jedno přetypování se objektu za běhu ptá, čím je; ostatní jen přeinterpretují ukazatel a nikdy nevrátí null.",
]

