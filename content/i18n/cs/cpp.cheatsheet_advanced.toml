# ---------------------------------------------------------------- 10
[[quest]]
id    = "cpp.cheatsheet_advanced.10.dynamic-cast"
title = "JE TO OPRAVDU KRUH"
story = "Výroba cedulí na Jaffe Road drží každou zakázku přes ukazatel na základní třídu a stroj na kulaté cedule smí dostat jen ty, které jsou opravdu kruhy."
brief = '''
```cpp
struct Shape { virtual double area() const = 0; virtual ~Shape() = default; };
