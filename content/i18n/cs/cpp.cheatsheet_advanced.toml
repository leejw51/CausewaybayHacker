```cpp
struct Acct { std::mutex m; int bal; };
void transfer(Acct& from, Acct& to, int amt) {
  // one line here
  from.bal -= amt; to.bal += amt;
}
```

Zamkni **oba** účty po zbytek funkce. Jedno vlákno volá ve smyčce
`transfer(a, b, 1)`, zatímco druhé volá `transfer(b, a, 1)`; program se
nikdy nesmí zaseknout v deadlocku.
'''
hints = [
  "Vzít oba zámky po sobě, v tom pořadí, v jakém přišly argumenty, je přesně způsob, jak na sebe dvě vlákna čekají navěky. Jeden strážce z C++17 bere libovolný počet mutexů a získá je bez deadlocku.",
