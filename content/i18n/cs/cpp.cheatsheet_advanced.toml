# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.cheatsheet_advanced.01.auto-params"
title = "LIBOVOLNÉ DVA"
story = "Směnárna na Hennessy Road sčítá jízdné v dolarech se spropitným v centech a nechce zvláštní funkci pro každou dvojici typů."
brief = '''
Definuj `add` **jednou** definicí tak, aby se `add(1, 2.5)` zkompilovalo a
vrátilo `3.5` a aby se zkompilovalo i `add(std::string("a"), "b")`. C++20.
'''
hints = [
  "Od C++20 dělá zástupný typ v seznamu parametrů z funkce šablonu sám o sobě — a každý zástupný typ je svůj vlastní typ.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "cpp.cheatsheet_advanced.02.constrained-member"
title = "MIMO TŘÍDU"
story = "Inventura v Sogu drží průběžný součet jen celých kusů — a člen, který ho hlásí, je definovaný v .cpp, mimo třídu."
brief = '''
```cpp
