# C++ LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the prose
# of `content/cpp/verybasic.toml`, quest by quest, and nothing else. Code
# blocks, identifiers, the quiz's four choices, sample input and output and
# the exact strings a program must print are the English pack's and are
# copied verbatim, never translated.

pack   = "cpp.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "cpp.verybasic.01.print"
title = "První slovo děla"
story = "12:00 u Poledního děla. Záznam o výstřelech má začínat jedním řádkem a ten řádek chybí."
brief = '''
Program musí vypsat přesně `hello, causewaybay` a konec řádku. V C++ je to
jeden příkaz poslaný do standardního výstupního proudu.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  (nothing)
output: hello, causewaybay
```
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — proud, řetězec, konec řádku, středník.",
  "Jednoduché uvozovky dělají znakovou konstantu; řetězec potřebuje dvojité.",
]

