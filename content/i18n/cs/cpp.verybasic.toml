story = "Čtyři vlákna přičítají k jednomu počítadlu ve strojovně čerpadel a zámek, který je má držet na střídačku, je po prvním průchodu držený navždy."
brief = '''
Čtyři vlákna každé stotisíckrát přičtou k `counter` jedničku. Každý průchod
smyčkou musí při přičítání držet mutex `mu` — a na konci průchodu ho
uvolnit. Zástupný řádek zamkne a nikdy neodemkne, takže druhý průchod čeká
navždy; lock guard uvolní, když vypadne z rozsahu platnosti.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  (nothing)
output: 400000
```
'''
hints = [
  "`std::lock_guard<std::mutex> lock(mu);` — zamkne hned, odemkne, když `lock` umře na `}`.",
  "`mu.lock()` samotné se nikdy nevrátí zpět; další průchod se zablokuje na mutexu, který tohle vlákno už drží.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "cpp.verybasic.27.binary-tree"
title = "Segfault"
story = "12:00 u Poledního děla. Tabulka výstřelů je vyhledávací strom a vložení, které má sestoupit pravou stranou, se zastaví u kořene."
brief = '''
`insert` vloží `v` do vyhledávacího stromu s kořenem `n`: prázdný případ je
napsaný a vytvoří nový uzel. Díra je ten jeden řádek, který pošle `v` na
správnou stranu — doleva, když je menší než `n->val`, jinak doprava —
a uloží, co rekurze vrátí. Průchod inorder pak vypíše vzestupně.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
hints = [
  "`if (v < n->val) n->left = insert(n->left, v); else n->right = insert(n->right, v);` — rekurzivně vejdi na jednu stranu a výsledek ulož.",
  "`n` je ukazatel: `->`, ne `.`; a menší jde doleva.",
]
