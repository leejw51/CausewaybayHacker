[[quest]]
id    = "cpp.verybasic.02.int-types"
title = "Číslo, které se do int nevejde"
story = "Záznam děla počítá granáty vystřelené od roku 1860 v setinách a registr, který ho držel, je široký 32 bitů."
brief = '''
Načti `a`. Program potřebuje `big`, 64bitové celé číslo držící `a` krát
jednu miliardu — hodnotu, kterou `int` neudrží, jakmile je `a` větší než 2.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  3
output: 3000000000
```
'''
hints = [
  "`long long big = a * 1000000000LL;` — přípona `LL` dělá 64bitovou i tu konstantu.",
  "`int` má 32 bitů: pět miliard se nevejde a výsledek je nesmysl.",
]

