[[quest]]
id    = "lua.cheatsheet_advanced.04.eq"
title = "STEJNÝ BOD, DVĚ TABULKY"
story = "Dva běžci označí totéž místo na Tai Hang Road ve dvou různých tabulkách a mapa je musí prohlásit za stejné."
brief = '''
`P` je třída (`P.__index = P`), jejíž instance mají číselná pole `x` a
`y`. `a` a `b` jsou dvě **různé** instance se stejnými poli. Napište řádek
s metametodou, díky kterému je `a == b` pravdivé.
'''
hints = [
  "Uvnitř metametody `a == b` na těch dvou tabulkách zavolá metametodu znovu; porovnejte pole, ne tabulky.",
]

