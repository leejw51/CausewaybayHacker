[[quest]]
id    = "lua.cheatsheet_advanced.03.lt-sort"
title = "SEŘADÍ SE SAMY"
story = "Bubenické týmy dostaly body; pořadatel je chce seřadit, aniž by pokaždé psal komparátor."
brief = '''
`Score` je třída (`Score.__index = Score`); každá instance má číselné
pole `v`. `scores` je jejich seznam. Napište řádek s metametodou, aby je
`table.sort(scores)` — **bez komparátoru** — seřadilo od nejmenšího `v`.
'''
hints = [
  "Bez komparátoru sort porovnává přes `<` a `<` na dvou tabulkách se ptá jejich metatabulky na jedno konkrétní pole.",
]

