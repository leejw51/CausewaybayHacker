[[quest]]
id    = "lua.cheatsheet_advanced.15.resume-value"
title = "CO BĚŽEC PŘINESE ZPÁTKY"
story = "Běžec podá číslo drakem nahoru a čeká, až se jedno vrátí dolů, než skončí."
brief = '''
```
local co = coroutine.create(function(a)
  local b = coroutine.yield(a * 2)
  return b + 1
end)
```

`co` bylo jednou spuštěno s `5`; to volání vrátilo `true, 10` a
`coroutine.status(co)` je teď `"suspended"`. Napište další řádek tak, aby
`ok, v` bylo `true, 8` a korutina skončila (`"dead"`).
'''
hints = [
  "Argumenty druhého resume se stanou výsledky čekajícího yieldu — přesně ty argumenty, nic navíc.",
]

