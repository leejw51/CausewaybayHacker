id    = "lua.cheatsheet_advanced.10.false-default"
title = "FALSE JE TAKÉ ODPOVĚĎ"
story = "Parta může cache schválně vypnout; tu noc, kdy se nastavení stejně četlo jako zapnuté, Mei zjistila proč."
