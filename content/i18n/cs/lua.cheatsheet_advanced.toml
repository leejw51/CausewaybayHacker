# LUA LAND — CHEATSHEET ADVANCED, in Czech. A translation pack (SPEC §12.1):
# the prose of `content/lua/cheatsheet_advanced.toml`, quest by quest, and
# nothing else. The question is the brief; the four choices are code, live in
# the English pack, and are never translated. Code blocks, identifiers and
# printed strings are copied verbatim.

pack   = "lua.cheatsheet_advanced"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.cheatsheet_advanced.01.class-index"
title = "TABULKA, KTERÁ ODPOVÍDÁ"
story = "21:00 na Wun Sha Street. Každý článek draka je tabulka a Mei chce mít metody na jednom místě."
brief = '''
`Dragon` je tabulka metod (`Dragon.length`, …) a její konstruktor už je
napsaný:

```
function Dragon.new(n)
  return setmetatable({n = n}, Dragon)
end
```

Napište ten jeden řádek, umístěný před konstruktor, díky kterému
`Dragon.new(3):length()` najde `Dragon.length`.
'''
hints = [
  "Metatabulka instance je `Dragon`; chybějící klíč se hledá tam, kam ukazuje vyhledávací pole té metatabulky — a to může ukazovat na samotnou třídu.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.cheatsheet_advanced.02.inherit"
title = "ČLÁNEK POD LUCERNOU"
story = "Lucerna je článek s plamenem navrchu; co neumí sama, udělá článek pod ní."
brief = '''
`Segment` je obyčejná tabulka funkcí (`Segment.burn`, …) bez vlastních
metatabulkových polí. `Lantern` je třída v obvyklém vzoru
(`Lantern.__index = Lantern`, instance vznikají přes `setmetatable({}, Lantern)`).
Napište ten jeden řádek, díky kterému lucerna propadne do `Segment` u každé
metody, kterou `Lantern` nedefinuje — a přitom si `Lantern` zachová vlastní metody.
'''
hints = [
  "Samotná třída potřebuje metatabulku; `Segment` nemá vyhledávací pole, takže tou metatabulkou tak, jak je, být nemůže.",
]

