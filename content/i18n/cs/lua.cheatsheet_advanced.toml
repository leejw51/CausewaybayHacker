[[quest]]
id    = "lua.cheatsheet_advanced.05.call"
title = "ZAVOLEJTE SAMOTNOU TŘÍDU"
story = "Mei chce, aby `Pad(5)` vypadalo jako konstruktor, tak jak to dělá LÖVE kód na jejím stole."
brief = '''
`Pad` je třída s `Pad.__index = Pad` a konstruktorem `Pad.new(n)`.
`mt` je tabulka už nastavená jako **vlastní** metatabulka `Pad`
(`setmetatable(Pad, mt)`). Napište řádek, díky kterému se `Pad(5)` chová jako
`Pad.new(5)`.
'''
hints = [
  "Volání `Pad` se dívá do metatabulky `Pad`, ne do `Pad` samotného — a obsluha dostane volanou tabulku jako první argument.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.cheatsheet_advanced.06.newindex-rawset"
title = "NEJDŘÍV ZAPSAT, PAK ULOŽIT"
story = "Každý nový záznam v knize vonných tyčinek se nejdřív zaloguje; kniha ho pak ale pořád musí držet."
brief = '''
`log` je seznam. `t` je prázdná tabulka, jejíž metatabulka má:

```
__newindex = function(t, k, v)
  log[#log + 1] = k
  -- ____
end
```

Doplňte mezeru tak, aby se hodnota opravdu uložila do `t` (pozdější `t[k]`
ji přečte zpět) — **aniž** by tato obsluha proběhla podruhé.
'''
hints = [
  "Ve chvíli, kdy obsluha běží, klíč stále chybí, takže obyčejné přiřazení spustí obsluhu znovu, do nekonečna; uložení musí jít mimo metatabulku.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.cheatsheet_advanced.07.rawget-default"
title = "BYLO TO VŮBEC ZAPSÁNO"
story = "Tabulka počtů odpoví nulou na jakékoli jméno; pořadatel chce vědět, která jména byla doopravdy zadána."
brief = '''
`counts` vzniklo jako

```
local counts = setmetatable({}, {__index = function() return 0 end})
```

takže každý chybějící klíč se čte jako `0`. Otevřete `if`, které platí jen
tehdy, když `k` bylo v `counts` **opravdu** uloženo — uložená `0` se počítá
jako uložená, nikdy nezapsaný klíč ne.
'''
hints = [
  "Běžné čtení prochází přes výchozí hodnotu; čtení, které metatabulku přeskočí, je globální funkce, ne metoda.",
]

