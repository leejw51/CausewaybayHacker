[[quest]]
id    = "lua.cheatsheet_advanced.08.len-trap"
title = "JAK DLOUHÝ JE ZÁSOBNÍK"
story = "Zásobníku náhradních tyčinek dal metametodu délky někdo, kdo četl manuál k 5.2."
brief = '''
`Stack` drží své hodnoty v `s.items` (seznam). Jeho metatabulka je soukromá
tabulka, která definuje `__len` vracející `#s.items`; žádná metoda `len`
