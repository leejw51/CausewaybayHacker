id    = "lua.advanced.06.async-queue"
title = "Kdo řekne, že je hotovo"
story = "Tři běžci vyřizují frontu lístků u lampionové brány ve Victoria Park a pořadatel čeká, až fronta řekne, že je prázdná. Nikdy to neřekne, protože jí nikdo neřekl, že je lístek hotový."
