  "Zarážka je nová tabulka, protože nil se do tabulky uložit nedá a protože tabulka se rovná jen sama sobě. I kdyby hodnoty mohly být tabulky, zarážka je pořád bezpečná: tuhle nikdo jiný mít nemůže.",
