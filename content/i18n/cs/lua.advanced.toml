Starter ji nikdy nevloží. `take` obnovuje kuchyni, dokud ve frontě něco není, a když je kuchyně mrtvá a fronta prázdná, vzdá to a vrátí `nil`; smyčka vypíše slovo `nil`, pak ho přičte k součtu a umře. V jazyce s blokujícími frontami by to bylo zaseknutí. V Lua je to `nil`, po kterém se šlo.

Zarážku vkládá producent. Nikdy konzument — strana, která ví, že proud skončil, je ta, která ho ukončí.
