[[quest]]
id    = "lua.advanced.15.collections"
title = "Správný kontejner"
story = "Stůl výboru drží noční lístky v jednom dlouhém seznamu a na každou otázku o nich odpovídá tak, že ho čte odshora."
brief = '''
Tři řádky standardního vstupu: řádek slov, řádek celých čísel už **seřazených vzestupně** a jedno celé číslo `x`.

Vypiš čtyři řádky:

1. `TOP <word> <count>` — nejčastější slovo, shody podle slova vzestupně
   — z tabulky počtů
2. `BISECT <l> <r>` — `bisect_left` a `bisect_right` pro `x` v seřazených
   celých číslech: kolik hodnot je pod `x` a kolik jich není nad ním
3. `SMALLEST3` a za ním tři nejmenší celá čísla — vytažená z **haldy**
   — nebo méně, pokud jich je méně
4. `GROUPS` a za ním `<letter>:<k>` pro každé první písmeno slov, písmena
   vzestupně — tabulka, jejíž `__index` **vytvoří seznam při prvním
   přístupu**, klíčovaná prvním písmenem

```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

Lua dodává jeden kontejner a každý jiný je tabulka plus disciplína. `TOP` ve starteru si nechá první slovo, které dosáhne nejvyššího počtu, což je `tofu`, v **pořadí vložení**, a zadání říká `egg`: seřaď slova a řekni, co myslíš. Jeho `BISECT` hledá index `x` a upadne, když `x` chybí; binární vyhledávání v seřazeném seznamu nikdy chybu nevyhodí a `left` a `right` se liší o to, kolik kopií `x` tam je. Jeho `SMALLEST3` seřadí celý seznam, aby z jeho začátku přečetl tři hodnoty, a právě tomu se halda snaží vyhnout, když je `k` malé a `n` ne. A jeho `GROUPS` prochází tabulku počtů v pořadí `pairs`, což není vůbec žádné pořadí.

`setmetatable({}, { __index = function(t, k) local v = {}; rawset(t, k, v); return v end })` je `defaultdict(list)` v Lua: první čtení chybějícího klíče vytvoří seznam a uloží ho, takže `groups[letter][#... + 1]` nikdy nepotřebuje kontrolu.
'''
hints = [
  "Místo words projdi sorted_keys(counts) a nejvyšší nahraď jen při striktně větším počtu; shoda pak připadne abecedně prvnímu, což je egg.",
  "bisect_left a bisect_right nikdy chybu nevyhodí; index_of ve starteru vrátí nil, když x chybí, a jeden ze skrytých případů je přesně tohle. Obě jsou tatáž smyčka s < vyměněným za <=.",
  "Halda je seznam, kde rodič i je floor(i / 2): push přidá na konec a vyplave nahoru, pop přesune poslední položku na vrchol a nechá ji klesnout. Tři popy jsou tři nejmenší, ať je n jakékoli.",
  "Metametoda __index běží jen pro chybějící klíč; rawset uvnitř uloží nový seznam, takže další čtení je obyčejný zásah. Před vypsáním seřaď klíče — tabulka s metatabulkou je pořád bez pořadí.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "lua.advanced.16.timeouts"
title = "Přestaň čekat"
story = "Pořadatelova tabule se ptá každého stánku v uličce na čekací dobu a stánek s nefunkční čtečkou karet nikdy neodpoví, takže se tabule nikdy nepřekreslí."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<STALL> <SECONDS>`, kde `SECONDS` je `0` pro stánek, který odpoví hned, a `1` pro ten, který neodpoví včas.

Čas je tu v **ticích**: desetina sekundy je jeden `coroutine.yield()` a `fetch(stall, seconds)` udělá deset yieldů za sekundu, než vrátí `<STALL> OK`. Pro každý stánek pusť jeho `fetch` jako korutinu pod `wait_for(task, 2)` — lhůta dva tiky, 0.2 sekundy — a vypiš `<STALL> OK` nebo `<STALL> TIMEOUT`, v pořadí vstupu. Pak spusť korutinu `watch()`, která běží donekonečna, dej jí jeden tah, zruš ji tím, že ji **obnovíš s `"cancel"`**, a nech ji vypsat `CANCELLED` z jejího handleru a `CLEANUP` z kódu, který běží na každé cestě. Nakonec vypiš `TIMEOUTS <k>`.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` obnoví úlohu nejvýš `ticks`krát a ohlásí, jestli skončila; pokud je po svém posledním tahu pořád `suspended`, je to timeout a úloha se prostě už nikdy neobnoví. Starter místo toho obnovuje `fetch` až do konce, takže `WONG` spotřebuje všech deset tiků a pak řekne `OK`.

Zrušit korutinu znamená doručit hodnotu do yield, na kterém je zaparkovaná. `watch` dělá yield uvnitř `pcall`, a když yield vrátí `"cancel"`, vyhodí chybu; `pcall` ji chytí — to je handler, který vypíše `CANCELLED` — pak proběhne úklidový řádek a pak se chyba vyhodí znovu, takže obnovení, které zrušení doručilo, dostane zpátky `false, "cancelled"`. Starter vytvoří hlídače, dá mu tah a zahodí ho: korutina, kterou už nikdo neobnoví, nespustí nic, nikdy, a ani jeden řádek se nevypíše. Po ošetření vyhoď znovu — spolknout zrušení je způsob, jak se úloha stane nezrušitelnou.
'''
hints = [
  "wait_for(task, 2): obnov nejvýš dvakrát, vrať true a výsledek, pokud je úloha mrtvá, jinak false. Úloha, které vypršel čas, se prostě už nikdy neobnoví.",
  "coroutine.resume(watcher, \"cancel\") — ten řetězec je to, co vrátí yield hlídače, a jeho vlastní kód z něj udělá chybu. Nastavit proměnnou na nil nic neruší; jen se na korutinu zapomene.",
  "První obnovení po create dá hlídači tah, aby začal a zaparkoval na yield, takže zrušení má yield, na který dopadne, a ne funkci, která ještě nezačala.",
]

# ---------------------------------------------------------------- 34
[[quest]]
id    = "lua.advanced.17.coroutine"
title = "Korutina"
story = "Wun Sha Street, drak v celé délce, jeden běžec s tyčinkami na každý článek. Jeden z nich nikdy nepředá slovo, celý drak se zastaví na jednom článku, zatímco bubny pořád hrají, a součty se vrátí jako vůbec nic."
brief = '''
Standardní vstup jsou dvě celá čísla `k` a `n`.

Rozděl `1..n` na `k` souvislých kusů — kus `i` je `floor(n*i/k) + 1` až `floor(n*(i+1)/k)` včetně — a dej každý kus vlastní **korutině**, která sečte druhé mocniny svého rozsahu: obyčejná smyčka, žádné knihovní volání, s yield každých 100 000 čísel, aby se dostalo i na ostatní. Každý běžec přičte svůj výsledek k **jednomu sdílenému součtu** v jednom úseku bez yield a zároveň ho zaznamená na své vlastní místo. Pouštěj je střídavě dokola, dokud nejsou všichni mrtví. Vypiš `CHUNK <i> <sum>` pro každý kus v pořadí indexů, pak `TOTAL <sum>`, pak `THREADS <k>` — jméno typu korutiny je `thread`, a to je ten počet.

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

Starter selže z důvodu, který s časováním nemá nic společného. `local part = coroutine.resume(co, lo, hi)` si nechá **první** výsledek `resume`, což je `true`, a odpověď, která následovala, spadne na zem; první řádek `CHUNK` je `attempt to concatenate local 'part' (a boolean value)`. To je ta malá chyba. Oprav ji tak, jak to udělal úkol se zásuvkou: sdílený součet aktualizovaný bez yield mezi čtením a zápisem, místo pro každý kus zapisované právě jedním běžcem a plánovač z úkolu se zámkem — každý běžec, který není mrtvý, dostane tah, dokud žádný nezbude.

Součty na velkém případu přesáhnou 2^53 a číslo v Lua je double: za tou hranicí `+` zaokrouhluje. Nes každý součet jako dva díly — dolní část pod 10^9 a horní část se zbytkem — a vypiš je jako `%d%09d`.

Ta velká věc je boss a není to chyba, kterou jde opravit. Spusť to s `k = 4` a `n = 4000000` a změř čas, pak to spusť s `k = 1`. Trvá to stejně dlouho. Pak smaž yield ze smyčky a spusť to znovu: stejný výstup, stejný čas a žádná chyba. Korutina drží slovo, dokud neřekne `yield`; běžec, který to nikdy neřekne, běží až do konce, zatímco ostatní tři čekají, a nic ti to neřekne, protože nic jiného slovo nepotřebovalo. To je drak zastavený na jednom článku, zatímco bubny pořád hrají. Čtyři korutiny na čtyřech jádrech sčítají druhé mocniny po řadě, na jednom jádře, plus cena přepínání. LuaJIT nemá vlákna. Korutina je místo, kde se dá zastavit, ne druhé jádro; běh je **po řadě**, na místech, kde každý běžec řekl, že se může zastavit. Paralelní práce je druhý proces — `io.popen` — nebo `love.thread` z klienta LÖVE, což je samostatný stav Lua, který nic nesdílí a mluví přes kanál.

Výstup je deterministický, protože kusy se vypisují podle indexu a součet je součet kusů, ne pořadí, v jakém běžci skončili. Vypiš `TOTAL` ze sdíleného součtu, ne sečtením míst — aktualizace bez yield je to, o čem tahle mapa je, a ty dva se musí shodovat.
'''
hints = [
  "resume vrací nejdřív ok a hodnoty až za ním. Lepší: dej práci index a místo, kam zapsat, a sdílený součet, do kterého přičítat, a nech plánovač obnovovat až do smrti; pak z resume nemusí vyjít vůbec nic.",
  "Obnov všechny, kolo za kolem, pak vypiš. Vypisování uvnitř běžců by se prokládalo; vypisování po smyčce, z míst, nemůže.",
  "Dva díly: lo pod 10^9 s přenosem přesunutým do hi při každém sčítání. 41666791666750000 je hi 41666791 a lo 666750000, vypsané jako %d%09d.",
  "n*(n+1)*(2n+1)/6 je uzavřený vzorec pro součet. Jednou proti němu zkontroluj TOTAL a víš, že hranice kusů sedí. Pak změř k=1 proti k=4 na velkém n: když se shodují, potkal jsi korutinu.",
]
