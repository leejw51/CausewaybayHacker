# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.advanced.01.conversions"
title = "Tři podoby, jedno jméno"
story = "Stánek s vonnými tyčinkami na Wun Sha Street drží cenu jako text, jako číslo a jako dolary, v jednom sešitě, pod jedním jménem."
brief = '''
Načti jeden řádek: částku v centech, jako číslice.

Vypiš tři řádky:

1. kolik znaků má oříznutý text
2. částku jako číslo
3. částku v dolarech s přesně dvěma desetinnými místy

```
input:  1234
output: 4
        1234
        12.34
```

Částka je nezáporná. Udělej to s **jedním jménem**, třikrát znovu navázaným — řetězec, pak číslo, pak zase řetězec. Lokální proměnná v Lua drží cokoli a při přiřazení si to rozmyslí; cena za to je, že nic ti neřekne, co `cents` zrovna teď je, kromě přečtení řádku nad tím.

Na dolary nechoď přes dělení. `1234 / 100` je dnes `12.34` a `0.1 + 0.2` je při vypsání `0.3`, ale při porovnání ne. `math.floor` a `%` ti dají obě poloviny přesně a `string.format("%02d", ...)` tu druhou doplní. `tonumber` je převod; `#cents` je délka řetězce, dokud je to ještě řetězec.
'''
hints = [
  "#cents, dokud je cents ještě řetězec, je první řádek.",
  "cents = tonumber(cents) není převod na místě; je to nová hodnota navázaná na staré jméno. Řetězec je po něm pryč.",
  "%02d uvnitř string.format je šířka dva, doplněno nulami, desítkově. 5 centů je 0.05, ne 0.5.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.advanced.02.control-flow"
title = "Která ulička"
story = "Čísla uliček jsou pro trasu draka napsaná křídou na silnici a pořadatelova tabule u Lin Fa Kung má říkat, co je ve které uličce. Říká pokaždé jen to číslo a začíná od nuly."
brief = '''
Načti jedno celé číslo `n`. Pro každé `i` od `1` do `n` vypiš jeden řádek:

* `FISHVEG`, pokud je `i` dělitelné 3 i 5
* `FISH`, pokud je `i` dělitelné 3
* `VEG`, pokud je `i` dělitelné 5
* jinak samotné `i`

Pak čti celá čísla, jedno na řádek, dokud nenačteš `0`, a vypiš `SKIPPED <k>`, kolik nenulových řádků jsi cestou přečetl.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

Dvě smyčky, dva druhy. První ví, kolikrát poběží, ještě než začne: `for i = 1, n do`. Druhá to neví: `while true do` s `break`, protože počet rozhodne to, co přečteš. Číselný `for` v Lua je **včetně** na obou koncích — `for i = 1, n` proběhne `n`krát — a starter začíná na `0`, což je ta chyba o jedničku, po které je tahle země pojmenovaná.
'''
hints = [
  "Případ „obojí“ testuj první, jinak se nikdy nespustí. Dělitelné 3 i 5 je dělitelné 15.",
  "for i = 0, n - 1 začne o jedno dřív a skončí o jedno dřív. Starter tu chybu má; první řádek jeho výstupu je FISHVEG, protože 0 je dělitelná čímkoli.",
  "while true do ... break je způsob, jak Lua píše smyčku, jejíž výstup je uprostřed. Je tu ještě repeat ... until, který testuje dole.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.advanced.03.lists"
title = "Prostředek draka"
story = "Šedesát sedm metrů slámy na ramenou řady nosičů a pořadatel u hlavy vidí prvního nosiče a posledního a nic mezi nimi."
brief = '''
Standardní vstup je počet `n` na prvním řádku a pak `n` celých čísel na druhém, oddělených mezerami. `n` je aspoň `1`, takže je vždy co vypsat jako první a poslední hodnotu.

Vypiš tři řádky: první hodnotu, poslední hodnotu a součet všeho striktně mezi nimi. Při méně než třech hodnotách je ten součet `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

Seznam v Lua je tabulka s klíči `1..n` a `#nums` je `n`. První prvek je `nums[1]`; poslední je `nums[#nums]`. Žádné `nums[-1]` není — záporný klíč je jen klíč, pod který nikdo nic neuložil, a jeho přečtení dá bez stížností `nil` — a žádný řez není: prostředek je smyčka od `2` do `#nums - 1`, která proběhne nulakrát, když žádný prostředek není, takže ochrana, kterou jiné jazyky potřebují, je tu zadarmo.

Starter vypisuje `nums[0]`. To v Lua není chyba. Je to `nil`, `print` napíše slovo `nil` a program skončí s 0. Tahle země je pojmenovaná právě po tom.
'''
hints = [
  "nums[#nums] je poslední prvek; nums[#nums - 1] je ten před ním. Nic záporného nefunguje.",
  "for i = 2, #nums - 1 je všechno kromě prvního a posledního a s jednou hodnotou je to for i = 2, 0, které samo proběhne nulakrát.",
  "io.read(\"*a\") přečte všechno najednou a gmatch(\"%S+\") projde tokeny, takže na koncích řádků přestane záležet. První token je počet; přeskoč ho.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.advanced.04.strings"
title = "Bajty nejsou písmena"
story = "Objednávkový formulář na lampiony u stánku ve Victoria Park usekne 銅鑼灣 po třech bajtech a vytiskne jeden znak a otazník."
brief = '''
Načti jeden řádek. Vypiš tři řádky:

1. jeho délku v **bajtech**, zakódovanou jako UTF-8
2. jeho délku ve **znacích**
3. řádek s obráceným pořadím znaků

```
input:  causeway
output: 8
        8
        yawesuac
```

Řádek může obsahovat znaky mimo ASCII a pak první dvě čísla nejsou stejná. Řetězec v Lua je posloupnost **bajtů** a nic jiného nezná: `#s` je počet bajtů a `s:reverse()` obrací bajty, což každý vícebajtový znak rozřízne napůl. Znaky jsou něco, co si definuješ sám. V UTF-8 je znak jeden úvodní bajt, za kterým následuje libovolný počet pokračovacích bajtů — `[^\128-\191][\128-\191]*` jako vzor — takže počet úvodních bajtů je počet znaků, a projít znaky přes `gmatch` a naskládat je je obrácení.

Starter vypíše počet bajtů dvakrát a řádek tak, jak přišel. Nesahej po `line:reverse()`, abys opravil třetí řádek: na `causeway` je to správně a na ukázce, kterou všichni doopravdy píšou, vypíše bajty, které nejsou řetězcem v žádném kódování.
'''
hints = [
  "#line jsou bajty. Znaky se musí spočítat: gsub vrací počet shod jako svůj druhý výsledek a shoda na každý znak je počet znaků.",
  "Pokračovací bajt je 128..191 (10xxxxxx). Znak je jeden bajt, který takový není, a za ním nula nebo více takových: \"[^\\128-\\191][\\128-\\191]*\".",
  "table.insert(reversed, 1, ch) přidá na začátek, takže poslední znak skončí první. table.concat spojuje bez oddělovače.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.advanced.05.dicts"
title = "Co ulička křičí"
story = "Wun Sha Street v devět: každý stánek něco vyvolává a tabule na konci u School Street chce pořadí."
brief = '''
Přečti celý standardní vstup a rozděl ho podle bílých znaků.

Vypiš každé různé slovo jednou, jako `<word> <count>`, seřazené podle počtu sestupně a shody rozhodne slovo vzestupně.

```
input:  tram tram bus
output: tram 2
        bus 1
```

Tabulka klíčovaná slovem je počítadlo a `counts[word] + 1` je napoprvé chyba — `attempt to perform arithmetic on a nil value` — protože klíč, který nikdo nezapsal, je `nil`. `(counts[word] or 0) + 1` dodá tu nulu.

`pairs` prochází klíče v **žádném pořadí** a to pořadí se mění běh od běhu. Zkopíruj klíče do seznamu, seřaď ho přes `table.sort` s komparátorem, který říká počet sestupně a pak slovo vzestupně, a vypisuj ze seznamu. Komparátor vrací `true`, když jeho první argument jde první.
'''
hints = [
  "Starter umře na prvním slově: counts[word] + 1 čte dřív, než zapíše, a není co číst. (counts[word] or 0) dodá nulu.",
  "Posbírej klíče přes pairs do seznamu, pak na seznam dej table.sort. Samotná tabulka žádné pořadí, které by šlo opravit, nemá.",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — počet sestupně, pak slovo vzestupně, a nikdy true pro stejné argumenty.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.advanced.06.sets"
title = "Co mají oba stánky"
story = "Dva stánky s lampiony, jeden na každé straně Ormsby Street, a zákaznice, která chce vědět, co může dostat u kteréhokoli z nich, aniž by dvakrát přešla trasu draka."
brief = '''
Dva řádky standardního vstupu, každý je zboží jednoho stánku oddělené mezerami. Stánek může uvést tutéž věc dvakrát; počítá se jednou.

Vypiš tři řádky:

1. `BOTH` a za ním všechno, co je na obou seznamech, seřazené, oddělené mezerou — nebo
   `BOTH -`, když nic takového není
2. `ONLY_A <k>`: kolik věcí je na prvním seznamu a ne na druhém
3. `ALL <k>`: kolik různých věcí je na kterémkoli seznamu

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua nemá typ množiny. Množina je tabulka, jejíž **klíče** jsou prvky a hodnoty jsou `true`: zapsat `tofu` dvakrát znamená dvakrát zapsat tentýž klíč a duplikát zmizí už cestou dovnitř. Členství je `a[x]`, což je `true` nebo `nil`. Průnik, rozdíl a sjednocení jsou tři smyčky přes klíče jedné množiny, které se ptají té druhé — napiš je jako funkce a ty tři řádky jsou tři volání.

`#` klíče množiny nepočítá; počítá seznamovou část, která je prázdná. Počítej smyčkou přes `pairs` a před vypsáním seřaď prvky do seznamu, protože `pairs` žádné pořadí nemá.
'''
hints = [
  "set[word] = true pro každý token sestaví množinu; duplicitní tofu je tentýž klíč zapsaný dvakrát.",
  "Průnik je smyčka přes pairs(a), která nechá klíče, kde je b[key] true. Rozdíl nechá klíče, kde je nil. Sjednocení zapíše klíče obou množin do jedné tabulky.",
  "#set je 0 pro tabulku jen s řetězcovými klíči. Zkopíruj klíče přes pairs do seznamu, seřaď ho přes table.sort a #list je počet a table.concat(list, \" \") je řádek.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.advanced.07.functions"
title = "Za catty"
story = "Každá cenovka na Wun Sha Street je za catty, pokud neříká jinak, a tiskárna cenovek u stánku s tyčinkami trvá na tom, aby jí to někdo řekl pokaždé."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<NAME> <CENTS>` nebo `<NAME> <CENTS> <UNIT>`.

Napiš `tag(name, cents, unit)`, která vrací `<NAME> $<dollars>/<unit>` se dvěma desetinnými místy, kde chybějící `unit` znamená `catty`, a vypiš jednu cenovku na řádek.

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua nemá výchozí argumenty. Parametr, který volající vynechal, je `nil` a `tag` ve starteru ho spojuje do řetězce: `attempt to concatenate local 'unit' (a nil value)`. Idiom je první řádek funkce — `unit = unit or "catty"` — protože `or` vrátí svou levou stranu, pokud to není `nil` nebo `false`. To je celý mechanismus výchozích argumentů v Lua a patří ke smlouvě funkce stejně, jako by k ní patřil řádek `def`.

Rozděl řádek na seznam tokenů a předej kusy přes `tag(unpack(parts))`, až převedeš centy. `unpack` rozloží seznam do argumentů, takže dvouprvkový i tříprvkový seznam se vejdou do jedné signatury.
'''
hints = [
  "unit = unit or \"catty\" jako první řádek tag. To je celá oprava.",
  "`x or default` je výchozí argument v Lua. Selže pro jednu hodnotu: když volající schválně předá false, or ho taky nahradí, a to je navazující otázka.",
  "tag(unpack(parts)) rozloží seznam; se dvěma částmi je třetí parametr nil a or ho doplní.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.advanced.08.exceptions"
title = "Řádek, který není číslo"
story = "Váha u stánku s pomely tiskne sloupec vah a uprostřed je něčí telefonní číslo."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků. Každý řádek má být celé číslo.

Pro každý řádek vypiš buď dvojnásobek hodnoty, nebo `BAD <line>`, pokud se nedá převést. Nakonec vypiš `SUM <total>`, kde total je součet hodnot, které jsi vypsal.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")` je potichu `nil`; `tonumber("1.5")` je `1.5`, což není celé číslo; a `double` ve starteru pro obojí vyhodí chybu přes `error`. `error` je způsob, jak funkce v Lua odmítne — žádný `Result` ani `(value, ok)` od samotné funkce není — a volající, který čekal číslo, musí říct, co s tím udělá, přes `pcall`: ten za tebe funkci zavolá a vrátí `true, result` nebo `false, message`, místo aby nechal chybu stoupat.

Drž `pcall` kolem toho jednoho volání, které může selhat. Obalit celé tělo smyčky by spolklo i překlep ve tvém vlastním `print`, a tak se programy učí selhávat potichu.
'''
hints = [
  "Starter umře na xx s main.lua:3: not an integer: xx. Tu zprávu ti pcall předá jako svůj druhý výsledek, místo aby spadl.",
  "local ok, value = pcall(double, line) — pcall bere funkci a její argumenty zvlášť; pcall(double(line)) by nejdřív zavolalo double a spadlo, ještě než by pcall vůbec běžel.",
  "Když je ok false, value je zpráva. Vypiš BAD a pokračuj; špatný řádek k součtu nic nepřidá.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.advanced.09.comprehensions"
title = "Jedním průchodem po Wun Sha Street"
story = "Alex říká, že to jde třemi smyčkami for. Ulička je široká na jednoho draka a tyčinky hoří; máš jeden průchod."
brief = '''
Standardní vstup je jeden řádek celých čísel oddělených mezerami.

Vypiš tři řádky:

1. součet sudých hodnot (`0`, pokud žádné nejsou)
2. každou hodnotu větší než `10`, zdvojenou, v pořadí, spojené jednou mezerou —
   nebo `-`, pokud žádné nejsou
3. kolik je různých hodnot

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua nemá komprehenze; nejblíž je funkce, která sestaví tabulku z tabulky, a právě to tenhle uzel učí. Napiš `filter(list, keep)` a `map(list, f)` jednou — každá je smyčka, která plní novou tabulku — a z těch tří řádků se stanou volání: `sum(filter(nums, even))`, `map(filter(nums, big), double)` a množina sestavená z hodnot, spočítaná. Predikát a transformace jsou funkce předané jako argumenty, a to je přesně to `if` a ten výraz v komprehenzi.

`table.concat` bere čísla stejně jako řetězce, takže druhý řádek převod nepotřebuje; potřebuje ale `-`, když je seznam prázdný, protože `table.concat({}, " ")` je prázdný řetězec.
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end) nechá sudé; jejich součet je první řádek.",
  "map(filter(nums, big), double) — nejdřív filtruj, pak transformuj, stejně jako if vzadu a výraz vpředu v komprehenzi.",
  "Množina je tabulka klíčovaná hodnotami; #set klíče nepočítá, smyčka přes pairs ano.",
]

# ---------------------------------------------------------------- 10
[[quest]]
id    = "lua.advanced.10.dict-comprehensions"
title = "Tentýž průchod, s klíči"
story = "Ceny u stánku s tyčinkami jsou na útržcích červeného papíru v pořadí, v jakém se psaly. Teta je chce jako jednu tabuli a chce ji dvakrát."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<ITEM> <PRICE>`. `PRICE` je celý počet centů. Každá položka se objeví nejvýš jednou a `n` je aspoň `1` — vždycky je nějaká nejlevnější položka, kterou lze jmenovat.

Vypiš tři řádky:

1. každou položku s cenou **striktně nad 100** jako `ITEM=PRICE`, seřazené podle položky,
   spojené jednou mezerou — nebo `-`, pokud žádné nejsou
2. každou položku s cenou **napůl celočíselným dělením**, ve stejném formátu,
   seřazené podle položky
3. `CHEAPEST <item>` — nejnižší cena, shody rozhodne položka vzestupně

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

Klíčovaná verze minulého uzlu. Lua nemá slovníkové komprehenze; nejblíž je `filter_pairs(t, keep)` a `map_values(t, f)`, každá je smyčka přes `pairs`, která plní novou tabulku týmiž klíči. První řádek nechá dvojice, kde je hodnota nad 100; druhý přetvoří každou hodnotu přes `math.floor(v / 2)` a nechá každý klíč. Ani jedno není komprehenze a obojí je jedna funkce, napsaná jednou.

`pairs` nemá žádné pořadí, takže `sorted_keys(t)` — klíče v seznamu, seřazené — je třetí pomocník a každý vypsaný řádek jde přes něj. Pro nejlevnější projdi seřazené klíče a nech si první striktně nižší cenu: protože klíče přicházejí abecedně, první ze stejných cen je rozhodnutí shody.
'''
hints = [
  "filter_pairs nechá klíč, když je keep(key, value) true; map_values zapíše f(value) pod každý klíč. Obě plní novou tabulku — nikdy nezapisuj do té, kterou procházíš.",
  "sorted_keys(t) je jediný způsob, jak vypsat klíčovanou tabulku v pevném pořadí. Každý řádek tady jde přes něj, včetně nejlevnější.",
  "Projdi seřazené klíče a nejlepší nahraď jen při striktně nižší ceně: první ze stejných cen je abecedně první, takže se shoda rozhodne sama.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.advanced.11.sorting"
title = "Tabule s pořadím"
story = "Dračí výbor každý večer vyvěsí nejlevnější tyčinky a úředník u Lin Fa Kung řadí stánky ručně, se dvěma seznamy a tužkou."
brief = '''
Dva řádky standardního vstupu: jména stánků na prvním, jejich ceny v centech na druhém, ve stejném pořadí. Aspoň jeden stánek tam je.

Vypiš stánky seřazené od nejlevnějšího jako `<rank>. <NAME> <cents>`, s pořadím od `1` a shody rozhodne jméno vzestupně. Pak vypiš `CHEAPEST <NAME>`.

```
input:  LAM WONG CHAN
        1200 900 1200
output: 1. WONG 900
        2. CHAN 1200
        3. LAM 1200
        CHEAPEST WONG
