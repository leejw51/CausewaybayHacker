```

`n` je nejvýš `400`, což pro zásobník LuaJIT nic není. Bez cache je `fib(35)` asi třicet milionů volání a `fib(90)` nedoběhne. S ní se každé `fib(i)` spustí jednou a `MISSES` je `n + 1`. `memoize` je obal z úkolu Zabalené s cache v uzávěru: volatelná tabulka, takže `fib.misses` je pole, a `fib = memoize(function ... end)`, aby i rekurze uvnitř šla přes cache. `fib` ve starteru je obyčejná funkce a jeho poslední řádek umře na `fib.misses`.

`fib(90)` a `20!` jsou za 2^53 a číslo v Lua je double: za tou hranicí se číslice potichu ztrácejí. Starter nese `big`, číslo jako seznam dílů se základem 10^7, s `add`, `mul_small` a `tostring`; `fib` sčítá bigy a součin jeden násobí malým číslem. `partial` zmrazí několik úvodních argumentů funkce a dá ti novou; `reduce` složí dvouargumentovou funkci přes iterátor. Ani jedno není chytré. Na obojí se ptají.
