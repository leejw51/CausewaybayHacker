[[quest]]
id    = "lua.advanced.13.exceptions"
title = "Vlastní chyba"
story = "Čtyři vrstvy cenotvorby u pultu s rýží vyhazují každá něco svého a přední část pultu jednu z nich chytí a ty ostatní ji položí."
brief = '''
Standardní vstup je počet `n`, pak `n` řádků, každý má být váha v kg.

Definuj hierarchii chyb z **tabulek**: `PriceError` jako základ, s `NotANumber` a `Negative` vyrobenými z něj přes `class(PriceError)`. `Negative` nese váhu a jeho zpráva je `negative weight: <kg>`; zpráva `NotANumber` je `not a number`. `price(text)` převede text, vyhodí `NotANumber` se selháním převodu uloženým jako jeho `cause`, odmítne zápornou váhu a jinak vrátí `500 + 100 * kg`.

Vypiš každou cenu nebo zprávu chyby, pak `ERRORS <k>`. Chytej **základní třídu**, jednou, přes `is_a`.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative weight: -2
        ERRORS 2
```

`error` vyhodí jakoukoli hodnotu a tabulka je ta, která umí nést zprávu, příčinu a třídu. Třída je její metatabulka; `is_a(err, cls)` od ní prochází odkazy `parent` nahoru a jediné `if is_a(err, PriceError)` chytí každého člena hierarchie. Starter chytá `Negative` a nic jiného, takže řádek `xx` položí program nechycenou tabulkou: `(error object is not a string)`.

`print(err)` vypíše `tostring(err)` a `tostring` hledá `__tostring` **přímo v metatabulce** — metametody se přes řetězy `__index` nenacházejí — takže `class` ji musí dát na každou třídu, kterou vyrobí. `cause` je řetězec, který `pcall` vrátil z nepovedeného převodu; nic tady ho nevypisuje a debugger by ukázal obojí, jedno nad druhým. Ten řetěz je důvod si ho nechat.
