[[quest]]
id    = "lua.advanced.05.asyncio"
title = "Kde async doopravdy běží"
story = "Mei píše asynchronní kód čtyři roky a ještě ani jednou neviděla, co ho pohání. Dnes večer je ta smyčka cyklus while, který umí přečíst, a každý běžec v uličce se na ní střídá."
brief = '''
Standardní vstup je počet `n` a pak `n` celých čísel.

Napiš `double(value)` tak, aby jednou předala řízení plánovači — `coroutine.yield()` — a vrátila hodnotu zdvojenou. Udělej jednu korutinu na každou hodnotu, pusť je všechny přes `gather`, vypiš každý výsledek v pořadí vstupu, pak `SUM <total>` a `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)` nespustí `f`. Sestaví **objekt korutiny** a vrátí ho a uvnitř se nic nestane, dokud ho něco neobnoví. `run` ve starteru jich vrátí tři, neobnovené, a výstup jsou tři řádky `thread: 0x...` a za nimi `attempt to perform arithmetic on a thread value`.

`gather` je smyčka událostí a tady ji napíšeš ty: `while` přes úlohy, který obnoví každou, která není mrtvá, popořadě, kolo za kolem, dokud žádná nezbude, a návratovou hodnotu **každé úlohy** si nechá na místě té úlohy. Výsledky vyjdou v pořadí, v jakém jsi úlohy předal, ať skončily v jakémkoli pořadí. To je celý důvod sáhnout po ní místo smyčky, která jednu úlohu obnovuje až do smrti, než se dotkne další: ta smyčka by byla správná a sekvenční, `gather` je správný a prokládaný.

Je tu přesně jedno vlákno. `coroutine.yield()` je místo, kde úloha vrátí vlákno smyčce, aby ho mohla použít jiná. Nic neběží paralelně; věci běží **po řadě**, na místech, kde řekly, že se můžou zastavit.
'''
hints = [
  "return gather(tasks) místo return tasks — a gather je smyčka, kterou napíšeš: obnovuj každou úlohu, která není mrtvá, znovu a znovu, dokud žádná nezbude.",
  "Obnovení, po kterém je úloha mrtvá, je to, jehož druhá návratová hodnota je návratová hodnota úlohy. Ulož ji na vlastní index úlohy; to drží výsledky v pořadí vstupu.",
  "Kdybys potřeboval výsledky tak, jak končí, to je pool z minulého úkolu, a pak si index neseš sám.",
]

