# ---------------------------------------------------------------- 31
[[quest]]
id    = "lua.advanced.14.iterator"
title = "Další, dokud to nezastaví"
story = "Automat na lístky u lampionové brány ve Victoria Park vydává čísla od začátku v pevných krocích a žádný jejich seznam si nevede, a tabule fronty přes něj chce smyčkovat jako přes jakýkoli seznam."
brief = '''
Standardní vstup jsou tři celá čísla: `start`, `step`, `count`.

Napiš třídu `Tickets`, která implementuje **iterátorový protokol ručně**: `next` vrátí další hodnotu, nebo `nil`, když už bylo vydáno `count` hodnot, a `iter` vrátí to, co potřebuje obecný `for`. Vypiš každou hodnotu na vlastní řádek, pak `SUM <total>`, spočítaný předáním druhého `Tickets` funkci `sum`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

Tohle za tebe píše `coroutine.wrap`. Obecný `for` bere tři věci — funkci `f`, stav `s` a řídicí hodnotu — a před každým kolem zavolá `f(s, control)` a zastaví se, když je první výsledek `nil`. `Tickets.next` už má ten tvar: jeho `self` je stav a jeho druhý parametr je řídicí hodnota, kterou může ignorovat. Takže `iter` je jeden řádek: `return Tickets.next, self`. `sum`, `collect` i `for` tančí stejný tanec a žádnému z nich nezáleží na tom, co je stav.

Starter má `next` a žádné `iter` a `for` říká `attempt to call method 'iter' (a nil value)`. `nil` z `next` je tady `StopIteration`; proto lístek nikdy nemůže být `nil` a proto je `0` úplně v pořádku lístek — `0` není `nil`.

`iter`, které vrací `self` jako stav, je znak **iterátoru**: dá se projít jednou a pak je vyčerpaný. **Kontejner** vrací z `iter` pokaždé nový stav a dá se procházet opakovaně; `Bag` z dřívější části téhle cesty byl kontejner. Řekni, co píšeš; rozdíl se ukáže, až bude někdo smyčkovat podruhé.
'''
hints = [
  "function Tickets:iter() return Tickets.next, self end. Dvě hodnoty a for začne fungovat.",
  "nil se vrací, ne vyhazuje. Smyčka for se na něm zastaví; nikdy ho neuvidíš. Než se posuneš, ulož hodnotu, kterou se chystáš vrátit, jinak jsi o krok vedle.",
  "for value in obj:iter() je for value in Tickets.next, obj — volání metody jen vyrobí tu dvojici. Vrátit uzávěr nad self by fungovalo taky; dvojice je protokol bez funkce navíc.",
]

