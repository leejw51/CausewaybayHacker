brief = '''
Standardní vstup je počet `n`, pak `n` řádků `<NAME> <CENTS>`.

Z každého řádku sestav **zmrazený** záznam `Price.new(name, cents)`. Pak pro každou cenu zkus přepsat její `cents` a vypiš `FROZEN <NAME>`, když pokus vyhodí chybu. Dál třída `Tally` s jedním deklarovaným slotem, `count`: nastav `tally.count`, pak zkus nastavit překlepnuté `tally.cuont` a vypiš `SLOTS YES`, když chybu vyhodí *tohle*. Nakonec `IN_SET <k>`, velikost množiny cen klíčované **hodnotou**, a `TOTAL <sum>`.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

Tabulka v Lua je zapisovatelná, vždycky; zmrazit ji je trik s metatabulkou. Drž pole v tabulce, kterou volající nikdy neuvidí, a vrať **prázdnou proxy**, jejíž `__index` jsou ta pole — každé čtení propadne — a jejíž `__newindex` vyhodí chybu: každý zápis do klíče, který proxy nemá, jde tam, a proxy nemá žádný. `pcall` kolem přiřazení je způsob, jak pokus udělat a neumřít.

Množina je druhá polovina. Tabulky jsou klíči **podle identity**: dva záznamy se stejnými poli jsou dva klíče a `IN_SET` ve starteru říká `3`. Zmrazený záznam může zastupovat svou hodnotu, jen když se klíč udělá z polí — `price:key()` — a to je bezpečné právě proto, že se pole pod ním nemůžou změnit.

Slot třídy `Tally` je zase `__newindex`, který povolí jen deklarovaná jména: `rawset` pro `count`, chyba pro cokoli jiného. Překlep ve jménu atributu se stane chybou při přiřazení místo tichého nového pole, které nikdo nečte.
'''
hints = [
  "Price.new vrátí prázdnou tabulku, jejíž metatabulka má __index = pole a __newindex, který vyhodí chybu. Čtení propadne; zápisy nemají kam dopadnout, jen do metametody.",
  "Klíčuj množinu přes price:key(), řetězec sestavený z polí. Samotná tabulka je klíčem jen sama sobě.",
  "TOTAL je součet původních centů, což platí jen proto, že přiřazení selhala. Ve starteru je v tu chvíli každá cena 0 a TOTAL je 0 — mutace nebyla jen povolená, ona proběhla.",
]

