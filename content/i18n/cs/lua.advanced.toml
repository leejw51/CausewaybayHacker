`join` se vrátí, když je počet čekajících `0`, a snižuje ho jen `task_done`. Konzumenti ve starteru ho nikdy nezavolají, takže každá práce je vyřízená a počet pořád říká `4`, každý konzument stojí v `get` nad prázdnou frontou a nezbylo nic, co by mohlo cokoli změnit. Smyčka bez detektoru by se tam točila, dokud by běhové prostředí program nezabilo. Tahle to pozná: celé kolo, ve kterém žádný konzument počet nesnížil, je deadlock, a `join` to řekne přes `error`. Stejné zaseknutí jako v úkolu s okénkem, jinak napsané — a oprava je zase jeden řádek, na straně konzumenta.

