Standardní knihovna Lua nemá haldu, takže starter nese malou třídu `MinHeap`: `push` přidá hodnotu a probublá ji nahoru, `pop` vezme nejmenší. Každé `x` musí jít dovnitř vlastní metodou haldy, zavolanou s dvojtečkou, aby halda předala sama sebe, a `pop` pak vracelo nejmenší jako první. Zápis přímo do `items` probublání přeskočí a rozbije pořadí.

