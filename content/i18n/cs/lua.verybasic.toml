`xs` drží celá čísla z řádku. Program musí vypsat, kolik je RŮZNÝCH hodnot. Lua nemá množinu: tabulka, jejíž KLÍČE jsou ty hodnoty, je to nejbližší — klíč uložený dvakrát je jeden klíč — a počítací smyčka už klíče prochází přes `pairs`, protože `#` počítá jen pozice od 1. Každé `x` se musí označit v `seen` jako klíč.

