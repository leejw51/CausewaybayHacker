# ---------------------------------------------------------------- 14
[[quest]]
id    = "lua.verybasic.14.maps"
title = "Sešit s tyčinkami"
story = "Jeden sešit na ulici, jeden řádek na každou věc, kterou posádka spálí, a vedle každé počet; když se věc objeví poprvé, není k čemu přičítat."
brief = '''
`counts` je tabulka klíčovaná slovem. Pro každé slovo `w` musí program přičíst jedničku k jeho počtu, poprvé od nuly. Chybějící klíč se čte jako `nil` a k `nil` se přičítat nedá; `or` dodá výchozí hodnotu a váže volněji než `+`, takže výchozí hodnota potřebuje vlastní závorky.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  siu mai har gau siu mai
output: gau 1
        har 1
        mai 2
        siu 2
```
'''
hints = [
  "counts[w] = (counts[w] or 0) + 1 — závorky zajistí, že výchozí hodnota přijde před sčítáním.",
  "Bez nich je counts[w] or 0 + 1 totéž co counts[w] or 1: první výskyt je 1 a každý další zůstane 1. counts[w] + 1 na chybějícím klíči je aritmetika s nil.",
]

