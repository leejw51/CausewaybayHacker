[[quest]]
id    = "lua.verybasic.10.enums"
title = "Barva linky"
story = "Mapa MTR u východu Tin Hau jmenuje tři linky; posádka má slovo a potřebuje konstantu, kterou znamená."
brief = '''
`word` je jedno z `island`, `tsuenwan`, `kwuntong`. Lua nemá enum: `Line` je tabulka pojmenovaných čísel, to nejbližší, a `COLOUR` je klíčovaný těmi čísly. Program musí převést `word` na odpovídající člen `Line`. Tabulka se indexuje klíčem a klíče jsou tady velkými písmeny; tabulka se volat nedá a `Line.word` hledá klíč, který se píše `word`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  tsuenwan
output: red
```
'''
hints = [
  "local line = Line[word:upper()] — hranaté závorky hledají klíč podle jména a jména jsou velkými písmeny.",
  "Line[word] se slovem malými písmeny nenajde žádný klíč, dá nil a COLOUR[nil] je taky nil: tabule vypíše nil.",
]

# ---------------------------------------------------------------- 11
[[quest]]
id    = "lua.verybasic.11.vector"
title = "Seznam článků"
story = "Každý článek, který sjede z náklaďáku na Tai Hang Road, jde na seznam v pořadí, v jakém přišel, a seznam zůstává prázdný."
brief = '''
`xs` začíná jako prázdná tabulka a seznam v Lua je tabulka s klíči 1, 2, 3, ... Každé celé číslo `x` přečtené ve smyčce se musí přidat na konec, v pořadí ze vstupu. Knihovna `table` na to má funkci; se dvěma argumenty přidává na konec, se třemi je prostřední pozice.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
hints = [
  "table.insert(xs, x) — nejdřív tabulka, jedna hodnota, na konec.",
  "xs[#xs] = x zapisuje na index 0, dokud je tabulka prázdná, a #xs zůstane 0; pozice 1 dá každé číslo dopředu a obrátí pořadí.",
]

# ---------------------------------------------------------------- 12
[[quest]]
id    = "lua.verybasic.12.vector-edit"
title = "Hlava jde pryč"
story = "První článek na seznamu je hlava a hlava se nese na vlastní tyči; musí ze seznamu pryč a všechno za ní se posune o jedno dopředu."
brief = '''
`xs` drží celá čísla z řádku, od indexu 1. Program musí odebrat prvek na indexu 1, aby se zbytek posunul dolů. `table.remove` bere pozici a posune, co následuje; nastavit pozici na `nil` nechá díru, ne kratší seznam.

