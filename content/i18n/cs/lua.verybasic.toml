[[quest]]
id    = "lua.verybasic.15.hashtable"
title = "Vyhledání"
story = "Tabulka stánků na lampionovém jarmarku mapuje jméno na číslo a dotaz na stánek, který tam není, má říct -1, ne vymazat tabuli."
brief = '''
`stalls` mapuje jména na čísla stánků. Pro slovo `w` musí program vypsat jeho číslo, nebo `-1`, když `w` v tabulce není. Chybějící klíč je `nil`, ne chyba, a `or` udělá z `nil` výchozí hodnotu.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  2
        tofu 3
        fish 7
        egg
output: -1
```
'''
hints = [
  "print(stalls[w] or -1) — pravá strana or je výchozí hodnota.",
  "Samotné stalls[w] vypíše pro chybějící jméno nil; stalls.w hledá stánek, který se doslova jmenuje w.",
]

