```
input:  3 1 4 1
output: 1 4 1
```
'''
hints = [
  "table.remove(xs, 1) — pozice je druhý argument.",
  "table.remove(xs) bez pozice vezme POSLEDNÍ; xs[1] = nil nechá v seznamu nil a table.concat ho odmítne.",
]

