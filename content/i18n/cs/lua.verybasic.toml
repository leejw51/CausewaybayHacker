[[quest]]
id    = "lua.verybasic.22.reverse"
title = "Pozpátku"
story = "Jméno draka je na ocasním praporu namalované pozpátku, aby se z druhé strany četlo správně, a program ho chce právě tak."
brief = '''
`s` je jeden řádek textu. Program ho musí vypsat obráceně. Řetězcová knihovna má metodu přesně na to, volanou s dvojtečkou; `sub` vyřízne kus a neotočí ho.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  kwan lee
output: eel nawk
```
'''
hints = [
  "print(s:reverse()) — celé jméno metody, s dvojtečkou.",
  "s:sub(-1, 1) žádá kus od posledního znaku po první, a ten je u čehokoli delšího než jedno písmeno prázdný.",
]

# ---------------------------------------------------------------- 23
[[quest]]
id    = "lua.verybasic.23.closures"
title = "Přirážka"
story = "Stánek s lampiony přidává ke každé velkoobchodní ceně stejnou přirážku a funkce, která si ji má pamatovat, ji zapomene."
brief = '''
`make_adder(k)` definuje vnitřní funkci `add`, která vrací `x + k`. Musí vrátit přímo tu vnitřní funkci — funkce je hodnota jako každá jiná — aby šlo `add(x)` zavolat později a `k` zůstalo zapamatované.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  5
        1 2 3
output: 6 7 8
```
'''
hints = [
  "return add — holé jméno, bez závorek.",
  "add() ji zavolá bez x a přičítá nil; vrátit k znamená vrátit číslo a číslo se volat nedá.",
]

# ---------------------------------------------------------------- 24
[[quest]]
id    = "lua.verybasic.24.lambdas"
title = "Sudé mocniny"
story = "Sudé články platí druhou mocninu svého čísla a liché neplatí nic; účetní kniha v kůlně chce jeden součet."
brief = '''
`xs` drží celá čísla z řádku. Lua nemá vestavěné `map` ani `filter`, takže starter nese `map(f, xs)`, `filter(f, xs)` a `sum(xs)`. `total` musí být součet druhých mocnin SUDÝCH hodnot, sestavený z těch tří a dvou anonymních funkcí — `function(x) ... end` je lambda v Lua.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  1 2 3 4 5 6
output: 56
```
'''
hints = [
  "local total = sum(map(function(x) return x * x end, filter(function(x) return x % 2 == 0 end, xs)))",
  "filter nechá to, pro co jeho funkce vrátí true; map přetváří. Holé x * x mimo funkci je globální x, nil, vynásobené.",
]

# ---------------------------------------------------------------- 25
[[quest]]
id    = "lua.verybasic.25.threads"
title = "Všechny články najednou"
story = "Běžec každého článku umocňuje svůj počet na vlastní korutině a součet se vypíše dřív, než se kterýkoli z nich dostal za první yield."
brief = '''
Vlákna tu nejsou: korutina je to nejbližší, funkce, která běží, jen dokud je obnovená, a řízení vrací přes `yield`. Každý worker ve `workers` byl spuštěný — jednou obnovený, až po první yield — a žádný nezapsal svůj výsledek. Než se výsledky vypíšou, hlavní program musí každou `co` doběhnout do konce. Jedna funkce knihovny `coroutine` pokračuje v korutině tam, kde udělala yield.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  1 2 3
output: 1 4 9
        14
```
'''
hints = [
  "coroutine.resume(co) — totéž volání, které ji spustilo, a pokračuje od yield.",
  "coroutine.status(co) se jen ptá; yield z hlavního programu je chyba, protože není kam předat řízení; korutina není tabulka a nemá metody.",
]

# ---------------------------------------------------------------- 26
[[quest]]
id    = "lua.verybasic.26.mutex"
title = "Jedno počítadlo, čtyři ruce"
story = "Čtyři běžci s tyčinkami přičítají k jednomu počítadlu napsanému křídou na stěně kůlny a střídají se u křídy; počítadlo má zámek a nikdo si ho nevezme, než čte."
brief = '''
Běží vždy jedna korutina, a přesto je tu souběh: každý worker přečte `counter`, udělá yield a zapíše ho zpátky, a ostatní tři v té mezeře proběhnou. Lua nemá mutex; `lock` je malý kooperativní zámek a jeho `acquire` dělá yield, dokud není volný, a pak si ho vezme. Před čtením si každý worker musí zámek VZÍT touto metodou — s dvojtečkou, aby zámek předal sám sebe; uvolnění je už napsané za zápisem.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  1000
output: 4000
```
'''
hints = [
  "lock:acquire() — pak čtení a zápis, pak uvolnění, které tam už je.",
  "lock.acquire() s tečkou nepředá self a není žádné held, na které by se dalo podívat; uvolnit zámek, který nikdo nedrží, je záměrně chyba.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "lua.verybasic.27.binary-tree"
title = "Nula"
story = "21:00 u hlavy draka na Wun Sha Street: čísla článků jdou do stromu, články začínají od 1 a `segments[0]` je `nil` — hlava není nikde, levá větev stromu je totéž nikde a tanec začíná od druhého lampionu."
brief = '''
Čísla článků se načtou do `segments`, který začíná od 1 jako každý seznam v Lua — `segments[0]` je `nil`, a stejně tak dítě, které tam ještě není; ani jedno není chyba, dokud se po něm nejde. `insert(n, v)` vrací kořen stromu s `v` uvnitř; případ `nil` a pravá strana jsou napsané. Pro menší `v` se levé dítě musí nahradit výsledkem vložení do něj, aby se z dítěte `nil` stal uzel.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
hints = [
  "n.left = insert(n.left, v) — rekurze vrací nový kořen podstromu; ulož ho.",
  "Volání insert bez uložení výsledku nechá nil tam, kde bylo, a nic si nestěžuje: nil není chyba, dokud se po něm nejde. Když vynecháš v, vloží se hodnota nil, a další porovnání s ní už chyba je.",
]
