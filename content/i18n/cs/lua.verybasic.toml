# LUA LAND — VERY BASIC, in Czech. A translation pack (SPEC §12.1): the prose of
# `content/lua/verybasic.toml`, quest by quest, and nothing else. Code blocks,
# identifiers, sample input and output and the exact strings a program must
# print are the English pack's and are copied verbatim, never translated.

pack   = "lua.verybasic"
locale = "cs"

# ---------------------------------------------------------------- 01
[[quest]]
id    = "lua.verybasic.01.print"
title = "První lampion"
story = "21:00 na Wun Sha Street. Tabule s lampiony nad dračí kůlnou je tmavá a první řádek noci má napsat Mei."
brief = '''
Program musí vypsat přesně `hello, causewaybay` na jeden řádek. Jedna vestavěná funkce zapíše své argumenty a konec řádku na standardní výstup.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
output: hello, causewaybay
```
'''
hints = [
  "print(\"hello, causewaybay\") — závorky a čárka uvnitř řetězce.",
  "print \"hello causewaybay\" je v Lua platné — řetězcový literál smí následovat volání i bez závorek — ale chybí čárka. io.write nezapíše konec řádku a puts je jméno, které Lua nezná.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "lua.verybasic.02.int-types"
title = "Rozdělené tyčinky"
story = "Svazky vonných tyčinek se u brány Lin Fa Kung dělí mezi články draka; počítadlo má říct, kolik dostane každý článek a kolik zbude, a neříká nic."
brief = '''
`a` a `b` jsou celá čísla. Program musí vypsat celočíselný podíl a zbytek na jeden řádek, oddělené JEDNOU mezerou. LuaJIT má jediný číselný typ a žádný operátor celočíselného dělení: `/` dá zlomek, `math.floor` ho zahodí a `%` je zbytek. `print` dává mezi své argumenty TABULÁTOR, takže se ty dvě hodnoty nejdřív spojí do jednoho řetězce pomocí `..`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  7 2
output: 3 1
```
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — dělení zaokrouhli dolů, pak spoj mezerou.",
  "a / b je 3.5, ne 3. // v LuaJIT není operátor. A print(x, y) odděluje tabulátorem, ne mezerou.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "lua.verybasic.03.floats"
title = "Přesná váha"
story = "Váha u kůlny na School Street ukazuje váhu draka na jednoho nosiče na tři místa a tištěný program chce dvě; řádek programu je prázdný."
brief = '''
`x` a `y` jsou čísla. Program musí vypsat `x / y` s přesně dvěma číslicemi za tečkou. `string.format` bere specifikaci ve stylu C: `f` je číslo s pevnou desetinnou čárkou a číslice za tečkou říká, kolik desetinných míst.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  7 2
output: 3.50
```
'''
hints = [
  "print(string.format(\"%.2f\", x / y)) — tečka před dvojkou určuje desetinná místa.",
  "math.floor(x / y * 100) / 100 je pořád číslo a číslo se vypíše jako 3.5, ne 3.50; %d je pro celá čísla.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "lua.verybasic.04.strings"
title = "Směrová cedule"
story = "Směrová cedule na začátku Lily Street je namalovaná velkými písmeny a v seznamu posádky je malými; malíř cedulí to potřebuje zakřičet zpátky."
brief = '''
`s` je jeden řádek textu. Po jeho délce musí program vypsat `s` velkými písmeny. Řetězcová metoda vrátí kopii s každým písmenem velkým a metoda se volá s dvojtečkou, aby řetězec předal sám sebe.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  kwan lee
output: 8
        KWAN LEE
```
'''
hints = [
  "print(s:upper()) — dvojtečka předá s jako první argument.",
  "s.upper() s tečkou nepředá nic a upper si stěžuje, že nedostal řetězec; toUpperCase je JavaScript.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "lua.verybasic.05.bool-if"
title = "Sudé, nebo liché"
story = "Články draka nesou nalevo sudá čísla a napravo lichá; nosič na Wun Sha Street zná své číslo a potřebuje svou stranu."
brief = '''
`n` je kladné celé číslo. Program musí vypsat `even`, když je `n` dělitelné dvěma, a jinak `odd`. Podmínka je hlavička `if`, která porovná zbytek s nulou, a končí slovem `then`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  4
output: even
```
'''
hints = [
  "if n % 2 == 0 then — dvě rovnítka porovnávají, jedno přiřazuje.",
  "n / 2 je zlomek; pro kladné n nikdy není nula.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "lua.verybasic.06.loops"
title = "Součet"
story = "Počet vonných tyčinek na tuhle noc je jedna plus dvě plus tři až po poslední článek a počítací tabule u kůlny ukazuje nulu."
brief = '''
`n` je kladné celé číslo. Smyčka musí projít každé celé číslo od 1 až po `n` včetně a každé přičíst k `total`. Číselný `for` bere začátek a konec a konec JE zahrnutý.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  4
output: 10
```
'''
hints = [
  "for i = 1, n do — konec je včetně, takže je to samotné n.",
  "for i in ... je ta druhá smyčka, která bere iterační funkci; číslo žádná funkce není.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "lua.verybasic.07.functions"
title = "Sazba pro nosiče"
story = "Prvních deset kol po Wun Sha Street platí nosiči pět za kolo a každé další kolo tři; funkce na výplatu nevrací nic."
brief = '''
`pay(laps)` musí vrátit výplatu: prvních deset kol po 5, každé kolo po desátém po 3. Funkce vrací hodnotu jedním klíčovým slovem; funkce, která jen vypisuje, vrací `nil`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  3
output: 15
```
'''
hints = [
  "return math.min(laps, 10) * 5 + math.max(laps - 10, 0) * 3",
  "math.max s jedním argumentem je ten argument: max(laps - 10) jde při krátké noci do záporu. A print uvnitř pay nechá volajícího vypsat nil.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "lua.verybasic.08.structs"
title = "Jeden stánek, dvě pole"
story = "Každý stánek na lampionovém jarmarku ve Victoria Park má na kartě jméno a cenu. Cena karty se nikdy neuloží a štítek vypíše půlku stánku."
brief = '''
`Stall.new(name, price)` sestaví tabulku, jejíž metatabulka je `Stall` — třída v Lua. Musí uložit `price` na objekt stejně, jako je uložené `name`, aby ho `s.price` přečetlo zpátky. Pole se zapisuje na `self`; holé jméno je lokální proměnná.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  tofu 12
output: tofu 12
```
'''
hints = [
  "self.price = price — self je ta tabulka; holé jméno je parametr.",
  "Dvě rovnítka porovnávají a samotné porovnání není příkaz, který by Lua přijala.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "lua.verybasic.09.struct-method"
title = "Součet řádku"
story = "Cena krát množství je jeden řádek každé objednávky u stánku s nudlemi na lampionovém jarmarku a metoda, která to má říct, neříká nic."
brief = '''
`Stall:total()` musí vrátit cenu krát množství. Metoda deklarovaná s dvojtečkou má skrytý první parametr `self` a na pole objektu se sahá přes něj; samotné `price` je globální proměnná, kterou nikdo nenastavil.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `-- FILL`.

```
input:  tofu 12 3
output: tofu: 36
```
'''
hints = [
  "return self.price * self.qty — obě pole přes self.",
  "Samotné price je globální proměnná, nil, a nil se násobit nedá.",
]

