`chain` je tabulka používaná jako seznam. Lua nemá deque; `table.insert` s pozicí je to nejbližší a všechno za tou pozicí posune o jedno nahoru. Každé `x` přečtené ve smyčce se musí přidat na ZAČÁTEK, takže poslední přečtené skončí první.

