```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
hints = [
  "heap:push(x) — dvojtečka předá haldu jako self a push probublá x tam, kam patří.",
  "heap.push(x) s tečkou udělá z x self a číslo nemá žádné items; table.insert(heap.items, x) dá x na konec a probublání přeskočí.",
]

