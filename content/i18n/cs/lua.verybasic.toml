[[quest]]
id    = "lua.verybasic.19.heap"
title = "Nejnižší číslo první"
story = "Čísla článků přicházejí z uliček v libovolném pořadí a pořadatel chce pokaždé jako další to nejnižší; hromada, na které leží, netuší, které to je."
