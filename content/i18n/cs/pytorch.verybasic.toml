Ztráta je jedno číslo, které říká, jak moc je predikce vedle. Střední kvadratická chyba je druhá mocnina rozdílu, zprůměrovaná: pro `3.0` proti `1.0` je to `(3 - 1)² = 4.0`.

Vyber řádek, který postaví ztrátovou funkci.

```
output: 4.0
```
'''
hints = [
  "nn.MSELoss() — je to třída, takže se nejdřív postaví a pak zavolá.",
  "nn.L1Loss() je absolutní rozdíl, který by dal 2.0 místo 4.0.",
]

# ---------------------------------------------------------------- 27
[[quest]]
id    = "pytorch.verybasic.27.first-step"
title = "První krok"
story = "Všechno je na místě — parametr, ztráta, gradient — a číslo se ani nehne. Optimalizátor je postavený a nikdo ho nepožádal, aby něco udělal."
brief = '''
Tohle je celá smyčka, jednou: dopředný průchod, ztráta, `backward()` a pak ta věc, která parametrem opravdu pohne. Optimalizátor použije gradienty, které leží v `.grad`, a dělá to vlastní metoda optimalizátoru — bez toho volání se gradient spočítá a zahodí a parametr je přesně tam, kde začal.

`w` začíná na `5.0`, cíl je `0.0`, ztráta je `w * w`, takže gradient je `10.0`. S obyčejným SGD a `lr=0.1` je krok `w - 0.1 * 10.0`.

Vyber řádek, který udělá krok.

```
output: 4.0 moved
```
'''
hints = [
  "opt.step() — zero_grad maže, backward plní, step aplikuje. Všechny tři, v tomhle pořadí.",
  "loss.backward() jen spočítá gradient; parametru se nikdy nedotkne.",
]
