# ---------------------------------------------------------------- 01
[[quest]]
id    = "remix.verybasic.01.numbers-go"
title = "Celé číslo a float — GO"
story = "Stůl jedna. Na objednávkovém lístku dvě čísla a účet se musí rozdělit: kolik na každého, kolik zbude a přesný podíl na cent. Gogo si to objedná v Go."
brief = '''
Celé číslo a float jsou různé typy a dělení dvou celých čísel dá celé číslo: podíl zaokrouhlený k nule, zbytek zůstane pro `%`. Pro přesný podíl nejdřív převedeš a pak dělíš. Program načte `a` a `b`, vypíše jejich součet, pak na jednom řádku podíl a zbytek a nakonec `a / b` jako float na dvě desetinná místa.

V Go je `/` mezi dvěma hodnotami `int64` celočíselné dělení a `%` zbytek. `float64(a)` je převod — přetypování ve tvaru funkce — a teprve když jsou obě strany `float64`, dělí `/` přesně. `%.2f` v `Printf` vypíše dvě desetinná místa.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "q := a / b a pak r := a % b — obojí zůstává int64; f := float64(a) / float64(b) převede před dělením.",
  "float64(a) / b se nezkompiluje: Go nikdy nemíchá int64 a float64 v jednom výrazu.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "remix.verybasic.02.numbers-rust"
title = "Celé číslo a float — RUST"
story = "Stůl jedna. Na objednávkovém lístku dvě čísla a účet se musí rozdělit: kolik na každého, kolik zbude a přesný podíl na cent. Ferris si to objedná v Rustu."
brief = '''
Celé číslo a float jsou různé typy a dělení dvou celých čísel dá celé číslo: podíl zaokrouhlený k nule, zbytek zůstane pro `%`. Pro přesný podíl nejdřív převedeš a pak dělíš. Program načte `a` a `b`, vypíše jejich součet, pak na jednom řádku podíl a zbytek a nakonec `a / b` jako float na dvě desetinná místa.

V Rustu je `/` mezi dvěma hodnotami `i64` celočíselné dělení a `%` zbytek. `a as f64` je převod a váže těsněji než `/`, takže `a as f64 / b as f64` dělí dva floaty. `{:.2}` v `println!` vypíše dvě desetinná místa.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  7 2
output: 9
        3 1
        3.50
```
'''
hints = [
  "let q = a / b; a pak let r = a % b; — obojí i64; let f = a as f64 / b as f64; převede před dělením.",
  "a as f64 / b se nezkompiluje: f64 nejde dělit hodnotou i64.",
]

