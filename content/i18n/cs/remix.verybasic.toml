id    = "remix.verybasic.11.closures-rust"
title = "Uzávěr — RUST"
story = "Každá objednávka dostane číslo lístku. Počítadlo, které je rozdává, žije uvnitř funkce, která ho vyrobila, a nikdo jiný na něj nesáhne. Ferris si to objedná v Rustu."
brief = '''
