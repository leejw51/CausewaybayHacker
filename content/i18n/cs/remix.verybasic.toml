V Rustu počítadlo *je* zámek: `Arc<Mutex<i64>>`, sdílené přes `Arc::clone` a otevřené přes `.lock().unwrap()`, které vrátí strážce, jenž se dereferencuje na číslo a odemkne, když je na konci příkazu zahozen. `*guard += x` přes něj zapíše; k číslu se bez zámku nedá dostat.

