V Pythonu dá `/` vždy float, i pro dva inty, takže přesný podíl žádný převod nepotřebuje. Celočíselný podíl je *jiný* operátor, `//`, a `%` je zbytek. `f"{f:.2f}"` vypíše dvě desetinná místa.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `# FILL`.

