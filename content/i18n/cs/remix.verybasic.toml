# ---------------------------------------------------------------- 04
[[quest]]
id    = "remix.verybasic.04.strings-go"
title = "Řetězec — GO"
story = "Objednávkový lístek je jeden řádek jmen oddělených čárkami a kuchyně je chce vykřičet, oddělit a spočítat po písmenech. Gogo si to objedná v Go."
brief = '''
Řetězec se rozdělí na kousky podle oddělovače, kousky se spojí zpět jiným a celý řetězec se převede na velká písmena jedním voláním. Past je délka: jméno s diakritikou má víc bajtů než znaků a jen jedno z toho by spočítal člověk. Program načte jeden řádek jmen oddělených čárkami, vypíše, kolik jich je, jména velkými písmeny spojená pomocí ` | ` a počet znaků řádku.

V Go dělá práci balíček `strings`: `strings.Split` dá `[]string`, `strings.Join` z něj udělá zpět řetězec, `strings.ToUpper` vrátí nový řetězec. `len(s)` jsou bajty; počet znaků je `utf8.RuneCountInString(s)`, protože řetězec v Go jsou bajty a runa je to, na co se dekódují.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "strings.Split(line, \",\") a pak strings.ToUpper(strings.Join(names, \" | \")); počet je utf8.RuneCountInString(line).",
  "len(line) jsou bajty: Zoë má čtyři bajty a tři znaky, a skrytý test to ví.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "remix.verybasic.05.strings-rust"
title = "Řetězec — RUST"
story = "Objednávkový lístek je jeden řádek jmen oddělených čárkami a kuchyně je chce vykřičet, oddělit a spočítat po písmenech. Ferris si to objedná v Rustu."
brief = '''
Řetězec se rozdělí na kousky podle oddělovače, kousky se spojí zpět jiným a celý řetězec se převede na velká písmena jedním voláním. Past je délka: jméno s diakritikou má víc bajtů než znaků a jen jedno z toho by spočítal člověk. Program načte jeden řádek jmen oddělených čárkami, vypíše, kolik jich je, jména velkými písmeny spojená pomocí ` | ` a počet znaků řádku.

V Rustu je `split(',')` iterátor, takže se `collect`em sebere do `Vec<&str>`; `join(" | ")` na vektoru udělá `String` a `to_uppercase()` další. `len()` jsou bajty; počet znaků je `chars().count()`, protože `&str` jsou bajty UTF-8 a `chars()` je dekóduje.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "let names: Vec<&str> = line.split(',').collect(); a pak names.join(\" | \").to_uppercase(); počet je line.chars().count().",
  "line.len() jsou bajty: Zoë má čtyři bajty a tři znaky, a skrytý test to ví.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "remix.verybasic.06.strings-python"
title = "Řetězec — PYTHON"
story = "Objednávkový lístek je jeden řádek jmen oddělených čárkami a kuchyně je chce vykřičet, oddělit a spočítat po písmenech. Krajta si to objedná v Pythonu."
brief = '''
Řetězec se rozdělí na kousky podle oddělovače, kousky se spojí zpět jiným a celý řetězec se převede na velká písmena jedním voláním. Past je délka: jméno s diakritikou má víc bajtů než znaků a jen jedno z toho by spočítal člověk. Program načte jeden řádek jmen oddělených čárkami, vypíše, kolik jich je, jména velkými písmeny spojená pomocí ` | ` a počet znaků řádku.

V Pythonu jsou metody na řetězci: `line.split(",")` dá seznam, `" | ".join(names)` se volá na *oddělovači* a `.upper()` vrátí nový řetězec. `len(s)` počítá znaky, ne bajty, protože `str` v Pythonu je už dekódovaný — počet bajtů by byl `len(s.encode())`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `# FILL`.

```
input:  Mei,Bo,Alex
output: 3
        MEI | BO | ALEX
        11
```
'''
hints = [
  "names = line.split(\",\") a pak \" | \".join(names).upper(); počet je len(line).",
  "len(line.encode()) jsou bajty: Zoë má čtyři bajty a tři znaky, a skrytý test to ví.",
]

