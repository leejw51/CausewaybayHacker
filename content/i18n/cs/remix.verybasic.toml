V Rustu je uzávěr `|| { ... }` a `move` způsobí, že si `n` vezme s sebou — bez `move` by si půjčoval lokální proměnnou, která za chvíli zmizí z rozsahu. Mění svou zachycenou hodnotu, takže návratový typ je `impl FnMut() -> i64` a volající ho váže jako `mut`.

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

