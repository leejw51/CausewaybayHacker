[[quest]]
id    = "remix.verybasic.52.mutex-go"
title = "Mutex — GO"
story = "Jedna čárkovnice na zdi a každý štamgast do ní přičítá tisíckrát za sebou; křída musí přecházet z ruky do ruky čistě, jinak je číslo špatně. Gogo si to objedná v Go."
brief = '''
Několik vláken přičítajících do jednoho čísla je datový závod, pokud se číslo kolem každého přičtení nezamkne. Mutex je ten zámek: vezmi ho, změň hodnotu, pusť ho. Program načte čísla, spustí jedno vlákno na číslo, každé přičte své číslo do sdíleného počítadla tisíckrát pod zámkem, a na konci vypíše počítadlo.

V Go je `sync.Mutex` hodnota se dvěma metodami, jednou na vzetí zámku a jednou na jeho puštění, a počítadlo je obyčejná proměnná. Disciplína je na tobě: vzít, přičíst, pustit. Jména metod v Go začínají velkým písmenem, když jsou exportovaná, a tyhle jsou. Který řádek bere zámek?

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `// FILL`.

```
input:  1 2 3
output: 6000
```
'''
hints = [
  "mu.Lock() pak counter += x pak mu.Unlock() — tři řádky, přičtení uprostřed.",
  "Go rozlišuje velikost písmen a metoda je Lock; mu.lock() není definované.",
]

