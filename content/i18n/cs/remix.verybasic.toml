title = "Mutex — RUST"
story = "Jedna čárkovnice na zdi a každý štamgast do ní přičítá tisíckrát za sebou; křída musí přecházet z ruky do ruky čistě, jinak je číslo špatně. Ferris si to objedná v Rustu."
