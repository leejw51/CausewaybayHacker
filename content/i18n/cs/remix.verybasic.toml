[[quest]]
id    = "remix.verybasic.12.closures-python"
title = "Uzávěr — PYTHON"
story = "Každá objednávka dostane číslo lístku. Počítadlo, které je rozdává, žije uvnitř funkce, která ho vyrobila, a nikdo jiný na něj nesáhne. Krajta si to objedná v Pythonu."
brief = '''
Uzávěr je funkce, která zachytí proměnnou z rozsahu, kde vznikla, a drží ji naživu i poté, co se ten rozsah vrátil. `counter()` jeden vyrobí: každé volání uzávěru, který vrátí, vydá další číslo. Program načte slova, očísluje je od 1 a pak vypíše číslo, které by uzávěr vydal jako další.

V Pythonu je uzávěr vnořená `def`. Číst `n` z vnějšího rozsahu smíš volně, ale přiřazení do něj vytvoří novou lokální proměnnou — ledaže vnitřní funkce nejdřív jedním klíčovým slovem prohlásí, že `n` patří do obklopujícího rozsahu. Který řádek je to prohlášení?

Vyber řádek, který to udělá, a napiš ho tam, kde je komentář `# FILL`.

```
input:  tea coffee milk
output: 1 tea
        2 coffee
        3 milk
        4
```
'''
hints = [
  "def next_id(): a pod ní nonlocal n, n += 1, return n — pak counter vrátí next_id.",
  "Bez nonlocal je n += 1 UnboundLocalError: přiřazení vytvořilo nové lokální n dřív, než se přečetlo.",
]

