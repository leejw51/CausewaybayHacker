[[quest]]
id    = "lua.hacker.18.edit-distance"
title = "Jak daleko od sebe"
story = "Dva zápisy téže uličky na dvou různých uličních cedulích. Kolik úprav po jednom znaku je mezi nimi."
brief = '''
Dva řádky, na každém jedno slovo, malými písmeny. Kterýkoli řádek může být **prázdný** a pak je odpovědí délka toho druhého.

Vypiš **editační vzdálenost**: nejmenší počet vložení, smazání nebo záměn jednoho znaku, které z prvního udělají druhé. Pak vypiš `LCS <k>`, délku jejich nejdelší společné podposloupnosti.

```
input:  horse
        ros
output: 3
        LCS 2
```

Dvě tabulky nad týmiž dvěma řetězci a obě jsou tatáž třířádková rekurence s jiným rozhodnutím. Plň řádek po řádku; odpověď je v protějším rohu. Řádek `0` a sloupec `0` nejsou u editační tabulky nula — jsou to náklady na smazání nebo vložení všeho.

Prázdný první řádek znamená, že `gmatch("%S+")` by ti dal druhé slovo jako první. U tohohle čti po řádcích, ne po tokenech — `gmatch("(.-)\n")` prochází řádky a pro prázdný vrátí prázdný řetězec.

Tabulka `(len(a)+1) × (len(b)+1)` je tabulka tabulek a každý řádek musí být **vlastní** tabulka: postav každý ve smyčce přes `{}`. Jedna tabulka řádku přiřazená pod každý index je jeden řádek, přepisovaný ze všech směrů, a odpověď v protějším rohu je nesmysl, který vypadá věrohodně.
'''
hints = [
  "edit[i][0] = i a edit[0][j] = j: udělat z prefixu nic stojí jedno smazání na znak.",
  "Shodné znaky nestojí nic a jdou diagonálně; neshoda stojí jedna a bere nejlevnějšího ze tří sousedů. a:byte(i) == b:byte(j) porovná znaky, aniž by vyrobilo dva nové řetězce.",
  "LCS je tentýž průchod s max místo min a bez diagonálního kroku při neshodě. A každý řádek stav s vlastním {} uvnitř smyčky — jedna sdílená tabulka řádku je chyba, která vypíše věrohodné špatné číslo.",
]

