[[quest]]
id    = "lua.hacker.11.bst"
title = "Je to opravdu BST"
story = "Navazující otázka, tentýž strom čísel lampionů. Každý zkontroluje ty dvě děti a každý se napoprvé mýlí."
brief = '''
Stejné kódování po úrovních jako v minulém questu: `-1` je chybějící uzel, děti `i` jsou `2i+1` a `2i+2`.

První řádek je `n q`. Druhý řádek je `n` hodnot stromu. Třetí řádek je `q` hodnot dotazů.

Vypiš `VALID` nebo `INVALID` — je tohle binární vyhledávací strom, kde je každá hodnota v levém podstromu ostře menší než uzel a každá hodnota v pravém ostře větší? Pak jeden řádek na dotaz: `<value> FOUND <depth>`, pokud je ve stromu, `<value> ABSENT`, pokud ne, kde kořen má hloubku 1.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Kontrolovat `left < node < right` u každého uzlu **nestačí** — hodnota hluboko v levém podstromu může být pořád větší než nějaký předek. Místo toho nes dolů otevřený interval. Lua nemá žádné nejmenší celé číslo, od kterého začít; meze začínají jako `nil`, což znamená „zatím žádná mez“, a `nil` potřebuje vlastní kontrolu, protože `value <= nil` je `attempt to compare number with nil`, běhová chyba, ne nepravda.

Na dotaz se odpovídá **sestupem**: porovnej s uzlem, jdi doleva, když jsi menší, a jinak doprava, a ohlas `ABSENT`, když ze stromu spadneš. Na tom záleží, protože strom nemá slíbeno, že je BST, a v takovém, který jím není, může hodnota sedět v poli někde, kam se sestup nikdy nepodívá. Pak je `ABSENT` — ptají se tě, co udělá vyhledání, ne co by našel průchod polem.
'''
hints = [
  "Předávej dolů otevřený interval (low, high). Kořen dostane (nil, nil); levé dítě dostane (low, node), pravé dítě (node, high).",
  "Chybějící uzel je triviálně platný — to je základní případ a vrací true, ne false.",
  "Vyhledání je to binární vyhledávání: menší jde doleva, jinak doprava, a hloubka je, kolik skoků to dalo. Pád ze stromu vrátí nil a nil se vypíše jako ABSENT.",
]

