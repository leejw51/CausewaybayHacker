[[quest]]
id    = "lua.hacker.12.heap"
title = "K seřazených front"
story = "Každá ulička, kterou drak prochází, posílá svá čísla lampionů už seřazená. Spoj je do jednoho seznamu, aniž bys to celé znovu řadil."
brief = '''
První řádek je `k`. Pak `k` řádků, každý je počet a za ním tolik celých čísel, už seřazených vzestupně.

Vypiš je všechna spojená do jednoho vzestupného řádku, oddělená mezerami, pak `POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

V Lua žádný `heapq` není. Binární min-halda je tabulka a dvě funkce — `push` probublá nový poslední prvek nahoru, `pop` přesune poslední prvek na vrchol a nechá ho klesnout — a starter jednu nese, dvě funkce po patnácti řádcích, takže otázkou je tady smyčka, ne halda. Přečti si ji jednou; dál na téhle cestě ji napíšeš sám.

Položka je `{ value, which list, how far into it }` a halda řadí položky nejdřív podle `value` a při shodě podle indexu seznamu — což je v pořádku, protože to musí být jen *nějaké* pořadí, a musí být **úplné**, protože porovnání haldy píšeš ty a porovnání, které oběma směry říká „rovná se“, není chyba, kterou by Lua ohlásila.

Halda drží jednu položku na seznam, ne jednu na prvek, takže zůstane velká `k`, ať jsou seznamy jakkoli dlouhé.

Čtyři případy tady jsou hrstka čísel ve dvou nebo třech seznamech a hodiny na nich rychlost neměří: nasypat všechno do jedné tabulky a seřadit ji přes `table.sort` projde všemi čtyřmi, a stejně tak znovu procházet všech `k` začátků v každém kroku. Halda je to, co to drží na `O(N log k)`, když je `k` velké, a to je slib o vstupu, který tyhle případy neobsahují.
'''
hints = [
  "Položka haldy musí nést, odkud hodnota přišla, jinak po jejím vybrání nemůžeš doplnit.",
  "{ value, which, at } s `less`, které porovnává nejdřív value, je přesně to, co chceš; osej ji prvním prvkem každého neprázdného seznamu — seznam s počtem 0 nemá žádný začátek, kterým by šel osít.",
  "Další prvek seznamu vlož jen tehdy, když vybereš jeden z jeho prvků — to drží haldu na k.",
]

