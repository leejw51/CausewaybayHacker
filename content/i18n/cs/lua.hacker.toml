[[quest]]
id    = "lua.hacker.17.lis"
title = "Nejdelší rozběh"
story = "Rok nočních tržeb u stánku s lampiony. Chtějí nejdelší úsek zlepšujících se nocí a nemusí jít po sobě."
brief = '''
První řádek je `n`. Druhý řádek je `n` celých čísel.

Vypiš délku nejdelší **ostře rostoucí podposloupnosti** — hodnoty si drží pořadí, ale nemusí sousedit. Pak vypiš `TAILS <k>`, kde `k` je tatáž délka, odečtená z počtu hromádek patience sortu.

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

Tabulka `O(n²)` je odpověď, kterou bys měl umět napsat z hlavy. Ta `O(n log n)` drží pro každou délku nejmenší hodnotu, na které může podposloupnost té délky končit — tabulku, která je vždy seřazená, takže pozice nové hodnoty je binární vyhledávání. V Lua žádný `bisect` není; hledání je šest řádků, napsaných ručně, a najde **první** konec, který je `>= value` — ten levý, ne pravý, protože ostře rostoucí znamená, že stejná hodnota nahrazuje, ne prodlužuje. Tady projde obojí; případy jsou malé a říkají to. Stejně napiš tu druhou, protože navazující otázka je vždycky „a rychleji?“.

Zápis `tails[#tails + 1] = value` přidává na konec; zápis `tails[at] = value` pro `at` uvnitř posloupnosti nahrazuje. Binární vyhledávání ti dá `at`, a když dopadne o jedno za konec, totéž přiřazení udělá přidání.
'''
hints = [
  "tails není podposloupnost. Její délka je odpověď; její obsah jsou jen nejlepší koncové hodnoty.",
  "Ostře rostoucí znamená, že nahradíš první konec, který je >= value, a to najde hledání s `tails[mid] < value`. Hledání prvního konce > value by ti dalo neklesající.",
  "Vyběhnout za konec tails — low == #tails + 1 — znamená, že tahle hodnota prodlužuje dosud nejdelší rozběh, a `tails[low] = value` je pak přidání na konec.",
]

