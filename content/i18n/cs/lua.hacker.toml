output: 5
        RANGE 6
```

Záporné hodnoty zabijí posuvné okno — okno, které je moc velké, se zmenšením opravit nedá. Co přežije, jsou prefixové součty: úsek `i..j` má součet `k` přesně tehdy, když `prefix[j] - prefix[i] == k`, takže spočítej, kolik dřívějších prefixů se rovná `prefix[j] - k`. Osej tabulku `[0] = 1` pro úseky, které začínají na začátku.

Počet, který nikdo nezapsal, je `nil`, a `nil + 1` je chyba, ne `1`. `(seen[key] or 0) + 1` je v Lua „nula, když chybí“ — to `or` je ten `defaultdict`.

Čtyři případy tady mají nanejvýš pět čísel a hodiny na nich rychlost neměří: dvojitá smyčka `O(n²)` přes každý začátek a každý konec projde všemi čtyřmi. Laťka je skutečná — na noci tržeb je ta dvojitá smyčka otázkou minut — a tyhle případy ji nekontrolují. Kontrolují tu část, kterou je snadné pokazit: osetí `[0] = 1` a vyhledání před zaznamenáním.
'''
hints = [
  "Dřívější prefix vyhledej *předtím*, než zaznamenáš ten aktuální, jinak se úsek nulové délky započítá sám, když je k 0.",
  "seen = { [0] = 1 } hned na začátku je to, co vůbec dovolí najít úsek, který začíná na indexu 1.",
