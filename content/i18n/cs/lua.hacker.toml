story = "Plán lampionového jarmarku je vzhůru nohama a na stole není místo na jeho druhou kopii."
brief = '''
První řádek je `n`. Dalších `n` řádků je mřížka `n × n` celých čísel.

Vypiš mřížku otočenou o **90° po směru hodinových ručiček**, `n` řádků hodnot oddělených mezerami. Pak vypiš její hodnoty ve **spirálovém pořadí** — vnější prstenec po směru hodinových ručiček od levého horního rohu, směrem dovnitř — na jeden řádek.

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

Otočení je to, které se má udělat na místě: transponuj, pak obrať každý řádek. Říct to nahlas je polovina otázky. Vícenásobné přiřazení v Lua je to prohození — `grid[r][c], grid[c][r] = grid[c][r], grid[r][c]` — bez pomocné proměnné, protože pravá strana se vyhodnotí celá, než se cokoli uloží. Žádný jednořádek `zip(*grid)` tu není a nic, co by ti řádek obrátilo; obojí jsou smyčky a měl bys umět říct, proč každá funguje.

Spirála chce **původní** mřížku a tabulka je reference: `copy = grid` jsou dvě jména pro jednu tabulku a `{unpack(grid)}` zkopíruje vnější tabulku a sdílí každý řádek. Kopíruj řádky jeden po druhém.
'''
hints = [
  "Transponuj prohazováním jen nad diagonálou — c začíná na r + 1 — jinak všechno prohodíš zpátky. Vícenásobné přiřazení prohazuje bez pomocné proměnné.",
  "Spirála chce původní mřížku, takže ji před otočením na místě zkopíruj řádek po řádku: tabulka je reference a `copy = grid` nic nezkopíruje.",
  "Ty dvě stráže `if` uvnitř spirálové smyčky jsou to, co brání tomu, aby se jediný prostřední řádek nebo sloupec prošel dvakrát.",
