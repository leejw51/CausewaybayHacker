[[quest]]
id    = "lua.hacker.29.dijkstra"
title = "Ne každá ulice je stejně dlouhá"
story = "Každá mapa, kterou jsi zatím prošel, počítala skoky. Tramvaji je jedno, kolik je zastávek; zajímá ji, jak dlouho trvají — a dnes v noci trvá každá ulička v Tai Hang déle."
brief = '''
Standardní vstup je `n m seed`: `n` zastávek, `m` neorientovaných ohodnocených hran. Graf si postav sám, **přesně** tímhle generátorem, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`, jako na uzlu 16):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Vypiš součet nejkratších vzdáleností ze zastávky `0` do každé dosažitelné zastávky (včetně samotné `0`, která je `0`), pak `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 100000`, `m = 200000`. Dijkstra je správný algoritmus tak či tak; co rozhodnou hodiny, je prioritní fronta. Starter drží nenavštívené zastávky v množině — tabulce se zastávkou jako klíčem — a nejbližší najde procházením množiny přes `pairs`, což je `O(V)` na krok a celkem `O(V²)`: na tomhle stroji **32 sekund** proti desetisekundovému limitu. Binární halda z toho udělá `O((V + E) log V)` a doběhne asi za šestinu sekundy. Obojí změřeno na tomhle stroji, se dvěma programy, které jsou součástí tohohle questu.

Stojí za to to vidět jasně, protože je to nejčastější způsob, jak neprojít časovaným testem: **starter není špatně.** Vypíše přesně správnou odpověď. Je odmítnutý jen proto, že přijde mnohem pozdě.

Žádný `heapq` tu není: halda je ta, kterou jsi dostal na uzlu 12, drží položky `{ distance, stop }` a porovnává podle vzdálenosti, a tentokrát ji píšeš ty. Nemá decrease-key a ty ho nepotřebuješ: vlož zlepšenou vzdálenost jako novou položku a přeskoč každou vybranou položku, jejíž vzdálenost je už horší než ta, kterou máš zaznamenanou. To přeskočení „zastaralé položky“ je řádek, na který lidé zapomínají, a bez něj halda roste bez omezení. `math.huge` je to poctivé `unreached`: porovná se jako větší než každé číslo a v relaxaci nepotřebuje žádnou kontrolu `nil`.
'''
hints = [
  "Položky { distance, stop } v min-haldě klíčované prvním polem: halda z uzlu 12 s `less` zúženým na porovnání [1].",
  "Přeskočení položky, jejíž vzdálenost je větší než dist[u], je přeskočení zastaralé položky. Bez něj je algoritmus pořád správný a halda se plní zastaralými položkami.",
  "math.huge je to poctivé `unreached`: porovná se jako větší než každé číslo a v relaxaci nepotřebuje žádnou kontrolu nil. Polovina generátoru s kostrou zaručuje, že každá zastávka je dosažitelná, takže závěrečný filtr nikdy nic neodstraní — stejně ho nech, protože verze téhle otázky s nedosažitelnou zastávkou je ta navazující.",
]

