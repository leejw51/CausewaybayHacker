[[quest]]
id    = "lua.hacker.28.lru"
title = "Měsíc"
story = "Room 7-32, poslední otázka, poosmé. Tazatel vypne monitor a jediné světlo na tabuli je měsíc za oknem: jeden typ tabulky pro každou strukturu, a hodiny."
brief = '''
První řádek je `cap q` a pak buď `q` řádků operací, každá `PUT <key> <value>` nebo `GET <key>` — nebo, když první řádek nese **třetí** číslo `seed`, už žádné další řádky a `q` operací pochází z generátoru níže.

Implementuj cache s pevnou kapacitou, která při zaplnění vyhodí **nejdéle nepoužitou** položku. `GET` i `PUT` se počítají jako použití klíče. `PUT` klíče, který cache už drží, nahradí jeho hodnotu a udělá z něj ten nejčerstvější — nepřidá žádnou položku, takže nic nevyhodí, ať je cache jakkoli plná.

Pro každý `GET` vypiš hodnotu, nebo `-1`, když tam není. Na konci vypiš přeživší klíče, nejčerstvěji použité první, oddělené mezerami — nebo `-`, když je cache prázdná — a pak `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Projdi si ukázku: `GET 1` udělá z `1` zase čerstvý klíč, takže když `PUT 3` potřebuje místo, jde pryč `2`. `GET 2` mine. `GET 3` zasáhne a udělá z `3` ten nejčerstvější, a proto se přeživší vypíšou jako `3 1`.

Generovaná podoba, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**Starter je špatně a ukázka to ukazuje.** Drží cache ve dvou tabulkách — `cache[key]` pro hodnoty a `order`, posloupnost klíčů, nejstarší první — a vyhazuje `order[1]`. `PUT` nového klíče přidá na konec `order`. `GET` přečte `cache[key]` a nic jiného neudělá, protože čtení tabulky v ní nic nepohne: tabulka si pamatuje, co je pod klíčem, ne kdy ses naposledy podíval. Takže cache vyhodí klíč, který přišel **první**, ne ten použitý **nejdéle nazpět**, a na ukázce `GET 2` vypíše `20`.

To je ten boss. Všechno v téhle zemi je tabulka a tabulka si nepamatuje, že ji někdo četl. Čerstvost je věc, kterou musíš *zapsat* — při každém zásahu a každém přepsání, nejen při vložení — a struktura, která z toho zápisu udělá `O(1)`, je ta učebnicová: hashovací tabulka do obousměrně spojového seznamu. Žádný `OrderedDict` se schovanými ukazateli tu není. Tady jsou ukazatele pole: uzel je `{ key = k, value = v, prev = p, next = n }`, `nodes[key]` ho najde, vyjmout ho a znovu napojit na horký konec jsou čtyři přiřazení a studený konec je `head.next`. Dvě zarážkové tabulky na koncích znamenají, že v kódu seznamu není nikde žádná kontrola `nil`. Každá operace je `O(1)` a můžeš to říct bez vytáček.

`table.remove(order, 1)` ve starteru je navíc k tomu, že je špatně, i `O(cap)`, a jeho `order` je to, co ho prozradí: posloupnost umí říct, kdo přišel první, ale přesunout klíč na konec při každém dotyku je hledání a posun, a spojový seznam je to, jak vypadá „přesuň na konec v konstantním čase“, když si to postavíš sám.

(V pythonovské verzi tohohle pohovoru byl bossem limit rekurze a skrytý případ se dvěma tisíci operacemi je tu pořád. Starter prochází operace rekurzivně — `return step(i + 1)` na konci `step` — a projde, protože to je **správné koncové volání**: Lua rámec znovu použije a koncové volání nestojí nic, ať je jich kolik chce. Někde kolem dvaceti tisíc nekoncových rámců žije `stack overflow`. Znej obě fakta; rekurze nikdy nebyla tvarem tohohle problému a posloupnost operací je smyčka `for`.)
