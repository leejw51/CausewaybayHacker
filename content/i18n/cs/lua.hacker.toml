# ---------------------------------------------------------------- 20
[[quest]]
id    = "lua.hacker.20.bits"
title = "Ten, který je sám"
story = "Každý lístek na tyčinky je naskenovaný dvakrát, až na jeden. Nedovolí ti použít tabulku a nedovolí ti řadit."
brief = '''
První řádek je `n`. Druhý řádek je `n` nezáporných celých čísel, ve kterých se každá hodnota objeví přesně dvakrát, až na jednu.

Vypiš čtyři řádky:

1. hodnotu, která se objeví jednou, nalezenou přes **xor** a s konstantní pamětí navíc
2. kolik bitů `1` je v ní nastavených
3. `POW2 YES`, pokud je to mocnina dvou, jinak `POW2 NO` (`0` není)
4. hodnotu s vynulovaným nejnižším nastaveným bitem, nebo `0`, pokud žádný nemá

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` a `x ^ 0 == x` a xoru nezáleží na pořadí, v jakém se děje. To je celý první řádek. `x & (x - 1)` vynuluje nejnižší nastavený bit, což ti dá třetí a čtvrtý řádek zadarmo.

Lua 5.1 nemá bitové operátory — `^` je tu **umocňování** a `4 ^ 4` je `256`. Bity žijí v knihovně `bit`: `bit.bxor(a, b)`, `bit.band(a, b)`, `bit.bor`, `bit.lshift`, `bit.rshift`. Pracují s 32bitovými celými čísly a vracejí číslo se znaménkem, takže hodnota od `2^31` výš by se vrátila záporná; hodnoty tady jsou malé. Napiš smyčku na počítání bitů, protože právě na tu smyčku se ptají.

Čtyři případy tady mají nanejvýš pět čísel a hodiny na nich rychlost neměří: tabulka počtů projde každým, a stejně tak řazení. Ani větší případ by to nezměnil, protože laťka, kterou tahle otázka klade, je **paměť** — jeden akumulátor a nic jiného — a žádný časový limit nerozliší odpověď s konstantní pamětí od tabulky. Tohle je na tvém svědomí a na tazateli, který se zeptá.
'''
hints = [
  "Dvojice se samy vyruší, ať přijdou v jakémkoli pořadí, takže stačí jedno složení seznamu přes bit.bxor.",
  "Počítání bitů vynulováním nejnižšího pokaždé — walk = bit.band(walk, walk - 1) — proběhne jednou na nastavený bit, ne jednou na šířku.",
  "Mocnina dvou má nastavený přesně jeden bit, takže vynulování nejnižšího nechá nulu — a samotnou nulu je třeba vyloučit ručně.",
]

