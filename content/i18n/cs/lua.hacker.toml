id    = "lua.hacker.23.prefix-sums"
title = "Kolika způsoby trefit cíl"
story = "Noc tržeb, hodinu po hodině, a číslo, které chce vidět auditor výboru. Kolik úseků po sobě jdoucích hodin dá dohromady přesně tohle."
brief = '''
První řádek je `n k`. Druhý řádek je `n` celých čísel, která můžou být záporná.

Vypiš, kolik souvislých úseků má součet přesně `k`, pak `RANGE <s>`, součet celého seznamu, odečtený z posledního prefixového součtu, ne novým sčítáním.

```
input:  5 3
