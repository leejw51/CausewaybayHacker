[[quest]]
id    = "lua.hacker.30.range-queries"
title = "Součty, které se pořád mění"
story = "Tři sta tisíc pokladních operací z jedné noci napříč všemi stánky v parku, polovina z nich opravy, a někdo chce průběžné součty."
brief = '''
Standardní vstup je `n q seed`. Postav pole `n` hodnot a pak proveď `q` operací, vše ze stejného generátoru, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

Vypiš průběžný součet všech odpovědí na dotazy, pak `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**Složitost se tu vynucuje.** Velký skrytý případ je `n = 500000, q = 300000`. Starter je odpověď z uzlu 23: tabulka prefixových součtů, díky které je každý dotaz `O(1)` — a kterou každá aktualizace rozbije, takže ji starter staví znovu, `O(n)` na aktualizaci, sto padesát tisíckrát. Na tomhle stroji to trvalo **57 sekund** proti desetisekundovému limitu. (Sčítat rozsah obyčejnou smyčkou není co do druhu o nic lepší a v praxi jen o málo: je to `O(n)` na *dotaz* místo na aktualizaci a tady to trvalo asi 14 sekund.) Fenwickův strom udělá celou věc za pár setin sekundy. Všechno změřeno, s programy z tohohle questu.

(Verze tohohle questu v Rustu a Go spouštějí čtyři miliony operací. Tahle země si nechává pythonovských tři sta tisíc, protože případy jsou ty referenční — a pointa je oddělit správnou strukturu od špatné, ne jedno běhové prostředí od jiného.)

Lekce je ta, na kterou tazatel rybaří: *bodová aktualizace, součet rozsahu* je přesně ten tvar, pro který Fenwickův strom existuje. Tři krátké funkce — add, prefix a range jako rozdíl dvou prefixů — a `bit.band(i, -i)` je způsob, jak kráčet po nejnižším nastaveném bitu: knihovna `bit` bere `-i` jako 32bitové celé číslo ve dvojkovém doplňku, a díky tomu ten trik funguje.

Průběžný součet přesáhne `10^13`. Číslo v Lua drží každé celé číslo do `2^53` přesně a `print` ukáže všech čtrnáct číslic; to je rezerva, kterou máš, a vědět to je součást odpovědi.
'''
hints = [
  "Strom postav voláním add jednou na každou počáteční hodnotu. Stavba zdola nahoru v O(n) je pěkná optimalizace a hodiny ji netestují.",
  "bit.band(i, -i) izoluje nejnižší nastavený bit — knihovna bit vidí -i jako dvojkový doplněk. Jeho přičítání jde stromem nahoru; odečítání dolů.",
  "range(l, r) je prefix(r + 1) - prefix(l) a trefit tuhle dvojici chyb o jedničku je většina ladění. Navázat bit.band na lokální proměnnou je jediná mikrooptimalizace, kterou tenhle quest potřebuje, a LuaJIT ji skoro nepotřebuje.",
]

