        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

Přidej, zanoř se, **odeber**. Odebrání je ta část, kterou lidé vynechávají, a příznakem je, že každý řádek po prvním je moc dlouhý. V Lua je přidání `chosen[#chosen + 1] = v` a odebrání `chosen[#chosen] = nil` — přiřazení `nil` do poslední pozice je způsob, jak se posloupnost zkrátí, a `#chosen` ji následuje dolů. Žádné `itertools`, které by ti dalo podmnožiny v nějakém jiném pořadí, tu není; pořadí je vlastní pořadí rekurze, a právě to se kontroluje.
'''
hints = [
  "Dvě rekurzivní volání na prvek: jedno s ním přidaným, jedno bez něj. Nejdřív vezmi a pořadí z ukázky vyjde samo.",
  "chosen[#chosen] = nil patří mezi ta dvě volání. To je to `undo` v try-recurse-undo.",
  "Základní případ je at > #nums a prázdný výběr tam je prázdná podmnožina, která se pořád počítá — a vypíše se jako `-`.",
