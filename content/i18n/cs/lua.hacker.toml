[[quest]]
id    = "lua.hacker.33.grid-paths"
title = "Přes blok, nikdy zpátky"
story = "Mřížka Tai Hang se třemi uličkami zavřenými kvůli drakovi. Kolika způsoby se dá projít a která cesta je nejlevnější."
brief = '''
Standardní vstup je `r c pct seed`. Mřížku si postav sám, po řádcích, s losováním **dvou** hodnot pro každou buňku, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Pohybuj se jen **doprava** nebo **dolů**, volnými buňkami. Vypiš:

1. `PATHS <k>` — kolik různých tras vede z `(0,0)` do `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — nejmenší celkovou cenu trasy, včetně obou koncových bodů,
   nebo `-1`, pokud žádná trasa není

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

Jeden průchod po řádcích udělá obojí: trasy do buňky jsou součtem tras do ní shora a zleva a její nejlepší cena je její vlastní cena plus levnější z těch dvou. Protože se pohybuješ jen doprava nebo dolů, ty dvě buňky, které potřebuješ, jsou vždycky už hotové — a proto to nepotřebuje žádnou rekurzi ani množinu navštívených. Memoizovaná rekurze by v buňkách byla taky lineární a na případu `1000 × 1000` by byla taky dva tisíce rámců hluboká — shodou okolností pod stropem LuaJIT, ale smyčka je tu odpovědí z obvyklého důvodu: tvar problému je tabulka plněná popořadě.

Počet `PATHS` se bere modulo `1000000007` z obvyklého důvodu: na skrytém případu `1000 × 1000` má skutečné číslo přes šest set číslic a double by z něj dávno udělal `inf`. Redukuj při sčítání — dva sečtené zbytky zůstanou pod `2^31`, takže tohle je jediné místo na téhle cestě, kde obyčejné `+` a `%` stačí.

Nedosažitelná buňka **nemá** žádnou nejlepší cenu: `nil`, a `nil` se testuje přes `~= nil`, než se k němu cokoli přičte nebo se s ním cokoli porovná. Tabulka tabulek `1000 × 1000` je milion položek a LuaJIT to nevadí.

**Co velký případ vynucuje:** odmítne každou odpověď, která trasy vyjmenovává. Je jich víc, než je lampionů v parku.
'''
hints = [
  "Losuj obě hodnoty pro každou buňku, včetně obou rohů — generátor je nepřeskakuje, jen je odmítá zablokovat.",
  "Volná buňka bez volného souseda nahoře nebo vlevo je dosažitelná nula trasami a nemá žádnou nejlepší cenu; nil je to poctivé `unreachable` a `~= nil` je strážce, než porovnáš nebo přičteš.",
  "Cíl může být volný a přesto nedosažitelný, a to je přesně případ, kdy je PATHS 0 a MIN -1. Jeden ze skrytých případů je právě tohle.",
]

# ---------------------------------------------------------------- 33
[[quest]]
id    = "lua.hacker.34.stable-sort"
title = "Shody si drží místo"
story = "Dva běžci dokončili dračí okruh se stejným skóre a žebříček je při každém překreslení dá v jiném pořadí."
brief = '''
Standardní vstup je `n buckets seed`. Postav `n` jezdců, kde jezdec `i` má index `i` a skóre, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Seřaď jezdce podle skóre **sestupně**. Jezdci se stejným skóre si musí zachovat pořadí, v jakém přišli. Vypiš jejich indexy, oddělené mezerami, pak `TIES <k>` — kolik sousedních dvojic ve tvém seřazeném pořadí má stejné skóre.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` je malé, takže skoro všechno je shoda a odpověď je skoro celá rozhodnutá tím, co se s nimi stane.

**Tohle je quest o tom, vědět, které řazení držíš v ruce.** `table.sort` **není stabilní**. Je to quicksort, neslibuje nic o pořadí prvků, které se porovnají jako rovné, a ten neslib dodržuje: na ukázce, seřazené obyčejným `a.score > b.score`, vyjdou shody `5 1 6 0 4 3 2 7` — což dělá starter. Nic nevyhodí chybu. Odpověď je prostě jiná odpověď, na tomhle vstupu, a na skutečném vstupu jí bude vždycky.

Správná odpověď je tu jedna a je to ta, po které sáhnout ve výchozím stavu v každém jazyce: udělej porovnání **úplné**. Řaď podle `(-score, index)` — skóre sestupně, pak index vzestupně — takže se žádní dva jezdci nikdy neporovnají jako rovní a stabilita přestane být otázkou. Úplné pořadí nemá co dokazovat. (Ta druhá odpověď, kterou pythonovský pohovor přijme, „řazení je stabilní, opři se o to“, v téhle místnosti k dispozici není, a vědět to je celá pointa.)

Hodiny tu rychlost neměří a není tu nic, co by měřily: `table.sort` je `table.sort`, ať mu dáš jakýkoli komparátor. Tyhle čtyři případy rozhoduje výhradně to, co se stane se shodami.
'''
hints = [
  "Přidej do komparátoru druhou polovinu: když jsou skóre stejná, vrať a.index < b.index. To je celá oprava.",
  "Nikdy nepiš komparátor, který říká `<=` nebo vrací true oběma směry — `invalid order function for sorting` je table.sort, který ti říká, že to pořadí není pořadí.",
  "TIES počítá sousední stejná skóre v hotovém pořadí a ten počet je stejný, ať jsi napsal jakýkoli komparátor — prozradí tě pořadí indexů.",
]

