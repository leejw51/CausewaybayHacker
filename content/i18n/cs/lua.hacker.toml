| command | tokens | effect |
| --- | --- | --- |
| `ADD <cents>` | dva | přidá položku |
| `VOID` | jeden | odebere poslední položku, nebo nic neudělá, pokud žádná není |
| `TOTAL` | jeden | vypíše aktuální součet |
| `CLEAR` | jeden | odebere všechno |

Po `k` příkazech vypiš `COMMANDS <k>` a `ITEMS <how many are left>`.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` počítá příkazy a `ADD` je jeden příkaz ze dvou tokenů — takže smyčka, která proběhne `k`krát a v každém kole přečte jeden token, se zastaví na špatném místě. Přečti `k` příkazů a argument vytáhni jen tehdy, když ho příkaz má — a nástroj na „vytáhni další token, když o něj požádám“ je **iterátor**, který vrací `gmatch`: `local next_token = input:gmatch("%S+")` a každé `next_token()` je další token, nebo `nil`, jakmile je vstup vyčerpaný, takže konec vstupu je hodnota, a ne chyba.

`VOID` na prázdné pokladně i `TOTAL` dřív, než se cokoli přidalo, musí fungovat. V zadání není řádek, který by říkal, že se to stát nemůže, a ve skutečném testu je to mlčení specifikací. `items[#items] = nil` na prázdné tabulce zapíše `items[0] = nil`, což nic neudělá — Lua je tu shovívavá tam, kde jiné jazyky vyhodí chybu — a vědět, že je, a říct to, je odpověď, když se na to zeptají.
'''
hints = [
  "gmatch(\"%S+\") dělí na každém běhu mezer, tabulátorů a konců řádků, takže na zalomení v souboru přestane záležet v okamžiku, kdy přestaneš číst řádky.",
  "Argument ADD vytáhni uvnitř větve ADD, ze stejného iterátoru. Počítadlo smyčky počítá příkazy, ne tokeny.",
  "`if #items > 0 then items[#items] = nil end` je vyjmutí se strážcem — strážce je v Lua zadarmo a napsat ho stejně říká, že jsi ten případ viděl.",
]

