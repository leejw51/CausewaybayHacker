# ---------------------------------------------------------------- 16
[[quest]]
id    = "lua.hacker.16.union-find"
title = "Kdo je spojený s kým"
story = "Tramvaj, MTR a trasy minibusů na jednom listu a každá ulička, kterou drak dnes v noci zavře. Kolik oddělených sítí tam doopravdy je."
brief = '''
Standardní vstup je `n m seed`: `n` zastávek očíslovaných `0..n-1`, `m` neorientovaných spojů. Ve vstupu žádné spoje nejsou — postavíš je sám, **přesně** tímhle generátorem, v 64bitové aritmetice, která přetéká dokola:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

Vypiš tři řádky: kolik je oddělených sítí, velikost největší a `REDUNDANT <k>` — kolik spojů spojilo dvě zastávky, které už spojené byly. Spoj ze zastávky do sebe samé je jeden z nich.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

Pro `8 5 1` je pět spojů `6—1`, `4—6`, `2—3`, `2—6`, `1—2`. Poslední spojuje dvě zastávky, které už jsou ve stejné síti, takže je to ten nadbytečný, a zbude `{1,2,3,4,6}` plus zastávky `0`, `5` a `7` samy o sobě.

Číslo v Lua je double a double drží 53 bitů: vynásob v něm dvě z těch konstant a dolní bity jsou pryč dřív, než dojde na `+`. LuaJIT má typ, ve kterém je zadání napsané. `0ULL + seed` je neznaménkové 64bitové celé číslo, `*` a `+` na něm přetékají dokola na `2^64` — žádná maska, ten typ *je* maska — `bit.rshift(x, 33)` ho vezme a `tonumber(...)` vrátí 31bitový výsledek zpátky na obyčejné číslo, se kterým je `%` spokojené. Každý velký případ na téhle cestě používá tentýž čtyřřádkový generátor.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000` s `m = 200000` spoji. Ta zřejmá odpověď, která není union-find — projdi síť od `a` a podívej se, jestli v ní už `b` je, jednou na spoj — je správná a je `O(n)` na spoj, tedy celkem `O(n·m)`: na tomhle stroji nedoběhla ani po **25 sekundách**, proti desetisekundovému limitu. To je starter. Union-find s kompresí cesty a sjednocením podle velikosti udělá týchž 200000 spojů za **0.01 sekundy**, změřeno tady s řešením, které je součástí tohohle questu.

Stojí za to to vidět jasně, protože je to nejčastější způsob, jak neprojít časovaným testem: **starter není špatně.** Na ukázce i na obou malých skrytých případech vypíše přesně správnou odpověď. Je odmítnutý jen proto, že přijde mnohem pozdě.

Union-find: každá zastávka ukazuje na rodiče, `find` dojde ke kořeni, `union` nasměruje jeden kořen na druhý. Komprimuj cestu při návratu z `find` a celé je to v praxi konstantní čas na dotaz.

Napiš `find` jako smyčku. Rekurzivní je učebnicová verze a na řetězu dlouhém dvacet tisíc je to `stack overflow` — což je přesně ten tvar, kterému má sjednocení podle velikosti zabránit, a přesně ten tvar, který má nepřátelský vstup, než ho první `find` vůbec zkomprimuje.
'''
hints = [
  "Losuj oba konce průběžně — jeden krok generátoru na každý, v tomhle pořadí — místo abys nejdřív stavěl seznam spojů. Nic tady spoje nepotřebuje dvakrát.",
  "Začni s každou zastávkou jako vlastním rodičem a n skupinami; každé úspěšné sjednocení počet sníží o jednu. Potom má smysl jen položka velikosti u kořene, takže největší čti z kořenů, ne z každého indexu.",
  "Spoj, jehož oba konce už mají stejný kořen, je ten nadbytečný — spočítej ho a jdi dál. Spoj na sebe, a == b, z toho testu vypadne sám.",
  "parent[v], v = root, parent[v] komprimuje na jednom řádku: Lua vyhodnotí celou pravou stranu, než cokoli přiřadí, takže staré parent[v] se přečte dřív, než se přepíše.",
]

