Dvě věci tenhle jazyk rozhoduje jinak. Generátor běží v 64bitovém celém čísle LuaJIT — `0ULL + seed` a konstanty s `ULL` na konci — protože obyčejné číslo je double a součin by ztratil dolní bity; `tonumber(bit.rshift(x, 33))` vrátí každé losování zpátky na číslo. A odpověď, `9990744366`, je nad `2^32` a hluboko pod `2^53`, takže ji double drží přesně a `print` ukáže každou číslici; říct, *proč* je to bezpečné a kde by to přestalo být, je součást odpovědi.
