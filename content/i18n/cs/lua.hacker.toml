[[quest]]
id    = "lua.hacker.31.palindrome"
title = "Stejně pozpátku"
story = "Otázka z první dvacítky, v nějaké podobě položená ve většině testů, a ta, kterou většina lidí jednou napsala a nikdy nepochopila. Drak se čte stejně od ocasu, říká tazatel, a neusměje se."
brief = '''
Standardní vstup je `n alphabet seed`. Řetězec si postav sám, v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

Vypiš délku nejdelšího palindromického podřetězce, pak `AT <index>` — začátek **nejlevějšího** podřetězce té délky, počítaný od 0.

```
input:  12 3 5
output: 5
        AT 1
```

Rozšiřuj kolem každého středu. Středů je `2n - 1`, ne `n`: každý znak je středem pro palindromy liché délky a každá mezera mezi dvěma znaky je středem pro ty sudé délky. Zapomenout na mezery je důvod, proč správně vypadající řešení vrátí na `abba` `1` — a přesně to starter dělá.

Řetězec jako řetězec nikdy nepotřebuješ. Drž losování v tabulce malých čísel — `s[i] = next() % alphabet` — a porovnávej čísla; `..` na dvaceti tisících jednoznakových řetězců nejdřív vyrobí dvacet tisíc řetězců. Tabulka je od 1 a `AT` ze zadání je od 0, takže index, který vypíšeš, je o jedna menší než index, který jsi našel.

**Co testy vynucují a co ne**, na rovinu. Skrytý případ, který dělá tu práci, je `n = 8000` nad **jednopísmennou** abecedou. Je to nejhorší případ pro rozšiřování kolem středu — každý střed doběhne až na konec řetězce — takže správná odpověď tam udělá svých celých `O(n²)`, třicet dva milionů porovnání, a LuaJIT je udělá za pár setin sekundy. Zároveň odmítne zkontroluj-každý-podřetězec-a-otestuj-každý, což je kubické — tady řádově `10^11` porovnání — a daleko za desetisekundovým limitem.

Druhý velký případ, `n = 20000` nad dvoupísmennou abecedou, je případ **správnosti**, ne rychlosti: na náhodném binárním řetězci test palindromu selže po znaku nebo dvou. Kontroluje, že tvůj generátor a tvoje rozhodnutí shody podle nejlevějšího indexu souhlasí s našimi ve velkém.

Takže: testy odmítnou kubické a přijmou kvadratické. **Nevyžadují** Manacherův algoritmus, který je odpovědí `O(n)`. Věz, že existuje a co dělá, protože „a umíš to líp než kvadraticky?“ je navazující otázka, kterou tahle otázka obvykle připravuje.
'''
hints = [
  "Dvě rozšiřování na střed: (c, c) pro liché délky a (c, c + 1) pro sudé. Starteru chybí to druhé.",
  "Když se smyčka zastaví, i a j se oba posunuly o jedno za palindrom — takže jeho délka je j - i - 1 a v tabulce od 1 je i už ten začátek od 0.",
  "Aktualizuj jen při ostře delším palindromu a nejlevější z každé délky je ten, který si necháš, což je to, na co se AT ptá. s[0] je nil, ne přetočený znak, a nil == s[j] je prostě nepravda — kontrola `i >= 1` je pořád ta poctivá, kterou napsat.",
]

# ---------------------------------------------------------------- 31
[[quest]]
id    = "lua.hacker.32.modular"
title = "Modulo miliarda a sedm"
story = "Ta fráze se objeví na konci zadání a půlka místnosti neví, o co ji žádá. V téhle místnosti žádá ještě o jednu věc: číslo, které drží padesát tři bitů, vynásobené dvakrát."
brief = '''
Standardní vstup je `n q seed`. Vygeneruj `q` dotazů v 64bitové aritmetice, která přetéká dokola (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

Pro každý dotaz spočítej kombinační číslo `C(a, b)` **modulo 1000000007**. Vypiš součet všech `q` odpovědí, sám modulo `1000000007`, pak `LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` má v těchto velikostech stovky tisíc číslic a nic v Lua ho neudrží. Každé násobení se redukuje průběžně. Problém je dělení: `a! / (b! (a-b)!)` v modulární aritmetice nemá smysl. Nahrazuje ho **modulární inverze** a protože `1000000007` je prvočíslo, dá ti ji malá Fermatova věta: `inverse(v) = v^(p-2) mod p`, opakovaným umocňováním na druhou — `^` je tu mocnina v plovoucí čárce a tohle neumí, takže smyčka je tvoje.

Takže: jednou předpočítej `factorial[0..n]` a na každý dotaz odpověz jako `f[a] * inv(f[b]) * inv(f[a-b])`.

**A samotné násobení je v tomhle jazyce ta past.** Dva zbytky jsou každý pod `2^30`; jejich součin je pod `2^60` a číslo v Lua je double, který drží `2^53`. `(a * b) % P` je za tou hranicí špatně — žádná chyba, žádné přetečení, jen pryč dolní bity a zbytek, který je trochu vedle. Poctivý `mulmod` rozdělí jeden činitel na horní a dolní 16bitovou polovinu, takže každý dílčí součin zůstane pod `2^46`, a mezi polovinami redukuje. Je to pět řádků a starter ho nese; každý součin na tomhle uzlu jde přes něj.

**Složitost se tu vynucuje.** Jeden skrytý případ je `n = 200000`, `q = 200000`. Počítat každé kombinační číslo nezávisle — vynásobit `b` členů, vydělit `b` členy, jedna modulární inverze na každý — nedoběhlo ani po **25 sekundách** proti desetisekundovému limitu; to je starter. Jedna sdílená tabulka faktoriálů s inverzními faktoriály předpočítanými pozpátku z jednoho `powmod` odpoví na každý dotaz dvěma `mulmod` a doběhne za pár setin sekundy. Obojí změřeno na tomhle stroji.
'''
hints = [
  "Redukuj po každém násobení a násob jen přes mulmod: obyčejné a * b dvou zbytků je za 2^53 a potichu špatně.",
  "powmod(v, P - 2) je modulární inverze a funguje jen proto, že P je prvočíslo — to je tady celý obsah malé Fermatovy věty.",
  "Předpočítej i inverzní faktoriály, pozpátku od powmod(factorial[n], P - 2): inv_factorial[i - 1] = inv_factorial[i] * i. Pak je dotaz dva mulmody a žádný powmod.",
]

