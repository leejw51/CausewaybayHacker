[[quest]]
id    = "rust.basic.12.str-and-string"
title = "První otázka"
story = "Každý pohovor na Rust v Hongkongu jí začíná a Mei na ni už dvakrát odpověděla špatně."
brief = '''
Přečti jeden řádek. Vypiš tři řádky:

