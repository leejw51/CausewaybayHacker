# ---------------------------------------------------------------- 15
[[quest]]
id    = "rust.basic.15.sort-by"
title = "Tabulka výsledků"
story = "Herna v Times Square vyvěsí den: nejvyšší skóre první, a když dva remizují, ten, jehož jméno je dřív. Druhá tabule je podle délky jména."
brief = '''
`sort_by` bere porovnávací closure, která vrací `Ordering`. `b.cmp(&a)` je
sestupně; `.then_with(|| …)` rozhodne shodu druhým porovnáním.
`sort_by_key` řadí podle toho, co closure vytáhne, vzestupně, a obojí je
**stabilní**: stejné klíče si zachovají pořadí. Pro floaty, které `cmp`
nemají, je to `a.partial_cmp(b).unwrap()`.

```
rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));
by_len.sort_by_key(|r| r.0.len());
```

Napiš ta dvě řazení na místa komentářů `// FILL`. `by_len` je clone
udělaný před prvním řazením, takže jeho shody jsou v pořadí vstupu.

```
input:  MEI 90
        BO 95
        ALEX 90
output: BO ALEX MEI
        BO MEI ALEX
```
'''
hints = [
  "rows.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0))); a by_len.sort_by_key(|r| r.0.len());",
  "b před a v cmp je to, co dělá řazení sestupným. cmp bere referenci, proto &a.1. then_with se spustí jen tehdy, když první porovnání dá Equal.",
]

