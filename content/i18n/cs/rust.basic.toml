[[quest]]
id    = "rust.basic.22.reverse"
title = "Tramvaj pozpátku"
story = "Tramvaj na Yee Wo Street projíždí na konci trati své zastávky zpátky, kudy přijela, a seznam v depu se pořád čte popředu."
brief = '''
`Vec` se obrací na místě: `v.reverse()` a hotovo, žádná kopie. Řetězec se
po znacích indexovat nedá, takže se obrací přes svůj iterátor:
`s.chars().rev()` ho projde pozpátku a `collect::<String>()` postaví z
toho, co vydá, nový řetězec.

```
v.reverse();
let rev: String = s.chars().rev().collect();
```

`v` je první řádek a `s` druhý. Napiš ty dva řádky místo dvou zástupných
řádků.

```
input:  1 2 3
        tram
output: 3 2 1
        mart
```
'''
hints = [
  "v.reverse(); a potom let rev: String = s.chars().rev().collect();",
  "reverse() mění v tam, kde je; chars().rev().collect() vyrobí nový String a s nechá na pokoji.",
]
