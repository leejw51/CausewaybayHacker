[[quest]]
id    = "rust.basic.17.testing"
title = "Dokaž si to sám"
story = "V 06:40 ti to nikdo nezkontroluje. Tabulka je přímo tady; udělej ji zelenou."
brief = '''
Program drží tabulku čtyř ověřených dvojic `(km, fare)` a kontroluje `fare`
proti každé z nich; vypisuje `<name> ok` nebo
`<name> FAIL got <g> want <w>`, potom `PASSED <k>/4`. Nakonec přečte ze
standardního vstupu jednu vzdálenost a vypíše `FARE <x>`.

`fare(km)` má být `500 + 100 * km`. Ta ve startovním kódu je špatně a tabulka
to chytí — což je celý smysl.

```
input:  4
output: zero ok
        one ok
        four ok
        ten ok
        PASSED 4/4
        FARE 900
```

