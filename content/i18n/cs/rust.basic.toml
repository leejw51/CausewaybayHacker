# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.basic.01.the-move"
title = "Jeden vlastník"
story = "06:40 nad Jardine's Bazaar. Na pultu jedna účtenka a na ní pravidlo celé ulice: věc má jednoho vlastníka, a kdo ji předá, ten ji předal."
brief = '''
`String` má právě jednoho vlastníka. `let kept = receipt;` ho nekopíruje:
**přesune** ho, a od toho řádku `receipt` není jméno, které smíš použít —
kompilátor odmítne s E0382, borrow of moved value. Hodnota je tam, kam
odešla, pod novým jménem.

```
let kept = receipt;
```

Účtenka je vytvořená a oba `println!` jsou napsané. Napiš přesun na místo
komentáře `// FILL`, aby `kept` vlastnil ten řetězec.

```
output: one receipt, one owner
        22
```
'''
hints = [
  "let kept = receipt; — let se starým jménem vpravo.",
  "Žádný clone: řetězec se nekopíruje, mění majitele. Použít receipt za tímhle řádkem je E0382.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.basic.02.borrow"
title = "Jen se dívám"
story = "Tramvajová zastávka na Percival Street. Průvodčí přečte každé jméno ze seznamu a seznam hned vrátí; nikdy ho nevlastnil nikdo jiný než kancelář."
brief = '''
`&` půjčuje. Funkce, která bere `name: &str`, se na řetězec jen *dívá*;
volající si ho nechá a může ho použít i potom. `&names[i]` je výpůjčka
jednoho prvku a `&String` se při volání sám změní na `&str`.

```
total += width(&names[i]);
```

`width` i oba `println!` jsou napsané. Napiš volání na místo komentáře
`// FILL` a každé jméno půjč přes `&`. Druhý řádek dokazuje, že jména jsou
po cyklu pořád tvoje.

```
input:  MEI
        BO
        ALEX
output: 9
        MEI,BO,ALEX
```
'''
hints = [
  "total += width(&names[i]); — ampersand patří k argumentu.",
  "width chce &str; &String se na něj při volání převede sám, takže &names[i] stačí.",
]

