id    = "rust.basic.11.match"
title = "Tvar čísla"
story = "Brána ve Victoria Parku třídí čísla lístků: nula, jedna číslice, sudé, liché. Čtyři ramena a nic nepropadne."
brief = '''
`match` musí pokrýt každý případ a jeho ramena jsou vzory: literál, rozsah
