[[quest]]
id    = "rust.basic.08.chars-bytes"
title = "Písmena a číslice"
story = "Kód skříňky ve Victoria Parku: písmena a číslice vperemíchané. Obsluha sečte číslice a vykřikne první písmeno."
brief = '''
`&str` jsou bajty; `.chars()` ho prochází jako znaky a `.bytes()` /
`.as_bytes()` jako `u8`. `c.to_digit(10)` promění znak číslice v
`Some(number)` a cokoli jiného v `None`, takže `filter_map` si nechá jen
číslice. Bajty jsou čísla: `b'a'` je 97 a aritmetika s písmeny je
`(byte - b'a' + b'A') as char`.

```
let digits: Vec<u32> = code.chars().filter_map(|c| c.to_digit(10)).collect();
let first = (code.as_bytes()[0] - b'a' + b'A') as char;
```

Napiš ty dva řádky na místa komentářů `// FILL`. Kód vždycky začíná malým
písmenem.

```
input:  a1b2c3
output: 6
        A
```
'''
hints = [
  "code.chars().filter_map(|c| c.to_digit(10)).collect() — pak (code.as_bytes()[0] - b'a' + b'A') as char.",
  "to_digit vrací Option<u32>; filter_map zahodí ty None. Bajt minus b'a' je pro a nula a přičtení b'A' přistane na velkém písmenu.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.basic.09.option"
title = "Možná nic"
story = "Nástěnka v Times Square za klidného rána. Nejvyšší nabídka tam být nemusí a sudé číslo lístku taky ne; tabule to musí říct, ne hádat."
brief = '''
`Option<T>` je `Some(value)` nebo `None` a kompilátor tě donutí říct, co se
stane při `None`. `if let Some(m) = …` spustí blok jen tehdy, když hodnota
je. `.unwrap_or(0)` dá výchozí hodnotu. `.find(…)` vrátí první shodu jako
`Option<&T>` a `.copied()` promění `Option<&i64>` v `Option<i64>`.

```
if let Some(m) = nums.iter().max() { println!("MAX {}", m); }
let even = nums.iter().find(|&&x| x % 2 == 0).copied().unwrap_or(0);
```

Napiš ty dva řádky na místa komentářů `// FILL`. Při prázdném vstupu první
nevypíše nic a druhý vypíše `0`.

```
input:  3 5 8 1
output: MAX 8
        8
```
'''
hints = [
  "if let Some(m) = nums.iter().max() { println!(\"MAX {}\", m); } a pak find(...).copied().unwrap_or(0).",
  "max() na prázdném iterátoru je None a if let prostě přeskočí. find vrací Option<&i64>; copied() z toho udělá Option<i64>, aby unwrap_or(0) sedělo typově.",
]

