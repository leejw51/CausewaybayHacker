[[quest]]
id    = "rust.basic.15.modules"
title = "Kdo to smí vidět"
story = "Tabulka jízdného prosákla do tří souborů a ve dvou z nich ji někdo změnil. Dej ji za dveře."
brief = '''
Na standardním vstupu je počet `n` a potom `n` vzdáleností v km.

Uspořádej logiku jízdného do modulu:

* `mod fares` s **veřejnou** `adult(km) -> i64` a **soukromou** `base(km)`,
  kterou `adult` volá — `500 + 100 * km`
* vnořený `mod fares::pass` s veřejnou `monthly() -> i64`, která vrací `50000`

Vypiš jedno jízdné pro dospělého na každou vzdálenost, potom `MONTHLY <x>`.

```
input:  3
        1 2 3
output: 600
        700
        800
        MONTHLY 50000
```

Startovní kód se nezkompiluje: položky existují, ale nic není `pub`, a obsah
modulu je ve výchozím stavu soukromý. Ten výchozí stav je ta funkce —
`base` není součástí rozhraní a kompilátor je to, co to tak udrží. Vnořený
modul potřebuje vlastní `pub` na řádku s `mod`, ne jen na funkci uvnitř.
'''
hints = [
  "Chyba je E0603: položka existuje, jen je soukromá. Tři klíčová slova pub opraví celý soubor.",
  "base zůstává soukromá schválně — je to jediná věc tady, do které nikomu jinému nic není.",
  "Zveřejnění funkce nezveřejní dveře: `mod pass` potřebuje pub taky.",
]

# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.basic.16.smart-pointers"
title = "Velikost, kterou kompilátor umí pojmenovat"
story = "Napichovák na účtenky v Lucky Mac: každý lístek napíchnutý na ten pod ním, až dolů k pultu."
brief = '''
Na standardním vstupu je počet `n` a potom `n` částek v centech.

Drž je v řetězu, jeden uzel na částku, v pořadí, v jakém přišly:

```
struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}
```

Vypiš tři řádky:

1. částky v pořadí, oddělené mezerou, nebo `-`, pokud žádné nejsou
2. `SUM <total>`, z **rekurzivní** funkce přes řetěz
3. `LAST <cents>` — částku na posledním uzlu — nebo `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

Startovní kód se nezkompiluje a ta chyba je důvod, proč `Box` existuje. Napiš
`next: Option<Entry>` a kompilátor musí rozložit `Entry` v paměti: potřebuje
`8` bajtů pro `cents` plus tolik, kolik je velký `Entry` — což je právě to,
co se snaží spočítat. E0072, *recursive type has infinite size*.

`Box<Entry>` je ukazatel na alokaci na haldě a ukazatel má velikost, kterou
kompilátor už zná. Vlastní to, na co ukazuje: přesně jeden vlastník, uvolněno,
když je `Box` zahozen, žádné počítání a nic sdíleného. `Option<Box<Entry>>`
je konec řetězu i uzel v něm, v jedné hodnotě velikosti ukazatele — `None` se
uloží jako nulová adresa, ne jako bajt navíc se značkou, takže oproti
samotnému `Box` nestojí nic.
'''
hints = [
  "Chybu kompilace opraví jedno slovo: z Option<Entry> se stane Option<Box<Entry>> a konstruktor dostane Box::new.",
  "Stav to odzadu — projdi částky v obráceném pořadí a každému novému uzlu dej jako next řetěz, který už máš. Stavění odpředu potřebuje kurzor na konec, a to je boj s výpůjčkami, který zatím nepotřebuješ.",
  "Pro průchod bez spotřebování drž Option<&Box<Entry>>: head.as_ref() na začátek a entry.next.as_ref() na krok. .as_ref() promění &Option<T> v Option<&T>, což je ten tah, který řetěz nechá celý.",
  "Rekurzivní součet nepotřebuje žádné mut ani smyčku: Some(entry) => entry.cents + sum(&entry.next), None => 0.",
]

