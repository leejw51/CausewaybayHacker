[[quest]]
id    = "rust.basic.16.heap-reverse"
title = "Nejmenší první"
story = "Okénko s dim sum v Times Square vyvolává nejnižší lístek první. Hromádka je halda a halda v Rustu vydává největší, pokud jí neřekneš jinak."
brief = '''
`BinaryHeap` je max-halda: `pop()` dá největší. Když každou hodnotu obalíš
do `std::cmp::Reverse`, pořadí se otočí, takže `BinaryHeap<Reverse<i64>>`
vydává nejmenší — min-haldu, kterou chce každá otázka na nejkratší cestu
a na k nejmenších. `while let Some(Reverse(x)) = heap.pop()` rozbaluje,
zatímco vyprazdňuje.

```
heap.push(Reverse(x));
while let Some(Reverse(x)) = heap.pop() { out.push(x); }
```

Napiš push a vyprázdnění na místa komentářů `// FILL`.

```
input:  5 1 9 3
output: 1 3 5 9
```
'''
hints = [
  "heap.push(Reverse(x)); pak while let Some(Reverse(x)) = heap.pop() { out.push(x); }",
  "Reverse je n-ticová struktura, takže Reverse(x) při push obaluje a ve vzoru rozkládá. Bez ní by výstup šel od největšího.",
]

# ---------------------------------------------------------------- 17
[[quest]]
id    = "rust.basic.17.derive-ord"
title = "Porovnáno pole po poli"
story = "Jízdné na tabuli na Percival Street, seřazené podle zóny a pak podle ceny. Porovnání nikdo nepíše; kompilátor dostane pokyn, ať ho napíše sám."
brief = '''
`sort()`, `max()`, `BinaryHeap` i `==` potřebují, aby typ implementoval
porovnávací traity. `#[derive(…)]` je pro strukturu napíše a porovnává
**pole po poli v pořadí deklarace**: `PartialEq, Eq` pro `==`,
`PartialOrd, Ord` pro `<` a řazení, `Clone` pro `.clone()`, `Debug`
pro `{:?}`.

```
#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord)]
```

Napiš ten atribut na místo komentáře `// FILL`, na řádek nad
