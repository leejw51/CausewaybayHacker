[[quest]]
id    = "rust.basic.03.mut-borrow"
title = "Půjčeno ke změně"
story = "Kiosek Lucky Mac zvedne každou cenu na tabuli o stejnou částku. Tabule nikdy neopustí zeď; ruka, která ji mění, je vypůjčená."
brief = '''
`&mut` půjčuje ke změně. Funkce, která bere `prices: &mut Vec<i64>`, může
měnit vektor volajícího na místě; volající při volání napíše `&mut prices`
a samo `prices` musí být `let mut`. Uvnitř `iter_mut()` rozdává `&mut i64`
a `*p` je číslo za jedním z nich.

```
*p += by;
bump(&mut prices, by);
```

`bump` i výpis jsou napsané. Napiš ty dva řádky na místa komentářů
`// FILL`: změnu uvnitř `bump` a volání, které vektor půjčí.

```
input:  3
        10 20 30
output: 13 23 33
```
'''
hints = [
  "*p += by; uvnitř cyklu, pak bump(&mut prices, by); v main.",
  "p je &mut i64: hvězdička sahá skrz něj. Volání potřebuje &mut, ne &, a prices bylo deklarováno jako mut právě kvůli tomu.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.basic.04.clone"
title = "Druhá kopie"
story = "Dva seznamy v Hysan Place: ten, který si vede vrátný v pořadí příchodu, a ten, který řadí vedoucí. Řazení toho vedoucího se nesmí dotknout toho vrátného."
brief = '''
Přesun nechá jednoho vlastníka. Když potřebuješ dva, `.clone()` udělá
hlubokou kopii a od té chvíle jsou obě nezávislé. Malé obyčejné hodnoty —
`i64`, `bool`, `char`, `f64`, n-tice z nich — jsou `Copy`: `let b = a;`
je zkopíruje a `a` zůstane použitelné bez jakéhokoli clone.

```
let mut sorted = names.clone();
```

Jména jsou načtená, `sorted.sort()` i oba `println!` jsou napsané. Napiš
clone na místo komentáře `// FILL`, aby původní pořadí přežilo.

```
input:  MEI BO ALEX
output: MEI BO ALEX
        ALEX BO MEI
```
'''
hints = [
  "let mut sorted = names.clone(); — mut, protože sort() ho mění na místě.",
  "let mut sorted = names; by se zkompilovalo taky, a pak je names pryč a první println! je E0382.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.basic.05.exchange"
title = "Výměna"
story = "Dvě pokladny v Jardine's Bazaar si při střídání směn vymění zásuvky a stará zásuvka se vytáhne a na její místo se zasune prázdná. Nic se nekopíruje; věci mění majitele."
brief = '''
`std::mem` vyměňuje hodnoty, aniž by je kopíroval. `swap(&mut a, &mut b)`
prohodí, co drží dvě jména. `take(&mut a)` hodnotu přesune ven a nechá
na jejím místě výchozí hodnotu typu — prázdný `String`, prázdný `Vec`, `0` —
takže můžeš vlastnit něco, co žije uvnitř `&mut`. `replace(&mut a, v)` je
totéž, jen na místě zůstane hodnota podle tvé volby.

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

Do `a` a `b` se načtou dva řádky. Napiš swap a take na místa komentářů
`// FILL`.

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
hints = [
  "std::mem::swap(&mut a, &mut b); pak let taken = std::mem::take(&mut a);",
  "Obojí bere &mut: hodnoty zůstanou, kde jsou, a přesouvá se jen obsah. Po take je a prázdný String, ne přesunutý pryč — pořád se dá použít.",
]

