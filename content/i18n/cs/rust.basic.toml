[[quest]]
id    = "rust.basic.14.matching"
title = "Tvar té věci"
story = "Rozvážková aplikace bere čtyři příkazy a starý kód je kontroloval devíti vnořenými ify."
brief = '''
Na standardním vstupu je počet `n` a potom `n` řádků, každý `<COMMAND>` nebo
`<COMMAND> <ARG>`.

Pro každý řádek vypiš:

* `FORWARD <n>` pro `GO <n>` s `n` větším než nula
* `STAY` pro `GO <n>` s `n` rovným nule nebo menším
* `HALT` pro `STOP`
* `UNKNOWN <COMMAND>` pro cokoli jiného

Potom vypiš `MOVED <total>`, součet všeho, o co jsi popojel dopředu.

```
input:  4
        GO 3
        GO -1
        STOP
        JUMP 9
output: FORWARD 3
        STAY
        HALT
        UNKNOWN JUMP
        MOVED 3
```

Jeden `match` nad rozděleným řádkem, se **strážní podmínkou** na větvi `GO`,
která oba případy oddělí bez druhého větvení. Vzor nad řezem —
`["GO", arg]` — udělá z počtu prvků řádku součást vzoru, místo kontroly
délky, kterou bys psal ručně.
'''
hints = [
  "parts.as_slice() je to, co z Vec udělá něco, s čím se dá porovnat vzor nad řezem.",
  "`if` za vzorem je strážní podmínka match — odděluje dvě větve, které mají stejný tvar.",
  "`[command, ..]` naváže první prvek a zbytek ignoruje; `[]` je prázdný řádek, který musíš pokrýt taky.",
]

