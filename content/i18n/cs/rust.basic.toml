```
input:  12
output: EVEN
```
'''
hints = [
  "0 => \"ZERO\", 1..=9 => \"ONE DIGIT\", x if x % 2 == 0 => \"EVEN\", _ => \"ODD\",",
  "Rameno s podmínkou dej před _, jinak se nikdy nespustí. 1..=9 je uzavřené na obou koncích; 1..9 by devítku nechalo na podmínku.",
