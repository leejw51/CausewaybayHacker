[[quest]]
id    = "rust.basic.13.fold-zip-windows"
title = "Dvojice, běhy a průběžný součet"
story = "Počítadlo tramvají na Percival Street čte den počtů: kolik hodin stouplo oproti hodině předtím, součin všech a každý počet s hodinou vedle sebe."
