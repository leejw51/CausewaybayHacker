[[quest]]
id    = "rust.basic.12.iterator-chain"
title = "Jedním průchodem po Yee Wo Street"
story = "Yee Wo Street, jedna procházka: nech si sudé výlohy, umocni jejich čísla na druhou a sečti všechno nad deset. Žádný index, žádný druhý cyklus."
brief = '''
Řetězec iterátorů se čte zleva doprava: `.iter()` prochází vektor,
`.filter(|&&x| …)` si nechá, k čemu closure řekne ano, `.map(|x| …)`
transformuje a závěrečné `.collect()` nebo `.sum()` z toho udělá hodnotu.
Dokud nepřijde to poslední volání, nic neběží. `iter()` dává `&i64`
a `filter` vidí referenci na to, proto vzor `&&x`, který dosáhne na číslo.

```
let squares: Vec<i64> = nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect();
let big: i64 = nums.iter().filter(|&&x| x > 10).sum();
```

Napiš ty dva řádky na místa komentářů `// FILL`.

```
input:  1 2 3 4 11 20
output: 4 16 400
        31
```
'''
hints = [
  "nums.iter().filter(|&&x| x % 2 == 0).map(|x| x * x).collect() — a .filter(|&&x| x > 10).sum() pro ten druhý.",
  "Typ u let je to, co říká collect() a sum(), co mají postavit; bez Vec<i64> a i64 je kompilátor neodvodí.",
]

