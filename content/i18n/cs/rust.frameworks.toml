  "Slučuj přes `entry`: `let e = shared.entry(merchant).or_insert((0, 0)); e.0 += cents; e.1 += count;` — jeden `lock()` na pokladnu, vzatý až po dokončení lokální mapy, takže zámek se drží na slučování a na nic jiného.",
  "`let mut shared = ledger.lock();`, potom smyčka `for (merchant, (cents, count)) in local`; strážce je lokální proměnná a zahodí se, když uzávěra vlákna skončí.",
