  "Zaokrouhlení nahoru v celých číslech je `(x + 999) / 1000`, ne `x / 1000`. Startovní kód zaokrouhluje dolů a skryté případy mají částky, jejichž 1,5 % není celý cent.",
  "Paralelní `collect()` do `Vec` zachová pořadí vstupu, ale zadání chce pořadí karet: `fees.par_sort_unstable()` (nebo prosté `sort()`) před výpisovou smyčkou, která zůstává sekvenční.",
