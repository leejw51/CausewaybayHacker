Každý producent je vlákno, které posílá své dobré lístky, jednu zprávu na
každý, **jedním** kanálem `crossbeam::channel::bounded(4)`. Jeden konzument —
hlavní vlákno — čte kanál přes `for msg in rx`, dokud není každý odesílatel
pryč, a potom vypíše:

* `MESSAGES <n>` — přijaté zprávy
* `TOTAL <sum of cents>`
* `LARGEST <CARD> <CENTS>` — jediný největší lístek; při shodě menší id karty
  (řetězcové pořadí). Bez zpráv `LARGEST -`.

```
