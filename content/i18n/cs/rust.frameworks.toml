Použij `chrono::NaiveDate`: `parse_from_str` na čtení, `weekday()` na test,
`checked_add_days` na krok, `signed_duration_since(...).num_days()` na rozdíl
a `format` na výpis. Nikdy nečti hodiny. Startovní kód má vlastní tabulku
měsíců a vlastní vzorec na den v týdnu a jedno z toho je v přestupných letech
špatně.
'''
hints = [
  "`use chrono::{Datelike, Days, NaiveDate, Weekday};` — `weekday()` pochází z traitu `Datelike`, takže bez toho importu neexistuje.",
  "`NaiveDate::parse_from_str(text, \"%Y-%m-%d\")` je `Result`; je `Err` pro `2026-02-29` i `2026-04-31` stejně jako pro `yesterday`, takže jeden `match` pokryje každý špatný řádek.",
  "Krokuj přes `date.checked_add_days(Days::new(1)).unwrap()`, dokud `!matches!(day.weekday(), Weekday::Sat | Weekday::Sun)`; rozdíl je `settles.signed_duration_since(value).num_days()`.",
  "`value.format(\"%d %b %Y %a\")` vypíše `02 Oct 2026 Fri` rovnou do `println!` — `%a` je třípísmenný název dne v týdnu.",
