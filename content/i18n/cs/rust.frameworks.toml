# ---------------------------------------------------------------- 01
[[quest]]
id    = "rust.frameworks.01.anyhow-context"
title = "Jeden otazník"
story = "První ráno zpátky na platební cestě. Čtečka zúčtování u Gloucester Road umře na řádku 3 souboru o 4 000 řádcích a řekne jen „invalid digit found in string“."
brief = '''
Čti ze standardního vstupu řádky `<ACCOUNT> <CENTS>` a vypiš součet v centech
jako `TOTAL <n>`.

Pokud řádek nemá dvě pole, nebo se centy nedají naparsovat jako `i64`, vypiš
místo toho jediný řádek a skonči normálně:

```
ERROR: line 3: invalid digit found in string
```

To je vlastní podoba, v jaké `anyhow` vykreslí chybu s jednou vrstvou
kontextu: `format!("{:#}", err)` vypíše kontext, dvojtečku a příčinu. Kontext
je `line <n>` (číslováno od 1). V chybovém případě se nevypisuje nic jiného.

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

Použij `anyhow::Result` jako návratový typ funkce, která dělá práci, `?` na
propagaci a `.with_context(|| ...)` k tomu, abys řekl, který řádek. Startovní
kód unwrapuje a panikaří, což vypíše stack trace a skončí se 101 — ne
hlášení, které by si někdo z provozu přečetl.
'''
hints = [
  "`use anyhow::{Context, Result};` — `Result<T>` je `Result<T, anyhow::Error>` a `?` do něj převede libovolný `std::error::Error`.",
  "`.with_context(|| format!(\"line {n}\"))` funguje na `Result` *i* na `Option` (z `Option` se stane chyba s tou zprávou). Připoj ho před `?`.",
  "`{:#}` na `anyhow::Error` vypíše `context: cause` na jednom řádku; prosté `{}` vypíše jen nejvzdálenější kontext.",
  "Chybějící pole je `None`, ne chyba parsování: udělej z něj chybu přes `.ok_or_else(|| anyhow!(\"missing amount\"))` a dej mu stejný kontext `line n`.",
]

# ---------------------------------------------------------------- 02
[[quest]]
id    = "rust.frameworks.02.thiserror-enum"
title = "Chyba se jménem"
story = "Převodní služba odpovídá na každé odmítnutí stejným textem „bad transfer“ a podpora o dvě patra výš začala volat vývojářům s otázkou, které odmítnutí to vlastně je."
brief = '''
Dva účty, `A` a `B`, začínají se zůstatky na prvním řádku. Potom `n` na
druhém řádku, potom `n` převodů `<FROM> <TO> <CENTS>`.

Proveď je v pořadí. Pro každý vypiš `OK <FROM> <TO> <CENTS>`, nebo chybu — a
chyby jsou `thiserror` enum se třemi variantami, jejichž `Display` je přesně:

* `unknown account X` — `FROM` nebo `TO` není `A` ani `B` (nejdřív zkontroluj
  `FROM`)
* `insufficient funds in A: need 300, have 100`
* `nothing to move` — částka je nula nebo záporná

Po převodech vypiš `A <balance>` a `B <balance>`.

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

Definuj enum s `#[derive(Debug, thiserror::Error)]` a každou zprávu dej do
jeho atributu `#[error("...")]` s interpolovanými poli — `{0}` pro variantu
s n-ticí, `{need}` pro pojmenované pole. `transfer` vrací
`Result<(), TransferError>` a `main` vypisuje přes `{}`. Startovní kód má
logiku a na všechno vypisuje `bad transfer`.
'''
hints = [
  "`#[derive(Debug, thiserror::Error)]` na enumu a `#[error(\"...\")]` na každé variantě je celý `impl Display` i `impl std::error::Error`.",
  "`{0}` v atributu je první pole varianty s n-ticí; `{need}` a `{have}` jsou pojmenovaná pole strukturové varianty.",
  "Zkontroluj obě jména účtů před částkou a `FROM` před `TO`: skryté případy posílají `C B 0` a zadání říká, která chyba vyhrává.",
  "Signatura se změní na `Result<(), TransferError>`; `println!(\"{e}\")` v `main` pak vypíše text z atributu.",
]

# ---------------------------------------------------------------- 03
[[quest]]
id    = "rust.frameworks.03.serde-derive"
title = "Tvar na drátě"
story = "Platební terminály na Yee Wo Street posílají objednávky jako JSON. Stará čtečka hledala částky počítáním čárek a obchodník s čárkou ve jméně dostával peníze ve špatném sloupci."
brief = '''
Na standardním vstupu je jedno pole JSON s objednávkami. Každá objednávka je
objekt s `"id"` (číslo), `"merchant"` (řetězec) a `"cents"` (číslo).

Vypiš jeden řádek na objednávku, v pořadí, v jakém přišly,
`<id> <merchant> <cents>`, potom `TOTAL <sum of cents>`.

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

Definuj `struct Order` s těmi třemi poli, dej jí `#[derive(Deserialize)]` a
čtení nech na `serde_json::from_str::<Vec<Order>>`. Startovní kód dělí podle
čárek. Objekty mohou mít klíče v libovolném pořadí a libovolné množství bílých
znaků a řetězec může obsahovat čárku — o to tu jde.
'''
hints = [
  "`use serde::Deserialize;` a `#[derive(Deserialize)]` na struktuře — názvy polí jsou klíče JSONu a typy říkají, čím každé musí být.",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` — typ nalevo je to, co serde řekne, co má postavit.",
  "Pořadí klíčů a bílé znaky jsou věc JSONu, ne tvoje; serde přečte libovolný objekt s těmi třemi klíči. Výpis je stejná smyčka jako předtím.",
]

# ---------------------------------------------------------------- 04
[[quest]]
id    = "rust.frameworks.04.serde-attributes"
title = "Co čte banka"
story = "Banka dvakrát týdně vrací zúčtovací soubor z Yee Wo Street: každá karta, která nikdy nebyla autorizovaná, odchází jako `\"authCode\":null`, a ten jeden terminál, který neposílá poplatek, zastaví čtečku dřív, než se soubor vůbec zapíše."
brief = '''
Na standardním vstupu je jedno pole JSON se zúčtovacími záznamy z terminálů.
Každý záznam má `"terminalId"` (řetězec), `"merchant"` (řetězec),
`"amountCents"` (číslo) a může, ale nemusí mít `"feeCents"` (číslo) a
`"authCode"` (řetězec). Klíče mohou přijít v libovolném pořadí.

Vypiš jeden řádek na záznam, v pořadí vstupu: záznam tak, jak ho chce banka,
kompaktní JSON ze `serde_json::to_string`, klíče v tomto pořadí a napsané
přesně takto — `terminalId`, `merchant`, `amountCents`, `feeCents`,
`authCode`. Chybějící `feeCents` se zapíše jako `0`; chybějící `authCode` se
**vynechá**, nikdy se nezapíše jako `null`. Potom
`NET <sum of amountCents minus feeCents>`.

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

Jedna struktura obslouží oba směry: `#[derive(Serialize, Deserialize)]`
s poli ve snake_case, `#[serde(rename_all = "camelCase")]` na struktuře,
`#[serde(default)]` na `fee_cents` a `auth_code: Option<String>`
s `#[serde(skip_serializing_if = "Option::is_none")]`. `to_string` zapisuje
pole v pořadí, v jakém je struktura deklaruje, takže výstup je přesný.
Startovní kód přejmenovává každé pole ručně, nedokáže přečíst záznam bez
poplatku a zapisuje `null`.
'''
hints = [
  "`use serde::{Deserialize, Serialize};` — jedna struktura, oba derive. `#[serde(rename_all = \"camelCase\")]` na struktuře nahradí každý `rename` na jednotlivých polích.",
  "`#[serde(default)]` na `fee_cents: i64` doplní chybějící klíč hodnotou `i64::default()`, což je `0`. Bez něj je záznam bez poplatku chyba deserializace.",
  "`Option<String>` už chybějící klíč čte jako `None`; je to *zápis*, který potřebuje `#[serde(skip_serializing_if = \"Option::is_none\")]`, jinak se serializuje jako `null`.",
  "`serde_json::to_string(record)` dá kompaktní JSON v pořadí polí struktury; `println!` ho, jeden záznam na řádek.",
]

# ---------------------------------------------------------------- 05
[[quest]]
id    = "rust.frameworks.05.json-value-walk"
title = "Každý list na řádek"
story = "Nový dodavatel terminálů na Percival Street posílá vnořený objekt, pro který nikdo nenapsal strukturu, a podpora chce vidět, co v něm je, dnes — ne až po té struktuře."
brief = '''
Na standardním vstupu je jeden dokument JSON, jehož nejvyšší úroveň je objekt
nebo pole. Vypiš každou listovou hodnotu jako `<path> = <value>`, jednu na
řádek.

* Klíče objektu se procházejí v **seřazeném pořadí** (bajtové pořadí klíče —
  tak iteruje `serde_json::Value::Object`); prvky pole v pořadí indexů.
* Cesta jsou klíče spojené `.` a `[i]` pro index v poli: `terminal.id`,
  `orders[0].cents`, `[1][0]` pro pole uvnitř kořenového pole. Klíče
  neobsahují tečky ani závorky.
* Řetězec se vypíše bez uvozovek. Číslo, `true`, `false` a `null` se vypíší
  tak, jak je zapisuje JSON (`1.5` zůstane `1.5`, `null` je slovo `null`).
* Prázdný objekt nebo prázdné pole nemá žádné listy a nevypíše nic.

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

Parsuj přes `serde_json::from_str::<serde_json::Value>` a napiš rekurzivní
`walk(path: &str, value: &Value)`, která matchuje `Value::Object`,
`Value::Array` a zbytek. Startovní kód projde jen nejvyšší úroveň a vypíše,
co tam najde, takže vnořený objekt vyjde jako jeden řádek JSONu a kořenové
pole je panika.
'''
hints = [
  "`use serde_json::Value;` a `let doc: Value = serde_json::from_str(&input)?;` — `Value` je enum: `Null`, `Bool`, `Number`, `String`, `Array(Vec<Value>)`, `Object(Map<String, Value>)`.",
  "Rekurze nese cestu: `fn walk(path: &str, value: &Value)`. U objektu je `for (key, child) in map` už v seřazeném pořadí klíčů; u pole dá `iter().enumerate()` index.",
  "Cesta roste o jeden kus na úroveň: `format!(\"{path}.{key}\")`, pokud `path` není prázdná (pak jen klíč), a `format!(\"{path}[{i}]\")` pro index.",
  "`Value::String(s) => println!(\"{path} = {s}\")` vypíše řetězec holý; `other => println!(\"{path} = {other}\")` použije vlastní `Display` typu `Value`, což je kompaktní JSON — `null`, `true`, `1.5`.",
]

# ---------------------------------------------------------------- 06
[[quest]]
id    = "rust.frameworks.06.toml-config"
title = "Soubor služby"
story = "Zúčtovací služba na Gloucester Road indexuje svou konfigurační tabulku ručně a druhý `[[upstream]]` přepsal první; každé zúčtování od úterý šlo na záložní cestu."
brief = '''
Na standardním vstupu je konfigurace služby v TOML:

* nejvyšší úroveň: `name` (řetězec, povinný), `port` (celé číslo, výchozí
  `8080`)
* tabulka `[limits]` (povinná): `max_cents` (celé číslo, povinné), `retries`
  (celé číslo, výchozí `3`)
* pole tabulek `[[upstream]]`, nula nebo více, každá s `name` a `url`
  (řetězce, povinné) a `timeout_ms` (celé číslo, výchozí `1000`)

Vypiš souhrn — jeden řádek `SERVICE`, jeden řádek `LIMIT`, potom jeden řádek
`UPSTREAM` na tabulku v pořadí souboru:

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

Pokud vstup není platný TOML, nebo nemá ten tvar (chybí povinný klíč, hodnota
má špatný typ), vypiš přesně `ERROR: config rejected` jako jediný řádek a
skonči normálně. Vlastní hlášení toml nevypisuj.

Popiš tvar strukturami — `Config`, `Limits`, `Upstream` — každá
s `#[derive(Deserialize)]`, výchozí hodnoty přes `#[serde(default)]` nebo
`#[serde(default = "fn_name")]`, a přečti ho přes
`toml::from_str::<Config>(&input)` s `match` na vráceném `Result`. Startovní
kód čte `toml::Table` a indexuje do ní, což funguje pro úplný soubor a na
všem ostatním panikaří.
'''
hints = [
  "`use serde::Deserialize;` — toml je formát serde stejně jako serde_json, takže `toml::from_str::<Config>(&input)` staví stejný druh odvozené struktury. `[table]` je pole typu struktura; `[[array_of_tables]]` je pole typu `Vec<Struct>`.",
  "Výchozí hodnota, která není `Default` daného typu, je funkce: `#[serde(default = \"default_port\")]` s `fn default_port() -> u16 { 8080 }`. Prosté `#[serde(default)]` na `Vec` udělá z chybějícího `[[upstream]]` prázdný seznam.",
  "`toml::from_str` vrací `Result<Config, toml::de::Error>`; chybějící povinný klíč, špatný typ i syntaktická chyba skončí všechny v `Err`. Matchni na něm a vypiš svůj vlastní řádek — chybu nikdy nevypisuj přes `{}`.",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`.",
]

# ---------------------------------------------------------------- 07
[[quest]]
id    = "rust.frameworks.07.clap-derive"
title = "Jeden řádek přepínačů"
story = "Provozní nástroj na zúčtovacím stroji bere `--limit` a někdo u stolu na Gloucester Road napsal `--limti 50`; nástroj to vzal jako název dávky a pustil se do všech."
brief = '''
`settle` je nástroj příkazové řádky s:

* jedním povinným pozičním argumentem `BATCH` (řetězec)
* `--limit <N>`, celé číslo bez znaménka, výchozí `100`
* `--dry-run`, přepínač

Harness nepředává žádné argumenty, takže příkazové řádky přicházejí ze
standardního vstupu: každý neprázdný řádek je jedna příkazová řádka, rozdělená
podle bílých znaků (vlastní jméno nástroje na řádku není). Pro každou vypiš
jeden řádek:

* při úspěchu `batch=<BATCH> limit=<N> dry-run=<true|false>`
* při neúspěchu `ERROR: ` a podobu `Debug` clapového `ErrorKind` —
  `ERROR: MissingRequiredArgument`, `ERROR: ValueValidation`,
  `ERROR: UnknownArgument`, `ERROR: InvalidValue` (volba, za kterou
  nenásleduje hodnota)

```
input:  2024-06-01 --limit 50
        --dry-run 2024-06-02
        2024-06-03 --limit ten
output: batch=2024-06-01 limit=50 dry-run=false
        batch=2024-06-02 limit=100 dry-run=true
        ERROR: ValueValidation
```

Deklaruj rozhraní jako strukturu s `#[derive(clap::Parser)]` —
`#[arg(long, default_value_t = 100)]` a `#[arg(long)]` na `bool` — a každý
řádek parsuj přes
`Cli::try_parse_from(std::iter::once("settle").chain(words))`. `Err(e)` nese
`e.kind()`. Volby mohou přijít před pozičním argumentem i za ním a
`--limit=7` je totéž jako `--limit 7`. Neposílej `--help`. Startovní kód je
ručně psaná smyčka, která přijme cokoli.
'''
hints = [
  "`use clap::Parser;` a `#[derive(Parser)]` na struktuře: holé pole je poziční argument, `#[arg(long)]` udělá `--field-name` a typ pole je parser hodnoty — `u32` ti `ten` odmítne samo.",
  "`#[arg(long, default_value_t = 100)] limit: u32` je výchozí hodnota jako typovaná hodnota; `#[arg(long)] dry_run: bool` je přepínač, přítomný nebo ne, na řádku psaný `--dry-run`.",
  "`Cli::parse()` čte skutečné argv, které je tu prázdné. `Cli::try_parse_from(iter)` bere libovolný iterátor řetězců, jehož první položka je jméno programu: `std::iter::once(\"settle\").chain(line.split_whitespace())`.",
  "`Err(e) => println!(\"ERROR: {:?}\", e.kind())` — `ErrorKind` je prostý enum a jeho `Debug` je název varianty.",
]

# ---------------------------------------------------------------- 08
[[quest]]
id    = "rust.frameworks.08.clap-subcommands"
title = "Tři slovesa, jeden nástroj"
story = "Provoznímu nástroji na zúčtovacím stroji na Gloucester Road přirostly `pay`, `refund` a `balance` jako tři větve if podle prvního slova; `refudn` propadlo do poslední větve a stůl si přečetl zůstatek tam, kde čekal odmítnutí."
brief = '''
`till` je nástroj příkazové řádky se třemi podpříkazy:

* `pay <TO> <CENTS>` — `TO` řetězec, `CENTS` celé číslo bez znaménka; vypíše
  `PAY <CENTS> to <TO>`
* `refund <ID> [--reason <WORD>]` — vypíše `REFUND <ID>`, nebo
  `REFUND <ID> because <WORD>`, když je uveden důvod
* `balance [ACCOUNT]` — `ACCOUNT` má výchozí hodnotu `main`; vypíše
  `BALANCE <ACCOUNT>`

Jako předtím, harness nepředává žádné argumenty: každý neprázdný řádek
standardního vstupu je jedna příkazová řádka, rozdělená podle bílých znaků,
bez jména nástroje. Jeden výstupní řádek na příkazovou řádku. Při neúspěchu
vypiš `ERROR: ` a podobu `Debug` clapového `ErrorKind`: neznámé první slovo
je `ERROR: InvalidSubcommand`; podpříkaz, kterému chybí poziční argument, je
`ERROR: MissingRequiredArgument`; `CENTS`, které není celé číslo, je
`ERROR: ValueValidation`; volba, kterou podpříkaz nemá, je
`ERROR: UnknownArgument`.

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

Použij `#[derive(Parser)]` na struktuře s jedním polem označeným
`#[command(subcommand)]`, jehož typ je enum s `#[derive(Subcommand)]`; pole
každé varianty jsou argumenty toho podpříkazu a název varianty malými písmeny
je slovo na řádku. Dej na strukturu `#[command(disable_help_subcommand = true)]`,
aby `help` nebylo čtvrté sloveso. Neposílej `--help`. Startovní kód matchuje
první slovo a indexuje zbytek.
'''
hints = [
  "`use clap::{Parser, Subcommand};` — struktura dostane jedno pole `#[command(subcommand)] command: Command` a `Command` je enum s `#[derive(Subcommand)]`.",
  "Strukturová varianta `Pay { to: String, cents: i64 }` je podpříkaz se dvěma pozičními argumenty; `#[arg(long)] reason: Option<String>` je nepovinný `--reason`; `#[arg(default_value = \"main\")] account: String` je nepovinný poziční argument.",
  "`#[command(name = \"till\", disable_help_subcommand = true)]` na struktuře — jinak clap přidá vlastní podpříkaz `help` a řádek `help` vypíše `DisplayHelp` místo `InvalidSubcommand`.",
  "Po `try_parse_from` matchni na `cli.command`: `Command::Refund { id, reason: Some(why) } => ...` a `Command::Refund { id, reason: None } => ...` jsou dvě větve jednoho match.",
]

# ---------------------------------------------------------------- 09
[[quest]]
id    = "rust.frameworks.09.regex-captures"
title = "Dolary uprostřed textu"
story = "Podpora vkládá e-maily zákazníků do refundačních tiketů a částky sedí uprostřed textu. Skener, který je vytahuje, se zastaví na první čárce, takže zákazníkovi, kterému v SOGO naúčtovali HK$1,234.50, nabídli zpátky jeden dolar."
brief = '''
Na standardním vstupu je volný text, jeden řádek tiketu na řádek. Najdi v něm
každou částku v hongkongských dolarech. Částka je `HK$` následované přímo
celodolarovou částí a nepovinnou centovou částí:

* celé dolary: buď prosté číslice (`80`, `1234`), nebo číslice seskupené po
  třech s čárkami (`1,234`, `12,345,678` — jedna až tři číslice, potom jedna
  nebo více skupin `,ddd`);
* centy: `.` a přesně dvě číslice (`.50`). `.`, za kterou nejsou dvě číslice,
  není součástí částky (`HK$38.` je 38 dolarů).

Cokoli jiného — `US$9.99`, holé `HK$` — částka není.

Pro každou částku, v pořadí čtení, vypiš `<line> <text> <cents>`: číslo řádku
od 1, částku přesně tak, jak se objevila v textu, a její hodnotu v centech
jako celé číslo. Po posledním řádku vypiš `TOTAL <cents>`. Tiket bez částek
vypíše jen součet; prázdný vstup vypíše `TOTAL 0`.

```
input:  Charged HK$1,234.50 twice at SOGO; the second HK$1,234.50 is a duplicate.
        Refund HK$80 and the HK$12.05 fee. The US$9.99 line is not ours.
output: 1 HK$1,234.50 123450
        1 HK$1,234.50 123450
        2 HK$80 8000
        2 HK$12.05 1205
        TOTAL 256105
```

Postav jeden `regex::Regex` s pojmenovanými skupinami pro dolary a centy,
zkompiluj ho **jednou** před smyčkou (kompilace je ta drahá část; `Regex`
v těle smyčky je klasická chyba) a každý řádek projdi přes `captures_iter`.
Počítej v celých centech: `f64` dolary krát 100 je způsob, jak se z `HK$0.29`
stane 28 centů. Startovní kód skenuje ručně, zastaví se na první čárce a
násobí floaty.
'''
hints = [
  "`use regex::Regex;` a `let re = Regex::new(r\"...\").unwrap();` jednou, nad smyčkou. `re.captures_iter(line)` dává jeden `Captures` na shodu, zleva doprava.",
  "Pojmenované skupiny: `(?P<dollars>...)` a `(?P<cents>...)`. Ve vzoru je `\\$` doslovný znak dolaru a seskupená podoba musí být v alternaci první, s `+` na skupinách s čárkou, jinak se `HK$1234.50` shodne jako `HK$123` — crate regex bere první alternativu, která se shodne, ne nejdelší.",
  "Vzor: `HK\\$(?P<dollars>\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.(?P<cents>\\d{2}))?`. `&caps[0]` je celá shoda, `caps[\"dollars\"]` text skupiny a `caps.name(\"cents\")` je `Option<Match>`, protože skupina se nemusela zúčastnit.",
  "`let dollars: i64 = caps[\"dollars\"].replace(',', \"\").parse().unwrap();`, potom `let cents: i64 = caps.name(\"cents\").map_or(0, |m| m.as_str().parse().unwrap());` a částka je `dollars * 100 + cents`.",
]

