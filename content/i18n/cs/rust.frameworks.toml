# ---------------------------------------------------------------- 16
[[quest]]
id    = "rust.frameworks.16.crossbeam-hatch"
title = "Okénko se zavírá"
story = "Tři terminály z Yee Wo Street posílají do jednoho okénka v kanceláři na Gloucester Road a nic okénku neřekne, že už šly domů. Noční dávka v šest ráno pořád čeká."
brief = '''
První řádek je `<PRODUCERS>`, `1 <= PRODUCERS <= 8`. Každý další řádek je
platební lístek, `<CARD> <CENTS>`. Lístek `i` (od 0, jen lístky) patří
producentovi `i % PRODUCERS`. Lístek, který nemá přesně dvě pole, nebo jehož
