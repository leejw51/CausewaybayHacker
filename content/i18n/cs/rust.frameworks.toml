Řádek, který není skutečné datum v tomto formátu — `2026-13-01`,
`2026-02-29`, `2026-04-31`, `yesterday` — vypíše `ERROR: bad date <line>`
s oříznutým textem řádku a program pokračuje dalším řádkem.

```
input:  2026-10-02
        2026-10-03
        2026-10-07
