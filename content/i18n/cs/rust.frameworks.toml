title = "Příští pracovní den"
story = "Páteční dávka karet z terminálů v Times Square šla do banky na Gloucester Road s datem soboty a banka v sobotu nemá otevřeno. Zúčtovací kalendář je ručně psaná tabulka měsíců a únor v ní má každý rok 28 dní."
