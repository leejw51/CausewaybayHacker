[[quest]]
id    = "rust.frameworks.14.rayon-fee-run"
title = "Všechny karty naráz"
story = "Měsíční výpočet poplatků prochází karty terminálů z Yee Wo Street jednu po druhé na jednom jádru šestnáctijádrového stroje u Gloucester Road, a když doběhne, číslo banky je asi o cent na kartu vyšší než naše."
brief = '''
Na standardním vstupu je nula nebo více řádků `<CARD> <CENTS>`: id karty (bez
mezer, jedinečné) a částka v centech, `0 <= CENTS <= 10_000_000_000`.

Poplatek z jedné platby je **1,5 % částky, zaokrouhlených nahoru na nejbližší
