[[quest]]
id    = "rust.frameworks.13.rand-seeded-shuffle"
title = "Stejné losování dvakrát"
story = "Fraud tým u Gloucester Road vybírá k ruční kontrole náhodný vzorek obchodníků z Yee Wo Street za ten den. Auditor se ptá, kteří obchodníci byli ve včerejším vzorku, a program, který je vylosoval, je nedokáže vylosovat znovu."
brief = '''
Na standardním vstupu jsou dva řádky. První je seed, 64-bitové celé číslo bez
znaménka; druhý je `<n> <k>`, s `1 <= n <= 99` a `0 <= k <= 20`.

Postav balíček `M01 M02 ... Mnn` (dvě číslice, doplněné nulou), potom
s **jedním** generátorem náhodných čísel nasazeným ze seedu:

1. balíček jednou zamíchej, na místě, a vypiš `DECK <ids joined by one space>`;
2. vylosuj `k` celých čísel, každé rovnoměrně z `1..=100` jako `u32`, a pro
   každé v pořadí vypiš `DRAW <x>`;
3. vypiš `CHECK <first id of the shuffled deck>`.

Generátor je `rand::rngs::StdRng` postavený přes `SeedableRng::seed_from_u64`,
spotřebovaný přesně v tomto pořadí — nejdřív míchání, potom losování — takže
stejný seed vždy vypíše stejné řádky. Pokud seed není `u64`, vypiš
`ERROR: bad seed <text>` (oříznuté) a nic jiného.

```
input:  20261006
        6 3
output: DECK M06 M02 M05 M01 M03 M04
        DRAW 4
        DRAW 26
        DRAW 79
        CHECK M06
```

Míchání je `rand::seq::SliceRandom::shuffle`, losování
`rand::RngExt::random_range` — oboje traity, oboje importované. Startovní kód
používá `rand::rng()`, generátor lokální pro vlákno nasazený z operačního
systému, a při každém běhu vypíše jiný vzorek.
'''
hints = [
  "`use rand::rngs::StdRng; use rand::{RngExt, SeedableRng}; use rand::seq::SliceRandom;` — v rand 0.10 žijí metody na `RngExt` a `SliceRandom` a `seed_from_u64` na `SeedableRng`.",
  "`let mut rng = StdRng::seed_from_u64(seed);` je celá oprava: jeden generátor, postavený ze seedu, předaný jako `&mut rng` všemu, co losuje.",
  "`deck.shuffle(&mut rng);`, potom `let draw: u32 = rng.random_range(1..=100);` — typová anotace rozhoduje, která celá čísla z proudu vyjdou, takže to musí být `u32`.",
]

