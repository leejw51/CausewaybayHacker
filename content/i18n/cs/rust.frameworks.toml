        K1 1200
        K2 350
        K3 oops
        K4 1200
        K5 90
output: MESSAGES 4
        TOTAL 2840
        LARGEST K1 1200
```

`for msg in rx` skončí jen tehdy, když je zahozen **poslední** `Sender`. Každý
producent dostane `tx.clone()` a ty se zahodí, když vlákna skončí — ale
původní `tx` pořád sedí v `main`, takže smyčka nikdy neskončí a běh je
timeout. Zahoď ho, než začneš číst. Startovní kód to nedělá.
'''
hints = [
