  'type Draft<T> = { [K in keyof T]?: T[K] };',
  'type Draft<T> = { [K in keyof T]-?: T[K] };',
  'type Draft<T> = { readonly [K in keyof T]?: T[K] };',
  'type Draft<T> = { [K in T]?: T[K] };',
