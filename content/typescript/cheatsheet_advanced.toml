# TYPESCRIPT LAND — CHEATSHEET ADVANCED. The second page of the cheatsheet,
# asked: the questions an interviewer uses to tell a fluent TypeScript hand
# from one who only knows the grammar (tsc 5, `strict` on, Node 22). A
# generic with a bound, a mapped type by hand, a union pulled out of an
# `as const` array, the utility types, `infer`, a template literal type,
# `satisfies`, a labeled rest tuple, declaration merging, a `#private`
# field, an overload's implementation line, `??=`, an optional chain, a
# renamed destructuring, a range from a length, a non-mutating sort with
# two keys, the Map grouping trap, a deep copy, a bigint sum, named regex
# groups, the loop-closure trap, a type-only import, an error with a cause,
# `allSettled` narrowing, `for await`, an iterable class, an exhaustive
# `never`, a type guard, and an assertion function (the boss). Four lines,
# one right. Nothing is typed and nothing is compiled — the pick is the
# submission, and the server judges it against the quiz (SPEC §0). The
# three wrong lines are near-misses: a line strict mode refuses, a call that
# compiles and answers wrong, another language's spelling.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
# The BASIC road (cheatsheet.toml) owns the core grammar; nothing here
# repeats it.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "typescript.cheatsheet_advanced"
land     = "typescript"
category = "cheatsheet_advanced"
version  = 1

