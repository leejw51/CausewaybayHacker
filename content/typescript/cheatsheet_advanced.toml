Write `Draft<T>` by hand — not with the built-in utility type that does
this: the same keys as `T`, every one optional, each keeping its own
type, and still writable. With `type Screen = { id: string; w: number }`,
both `const d: Draft<Screen> = { w: 3 };` and `d.w = 5;` compile.
