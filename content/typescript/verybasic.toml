[[quest]]
id          = "typescript.verybasic.09.struct-method"
node        = 9
title       = "THE BASKET LINE"
difficulty  = 1
story       = '''Price times quantity is one line of every basket in the Lee Garden app, and the method that should say it promises a number and returns none.'''
concepts    = ["structs", "functions"]
requires    = ["typescript.verybasic.08.structs"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''
`Stall.total()` must return price times quantity. The constructor's `public` parameters declare the fields and store them in one go; inside a method, the object's fields are reached through `this`.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  tofu 12 3
output: tofu: 36
```
'''
starter     = '''
class Stall {
  constructor(public name: string, public price: number, public qty: number) {}

  total(): number {
    // FILL: price times quantity
  }
}

const input: string = require("fs").readFileSync(0, "utf8");
const [name, price, qty] = input.trim().split(/\s+/);
const s = new Stall(name, Number(price), Number(qty));
console.log(`${s.name}: ${s.total()}`);
'''
solution    = '''
class Stall {
  constructor(public name: string, public price: number, public qty: number) {}

  total(): number {
    return this.price * this.qty;
  }
}

const input: string = require("fs").readFileSync(0, "utf8");
const [name, price, qty] = input.trim().split(/\s+/);
const s = new Stall(name, Number(price), Number(qty));
console.log(`${s.name}: ${s.total()}`);
'''
hints = [
  "return this.price * this.qty; — both fields through this.",
  "A bare price inside the method is not the field; it is the price read from the input outside the class, a string, and tsc will not multiply a string.",
]

[quest.quiz]
choices = ["return price * qty;", "return this.price * this.qty;", "return this.price + this.qty;", "return this.price * qty;"]
answer  = 1

