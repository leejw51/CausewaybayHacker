title       = "ONE COUNTER, FOUR FEEDS"
difficulty  = 3
story       = '''Four sales feeds add to one counter on the control-room console; there is a lock, and nobody waits for it before they read.'''
concepts    = ["shared-state", "concurrency"]
requires    = ["typescript.verybasic.25.threads"]
map          = { x = 0.394, y = 0.686, kind = "quest" }
brief       = '''
One thread, and still a race: each worker reads `counter`, `await`s, and writes it back, and the other workers run in the gap. `lock` is a small async lock. Before the read, each worker must TAKE the lock and wait until it has it; the release is already written after the write. `acquire` returns a promise that settles when the lock is yours.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  1000
output: 4000
```
'''
starter     = '''
class Lock {
  private held = false;
  private waiters: (() => void)[] = [];

  acquire(): Promise<void> {
    if (!this.held) {
      this.held = true;
      return Promise.resolve();
    }
    return new Promise((resolve) => this.waiters.push(resolve));
  }

  release(): void {
    if (!this.held) throw new Error("release of an unheld lock");
    const next = this.waiters.shift();
    if (next) next();
    else this.held = false;
  }
}

let counter = 0;
const lock = new Lock();
const pause = (): Promise<void> => new Promise((resolve) => setImmediate(resolve));

async function work(n: number): Promise<void> {
  for (let i = 0; i < n; i++) {
    // FILL: take the lock
    const seen = counter;
    await pause();
    counter = seen + 1;
    lock.release();
  }
}

async function main(): Promise<void> {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = Number(input.trim());
  await Promise.all([work(n), work(n), work(n), work(n)]);
  console.log(counter);
}

main();
'''
