id          = "typescript.verybasic.07.functions"
node        = 7
title       = "THE SLOT RATE"
difficulty  = 1
story       = '''The Times Square screen bills the first ten ad slots of the night at five each and every one after at three; the billing function promises a number, and tsc will not build it.'''
concepts    = ["functions", "control-flow"]
