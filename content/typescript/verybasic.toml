[[quest]]
id          = "typescript.verybasic.01.print"
node        = 1
title       = "THE FIRST SCREEN"
difficulty  = 1
story       = '''19:00 over Times Square. The big screen comes on black, and the first line of the night has to be typed by hand.'''
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
The program must print exactly `hello, causewaybay` on one line. One method on the global `console` writes a line to standard output.

Pick the line that does it, then type it where the `// FILL` comment is.

```
output: hello, causewaybay
```
'''
starter     = '''
function main(): void {
  // FILL: greet
}

main();
'''
solution    = '''
function main(): void {
  console.log("hello, causewaybay");
}

main();
'''
hints = [
  "console.log(\"hello, causewaybay\"); — parentheses, and the comma inside the string.",
  "There is no print() here; tsc answers a name it has never seen with TS2304 before anything runs.",
