id          = "typescript.verybasic.02.int-types"
node        = 2
title       = "THE SPLIT PLAYLIST"
difficulty  = 1
story       = '''The Hysan Place LED wall splits the night's clips across its panels; the scheduler has to say how many each panel gets and how many are left over, and it says nothing.'''
