class Lock {
  private held = false;
  private waiters: (() => void)[] = [];

  acquire(): Promise<void> {
    if (!this.held) {
      this.held = true;
      return Promise.resolve();
    }
    return new Promise((resolve) => this.waiters.push(resolve));
  }

  release(): void {
    if (!this.held) throw new Error("release of an unheld lock");
    const next = this.waiters.shift();
    if (next) next();
    else this.held = false;
  }
}

let counter = 0;
const lock = new Lock();
const pause = (): Promise<void> => new Promise((resolve) => setImmediate(resolve));

async function work(n: number): Promise<void> {
  for (let i = 0; i < n; i++) {
    await lock.acquire();
    const seen = counter;
    await pause();
    counter = seen + 1;
    lock.release();
  }
}

async function main(): Promise<void> {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = Number(input.trim());
  await Promise.all([work(n), work(n), work(n), work(n)]);
  console.log(counter);
}

main();
'''
