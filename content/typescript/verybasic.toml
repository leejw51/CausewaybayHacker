brief       = '''
`n` is a positive integer. The loop must visit every integer from 1 up to and including `n`, adding each to `total`. A `for` header has a start, a condition checked before every pass, and a step.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  4
output: 10
```
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");
const n: number = Number(input.trim());
let total = 0;
for (let i = 1; i < 1; i++) { // FILL: 1 up to n, inclusive
  total += i;
}
console.log(total);
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");
const n: number = Number(input.trim());
let total = 0;
for (let i = 1; i <= n; i++) {
  total += i;
}
console.log(total);
'''
