map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
`fare(rides)` must return the pay: the first ten rides at 5 each, every ride after the tenth at 3. The signature says `: number`, so a body that hands nothing back does not compile. A function hands a value back with one keyword.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  3
output: 15
```
'''
starter     = '''
function fare(rides: number): number {
  // FILL: the pay for that many rides
}

const input: string = require("fs").readFileSync(0, "utf8");
const n: number = Number(input.trim());
console.log(fare(n));
'''
solution    = '''
function fare(rides: number): number {
  return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;
}

const input: string = require("fs").readFileSync(0, "utf8");
const n: number = Number(input.trim());
console.log(fare(n));
'''
hints = [
  "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;",
  "A function typed `: number` that prints instead of returning does not compile: tsc says it must return a value.",
]

[quest.quiz]
choices = ["return rides * 5;", "console.log(Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3);", "return Math.min(rides, 10) * 5 + Math.max(rides - 10, 0) * 3;", "return Math.min(rides, 10) * 5 + Math.max(rides - 10) * 3;"]
