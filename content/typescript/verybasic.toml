brief       = '''
`xs` is a `number[]` that starts empty. Each integer `x` read in the loop must be added at the end, keeping the input's order. An array has one method for that.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  3 1 4 1
output: 4
        3 1 4 1
```
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");
const xs: number[] = [];
