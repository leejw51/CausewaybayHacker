`word` is one of `island`, `tsuenwan`, `kwuntong`. The program must turn it into the matching `Line` member. An enum can be indexed by a member's name, but only by a key tsc knows is one of its names: `keyof typeof Line` is that set of names, and `as` tells tsc the string is one. The assertion is erased at runtime — it checks nothing, so the string had better match.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  tsuenwan
output: red
```
'''
starter     = '''
enum Line {
  ISLAND,
  TSUENWAN,
  KWUNTONG,
}

const COLOUR: Record<Line, string> = {
  [Line.ISLAND]: "blue",
  [Line.TSUENWAN]: "red",
  [Line.KWUNTONG]: "green",
};
const input: string = require("fs").readFileSync(0, "utf8");
const word: string = input.trim();
const line: Line | undefined = undefined; // FILL: the Line member named by word
console.log(COLOUR[line]);
'''
solution    = '''
enum Line {
  ISLAND,
  TSUENWAN,
  KWUNTONG,
}

const COLOUR: Record<Line, string> = {
  [Line.ISLAND]: "blue",
  [Line.TSUENWAN]: "red",
  [Line.KWUNTONG]: "green",
};
const input: string = require("fs").readFileSync(0, "utf8");
const word: string = input.trim();
const line = Line[word.toUpperCase() as keyof typeof Line];
console.log(COLOUR[line]);
'''
hints = [
  "const line = Line[word.toUpperCase() as keyof typeof Line]; — the names are in capitals.",
