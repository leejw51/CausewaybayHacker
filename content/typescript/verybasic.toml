# TYPESCRIPT LAND — VERY BASIC. The grammar as a question first: four lines,
# one of them right, and then that line typed. Types, containers, a stack, a
# queue, a heap, a class, a promise, a lock — the constructs a HackerRank-
# style live coding test leans on, one per node, on the screens of Causeway
# Bay from 19:00, when the big screen over Times Square comes on, to the feed
# that arrives typed `any` before midnight. Every type here is a contract:
# tsc checks it once and erases it, and the program runs on whatever came
# down the wire — so a wrong choice is as often a compile error as a wrong
# answer. Every quest carries a [quest.quiz]: the choices are code and never
# translated; the question is the brief. verify_pack swaps each wrong choice
# into the solution and refuses the quest if it passes, so the quiz has one
# right answer.
#
# Every program is one main.ts, checked by `tsc -p .` (strict, es2022,
# commonjs) against backend/runner/src/typescript/node.d.ts — the whole of
# Node a quest can see — and run as `node --enable-source-maps main.js`.
# Standard input is read with one idiom everywhere:
#
#     const input: string = require("fs").readFileSync(0, "utf8");
#
# There are no threads: the concurrency nodes are one event loop, promises
# and `await`.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "typescript.verybasic"
land = "typescript"
category = "verybasic"
version = 1

