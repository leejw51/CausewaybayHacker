solution    = '''
class TreeNode {
  left: TreeNode | null = null;
  right: TreeNode | null = null;

  constructor(public val: number) {}
}

function insert(n: TreeNode | null, v: number): TreeNode {
  if (n === null) {
    return new TreeNode(v);
  }
  if (v < n.val) {
    n.left = insert(n.left, v);
  } else {
    n.right = insert(n.right, v);
  }
  return n;
}

function inorder(n: TreeNode | null, out: number[]): void {
  if (n === null) {
    return;
  }
  inorder(n.left, out);
  out.push(n.val);
  inorder(n.right, out);
}

function height(n: TreeNode | null): number {
  if (n === null) {
    return 0;
  }
  return 1 + Math.max(height(n.left), height(n.right));
}

const input: string = require("fs").readFileSync(0, "utf8");
let root: TreeNode | null = null;
for (const tok of input.trim().split(/\s+/)) {
  root = insert(root, Number(tok));
}
const out: number[] = [];
inorder(root, out);
console.log(out.join(" "));
console.log(height(root));
