brief       = '''
`a` and `b` are integers. The program must print the whole-number quotient and the remainder on one line, separated by a space. TypeScript has one `number` type and no integer-division operator: `/` always gives the fraction, `Math.trunc` drops it, and `%` is the remainder.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  7 2
output: 3 1
```
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");
const [a, b] = input.trim().split(/\s+/).map(Number);
// FILL: quotient and remainder
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");
const [a, b] = input.trim().split(/\s+/).map(Number);
console.log(Math.trunc(a / b), a % b);
'''
hints = [
  "console.log(Math.trunc(a / b), a % b); — console.log puts a space between its arguments.",
  "a / b is 3.5, not 3: every number is a double. And // is not an operator here; it starts a comment.",
]

[quest.quiz]
choices = ["console.log(a / b, a % b);", "console.log(Math.trunc(a / b), a % b);", "console.log(a // b, a % b);", "console.log(a % b, Math.trunc(a / b));"]
