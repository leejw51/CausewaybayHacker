solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const nums: number[] = input.trim().split(/\s+/).slice(1).map(Number);

// bitwise operators work on 32-bit signed integers; these values fit
let alone = 0;
for (const value of nums) alone ^= value;

let bits = 0;
for (let walk = alone; walk !== 0; walk &= walk - 1) bits++;

const powerOfTwo = alone !== 0 && (alone & (alone - 1)) === 0;
const cleared = alone === 0 ? 0 : alone & (alone - 1);

console.log(alone);
console.log(bits);
console.log(powerOfTwo ? "POW2 YES" : "POW2 NO");
console.log(cleared);
'''
