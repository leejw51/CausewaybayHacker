story        = "The follow-up. Everyone checks the two children and everyone is wrong the first time."
concepts     = ["trees", "recursion", "binary-search"]
requires     = ["typescript.hacker.10.tree-walk"]
map          = { x = 0.474, y = 0.314, kind = "quest" }
brief        = '''
Same level-order encoding as the last quest: `-1` is a missing node, children
of `i` are `2i+1` and `2i+2`.

Line one is `n q`. Line two is the `n` tree values. Line three is `q` query
values.

Print `VALID` or `INVALID` — is this a binary search tree, with every value in
the left subtree strictly smaller than the node and every value in the right
strictly larger? Then one line per query: `<value> FOUND <depth>` if it is in
the tree, `<value> ABSENT` if not, where the root is depth 1.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Checking `left < node < right` at each node **is not enough** — a value deep
in the left subtree can still be larger than an ancestor. Carry the open
interval down instead. Every value here is a `number`, and `number` has
`-Infinity` and `Infinity` in it: they are the bounds "no limit yet", they
compare correctly with every value, and they need no `null` check.

A query is answered by the **descent**: compare with the node, go left when
you are smaller and right otherwise, and report `ABSENT` when you fall off
the tree. That matters because the tree is not promised to be a BST, and in
one that is not, a value can sit in the array somewhere the descent never
looks. It is `ABSENT` — you are being asked what the lookup does, not what
`tree.includes(value)` would find.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function present(tree: number[], i: number): boolean {
  return i < tree.length && tree[i] !== -1;
}

function valid(tree: number[], i: number, low: number, high: number): boolean {
  // the node must sit strictly inside (low, high), and each child
  // inherits a narrower window
  return true;
}

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, q] = data;
const tree = data.slice(2, 2 + n);
const queries = data.slice(2 + n, 2 + n + q);

const out: string[] = [valid(tree, 0, -Infinity, Infinity) ? "VALID" : "INVALID"];
for (const target of queries) out.push(`${target} ABSENT`);
console.log(out.join("\n"));
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function present(tree: number[], i: number): boolean {
  return i < tree.length && tree[i] !== -1;
}

function valid(tree: number[], i: number, low: number, high: number): boolean {
  if (!present(tree, i)) return true;
  const value = tree[i];
  if (value <= low || value >= high) return false;
  return valid(tree, 2 * i + 1, low, value) && valid(tree, 2 * i + 2, value, high);
}

function find(tree: number[], target: number): number | null {
  let i = 0;
  let depth = 1;
  while (present(tree, i)) {
    if (tree[i] === target) return depth;
    i = target < tree[i] ? 2 * i + 1 : 2 * i + 2;
    depth++;
  }
  return null;
}

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, q] = data;
const tree = data.slice(2, 2 + n);
const queries = data.slice(2 + n, 2 + n + q);

// -Infinity and Infinity are numbers: "no bound yet" needs no null check
const out: string[] = [valid(tree, 0, -Infinity, Infinity) ? "VALID" : "INVALID"];
for (const target of queries) {
  const depth = find(tree, target);
  out.push(depth === null ? `${target} ABSENT` : `${target} FOUND ${depth}`);
}
console.log(out.join("\n"));
'''
hints = [
  "Pass an open interval (low, high) down. The root gets (-Infinity, Infinity); a left child gets (low, node), a right child gets (node, high).",
