[[quest]]
id           = "typescript.hacker.15.topo-sort"
node         = 15
title        = "WHAT ORDER DOES IT BUILD IN"
difficulty   = 5
time_limit_s = 1200
story        = "Eleven packages behind the signage control room's build and a dependency graph. Name an install order, or name the cycle that means there is not one."
concepts     = ["graphs", "stacks-queues", "sorting"]
requires     = ["typescript.hacker.14.word-search"]
map          = { x = 0.055, y = 0.556, kind = "quest" }
brief        = '''
Line one is `n m`: `n` tasks numbered `0..n-1` and `m` edges. The next `m`
lines are `<a> <b>`, meaning `a` must be built before `b`.

Print a build order on one line, space separated. When several tasks are ready
at once, take the **lowest numbered** one, so the answer is unique. If no
order exists, print `CYCLE` instead. Then print `DONE <how many you ordered>`.

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

Kahn's algorithm: count how many things each task waits on, start with the
ones waiting on nothing, and when you take a task, decrement its dependents.
If you finish with tasks left over, those tasks are the cycle. The ready set
is a min-heap of task numbers, so "lowest numbered" costs `log n` rather than
a scan — the same twenty-odd lines as the merge quest, over plain numbers this
time.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, m] = data;

const after: number[][] = Array.from({ length: n }, () => []);
const waiting: number[] = new Array<number>(n).fill(0);
for (let e = 0; e < m; e++) {
  const a = data[2 + 2 * e];
  const b = data[3 + 2 * e];
  after[a].push(b);
  waiting[b]++;
}

// a min-heap of ready tasks: start with everything waiting on nothing,
// take the smallest each time
const ready: number[] = [];

console.log("CYCLE");
console.log("DONE 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

// a binary min-heap over plain numbers: children of i are 2i+1 and 2i+2
function heapPush(h: number[], value: number): void {
  h.push(value);
  let i = h.length - 1;
  while (i > 0) {
    const parent = (i - 1) >> 1;
    if (h[parent] <= h[i]) break;
    [h[i], h[parent]] = [h[parent], h[i]];
    i = parent;
  }
}

function heapPop(h: number[]): number | undefined {
  const top = h[0];
  const last = h.pop();
  if (h.length > 0 && last !== undefined) {
    h[0] = last;
    let i = 0;
    for (;;) {
      const l = 2 * i + 1;
      const r = l + 1;
      let smallest = i;
      if (l < h.length && h[l] < h[smallest]) smallest = l;
      if (r < h.length && h[r] < h[smallest]) smallest = r;
      if (smallest === i) break;
      [h[i], h[smallest]] = [h[smallest], h[i]];
      i = smallest;
    }
  }
  return top;
}

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, m] = data;

const after: number[][] = Array.from({ length: n }, () => []);
const waiting: number[] = new Array<number>(n).fill(0);
for (let e = 0; e < m; e++) {
  const a = data[2 + 2 * e];
  const b = data[3 + 2 * e];
  after[a].push(b);
  waiting[b]++;
}

const ready: number[] = [];
for (let task = 0; task < n; task++) if (waiting[task] === 0) heapPush(ready, task);

const order: number[] = [];
for (let task = heapPop(ready); task !== undefined; task = heapPop(ready)) {
  order.push(task);
  for (const next of after[task]) {
    waiting[next]--;
    if (waiting[next] === 0) heapPush(ready, next);
  }
}

console.log(order.length < n ? "CYCLE" : order.join(" "));
console.log(`DONE ${order.length}`);
'''
hints = [
  "`waiting[b]` is the in-degree of b — how many edges point at it.",
  "A plain queue gives *an* order; a min-heap gives *the* order the statement asks for. Re-sorting the ready array on every push also gives it, at `O(n log n)` per push.",
  "You never detect the cycle directly. You notice that fewer than n tasks came out, and the ones left are in it.",
]

