const input: string = require("fs").readFileSync(0, "utf8");

const [n, alphabet, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
const chars: string[] = [];
for (let i = 0; i < n; i++) {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  chars.push(String.fromCharCode(97 + (Number(x >> 33n) % alphabet)));
}
const s = chars.join("");

// only the odd centres, so every even-length palindrome is invisible
let bestLen = 0;
let bestStart = 0;
for (let centre = 0; centre < n; centre++) {
  let i = centre;
  let j = centre;
  while (i >= 0 && j < n && s[i] === s[j]) {
    i--;
    j++;
  }
  const length = j - i - 1;
  if (length > bestLen) {
    bestLen = length;
    bestStart = i + 1;
  }
}

console.log(bestLen);
console.log(`AT ${bestStart}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const [n, alphabet, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
const chars: string[] = [];
for (let i = 0; i < n; i++) {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  chars.push(String.fromCharCode(97 + (Number(x >> 33n) % alphabet)));
}
const s = chars.join("");

let bestLen = 0;
let bestStart = 0;
for (let centre = 0; centre < n; centre++) {
  // odd length: one character at the middle; even length: the gap to the
  // right of it
  for (const [i0, j0] of [[centre, centre], [centre, centre + 1]]) {
    let i = i0;
    let j = j0;
    // the bounds are not optional: off both ends, s[i] and s[j] are both
    // undefined, and undefined === undefined
    while (i >= 0 && j < n && s[i] === s[j]) {
      i--;
      j++;
    }
    // i and j have each stepped one too far
    const length = j - i - 1;
    if (length > bestLen) {
      bestLen = length;
      bestStart = i + 1;
    }
  }
}

console.log(bestLen);
console.log(`AT ${bestStart}`);
'''
