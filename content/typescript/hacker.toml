Naming that out loud is half the question. `row.reverse()` reverses in place
and hands back the same array, which is what you want here and a surprise
anywhere you meant to keep the original.

The spiral wants the grid as it was, so copy it before you rotate: a copy of
each row, `grid.map((row) => row.slice())`. `[...grid]` copies the outer array
and shares every row with the original, and the rotation then writes through
both.
