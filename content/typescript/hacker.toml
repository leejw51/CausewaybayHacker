brief        = '''
Line one is `n k`. Line two is `n` integers, which may be negative.

Print how many contiguous runs sum to exactly `k`, then `RANGE <s>`, the sum
of the whole list, read off the last prefix sum rather than by adding again.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

Negative values kill the sliding window — a window that is too big cannot be
fixed by shrinking it. What survives is prefix sums: a run `i..j` sums to `k`
exactly when `prefix[j] - prefix[i] == k`, so count how many earlier prefixes
equal `prefix[j] - k`. Seed the map with `0 → 1` for runs that start at the
beginning.

Key it with a `Map<number, number>`. A plain object would take the prefix as
a key too, and hand it back as a **string**: `Object.keys` of `{ [-2]: 1 }` is
`["-2"]`. The type said `number`; the runtime did not keep it.

The four cases here are five numbers at most, and the clock is not measuring
speed on them: the `O(n²)` double loop over every start and every end clears
all four. The bar is real — on a day of takings that double loop is minutes —
and it is not what these cases check. What they check is the part that is
easy to get wrong: the `0 → 1` seed, and looking up before recording.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, k] = data;
const nums = data.slice(2, 2 + n);

const seen = new Map<number, number>([[0, 1]]);

// running prefix; for each one, how many earlier prefixes were prefix - k
console.log(0);
console.log("RANGE 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, k] = data;
const nums = data.slice(2, 2 + n);

const seen = new Map<number, number>([[0, 1]]);

let prefix = 0;
let runs = 0;
for (const value of nums) {
  prefix += value;
  // look up before recording, or an empty run counts itself when k is 0
  runs += seen.get(prefix - k) ?? 0;
  seen.set(prefix, (seen.get(prefix) ?? 0) + 1);
}

console.log(runs);
console.log(`RANGE ${prefix}`);
'''
