[[quest]]
id           = "typescript.hacker.04.grid"
node         = 4
title        = "OUT OF THE BUILDING"
difficulty   = 5
time_limit_s = 1200
story        = "A floor plan on the whiteboard, a fire door at the far corner, and the interviewer watching the clock rather than the marker."
concepts     = ["graphs", "stacks-queues", "complexity"]
requires     = ["typescript.hacker.03.intervals"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one. And there is no queue in the standard
library: an array is one, **if** you read it with a moving head index.
`queue.shift()` moves every remaining element down by one, which is `O(n)`, and
turns the whole search quadratic.

`grid[r][c]` is typed `string`, and off the edge of the floor it is not one.
`grid[-1]` is `undefined` at runtime whatever the type says, and
`undefined[c]` throws. The bounds check is yours to write.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data = input.trim().split(/\s+/);
const rows = Number(data[0]);
const cols = Number(data[1]);
const grid: string[] = data.slice(2, 2 + rows);

const queue: [number, number][] = [];
let head = 0;

// print the shortest step count or -1, then REACHED <k>
console.log(-1);
console.log("REACHED 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data = input.trim().split(/\s+/);
const rows = Number(data[0]);
const cols = Number(data[1]);
const grid: string[] = data.slice(2, 2 + rows);

const dist: number[][] = Array.from({ length: rows }, () => new Array<number>(cols).fill(-1));
const queue: [number, number][] = [];
let head = 0;
let reached = 0;

if (grid[0][0] === ".") {
  dist[0][0] = 0;
  queue.push([0, 0]);
  reached = 1;
}

const steps: [number, number][] = [[-1, 0], [1, 0], [0, -1], [0, 1]];
while (head < queue.length) {
  const [r, c] = queue[head++];
  const next = dist[r][c] + 1;
  for (const [dr, dc] of steps) {
    const nr = r + dr;
    const nc = c + dc;
    // grid[-1] is undefined at runtime, whatever its type says
    if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
    if (grid[nr][nc] !== "." || dist[nr][nc] >= 0) continue;
    dist[nr][nc] = next;
    reached++;
    queue.push([nr, nc]);
  }
}

console.log(dist[rows - 1][cols - 1]);
console.log(`REACHED ${reached}`);
'''
hints = [
  "A queue is an array plus a `head` index: push to the back, read `queue[head++]` from the front, and stop when `head === queue.length`. No `shift()`.",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
  "Check `nr < 0 || nr >= rows || nc < 0 || nc >= cols` before you index. tsc will not: with this tsconfig `grid[nr]` is typed `string` even when it is `undefined`.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "3 3\n...\n.#.\n...\n",              expect = "4\nREACHED 8\n",   visible = true },
  { name = "blocked", stdin = "2 2\n.#\n#.\n",                     expect = "-1\nREACHED 1\n",  visible = false },
  { name = "single",  stdin = "1 1\n.\n",                          expect = "0\nREACHED 1\n",   visible = false },
  { name = "maze",    stdin = "4 5\n.....\n###.#\n.....\n.#.#.\n", expect = "7\nREACHED 14\n",  visible = false },
]

