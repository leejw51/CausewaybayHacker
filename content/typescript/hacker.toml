solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const lines = input.split("\n");
const a = (lines[0] ?? "").trim();
const b = (lines[1] ?? "").trim();

// one fresh array per row: fill() with an array would share a single row
const table = (): number[][] =>
  Array.from({ length: a.length + 1 }, () => new Array<number>(b.length + 1).fill(0));

const edit = table();
for (let i = 0; i <= a.length; i++) edit[i][0] = i;
for (let j = 0; j <= b.length; j++) edit[0][j] = j;
for (let i = 1; i <= a.length; i++) {
  for (let j = 1; j <= b.length; j++) {
    if (a[i - 1] === b[j - 1]) edit[i][j] = edit[i - 1][j - 1];
    else edit[i][j] = 1 + Math.min(edit[i - 1][j - 1], edit[i - 1][j], edit[i][j - 1]);
  }
}

const lcs = table();
for (let i = 1; i <= a.length; i++) {
  for (let j = 1; j <= b.length; j++) {
    if (a[i - 1] === b[j - 1]) lcs[i][j] = lcs[i - 1][j - 1] + 1;
    else lcs[i][j] = Math.max(lcs[i - 1][j], lcs[i][j - 1]);
  }
}

console.log(edit[a.length][b.length]);
console.log(`LCS ${lcs[a.length][b.length]}`);
'''
