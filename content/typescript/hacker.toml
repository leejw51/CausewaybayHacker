story        = "They want the numbers rounded the way the spec says, not the way your language happens to print them."
concepts     = ["math", "sorting", "types"]
requires     = ["typescript.hacker.25.test-cases"]
map          = { x = 0.394, y = 0.686, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

Print three lines, each to **six decimal places**: the mean, the **population**
standard deviation (divide by `n`, not `n - 1`), and the median — which for an
even `n` is the average of the two middle values.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

This quest is judged with `match = "float:1e-6"`, so the comparison is
numeric: `3.8` and `3.800000` both pass, and a value that is off by `1e-7`
passes too. That is deliberate — the point is not your formatter, it is that
`Math.floor(sum / n)` gives `3`, and that the even-length median is a boundary
people get wrong under a clock.

Population, not sample. There is no statistics module here, so the formula is
yours: the mean of the squared deviations, then `Math.sqrt`. Dividing by
`n - 1` gives the sample deviation, and on a real screen the difference
between the two is the whole submission. `x.toFixed(6)` is the six decimal
places.

The values have to be sorted for the median, and sorted as **numbers**:
`values.sort()` with no comparator puts `10` before `9`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const values: number[] = input.trim().split(/\s+/).slice(1).map(Number);
values.sort((a, b) => a - b);

// floor division, so the mean is wrong before anything else is
const mean = Math.floor(values.reduce((sum, v) => sum + v, 0) / values.length);

console.log(`${mean}.000000`);
console.log("0.000000");
console.log(`${values[Math.floor(values.length / 2)]}.000000`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const values: number[] = input.trim().split(/\s+/).slice(1).map(Number);
// numbers, so a comparator: the default sort compares them as strings
values.sort((a, b) => a - b);
const n = values.length;

const mean = values.reduce((sum, v) => sum + v, 0) / n;
// population: divide by n, not n - 1
const deviation = Math.sqrt(values.reduce((sum, v) => sum + (v - mean) ** 2, 0) / n);

const middle = Math.floor(n / 2);
const median = n % 2 === 1 ? values[middle] : (values[middle - 1] + values[middle]) / 2;

console.log(mean.toFixed(6));
console.log(deviation.toFixed(6));
console.log(median.toFixed(6));
'''
hints = [
  "`/` on two numbers is already true division — there is no integer division to fall into by accident. The starter did it on purpose, with `Math.floor`, and threw the fraction away.",
