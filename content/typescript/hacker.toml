map          = { x = 0.185, y = 0.313, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` distinct integers **already in ascending
order**.

Print every subset, one per line, values space separated, the empty subset as
`-`. Order them the way the obvious recursion produces them: at each position,
first the branch that **takes** the element, then the branch that skips it.
Then print `SUBSETS <2^n>`.

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

Push, recurse, **pop**. The pop is the part people leave out, and the symptom
is every line after the first being too long. The one shared `chosen` array
is the point: `[...chosen, x]` on every call would also be correct, and it
copies the whole selection at every level to avoid writing one line. The order
here is the recursion's own, and that is what is being checked.

For `2^n`, `1 << n` is a 32-bit shift and is wrong from `n = 31`; the count
of lines you printed is the honest number anyway.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function build(nums: number[], at: number, chosen: number[], out: string[]): void {
  // at the end of the list, record `chosen`; otherwise take it, recurse,
  // undo, then skip it and recurse
}

const nums: number[] = input.trim().split(/\s+/).slice(1).map(Number);

const out: string[] = [];
build(nums, 0, [], out);

out.push(`SUBSETS ${out.length}`);
console.log(out.join("\n"));
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function build(nums: number[], at: number, chosen: number[], out: string[]): void {
  if (at === nums.length) {
    out.push(chosen.length > 0 ? chosen.join(" ") : "-");
    return;
  }

  chosen.push(nums[at]);
  build(nums, at + 1, chosen, out);
  chosen.pop();

  build(nums, at + 1, chosen, out);
}

const nums: number[] = input.trim().split(/\s+/).slice(1).map(Number);

const out: string[] = [];
build(nums, 0, [], out);

out.push(`SUBSETS ${out.length}`);
console.log(out.join("\n"));
'''
