id           = "typescript.hacker.10.tree-walk"
node         = 10
title        = "THREE WAYS ROUND A TREE"
difficulty   = 4
time_limit_s = 900
story        = "A tree on the whiteboard and the question nobody should have to think about twice: name the three orders."
concepts     = ["trees", "recursion", "stacks-queues"]
requires     = ["typescript.hacker.09.linked-list"]
map          = { x = 0.671, y = 0.280, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` values in **level order**, where `-1` means
"no node here" — so the tree is stored the way a heap is: the children of
index `i` are `2i+1` and `2i+2`.

Print four lines: the **preorder**, **inorder** and **postorder** walks, each
space separated, and then `DEPTH <d>` — the number of nodes on the longest
root-to-leaf path.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

Preorder is node, left, right. Inorder is left, node, right. Postorder is
left, right, node. The recursion is the same three lines each time and only
the position of the `push` moves. The recursion here is as deep as the tree,
which for a heap-shaped array is `log n`, so node's stack — on the order of
ten thousand frames by default — is not a concern. Say that out loud, because it will be
asked.

Past the end of the array, `tree[i]` is `undefined`, not `-1`. The type says
`number`; the base case has to check the index as well as the value.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function walk(tree: number[], i: number, order: number, out: number[]): void {
  // order 0 = preorder, 1 = inorder, 2 = postorder
}

function depth(tree: number[], i: number): number {
  return 0;
}

const tree: number[] = input.trim().split(/\s+/).slice(1).map(Number);

for (let order = 0; order < 3; order++) {
  const out: number[] = [];
  walk(tree, 0, order, out);
  console.log(out.join(" "));
}
console.log(`DEPTH ${depth(tree, 0)}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function present(tree: number[], i: number): boolean {
  // past the end, tree[i] is undefined, whatever the type says
  return i < tree.length && tree[i] !== -1;
}

function walk(tree: number[], i: number, order: number, out: number[]): void {
  if (!present(tree, i)) return;
  if (order === 0) out.push(tree[i]);
  walk(tree, 2 * i + 1, order, out);
  if (order === 1) out.push(tree[i]);
  walk(tree, 2 * i + 2, order, out);
  if (order === 2) out.push(tree[i]);
}

function depth(tree: number[], i: number): number {
  if (!present(tree, i)) return 0;
  return 1 + Math.max(depth(tree, 2 * i + 1), depth(tree, 2 * i + 2));
}

const tree: number[] = input.trim().split(/\s+/).slice(1).map(Number);

for (let order = 0; order < 3; order++) {
  const out: number[] = [];
  walk(tree, 0, order, out);
  console.log(out.join(" "));
}
console.log(`DEPTH ${depth(tree, 0)}`);
'''
hints = [
  "One recursive function with the push in three possible places beats three near-identical functions.",
  "The base case is both conditions at once: past the end of the array, or sitting on a -1.",
  "Depth is 1 + the deeper of the two children, and 0 for a missing node.",
]

