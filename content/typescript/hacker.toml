solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Entry = [value: number, which: number, at: number];

function less(a: Entry, b: Entry): boolean {
  return a[0] < b[0] || (a[0] === b[0] && a[1] < b[1]);
}

class MinHeap {
  private items: Entry[] = [];

  get size(): number {
    return this.items.length;
  }

  push(entry: Entry): void {
    const h = this.items;
    h.push(entry);
    let i = h.length - 1;
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (!less(h[i], h[parent])) break;
      [h[i], h[parent]] = [h[parent], h[i]];
      i = parent;
    }
  }

  pop(): Entry | undefined {
    const h = this.items;
    const top = h[0];
    const last = h.pop();
    if (h.length > 0 && last !== undefined) {
      h[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let smallest = i;
        if (l < h.length && less(h[l], h[smallest])) smallest = l;
        if (r < h.length && less(h[r], h[smallest])) smallest = r;
        if (smallest === i) break;
        [h[i], h[smallest]] = [h[smallest], h[i]];
        i = smallest;
      }
    }
    return top;
  }
}

const values: number[] = input.trim().split(/\s+/).map(Number);
let at = 0;
const k = values[at++];
const lists: number[][] = [];
for (let i = 0; i < k; i++) {
  const count = values[at++];
  lists.push(values.slice(at, at + count));
  at += count;
}

const heap = new MinHeap();
lists.forEach((items, which) => {
  if (items.length > 0) heap.push([items[0], which, 0]);
});

const out: number[] = [];
for (let entry = heap.pop(); entry !== undefined; entry = heap.pop()) {
  const [value, which, index] = entry;
  out.push(value);
  if (index + 1 < lists[which].length) {
    heap.push([lists[which][index + 1], which, index + 1]);
  }
}

console.log(out.join(" "));
console.log(`POPS ${out.length}`);
'''
hints = [
  "The heap entry has to carry where the value came from, or you cannot refill after popping it. A labelled tuple, `[value: number, which: number, at: number]`, says so in the type.",
  "Sift up: while the entry is less than its parent `(i - 1) >> 1`, swap them. Sift down: while a child is less, swap with the smaller child. `[h[i], h[p]] = [h[p], h[i]]` swaps without a temporary.",
  "In `pop`, take the root, then `pop()` the last entry off the array; if anything is left, put that entry at the root and sift it down. Get that order wrong and a one-entry heap hands back its only entry twice.",
  "Push the next element of a list only when you pop one of its elements — that keeps the heap at k.",
]

