taking both `5 7` items is worth `14`. The hidden cases are small, so what
they check is that you got both numbers right, not that the table is fast.

Compare the ratios exactly. There is no fraction type here, and `value /
weight` is a double: two ratios that are equal on paper can come out a bit
apart in binary, and then the tie-break never runs. Cross-multiply instead —
`a.value * b.weight` against `b.value * a.weight` — which is exact in integers
