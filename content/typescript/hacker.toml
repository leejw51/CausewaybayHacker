map          = { x = 0.199, y = 0.742, kind = "quest" }
brief        = '''
Line one is `k`, the number of **commands** that follow. The commands are
whitespace-separated tokens packed across the remaining lines however they
happened to wrap — any number per line, any amount of spacing, possibly a
trailing blank line.

| command | tokens | effect |
| --- | --- | --- |
| `ADD <cents>` | two | push an item |
| `VOID` | one | remove the last item, or do nothing if there is none |
| `TOTAL` | one | print the current sum |
| `CLEAR` | one | remove everything |

After the `k` commands, print `COMMANDS <k>` and `ITEMS <how many are left>`.

```
