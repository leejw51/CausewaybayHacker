brief        = '''
Line one is `n`. Line two is `n` integers, in order.

Build a singly linked list from them — a class with `value` and
`next: ListNode | null` — and then answer from the nodes. The reversal, the
middle and the length all come from walking the chain, not from the array you
read the input into; collecting the output in an array to `join` it at the end
is fine. Print three lines:

1. the list reversed, space separated
2. the value at the middle node (for an even `n`, the second of the two)
3. `LEN <n>` counted by walking the list, not by trusting the input

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

The middle is the runner: one pointer one step at a time, one two steps at a
time, and when the fast one runs out the slow one is there. One pass.

Reverse it with a loop, not a recursion. A recursive reverse is three pretty
lines and a `RangeError: Maximum call stack size exceeded` somewhere past ten
thousand nodes, and the version of this question with a million nodes is the
one that gets asked.

`strictNullChecks` is on, and on this quest it earns its keep: `slow.next` is
`ListNode | null`, and tsc will not let you step onto it until you have said
what happens when it is `null`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

class ListNode {
  constructor(
    public value: number,
    public next: ListNode | null = null,
  ) {}
}

const values: number[] = input.trim().split(/\s+/).slice(1).map(Number);

let head: ListNode | null = null;

// build the list, reverse it, find the middle by walking twice as fast
console.log("?");
console.log(0);
console.log("LEN 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

class ListNode {
  constructor(
    public value: number,
    public next: ListNode | null = null,
  ) {}
}

const values: number[] = input.trim().split(/\s+/).slice(1).map(Number);

// build it back to front, so each new node points at what we had
let head: ListNode | null = null;
for (let i = values.length - 1; i >= 0; i--) head = new ListNode(values[i], head);

// walk it to count, and run a second pointer at half speed for the middle
let length = 0;
let slow: ListNode | null = head;
let fast: ListNode | null = head;
while (fast !== null) {
  length++;
  fast = fast.next;
  if (fast !== null) {
    length++;
    fast = fast.next;
    slow = slow!.next;
  }
}
const middle = slow !== null ? slow.value : 0;

// reverse by moving nodes off the front of one list onto the front of another
let reversed: ListNode | null = null;
let cursor: ListNode | null = head;
while (cursor !== null) {
  const following: ListNode | null = cursor.next;
  cursor.next = reversed;
  reversed = cursor;
  cursor = following;
}

const out: number[] = [];
for (let walk = reversed; walk !== null; walk = walk.next) out.push(walk.value);

console.log(out.join(" "));
console.log(middle);
console.log(`LEN ${length}`);
'''
hints = [
  "Building back to front is the easy direction: each new node takes the old head as its next.",
  "Save `cursor.next` before you overwrite it. Once `cursor.next` points backwards, the rest of the old list is unreachable.",
  "For the middle, advance slow only on the steps where fast managed two. tsc narrows `fast` after a `!== null` check, and forgets it again after you reassign it — which is exactly the right thing to forget.",
]

