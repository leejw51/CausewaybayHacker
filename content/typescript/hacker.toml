const input: string = require("fs").readFileSync(0, "utf8");

const tokens = input.split(/\s+/).filter((t) => t !== "");
let at = 0;
const commands = Number(tokens[at++]);

const items: number[] = [];
const out: string[] = [];

for (let c = 0; c < commands; c++) {
  const command = tokens[at++] ?? "";
  if (command === "ADD") {
    // the argument is a second token of the same command
    items.push(Number(tokens[at++] ?? "0"));
  } else if (command === "VOID") {
    items.pop(); // undefined on an empty till, and nothing uses it
  } else if (command === "TOTAL") {
    // reduce with no initial value throws on an empty array
    out.push(String(items.reduce((sum, v) => sum + v, 0)));
  } else if (command === "CLEAR") {
    items.length = 0;
  }
}

out.push(`COMMANDS ${commands}`);
out.push(`ITEMS ${items.length}`);
console.log(out.join("\n"));
'''
