brief        = '''
Standard input is `r c pct seed`. Build the grid yourself, in row-major order,
drawing **two** values for every cell, in 64-bit arithmetic that wraps (a
`bigint`, wrapped with `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Move only **right** or **down**, through open cells. Print:

1. `PATHS <k>` — how many distinct routes from `(0,0)` to `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — the smallest total cost of a route, counting both endpoints,
   or `-1` if there is no route

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

One pass in row-major order does both: a cell's routes are the sum of the
routes into it from above and from the left, and its best cost is its own cost
plus the cheaper of those two. Because you only ever move right or down, the
two cells you need are always already finished — which is why this needs no
recursion and no visited set. A memoised recursion would also be linear in
the cells, and on the `1000 × 1000` case it would be two thousand frames deep.
Node's stack holds that, which is not the same as it being the answer: the
loop has no depth at all, and a `2000 × 2000` follow-up is one question away.

The `PATHS` count is taken modulo `1000000007` for the usual reason: on the
`1000 × 1000` hidden case the true number has over six hundred digits. Here
that is not a style point. A `number` would stop being exact past `2^53`
within the first few dozen rows and then quietly print a wrong residue, so
reduce as you add — two residues below `1000000007` sum to under `2^31`, which
is exact.

**What the big case enforces:** it rejects any answer that enumerates routes.
There are more of them than there are atoms in the room.

A million cells in a `number[][]` is a million boxed slots in a thousand
arrays; a flat `Float64Array(r * c)` indexed `i * c + j` is one block of memory
and the same code.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const P = 1000000007;

const [rows, cols, pct, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

// flat row-major tables: cell (i, j) lives at i * cols + j
const open = new Uint8Array(rows * cols).fill(1);
const cost = new Int32Array(rows * cols);
for (let i = 0; i < rows; i++) {
  for (let j = 0; j < cols; j++) {
    const a = next();
    const b = next();
    const corner = (i === 0 && j === 0) || (i === rows - 1 && j === cols - 1);
    if (!corner && a % 100 < pct) open[i * cols + j] = 0;
    cost[i * cols + j] = (b % 9) + 1;
  }
}

// fill `ways` and `best` in row-major order
const ways = new Float64Array(rows * cols);
const best = new Float64Array(rows * cols).fill(Infinity);

console.log("PATHS 0");
console.log("MIN -1");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const P = 1000000007;

const [rows, cols, pct, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

// flat row-major tables: cell (i, j) lives at i * cols + j
const open = new Uint8Array(rows * cols).fill(1);
const cost = new Int32Array(rows * cols);
for (let i = 0; i < rows; i++) {
  for (let j = 0; j < cols; j++) {
    const a = next();
    const b = next();
    const corner = (i === 0 && j === 0) || (i === rows - 1 && j === cols - 1);
    if (!corner && a % 100 < pct) open[i * cols + j] = 0;
    cost[i * cols + j] = (b % 9) + 1;
  }
}

// Infinity means unreachable; a cell with no reachable neighbour above or
// left stays that way
const ways = new Float64Array(rows * cols);
const best = new Float64Array(rows * cols).fill(Infinity);

for (let i = 0; i < rows; i++) {
  for (let j = 0; j < cols; j++) {
    const at = i * cols + j;
    if (!open[at]) continue;
    if (at === 0) {
      ways[0] = 1;
      best[0] = cost[0];
      continue;
    }
    let routes = 0;
    let cheapest = Infinity;
    if (i > 0 && best[at - cols] !== Infinity) {
      routes += ways[at - cols];
      cheapest = best[at - cols];
    }
    if (j > 0 && best[at - 1] !== Infinity) {
      routes += ways[at - 1];
      cheapest = Math.min(cheapest, best[at - 1]);
    }
    // two residues below P add to under 2^31: exact, and reduced at once
    ways[at] = routes % P;
    best[at] = cheapest + cost[at];
  }
}

const end = rows * cols - 1;
console.log(`PATHS ${ways[end]}`);
console.log(`MIN ${best[end] === Infinity ? -1 : best[end]}`);
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
  "An open cell with no reachable neighbour above or left is reachable by zero routes and has no best cost. `Infinity` is the honest unreachable: `Math.min` ignores it and `Infinity + cost` is still `Infinity`.",
  "The destination can be open and still unreachable, which is exactly when PATHS is 0 and MIN is -1. One of the hidden cases is that.",
]

