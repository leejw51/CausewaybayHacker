story        = "The phrase appears at the bottom of the statement and half the room does not know what it is asking them to do."
concepts     = ["math", "complexity", "recursion"]
requires     = ["typescript.hacker.31.palindrome"]
map          = { x = 0.335, y = 0.936, kind = "quest" }
brief        = '''
Standard input is `n q seed`. Generate `q` queries, in 64-bit arithmetic that
wraps (a `bigint`, wrapped with `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

For each query compute the binomial coefficient `C(a, b)` **modulo
1000000007**. Print the sum of all `q` answers, itself modulo `1000000007`,
then `LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` has hundreds of thousands of digits at these sizes, so every
multiplication is reduced as you go. The problem is the division:
`a! / (b! (a-b)!)` has no meaning in modular arithmetic. What replaces it is
the **modular inverse**, and because `1000000007` is prime, Fermat's little
theorem gives it to you: `inverse(v) = v^(p-2) mod p`, by repeated squaring.

So: precompute `factorial[0..n]` once, and answer each query as
`f[a] * inv(f[b]) * inv(f[a-b])`.

**And here is the trap this language adds.** Both factors are below `2^30`,
so their product is below `2^60` — and a `number` is a double, exact only to
`2^53`. `a * b % P` in plain numbers does not overflow, does not throw, and is
wrong: with it, even the sample comes out as `504334178`. Either do the
multiplication in `bigint`, or split one factor into two 15-bit halves so no
intermediate passes `2^46` — the starter carries that `mulmod` already, and it
is worth being able to derive.

**The complexity here is enforced.** One hidden case is `n = 200000`,
`q = 200000`. Computing each coefficient independently — multiply `b` terms,
divide by `b` terms, one modular inverse each — had not finished after thirty
seconds here, against the ten second run limit; that is the starter. One
shared factorial table finishes in about a tenth of a second. Both measured
on this machine.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const P = 1000000007;

// a * b mod P without leaving the doubles' exact range: a * b itself can be
// 2^60, and a number is only exact to 2^53, so multiply in two 15-bit halves
function mulmod(a: number, b: number): number {
  return (((a * (b >>> 15)) % P) * 32768 + a * (b & 32767)) % P;
}

function powmod(base: number, exp: number): number {
  let result = 1;
  for (; exp > 0; exp = Math.floor(exp / 2)) {
    if (exp % 2 === 1) result = mulmod(result, base);
    base = mulmod(base, base);
  }
  return result;
}

const [n, q, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

let total = 0;
let last = 0;
for (let k = 0; k < q; k++) {
  const a = next() % (n + 1);
  const b = next() % (a + 1);

  // correct, and far too slow: b multiplications and a modular inverse
  // for every single query
  let numerator = 1;
  let denominator = 1;
  for (let t = 0; t < b; t++) {
    numerator = mulmod(numerator, a - t);
    denominator = mulmod(denominator, t + 1);
  }
  const value = mulmod(numerator, powmod(denominator, P - 2));

  total = (total + value) % P;
  last = value;
}

console.log(total);
console.log(`LAST ${last}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const P = 1000000007;

// a * b mod P without leaving the doubles' exact range: a * b itself can be
// 2^60, and a number is only exact to 2^53, so multiply in two 15-bit halves
// (a * 2^15 stays under 2^45, and so does each partial sum)
function mulmod(a: number, b: number): number {
  return (((a * (b >>> 15)) % P) * 32768 + a * (b & 32767)) % P;
}

// P is prime, so Fermat gives v^(P-2) as the inverse of v
function powmod(base: number, exp: number): number {
  let result = 1;
  for (; exp > 0; exp = Math.floor(exp / 2)) {
    if (exp % 2 === 1) result = mulmod(result, base);
    base = mulmod(base, base);
  }
  return result;
}

const [n, q, seed] = input.trim().split(/\s+/).map(Number);

// one shared factorial table, and its inverses walked back down from one pow
const factorial = new Array<number>(n + 1).fill(1);
for (let i = 1; i <= n; i++) factorial[i] = mulmod(factorial[i - 1], i);
const inverse = new Array<number>(n + 1).fill(1);
inverse[n] = powmod(factorial[n], P - 2);
for (let i = n; i > 0; i--) inverse[i - 1] = mulmod(inverse[i], i);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

let total = 0;
let last = 0;
for (let k = 0; k < q; k++) {
  const a = next() % (n + 1);
  const b = next() % (a + 1);

  const value = mulmod(mulmod(factorial[a], inverse[b]), inverse[a - b]);

  total = (total + value) % P;
  last = value;
}

console.log(total);
console.log(`LAST ${last}`);
'''
hints = [
  "Reduce after every multiplication, and never multiply two residues with a bare `*`: past 2^53 a double keeps the high bits and drops the low ones, and the low ones are the answer.",
  "`powmod(v, P - 2)` is the modular inverse, and it only works because P is prime — that is the whole content of Fermat's little theorem here.",
  "Precomputing inverse factorials as well — `inverse[n] = powmod(factorial[n], P - 2)`, then `inverse[i - 1] = inverse[i] * i` walking down — removes both pows from every query. Two `mulmod`s per query is all that is left.",
]

