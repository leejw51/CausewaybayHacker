[[quest]]
id           = "typescript.hacker.03.intervals"
node         = 3
title        = "THE SHIFT ROTA"
difficulty   = 4
time_limit_s = 900
story        = "They hand you the booking sheet for the Times Square big screen and ask which hours are actually sold."
concepts     = ["intervals", "sorting", "complexity"]
requires     = ["typescript.hacker.02.window"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief        = '''
Line one is `n`. The next `n` lines are `<start> <end>` with `start <= end`.

Merge every pair that overlaps or touches, and print the result in increasing
order, one `<start> <end>` per line, then `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Touching counts as overlapping: `1 4` and `4 5` merge into `1 5`.

The four cases here are three or four intervals each, and the clock is not
measuring speed on them. Sorting and sweeping is `O(n log n)`; a version that
rescans the merged list for every interval is `O(n²)` and clears these four
just as easily. The bar is real on a real booking sheet. It is not what these
cases check.

`Array.prototype.sort` with no comparator **converts everything to strings**
and sorts those. `[[10, 12], [2, 6]].sort()` leaves `10,12` first, because the
character `1` is less than `2`. Every sort of numbers in this interview takes a
comparator: `(p, q) => p[0] - q[0]`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const n = data[0];
const spans: [number, number][] = [];
for (let i = 0; i < n; i++) spans.push([data[1 + 2 * i], data[2 + 2 * i]]);

// sort, sweep, merge, print, then COUNT <k>
console.log(`COUNT ${spans.length}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const n = data[0];
const spans: [number, number][] = [];
for (let i = 0; i < n; i++) spans.push([data[1 + 2 * i], data[2 + 2 * i]]);

// a comparator, always: the default sort compares the arrays as strings
spans.sort((p, q) => p[0] - q[0] || p[1] - q[1]);

const merged: [number, number][] = [];
for (const [start, end] of spans) {
  const top = merged[merged.length - 1];
  if (top !== undefined && start <= top[1]) {
    if (end > top[1]) top[1] = end;
  } else {
    merged.push([start, end]);
  }
}

const out: string[] = merged.map(([start, end]) => `${start} ${end}`);
out.push(`COUNT ${merged.length}`);
console.log(out.join("\n"));
'''
hints = [
  "Sort by start first, with a comparator. After that one left-to-right pass is enough and you never look backwards more than one interval.",
  "Extend the last merged interval when the new start is <= its end; otherwise push a new one. A `[number, number]` tuple is an array, so `merged[merged.length - 1][1] = end` changes it in place.",
  "Extend to Math.max(last end, end) — a short interval swallowed by a long one must not shrink it.",
]

