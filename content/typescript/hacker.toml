brief        = '''
Line one is `n k`. Line two is `n` words separated by spaces.

Print the `k` most frequent words, most frequent first, ties broken by the
word ascending, one per line. If there are fewer than `k` distinct words,
print all of them. Then print `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Count with a `Map`, then rank. The tie-break is not decoration. A `Map`
iterates in **insertion order** — the order the words first appeared in the
input — and `sort` is stable, so sorting by count alone leaves ties in that
order, which is not what the statement says and is not what the interviewer
is listening for. Making the comparison **total** — count descending, then
the word ascending — is what fixes it.

Compare the words with `<` and `>`, which order by UTF-16 code unit: for
lowercase ASCII that is the alphabet. `localeCompare` is the other answer
people give, and it orders by the machine's locale rules, which is a
different contract from the one the statement wrote.

The four cases here are a handful of words, and the clock is not measuring
speed on them: counting by scanning the whole list once per distinct word is
`O(n²)` and clears all four. On a year of tickets it would not. What these
cases check is the tie-break, which is the part people actually get wrong.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const tokens = input.trim().split(/\s+/);
const k = Number(tokens[1]);
const words = tokens.slice(2);

const counts = new Map<string, number>();

// count, rank by count descending then word ascending, print k of them,
// then DISTINCT <d>
console.log(`DISTINCT ${counts.size}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const tokens = input.trim().split(/\s+/);
const k = Number(tokens[1]);
const words = tokens.slice(2);

const counts = new Map<string, number>();
for (const word of words) counts.set(word, (counts.get(word) ?? 0) + 1);

// total order: count descending, then the word ascending by code unit
const ranked = [...counts].sort(
  (a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0),
);

const out: string[] = ranked.slice(0, k).map(([word]) => word);
out.push(`DISTINCT ${ranked.length}`);
console.log(out.join("\n"));
'''
