# TYPESCRIPT LAND — HACKER. The sixth interview. HKU, Chow Yei Ching Building,
# Room 7-32 again, a clock on the wall, and this time a language whose types
# are checked once, before anything runs, and then erased.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
# See docs/decisions.md, 2026-09-11, for where that key lives in the TOML.
#
# The 34 problems mirror content/python/hacker.toml node for node — same
# concepts, difficulty, map, route, clock and test cases — so a player can sit
# the same interview in any land. The ids mirror too — the LRU boss is
# `typescript.hacker.28.lru` at node 34, exactly as it is in the other lands —
# because SPEC §12 makes the id an identity and `node` the position. Node 16,
# `16.union-find`, takes the `n m seed` input Python converted it to, with the
# same four cases.
#
# One hidden case follows Rust, Go and C++ rather than Python: range-queries
# runs `500000 4000000 7`, where Python shrank it to 300000 operations for its
# interpreter. It is forced. At Python's size the naive per-query loop took
# 17 s here against a 10 s limit, too close to reject it on a faster machine;
# at the shared size the Fenwick tree takes 0.45 s. Every other case is
# byte-identical to the Python pack, including the 8000-character one-letter
# palindrome case, which the quadratic answer clears in 0.12 s.
#
# The boss is the one quest whose starter fails for a different reason. The
# Python boss is THE RECURSION LIMIT, and node's stack, on the order of ten
# thousand frames, would carry a recursive starter through the 2000-operation
# case.
# THE ERASURE's starter is a `Record<number, number>` cache that evicts
# `Object.keys(cache)[0]`: integer-like keys enumerate in ascending numeric
# order, not insertion order, and the keys are strings at runtime whatever the
# type said. Same problem, same cases; its concept `recursion` became `types`,
# because the starter no longer recurses and the lesson is the erasure.
#
# The slow starters were measured on this machine against their 10 s limits:
# union-find's walk-per-link had not finished after 60 s, the O(n²) inversion
# count took 42 s, the scanning Dijkstra 26 s, and modular's per-query product
# had not finished after 30 s. `32.modular` does not multiply two residues with
# `*`: their product passes 2^53, so it carries a 15-bit split `mulmod`, and
# its solution precomputes inverse factorials so a query is two of them.
#
# Every program is one main.ts, compiled with `tsc -p .` under
# backend/runner/src/typescript/tsconfig.json (strict, es2022, lib es2023, no
# @types/node) beside node.d.ts, and run as `node --enable-source-maps main.js`.
# Standard input is always
#     const input: string = require("fs").readFileSync(0, "utf8");
# The generator's 64-bit state is a `bigint` wrapped with `BigInt.asUintN(64,
# …)`; everything after `x >> 33n` is an exact `number`. No heap, deque or
# bisect ships with the language, so the solutions that need one write it.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

#
# **Which quests enforce their complexity differs by land, and that is a
# measurement rather than an oversight.** All the packs hold the same problems
# in the same order under the same ids, and the small cases are identical
# wherever the problem is the same problem. What differs is the big case that
# rejects a correct-but-slow answer: it is sized per land, and in several
# quests it exists in one land and not another. Whether a generated input can
# punish the naive answer is a fact about the language and its runtime, and
# each land measured it rather than assuming it. TypeScript keeps Python's
# enforced set — union-find, inversions, dijkstra, range-queries, palindrome,
# modular, grid-paths — and leaves `06.stack` alone for the reason Python
# gives: the naive next-greater scan is only quadratic on near-descending
# input, which this generator never produces.

pack = "typescript.hacker"
land = "typescript"
category = "hacker"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id           = "typescript.hacker.01.two-sum"
node         = 1
title        = "TWO FARES"
difficulty   = 3
time_limit_s = 600
story        = "Room 7-32, sixth time. The first question is the one everybody gets, and the clock starts on the way in."
concepts     = ["hashing", "complexity", "collections"]
requires     = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` integers.

Print the **1-based** indices `i j` of two different entries that add up to
`target`, as `i j` with `i < j`. If more than one pair works, give the one
whose second index is smallest; if that still ties, the smallest first index.
If no pair works, print `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

The hidden cases here are small: they check the tie-break and the
no-answer case, not your speed. The question is still the linear one — one
pass, one `Map` — because a real `n` is 200000 and the nested loop is what
this question exists to weed out. Write the answer the question is asking for,
not the one that happens to clear these four cases.

`seen.get(key)` is typed `number | undefined`, and the type is telling you
something: the index you stored may be `0`, and `0` is falsy. `if (i)` drops
every match whose first half is the first entry. Compare with `!== undefined`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const data: number[] = input.trim().split(/\s+/).map(Number);
  const [n, target] = data;
  const nums = data.slice(2, 2 + n);

  const seen = new Map<number, number>();

  // one pass: for each value, has target - value been seen already?
  console.log(-1);
}

main();
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const data: number[] = input.trim().split(/\s+/).map(Number);
  const [n, target] = data;
  const nums = data.slice(2, 2 + n);

  const seen = new Map<number, number>();
  for (let j = 0; j < nums.length; j++) {
    const i = seen.get(target - nums[j]);
    // i may be 0, which is falsy: test for undefined, not for truth
    if (i !== undefined) {
      console.log(`${i + 1} ${j + 1}`);
      return;
    }
    // keep the first index of a repeated value: that is the tie-break
    if (!seen.has(nums[j])) seen.set(nums[j], j);
  }
  console.log(-1);
}

main();
'''
hints = [
  "One pass. For each value ask whether target minus it has already been seen.",
  "Only set a value the first time you see it — `if (!seen.has(x)) seen.set(x, j)` keeps the first index of a repeat, which is the tie-break the statement asks for.",
  "`seen.get(...)` is `undefined` for a miss and `0` for the first entry. Both are falsy, so `if (i)` cannot tell them apart; `i !== undefined` can.",
  "Print and return the moment you find it — the first hit as you scan is already the smallest second index.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "4 9\n2 7 11 15\n",      expect = "1 2\n",  visible = true },
  { name = "late",    stdin = "5 10\n1 2 3 4 6\n",     expect = "4 5\n",  visible = false },
  { name = "none",    stdin = "3 100\n1 2 3\n",        expect = "-1\n",   visible = false },
  { name = "signed",  stdin = "6 0\n-3 4 3 90 -1 1\n", expect = "1 3\n",  visible = false },
]

# ---------------------------------------------------------------- 02
[[quest]]
id           = "typescript.hacker.02.window"
node         = 2
title        = "NO REPEATS"
difficulty   = 4
time_limit_s = 900
story        = "The second question is on the board before you have put the marker down."
concepts     = ["two-pointers", "strings", "complexity"]
requires     = ["typescript.hacker.01.two-sum"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief        = '''
One line of text, no spaces.

Print the length of the longest run of characters with no repeat in it, then
the run itself. If several runs tie, print the leftmost.

```
input:  abcabcbb
output: 3
        abc
```

The window only ever moves right. If you find yourself rescanning from the
start after a repeat, you have written the quadratic one.

The four cases here are a dozen characters at most, and the clock is not
measuring speed on them — the quadratic one clears them too. There is no big
hidden case because there is no honest one to build: on text with a small
alphabet the longest run is bounded by the alphabet, so rescanning costs a
constant factor and not a quadratic one, and the input that would punish it
is not text any more. Write the one-pass answer because it is the answer, not
because these four cases force it.

`text[i]` is one UTF-16 code unit, not one character in every script. The
input here is plain ASCII, so the two are the same; on a Times Square caption
with an emoji in it they are not, and the interviewer may ask.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const text = input.trim();

const last = new Map<string, number>();

// print the best length, then the run itself
console.log(0);
console.log("?");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const text = input.trim();

const last = new Map<string, number>();
let start = 0;
let bestLen = 0;
let bestStart = 0;

for (let i = 0; i < text.length; i++) {
  const c = text[i];
  const previous = last.get(c);
  if (previous !== undefined && previous >= start) start = previous + 1;
  last.set(c, i);
  const length = i - start + 1;
  if (length > bestLen) {
    bestLen = length;
    bestStart = start;
  }
}

console.log(bestLen);
console.log(text.slice(bestStart, bestStart + bestLen));
'''
hints = [
  "Keep the index where each character was last seen in a `Map<string, number>`, and the index the window starts at.",
  "A repeat only matters if its last position is inside the current window — that is the `previous !== undefined && previous >= start` test.",
  "Record the best length *and* where it started, or you cannot print the run at the end. `text.slice(start, start + length)` is the run.",
]

