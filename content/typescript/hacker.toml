[[quest]]
id           = "typescript.hacker.06.stack"
node         = 6
title        = "THE NEXT BIGGER ONE"
difficulty   = 4
time_limit_s = 900
story        = "The Yee Wo Street tram board lists the next arrivals' fares in a column, and they ask one question: for each of them, which is the next one after it that is bigger."
concepts     = ["stacks-queues", "slices", "complexity"]
requires     = ["typescript.hacker.05.binary-search"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

For each entry print the first entry **to its right** that is strictly
greater, or `-1` if there is none. Put them on one line, space separated. Then
print `NONE <k>`, how many of them were `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Keep a stack of positions whose answer is still unknown, and it stays
decreasing from the bottom up. Each position is pushed once and popped once,
so the whole thing is one pass however it looks. An array is the stack:
`push` and `pop` at the end are both `O(1)`.

The five cases here are six numbers at most, and the clock is not measuring
speed on them. Nor would a bigger one, and that is worth knowing: the naive
answer — for each entry, walk right until something bigger turns up — is
quadratic only on input that is already close to descending. On random input
it stops after about `ln(n)` steps on average, so on generated values no run
limit separates the two. The stack is still the answer, because it is `O(n)`
on every input including the descending one — but on this quest that is a
claim you have to take on the argument rather than on the clock.

`pending.pop()` is typed `number | undefined`, because an empty array pops
`undefined` rather than throwing. Read the top with
`pending[pending.length - 1]` after checking the length, and the `undefined`
never arises.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const n = data[0];
const nums = data.slice(1, 1 + n);

const answer: number[] = new Array<number>(n).fill(-1);
const pending: number[] = [];

console.log(answer.join(" "));
console.log(`NONE ${n}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const n = data[0];
const nums = data.slice(1, 1 + n);

const answer: number[] = new Array<number>(n).fill(-1);
const pending: number[] = [];

for (let i = 0; i < n; i++) {
  const value = nums[i];
  while (pending.length > 0 && nums[pending[pending.length - 1]] < value) {
    answer[pending.pop()!] = value;
  }
  pending.push(i);
}

console.log(answer.join(" "));
console.log(`NONE ${answer.filter((v) => v === -1).length}`);
'''
