        POW2 YES
        0
```

`x ^ x == 0` and `x ^ 0 == x`, and xor does not care what order it happens in.
That is the whole first line. `x & (x - 1)` clears the lowest set bit, which
gives you the third and fourth lines for free.

Every bitwise operator here converts its operands to a **32-bit signed**
integer first. The values in these cases are small, so that costs nothing —
but `2 ** 31 | 0` is `-2147483648`, and a value at or past `2^31` would come
out negative or truncated without a word. Past that line, `bigint` has the
same operators with no width at all. Know where the line is before the
interviewer asks.

The four cases here are five numbers at most, and the clock is not measuring
speed on them: a `Map` of counts clears every one, and so would sorting. Nor
would a bigger case change that, because the bar this question sets is
**space** — one accumulator and nothing else — and no run limit can tell a
constant-space answer from a `Map`. That one is on your honour, and on the
interviewer, who will ask.
