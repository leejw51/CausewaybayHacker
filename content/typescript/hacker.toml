[[quest]]
id           = "typescript.hacker.16.union-find"
node         = 16
title        = "WHO IS CONNECTED TO WHOM"
difficulty   = 5
time_limit_s = 1200
story        = "The tram network, the MTR and the minibus routes on one sheet. How many separate networks are there really."
concepts     = ["disjoint-set", "graphs", "complexity"]
requires     = ["typescript.hacker.15.topo-sort"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops numbered `0..n-1`, `m` undirected
links. There are no links in the input — you build them, with **exactly** this
generator, in 64-bit arithmetic that wraps (a `number` cannot hold it — use a
`bigint` and `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

Print three lines: how many separate networks there are, the size of the
largest, and `REDUNDANT <k>` — how many of the links joined two stops that
were already connected. A link from a stop to itself is one of those.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

For `8 5 1` the five links are `6—1`, `4—6`, `2—3`, `2—6`, `1—2`. The last one
joins two stops already in the same network, so it is the redundant one, and
what is left is `{1,2,3,4,6}` plus stops `0`, `5` and `7` on their own.

The generator is where this language bites first. A `number` is a double,
exact only up to `2^53`, and `x * 6364136223846793005` is far past that: in
`number` arithmetic the state is wrong from the first step, silently. In
`bigint` it is exact, `BigInt.asUintN(64, …)` is the wrap, and `x >> 33n` is
below `2^31`, so `Number(x >> 33n)` brings it back as an exact `number` for
everything else.

**The complexity here is enforced.** One hidden case is `n = 200000` with
`m = 200000` links. The obvious answer that is not union-find — walk the
network out from `a` and see whether `b` is already in it, once per link — is
correct, and it is `O(n)` per link and so `O(n·m)` in total: on this machine
it had not finished after **a minute**, against a ten second run limit. That
is what the starter is. Union-find with path compression and union by size
does the same 200000 links in about **a tenth of a second**, measured here
with the solution that ships in this quest.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer on
the sample and on both of the small hidden cases. It is rejected only for
arriving far too late.

Union-find: every stop points at a parent, `find` walks to the root, `union`
points one root at the other. Compress the path on the way back out of `find`
and the whole thing is effectively constant time per query.

Write `find` as a loop. The recursive one is the textbook version, and it is
a `RangeError: Maximum call stack size exceeded` on a chain some ten thousand
long — which is exactly the shape union-by-size exists to prevent, and exactly
the shape a hostile input has before the first `find` ever compresses it.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const [n, m, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

const links: number[][] = Array.from({ length: n }, () => []);
let redundant = 0;

for (let e = 0; e < m; e++) {
  const a = next() % n;
  const b = next() % n;

  // correct, and far too slow: walk the whole network out from a to see
  // whether b is already in it. This is what the big hidden case rejects.
  const seen: boolean[] = new Array(n).fill(false);
  seen[a] = true;
  const queue: number[] = [a];
  let head = 0;
  let found = a === b;
  while (head < queue.length && !found) {
    const at = queue[head++];
    for (const nxt of links[at]) {
      if (!seen[nxt]) {
        if (nxt === b) {
          found = true;
          break;
        }
        seen[nxt] = true;
        queue.push(nxt);
      }
    }
  }
  if (found) redundant++;
  links[a].push(b);
  links[b].push(a);
}

let groups = 0;
let largest = 0;
const seen: boolean[] = new Array(n).fill(false);
for (let start = 0; start < n; start++) {
  if (seen[start]) continue;
  groups++;
  seen[start] = true;
  const queue: number[] = [start];
  let head = 0;
  while (head < queue.length) {
    const at = queue[head++];
    for (const nxt of links[at]) {
      if (!seen[nxt]) {
        seen[nxt] = true;
        queue.push(nxt);
      }
    }
  }
  if (queue.length > largest) largest = queue.length;
}

console.log(groups);
console.log(largest);
console.log(`REDUNDANT ${redundant}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function find(parent: Int32Array, x: number): number {
  let root = x;
  while (parent[root] !== root) root = parent[root];
  // path compression: point everything we walked over straight at the root
  while (parent[x] !== root) {
    const next = parent[x];
    parent[x] = root;
    x = next;
  }
  return root;
}

const [n, m, seed] = input.trim().split(/\s+/).map(Number);

// a number is a double: 64-bit wrapping arithmetic has to be a bigint
let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

const parent = new Int32Array(n);
const size = new Int32Array(n).fill(1);
for (let i = 0; i < n; i++) parent[i] = i;
let groups = n;
let redundant = 0;

for (let e = 0; e < m; e++) {
  let a = find(parent, next() % n);
  let b = find(parent, next() % n);
  if (a === b) {
    redundant++;
    continue;
  }
  // hang the smaller tree under the bigger one
  if (size[a] < size[b]) [a, b] = [b, a];
  parent[b] = a;
  size[a] += size[b];
  groups--;
}

let largest = 0;
for (let i = 0; i < n; i++) {
  if (parent[i] === i && size[i] > largest) largest = size[i];
}

console.log(groups);
console.log(largest);
console.log(`REDUNDANT ${redundant}`);
'''
hints = [
  "Draw the two endpoints as you go — one generator step each, in that order — rather than building a list of links first. Nothing here needs the links twice.",
  "Start with every stop as its own parent and n groups; each successful union drops the count by one. An `Int32Array` for the parents is as fast as it gets and says what it holds.",
  "A link whose two ends already have the same root is the redundant one — count it and move on. A self-link, a === b, falls out of that test on its own.",
  "Only a root's size entry is meaningful, so read the largest off the roots, not off every index.",
  "Every literal in the bigint line takes an `n` suffix — `6364136223846793005n` — and mixing a `bigint` with a `number` in one expression is a compile error, not a conversion. That error is tsc doing its job.",
]

