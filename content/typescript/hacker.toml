[[quest]]
id           = "typescript.hacker.22.trie"
node         = 22
title        = "THE PREFIX BOX"
difficulty   = 5
time_limit_s = 1500
story        = "Autocomplete for the tram-stop board — the honest kind, that only completes what is actually on the list."
concepts     = ["tries", "strings", "collections"]
requires     = ["typescript.hacker.21.matrix"]
map          = { x = 0.953, y = 0.667, kind = "quest" }
brief        = '''
Line one is `n q`. The next `n` lines are lowercase words to insert. The next
`q` lines are queries, each `WORD <s>` or `PREFIX <s>`.

Build a trie — a tree of nodes each holding a map from letter to child —
and answer:

* `WORD <s>` → `YES` if `s` was inserted, `NO` otherwise
* `PREFIX <s>` → how many of the `n` inserted words start with `s`

The `n` words are not promised to be distinct, and `PREFIX` counts
**insertions**, not distinct words: insert `tram` twice and `PREFIX tram` is
`2`. `NODES` counts nodes, so the second insertion adds none.

Then print `NODES <k>`, the number of nodes in the trie including the root.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

Keep a count on every node of how many inserted words pass through it, and
`PREFIX` is a walk with no counting at the end. A node is a small class; the
children are a `Map<string, TrieNode>` keyed by the letter. A plain `{}`
would survive single letters, and the habit is the problem: key one by whole
words and `"constructor" in {}` is already `true`, answered by a prototype you
never inserted into. A `Map` has no inherited keys to trip on.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

class TrieNode {
  children = new Map<string, TrieNode>();
  through = 0;
  terminal = false;
}

const lines = input.split("\n");
const [n, q] = lines[0].trim().split(/\s+/).map(Number);

const root = new TrieNode();
let nodes = 1;

for (let i = 0; i < n; i++) {
  const word = lines[1 + i].trim();
  // walk down, creating nodes as needed, bumping `through`
}

const out: string[] = [];
for (let i = 0; i < q; i++) {
  const query = lines[1 + n + i].trim().split(/\s+/);
  out.push("NO");
}
out.push(`NODES ${nodes}`);
console.log(out.join("\n"));
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

class TrieNode {
  children = new Map<string, TrieNode>();
  through = 0;
  terminal = false;
}

const lines = input.split("\n");
const [n, q] = lines[0].trim().split(/\s+/).map(Number);

const root = new TrieNode();
let nodes = 1;

for (let i = 0; i < n; i++) {
  const word = lines[1 + i].trim();
  let at = root;
  for (const letter of word) {
    let child = at.children.get(letter);
    if (child === undefined) {
      child = new TrieNode();
      at.children.set(letter, child);
      nodes++;
    }
    child.through++;
    at = child;
  }
  at.terminal = true;
}

const out: string[] = [];
for (let i = 0; i < q; i++) {
  const [kind, text = ""] = lines[1 + n + i].trim().split(/\s+/);

  let at: TrieNode | undefined = root;
  for (const letter of text) {
    at = at.children.get(letter);
    if (at === undefined) break;
  }

  if (kind === "WORD") out.push(at !== undefined && at.terminal ? "YES" : "NO");
  else out.push(String(at !== undefined ? at.through : 0));
}
out.push(`NODES ${nodes}`);
console.log(out.join("\n"));
'''
hints = [
  "`children.get(letter)` returns undefined for a missing child, and undefined is the signal both to create one on insert and to stop on lookup.",
  "`through` is bumped on the node you step *onto*, so the root never counts itself.",
  "A query that falls off the trie leaves the cursor `undefined`, and `TrieNode | undefined` makes tsc ask you what NO and 0 look like in that case.",
]

