map          = { x = 0.396, y = 0.276, kind = "quest" }
brief        = '''
Line one is `k`. Then `k` lines, each a count followed by that many integers,
already sorted ascending.

Print all of them merged into one ascending line, space separated, then
`POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

There is no heap in the standard library, so the heap is part of the answer:
an array where the children of `i` are `2i+1` and `2i+2`, `push` that sifts
the new entry up, `pop` that moves the last entry to the root and sifts it
down. Twenty-five lines, and being able to write them cold is what this quest
is for. The entry is `[value, which list, how far into it]`, and the
comparison is value first, then the list index — any order on the tie will do,
as long as it is *some* order.

The heap holds one entry per list, not one per element, so it stays at size
`k` however long the lists are.

The four cases here are a handful of numbers across two or three lists, and
the clock is not measuring speed on them: pouring everything into one array
and sorting it clears all four, and so does rescanning all `k` heads on every
step. The heap is what keeps it `O(N log k)` when `k` is large, and that is a
promise about input these cases do not contain.
'''
