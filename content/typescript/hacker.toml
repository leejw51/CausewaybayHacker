[[quest]]
id           = "typescript.hacker.24.inversions"
node         = 24
title        = "THE ONE THE CLOCK CATCHES"
difficulty   = 5
time_limit_s = 1500
story        = "First question of the afternoon round. The naive answer is correct, and it is the wrong answer."
concepts     = ["sorting", "complexity", "recursion"]
requires     = ["typescript.hacker.23.prefix-sums"]
map          = { x = 0.666, y = 0.676, kind = "quest" }
brief        = '''
Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in 64-bit arithmetic that
wraps:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

Count the **inversions**: pairs `i < j` where `a[i] > a[j]`. Print the count,
then `MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**This quest enforces its complexity, and it is the only kind that can.** One
hidden case is `n = 200000`. The `O(n²)` double loop — which is what the
starter is — is `2 × 10^10` comparisons and took **forty-two seconds** on
this machine, against a ten second run limit. Counting inversions during a
merge sort is `O(n log n)` and finishes in about a tenth of a second. Measured,
on this machine, with these two programs.

Three things this language decides differently. The generator state does not
fit a `number` — it is a double, exact only to `2^53` — so it is a `bigint`,
wrapped with `BigInt.asUintN(64, …)` after every step. The answer,
`9990744366`, would not fit in a 32-bit integer; a `number` holds it exactly,
and it stays exact only as long as nothing applies `| 0` or `>>` to it. And
`Math.max(...values)` spreads two hundred thousand arguments onto the call
stack, which on this machine is a `RangeError` before it is an answer: take
the maximum with a loop.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function generate(n: number, seed: number): number[] {
  let x = BigInt(seed);
  const values: number[] = [];
  for (let i = 0; i < n; i++) {
    x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
    values.push(Number(x >> 33n) % 1000000007);
  }
  return values;
}

const [n, seed] = input.trim().split(/\s+/).map(Number);

const values = generate(n, seed);
let largest = 0;
for (const v of values) if (v > largest) largest = v;

// correct, and far too slow: this is what the big hidden case rejects
let inversions = 0;
for (let i = 0; i < n; i++) {
  for (let j = i + 1; j < n; j++) {
    if (values[i] > values[j]) inversions++;
  }
}

console.log(inversions);
console.log(`MAX ${largest}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function generate(n: number, seed: number): number[] {
  // a number is a double, exact only to 2^53: the state has to be a bigint
  let x = BigInt(seed);
  const values: number[] = [];
  for (let i = 0; i < n; i++) {
    x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
    values.push(Number(x >> 33n) % 1000000007);
  }
  return values;
}

// Merge sort of a[lo..hi), returning how many inversions it removed.
// `buf` is one scratch array shared by every level.
function sortCount(a: number[], buf: number[], lo: number, hi: number): number {
  if (hi - lo < 2) return 0;
  const mid = lo + Math.floor((hi - lo) / 2);
  let inversions = sortCount(a, buf, lo, mid) + sortCount(a, buf, mid, hi);

  let i = lo;
  let j = mid;
  let k = lo;
  while (i < mid && j < hi) {
    if (a[i] <= a[j]) {
      buf[k++] = a[i++];
    } else {
      // a[i..mid) are all greater than a[j]
      inversions += mid - i;
      buf[k++] = a[j++];
    }
  }
  while (i < mid) buf[k++] = a[i++];
  while (j < hi) buf[k++] = a[j++];
  for (let t = lo; t < hi; t++) a[t] = buf[t];
  return inversions;
}

const [n, seed] = input.trim().split(/\s+/).map(Number);

const values = generate(n, seed);

// a loop, not Math.max(...values): 200000 arguments do not fit on the stack
let largest = 0;
for (const v of values) if (v > largest) largest = v;

const work = values.slice();
const inversions = sortCount(work, new Array<number>(n).fill(0), 0, n);

console.log(inversions);
console.log(`MAX ${largest}`);
'''
hints = [
  "Take the max with a loop before you sort, or sort a copy: a merge sort that works in place leaves the original array reordered. And do not spread 200000 values into `Math.max`.",
  "When the right-hand value wins the merge, every remaining element of the left half is greater than it — that is `mid - i` inversions in one go, and it is the whole trick.",
  "The recursion is log2(200000), about eighteen frames deep — nowhere near the limit. Merge through one scratch buffer allocated once, rather than slicing new arrays at every level. A Fenwick tree over the compressed values is the other O(n log n) answer and is worth naming in the room.",
]

