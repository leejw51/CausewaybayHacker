solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const n = data[0];
const original: number[][] = [];
for (let r = 0; r < n; r++) original.push(data.slice(1 + r * n, 1 + (r + 1) * n));

// a copy of every row, not of the outer array alone
const grid = original.map((row) => row.slice());
for (let r = 0; r < n; r++) {
  for (let c = r + 1; c < n; c++) {
    [grid[r][c], grid[c][r]] = [grid[c][r], grid[r][c]];
  }
}
for (const row of grid) row.reverse();

const out: string[] = grid.map((row) => row.join(" "));

const spiral: number[] = [];
let top = 0;
let bottom = n - 1;
let left = 0;
let right = n - 1;
while (top <= bottom && left <= right) {
  for (let c = left; c <= right; c++) spiral.push(original[top][c]);
  top++;
  for (let r = top; r <= bottom; r++) spiral.push(original[r][right]);
  right--;
  if (top <= bottom) {
    for (let c = right; c >= left; c--) spiral.push(original[bottom][c]);
    bottom--;
  }
  if (left <= right) {
    for (let r = bottom; r >= top; r--) spiral.push(original[r][left]);
    left++;
  }
}
out.push(spiral.join(" "));
console.log(out.join("\n"));
'''
