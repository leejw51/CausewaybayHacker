brief        = '''
Standard input is `n q seed`. Build an array of `n` values and then run `q`
operations, all from the same generator, in 64-bit arithmetic that wraps (a
`bigint`, wrapped with `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

Print the running total of every query answer, then `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**The complexity here is enforced.** The naive answer — add up
`values[l..r]` for every query — is `O(n)` per query, and a tight loop over a
packed array is fast enough to be deceptive on anything small. So the big
hidden case is `n = 500000, q = 4000000`, the same size Rust, Go and C++ run.
At three hundred thousand operations — the size the Python version of this
quest uses — the naive loop took **seventeen seconds** here, already past the
ten second run limit, and the big case has thirteen times as many. A Fenwick tree
does the whole four million in under **half a second**. Both measured, with
the two programs in this quest.

The lesson is the one an interviewer is fishing for: *point update, range sum*
is the exact shape a Fenwick tree exists for. Three short functions — add,
prefix, and range as the difference of two prefixes — and `i & -i` is how you
step by the lowest set bit. That is a 32-bit operation, and it is exact here
because every index is below `2^31`. The total is not: it passes `2^32` on the
big case, and a `number` holds it exactly only because it stays under `2^53`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const [n, q, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

const values: number[] = [];
for (let i = 0; i < n; i++) values.push(next() % 1000);

let total = 0;
let updates = 0;
for (let op = 0; op < q; op++) {
  const a = next();
  const b = next();
  const c = next();
  if (a % 2 === 0) {
    values[b % n] += (c % 1000) + 1;
    updates++;
  } else {
    let l = b % n;
    let r = c % n;
    if (l > r) [l, r] = [r, l];
    // correct, and far too slow at four million operations
    for (let i = l; i <= r; i++) total += values[i];
  }
}

console.log(total);
console.log(`UPDATES ${updates}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

// Fenwick tree, 1-based inside. `add` and `prefix` are both O(log n).
class Fenwick {
  private readonly tree: Float64Array;

  constructor(n: number) {
    this.tree = new Float64Array(n + 1);
  }

  add(index: number, delta: number): void {
    for (let i = index + 1; i < this.tree.length; i += i & -i) {
      this.tree[i] += delta; // step up by the lowest set bit
    }
  }

  prefix(upto: number): number {
    let total = 0;
    for (let i = upto; i > 0; i -= i & -i) total += this.tree[i];
    return total;
  }

  range(l: number, r: number): number {
    return this.prefix(r + 1) - this.prefix(l);
  }
}

const [n, q, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
function next(): number {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  return Number(x >> 33n);
}

const fenwick = new Fenwick(n);
for (let i = 0; i < n; i++) fenwick.add(i, next() % 1000);

let total = 0;
let updates = 0;
for (let op = 0; op < q; op++) {
  const a = next();
  const b = next();
  const c = next();
  if (a % 2 === 0) {
    fenwick.add(b % n, (c % 1000) + 1);
    updates++;
  } else {
    let l = b % n;
    let r = c % n;
    if (l > r) [l, r] = [r, l];
    total += fenwick.range(l, r);
  }
}

console.log(total);
console.log(`UPDATES ${updates}`);
'''
hints = [
  "Build the tree by calling add once per initial value. The O(n) bottom-up build is a nice optimisation and is not what the clock is testing.",
  "`i & -i` isolates the lowest set bit. Adding it walks up the tree; subtracting it walks down.",
  "`range(l, r)` is `prefix(r + 1) - prefix(l)`, and getting that pair of off-by-ones right is most of the debugging. A `Float64Array(n + 1)` for the tree holds the sums exactly and never turns into an array of mixed types.",
]

