[[quest]]
id           = "typescript.hacker.34.stable-sort"
node         = 33
title        = "TIES KEEP THEIR PLACE"
difficulty   = 4
time_limit_s = 900
story        = "Two riders finished on the same score and the leaderboard on the Times Square screen puts them in a different order every time it redraws."
concepts     = ["sorting", "slices", "complexity"]
requires     = ["typescript.hacker.33.grid-paths"]
map          = { x = 0.605, y = 0.932, kind = "quest" }
brief        = '''
Standard input is `n buckets seed`. Build `n` riders, where rider `i` has
index `i` and a score, in 64-bit arithmetic that wraps (a `bigint`, wrapped
with `BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Sort the riders by score **descending**. Riders with the same score must keep
the order they arrived in. Print their indices, space separated, then
`TIES <k>` — how many adjacent pairs in your sorted order have equal scores.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` is small, so almost everything is a tie, and the answer is almost
entirely decided by what happens to them.

**This is the quest about knowing which sort you are holding.**
`Array.prototype.sort` has been required to be **stable** since ES2019, and
V8 has kept that promise since 2018. What is *not* stable is sorting ascending
and then calling `.reverse()`: that reverses the ties along with everything
else, and it is what the starter does. On the sample it visibly scrambles
them; on a real input it always will.

There are two correct answers and you should be able to give both. Sort
descending with a comparator — `(a, b) => b.score - a.score` — and let
stability do the rest. **Or** make the comparison **total** —
`b.score - a.score || a.index - b.index` — so no two elements ever compare
equal and stability stops being a question. The second is what to reach for
by default; a total order has nothing to prove, including on an engine older
than the promise.

And the comparator is not optional. `sort()` with none compares the riders
as the strings their `toString` gives, and an object's is `[object Object]`
for every one of them.

The clock is not measuring speed here, and there is nothing for it to
measure: `sort` is `sort` whichever of the two you write. These four cases are
decided entirely by what happens to the ties. This one is about knowing what
your sort promises, not about how fast it keeps the promise.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Rider {
  score: number;
  index: number;
}

const [n, buckets, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
const riders: Rider[] = [];
for (let i = 0; i < n; i++) {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  riders.push({ score: Number(x >> 33n) % buckets, index: i });
}

// ascending, then reversed — so the ties come out backwards
riders.sort((a, b) => a.score - b.score).reverse();

let ties = 0;
for (let i = 1; i < riders.length; i++) if (riders[i - 1].score === riders[i].score) ties++;
console.log(riders.map((r) => r.index).join(" "));
console.log(`TIES ${ties}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Rider {
  score: number;
  index: number;
}

const [n, buckets, seed] = input.trim().split(/\s+/).map(Number);

let x = BigInt(seed);
const riders: Rider[] = [];
for (let i = 0; i < n; i++) {
  x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
  riders.push({ score: Number(x >> 33n) % buckets, index: i });
}

// sort is stable (ES2019), so a descending comparator keeps equal scores in
// arrival order. The equally correct alternative is
//     (a, b) => b.score - a.score || a.index - b.index
// which makes the comparison total and so needs no stability at all.
riders.sort((a, b) => b.score - a.score);

let ties = 0;
for (let i = 1; i < riders.length; i++) if (riders[i - 1].score === riders[i].score) ties++;
console.log(riders.map((r) => r.index).join(" "));
console.log(`TIES ${ties}`);
'''
hints = [
  "Delete the `.reverse()` and flip the comparator to `b.score - a.score`. That is the stable answer, and the language promises it.",
  "The other answer is `b.score - a.score || a.index - b.index` — a total order, so there are no ties left to be unstable about.",
  "TIES counts adjacent equal scores in the finished order, and that count is the same whichever of the two you wrote — it is the index order that gives you away.",
]

