timeout_ms = 10000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample", stdin = "8 1\n",          expect = "19\nMAX 908834774\n",          visible = true },
  { name = "single", stdin = "1 7\n",          expect = "0\nMAX 59165271\n",            visible = false },
  { name = "dozen",  stdin = "12 99\n",        expect = "33\nMAX 998275676\n",          visible = false },
  { name = "big",    stdin = "200000 12345\n", expect = "9990744366\nMAX 999991076\n",  visible = false },
]

