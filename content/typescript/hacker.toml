brief        = '''
Line one is `r c`. The next `r` lines are a grid of lowercase letters. The
last line is the word.

The word is in the grid if you can spell it by moving up, down, left or right
between **adjacent** cells, never using the same cell twice in one attempt.

Print `FOUND` or `ABSENT`, then `STARTS <k>`: how many cells hold the word's
first letter.

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

Mark the cell used on the way in and **unmark it on the way out**. A cell
that stays marked after a failed branch makes later branches fail for a reason
that is not in the grid. A `string` cannot be marked in place — it is
immutable, and tsc rejects `row[c] = "#"` on one because a string's index
signature is read-only — so the grid has to become a `string[][]` first, with
`line.split("")`.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

function search(grid: string[][], r: number, c: number, word: string, at: number): boolean {
  return false;
}

const data = input.trim().split(/\s+/);
const rows = Number(data[0]);
const cols = Number(data[1]);
const grid: string[][] = data.slice(2, 2 + rows).map((line) => line.split(""));
const word = data[2 + rows];

let starts = 0;

console.log("ABSENT");
console.log(`STARTS ${starts}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function search(grid: string[][], r: number, c: number, word: string, at: number): boolean {
  if (grid[r][c] !== word[at]) return false;
  if (at + 1 === word.length) return true;

  const here = grid[r][c];
  grid[r][c] = "#";

  // || short-circuits, so the first direction that spells the rest of the
  // word stops the other three from being tried at all
  const found =
    (r > 0 && search(grid, r - 1, c, word, at + 1)) ||
    (r + 1 < grid.length && search(grid, r + 1, c, word, at + 1)) ||
    (c > 0 && search(grid, r, c - 1, word, at + 1)) ||
    (c + 1 < grid[r].length && search(grid, r, c + 1, word, at + 1));

  grid[r][c] = here;
  return found;
}

const data = input.trim().split(/\s+/);
const rows = Number(data[0]);
const cols = Number(data[1]);
const grid: string[][] = data.slice(2, 2 + rows).map((line) => line.split(""));
const word = data[2 + rows];

// count the starting letters before any cell is marked
let starts = 0;
for (const row of grid) for (const cell of row) if (cell === word[0]) starts++;

// stop at the first cell the word spells out from; some() short-circuits
const cells: [number, number][] = [];
for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([r, c]);
const found = cells.some(([r, c]) => search(grid, r, c, word, 0));

console.log(found ? "FOUND" : "ABSENT");
console.log(`STARTS ${starts}`);
'''
hints = [
  "Overwrite the cell with a character the word cannot contain, recurse, then put the original back.",
  "Count the starting letters in a separate pass before you search, or the '#' marks will confuse the count.",
  "The success base case is `at + 1 === word.length` — checked after matching this cell, not before.",
  "Chain the four directions with `||` rather than four ifs and a `found` flag: `||` already stops at the first branch that succeeds, and so does `.some()` over the starting cells. Carrying on after a hit is work you were asked not to do.",
]

