[[quest]]
id           = "typescript.hacker.28.lru"
node         = 34
title        = "THE ERASURE"
difficulty   = 5
time_limit_s = 1800
story        = "The sixth interview, Room 7-32. The types are gone at runtime and the clock is not."
concepts     = ["collections", "linked-lists", "types", "complexity"]
requires     = ["typescript.hacker.34.stable-sort", "typescript.hacker.24.inversions"]
map          = { x = 0.818, y = 0.870, kind = "boss" }
brief        = '''
Line one is `cap q`, and then either `q` lines of operations, each
`PUT <key> <value>` or `GET <key>` — or, when line one carries a **third**
number `seed`, no further lines at all, and the `q` operations come from the
generator below.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key. A `PUT` of a
key the cache already holds replaces its value and makes it the most recent —
it adds no entry, so it evicts nothing however full the cache is.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The generated form, in 64-bit arithmetic that wraps (a `bigint`, wrapped with
`BigInt.asUintN(64, …)`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**The starter compiles clean under `strict`, and it is wrong.** It keeps the
cache in a `Record<number, number>` and leans on a fact everybody half
remembers: objects keep their keys in insertion order. So a touch is delete
and re-insert, and the coldest entry is `Object.keys(cache)[0]`. Run it on the
sample and `GET 2` prints `20`.

That is the boss. The type said the keys were `number`s, and the types are
gone at runtime: an object's keys are **strings**, `Object.keys` hands them
back as `"1"` and `"2"`, and the insertion-order rule has an exception written
into the language for exactly these keys — **integer-like keys come first, in
ascending numeric order**, wherever they were inserted. Deleting `1` and
putting it back changes nothing about where it sorts. The eviction removes the
smallest key, not the coldest one, and tsc cannot say a word about it, because
nothing in the program is ill-typed. Everything it checked was true when it
checked it.

The fix is the structure that means what the starter assumed: a `Map`. Its
keys stay `number`s, and its iteration order is insertion order with no
exceptions. `delete` and `set` is the touch, `cache.keys().next().value` is the
cold end, `[...cache.keys()].reverse()` is most-recent-first — and all of it is
`O(1)` per operation, which a hash map into a doubly linked list gives you in
other languages and which `Map` gives you here with the pointers hidden.

(In the Python version of this interview the boss was the recursion limit,
and the two-thousand-operation hidden case is still here. Node's stack is
on the order of ten thousand frames deep, so a head-then-recurse-on-the-tail version
would get through it — which is a fact about this input, not a reason to
write one. A sequence of operations is a `for` loop.)
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Op = { kind: "GET"; key: number } | { kind: "PUT"; key: number; value: number };

function readOperations(lines: string[]): { cap: number; ops: Op[] } {
  const header = lines[0].trim().split(/\s+/).map(Number);
  const [cap, q] = header;
  const ops: Op[] = [];
  if (header.length === 3) {
    let x = BigInt(header[2]);
    const next = (): number => {
      x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
      return Number(x >> 33n);
    };
    for (let i = 0; i < q; i++) {
      const a = next();
      const key = next() % (2 * cap);
      if (a % 4 === 0) ops.push({ kind: "GET", key });
      else ops.push({ kind: "PUT", key, value: next() % 100 });
    }
  } else {
    for (const line of lines.slice(1, 1 + q)) {
      const [kind, key, value] = line.trim().split(/\s+/);
      if (kind === "GET") ops.push({ kind, key: Number(key) });
      else ops.push({ kind: "PUT", key: Number(key), value: Number(value) });
    }
  }
  return { cap, ops };
}

const { cap, ops } = readOperations(input.split("\n"));

// "objects remember insertion order", so the first key is the coldest one:
// delete and re-insert to touch, evict Object.keys(cache)[0]
const cache: Record<number, number> = {};
let size = 0;
let evicted = 0;
const out: string[] = [];

for (const op of ops) {
  if (op.kind === "GET") {
    if (op.key in cache) {
      const value = cache[op.key];
      delete cache[op.key];
      cache[op.key] = value;
      out.push(String(value));
    } else {
      out.push("-1");
    }
    continue;
  }

  if (op.key in cache) {
    delete cache[op.key];
    cache[op.key] = op.value;
    continue;
  }
  if (size >= cap) {
    const coldest = Object.keys(cache)[0];
    delete cache[Number(coldest)];
    size--;
    evicted++;
  }
  cache[op.key] = op.value;
  size++;
}

const alive = Object.keys(cache).reverse();
out.push(alive.length > 0 ? alive.join(" ") : "-");
out.push(`EVICTED ${evicted}`);
console.log(out.join("\n"));
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Op = { kind: "GET"; key: number } | { kind: "PUT"; key: number; value: number };

function readOperations(lines: string[]): { cap: number; ops: Op[] } {
  const header = lines[0].trim().split(/\s+/).map(Number);
  const [cap, q] = header;
  const ops: Op[] = [];
  if (header.length === 3) {
    let x = BigInt(header[2]);
    const next = (): number => {
      x = BigInt.asUintN(64, x * 6364136223846793005n + 1442695040888963407n);
      return Number(x >> 33n);
    };
    for (let i = 0; i < q; i++) {
      const a = next();
      const key = next() % (2 * cap);
      if (a % 4 === 0) ops.push({ kind: "GET", key });
      else ops.push({ kind: "PUT", key, value: next() % 100 });
    }
  } else {
    for (const line of lines.slice(1, 1 + q)) {
      const [kind, key, value] = line.trim().split(/\s+/);
      if (kind === "GET") ops.push({ kind, key: Number(key) });
      else ops.push({ kind: "PUT", key: Number(key), value: Number(value) });
    }
  }
  return { cap, ops };
}

const { cap, ops } = readOperations(input.split("\n"));

// A Map keeps its keys as numbers and in insertion order, whatever they are:
// cold end first, hot end last. delete + set is the touch, the first key is
// the eviction, and every one of them is O(1).
const cache = new Map<number, number>();
let evicted = 0;
const out: string[] = [];

for (const op of ops) {
  if (op.kind === "GET") {
    const value = cache.get(op.key);
    if (value === undefined) {
      out.push("-1");
    } else {
      cache.delete(op.key);
      cache.set(op.key, value);
      out.push(String(value));
    }
    continue;
  }

  if (cache.has(op.key)) {
    // an overwrite adds no entry, so it evicts nothing
    cache.delete(op.key);
    cache.set(op.key, op.value);
    continue;
  }
  if (cache.size >= cap) {
    const coldest = cache.keys().next().value;
    if (coldest !== undefined) {
      cache.delete(coldest);
      evicted++;
    }
  }
  cache.set(op.key, op.value);
}

const alive = [...cache.keys()].reverse();
out.push(alive.length > 0 ? alive.join(" ") : "-");
out.push(`EVICTED ${evicted}`);
console.log(out.join("\n"));
'''
hints = [
  "Run the sample by hand against the starter and print `Object.keys(cache)` after every operation. The order you see is not the order you inserted.",
  "`Record<number, V>` is a type; the object underneath has string keys, and integer-like string keys enumerate in ascending numeric order before every other key. That rule is in the spec, not an engine quirk.",
  "`new Map<number, number>()`: `delete` then `set` on every hit and every overwrite, and when a new key arrives at a full cache, delete `cache.keys().next().value`. Overwriting a key that is already present is not an eviction — check `has` before you decide the cache is full.",
  "The survivors are the Map read from the hot end: `[...cache.keys()].reverse()`, with no sort and no stamps.",
]

