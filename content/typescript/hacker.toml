id           = "typescript.hacker.29.dijkstra"
node         = 28
title        = "NOT EVERY STREET IS THE SAME LENGTH"
difficulty   = 5
time_limit_s = 1500
story        = "Every map you have cleared so far counted hops. The tram does not care how many stops there are; it cares how long they take."
concepts     = ["graphs", "heaps", "complexity"]
requires     = ["typescript.hacker.27.commands"]
map          = { x = 0.114, y = 0.663, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops, `m` undirected weighted edges. Build
the graph yourself, with **exactly** this generator, in 64-bit arithmetic that
wraps (a `bigint`, wrapped with `BigInt.asUintN(64, …)` — a `number` cannot
hold the state):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Print the sum of the shortest distances from stop `0` to every reachable stop
(including `0` itself, which is `0`), then `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**The complexity here is enforced.** One hidden case is `n = 100000`,
`m = 200000`. Dijkstra is the right algorithm either way; what the clock
decides is the priority queue. Scanning every unvisited node for the minimum
is `O(V²)` — `10^10` steps, and on this machine that took **twenty-six
seconds**, against a ten second run limit. A binary heap makes it
`O((V + E) log V)` and it finishes in about a quarter of a second. Both measured
on this machine, with the two programs that ship in this quest: the starter is
the scanning version.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer. It
is rejected only for arriving far too late.

There is no priority queue in the standard library; the heap is yours, the
same one as the merge quest with `[distance, node]` entries ordered by
distance. It needs no decrease-key: push the improved distance as a new entry
and skip any entry you pop whose distance is already worse than the one you
have recorded. That "stale entry" skip is the line people forget, and without
it the heap grows without bound.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Rng {
  private x: bigint;
  constructor(seed: number) {
    this.x = BigInt(seed);
  }
  next(): number {
    this.x = BigInt.asUintN(64, this.x * 6364136223846793005n + 1442695040888963407n);
    return Number(this.x >> 33n);
  }
}

type Edge = [to: number, weight: number];

function build(n: number, m: number, seed: number): Edge[][] {
  const rng = new Rng(seed);
  const graph: Edge[][] = Array.from({ length: n }, () => []);
  for (let i = 1; i < n; i++) {
    const p = rng.next() % i;
    const w = (rng.next() % 1000) + 1;
    graph[p].push([i, w]);
    graph[i].push([p, w]);
  }
  for (let e = 0; e < Math.max(0, m - (n - 1)); e++) {
    const a = rng.next() % n;
    const b = rng.next() % n;
    const w = (rng.next() % 1000) + 1;
    graph[a].push([b, w]);
    graph[b].push([a, w]);
  }
  return graph;
}

const [n, m, seed] = input.trim().split(/\s+/).map(Number);

const graph = build(n, m, seed);
const dist: (number | undefined)[] = new Array(n).fill(undefined);
const done: boolean[] = new Array(n).fill(false);
dist[0] = 0;

// correct, and far too slow: the minimum is found by scanning every node
for (let round = 0; round < n; round++) {
  let best = -1;
  let bestDist = Infinity;
  for (let u = 0; u < n; u++) {
    const d = dist[u];
    if (!done[u] && d !== undefined && d < bestDist) {
      bestDist = d;
      best = u;
    }
  }
  if (best < 0) break;
  done[best] = true;
  for (const [v, w] of graph[best]) {
    const d = dist[v];
    if (d === undefined || bestDist + w < d) dist[v] = bestDist + w;
  }
}

let total = 0;
let largest = 0;
for (const d of dist) {
  if (d === undefined) continue;
  total += d;
  if (d > largest) largest = d;
}
console.log(total);
console.log(`MAX ${largest}`);
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Rng {
  private x: bigint;
  constructor(seed: number) {
    this.x = BigInt(seed);
  }
  next(): number {
    this.x = BigInt.asUintN(64, this.x * 6364136223846793005n + 1442695040888963407n);
    return Number(this.x >> 33n);
  }
}

type Edge = [to: number, weight: number];
type Entry = [distance: number, node: number];

class MinHeap {
  private items: Entry[] = [];

  push(entry: Entry): void {
    const h = this.items;
    h.push(entry);
    let i = h.length - 1;
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (h[parent][0] <= h[i][0]) break;
      [h[i], h[parent]] = [h[parent], h[i]];
      i = parent;
    }
  }

  pop(): Entry | undefined {
    const h = this.items;
    const top = h[0];
    const last = h.pop();
    if (h.length > 0 && last !== undefined) {
      h[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let smallest = i;
        if (l < h.length && h[l][0] < h[smallest][0]) smallest = l;
        if (r < h.length && h[r][0] < h[smallest][0]) smallest = r;
        if (smallest === i) break;
        [h[i], h[smallest]] = [h[smallest], h[i]];
        i = smallest;
      }
    }
    return top;
  }
}

function build(n: number, m: number, seed: number): Edge[][] {
  const rng = new Rng(seed);
  const graph: Edge[][] = Array.from({ length: n }, () => []);
  for (let i = 1; i < n; i++) {
    const p = rng.next() % i;
    const w = (rng.next() % 1000) + 1;
    graph[p].push([i, w]);
    graph[i].push([p, w]);
  }
  for (let e = 0; e < Math.max(0, m - (n - 1)); e++) {
    const a = rng.next() % n;
    const b = rng.next() % n;
    const w = (rng.next() % 1000) + 1;
    graph[a].push([b, w]);
    graph[b].push([a, w]);
  }
  return graph;
}

const [n, m, seed] = input.trim().split(/\s+/).map(Number);

const graph = build(n, m, seed);
const dist = new Float64Array(n).fill(Infinity);
dist[0] = 0;

const heap = new MinHeap();
heap.push([0, 0]);
for (let entry = heap.pop(); entry !== undefined; entry = heap.pop()) {
  const [d, u] = entry;
  // a stale entry: we already found a shorter way to u
  if (d > dist[u]) continue;
  for (const [v, w] of graph[u]) {
    const candidate = d + w;
    if (candidate < dist[v]) {
      dist[v] = candidate;
      heap.push([candidate, v]);
    }
  }
}

let total = 0;
let largest = 0;
for (const d of dist) {
  if (d === Infinity) continue;
  total += d;
  if (d > largest) largest = d;
}
console.log(total);
console.log(`MAX ${largest}`);
'''
