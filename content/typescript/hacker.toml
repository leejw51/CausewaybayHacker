solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Item {
  weight: number;
  value: number;
}

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, cap] = data;
const items: Item[] = [];
for (let i = 0; i < n; i++) items.push({ weight: data[2 + 2 * i], value: data[3 + 2 * i] });

const best: number[] = new Array<number>(cap + 1).fill(0);
for (const { weight, value } of items) {
  // downwards, so this item cannot be picked up twice in one pass
  for (let room = cap; room >= weight; room--) {
    const candidate = best[room - weight] + value;
    if (candidate > best[room]) best[room] = candidate;
  }
}

// best ratio first, lighter first on a tie; cross-multiplying keeps it exact
const order = [...items].sort(
  (a, b) => b.value * a.weight - a.value * b.weight || a.weight - b.weight,
);
let room = cap;
let greedy = 0;
for (const { weight, value } of order) {
  if (weight <= room) {
    room -= weight;
    greedy += value;
  }
}

console.log(best[cap]);
console.log(`GREEDY ${greedy}`);
'''
