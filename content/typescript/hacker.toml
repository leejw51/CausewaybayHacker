brief        = '''
Line one is `n`. Line two is `n` integers.

Print the length of the longest **strictly increasing subsequence** — the
values keep their order but need not be adjacent. Then print
`TAILS <k>` where `k` is that same length, read off the patience-sorting pile
count.

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

The `O(n²)` table is the answer you should be able to write cold. The `O(n log n)`
one keeps, for each length, the smallest value a subsequence of that length can
end on — an array that is always sorted, so the position of a new value is a
binary search. There is no `bisect` here: it is a lower bound, six lines, and
the off-by-one in it is the question. Either passes here; the cases are small
and say so. Write the second one anyway, because the follow-up is always "and
faster?".
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

// the first index in the sorted array whose value is >= value
function lowerBound(sorted: number[], value: number): number {
  return 0;
}

const nums: number[] = input.trim().split(/\s+/).slice(1).map(Number);

const tails: number[] = [];

// for each value, find where it belongs among the pile tops and put it there
console.log(0);
console.log("TAILS 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

// the first index in the sorted array whose value is >= value
function lowerBound(sorted: number[], value: number): number {
  let low = 0;
  let high = sorted.length;
  while (low < high) {
    const mid = Math.floor((low + high) / 2);
    if (sorted[mid] < value) low = mid + 1;
    else high = mid;
  }
  return low;
}

const nums: number[] = input.trim().split(/\s+/).slice(1).map(Number);

// tails[i] = the smallest value an increasing subsequence of length i+1
// can end on. It is sorted, always.
const tails: number[] = [];
for (const value of nums) {
  const at = lowerBound(tails, value);
  if (at === tails.length) tails.push(value);
  else tails[at] = value;
}

console.log(tails.length);
console.log(`TAILS ${tails.length}`);
'''
