brief        = '''
Line one is `n target`. Line two is `n` coin values. Every coin is available
in unlimited quantity.

Print the smallest number of coins that makes `target` exactly, or `-1` if it
cannot be made. Then print `REACH <k>`: how many of the amounts `0..target`
can be made at all, counting `0`.

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

The hidden cases are small, so what they catch is wrongness rather than
slowness — and one of them catches the usual wrong answer. Greedy, taking the
biggest coin that fits and repeating, makes `6` out of `3 4` by grabbing the
`4` and then failing, and there is a case for exactly that. The other bad
answer, plain recursion with no table, is not caught here and still is not
the one to write: `target` is 100000 in the real thing, the same amount gets
recomputed thousands of times, and a recursion one frame per unit of `target`
runs out of stack long before that.

`Infinity` is the honest `unreachable` here. It is a `number`, it compares
greater than every amount, and `Infinity + 1` is still `Infinity`, so the
relaxation needs no special case — which is not true of the `-1` people
reach for first.
'''
starter      = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, target] = data;
const coins = data.slice(2, 2 + n);

const best: number[] = new Array<number>(target + 1).fill(Infinity);

// fill the table bottom up, then print the answer and REACH <k>
console.log(-1);
console.log("REACH 0");
'''
solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const data: number[] = input.trim().split(/\s+/).map(Number);
const [n, target] = data;
const coins = data.slice(2, 2 + n);

// Infinity is unreachable, and Infinity + 1 is still Infinity
const best: number[] = new Array<number>(target + 1).fill(Infinity);
best[0] = 0;

for (let amount = 1; amount <= target; amount++) {
  for (const coin of coins) {
    if (coin <= amount && best[amount - coin] + 1 < best[amount]) {
      best[amount] = best[amount - coin] + 1;
    }
  }
}

console.log(best[target] === Infinity ? -1 : best[target]);
console.log(`REACH ${best.filter((v) => v !== Infinity).length}`);
'''
