solution     = '''
const input: string = require("fs").readFileSync(0, "utf8");

const tokens = input.split(/\s+/).filter((t) => t !== "");
let at = 0;
const cases = Number(tokens[at++]);

const out: string[] = [];
for (let c = 0; c < cases; c++) {
  // fresh for every case
  const distinct = new Set<number>();

  const n = Number(tokens[at++]);
  for (let i = 0; i < n; i++) distinct.add(Number(tokens[at++]));

  // a comparator: the default sort would compare the numbers as strings
  const ranked = [...distinct].sort((a, b) => a - b);
  out.push(ranked.length >= 2 ? String(ranked[ranked.length - 2]) : "NONE");
}
out.push(`CASES ${cases}`);
console.log(out.join("\n"));
