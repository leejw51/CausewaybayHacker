Line one is `n`. Line two is `n` non-negative integers, in which every value
appears exactly twice except one.

Print four lines:

1. the value that appears once, found with **xor** and constant extra space
2. how many `1` bits are set in it
3. `POW2 YES` if it is a power of two, `POW2 NO` otherwise (`0` is not)
