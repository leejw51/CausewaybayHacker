  "`[distance, node]` entries, compared on the distance alone. A `Float64Array(n).fill(Infinity)` is the distance table, and Infinity is the honest unreached.",
  "`if (d > dist[u]) continue;` is the stale-entry skip. Without it the algorithm is still correct and the heap fills with obsolete entries.",
  "The spanning-tree half of the generator guarantees every node is reachable, so filtering out Infinity at the end never removes anything — keep it anyway, because the version of this question with an unreachable node is the follow-up.",
]

