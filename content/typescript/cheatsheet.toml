solution    = 'console.log(xs.join(" "));'
hints = [
  "The method is on the array, not on the separator — and called with no argument, the separator is a comma.",
]

[quest.quiz]
choices = [
  'console.log(" ".join(xs));',
  'console.log(xs.join());',
  'console.log(xs.join(" "));',
  'console.log(xs.toString(" "));',
]
answer  = 2

