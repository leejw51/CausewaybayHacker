[[quest]]
id          = "typescript.cheatsheet.01.read-all"
node        = 1
title       = "THE WHOLE FEED"
difficulty  = 1
story       = "19:00 over Times Square. The big screen's feed arrives all at once, and it wants all of it."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
In Node, read **all** of standard input into `input`, as one `string`.
'''
solution    = 'const input = require("fs").readFileSync(0, "utf8");'
hints = [
  "File descriptor 0 is stdin. Without an encoding you get a Buffer, not a string.",
]

[quest.quiz]
choices = [
  'const input = require("fs").readFileSync(0);',
  'const input = process.stdin.read();',
  'const input = require("fs").readFileSync(0, "utf8");',
  'const input = prompt();',
]
answer  = 2

