# TYPESCRIPT LAND — CHEATSHEET. The grammar off the page, asked: one question
# per section of a TypeScript live-coding cheatsheet (tsc strict, then node) —
# stdin, lines, numbers, decimals, integer division, a loop, a sort, a tally,
# a grid, a heap, a char code, a caught error — then a Map walked in pairs,
# head and tail, `??` against a zero, awaiting every promise, a parameter
# property, a typeof narrowing, a bigint, and a quotient toward zero — then
# the sheet's drills, in TypeScript: a push, an inclusive loop, a typed
# function, a join, an empty check, a max over an array, a copy, a reversed
# string, a queue's front, and a remainder that never goes negative (the
# boss). Four lines, one right. Nothing is typed and nothing is compiled —
# the pick is the submission, and the server judges it against the quiz
# (SPEC §0). The three wrong lines are near-misses: Python's spelling, a
# call that compiles and answers wrong, a line strict mode refuses.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "typescript.cheatsheet"
land = "typescript"
category = "cheatsheet"
version = 1

