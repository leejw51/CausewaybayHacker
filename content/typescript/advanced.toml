output: 4
        9
        16
        TASKS 3
```

Calling an `async` function starts it immediately. It runs synchronously
up to its first `await`, and at that point it hands back a `Promise` and
the caller carries on. There is one thread: the tasks are not running
somewhere else in the meantime, they are **parked**, waiting for the event
loop to come back to them — which it can only do once the code that is
running now gives the thread up.

The starter starts every task and prints straight away, so it prints the
slots before a single task has been back to fill one: `undefined`, `n`
times. `await Promise.all(tasks)` is the join. It gives the thread up until
every task has settled, and it rejects as soon as any one of them throws —
which is the other reason to hold on to the promises instead of dropping
them on the floor.
