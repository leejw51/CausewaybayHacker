[[quest]]
id          = "typescript.advanced.22.async-await"
node        = 22
title       = "WHERE DOES ASYNC ACTUALLY RUN"
difficulty  = 4
story       = "Mei has written `await` for four years and has never once seen the thing that drives it. The control room has one loop, and every screen on the island takes turns on it."
concepts    = ["async", "concurrency", "functions"]
requires    = ["typescript.advanced.21.worker-pool"]
map          = { x = 0.953, y = 0.667, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

`async function double(value)` yields once — `await null` — and returns the
value doubled. Run all `n` of them with `Promise.all`, print each result in
input order, then `SUM <total>` and `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

The starter's `run` maps the values through `double` and gets an array of
**promises** — then tells the compiler it is an array of numbers:

```ts
const results = nums.map((v) => double(v)) as unknown as number[];
```

`tsc` accepts that, because `as unknown as` is how you tell it to stop
checking. The cast is erased with every other type, and at run time the
array is still promises: the output is `[object Promise]` three times and a
`SUM` that is a string of them glued to a zero. A cast is not a conversion.
It changes what the compiler believes and nothing about the value.

`Promise.all` takes the promises and resolves to their results **in the
order you passed them**, whatever order they finished in.

Where does it all run? On the one thread, in turns. `await null` puts the
rest of the function on the **microtask** queue, which Node drains
completely before it touches a timer, an immediate or any I/O — the
macrotasks. A `setTimeout(..., 0)` scheduled before a thousand awaits still
runs after all of them. Nothing here is parallel; things run in turn, at the
places they said they could stop.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

async function double(value: number): Promise<number> {
  await null;
  return value * 2;
}

async function run(nums: number[]): Promise<number[]> {
  const results = nums.map((v) => double(v)) as unknown as number[];
  return results;
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const results = await run(nums);
  for (const value of results) {
    console.log(`${value}`);
  }
  console.log(`SUM ${results.reduce((sum, v) => sum + v, 0)}`);
  console.log(`TASKS ${nums.length}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

async function double(value: number): Promise<number> {
  await null;
  return value * 2;
}

async function run(nums: number[]): Promise<number[]> {
  // the promises, awaited together; no cast needed, because now it is true
  return Promise.all(nums.map((v) => double(v)));
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const results = await run(nums);
  for (const value of results) {
    console.log(`${value}`);
  }
  console.log(`SUM ${results.reduce((sum, v) => sum + v, 0)}`);
  console.log(`TASKS ${nums.length}`);
}

main();
'''
hints = [
  "Delete the cast and look at what tsc says: Type 'Promise<number>[]' is not assignable to type 'number[]'. That error was the truth the cast was hiding.",
