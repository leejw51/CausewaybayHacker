[[quest]]
id          = "typescript.advanced.17.undefined"
node        = 17
title       = "THE 23:59 BOARD"
difficulty  = 4
story       = "23:59 in the control room. The rate board asks the feed for a screen that is not on tonight, the feed answers with nothing, and the board reads the nothing's price."
concepts    = ["zero-values", "error-handling", "structs", "duck-typing"]
requires    = ["typescript.advanced.16.structural", "typescript.advanced.08.exceptions"]
map          = { x = 0.327, y = 0.554, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<SCREEN> <CENTS>` — the
screens that are on tonight — then a count `q` and `q` screen names to look
up.

For each query print `<SCREEN> <cents>`, or `<SCREEN> NONE` if that screen
is not on. Then print `MISSING <k>` and `CHEAPEST <SCREEN>` — the screen
with the lowest rate, ties by name — or `CHEAPEST NONE` if nothing is on.

```
input:  2
        TSQ 1200
        HYSAN 900
        3
        HYSAN
        YEEWO
        TSQ
output: HYSAN 900
        YEEWO NONE
        TSQ 1200
        MISSING 1
        CHEAPEST HYSAN
```

The starter compiles without a single warning and crashes on `YEEWO`:

```
TypeError: Cannot read properties of undefined (reading 'cents')
```

That line is the boss of this map. It never points at the bug. It points at
the place where an `undefined` was finally *used*, and in the starter it was
made in two places the compiler was told not to worry about.

`lookup` returns `board[name]` from a `Record<string, Screen>`, and the
index type says `Screen` — not `Screen | undefined` — because TypeScript
assumes an index you read is an index that exists. The annotation says
`Screen`, `tsc` believes it, and at run time the key is not there.
And `cheapest` has no `return` on its main path — it computes the best
screen and falls off the end — so it returns `undefined` implicitly, which
its type allows; the caller then reaches through it with
`!`, the non-null assertion — a promise to the compiler that nobody checks.

Make both functions say `Screen | undefined` **on purpose** — a
`Map<string, Screen>` has `get`, whose type already admits the miss — and
handle the `undefined` where it lands, with `=== undefined`. Not `!screen`:
it works for an object, and the day this board is a `Map<string, number>`,
the free screen at `0` cents stops existing.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Screen {
  name: string;
  cents: number;
}

function lookup(board: Record<string, Screen>, name: string): Screen {
  return board[name];
}

function cheapest(board: Record<string, Screen>): Screen | undefined {
  const all = Object.values(board);
  if (all.length === 0) {
    return undefined;
  }
  const best = all.reduce((a, b) =>
    b.cents < a.cents || (b.cents === a.cents && b.name < a.name) ? b : a,
  );
  best; // the return is missing
}

function main(): void {
  const tokens = input.split(/\s+/).filter((t) => t !== "");
  let at = 0;
  const n = Number(tokens[at++]);
  const board: Record<string, Screen> = {};
  for (let i = 0; i < n; i++) {
    const name = tokens[at++];
    const cents = Number(tokens[at++]);
    board[name] = { name, cents };
  }

  const q = Number(tokens[at++]);
  let missing = 0;
  for (let i = 0; i < q; i++) {
    const name = tokens[at++];
    const screen = lookup(board, name);
    console.log(`${name} ${screen.cents}`);
  }

  console.log(`MISSING ${missing}`);
  console.log(`CHEAPEST ${cheapest(board)!.name}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Screen {
  name: string;
  cents: number;
}

function lookup(board: Map<string, Screen>, name: string): Screen | undefined {
  // Map.get admits the miss in its type; the Record index never did
  return board.get(name);
}

function cheapest(board: Map<string, Screen>): Screen | undefined {
  const all = [...board.values()];
  if (all.length === 0) {
    return undefined;
  }
  return all.reduce((a, b) =>
    b.cents < a.cents || (b.cents === a.cents && b.name < a.name) ? b : a,
  );
}

function main(): void {
  const tokens = input.split(/\s+/).filter((t) => t !== "");
  let at = 0;
  const n = Number(tokens[at++]);
  const board = new Map<string, Screen>();
  for (let i = 0; i < n; i++) {
    const name = tokens[at++];
    const cents = Number(tokens[at++]);
    board.set(name, { name, cents });
  }

  const q = Number(tokens[at++]);
  let missing = 0;
  for (let i = 0; i < q; i++) {
    const name = tokens[at++];
    const screen = lookup(board, name);
    if (screen === undefined) {
      missing++;
      console.log(`${name} NONE`);
    } else {
      console.log(`${name} ${screen.cents}`);
    }
  }

  console.log(`MISSING ${missing}`);
  const best = cheapest(board);
  console.log(`CHEAPEST ${best === undefined ? "NONE" : best.name}`);
}

main();
'''
hints = [
  "Read the stack trace from the top: the TypeError is on the console.log, but the undefined came out of lookup one line earlier, and out of the Record index before that.",
  "Once lookup returns Screen | undefined, `screen.cents` stops compiling until you check. That error is the compiler doing the job the Record index skipped.",
  "cheapest has two paths and only one of them returns. The other falls off the end, which a `Screen | undefined` return type quietly allows, and the caller's `!` swears it did not. Return `best`, and drop the `!` at the call.",
  "`!` and `as` are both promises to the compiler that it cannot check. They are erased at run time along with every other type, and what is left is the value that actually arrived.",
]

