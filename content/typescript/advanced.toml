[[quest]]
id          = "typescript.advanced.07.functions"
node        = 7
title       = "PER HOUR"
difficulty  = 2
story       = "Every screen slot on the rate card is per hour unless it says otherwise, and the card printer writes `/undefined` under every one that did not say."
concepts    = ["functions", "strings", "types"]
requires    = ["typescript.advanced.06.sets"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<NAME> <CENTS>` or
`<NAME> <CENTS> <UNIT>`.

Write `tag(name, cents, unit = "hour")` returning `<NAME> $<dollars>/<unit>`
with two decimals, and print one tag per line.

```
input:  3
        TSQ 1200
        HYSAN 250 minute
        LEEGARDEN 800
output: TSQ $12.00/hour
        HYSAN $2.50/minute
        LEEGARDEN $8.00/hour
```

The starter compiles, runs, and prints `TSQ $12.00/undefined`. Look at why.
`const [name, cents, unit] = line.split(" ")` types all three as `string`,
because `split` returns `string[]` and the compiler does not know how long
it is. On a two-token line `unit` is `undefined` at run time, and a template
literal prints that word faithfully. The type was a promise the array never
made.

A **default parameter** is the fix, and it works for a reason worth
knowing: a default fires when the argument is `undefined` — missing, or
passed explicitly as `undefined`, which is what `tag(name, cents, unit)`
does here. `null` would not trigger it. The signature is the contract that
says what the caller may leave out and what they get when they do.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tag(name: string, cents: number, unit: string): string {
  return `${name} $${Math.trunc(cents / 100)}.${String(cents % 100).padStart(2, "0")}/${unit}`;
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i <= n; i++) {
    const [name, cents, unit] = lines[i].trim().split(/\s+/);
    console.log(tag(name, Number(cents), unit));
  }
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tag(name: string, cents: number, unit: string = "hour"): string {
  return `${name} $${Math.trunc(cents / 100)}.${String(cents % 100).padStart(2, "0")}/${unit}`;
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i <= n; i++) {
    // on a two-token line `unit` is undefined at run time, whatever its type
    // says, and undefined is exactly what makes the default fire
    const [name, cents, unit] = lines[i].trim().split(/\s+/);
    console.log(tag(name, Number(cents), unit));
  }
}

main();
'''
