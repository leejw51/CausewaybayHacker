solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Tickets {
  private current: number;
  private left: number;

  constructor(
    start: number,
    private readonly step: number,
    count: number,
  ) {
    this.current = start;
    this.left = count;
  }

  [Symbol.iterator](): Tickets {
    return this;
  }

  next(): IteratorResult<number> {
    // finished is decided before a ticket is used, not after
    if (this.left === 0) {
      return { done: true, value: undefined };
    }
    const value = this.current;
    this.current += this.step;
    this.left -= 1;
    return { done: false, value };
  }
}

function main(): void {
  const [start, step, count] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  for (const value of new Tickets(start, step, count)) {
    console.log(`${value}`);
  }
  let sum = 0;
  for (const value of new Tickets(start, step, count)) {
    sum += value;
  }
  console.log(`SUM ${sum}`);
}

main();
