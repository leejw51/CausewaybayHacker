brief       = '''
Standard input is a count `n`, then `n` lines of `<ITEM> <PRICE>`. `PRICE` is
a whole number of cents. An item appears at most once, and `n` is at least
`1` — there is always a cheapest item to name.

Print three lines:

1. every item priced **strictly over 100**, as `ITEM=PRICE`, sorted by item,
   joined by single spaces — or `-` if there are none
2. every item with its price **halved and rounded down**, same format,
   sorted by item
3. `CHEAPEST <item>` — the lowest price, ties broken by the item ascending

```
input:  3
        SCARF 120
        MUG 80
        BAG 250
output: BAG=250 SCARF=120
        BAG=125 MUG=40 SCARF=60
        CHEAPEST MUG
```

`Object.fromEntries(pairs)` builds a keyed object from `[key, value]`
pairs in one expression, and `Object.entries(obj)` takes it apart again —
so `Object.fromEntries(Object.entries(prices).filter(...))` is a filtered
board and the same with `.map(([k, v]) => [k, Math.floor(v / 2)])` is a
transformed one. Neither needs an empty object and a loop that fills it.

Sort the entries before you print them, even though they look sorted. An
object keeps string keys in insertion order **except** keys that look like
array indices — `"7"` before `"10"` before `"SCARF"`, whatever order they
arrived in. A board keyed by product number would reorder itself. Say the
order you want.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  const prices: Record<string, number> = Object.fromEntries(
    lines.slice(1, n + 1).map((line): [string, number] => {
      const [item, cents] = line.trim().split(/\s+/);
      return [item, Number(cents)];
    }),
  );

  // 1. the ones over 100, as ITEM=PRICE, sorted, or "-"
  // 2. every price halved, same format, sorted
  // 3. CHEAPEST <item>, ties alphabetical
  console.log("-");
  console.log("-");
  console.log(`CHEAPEST ${Object.keys(prices).length}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function byKey(a: [string, number], b: [string, number]): number {
  return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0;
}

function board(obj: Record<string, number>): string {
  return Object.entries(obj).sort(byKey).map(([k, v]) => `${k}=${v}`).join(" ");
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  const prices: Record<string, number> = Object.fromEntries(
    lines.slice(1, n + 1).map((line): [string, number] => {
      const [item, cents] = line.trim().split(/\s+/);
      return [item, Number(cents)];
    }),
  );

  const dear = Object.fromEntries(Object.entries(prices).filter(([, v]) => v > 100));
  console.log(Object.keys(dear).length > 0 ? board(dear) : "-");

  const half = Object.fromEntries(Object.entries(prices).map(([k, v]) => [k, Math.floor(v / 2)]));
  console.log(board(half));

  const [cheapest] = Object.entries(prices).sort((a, b) => a[1] - b[1] || byKey(a, b));
  console.log(`CHEAPEST ${cheapest[0]}`);
}

main();
'''
