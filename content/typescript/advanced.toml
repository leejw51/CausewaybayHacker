  "Run the starter and read the last line: BOARD 3, printed after everything. The board was scheduled first and still went last, because nothing ever gave the thread back.",
  "One chunk per turn: a plain for loop over the chunks with `await new Promise((r) => setImmediate(r))` after each. The board's immediate was queued first, so it runs after chunk 0.",
  "`total += await x` reads total before it awaits. `const part = await x; total += part;` reads it after — or, with no await at all in the loop body, there is nothing to race.",
  "n*(n+1)*(2n+1)/6 is the closed form for the total. Check TOTAL against it once and you know the chunk boundaries are right.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 10000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample", stdin = "3 10\n",      expect = "BOARD 1\nCHUNK 0 14\nCHUNK 1 77\nCHUNK 2 294\nTOTAL 385\nCHUNKS 3\n", visible = true },
  { name = "one",    stdin = "1 4\n",       expect = "BOARD 1\nCHUNK 0 30\nTOTAL 30\nCHUNKS 1\n",                           visible = false },
  { name = "idle",   stdin = "3 2\n",       expect = "BOARD 1\nCHUNK 0 0\nCHUNK 1 1\nCHUNK 2 4\nTOTAL 5\nCHUNKS 3\n",       visible = false },
  { name = "big",    stdin = "4 2000000\n", expect = "BOARD 1\nCHUNK 0 41666791666750000\nCHUNK 1 291667041666750000\nCHUNK 2 791667291666750000\nCHUNK 3 1541667541666750000\nTOTAL 2666668666667000000\nCHUNKS 4\n", visible = false },
]
