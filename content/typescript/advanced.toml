solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Entry = [string, number];

class Notebook {
  // one array per notebook; `static` would be one array per class
  items: Entry[] = [];

  add(name: string, cents: number): void {
    this.items.push([name, cents]);
  }

  list(): Entry[] {
    return this.items;
  }

  total(): number {
    return this.items.reduce((sum, [, cents]) => sum + cents, 0);
  }

  toString(): string {
    return `Notebook(items=${this.items.length}, total=${this.total()})`;
  }
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  const book = new Notebook();
  const scratch = new Notebook();
  scratch.add("PENCIL", 0);
  for (let i = 1; i <= n; i++) {
    const [name, cents] = lines[i].trim().split(/\s+/);
    book.add(name, Number(cents));
  }

  for (const [name, cents] of book.list()) {
    console.log(`${name} ${cents}`);
  }
  console.log(`TOTAL ${book.total()}`);
  console.log(`${book}`);
}

main();
'''
