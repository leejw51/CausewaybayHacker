}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class NotANumber extends Error {}

function double(text: string): number {
  if (!/^-?\d+$/.test(text)) {
    throw new NotANumber(`not a whole number: ${text}`);
  }
  return Number(text) * 2;
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let total = 0;
  for (let i = 1; i <= n; i++) {
    const line = lines[i].trim();
    let value: number;
    try {
      value = double(line);
    } catch (err: unknown) {
      if (err instanceof NotANumber) {
        console.log(`BAD ${line}`);
        continue;
      }
      throw err;
    }
    console.log(`${value}`);
    total += value;
  }
  console.log(`SUM ${total}`);
}

main();
'''
