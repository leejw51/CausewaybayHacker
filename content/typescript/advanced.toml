'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Container<T> extends Iterable<T> {
  readonly size: number;
  has(item: T): boolean;
}

// no `implements Container<string>`: the members are the contract
class Bag {
  private goods: string[];

  constructor(goods: string[]) {
    this.goods = [...goods];
  }

  get size(): number {
    return this.goods.length;
  }

  has(item: string): boolean {
    return this.goods.includes(item);
  }

  [Symbol.iterator](): Iterator<string> {
    return this.goods[Symbol.iterator]();
  }
}

function report(bag: Container<string>, word: string): void {
  console.log(`LEN ${bag.size}`);
  let longest = "";
  for (const item of bag) {
    console.log(item);
    if (item.length > longest.length) longest = item;
  }
  console.log(`HAS ${word} ${bag.has(word) ? "YES" : "NO"}`);
  console.log(`LONGEST ${longest}`);
}

function main(): void {
  const [goodsLine = "", wordLine = ""] = input.split("\n");
  const bag = new Bag(goodsLine.split(/\s+/).filter((t) => t !== ""));
  report(bag, wordLine.trim());
}

main();
'''
