brief       = '''
Standard input is a count `n`, then `n` lines of `<NAME> <CENTS>`, where
`CENTS` is supposed to be an integer.

Write a generator `opened(name)` that prints `OPEN <NAME>`, yields once,
and prints `SHUT <NAME>` — **whether or not the body raised**. The body is
a `for (const _ of opened(name))` loop that parses the cents and adds them
to a total. A line whose cents do not parse is reported as `BAD <NAME>`
after the slot has shut. Finally print `TOTAL <sum>` and `REJECTED <k>`.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`for...of` over a generator is a resource guard, and this is why: when the
loop body exits early — `break`, `return`, or an exception — `for...of`
calls the generator's `return()`, which resumes it **at the `yield`** as
if the `yield` were a `return` statement. The code after the `yield` does
not run. Code in a `finally` around the `yield` does. The starter has no
`finally`, and `WONG`'s slot never shuts.

TypeScript 5.2 has `using` and `Symbol.dispose` for exactly this, and they
are not here: the `es2023` library has no `Symbol.dispose`, so `using`
does not compile. `try`/`finally` is what `using` is built from.

Do not catch the error inside the generator. The caller wants to print
`BAD`, and a generator that swallowed it would print `TOTAL` as if nothing
had happened.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

class NotANumber extends Error {}

function parseCents(text: string): number {
  if (!/^-?\d+$/.test(text)) throw new NotANumber(text);
  return Number(text);
}

function* opened(name: string): Generator<void> {
  console.log(`OPEN ${name}`);
  yield;
  console.log(`SHUT ${name}`);
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let total = 0;
  let rejected = 0;
  for (let i = 1; i <= n; i++) {
    const [name, cents] = lines[i].trim().split(/\s+/);
    try {
      for (const _ of opened(name)) {
        total += parseCents(cents);
      }
    } catch (err: unknown) {
      if (!(err instanceof NotANumber)) throw err;
      rejected++;
      console.log(`BAD ${name}`);
    }
  }
  console.log(`TOTAL ${total}`);
  console.log(`REJECTED ${rejected}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class NotANumber extends Error {}

function parseCents(text: string): number {
  if (!/^-?\d+$/.test(text)) throw new NotANumber(text);
  return Number(text);
}

function* opened(name: string): Generator<void> {
  console.log(`OPEN ${name}`);
  try {
    yield;
  } finally {
    // runs on the normal exit, and on the return() for-of sends when the body throws
    console.log(`SHUT ${name}`);
  }
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let total = 0;
  let rejected = 0;
  for (let i = 1; i <= n; i++) {
    const [name, cents] = lines[i].trim().split(/\s+/);
    try {
      for (const _ of opened(name)) {
        total += parseCents(cents);
      }
    } catch (err: unknown) {
      if (!(err instanceof NotANumber)) throw err;
      rejected++;
      console.log(`BAD ${name}`);
    }
  }
  console.log(`TOTAL ${total}`);
  console.log(`REJECTED ${rejected}`);
}

main();
'''
