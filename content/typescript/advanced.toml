brief       = '''
Standard input is two integers `k` and `n`.

Split `1..n` into `k` contiguous chunks — chunk `i` is
`floor(n*i/k) + 1` to `floor(n*(i+1)/k)` inclusive — and sum the squares of
each chunk with a plain loop, as a `bigint`. Before any of the work starts,
`main` schedules one board redraw with `setImmediate`, which prints
`BOARD <finished>`: how many chunks were finished when the board got the
thread. The board must get it **after the first chunk and before the
second**. Print `CHUNK <i> <sum>` for each chunk in index order, then
`TOTAL <sum>`, then `CHUNKS <k>`.

```
input:  3 10
output: BOARD 1
        CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        CHUNKS 3
```

Node runs your JavaScript on **one thread**, and every screen in the
building is waiting on it. A callback that is running cannot be
interrupted — not by a timer, not by I/O, not by the board — until it
returns or `await`s. The starter wraps each chunk in an `async` function
and hands them all to `Promise.all`, and it looks concurrent. It is one
long callback: an `async` function with no `await` inside runs start to
finish the moment it is called. All `k` chunks are summed before `main`
ever lets go, the board redraws last, showing `BOARD 3`, and on
`4 2000000` every screen on the island shows the same frame for the whole
sum. Nothing you can write here makes the sums run in parallel; Node's
answer for that is a worker thread, which this `node.d.ts` does not
declare. Async is for **waiting**. CPU work on the one thread can only be
made **polite**.

So be polite: one chunk, then give the thread back, then the next. And
give it back to the right queue. `await null` or `await Promise.resolve()`
yields to the **microtask** queue, which Node drains to empty before it
runs a single immediate or timer — the board would still see `BOARD 3`.
`await new Promise((r) => setImmediate(r))` goes to the back of the line
behind the board, which was queued first.

And the small bug, which has everything to do with timing. The starter adds
up with `total += await work(...)`. JavaScript evaluates the left side of
`+=` **before** the `await`: every task reads `total` as `0`, parks, and
comes back to write `0 + mine`. The last one wins, and `TOTAL` is the last
chunk. That is the lost update from the billing counter without a line of
code between the read and the write for you to see it in — a read and a
write of shared state with an `await` between them is a race on one thread.
Read the total after the await, or hold the lock.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

let finished = 0;
const parts: bigint[] = [];

async function work(index: number, lo: number, hi: number): Promise<bigint> {
  // sum of i*i for i in lo..hi, as a plain loop on purpose
  let part = 0n;
  for (let i = lo; i <= hi; i++) {
    part += BigInt(i * i);
  }
  parts[index] = part;
  finished++;
  return part;
}

async function main(): Promise<void> {
  const [k, n] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  // the board redraws the next time the loop gets a turn
  setImmediate(() => console.log(`BOARD ${finished}`));

  let total = 0n;
  await Promise.all(
    Array.from({ length: k }, async (_, i) => {
      const lo = Math.floor((n * i) / k) + 1;
      const hi = Math.floor((n * (i + 1)) / k);
      total += await work(i, lo, hi);
    }),
  );

  parts.forEach((part, i) => console.log(`CHUNK ${i} ${part}`));
  console.log(`TOTAL ${total}`);
  console.log(`CHUNKS ${k}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

let finished = 0;
const parts: bigint[] = [];

function turn(): Promise<void> {
  // the back of the macrotask line, behind the board; `await null` would not be
  return new Promise((resolve) => setImmediate(resolve));
}

function work(index: number, lo: number, hi: number): bigint {
  // sum of i*i for i in lo..hi, as a plain loop on purpose: CPU work that
  // holds the one thread for as long as it runs
  let part = 0n;
  for (let i = lo; i <= hi; i++) {
    part += BigInt(i * i);
  }
  parts[index] = part;
  finished++;
  return part;
}

async function main(): Promise<void> {
  const [k, n] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  // the board redraws the next time the loop gets a turn
  setImmediate(() => console.log(`BOARD ${finished}`));

  let total = 0n;
  for (let i = 0; i < k; i++) {
    const lo = Math.floor((n * i) / k) + 1;
    const hi = Math.floor((n * (i + 1)) / k);
    const part = work(i, lo, hi);
    // read and write the shared total with no await between them
    total += part;
    await turn();
  }

  parts.forEach((part, i) => console.log(`CHUNK ${i} ${part}`));
  console.log(`TOTAL ${total}`);
  console.log(`CHUNKS ${k}`);
}

main();
'''
