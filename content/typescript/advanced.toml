[[quest]]
id          = "typescript.advanced.04.strings"
node        = 4
title       = "THREE LENGTHS"
difficulty  = 2
story       = "The LED wall on Hysan Place budgets its ticker by `.length`. A tram emoji costs it two, 銅鑼灣 costs it three, and the controller underneath counts nine."
concepts    = ["strings", "types", "slices"]
requires    = ["typescript.advanced.03.arrays"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''
Read one line. Print three lines:

1. its length in **bytes**, encoded as UTF-8
2. its length in **characters** (Unicode code points)
3. the line with its characters reversed

```
input:  causeway
output: 8
        8
        yawesuac
```

A JavaScript string has three lengths, and `.length` is none of the two
asked for. It counts **UTF-16 code units**: `"銅鑼灣".length` is `3`, which
looks right, and `"🚋".length` is `2`, which is not. The characters are what
`for (const ch of s)` and `[...s]` walk — the string iterator steps by code
point — so `[...s].length` is the second line.

The bytes are the third number. There is no `TextEncoder` or `Buffer` here:
`node.d.ts` declares neither, and `tsc` would stop you with `TS2304: Cannot
find name`. Count them from the code points instead — `ch.codePointAt(0)`
below `0x80` is one byte, below `0x800` two, below `0x10000` three, and
anything above is four.

`s.split("").reverse().join("")` is the reversal everyone reaches for, and it
splits a surrogate pair in half. Reverse `[...s]`.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const line = input.split("\n")[0];

  // 1. bytes, 2. characters, 3. the characters reversed
  console.log(`${line.length}`);
  console.log(`${line.length}`);
  console.log(line.split("").reverse().join(""));
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function utf8Bytes(s: string): number {
  let bytes = 0;
  for (const ch of s) {
    const cp = ch.codePointAt(0) ?? 0;
    bytes += cp < 0x80 ? 1 : cp < 0x800 ? 2 : cp < 0x10000 ? 3 : 4;
  }
  return bytes;
}

function main(): void {
  const line = input.split("\n")[0];
  const chars = [...line];

  console.log(`${utf8Bytes(line)}`);
  console.log(`${chars.length}`);
  console.log(chars.reverse().join(""));
}

main();
'''
hints = [
  "[...line] is an array of code points; its length is the character count. line.length is UTF-16 units, and the starter prints it twice.",
  "for (const ch of line) steps by code point too, so ch.codePointAt(0) is the whole character's number, never half of a pair.",
  "split(\"\") splits by code unit and breaks the emoji; reversing the spread array keeps each character whole.",
]

[quest.tests]
