solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function memo<K, V>(fn: (key: K) => V) {
  // boxed so a cached undefined would still count as a hit
  const cache = new Map<K, { value: V }>();
  function wrapper(key: K): V {
    const hit = cache.get(key);
    if (hit !== undefined) return hit.value;
    wrapper.misses += 1;
    const value = fn(key);
    cache.set(key, { value });
    return value;
  }
  wrapper.misses = 0;
  return wrapper;
}

const fib: ((n: number) => bigint) & { misses: number } = memo(
  (n: number): bigint => (n < 2 ? BigInt(n) : fib(n - 1) + fib(n - 2)),
);

function main(): void {
  const [nText, kText, bits] = input.split(/\s+/).filter((t) => t !== "");
  const n = Number(nText);
  const k = Number(kText);

  console.log(`FIB ${fib(n)}`);

  const product = Array.from({ length: k }, (_, i) => BigInt(i + 1)).reduce((a, b) => a * b, 1n);
  console.log(`PRODUCT ${product}`);

  const fromBinary = (text: string): number => parseInt(text, 2);
  console.log(`BIN ${fromBinary(bits)}`);

  console.log(`MISSES ${fib.misses}`);
}

main();
'''
