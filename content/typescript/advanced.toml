brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Run a pool of `w` workers. Each worker loops: take the next unclaimed index,
`await render(index, value)` — which returns `[index, value * value]` after
a few turns of the event loop that depend on the index — and push the pair
onto `results`, until no index is left. Wait for every worker, sort the
results by index, print `<index> <value>` one per line, then `WORKERS <w>`.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

The pairs arrive in the order the jobs **finish**, which is not the order
they started; carrying the index in the result is what makes the output the
same every run, and sorting on it is the last line of the answer.

`const i = next++` needs no lock, and it is worth knowing why after the last
quest: there is no `await` between reading `next` and bumping it, so no
other worker can get in between. The lock was only ever needed across an
`await`.

The starter waits for the workers with `workers.forEach(async (w) => {
await w; })`. It compiles, and it waits for nothing: `forEach` calls the
async callback, gets a promise back, and throws it away. Every one of the
callbacks awaits; `main` awaits none of them, and prints an empty result.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

async function render(index: number, value: number): Promise<[number, number]> {
  for (let turn = 0; turn <= (index * 7) % 3; turn++) {
    await tick();
  }
  return [index, value * value];
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const [workers, n] = data;
  const nums = data.slice(2, 2 + n);

  const results: [number, number][] = [];
  let next = 0;

  async function worker(): Promise<void> {
    while (next < nums.length) {
      const i = next++;
      results.push(await render(i, nums[i]));
    }
  }

  const pool = Array.from({ length: workers }, () => worker());
  pool.forEach(async (running) => {
    await running;
  });

  results.sort((a, b) => a[0] - b[0]);
  for (const [index, value] of results) {
    console.log(`${index} ${value}`);
  }
  console.log(`WORKERS ${workers}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

async function render(index: number, value: number): Promise<[number, number]> {
  for (let turn = 0; turn <= (index * 7) % 3; turn++) {
    await tick();
  }
  return [index, value * value];
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const [workers, n] = data;
  const nums = data.slice(2, 2 + n);

  const results: [number, number][] = [];
  let next = 0;

  async function worker(): Promise<void> {
    while (next < nums.length) {
      // no await between the read and the bump, so no other worker gets in
      const i = next++;
      results.push(await render(i, nums[i]));
    }
  }

  const pool = Array.from({ length: workers }, () => worker());
  await Promise.all(pool);

  results.sort((a, b) => a[0] - b[0]);
  for (const [index, value] of results) {
    console.log(`${index} ${value}`);
  }
  console.log(`WORKERS ${workers}`);
}

main();
'''
