Standard input is one line of goods separated by spaces, then one line with
a single word to look for.

Put the goods in a `Bag` and hand it to the starter's `report`, which
prints:

1. `LEN <k>` — from `bag.size`
2. the goods, one per line — from `for (const item of bag)`
3. `HAS <WORD> YES` or `HAS <WORD> NO` — from `bag.has(word)`
4. `LONGEST <item>` — the longest, the first one on a tie

```
input:  cap sneakers tee
        sneakers
output: LEN 3
        cap
        sneakers
        tee
        HAS sneakers YES
        LONGEST sneakers
```

`report` takes a `Container<string>`, and `Bag` does not say
`implements Container` anywhere. It does not need to. TypeScript's types
are **structural**: a value fits an interface by having the members, not
by naming it. That is duck typing, checked by `tsc` before the program runs
instead of by the interpreter when it gets there. A `Set<string>` fits
`Container<string>` too, and nobody wrote that down either.

The starter's `Bag` has none of the members, and it does not compile:

```
error TS2345: Argument of type 'Bag' is not assignable to parameter of type 'Container<string>'.
```

