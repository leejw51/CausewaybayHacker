solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

interface Sign {
  render(): string;
}

class Shop {
  constructor(
    readonly name: string,
    readonly level: number,
  ) {}

  render(): string {
    return `${this.name} / L${this.level}`;
  }
}

function parse(line: string): unknown {
  const parts = line.trim().split(/\s+/);
  if (parts[0] === "SHOP") return new Shop(parts[1], Number(parts[2]));
  const number = Number(parts[1]);
  return { number, render: () => `COUNTER ${number}` };
}

function isSign(x: unknown): x is Sign {
  // the interface is gone at run time; check the shape it promised
  return typeof x === "object" && x !== null && "render" in x && typeof x.render === "function";
}

function show(sign: Sign): void {
  console.log(sign.render());
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  const feed: unknown[] = lines.slice(1, n + 1).map(parse);

  let signs = 0;
  let shops = 0;
  for (const item of feed) {
    if (isSign(item)) {
      show(item);
      signs++;
    }
    if (item instanceof Shop) shops++;
  }
  console.log(`SIGNS ${signs}`);
  console.log(`SHOPS ${shops}`);
}

main();
