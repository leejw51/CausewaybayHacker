[[quest]]
id          = "typescript.advanced.15.higher-order"
node        = 15
title       = "WRAPPED"
difficulty  = 3
story       = "The billing screen wants to know how many times the rate function ran tonight, and the rate function does not want to know it is being watched."
concepts    = ["decorators", "functions", "closures"]
requires    = ["typescript.advanced.14.generators"]
map          = { x = 0.055, y = 0.556, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` durations in hours.

`price(hours)` is `500 + 100 * hours`. Wrap it with `counted` so that every
call is counted without `price` knowing. Print one price per duration, then
`CALLS <n>`, then `NAME <price.name>` — which must still say `price`.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

TypeScript's `@decorators` exist, but only on classes and their members; a
free function cannot wear one. What a decorator *is* needs no syntax: a
function that takes a function and returns a function. So
`const price = counted(function price(hours: number) { ... })` is the whole
mechanism, and the generics on `counted` — `<A extends unknown[], R>` —
are what let it wrap any signature and hand back the same one.

The function `counted` returns is a closure called `wrapper`, and unless you
say otherwise its `name` is `"wrapper"`: the last line of the starter's
output. Python has `functools.wraps`; here you copy the name yourself with
`Object.defineProperty(wrapper, "name", { value: fn.name })` — `name` is
read-only, so a plain assignment would throw in strict mode.

The count lives on the wrapper: `wrapper.calls = 0` right after the function
declaration. `tsc` sees that assignment and adds `calls: number` to the
function's type, so `price.calls` type-checks in `main`.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function counted<A extends unknown[], R>(fn: (...args: A) => R) {
  function wrapper(...args: A): R {
    wrapper.calls += 1;
    return fn(...args);
  }
  wrapper.calls = 0;
  return wrapper;
}

const price = counted(function price(hours: number): number {
  return 500 + 100 * hours;
});

function main(): void {
  const tokens = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const n = tokens[0];
  for (const hours of tokens.slice(1, 1 + n)) {
    console.log(`${price(hours)}`);
  }
  console.log(`CALLS ${price.calls}`);
  console.log(`NAME ${price.name}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function counted<A extends unknown[], R>(fn: (...args: A) => R) {
  function wrapper(...args: A): R {
    wrapper.calls += 1;
    return fn(...args);
  }
  wrapper.calls = 0;
  // functools.wraps by hand: `name` is read-only, so define it
  Object.defineProperty(wrapper, "name", { value: fn.name });
  return wrapper;
}

const price = counted(function price(hours: number): number {
  return 500 + 100 * hours;
});

function main(): void {
  const tokens = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const n = tokens[0];
  for (const hours of tokens.slice(1, 1 + n)) {
    console.log(`${price(hours)}`);
  }
  console.log(`CALLS ${price.calls}`);
  console.log(`NAME ${price.name}`);
}

main();
'''
hints = [
  "Object.defineProperty(wrapper, \"name\", { value: fn.name }) before the return. One line.",
  "wrapper.name = fn.name compiles and then throws TypeError: Cannot assign to read only property 'name'. defineProperty is the way past it.",
  "(...args: A) => R with A extends unknown[] is how the wrapper forwards any signature without knowing it, and how price keeps its (hours: number) => number type after wrapping.",
]

