map          = { x = 0.199, y = 0.742, kind = "quest" }
brief       = '''
Standard input is `n k bits`: two integers and a string of binary digits.

Print four lines:

1. `FIB <fib(n)>` — from a **recursive** `fib`, wrapped in a memoising
   `memo(...)` of your own
2. `PRODUCT <k!>` — `reduce` with a multiply over `1..k`, with an initial
   value so `k = 0` gives `1`
3. `BIN <value>` — `bits` read as base 2 by `fromBinary`, a one-argument
   function with the radix fixed inside it
4. `MISSES <m>` — how many times the memo actually ran the body

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` is at most `400`. The starter's wrapper counts calls and remembers
nothing, so `fib(10)` is 177 calls, `fib(35)` is thirty million and
`fib(90)` does not finish. With a cache every `fib(i)` runs once and
`MISSES` is `n + 1`.

The numbers do not fit in a `number`. `fib(90)` is `2880067194370816120`,
past `Number.MAX_SAFE_INTEGER`, and a `number` would print it wrong without
a word. Use **`bigint`**: `0n`, `1n`, `BigInt(i)`. A template literal prints
a bigint as its digits; `console.log(5n)` on its own prints `5n`.

`parseInt(bits)` with no radix reads `1010` as one thousand and ten. The
starter does that. Fix the radix inside a closure —
`(text: string) => parseInt(text, 2)` — which is what Python's
`functools.partial` is: a function with some of its arguments already
decided. `bind` does the same for **leading** arguments only, and the radix
is the second one.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function counting<A extends unknown[], R>(fn: (...args: A) => R) {
  function wrapper(...args: A): R {
    wrapper.misses += 1;
    return fn(...args);
  }
  wrapper.misses = 0;
  return wrapper;
}

const fib: ((n: number) => bigint) & { misses: number } = counting(
  (n: number): bigint => (n < 2 ? BigInt(n) : fib(n - 1) + fib(n - 2)),
);

function main(): void {
  const [nText, kText, bits] = input.split(/\s+/).filter((t) => t !== "");
  const n = Number(nText);
  const k = Number(kText);

  console.log(`FIB ${fib(n)}`);

  let product = 1n;
  for (let i = 1; i <= k; i++) {
    product *= BigInt(i);
  }
  console.log(`PRODUCT ${product}`);

  console.log(`BIN ${parseInt(bits)}`);
