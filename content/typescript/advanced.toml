[[quest]]
id          = "typescript.advanced.06.sets"
node        = 6
title       = "WHAT BOTH SCREENS PLAY"
difficulty  = 2
story       = "Two screens face each other across Yee Wo Street, and the advertiser wants to know which clips she is paying to run twice at the same crossing."
concepts    = ["collections", "iteration", "strings"]
requires    = ["typescript.advanced.05.maps"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief       = '''
Two lines of standard input, each a screen's clips separated by spaces. A
screen may list the same clip twice; that counts once.

Print three lines:

1. `BOTH` followed by every clip on both lists, sorted, space separated — or
   `BOTH -` if there is nothing
2. `ONLY_A <k>`: how many clips are on the first list and not the second
3. `ALL <k>`: how many distinct clips are on either list

```
input:  milktea sneakers phone sneakers
        phone watch
output: BOTH phone
        ONLY_A 2
        ALL 4
```

A `Set` has no duplicates. It also has, in the `es2023` library this land
compiles against, no `intersection`, `difference` or `union` — those arrived
in ES2025, and `tsc` would tell you so with `TS2339: Property 'intersection'
does not exist`. The library you compile against decides what exists, not
the version of Node you run on. So spell them: `[...a].filter((x) => b.has(x))`
is the intersection, the same with `!b.has(x)` the difference, and
`new Set([...a, ...b])` the union.

`.sort()` with no comparator sorts strings by UTF-16 code unit, which is
exactly right for these and exactly wrong for numbers. The ranking board is
two quests away.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const [lineA = "", lineB = ""] = input.split("\n");
  const a = lineA.split(/\s+/).filter((t) => t !== "");
  const b = lineB.split(/\s+/).filter((t) => t !== "");

  // a Set of each, then the three answers
  console.log("BOTH -");
  console.log(`ONLY_A ${a.length}`);
  console.log(`ALL ${a.length + b.length}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const [lineA = "", lineB = ""] = input.split("\n");
  const a = new Set(lineA.split(/\s+/).filter((t) => t !== ""));
  const b = new Set(lineB.split(/\s+/).filter((t) => t !== ""));

  const both = [...a].filter((x) => b.has(x)).sort();
  console.log("BOTH " + (both.length > 0 ? both.join(" ") : "-"));
  console.log(`ONLY_A ${[...a].filter((x) => !b.has(x)).length}`);
  console.log(`ALL ${new Set([...a, ...b]).size}`);
}

main();
'''
hints = [
  "new Set(tokens) drops the duplicate sneakers on the way in. A Set's count is .size, not .length.",
  "[...a].filter((x) => b.has(x)) is the intersection; negate the test for the difference; spread both into one Set for the union.",
  "both.length > 0 ? both.join(\" \") : \"-\" covers the empty case in one expression.",
]

