[[quest]]
id          = "typescript.advanced.03.arrays"
node        = 3
title       = "THE MIDDLE OF THE BOARD"
difficulty  = 2
story       = "The tram-stop board on Yee Wo Street shows the first tram and the last one of the evening, and the dispatcher wants to know how many seats are in everything between."
concepts    = ["slices", "iteration", "control-flow"]
requires    = ["typescript.advanced.02.control-flow"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` on the first line and then `n` integers on the
second, separated by spaces. `n` is at least `1`, so there is always a first
value and a last value to print.

Print three lines: the first value, the last value, and the sum of everything
strictly between them. With fewer than three values that sum is `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums.slice(1, -1)` is the middle: a **new array**, copied, with a negative
end counting from the back. `nums[nums.length - 1]` is the last element, and
so is `nums.at(-1)` — but look at their types. The index says `number`
because the compiler trusts you; `at` says `number | undefined` because an
array can be empty and the compiler cannot see that yours is not. Both are
the same value at run time. Only one of them is honest about it.

`reduce((sum, v) => sum + v, 0)` adds up the middle. The `0` is not
decoration: `reduce` on an empty array **with no initial value** throws
`TypeError: Reduce of empty array with no initial value`, and a one-element
input makes the middle empty.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const data = input.split(/\s+/).filter((t) => t !== "");
  const nums: number[] = data.slice(1).map(Number);

  // print nums[0], the last element, then the sum of the middle slice
  console.log(`${nums[0]}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const data = input.split(/\s+/).filter((t) => t !== "");
  const nums: number[] = data.slice(1).map(Number);

  console.log(`${nums[0]}`);
  console.log(`${nums[nums.length - 1]}`);
  const middle = nums.slice(1, -1);
  console.log(`${middle.reduce((sum, v) => sum + v, 0)}`);
}

main();
'''
hints = [
  "nums[nums.length - 1] is the last element. nums.at(-1) is too, and its type admits that it might not be there.",
  "nums.slice(1, -1) is everything except the first and last; with one or two values it is [].",
  "reduce needs the 0 as its second argument, or an empty middle throws instead of summing to nothing.",
]

