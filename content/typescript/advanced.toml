brief       = '''
Standard input is one line of integers separated by spaces.

Print three lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

TypeScript has no comprehensions. It has the array methods, and they are
the same idea written left to right: `filter` keeps, `map` transforms,
`reduce` folds, and `new Set(...)` dedupes. Each returns a new value and
none of them needs an index.

`reduce` takes an initial value, and here it is not optional: the sample
has evens, but one of the hidden cases does not, and
`[].reduce((a, b) => a + b)` throws `TypeError: Reduce of empty array with
no initial value`. `reduce((sum, v) => sum + v, 0)` sums nothing to `0`.

Negative numbers: `-4 % 2` is `-0` in JavaScript. `-0 === 0` is `true`, so
the even test is fine — but print numbers through a template literal, where
`` `${-0}` `` is `"0"`, and never let a bare `-0` reach `console.log`.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const nums: number[] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  // 1. sum of the even ones
  // 2. the ones over 10, doubled, joined by spaces, or "-"
  // 3. how many distinct values
  console.log("0");
  console.log("-");
  console.log(`${nums.length}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const nums: number[] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  const evens = nums.filter((v) => v % 2 === 0).reduce((sum, v) => sum + v, 0);
  console.log(`${evens}`);

  const big = nums.filter((v) => v > 10).map((v) => v * 2);
  console.log(big.length > 0 ? big.join(" ") : "-");

  console.log(`${new Set(nums).size}`);
}

main();
'''
