[[quest]]
id          = "typescript.advanced.05.maps"
node        = 5
title       = "WHAT THE WALL IS SAYING"
difficulty  = 3
story       = "The Hysan Place wall ranks the words the feed sends up tonight, and every count on it reads NaN."
concepts    = ["collections", "sorting", "iteration"]
requires    = ["typescript.advanced.04.strings"]
map          = { x = 0.604, y = 0.137, kind = "quest" }
brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, and ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```

The starter counts into a `Record<string, number>`, and the type says every
key holds a `number`. At run time a key nobody wrote holds `undefined`, and
`undefined + 1` is `NaN` — no exception, no warning, just a wrong number on
the wall. Use a `Map<string, number>`: `counts.get(word)` is typed
`number | undefined`, which is the truth, and `?? 0` is the answer to it.

Sort the entries with a comparator: count descending is `b[1] - a[1]`, and
when that is `0` fall through to the word. Compare the words with `<` and
`>`, not `localeCompare` — `localeCompare` asks the machine's locale, and a
board must read the same on every machine.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const words = input.split(/\s+/).filter((t) => t !== "");

  const counts: Record<string, number> = {};
  for (const word of words) {
    counts[word] += 1;
  }

  for (const [word, count] of Object.entries(counts)) {
    console.log(`${word} ${count}`);
  }
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const words = input.split(/\s+/).filter((t) => t !== "");

  const counts = new Map<string, number>();
  for (const word of words) {
    counts.set(word, (counts.get(word) ?? 0) + 1);
  }

  const ranked = [...counts.entries()].sort(
    (a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0),
  );
  for (const [word, count] of ranked) {
    console.log(`${word} ${count}`);
  }
}

main();
'''
hints = [
  "The starter prints NaN because counts[word] was undefined before the +=. The Record type promised a number that was never there.",
  "counts.set(word, (counts.get(word) ?? 0) + 1) — get admits the miss, ?? supplies the zero.",
  "b[1] - a[1] || wordOrder: a comparator returning 0 hands the tie to the right side of the ||.",
]

