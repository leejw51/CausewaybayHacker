  "The last line of output is the object's tag, and the test wants [object Generator]. That is what a function* returns.",
  "yield value, then advance. The function pauses at the yield and resumes after it on the next request.",
  "A generator can be walked once. That is why main builds a fresh ticker for the sum instead of reusing the one the first loop drained.",
]

