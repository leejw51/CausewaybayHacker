node        = 33
title       = "STOP WAITING"
difficulty  = 4
story       = "The control room pings every screen for its status before it redraws the island map, and the screen on Tin Hau whose network card is down never answers, so the map never redraws."
concepts    = ["async", "cancellation", "error-handling"]
requires    = ["typescript.advanced.32.containers"]
map          = { x = 0.605, y = 0.932, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<SCREEN> <DOWN>`, where
`DOWN` is `0` for a screen that answers at once and `1` for one whose
network card is down and never answers at all.

For each screen, run its `ping(screen, down, token)` under `withTimeout` with a **200 ms** deadline, and print
`<SCREEN> OK` or `<SCREEN> TIMEOUT`, in input order. Then start a
`watch(token)` task that loops forever on a 10 ms sleep, cancel its token,
**await it**, and let it print `CANCELLED` from its `catch` and `CLEANUP`
from its `finally`. Last, print `TIMEOUTS <k>`.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

A Promise cannot be cancelled. There is no `.cancel()`, and `Promise.race`
against a timer only decides who you *listen to* — the loser keeps running,
and anything it still has pending, a timer or a subscription, keeps holding
on after your last line. So cancellation is something you
**pass in**: a token the work checks, or subscribes to. The starter has one,
`Token`, with `cancel()` and `onCancel(handler)`; `sleep` subscribes, and on
cancel it clears its timer and rejects with `Cancelled`, and `silence` — the
dead screen — is a promise that nothing but a cancel will ever settle. (`AbortController`
is the platform's version of the same thing. It is not declared here.)

`withTimeout(work, ms)` makes a token, races `work(token)` against a timer
that rejects with `Timeout` **and** cancels the token, and clears its own
timer in a `finally` when the work wins. The starter never calls it: it
awaits `ping` directly, and `WONG` never answers. You have seen what Node
does with that: nothing left that could wake anybody, so the process exits,
status `0`, after `LAM OK`.

It also cancels `watch` without awaiting it, so `TIMEOUTS` prints before
the watcher has had its turn — and the watcher's re-thrown `Cancelled`
lands on nobody, which Node reports as an unhandled rejection and exits
with status `1`. Re-throw the `Cancelled` inside `watch` after handling it:
swallowing it is how a task becomes uncancellable. Catch it where you
awaited the task.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Cancelled extends Error {}
class Timeout extends Error {}

class Token {
  cancelled = false;
  private handlers: (() => void)[] = [];

  onCancel(handler: () => void): void {
    if (this.cancelled) handler();
    else this.handlers.push(handler);
  }

  cancel(): void {
    if (this.cancelled) return;
    this.cancelled = true;
    for (const handler of this.handlers.splice(0)) handler();
  }
}

function sleep(ms: number, token: Token): Promise<void> {
  return new Promise((resolve, reject) => {
    const id = setTimeout(resolve, ms);
    token.onCancel(() => {
      clearTimeout(id);
      reject(new Cancelled());
    });
  });
}

function silence(token: Token): Promise<never> {
  return new Promise((_, reject) => {
    token.onCancel(() => reject(new Cancelled()));
  });
}

async function ping(screen: string, down: number, token: Token): Promise<string> {
  if (down === 1) await silence(token);
  else await sleep(0, token);
  return `${screen} OK`;
}

async function withTimeout<T>(work: (token: Token) => Promise<T>, ms: number): Promise<T> {
  // race work(token) against a deadline that rejects with Timeout and cancels the token
  return work(new Token());
}

async function watch(token: Token): Promise<void> {
  try {
    for (;;) {
      await sleep(10, token);
    }
  } catch (err: unknown) {
    if (err instanceof Cancelled) console.log("CANCELLED");
    throw err;
  } finally {
    console.log("CLEANUP");
  }
}

async function main(): Promise<void> {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let timeouts = 0;
  for (let i = 1; i <= n; i++) {
    const [screen, down] = lines[i].trim().split(/\s+/);
    console.log(await ping(screen, Number(down), new Token()));
  }

  const token = new Token();
  const watcher = watch(token);
  token.cancel();
  console.log(`TIMEOUTS ${timeouts}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Cancelled extends Error {}
class Timeout extends Error {}

class Token {
  cancelled = false;
  private handlers: (() => void)[] = [];

  onCancel(handler: () => void): void {
    if (this.cancelled) handler();
    else this.handlers.push(handler);
  }

  cancel(): void {
    if (this.cancelled) return;
    this.cancelled = true;
    for (const handler of this.handlers.splice(0)) handler();
  }
}

function sleep(ms: number, token: Token): Promise<void> {
  return new Promise((resolve, reject) => {
    const id = setTimeout(resolve, ms);
    token.onCancel(() => {
      clearTimeout(id);
      reject(new Cancelled());
    });
  });
}

function silence(token: Token): Promise<never> {
  return new Promise((_, reject) => {
    token.onCancel(() => reject(new Cancelled()));
  });
}

async function ping(screen: string, down: number, token: Token): Promise<string> {
  if (down === 1) await silence(token);
  else await sleep(0, token);
  return `${screen} OK`;
}

async function withTimeout<T>(work: (token: Token) => Promise<T>, ms: number): Promise<T> {
  const token = new Token();
  let timer: number | undefined;
  const deadline = new Promise<never>((_, reject) => {
    timer = setTimeout(() => {
      // reject first, so the race settles on Timeout; then stop the work
      reject(new Timeout());
      token.cancel();
    }, ms);
  });
  try {
    return await Promise.race([work(token), deadline]);
  } finally {
    clearTimeout(timer);
  }
}

async function watch(token: Token): Promise<void> {
  try {
    for (;;) {
      await sleep(10, token);
    }
  } catch (err: unknown) {
    if (err instanceof Cancelled) console.log("CANCELLED");
    throw err;
  } finally {
    console.log("CLEANUP");
  }
}

async function main(): Promise<void> {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let timeouts = 0;
  for (let i = 1; i <= n; i++) {
    const [screen, down] = lines[i].trim().split(/\s+/);
    try {
      console.log(await withTimeout((token) => ping(screen, Number(down), token), 200));
    } catch (err: unknown) {
      if (!(err instanceof Timeout)) throw err;
      timeouts++;
      console.log(`${screen} TIMEOUT`);
    }
  }

  const token = new Token();
  const watcher = watch(token);
  token.cancel();
  try {
    await watcher;
  } catch (err: unknown) {
    if (!(err instanceof Cancelled)) throw err;
  }
  console.log(`TIMEOUTS ${timeouts}`);
}

main();
'''
