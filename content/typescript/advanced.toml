solution    = '''
import { readFileSync } from "fs";

function* accumulate(values: Iterable<number>): Generator<number> {
  let total = 0;
  for (const value of values) {
    total += value;
    yield total;
  }
}

function* runs<T>(values: Iterable<T>): Generator<[T, number]> {
  // the run in progress; undefined only before the first value
  let run: { value: T; length: number } | undefined;
  for (const value of values) {
    if (run !== undefined && run.value === value) {
      run.length++;
      continue;
    }
    if (run !== undefined) yield [run.value, run.length];
    run = { value, length: 1 };
  }
  if (run !== undefined) yield [run.value, run.length];
}

function* pairs<T>(items: readonly T[]): Generator<[T, T]> {
  for (let i = 0; i < items.length; i++) {
    for (let j = i + 1; j < items.length; j++) {
      yield [items[i], items[j]];
    }
  }
}

function main(): void {
  const nums = readFileSync(0, "utf8").split(/\s+/).filter((t) => t !== "").map(Number);

  console.log("SUMS " + [...accumulate(nums)].join(" "));
  console.log("RUNS " + [...runs(nums)].map(([v, k]) => `${v}x${k}`).join(" "));

  const distinct = [...new Set(nums)].sort((a, b) => a - b);
  let count = 0;
  for (const _ of pairs(distinct)) {
    count++;
  }
  console.log(`PAIRS ${count}`);
}

main();
'''
