[[quest]]
id          = "typescript.advanced.19.mutex"
node        = 19
title       = "ONE COUNTER, EIGHT SCREENS"
difficulty  = 3
story       = "Every screen on the island reports its plays into the one billing counter on the thirtieth floor, and at midnight the counter says one play and every screen swears it reported."
concepts    = ["shared-state", "concurrency", "thread-safety"]
requires    = ["typescript.advanced.18.promise-all"]
map          = { x = 0.619, y = 0.533, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one async task per value, all at once. Each reads the shared counter,
makes a **round trip** to the billing server (the starter's `roundTrip()`,
one turn of the event loop), and writes the counter back with its value
added to the total and one added to the hits. Wait for all of them, then
print `TOTAL <sum>` and `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

JavaScript has one thread, and people will tell you that means it has no
races. It has no **data** races: no two lines ever run at the same instant.
It has every other kind. The starter's tasks all read the counter, all
park on the round trip, and all come back and write `what I read + mine` —
and what each of them read was `0`. The last one to write wins: `TOTAL 4`,
`HITS 1`, deterministically, every run. An `await` between a read and a
write is a door, and anything can walk through it.

Keep the round trip; it is the job. Put a lock around the read, the trip and
the write. The starter has a `Mutex` class with the right signature and no
lock in it — `run` just calls the critical section. Make it real, out of
nothing but Promises: keep a `tail` promise; each caller chains onto the
tail, replaces it with a promise of its own, waits for the old one, runs,
and resolves its own in a `finally` so an exception cannot leave the lock
held.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function roundTrip(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class Mutex {
  async run<T>(critical: () => Promise<T>): Promise<T> {
    return critical();
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const counter = { total: 0, hits: 0 };
  const lock = new Mutex();

  async function report(value: number): Promise<void> {
    await lock.run(async () => {
      const seen = { ...counter };
      await roundTrip();
      counter.total = seen.total + value;
      counter.hits = seen.hits + 1;
    });
  }

  await Promise.all(nums.map((value) => report(value)));

  console.log(`TOTAL ${counter.total}`);
  console.log(`HITS ${counter.hits}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function roundTrip(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class Mutex {
  private tail: Promise<void> = Promise.resolve();

  async run<T>(critical: () => Promise<T>): Promise<T> {
    // take a place in the line, then wait for the one ahead of us
    const ahead = this.tail;
    let release: () => void = () => {};
    this.tail = new Promise<void>((resolve) => {
      release = resolve;
    });
    await ahead;
    try {
      return await critical();
    } finally {
      release();
    }
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const counter = { total: 0, hits: 0 };
  const lock = new Mutex();

  async function report(value: number): Promise<void> {
    await lock.run(async () => {
      const seen = { ...counter };
      await roundTrip();
      counter.total = seen.total + value;
      counter.hits = seen.hits + 1;
    });
  }

  await Promise.all(nums.map((value) => report(value)));

  console.log(`TOTAL ${counter.total}`);
  console.log(`HITS ${counter.hits}`);
}

main();
'''
