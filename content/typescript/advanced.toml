solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class MinHeap {
  private items: number[] = [];

  get size(): number {
    return this.items.length;
  }

  push(value: number): void {
    const a = this.items;
    a.push(value);
    let i = a.length - 1;
    while (i > 0) {
      const parent = (i - 1) >> 1;
      if (a[parent] <= a[i]) break;
      [a[parent], a[i]] = [a[i], a[parent]];
      i = parent;
    }
  }

  pop(): number | undefined {
    const a = this.items;
    if (a.length === 0) return undefined;
    const top = a[0];
    const last = a.pop() as number;
    if (a.length > 0) {
      a[0] = last;
      let i = 0;
      for (;;) {
        const l = 2 * i + 1;
        const r = l + 1;
        let m = i;
        if (l < a.length && a[l] < a[m]) m = l;
        if (r < a.length && a[r] < a[m]) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]];
        i = m;
      }
    }
    return top;
  }
}

// first index whose value is not less than x (left) or greater than x (right)
function bisect(sorted: readonly number[], x: number, right: boolean): number {
  let lo = 0;
  let hi = sorted.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (sorted[mid] < x || (right && sorted[mid] === x)) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}

function main(): void {
  const [wordLine = "", numLine = "", xLine = ""] = input.split("\n");
  const words = wordLine.split(/\s+/).filter((t) => t !== "");
  const nums = numLine.split(/\s+/).filter((t) => t !== "").map(Number);
  const x = Number(xLine);

  const counts = new Map<string, number>();
  for (const w of words) counts.set(w, (counts.get(w) ?? 0) + 1);
  const [top] = [...counts].sort(
    (a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0),
  );
  console.log(`TOP ${top[0]} ${top[1]}`);

  console.log(`BISECT ${bisect(nums, x, false)} ${bisect(nums, x, true)}`);

  const heap = new MinHeap();
  for (const v of nums) heap.push(v);
  const smallest: number[] = [];
  while (smallest.length < 3 && heap.size > 0) {
    smallest.push(heap.pop() as number);
  }
  console.log("SMALLEST3 " + smallest.join(" "));

  const groups = new Map<string, string[]>();
  for (const w of words) {
    let list = groups.get(w[0]);
    if (list === undefined) {
      list = [];
      groups.set(w[0], list);
    }
    list.push(w);
  }
  const letters = [...groups.keys()].sort();
  console.log("GROUPS " + letters.map((k) => `${k}:${groups.get(k)?.length ?? 0}`).join(" "));
}

main();
'''
