map          = { x = 0.119, y = 0.272, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Write a **generator function** `ticker(start, step, count)` that yields
`count` values beginning at `start` and advancing by `step`. Print each on
its own line, then `SUM <total>` computed by walking a second ticker.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        [object Generator]
```

The last line is `Object.prototype.toString.call(ticker(...))`, printed by
the starter's `main` as it stands. Right now it says `[object Array]`.

A `function*` does not run when you call it. It returns a generator object,
and the body runs one step at a time, each time something asks for the next
value — `for...of`, spread, `Array.from`. That is why it can describe a
million values without an array of a million values ever existing.

The starter builds the array and returns it, and it type-checks, because
the return type says `Iterable<number>` and an array is one. The contract
is satisfied; the question was not. An array is every value at once; a
generator is one value when asked. Turn the `push` into a `yield` and delete
the array.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function ticker(start: number, step: number, count: number): Iterable<number> {
  const values: number[] = [];
  for (let i = 0; i < count; i++) {
    values.push(start + i * step);
  }
  return values;
}

function main(): void {
  const [start, step, count] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  for (const value of ticker(start, step, count)) {
    console.log(`${value}`);
  }
  let sum = 0;
  for (const value of ticker(start, step, count)) {
    sum += value;
  }
  console.log(`SUM ${sum}`);
  console.log(Object.prototype.toString.call(ticker(start, step, count)));
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function* ticker(start: number, step: number, count: number): Generator<number> {
  let value = start;
  for (let i = 0; i < count; i++) {
    yield value;
    value += step;
  }
}

function main(): void {
  const [start, step, count] = input.split(/\s+/).filter((t) => t !== "").map(Number);

  for (const value of ticker(start, step, count)) {
    console.log(`${value}`);
  }
  let sum = 0;
  for (const value of ticker(start, step, count)) {
    sum += value;
  }
  console.log(`SUM ${sum}`);
  console.log(Object.prototype.toString.call(ticker(start, step, count)));
}

main();
'''
