# TYPESCRIPT LAND — ADVANCED. The walk past the screens turns into the rush.
# First the language's own machinery — conversions, arrays, strings, Maps,
# Sets, functions, exceptions, array methods, sorting, classes, discriminated
# unions, generators, higher-order functions, structural typing, and
# UNDEFINED on the rate board — and then the signage control room at
# 22:00, where everything is waiting on something: Promise.all, a lost update
# across an `await`, a mutex built from Promises, async queues, worker pools,
# try/finally, iterator pipelines, memoisation, type guards, Object.freeze,
# error hierarchies, hand-written iterators, cancellation tokens, and THE
# EVENT LOOP. The grammar drills live on the BASIC road now.
#
# The land is about types as contracts that are erased at runtime: the
# compiler checks what the code promises, and `node` runs whatever actually
# arrived. Several quests here compile cleanly and are still wrong for
# exactly that reason, and that is the lesson, not an accident.
#
# Every quest here has a deterministic answer on purpose: results are joined in
# order, collected and sorted, or piped, and the event-loop quests use only
# the orderings Node guarantees — microtasks before macrotasks, setImmediate
# in FIFO order, timers in expiry order. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Toolchain: one `main.ts`, `tsc -p .` (strict, es2022, commonjs, lib es2023,
# no @types/node) against backend/runner/src/typescript/node.d.ts, run as
# `node --enable-source-maps main.js`. There is no top-level await here, so
# every async quest wraps its body in `async function main()`.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "typescript.advanced"
land = "typescript"
category = "advanced"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "typescript.advanced.01.conversions"
node        = 1
title       = "ONE NAME, ONE SHAPE"
difficulty  = 2
story       = "19:00, the control room on the thirtieth floor. The feed sends the Times Square slot price as text, the billing screen wants it as a number, and the big screen wants dollars."
concepts    = ["bindings", "types", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Read one line: an amount in cents, as digits.

Print three lines:

1. how many characters the trimmed text has
2. the amount as a number
3. the amount as dollars with exactly two decimals

```
input:  1234
output: 4
        1234
        12.34
```

The amount is non-negative. In Python you would rebind one name three times.
TypeScript will not let you: a name keeps the type it was born with, so

```ts
let cents = input.trim();   // string, for the rest of its life
cents = Number(cents);      // TS2322: Type 'number' is not assignable to type 'string'.
```

fails before a line has run. That is the contract doing its job. Give each
shape its own `const` — the text, the number, the dollars — and the reader
never has to scroll up to find out what a name is holding right now.

Do not go through floating point for the dollars. `(1234 / 100).toFixed(2)`
happens to work today and `0.1 + 0.2` is `0.30000000000000004` every day.
`Math.trunc(cents / 100)` and `cents % 100` are the two halves exactly, and
`String(cents % 100).padStart(2, "0")` pads the second one.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const text: string = input.trim();

  // 1. the character count of `text`
  // 2. `text` as a number, under a name of its own
  // 3. that number as dollars, two decimals
  console.log(text);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function main(): void {
  const text: string = input.trim();
  console.log(`${text.length}`);

  // `text = Number(text)` would not compile: a name keeps its type for life
  const cents: number = Number(text);
  console.log(`${cents}`);

  const dollars: string = `${Math.trunc(cents / 100)}.${String(cents % 100).padStart(2, "0")}`;
  console.log(dollars);
}

main();
'''
hints = [
  "text.length while you still have the string is the first line.",
  "const cents: number = Number(text) is a new name with a new type. Reusing `text` for it is TS2322, which is the compiler telling you the old contract still stands.",
  "padStart(2, \"0\") pads on the left to width two: 5 cents is 0.05, not 0.5.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "dollars",    stdin = "1234\n", expect = "4\n1234\n12.34\n", visible = true },
  { name = "five-cents", stdin = "5\n",    expect = "1\n5\n0.05\n",     visible = false },
  { name = "round",      stdin = "100\n",  expect = "3\n100\n1.00\n",   visible = false },
]

# ---------------------------------------------------------------- 02
[[quest]]
id          = "typescript.advanced.02.control-flow"
node        = 2
title       = "WHICH SLOT"
difficulty  = 2
story       = "The Times Square screen runs a rotation: every third slot an ad, every fifth the news. The scheduler prints the slot number every time, and the screen shows a number in forty-foot digits."
concepts    = ["control-flow", "io", "functions"]
requires    = ["typescript.advanced.01.conversions"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
Read one integer `n`. For every `i` from `1` to `n`, print one line:

* `ADNEWS` if `i` divides by both 3 and 5
* `AD` if `i` divides by 3
* `NEWS` if `i` divides by 5
* otherwise `i` itself

Then keep reading integers, one per line, until you read `0`, and print
`SKIPPED <k>`, how many non-zero lines you read on the way.

```
input:  5
        7
        8
        0
output: 1
        2
        AD
        4
        NEWS
        SKIPPED 2
```

Two loops, two kinds. The first knows how many times it runs before it
starts: `for (let i = 1; i <= n; i++)`. The second does not: `for (;;)` or
`while (true)` with a `break`, because the count is decided by what you read.
`i < n` stops one short, and it is the off-by-one everyone writes here once.

Standard input arrives in one piece. `input.split("\n")` gives you the lines,
and an index that walks down them is the "read the next line" you would have
in any other language.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function label(i: number): string {
  // ADNEWS / AD / NEWS / i
  return String(i);
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i < n; i++) {
    console.log(label(i));
  }

  let skipped = 0;
  // read lines after the first until a 0, counting the non-zero ones
  console.log(`SKIPPED ${skipped}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function label(i: number): string {
  if (i % 15 === 0) return "ADNEWS";
  if (i % 3 === 0) return "AD";
  if (i % 5 === 0) return "NEWS";
  return String(i);
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i <= n; i++) {
    console.log(label(i));
  }

  let skipped = 0;
  let next = 1;
  while (next < lines.length) {
    const value = Number(lines[next]);
    next++;
    if (value === 0) break;
    skipped++;
  }
  console.log(`SKIPPED ${skipped}`);
}

main();
'''
hints = [
  "Check the both-case first, or it never fires. Divisible by 3 and 5 is divisible by 15.",
  "i < n stops at n - 1. The starter has that bug; the sample output ends one line early.",
  "=== not ==. `\"0\" == 0` is true and `\"\" == 0` is true too, which is how a blank line ends a loop it should not.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "five",    stdin = "5\n7\n8\n0\n",  expect = "1\n2\nAD\n4\nNEWS\nSKIPPED 2\n", visible = true },
  { name = "fifteen", stdin = "15\n0\n",      expect = "1\n2\nAD\n4\nNEWS\nAD\n7\n8\nAD\nNEWS\n11\nAD\n13\n14\nADNEWS\nSKIPPED 0\n", visible = false },
  { name = "one",     stdin = "1\n5\n5\n5\n0\n", expect = "1\nSKIPPED 3\n", visible = false },
]

