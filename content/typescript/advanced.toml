const input: string = require("fs").readFileSync(0, "utf8");

class PriceError extends Error {}

class NotANumber extends PriceError {
  constructor(options?: ErrorOptions) {
    super("not a number", options);
  }
}

class Negative extends PriceError {
  constructor(readonly hours: number) {
    super(`negative hours: ${hours}`);
  }
}

function price(text: string): number {
  let hours: number;
  try {
    hours = Number(BigInt(text));
  } catch (cause: unknown) {
    // the SyntaxError becomes the cause; the caller sees our type
    throw new NotANumber({ cause });
  }
  if (hours < 0) throw new Negative(hours);
  return 500 + 100 * hours;
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  let errors = 0;
  for (let i = 1; i <= n; i++) {
    const line = lines[i].trim();
    try {
      console.log(`${price(line)}`);
    } catch (err: unknown) {
      if (!(err instanceof PriceError)) throw err;
      errors++;
      console.log(err.message);
    }
  }
  console.log(`ERRORS ${errors}`);
}

main();
