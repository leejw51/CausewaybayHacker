Standard input is a count `n` and then `n` integers.

Start one async task per value that waits one turn of the event loop,
computes the value's square, and stores it in `results[i]` — its own slot,
so no two tasks write the same place. Wait for **all** of them, then print
the results **in index order**, one per line, then `TASKS <n>`.

```
input:  3
