[[quest]]
id          = "typescript.advanced.14.generators"
node        = 14
title       = "YOUR OWN FOR LOOP"
difficulty  = 3
story       = "The countdown on the Times Square screen steps from one number to the next in fixed jumps, and the controller behind it keeps no list of the numbers anywhere."
concepts    = ["generators", "iteration", "functions"]
