id          = "typescript.advanced.20.channel"
node        = 20
title       = "WHO CLOSES THE FEED"
difficulty  = 3
story       = "The control room pushes every arrival time down the feed to the Yee Wo Street board, and after the last one the board sits waiting for a next that never comes, then goes dark."
concepts    = ["channels", "concurrency", "iteration"]
requires    = ["typescript.advanced.19.mutex"]
map          = { x = 0.801, y = 0.447, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

One producer task sends each value multiplied by ten down a `Channel`, one
per turn of the event loop, then **closes** it. The main task receives
until the channel says it is closed, printing each value and keeping a
total, then prints `SUM <total>` and `CLOSED`.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

The starter's `Channel` is complete: `send`, `receive`, and `close`, which
wakes every waiting receiver with `undefined`. The producer never calls
`close`, so after the last value the receiver awaits a promise nobody will
ever resolve.

In Go that is `fatal error: all goroutines are asleep - deadlock!`. In
Python it is a hang until the runner kills it. Node does neither. When the
event loop has nothing left that could ever wake anything — no timers, no
I/O, no immediates — the process simply **exits**, status `0`, in the middle
of your `for (;;)`. The `SUM` line and the `CLOSED` line never run, and from
the outside it looks like success. That is worse than a crash, and it is
what the starter does.

The producer closes the channel. Never the consumer — the side that knows
the stream is over is the side that ends it.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class Channel<T> {
  private items: T[] = [];
  private waiting: ((item: T | undefined) => void)[] = [];
  private closed = false;

  send(item: T): void {
    const receiver = this.waiting.shift();
    if (receiver !== undefined) receiver(item);
    else this.items.push(item);
  }

  close(): void {
    this.closed = true;
    for (const receiver of this.waiting.splice(0)) receiver(undefined);
  }

  receive(): Promise<T | undefined> {
    if (this.items.length > 0) return Promise.resolve(this.items.shift());
    if (this.closed) return Promise.resolve(undefined);
    return new Promise((resolve) => this.waiting.push(resolve));
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const feed = new Channel<number>();

  async function control(): Promise<void> {
    for (const value of nums) {
      await tick();
      feed.send(value * 10);
    }
    // the feed is still open
  }

  const producer = control();

  let total = 0;
  for (;;) {
    const value = await feed.receive();
    if (value === undefined) break;
    console.log(`${value}`);
    total += value;
  }
  await producer;

  console.log(`SUM ${total}`);
  console.log("CLOSED");
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class Channel<T> {
  private items: T[] = [];
  private waiting: ((item: T | undefined) => void)[] = [];
  private closed = false;

  send(item: T): void {
    const receiver = this.waiting.shift();
    if (receiver !== undefined) receiver(item);
    else this.items.push(item);
  }

  close(): void {
    this.closed = true;
    for (const receiver of this.waiting.splice(0)) receiver(undefined);
  }

  receive(): Promise<T | undefined> {
    if (this.items.length > 0) return Promise.resolve(this.items.shift());
    if (this.closed) return Promise.resolve(undefined);
    return new Promise((resolve) => this.waiting.push(resolve));
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);

  const feed = new Channel<number>();

  async function control(): Promise<void> {
    for (const value of nums) {
      await tick();
      feed.send(value * 10);
    }
    feed.close();
  }

  const producer = control();

  let total = 0;
  for (;;) {
    const value = await feed.receive();
    if (value === undefined) break;
    console.log(`${value}`);
    total += value;
  }
  await producer;

  console.log(`SUM ${total}`);
  console.log("CLOSED");
}

main();
'''
hints = [
  "One line, at the end of control: feed.close().",
  "The receiver already checks `=== undefined`. It was waiting for something the producer never sent. `if (!value) break` would also stop — on the first 0, which one hidden case sends.",
  "If undefined could be a real value on the channel, receive would return { done: true } | { done: false, value: T } instead — the same shape an iterator's next() returns, and for the same reason.",
]

