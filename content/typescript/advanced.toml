solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

class Price {
  constructor(
    readonly name: string,
    readonly cents: number,
  ) {
    // readonly is erased; freeze is what is still there at run time
    Object.freeze(this);
  }
}

class Tally {
  count = 0;

  constructor() {
    Object.seal(this);
  }
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  const prices: Price[] = [];
  for (let i = 1; i <= n; i++) {
    const [name, cents] = lines[i].trim().split(/\s+/);
    prices.push(new Price(name, Number(cents)));
  }

  for (const price of prices) {
    try {
      (price as { cents: number }).cents = 0;
      console.log(`MUTATED ${price.name}`);
    } catch (err: unknown) {
      if (!(err instanceof TypeError)) throw err;
      console.log(`FROZEN ${price.name}`);
    }
  }

  const tally = new Tally();
  tally.count = n;
  try {
    (tally as unknown as { cuont: number }).cuont = 0;
    console.log("SEALED NO");
  } catch (err: unknown) {
    if (!(err instanceof TypeError)) throw err;
    console.log("SEALED YES");
  }

  console.log(`IN_SET ${new Set(prices.map((p) => `${p.name}:${p.cents}`)).size}`);
  console.log(`TOTAL ${prices.reduce((sum, p) => sum + p.cents, 0)}`);
}

main();
