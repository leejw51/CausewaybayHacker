brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it is not a
whole number. Finally print `SUM <total>`, where the total is the sum of the
values you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`Number("xx")` does not fail. It returns `NaN`, and `Number("1.5")` is
`1.5` and `Number("")` is `0`. That is why the starter's `double` checks the
text against a pattern and **throws** `NotANumber` — and why the starter
dies with that exception on the second line, because nothing catches it.

Wrap the one call that can throw in `try`/`catch`. Under `strict` the
caught value is typed **`unknown`**: `throw` in JavaScript can throw
anything, a string or a number or `undefined`, and the compiler will not
pretend otherwise. There is no `catch (NotANumber e)`. You narrow it
yourself — `if (err instanceof NotANumber)` — and `throw err` again when it
is not yours, so a typo in your own code still fails loudly instead of being
reported as a bad line.
'''
