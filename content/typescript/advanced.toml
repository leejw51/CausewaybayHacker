[[quest]]
id          = "typescript.advanced.27.memo"
node        = 27
title       = "REMEMBER WHAT YOU WORKED OUT"
difficulty  = 4
story       = "The scheduler for the Times Square screen works out the same rotation from the same two numbers eleven thousand times before midnight, from scratch, every time."
