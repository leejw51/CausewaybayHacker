`Iterator.prototype.map`, `.filter`, `.take` — in Node since version 22,
and they are **not** on this shelf: the `es2023` library does not declare
them, so `tsc` says `TS2339: Property 'map' does not exist` however new the
`node` underneath is. What you can use is what the library declares, and
what you import. This file imports `readFileSync` from `"fs"` with an ES
`import` — which makes the file a **module**, and `tsc` compiles it to a
`require` because the target is CommonJS. Everything else, you write.

`runs` groups **adjacent** equal items only. It is not a count, and the
sample is chosen so the two disagree: `1` appears four times, in two runs.
