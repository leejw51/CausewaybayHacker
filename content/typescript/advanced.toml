solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const nums = data.slice(1, 1 + data[0]);
  const results: (number | undefined)[] = nums.map(() => undefined);

  async function square(index: number, value: number): Promise<void> {
    await tick();
    results[index] = value * value;
  }

  const tasks = nums.map((value, i) => square(i, value));
  // every task is parked on its tick; give the thread up until all are back
  await Promise.all(tasks);

  for (const value of results) {
    console.log(`${value}`);
  }
  console.log(`TASKS ${nums.length}`);
}

main();
'''
