brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Put `[index, value]` pairs on the starter's `WorkQueue`. Start `w` consumer
tasks that loop taking a pair, waiting a turn, writing `value * 10` into
`results[index]`, and calling `taskDone()`. The main task awaits
`queue.join()`, then closes the queue so the consumers' `get()` returns
`undefined` and they stop, awaits them, then prints the results in index
order and `CONSUMERS <w>`.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join()` resolves when every item that was ever `put` has had a matching
`taskDone()`. The starter's consumers never call it. So `main` waits on
`join`, the consumers wait on `get` for items that will never come, and
nothing that could wake anybody is left on the event loop.

That is a **deadlock** — everyone waiting, nobody moving — and it needs no
threads and no locks: two promises each waiting for the other to move is
enough. Two async mutexes taken in opposite orders by two tasks is the
same thing with more ceremony. Node's answer to it is the one from the
last map: the loop runs dry and the process exits, status `0`, having
printed nothing at all.

The fix is again one line, on the consumer side.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class WorkQueue<T> {
  private items: T[] = [];
  private getters: ((item: T | undefined) => void)[] = [];
  private joiners: (() => void)[] = [];
  private unfinished = 0;
  private closed = false;

  put(item: T): void {
    this.unfinished++;
    const getter = this.getters.shift();
    if (getter !== undefined) getter(item);
    else this.items.push(item);
  }

  get(): Promise<T | undefined> {
    if (this.items.length > 0) return Promise.resolve(this.items.shift());
    if (this.closed) return Promise.resolve(undefined);
    return new Promise((resolve) => this.getters.push(resolve));
  }

  taskDone(): void {
    this.unfinished--;
    if (this.unfinished === 0) {
      for (const joiner of this.joiners.splice(0)) joiner();
    }
  }

  join(): Promise<void> {
    if (this.unfinished === 0) return Promise.resolve();
    return new Promise((resolve) => this.joiners.push(resolve));
  }

  close(): void {
    this.closed = true;
    for (const getter of this.getters.splice(0)) getter(undefined);
  }
}

async function consumer(queue: WorkQueue<[number, number]>, results: number[]): Promise<void> {
  for (;;) {
    const job = await queue.get();
    if (job === undefined) return;
    const [index, value] = job;
    await tick();
    results[index] = value * 10;
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const [workers, n] = data;
  const nums = data.slice(2, 2 + n);

  const queue = new WorkQueue<[number, number]>();
  const results: number[] = nums.map(() => 0);
  nums.forEach((value, i) => queue.put([i, value]));

  const consumers = Array.from({ length: workers }, () => consumer(queue, results));
  await queue.join();
  queue.close();
  await Promise.all(consumers);

  for (const value of results) {
    console.log(`${value}`);
  }
  console.log(`CONSUMERS ${workers}`);
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

function tick(): Promise<void> {
  return new Promise((resolve) => setTimeout(resolve, 0));
}

class WorkQueue<T> {
  private items: T[] = [];
  private getters: ((item: T | undefined) => void)[] = [];
  private joiners: (() => void)[] = [];
  private unfinished = 0;
  private closed = false;

  put(item: T): void {
    this.unfinished++;
    const getter = this.getters.shift();
    if (getter !== undefined) getter(item);
    else this.items.push(item);
  }

  get(): Promise<T | undefined> {
    if (this.items.length > 0) return Promise.resolve(this.items.shift());
    if (this.closed) return Promise.resolve(undefined);
    return new Promise((resolve) => this.getters.push(resolve));
  }

  taskDone(): void {
    this.unfinished--;
    if (this.unfinished === 0) {
      for (const joiner of this.joiners.splice(0)) joiner();
    }
  }

  join(): Promise<void> {
    if (this.unfinished === 0) return Promise.resolve();
    return new Promise((resolve) => this.joiners.push(resolve));
  }

  close(): void {
    this.closed = true;
    for (const getter of this.getters.splice(0)) getter(undefined);
  }
}

async function consumer(queue: WorkQueue<[number, number]>, results: number[]): Promise<void> {
  for (;;) {
    const job = await queue.get();
    if (job === undefined) return;
    const [index, value] = job;
    await tick();
    results[index] = value * 10;
    queue.taskDone();
  }
}

async function main(): Promise<void> {
  const data = input.split(/\s+/).filter((t) => t !== "").map(Number);
  const [workers, n] = data;
  const nums = data.slice(2, 2 + n);

  const queue = new WorkQueue<[number, number]>();
  const results: number[] = nums.map(() => 0);
  nums.forEach((value, i) => queue.put([i, value]));

  const consumers = Array.from({ length: workers }, () => consumer(queue, results));
  await queue.join();
  queue.close();
  await Promise.all(consumers);

  for (const value of results) {
    console.log(`${value}`);
  }
  console.log(`CONSUMERS ${workers}`);
}

main();
