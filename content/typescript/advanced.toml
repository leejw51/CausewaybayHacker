after it, the type says which four things an `Order` can be, and a `switch`
on `order.kind` narrows `order` inside each `case`.

The starter's `switch` has one arm and a `default` that prints `UNKNOWN`
for everything else — including the two kinds it is supposed to know. Give
every kind its arm, and make the `default` prove there is nothing left:

```ts
default: {
  const unreachable: never = order;
  return unreachable;
}
```

If a fifth kind is ever added to the union and not to the switch, that line
stops compiling. The union itself is erased at run time — `node` never sees
it — so the check has to happen here, in `tsc`, or not at all.
'''
starter     = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Order =
  | { kind: "ADULT"; stops: number }
  | { kind: "STUDENT"; stops: number }
  | { kind: "SENIOR"; stops: number }
  | { kind: "UNKNOWN"; raw: string };

function parse(kind: string, stops: number): Order {
  switch (kind) {
    case "ADULT":
    case "STUDENT":
    case "SENIOR":
      return { kind, stops };
    default:
      return { kind: "UNKNOWN", raw: kind };
  }
}

function fare(order: Order): string {
  switch (order.kind) {
    case "ADULT":
      return `${500 + 100 * order.stops}`;
    default:
      return `UNKNOWN ${order.kind}`;
  }
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i <= n; i++) {
    const [kind, stops] = lines[i].trim().split(/\s+/);
    console.log(fare(parse(kind, Number(stops))));
  }
}

main();
'''
solution    = '''
const input: string = require("fs").readFileSync(0, "utf8");

type Order =
  | { kind: "ADULT"; stops: number }
  | { kind: "STUDENT"; stops: number }
  | { kind: "SENIOR"; stops: number }
  | { kind: "UNKNOWN"; raw: string };

function parse(kind: string, stops: number): Order {
  switch (kind) {
    case "ADULT":
    case "STUDENT":
    case "SENIOR":
      return { kind, stops };
    default:
      return { kind: "UNKNOWN", raw: kind };
  }
}

function fare(order: Order): string {
  switch (order.kind) {
    case "ADULT":
      return `${500 + 100 * order.stops}`;
    case "STUDENT":
      return `${Math.floor((500 + 100 * order.stops) / 2)}`;
    case "SENIOR":
      return "200";
    case "UNKNOWN":
      return `UNKNOWN ${order.raw}`;
    default: {
      // every kind is handled above, so `order` is `never` here
      const unreachable: never = order;
      return unreachable;
    }
  }
}

function main(): void {
  const lines = input.split("\n");
  const n = Number(lines[0]);
  for (let i = 1; i <= n; i++) {
    const [kind, stops] = lines[i].trim().split(/\s+/);
    console.log(fare(parse(kind, Number(stops))));
  }
}

main();
'''
