[[quest]]
id          = "typescript.basic.01.first-screen"
node        = 1
title       = "SWITCH-ON"
difficulty  = 1
story       = '''19:00 over Times Square. The rain has just stopped, the big screen comes on, and the first frame of the night is black.'''
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Print exactly:

```
hello, causewaybay
```

Lowercase, one comma, one space, one line. Nothing else.

`console.log` adds the newline for you. It also adds a space between
arguments, which is the first thing about it that people get wrong:
`console.log("hello,", "causewaybay")` is fine, and
`console.log("hello, ", "causewaybay")` has two spaces in it.
'''
starter     = '''
function main(): void {
  // your code here
  // ANSWER: console.log("hello, causewaybay");
}

main();
'''
solution    = '''
function main(): void {
  console.log("hello, causewaybay");
}

main();
'''
hints = [
  'console.log("hello, causewaybay"); is the whole program.',
  "The string is exact: lowercase, one comma, one space after it.",
  "Leave the `main();` call at the bottom. A function that is never called prints nothing, and the starter is exactly that.",
]

[quest.tests]
