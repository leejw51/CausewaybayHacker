solution    = '''class TreeNode {
  val: number;
  left: TreeNode | undefined = undefined;
  right: TreeNode | undefined = undefined;

  constructor(val: number) {
    this.val = val;
  }
}

function insert(n: TreeNode | undefined, v: number): TreeNode {
  if (n === undefined) {
    return new TreeNode(v);
  }
  if (v < n.val) {
    n.left = insert(n.left, v);
  } else {
    n.right = insert(n.right, v);
  }
  return n;
}

function inorder(n: TreeNode | undefined, out: number[]): void {
  if (n === undefined) {
    return;
  }
  inorder(n.left, out);
  out.push(n.val);
  inorder(n.right, out);
}

function height(n: TreeNode | undefined): number {
  if (n === undefined) {
    return 0;
  }
  return 1 + Math.max(height(n.left), height(n.right));
}

function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  let root: TreeNode | undefined = undefined;
  for (const tok of input.trim().split(/\s+/)) {
    root = insert(root, Number(tok));
  }
  const out: number[] = [];
  inorder(root, out);
  console.log(out.join(" "));
  console.log(height(root));
}

main();
'''
