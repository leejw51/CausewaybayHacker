  { name = "seven-two", stdin = "7 2\n", expect = "3\n1\n3.50\n", visible = true },
  { name = "ten-four", stdin = "10 4\n", expect = "2\n2\n2.50\n", visible = false },
  { name = "exact", stdin = "9 3\n", expect = "3\n0\n3.00\n", visible = false },
