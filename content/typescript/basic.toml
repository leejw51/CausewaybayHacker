# TYPESCRIPT LAND — BASIC. The grammar road: Causeway Bay after dark, from the
# 19:00 switch-on of the big screen over Times Square to the thirtieth-floor
# control room at midnight, one construct per node. This is grammar practice,
# not a quiz: the brief explains one thing and shows how it is written, the
# starter is the whole program, and the player types the one or two lines
# that use it — Number(), toFixed and template literals, integer widths with
# `>>>` and a bigint, float vs Math.fround, string, array and Uint8Array
# slices with copy and append, a for loop, a typed function, a class with
# typed fields, an enum, push/splice/sort with a comparator (the default sort
# is lexicographic), an array edited at both ends, a Map with `??`, an object
# as the hash table, a Set, an array as a stack and a queue, toSorted,
# reverse, a comparator over an interface, a closure, filter/map/reduce with
# arrow functions, promises and Promise.all, and the two recursive lines of a
# binary search tree for the boss. Every type here is a contract: tsc checks
# it once and erases it, and the program runs on whatever came down the wire.
# Nothing here is timed, and verify_pack refuses a basic solution that adds
# more than four lines over its starter (two on every node but the container
# drills).
#
# Every program is one main.ts, checked by `tsc -p .` (strict, es2022,
# commonjs, lib es2023) against backend/runner/src/typescript/node.d.ts — the
# whole of Node a quest can see — and run as `node --enable-source-maps
# main.js`. Standard input is read with one idiom everywhere:
#
#     const input: string = require("fs").readFileSync(0, "utf8");
#
# There are no threads: node 26 is one event loop, promises and `await`.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "typescript.basic"
land = "typescript"
category = "basic"
version = 1

