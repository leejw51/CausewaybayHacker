[[quest]]
id          = "typescript.basic.03.types"
node        = 3
title       = "THE SHARED SLOT"
difficulty  = 1
story       = '''Two advertisers split the Times Square slot hour, and the control room's schedule has a line for the whole minutes each gets, the leftover, and a share that should read to two decimals and reads a question mark.'''
concepts    = ["types", "io"]
requires    = ["typescript.basic.02.number"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''TypeScript has one `number` type, a 64-bit float, so `/` always keeps the
fraction: `7 / 2` is `3.5`. Integer division is `Math.floor(a / b)`, and `%`
is the remainder. To print a number with a fixed count of decimals, call
`.toFixed(2)` on it: it gives back a **string** with exactly two digits after
the point. (Where Python writes an f-string, TypeScript writes a template
literal, `` `${x}` ``, and puts the `.toFixed` call inside the braces.)

```
console.log(Math.floor(a / b));
console.log(a % b);
console.log((a / b).toFixed(2));
```

`a` and `b` are read and the first two prints are written. Type the third
`console.log` line exactly as shown.

```
input:  7 2
output: 3
        1
        3.50
```
'''
starter     = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const [a, b] = input.trim().split(/\s+/).map(Number);
  console.log(Math.floor(a / b));
  console.log(a % b);
  console.log("?"); // FILL: a / b with two decimals
  // ANSWER: console.log((a / b).toFixed(2));
}

main();
'''
solution    = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const [a, b] = input.trim().split(/\s+/).map(Number);
  console.log(Math.floor(a / b));
  console.log(a % b);
  console.log((a / b).toFixed(2));
}

main();
'''
hints = [
  "console.log((a / b).toFixed(2)); — the parentheses round a / b come first, then .toFixed(2) on the result.",
  "a / b.toFixed(2) would call toFixed on b alone, and tsc refuses to divide a number by the string it returns.",
]

[quest.tests]
