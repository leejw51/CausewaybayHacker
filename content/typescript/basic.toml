[[quest]]
id          = "typescript.basic.02.number"
node        = 2
title       = "TWELVE TWELVE"
difficulty  = 1
story       = '''The Hysan Place wall is told to show a count, twice the count and its square, and the middle line comes up 1212 in letters three storeys tall.'''
concepts    = ["io", "bindings", "types"]
requires    = ["typescript.basic.01.first-screen"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''Standard input arrives as one **string**, newline and all. A string that
looks like a number is still a string, and `+` on two strings joins them:
`"12" + "12"` is `"1212"`. `Number()` turns the text into a `number`, and
skips the whitespace around it on the way.

The starter tells the compiler that the text is a number with `as unknown as
number`. That is a promise, not a conversion: tsc believes it, erases it, and
at runtime `n` is still the string `"12"`. Replace that line with a real one:

```
const n: number = Number(input);
```

The three `console.log` lines are written.

```
input:  12
output: 12
        24
        144
```
'''
starter     = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = input.trim() as unknown as number; // FILL: read the text as a number
  // ANSWER: const n: number = Number(input);
  console.log(n);
  console.log(n + n);
  console.log(n * n);
}

main();
'''
solution    = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = Number(input);
  console.log(n);
  console.log(n + n);
  console.log(n * n);
}

main();
'''
hints = [
  "The starter prints 1212 on the second line: n + n joined two strings. The type said number; the value never was one.",
  "const n: number = Number(input); converts as you read. Number() ignores the newline at the end for you.",
  "A negative n squared is positive. The test knows.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "twelve", stdin = "12\n", expect = "12\n24\n144\n", visible = true },
  { name = "negative", stdin = "-3\n", expect = "-3\n-6\n9\n", visible = false },
  { name = "zero", stdin = "0\n", expect = "0\n0\n0\n", visible = false },
