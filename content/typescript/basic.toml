larger ones in its right. Inserting is recursive: an empty subtree
(`undefined`) becomes a new `TreeNode`; otherwise the value goes down one
side, and whatever comes back is stored as that child again, because the
child may have been `undefined` a moment ago. Following `.left` on an
`undefined` is the crash this whole road is named after. The type
`TreeNode | undefined` is the contract that says a child may be missing,
and strict tsc will not let `n.val` be read until the `undefined` check has
been passed — that check comes first, and it is written.

```
if (v < n.val) {
  n.left = insert(n.left, v);
} else {
  n.right = insert(n.right, v);
}
```

`TreeNode`, `insert`'s `undefined` case and its `if (v < n.val)` / `else`
skeleton, `inorder`, `height` and `main` are written. Type the two
recursive lines exactly as shown, in place of the two `// FILL`
placeholders.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
