  val: number;
  left: TreeNode | undefined = undefined;
  right: TreeNode | undefined = undefined;

  constructor(val: number) {
    this.val = val;
  }
}

function insert(n: TreeNode | undefined, v: number): TreeNode {
  if (n === undefined) {
    return new TreeNode(v);
  }
  if (v < n.val) {
