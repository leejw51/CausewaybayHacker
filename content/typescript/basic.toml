[[quest]]
id          = "typescript.basic.04.int-types"
node        = 4
title       = "FOUR BYTES WIDE"
difficulty  = 1
story       = '''The LED controller behind the Hysan Place wall keeps each tile's level in four bytes and prints the biggest number it can hold on its status line, and the status line is empty.'''
concepts    = ["types", "bindings"]
requires    = ["typescript.basic.03.types"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''A `number` has no integer width, but the bitwise operators do: every one of
them works on **32 bits**. `n >>> 0` reinterprets `n` as an unsigned 32-bit
integer, so `-1 >>> 0` is `4294967295`, and `.toString(16).padStart(8, "0")`
shows its four bytes as eight hex digits. The same 32 bits are the trap in
`(1 << 31) - 1`: `1 << 31` is already negative, so write the largest signed
32-bit integer as `2 ** 31 - 1`. The bitwise operators stop at 32 bits;
exact counting stops at `2 ** 53`, and past that a `bigint` (`1n`, `64n`)
takes over.

```
console.log((n >>> 0).toString(16).padStart(8, "0"));
console.log(2 ** 31 - 1);
```

`n` is read and the unsigned 64-bit maximum is printed last, as a bigint.
Type the two lines above in place of the two `// FILL` markers.

```
input:  7
output: 00000007
        2147483647
        18446744073709551615
```
'''
starter     = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = Number(input);
  // FILL: print n as four bytes (unsigned 32-bit), in hex
  // ANSWER: console.log((n >>> 0).toString(16).padStart(8, "0"));
  // FILL: print the largest signed 32-bit integer
  // ANSWER: console.log(2 ** 31 - 1);
  console.log(((1n << 64n) - 1n).toString());
}

main();
'''
solution    = '''function main(): void {
  const input: string = require("fs").readFileSync(0, "utf8");
  const n: number = Number(input);
  console.log((n >>> 0).toString(16).padStart(8, "0"));
  console.log(2 ** 31 - 1);
  console.log(((1n << 64n) - 1n).toString());
}

main();
'''
hints = [
  'console.log((n >>> 0).toString(16).padStart(8, "0")); — >>> 0 makes it unsigned 32-bit, toString(16) is hex, padStart fills the left with zeros.',
  "(1 << 31) - 1 prints -2147483649: the shift is 32-bit and signed. 2 ** 31 - 1 is plain arithmetic and prints 2147483647.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "seven", stdin = "7\n", expect = "00000007\n2147483647\n18446744073709551615\n", visible = true },
  { name = "minus-one", stdin = "-1\n", expect = "ffffffff\n2147483647\n18446744073709551615\n", visible = false },
  { name = "million", stdin = "1000000\n", expect = "000f4240\n2147483647\n18446744073709551615\n", visible = false },
]
