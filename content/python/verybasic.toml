[[quest]]
id          = "python.verybasic.09.struct-method"
node        = 9
title       = "THE LINE TOTAL"
difficulty  = 1
story       = "Price times quantity is one line of every order at the noodle stall, and the method that should say it says nothing."
concepts    = ["structs", "functions"]
requires    = ["python.verybasic.08.structs"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''
`Stall.total(self)` must return price times quantity. Inside a method, the object's fields are reached through `self`.

Pick the line that does it, then type it where the `# FILL` comment is.

```
input:  tofu 12 3
output: tofu: 36
```
'''
starter     = '''
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        pass  # FILL: price times quantity


name, price, qty = input().split()
s = Stall(name, int(price), int(qty))
print(f"{s.name}: {s.total()}")
'''
solution    = '''
class Stall:
    def __init__(self, name, price, qty):
        self.name = name
        self.price = price
        self.qty = qty

    def total(self):
        return self.price * self.qty


name, price, qty = input().split()
s = Stall(name, int(price), int(qty))
print(f"{s.name}: {s.total()}")
'''
hints = [
  "return self.price * self.qty — both fields through self.",
  "price on its own is not defined inside the method.",
]

[quest.quiz]
choices = ["return price * qty", "return self.price * self.qty", "return self.price + self.qty", "return self.price * qty"]
answer  = 1

