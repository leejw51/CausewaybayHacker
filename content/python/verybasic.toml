# PYTHON LAND — VERY BASIC. The grammar as a question first: four lines, one
# of them right, and then that line typed. Types, containers, a stack, a
# queue, a heap, a struct, a thread, a mutex — the constructs a HackerRank-
# style live coding test leans on, one per node, at Bowrington Road wet
# market from the 06:00 shutters to the price board. Every quest carries a
# [quest.quiz]: the choices are code and never translated; the question is
# the brief. verify_pack swaps each wrong choice into the solution and
# refuses the quest if it passes, so the quiz has one right answer.
#
# Every program is one main.py, run as `python3 -I main.py`, stdlib only.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "python.verybasic"
land = "python"
category = "verybasic"
version = 1

