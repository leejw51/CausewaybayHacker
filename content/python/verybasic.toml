solution    = '''
class Node:
    def __init__(self, val):
        self.val = val
        self.left = None
        self.right = None


def insert(n, v):
    if n is None:
        return Node(v)
    if v < n.val:
        n.left = insert(n.left, v)
    else:
        n.right = insert(n.right, v)
    return n


def inorder(n, out):
    if n is None:
        return
    inorder(n.left, out)
    out.append(n.val)
    inorder(n.right, out)


def height(n):
    if n is None:
        return 0
    return 1 + max(height(n.left), height(n.right))


root = None
for tok in input().split():
    root = insert(root, int(tok))
out = []
inorder(root, out)
print(*out)
print(height(root))
'''
