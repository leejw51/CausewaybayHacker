solution     = '''
import sys

MASK = (1 << 64) - 1
P = 1000000007


def main():
    rows, cols, pct, seed = (int(t) for t in sys.stdin.read().split())

    x = seed

    def nxt():
        nonlocal x
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        return x >> 33

    open_cell = [[True] * cols for _ in range(rows)]
    cost = [[0] * cols for _ in range(rows)]
    for i in range(rows):
        for j in range(cols):
            a = nxt()
            b = nxt()
            corner = (i == 0 and j == 0) or (i == rows - 1 and j == cols - 1)
            if not corner and a % 100 < pct:
                open_cell[i][j] = False
            cost[i][j] = b % 9 + 1

    # None means unreachable; a cell with no open neighbour above or left
    # stays that way
    ways = [[0] * cols for _ in range(rows)]
    best = [[None] * cols for _ in range(rows)]

    for i in range(rows):
        for j in range(cols):
            if not open_cell[i][j]:
                continue
            if i == 0 and j == 0:
                ways[0][0] = 1
                best[0][0] = cost[0][0]
                continue
            routes = 0
            cheapest = None
            if i > 0 and best[i - 1][j] is not None:
                routes += ways[i - 1][j]
                cheapest = best[i - 1][j]
            if j > 0 and best[i][j - 1] is not None:
                routes += ways[i][j - 1]
                if cheapest is None or best[i][j - 1] < cheapest:
                    cheapest = best[i][j - 1]
            ways[i][j] = routes % P
            best[i][j] = None if cheapest is None else cheapest + cost[i][j]

    print(f"PATHS {ways[rows - 1][cols - 1]}")
    final = best[rows - 1][cols - 1]
    print(f"MIN {-1 if final is None else final}")


main()
'''
