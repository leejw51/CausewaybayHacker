solution     = '''
import sys
from bisect import bisect_left


def main():
    nums = [int(t) for t in sys.stdin.read().split()[1:]]

    # tails[i] = the smallest value an increasing subsequence of length i+1
    # can end on. It is sorted, always.
    tails = []
    for value in nums:
        at = bisect_left(tails, value)
        if at == len(tails):
            tails.append(value)
        else:
            tails[at] = value

    print(len(tails))
    print(f"TAILS {len(tails)}")


main()
'''
