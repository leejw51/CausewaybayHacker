solution     = '''
import heapq
import sys


def main():
    values = iter(int(t) for t in sys.stdin.read().split())
    k = next(values)

    lists = []
    for _ in range(k):
        count = next(values)
        lists.append([next(values) for _ in range(count)])

    # (value, which list, how far into it)
    heap = []
    for which, items in enumerate(lists):
        if items:
            heap.append((items[0], which, 0))
    heapq.heapify(heap)

    out = []
    while heap:
        value, which, at = heapq.heappop(heap)
        out.append(str(value))
        if at + 1 < len(lists[which]):
            heapq.heappush(heap, (lists[which][at + 1], which, at + 1))

    print(" ".join(out))
    print(f"POPS {len(out)}")


main()
'''
