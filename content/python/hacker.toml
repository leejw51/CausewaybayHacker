solution     = '''
import sys


def search(grid, r, c, word, at):
    if grid[r][c] != word[at]:
        return False
    if at + 1 == len(word):
        return True

    here = grid[r][c]
    grid[r][c] = "#"

    # `or` short-circuits, so the first direction that spells the rest of the
    # word stops the other three from being tried at all
    found = (
        (r > 0 and search(grid, r - 1, c, word, at + 1))
        or (r + 1 < len(grid) and search(grid, r + 1, c, word, at + 1))
        or (c > 0 and search(grid, r, c - 1, word, at + 1))
        or (c + 1 < len(grid[r]) and search(grid, r, c + 1, word, at + 1))
    )

    grid[r][c] = here
    return found


def main():
    data = sys.stdin.read().split()
    rows, cols = int(data[0]), int(data[1])
    grid = [list(line) for line in data[2:2 + rows]]
    word = data[2 + rows]

    # count the starting letters before any cell is marked
    starts = sum(row.count(word[0]) for row in grid)

    # stop at the first cell the word spells out from; `any` short-circuits
    found = any(
        search(grid, r, c, word, 0) for r in range(rows) for c in range(cols)
    )

    print("FOUND" if found else "ABSENT")
    print(f"STARTS {starts}")


main()
'''
