# PYTHON LAND — HACKER. The fourth interview. HKU, Chow Yei Ching Building,
# Room 7-32 again, a clock on the wall, and this time the language has no
# compiler to catch anything and a recursion limit of one thousand.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
# See docs/decisions.md, 2026-09-11, for where that key lives in the TOML.
#
# The 34 problems mirror content/rust/hacker.toml node for node, with the same
# stdin and expected output wherever the problem is the same problem, so a
# player can sit the same interview in any land. The ids mirror too — the LRU
# boss is `python.hacker.28.lru` at node 34, exactly as it is in Rust and Go —
# because SPEC §12 makes the id an identity and `node` the position.
#
# Two hidden cases are smaller than their Rust counterparts, because a correct
# Python answer would not clear the Rust size inside any honest run limit:
# range-queries runs 300000 operations instead of four million, and the
# one-letter palindrome case is 8000 characters instead of 20000. Both were
# re-checked against the Rust reference on the new input. Every other big case
# is byte-identical, and the quests that carry one run with `timeout_ms =
# 10000`, measured well inside it on this machine.
#
# One exception, and it is the one thing here that is not yet mirrored: node 16,
# `python.hacker.16.union-find`, was converted in this land to build its links
# from the pack generator instead of reading them, so its stdin is now
# `n m seed` — `8 5 1`, `1 2 7`, `12 9 99`, `200000 200000 12345` — with the
# links drawn `a = next() % n`, `b = next() % n`, exactly as node 28's
# `29.dijkstra` already draws its non-tree edges, and a self-link counted as
# redundant. The other three lands have to make the same change with the same
# four `m` values before the "same stdin, same expected output" promise above
# holds again for that node. Everything else in this file is unmoved.
#
# Every program is one main.py, run as `python3 -I main.py`, stdlib only, and
# nothing in it needs anything newer than Python 3.10.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

