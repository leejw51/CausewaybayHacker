solution     = '''
import sys
from fractions import Fraction


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n, cap = data[0], data[1]
    items = [(data[2 + 2 * i], data[3 + 2 * i]) for i in range(n)]

    best = [0] * (cap + 1)
    for weight, value in items:
        # downwards, so this item cannot be picked up twice in one pass
        for room in range(cap, weight - 1, -1):
            candidate = best[room - weight] + value
            if candidate > best[room]:
                best[room] = candidate

    # best ratio first, lighter first on a tie; the Fraction keeps it exact
    order = sorted(items, key=lambda item: (-Fraction(item[1], item[0]), item[0]))
    room = cap
    greedy = 0
    for weight, value in order:
