Standard input is `n q seed`. Build an array of `n` values and then run `q`
operations, all from the same generator, in 64-bit arithmetic that wraps
(mask it by hand):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

Print the running total of every query answer, then `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**The complexity here is enforced.** The naive answer — `sum(values[l:r+1])`
for every query — is `O(n)` per query, and the slice and the sum both run in
C, which makes it deceptively quick on anything small. So the big hidden case
is `n = 500000, q = 300000`, where the naive answer touches on the order of
`2 × 10^10` elements and took **over three minutes** on this machine, against
a ten second run limit. A Fenwick tree does the whole thing in under a
second. Both measured, with the two programs in this quest.

(The Rust and Go versions of this quest run four million operations. Python
runs three hundred thousand, because a correct Fenwick tree in Python would
not clear four million inside any honest limit either — and the point is to
separate the right structure from the wrong one, not Python from C.)

The lesson is the one an interviewer is fishing for: *point update, range sum*
is the exact shape a Fenwick tree exists for. Three short functions — add,
prefix, and range as the difference of two prefixes — and `i & -i` is how you
step by the lowest set bit, which works on a Python int exactly as it does
on a two's-complement one.
'''
starter      = '''
import sys

MASK = (1 << 64) - 1


def main():
    n, q, seed = (int(t) for t in sys.stdin.read().split())

    x = seed

    def nxt():
        nonlocal x
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        return x >> 33

    values = [nxt() % 1000 for _ in range(n)]

    total = 0
    updates = 0
    for _ in range(q):
        a, b, c = nxt(), nxt(), nxt()
        if a % 2 == 0:
            values[b % n] += c % 1000 + 1
            updates += 1
        else:
            l, r = b % n, c % n
            if l > r:
                l, r = r, l
            # correct, and far too slow at three hundred thousand operations
            total += sum(values[l:r + 1])

    print(total)
    print(f"UPDATES {updates}")


