    for i in range(n):
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        riders.append(((x >> 33) % buckets, i))

    # sorted is stable and reverse=True keeps it so: equal scores stay in
    # arrival order. The equally correct alternative is
    #     sorted(riders, key=lambda r: (-r[0], r[1]))
    # which makes the comparison total and so needs no stability at all.
    riders = sorted(riders, key=lambda r: r[0], reverse=True)

    print(" ".join(str(r[1]) for r in riders))
    ties = sum(1 for a, b in zip(riders, riders[1:]) if a[0] == b[0])
    print(f"TIES {ties}")


