id           = "python.hacker.28.lru"
node         = 34
title        = "THE RECURSION LIMIT"
difficulty   = 5
time_limit_s = 1800
story        = "Room 7-32, last question, fourth time. The interviewer turns the monitor off, and the language on the whiteboard is the one that stops at a thousand frames."
