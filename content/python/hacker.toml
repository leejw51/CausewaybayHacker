solution     = '''
import statistics
import sys


def main():
    values = sorted(int(t) for t in sys.stdin.read().split()[1:])

    mean = sum(values) / len(values)
    deviation = statistics.pstdev(values)

    middle = len(values) // 2
    if len(values) % 2 == 1:
        median = float(values[middle])
    else:
        median = (values[middle - 1] + values[middle]) / 2

    print(f"{mean:.6f}")
    print(f"{deviation:.6f}")
    print(f"{median:.6f}")


main()
'''
