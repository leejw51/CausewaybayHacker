solution     = '''
import sys


class Node:
    __slots__ = ("value", "next")

    def __init__(self, value, next=None):
        self.value = value
        self.next = next


def main():
    values = [int(t) for t in sys.stdin.read().split()[1:]]

    # build it back to front, so each new node points at what we had
    head = None
    for value in reversed(values):
        head = Node(value, head)

    # walk it to count, and run a second pointer at half speed for the middle
    length = 0
    slow = fast = head
    while fast is not None:
        length += 1
        fast = fast.next
        if fast is not None:
            length += 1
            fast = fast.next
            slow = slow.next
    middle = slow.value if slow is not None else 0

    # reverse by moving nodes off the front of one list onto the front of another
    reversed_head = None
    cursor = head
    while cursor is not None:
        following = cursor.next
        cursor.next = reversed_head
        reversed_head = cursor
        cursor = following

    out = []
    walk = reversed_head
    while walk is not None:
        out.append(str(walk.value))
        walk = walk.next

    print(" ".join(out))
    print(middle)
    print(f"LEN {length}")


main()
'''
