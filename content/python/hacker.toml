solution     = '''
import sys


def present(tree, i):
    return i < len(tree) and tree[i] != -1


def valid(tree, i, low, high):
    if not present(tree, i):
        return True
    value = tree[i]
    if low is not None and value <= low:
        return False
    if high is not None and value >= high:
        return False
    return valid(tree, 2 * i + 1, low, value) and valid(tree, 2 * i + 2, value, high)


def find(tree, target):
    i = 0
    depth = 1
    while present(tree, i):
        if tree[i] == target:
            return depth
        i = 2 * i + 1 if target < tree[i] else 2 * i + 2
        depth += 1
    return None


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n, q = data[0], data[1]
    tree = data[2:2 + n]
    queries = data[2 + n:2 + n + q]

    print("VALID" if valid(tree, 0, None, None) else "INVALID")
    for target in queries:
        depth = find(tree, target)
        if depth is None:
            print(f"{target} ABSENT")
        else:
            print(f"{target} FOUND {depth}")


main()
'''
