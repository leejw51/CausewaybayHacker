solution     = '''
import sys


def main():
    nums = [int(t) for t in sys.stdin.read().split()[1:]]

    alone = 0
    for value in nums:
        alone ^= value

    bits = 0
    walk = alone
    while walk:
        walk &= walk - 1
        bits += 1

    power_of_two = alone != 0 and alone & (alone - 1) == 0
    cleared = 0 if alone == 0 else alone & (alone - 1)

    print(alone)
    print(bits)
    print("POW2 YES" if power_of_two else "POW2 NO")
    print(cleared)


main()
'''
