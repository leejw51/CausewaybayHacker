'''
solution     = '''
import sys
from collections import deque


def main():
    data = sys.stdin.read().split()
    rows, cols = int(data[0]), int(data[1])
    grid = data[2:2 + rows]

    dist = [[-1] * cols for _ in range(rows)]
    queue = deque()
    reached = 0

    if grid[0][0] == ".":
        dist[0][0] = 0
        queue.append((0, 0))
        reached = 1

    steps = ((-1, 0), (1, 0), (0, -1), (0, 1))
    while queue:
        r, c = queue.popleft()
        nxt = dist[r][c] + 1
        for dr, dc in steps:
            nr, nc = r + dr, c + dc
            # a negative index is not out of range in Python: grid[-1] is the
            # last row, silently, so the bounds check has to be explicit
            if nr < 0 or nr >= rows or nc < 0 or nc >= cols:
                continue
            if grid[nr][nc] != "." or dist[nr][nc] >= 0:
                continue
            dist[nr][nc] = nxt
            reached += 1
            queue.append((nr, nc))

    print(dist[rows - 1][cols - 1])
    print(f"REACHED {reached}")


main()
'''
hints = [
  "deque.popleft() is the whole difference between BFS and DFS here; a list used as a stack would be the other one.",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
  "grid[r - 1] when r is 0 does not raise. It reads the last row, and the search leaks out through the bottom of the map. Check nr < 0 by hand — this is the one bounds error Python will not report for you.",
]

