solution     = '''
import sys

MASK = (1 << 64) - 1
P = 1000000007


def inverse(v):
    # P is prime, so Fermat gives v^(P-2) as the inverse of v; pow does the
    # repeated squaring in C
    return pow(v, P - 2, P)


def main():
    n, q, seed = (int(t) for t in sys.stdin.read().split())

    # one shared factorial table for every query
    factorial = [1] * (n + 1)
    for i in range(1, n + 1):
        factorial[i] = factorial[i - 1] * i % P

    x = seed

    def nxt():
        nonlocal x
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        return x >> 33

    total = 0
    last = 0
    for _ in range(q):
        a = nxt() % (n + 1)
        b = nxt() % (a + 1)

        value = factorial[a] * inverse(factorial[b]) % P * inverse(factorial[a - b]) % P

        total = (total + value) % P
        last = value

    print(total)
    print(f"LAST {last}")


main()
'''
