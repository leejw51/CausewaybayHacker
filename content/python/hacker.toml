solution     = '''
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n, target = data[0], data[1]
    nums = data[2:2 + n]

    seen = {}
    for j, x in enumerate(nums):
        i = seen.get(target - x)
        if i is not None:
            print(f"{i + 1} {j + 1}")
            return
        seen.setdefault(x, j)
    print(-1)


main()
'''
