brief        = '''
Line one is `cap q`, and then either `q` lines of operations, each
`PUT <key> <value>` or `GET <key>` — or, when line one carries a **third**
number `seed`, no further lines at all, and the `q` operations come from the
generator below.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key. A `PUT` of a
key the cache already holds replaces its value and makes it the most recent —
it adds no entry, so it evicts nothing however full the cache is.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The generated form, in 64-bit arithmetic that wraps (mask it by hand):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**The starter is correct.** Run it on the sample and on every case you can
type, and it is right every time. It processes the operations the way a
functional language would — handle the first one, recurse on the rest — and
Python is not a functional language. It has no tail-call elimination, every
call is a real frame, and `sys.getrecursionlimit()` is `1000`. The hidden
generated case has two thousand operations, and the starter dies on it with

```
RecursionError: maximum recursion depth exceeded
```

That is the boss. `sys.setrecursionlimit(10000)` makes it go away, and it is
the wrong answer: the limit is there because the C stack under the
interpreter is finite, and raising it high enough turns a clean exception
into a segmentation fault. The recursion was never the shape of this problem.
The operations are a sequence; a sequence is a `for` loop. (And `ops[1:]` on
every call copies the rest of the list, so the recursive version was also
quadratic, which nobody noticed because it never got far enough for that to
matter.)

Then the cache itself. The textbook answer is a hash map into a doubly linked
list, and Python has one in the standard library with the pointers hidden:
`collections.OrderedDict`. `move_to_end(key)` is the "touch" and
`popitem(last=False)` is the eviction from the cold end, both `O(1)`, so
every operation here is `O(1)` and you can say so without hedging. (A plain
`dict` is insertion-ordered since 3.7 and lacks only `move_to_end`; deleting
and re-inserting the key is the same trick spelled by hand.) The starter's
cache is a dict of `(value, stamp)` pairs with a scan for the oldest stamp on
eviction, which is `O(cap)` — correct, and the second thing to fix.
'''
starter      = '''
import sys

MASK = (1 << 64) - 1


def read_operations(header, lines):
    cap, q = int(header[0]), int(header[1])
    ops = []
    if len(header) == 3:
        x = int(header[2])

        def nxt():
            nonlocal x
            x = (x * 6364136223846793005 + 1442695040888963407) & MASK
            return x >> 33

        for _ in range(q):
            a = nxt()
            key = nxt() % (2 * cap)
            if a % 4 == 0:
                ops.append(("GET", key, None))
            else:
                ops.append(("PUT", key, nxt() % 100))
    else:
        for line in lines[:q]:
            parts = line.split()
            value = int(parts[2]) if len(parts) > 2 else None
            ops.append((parts[0], int(parts[1]), value))
    return cap, ops


def run(ops, cache, cap, clock, evicted, out):
    # head, then recurse on the tail: the functional habit, one frame per op
    if not ops:
        return evicted
    op, key, value = ops[0]
    clock += 1

    if op == "GET":
        entry = cache.get(key)
        if entry is None:
            out.append("-1")
        else:
            cache[key] = (entry[0], clock)
            out.append(str(entry[0]))
    else:
        if key not in cache and len(cache) == cap:
            oldest = min(cache, key=lambda k: cache[k][1])
            del cache[oldest]
            evicted += 1
        cache[key] = (value, clock)

    return run(ops[1:], cache, cap, clock, evicted, out)


def main():
    lines = sys.stdin.read().split("\n")
    cap, ops = read_operations(lines[0].split(), lines[1:])

    cache = {}
    out = []
    evicted = run(ops, cache, cap, 0, 0, out)

    alive = sorted(cache.items(), key=lambda item: -item[1][1])
    for line in out:
