solution     = '''
import sys


def present(tree, i):
    return i < len(tree) and tree[i] != -1


def walk(tree, i, order, out):
    if not present(tree, i):
        return
    if order == 0:
        out.append(tree[i])
    walk(tree, 2 * i + 1, order, out)
    if order == 1:
        out.append(tree[i])
    walk(tree, 2 * i + 2, order, out)
    if order == 2:
        out.append(tree[i])


def depth(tree, i):
    if not present(tree, i):
        return 0
    return 1 + max(depth(tree, 2 * i + 1), depth(tree, 2 * i + 2))


def main():
    tree = [int(t) for t in sys.stdin.read().split()[1:]]

    for order in range(3):
        out = []
        walk(tree, 0, order, out)
        print(" ".join(str(v) for v in out))
    print(f"DEPTH {depth(tree, 0)}")


main()
'''
