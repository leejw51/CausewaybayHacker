  "A link whose two ends already have the same root is the redundant one — count it and move on. A self-link, a == b, falls out of that test on its own.",
  "Only a root's size entry is meaningful, so read the largest off the roots, not off every index. max(..., default=0) covers n = 0 without a special case.",
  "parent[x], x = root, parent[x] compresses in one line: the right-hand side is evaluated in full before either assignment happens, so the old parent[x] is read before it is overwritten.",
]

