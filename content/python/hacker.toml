solution     = '''
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n = data[0]
    nums = data[1:1 + n]

    answer = [-1] * n
    pending = []

    for i, value in enumerate(nums):
        while pending and nums[pending[-1]] < value:
            answer[pending.pop()] = value
        pending.append(i)

    print(" ".join(str(v) for v in answer))
    print(f"NONE {answer.count(-1)}")


main()
'''
hints = [
  "The stack holds indices that are still waiting for their answer, not values.",
  "When the new value beats the value at the top of the stack, that index's answer is the new value — and keep popping, it may beat several.",
  "Strictly greater, so equal values do not resolve each other; they stack up and resolve together later.",
]

