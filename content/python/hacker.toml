solution     = '''
import sys


def build(nums, at, chosen, out):
    if at == len(nums):
        out.append(" ".join(str(v) for v in chosen) if chosen else "-")
        return

    chosen.append(nums[at])
    build(nums, at + 1, chosen, out)
    chosen.pop()

    build(nums, at + 1, chosen, out)


def main():
    nums = [int(t) for t in sys.stdin.read().split()[1:]]

    out = []
    build(nums, 0, [], out)

    for line in out:
        print(line)
    print(f"SUBSETS {len(out)}")


main()
