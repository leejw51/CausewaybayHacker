solution     = '''
import sys

MASK = (1 << 64) - 1


def generate(n, seed):
    x = seed
    values = []
    for _ in range(n):
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        values.append((x >> 33) % 1000000007)
    return values


def sort_count(values):
    """Merge sort, returning the sorted list and how many inversions it removed."""
    if len(values) < 2:
        return values, 0
    mid = len(values) // 2
    left, a = sort_count(values[:mid])
    right, b = sort_count(values[mid:])

    merged = []
    inversions = a + b
    i = j = 0
    while i < len(left) and j < len(right):
        if left[i] <= right[j]:
            merged.append(left[i])
            i += 1
        else:
            # left[i:] are all greater than right[j]
            inversions += len(left) - i
            merged.append(right[j])
            j += 1
    merged.extend(left[i:])
    merged.extend(right[j:])
    return merged, inversions


def main():
    n, seed = (int(t) for t in sys.stdin.read().split())

    values = generate(n, seed)
    largest = max(values) if values else 0

    _, inversions = sort_count(values)

    print(inversions)
    print(f"MAX {largest}")


main()
'''
