solution     = '''
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n = data[0]
    original = [data[1 + r * n:1 + (r + 1) * n] for r in range(n)]

    grid = [row[:] for row in original]
    for r in range(n):
        for c in range(r + 1, n):
            grid[r][c], grid[c][r] = grid[c][r], grid[r][c]
    for row in grid:
        row.reverse()
    for row in grid:
        print(" ".join(str(v) for v in row))

    spiral = []
    top, bottom, left, right = 0, n - 1, 0, n - 1
    while top <= bottom and left <= right:
        for c in range(left, right + 1):
            spiral.append(original[top][c])
        top += 1
        for r in range(top, bottom + 1):
            spiral.append(original[r][right])
        right -= 1
        if top <= bottom:
            for c in range(right, left - 1, -1):
                spiral.append(original[bottom][c])
            bottom -= 1
        if left <= right:
            for r in range(bottom, top - 1, -1):
                spiral.append(original[r][left])
            left += 1
    print(" ".join(str(v) for v in spiral))


main()
'''
