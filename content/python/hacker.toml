solution     = '''
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n = data[0]
    spans = [(data[1 + 2 * i], data[2 + 2 * i]) for i in range(n)]
    spans.sort()

    merged = []
    for start, end in spans:
        if merged and start <= merged[-1][1]:
            if end > merged[-1][1]:
                merged[-1][1] = end
        else:
            merged.append([start, end])

    for start, end in merged:
        print(f"{start} {end}")
    print(f"COUNT {len(merged)}")


main()
'''
