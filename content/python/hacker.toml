```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Checking `left < node < right` at each node **is not enough** — a value deep
in the left subtree can still be larger than an ancestor. Carry the open
interval down instead. Python has no `i64::MIN`; the bounds start as
`None`, meaning "no bound yet", and `None` needs its own check because
`x <= None` is a `TypeError`.

A query is answered by the **descent**: compare with the node, go left when
you are smaller and right otherwise, and report `ABSENT` when you fall off
the tree. That matters because the tree is not promised to be a BST, and in
one that is not, a value can sit in the array somewhere the descent never
looks. It is `ABSENT` — you are being asked what the lookup does, not what a
scan of the array would find.
