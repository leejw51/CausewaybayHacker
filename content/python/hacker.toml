import sys


def main():
    tokens = iter(sys.stdin.read().split())
    commands = int(next(tokens))

    items = []

    for _ in range(commands):
        command = next(tokens, "")
        if command == "ADD":
            # the argument is a second token of the same command
            items.append(int(next(tokens, "0")))
        elif command == "VOID":
            if items:
                items.pop()
        elif command == "TOTAL":
            print(sum(items))
        elif command == "CLEAR":
            items.clear()

    print(f"COMMANDS {commands}")
    print(f"ITEMS {len(items)}")


main()
