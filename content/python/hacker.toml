solution     = '''
import sys


class Node:
    __slots__ = ("children", "through", "terminal")

    def __init__(self):
        self.children = {}
        self.through = 0
        self.terminal = False


def main():
    lines = sys.stdin.read().split("\n")
    n, q = (int(t) for t in lines[0].split())

    root = Node()
    nodes = 1

    for i in range(n):
        word = lines[1 + i].strip()
        at = root
        for letter in word:
            child = at.children.get(letter)
            if child is None:
                child = Node()
                at.children[letter] = child
                nodes += 1
            child.through += 1
            at = child
        at.terminal = True

    for i in range(q):
        parts = lines[1 + n + i].split()
        kind = parts[0]
        text = parts[1] if len(parts) > 1 else ""

        at = root
        for letter in text:
            at = at.children.get(letter)
            if at is None:
                break

        if kind == "WORD":
            print("YES" if at is not None and at.terminal else "NO")
        else:
            print(at.through if at is not None else 0)

    print(f"NODES {nodes}")


main()
'''
