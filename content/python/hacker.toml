brief        = '''
Standard input is `n m seed`: `n` stops numbered `0..n-1`, `m` undirected
links. There are no links in the input — you build them, with **exactly** this
generator, in 64-bit arithmetic that wraps (mask it by hand — Python's ints
will not):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

Print three lines: how many separate networks there are, the size of the
largest, and `REDUNDANT <k>` — how many of the links joined two stops that
were already connected. A link from a stop to itself is one of those.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

For `8 5 1` the five links are `6—1`, `4—6`, `2—3`, `2—6`, `1—2`. The last one
joins two stops already in the same network, so it is the redundant one, and
what is left is `{1,2,3,4,6}` plus stops `0`, `5` and `7` on their own.

**The complexity here is enforced.** One hidden case is `n = 200000` with
`m = 200000` links. The obvious answer that is not union-find — walk the
network out from `a` and see whether `b` is already in it, once per link — is
correct, and it is `O(n)` per link and so `O(n·m)` in total: on this machine
it had not finished after **two minutes**, against a ten second run limit.
That is what the starter is. Union-find with path compression and union by
size does the same 200000 links in **0.24 seconds**, measured here with the
solution that ships in this quest.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer on
the sample and on both of the small hidden cases. It is rejected only for
arriving far too late.

Union-find: every stop points at a parent, `find` walks to the root, `union`
points one root at the other. Compress the path on the way back out of `find`
and the whole thing is effectively constant time per query.

Write `find` as a loop. The recursive one is the textbook version and it is
a `RecursionError` on a chain a thousand long — which is exactly the shape
union-by-size exists to prevent, and exactly the shape a hostile input has
before the first `find` ever compresses it.
'''
starter      = '''
import sys
from collections import deque

MASK = (1 << 64) - 1


def main():
    n, m, seed = (int(t) for t in sys.stdin.read().split())

    x = seed
    links = [[] for _ in range(n)]
    redundant = 0

    for _ in range(m):
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        a = (x >> 33) % n
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        b = (x >> 33) % n

        # correct, and far too slow: walk the whole network out from a to see
        # whether b is already in it. This is what the big hidden case rejects.
        seen = [False] * n
        seen[a] = True
        queue = deque([a])
        found = a == b
        while queue and not found:
            at = queue.popleft()
            for nxt in links[at]:
                if not seen[nxt]:
                    if nxt == b:
                        found = True
                        break
                    seen[nxt] = True
                    queue.append(nxt)
        if found:
            redundant += 1
        links[a].append(b)
        links[b].append(a)

    groups = 0
    largest = 0
    seen = [False] * n
    for start in range(n):
        if seen[start]:
            continue
        groups += 1
        seen[start] = True
        queue = deque([start])
        count = 0
        while queue:
            at = queue.popleft()
            count += 1
            for nxt in links[at]:
                if not seen[nxt]:
                    seen[nxt] = True
                    queue.append(nxt)
        if count > largest:
            largest = count

    print(groups)
    print(largest)
    print(f"REDUNDANT {redundant}")


main()
'''
solution     = '''
import sys

MASK = (1 << 64) - 1


def find(parent, x):
    root = x
    while parent[root] != root:
        root = parent[root]
    # path compression: point everything we walked over straight at the root
    while parent[x] != root:
        parent[x], x = root, parent[x]
    return root


def main():
    n, m, seed = (int(t) for t in sys.stdin.read().split())

    x = seed
    parent = list(range(n))
    size = [1] * n
    groups = n
    redundant = 0

    for _ in range(m):
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        a = (x >> 33) % n
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        b = (x >> 33) % n

        a = find(parent, a)
        b = find(parent, b)
        if a == b:
            redundant += 1
            continue
        # hang the smaller tree under the bigger one
        if size[a] < size[b]:
            a, b = b, a
        parent[b] = a
        size[a] += size[b]
        groups -= 1

    largest = max((size[x] for x in range(n) if parent[x] == x), default=0)

    print(groups)
    print(largest)
    print(f"REDUNDANT {redundant}")


main()
'''
