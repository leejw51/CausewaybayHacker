'''
solution     = '''
import sys


def main():
    text = sys.stdin.read().strip()

    last = {}
    start = 0
    best_len = 0
    best_start = 0

    for i, c in enumerate(text):
        previous = last.get(c)
        if previous is not None and previous >= start:
            start = previous + 1
        last[c] = i
        length = i - start + 1
        if length > best_len:
            best_len = length
            best_start = start

    print(best_len)
    print(text[best_start:best_start + best_len])


main()
'''
