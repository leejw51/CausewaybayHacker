Standard input is `n m seed`: `n` stops, `m` undirected weighted edges. Build
the graph yourself, with **exactly** this generator, in 64-bit arithmetic that
wraps (mask it by hand — Python's ints will not):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Print the sum of the shortest distances from stop `0` to every reachable stop
(including `0` itself, which is `0`), then `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**The complexity here is enforced.** One hidden case is `n = 100000`,
`m = 200000`. Dijkstra is the right algorithm either way; what the clock
decides is the priority queue. Scanning every unvisited node for the minimum
is `O(V²)` — `10^10` steps, and in Python that is not sixteen seconds, it is
the rest of the afternoon — against a ten second run limit. A `heapq` makes
it `O((V + E) log V)` and it finishes in about a third of a second. Both
measured on this machine, with the two programs that ship in this quest: the
starter is the scanning version.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer. It
is rejected only for arriving far too late.

`heapq` is a min-heap, so push `(distance, node)` and the tuple order does the
rest. It has no decrease-key, and you do not need one: push the improved
distance as a new entry and skip any entry you pop whose distance is already
worse than the one you have recorded. That "stale entry" skip is the line
people forget, and without it the heap grows without bound.
'''
starter      = '''
import sys

MASK = (1 << 64) - 1


class Rng:
    def __init__(self, seed):
        self.x = seed

    def next(self):
        self.x = (self.x * 6364136223846793005 + 1442695040888963407) & MASK
        return self.x >> 33


def build(n, m, seed):
    rng = Rng(seed)
    graph = [[] for _ in range(n)]
    for i in range(1, n):
        p = rng.next() % i
        w = rng.next() % 1000 + 1
        graph[p].append((i, w))
        graph[i].append((p, w))
    for _ in range(max(0, m - (n - 1))):
        a = rng.next() % n
        b = rng.next() % n
        w = rng.next() % 1000 + 1
        graph[a].append((b, w))
        graph[b].append((a, w))
    return graph


def main():
    n, m, seed = (int(t) for t in sys.stdin.read().split())

    graph = build(n, m, seed)
    unreached = None
    dist = [unreached] * n
    done = [False] * n
    dist[0] = 0

    # correct, and far too slow: the minimum is found by scanning every node
    for _ in range(n):
        best = None
        best_dist = None
        for u in range(n):
            if not done[u] and dist[u] is not None:
                if best_dist is None or dist[u] < best_dist:
                    best_dist = dist[u]
                    best = u
        if best is None:
            break
        done[best] = True
        for v, w in graph[best]:
            if dist[v] is None or best_dist + w < dist[v]:
                dist[v] = best_dist + w

    reached = [d for d in dist if d is not None]
    print(sum(reached))
    print(f"MAX {max(reached) if reached else 0}")


main()
'''
solution     = '''
import heapq
import sys

MASK = (1 << 64) - 1


class Rng:
    def __init__(self, seed):
        self.x = seed

    def next(self):
        self.x = (self.x * 6364136223846793005 + 1442695040888963407) & MASK
        return self.x >> 33


def build(n, m, seed):
    rng = Rng(seed)
    graph = [[] for _ in range(n)]
    for i in range(1, n):
        p = rng.next() % i
        w = rng.next() % 1000 + 1
        graph[p].append((i, w))
        graph[i].append((p, w))
    for _ in range(max(0, m - (n - 1))):
        a = rng.next() % n
        b = rng.next() % n
        w = rng.next() % 1000 + 1
        graph[a].append((b, w))
        graph[b].append((a, w))
    return graph


def main():
    n, m, seed = (int(t) for t in sys.stdin.read().split())

    graph = build(n, m, seed)
    unreached = float("inf")
    dist = [unreached] * n
    dist[0] = 0

    heap = [(0, 0)]
    while heap:
        d, u = heapq.heappop(heap)
        # a stale entry: we already found a shorter way to u
        if d > dist[u]:
            continue
        for v, w in graph[u]:
            candidate = d + w
            if candidate < dist[v]:
                dist[v] = candidate
                heapq.heappush(heap, (candidate, v))

    reached = [d for d in dist if d < unreached]
    print(sum(reached))
    print(f"MAX {max(reached) if reached else 0}")


main()
'''
hints = [
  "(distance, node) tuples in a heapq: distance first is what orders the entries, and heapq is already a min-heap.",
  "`if d > dist[u]: continue` is the stale-entry skip. Without it the algorithm is still correct and the heap fills with obsolete entries.",
  "float(\"inf\") is the honest `unreached`: it compares greater than every int and needs no None check in the relaxation. The spanning-tree half of the generator guarantees every node is reachable, so the final filter never removes anything — keep it anyway, because the version of this question with an unreachable node is the follow-up.",
]

