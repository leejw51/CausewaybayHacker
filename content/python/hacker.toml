Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one. And a queue is `collections.deque` —
`list.pop(0)` is `O(n)` and turns the whole search quadratic.
'''
starter      = '''
