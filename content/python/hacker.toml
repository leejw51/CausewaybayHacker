solution     = '''
import sys
from collections import OrderedDict

MASK = (1 << 64) - 1


def read_operations(header, lines):
    cap, q = int(header[0]), int(header[1])
    ops = []
    if len(header) == 3:
        x = int(header[2])

        def nxt():
            nonlocal x
            x = (x * 6364136223846793005 + 1442695040888963407) & MASK
            return x >> 33

        for _ in range(q):
            a = nxt()
            key = nxt() % (2 * cap)
            if a % 4 == 0:
                ops.append(("GET", key, None))
            else:
                ops.append(("PUT", key, nxt() % 100))
    else:
        for line in lines[:q]:
            parts = line.split()
            value = int(parts[2]) if len(parts) > 2 else None
            ops.append((parts[0], int(parts[1]), value))
    return cap, ops


def main():
    lines = sys.stdin.read().split("\n")
    cap, ops = read_operations(lines[0].split(), lines[1:])

    # cold end first, hot end last: move_to_end is the touch, popitem(last=False)
    # is the eviction, and both are O(1)
    cache = OrderedDict()
    evicted = 0
    out = []

    # a sequence of operations is a for loop, however it was handed to you
    for op, key, value in ops:
        if op == "GET":
            if key in cache:
                cache.move_to_end(key)
                out.append(str(cache[key]))
            else:
                out.append("-1")
            continue

        if key in cache:
            cache[key] = value
            cache.move_to_end(key)
            continue
        if len(cache) >= cap and cache:
            cache.popitem(last=False)
            evicted += 1
        cache[key] = value

    for line in out:
        print(line)
    print(" ".join(str(key) for key in reversed(cache)) if cache else "-")
    print(f"EVICTED {evicted}")


main()
'''
