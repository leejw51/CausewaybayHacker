'''
solution     = '''
import sys

MASK = (1 << 64) - 1


class Fenwick:
    """Fenwick tree, 1-based internally. `add` and `prefix` are both O(log n)."""

    def __init__(self, n):
        self.tree = [0] * (n + 1)

    def add(self, index, delta):
        i = index + 1
        tree = self.tree
        while i < len(tree):
            tree[i] += delta
            i += i & -i  # step up by the lowest set bit

    def prefix(self, upto):
        i = upto
        total = 0
        tree = self.tree
        while i > 0:
            total += tree[i]
            i -= i & -i
        return total

    def range(self, l, r):
        return self.prefix(r + 1) - self.prefix(l)


def main():
    n, q, seed = (int(t) for t in sys.stdin.read().split())

    x = seed

    def nxt():
        nonlocal x
        x = (x * 6364136223846793005 + 1442695040888963407) & MASK
        return x >> 33

    fenwick = Fenwick(n)
    for i in range(n):
        fenwick.add(i, nxt() % 1000)

    total = 0
    updates = 0
    for _ in range(q):
        a, b, c = nxt(), nxt(), nxt()
        if a % 2 == 0:
            fenwick.add(b % n, c % 1000 + 1)
            updates += 1
        else:
            l, r = b % n, c % n
            if l > r:
                l, r = r, l
            total += fenwick.range(l, r)

    print(total)
    print(f"UPDATES {updates}")


main()
'''
hints = [
  "Build the tree by calling add once per initial value. The O(n) bottom-up build is a nice optimisation and is not what the clock is testing.",
  "i & -i isolates the lowest set bit — Python's negative ints behave as if two's complement for bitwise operations, so no wrapping_neg is needed. Adding it walks up the tree; subtracting it walks down.",
  "range(l, r) is prefix(r + 1) - prefix(l), and getting that pair of off-by-ones right is most of the debugging. Binding self.tree to a local inside the loops is a real speed-up in CPython, and it is the only micro-optimisation this quest needs.",
]

