solution     = '''
import heapq
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n, m = data[0], data[1]

    after = [[] for _ in range(n)]
    waiting = [0] * n
    for e in range(m):
        a, b = data[2 + 2 * e], data[3 + 2 * e]
        after[a].append(b)
        waiting[b] += 1

    ready = [task for task in range(n) if waiting[task] == 0]
    heapq.heapify(ready)

    order = []
    while ready:
        task = heapq.heappop(ready)
        order.append(task)
        for nxt in after[task]:
            waiting[nxt] -= 1
            if waiting[nxt] == 0:
                heapq.heappush(ready, nxt)

    if len(order) < n:
        print("CYCLE")
    else:
        print(" ".join(str(v) for v in order))
    print(f"DONE {len(order)}")


main()
'''
