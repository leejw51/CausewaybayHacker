solution     = '''
import sys


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    n, target = data[0], data[1]
    coins = data[2:2 + n]

    unreachable = None
    best = [unreachable] * (target + 1)
    best[0] = 0

    for amount in range(1, target + 1):
        for coin in coins:
            if coin <= amount and best[amount - coin] is not None:
                candidate = best[amount - coin] + 1
                if best[amount] is None or candidate < best[amount]:
                    best[amount] = candidate

    print(-1 if best[target] is None else best[target])
    print(f"REACH {sum(1 for v in best if v is not None)}")


main()
'''
