map          = { x = 0.391, y = 0.950, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Write a **generator** `ticker(start, step, count)` that yields `count`
values beginning at `start` and advancing by `step`. Print each on its own
line, then `SUM <total>` computed by handing a second ticker to `sum`.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

The last line is `type(ticker(...)).__name__`, printed by the starter's
`main` as it stands. Right now it says `list`.

A function with `yield` in it does not run when you call it. It returns a
generator, and the body runs one step at a time, each time something asks
for the next value. That is why `for` works on it, why `sum` works on it,
and why it can produce a million values without a list of a million values
ever existing.

The starter builds the list and returns it, which is correct and is not the
question. A list is every value at once; a generator is one value when
asked. Turn the `append` into a `yield` and delete the list.
'''
starter     = '''
def ticker(start, step, count):
    values = []
    for i in range(count):
        values.append(start + i * step)
    return values


def main():
    start, step, count = (int(t) for t in input().split())

    for value in ticker(start, step, count):
        print(value)
    print(f"SUM {sum(ticker(start, step, count))}")
    print(type(ticker(start, step, count)).__name__)


main()
'''
solution    = '''
def ticker(start, step, count):
    value = start
    for _ in range(count):
        yield value
        value += step


def main():
    start, step, count = (int(t) for t in input().split())

    for value in ticker(start, step, count):
        print(value)
    print(f"SUM {sum(ticker(start, step, count))}")
    print(type(ticker(start, step, count)).__name__)


main()
'''
