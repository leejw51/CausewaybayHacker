id          = "python.basic.04.control-flow"
node        = 4
title       = "WHICH AISLE"
difficulty  = 2
story       = "The market's aisle numbers are painted on the floor and the sign at the door is supposed to say what each aisle sells. It says the number, every time."
concepts    = ["control-flow", "io", "functions"]
