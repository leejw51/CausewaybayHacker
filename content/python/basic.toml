  "The last line of output is the type's name, and the test wants `generator`. That is what a def with a yield in it returns.",
  "yield value, then advance. The function pauses at the yield and resumes after it on the next request.",
  "A generator can be consumed once. That is why main builds a fresh ticker for the sum instead of reusing the one the loop drained.",
]

