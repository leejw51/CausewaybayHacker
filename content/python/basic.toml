id          = "python.basic.15.generators"
node        = 16
title       = "YOUR OWN FOR LOOP"
difficulty  = 3
story       = "The fish stall's ticker lists every price from the opening one up in fixed steps, and keeps no list of them anywhere."
concepts    = ["generators", "iteration", "functions"]
