concepts    = ["zero-values", "error-handling", "structs", "duck-typing"]
requires    = ["python.basic.17.duck-typing", "python.basic.10.exceptions"]
map          = { x = 0.949, y = 0.868, kind = "boss" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<STALL> <CENTS>` — the
stalls that have opened — then a count `q` and `q` stall names to look up.

For each query print `<STALL> <cents>`, or `<STALL> NONE` if that stall is
not open. Then print `MISSING <k>` and `CHEAPEST <STALL>` — the open stall
with the lowest price, ties by name — or `CHEAPEST NONE` if nothing is open.

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

The starter crashes on `CHAN`:

```
AttributeError: 'NoneType' object has no attribute 'cents'
```

That line is the boss. It never points at the bug. It points at the place
where a `None` was finally *used*, which can be any distance from the place
it was *made* — and in the starter it was made in two different places.
`lookup` returns `None` for a stall that is not there, by design, and the
caller reads `.cents` off it without asking. And `cheapest` has no `return`
on one path, so it returns `None` **implicitly**, and the caller does the
same thing to that.

Every function in Python returns something. A function that falls off the
end returns `None`. A `dict.get` with no default returns `None`. Neither is
an error at the time; both become one later. The fix is the same both times:
the code that can receive a `None` checks for it, with `is None`, before it
touches an attribute. Not `== None`, not `if not stall` — a stall with a
price of `0` is a real stall, and `not` would throw it away.

Make `lookup` and `cheapest` return `Optional[Stall]` **on purpose**, say so
in the annotation, and handle the `None` where it lands.
'''
starter     = '''
import sys
from dataclasses import dataclass
from typing import Optional


@dataclass
class Stall:
    name: str
    cents: int


def lookup(board: dict, name: str) -> Optional[Stall]:
    return board.get(name)


def cheapest(board: dict) -> Optional[Stall]:
    if board:
        best = min(board.values(), key=lambda s: (s.cents, s.name))
        best  # the return is missing


def main():
    tokens = iter(sys.stdin.read().split())
    n = int(next(tokens))
    board = {}
    for _ in range(n):
        name, cents = next(tokens), int(next(tokens))
        board[name] = Stall(name, cents)

    q = int(next(tokens))
    missing = 0
    for _ in range(q):
        name = next(tokens)
        stall = lookup(board, name)
        print(f"{name} {stall.cents}")

    print(f"MISSING {missing}")
    print(f"CHEAPEST {cheapest(board).name}")


main()
'''
solution    = '''
import sys
from dataclasses import dataclass
from typing import Optional


@dataclass
class Stall:
    name: str
    cents: int


def lookup(board: dict, name: str) -> Optional[Stall]:
    # dict.get returns None for a missing key; that None is the contract,
    # and the annotation says so out loud
    return board.get(name)


def cheapest(board: dict) -> Optional[Stall]:
    if not board:
        return None
    return min(board.values(), key=lambda s: (s.cents, s.name))


def main():
    tokens = iter(sys.stdin.read().split())
    n = int(next(tokens))
    board = {}
    for _ in range(n):
        name, cents = next(tokens), int(next(tokens))
        board[name] = Stall(name, cents)

    q = int(next(tokens))
    missing = 0
    for _ in range(q):
        name = next(tokens)
        stall = lookup(board, name)
        if stall is None:
            missing += 1
            print(f"{name} NONE")
        else:
            print(f"{name} {stall.cents}")

    print(f"MISSING {missing}")
    best = cheapest(board)
    print(f"CHEAPEST {best.name if best is not None else 'NONE'}")


main()
'''
hints = [
  "Read the traceback bottom up: the AttributeError is on the print, but the None came out of lookup one line earlier, and out of board.get before that.",
  "if stall is None: is the check. `is`, because None is a single object and identity is the honest comparison; `==` can be overridden and `not stall` is wrong for a falsy-but-real value.",
  "cheapest has two paths and only one of them has a return. Python does not warn about that; it hands the caller None and lets the caller find out. Give the empty case an explicit `return None` so the reader can see it was meant.",
  "Optional[Stall] in the annotation is not enforced by the interpreter. It is a note to the reader and to the type checker, and the reader is the one on the clock.",
]

