[[quest]]
id          = "python.basic.16.decorators"
node        = 17
title       = "WRAPPED"
difficulty  = 3
story       = "The market office wants to know how many times the price function was called today, and the function does not want to know it is being watched."
concepts    = ["decorators", "functions", "closures"]
requires    = ["python.basic.15.generators"]
map          = { x = 0.619, y = 0.868, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` weights in kg.

`price(kg)` is `500 + 100 * kg`. Decorate it with `@counted` so that every
call is counted without `price` knowing. Print one price per weight, then
`CALLS <n>`, then `NAME <price.__name__>` — which must still say `price`.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

A decorator is a function that takes a function and returns a function. The
one it returns is usually a closure called `wrapper` that does something and
then calls the original — and unless you say otherwise, `wrapper` is what
the name `price` now refers to, `__name__` and all. `functools.wraps` copies
the original's name and docstring onto the wrapper. The starter forgot it,
and the last line says `NAME wrapper`.

Where does the count live? Not in a global. Attach it to the wrapper —
`wrapper.calls = 0` — and read `price.calls` afterwards. A function is an
object and takes attributes like any other.
'''
starter     = '''
import functools


def counted(func):
    def wrapper(*args, **kwargs):
        wrapper.calls += 1
        return func(*args, **kwargs)

    wrapper.calls = 0
    return wrapper


@counted
def price(kg):
    return 500 + 100 * kg


def main():
    n = int(input())
    weights = [int(t) for t in input().split()]
    for kg in weights[:n]:
        print(price(kg))
    print(f"CALLS {price.calls}")
    print(f"NAME {price.__name__}")
    _ = functools


main()
'''
solution    = '''
import functools


def counted(func):
    @functools.wraps(func)
    def wrapper(*args, **kwargs):
        wrapper.calls += 1
        return func(*args, **kwargs)

    wrapper.calls = 0
    return wrapper


@counted
def price(kg):
    return 500 + 100 * kg


def main():
    n = int(input())
    weights = [int(t) for t in input().split()]
    for kg in weights[:n]:
        print(price(kg))
    print(f"CALLS {price.calls}")
    print(f"NAME {price.__name__}")


main()
'''
