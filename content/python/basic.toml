[[quest]]
id          = "python.basic.08.sets"
node        = 8
title       = "WHAT BOTH STALLS HAVE"
difficulty  = 2
story       = "Two vegetable stalls, one on each side of the aisle, and a customer who wants to know what she can get from either without walking across the wet floor twice."
concepts    = ["collections", "iteration", "strings"]
requires    = ["python.basic.07.dicts"]
map          = { x = 0.785, y = 0.463, kind = "quest" }
brief       = '''
Two lines of standard input, each a stall's goods separated by spaces. A
stall may list the same thing twice; that counts once.

Print three lines:

1. `BOTH` followed by everything on both lists, sorted, space separated — or
   `BOTH -` if there is nothing
2. `ONLY_A <k>`: how many things are on the first list and not the second
3. `ALL <k>`: how many distinct things are on either list

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

A `set` has no duplicates and no order, and `&`, `-` and `|` are the three
operations. `sorted` on a set gives you a list, which is the only way to
print one in a fixed order.
'''
starter     = '''
def main():
    a = input().split()
    b = input().split()

    both = []
    # a set of each, then & - | for the three answers
    print("BOTH -")
    print(f"ONLY_A {len(a)}")
    print(f"ALL {len(a) + len(b)}")
    _ = both


main()
'''
solution    = '''
def main():
    a = set(input().split())
    b = set(input().split())

    both = sorted(a & b)
    print("BOTH " + (" ".join(both) if both else "-"))
    print(f"ONLY_A {len(a - b)}")
    print(f"ALL {len(a | b)}")


main()
'''
hints = [
  "set(input().split()) builds the set straight from the tokens; the duplicate tofu disappears on the way in.",
  "a & b is the intersection, a - b is the difference, a | b is the union. len of each is the count.",
  "\" \".join(sorted(both)) needs strings — these already are — and the `if both else \"-\"` covers the empty case in one expression.",
]

