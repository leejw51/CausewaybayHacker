brief       = '''
Standard input is one line of integers separated by spaces.

Print three lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Use comprehensions, not index loops: a generator expression inside `sum`, a
list comprehension with an `if` for the second line, and a set comprehension
for the third. The `if` goes at the end and filters; an expression at the
front transforms.

`" ".join(...)` wants strings, so the second comprehension has to produce
`str(v * 2)`, not `v * 2`. That `TypeError: sequence item 0: expected str
instance, int found` is the one everyone meets on this line.
