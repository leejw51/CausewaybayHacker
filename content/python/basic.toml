'''
solution    = '''
class Notebook:
    def __init__(self):
        # one list per notebook; a list in the class body would be shared
        self.items = []

    def add(self, name, cents):
        self.items.append((name, cents))

    def total(self):
        return sum(cents for _, cents in self.items)

    def __repr__(self):
        return f"Notebook(items={len(self.items)}, total={self.total()})"


def main():
    n = int(input())
    book = Notebook()
    scratch = Notebook()
    scratch.add("PENCIL", 0)
    for _ in range(n):
        name, cents = input().split()
        book.add(name, int(cents))

    for name, cents in book.items:
        print(f"{name} {cents}")
    print(f"TOTAL {book.total()}")
    print(book)


main()
'''
