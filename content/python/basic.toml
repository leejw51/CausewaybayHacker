[[quest]]
id          = "python.basic.07.dicts"
node        = 7
title       = "WHAT THE MARKET SHOUTS"
difficulty  = 3
story       = "Bowrington Road at seven: every stall calling something, and the sign board at the Canal Road end wants the ranking."
concepts    = ["collections", "sorting", "iteration"]
requires    = ["python.basic.06.strings"]
map          = { x = 0.898, y = 0.526, kind = "quest" }
brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, and ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```

A dict remembers insertion order, and that is not the order you want.
`sorted` with a `key` that returns a tuple sorts on the first element and
breaks ties on the second, and negating the count is how you get descending
on one field while the other stays ascending.
'''
starter     = '''
import sys


def main():
    words = sys.stdin.read().split()

    counts = {}
    for word in words:
        counts[word] += 1

    for word, count in counts.items():
        print(f"{word} {count}")


main()
'''
solution    = '''
import sys


def main():
    words = sys.stdin.read().split()

    counts = {}
    for word in words:
        counts[word] = counts.get(word, 0) + 1

    ranked = sorted(counts.items(), key=lambda item: (-item[1], item[0]))
    for word, count in ranked:
        print(f"{word} {count}")


main()
'''
hints = [
  "The starter dies with KeyError on the first word: counts[word] += 1 reads before it writes, and there is nothing to read. counts.get(word, 0) supplies the zero.",
  "sorted(counts.items(), key=...) gives you (word, count) pairs in the order you asked for. The dict itself stays in insertion order.",
  "key=lambda item: (-item[1], item[0]) — count descending, then word ascending, in one tuple.",
]

