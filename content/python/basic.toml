[[quest]]
id          = "python.basic.06.floats"
node        = 6
title       = "THREE DECIMAL PLACES"
difficulty  = 1
story       = "The weighing scale reads to three decimals, the cheap one beside it keeps only single precision, and the notebook shows the same number twice, both wrong."
concepts    = ["types", "io"]
requires    = ["python.basic.05.big-int"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief       = '''Python's `float` is a 64-bit double — `f64` in other lands. There is no
32-bit float type, but you can see one: `struct.pack("f", x)` writes `x` as
four bytes of single precision and `struct.unpack("f", ...)` reads them back,
and what comes back is `x` rounded to the nearest `f32`. An f-string with
`:.3f` prints three decimals; `:.10f` prints enough to see the rounding.

```
x = float(s)
y = struct.unpack("f", struct.pack("f", x))[0]
```

`s` is read and both prints are written. Type the two lines above in place
of the two placeholders.

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
starter     = '''import struct


def main():
    s = input().strip()
    x = 0.0  # FILL: the text as a float (f64)
    # ANSWER: x = float(s)
    y = 0.0  # FILL: x round-tripped through a 32-bit float
    # ANSWER: y = struct.unpack("f", struct.pack("f", x))[0]
    print(f"{x:.3f}")
    print(f"{y:.10f}")


main()
'''
solution    = '''import struct


def main():
    s = input().strip()
    x = float(s)
    y = struct.unpack("f", struct.pack("f", x))[0]
    print(f"{x:.3f}")
    print(f"{y:.10f}")


main()
'''
hints = [
  "x = float(s), then y = struct.unpack(\"f\", struct.pack(\"f\", x))[0] — unpack returns a tuple, so take [0].",
  "\"f\" is the single-precision format; \"d\" would be double and would change nothing.",
]

