# PYTHON LAND — BASIC. The grammar road: Bowrington Road wet market from the
# 06:00 shutters to the price board, one construct per node. This is grammar
# practice, not a quiz: the brief explains one thing and shows how it is
# written, the starter is the whole program, and the player types the one or
# two lines that use it — int(), f-strings, integer widths and a thirty-two
# byte number, float vs f32, string, list and byte slices with copy and
# append, for/range, def/return, a class, an Enum, list.append, a deque as
# the linked list, dict.get, a dict as the hash table, a set, a stack and a
# queue, sorted, reverse, a key lambda, a closure, map/filter with lambdas,
# threading.Thread, and the two recursive lines of a binary search tree for
# the boss. Nothing here is
# timed, and verify_pack refuses a basic solution that adds more than two
# lines over its starter.
#
# Every program is one main.py, run as `python3 -I main.py`, stdlib only, and
# nothing in it needs anything newer than Python 3.10.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "python.basic"
land = "python"
category = "basic"
version = 2

