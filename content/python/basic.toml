def main():
    n = int(input())
    book = Notebook()
    scratch = Notebook()
    scratch.add("PENCIL", 0)
    for _ in range(n):
        name, cents = input().split()
        book.add(name, int(cents))

    for name, cents in book.items:
        print(f"{name} {cents}")
    print(f"TOTAL {book.total()}")
