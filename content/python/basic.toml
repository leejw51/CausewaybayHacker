@dataclass(frozen=True)
class Order:
    kind: str
    kg: int


def price(order):
    base = 500 + 100 * order.kg
    match order:
        case Order(kind="ADULT"):
            return str(base)
        case _:
            return f"UNKNOWN {order.kind}"


def main():
    n = int(input())
    for _ in range(n):
        kind, kg = input().split()
        print(price(Order(kind, int(kg))))


main()
'''
solution    = '''
from dataclasses import dataclass


@dataclass(frozen=True)
class Order:
    kind: str
    kg: int


def price(order):
    base = 500 + 100 * order.kg
    match order:
        case Order(kind="ADULT"):
            return str(base)
        case Order(kind="STUDENT"):
            return str(base // 2)
        case Order(kind="SENIOR"):
            return "200"
        case Order(kind=other):
            return f"UNKNOWN {other}"


def main():
    n = int(input())
    for _ in range(n):
        kind, kg = input().split()
        print(price(Order(kind, int(kg))))


main()
'''
hints = [
  "One case per kind: case Order(kind=\"STUDENT\"): and so on. A dataclass matches by its field names.",
  "// is integer division; / would give you 450.0 and the test wants 450.",
  "case Order(kind=other): is a capture pattern — it always matches and binds the tag — so it goes last, exactly like the `other =>` arm in a Rust match.",
]

