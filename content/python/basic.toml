def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    # 1. sum of the even ones
    # 2. the ones over 10, doubled, joined by spaces, or "-"
    # 3. how many distinct values
    print(0)
    print("-")
    print(len(nums))


main()
'''
solution    = '''
import sys


def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    print(sum(v for v in nums if v % 2 == 0))

    big = [str(v * 2) for v in nums if v > 10]
    print(" ".join(big) if big else "-")

    distinct = {v for v in nums}
    print(len(distinct))


main()
'''
