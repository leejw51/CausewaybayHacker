brief       = '''
Read one line: an amount in cents, as digits.

Print three lines:

1. how many characters the stripped text has
2. the amount as a number
3. the amount as dollars with exactly two decimals

```
input:  1234
output: 4
        1234
        12.34
```

The amount is non-negative. Do it with **one name**, rebound three times —
`str`, then `int`, then `str` again. Python lets a name hold anything and
change its mind; the price is that nothing tells you what `cents` is right
now except reading the code above it.

Do not go through `float` for the dollars. `1234 / 100` is `12.34` today and
`0.1 + 0.2` is `0.30000000000000004` every day. Integer division and modulo
give you the two halves exactly, and `f"{cents % 100:02d}"` pads the second
one.
'''
starter     = '''
def main():
    cents = input().strip()

    # 1. the character count of `cents`
    # 2. rebind `cents` to its int value, and print it
    # 3. rebind `cents` to the formatted dollars, and print it
    print(cents)


main()
'''
solution    = '''
def main():
    cents = input().strip()
    print(len(cents))

    cents = int(cents)
    print(cents)

    cents = f"{cents // 100}.{cents % 100:02d}"
    print(cents)


main()
'''
