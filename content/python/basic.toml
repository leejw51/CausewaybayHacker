map          = { x = 0.602, y = 0.065, kind = "quest" }
brief       = '''
Read one integer `n`. For every `i` from `1` to `n`, print one line:

* `FISHVEG` if `i` divides by both 3 and 5
* `FISH` if `i` divides by 3
* `VEG` if `i` divides by 5
* otherwise `i` itself

Then keep reading integers, one per line, until you read `0`, and print
`SKIPPED <k>`, how many non-zero lines you read on the way.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

Two loops, two kinds. The first knows how many times it runs before it
starts: `for i in range(1, n + 1)`. The second does not: `while True` with a
`break`, because the count is decided by what you read. Python's `range`
stops **before** its end, and `range(1, n)` is the off-by-one everyone
writes here once.
'''
starter     = '''
def label(i):
    # FISHVEG / FISH / VEG / i
    return i


def main():
    n = int(input())
    for i in range(1, n):
        print(label(i))

    skipped = 0
    # read lines until a 0, counting the non-zero ones
    print(f"SKIPPED {skipped}")


main()
'''
solution    = '''
def label(i):
    if i % 15 == 0:
        return "FISHVEG"
    if i % 3 == 0:
        return "FISH"
    if i % 5 == 0:
        return "VEG"
    return i


def main():
    n = int(input())
    for i in range(1, n + 1):
        print(label(i))

    skipped = 0
    while True:
        value = int(input())
        if value == 0:
            break
        skipped += 1
    print(f"SKIPPED {skipped}")


main()
'''
hints = [
  "Check the both-case first, or it never fires. Divisible by 3 and 5 is divisible by 15.",
  "range(1, n) stops at n - 1. The starter has that bug; the sample output ends one line early.",
  "while True with a break is how Python spells a loop whose exit is in the middle. There is no do-while.",
]

