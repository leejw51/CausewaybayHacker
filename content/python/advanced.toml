[[quest]]
id          = "python.advanced.04.strings"
node        = 4
title       = "BYTES ARE NOT LETTERS"
difficulty  = 2
story       = "The SOGO basement directory truncates 銅鑼灣 at three bytes and prints one character and a question mark."
