[[quest]]
id          = "python.advanced.07.context-managers"
node        = 7
title       = "THE SHUTTER COMES DOWN ANYWAY"
difficulty  = 4
story       = "A stall in the basement opens its shutter for every order and closes it after. The one that got a bad order at 12:40 has been open since, because the closing code was after the line that failed."
concepts    = ["error-handling", "generators", "functions"]
requires    = ["python.advanced.06.async-queue"]
map          = { x = 0.898, y = 0.526, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<STALL> <CENTS>`, where
`CENTS` is supposed to be an integer.

Write a context manager `opened(stall)` with `contextlib.contextmanager`
that prints `OPEN <STALL>` on the way in and `SHUT <STALL>` on the way out
— **whether or not the body raised**. Inside it, parse the cents and add
them to a total. A line whose cents do not parse is reported as
`BAD <STALL>` after the shutter has closed. Finally print `TOTAL <sum>` and
`REJECTED <k>`.

```
input:  3
        LAM 1200
        WONG xx
        CHAN 800
output: OPEN LAM
        SHUT LAM
        OPEN WONG
        SHUT WONG
        BAD WONG
        OPEN CHAN
        SHUT CHAN
        TOTAL 2000
        REJECTED 1
```

`@contextmanager` turns a generator into a context manager: everything
before the `yield` is `__enter__`, everything after it is `__exit__`. When
the body raises, the exception is thrown **into the generator at the
`yield`**, so the code after it only runs if the `yield` is inside a
`try`/`finally`. The starter has no `finally`, and `WONG`'s shutter never
closes.

The class spelling — `__enter__` and `__exit__(self, exc_type, exc, tb)` —
does the same job in more lines and can swallow the exception by returning
`True`. Do not swallow it here: the caller wants to print `BAD`.
'''
starter     = '''
from contextlib import contextmanager


@contextmanager
def opened(stall):
    print(f"OPEN {stall}")
    yield
    print(f"SHUT {stall}")


def main():
    n = int(input())
    total = 0
    rejected = 0
    for _ in range(n):
        stall, cents = input().split()
        try:
            with opened(stall):
                total += int(cents)
        except ValueError:
            rejected += 1
            print(f"BAD {stall}")
    print(f"TOTAL {total}")
    print(f"REJECTED {rejected}")


main()
'''
solution    = '''
from contextlib import contextmanager


@contextmanager
def opened(stall):
    print(f"OPEN {stall}")
    try:
        yield
    finally:
        # runs on the normal exit and on the exception thrown in at the yield
        print(f"SHUT {stall}")


def main():
    n = int(input())
    total = 0
    rejected = 0
    for _ in range(n):
        stall, cents = input().split()
        try:
            with opened(stall):
                total += int(cents)
        except ValueError:
            rejected += 1
            print(f"BAD {stall}")
    print(f"TOTAL {total}")
    print(f"REJECTED {rejected}")


main()
'''
hints = [
  "try: yield / finally: print(SHUT). The finally is the __exit__ that runs on every path.",
  "The exception passes through the generator and out of the with statement, so main's except still sees it — that is why BAD prints after SHUT.",
  "with opened(stall) as x: would bind whatever the generator yields. It yields nothing here, and that is fine.",
]

