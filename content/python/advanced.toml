import sys
from itertools import accumulate, combinations, groupby


def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    print("SUMS " + " ".join(str(v) for v in accumulate(nums)))

    runs = [f"{value}x{len(list(group))}" for value, group in groupby(nums)]
    print("RUNS " + " ".join(runs))

    distinct = sorted(set(nums))
    print(f"PAIRS {sum(1 for _ in combinations(distinct, 2))}")


main()
