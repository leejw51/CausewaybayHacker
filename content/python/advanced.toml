solution    = '''
import heapq
from bisect import bisect_left, bisect_right
from collections import Counter, defaultdict


def main():
    words = input().split()
    nums = [int(t) for t in input().split()]
    x = int(input())

    counts = Counter(words)
    # most_common(1) would break the tie by insertion order; say what you mean
    word, count = min(counts.items(), key=lambda item: (-item[1], item[0]))
    print(f"TOP {word} {count}")

    print(f"BISECT {bisect_left(nums, x)} {bisect_right(nums, x)}")

    print("SMALLEST3 " + " ".join(str(v) for v in heapq.nsmallest(3, nums)))

    groups = defaultdict(list)
    for w in words:
        groups[w[0]].append(w)
    print("GROUPS " + " ".join(f"{k}:{len(v)}" for k, v in sorted(groups.items())))


main()
'''
