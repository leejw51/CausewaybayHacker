[[quest]]
id          = "python.advanced.08.exceptions"
node        = 8
title       = "THE LINE THAT IS NOT A NUMBER"
difficulty  = 3
story       = "The scale at the fish stall prints a column of weights with somebody's phone number in the middle of it."
concepts    = ["error-handling", "control-flow", "types"]
requires    = ["python.advanced.07.functions"]
map          = { x = 0.953, y = 0.263, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, where the total is the sum of the values
you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`int("xx")` raises `ValueError`. That is the only way Python tells you a
conversion failed — there is no `Result`, no `(value, ok)`; the failure is an
exception, and the code that expected a number has to say what it does about
it with `try`/`except ValueError`.

Catch **`ValueError`**, not `Exception`. A bare `except:` would also swallow
the `KeyboardInterrupt` and the typo in your own code, which is how programs
learn to fail silently.
'''
starter     = '''
def double(text):
    return int(text) * 2


def main():
    n = int(input())
    total = 0
    for _ in range(n):
        line = input().strip()
        value = double(line)
        print(value)
        total += value
    print(f"SUM {total}")


main()
'''
solution    = '''
def double(text):
    return int(text) * 2


def main():
    n = int(input())
    total = 0
    for _ in range(n):
        line = input().strip()
        try:
            value = double(line)
        except ValueError:
            print(f"BAD {line}")
            continue
        print(value)
        total += value
    print(f"SUM {total}")


main()
'''
hints = [
  "The starter dies on xx with ValueError: invalid literal for int() with base 10. That message is the exception you catch.",
  "Keep the try block small: only the call that can fail goes inside it, and the print and the total go after.",
  "continue inside the except skips the rest of the loop body for that line, so the bad line adds nothing.",
]

