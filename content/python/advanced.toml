map          = { x = 0.389, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

One producer thread puts each value multiplied by ten on a `queue.Queue`,
then puts a **sentinel**. The main thread takes from the queue until it sees
the sentinel, printing each value and keeping a total, then prints
`SUM <total>` and `CLOSED`.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

A `queue.Queue` has no `close`. Nothing on it can tell the consumer that
there will be no more; that has to be an item, and `None` is the usual one.
The starter never sends it, so `get()` blocks forever with nothing left to
wait for and the runner kills the program at the time limit. There is no
deadlock detector in Python. The program just stops answering, and that is
what "hang" looks like from the outside.

The producer sends the sentinel. Never the consumer — the side that knows
the stream is over is the side that ends it.
'''
starter     = '''
import queue
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    hatch = queue.Queue()

    def kitchen():
        for value in nums:
            hatch.put(value * 10)
        # the hatch is still open

    producer = threading.Thread(target=kitchen)
    producer.start()

    total = 0
    while True:
        value = hatch.get()
        if value is None:
            break
        print(value)
        total += value
    producer.join()

    print(f"SUM {total}")
    print("CLOSED")


main()
'''
solution    = '''
import queue
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    hatch = queue.Queue()

    def kitchen():
        for value in nums:
            hatch.put(value * 10)
        hatch.put(None)

    producer = threading.Thread(target=kitchen)
    producer.start()

    total = 0
    while True:
        value = hatch.get()
        if value is None:
            break
        print(value)
        total += value
    producer.join()

    print(f"SUM {total}")
    print("CLOSED")


main()
'''
hints = [
  "One line, at the end of kitchen: hatch.put(None).",
  "The consumer already checks `is None`. It was waiting for something the producer never sent.",
  "If the values could legitimately be None, the sentinel is a private object: SENTINEL = object(), compared with `is`.",
]

