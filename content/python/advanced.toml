[[quest]]
id          = "python.advanced.04.thread-pool"
node        = 4
title       = "EIGHT PORTERS"
difficulty  = 4
story       = "Forty crates on the SOGO loading dock and eight porters. Nobody wants forty porters; they want the eight never standing still."
concepts    = ["concurrency", "collections", "closures"]
