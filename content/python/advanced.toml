Standard input is three integers: `start`, `step`, `count`.

Write a class `Tickets` that implements the **iterator protocol by hand**:
`__iter__` returns `self`, and `__next__` returns the next value or raises
`StopIteration` when `count` values have been handed out. Print each on its
own line, then `SUM <total>` computed by handing a second `Tickets` to
`sum`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

This is what a generator writes for you. A `for` loop calls `iter()` on the
thing once, then `next()` on the result until it raises `StopIteration`;
`sum`, `list`, `max` and `in` do the same. An object with `__next__` and no
`__iter__` is an iterator that `for` refuses — `TypeError: 'Tickets' object
is not iterable` — and that is the starter.

`__iter__` returning `self` is the mark of an **iterator**: it can be walked
once and is then spent. A **container** returns a fresh iterator from
`__iter__` each time and can be walked repeatedly; `Bag` from the basic
road was one. Say which you are writing; the difference shows up the second
time somebody loops.
'''
starter     = '''
class Tickets:
    def __init__(self, start, step, count):
        self.current = start
        self.step = step
        self.left = count

    def __next__(self):
        if self.left == 0:
            raise StopIteration
        value = self.current
        self.current += self.step
        self.left -= 1
        return value


def main():
    start, step, count = (int(t) for t in input().split())

    for value in Tickets(start, step, count):
