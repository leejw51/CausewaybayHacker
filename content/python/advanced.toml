id          = "python.advanced.10.functools"
node        = 27
title       = "REMEMBER WHAT YOU WORKED OUT"
difficulty  = 4
story       = "The tofu stall works out the same day's price from the same two numbers eleven thousand times before lunch, from scratch, every time."
