map          = { x = 0.602, y = 0.065, kind = "quest" }
brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Open a `ThreadPoolExecutor` with `w` workers, `submit` one job per value
that returns `(index, value * value)`, and collect the results with
`as_completed`. Sort by index, print `<index> <value>` one per line, then
`WORKERS <w>`.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

`submit` returns a `Future`, not a result. `as_completed` hands the futures
back in the order they **finish**, which is whatever order the pool felt
like, and `future.result()` is what gets the value out — or re-raises the
exception the job died with, which is the other reason to call it.

The starter prints the futures. Carrying the index in the result is what
makes the output the same every run; sorting on it is the last line of the
answer, not the first.
'''
starter     = '''
import sys
from concurrent.futures import ThreadPoolExecutor, as_completed


def square(index, value):
    return index, value * value


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    workers, n = data[0], data[1]
    nums = data[2:2 + n]

    with ThreadPoolExecutor(max_workers=workers) as pool:
        futures = [pool.submit(square, i, v) for i, v in enumerate(nums)]
        results = [future for future in as_completed(futures)]

    for index, value in sorted(results):
        print(f"{index} {value}")
    print(f"WORKERS {workers}")


main()
'''
solution    = '''
import sys
from concurrent.futures import ThreadPoolExecutor, as_completed


def square(index, value):
    return index, value * value


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    workers, n = data[0], data[1]
    nums = data[2:2 + n]

    with ThreadPoolExecutor(max_workers=workers) as pool:
        futures = [pool.submit(square, i, v) for i, v in enumerate(nums)]
        results = [future.result() for future in as_completed(futures)]

    for index, value in sorted(results):
        print(f"{index} {value}")
    print(f"WORKERS {workers}")


main()
'''
hints = [
  "The starter dies unpacking a Future: `for index, value in sorted(results)` cannot unpack an object that is not a tuple. The tuple is inside future.result().",
  "as_completed yields as jobs finish; the index in the result is the only record of where each one came from.",
  "with ThreadPoolExecutor(...) as pool: waits for every submitted job on the way out, so nothing is left running when you print. pool.map would also work here and keeps the order for you, at the cost of not learning as_completed.",
]

