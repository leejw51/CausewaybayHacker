[[quest]]
id          = "python.advanced.03.lists"
node        = 3
title       = "THE MIDDLE OF THE LINE"
difficulty  = 2
story       = "Forty people queue for the roast goose counter in the SOGO basement. The counter can see the front and the back of the line and nothing in between."
concepts    = ["slices", "iteration", "control-flow"]
requires    = ["python.advanced.02.control-flow"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` on the first line and then `n` integers on the
second, separated by spaces. `n` is at least `1`, so there is always a first
value and a last value to print.

Print three lines: the first value, the last value, and the sum of everything
strictly between them. With fewer than three values that sum is `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`nums[1:-1]` is the middle: a slice, which is a **new list** — Python copies
on slicing, unlike a Rust slice or a Go sub-slice. `nums[-1]` is the last
element, and negative indices are the whole reason you never write
`nums[len(nums) - 1]` in Python.

With one value, `nums[1:-1]` is empty and `sum` of it is `0`, so the guard
the other languages need is free here. That is worth knowing, and worth
checking rather than assuming.
'''
starter     = '''
import sys


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    # print nums[0], the last element, then the sum of the middle slice
    print(nums[0])


main()
'''
solution    = '''
import sys


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    print(nums[0])
    print(nums[-1])
    print(sum(nums[1:-1]))


main()
'''
hints = [
  "nums[-1] is the last element; nums[-2] is the one before it.",
  "nums[1:-1] is everything except the first and last, and an empty slice sums to 0 on its own.",
  "sys.stdin.read().split() reads everything at once and splits on any whitespace, so the line breaks stop mattering.",
]

