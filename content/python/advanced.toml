solution    = '''
import sys
from dataclasses import dataclass
from typing import Optional


@dataclass
class Stall:
    name: str
    cents: int


def lookup(board: dict, name: str) -> Optional[Stall]:
    # dict.get returns None for a missing key; that None is the contract,
    # and the annotation says so out loud
    return board.get(name)


def cheapest(board: dict) -> Optional[Stall]:
    if not board:
        return None
    return min(board.values(), key=lambda s: (s.cents, s.name))


def main():
    tokens = iter(sys.stdin.read().split())
    n = int(next(tokens))
    board = {}
    for _ in range(n):
        name, cents = next(tokens), int(next(tokens))
        board[name] = Stall(name, cents)

    q = int(next(tokens))
    missing = 0
    for _ in range(q):
        name = next(tokens)
        stall = lookup(board, name)
        if stall is None:
            missing += 1
            print(f"{name} NONE")
        else:
            print(f"{name} {stall.cents}")

    print(f"MISSING {missing}")
    best = cheapest(board)
    print(f"CHEAPEST {best.name if best is not None else 'NONE'}")


main()
'''
