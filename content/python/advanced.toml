id          = "python.advanced.08.pipeline"
node        = 8
title       = "THE LINE COOK"
difficulty  = 4
story       = "Chef Bo's line in the basement kitchen: one station squares the order, the next keeps the running count, and nobody waits for the whole batch."
concepts    = ["generators", "iteration", "closures"]
