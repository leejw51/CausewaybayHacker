  "if stall is None: is the check. `is`, because None is a single object and identity is the honest comparison; `==` can be overridden and `not stall` is wrong for a falsy-but-real value.",
  "cheapest has two paths and only one of them has a return. Python does not warn about that; it hands the caller None and lets the caller find out. Give the empty case an explicit `return None` so the reader can see it was meant.",
  "Optional[Stall] in the annotation is not enforced by the interpreter. It is a note to the reader and to the type checker, and the reader is the one on the clock.",
]

