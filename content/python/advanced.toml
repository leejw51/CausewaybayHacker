map          = { x = 0.275, y = 0.058, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one thread per value that adds it to **one shared total** and bumps a
shared hit count. Join them all, then print `TOTAL <sum>` and `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

The starter prints `TOTAL 0`, deterministically, with a traceback on
stderr from every worker. `total += value` inside the worker does not touch
main's `total`: an `int` is immutable, `+=` on it
rebinds the name, and a name assigned inside a function is **local** to that
function unless it says `nonlocal`. Each worker made its own `total`, added
to it, and dropped it.

The fix is a container that the workers mutate in place — a one-element list
or a small class — **and a `Lock`**. The second half is not optional. The
GIL guarantees that one bytecode runs at a time; `drawer[0] += value` is
three bytecodes (load, add, store), and a thread switch between the load and
the store loses an update. It will not happen in four threads adding four
numbers. It will happen at 2 a.m. with forty.

`with lock:` takes it and releases it on the way out, including the way out
through an exception.
'''
starter     = '''
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    total = 0
    hits = 0

    def pay(value):
        total += value
        hits += 1

    threads = [threading.Thread(target=pay, args=(v,)) for v in nums]
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()

    print(f"TOTAL {total}")
    print(f"HITS {hits}")


main()
'''
solution    = '''
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    # one shared drawer, mutated in place, and one lock around every touch
    drawer = {"total": 0, "hits": 0}
    lock = threading.Lock()

    def pay(value):
        with lock:
            drawer["total"] += value
            drawer["hits"] += 1

    threads = [threading.Thread(target=pay, args=(v,)) for v in nums]
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()

    print(f"TOTAL {drawer['total']}")
    print(f"HITS {drawer['hits']}")


main()
'''
hints = [
  "Run the starter: it dies with UnboundLocalError, because `total += value` makes total a local of pay and reads it before it exists. That error is the whole diagnosis.",
  "A dict or a list is mutated in place, so `drawer[\"total\"] += value` changes the one object every thread shares. `nonlocal total` would also work and is the other honest answer.",
  "threading.Lock() once in main, `with lock:` around the read-modify-write. The GIL is not a lock on your data; it is a lock on the interpreter.",
]

