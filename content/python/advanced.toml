from dataclasses import dataclass, FrozenInstanceError


@dataclass(frozen=True)
class Price:
    name: str
    cents: int


class Tally:
    __slots__ = ("count",)

    def __init__(self):
        self.count = 0


def main():
    n = int(input())
    prices = []
    for _ in range(n):
        name, cents = input().split()
        prices.append(Price(name, int(cents)))

    for price in prices:
        try:
            price.cents = 0
            print(f"MUTATED {price.name}")
        except FrozenInstanceError:
            print(f"FROZEN {price.name}")

    tally = Tally()
    tally.count = n
    try:
        tally.cuont = 0
        print("SLOTS NO")
    except AttributeError:
        print("SLOTS YES")

    print(f"IN_SET {len(set(prices))}")
    print(f"TOTAL {sum(p.cents for p in prices)}")


main()
