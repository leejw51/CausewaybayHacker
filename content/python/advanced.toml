The starter's `tag` has no default, so the two-token lines crash it:
`TypeError: tag() missing 1 required positional argument`. A default
argument is part of the function's contract — it says what the caller may
leave out and what they get when they do.

Split the line with `.split()` and hand the pieces over with `tag(*parts)`
after converting the cents. The `*` unpacks a list into positional arguments,
so a two-element list and a three-element list both fit the one signature.
