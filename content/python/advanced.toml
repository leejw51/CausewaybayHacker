id          = "python.advanced.03.queue"
node        = 3
title       = "WHO CLOSES THE HATCH"
difficulty  = 3
story       = "The roast goose counter passes every order through the hatch to the kitchen, and after the last one the kitchen stands there waiting for a next that never comes."
