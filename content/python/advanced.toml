GIL guarantees that one bytecode runs at a time; `drawer[0] += value` is
three bytecodes (load, add, store), and a thread switch between the load and
the store loses an update. It will not happen in four threads adding four
numbers. It will happen at 2 a.m. with forty.

`with lock:` takes it and releases it on the way out, including the way out
through an exception.
