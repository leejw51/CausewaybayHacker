[[quest]]
id          = "python.advanced.05.asyncio"
node        = 5
title       = "WHERE DOES ASYNC ACTUALLY RUN"
difficulty  = 4
story       = "Mei has written `async def` for four years and has never once seen the thing that drives it. The order board in the basement has one loop and every stall takes turns on it."
concepts    = ["async", "concurrency", "functions"]
requires    = ["python.advanced.04.thread-pool"]
map          = { x = 0.716, y = 0.137, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Write `async def double(value)` that yields to the event loop once —
`await asyncio.sleep(0)` — and returns the value doubled. Run all `n` of
them with `asyncio.gather`, print each result in input order, then
`SUM <total>` and `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

Calling an `async def` does not run it. It builds a **coroutine object**
and hands it back, and nothing inside happens until something awaits it.
The starter's list is three coroutines, unawaited, and Python says so on
stderr — `RuntimeWarning: coroutine 'double' was never awaited` — while the
output is three lines of `<coroutine object double at 0x...>`.

`gather` takes the coroutines, schedules them all on the one loop, and
returns their results **in the order you passed them**, whatever order they
finished in. That is the whole reason to reach for it over a hand-written
loop of `await`s: the loop would be correct and sequential, and `gather` is
correct and interleaved.

There is exactly one thread here. `await` is the point at which a coroutine
hands the thread back to the loop so another can use it. Nothing runs in
parallel; things run **in turn**, at the places they said they could stop.
'''
starter     = '''
import asyncio
import sys


async def double(value):
    await asyncio.sleep(0)
    return value * 2


async def run(nums):
    results = [double(v) for v in nums]
    return results


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    results = asyncio.run(run(nums))
    for value in results:
        print(value)
    print(f"SUM {sum(results)}")
    print(f"TASKS {len(nums)}")


main()
'''
solution    = '''
import asyncio
import sys


async def double(value):
    await asyncio.sleep(0)
    return value * 2


async def run(nums):
    results = await asyncio.gather(*(double(v) for v in nums))
    return list(results)


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    results = asyncio.run(run(nums))
    for value in results:
        print(value)
    print(f"SUM {sum(results)}")
    print(f"TASKS {len(nums)}")


main()
'''
hints = [
  "await asyncio.gather(*coroutines) — the star spreads the list into arguments, and the await is what runs them.",
  "asyncio.run(...) is the executor: it makes the loop, runs one coroutine to completion, and closes the loop. There is one of these per program, at the top.",
  "gather returns results in argument order. If you needed them as they finish, that is asyncio.as_completed, and then you carry the index yourself, exactly like the thread pool.",
]

