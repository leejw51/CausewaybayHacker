[[quest]]
id          = "python.advanced.09.comprehensions"
node        = 9
title       = "ONE PASS DOWN BOWRINGTON ROAD"
difficulty  = 3
story       = "Alex says you can do it with three for loops. The aisle is one person wide and the floor is wet; you get one pass."
concepts    = ["comprehensions", "iteration", "collections"]
requires    = ["python.advanced.08.exceptions"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''
Standard input is one line of integers separated by spaces.

Print three lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Use comprehensions, not index loops: a generator expression inside `sum`, a
list comprehension with an `if` for the second line, and a set comprehension
for the third. The `if` goes at the end and filters; an expression at the
front transforms.

`" ".join(...)` wants strings, so the second comprehension has to produce
`str(v * 2)`, not `v * 2`. That `TypeError: sequence item 0: expected str
instance, int found` is the one everyone meets on this line.
'''
starter     = '''
import sys


def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    # 1. sum of the even ones
    # 2. the ones over 10, doubled, joined by spaces, or "-"
    # 3. how many distinct values
    print(0)
    print("-")
    print(len(nums))


main()
'''
solution    = '''
import sys


def main():
    nums = [int(t) for t in sys.stdin.read().split()]

    print(sum(v for v in nums if v % 2 == 0))

    big = [str(v * 2) for v in nums if v > 10]
    print(" ".join(big) if big else "-")

    distinct = {v for v in nums}
    print(len(distinct))


main()
'''
hints = [
  "sum(v for v in nums if v % 2 == 0) — a generator expression needs no extra brackets when it is the only argument.",
  "[str(v * 2) for v in nums if v > 10] — transform at the front, filter at the back.",
