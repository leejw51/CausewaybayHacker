solution    = '''
from contextlib import contextmanager


@contextmanager
def opened(stall):
    print(f"OPEN {stall}")
    try:
        yield
    finally:
        # runs on the normal exit and on the exception thrown in at the yield
        print(f"SHUT {stall}")


def main():
    n = int(input())
    total = 0
    rejected = 0
    for _ in range(n):
        stall, cents = input().split()
        try:
            with opened(stall):
                total += int(cents)
        except ValueError:
            rejected += 1
            print(f"BAD {stall}")
    print(f"TOTAL {total}")
    print(f"REJECTED {rejected}")


main()
'''
