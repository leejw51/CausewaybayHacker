[[quest]]
id          = "python.advanced.02.lock"
node        = 2
title       = "ONE DRAWER, EIGHT HANDS"
difficulty  = 3
story       = "Every stall in the basement pays into the one cash drawer at the food hall office, and at close the drawer has nothing in it and every stall swears it paid."
concepts    = ["shared-state", "concurrency", "thread-safety"]
