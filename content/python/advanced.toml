[[quest]]
id          = "python.advanced.11.protocol"
node        = 11
title       = "IT ONLY HAS TO RENDER"
difficulty  = 4
story       = "The SOGO basement directory lists stalls and counters, printed by two different programs, and the board only wants to know that each of them can draw itself."
concepts    = ["duck-typing", "dispatch", "structs"]
requires    = ["python.advanced.10.functools"]
map          = { x = 0.222, y = 0.514, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each either

* `STALL <NAME> <AISLE>` — renders as `<NAME> / A<AISLE>`
* `COUNTER <NUMBER>` — renders as `COUNTER <NUMBER>`

Declare a `typing.Protocol` called `Sign` with one method, `render()`.
Write `Stall` and `Counter` as plain classes — **no inheritance from
`Sign`** — and a single function `show(sign: Sign)` that prints the
rendering. Print every sign, then `SIGNS <n>` counted with
`isinstance(x, Sign)`, then `STALLS <k>` counted with `isinstance(x, Stall)`.

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

A `Protocol` is a **structural** type: a class satisfies it by having the
methods, not by saying so. That is duck typing with a name the type checker
can read. At run time a protocol does nothing at all unless it is marked
`@runtime_checkable`, and then `isinstance` checks for the method by name.
The starter's `Sign` is missing that decorator, and its `isinstance` raises:

```
TypeError: Instance and class checks can only be used with @runtime_checkable protocols
```

`show` dispatches at run time by attribute lookup — `sign.render()` finds
whichever `render` the object has. There is no static dispatch to choose
instead; Python has one mechanism and this is it.
'''
starter     = '''
from typing import Protocol


class Sign(Protocol):
    def render(self) -> str:
        ...


class Stall:
    def __init__(self, name, aisle):
        self.name = name
        self.aisle = aisle

    def render(self):
        return f"{self.name} / A{self.aisle}"


class Counter:
    def __init__(self, number):
        self.number = number

    def render(self):
        return f"COUNTER {self.number}"


def show(sign: Sign):
    print(sign.render())


def main():
    n = int(input())
    signs = []
    for _ in range(n):
        parts = input().split()
        if parts[0] == "STALL":
            signs.append(Stall(parts[1], int(parts[2])))
        else:
            signs.append(Counter(int(parts[1])))

    for sign in signs:
        show(sign)
    print(f"SIGNS {sum(1 for s in signs if isinstance(s, Sign))}")
    print(f"STALLS {sum(1 for s in signs if isinstance(s, Stall))}")


main()
'''
solution    = '''
from typing import Protocol, runtime_checkable


@runtime_checkable
class Sign(Protocol):
    def render(self) -> str:
        ...


class Stall:
    def __init__(self, name, aisle):
        self.name = name
        self.aisle = aisle

    def render(self):
        return f"{self.name} / A{self.aisle}"


class Counter:
    def __init__(self, number):
        self.number = number

    def render(self):
        return f"COUNTER {self.number}"


def show(sign: Sign):
    # one function, any type with a render(): the lookup happens now, by name
    print(sign.render())


def main():
    n = int(input())
    signs = []
    for _ in range(n):
        parts = input().split()
        if parts[0] == "STALL":
            signs.append(Stall(parts[1], int(parts[2])))
        else:
            signs.append(Counter(int(parts[1])))

    for sign in signs:
        show(sign)
    print(f"SIGNS {sum(1 for s in signs if isinstance(s, Sign))}")
    print(f"STALLS {sum(1 for s in signs if isinstance(s, Stall))}")


main()
'''
hints = [
  "@runtime_checkable above class Sign(Protocol), imported from typing. That is the whole fix.",
  "Neither Stall nor Counter mentions Sign anywhere. They satisfy it by having render(); that is what structural means.",
  "isinstance against a runtime-checkable protocol only checks that the method exists, not its signature or its return type. The type checker checks those; the interpreter never does.",
]

