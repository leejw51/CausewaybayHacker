    total = 0
    for value in stream:
        total += value
    return total


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    count = 0
    for square, total in running(squares(nums)):
        print(f"{square} {total}")
        count += 1
    print(f"PIPE {count}")


main()
'''
solution    = '''
import sys


def squares(values):
    for value in values:
        yield value * value


def running(stream):
    total = 0
    for value in stream:
        total += value
        yield value, total


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    count = 0
    for square, total in running(squares(nums)):
        print(f"{square} {total}")
        count += 1
    print(f"PIPE {count}")


main()
'''
