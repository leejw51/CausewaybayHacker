concepts    = ["concurrency", "shared-state", "thread-safety", "data-races"]
requires    = ["python.advanced.16.timeouts", "python.advanced.02.lock"]
map          = { x = 0.818, y = 0.870, kind = "boss" }
brief       = '''
Standard input is two integers `k` and `n`.

Split `1..n` into `k` contiguous chunks — chunk `i` is
`n*i//k + 1` to `n*(i+1)//k` inclusive — and give each chunk to its own
thread, which sums the squares of its range: a CPU-bound loop, no library
call. Every thread adds its result to **one shared total**, under a lock,
and also records it in its own slot. Join them all. Print `CHUNK <i> <sum>`
for each chunk in index order, then `TOTAL <sum>`, then `THREADS <k>`.

```
input:  3 10
output: CHUNK 0 14
        CHUNK 1 77
        CHUNK 2 294
        TOTAL 385
        THREADS 3
```

The starter fails for a reason that has nothing to do with timing.
`work` returns its sum and `main` collects `t.join()`, and `join` returns
`None` whatever the target returned — a thread has no return value. The
first `+=` is a `TypeError`. That is the small bug. Fix it the way the
lock quest did: a shared container, `with lock:` around the update, and
the per-chunk slot written by exactly one thread.

The big thing is the boss, and it is not a bug you can fix. Run this with
`k = 4` and `n = 4000000` and time it, then run it with `k = 1`. They take
the same time. CPython has a **global interpreter lock**: one thread runs
Python bytecode at any moment, and a CPU-bound thread gives the lock up
every few milliseconds so the others can take a turn. Four threads on four
cores sum the squares in turns, on one core, plus the cost of switching.
Threads in Python are for waiting — on sockets, on files, on `sleep` —
where the lock is released during the wait and the concurrency is real.
For CPU work the answer is `multiprocessing`, or `concurrent.futures.
ProcessPoolExecutor`, which runs separate interpreters with separate locks
and pays for it by copying the arguments.

The output is deterministic because the chunks are printed by index and the
total is the sum of the chunks, not the order the threads finished in.
Print `TOTAL` from the locked total, not from summing the slots — the
lock is the thing this map is about, and the two have to agree.
'''
starter     = '''
import threading


def work(lo, hi):
    # sum of i*i for i in lo..hi, as a plain loop on purpose
    total = 0
    for i in range(lo, hi + 1):
        total += i * i
    return total


def main():
    k, n = (int(t) for t in input().split())

    threads = []
    for i in range(k):
        lo = n * i // k + 1
        hi = n * (i + 1) // k
        threads.append(threading.Thread(target=work, args=(lo, hi)))
    for thread in threads:
        thread.start()

    total = 0
    for i, thread in enumerate(threads):
        part = thread.join()
        print(f"CHUNK {i} {part}")
        total += part

    print(f"TOTAL {total}")
    print(f"THREADS {k}")


main()
'''
solution    = '''
import threading


def main():
    k, n = (int(t) for t in input().split())

    chunks = [0] * k
    shared = {"total": 0}
    lock = threading.Lock()

    def work(index, lo, hi):
        # sum of i*i for i in lo..hi, as a plain loop on purpose: this is
        # the CPU-bound work the GIL serialises however many threads run it
        part = 0
        for i in range(lo, hi + 1):
            part += i * i
        chunks[index] = part
        with lock:
            shared["total"] += part

    threads = []
    for i in range(k):
        lo = n * i // k + 1
        hi = n * (i + 1) // k
        threads.append(threading.Thread(target=work, args=(i, lo, hi)))
    for thread in threads:
        thread.start()
    for thread in threads:
        thread.join()

    for i, part in enumerate(chunks):
        print(f"CHUNK {i} {part}")
    print(f"TOTAL {shared['total']}")
    print(f"THREADS {k}")


main()
'''
hints = [
  "join() returns None. Give work an index and a slot to write, and a locked dict to add into; that is how a value gets out of a thread.",
  "Start all, then join all, then print. Printing inside the threads would interleave; printing after the joins, from the slots, cannot.",
  "n*(n+1)*(2n+1)/6 is the closed form for the total. Check TOTAL against it once and you know the chunk boundaries are right.",
  "Time k=1 against k=4 on a big n. When they match, you have met the GIL. That is not the bug in this quest; it is the reason the next version of this program is a ProcessPoolExecutor.",
]

