map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one `threading.Thread` per value that computes its square and stores
it in `results[i]` — its own slot, so no two threads write the same place.
`join` every thread, then print the results **in index order**, one per
line, then `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

A thread does not return anything. `Thread(target=f)` runs `f` and throws
its return value away, which is why the result has to be written somewhere
the main thread can read after `join`. The slot-per-thread list is the
simplest such place: every index is written by exactly one thread, so there
is nothing to lock.

The starter's threads all crash the moment they start, and the program still
finishes and prints. `target=square` with no `args=` calls `square()` with
nothing, the `TypeError` lands in the thread and is printed to standard
error, and `results` stays full of `None`. A thread that dies takes only
itself with it — read stderr, or you will never know.
'''
starter     = '''
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]
    results = [None] * len(nums)

    def square(index, value):
        results[index] = value * value

    threads = []
    for i, v in enumerate(nums):
        thread = threading.Thread(target=square)
        threads.append(thread)
        thread.start()
    for thread in threads:
        thread.join()

    for value in results:
        print(value)
    print(f"THREADS {len(nums)}")


main()
'''
solution    = '''
import sys
import threading


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]
    results = [None] * len(nums)

    def square(index, value):
        results[index] = value * value

    threads = []
    for i, v in enumerate(nums):
        thread = threading.Thread(target=square, args=(i, v))
        threads.append(thread)
        thread.start()
    for thread in threads:
        thread.join()

    for value in results:
        print(value)
    print(f"THREADS {len(nums)}")


main()
'''
