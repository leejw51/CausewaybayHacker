brief       = '''
Standard input is a count `n`, then `n` lines of `<ITEM> <CENTS>`.

Build a `Notebook` class that collects the items, then print each item back
as `<ITEM> <CENTS>`, in the order it arrived, then `TOTAL <sum>`, and
finally the notebook itself through `print(book)` — its `__repr__` must
produce `Notebook(items=<n>, total=<sum>)`.

```
input:  2
        TOFU 600
        SET 2800
output: TOFU 600
        SET 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n` may be `0`, and then the lines are `TOTAL 0` and
`Notebook(items=0, total=0)`.

The starter has the bug that gives this quest its name: `items = []` sits in
the **class body**, so it is one list shared by every `Notebook` there will
ever be, not one per notebook. Anything created in `__init__` through `self`
belongs to the instance; anything in the class body belongs to the class.
Mutable class attributes are the Python bug that survives code review most
often, because the program works right up until there are two of them.
'''
starter     = '''
class Notebook:
    items = []

    def add(self, name, cents):
        self.items.append((name, cents))

    def total(self):
        return sum(cents for _, cents in self.items)


def main():
    n = int(input())
    book = Notebook()
    scratch = Notebook()
    scratch.add("PENCIL", 0)
    for _ in range(n):
        name, cents = input().split()
        book.add(name, int(cents))

    for name, cents in book.items:
        print(f"{name} {cents}")
    print(f"TOTAL {book.total()}")
    print(book)


main()
'''
solution    = '''
class Notebook:
    def __init__(self):
        # one list per notebook; a list in the class body would be shared
        self.items = []

    def add(self, name, cents):
        self.items.append((name, cents))

    def total(self):
        return sum(cents for _, cents in self.items)

    def __repr__(self):
        return f"Notebook(items={len(self.items)}, total={self.total()})"


def main():
    n = int(input())
    book = Notebook()
    scratch = Notebook()
    scratch.add("PENCIL", 0)
    for _ in range(n):
        name, cents = input().split()
        book.add(name, int(cents))

    for name, cents in book.items:
        print(f"{name} {cents}")
    print(f"TOTAL {book.total()}")
    print(book)


main()
'''
