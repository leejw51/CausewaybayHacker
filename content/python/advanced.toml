brief       = '''
Read one line. Print three lines:

1. its length in **bytes**, encoded as UTF-8
2. its length in **characters**
3. the line with its characters reversed

```
input:  causeway
output: 8
        8
        yawesuac
```

The line may contain characters outside ASCII, and then the first two numbers
are not the same. A Python `str` is a sequence of code points, so `len` is
the character count; to get bytes you have to ask for them, with
`.encode("utf-8")`, and `len` of **that** is the other number.

`s[::-1]` reverses a string. It is a slice with a step of `-1`, and it works
on any sequence.
'''
starter     = '''
def main():
    line = input()

    # 1. bytes, 2. characters, 3. the characters reversed
    print(len(line))


main()
'''
solution    = '''
def main():
    line = input()

    print(len(line.encode("utf-8")))
    print(len(line))
    print(line[::-1])


main()
'''
hints = [
  "len(line) is characters. len(line.encode(\"utf-8\")) is bytes. The starter prints the wrong one first.",
  "line[::-1] is the whole reversal. Slicing a str gives a str.",
  "A byte string reversed would cut a multi-byte character in half; reversing the str does not, because a str has no bytes in it.",
]

