[[quest]]
id          = "python.advanced.10.dict-comprehensions"
node        = 10
title       = "THE SAME PASS, KEYED"
difficulty  = 2
story       = "The stall's prices are on scraps of paper in the order they were written. Auntie wants them as one board, and she wants it twice."
concepts    = ["comprehensions", "collections", "sorting"]
requires    = ["python.advanced.09.comprehensions"]
map          = { x = 0.671, y = 0.280, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<ITEM> <PRICE>`. `PRICE` is
a whole number of cents. An item appears at most once, and `n` is at least
`1` — there is always a cheapest item to name.

Print three lines:

1. every item priced **strictly over 100**, as `ITEM=PRICE`, sorted by item,
   joined by single spaces — or `-` if there are none
2. every item with its price **halved by integer division**, same format,
   sorted by item
3. `CHEAPEST <item>` — the lowest price, ties broken by the item ascending

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

A **dict comprehension** is the list comprehension you already know with a
key: `{k: v for ...}` instead of `[v for ...]`. The first line filters with an
`if` at the end and keeps the values as they are; the second transforms the
value at the front and keeps every key. Both are one line, and neither needs
an empty dict and a loop that fills it.

`sorted(d.items())` gives you `(key, value)` pairs in key order, which is what
the first two lines want. For the third, `min` takes the same `key=` a sort
does — and because a tuple compares left to right, `min(d, key=lambda k: (d[k],
k))` settles the tie without a second pass.
'''
starter     = '''
def main():
    n = int(input())
    prices = {item: int(cents) for item, cents in (input().split() for _ in range(n))}

    # 1. the ones over 100, as ITEM=PRICE, sorted, or "-"
    # 2. every price halved, same format, sorted
    # 3. CHEAPEST <item>, ties alphabetical
    print("-")
    print("-")
    print("CHEAPEST")


main()
'''
solution    = '''
def main():
    n = int(input())
    # the board itself is a dict comprehension: one line per pair, no empty
    # dict and no loop that fills it
    prices = {item: int(cents) for item, cents in (input().split() for _ in range(n))}

    dear = {item: price for item, price in prices.items() if price > 100}
    print(" ".join(f"{k}={v}" for k, v in sorted(dear.items())) if dear else "-")

    half = {item: price // 2 for item, price in prices.items()}
    print(" ".join(f"{k}={v}" for k, v in sorted(half.items())))

    print("CHEAPEST " + min(prices, key=lambda k: (prices[k], k)))


main()
'''
