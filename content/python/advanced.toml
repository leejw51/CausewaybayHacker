[[quest]]
id          = "python.advanced.16.duck-typing"
node        = 16
title       = "IF IT QUACKS"
difficulty  = 3
story       = "A plastic bag from the egg stall. Nobody asked what it is; they asked how many are in it, whether the duck eggs are, and to go through it one at a time."
concepts    = ["duck-typing", "structs", "iteration"]
requires    = ["python.advanced.15.decorators"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief       = '''
Standard input is one line of goods separated by spaces, then one line with
a single word to look for.

Put the goods in a `Bag` and print:

1. `LEN <k>` — from `len(bag)`
2. the goods, one per line — from `for item in bag`
3. `HAS <WORD> YES` or `HAS <WORD> NO` — from `word in bag`
4. `LONGEST <item>` — from `max(bag, key=len)`, the first one on a tie

```
input:  egg duckegg tofu
        duckegg
output: LEN 3
        egg
        duckegg
        tofu
        HAS duckegg YES
        LONGEST duckegg
```

`Bag` does not inherit from `list` and does not need to. `len` calls
`__len__`, `for` calls `__iter__`, `in` calls `__contains__`, and `max`
only needs `__iter__`. Python never asks what a thing *is*; it asks whether
it has the method, at the moment it needs it. The starter has none of them,
and the first error is `TypeError: object of type 'Bag' has no len()`.

`__contains__` is optional: without it, `in` falls back to iterating and
comparing, which is correct and slower. Write it anyway, because it is what
an interviewer means when they say "make it a container".
'''
starter     = '''
class Bag:
    def __init__(self, goods):
        self._goods = list(goods)

    # __len__, __iter__, __contains__


def main():
    bag = Bag(input().split())
    word = input().strip()

    print(f"LEN {len(bag)}")
    for item in bag:
        print(item)
    print(f"HAS {word} {'YES' if word in bag else 'NO'}")
    print(f"LONGEST {max(bag, key=len)}")


main()
'''
solution    = '''
class Bag:
    def __init__(self, goods):
        self._goods = list(goods)

    def __len__(self):
        return len(self._goods)

    def __iter__(self):
        return iter(self._goods)

    def __contains__(self, item):
        return item in self._goods


def main():
    bag = Bag(input().split())
    word = input().strip()

    print(f"LEN {len(bag)}")
    for item in bag:
        print(item)
    print(f"HAS {word} {'YES' if word in bag else 'NO'}")
    print(f"LONGEST {max(bag, key=len)}")


main()
'''
