'''
solution    = '''
class Tickets:
    def __init__(self, start, step, count):
        self.current = start
        self.step = step
        self.left = count

    def __iter__(self):
        return self

    def __next__(self):
        if self.left == 0:
            raise StopIteration
        value = self.current
        self.current += self.step
        self.left -= 1
        return value


def main():
    start, step, count = (int(t) for t in input().split())

    for value in Tickets(start, step, count):
        print(value)
    print(f"SUM {sum(Tickets(start, step, count))}")


main()
'''
