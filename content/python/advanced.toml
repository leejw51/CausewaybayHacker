  "for value, group in groupby(nums): the group is an iterator over that run, consumed once. len(list(group)) is its length.",
  "combinations(distinct, 2) yields each unordered pair once. Counting them is n*(n-1)/2, and checking that by hand is how you know you have the right n.",
]

