solution    = '''
import asyncio


async def fetch(stall, seconds):
    await asyncio.sleep(seconds)
    return f"{stall} OK"


async def watch():
    try:
        while True:
            await asyncio.sleep(0.01)
    except asyncio.CancelledError:
        print("CANCELLED")
        raise
    finally:
        print("CLEANUP")


async def run(stalls):
    timeouts = 0
    for stall, seconds in stalls:
        try:
            print(await asyncio.wait_for(fetch(stall, seconds), timeout=0.2))
        except asyncio.TimeoutError:
            timeouts += 1
            print(f"{stall} TIMEOUT")

    watcher = asyncio.create_task(watch())
    await asyncio.sleep(0)
    watcher.cancel()
    try:
        await watcher
    except asyncio.CancelledError:
        pass
    print(f"TIMEOUTS {timeouts}")


def main():
    n = int(input())
    stalls = []
    for _ in range(n):
        stall, seconds = input().split()
        stalls.append((stall, int(seconds)))
    asyncio.run(run(stalls))


main()
'''
