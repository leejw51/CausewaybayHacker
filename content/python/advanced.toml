        except Negative as err:
            errors += 1
            print(err)
    print(f"ERRORS {errors}")


main()
'''
solution    = '''
class PriceError(Exception):
    pass


class NotANumber(PriceError):
    def __init__(self):
        super().__init__("not a number")


class Negative(PriceError):
    def __init__(self, kg):
        super().__init__(f"negative weight: {kg}")
        self.kg = kg


def price(text):
    try:
        kg = int(text)
    except ValueError as err:
        # the ValueError becomes the cause; the caller sees our type
        raise NotANumber() from err
    if kg < 0:
        raise Negative(kg)
    return 500 + 100 * kg


def main():
    n = int(input())
    errors = 0
    for _ in range(n):
        line = input().strip()
        try:
            print(price(line))
        except PriceError as err:
            errors += 1
            print(err)
    print(f"ERRORS {errors}")


main()
'''
