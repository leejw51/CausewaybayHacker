# PYTHON LAND — ADVANCED. The morning walk turns into the lunch rush. First
# the language's own machinery — conversions, lists, strings, dicts, sets,
# functions, exceptions, comprehensions, sorting, classes, dataclasses,
# generators, decorators, duck typing, and NONE on the price board — and then
# the SOGO basement at 12:30, where everything happens at once: threads,
# locks, queues, pools, asyncio, context managers, itertools, functools, and
# THE GIL. The grammar drills live on the BASIC road now.
#
# Every quest here has a deterministic answer on purpose: results are joined in
# order, collected and sorted, or piped. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

