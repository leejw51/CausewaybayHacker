[[quest]]
id          = "python.advanced.10.functools"
node        = 10
title       = "REMEMBER WHAT YOU WORKED OUT"
difficulty  = 4
story       = "The tofu stall works out the same day's price from the same two numbers eleven thousand times before lunch, from scratch, every time."
concepts    = ["decorators", "recursion", "functions", "closures"]
requires    = ["python.advanced.09.itertools"]
map          = { x = 0.447, y = 0.480, kind = "quest" }
brief       = '''
Standard input is `n k bits`: two integers and a string of binary digits.

Print four lines:

1. `FIB <fib(n)>` — from a **recursive** `fib`, memoised with
   `functools.lru_cache`
2. `PRODUCT <k!>` — `functools.reduce` with `operator.mul` over `1..k`,
   with an initial value so `k = 0` gives `1`
3. `BIN <value>` — `bits` parsed by a `functools.partial` of `int` with
   `base=2`
4. `MISSES <m>` — `fib.cache_info().misses`, how many times the recursion
   actually ran the body

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` is at most `400`, so the recursion stays inside Python's frame limit.
Without the cache, `fib(35)` is about thirty million calls and `fib(90)`
does not finish. With it, every `fib(i)` runs once and `MISSES` is `n + 1`.
`lru_cache` is a decorator, and it works because the arguments are hashable
— a list argument would raise `TypeError` at the first call.

`partial` freezes some arguments of a function and gives you a new one;
`reduce` folds a two-argument function across a sequence. Neither is
clever. Both are asked about.
'''
starter     = '''
import functools
import operator


def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)


def main():
    n, k, bits = input().split()
    n, k = int(n), int(k)

    print(f"FIB {fib(n)}")

    product = 1
    for i in range(1, k + 1):
        product *= i
    print(f"PRODUCT {product}")

    print(f"BIN {int(bits, 2)}")
    print(f"MISSES {fib.cache_info().misses}")
    _ = (functools, operator)


main()
'''
solution    = '''
import functools
import operator


@functools.lru_cache(maxsize=None)
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)


def main():
    n, k, bits = input().split()
    n, k = int(n), int(k)

    print(f"FIB {fib(n)}")

    product = functools.reduce(operator.mul, range(1, k + 1), 1)
    print(f"PRODUCT {product}")

    from_binary = functools.partial(int, base=2)
    print(f"BIN {from_binary(bits)}")

    print(f"MISSES {fib.cache_info().misses}")


main()
'''
hints = [
  "@functools.lru_cache(maxsize=None) above def fib. The starter dies on the last line because a plain function has no cache_info.",
  "functools.reduce(operator.mul, range(1, k + 1), 1) — the third argument is the starting value, and it is what makes the empty range give 1.",
  "functools.partial(int, base=2) is a callable that takes the string and supplies base=2 itself. functools.cache is the same as lru_cache(maxsize=None) on 3.9 and later; either name is fine.",
]

