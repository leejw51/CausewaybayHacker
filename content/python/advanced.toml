[[quest]]
id          = "python.advanced.12.frozen"
node        = 12
title       = "IT DOES NOT CHANGE"
difficulty  = 4
story       = "The printed price list for the day is handed to every stall at 06:00, and by 12:30 three of them have written on it and one has added a column that is not there."
concepts    = ["structs", "mutability", "error-handling"]
requires    = ["python.advanced.11.protocol"]
map          = { x = 0.116, y = 0.476, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<NAME> <CENTS>`.

Build each line into a **frozen** dataclass `Price(name, cents)`. Then, for
each price, try to overwrite its `cents` and print `FROZEN <NAME>` when the
attempt raises. Next, a `Tally` class with `__slots__ = ("count",)`: set
`tally.count`, then try to set a misspelt `tally.cuont` and print
`SLOTS YES` when *that* raises. Finally `IN_SET <k>`, the size of a `set`
of the prices, and `TOTAL <sum>`.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

Three things a frozen dataclass buys, and the starter has none of them.
`frozen=True` makes assignment to a field raise `FrozenInstanceError`, so
the list cannot be written on. It also makes the instance **hashable** —
a mutable dataclass sets `__hash__` to `None`, and `set()` of the starter's
prices raises `TypeError: unhashable type`. Equal fields, equal hash, so the
two `LAM 1200` lines are one member of the set.

`__slots__` is the other kind of fixed shape: the instance has exactly the
named attributes and no `__dict__`, so a typo in an attribute name is an
`AttributeError` at the assignment instead of a silent new field nobody
reads. It also makes every instance smaller, which is why it is the answer
to "we have ten million of these".
'''
starter     = '''
from dataclasses import dataclass, FrozenInstanceError


@dataclass
class Price:
    name: str
    cents: int


class Tally:
    def __init__(self):
        self.count = 0


def main():
    n = int(input())
    prices = []
    for _ in range(n):
        name, cents = input().split()
        prices.append(Price(name, int(cents)))

    for price in prices:
        try:
            price.cents = 0
            print(f"MUTATED {price.name}")
        except FrozenInstanceError:
            print(f"FROZEN {price.name}")

    tally = Tally()
    tally.count = n
    try:
        tally.cuont = 0
        print("SLOTS NO")
    except AttributeError:
        print("SLOTS YES")

    print(f"IN_SET {len(set(prices))}")
    print(f"TOTAL {sum(p.cents for p in prices)}")


main()
'''
solution    = '''
from dataclasses import dataclass, FrozenInstanceError


@dataclass(frozen=True)
class Price:
    name: str
    cents: int


class Tally:
    __slots__ = ("count",)

    def __init__(self):
        self.count = 0


def main():
    n = int(input())
    prices = []
    for _ in range(n):
        name, cents = input().split()
        prices.append(Price(name, int(cents)))

    for price in prices:
        try:
            price.cents = 0
            print(f"MUTATED {price.name}")
        except FrozenInstanceError:
            print(f"FROZEN {price.name}")

    tally = Tally()
    tally.count = n
    try:
        tally.cuont = 0
        print("SLOTS NO")
    except AttributeError:
        print("SLOTS YES")

    print(f"IN_SET {len(set(prices))}")
    print(f"TOTAL {sum(p.cents for p in prices)}")


main()
'''
