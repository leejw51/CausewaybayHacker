[[quest]]
id          = "python.advanced.06.async-queue"
node        = 6
title       = "WHO SAYS IT IS DONE"
difficulty  = 4
story       = "Three runners clear the order queue in the basement and the floor manager waits for the queue to say it is empty. It never says so, because nobody told it a ticket was finished."
concepts    = ["async", "channels", "concurrency", "deadlock"]
requires    = ["python.advanced.05.asyncio"]
map          = { x = 0.962, y = 0.054, kind = "quest" }
brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Put `(index, value)` pairs on an `asyncio.Queue`. Start `w` consumer tasks
that loop forever taking a pair, writing `value * 10` into `results[index]`,
and calling `task_done()`. The main coroutine awaits `queue.join()`, then
cancels the consumers, then prints the results in index order and
`CONSUMERS <w>`.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`queue.join()` returns when every item that was ever `put` has had a
matching `task_done()`. The starter's consumers never call it, so `join`
waits forever, the loop has nothing else runnable, and the program hangs
until the runner kills it. Same hang as the thread quest, different
spelling — and the fix is again one line, on the consumer side.

The consumers are `while True` loops. They end because main cancels them
after the join, and cancelling a task that is parked on `queue.get()` is the
normal, intended way to stop one. Await the cancelled tasks with
`gather(..., return_exceptions=True)` so the cancellation is collected
rather than reported.
'''
starter     = '''
import asyncio
import sys


async def consumer(queue, results):
    while True:
        index, value = await queue.get()
        results[index] = value * 10


async def run(workers, nums):
    queue = asyncio.Queue()
    results = [None] * len(nums)
    for i, v in enumerate(nums):
        queue.put_nowait((i, v))

    tasks = [asyncio.create_task(consumer(queue, results)) for _ in range(workers)]
    await queue.join()

    for task in tasks:
        task.cancel()
    await asyncio.gather(*tasks, return_exceptions=True)
    return results


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    workers, n = data[0], data[1]
    nums = data[2:2 + n]

    for value in asyncio.run(run(workers, nums)):
        print(value)
    print(f"CONSUMERS {workers}")


main()
'''
solution    = '''
import asyncio
import sys


async def consumer(queue, results):
    while True:
        index, value = await queue.get()
        results[index] = value * 10
        queue.task_done()


async def run(workers, nums):
    queue = asyncio.Queue()
    results = [None] * len(nums)
    for i, v in enumerate(nums):
        queue.put_nowait((i, v))

    tasks = [asyncio.create_task(consumer(queue, results)) for _ in range(workers)]
    await queue.join()

    for task in tasks:
        task.cancel()
    await asyncio.gather(*tasks, return_exceptions=True)
    return results


def main():
    data = [int(t) for t in sys.stdin.read().split()]
    workers, n = data[0], data[1]
    nums = data[2:2 + n]

    for value in asyncio.run(run(workers, nums)):
        print(value)
    print(f"CONSUMERS {workers}")


main()
'''
hints = [
  "queue.task_done() after each item is handled. join counts puts against task_dones and nothing else.",
  "create_task schedules the consumer without awaiting it; the loop runs it the next time main awaits something, which is the join.",
  "A task cancelled while awaiting get() raises CancelledError inside it, which ends the while True. return_exceptions=True keeps gather from re-raising that at you.",
]

