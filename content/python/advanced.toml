map          = { x = 0.785, y = 0.463, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Build a two-stage pipeline of **generators**:

1. `squares(values)` yields each value squared
2. `running(stream)` takes any iterable of numbers, keeps a running total,
   and yields `(value, total)` pairs

`main` prints each pair as `<square> <total>`, then `PIPE <n>`.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

Neither stage builds a list. Each `yield` hands one item to the next stage
and pauses; `main` pulls, `running` pulls from `squares`, `squares` pulls
from the input. Nothing is computed before it is wanted, and the whole
pipeline holds one item in flight. That is what makes the same three
functions work on a file of a hundred million lines.

The starter's second stage has `return` where it should have `yield`, so
it is a plain function that returns the final total — an `int` — and `main`
tries to iterate over it.
'''
starter     = '''
import sys


def squares(values):
    for value in values:
        yield value * value


def running(stream):
    total = 0
    for value in stream:
        total += value
    return total


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    count = 0
    for square, total in running(squares(nums)):
        print(f"{square} {total}")
        count += 1
    print(f"PIPE {count}")


main()
'''
solution    = '''
import sys


def squares(values):
    for value in values:
        yield value * value


def running(stream):
    total = 0
    for value in stream:
        total += value
        yield value, total


def main():
    data = sys.stdin.read().split()
    nums = [int(t) for t in data[1:]]

    count = 0
    for square, total in running(squares(nums)):
        print(f"{square} {total}")
        count += 1
    print(f"PIPE {count}")


main()
'''
hints = [
  "The error is TypeError: cannot unpack non-iterable int object — running returned a number instead of yielding pairs.",
  "yield value, total inside the loop. A function with a yield anywhere in it is a generator, and its return value is not what the caller sees.",
  "running(squares(nums)) composes because a generator is an iterable; running never knows or cares that its input is another generator.",
]

