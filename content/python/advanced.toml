    n = int(input())
    for _ in range(n):
        parts = input().split()
        parts[1] = int(parts[1])
        print(tag(*parts))


main()
'''
solution    = '''
def tag(name, cents, unit="catty"):
    return f"{name} ${cents // 100}.{cents % 100:02d}/{unit}"


def main():
    n = int(input())
    for _ in range(n):
        parts = input().split()
        parts[1] = int(parts[1])
        print(tag(*parts))


main()
'''
