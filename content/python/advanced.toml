solution    = '''
from typing import Protocol, runtime_checkable


@runtime_checkable
class Sign(Protocol):
    def render(self) -> str:
        ...


class Stall:
    def __init__(self, name, aisle):
        self.name = name
        self.aisle = aisle

    def render(self):
        return f"{self.name} / A{self.aisle}"


class Counter:
    def __init__(self, number):
        self.number = number

    def render(self):
        return f"COUNTER {self.number}"


def show(sign: Sign):
    # one function, any type with a render(): the lookup happens now, by name
    print(sign.render())


def main():
    n = int(input())
    signs = []
    for _ in range(n):
        parts = input().split()
        if parts[0] == "STALL":
            signs.append(Stall(parts[1], int(parts[2])))
        else:
            signs.append(Counter(int(parts[1])))

    for sign in signs:
        show(sign)
    print(f"SIGNS {sum(1 for s in signs if isinstance(s, Sign))}")
    print(f"STALLS {sum(1 for s in signs if isinstance(s, Stall))}")


main()
'''
