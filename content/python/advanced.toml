[[quest]]
id          = "python.advanced.13.dataclasses"
node        = 13
title       = "WHO IS BUYING"
difficulty  = 3
story       = "The SOGO basement rice counter charges every card the full price, including the ones that are not adults and the one that is not a card."
concepts    = ["types", "pattern-matching", "structs"]
requires    = ["python.advanced.12.classes"]
map          = { x = 0.185, y = 0.313, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <KG>`.

The base price is `500 + 100 * KG` cents. For each line print one of:

* `ADULT` — the base price
* `STUDENT` — half the base price, integer division
* `SENIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

Model the line as a frozen `@dataclass` — `Order(kind: str, kg: int)` —
and decide the price with **one** `match` on the order. A `match` can
destructure a dataclass by keyword — `case Order(kind="ADULT", kg=kg):` —
and its last arm, `case Order(kind=other):`, binds whatever did not match.

The starter's `match` has one arm and then a fall-through `case _:` that
prints `UNKNOWN` for everything, including the three kinds it is supposed
to know. Arms are tried in order and the first match wins, so a wildcard has
to be last and has to be the only thing that is a wildcard.
'''
starter     = '''
from dataclasses import dataclass


@dataclass(frozen=True)
class Order:
    kind: str
    kg: int


def price(order):
    base = 500 + 100 * order.kg
    match order:
        case Order(kind="ADULT"):
            return str(base)
        case _:
            return f"UNKNOWN {order.kind}"


def main():
    n = int(input())
    for _ in range(n):
        kind, kg = input().split()
        print(price(Order(kind, int(kg))))


main()
'''
solution    = '''
from dataclasses import dataclass


@dataclass(frozen=True)
class Order:
    kind: str
    kg: int


def price(order):
    base = 500 + 100 * order.kg
    match order:
        case Order(kind="ADULT"):
            return str(base)
        case Order(kind="STUDENT"):
            return str(base // 2)
        case Order(kind="SENIOR"):
            return "200"
        case Order(kind=other):
            return f"UNKNOWN {other}"


def main():
    n = int(input())
    for _ in range(n):
        kind, kg = input().split()
        print(price(Order(kind, int(kg))))


main()
'''
hints = [
  "One case per kind: case Order(kind=\"STUDENT\"): and so on. A dataclass matches by its field names.",
  "// is integer division; / would give you 450.0 and the test wants 450.",
  "case Order(kind=other): is a capture pattern — it always matches and binds the tag — so it goes last, exactly like the `other =>` arm in a Rust match.",
]

