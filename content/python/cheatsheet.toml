# PYTHON LAND — CHEATSHEET. The grammar off the page, asked: one question per
# section of the Python live-coding cheatsheet (~/vivid/Cheatsheet,
# python_cheatsheet.html), four lines, one right. Nothing is typed and
# nothing is run — the pick is the submission, and the server judges it
# against the quiz (SPEC §0). The three wrong lines are near-misses: another
# language's spelling, a call where a reference was meant, rows that alias.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "python.cheatsheet"
land = "python"
category = "cheatsheet"
version = 1

