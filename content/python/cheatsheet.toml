node        = 30
title       = "THE SHORT LIST"
difficulty  = 3
story       = "The dai pai dong's end-of-night tally: only the dishes that sold get doubled for tomorrow's prep, and the ones that did not sell are left off the list altogether."
concepts    = ["comprehensions", "iteration", "control-flow"]
requires    = ["python.cheatsheet.29.raise"]
map         = { x = 0.93, y = 0.88, kind = "boss" }
brief       = '''
`a = [3, -1, 4, 0]`. Make `b` the list `[6, 8]`: every positive item
doubled, the non-positive ones **left out** — so `len(b)` is the number
of positives, not `len(a)`.
'''
solution    = 'b = [x * 2 for x in a if x > 0]'
hints = [
  "The filter goes at the tail of a comprehension. An if-else at the head is a value, and it keeps every item.",
]

[quest.quiz]
choices = [
  'b = [x * 2 if x > 0 else 0 for x in a]',
  'b = [x * 2 if x > 0 for x in a]',
  'b = [x * 2 for x in a if x > 0]',
  'b = [for x in a if x > 0: x * 2]',
]
answer  = 2
