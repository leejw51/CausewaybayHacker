q = deque([(sr, sc)]); dist[sr][sc] = 0
while q:
    # ____
    for dr, dc in ((0, 1), (1, 0), (0, -1), (-1, 0)):
        nr, nc = r + dr, c + dc
        if 0 <= nr < n and 0 <= nc < m and dist[nr][nc] == -1:
            dist[nr][nc] = dist[r][c] + 1
            q.append((nr, nc))
```
'''
solution    = 'r, c = q.popleft()'
hints = [
  "A deque pops from either end in O(1); which end you take decides whether this is a queue or a stack.",
]

[quest.quiz]
