`retry` is a decorator that takes an argument: `@retry(3)` above a `def`
makes that function try up to three times.

```
def retry(times):
    def deco(fn):
        def inner(*a, **kw):
            ...
        return inner
    return deco
```

`fetch` is already defined without any decorator. Rebind `fetch` by hand
so it is retried three times — the same thing `@retry(3)` would do.
'''
solution    = 'fetch = retry(3)(fetch)'
hints = [
  "There are three layers. The outer call takes the number and gives back the real decorator; the function goes into that.",
]

[quest.quiz]
choices = [
  'fetch = retry(fetch, 3)',
  'fetch = retry(3)(fetch)',
  'fetch = retry(3, fetch)',
  'fetch = retry(fetch)(3)',
]
answer  = 1

