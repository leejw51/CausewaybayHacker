# PYTHON LAND — CHEATSHEET ADVANCED. The second road off the page: the
# patterns a live-coding interviewer uses to tell a fluent candidate from
# one who only knows the grammar. Generators and their adaptors, decorators
# and what they wrap, dunders, the sharper half of itertools / heapq /
# bisect, pattern matching with guards, threads, pools and asyncio, and the
# traps that bite under time pressure (late binding, the mutable default,
# `**a, **b` with a key in both). Four lines, one right. Nothing is typed
# and nothing is run — the pick is the submission, and the server judges it
# against the quiz (SPEC §0). Every line was checked on CPython 3.12; the
# three wrong ones raise, fail to parse, or run and give a different answer.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
# The BASIC road (cheatsheet.toml) is not repeated here.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

