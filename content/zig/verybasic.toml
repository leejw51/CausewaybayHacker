'''
hints = [
  "const q: f64 = @as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b)); — each side becomes an f64 before the division.",
  "@floatFromInt(a) / @floatFromInt(b) does not compile: in the middle of an expression the builtin has no result type to become. @divTrunc(a, b) is 3 before it is ever a float.",
