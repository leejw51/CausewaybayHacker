var counter: i64 = 0;
var mu: std.Io.Mutex = .init;

fn work(io: std.Io) void {
    var i: usize = 0;
    while (i < 100000) : (i += 1) {
        // FILL: take mu for this pass; the defer below hands it back at the closing brace
        defer mu.unlock(io);
        counter += 1;
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var threads: [4]std.Thread = undefined;
    for (&threads) |*t| t.* = try std.Thread.spawn(.{}, work, .{io});
    for (threads) |t| t.join();
    try w.print("{d}\n", .{counter});
}
'''
solution    = '''
const std = @import("std");

var counter: i64 = 0;
var mu: std.Io.Mutex = .init;

fn work(io: std.Io) void {
    var i: usize = 0;
    while (i < 100000) : (i += 1) {
        // FILL: take mu for this pass; the defer below hands it back at the closing brace
        mu.lockUncancelable(io);
        defer mu.unlock(io);
        counter += 1;
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var threads: [4]std.Thread = undefined;
    for (&threads) |*t| t.* = try std.Thread.spawn(.{}, work, .{io});
    for (threads) |t| t.join();
    try w.print("{d}\n", .{counter});
}
'''
