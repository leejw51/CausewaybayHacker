story       = '''06:00, Booth 3. The axle counter was a `u8`, the two-hundred-and-fifty-sixth axle of the morning came through as `panic: integer overflow`, and the barrier is down; the receipts since midnight have to be re-indexed by hand, into a search tree wide enough to hold them.'''
