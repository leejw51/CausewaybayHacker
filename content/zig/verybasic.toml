[[quest]]
id          = "zig.verybasic.02.int-types"
node        = 2
title       = "A COUNT TOO BIG FOR I32"
difficulty  = 1
story       = '''The plaza's annual report counts crossings in billions, and the register that held the figure was 32 bits wide.'''
concepts    = ["types", "bindings"]
requires    = ["zig.verybasic.01.print"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
Read `a`, an `i32`. The program needs `big`, an `i64` holding `a` times
one billion — a value an `i32` cannot hold once `a` is more than 2. Zig
does the arithmetic in the type of its operands and, in `-O Debug`, stops
with `panic: integer overflow` when it does not fit; so `a` has to be
widened to `i64` before the multiplication, not after.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  3
output: 3000000000
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const a = try std.fmt.parseInt(i32, it.next().?, 10);
    const big: i64 = a; // FILL: a times one billion, in 64 bits
    try w.print("{d}\n", .{big});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const a = try std.fmt.parseInt(i32, it.next().?, 10);
    const big: i64 = @as(i64, a) * 1000000000;
    try w.print("{d}\n", .{big});
}
'''
hints = [
  "const big: i64 = @as(i64, a) * 1000000000; — widen a first, then multiply in 64 bits.",
  "a * 1000000000 is an i32 times a constant that fits an i32, so the product is an i32 too, and three billion is not: panic: integer overflow.",
]

[quest.quiz]
choices = [
  "const big: i64 = a * 1000000000;",
  "const big: i32 = @as(i64, a) * 1000000000;",
  "const big: i64 = @as(i64, a) * 1000000000;",
  "const big: i64 = @as(i64, a) + 1000000000;",
]
answer  = 2

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "three", stdin = "3\n", expect = "3000000000\n", visible = true },
  { name = "five", stdin = "5\n", expect = "5000000000\n", visible = false },
  { name = "zero", stdin = "0\n", expect = "0\n", visible = false },
