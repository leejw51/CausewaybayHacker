Four threads each add one to `counter` a hundred thousand times. Every
pass through the loop must hold the mutex `mu` while it adds. The
`defer` that unlocks at the closing brace is written; the line that
takes the lock is the hole. A `std.Io.Mutex` is locked with the `io`
in hand — `lock` can be cancelled and returns an error union, and the
plain, uncancelable form returns nothing. Unlocking a mutex nobody holds
is `unreachable`, and in `-O Debug` that is a panic.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  (nothing)
output: 400000
```
'''
