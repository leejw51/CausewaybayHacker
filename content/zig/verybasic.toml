    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var arena = std.heap.ArenaAllocator.init(gpa);
    defer arena.deinit();
    const alloc = arena.allocator();
    var root: ?*Node = null;
    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |tok| root = try insert(alloc, root, try std.fmt.parseInt(i64, tok, 10));
    var out: std.ArrayList(i64) = .empty;
    defer out.deinit(gpa);
    try inorder(root, &out, gpa);
    for (out.items, 0..) |x, i| {
        try w.print("{d}{s}", .{ x, if (i + 1 < out.items.len) " " else "\n" });
    }
}
'''
solution    = '''
const std = @import("std");

const Node = struct {
    val: i64,
    left: ?*Node = null,
    right: ?*Node = null,
};

fn insert(alloc: std.mem.Allocator, n: ?*Node, v: i64) !*Node {
    const node = n orelse {
        const fresh = try alloc.create(Node);
        fresh.* = .{ .val = v };
        return fresh;
    };
    // FILL: send v down the correct side, storing what comes back
    if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v);
    return node;
}

fn inorder(n: ?*Node, out: *std.ArrayList(i64), gpa: std.mem.Allocator) !void {
    const node = n orelse return;
    try inorder(node.left, out, gpa);
    try out.append(gpa, node.val);
    try inorder(node.right, out, gpa);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var arena = std.heap.ArenaAllocator.init(gpa);
    defer arena.deinit();
    const alloc = arena.allocator();
    var root: ?*Node = null;
    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |tok| root = try insert(alloc, root, try std.fmt.parseInt(i64, tok, 10));
    var out: std.ArrayList(i64) = .empty;
    defer out.deinit(gpa);
    try inorder(root, &out, gpa);
    for (out.items, 0..) |x, i| {
        try w.print("{d}{s}", .{ x, if (i + 1 < out.items.len) " " else "\n" });
    }
}
'''
hints = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v); — recurse into one side and store the result.",
  "node.left.? is the null child unwrapped before anyone looked — panic: attempt to use null value on the second insert. The child goes down as the optional it is; and smaller goes left.",
]

[quest.quiz]
choices = [
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v);",
  "if (v < node.val) node.left = try insert(alloc, node.left, v) else node.right = try insert(alloc, node.right, v)",
  "if (v < node.val) node.right = try insert(alloc, node.right, v) else node.left = try insert(alloc, node.left, v);",
  "if (v < node.val) node.left = try insert(alloc, node.left.?, v) else node.right = try insert(alloc, node.right.?, v);",
]
