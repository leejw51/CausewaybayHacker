# ZIG LAND — VERY BASIC. The toll plaza at 06:00. The grammar asked as a
# question first: each node is one construct — a type, a string, a loop, a
# function, a struct, an enum, an ArrayList, a linked list, a hash map, a
# set, a stack, a queue, a heap, a sort, a comparator, a thread, a mutex, a
# tree — with four candidate lines, one right. Pick it, then type it where
# the `// FILL` comment is. One line, every time; the answer is given away
# nowhere but the quiz, and verify_pack swaps every wrong choice into the
# solution to prove it fails. Nothing here hides: a wrong choice is as often
# a compile error (an unused value, an ignored error, an optional read as a
# number) or a panic as it is a wrong answer.
#
# Every program is one main.zig, built with `zig build-exe main.zig -O Debug`
# (Zig 0.16: every safety check on) and run once per case. Standard input is
# read whole, with one idiom everywhere:
#
#     var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
#     const input = try stdin.interface.allocRemaining(gpa, .unlimited);
#
# and standard output goes through a buffered writer that is flushed on the
# way out — `std.debug.print` writes to stderr, which the judge never reads.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "zig.verybasic"
land = "zig"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "zig.verybasic.01.print"
node        = 1
title       = "THE BOOTH'S FIRST WORD"
difficulty  = 1
story       = '''06:00 at the Causeway Bay portal. Booth 1's display is meant to open the shift with one line, and the line is missing.'''
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
The program must print exactly `hello, causewaybay` and a newline. `w` is
the buffered stdout writer; its `print` takes a format string and a tuple
of arguments — an empty tuple, `.{}`, when there are none — and it can
fail, so the call has to be `try`'d.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  (nothing)
output: hello, causewaybay
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(init.io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};
    // FILL: print the greeting
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(init.io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};
    // FILL: print the greeting
    try w.print("hello, causewaybay\n", .{});
}
'''
hints = [
  'try w.print("hello, causewaybay\n", .{}); — the try, the format string, the empty tuple.',
  "print always takes two arguments; and a call that can fail is not allowed to have its error thrown away.",
]

[quest.quiz]
choices = [
  'try w.print("hello, causewaybay\n");',
  'try w.print("hello, causewaybay\n", .{});',
  'w.print("hello, causewaybay\n", .{});',
  'try w.print("hello causewaybay\n", .{});',
]
answer  = 1

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
  { name = "ignores-input", stdin = "12\n", expect = "hello, causewaybay\n", visible = false },
  { name = "twice-ignored", stdin = "a b\n", expect = "hello, causewaybay\n", visible = false },
]

