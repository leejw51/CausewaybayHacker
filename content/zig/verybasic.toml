const std = @import("std");

fn lessStr(_: void, a: []const u8, b: []const u8) bool {
    return std.mem.lessThan(u8, a, b);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var counts: std.StringHashMap(i64) = .init(gpa);
    defer counts.deinit();
    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |word| {
        // FILL: one more word
        try counts.put(word, (counts.get(word) orelse 0) + 1);
    }
    var keys: std.ArrayList([]const u8) = .empty;
    defer keys.deinit(gpa);
    var kit = counts.keyIterator();
    while (kit.next()) |k| try keys.append(gpa, k.*);
    std.mem.sort([]const u8, keys.items, {}, lessStr);
    for (keys.items) |k| try w.print("{s} {d}\n", .{ k, counts.get(k).? });
}
