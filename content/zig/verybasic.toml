`val` is an `i64` this time: wide enough. `insert` puts `v` into the
search tree rooted at `n`, an optional pointer: the `null` case is
written and makes a new node from the arena. The hole is the one line
that sends `v` down the correct side — left when it is smaller than
`node.val`, right otherwise — storing what the recursion returns; the
call allocates, so it is `try`'d. A child is `?*Node`, and it is passed
down as it is — never unwrapped with `.?` before anyone has looked.
Inorder traversal then prints ascending.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
```
'''
starter     = '''
const std = @import("std");

const Node = struct {
    val: i64,
    left: ?*Node = null,
    right: ?*Node = null,
};

fn insert(alloc: std.mem.Allocator, n: ?*Node, v: i64) !*Node {
    const node = n orelse {
        const fresh = try alloc.create(Node);
        fresh.* = .{ .val = v };
        return fresh;
    };
    // FILL: send v down the correct side, storing what comes back
    return node;
}

fn inorder(n: ?*Node, out: *std.ArrayList(i64), gpa: std.mem.Allocator) !void {
    const node = n orelse return;
    try inorder(node.left, out, gpa);
    try out.append(gpa, node.val);
    try inorder(node.right, out, gpa);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
