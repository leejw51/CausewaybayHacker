solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const k = try std.fmt.parseInt(i64, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    // prefix value -> how many times it has occurred so far
    var seen = std.AutoHashMap(i64, i64).init(gpa);
    defer seen.deinit();
    try seen.put(0, 1);

    var prefix: i64 = 0;
    var runs: i64 = 0;
    for (nums) |value| {
        prefix += value;
        // look the earlier prefix up before recording this one
        if (seen.get(prefix - k)) |earlier| runs += earlier;
        const slot = try seen.getOrPut(prefix);
        if (!slot.found_existing) slot.value_ptr.* = 0;
        slot.value_ptr.* += 1;
    }

    try w.print("{d}\n", .{runs});
    try w.print("RANGE {d}\n", .{prefix});
}
'''
