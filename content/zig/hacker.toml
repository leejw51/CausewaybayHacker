        COMMANDS 5
        ITEMS 1
```

`k` counts commands, and `ADD` is one command made of two tokens — so a loop
that runs `k` times and reads one token per turn stops in the wrong place.
Read `k` commands, pulling the argument only when the command has one.

`VOID` on an empty till and `TOTAL` before anything was added both have to
work. There is no line in the statement saying they cannot happen, and on a
real screen that silence is the specification. `pop()` on an empty
`std.ArrayList` is not undefined behaviour here — it returns `null`, and the
