solution     = '''
const std = @import("std");

fn present(tree: []const i64, i: usize) bool {
    return i < tree.len and tree[i] != -1;
}

fn valid(tree: []const i64, i: usize, low: i64, high: i64) bool {
    if (!present(tree, i)) return true;
    const value = tree[i];
    if (value <= low or value >= high) return false;
    return valid(tree, 2 * i + 1, low, value) and valid(tree, 2 * i + 2, value, high);
}

// the depth at which target sits, or 0 if the lookup does not find it
fn find(tree: []const i64, target: i64) usize {
    var i: usize = 0;
    var depth: usize = 1;
    while (present(tree, i)) : (depth += 1) {
        if (tree[i] == target) return depth;
        i = if (target < tree[i]) 2 * i + 1 else 2 * i + 2;
    }
    return 0;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const q = try std.fmt.parseInt(usize, it.next().?, 10);
    const tree = try gpa.alloc(i64, n);
    defer gpa.free(tree);
    for (tree) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    const ok = valid(tree, 0, std.math.minInt(i64), std.math.maxInt(i64));
    try w.print("{s}\n", .{if (ok) "VALID" else "INVALID"});
    var k: usize = 0;
    while (k < q) : (k += 1) {
        const target = try std.fmt.parseInt(i64, it.next().?, 10);
        const depth = find(tree, target);
        if (depth > 0) {
            try w.print("{d} FOUND {d}\n", .{ target, depth });
        } else {
            try w.print("{d} ABSENT\n", .{target});
        }
    }
}
'''
hints = [
