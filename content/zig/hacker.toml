[[quest]]
id           = "zig.hacker.13.backtracking"
node         = 13
title        = "EVERY COMBINATION"
difficulty   = 4
time_limit_s = 900
story        = "List every way the lanes could be opened. All of them, in a fixed order, and do not print the same one twice."
concepts     = ["backtracking", "recursion", "slices"]
