            if (i > 0 and open[at - cols]) {
                routes = @mod(routes + ways[at - cols], P);
                cheapest = @min(cheapest, best[at - cols]);
            }
            if (j > 0 and open[at - 1]) {
                routes = @mod(routes + ways[at - 1], P);
                cheapest = @min(cheapest, best[at - 1]);
            }
            ways[at] = routes;
            // inf + cost would be a panic: guard it
            best[at] = if (cheapest == inf) inf else cheapest + cost[at];
        }
    }

    const last = rows * cols - 1;
    try w.print("PATHS {d}\n", .{ways[last]});
    const answer: i64 = if (best[last] == inf) -1 else best[last];
    try w.print("MIN {d}\n", .{answer});
}
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
  "An open cell with no open neighbour above or left is reachable by zero routes and has no best cost; keep inf meaning unreachable and guard the addition, because inf plus anything is a panic.",
  "The destination can be open and still unreachable, which is exactly when PATHS is 0 and MIN is -1. One of the hidden cases is that.",
]

