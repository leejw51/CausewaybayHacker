        tram
        DISTINCT 3
```

Count with a hash map, then rank. The tie-break is not decoration. An
`std.StringHashMap` hands its entries out in whatever order its slots happen
to be in — an order that changes with the capacity and with the insertions —
so a comparator that looks only at the count leaves equal-count words in that
order, and the same program prints a different answer on the next run.
Making the comparison **total** — count descending, then the word ascending
with `std.mem.lessThan(u8, a, b)` — is what fixes it, and it is the answer
the interviewer is listening for.

The map's keys are `[]const u8` slices, and it does not copy them: they have
to outlive the map, and slices of `input` do.

The cases here are small and the clock is not measuring speed. That is the
right way round for this question — counting and ranking is `O(n log n)`
however you write it, and the thing that actually fails a candidate here is
the comparator, which the `ties` case checks and a big case would not.
