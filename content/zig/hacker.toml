    // best[i] is the longest increasing subsequence ending at i.
    const best = try gpa.alloc(usize, n);
    defer gpa.free(best);
    @memset(best, 1);
    var longest: usize = if (n > 0) 1 else 0;
    for (values, 0..) |value, i| {
        for (values[0..i], 0..) |earlier, j| {
            if (earlier < value and best[j] + 1 > best[i]) best[i] = best[j] + 1;
        }
        longest = @max(longest, best[i]);
    }

    try w.print("{d}\n", .{longest});
    try w.print("TAILS {d}\n", .{longest});
