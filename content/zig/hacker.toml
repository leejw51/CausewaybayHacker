        list.* = try gpa.alloc(i64, count);
        for (list.*) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }
    defer for (lists) |list| gpa.free(list);

    // one entry per list, never more
    var heap: std.PriorityQueue(Entry, void, byValue) = .empty;
    defer heap.deinit(gpa);
    for (lists, 0..) |list, which| {
        if (list.len > 0) try heap.push(gpa, .{ .value = list[0], .which = which, .at = 0 });
    }

    var pops: usize = 0;
    while (heap.pop()) |top| {
