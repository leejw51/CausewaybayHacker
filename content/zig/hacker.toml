solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const commands = try std.fmt.parseInt(usize, it.next().?, 10);

    var items: std.ArrayList(i64) = .empty;
    defer items.deinit(gpa);

    var i: usize = 0;
    while (i < commands) : (i += 1) {
        const command = it.next().?;
        if (std.mem.eql(u8, command, "ADD")) {
            // the argument is a second token of the same command
            const cents = try std.fmt.parseInt(i64, it.next().?, 10);
            try items.append(gpa, cents);
        } else if (std.mem.eql(u8, command, "VOID")) {
            // pop returns null on an empty list; ignoring it is the guard
            _ = items.pop();
        } else if (std.mem.eql(u8, command, "TOTAL")) {
            var sum: i64 = 0;
            for (items.items) |v| sum += v;
            try w.print("{d}\n", .{sum});
        } else if (std.mem.eql(u8, command, "CLEAR")) {
            items.clearRetainingCapacity();
        }
    }

    try w.print("COMMANDS {d}\n", .{commands});
    try w.print("ITEMS {d}\n", .{items.items.len});
}
