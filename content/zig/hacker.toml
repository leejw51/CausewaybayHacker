solution     = '''
const std = @import("std");

const Ranked = struct { word: []const u8, count: i64 };

// a total order: count descending, then the word ascending
fn byRank(_: void, a: Ranked, b: Ranked) bool {
    if (a.count != b.count) return a.count > b.count;
    return std.mem.lessThan(u8, a.word, b.word);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const k = try std.fmt.parseInt(usize, it.next().?, 10);

    // keys are slices of input, which outlives the map
    var counts = std.StringHashMap(i64).init(gpa);
    defer counts.deinit();
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const word = it.next().?;
        const slot = try counts.getOrPut(word);
        if (!slot.found_existing) slot.value_ptr.* = 0;
        slot.value_ptr.* += 1;
    }

    var ranked: std.ArrayList(Ranked) = .empty;
    defer ranked.deinit(gpa);
    var entries = counts.iterator();
    while (entries.next()) |entry| {
        try ranked.append(gpa, .{ .word = entry.key_ptr.*, .count = entry.value_ptr.* });
    }
    std.mem.sort(Ranked, ranked.items, {}, byRank);

    const shown = @min(k, ranked.items.len);
    for (ranked.items[0..shown]) |r| try w.print("{s}\n", .{r.word});
    try w.print("DISTINCT {d}\n", .{ranked.items.len});
}
'''
hints = [
  "One pass to count with getOrPut, one sort to rank. Do not try to keep the ranking up to date while counting.",
  "The comparator returns a.count > b.count when the counts differ, and std.mem.lessThan(u8, a.word, b.word) when they do not — a total order, so the map's slot order cannot show.",
  "@min(k, ranked.items.len) is what makes k-too-big safe; slicing past the end of a slice is a panic here, not a silent read.",
]

