case here that would reject the `O(n²)` double loop — at a real `n` there
would be. That same double loop over 200000 values is `2 × 10^10` additions,
which in a Debug build is well past the five second run limit, against a hash
map's single pass in a fraction of a second. What these four check is the
negatives and the runs that start at the beginning, which are the two places
this answer actually goes wrong. The complexity is on your honour.

One `std.AutoHashMap(i64, i64)` — prefix value to how many times it has
occurred — and `getOrPut` to bump it.
