solution     = '''
const std = @import("std");

fn daysNeeded(weights: []const i64, capacity: i64) i64 {
    var days: i64 = 1;
    var load: i64 = 0;
    for (weights) |wt| {
        if (load + wt > capacity) {
            days += 1;
            load = 0;
        }
        load += wt;
    }
    return days;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const days = try std.fmt.parseInt(i64, it.next().?, 10);
    const weights = try gpa.alloc(i64, n);
    defer gpa.free(weights);
    for (weights) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    var heaviest: i64 = 0;
    var total: i64 = 0;
    for (weights) |v| {
        heaviest = @max(heaviest, v);
        total += v;
    }

    // the answer lies in [heaviest, total]; keep the smallest that works
    var low = heaviest;
    var high = total;
    while (low < high) {
        const mid = low + @divTrunc(high - low, 2);
        if (daysNeeded(weights, mid) <= days) {
            high = mid;
        } else {
            low = mid + 1;
        }
    }

    try w.print("{d}\n", .{low});
    try w.print("MAX {d}\n", .{heaviest});
}
'''
hints = [
