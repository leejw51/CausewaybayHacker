solution     = '''
const std = @import("std");

fn present(tree: []const i64, i: usize) bool {
    return i < tree.len and tree[i] != -1;
}

fn walk(tree: []const i64, i: usize, order: u8, out: *std.ArrayList(i64), gpa: std.mem.Allocator) !void {
    if (!present(tree, i)) return;
    if (order == 0) try out.append(gpa, tree[i]);
    try walk(tree, 2 * i + 1, order, out, gpa);
    if (order == 1) try out.append(gpa, tree[i]);
    try walk(tree, 2 * i + 2, order, out, gpa);
    if (order == 2) try out.append(gpa, tree[i]);
}

fn depth(tree: []const i64, i: usize) usize {
    if (!present(tree, i)) return 0;
    return 1 + @max(depth(tree, 2 * i + 1), depth(tree, 2 * i + 2));
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const tree = try gpa.alloc(i64, n);
    defer gpa.free(tree);
    for (tree) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    var order: u8 = 0;
    while (order < 3) : (order += 1) {
        var out: std.ArrayList(i64) = .empty;
        defer out.deinit(gpa);
        try walk(tree, 0, order, &out, gpa);
        for (out.items, 0..) |v, i| {
            if (i > 0) try w.print(" ", .{});
            try w.print("{d}", .{v});
        }
        try w.print("\n", .{});
    }
    try w.print("DEPTH {d}\n", .{depth(tree, 0)});
}
'''
