solution     = '''
const std = @import("std");

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

// Fenwick tree, 1-based internally. add and prefix are both O(log n).
const Fenwick = struct {
    tree: []i64,

    fn init(gpa: std.mem.Allocator, n: usize) !Fenwick {
        const tree = try gpa.alloc(i64, n + 1);
        @memset(tree, 0);
        return .{ .tree = tree };
    }

    fn deinit(self: *Fenwick, gpa: std.mem.Allocator) void {
        gpa.free(self.tree);
    }

    fn add(self: *Fenwick, index: usize, delta: i64) void {
        var i = index + 1;
        while (i < self.tree.len) : (i += i & (~i + 1)) {
            self.tree[i] += delta; // step up by the lowest set bit
        }
    }

    fn prefix(self: *const Fenwick, upto: usize) i64 {
        var sum: i64 = 0;
        var i = upto;
        while (i > 0) : (i -= i & (~i + 1)) {
            sum += self.tree[i];
        }
        return sum;
    }

    fn range(self: *const Fenwick, l: usize, r: usize) i64 {
        return self.prefix(r + 1) - self.prefix(l);
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const q = try std.fmt.parseInt(usize, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    var rng = Rng{ .x = seed };
    var fenwick = try Fenwick.init(gpa, n);
    defer fenwick.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        fenwick.add(i, @intCast(rng.next() % 1000));
    }

    var total: i64 = 0;
    var updates: usize = 0;
    var k: usize = 0;
    while (k < q) : (k += 1) {
        const a = rng.next();
        const b = rng.next();
        const c = rng.next();
        if (a % 2 == 0) {
            fenwick.add(@intCast(b % n), @intCast(c % 1000 + 1));
            updates += 1;
        } else {
            var l: usize = @intCast(b % n);
            var r: usize = @intCast(c % n);
            if (l > r) std.mem.swap(usize, &l, &r);
            total += fenwick.range(l, r);
        }
    }

    try w.print("{d}\n", .{total});
    try w.print("UPDATES {d}\n", .{updates});
}
'''
