[[quest]]
id           = "zig.hacker.15.topo-sort"
node         = 15
title        = "WHAT ORDER DOES IT BUILD IN"
difficulty   = 5
time_limit_s = 1200
story        = "Eleven source files and a dependency graph. Name a build order, or name the cycle that means there is not one."
concepts     = ["graphs", "stacks-queues", "sorting"]
requires     = ["zig.hacker.14.word-search"]
map          = { x = 0.055, y = 0.556, kind = "quest" }
brief        = '''
Line one is `n m`: `n` tasks numbered `0..n-1` and `m` edges. The next `m`
lines are `<a> <b>`, meaning `a` must be built before `b`.

Print a build order on one line, space separated. When several tasks are ready
at once, take the **lowest numbered** one, so the answer is unique. If no
order exists, print `CYCLE` instead. Then print `DONE <how many you ordered>`.

```
input:  4 4
        0 1
        0 2
        1 3
        2 3
output: 0 1 2 3
        DONE 4
```

Kahn's algorithm: count how many things each task waits on, start with the
ones waiting on nothing, and when you take a task, decrement its dependents.
If you finish with tasks left over, those tasks are the cycle.

The ready set is a `std.PriorityQueue(usize, void, cmp)` with
`std.math.order` as the comparison, so the smallest ready task is what `pop`
returns. The adjacency is one `std.ArrayList(usize)` per task, each started
with `.empty` and each given back with `deinit(gpa)`.
'''
starter      = '''
const std = @import("std");

fn ascending(_: void, a: usize, b: usize) std.math.Order {
    return std.math.order(a, b);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const m = try std.fmt.parseInt(usize, it.next().?, 10);

    const after = try gpa.alloc(std.ArrayList(usize), n);
    defer gpa.free(after);
    for (after) |*list| list.* = .empty;
    defer for (after) |*list| list.deinit(gpa);
    const waiting = try gpa.alloc(usize, n);
    defer gpa.free(waiting);
    @memset(waiting, 0);

    var e: usize = 0;
    while (e < m) : (e += 1) {
        const a = try std.fmt.parseInt(usize, it.next().?, 10);
        const b = try std.fmt.parseInt(usize, it.next().?, 10);
        try after[a].append(gpa, b);
        waiting[b] += 1;
    }

    var ready: std.PriorityQueue(usize, void, ascending) = .empty;
    defer ready.deinit(gpa);

    // start with everything waiting on nothing, take the smallest each time
    try w.print("CYCLE\nDONE 0\n", .{});
