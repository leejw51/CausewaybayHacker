  "if (top.d > dist[top.u]) continue; is the stale-entry skip. Without it the algorithm is still correct and the heap fills with obsolete entries.",
  "The spanning-tree half of the generator guarantees every node is reachable, so the filter on inf never actually removes anything — keep it anyway, because the version of this question with an unreachable node is the follow-up.",
]

