# ZIG LAND — HACKER. The seventh interview. HKU, Chow Yei Ching Building,
# Room 7-32 again, a clock on the wall, and this time a language with no
# hidden control flow and no hidden allocation: every byte paid for and
# handed back, every error a value that is handled or named.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
#
# The 34 problems port content/cpp/hacker.toml node for node — same concepts,
# difficulty, map, route, clock and test cases, byte for byte — so a player
# can sit the same interview in any land. The ids mirror too: the LRU boss is
# `zig.hacker.28.lru` at node 34, exactly as it is in the other lands, because
# SPEC §12 makes the id an identity and `node` the position.
#
# Every program is one main.zig, built with `zig build-exe main.zig -O Debug`
# under Zig 0.16.0 and run once per case. Standard input is read whole:
#     var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
#     const input = try stdin.interface.allocRemaining(gpa, .unlimited);
# and output goes through a buffered writer that is flushed on the way out.
# `-O Debug` keeps every safety check on, and a program that fails one of
# them says so on stderr — `panic: index out of bounds`, `panic: integer
# overflow`, `panic: attempt to use null value` — and exits 134.
#
# Debug is still fast enough to enforce the interview's complexity at the
# C++ sizes. Measured on this machine with the programs that ship here: the
# merge-sort inversion count does n = 1000000 in 0.19 s, the heap Dijkstra
# does n = 200000, m = 400000 in 0.17 s, the Fenwick tree does 4000000
# operations in 0.39 s, the factorial-table binomials do 200000 queries in
# 0.07 s, the 1000 × 1000 grid-paths table takes 0.05 s, the patience LIS at
# n = 200000 takes 0.04 s, and the one-letter 20000-character palindrome
# takes 0.64 s — all against a five second run limit. The starters of those
# same quests (17, 24, 28, 29, 31 by node) are the naive shapes and do not
# come back inside that limit; they time out on purpose, as the C++ ones do.
#
# Two constructs are ported rather than copied. `09.linked-list` keeps its
# `smart-pointers` concept and teaches the nearest thing Zig has for
# `unique_ptr`: a `?*Node` from `gpa.create`, handed back with
# `gpa.destroy`, with no owner but the one who wrote the `defer`. The boss
# keeps `std::list::splice` as `std.DoublyLinkedList`'s `remove` + `prepend`
# on an intrusive node, with `@fieldParentPtr` to get from the node back to
# the entry that holds the key.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "zig.hacker"
land = "zig"
category = "hacker"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id           = "zig.hacker.01.two-sum"
node         = 1
title        = "TWO FARES"
difficulty   = 3
time_limit_s = 600
story        = "Room 7-32, the seventh time. The first question is the one everybody gets, and this time an unused variable is a compile error before it is a wrong answer."
concepts     = ["hashing", "complexity", "slices"]
requires     = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` integers.

Print the **1-based** indices `i j` of two different entries that add up to
`target`, as `i j` with `i < j`. If more than one pair works, give the one
whose second index is smallest; if that still ties, the smallest first index.
If no pair works, print `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

The hidden cases here are small: they check the tie-break and the
no-answer case, not your speed. The question is still the linear one — one
pass, one `std.AutoHashMap(i64, usize)` — because a real `n` is 200000 and
the nested loop is what this question exists to weed out. Write the answer
the question is asking for, not the one that happens to clear these four
cases.

Read all of standard input with `allocRemaining`, walk it with
`std.mem.tokenizeAny`, and print through the buffered writer — the
`defer w.flush() catch {};` is what gets the bytes out when `main` returns
early on a hit.
'''
starter      = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const target = try std.fmt.parseInt(i64, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    var seen = std.AutoHashMap(i64, usize).init(gpa);
    defer seen.deinit();
    _ = target;

    try w.print("-1\n", .{});
}
'''
solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const target = try std.fmt.parseInt(i64, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    // value -> the first index it was seen at
    var seen = std.AutoHashMap(i64, usize).init(gpa);
    defer seen.deinit();
    for (nums, 0..) |v, j| {
        if (seen.get(target - v)) |i| {
            try w.print("{d} {d}\n", .{ i + 1, j + 1 });
            return;
        }
        // keep the first index of a repeated value: the tie-break
        if (!seen.contains(v)) try seen.put(v, j);
    }
    try w.print("-1\n", .{});
}
'''
hints = [
  "One pass. For each value ask whether target minus it has already been seen: seen.get(target - v) gives you a ?usize, and an if with a capture unwraps it.",
  "Only put a value in the map if it is not there yet, which keeps the first index of a repeated value — the tie-break the statement asks for.",
  "Print and return the moment you find it — the first hit as you scan is already the smallest second index. The deferred flush still runs on that early return.",
]

