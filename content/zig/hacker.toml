'''
solution     = '''
const std = @import("std");

fn find(parent: []usize, x: usize) usize {
    var root = x;
    while (parent[root] != root) root = parent[root];
    // path compression: point everything we walked over straight at the root
    var walk = x;
    while (parent[walk] != root) {
        const next = parent[walk];
        parent[walk] = root;
        walk = next;
    }
    return root;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const m = try std.fmt.parseInt(usize, it.next().?, 10);

    const parent = try gpa.alloc(usize, n);
    defer gpa.free(parent);
    for (parent, 0..) |*p, i| p.* = i;
    const size = try gpa.alloc(usize, n);
    defer gpa.free(size);
    @memset(size, 1);
    var groups = n;
    var redundant: usize = 0;

    var e: usize = 0;
    while (e < m) : (e += 1) {
        var a = find(parent, try std.fmt.parseInt(usize, it.next().?, 10));
        var b = find(parent, try std.fmt.parseInt(usize, it.next().?, 10));
        if (a == b) {
            redundant += 1;
            continue;
        }
        // hang the smaller tree under the bigger one
        if (size[a] < size[b]) std.mem.swap(usize, &a, &b);
        parent[b] = a;
        size[a] += size[b];
        groups -= 1;
    }

    var largest: usize = 0;
    for (parent, 0..) |p, x| {
        if (p == x) largest = @max(largest, size[x]);
    }

    try w.print("{d}\n", .{groups});
    try w.print("{d}\n", .{largest});
    try w.print("REDUNDANT {d}\n", .{redundant});
}
'''
hints = [
  "Start with every stop as its own parent and n groups; each successful union drops the count by one.",
  "An edge whose two ends already have the same root is the redundant one — count it and move on.",
  "Only a root's size entry is meaningful, so read the largest off the roots, not off every index.",
]

