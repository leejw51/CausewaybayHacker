map          = { x = 0.396, y = 0.276, kind = "quest" }
brief        = '''
Line one is `k`. Then `k` lines, each a count followed by that many integers,
already sorted ascending.

Print all of them merged into one ascending line, space separated, then
`POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`std.PriorityQueue(T, Context, compareFn)` is a **min**-heap on whatever
order `compareFn` returns, so the heap's direction is not a trick here: give
it `fn (void, Entry, Entry) std.math.Order` that orders by the value, and
`pop()` hands back the smallest as a `?Entry`. It is unmanaged, like
`ArrayList` — `.empty` to start, `push(gpa, x)`, `deinit(gpa)`.
That is the whole Zig-specific part, and it is what the question is checking.

The heap holds one entry per list, not one per element, so it stays at size
`k` however long the lists are.

The cases here are small and the clock is not measuring speed, and on this
question no case could. Pouring every list into one slice and calling
`std.mem.sort` passes these, and would pass a big one too: `O(N log N)`
against the heap's `O(N log k)` is not a gap a run limit can see. What is
being checked is that you can spell the heap. What the interviewer is
listening for is the one-entry-per-list invariant, which is the part that
matters when the lists do not fit in memory at once.
