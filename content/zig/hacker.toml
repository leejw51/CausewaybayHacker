solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const a = std.mem.trim(u8, lines.next() orelse "", "\r");
    const b = std.mem.trim(u8, lines.next() orelse "", "\r");
    const la = a.len;
    const lb = b.len;
    const width = lb + 1;

    const edit = try gpa.alloc(usize, (la + 1) * width);
    defer gpa.free(edit);
    @memset(edit, 0);
    // turning a prefix into nothing costs one deletion per character
    for (0..la + 1) |i| edit[i * width] = i;
    for (0..lb + 1) |j| edit[j] = j;
    for (1..la + 1) |i| {
        for (1..lb + 1) |j| {
            if (a[i - 1] == b[j - 1]) {
                edit[i * width + j] = edit[(i - 1) * width + (j - 1)];
            } else {
                const replace = edit[(i - 1) * width + (j - 1)];
                const delete = edit[(i - 1) * width + j];
                const insert = edit[i * width + (j - 1)];
                edit[i * width + j] = 1 + @min(replace, @min(delete, insert));
            }
        }
    }

    const lcs = try gpa.alloc(usize, (la + 1) * width);
    defer gpa.free(lcs);
    @memset(lcs, 0);
    for (1..la + 1) |i| {
        for (1..lb + 1) |j| {
            if (a[i - 1] == b[j - 1]) {
                lcs[i * width + j] = lcs[(i - 1) * width + (j - 1)] + 1;
            } else {
                lcs[i * width + j] = @max(lcs[(i - 1) * width + j], lcs[i * width + (j - 1)]);
            }
        }
    }

    try w.print("{d}\n", .{edit[la * width + lb]});
    try w.print("LCS {d}\n", .{lcs[la * width + lb]});
}
'''
hints = [
  "edit[i][0] = i and edit[0][j] = j: turning a prefix into nothing costs one deletion per character.",
