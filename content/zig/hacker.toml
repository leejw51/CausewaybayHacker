solution     = '''
const std = @import("std");

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

// compressed adjacency: the edges of node u are to[start[u]..start[u+1]]
const Graph = struct {
    start: []u32,
    to: []u32,
    weight: []i64,

    fn deinit(self: *Graph, gpa: std.mem.Allocator) void {
        gpa.free(self.start);
        gpa.free(self.to);
        gpa.free(self.weight);
    }
};

fn build(gpa: std.mem.Allocator, n: usize, m: usize, seed: u64) !Graph {
    // draw every edge once into three flat slices, then bucket by endpoint
    const ea = try gpa.alloc(u32, m);
    defer gpa.free(ea);
    const eb = try gpa.alloc(u32, m);
    defer gpa.free(eb);
    const ew = try gpa.alloc(i64, m);
    defer gpa.free(ew);
    var rng = Rng{ .x = seed };
    var i: usize = 1;
    while (i < n) : (i += 1) {
        ea[i - 1] = @intCast(rng.next() % i);
        eb[i - 1] = @intCast(i);
        ew[i - 1] = @intCast(rng.next() % 1000 + 1);
    }
    var e: usize = n - 1;
    while (e < m) : (e += 1) {
        ea[e] = @intCast(rng.next() % n);
        eb[e] = @intCast(rng.next() % n);
        ew[e] = @intCast(rng.next() % 1000 + 1);
    }

    const start = try gpa.alloc(u32, n + 1);
    @memset(start, 0);
    for (ea, eb) |a, b| {
        start[a + 1] += 1;
        start[b + 1] += 1;
    }
    for (1..n + 1) |u| start[u] += start[u - 1];
    const to = try gpa.alloc(u32, 2 * m);
    const weight = try gpa.alloc(i64, 2 * m);
    const fill = try gpa.alloc(u32, n);
    defer gpa.free(fill);
    @memcpy(fill, start[0..n]);
    for (ea, eb, ew) |a, b, wt| {
        to[fill[a]] = b;
        weight[fill[a]] = wt;
        fill[a] += 1;
        to[fill[b]] = a;
        weight[fill[b]] = wt;
        fill[b] += 1;
    }
    return .{ .start = start, .to = to, .weight = weight };
}

// (distance, node), smallest distance on top
const Entry = struct { d: i64, u: u32 };

fn byDistance(_: void, a: Entry, b: Entry) std.math.Order {
    return std.math.order(a.d, b.d);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const m = try std.fmt.parseInt(usize, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    var graph = try build(gpa, n, m, seed);
    defer graph.deinit(gpa);

    const inf = std.math.maxInt(i64);
    const dist = try gpa.alloc(i64, n);
    defer gpa.free(dist);
    @memset(dist, inf);
    dist[0] = 0;

    var heap: std.PriorityQueue(Entry, void, byDistance) = .empty;
    defer heap.deinit(gpa);
    try heap.push(gpa, .{ .d = 0, .u = 0 });
    while (heap.pop()) |top| {
        // a stale entry: we already found a shorter way to u
        if (top.d > dist[top.u]) continue;
        var k = graph.start[top.u];
        const end = graph.start[top.u + 1];
        while (k < end) : (k += 1) {
            const v = graph.to[k];
            const nd = top.d + graph.weight[k];
            if (nd < dist[v]) {
                dist[v] = nd;
                try heap.push(gpa, .{ .d = nd, .u = v });
            }
        }
    }

    var sum: i64 = 0;
    var max: i64 = 0;
    for (dist) |d| {
        if (d < inf) {
            sum += d;
            max = @max(max, d);
        }
    }
    try w.print("{d}\n", .{sum});
    try w.print("MAX {d}\n", .{max});
}
'''
