strictly larger? Then one line per query: `<value> FOUND <depth>` if the
search finds it, `<value> ABSENT` if it does not, where the root is depth 1.

The search is the binary search the tree is for: start at the root, go left
when the value is smaller and right otherwise, and stop when you land on it
or on a missing node — a `-1`, or an index past the end of the slice. On an
INVALID tree that walk can pass by a value that is sitting in the slice, and
the answer is still `ABSENT`: the query asks what the lookup finds, not what
a scan of the slice would find. One of the hidden cases is exactly that.

```
