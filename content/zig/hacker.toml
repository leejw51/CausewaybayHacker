solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const cases = try std.fmt.parseInt(usize, it.next().?, 10);

    var t: usize = 0;
    while (t < cases) : (t += 1) {
        // fresh for every case, and handed back at the end of every case
        var distinct = std.AutoHashMap(i64, void).init(gpa);
        defer distinct.deinit();

        const n = try std.fmt.parseInt(usize, it.next().?, 10);
        var i: usize = 0;
        while (i < n) : (i += 1) {
            try distinct.put(try std.fmt.parseInt(i64, it.next().?, 10), {});
        }

        if (distinct.count() < 2) {
            try w.print("NONE\n", .{});
        } else {
            // the keys are distinct, so one pass keeping the top two is enough
            var largest: i64 = std.math.minInt(i64);
            var second: i64 = std.math.minInt(i64);
            var keys = distinct.keyIterator();
            while (keys.next()) |key| {
                if (key.* > largest) {
                    second = largest;
                    largest = key.*;
                } else if (key.* > second) {
                    second = key.*;
                }
            }
            try w.print("{d}\n", .{second});
        }
    }
    try w.print("CASES {d}\n", .{cases});
}
'''
