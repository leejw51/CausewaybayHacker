solution     = '''
const std = @import("std");

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

const Best = struct { len: usize = 0, start: usize = 0 };

fn expand(s: []const u8, left: usize, right: usize, best: *Best) void {
    // s[i..=j] is a palindrome; widen it one step each way while it stays one
    if (right >= s.len or s[left] != s[right]) return;
    var i = left;
    var j = right;
    while (i > 0 and j + 1 < s.len and s[i - 1] == s[j + 1]) {
        i -= 1;
        j += 1;
    }
    const len = j - i + 1;
    // only a strictly longer one replaces the best, so the leftmost stays
    if (len > best.len) {
        best.len = len;
        best.start = i;
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const alphabet = try std.fmt.parseInt(u64, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    var rng = Rng{ .x = seed };
    const s = try gpa.alloc(u8, n);
    defer gpa.free(s);
    for (s) |*c| c.* = 'a' + @as(u8, @intCast(rng.next() % alphabet));

    var best = Best{};
    for (0..n) |centre| {
        expand(s, centre, centre, &best); // odd length: one character at the middle
        expand(s, centre, centre + 1, &best); // even length: the gap to the right of it
    }

    try w.print("{d}\n", .{best.len});
    try w.print("AT {d}\n", .{best.start});
}
