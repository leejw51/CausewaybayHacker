brief        = '''
Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in `u64` arithmetic with the
**wrapping** operators `*%` and `+%`:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Print the length of the longest **strictly increasing subsequence** — the
values keep their order but need not be adjacent. Then print
`TAILS <k>` where `k` is that same length, read off the patience-sorting pile
count.

```
input:  8 1
output: 3
        TAILS 3
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`,
and the longest run up inside it is `93944146 392341189 822192870`. Check your
generator against that line before you go looking for a bug in your algorithm.

**This quest enforces its complexity.** The starter is the `O(n²)` table — the
answer you should be able to write cold, and it is not wrong. At `n = 200000`
it would print the same `881` the fast one prints, after `2 × 10^10`
comparisons, and in a Debug build with every bounds check on it does not come
back inside the five second run limit. What you see is a timeout and not a
wrong answer. That is the failure this question exists to produce.

The `O(n log n)` one keeps, for each length, the smallest value a subsequence
of that length can end on — a list that is always sorted, so the position of a
new value is a binary search, and `std.sort.lowerBound` is that search. It
does `n = 200000` in **0.04 s**, measured on this machine with the program
that ships in this quest.

One note on the generator, because it is the half of this question Zig adds.
A plain `*` or `+` on a `u64` that overflows is not a wrap here: it is
`panic: integer overflow`, in Debug, on the first step. The generator means
the wrap, so it says so — `x *% 6364136223846793005 +% 1442695040888963407`
— and the compiler holds you to the difference. Generate in `u64`, take the
modulus, then `@intCast` to `i64`.
'''
