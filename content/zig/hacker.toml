solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(u64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(u64, it.next().?, 10);

    var alone: u64 = 0;
    for (nums) |v| alone ^= v;

    // clearing the lowest set bit once per set bit
    var bits: usize = 0;
    var walk = alone;
    while (walk != 0) : (walk &= walk -% 1) bits += 1;

    const power_of_two = alone != 0 and (alone & (alone -% 1)) == 0;
    const cleared: u64 = if (alone == 0) 0 else alone & (alone -% 1);

    try w.print("{d}\n", .{alone});
    try w.print("{d}\n", .{bits});
    try w.print("POW2 {s}\n", .{if (power_of_two) "YES" else "NO"});
    try w.print("{d}\n", .{cleared});
}
'''
