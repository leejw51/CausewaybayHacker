solution     = '''
const std = @import("std");

const Node = struct {
    value: i64,
    next: ?*Node,
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const values = try gpa.alloc(i64, n);
    defer gpa.free(values);
    for (values) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    // build it back to front, so each new node points at what we had
    var head: ?*Node = null;
    var i = values.len;
    while (i > 0) {
        i -= 1;
        const node = try gpa.create(Node);
        node.* = .{ .value = values[i], .next = head };
        head = node;
    }

    // walk it to count, and run a second pointer at half speed for the middle
    var length: usize = 0;
    var slow = head;
    var fast = head;
    while (fast) |f| {
        length += 1;
        fast = f.next;
        if (fast) |g| {
            length += 1;
            fast = g.next;
            slow = slow.?.next;
        }
    }
    const middle: i64 = if (slow) |s| s.value else 0;

    // reverse by unlinking nodes off the front of one list onto the front of another
    var reversed: ?*Node = null;
    while (head) |node| {
        head = node.next;
        node.next = reversed;
        reversed = node;
    }

    var first = true;
    var walk = reversed;
    while (walk) |node| : (walk = node.next) {
        if (!first) try w.print(" ", .{});
        try w.print("{d}", .{node.value});
        first = false;
    }
    try w.print("\n", .{});
    try w.print("{d}\n", .{middle});
    try w.print("LEN {d}\n", .{length});

    // every node was paid for; hand each one back
    while (reversed) |node| {
        reversed = node.next;
        gpa.destroy(node);
    }
}
'''
hints = [
  "Building back to front is the easy direction: each new node takes the old head as its next. Count the values down from n, since a usize cannot step below zero.",
  "To reverse: remember the rest (head = node.next), point the node at the reversed list, and make it the new reversed head. Three writes per node, and no node is ever in both lists.",
  "For the middle, advance slow only on the steps where fast managed two.",
  "Nothing frees a node for you. After printing, walk the reversed list and gpa.destroy each node; in a Debug build the allocator reports every one you miss.",
]

