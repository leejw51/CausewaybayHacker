solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const grid = try gpa.alloc(i64, n * n);
    defer gpa.free(grid);
    for (grid) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    // the spiral wants the original, so keep a copy before rotating in place
    const original = try gpa.dupe(i64, grid);
    defer gpa.free(original);

    // transpose: swap only above the diagonal
    for (0..n) |r| {
        for (r + 1..n) |c| std.mem.swap(i64, &grid[r * n + c], &grid[c * n + r]);
    }
    for (0..n) |r| {
        const row = grid[r * n .. r * n + n];
        std.mem.reverse(i64, row);
        for (row, 0..) |v, c| {
            if (c > 0) try w.print(" ", .{});
            try w.print("{d}", .{v});
        }
        try w.print("\n", .{});
    }

    // the spiral's bounds run in i64: bottom and right go to -1 on the way out
    const side: i64 = @intCast(n);
    var top: i64 = 0;
    var bottom: i64 = side - 1;
    var left: i64 = 0;
    var right: i64 = side - 1;
    var first = true;
    while (top <= bottom and left <= right) {
        var c = left;
        while (c <= right) : (c += 1) {
            if (!first) try w.print(" ", .{});
            try w.print("{d}", .{original[@intCast(top * side + c)]});
            first = false;
        }
        top += 1;
        var r = top;
        while (r <= bottom) : (r += 1) try w.print(" {d}", .{original[@intCast(r * side + right)]});
        right -= 1;
        if (top <= bottom) {
            c = right;
            while (c >= left) : (c -= 1) try w.print(" {d}", .{original[@intCast(bottom * side + c)]});
            bottom -= 1;
        }
        if (left <= right) {
            r = bottom;
            while (r >= top) : (r -= 1) try w.print(" {d}", .{original[@intCast(r * side + left)]});
            left += 1;
        }
    }
    try w.print("\n", .{});
}
'''
hints = [
  "Transpose by swapping only above the diagonal — c starting at r + 1 — or you swap everything back.",
  "The spiral wants the original grid, so gpa.dupe a copy before you rotate in place.",
  "The two if guards inside the spiral loop are what stop a single middle row or column being walked twice — and the bounds are i64 because right and bottom legitimately reach -1.",
]

