solution     = '''
const std = @import("std");

const Node = struct {
    children: [26]i32 = [_]i32{-1} ** 26,
    through: usize = 0,
    terminal: bool = false,
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const q = try std.fmt.parseInt(usize, it.next().?, 10);

    var nodes: std.ArrayList(Node) = .empty;
    defer nodes.deinit(gpa);
    try nodes.append(gpa, .{});

    var i: usize = 0;
    while (i < n) : (i += 1) {
        const word = it.next().?;
        var at: usize = 0;
        for (word) |ch| {
            const slot = ch - 'a';
            if (nodes.items[at].children[slot] == -1) {
                // append may move the list, so the index is taken first and
                // nodes.items[at] is re-read after, never held across the append
                try nodes.append(gpa, .{});
                nodes.items[at].children[slot] = @intCast(nodes.items.len - 1);
            }
            at = @intCast(nodes.items[at].children[slot]);
            nodes.items[at].through += 1;
        }
        nodes.items[at].terminal = true;
    }

    var k: usize = 0;
    while (k < q) : (k += 1) {
        const kind = it.next().?;
        const text = it.next().?;

        var at: i32 = 0;
        for (text) |ch| {
            if (at == -1) break;
            at = nodes.items[@intCast(at)].children[ch - 'a'];
        }

        if (std.mem.eql(u8, kind, "WORD")) {
            const hit = at != -1 and nodes.items[@intCast(at)].terminal;
            try w.print("{s}\n", .{if (hit) "YES" else "NO"});
        } else {
            const count: usize = if (at == -1) 0 else nodes.items[@intCast(at)].through;
            try w.print("{d}\n", .{count});
        }
    }

    try w.print("NODES {d}\n", .{nodes.items.len});
}
'''
hints = [
  "Store the nodes in one ArrayList and let children hold indices. A pointer into .items taken before append is a pointer into memory the list may have given back.",
  "through is bumped on the node you step onto, so the root never counts itself.",
  "A query that falls off the trie leaves at == -1, and -1 answers NO and 0 without a special case.",
]

