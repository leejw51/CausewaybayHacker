'''
solution     = '''
const std = @import("std");

fn search(grid: [][]u8, r: usize, c: usize, word: []const u8, at: usize) bool {
    if (grid[r][c] != word[at]) return false;
    if (at + 1 == word.len) return true;

    const here = grid[r][c];
    grid[r][c] = '#';

    // `or` short-circuits, so the first direction that spells the rest of
    // the word stops the other three from being tried at all
    const rows = grid.len;
    const cols = grid[0].len;
    const found = (r > 0 and search(grid, r - 1, c, word, at + 1)) or
        (r + 1 < rows and search(grid, r + 1, c, word, at + 1)) or
        (c > 0 and search(grid, r, c - 1, word, at + 1)) or
        (c + 1 < cols and search(grid, r, c + 1, word, at + 1));

    grid[r][c] = here;
    return found;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const rows = try std.fmt.parseInt(usize, it.next().?, 10);
    const cols = try std.fmt.parseInt(usize, it.next().?, 10);
    // mutable copies of the rows, so a cell can be marked
    const grid = try gpa.alloc([]u8, rows);
    defer gpa.free(grid);
    for (grid) |*row| row.* = try gpa.dupe(u8, it.next().?);
    defer for (grid) |row| gpa.free(row);
    const word = it.next().?;

    // count the starting letters before any cell is marked
    var starts: usize = 0;
    for (grid) |row| {
        for (row) |cell| {
            if (cell == word[0]) starts += 1;
        }
    }

    var found = false;
    var r: usize = 0;
    while (r < rows and !found) : (r += 1) {
        var c: usize = 0;
        while (c < cols and !found) : (c += 1) {
            found = search(grid, r, c, word, 0);
        }
    }

    try w.print("{s}\n", .{if (found) "FOUND" else "ABSENT"});
    try w.print("STARTS {d}\n", .{starts});
}
'''
hints = [
  "Overwrite the cell with a byte the word cannot contain, recurse, then put the original back.",
  "Count the starting letters in a separate pass before you search, or the '#' marks will confuse the count.",
  "The success base case is at + 1 == word.len — checked after matching this cell, not before.",
  "Chain the four directions with `or` rather than four ifs and a found flag: `or` already stops at the first branch that succeeds. The r > 0 and c > 0 guards go first, because r - 1 on a usize of 0 is a panic.",
]

