[[quest]]
id           = "zig.hacker.28.lru"
node         = 34
title        = "THE TOLL"
difficulty   = 5
time_limit_s = 1800
story        = "Room 7-32, the seventh interview, last question. A cache that has to evict the right thing, every node paid for and handed back, and the clock."
concepts     = ["collections", "linked-lists", "complexity"]
requires     = ["zig.hacker.34.stable-sort", "zig.hacker.24.inversions"]
map          = { x = 0.818, y = 0.870, kind = "boss" }
brief        = '''
Line one is `cap q`. The next `q` lines are `PUT <key> <value>` or
`GET <key>`.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The textbook answer is a hash map into a **doubly linked list**, and Zig has
the real thing, with nothing hidden: `std.DoublyLinkedList` is **intrusive**.
The list does not allocate nodes; you embed a `std.DoublyLinkedList.Node` —
two pointers, `prev` and `next` — inside your own struct, which you `create`
with the allocator and `destroy` yourself. `remove` then `prepend` on that
node is `std::list::splice` to the front, `pop()` hands back the last node,
and every one of them is O(1) without a byte of allocation, so you can say
O(1) per operation out loud without hedging. To get from a `*Node` back to
the entry that holds the key, `@fieldParentPtr("node", node_ptr)` walks the
pointer backwards by the field's offset. The map is then
`std.AutoHashMap(i64, *Entry)`.

**The starter is the boss.** It has the map, the list, the `create` and the
`destroy`, and it prints `20` for `GET 2` in the sample. It never *touches*
a key: a `GET` reads the value where it lies, an overwrite writes it in
place, and the list stays in the order the keys arrived. So the barrier
remembers who came in first and lets that one out first — a queue, not a
cache — and evicts `1`, which was used a moment ago, instead of `2`. The fix
is the two lines the textbook draws an arrow for: on every hit, `remove` the
node and `prepend` it.

Two things to get right that the Rust interview did not ask of you. The
entry holds the key **as well as** the value, because eviction starts from
the list and has to know which map entry to remove. And the order of the
three steps matters: `pop()` the node, read the key through
`@fieldParentPtr`, `remove` it from the map, *then* `gpa.destroy` the entry
— the other way round is a read through a pointer the allocator has already
taken back, and nothing catches that read for you: it hands back whatever
is in that memory now, which is the one mistake in this land that does not
announce itself. Every entry you created is destroyed by the time `main`
returns; what the `DebugAllocator` behind `init.gpa` *does* name is every
one you forget, and that list is the toll.

The cases here are small and the clock is not measuring speed: four operations
cannot tell a linked list apart from a slice you scan from the front. The
`O(1)` in the paragraph above is the sentence you say out loud in the
room, so it has to be true of the code you wrote rather than of the code that
happened to clear four cases.
'''
starter      = '''
const std = @import("std");

// the list is intrusive: the node lives inside the entry, and the entry
// carries the key so an eviction can find its map slot
const Entry = struct {
    key: i64,
    value: i64,
    node: std.DoublyLinkedList.Node = .{},
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const capacity = try std.fmt.parseInt(usize, it.next().?, 10);
    const q = try std.fmt.parseInt(usize, it.next().?, 10);

    // front is the most recently used
    var recent: std.DoublyLinkedList = .{};
    var where = std.AutoHashMap(i64, *Entry).init(gpa);
    defer where.deinit();
    var evicted: usize = 0;

    var i: usize = 0;
    while (i < q) : (i += 1) {
        const op = it.next().?;
        const key = try std.fmt.parseInt(i64, it.next().?, 10);

        if (std.mem.eql(u8, op, "GET")) {
            if (where.get(key)) |entry| {
                // read where it lies: the list is not told about the hit
                try w.print("{d}\n", .{entry.value});
            } else {
                try w.print("-1\n", .{});
            }
            continue;
        }

        const value = try std.fmt.parseInt(i64, it.next().?, 10);
        if (where.get(key)) |entry| {
            entry.value = value;
            continue;
        }
        if (where.count() >= capacity) {
            const oldest = recent.pop().?;
            const entry: *Entry = @fieldParentPtr("node", oldest);
            _ = where.remove(entry.key);
            gpa.destroy(entry);
            evicted += 1;
        }
        const entry = try gpa.create(Entry);
        entry.* = .{ .key = key, .value = value };
        recent.prepend(&entry.node);
        try where.put(key, entry);
    }

    if (recent.first == null) {
        try w.print("-\n", .{});
    } else {
        var first = true;
        var walk = recent.first;
        while (walk) |node| : (walk = node.next) {
            const entry: *Entry = @fieldParentPtr("node", node);
            if (!first) try w.print(" ", .{});
            try w.print("{d}", .{entry.key});
            first = false;
        }
        try w.print("\n", .{});
    }
    try w.print("EVICTED {d}\n", .{evicted});

    // every entry was paid for; hand each one back
    while (recent.pop()) |node| {
        const entry: *Entry = @fieldParentPtr("node", node);
        gpa.destroy(entry);
    }
}
'''
solution     = '''
const std = @import("std");

// the list is intrusive: the node lives inside the entry, and the entry
// carries the key so an eviction can find its map slot
const Entry = struct {
    key: i64,
    value: i64,
    node: std.DoublyLinkedList.Node = .{},
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const capacity = try std.fmt.parseInt(usize, it.next().?, 10);
    const q = try std.fmt.parseInt(usize, it.next().?, 10);

    // front is the most recently used
    var recent: std.DoublyLinkedList = .{};
    var where = std.AutoHashMap(i64, *Entry).init(gpa);
    defer where.deinit();
    var evicted: usize = 0;

    var i: usize = 0;
    while (i < q) : (i += 1) {
        const op = it.next().?;
        const key = try std.fmt.parseInt(i64, it.next().?, 10);

        if (std.mem.eql(u8, op, "GET")) {
            if (where.get(key)) |entry| {
                // the touch: unlink the node and put it back at the front
                recent.remove(&entry.node);
                recent.prepend(&entry.node);
                try w.print("{d}\n", .{entry.value});
            } else {
                try w.print("-1\n", .{});
            }
            continue;
        }

        const value = try std.fmt.parseInt(i64, it.next().?, 10);
        if (where.get(key)) |entry| {
            // an overwrite is a touch too, and never an eviction
            entry.value = value;
            recent.remove(&entry.node);
            recent.prepend(&entry.node);
            continue;
        }
        if (where.count() >= capacity) {
            // pop the node, read the key through it, drop the map slot,
            // and only then hand the entry back
            const oldest = recent.pop().?;
            const entry: *Entry = @fieldParentPtr("node", oldest);
            _ = where.remove(entry.key);
            gpa.destroy(entry);
            evicted += 1;
        }
        const entry = try gpa.create(Entry);
        entry.* = .{ .key = key, .value = value };
        recent.prepend(&entry.node);
        try where.put(key, entry);
    }

    if (recent.first == null) {
        try w.print("-\n", .{});
    } else {
        var first = true;
        var walk = recent.first;
        while (walk) |node| : (walk = node.next) {
            const entry: *Entry = @fieldParentPtr("node", node);
            if (!first) try w.print(" ", .{});
            try w.print("{d}", .{entry.key});
            first = false;
        }
        try w.print("\n", .{});
    }
    try w.print("EVICTED {d}\n", .{evicted});

    // every entry was paid for; hand each one back
    while (recent.pop()) |node| {
        const entry: *Entry = @fieldParentPtr("node", node);
        gpa.destroy(entry);
    }
}
'''
hints = [
  "Run the sample by hand against the starter. GET 1 prints 10 and leaves 1 at the back of the list, so PUT 3 evicts 1 — the barrier is a queue, not a cache.",
  "recent.remove(&entry.node) then recent.prepend(&entry.node) moves the entry to the front in O(1), and the map's pointer to it is still good afterwards. That pair of calls goes on every hit and every overwrite.",
  "Overwriting a key that is already present is not an eviction — check the map before you decide the cache is full.",
  "Eviction: pop() the last node, @fieldParentPtr back to the entry, remove its key from the map, then gpa.destroy it. After destroy the pointer the map held is a freed address, so the map slot has to go first.",
]

