[[quest]]
id           = "zig.hacker.02.window"
node         = 2
title        = "NO REPEATS"
difficulty   = 4
time_limit_s = 900
story        = "The second question is on the board before the marker is back in the tray."
concepts     = ["two-pointers", "strings", "complexity"]
requires     = ["zig.hacker.01.two-sum"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief        = '''
One line of text, no spaces.

Print the length of the longest run of characters with no repeat in it, then
the run itself. If several runs tie, print the leftmost.

```
input:  abcabcbb
output: 3
        abc
```

The window only ever moves right. If you find yourself rescanning from the
start after a repeat, you have written the quadratic one.

The cases here are small, and the clock is not measuring speed. Nor could it:
on a random string the rescanning version never has more than a few characters
to rescan before it hits a repeat, so it finishes as fast as the window does
at any size. What these four cases check is the length, the leftmost tie-break
and the run itself. Write the window anyway. It is `O(n)` on every input
rather than on most of them, and the input a real screen hands you is chosen
to be unkind.

The text is bytes, so the "last seen at" table needs no hash map: an array of
256 optionals, `[_]?usize{null} ** 256`, indexed by the byte, and `null` is
"never seen". The run at the end is a slice of the input,
`text[start .. start + len]`, not a copy.
'''
starter      = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    const text = std.mem.trim(u8, input, " \r\n\t");

    // where each byte was last seen; null is never
    var last = [_]?usize{null} ** 256;
    _ = &last;

    // print the best length, then the run itself
    try w.print("0\n?\n", .{});
    _ = text;
}
'''
solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    const text = std.mem.trim(u8, input, " \r\n\t");

    // where each byte was last seen; null is never
    var last = [_]?usize{null} ** 256;
    var start: usize = 0;
    var best_len: usize = 0;
    var best_start: usize = 0;

    for (text, 0..) |c, i| {
        if (last[c]) |previous| {
            // a repeat only matters if it is inside the current window
            if (previous >= start) start = previous + 1;
        }
        last[c] = i;
        const len = i - start + 1;
        if (len > best_len) {
            best_len = len;
            best_start = start;
        }
    }

    try w.print("{d}\n", .{best_len});
    try w.print("{s}\n", .{text[best_start .. best_start + best_len]});
}
'''
hints = [
  "Keep the index where each byte was last seen, and the index the window starts at.",
  "A repeat only matters if its last position is inside the current window — that is the previous >= start test, inside the if that unwraps the optional.",
  "Record the best length and where it started, or you cannot print the run at the end; a slice of text does the rest.",
]

