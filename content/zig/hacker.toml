solution     = '''
const std = @import("std");

const Item = struct { weight: usize, value: i64 };

// ratio compared without dividing: b.value * a.weight vs a.value * b.weight
fn byRatio(_: void, a: Item, b: Item) bool {
    const left = b.value * @as(i64, @intCast(a.weight));
    const right = a.value * @as(i64, @intCast(b.weight));
    if (left != right) return left < right; // a's ratio is larger
    return a.weight < b.weight;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const cap = try std.fmt.parseInt(usize, it.next().?, 10);
    const items = try gpa.alloc(Item, n);
    defer gpa.free(items);
    for (items) |*item| {
        item.weight = try std.fmt.parseInt(usize, it.next().?, 10);
        item.value = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    const best = try gpa.alloc(i64, cap + 1);
    defer gpa.free(best);
    @memset(best, 0);
    for (items) |item| {
        // downwards, so this item cannot be picked up twice in one pass
        var room = cap;
        while (room >= item.weight) : (room -= 1) {
            best[room] = @max(best[room], best[room - item.weight] + item.value);
            if (room == 0) break;
        }
    }

    const order = try gpa.dupe(Item, items);
    defer gpa.free(order);
    std.mem.sort(Item, order, {}, byRatio);
    var room = cap;
    var greedy: i64 = 0;
    for (order) |item| {
        if (item.weight <= room) {
            room -= item.weight;
            greedy += item.value;
        }
    }

    try w.print("{d}\n", .{best[cap]});
    try w.print("GREEDY {d}\n", .{greedy});
}
'''
hints = [
  "Walking the capacities downwards is what makes it 0/1 instead of unbounded. Upwards lets the same item be reused.",
  "Compare ratios without dividing: b.value * a.weight against a.value * b.weight, so there is no floating point in the answer. Sort a gpa.dupe of the items, not the items themselves.",
  "The greedy pass is a straight loop over the sorted items — no backtracking, which is exactly why it is wrong.",
]

