map          = { x = 0.801, y = 0.447, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` non-negative integers, in which every value
appears exactly twice except one.

Print four lines:

1. the value that appears once, found with **xor** and constant extra space
2. how many `1` bits are set in it
3. `POW2 YES` if it is a power of two, `POW2 NO` otherwise (`0` is not)
4. the value with its lowest set bit cleared, or `0` if it has none

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` and `x ^ 0 == x`, and xor does not care what order it happens in.
That is the whole first line. `x & (x - 1)` clears the lowest set bit, which
gives you the third and fourth lines for free. Do it all in `u64` — and
write that subtraction as `x -% 1`, because `0 - 1` on a `u64` is `panic:
integer overflow` in this land, and the `-%` is how you say you meant the
wrap. Guard the zero case anyway; the wrap is only there so the expression
is legal.

The cases here are small and the clock is not measuring speed. There is no big
hidden case and there cannot be one built the way this pack builds them: an
array that is pairs-plus-one is *constructed*, not generated, and two lands
constructing it would not construct the same array. So these cases check the
four lines and their edges — `0` is not a power of two, and a value with no
set bits stays `0` when you clear the lowest one. The xor is still the answer;
counting occurrences in a nested loop is `O(n²)` and dies at a real `n`.
'''
