solution     = '''
const std = @import("std");

const P: u64 = 1000000007;

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

// base^exp mod P, by repeated squaring: about 30 steps for a 30-bit exponent.
fn power(base_in: u64, exp_in: u64) u64 {
    var result: u64 = 1;
    var base = base_in % P;
    var exp = exp_in;
    while (exp > 0) : (exp >>= 1) {
        if (exp & 1 == 1) result = result * base % P;
        base = base * base % P;
    }
    return result;
}

// P is prime, so Fermat gives v^(P-2) as the inverse of v.
fn inverse(v: u64) u64 {
    return power(v, P - 2);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(u64, it.next().?, 10);
    const q = try std.fmt.parseInt(u64, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    // one shared factorial table for every query
    const factorial = try gpa.alloc(u64, n + 1);
    defer gpa.free(factorial);
    factorial[0] = 1;
    var i: usize = 1;
    while (i <= n) : (i += 1) {
        factorial[i] = factorial[i - 1] * @as(u64, i) % P;
    }

    var rng = Rng{ .x = seed };
    var sum: u64 = 0;
    var last: u64 = 0;
    var k: u64 = 0;
    while (k < q) : (k += 1) {
        const a = rng.next() % (n + 1);
        const b = rng.next() % (a + 1);

        const value = factorial[a] * inverse(factorial[b]) % P * inverse(factorial[a - b]) % P;

        sum = (sum + value) % P;
        last = value;
    }

    try w.print("{d}\n", .{sum});
    try w.print("LAST {d}\n", .{last});
}
'''
hints = [
  "Reduce after every multiplication, never at the end. A u64 holds the product of two values below P; it does not hold a factorial, and the overflow is a panic.",
  "inverse(v) is power(v, P - 2), and it only works because P is prime — that is the whole content of Fermat's little theorem here.",
  "Precomputing inverse factorials as well, backwards from inverse(factorial[n]), removes the two power() calls per query. Not needed to pass, and worth saying out loud.",
]

