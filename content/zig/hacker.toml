node         = 19
title        = "WHAT FITS IN THE BAG"
difficulty   = 5
time_limit_s = 1200
story        = "One rider, one bag, and a board of orders each with a weight and a tip. Greedy picks the wrong ones."
concepts     = ["dynamic-programming", "greedy", "slices"]
requires     = ["zig.hacker.18.edit-distance"]
