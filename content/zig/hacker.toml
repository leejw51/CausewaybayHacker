[[quest]]
id           = "zig.hacker.16.union-find"
node         = 16
title        = "WHO IS CONNECTED TO WHOM"
difficulty   = 5
time_limit_s = 1200
story        = "The tram network, the MTR and the minibus routes on one sheet. How many separate networks are there really."
concepts     = ["disjoint-set", "graphs", "complexity"]
requires     = ["zig.hacker.15.topo-sort"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief        = '''
Line one is `n m`: `n` stops numbered `0..n-1`, `m` undirected links. The next
`m` lines are `<a> <b>`.

Print three lines: how many separate networks there are, the size of the
largest, and `REDUNDANT <k>` — how many of the links joined two stops that
were already connected.

```
input:  6 4
        0 1
        1 2
        3 4
        0 2
output: 3
        3
        REDUNDANT 1
```

Union-find: every stop points at a parent, `find` walks to the root, `union`
points one root at the other. Compress the path on the way back out of `find`
and the whole thing is effectively constant time per query.

The cases here are small and the clock is not measuring speed — a `find` that
walks without compressing would clear all four, and so would rescanning the
whole slice for each query. Compress anyway. The paragraph above is a claim
about a hundred thousand stops and a hundred thousand links, and it is the
claim you will be asked to defend, not these four lines.

`parent` starts as the identity — `for (parent, 0..) |*p, i| p.* = i;` is
Zig's `iota` — and `find` takes the slice, not a copy, because it writes
into it.
'''
starter      = '''
const std = @import("std");

fn find(parent: []usize, x: usize) usize {
    // walk to the root, and flatten what you walked over
    _ = parent;
    return x;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const m = try std.fmt.parseInt(usize, it.next().?, 10);

    const parent = try gpa.alloc(usize, n);
    defer gpa.free(parent);
    for (parent, 0..) |*p, i| p.* = i;
    const size = try gpa.alloc(usize, n);
    defer gpa.free(size);
    @memset(size, 1);
    const redundant: usize = 0;

    var e: usize = 0;
    while (e < m) : (e += 1) {
        const a = try std.fmt.parseInt(usize, it.next().?, 10);
        const b = try std.fmt.parseInt(usize, it.next().?, 10);
        _ = find(parent, a);
        _ = find(parent, b);
