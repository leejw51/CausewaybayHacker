solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const target = try std.fmt.parseInt(usize, it.next().?, 10);
    const coins = try gpa.alloc(usize, n);
    defer gpa.free(coins);
    for (coins) |*c| c.* = try std.fmt.parseInt(usize, it.next().?, 10);

    // never = this amount cannot be made
    const never: i64 = std.math.maxInt(i64);
    const best = try gpa.alloc(i64, target + 1);
    defer gpa.free(best);
    @memset(best, never);
    best[0] = 0;

    var amount: usize = 1;
    while (amount <= target) : (amount += 1) {
        for (coins) |coin| {
            // test the cell before adding to it: never + 1 is a panic
            if (coin <= amount and best[amount - coin] != never) {
                const candidate = best[amount - coin] + 1;
                if (candidate < best[amount]) best[amount] = candidate;
            }
        }
    }

    if (best[target] == never) {
        try w.print("-1\n", .{});
    } else {
        try w.print("{d}\n", .{best[target]});
    }
    var reach: usize = 0;
    for (best) |v| {
        if (v != never) reach += 1;
    }
    try w.print("REACH {d}\n", .{reach});
}
'''
hints = [
  "best[0] = 0, and best[a] is one more than the cheapest best[a - coin] over every coin that fits.",
