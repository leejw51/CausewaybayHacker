two hundred thousand separate `ArrayList`s cost more than the algorithm, so
the starter already builds a **compressed** adjacency — three flat slices,
where the edges of `u` are `to[start[u] .. start[u + 1]]` — and the heap
version reads the same slices. And `std.PriorityQueue` is a min-heap on
whatever order you give it, so a `(distance, node)` entry ordered by
distance needs no reversal. It has no decrease-key, and you do not need one:
push the improved distance as a new entry and skip any entry you pop whose
