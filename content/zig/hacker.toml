    const items = try gpa.alloc(Item, n);
    defer gpa.free(items);
    for (items) |*item| {
        item.weight = try std.fmt.parseInt(usize, it.next().?, 10);
        item.value = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    const best = try gpa.alloc(i64, cap + 1);
    defer gpa.free(best);
