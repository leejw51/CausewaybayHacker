Line one is `n`. Line two is `n` integers.

Print three lines, each to **six decimal places**: the mean, the **population**
standard deviation (divide by `n`, not `n - 1`), and the median — which for an
even `n` is the average of the two middle values.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

This quest is judged with `match = "float:1e-6"`, so the comparison is
numeric: `3.8` and `3.800000` both pass, and a value that is off by `1e-7`
passes too. That is deliberate — the point is not your formatter, it is that
`@divTrunc(sum, n)` in integer arithmetic gives `3`, and that the even-length
median is a boundary people get wrong under a clock.

`{d:.6}` is the formatter — `try w.print("{d:.6}\n", .{mean})` prints a
`f64` to six places. The other half is that Zig will not mix integers and
floats for you: `@floatFromInt(v)` is how an `i64` becomes an `f64`, and the
division happens after it, not before. Population, not sample. Read the
statement twice; on a real screen the difference between `/ n` and
`/ (n - 1)` is the whole submission.
