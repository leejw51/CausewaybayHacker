map          = { x = 0.953, y = 0.667, kind = "quest" }
brief        = '''
Line one is `n q`. The next `n` lines are lowercase words to insert. The next
`q` lines are queries, each `WORD <s>` or `PREFIX <s>`.

Build a trie — a tree of nodes each holding up to 26 children — and answer:

* `WORD <s>` → `YES` if `s` was inserted, `NO` otherwise
* `PREFIX <s>` → how many of the `n` inserted words start with `s`

The `n` words are not promised to be distinct, and `PREFIX` counts
**insertions**, not distinct words: insert `tram` twice and `PREFIX tram` is
`2`. `NODES` counts nodes, so the second insertion adds none.

Then print `NODES <k>`, the number of nodes in the trie including the root.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

Keep a count on every node of how many inserted words pass through it, and
`PREFIX` is a walk with no counting at the end. Store the nodes in one
`std.ArrayList(Node)` and let children hold indices — `-1` for none — rather
than twenty-six `?*Node`s per node; it is smaller, faster, and the index is
never invalidated by growth the way a pointer into `.items` would be. That
is not a hypothetical: `append` may move the whole list, and a pointer taken
before it is a pointer into memory the allocator has already taken back.
Take the index, `append`, then go through `nodes.items[at]` again.
'''
