'''
solution     = '''
const std = @import("std");

fn generate(gpa: std.mem.Allocator, n: usize, seed: u64) ![]i64 {
    const values = try gpa.alloc(i64, n);
    var x: u64 = seed;
    for (values) |*v| {
        // the wrap is the generator's meaning, so the operators say so
        x = x *% 6364136223846793005 +% 1442695040888963407;
        v.* = @intCast((x >> 33) % 1000000007);
    }
    return values;
}

fn orderI64(target: i64, item: i64) std.math.Order {
    return std.math.order(target, item);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    const values = try generate(gpa, n, seed);
    defer gpa.free(values);

    // tails[i] = the smallest value an increasing subsequence of length i+1
    // can end on. It is sorted, always, which is what makes the search legal.
    var tails: std.ArrayList(i64) = .empty;
    defer tails.deinit(gpa);
    for (values) |value| {
        const slot = std.sort.lowerBound(i64, tails.items, value, orderI64);
        if (slot == tails.items.len) {
            try tails.append(gpa, value);
        } else {
            tails.items[slot] = value;
        }
    }

    try w.print("{d}\n", .{tails.items.len});
    try w.print("TAILS {d}\n", .{tails.items.len});
}
'''
