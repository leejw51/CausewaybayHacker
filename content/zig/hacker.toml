solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    const answer = try gpa.alloc(i64, n);
    defer gpa.free(answer);
    @memset(answer, -1);

    // indices still waiting for their answer
    var pending: std.ArrayList(usize) = .empty;
    defer pending.deinit(gpa);

    for (nums, 0..) |v, i| {
        while (pending.items.len > 0 and nums[pending.items[pending.items.len - 1]] < v) {
            const resolved = pending.pop().?;
            answer[resolved] = v;
        }
        try pending.append(gpa, i);
    }

    var none: usize = 0;
    for (answer, 0..) |a, i| {
        if (i > 0) try w.print(" ", .{});
        try w.print("{d}", .{a});
        if (a == -1) none += 1;
    }
    try w.print("\n", .{});
    try w.print("NONE {d}\n", .{none});
}
'''
