output: 5 4 3 2 1
        3
        LEN 5
```

The middle is the runner: one pointer one step at a time, one two steps at a
time, and when the fast one runs out the slow one is there. One pass.

The C++ version of this question is asked with `unique_ptr`. Zig has no
owning pointer type: the nearest thing is a plain `*Node` from `gpa.create`,
and the owner is whoever remembers to call `gpa.destroy` on it. Nothing runs
when a pointer goes out of scope. So the reversal is honest about what it
moves: a node is unlinked from one list and linked into the other by writing
its `next`, and there is no moment at which two lists both think they own it
because ownership was never in the pointer to begin with. When the printing
is done, walk the reversed list once more and hand every node back; a
