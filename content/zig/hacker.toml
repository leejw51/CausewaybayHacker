solution     = '''
const std = @import("std");

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

// (score, original index)
const Rider = struct { score: i64, index: usize };

fn byScore(_: void, a: Rider, b: Rider) bool {
    return a.score > b.score;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const buckets = try std.fmt.parseInt(u64, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    var rng = Rng{ .x = seed };
    const riders = try gpa.alloc(Rider, n);
    defer gpa.free(riders);
    for (riders, 0..) |*r, i| r.* = .{ .score = @intCast(rng.next() % buckets), .index = i };

    // std.mem.sort is the stable one: equal scores keep the order they arrived in.
    // The equally correct alternative keeps sortUnstable and makes the
    // comparison total:
    //     if (a.score != b.score) return a.score > b.score;
    //     return a.index < b.index;
    std.mem.sort(Rider, riders, {}, byScore);

    var ties: usize = 0;
    for (riders, 0..) |r, i| {
        if (i > 0) try w.print(" ", .{});
        try w.print("{d}", .{r.index});
        if (i > 0 and riders[i - 1].score == r.score) ties += 1;
    }
    try w.print("\n", .{});
    try w.print("TIES {d}\n", .{ties});
}
'''
hints = [
  "One word: sortUnstable becomes sort. std.mem.sort is the stable one, and that is the stable answer.",
  "The other answer keeps sortUnstable and compares (score descending, then index ascending) — a total order, so there are no ties left to be unstable about.",
  "TIES counts adjacent equal scores in the finished order, and that count is the same whichever of the two you wrote — it is the index order that gives you away.",
]

