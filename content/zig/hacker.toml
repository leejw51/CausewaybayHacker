[[quest]]
id           = "zig.hacker.14.word-search"
node         = 14
title        = "IS THE WORD IN THE GRID"
difficulty   = 5
time_limit_s = 1200
story        = "A board of letters and a name. They want to know whether the name is written in it, and they want the count of dead ends."
concepts     = ["backtracking", "matrix", "graphs"]
requires     = ["zig.hacker.13.backtracking"]
map          = { x = 0.119, y = 0.272, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are a grid of lowercase letters. The
last line is the word.

The word is in the grid if you can spell it by moving up, down, left or right
between **adjacent** cells, never using the same cell twice in one attempt.

Print `FOUND` or `ABSENT`, then `STARTS <k>`: how many cells hold the word's
first letter.

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

Mark the cell used on the way in and **unmark it on the way out**. A cell
that stays marked after a failed branch makes later branches fail for a reason
that is not in the grid.

The rows come out of `input` as `[]const u8` — slices you cannot write a
mark into. `gpa.dupe(u8, row)` buys a mutable copy of each, and each copy is
handed back with `gpa.free` when the search is over.
'''
starter      = '''
const std = @import("std");

fn search(grid: [][]u8, r: usize, c: usize, word: []const u8, at: usize) bool {
    _ = grid;
    _ = r;
    _ = c;
    _ = word;
    _ = at;
    return false;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const rows = try std.fmt.parseInt(usize, it.next().?, 10);
    const cols = try std.fmt.parseInt(usize, it.next().?, 10);
    _ = cols;
    const grid = try gpa.alloc([]u8, rows);
    defer gpa.free(grid);
    for (grid) |*row| row.* = try gpa.dupe(u8, it.next().?);
    defer for (grid) |row| gpa.free(row);
    const word = it.next().?;

    const starts: usize = 0;
    _ = search(grid, 0, 0, word, 0);

    try w.print("ABSENT\n", .{});
    try w.print("STARTS {d}\n", .{starts});
