map          = { x = 0.185, y = 0.313, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` distinct integers **already in ascending
order**.

Print every subset, one per line, values space separated, the empty subset as
`-`. Order them the way the obvious recursion produces them: at each position,
first the branch that **takes** the element, then the branch that skips it.
Then print `SUBSETS <2^n>`.

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

Push, recurse, **pop**. The pop is the part people leave out, and the symptom
is every line after the first being too long.

The recursion prints as it goes — pass it the writer, a `*std.Io.Writer`,
and a `*usize` for the count — rather than building every line into memory
first. There is no hidden allocation to lean on here: a line is either
written or stored, and storing it is a `gpa` call you would have to pay
for and hand back.
'''
starter      = '''
const std = @import("std");

fn build(nums: []const i64, at: usize, chosen: *std.ArrayList(i64), gpa: std.mem.Allocator, w: *std.Io.Writer, count: *usize) !void {
    // at the end of the list, print `chosen` (or `-`) and count it;
    // otherwise take it, recurse, undo, then skip it and recurse
    _ = nums;
    _ = at;
    _ = chosen;
    _ = gpa;
    _ = w;
    _ = count;
