    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    var chosen: std.ArrayList(i64) = .empty;
    defer chosen.deinit(gpa);
    var count: usize = 0;
    try build(nums, 0, &chosen, gpa, w, &count);

    try w.print("SUBSETS {d}\n", .{count});
}
'''
solution     = '''
const std = @import("std");

fn build(nums: []const i64, at: usize, chosen: *std.ArrayList(i64), gpa: std.mem.Allocator, w: *std.Io.Writer, count: *usize) !void {
    if (at == nums.len) {
        if (chosen.items.len == 0) {
            try w.print("-\n", .{});
        } else {
            for (chosen.items, 0..) |v, i| {
                if (i > 0) try w.print(" ", .{});
                try w.print("{d}", .{v});
            }
            try w.print("\n", .{});
        }
        count.* += 1;
        return;
    }

    try chosen.append(gpa, nums[at]);
    try build(nums, at + 1, chosen, gpa, w, count);
    _ = chosen.pop(); // the undo in try-recurse-undo

    try build(nums, at + 1, chosen, gpa, w, count);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    var chosen: std.ArrayList(i64) = .empty;
    defer chosen.deinit(gpa);
    var count: usize = 0;
    try build(nums, 0, &chosen, gpa, w, &count);

    try w.print("SUBSETS {d}\n", .{count});
}
'''
