```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

This is the standard competitive-screen wrapper and it fails candidates for
one reason: state that should have been per-case was declared before the
loop. Every accumulator, every set, every `best` goes **inside** the loop —
and in this language the `defer` that frees it goes right under it, so the
set is paid for and handed back once per case.

