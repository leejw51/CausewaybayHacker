map          = { x = 0.333, y = 0.132, kind = "quest" }
brief        = '''
Line one is `n`. The next `n` lines are `<start> <end>` with `start <= end`.

Merge every pair that overlaps or touches, and print the result in increasing
order, one `<start> <end>` per line, then `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Touching counts as overlapping: `1 4` and `4 5` merge into `1 5`.

Sort a slice of structs with `std.mem.sort(Span, spans, {}, byStart)`, where
`byStart` is a plain `fn (void, Span, Span) bool`. Then one pass, appending
to an `std.ArrayList(Span)` and extending its last element in place through
a pointer into `.items`.
'''
starter      = '''
const std = @import("std");

const Span = struct { start: i64, end: i64 };

fn byStart(_: void, a: Span, b: Span) bool {
    if (a.start != b.start) return a.start < b.start;
    return a.end < b.end;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const spans = try gpa.alloc(Span, n);
    defer gpa.free(spans);
    for (spans) |*s| {
        s.start = try std.fmt.parseInt(i64, it.next().?, 10);
        s.end = try std.fmt.parseInt(i64, it.next().?, 10);
    }
    std.mem.sort(Span, spans, {}, byStart);

    // sweep, merge, print, then COUNT <k>
    try w.print("COUNT {d}\n", .{spans.len});
}
'''
solution     = '''
const std = @import("std");

const Span = struct { start: i64, end: i64 };

fn byStart(_: void, a: Span, b: Span) bool {
    if (a.start != b.start) return a.start < b.start;
    return a.end < b.end;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const spans = try gpa.alloc(Span, n);
    defer gpa.free(spans);
    for (spans) |*s| {
        s.start = try std.fmt.parseInt(i64, it.next().?, 10);
        s.end = try std.fmt.parseInt(i64, it.next().?, 10);
    }
    std.mem.sort(Span, spans, {}, byStart);

    var merged: std.ArrayList(Span) = .empty;
    defer merged.deinit(gpa);
    for (spans) |s| {
        if (merged.items.len > 0 and s.start <= merged.items[merged.items.len - 1].end) {
            const last = &merged.items[merged.items.len - 1];
            last.end = @max(last.end, s.end);
        } else {
            try merged.append(gpa, s);
        }
    }

    for (merged.items) |s| try w.print("{d} {d}\n", .{ s.start, s.end });
    try w.print("COUNT {d}\n", .{merged.items.len});
}
'''
hints = [
  "Sort by start first — the starter already does. After it one left-to-right pass is enough.",
  "Extend the last merged interval when the new start is <= its end; otherwise append a new one. A pointer into merged.items lets you write the end in place.",
  "Extend to @max(last.end, end) — a short interval swallowed by a long one must not shrink it.",
]

