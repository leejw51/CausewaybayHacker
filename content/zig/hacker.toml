solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const values = try gpa.alloc(i64, n);
    defer gpa.free(values);
    for (values) |*v| v.* = try std.fmt.parseInt(i64, it.next().?, 10);

    // convert before dividing, not after
    const count: f64 = @floatFromInt(n);
    var sum: f64 = 0.0;
    for (values) |v| sum += @as(f64, @floatFromInt(v));
    const mean = sum / count;

    var variance: f64 = 0.0;
    for (values) |v| {
        const delta = @as(f64, @floatFromInt(v)) - mean;
        variance += delta * delta;
    }
    variance /= count;

    std.mem.sort(i64, values, {}, std.sort.asc(i64));
    const middle = n / 2;
    const median: f64 = if (n % 2 == 1)
        @floatFromInt(values[middle])
    else
        (@as(f64, @floatFromInt(values[middle - 1])) + @as(f64, @floatFromInt(values[middle]))) / 2.0;

    try w.print("{d:.6}\n", .{mean});
    try w.print("{d:.6}\n", .{@sqrt(variance)});
    try w.print("{d:.6}\n", .{median});
}
'''
hints = [
  "@floatFromInt before you divide, not after. @divTrunc(sum, n) on two integers has already thrown the fraction away.",
  "Population variance is the mean of the squared deviations — divide the sum by n.",
  "For an even count the median is the average of values[n/2 - 1] and values[n/2], and that subtraction is where the off-by-one lives.",
]

