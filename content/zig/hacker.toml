solution     = '''
const std = @import("std");

fn generate(gpa: std.mem.Allocator, n: usize, seed: u64) ![]i64 {
    const values = try gpa.alloc(i64, n);
    var x: u64 = seed;
    for (values) |*v| {
        x = x *% 6364136223846793005 +% 1442695040888963407;
        v.* = @intCast((x >> 33) % 1000000007);
    }
    return values;
}

// Merge sort over values[lo..hi], returning how many inversions it removed.
fn sortCount(values: []i64, scratch: []i64, lo: usize, hi: usize) u64 {
    if (hi - lo < 2) return 0;
    const mid = lo + (hi - lo) / 2;
    var inversions = sortCount(values, scratch, lo, mid) + sortCount(values, scratch, mid, hi);

    var left = lo;
    var right = mid;
    var out = lo;
    while (left < mid and right < hi) : (out += 1) {
        if (values[left] <= values[right]) {
            scratch[out] = values[left];
            left += 1;
        } else {
            // values[left..mid] are all greater than values[right]
            inversions += mid - left;
            scratch[out] = values[right];
            right += 1;
        }
    }
    while (left < mid) : ({
        left += 1;
        out += 1;
    }) scratch[out] = values[left];
    while (right < hi) : ({
        right += 1;
        out += 1;
    }) scratch[out] = values[right];
    @memcpy(values[lo..hi], scratch[lo..hi]);
    return inversions;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const seed = try std.fmt.parseInt(u64, it.next().?, 10);

    const values = try generate(gpa, n, seed);
    defer gpa.free(values);
    var max: i64 = 0;
    for (values) |v| max = @max(max, v);

    const scratch = try gpa.alloc(i64, n);
    defer gpa.free(scratch);
    const inversions = sortCount(values, scratch, 0, n);

    try w.print("{d}\n", .{inversions});
    try w.print("MAX {d}\n", .{max});
}
'''
hints = [
  "Take the max before you sort, or sort a copy. The merge sort reorders the slice under you.",
  "When the right-hand value wins the merge, every remaining element of the left half is greater than it — that is mid - left inversions in one go, and it is the whole trick.",
  "A Fenwick tree over the compressed values is the other O(n log n) answer and is worth naming in the room; merge sort is less code under a clock.",
]

