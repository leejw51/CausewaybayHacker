Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in `u64` arithmetic with the
wrapping operators `*%` and `+%`:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Count the **inversions**: pairs `i < j` where `a[i] > a[j]`. Print the count,
then `MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**This quest enforces its complexity, and it is the only kind that can.** The
starter is the `O(n²)` double loop. The hidden case is `n = 1000000`, the
size the C++ interview settled on because its optimiser vectorised the loop
into the run limit at anything smaller. There the double loop is `5 × 10^11`
comparisons, and a Debug build with a bounds check on every one of them does
not come back inside the five second run limit. Counting inversions during a
merge sort is `O(n log n)` and takes **0.19 s** at that size, measured on
this machine with the program that ships in this quest.

Two other things the big case decides for you. The answer for `n = 1000000`
is `250046540838`, which does not fit in 32 bits — an accumulator of the
wrong width is not silently wrong here, it is `panic: integer overflow`, so
count in `u64`. And the generator must wrap rather than overflow: a plain `*`
on a `u64` that overflows is that same panic on the first step, and `*%` is
the operator that means the wrap.
'''
