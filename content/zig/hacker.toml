[[quest]]
id           = "zig.hacker.34.stable-sort"
node         = 33
title        = "TIES KEEP THEIR PLACE"
difficulty   = 4
time_limit_s = 900
story        = "Two riders finished on the same score and the leaderboard puts them in a different order every time it redraws."
concepts     = ["sorting", "slices", "complexity"]
requires     = ["zig.hacker.33.grid-paths"]
map          = { x = 0.605, y = 0.932, kind = "quest" }
brief        = '''
Standard input is `n buckets seed`. Build `n` riders, where rider `i` has
index `i` and a score:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Sort the riders by score **descending**. Riders with the same score must keep
the order they arrived in. Print their indices, space separated, then
`TIES <k>` — how many adjacent pairs in your sorted order have equal scores.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` is small, so almost everything is a tie, and the answer is almost
entirely decided by what happens to them.

**This is the quest about knowing which sort you are holding.** Zig ships
two, and their names say which is which. `std.mem.sortUnstable` is a pattern
defeating quicksort: it makes no promise about the order of equal elements,
and on a real input it visibly will not keep it — its partition step swaps
equal elements across the pivot as a matter of course. `std.mem.sort` is a
block sort, **stable**, and costs some work for the promise. The starter uses
`sortUnstable` with a comparator that looks only at the score, and the hidden
cases are large enough that it demonstrably scrambles them. (At `n = 8` the
unstable one falls back to an insertion sort and happens to keep the order —
which is why a small test would have proved nothing, and why the small case
here is the *visible* one rather than the one that judges you.)

There are two correct answers and you should be able to give both. Use
`std.mem.sort`. **Or** keep `sortUnstable` and make the comparison
**total** — score descending, then index ascending — so no two elements ever
compare equal and stability stops being a question. The second is what to
reach for by default; an unstable sort has nothing to prove when the order is
fully specified.
'''
starter      = '''
const std = @import("std");

const Rng = struct {
    x: u64,
    fn next(self: *Rng) u64 {
        self.x = self.x *% 6364136223846793005 +% 1442695040888963407;
        return self.x >> 33;
    }
};

// (score, original index)
const Rider = struct { score: i64, index: usize };

// the comparison ignores the index — so ties are left to the sort
fn byScore(_: void, a: Rider, b: Rider) bool {
    return a.score > b.score;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
