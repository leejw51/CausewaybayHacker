[[quest]]
id           = "zig.hacker.04.grid"
node         = 4
title        = "OUT OF THE BUILDING"
difficulty   = 5
time_limit_s = 1200
story        = "A floor plan on the whiteboard, a fire door at the far corner, and the interviewer watching the clock rather than the marker."
concepts     = ["graphs", "stacks-queues", "complexity"]
requires     = ["zig.hacker.03.intervals"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one.

The standard library has a `std.Deque`, and you do not need it here: an
`std.ArrayList(usize)` of cell indices with a `head` index that only moves
forward is the queue, it stays `O(1)` per push and pop, and it is the shape
to write when the whole queue is walked once anyway. One thing this
land insists on: form the neighbour's coordinates in `i64` and check the
bounds *before* you `@intCast` to `usize`. A `usize` that goes below zero is
not `-1`, it is `panic: integer overflow`, and it stops the program.
'''
starter      = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const rows = try std.fmt.parseInt(usize, it.next().?, 10);
    const cols = try std.fmt.parseInt(usize, it.next().?, 10);
    const grid = try gpa.alloc([]const u8, rows);
    defer gpa.free(grid);
    for (grid) |*row| row.* = it.next().?;

    // the queue: cell indices, r * cols + c, with a head that only advances
    var queue: std.ArrayList(usize) = .empty;
    defer queue.deinit(gpa);
    _ = cols;

    // print the shortest step count or -1, then REACHED <k>
    try w.print("-1\nREACHED 0\n", .{});
}
'''
solution     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const rows = try std.fmt.parseInt(usize, it.next().?, 10);
    const cols = try std.fmt.parseInt(usize, it.next().?, 10);
    const grid = try gpa.alloc([]const u8, rows);
    defer gpa.free(grid);
    for (grid) |*row| row.* = it.next().?;

    // the distance grid doubles as the visited set: -1 means not seen yet
    const dist = try gpa.alloc(i64, rows * cols);
    defer gpa.free(dist);
    @memset(dist, -1);

    // the queue: cell indices, r * cols + c, with a head that only advances
    var queue: std.ArrayList(usize) = .empty;
    defer queue.deinit(gpa);
    var head: usize = 0;
    var reached: usize = 0;

    if (grid[0][0] == '.') {
        dist[0] = 0;
        try queue.append(gpa, 0);
        reached = 1;
    }

    const dr = [_]i64{ -1, 1, 0, 0 };
    const dc = [_]i64{ 0, 0, -1, 1 };

    while (head < queue.items.len) : (head += 1) {
        const at = queue.items[head];
        const r: i64 = @intCast(at / cols);
        const c: i64 = @intCast(at % cols);
        for (dr, dc) |d_r, d_c| {
            // bounds in i64 first: a usize cannot go below zero, it panics
            const nr = r + d_r;
            const nc = c + d_c;
            if (nr < 0 or nr >= @as(i64, @intCast(rows)) or nc < 0 or nc >= @as(i64, @intCast(cols))) continue;
            const ur: usize = @intCast(nr);
            const uc: usize = @intCast(nc);
            const next = ur * cols + uc;
            if (grid[ur][uc] != '.' or dist[next] >= 0) continue;
            dist[next] = dist[at] + 1;
            reached += 1;
            try queue.append(gpa, next);
        }
    }

    try w.print("{d}\n", .{dist[rows * cols - 1]});
    try w.print("REACHED {d}\n", .{reached});
}
'''
hints = [
  "An ArrayList with a head index that only moves forward is the queue — append at the back, read at head — and that is the whole difference between BFS and DFS here.",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
  "Two small arrays of the four offsets beat four copies of the body. Do the bounds check in i64 before you @intCast: at r == 0 the neighbour above is -1, and a usize that tries to hold -1 is a panic, not a wrap.",
]

