[[quest]]
id          = "zig.advanced.16.defer"
node        = 16
title       = "IT CLEANS UP AFTER ITSELF"
difficulty  = 3
story       = "The plaza logbook closes itself when the shift ends, in the right order, whether or not anyone remembered to."
concepts    = ["raii", "structs", "functions"]
requires    = ["zig.advanced.15.iterators"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Declare two `Guard` values at the **top** of `main`, named `first` and
`second`, and `defer` each one's `drop`, which prints `DROP <name>`. Inside a
nested block, feed the values into a `Tally` whose deferred `report` prints
`TALLY <count> <sum>`. After the block print `DONE`. Nothing else is printed
by `main` itself.

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

Every line but `DONE` is printed by a `defer`. Zig has no destructor; the
nearest thing is `defer`, and it is more honest about it: the line that
releases is written next to the line that acquires, and it runs when the
**block** ends — at the closing brace, on a `return`, on an error going out
through `try` — in **reverse** order of the `defer`s. `Tally`'s `defer` is
in the inner block, so `TALLY` comes before `DONE`; the two guards' `defer`s
are in `main`'s block, and `second` was deferred last, so it runs first.
None of it is scheduled by you. It is scheduled by scope.

One thing to get right: `defer w.flush()` is the first `defer` in `main`, so
it runs **last** — after the guards have written their lines into the buffer.
Put it after them and the `DROP` lines are written to a buffer nobody flushes.
`defer gpa.free(input)`, `defer list.deinit(gpa)`, `defer m.unlock(io)` on the
next map: every release on this road is the same idea.
'''
starter     = '''
const std = @import("std");

const Guard = struct {
    name: []const u8,

    fn drop(self: Guard, w: *std.Io.Writer) void {
        w.print("DROP {s}\n", .{self.name}) catch {};
    }
};

const Tally = struct {
    count: i64 = 0,
    sum: i64 = 0,

    fn add(self: *Tally, v: i64) void {
        self.count += 1;
        self.sum += v;
    }

    fn report(self: Tally, w: *std.Io.Writer) void {
        w.print("TALLY {d} {d}\n", .{ self.count, self.sum }) catch {};
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    const first = Guard{ .name = "first" };
    const second = Guard{ .name = "second" };
    // nobody defers drop for either guard
    _ = first;
    _ = second;

    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    {
        var tally = Tally{};
        // nobody defers report either
        var i: usize = 0;
        while (i < n) : (i += 1) {
            tally.add(try std.fmt.parseInt(i64, it.next().?, 10));
        }
    }
    try w.print("DONE\n", .{});
}
'''
solution    = '''
const std = @import("std");

const Guard = struct {
    name: []const u8,

    fn drop(self: Guard, w: *std.Io.Writer) void {
        w.print("DROP {s}\n", .{self.name}) catch {};
    }
};

const Tally = struct {
    count: i64 = 0,
    sum: i64 = 0,

    fn add(self: *Tally, v: i64) void {
        self.count += 1;
        self.sum += v;
    }

    fn report(self: Tally, w: *std.Io.Writer) void {
        w.print("TALLY {d} {d}\n", .{ self.count, self.sum }) catch {};
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    // deferred first, so it runs last: after every DROP is in the buffer
    defer w.flush() catch {};

    const first = Guard{ .name = "first" };
    defer first.drop(w);
    const second = Guard{ .name = "second" };
    defer second.drop(w);

    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    {
        var tally = Tally{};
        // runs at the closing brace of this block, whatever else happens in it
        defer tally.report(w);
        var i: usize = 0;
        while (i < n) : (i += 1) {
            tally.add(try std.fmt.parseInt(i64, it.next().?, 10));
        }
    }
    try w.print("DONE\n", .{});
}
'''
hints = [
  "defer first.drop(w); right after first is declared, and the same for second. You never call drop yourself; the end of main does.",
  "The inner braces are the whole reason TALLY prints before DONE: defer tally.report(w) inside them runs at their closing brace. Remove them and it prints after.",
  "Defers run in reverse, always, which is why second goes before first — and why the flush, deferred first, runs after both of them.",
  "tally.report reads the tally at the moment the defer runs, not the moment it was written: a defer is a statement postponed, and the arguments it names are evaluated then.",
]

