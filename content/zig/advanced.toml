solution    = '''
const std = @import("std");

const Entry = struct {
    cents: i64,
    next: ?*Entry,
};

// the tail of a chain is another chain, so the walk is the type's own shape
fn sum(chain: ?*const Entry) i64 {
    const node = chain orelse return 0;
    return node.cents + sum(node.next);
}

// the chain owns its nodes: every create is matched by one destroy, here
fn freeChain(gpa: std.mem.Allocator, chain: ?*Entry) void {
    var walk = chain;
    while (walk) |node| {
        walk = node.next;
        gpa.destroy(node);
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const amounts = try gpa.alloc(i64, n);
    defer gpa.free(amounts);
    for (amounts) |*v| {
