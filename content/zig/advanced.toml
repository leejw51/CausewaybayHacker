brief       = '''
Standard input is a count `n`, then `n` lines, one booth name each. `n` is at
least `1`, and a name is one run of non-space characters. A name may appear
more than once.

Print each distinct name once, as `<name> <count>`, **in the order the name
first appeared**. Then print `DISTINCT <k>`.

```
input:  5
        SAI-WAN
        TAI-PO
        SAI-WAN
        LEI-YUE
        SAI-WAN
output: SAI-WAN 3
        TAI-PO 1
        LEI-YUE 1
        DISTINCT 3
```

The container does not give you this on its own, and that is the whole
quest.

`std.StringHashMap` is a hash table: lookup is O(1) on average, but
`iterator()` hands the entries back in **bucket order** — not sorted, not
insertion, and different the moment the table grows. Nothing promises an
order, so a program that prints a hash map by walking it is a program whose
output depends on the hash function. The starter does exactly that, and it
even passes the cases with only one distinct name — which is the tell: a
test that cannot tell the orders apart is not evidence the order is right.

Keep the two jobs in two containers: a `std.ArrayList([]const u8)` remembers
the order a name was first seen, and a `std.StringHashMap(i64)` counts.
Walk the list to print.
'''
