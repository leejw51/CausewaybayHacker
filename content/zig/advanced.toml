'''
solution    = '''
const std = @import("std");

// one definition, instantiated once per T it is called with
fn largest(comptime T: type, xs: []const T) T {
    var best = xs[0];
    for (xs) |x| {
        // decided at compile time: the other branch is never analysed for this T
        const bigger = if (comptime T == []const u8)
            std.mem.order(u8, x, best) == .gt
        else
            x > best;
        if (bigger) {
            best = x;
        }
    }
    return best;
}

// a function that returns a type: Pair(i64) is a struct like any other
fn Pair(comptime T: type) type {
    return struct {
        a: T,
        b: T,

        const Self = @This();

        fn larger(self: Self) T {
            return if (self.a >= self.b) self.a else self.b;
        }

        fn smaller(self: Self) T {
            return if (self.a >= self.b) self.b else self.a;
        }
    };
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    var nums: std.ArrayList(i64) = .empty;
    defer nums.deinit(gpa);
    var ints = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (ints.next()) |tok| {
        try nums.append(gpa, try std.fmt.parseInt(i64, tok, 10));
    }

    var words: std.ArrayList([]const u8) = .empty;
    defer words.deinit(gpa);
    var text = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (text.next()) |tok| {
        try words.append(gpa, tok);
    }

    try w.print("{d}\n", .{largest(i64, nums.items)});
    try w.print("{s}\n", .{largest([]const u8, words.items)});

    const pair = Pair(i64){ .a = nums.items[0], .b = nums.items[1] };
    try w.print("PAIR {d} {d}\n", .{ pair.larger(), pair.smaller() });
}
'''
hints = [
  "comptime T: type as the first parameter, T in place of i64 everywhere inside, and the calls become largest(i64, nums.items) and largest([]const u8, words.items).",
  "x > best does not compile for slices; if (comptime T == []const u8) std.mem.order(u8, x, best) == .gt else x > best picks the right comparison per instantiation.",
  "fn Pair(comptime T: type) type { return struct { ... }; } — inside, const Self = @This() names the struct being built, and Pair(i64){ .a = ..., .b = ... } builds one.",
]

