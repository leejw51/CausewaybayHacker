# ZIG LAND — ADVANCED. The toll plaza at first light turns into the morning
# rush. First the language's own machinery — lines and tokens, pointers and
# slices, bytes that are not letters, structs with methods, tagged unions,
# hash maps, sets, comptime function parameters where a lambda would be,
# generics as functions that return types, optionals and error sets,
# iterators, defer, and the index past the last booth — and then the Canal
# Road flyover after 07:00, where everything happens at once: std.Thread,
# std.Io.Mutex, std.Io.Queue, std.atomic, io.concurrent futures, allocator
# ownership, a hand-rolled reference count, a slice handed over instead of
# copied, a generic ring, erase-while-walking, the overflow that Debug catches,
# a stop flag, and THE UNREACHABLE. The grammar drills live on the BASIC road.
#
# Every quest here has a deterministic answer on purpose: results are written
# by index and printed after the joins, collected and sorted, or sent down a
# FIFO queue. A quest whose output depends on the scheduler is a quest that
# fails CI at random, and that is not a lesson.
#
# Toolchain: Zig 0.16.0, `zig build-exe main.zig -O Debug`, so every safety
# check is on and a panic says what it is. A program reads all of stdin with
# `std.Io.File.stdin().readerStreaming(io, &buf)` + `allocRemaining`, writes
# through `std.Io.File.stdout().writerStreaming(io, &buf)` and MUST flush;
# `std.debug.print` goes to stderr, which the judge does not read.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "zig.advanced"
land = "zig"
category = "advanced"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "zig.advanced.01.lines"
node        = 1
title       = "THE BOOTH LOG"
difficulty  = 2
story       = "Booth 1's shift log lists every vehicle as one line: the name the clerk heard, then whatever it paid, however many coins that turns out to be. The printer is older than the tunnel and still ends the page with the ferry company's word."
concepts    = ["io", "strings", "iteration"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Line one is a count `n`. Each of the next `n` lines is a name followed by
zero or more integers, separated by spaces.

Print one line per vehicle as `<NAME> <how many numbers> <their sum>`, then
`BOATS <n>` — the tally line the plaza's printer has ended every page with
since it belonged to the ferry company.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

The line is the unit here, not the token. One `std.mem.tokenizeAny` over the
whole input stops at whitespace and does not care about newlines, so it
cannot tell you where one vehicle ends and the next begins. Cut the input
into lines first — `std.mem.splitScalar(u8, input, '\n')` gives you an
iterator whose `next()` is `?[]const u8`, one line at a time — and then
tokenize **within** the line.

Every one of those slices points into `input`. Nothing is copied: a line is a
window onto the bytes you already own, which is why `input` has to stay alive
until you are done with all of them, and why `defer gpa.free(input)` is the
last thing to run.
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const first = std.mem.trim(u8, lines.next() orelse "", " \r");
    const n = try std.fmt.parseInt(usize, first, 10);

    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = lines.next() orelse "";
        // tokenize this one line: the first token is the name, the rest
        // are numbers; print <NAME> <count> <sum>
        _ = line;
    }
    try w.print("BOATS {d}\n", .{n});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const first = std.mem.trim(u8, lines.next() orelse "", " \r");
    const n = try std.fmt.parseInt(usize, first, 10);

    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = lines.next() orelse "";
        // a second tokenizer, scoped to this line and nothing past it
        var fields = std.mem.tokenizeAny(u8, line, " \r\t");
        const name = fields.next() orelse "";

        var count: i64 = 0;
        var sum: i64 = 0;
        while (fields.next()) |tok| {
            sum += try std.fmt.parseInt(i64, tok, 10);
            count += 1;
        }
        try w.print("{s} {d} {d}\n", .{ name, count, sum });
    }
    try w.print("BOATS {d}\n", .{n});
}
'''
hints = [
  "splitScalar on '\\n' hands you one line per next(); tokenizeAny on that line, with \" \\r\\t\" as the delimiters, walks its tokens and nothing past its end.",
  "The name is the first token, so take it with one fields.next() before the loop; while (fields.next()) |tok| then sees only the numbers.",
  "A line with only a name gives 0 0 with no special case: the while loop simply never runs.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "two-boats", stdin = "2\nKWAN 3 4 5\nLEE\n",             expect = "KWAN 3 12\nLEE 0 0\nBOATS 2\n",        visible = true },
  { name = "one",       stdin = "1\nHO 10\n",                       expect = "HO 1 10\nBOATS 1\n",                    visible = false },
  { name = "ragged",    stdin = "3\nA 1 1\nB -2\nC 0 0 0 0\n",      expect = "A 2 2\nB 1 -2\nC 4 0\nBOATS 3\n",       visible = false },
  { name = "none",      stdin = "0\n",                              expect = "BOATS 0\n",                             visible = false },
]

# ---------------------------------------------------------------- 02
[[quest]]
id          = "zig.advanced.02.pointers"
node        = 2
title       = "A COPY IS NOT THE THING"
difficulty  = 2
story       = "The booth supervisor tallies each coin tray onto a copy of the sheet, and the sheet on the wall behind her never changes."
concepts    = ["pointers", "functions", "mutability"]
requires    = ["zig.advanced.01.lines"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Push every value onto one `std.ArrayList(i64)` through a function `load`,
then print three lines: `LOADED <how many>`, `TOTAL <sum>` from a function
`total` that only reads, and `FIRST <value>` — or `FIRST NONE` when there is
nothing.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

The starter compiles and prints `LOADED 0`. `load` takes the list **by
value**, and a Zig parameter is immutable, so the starter does the thing
people do next: `var mine = sheet;` — a copy of the list's header — and
appends to that. The copy grows, the copy dies on return, and the sheet on
the wall is untouched.

Say what you mean with `*`: a parameter of type `*std.ArrayList(i64)` is the
address of the caller's list, and `sheet.append(gpa, value)` through it lands
in the caller's list. `total` should take a `[]const i64` — the list's
`.items` — because it needs to look and does not need to touch, and `const`
in the type is how the compiler holds you to that.

`FIRST` is an optional pointer: `?*const i64` is either the address of the
first element or `null`, and `null` is the one value Zig will not let you
read through without asking first — `if (first) |p|` is the asking. That is
the whole of this land in one line.
'''
starter     = '''
const std = @import("std");

// takes the list by value; a copy of the header grows here and dies here
fn load(sheet: std.ArrayList(i64), gpa: std.mem.Allocator, value: i64) !void {
    var mine = sheet;
    try mine.append(gpa, value);
}

fn total(sheet: std.ArrayList(i64)) i64 {
    var sum: i64 = 0;
    for (sheet.items) |v| {
        sum += v;
    }
    return sum;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var sheet: std.ArrayList(i64) = .empty;
    defer sheet.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const value = try std.fmt.parseInt(i64, it.next().?, 10);
        try load(sheet, gpa, value);
    }

    try w.print("LOADED {d}\n", .{sheet.items.len});
    try w.print("TOTAL {d}\n", .{total(sheet)});

    const first: ?*const i64 = null;
    // point first at the first element if there is one, then print it
    _ = first;
    try w.print("FIRST NONE\n", .{});
}
'''
solution    = '''
const std = @import("std");

// a pointer: this IS the caller's list, not a copy of its header
fn load(sheet: *std.ArrayList(i64), gpa: std.mem.Allocator, value: i64) !void {
    try sheet.append(gpa, value);
}

// a const slice: no copy, and the compiler refuses any line that would write
fn total(sheet: []const i64) i64 {
    var sum: i64 = 0;
    for (sheet) |v| {
        sum += v;
    }
    return sum;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var sheet: std.ArrayList(i64) = .empty;
    defer sheet.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const value = try std.fmt.parseInt(i64, it.next().?, 10);
        try load(&sheet, gpa, value);
    }

    try w.print("LOADED {d}\n", .{sheet.items.len});
    try w.print("TOTAL {d}\n", .{total(sheet.items)});

    // the address of the first element, or null: never read without asking
    const first: ?*const i64 = if (sheet.items.len > 0) &sheet.items[0] else null;
    if (first) |p| {
        try w.print("FIRST {d}\n", .{p.*});
    } else {
        try w.print("FIRST NONE\n", .{});
    }
}
'''
hints = [
  "Two characters fix load: sheet: *std.ArrayList(i64) in the signature and &sheet at the call. Method call syntax through a pointer needs no arrow; sheet.append(gpa, v) is the same line.",
  "total should take []const i64 and be called with sheet.items — the const is a promise, and the compiler checks it.",
  "&sheet.items[0] is the address of the first element and only makes sense when there is one; if (first) |p| unwraps the optional, and p.* is the value behind it.",
]

