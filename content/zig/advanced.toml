[[quest]]
id          = "zig.advanced.34.unreachable"
node        = 34
title       = "THE UNREACHABLE"
difficulty  = 5
story       = "07:59 on the Canal Road flyover. The lane model marks one branch unreachable, the morning traffic reaches it, and every lane closes at once — while a lane thread is still reading a buffer the plaza has already handed back."
concepts    = ["raii", "smart-pointers", "concurrency", "undefined-behaviour"]
requires    = ["zig.advanced.33.stop-flag", "zig.advanced.28.refcount"]
map          = { x = 0.818, y = 0.87, kind = "boss" }
brief       = '''
Line one is `w n`: `w` lanes and `n` readings. Line two is the readings.

`pump(gpa, w, ledger)` starts `w` threads over the readings held by a
reference-counted `Ledger` (the one from three quests ago); thread `i` sums
the readings from `i * n / w` up to `(i + 1) * n / w` into `partial[i]`, and
`pump` returns the partials. `main` prints `PUMP <i> <sum>` for each,
`TOTAL <sum>`, and then `FREED yes` if the readings have been released by
the time everything is done — observed through the ledger's `alive()`.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

The starter fails twice, and the two failures are the two halves of this
land.

The first is the lane model. `pump` computes each lane's bounds and then
says `if (begin == end) unreachable;` — *a lane with no traffic cannot
happen*. Three lanes over two readings, and it happens. `unreachable` is
not a comment and not an assert: it is the one line in Zig that means
**assume**. In `-O Debug` reaching it is `panic: reached unreachable code`,
and the plaza stops with the reason on the screen. In `-O ReleaseFast` the
compiler *believes* you — the branch is deleted, and everything that could
only lead to it is deleted with it — and the program that reaches it is
undefined, exactly as a C++ program that reads through a dangling pointer
is undefined. The panic is the honest version of the same contract. Delete
the claim and handle the case: an empty lane sums to `0`.

The second is the ownership. The starter's `pump` **releases** the ledger
before it starts the lanes — *the workers have their slice, the handle is
not needed* — and the release is the last one, so the readings are freed,
and the workers read them anyway. In Debug the allocator paints memory it
has taken back with `0xAA`, every byte, so each reading comes back as
`-6148914691236517206`, and the first lane to add two of them stops the
plaza with `panic: integer overflow` — that is the failure the visible case
shows, where every lane has traffic and the `unreachable` is never reached:
a sum that cannot overflow on any reading in the input, and a trace pointing
at a line that is not the mistake. In ReleaseFast there is no paint and no
check: the
lanes read whatever the next allocation put there, or a page the kernel
took away. That is a dangling read, and it is the most expensive kind of
bug, because it does not fail where the mistake is.

Fix the ownership, not the symptom. Every lane **takes a share** of the
ledger before it starts and releases it when it is done, so the readings
live exactly as long as the last thread holding them — whatever order the
lanes finish in. `pump` joins before it returns and releases the handle
`main` gave it last. Back in `main`, `alive()` is `false`: the readings
were freed, once, by the last release — `pump`'s own, after the joins —
and nobody was still reading. The count is atomic because the lanes'
releases race each other; the
ledger itself is not thread-safe and does not need to be, because nobody
writes to the readings.

That is the whole land in one program. The checks stopped you every time
you were wrong, and the tools that make you right — the count that says who
is holding this, the join that waits, the `defer` that releases — are the
same ones you met on the basic road.
'''
starter     = '''
const std = @import("std");

const Ledger = struct {
    refs: std.atomic.Value(usize) = std.atomic.Value(usize).init(0),
    items: ?[]i64 = null,

    fn share(self: *Ledger) *Ledger {
        _ = self.refs.fetchAdd(1, .monotonic);
        return self;
    }

    fn release(self: *Ledger, gpa: std.mem.Allocator) void {
        if (self.refs.fetchSub(1, .acq_rel) == 1) {
            if (self.items) |items| gpa.free(items);
            self.items = null;
        }
    }

    fn alive(self: *const Ledger) bool {
        return self.items != null;
    }
};

// reads its lane of the readings and writes its one slot
fn lane(readings: []const i64, slot: *i64) void {
    var sum: i64 = 0;
    for (readings) |v| {
        sum += v;
    }
    slot.* = sum;
}

// starts w lanes over the ledger's readings and returns their partial sums
fn pump(gpa: std.mem.Allocator, w: usize, ledger: *Ledger) ![]i64 {
    const readings = ledger.items.?;
    const n = readings.len;
    const partial = try gpa.alloc(i64, w);
    errdefer gpa.free(partial);
    @memset(partial, 0);
    const lanes = try gpa.alloc(std.Thread, w);
    defer gpa.free(lanes);

    // the workers have their slice; the handle is not needed any more
    ledger.release(gpa);

    for (lanes, 0..) |*t, i| {
        const begin = i * n / w;
        const end = (i + 1) * n / w;
        // the model: a lane with no traffic cannot happen
        if (begin == end) unreachable;
        t.* = try std.Thread.spawn(.{}, lane, .{ readings[begin..end], &partial[i] });
    }
    for (lanes) |t| {
        t.join();
    }
    return partial;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const lanes = try std.fmt.parseInt(usize, it.next().?, 10);
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    var ledger = Ledger{};
    ledger.items = try gpa.alloc(i64, n);
    for (ledger.items.?) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    // main's one handle, given away to pump
    const partial = try pump(gpa, lanes, ledger.share());
    defer gpa.free(partial);

    var total: i64 = 0;
    for (partial, 0..) |p, i| {
        try w.print("PUMP {d} {d}\n", .{ i, p });
        total += p;
    }
    try w.print("TOTAL {d}\n", .{total});
    try w.print("FREED {s}\n", .{if (ledger.alive()) "no" else "yes"});
}
'''
solution    = '''
const std = @import("std");

const Ledger = struct {
    // atomic: the lanes release concurrently, and the last one out frees
    refs: std.atomic.Value(usize) = std.atomic.Value(usize).init(0),
    items: ?[]i64 = null,

    fn share(self: *Ledger) *Ledger {
        _ = self.refs.fetchAdd(1, .monotonic);
        return self;
    }

    fn release(self: *Ledger, gpa: std.mem.Allocator) void {
        if (self.refs.fetchSub(1, .acq_rel) == 1) {
            if (self.items) |items| gpa.free(items);
            self.items = null;
        }
    }

    fn alive(self: *const Ledger) bool {
        return self.items != null;
    }
};

// holds its own share of the ledger for exactly as long as it reads
fn lane(gpa: std.mem.Allocator, ledger: *Ledger, begin: usize, end: usize, slot: *i64) void {
    defer ledger.release(gpa);
    var sum: i64 = 0;
    for (ledger.items.?[begin..end]) |v| {
        sum += v;
    }
    slot.* = sum;
}

// starts w lanes over the ledger's readings and returns their partial sums
fn pump(gpa: std.mem.Allocator, w: usize, ledger: *Ledger) ![]i64 {
    // pump owns the handle main gave it until it is done with the readings
    defer ledger.release(gpa);
    const n = ledger.items.?.len;
    const partial = try gpa.alloc(i64, w);
    errdefer gpa.free(partial);
    @memset(partial, 0);
    const lanes = try gpa.alloc(std.Thread, w);
    defer gpa.free(lanes);

    for (lanes, 0..) |*t, i| {
        const begin = i * n / w;
        const end = (i + 1) * n / w;
        // an empty lane is a lane: it sums to zero, and nothing is assumed
        // each lane takes its share before it starts, and releases it itself
        t.* = try std.Thread.spawn(.{}, lane, .{ gpa, ledger.share(), begin, end, &partial[i] });
    }
    // every lane is joined before partial is read or returned
    for (lanes) |t| {
        t.join();
    }
    return partial;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const lanes = try std.fmt.parseInt(usize, it.next().?, 10);
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    var ledger = Ledger{};
    ledger.items = try gpa.alloc(i64, n);
    for (ledger.items.?) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    // main's one handle, given away to pump
    const partial = try pump(gpa, lanes, ledger.share());
    defer gpa.free(partial);

    var total: i64 = 0;
    for (partial, 0..) |p, i| {
        try w.print("PUMP {d} {d}\n", .{ i, p });
        total += p;
    }
    try w.print("TOTAL {d}\n", .{total});
    // main gave its handle away, pump's is gone, the lanes' are gone
    try w.print("FREED {s}\n", .{if (ledger.alive()) "no" else "yes"});
}
'''
hints = [
  "Delete the unreachable and let an empty lane run: begin == end is an empty slice, and its sum is zero. A claim you cannot prove is not a claim to make.",
  "Give each lane a share: spawn it with ledger.share() and have it defer ledger.release(gpa). The lane's share is what keeps the readings alive; it is released when the lane's function returns, not when pump does.",
  "pump's own release moves to a defer at the top of pump, so it runs after the joins — after the readings have been read — and it is the handle main gave away that it is releasing.",
  "partial is handed to the lanes by slot, and that is correct: pump owns it, pump joins before returning it, and each lane writes only its own slot. If main had kept a share, FREED would be no — the readings would be alive because main was still holding them, and that is the other answer this boss accepts you being able to explain.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "two-pumps",  stdin = "2 4\n1 2 3 4\n",          expect = "PUMP 0 3\nPUMP 1 7\nTOTAL 10\nFREED yes\n",                     visible = true },
  { name = "more-pumps", stdin = "3 2\n7 8\n",              expect = "PUMP 0 0\nPUMP 1 7\nPUMP 2 8\nTOTAL 15\nFREED yes\n",           visible = false },
  { name = "empty",      stdin = "1 0\n",                   expect = "PUMP 0 0\nTOTAL 0\nFREED yes\n",                                visible = false },
  { name = "even",       stdin = "4 8\n1 1 1 1 1 1 1 1\n",  expect = "PUMP 0 2\nPUMP 1 2\nPUMP 2 2\nPUMP 3 2\nTOTAL 8\nFREED yes\n",  visible = false },
]
