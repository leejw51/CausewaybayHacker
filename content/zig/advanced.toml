solution    = '''
const std = @import("std");

// a view onto its own chunk, and its own slot: nothing shared, nothing locked
fn sumInto(chunk: []const i64, slot: *i64) void {
    var sum: i64 = 0;
    for (chunk) |v| {
        sum += v;
    }
    slot.* = sum;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const k = try std.fmt.parseInt(usize, it.next().?, 10);
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    const partial = try gpa.alloc(i64, k);
    defer gpa.free(partial);
    @memset(partial, 0);

    const threads = try gpa.alloc(std.Thread, k);
    defer gpa.free(threads);
    for (threads, 0..) |*t, i| {
        // usize arithmetic on the bounds; the last chunk ends exactly at n
        const begin = i * n / k;
        const end = (i + 1) * n / k;
        t.* = try std.Thread.spawn(.{}, sumInto, .{ nums[begin..end], &partial[i] });
    }
    for (threads) |t| {
        t.join();
    }

    var total: i64 = 0;
    for (partial, 0..) |p, i| {
        try w.print("CHUNK {d} {d}\n", .{ i, p });
        total += p;
    }
    try w.print("TOTAL {d}\n", .{total});
}
'''
hints = [
  "Compute begin and end in main and slice there: nums[begin..end] is the view the thread gets, and &partial[i] is the one slot it may write.",
  "A local sum inside the thread and one write to slot.* at the end keeps the shared slice touched exactly once per thread.",
  "k > n makes some chunks empty — begin == end — and nums[begin..end] is an empty slice whose for loop simply does not run. No special case.",
]

