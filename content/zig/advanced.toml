brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <HOURS>`.

The base rate is `500 + 100 * HOURS` cents. For each line print one of:

* `MEMBER` — the base rate
* `CREW` — half the base rate, integer division
* `JUNIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

Model the tag as a `union(enum)` with four cases, one of them `other`. A
C++ `enum class` cannot carry a payload and the unrecognised text had to
travel beside it; a Zig tagged union carries it **inside** the case:
`other: []const u8`, and the other three cases carry nothing at all. A case
of a `union(enum)` does not convert to an integer behind your back and does
not leak its names into the enclosing scope, which are the two reasons
`enum class` existed.

Decide the fare with one `switch`. A `switch` on a tagged union must cover
every case — leave one out and it does not compile, no warning flag needed —
and `.other => |raw|` is how the payload comes out of the case it is in.
'''
