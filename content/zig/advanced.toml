[[quest]]
id          = "zig.advanced.11.generics"
node        = 11
title       = "WRITE IT ONCE"
difficulty  = 3
story       = "The plaza's gauge board has largest written four times — for axles, for minutes, for lanes and for lane names — and the fifth is due before the first tram."
concepts    = ["generics", "types", "mutability"]
requires    = ["zig.advanced.10.comptime-fn"]
map          = { x = 0.474, y = 0.314, kind = "quest" }
brief       = '''
Standard input is two lines: integers on the first, words on the second.

Write **one** `largest` that works on both, and a type `Pair(T)` with
`larger()` and `smaller()`.

Print the largest integer, the largest word, then
`PAIR <larger> <smaller>` for a `Pair` of the first two integers. A tie counts
as `a` being the larger.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

The starter does not compile: `largest` is nailed to `i64`, so passing it
the words is *expected type '[]const i64', found '[][]const u8'*. A
generic function in Zig is a function with a **`comptime T: type`**
parameter: `fn largest(comptime T: type, xs: []const T) T` is stamped out
once per type it is called with, and `T` is spelled at the call —
`largest([]const u8, words)` — rather than deduced.

Words do not have `>`; slices compare with `std.mem.order`. Inside the
generic, `if (comptime T == []const u8)` picks the comparison at compile
time — the branch that does not apply is never even analysed, which is the
same idea as a template specialisation with none of the machinery.

`Pair(T)` is the same trick for a type: a function that takes a `type` and
**returns a struct**. There is no separate class-template syntax; a type is
a value at compile time, and a function can make one.
'''
starter     = '''
const std = @import("std");

fn largest(xs: []const i64) i64 {
    var best = xs[0];
    for (xs) |x| {
        if (x > best) {
            best = x;
        }
    }
    return best;
}

// Pair(T) goes here, with larger() and smaller()

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    var nums: std.ArrayList(i64) = .empty;
    defer nums.deinit(gpa);
    var ints = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (ints.next()) |tok| {
        try nums.append(gpa, try std.fmt.parseInt(i64, tok, 10));
    }

    var words: std.ArrayList([]const u8) = .empty;
    defer words.deinit(gpa);
    var text = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (text.next()) |tok| {
        try words.append(gpa, tok);
    }

    try w.print("{d}\n", .{largest(nums.items)});
    try w.print("{s}\n", .{largest(words.items)});
    try w.print("PAIR {d} {d}\n", .{ nums.items[0], nums.items[1] });
