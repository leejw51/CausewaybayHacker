const std = @import("std");

const Snapshot = struct {
    total: i64,
    hits: i64,
};

const Counter = struct {
    mutex: std.Io.Mutex = .init,
    total: i64 = 0,
    hits: i64 = 0,

    fn add(self: *Counter, io: std.Io, value: i64) void {
        self.mutex.lockUncancelable(io);
        defer self.mutex.unlock(io);
        self.total += value;
        self.hits += 1;
    }

