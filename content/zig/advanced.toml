solution    = '''
const std = @import("std");
const Io = std.Io;

fn producer(io: Io, q: *Io.Queue(i64), nums: []const i64) void {
    for (nums) |v| {
        q.putOneUncancelable(io, v) catch return;
    }
}

// runs until the queue is drained AND closed: that is what error.Closed means
fn consumer(io: Io, q: *Io.Queue(i64), w: *Io.Writer, consumed: *i64) void {
    while (q.getOneUncancelable(io)) |v| {
        w.print("{d}\n", .{v * 2}) catch return;
        consumed.* += 1;
    } else |_| {}
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    // a bounded channel over a buffer main owns: four coins in the hatch at most
    var slots: [4]i64 = undefined;
    var hatch: Io.Queue(i64) = .init(&slots);
    var consumed: i64 = 0;

    var taking = try io.concurrent(consumer, .{ io, &hatch, w, &consumed });
    var feeding = try io.concurrent(producer, .{ io, &hatch, nums });

    feeding.await(io);
    // there will be no more: the consumer drains what is left and gets error.Closed
    hatch.close(io);
    taking.await(io);
    try w.print("CONSUMED {d}\n", .{consumed});
}
'''
hints = [
  "One line after feeding.await(io): hatch.close(io). Then taking.await(io) returns, and the program terminates.",
  "close does not throw away what is still in the queue; the consumer keeps getting values until it is empty, and only then sees error.Closed.",
  "The consumer is the only thing printing while it runs, and main prints CONSUMED only after taking.await(io) — that ordering is what keeps the writer safe without a lock.",
]

