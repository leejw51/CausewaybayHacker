'''
solution    = '''
const std = @import("std");

const Card = union(enum) {
    member,
    crew,
    junior,
    other: []const u8,
};

fn classify(raw: []const u8) Card {
    if (std.mem.eql(u8, raw, "MEMBER")) return .member;
    if (std.mem.eql(u8, raw, "CREW")) return .crew;
    if (std.mem.eql(u8, raw, "JUNIOR")) return .junior;
    return .{ .other = raw };
}

fn fare(w: *std.Io.Writer, card: Card, hours: i64) !void {
    const base: i64 = 500 + 100 * hours;
    // every case is covered, or this does not compile
    switch (card) {
        .member => try w.print("{d}\n", .{base}),
        .crew => try w.print("{d}\n", .{@divTrunc(base, 2)}),
        .junior => try w.print("200\n", .{}),
        .other => |raw| try w.print("UNKNOWN {s}\n", .{raw}),
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const raw = it.next().?;
        const hours = try std.fmt.parseInt(i64, it.next().?, 10);
        try fare(w, classify(raw), hours);
    }
}
'''
hints = [
  "other: []const u8 is the fourth case, and .{ .other = raw } builds it; the three void cases are built as .member, .crew, .junior.",
  "std.mem.eql(u8, raw, \"MEMBER\") compares two slices; == on slices compares pointers, which is never what you mean.",
  "@divTrunc(base, 2) is integer division spelled out; a plain / on signed integers does not compile when the result could be inexact.",
]

