and you have to find both.

The first is `lookup`. It returns a `?*Shell` — the address of the matching
entry, or `null` — and the caller writes `.?` on it without looking. `.?`
is *I know this is not null*, and when it is, `-O Debug` stops the program
with `panic: attempt to use null value`. Test the optional: `if (lookup(...))
