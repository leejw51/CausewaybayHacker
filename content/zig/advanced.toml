or nothing*: `std.fmt.parseInt` returns an error union, and `catch return
null` turns the error into the `null` half of an optional. It refuses the
whole string or nothing, so `4x` is rejected as well as `xx`.

`fn doubled(text: []const u8) Doubled` returns a `union(enum) { value: i64,
bad: []const u8 }` — *either the doubled value or the line that failed*,
