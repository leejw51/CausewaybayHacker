Standard input is a count `n`, then `n` lines of text.

Start one thread per line that uppercases it into its own slot. Join them
all, print the lines in order, then `DONE`.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

The starter does not compile, and the error is the lesson. `std.Thread.spawn`
returns `!std.Thread` — the handle, or an error — and the starter drops it
on the floor as a bare statement: *error union is ignored*. Zig refuses to
let a value that might be an error go unexamined, and it is doing you a
favour: the handle is the **only** way to `join`, and a thread nobody joins
is a thread still running when `main` returns — the process ends under it
and the lines are half uppercased, or not at all, depending on the
scheduler. C++ aborts a `std::thread` destroyed while joinable; Zig makes
you hold the handle in your hand and asks what you meant to do with it.

So every handle is kept and every thread is joined (or `detach`ed, which is
almost never what you want) before its work is read. The shape is the
allocator's: `alloc` a slice of `std.Thread`, fill it, join it, `free` it —
and the join loop stands where the C++ destructor stood.
'''
