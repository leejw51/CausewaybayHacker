        2 KWAN
        1 HO
output: 1 HO
        1 LEE
        2 KWAN
        DISTINCT 3
        DUPES 1
```

Zig has no ordered set of pairs; the nearest thing is two tools that do one
job each. A `std.StringHashMap(void)` is a set — a map whose values take no
space — and keying it on the **line itself**, `2 KWAN`, refuses a second copy
of any pairing already in it. A `std.ArrayList` of a small struct
`{ berth, name }` collects the ones the set let through, and `std.mem.sort`
with a comparator puts them in berth-then-name order. There is no structured
binding to take the pair apart; the struct's fields already have names.
'''
starter     = '''
const std = @import("std");

const Mooring = struct {
    berth: i64,
    name: []const u8,
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const n = try std.fmt.parseInt(usize, std.mem.trim(u8, lines.next() orelse "", " \r"), 10);

    var moorings: std.ArrayList(Mooring) = .empty;
    defer moorings.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = std.mem.trim(u8, lines.next() orelse "", " \r");
        var fields = std.mem.tokenizeScalar(u8, line, ' ');
        const berth = try std.fmt.parseInt(i64, fields.next().?, 10);
        const name = fields.next().?;
        try moorings.append(gpa, .{ .berth = berth, .name = name });
    }

    // a list keeps duplicates and keeps arrival order: neither is wanted
    for (moorings.items) |m| {
        try w.print("{d} {s}\n", .{ m.berth, m.name });
    }
    try w.print("DISTINCT {d}\n", .{moorings.items.len});
    try w.print("DUPES 0\n", .{});
}
'''
solution    = '''
const std = @import("std");

const Mooring = struct {
    berth: i64,
    name: []const u8,
};

fn byBerthThenName(_: void, a: Mooring, b: Mooring) bool {
    if (a.berth != b.berth) {
        return a.berth < b.berth;
    }
    return std.mem.order(u8, a.name, b.name) == .lt;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const n = try std.fmt.parseInt(usize, std.mem.trim(u8, lines.next() orelse "", " \r"), 10);

    // the set: a map with nothing in the value slot, keyed on the whole line
    var seen = std.StringHashMap(void).init(gpa);
    defer seen.deinit();
    var moorings: std.ArrayList(Mooring) = .empty;
    defer moorings.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = std.mem.trim(u8, lines.next() orelse "", " \r");
        const slot = try seen.getOrPut(line);
        if (slot.found_existing) continue; // a duplicate: the set refuses it
        var fields = std.mem.tokenizeScalar(u8, line, ' ');
        const berth = try std.fmt.parseInt(i64, fields.next().?, 10);
        const name = fields.next().?;
        try moorings.append(gpa, .{ .berth = berth, .name = name });
    }

    std.mem.sort(Mooring, moorings.items, {}, byBerthThenName);
    for (moorings.items) |m| {
        try w.print("{d} {s}\n", .{ m.berth, m.name });
    }
    try w.print("DISTINCT {d}\n", .{moorings.items.len});
    try w.print("DUPES {d}\n", .{n - moorings.items.len});
}
'''
hints = [
  "std.StringHashMap(void) is the set; getOrPut(line).found_existing is true on the second copy of a line and false on the first.",
  "Only the lines the set let through go into the list, so the list's length is DISTINCT and n minus it is DUPES.",
  "The comparator sorts by berth first and by std.mem.order(u8, a.name, b.name) == .lt on a tie; std.mem.sort(Mooring, moorings.items, {}, byBerthThenName) applies it.",
]

