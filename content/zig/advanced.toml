const std = @import("std");

var copies: i64 = 0;
var moves: i64 = 0;

const Docket = struct {
    text: []u8,

    fn init(gpa: std.mem.Allocator, line: []const u8) !Docket {
        return .{ .text = try gpa.dupe(u8, line) };
    }

    // a second docket with its own copy of the bytes
    fn copy(self: Docket, gpa: std.mem.Allocator) !Docket {
        copies += 1;
        return .{ .text = try gpa.dupe(u8, self.text) };
    }

    // the hand-over: the bytes go with the returned docket, and the source
    // is left holding an empty slice it can still safely deinit
    fn take(self: *Docket) Docket {
        moves += 1;
        const moved = Docket{ .text = self.text };
        self.text = &.{};
        return moved;
    }

    fn deinit(self: Docket, gpa: std.mem.Allocator) void {
        if (self.text.len > 0) gpa.free(self.text);
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var rows = std.mem.splitScalar(u8, input, '\n');
    const n = try std.fmt.parseInt(usize, std.mem.trim(u8, rows.next() orelse "", " \r"), 10);

    var pile: std.ArrayList(Docket) = .empty;
    defer pile.deinit(gpa);
    defer for (pile.items) |d| d.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = std.mem.trim(u8, rows.next() orelse "", "\r");
        try pile.append(gpa, try Docket.init(gpa, line));
    }

    var sent: std.ArrayList(Docket) = .empty;
    defer sent.deinit(gpa);
    defer for (sent.items) |d| d.deinit(gpa);
    for (pile.items) |*d| {
        // take() hands the bytes over: no duplicate, and the pile's docket is
        // now empty, which this program never reads again
        try sent.append(gpa, d.take());
    }

    for (sent.items) |d| {
        for (d.text) |*c| {
            c.* = std.ascii.toUpper(c.*);
        }
