Standard input is a count `n`, then `n` lines of text.

Build one `Docket` per line in a list `pile`, then hand every docket over to
a second list, `sent`, and print each one's text uppercased from `sent`,
then `SENT <n>`, `COPIES <c>`, `MOVES <m>`.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        SENT 2
        COPIES 0
        MOVES 2
```

`Docket` owns its text — a `[]u8` it allocated — and counts what happens to
it: `copy(gpa)` duplicates the bytes and bumps one global, `take()` bumps
the other. The starter reports `COPIES 2`: `sent.append(gpa, try d.copy(gpa))`
duplicates every docket, bytes and all.

Zig has no move semantics and no move constructor; the nearest thing is a
discipline, and this quest writes it out. Assigning a struct copies its
header — for a `Docket`, the pointer and length of the text — so `sent.append
(gpa, d)` would leave **two** dockets that both believe they own the same
bytes, and the second `free` of them is the crash. `take()` is the honest
hand-over: it returns a docket holding the text and leaves the source with
an **empty slice**, so the source can still be freed — which frees nothing
— and can never be read as if it still had the text. That is what C++'s
*valid but unspecified* moved-from state is, spelled out as a value you
