    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    const errors: i64 = 0; // nothing ever counts one
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const text = it.next().?;
        // nothing catches what fare returns: try hands it out of main
        try w.print("{d}\n", .{try fare(text)});
    }
    try w.print("ERRORS {d}\n", .{errors});
}
'''
solution    = '''
const std = @import("std");

const FareError = error{
    NotANumber,
    NegativeDistance,
};

fn fare(text: []const u8) FareError!i64 {
    // parseInt's own errors are translated into this function's set
    const km = std.fmt.parseInt(i64, text, 10) catch return error.NotANumber;
    if (km < 0) {
        return error.NegativeDistance;
    }
    return 500 + 100 * km;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var errors: i64 = 0;
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const text = it.next().?;
        if (fare(text)) |cents| {
            try w.print("{d}\n", .{cents});
        } else |e| switch (e) {
            // every error in FareError has an arm, or this does not compile
            error.NegativeDistance => {
                errors += 1;
                try w.print("negative distance: {s}\n", .{text});
            },
            error.NotANumber => {
                errors += 1;
                try w.print("not a number\n", .{});
            },
        }
    }
    try w.print("ERRORS {d}\n", .{errors});
}
'''
