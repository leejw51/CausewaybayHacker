    // 2. keepDoubled for the ones over 10, print or "-"
    // 3. sort a copy, count the distinct values
    // 4. indexOfFirst for the first over 10
    try w.print("{d}\n", .{sumIf(nums.items, isEven)});
    try w.print("-\n", .{});
    try w.print("0\n", .{});
    try w.print("FIRST_BIG -1\n", .{});
