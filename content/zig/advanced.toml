    }

    var counter = Counter{};
    const threads = try gpa.alloc(std.Thread, n);
    defer gpa.free(threads);
    for (threads, 0..) |*t, i| {
        // a method is a function: Counter.add with &counter as its first argument
        t.* = try std.Thread.spawn(.{}, Counter.add, .{ &counter, io, nums[i] });
    }
    for (threads) |t| {
