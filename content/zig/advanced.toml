this quest reads `table[n]` without a check, gets whatever happens to be at
that address — the next object on the heap, or nothing — and prints a
checksum that is wrong by an amount nobody can reproduce. Zig checks every
index and every `.?` in Debug, and in `-O ReleaseFast` it checks neither:
