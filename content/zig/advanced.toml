const std = @import("std");
const Io = std.Io;

fn producer(io: Io, q: *Io.Queue(i64), nums: []const i64) void {
    for (nums) |v| {
        q.putOneUncancelable(io, v) catch return;
    }
    // returns without anyone saying the hatch is finished
}

fn consumer(io: Io, q: *Io.Queue(i64), w: *Io.Writer, consumed: *i64) void {
    while (q.getOneUncancelable(io)) |v| {
        w.print("{d}\n", .{v * 2}) catch return;
        consumed.* += 1;
    } else |_| {}
}

