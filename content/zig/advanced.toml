[[quest]]
id          = "zig.advanced.23.queue"
node        = 23
title       = "THE HATCH"
difficulty  = 4
story       = "One booth feeds coins through the hatch to the counting room and one clerk takes them out, and the clerk has been waiting on an empty hatch since 06:40."
concepts    = ["channels", "concurrency", "shared-state"]
requires    = ["zig.advanced.22.lock-order"]
map          = { x = 0.75, y = 0.724, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

A producer pushes each value into a `std.Io.Queue(i64)`; a consumer takes
them out one at a time and prints each doubled. When the producer has pushed
everything, `main` **closes** the queue, and the consumer stops when the
queue is drained and closed. Await both, then print `CONSUMED <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

C++ built this out of a `std::queue`, a mutex, a condition variable and a
`done` flag; Zig 0.16 ships the whole thing as one type. `std.Io.Queue(T)`
is a bounded channel over a buffer you own: `putOneUncancelable(io, v)`
blocks while it is full, `getOneUncancelable(io)` blocks while it is empty,
and after `close(io)` a `get` on a drained queue returns `error.Closed` —
which is the consumer's signal to stop, and the loop is `while
(q.getOneUncancelable(io)) |v| { ... } else |_| {}`. The queue is FIFO, so
the order is the input order whatever the scheduler does.

`io.concurrent(func, .{ args })` starts `func` on the runtime's own pool —
it is guaranteed its own unit of concurrency, or the call fails — and hands
back a future; `.await(io)` on it is the join. The starter hangs. The
producer pushes everything and returns, nobody closes the queue, and the
consumer wakes for the last value, drains the queue, and waits for a next
that will not come. Every producer/consumer pair needs a way to say *there
will be no more* — that is what `close` is.
'''
