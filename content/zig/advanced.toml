'''
solution    = '''
const std = @import("std");
const Io = std.Io;

fn square(v: i64) i64 {
    return v * v;
}

// the other end of the pipe: one value in, and whoever is waiting gets it
fn report(io: Io, ready: *Io.Queue(i64), n: i64) void {
    ready.putOneUncancelable(io, n) catch return;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    var squares: std.ArrayList(Io.Future(i64)) = .empty;
    defer squares.deinit(gpa);
    for (nums) |v| {
        try squares.append(gpa, try io.concurrent(square, .{v}));
    }
    // in order: each await blocks until its own task is done, and no longer
    for (squares.items) |*f| {
        try w.print("{d}\n", .{f.await(io)});
    }

    var slot: [1]i64 = undefined;
    var ready: Io.Queue(i64) = .init(&slot);
    const reporter = try std.Thread.spawn(.{}, report, .{ io, &ready, @as(i64, @intCast(n)) });
    try w.print("READY {d}\n", .{try ready.getOneUncancelable(io)});
    reporter.join();
}
'''
hints = [
  "try io.concurrent(square, .{v}) returns a std.Io.Future(i64); append it to the list as you go, and never copy a future — await it through a pointer, for (squares.items) |*f|.",
  "f.await(io) can be called exactly once per future and blocks until the value is there; walking the list in order gives you the output in order.",
  "The reporter thread gets &ready and n; ready.getOneUncancelable(io) in main blocks until the put has happened. Join the thread before main returns.",
]

