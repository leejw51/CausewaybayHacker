solution    = '''
const std = @import("std");

fn upper(line: []u8) void {
    for (line) |*c| {
        c.* = std.ascii.toUpper(c.*);
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var rows = std.mem.splitScalar(u8, input, '\n');
    const n = try std.fmt.parseInt(usize, std.mem.trim(u8, rows.next() orelse "", " \r"), 10);
    const lines = try gpa.alloc([]u8, n);
    defer gpa.free(lines);
    for (lines) |*line| {
        line.* = try gpa.dupe(u8, std.mem.trim(u8, rows.next() orelse "", "\r"));
    }
    defer for (lines) |line| gpa.free(line);

    // one handle per thread, kept until it is joined
    const threads = try gpa.alloc(std.Thread, n);
    defer gpa.free(threads);
    for (threads, 0..) |*t, i| {
        t.* = try std.Thread.spawn(.{}, upper, .{lines[i]});
    }
    for (threads) |t| {
        t.join();
    }

    for (lines) |line| {
        try w.print("{s}\n", .{line});
    }
    try w.print("DONE\n", .{});
}
'''
