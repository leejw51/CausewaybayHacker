'''
solution    = '''
const std = @import("std");

const Stops = struct {
    start: i64,
    step: i64,
    count: i64,

    // the iterator is a small struct of its own: where it is, how it moves,
    // and how many are left
    const Iter = struct {
        value: i64,
        step: i64,
        left: i64,

        fn next(self: *Iter) ?i64 {
            if (self.left == 0) return null;
            const current = self.value;
            self.value += self.step;
            self.left -= 1;
            return current;
        }
    };

    fn iter(self: Stops) Iter {
        return .{ .value = self.start, .step = self.step, .left = self.count };
    }
};

// the same contract, walked by a different loop
fn total(stops: Stops) i64 {
    var sum: i64 = 0;
    var walk = stops.iter();
    while (walk.next()) |value| {
        sum += value;
    }
    return sum;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const start = try std.fmt.parseInt(i64, it.next().?, 10);
    const step = try std.fmt.parseInt(i64, it.next().?, 10);
    const count = try std.fmt.parseInt(i64, it.next().?, 10);

    const stops = Stops{ .start = start, .step = step, .count = count };
    var walk = stops.iter();
    while (walk.next()) |value| {
        try w.print("{d}\n", .{value});
    }
    try w.print("SUM {d}\n", .{total(stops)});
}
'''
hints = [
  "The iterator is a nested struct: const Iter = struct { value, step, left, fn next(self: *Iter) ?i64 }. next takes *Iter because it moves the iterator.",
  "next returns null when left is 0; otherwise it remembers the current value, advances, counts down, and returns what it remembered.",
  "The loop variable must be var — var walk = stops.iter() — or next cannot take its address; total builds its own with a second stops.iter().",
]

