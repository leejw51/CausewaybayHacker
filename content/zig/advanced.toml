solution    = '''
const std = @import("std");

// a number or nothing: the error becomes the null half of the optional
fn parse(text: []const u8) ?i64 {
    return std.fmt.parseInt(i64, text, 10) catch return null;
}

const Doubled = union(enum) {
    value: i64,
    bad: []const u8,
};

fn doubled(text: []const u8) Doubled {
    if (parse(text)) |value| {
        return .{ .value = value * 2 };
    }
    return .{ .bad = text };
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var sum: i64 = 0;
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const line = it.next().?;
        switch (doubled(line)) {
            .value => |v| {
                try w.print("{d}\n", .{v});
                sum += v;
            },
            .bad => |text| try w.print("BAD {s}\n", .{text}),
        }
    }
    try w.print("SUM {d}\n", .{sum});
}
'''
