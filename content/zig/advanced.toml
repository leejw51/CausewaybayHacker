and `fetchAdd` needs a `*std.atomic.Value(i64)` — all a by-value parameter
offers is a `*const`. That is deliberate. An atomic is a location that
several threads agree to update one instruction at a time; a copy of it
would be a different location, and the sharing would be gone. Pass the
addresses.

