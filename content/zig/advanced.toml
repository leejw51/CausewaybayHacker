pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var count = std.StringHashMap(i64).init(gpa);
    defer count.deinit();
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const name = it.next().?;
        const slot = try count.getOrPut(name);
        if (!slot.found_existing) slot.value_ptr.* = 0;
        slot.value_ptr.* += 1;
    }

    // Walking the hash table. The names come out in whatever order its
    // buckets happen to be in, which is not the order they arrived.
    var entries = count.iterator();
    while (entries.next()) |e| {
        try w.print("{s} {d}\n", .{ e.key_ptr.*, e.value_ptr.* });
    }
    try w.print("DISTINCT {d}\n", .{count.count()});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var order: std.ArrayList([]const u8) = .empty;
    defer order.deinit(gpa);
    var count = std.StringHashMap(i64).init(gpa);
    defer count.deinit();
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const name = it.next().?;
        const slot = try count.getOrPut(name);
        // the insert happens once per distinct name, and that is the one
        // moment to remember its place in the order
        if (!slot.found_existing) {
            slot.value_ptr.* = 0;
            try order.append(gpa, name);
        }
        slot.value_ptr.* += 1;
    }

    for (order.items) |name| {
        try w.print("{s} {d}\n", .{ name, count.get(name).? });
    }
    try w.print("DISTINCT {d}\n", .{order.items.len});
}
'''
