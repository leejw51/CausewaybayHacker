    // and taking the lock needs the real mutex, not a copy of it
    fn snapshot(self: *Counter, io: std.Io) Snapshot {
        self.mutex.lockUncancelable(io);
        defer self.mutex.unlock(io);
        return .{ .total = self.total, .hits = self.hits };
    }
};

