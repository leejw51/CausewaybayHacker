Standard input is a count `n` and then `n` integers.

Start one thread per value that adds it to **one shared total**. Join them
all, then print `TOTAL <sum>` and `THREADS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

The starter compiles and prints `TOTAL 0`. The worker takes `total` **by
value** — an `i64` copied into the thread's argument tuple — adds to its own
copy and throws it away. Pass a pointer, `*i64`, and you have a different
bug, the one that does not show up in a test this small: `total.* += value`
from several threads at once is a **data race**. Zig's Debug checks do not
catch it; a race is undefined behaviour here exactly as it is in C++, not
merely a wrong number.

A `std.Io.Mutex` next to the total, locked by every thread that touches it,
is the answer: `m.lockUncancelable(io)` takes it, `defer m.unlock(io)`
gives it back at the end of the block whatever happens in between. The
worker takes `io: std.Io` as a parameter because the mutex needs it — in
0.16 the lock is part of the I/O runtime, not the thread library, and
`std.Thread.Mutex` no longer exists. The `defer` is the C++ `lock_guard`,
written out where the unlock will happen.
'''
