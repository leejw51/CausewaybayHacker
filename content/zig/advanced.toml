    var head: ?*Entry = null;
    defer freeChain(gpa, head);
    var k = amounts.len;
    while (k > 0) {
        k -= 1;
        const node = try gpa.create(Entry);
        node.* = .{ .cents = amounts[k], .next = head };
        head = node;
    }

    if (head == null) {
        try w.print("-\n", .{});
    } else {
        var first = true;
        var walk = head;
        while (walk) |node| : (walk = node.next) {
            try w.print("{s}{d}", .{ if (first) "" else " ", node.cents });
            first = false;
        }
        try w.print("\n", .{});
    }

    try w.print("SUM {d}\n", .{sum(head)});

    var last: ?*Entry = head;
    while (last) |node| {
        if (node.next == null) break;
        last = node.next;
    }
    if (last) |node| {
