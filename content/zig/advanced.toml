[[quest]]
id          = "zig.advanced.07.maps"
node        = 7
title       = "WHAT THE PLAZA SHOUTS"
difficulty  = 3
story       = "The toll plaza at 06:30: every booth calling something across the lanes, and the supervisor wants the ranking."
concepts    = ["collections", "sorting", "closures"]
requires    = ["zig.advanced.06.tagged-union"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, and ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```

`std.StringHashMap(i64)` is ordered by nothing — not by key, not by count,
not by arrival — so the ranking is a separate step: copy the entries into a
`std.ArrayList` of small structs and `std.mem.sort` it with a comparator.
`getOrPut(word)` finds the slot or inserts it and tells you which with
`found_existing`, which is exactly what a counting loop wants; a fresh slot's
`value_ptr` is uninitialised until you write it.

Zig has no lambda. The comparator is an ordinary function, passed by name,
with a first parameter for the context it would have captured — `{}` here,
of type `void`, because it captures nothing. The keys are slices of `input`,
so the map must be `deinit`ed before `input` is freed: `defer` in the right
order does that without a line of thought.
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var counts = std.StringHashMap(i64).init(gpa);
    defer counts.deinit();

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |word| {
        // count it
        _ = word;
    }

    // copy into a list, sort by count desc then word asc, print
}
'''
solution    = '''
const std = @import("std");

const Row = struct {
    word: []const u8,
    count: i64,
};

// true when a must come before b: count descending, word ascending on a tie
fn byRank(_: void, a: Row, b: Row) bool {
    if (a.count != b.count) {
        return a.count > b.count;
    }
    return std.mem.order(u8, a.word, b.word) == .lt;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var counts = std.StringHashMap(i64).init(gpa);
    defer counts.deinit();

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |word| {
        const slot = try counts.getOrPut(word);
        if (!slot.found_existing) slot.value_ptr.* = 0;
        slot.value_ptr.* += 1;
    }

    var rows: std.ArrayList(Row) = .empty;
    defer rows.deinit(gpa);
    var entries = counts.iterator();
    while (entries.next()) |e| {
        try rows.append(gpa, .{ .word = e.key_ptr.*, .count = e.value_ptr.* });
    }
    std.mem.sort(Row, rows.items, {}, byRank);

    for (rows.items) |row| {
        try w.print("{s} {d}\n", .{ row.word, row.count });
    }
}
'''
hints = [
  "getOrPut(word) returns a slot with found_existing and value_ptr; set value_ptr.* = 0 when it is new, then add one. That is the whole counting loop.",
  "counts.iterator() walks the entries; each has key_ptr and value_ptr. Append a Row per entry to a std.ArrayList(Row).",
  "The comparator is fn byRank(_: void, a: Row, b: Row) bool — count descending first, then std.mem.order(u8, a.word, b.word) == .lt — and std.mem.sort(Row, rows.items, {}, byRank) applies it.",
]

