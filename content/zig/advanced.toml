[[quest]]
id          = "zig.advanced.05.structs"
node        = 5
title       = "THE BOOTH LEDGER"
difficulty  = 3
story       = "Booth 2 charges every axle and keeps the lines on one ledger form, or it did before the suggestion replaced the struct's functions with a comment."
concepts    = ["structs", "functions", "mutability"]
requires    = ["zig.advanced.04.strings"]
map          = { x = 0.604, y = 0.137, kind = "quest" }
brief       = '''
Line one is `<NAME> <n>`. The next `n` lines are `<ITEM> <CENTS>`.

Build a `Ledger` for the name that collects the items, then print each item
back as `<ITEM> <CENTS>` in the order it arrived, then `TOTAL <sum>`, then
`BOAT <name> <count>` — the ledger form is the ferry company's, and its name
field still says `BOAT`.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` may be `0`, and then the output is the last two lines only.

Zig has no `class`; the nearest thing is a `struct` with functions declared
inside it, and it is the whole thing. There is no constructor that runs
behind your back: `init` is an ordinary function you write that returns the
value. There is no hidden `this`: `self` is the first parameter, spelled
out — `*Ledger` when the function writes to the ledger, `*const Ledger` when
it only reads — and that is `const` on a method, made visible. There is no
`private:` either; a field is reachable from anywhere in the file, and what
keeps `main` out of `items` is that the struct offers `total()` and
`count()` and there is no reason to go around them.
'''
starter     = '''
const std = @import("std");

const Item = struct {
    name: []const u8,
    cents: i64,
};

const Ledger = struct {
    boat: []const u8,
    items: std.ArrayList(Item),

    fn init(boat: []const u8) Ledger {
        // what does a ledger have to remember?
        return .{ .boat = boat, .items = .empty };
    }

    fn deinit(self: *Ledger, gpa: std.mem.Allocator) void {
        self.items.deinit(gpa);
    }

    fn add(self: *Ledger, gpa: std.mem.Allocator, name: []const u8, cents: i64) !void {
        _ = self;
        _ = gpa;
        _ = name;
        _ = cents;
    }

    fn total(self: *const Ledger) i64 {
        _ = self;
        return 0;
    }

    // count() is missing
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const boat = it.next().?;
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var ledger = Ledger.init(boat);
    defer ledger.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const item = it.next().?;
        const cents = try std.fmt.parseInt(i64, it.next().?, 10);
        try ledger.add(gpa, item, cents);
    }

    // print each item, then TOTAL, then BOAT <name> <count>
    try w.print("TOTAL {d}\n", .{ledger.total()});
}
'''
solution    = '''
const std = @import("std");

const Item = struct {
    name: []const u8,
    cents: i64,
};

const Ledger = struct {
    boat: []const u8,
    items: std.ArrayList(Item),

    // no constructor runs on its own: init is a function that returns the value
    fn init(boat: []const u8) Ledger {
        return .{ .boat = boat, .items = .empty };
    }

    fn deinit(self: *Ledger, gpa: std.mem.Allocator) void {
        self.items.deinit(gpa);
    }

    // *Ledger: this function writes to the ledger
    fn add(self: *Ledger, gpa: std.mem.Allocator, name: []const u8, cents: i64) !void {
        try self.items.append(gpa, .{ .name = name, .cents = cents });
    }

    // *const Ledger: this one only reads, and the signature says so
    fn total(self: *const Ledger) i64 {
        var sum: i64 = 0;
        for (self.items.items) |item| {
            sum += item.cents;
        }
        return sum;
    }

    fn count(self: *const Ledger) usize {
        return self.items.items.len;
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const boat = it.next().?;
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    var ledger = Ledger.init(boat);
    defer ledger.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        const item = it.next().?;
        const cents = try std.fmt.parseInt(i64, it.next().?, 10);
        try ledger.add(gpa, item, cents);
    }

    for (ledger.items.items) |item| {
        try w.print("{s} {d}\n", .{ item.name, item.cents });
    }
    try w.print("TOTAL {d}\n", .{ledger.total()});
    try w.print("BOAT {s} {d}\n", .{ ledger.boat, ledger.count() });
}
'''
hints = [
  "A std.ArrayList(Item) is enough; the struct is there so the ledger owns its own lines. add is one append: self.items.append(gpa, .{ .name = name, .cents = cents }).",
  "self: *Ledger for add, because it writes; self: *const Ledger for total and count, because they only read. ledger.add(...) is the same call either way — Zig takes the address for you.",
  "The item names are slices of input, so the ledger costs nothing to fill and input has to outlive it — which the defer order in main already guarantees.",
]

