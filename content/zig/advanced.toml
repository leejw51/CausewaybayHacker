    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    var slots: [4]i64 = undefined;
    var hatch: Io.Queue(i64) = .init(&slots);
    var consumed: i64 = 0;

    var taking = try io.concurrent(consumer, .{ io, &hatch, w, &consumed });
    var feeding = try io.concurrent(producer, .{ io, &hatch, nums });

    feeding.await(io);
