brief       = '''
Standard input is one line of integers separated by spaces.

Print four lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are
4. `FIRST_BIG <i>` — the 0-based index of the first value greater than `10`,
   or `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Zig has no `<algorithm>` and no lambda, and the nearest thing is closer than
it sounds: a function that takes **another function as a `comptime`
parameter**. `fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64`
is `accumulate` with a predicate; you pass `isEven` by name, the compiler
stamps out a version of `sumIf` with the call inlined, and there is no
function pointer at run time. Write `sumIf`, `keepDoubled`, a distinct count
from `std.mem.sort` on a copy plus one pass over adjacent pairs, and
`indexOfFirst`. The point is not that the loop is hard to write; it is that
the name says what the loop is for, and the predicate is a value you can
read.
'''
starter     = '''
