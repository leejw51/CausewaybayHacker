[[quest]]
id          = "zig.advanced.15.iterators"
node        = 15
title       = "YOUR OWN WHILE LOOP"
difficulty  = 3
story       = "The plaza's axle gauge ticks through every reading from the start to the end of the shift and stores none of them anywhere."
concepts    = ["iteration", "structs", "functions"]
requires    = ["zig.advanced.14.error-sets"]
map          = { x = 0.055, y = 0.556, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Give `Stops` an iterator so that a `while` loop over it yields `count`
values beginning at `start` and advancing by `step`. Print each on its own
line, then `SUM <total>` computed by a `total` function over a fresh
iterator from the same `Stops`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

The starter does not compile: `main` calls `stops.iter()` and `Stops` has
no such function. Zig has no iterator protocol and no trait to inherit
from. An iterator is a **struct with a `next` method that returns an
optional** — `?i64` here — and the loop that walks it is `while
(it.next()) |value| { ... }`, which stops on the first `null`. That is the
entire contract, and it is the one `std.mem.tokenizeAny` and every `std`
iterator you have used on this road keeps.

`total` walks the same contract with the same `while`; give it a fresh
iterator, because an iterator that has reached `null` stays there.
'''
starter     = '''
