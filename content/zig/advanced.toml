id          = "zig.advanced.27.optional-pointer"
node        = 27
title       = "A SIZE THE COMPILER CAN NAME"
difficulty  = 4
story       = "The chain of toll receipts on the spike at booth 2: every receipt holds the next one, all the way down to the first of the shift, and nobody holds any receipt twice."
