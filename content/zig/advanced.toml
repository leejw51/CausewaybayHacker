'''
solution    = '''
const std = @import("std");

// one definition; Ring(i64) and Ring([]const u8) are two types stamped from it
fn Ring(comptime T: type) type {
    return struct {
        slots: []T,
        head: usize = 0,
        count: usize = 0,
        dropped: usize = 0,

        const Self = @This();

        fn init(gpa: std.mem.Allocator, cap: usize) !Self {
            return .{ .slots = try gpa.alloc(T, cap) };
        }

        fn deinit(self: *Self, gpa: std.mem.Allocator) void {
            gpa.free(self.slots);
        }

        fn push(self: *Self, item: T) void {
            self.slots[self.head] = item;
            self.head = (self.head + 1) % self.slots.len;
            if (self.count < self.slots.len) {
                self.count += 1;
            } else {
                self.dropped += 1;
            }
        }

        // walks from the oldest item to the newest, wrapping round the buffer
        const Iter = struct {
            ring: *const Self,
            offset: usize = 0,

            fn next(it: *Iter) ?T {
                if (it.offset >= it.ring.count) return null;
                const cap = it.ring.slots.len;
                const oldest = (it.ring.head + cap - it.ring.count) % cap;
                const item = it.ring.slots[(oldest + it.offset) % cap];
                it.offset += 1;
                return item;
            }
        };

        fn iter(self: *const Self) Iter {
            return .{ .ring = self };
        }
    };
}

// one printer serves both rings; the format is chosen at compile time
fn printRing(w: *std.Io.Writer, comptime T: type, ring: *const Ring(T)) !void {
    var it = ring.iter();
    var first = true;
    while (it.next()) |item| {
        if (!first) try w.print(" ", .{});
        if (comptime T == []const u8) {
            try w.print("{s}", .{item});
        } else {
            try w.print("{d}", .{item});
        }
        first = false;
    }
    try w.print("\n", .{});
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
