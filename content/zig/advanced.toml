Standard input is a count `n` and then `n` integers.

Put the values in a slice owned by a `Ledger` that **counts its holders**:
`share()` hands out a handle and bumps the count, `release(gpa)` drops the
count and frees the slice when it reaches zero. Take two handles, and keep
