brief       = '''
Standard input is a count `n`, then `n` lines, each meant to be a distance in
km.

`fare(text)` parses with `std.fmt.parseInt` — which **fails** with
`error.InvalidCharacter` on `xx`, translated inside `fare` into its own
`error.NotANumber` — and rejects a negative distance with a second error of
your own, `error.NegativeDistance`. Both come from one named error set,
`FareError`. Otherwise it returns `500 + 100 * km`.

Print one line per input line: the fare, or `not a number` when it does not
parse, or `negative distance: <km>` when the distance is negative. Then
print `ERRORS <k>`, how many lines failed.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

The starter compiles and dies on `xx`: `try fare(text)` in `main` hands the
error up, and there is nobody above `main` — the program prints `error:
NotANumber` and a trace and exits `1`. That is the whole of Zig's
error story: an error is a value in the return type, `!i64`, and every call
site either `try`s it upward or `catch`es it. Nothing unwinds past a
function that did not say it could fail.

A Zig error is a **name**, not an object: it carries no message and no
payload, which is why `negative distance: <km>` is built by the caller, who
still holds the text. `catch |e| switch (e) { ... }` is the two-armed catch,
and the switch must name every error in the set — the C++ `catch (const
std::runtime_error&)` that would silently swallow the derived one has no
equivalent, because there is no hierarchy to slice.
