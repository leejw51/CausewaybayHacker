[[quest]]
id          = "zig.advanced.03.slices"
node        = 3
title       = "THE MIDDLE OF THE QUEUE"
difficulty  = 2
story       = "Forty vehicles backed up at booth 4 before six. The supervisor can see the front bumper and the last tail light and nothing in between."
concepts    = ["slices", "iteration", "control-flow"]
requires    = ["zig.advanced.02.pointers"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` on the first line and then `n` integers on the
second, separated by spaces. `n` is at least `1`.

Print three lines: the first value, the last value, and the sum of everything
strictly between them. With fewer than three values that sum is `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

A slice is the sequence. `nums[0]` and `nums[nums.len - 1]` are the ends;
`nums[1 .. nums.len - 1]` is the middle, a **new slice** onto the same bytes
with no copy made, and a `for` over it is the sum. Slicing is checked like
indexing: `nums[1..0]`, which is what the middle of a one-element queue
works out to, is `panic: start index 1 is larger than end index 0`, so the
guard on `nums.len` goes before the slice, not after.

Sum in `i64`. One of the hidden cases has a middle that does not fit in
`i32`, and in `-O Debug` an `i32` that overflows does not wrap — it panics.
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    // print nums[0], nums[nums.len - 1], then the sum of the middle
    try w.print("{d}\n", .{nums[0]});
    try w.print("{d}\n", .{nums[0]});
    try w.print("0\n", .{});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    try w.print("{d}\n", .{nums[0]});
    try w.print("{d}\n", .{nums[nums.len - 1]});

    var middle: i64 = 0;
    if (nums.len > 2) {
        // a window onto the same memory: nothing is copied
        for (nums[1 .. nums.len - 1]) |v| {
            middle += v;
        }
    }
    try w.print("{d}\n", .{middle});
}
'''
hints = [
  "nums[1 .. nums.len - 1] is the slice between the ends; a for over it sums it. It shares the memory with nums.",
  "With one or two values that range is empty or backwards, and a backwards slice is a panic in Debug — guard it with an if on nums.len before you write it.",
  "The middle is an i64: the wide case sums two values of three thousand million, and an i32 accumulator would panic with integer overflow.",
]

