'''
solution    = '''
const std = @import("std");

fn isEven(x: i64) bool {
    return @mod(x, 2) == 0;
}

fn isBig(x: i64) bool {
    return x > 10;
}

// 1. the predicate is the "add this one only if" rule, resolved at compile time
fn sumIf(xs: []const i64, comptime keep: fn (i64) bool) i64 {
    var acc: i64 = 0;
    for (xs) |x| {
        if (keep(x)) acc += x;
    }
    return acc;
}

// 2. select, then map, into a list the caller owns
fn keepDoubled(gpa: std.mem.Allocator, xs: []const i64, comptime keep: fn (i64) bool) !std.ArrayList(i64) {
    var out: std.ArrayList(i64) = .empty;
    errdefer out.deinit(gpa);
    for (xs) |x| {
        if (keep(x)) try out.append(gpa, x * 2);
    }
    return out;
}

// 3. adjacent duplicates only, so sort a copy first
fn distinctCount(gpa: std.mem.Allocator, xs: []const i64) !usize {
    const sorted = try gpa.dupe(i64, xs);
    defer gpa.free(sorted);
    std.mem.sort(i64, sorted, {}, std.sort.asc(i64));
    var count: usize = 0;
    for (sorted, 0..) |x, i| {
        if (i == 0 or sorted[i - 1] != x) count += 1;
    }
    return count;
}

// 4. null when nothing matches; the caller decides what that prints as
fn indexOfFirst(xs: []const i64, comptime pred: fn (i64) bool) ?usize {
    for (xs, 0..) |x, i| {
        if (pred(x)) return i;
    }
    return null;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var nums: std.ArrayList(i64) = .empty;
    defer nums.deinit(gpa);
    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    while (it.next()) |tok| {
        try nums.append(gpa, try std.fmt.parseInt(i64, tok, 10));
    }

    try w.print("{d}\n", .{sumIf(nums.items, isEven)});

    var big = try keepDoubled(gpa, nums.items, isBig);
    defer big.deinit(gpa);
    if (big.items.len == 0) {
        try w.print("-\n", .{});
    } else {
        for (big.items, 0..) |x, i| {
            try w.print("{s}{d}", .{ if (i == 0) "" else " ", x });
        }
        try w.print("\n", .{});
    }

    try w.print("{d}\n", .{try distinctCount(gpa, nums.items)});

    if (indexOfFirst(nums.items, isBig)) |i| {
        try w.print("FIRST_BIG {d}\n", .{i});
    } else {
        try w.print("FIRST_BIG -1\n", .{});
    }
}
'''
hints = [
  "comptime keep: fn (i64) bool is the parameter type; inside the body keep(x) is an ordinary call, and at the call site you pass isEven with no parentheses.",
  "keepDoubled needs somewhere to write: return a std.ArrayList(i64) the caller deinits, and errdefer its deinit inside so an append failure does not leak it.",
  "gpa.dupe(i64, xs) is the copy to sort; a sorted slice has its duplicates adjacent, so a value is new exactly when it differs from the one before it.",
  "indexOfFirst returns ?usize; if (indexOfFirst(...)) |i| prints the hit, and the else branch prints -1.",
]

