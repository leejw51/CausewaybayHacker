requires    = ["zig.advanced.26.futures"]
map          = { x = 0.199, y = 0.742, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` amounts in cents.

Hold them in a chain, one node per amount, in the order they arrived:

```
const Entry = struct {
    cents: i64,
    next: ?*Entry,
};
```

Print three lines:

1. the amounts in order, space separated, or `-` if there are none
2. `SUM <total>`, from a **recursive** function over the chain
3. `LAST <cents>` — the amount on the final node — or `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

The starter does not compile, and the error is the reason pointers exist.
Write `next: Entry` and the compiler has to lay `Entry` out in memory: eight
bytes for `cents` plus however big an `Entry` is — which is the thing it is
trying to work out. *struct 'Entry' depends on itself.*

A `?*Entry` is a pointer, and a pointer has a size the compiler already
knows. Zig has no `unique_ptr`; the nearest thing is the rule it enforced,
kept by hand: **the allocator is the owner.** `gpa.create(Entry)` hands you
a node and `gpa.destroy(node)` hands it back, exactly once, and the
question of *who* destroys it is answered by convention — the chain owns
its nodes, so `main` walks the chain to free it before it returns. The
`?` is the part the compiler does check: `null` is both the end of the
chain and the empty chain, and nothing reads through a `?*Entry` without
unwrapping it, so there is no separate empty case anywhere.
