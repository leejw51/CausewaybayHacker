fn isEven(x: i64) bool {
    return @mod(x, 2) == 0;
}

fn isBig(x: i64) bool {
    return x > 10;
}

// sumIf, keepDoubled, distinctCount, indexOfFirst go here

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
