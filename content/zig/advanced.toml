  "std.fmt.parseInt(i64, text, 10) catch return null is the whole of parse: on success the value falls through as the optional's payload, on any error the function returns null.",
  "An optional unwraps with if (parse(text)) |value|; the else path is the null, and that is where the .bad case is built.",
  "Returning .{ .value = v } or .{ .bad = text } from the same function is legal because the return type is a union that holds either; the switch in main picks the branch, with the payload captured in |v| or |text|.",
]

