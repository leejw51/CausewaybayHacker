```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

The starter keeps the total in an `i32` and panics on the second value:
`panic: integer overflow`. That is Zig doing exactly what this land promised
— in `-O Debug` an integer that overflows says so and stops, and the wide
case stops one line earlier, at the `@intCast` that would have truncated
`5000000000`. Read the panic as a gift and then read the rest of the
contract: `+%` wraps, `+|` saturates, and plain `+` panics in Debug and is
**undefined behaviour in `-O ReleaseFast`**, where the check is off and the
optimiser assumes it never happens — so `total + v < total` with positive
`v` is *always false* there, and the test is deleted, exactly as gcc and
clang delete it for C++.

So you never detect overflow by causing it. You detect it *before* the
narrow addition, in a wider type or by comparing against the limits —
`std.math.minInt(i32)` and `std.math.maxInt(i32)` — and this program's
expected output depends on nothing that any build mode leaves undefined.
