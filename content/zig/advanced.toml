Standard input is a count `n` and then `n` integers, each of which fits in an
`i64`. Their running total fits in an `i64` too.

Print two lines: `INT32 OK` if every running total along the way fits in an
`i32`, or `INT32 OVERFLOW <i>` with the 0-based index of the first value
