[[quest]]
id          = "zig.advanced.10.comptime-fn"
node        = 10
title       = "ONE PASS DOWN THE LANE"
difficulty  = 4
story       = "The axle log is a column of counts. Alex says four for loops. Mei says four for loops with names on them, and the names are functions."
concepts    = ["iteration", "closures", "sorting"]
