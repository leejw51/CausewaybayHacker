'''
solution    = '''
const std = @import("std");

fn summer(nums: []const i64, out: *i64) void {
    var total: i64 = 0;
    for (nums) |v| {
        total += v;
    }
    out.* = total;
}

fn onStop(callback: *std.atomic.Value(bool)) void {
    callback.store(true, .release);
}

// checks its flag on every turn, so it can always be shut down
fn lane(stop: *std.atomic.Value(bool), stopped: *std.atomic.Value(bool), callback: *std.atomic.Value(bool)) void {
    while (!stop.load(.acquire)) {
        std.Thread.yield() catch {};
    }
    onStop(callback);
    stopped.store(true, .release);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    var sum: i64 = 0;
    var stop = std.atomic.Value(bool).init(false);
    var stopped = std.atomic.Value(bool).init(false);
    var callback = std.atomic.Value(bool).init(false);

    const adder = try std.Thread.spawn(.{}, summer, .{ nums, &sum });
    const night = try std.Thread.spawn(.{}, lane, .{ &stop, &stopped, &callback });

    // request, then wait: the jthread destructor, written out
    stop.store(true, .release);
    night.join();
    adder.join();

    try w.print("SUM {d}\n", .{sum});
    try w.print("STOPPED {s}\n", .{if (stopped.load(.acquire)) "yes" else "no"});
    try w.print("CALLBACK {s}\n", .{if (callback.load(.acquire)) "yes" else "no"});
}
'''
hints = [
  "The lane thread takes the three flags by pointer; its loop is while (!stop.load(.acquire)) std.Thread.yield() catch {}; and after the loop it calls onStop and stores stopped.",
  "Spawn the lane before you set the flag, and join it after. A flag set before the thread starts is fine — it stops on its first check — but a join without the store never returns.",
  ".release on the store and .acquire on the load are the pair that makes what happened before the store visible after the load; .monotonic would also pass here, and the interviewer will ask why.",
]

