solution    = '''
const std = @import("std");

const Ledger = struct {
    // the count lives next to the thing it counts holders of
    refs: usize = 0,
    items: ?[]i64 = null,

    // a handle: the count goes up, and the caller owes one release
    fn share(self: *Ledger) *Ledger {
        self.refs += 1;
        return self;
    }

    // the count goes down; the last one out frees the slice
    fn release(self: *Ledger, gpa: std.mem.Allocator) void {
        self.refs -= 1;
        if (self.refs == 0) {
            if (self.items) |items| gpa.free(items);
            self.items = null;
        }
    }

    // the watcher's question: is the object still there?
    fn alive(self: *const Ledger) bool {
        return self.items != null;
    }
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    var ledger = Ledger{};
    ledger.items = try gpa.alloc(i64, n);
    for (ledger.items.?) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    // two owners of the same slice: the handle is the count, not a copy of the data
    const first = ledger.share();
    const mirror = ledger.share();
    // a watcher: sees the object, does not keep it alive
    const watch: *const Ledger = &ledger;

    var sum: i64 = 0;
    for (mirror.items.?) |v| sum += v;
    try w.print("REF {d}\n", .{sum});
    try w.print("SHARED {d}\n", .{ledger.refs});
    try w.print("ALIVE {s}\n", .{if (watch.alive()) "yes" else "no"});

    first.release(gpa);
    mirror.release(gpa);
    // the count reached zero on the second release, and the slice is gone
    try w.print("ALIVE {s}\n", .{if (watch.alive()) "yes" else "no"});
}
'''
