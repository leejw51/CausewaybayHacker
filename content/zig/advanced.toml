[[quest]]
id          = "zig.advanced.26.futures"
node        = 26
title       = "PROMISE ME THE COUNT"
difficulty  = 4
story       = "The supervisor sends a runner to fetch each figure and does not stand at the hatch waiting; the figures come back when they come back."
concepts    = ["async", "concurrency", "closures"]
requires    = ["zig.advanced.25.parallel-sum"]
map          = { x = 0.394, y = 0.686, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one `io.concurrent` task per value that returns the value squared.
Collect the futures in a list and `await` them **in order**, printing each.
Then hand a one-slot `std.Io.Queue(i64)` to one more thread that puts `n`
into it, and print `READY <n>` from what comes out.

```
input:  3
        2 3 4
output: 4
        9
        16
        READY 3
```

A future is a value that is not here yet. `io.concurrent(square, .{ v })`
starts `square` on the runtime's pool and gives you a `std.Io.Future(i64)`
for its return value; `.await(io)` blocks until it exists and then hands it
over, once. Awaiting the futures in order is what puts the output in order —
the tasks themselves finish whenever they finish.

Zig has no `std::promise`; the nearest thing is the other end of the same
pipe, and 0.16 already has the pipe. A `std.Io.Queue(i64)` over a **one-
element** buffer is a promise: one side puts the value in, the other side
takes it out, and the taker blocks until it is there. It is how a thread
reports one result without a mutex, a flag, or a return value to wrap — and
it is the same type the hatch was, three quests ago, with a buffer of one.

`io.concurrent` promises the task runs on its own — it fails with
`error.ConcurrencyUnavailable` if the runtime cannot give it a thread —
while `io.async` makes the weaker promise: the function *may* be called
right there, before `async` returns, on a runtime that has no second
thread to offer. Say `concurrent` out loud when you mean it.
'''
starter     = '''
const std = @import("std");
const Io = std.Io;

fn square(v: i64) i64 {
    return v * v;
}

fn report(io: Io, ready: *Io.Queue(i64), n: i64) void {
    ready.putOneUncancelable(io, n) catch return;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    var squares: std.ArrayList(Io.Future(i64)) = .empty;
    defer squares.deinit(gpa);
    // one io.concurrent per value; then await each in order and print

    var slot: [1]i64 = undefined;
    var ready: Io.Queue(i64) = .init(&slot);
    // a thread puts n into ready; print READY from what comes out
    _ = &ready;
    try w.print("READY 0\n", .{});
