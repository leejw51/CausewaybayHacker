input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

Zig has no `shared_ptr`; the nearest thing is what `shared_ptr` is
underneath, written where you can see it. The last quest was one owner.
This one is a count of owners, kept next to the object, and the object is
freed when the count reaches zero — by whichever handle happened to go last.
`share()` bumps the count; `release()` drops it. Nothing does either for
you: no destructor runs at a closing brace, so every `share()` is matched by
a `release()` you wrote, or the slice leaks and `-O Debug`'s allocator says
so on stderr when `main` returns.

