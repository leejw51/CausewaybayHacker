const Stops = struct {
    start: i64,
    step: i64,
    count: i64,

    // an Iter type with next() ?i64, and iter() that returns one
};

fn total(stops: Stops) i64 {
    _ = stops;
    return 0;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const start = try std.fmt.parseInt(i64, it.next().?, 10);
    const step = try std.fmt.parseInt(i64, it.next().?, 10);
    const count = try std.fmt.parseInt(i64, it.next().?, 10);

    const stops = Stops{ .start = start, .step = step, .count = count };
    var walk = stops.iter();
