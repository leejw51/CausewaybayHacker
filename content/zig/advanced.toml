[[quest]]
id          = "zig.advanced.30.generic-ring"
node        = 30
title       = "A RING FOR ANY CARGO"
difficulty  = 4
story       = "The axle gauge keeps the last few readings and the supervisor keeps the last few plate numbers, and Alex wrote the same ring buffer twice."
concepts    = ["generics", "structs", "iteration"]
requires    = ["zig.advanced.29.take"]
map          = { x = 0.26, y = 0.857, kind = "quest" }
brief       = '''
Line one is a capacity `cap`. Line two is a list of integers; line three is
a list of words.

Write **one** `Ring(comptime T: type) type`: a fixed-capacity buffer that
keeps the most recent `cap` items pushed into it, overwriting the oldest,
and can be walked in arrival order. Push the integers into a `Ring(i64)` and
the words into a `Ring([]const u8)`, print each ring's contents on one line,
then `DROPPED <k>` — how many items in total were pushed out.

```
input:  2
        1 2 3 4
        hku tram bus
output: 3 4
        tram bus
        DROPPED 3
```

The starter does not compile: `Ring` is written for `i64`, and the words
have nowhere to go. A generic type in Zig is a **function that returns a
struct**, exactly like `Pair(T)` earlier on this road: `fn Ring(comptime T:
type) type { return struct { ... }; }`, with `[]T` for the slots and `T` for
`push`. The whole of it is written without knowing what `T` is — only that
it can be copied — and `Ring(i64)` and `Ring([]const u8)` are two different
types stamped from the one definition.

Give it an iterator too. The ring is not stored in arrival order — the
oldest item is wherever the write head is about to overwrite — so `next()`
has to do the arithmetic, and that is the part worth writing rather than
reading. Printing needs one `comptime` branch on `T`, because a word is
`{s}` and a number is `{d}`.
'''
starter     = '''
const std = @import("std");

const Ring = struct {
    slots: []i64,
    head: usize = 0,
    count: usize = 0,
    dropped: usize = 0,

    fn init(gpa: std.mem.Allocator, cap: usize) !Ring {
        return .{ .slots = try gpa.alloc(i64, cap) };
    }

    fn deinit(self: *Ring, gpa: std.mem.Allocator) void {
        gpa.free(self.slots);
    }

    fn push(self: *Ring, item: i64) void {
        self.slots[self.head] = item;
        self.head = (self.head + 1) % self.slots.len;
        if (self.count < self.slots.len) {
            self.count += 1;
        } else {
            self.dropped += 1;
        }
    }

    // no iterator: nothing can walk it yet
};

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const cap = try std.fmt.parseInt(usize, std.mem.trim(u8, lines.next() orelse "", " \r"), 10);

    var numbers = try Ring.init(gpa, cap);
    defer numbers.deinit(gpa);
    var ints = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (ints.next()) |tok| {
        numbers.push(try std.fmt.parseInt(i64, tok, 10));
    }

    var words = try Ring.init(gpa, cap);
    defer words.deinit(gpa);
    var text = std.mem.tokenizeAny(u8, lines.next() orelse "", " \r");
    while (text.next()) |tok| {
