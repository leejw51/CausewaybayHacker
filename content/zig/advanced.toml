[[quest]]
id          = "zig.advanced.22.lock-order"
node        = 22
title       = "TWO LOCKS, ONE ORDER"
difficulty  = 4
story       = "Two coin trays under the canopy, two locks, two booths, and both barriers stopped in the same second."
concepts    = ["deadlock", "raii", "shared-state"]
requires    = ["zig.advanced.21.counter"]
map          = { x = 0.953, y = 0.667, kind = "quest" }
brief       = '''
Two trays, `A` and `B`, each an `i64` with its own `std.Io.Mutex`.

Standard input is the starting levels on line one, a count `n` on line two,
and then `n` lines of `<FROM> <TO> <AMOUNT>` with `FROM`/`TO` in `{A, B}`.

Run every transfer on its own thread, join them all, then print
`A <level>`, `B <level>`, `MOVED <n>`.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

Two things are wrong with the starter and only one shows in the output. It
debits the source and never credits the destination — that is the visible
bug. The other is the shape: locking *the source first* means two opposite
transfers can each hold one lock and wait for the other, forever. That is
deadlock, and it does not show in a test; it shows at 07:59 on a Tuesday.

Zig has no `scoped_lock` that takes several mutexes at once; the nearest
thing is the rule it implements, kept by hand. Take both locks in **one
global order** — `A`'s mutex then `B`'s, in every thread, whichever way the
coins are moving — and the cycle cannot form. Two `lockUncancelable`s, two
`defer unlock`s, and the defers release in reverse, which is the order a
`scoped_lock` would have used too.
'''
starter     = '''
const std = @import("std");

const Tray = struct {
    level: i64,
    mutex: std.Io.Mutex = .init,
};

fn transfer(io: std.Io, a: *Tray, b: *Tray, from_a: bool, amount: i64) void {
    // locks whichever side the coins leave, and only that side
    if (from_a) {
        a.mutex.lockUncancelable(io);
        defer a.mutex.unlock(io);
        a.level -= amount;
    } else {
        b.mutex.lockUncancelable(io);
        defer b.mutex.unlock(io);
        b.level -= amount;
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    var a = Tray{ .level = try std.fmt.parseInt(i64, it.next().?, 10) };
    var b = Tray{ .level = try std.fmt.parseInt(i64, it.next().?, 10) };
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    const threads = try gpa.alloc(std.Thread, n);
    defer gpa.free(threads);
    for (threads) |*t| {
        const from = it.next().?;
        _ = it.next().?; // TO is whichever tray FROM is not
        const amount = try std.fmt.parseInt(i64, it.next().?, 10);
        const from_a = std.mem.eql(u8, from, "A");
        t.* = try std.Thread.spawn(.{}, transfer, .{ io, &a, &b, from_a, amount });
    }
    for (threads) |t| {
        t.join();
    }

    try w.print("A {d}\n", .{a.level});
    try w.print("B {d}\n", .{b.level});
    try w.print("MOVED {d}\n", .{n});
}
'''
solution    = '''
const std = @import("std");

const Tray = struct {
    level: i64,
    mutex: std.Io.Mutex = .init,
};

fn transfer(io: std.Io, a: *Tray, b: *Tray, from_a: bool, amount: i64) void {
    // both locks, always in the same order, whichever way the coins move;
    // the defers release them in reverse when the function returns
    a.mutex.lockUncancelable(io);
    defer a.mutex.unlock(io);
    b.mutex.lockUncancelable(io);
    defer b.mutex.unlock(io);
    if (from_a) {
        a.level -= amount;
        b.level += amount;
    } else {
        b.level -= amount;
        a.level += amount;
    }
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    var a = Tray{ .level = try std.fmt.parseInt(i64, it.next().?, 10) };
    var b = Tray{ .level = try std.fmt.parseInt(i64, it.next().?, 10) };
    const n = try std.fmt.parseInt(usize, it.next().?, 10);

    const threads = try gpa.alloc(std.Thread, n);
    defer gpa.free(threads);
    for (threads) |*t| {
        const from = it.next().?;
        _ = it.next().?; // TO is whichever tray FROM is not
        const amount = try std.fmt.parseInt(i64, it.next().?, 10);
        const from_a = std.mem.eql(u8, from, "A");
        t.* = try std.Thread.spawn(.{}, transfer, .{ io, &a, &b, from_a, amount });
    }
    for (threads) |t| {
        t.join();
    }

    try w.print("A {d}\n", .{a.level});
    try w.print("B {d}\n", .{b.level});
    try w.print("MOVED {d}\n", .{n});
}
'''
hints = [
  "Lock both trays before you touch either level: a's mutex, then b's, in that order in every thread, each followed by its defer unlock.",
