brief       = '''
Standard input is a count `n` and then `n` integers.

Finish the `Counter`: `add` takes the lock, adds to the total and bumps the
hit count; `snapshot` takes the lock and returns both together. Start one
thread per value, join them, then print `TOTAL <sum>` and `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

The mutex lives **inside** the struct, next to the fields it guards, and
every function that touches them takes it. That is the shape: the lock is
part of the object, not something callers are trusted to remember.

The starter does not compile, and the reason is worth a minute. `snapshot`
takes `self: Counter` — by value, the way a method that only reads is
usually written — and locking a mutex *changes the mutex*, so
`self.mutex.lockUncancelable(io)` wants a `*std.Io.Mutex` and all it can
get from a by-value `self` is a `*const`. Worse, a by-value `self` is a
**copy** of the counter: even if it compiled, it would lock a copy of the
lock, which locks nothing. The fix is `self: *Counter`. There is no
`mutable` keyword to reach for because there is no `const` method to get
around: a method that must take the lock says so in its signature, and the
signature is the whole promise.
'''
