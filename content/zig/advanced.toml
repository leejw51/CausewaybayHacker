solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    const low: i64 = std.math.minInt(i32);
    const high: i64 = std.math.maxInt(i32);

    // the running total is kept in the wide type, and the narrow range is
    // checked against the limits before anything narrow is ever computed
    var total: i64 = 0;
    var overflow_at: ?usize = null;
    for (nums, 0..) |v, i| {
        total += v;
        if (overflow_at == null and (total < low or total > high)) {
            overflow_at = i;
        }
    }

    if (overflow_at) |i| {
        try w.print("INT32 OVERFLOW {d}\n", .{i});
    } else {
        try w.print("INT32 OK\n", .{});
    }
    try w.print("INT64 {d}\n", .{total});
}
'''
