# ---------------------------------------------------------------- 12
[[quest]]
id          = "zig.advanced.12.function-values"
node        = 12
title       = "THE BARRIER COUNT"
difficulty  = 3
story       = "The barrier at booth 5 counts who drives in and who backs out, and the supervisor wants the number at the end of the shift whatever happened in between."
concepts    = ["closures", "functions", "control-flow"]
requires    = ["zig.advanced.11.generics"]
map          = { x = 0.396, y = 0.276, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each `IN` or `OUT`.

Keep a running count that never drops below zero and print it after every
command. Then print `INS <k>` — how many commands were `IN`, counted with a
generic `countIf` and a predicate function — and `CLOSED <final>`.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

Zig has no closures — no lambda, no capture — and the nearest thing is
written out where you can see it. The counter is a **struct that holds its
own total**, and `add` is a method on `*Counter`: the state a C++ lambda
would have captured with `[total = 0LL]` and marked `mutable` is a field,
and the call that changes it takes the struct by pointer. Nothing outside
the struct can reach the total except through `add`.

The predicate is a **function passed as a `comptime` parameter**:
`countIf(commands, isIn)` names `isIn` and the compiler inlines it. There is
nothing to capture, so nothing is captured, and the question an interviewer
would ask about `[&]` versus `[=]` has no place to hide here.
'''
starter     = '''
const std = @import("std");

const Counter = struct {
    total: i64 = 0,

    // keep a total between calls, clamped at zero, and return it
    fn add(self: *Counter, delta: i64) i64 {
        _ = self;
        _ = delta;
        return 0;
    }
};

fn isIn(command: []const u8) bool {
    return std.mem.eql(u8, command, "IN");
}

// countIf goes here

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    var commands: std.ArrayList([]const u8) = .empty;
    defer commands.deinit(gpa);
    var i: usize = 0;
    while (i < n) : (i += 1) {
        try commands.append(gpa, it.next().?);
    }

    var count = Counter{};
    var last: i64 = 0;
    for (commands.items) |c| {
        last = count.add(if (isIn(c)) 1 else -1);
        try w.print("{d}\n", .{last});
    }

    // INS via countIf with isIn
    try w.print("INS 0\n", .{});
    try w.print("CLOSED {d}\n", .{last});
}
'''
solution    = '''
const std = @import("std");

const Counter = struct {
    // the state a lambda would have captured: a field, and nothing else can see it
    total: i64 = 0,

    fn add(self: *Counter, delta: i64) i64 {
        self.total += delta;
        if (self.total < 0) {
            self.total = 0;
        }
        return self.total;
    }
};

fn isIn(command: []const u8) bool {
    return std.mem.eql(u8, command, "IN");
}

// the predicate is a compile-time parameter: no capture, no function pointer
fn countIf(items: []const []const u8, comptime pred: fn ([]const u8) bool) usize {
