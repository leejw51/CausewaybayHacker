solution    = '''
const std = @import("std");

const Shell = struct {
    name: []const u8,
    seconds: i64,
};

// the address of the matching shell, or null if there is none
fn lookup(table: []Shell, name: []const u8) ?*Shell {
    for (table) |*shell| {
        if (std.mem.eql(u8, shell.name, name)) {
            return shell;
        }
    }
    return null;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const table = try gpa.alloc(Shell, n);
    defer gpa.free(table);
    for (table) |*shell| {
        shell.name = it.next().?;
        shell.seconds = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    const q = try std.fmt.parseInt(usize, it.next().?, 10);
    var k: usize = 0;
    while (k < q) : (k += 1) {
        const name = it.next().?;
        // an optional that may be null is tested before it is followed, every time
        if (lookup(table, name)) |shell| {
            try w.print("{s} FIRES AT {d}\n", .{ name, shell.seconds });
        } else {
            try w.print("{s} UNKNOWN\n", .{name});
        }
    }

    // 0..len-1 is the whole slice; len is one past the end
    var checksum: i64 = 0;
    for (table) |shell| {
        checksum += shell.seconds;
    }
    try w.print("LOADED {d} CHECKSUM {d}\n", .{ n, checksum });
}
'''
