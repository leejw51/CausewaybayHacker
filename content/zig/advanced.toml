word read-modify-written in a single instruction. `fetchAdd(v, .monotonic)`
is that instruction. The moment two fields have to agree with each other,
the lock comes back — there is no atomic for "these two things, together",
which is why the previous quests' `Counter` had a mutex and this one does
not.

