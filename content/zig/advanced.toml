[[quest]]
id          = "zig.advanced.04.strings"
node        = 4
title       = "BYTES ARE NOT LETTERS"
difficulty  = 2
story       = "The plaza's overhead sign truncates 銅鑼灣 at three bytes and shows one character."
concepts    = ["strings", "iteration", "types"]
requires    = ["zig.advanced.03.slices"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''
Read one line. Print three lines:

1. its length in **bytes**
2. its length in **characters** — UTF-8 code points
3. the line with its characters reversed

```
input:  causeway
output: 8
        8
        yawesuac
```

The line may contain characters outside ASCII, and then the first two numbers
are not the same. A Zig string is a `[]const u8`: a slice of bytes, and
`.len` is bytes. It always was. The language knows nothing about encodings at
this level; a `u8` is a byte.

UTF-8 is easy to count without decoding it: every code point starts with a
byte that is **not** of the form `10xxxxxx`, and every continuation byte is.
So a byte `c` begins a character exactly when `(c & 0xC0) != 0x80`. Reverse
the characters, not the bytes — `std.mem.reverse(u8, line)` would cut `銅`
into three pieces and print them backwards.
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const line = std.mem.trim(u8, lines.next() orelse "", "\r");

    try w.print("{d}\n", .{line.len});
    // this is the byte count again, not the character count
    try w.print("{d}\n", .{line.len});
    // reverse the characters, not the bytes: std.mem.reverse on the line
    // itself would cut a three-byte character into three broken bytes
    try w.print("{s}\n", .{line});
}
'''
solution    = '''
const std = @import("std");

// true for the first byte of a UTF-8 sequence, false for a continuation byte
fn startsChar(c: u8) bool {
    return (c & 0xC0) != 0x80;
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var lines = std.mem.splitScalar(u8, input, '\n');
    const line = std.mem.trim(u8, lines.next() orelse "", "\r");

    try w.print("{d}\n", .{line.len});

    // where each character starts: one index per code point
    var starts: std.ArrayList(usize) = .empty;
    defer starts.deinit(gpa);
    for (line, 0..) |c, i| {
        if (startsChar(c)) try starts.append(gpa, i);
    }
    try w.print("{d}\n", .{starts.items.len});

    // walk the characters back to front, copying each one's bytes forwards
    var reversed: std.ArrayList(u8) = .empty;
    defer reversed.deinit(gpa);
    var k = starts.items.len;
    while (k > 0) {
        k -= 1;
        const from = starts.items[k];
        const to = if (k + 1 < starts.items.len) starts.items[k + 1] else line.len;
        try reversed.appendSlice(gpa, line[from..to]);
    }
    try w.print("{s}\n", .{reversed.items});
}
'''
hints = [
  "for (line, 0..) |c, i| walks the bytes with their index; (c & 0xC0) != 0x80 picks out the first byte of every character.",
  "Collect the start index of every character in a std.ArrayList(usize); its length is the character count without decoding anything.",
  "Walk the start indices backwards and appendSlice each character's bytes — line[from..to] — onto a std.ArrayList(u8), then print its .items with {s}.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
