[[quest]]
id          = "zig.advanced.33.stop-flag"
node        = 33
title       = "STOP WHEN ASKED"
difficulty  = 4
story       = "The night lane runs until somebody tells it to stop, and until this shift nobody could."
concepts    = ["cancellation", "concurrency", "raii"]
requires    = ["zig.advanced.32.overflow"]
map          = { x = 0.605, y = 0.932, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start two threads. The first sums the values and stores the result. The
second takes a **stop flag**, a `*std.atomic.Value(bool)`, and loops until
it reads `true`; when it does, it runs an `onStop` function that sets a
second flag, and then records that it stopped. From `main`, set the stop
flag, join both, and print:

```
input:  3
        1 2 3
output: SUM 6
        STOPPED yes
        CALLBACK yes
```

`std.Thread` has no `stop_token` and no `jthread`; the nearest thing is
what those are made of, passed by hand. A stop request is a `bool` the
requester writes and the worker reads, and because two threads touch it, it
is an atomic: `stop.store(true, .release)` on one side, `stop.load(.acquire)`
in the worker's loop on the other. A thread that checks its flag is a thread
you can always shut down; one that does not is the starter's night lane,
and its `join` would never return.

C++'s `stop_callback` runs on the requesting thread the moment stop is
requested; here the worker runs `onStop` itself when it sees the flag,
which is the same promise — *something happens because stop was asked for*
— kept from the other side. The `join` after the `store` is the `jthread`
destructor, written out: request, then wait. `std.Thread.yield()` inside the
loop gives the core to whoever else wants it; a bare spin also passes and
also wastes a core.
'''
starter     = '''
const std = @import("std");

fn summer(nums: []const i64, out: *i64) void {
    var total: i64 = 0;
    for (nums) |v| {
        total += v;
    }
    out.* = total;
}

fn onStop(callback: *std.atomic.Value(bool)) void {
    callback.store(true, .release);
}

// the night lane: loops until the stop flag is set, then runs onStop and
// records that it stopped

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \n\r\t");
    const n = try std.fmt.parseInt(usize, it.next().?, 10);
    const nums = try gpa.alloc(i64, n);
    defer gpa.free(nums);
    for (nums) |*v| {
        v.* = try std.fmt.parseInt(i64, it.next().?, 10);
    }

    var sum: i64 = 0;
    var stop = std.atomic.Value(bool).init(false);
    var stopped = std.atomic.Value(bool).init(false);
    var callback = std.atomic.Value(bool).init(false);

    const adder = try std.Thread.spawn(.{}, summer, .{ nums, &sum });
    adder.join();

    // the second thread, with the stop flag and the callback, is missing
    stop.store(true, .release);

    try w.print("SUM {d}\n", .{sum});
    try w.print("STOPPED {s}\n", .{if (stopped.load(.acquire)) "yes" else "no"});
    try w.print("CALLBACK {s}\n", .{if (callback.load(.acquire)) "yes" else "no"});
