[[quest]]
id          = "zig.basic.06.floats"
node        = 6
title       = "THE AIR GAUGE"
difficulty  = 1
story       = "The tunnel's air monitor logs in f64 and the display board over the mouth is f32, and the two disagree in the tenth decimal place."
concepts    = ["types", "io"]
requires    = ["zig.basic.05.big-int"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief       = '''
`f64` is the 64-bit float and `f32` the 32-bit one. `std.fmt.parseFloat(f64,
s)` parses text into an `f64`; narrowing it to an `f32` is `@floatCast`,
with the target type on the binding, and the cast is where precision is
lost — `0.1` has no exact binary form, and the `f32` keeps fewer of its
digits. Zig would print an `f32` with the fewest digits that read back as
the same `f32`, which hides the loss, so the second print widens `y` back
to `f64` first: the ten decimals then show what the float actually holds.

```
const x = try std.fmt.parseFloat(f64, s);
const y: f32 = @floatCast(x);
```

`s` is the line read in, and both prints use ten decimals. Type those two
lines at `// FILL`.

```
input:  0.1
output: 0.1000000000
        0.1000000015
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    const s = std.mem.trim(u8, input, " \r\n");

    const x: f64 = 0.0;  // FILL: parse s with std.fmt.parseFloat
    // ANSWER: const x = try std.fmt.parseFloat(f64, s);
    const y: f32 = 0.0;  // FILL: x narrowed to f32 with @floatCast
    // ANSWER: const y: f32 = @floatCast(x);

    try w.print("{d:.10}\n", .{x});
    try w.print("{d:.10}\n", .{@as(f64, y)});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    const s = std.mem.trim(u8, input, " \r\n");

    const x = try std.fmt.parseFloat(f64, s);
