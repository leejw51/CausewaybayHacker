brief       = '''
Zig names integers by their width: `i32` and `i64` are signed, `u32` and
`u64` unsigned. A value moves between widths with `@intCast`, which takes
its target type from where the result is going — the `: u64` on the
binding — and panics in Debug if the value does not fit. `std.math.maxInt(T)`
is the largest value a width can hold.

```
const b: u64 = @intCast(a);
try w.print("{d}\n", .{std.math.maxInt(u64)});
```

`a` is read as an `i32`. Type the cast line at the first `// FILL`, and
the second print line at the second.

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
