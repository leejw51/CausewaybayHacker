Zig's std has no stack type, because an ArrayList is one: `append(gpa,
x)` is push, `pop()` takes the top off and hands it back as an optional,
and `items[items.len - 1]` is the top — assign to it to edit the top in
place. The queue is `std.Deque(i64)`: `pushBack(gpa, x)` at the back,
`popFront()` at the front, both written for you.

```
try st.append(gpa, 0);
_ = st.pop();
st.items[st.items.len - 1] = 99;
```

Every number is already pushed onto both `st` and `q`. Type those three
lines at the `// FILL` marks: add `0` on top, pop it off again, then
overwrite the top with `99`. The stack is then drained and printed, and
the queue's first two are taken.

```
input:  1 2 3 4
output: 99 3 2 1
        1 2
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
