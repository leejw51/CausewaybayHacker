map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
A binding in Zig is `const` or `var`: `const n = try std.fmt.parseInt(i64,
text, 10);` reads a 64-bit integer out of `text` and names it `n`, and a
`const` cannot be changed afterwards. `try w.print("{d}\n", .{n})` prints
it: `{d}` is a decimal number, and the tuple after the format is what fills
it. Arithmetic on the name is just arithmetic: `n * 2`, `n * n`.

```
try w.print("{d}\n", .{n * n});
```

The program reads `n` and prints it and its double. Type that line at
`// FILL`: the third print, `n * n`.

```
input:  12
output: 12
        24
        144
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
