[[quest]]
id          = "zig.basic.03.types"
node        = 3
title       = "THE SPLIT TAKINGS"
difficulty  = 1
story       = "The plaza splits a night's takings across its open booths and the ledger writes each share as a whole number, always, even when it is not."
concepts    = ["types", "io"]
requires    = ["zig.basic.02.bindings"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Zig will not divide two signed integers with `/`: it makes you say which
rounding you mean. `@divTrunc(a, b)` rounds toward zero, so `7 / 2` is
`3`, and `@rem(a, b)` is the remainder, `1`. To get `3.5` both sides have
to be floats first: `@floatFromInt(a)` converts an integer, and `@as(f64,
...)` says which float it becomes. `{d:.2}` prints a float with exactly
two decimals.

```
try w.print("{d}\n", .{@divTrunc(a, b)});
try w.print("{d}\n", .{@rem(a, b)});
try w.print("{d:.2}\n", .{@as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b))});
```

The integer division and the remainder are printed. Write the third line
at `// FILL`: the division as an `f64` with two decimals.

```
input:  7 2
output: 3
        1
        3.50
```
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var it = std.mem.tokenizeAny(u8, input, " \r\n");
    const a = try std.fmt.parseInt(i64, it.next().?, 10);
    const b = try std.fmt.parseInt(i64, it.next().?, 10);

    try w.print("{d}\n", .{@divTrunc(a, b)});
    try w.print("{d}\n", .{@rem(a, b)});
    // FILL: a / b as an f64, with exactly two decimals
    // ANSWER: try w.print("{d:.2}\n", .{@as(f64, @floatFromInt(a)) / @as(f64, @floatFromInt(b))});
}
'''
