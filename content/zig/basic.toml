[[quest]]
id          = "zig.basic.01.first-light"
node        = 1
title       = "FIRST LIGHT"
difficulty  = 1
story       = "06:00 at the Causeway Bay portal. The sign over booth 1 comes on because something wrote to the right address, and the line it shows is blank."
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Print exactly:

```
hello, causewaybay
```

Lowercase, one comma, one space, one line. Nothing else.

Output in Zig goes through a writer. `w` is one, made over standard output
with a buffer, and `w.print(fmt, args)` writes a formatted string through
it: the format, then a tuple of arguments — `.{}` when there are none.
It can fail, so it is `try`d. The buffer reaches the terminal only when it
is flushed, and the `defer w.flush()` above the hole does that on the way
out of `main`.

```
try w.print("hello, causewaybay\n", .{});
```

Type that line at `// your code here`.
'''
starter     = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(init.io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    // your code here
    // ANSWER: try w.print("hello, causewaybay\n", .{});
}
'''
solution    = '''
const std = @import("std");

pub fn main(init: std.process.Init) !void {
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(init.io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    try w.print("hello, causewaybay\n", .{});
}
'''
hints = [
  'try w.print("hello, causewaybay\n", .{}); is the whole program. The writer and its flush are already there.',
  'The string is exact: lowercase, one comma, one space after it, and the \n at the end.',
  'print returns an error union, and Zig will not let one be ignored: the try in front is not optional.',
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
]

