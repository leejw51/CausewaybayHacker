    const w = &stdout.interface;
    defer w.flush() catch {};

    var st: std.ArrayList(i64) = .empty;
    defer st.deinit(gpa);
    var q: std.Deque(i64) = .empty;
    defer q.deinit(gpa);
    var it = std.mem.tokenizeAny(u8, input, " \r\n");
    while (it.next()) |tok| {
        const x = try std.fmt.parseInt(i64, tok, 10);
        try st.append(gpa, x);
        try q.pushBack(gpa, x);
    }

    // FILL: push 0 on top
    // ANSWER: try st.append(gpa, 0);
    // FILL: pop the top
    // ANSWER: _ = st.pop();
    // FILL: overwrite the top with 99
    // ANSWER: st.items[st.items.len - 1] = 99;

    var first = true;
    while (st.pop()) |top| {
        try w.print("{s}{d}", .{ if (first) "" else " ", top });
        first = false;
    }
    try w.print("\n", .{});

    try w.print("{d} {d}\n", .{ q.popFront().?, q.popFront().? });
}
