solution    = '''
const std = @import("std");

const Node = struct {
    val: i64,
    left: ?*Node = null,
    right: ?*Node = null,
};

fn insert(gpa: std.mem.Allocator, n: ?*Node, v: i64) !*Node {
    const cur = n orelse {
        const fresh = try gpa.create(Node);
        fresh.* = .{ .val = v };
        return fresh;
    };
    if (v < cur.val) {
        cur.left = try insert(gpa, cur.left, v);
    } else {
        cur.right = try insert(gpa, cur.right, v);
    }
    return cur;
}

fn inorder(n: ?*Node, w: *std.Io.Writer) !void {
    const cur = n orelse return;
    try inorder(cur.left, w);
    try w.print("{d} ", .{cur.val});
    try inorder(cur.right, w);
}

fn height(n: ?*Node) i64 {
    const cur = n orelse return 0;
    return 1 + @max(height(cur.left), height(cur.right));
}

fn freeTree(gpa: std.mem.Allocator, n: ?*Node) void {
    const cur = n orelse return;
    freeTree(gpa, cur.left);
    freeTree(gpa, cur.right);
    gpa.destroy(cur);
}

pub fn main(init: std.process.Init) !void {
    const io = init.io;
    const gpa = init.gpa;
    var in_buf: [4096]u8 = undefined;
    var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
    const input = try stdin.interface.allocRemaining(gpa, .unlimited);
    defer gpa.free(input);
    var out_buf: [4096]u8 = undefined;
    var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
    const w = &stdout.interface;
    defer w.flush() catch {};

    var root: ?*Node = null;
    defer freeTree(gpa, root);
    var it = std.mem.tokenizeAny(u8, input, " \r\n");
    while (it.next()) |tok| root = try insert(gpa, root, try std.fmt.parseInt(i64, tok, 10));

    try inorder(root, w);
    try w.print("\n{d}\n", .{height(root)});
}
'''
hints = [
  'cur.left = try insert(gpa, cur.left, v); on the left, cur.right = try insert(gpa, cur.right, v); on the right.',
  'Store the result back: the child may have been null, and the new node is what insert returns. insert can fail to allocate, so the call is tried.',
  'The placeholder unwraps the child with .? before anything has been hung there — that is the panic. The real line hands the null to insert, whose orelse is the check.',
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "balanced", stdin = "5 3 8 1 4\n", expect = "1 3 4 5 8\n3\n", visible = true },
  { name = "single", stdin = "42\n", expect = "42\n1\n", visible = false },
  { name = "chain", stdin = "1 2 3 4\n", expect = "1 2 3 4\n4\n", visible = false },
  { name = "seven", stdin = "50 25 75 10 30 60 90\n", expect = "10 25 30 50 60 75 90\n3\n", visible = false },
]
