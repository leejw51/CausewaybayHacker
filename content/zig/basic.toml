A binary search tree is nodes with a value and two optional child
pointers, `?*Node`, `null` until something hangs there: smaller values
live under `left`, larger under `right`. Inserting is recursive: an empty
subtree (`null`) becomes a new node from `gpa.create`, and otherwise the
value goes down one side — and whatever that side becomes is stored back,
because the side may have been `null` a moment ago. `n orelse { ... }` is
