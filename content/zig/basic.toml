    const w = &stdout.interface;
    defer w.flush() catch {};

    const a = try std.fmt.parseInt(i32, std.mem.trim(u8, input, " \r\n"), 10);

    const b: u64 = 0;  // FILL: b is a, widened to u64 with @intCast
    // ANSWER: const b: u64 = @intCast(a);
    try w.print("{d}\n", .{b});
    try w.print("{d}\n", .{std.math.maxInt(i32)});
    try w.print("{d}\n", .{0});  // FILL: the largest u64, from std.math.maxInt
    // ANSWER: try w.print("{d}\n", .{std.math.maxInt(u64)});
}
'''
solution    = '''
