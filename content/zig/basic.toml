# ZIG LAND — BASIC. The grammar road: 06:00 at the Causeway Bay portal of
# the Cross-Harbour Tunnel, the toll booths and their coin trays, the axle
# counters, the Canal Road flyover overhead and the villain-hitters under
# it, one construct per node. This is grammar practice, not a quiz: the
# brief explains one thing and shows how it is written, the starter is the
# whole program, and the player types the one to four lines that use it —
# print and parseInt, @divTrunc and {d:.2}, integer widths and @intCast, a
# 32-byte key, f64 to f32, a string copied and turned round, string, list
# and byte slices with copy and append, a while loop with its continue
# expression, a fn, a struct with a method, an enum and an exhaustive
# switch, an ArrayList worked at the back and at the front, a StringHashMap
# managed and unmanaged, a set of void, a stack and a Deque, std.mem.sort
# and a named comparator, a struct in place of a closure, a fn passed to a
# fold, std.Thread.spawn and join, and the two recursive lines of a binary
# search tree for the boss — the first time on this road that an optional
# is unwrapped before anyone looked.
#
# Everything here is explicit, because that is the land: every byte is
# paid for with `gpa` and handed back with `defer`, every error is `try`d,
# every value that is dropped is dropped with `_ =`, and a name that is
# never used does not compile — so a starter whose hole leaves a value
# unused is refused by the compiler, and that refusal is the hole telling
# you where it is.
#
# Every program is one main.zig, built by `zig build-exe main.zig -O
# Debug` (Zig 0.16: every safety check on, so an index past the end, an
# unwrapped null and an integer overflow are each a `panic:` that says so)
# and run per case. Standard input is read with one idiom everywhere:
#
#     pub fn main(init: std.process.Init) !void {
#         const io = init.io;
#         const gpa = init.gpa;
#         var in_buf: [4096]u8 = undefined;
#         var stdin = std.Io.File.stdin().readerStreaming(io, &in_buf);
#         const input = try stdin.interface.allocRemaining(gpa, .unlimited);
#         defer gpa.free(input);
#
# and output goes through a buffered writer that is flushed on the way out:
#
#         var out_buf: [4096]u8 = undefined;
#         var stdout = std.Io.File.stdout().writerStreaming(io, &out_buf);
#         const w = &stdout.interface;
#         defer w.flush() catch {};
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5), with the same
# line the runner uses. verify_pack also holds every basic solution to
# BASIC_MAX_ADDED lines over its starter.

pack = "zig.basic"
land = "zig"
category = "basic"
version = 1

