A set in Zig is a hash map whose value type is `void`:
`std.AutoHashMap(i64, void)`, and `{}` is the one value of `void`.
`put(x, {})` adds a value (a duplicate is overwritten with itself) and
`remove(x)` takes one out (a missing value returns `false`, and `_ =`
discards it). A set has no edit: a value is its own key, so turning `1`
into `-1` is a `remove` followed by a `put`. `count()` is the size, and
the sorted walk is written, because a hash set has no order.

```
try seen.put(100, {});
_ = seen.remove(3);
_ = seen.remove(1); try seen.put(-1, {});
```

`seen` already holds the line's distinct values. Type those three lines at
the `// FILL` marks: add `100`, remove `3`, then turn `1` into `-1`. The
size and the sorted walk are written.

```
input:  3 1 3 2 1
output: 3
        -1 2 100
```
