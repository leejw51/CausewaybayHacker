was there — `_ =` throws the answer away; `getPtr(k)` is a pointer to an
existing key's value, or `null` when it is missing, so `.?.* = 9` unwraps
it and writes through it. A hash map walks its keys in no order, so the
scaffold copies them out and sorts them before printing; the next node
makes you write that line.

