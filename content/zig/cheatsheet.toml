# ZIG LAND — CHEATSHEET. The grammar off the page, asked: thirty of the Zig
# lines a live-coding test leans on and a hand forgets — print through a
# writer, parseInt, a for with its index, @divTrunc, std.mem.eql, orelse,
# append with its allocator, std.mem.sort, catch with a default, a comptime
# type parameter, a method on *Self, errdefer, then a slice of a slice, a
# while with its continue expression, a switch over ranges, an error-union
# signature, an optional unwrapped by capture, an AutoHashMap counted up,
# an index cast to usize, a labelled break, then a `var` that must say its
# type, an open range in a for, `and` instead of `&&`, @floatFromInt,
# @abs, std.mem.reverse, dupe on the allocator, `.items.len`, a named error
# returned, and @mod against @rem — at the Causeway Bay portal of the
# Cross-Harbour Tunnel. Four lines, one right. Nothing is
# typed and nothing is compiled — the pick is the submission, and the server
# judges it against the quiz (SPEC §0). The three wrong lines are near-misses:
# another language's spelling, a missing `try`, an allocator left out.
#
# The spellings are the land's Zig 0.16 ones (zig/verybasic.toml,
# zig/basic.toml): an ArrayList is `.empty` and takes `gpa` on every call
# that may grow it, output goes through a buffered writer `w`.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "zig.cheatsheet"
land = "zig"
category = "cheatsheet"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "zig.cheatsheet.01.print"
node        = 1
title       = "THE TOLL SIGN"
difficulty  = 1
story       = "06:00 at the Cross-Harbour Tunnel portal. The sign over booth 1 shows the fare, if something writes it."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
`w` is a buffered writer over stdout. Print `n` in decimal, then a newline.

```
const w = &stdout.interface;
defer w.flush() catch {};
const n: i64 = 42;
// ____
```

Which line is it?
'''
solution    = 'try w.print("{d}\n", .{n});'
hints = [
  "The arguments go in a tuple, `.{ ... }`, and print can fail, so it is `try`d.",
]

[quest.quiz]
choices = [
  'try w.print("{d}\n", n);',
  'w.print("{d}\n", .{n});',
  'try w.print("{d}\n", .{n});',
  'try w.print("%d\n", .{n});',
]
answer  = 2

