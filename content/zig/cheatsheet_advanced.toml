[[quest]]
id          = "zig.cheatsheet_advanced.23.wrapping"
node        = 23
title       = "ROLL OVER, DO NOT STOP"
difficulty  = 4
story       = "The plate hash is meant to overflow, thousands of times a night. In Debug mode an overflow that is not asked for is a panic and a closed barrier."
concepts    = ["math", "types", "bit-manipulation"]
requires    = ["zig.cheatsheet_advanced.22.truncate"]
map         = { x = 0.24, y = 0.72, kind = "quest" }
brief       = '''
`h` is a `u32` that starts near `std.math.maxInt(u32)` and `c` is a `u8`.
Write the hash step `h = h * 31 + c` so that it **wraps around** modulo
2^32 — not a panic, not a clamp at the maximum.
'''
solution    = 'h = h *% 31 +% c;'
hints = [
  "Plain operators panic on overflow in Debug, and a mask applied afterwards is too late — the multiply has already overflowed. Zig has two families of suffixed operators: one saturates at the maximum, the other wraps.",
]

[quest.quiz]
choices = [
  'h = h * 31 + c;',
  'h = h *% 31 +% c;',
  'h = h *| 31 +| c;',
  'h = (h * 31 + c) & 0xffffffff;',
]
answer  = 1

