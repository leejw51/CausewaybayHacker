brief       = '''
`dump` prints each field's name and value for any struct it is given.
Open the loop over the fields so that `f.name` is usable in `@field`
(Zig 0.16: the type-info tag is spelled in lowercase).

```
fn dump(v: anytype) void {
    const T = @TypeOf(v);
    if (@typeInfo(T) != .@"struct") @compileError("not a struct: " ++ @typeName(T));
    // ____
        std.debug.print("{s}: {any}\n", .{ f.name, @field(v, f.name) });
    }
}
```
'''
solution    = 'inline for (@typeInfo(T).@"struct".fields) |f| {'
hints = [
  "The field list is compile-time data, so a plain loop cannot index it; the loop must be unrolled, and `struct` is a keyword that needs quoting as a field name.",
]

[quest.quiz]
choices = [
  'for (@typeInfo(T).@"struct".fields) |f| {',
  'inline for (@typeInfo(T).@"struct".fields) |f| {',
  'inline for (@typeInfo(T).fields) |f| {',
  'inline for (T.fields) |f| {',
]
answer  = 1

