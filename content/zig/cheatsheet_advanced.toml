allocator).

```
fn evens(gpa: std.mem.Allocator, xs: []const i64) ![]i64 {
    var list: std.ArrayList(i64) = .empty;
    errdefer list.deinit(gpa);
    for (xs) |x| if (@rem(x, 2) == 0) try list.append(gpa, x);
    // ____
}
```
'''
solution    = 'return try list.toOwnedSlice(gpa);'
hints = [
  "`.items` is still owned by the list and would be freed twice or never; the call that transfers ownership shrinks to fit, so it can fail and takes the allocator.",
]

[quest.quiz]
choices = [
  'return list.items;',
  'return try list.toOwnedSlice();',
  'return try gpa.dupe(i64, list.items);',
  'return try list.toOwnedSlice(gpa);',
]
answer  = 3

