# ZIG LAND — CHEATSHEET ADVANCED. The lines an interviewer uses to tell a
# fluent Zig hand from one who has only read the grammar page, asked: a
# generic function over a comptime type, @This() inside a type-returning
# fn, a function pointer, an inline for over a struct's fields, @hasField,
# a comptime var driving an inline while, two error sets merged, a switch
# on a caught error, a while that walks an optional pointer with its step
# in the header, a tagged union's payload captured, @enumFromInt, a
# labelled block that breaks with a value, a C string spanned to a slice,
# toOwnedSlice, getOrPut, a map key copied before the buffer is reused,
# the 0.16 DebugAllocator, an arena, the order defers run, splitScalar
# against tokenizeScalar, a sort with a context, @truncate, wrapping
# arithmetic, expectEqual, the 0.16 main(init), stdin read a line at a
# time through a 0.16 reader, Thread.spawn, the 0.16 std.Io.Mutex, an
# atomic fetchAdd, and for the boss a packed struct @bitCast to its byte —
# the Causeway Bay portal of the Cross-Harbour Tunnel after dark, when the
# control room above the booths does the night's accounting. Four lines,
# one right. Nothing is typed and nothing is compiled — the pick is the
# submission, and the server judges it against the quiz (SPEC §0). The
# three wrong lines are near-misses: a 0.15 spelling the 0.16 std no
# longer has, a cast that panics where another truncates, a `try` left
# off, a result thrown away, a type the builtin will not take.
#
# The spellings are the land's Zig 0.16 ones (zig/basic.toml,
# zig/advanced.toml), checked line by line against `zig version` 0.16.0:
# an ArrayList is `.empty` and takes `gpa` on every call that may grow it;
# the general-purpose allocator is `std.heap.DebugAllocator`; the mutex is
# `std.Io.Mutex` and takes the `io` runtime; a line of stdin comes off
# `std.Io.File.stdin().readerStreaming(io, &buf).interface`.
#
# This is the ADVANCED road: zig/cheatsheet.toml (the BASIC road) already
# asks the opening of `fn Stack(comptime T: type) type`, `self: *Counter`,
# `errdefer`, the inclusive switch range, `!i64`, `if (maybe) |v|`,
# `break :outer`, `orelse`, `catch 0`, `@intCast` and `std.mem.sort` with
# `std.sort.desc`; none of those is asked again here.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "zig.cheatsheet_advanced"
land     = "zig"
category = "cheatsheet_advanced"
version  = 1

