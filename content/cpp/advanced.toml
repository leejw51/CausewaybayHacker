#include <string>

struct Guard {
    std::string name;
    // needs a destructor that prints DROP <name>
};

struct Tally {
    long long count = 0;
    long long sum = 0;

    void add(long long v) {
        ++count;
        sum += v;
    }
    // needs a destructor that prints TALLY <count> <sum>
};

int main() {
    Guard first{"first"};
    Guard second{"second"};

    int n = 0;
    std::cin >> n;
    {
        Tally tally;
        for (int i = 0; i < n; ++i) {
            long long v = 0;
            std::cin >> v;
            tally.add(v);
        }
    }
    std::cout << "DONE\n";
}
'''
solution    = '''
#include <iostream>
#include <string>

struct Guard {
    std::string name;

    ~Guard() {
        std::cout << "DROP " << name << '\n';
    }
};

struct Tally {
    long long count = 0;
    long long sum = 0;

    void add(long long v) {
        ++count;
        sum += v;
    }

    // runs at the closing brace of whatever block owns the Tally
    ~Tally() {
        std::cout << "TALLY " << count << ' ' << sum << '\n';
    }
};

int main() {
    Guard first{"first"};
    Guard second{"second"};

    int n = 0;
    std::cin >> n;
    {
        Tally tally;
        for (int i = 0; i < n; ++i) {
            long long v = 0;
            std::cin >> v;
            tally.add(v);
        }
    }
    std::cout << "DONE\n";
}
'''
