[[quest]]
id          = "cpp.advanced.15.undefined-behaviour"
node        = 15
title       = "THE COMPILER ASSUMED"
difficulty  = 4
story       = "The pump room's litre counter is an int, and at 2147483647 litres the compiler had already assumed it would never get there."
concepts    = ["undefined-behaviour", "types", "math"]
requires    = ["cpp.advanced.14.invalidation"]
map          = { x = 0.391, y = 0.950, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers, each of which fits in a
`long long`. Their running total fits in a `long long` too.

Print two lines: `INT32 OK` if every running total along the way fits in a
32-bit `int`, or `INT32 OVERFLOW <i>` with the 0-based index of the first
value that would have pushed it out; then `INT64 <total>`.

```
input:  3
        2147483647 1 -5
output: INT32 OVERFLOW 1
        INT64 2147483643
```

The starter keeps the total in an `int` and prints `INT32 OK` whatever
happens. It cannot be fixed by adding the obvious check —
`if (total + v < total)` — because that check is written in terms of the
overflow it is looking for, and **signed overflow is undefined behaviour**.
The compiler is entitled to assume UB does not happen, so `total + v < total`
with positive `v` is *always false* as far as it is concerned, and under
`-O2` both gcc and clang delete the test. The wrong number is not a bug in
the optimiser. It is the contract.

The rule this land runs on: undefined behaviour is not "some value". It is
the compiler assuming a thing is impossible and reasoning from there. So you
never detect overflow by causing it. You detect it *before* the addition, in
a wider type or by comparing against the limits — `std::numeric_limits<int>`
— and this program's expected output depends on nothing that is undefined.
'''
starter     = '''
#include <iostream>
#include <limits>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    // an int accumulator, and no check at all
    int total = 0;
    for (long long v : nums) {
        total += static_cast<int>(v);
    }

    std::cout << "INT32 OK\n";
    std::cout << "INT64 " << total << '\n';
}
'''
solution    = '''
#include <iostream>
#include <limits>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    const long long low = std::numeric_limits<int>::min();
    const long long high = std::numeric_limits<int>::max();

    // the running total is kept in the wide type, and the narrow range is
    // checked against limits before anything narrow is ever computed
    long long total = 0;
    long long overflow_at = -1;
    for (std::size_t i = 0; i < nums.size(); ++i) {
        total += nums[i];
        if (overflow_at < 0 && (total < low || total > high)) {
            overflow_at = static_cast<long long>(i);
        }
    }

    if (overflow_at < 0) {
        std::cout << "INT32 OK\n";
    } else {
        std::cout << "INT32 OVERFLOW " << overflow_at << '\n';
    }
    std::cout << "INT64 " << total << '\n';
}
'''
