brief       = '''
Standard input is a count `n`, then `n` amounts in cents.

Hold them in a chain, one node per amount, in the order they arrived:

```
struct Entry {
    long long cents;
    std::unique_ptr<Entry> next;
};
```

Print three lines:

1. the amounts in order, space separated, or `-` if there are none
2. `SUM <total>`, from a **recursive** function over the chain
3. `LAST <cents>` — the amount on the final node — or `LAST NONE`

```
input:  5
        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

The starter does not compile, and the error is the reason pointers exist.
Write `Entry next;` and the compiler has to lay `Entry` out in memory: eight
bytes for `cents` plus however big an `Entry` is — which is the thing it is
trying to work out. *Field has incomplete type.*

A `std::unique_ptr<Entry>` is a pointer, and a pointer has a size the compiler
already knows. It **owns** what it points at: exactly one owner, `delete`d in
the destructor, cannot be copied, can be moved. A raw `Entry*` is the other
kind of pointer — it looks and owns nothing — and walking the chain to print
it is exactly what a raw pointer is for. `nullptr` is both the end of the
chain and the empty chain, so there is no separate empty case anywhere.
'''
starter     = '''
#include <iostream>
#include <memory>
#include <vector>

struct Entry {
    long long cents;
    // field has incomplete type: this is what a type with no nameable size looks like
    Entry next;
};

long long sum(const Entry* chain) {
    (void)chain;
    return 0;
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> amounts(n);
    for (long long& v : amounts) {
        std::cin >> v;
    }

    // build the chain in arrival order, walk it, then sum it recursively
    std::cout << "-\n";
    std::cout << "SUM 0\n";
