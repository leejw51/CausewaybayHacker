[[quest]]
id          = "cpp.advanced.13.optional-variant"
node        = 13
title       = "THE LINE THAT IS NOT A NUMBER"
difficulty  = 3
story       = "The pump room's meter reader hands in a column of numbers with somebody's lunch order in the middle of it."
concepts    = ["error-handling", "pattern-matching", "types"]
requires    = ["cpp.advanced.12.lambdas"]
map          = { x = 0.185, y = 0.313, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, where the total is the sum of the values
you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Two types carry the answer. `std::optional<long long> parse(const std::string&)`
is *a number or nothing*, and `std::from_chars` fills it in: it returns an
error code instead of throwing, and it tells you where it stopped, so `4x` can
be rejected as well as `xx`.

`std::variant<long long, std::string> doubled(const std::string&)` is *either
the doubled value or the line that failed* — one of exactly two types, never
both, never neither. `std::get_if<long long>(&result)` gives you a pointer to
the number if that is what is in there and `nullptr` if it is not, which is
the two-way branch `main` needs. No exceptions anywhere in this program; the
failure is a value, and it goes where values go.
'''
starter     = '''
#include <charconv>
#include <iostream>
#include <optional>
#include <string>
#include <variant>

std::optional<long long> parse(const std::string& text) {
    (void)text;
    // std::from_chars over the whole string, or std::nullopt
    return std::nullopt;
}

std::variant<long long, std::string> doubled(const std::string& text) {
    // the value * 2, or the text that would not parse
    return text;
}

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);

    long long sum = 0;
    for (int i = 0; i < n; ++i) {
        std::string line;
        std::getline(std::cin, line);
        auto result = doubled(line);
        // std::get_if<long long>(&result): a pointer, or nullptr
        std::cout << "BAD " << line << '\n';
        (void)result;
    }
    std::cout << "SUM " << sum << '\n';
}
'''
solution    = '''
#include <charconv>
#include <iostream>
#include <optional>
#include <string>
#include <variant>

std::optional<long long> parse(const std::string& text) {
    long long value = 0;
    const char* begin = text.data();
    const char* end = begin + text.size();
    auto [ptr, ec] = std::from_chars(begin, end, value);
    // both halves matter: no error, and every character consumed
    if (ec != std::errc() || ptr != end) {
        return std::nullopt;
    }
    return value;
}

std::variant<long long, std::string> doubled(const std::string& text) {
    if (auto value = parse(text)) {
        return *value * 2;
    }
    return text;
}

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);

    long long sum = 0;
    for (int i = 0; i < n; ++i) {
        std::string line;
        std::getline(std::cin, line);
        auto result = doubled(line);
        if (const long long* value = std::get_if<long long>(&result)) {
            std::cout << *value << '\n';
            sum += *value;
        } else {
            std::cout << "BAD " << std::get<std::string>(result) << '\n';
        }
    }
    std::cout << "SUM " << sum << '\n';
}
'''
hints = [
  "std::from_chars(first, last, value) returns a struct with ptr and ec; success is ec == std::errc() AND ptr == last, or a line like 4x half-parses.",
  "An optional is truthy when it holds a value, so if (auto v = parse(text)) is the whole branch, and *v is the number.",
  "Returning a long long or a std::string from the same function is legal because the return type is a variant that can hold either; get_if picks the branch in main.",
]

