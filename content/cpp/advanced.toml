  "Walk with a const Entry* from head.get(), stepping to walk->next.get(). The raw pointer borrows; the unique_ptr still owns, and nothing is freed twice.",
  "The recursive sum is two lines: nullptr is 0, otherwise cents plus the sum of the rest.",
]

