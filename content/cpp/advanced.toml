solution    = '''
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    long long threshold = 0;
    std::cin >> n >> threshold;
    std::vector<long long> moorings(n);
    for (long long& v : moorings) {
        std::cin >> v;
    }

    int removed = 0;
    // erase hands back the iterator to the next element; the old one is dead
    for (auto it = moorings.begin(); it != moorings.end();) {
        if (*it < threshold) {
            it = moorings.erase(it);
            ++removed;
        } else {
            ++it;
        }
    }
    // the one-line answer, equivalent to the loop above:
    //     removed = std::erase_if(moorings, [&](long long v) { return v < threshold; });

    if (moorings.empty()) {
        std::cout << "-\n";
    } else {
        for (std::size_t i = 0; i < moorings.size(); ++i) {
            std::cout << (i ? " " : "") << moorings[i];
        }
        std::cout << '\n';
    }
    std::cout << "REMOVED " << removed << '\n';
}
'''
