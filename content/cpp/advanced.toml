#include <atomic>
#include <iostream>
#include <stop_token>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    long long sum = 0;
    std::atomic<bool> stopped{false};
    std::atomic<bool> callback{false};

    std::jthread summer([&] {
        for (long long v : nums) {
            sum += v;
        }
    });

    // the jthread sees the stop_token parameter and supplies one
    std::jthread pump([&](std::stop_token token) {
        std::stop_callback on_stop(token, [&] { callback = true; });
        while (!token.stop_requested()) {
            std::this_thread::yield();
        }
        stopped = true;
    });

    pump.request_stop();
    pump.join();
    summer.join();

    std::cout << "SUM " << sum << '\n';
    std::cout << "STOPPED " << (stopped ? "yes" : "no") << '\n';
    std::cout << "CALLBACK " << (callback ? "yes" : "no") << '\n';
}
'''
hints = [
  "Change std::thread to std::jthread for summer and the abort is gone even before you add a join — but join it anyway, before you read sum.",
  "A lambda whose first parameter is std::stop_token gets one automatically from the jthread that runs it; that is the whole hookup.",
  "std::stop_callback on_stop(token, fn) is an object: it registers in its constructor and unregisters in its destructor, so it lives for the loop and no longer.",
]

