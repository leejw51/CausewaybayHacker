solution    = '''
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> out(n, 0);
    std::vector<std::thread> threads;
    for (int i = 0; i < n; ++i) {
        // i by value, out by reference: each thread owns exactly one slot
        threads.emplace_back([i, &nums, &out] {
            out[i] = nums[i] * nums[i];
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    for (long long v : out) {
        std::cout << v << '\n';
    }
    std::cout << "THREADS " << n << '\n';
}
'''
