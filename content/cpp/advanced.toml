[[quest]]
id          = "cpp.advanced.11.shared-ptr"
node        = 11
title       = "WHO ELSE IS HOLDING THIS"
difficulty  = 4
story       = "Two gauges read the same tank through one pipe, and the pipe has to stay until the last gauge is gone and not one second longer."
concepts    = ["smart-pointers", "raii", "zero-values"]
requires    = ["cpp.advanced.10.unique-ptr"]
map          = { x = 0.222, y = 0.514, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Put the values in a `std::vector<long long>` owned by a `std::shared_ptr`,
take a **second** `shared_ptr` to the same vector, and a `std::weak_ptr` that
watches it. Print four lines:

1. `REF <sum>` — the sum, read through the second handle
2. `SHARED <k>` — `use_count()` while both handles are alive
3. `ALIVE yes` — `!watch.expired()` while they are
4. `ALIVE no` — after both handles have been `reset()`

```
input:  3
        1 2 3
output: REF 6
        SHARED 2
        ALIVE yes
        ALIVE no
```

`unique_ptr` was one owner. `shared_ptr` is a count of owners, kept next to
the object, and the object is freed when the count reaches zero — by whichever
handle happened to go last. Copying the handle bumps the count; resetting or
destroying it drops the count. The count is atomic, so two threads can each
hold a handle safely; the *object* is not made thread-safe by that, and the
previous maps' mutexes are still needed to touch it.

`weak_ptr` is a handle that does **not** count. It can see whether the object
is still there and can be promoted to a `shared_ptr` with `lock()` if it is;
it cannot keep the object alive. That is what breaks a cycle — two objects
holding `shared_ptr`s to each other never reach zero — and it is what the
last map on this road is about.
'''
starter     = '''
#include <iostream>
#include <memory>
#include <numeric>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    auto ledger = std::make_shared<std::vector<long long>>(n);
    for (long long& v : *ledger) {
        std::cin >> v;
    }

    // a second shared_ptr to the same vector, and a weak_ptr watching it
    std::cout << "REF 0\n";
    std::cout << "SHARED 1\n";
    std::cout << "ALIVE yes\n";
    std::cout << "ALIVE yes\n";
}
'''
solution    = '''
#include <iostream>
#include <memory>
#include <numeric>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    auto ledger = std::make_shared<std::vector<long long>>(n);
    for (long long& v : *ledger) {
        std::cin >> v;
    }

    // a second owner of the same vector: the copy is the handle, not the data
    std::shared_ptr<std::vector<long long>> mirror = ledger;
    // a watcher: sees the object, does not keep it alive
    std::weak_ptr<std::vector<long long>> watch = ledger;

    std::cout << "REF " << std::accumulate(mirror->begin(), mirror->end(), 0LL) << '\n';
    std::cout << "SHARED " << ledger.use_count() << '\n';
    std::cout << "ALIVE " << (watch.expired() ? "no" : "yes") << '\n';

    ledger.reset();
    mirror.reset();
    // the count reached zero on the second reset, and the vector is gone
    std::cout << "ALIVE " << (watch.expired() ? "no" : "yes") << '\n';
}
'''
