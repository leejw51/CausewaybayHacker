brief       = '''
Standard input is a count `n` and then `n` integers.

A producer thread pushes each value onto a `std::queue` guarded by a mutex; a
consumer thread pops them one at a time and prints each doubled. When the
producer has pushed everything it sets `done` and wakes the consumer, and the
consumer stops when the queue is empty **and** `done` is set. Join both, then
print `CONSUMED <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

The queue is FIFO, so the order is the input order whatever the scheduler
does. The `std::condition_variable` is how the consumer sleeps until there is
something to do instead of spinning on the lock: `cv.wait(lock, predicate)`
releases the mutex, sleeps, and re-checks the predicate every time it is
woken — which handles spurious wakeups for you, and is why the predicate form
is the only form to write.

The starter hangs. The producer pushes everything and returns without ever
setting `done` or notifying, so the consumer wakes for the last value, drains
the queue, and waits for a signal that will not come. Every producer/consumer
pair needs a way to say *there will be no more* — that is what `done` is.
