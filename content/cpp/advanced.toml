Standard input is a count `n` and then `n` integers.

Finish the `Counter`: `add` takes the lock, adds to the total and bumps the
hit count; `snapshot` takes the lock and returns both together. Start one
thread per value, join them, then print `TOTAL <sum>` and `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

The mutex lives **inside** the class, next to the fields it guards, and every
method that touches them takes it. That is the shape: the lock is part of the
object, not something callers are trusted to remember.

The starter does not compile, and the reason is worth a minute. `snapshot()`
is `const` — it changes no field the caller can see — but locking a mutex
*changes the mutex*, and inside a `const` method every member is `const`.
The fix is `mutable std::mutex`: `mutable` marks a member that is allowed to
change even through a `const` object, precisely for bookkeeping like this
that is not part of the value. It is the only place `mutable` is routinely
correct, and an interviewer who asks about it wants to hear this example.
'''
