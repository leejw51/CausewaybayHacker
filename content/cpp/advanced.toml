[[quest]]
id          = "cpp.advanced.06.condition-variable"
node        = 6
title       = "THE HATCH"
difficulty  = 4
story       = "One pump fills the tank and one drains it, and the drain has been polling an empty tank since 11:40."
concepts    = ["channels", "concurrency", "shared-state"]
requires    = ["cpp.advanced.05.scoped-lock"]
map          = { x = 0.962, y = 0.054, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

A producer thread pushes each value onto a `std::queue` guarded by a mutex; a
consumer thread pops them one at a time and prints each doubled. When the
producer has pushed everything it sets `done` and wakes the consumer, and the
consumer stops when the queue is empty **and** `done` is set. Join both, then
print `CONSUMED <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        CONSUMED 3
```

The queue is FIFO, so the order is the input order whatever the scheduler
does. The `std::condition_variable` is how the consumer sleeps until there is
something to do instead of spinning on the lock: `cv.wait(lock, predicate)`
releases the mutex, sleeps, and re-checks the predicate every time it is
woken — which handles spurious wakeups for you, and is why the predicate form
is the only form to write.

The starter hangs. The producer pushes everything and returns without ever
setting `done` or notifying, so the consumer wakes for the last value, drains
the queue, and waits for a signal that will not come. Every producer/consumer
pair needs a way to say *there will be no more* — that is what `done` is.
'''
starter     = '''
#include <condition_variable>
#include <iostream>
#include <mutex>
#include <queue>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::queue<long long> tank;
    std::mutex mutex;
    std::condition_variable cv;
    bool done = false;
    long long consumed = 0;

    std::thread producer([&] {
        for (long long v : nums) {
            {
                std::lock_guard<std::mutex> lock(mutex);
                tank.push(v);
            }
            cv.notify_one();
        }
        // never says it has finished
    });

    std::thread consumer([&] {
        while (true) {
            std::unique_lock<std::mutex> lock(mutex);
            cv.wait(lock, [&] { return !tank.empty() || done; });
            if (tank.empty()) {
                return;
            }
            long long v = tank.front();
            tank.pop();
            lock.unlock();
            std::cout << v * 2 << '\n';
            ++consumed;
        }
    });

    producer.join();
    consumer.join();
    std::cout << "CONSUMED " << consumed << '\n';
}
'''
solution    = '''
#include <condition_variable>
#include <iostream>
#include <mutex>
#include <queue>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::queue<long long> tank;
    std::mutex mutex;
    std::condition_variable cv;
    bool done = false;
    long long consumed = 0;

    std::thread producer([&] {
        for (long long v : nums) {
            {
                std::lock_guard<std::mutex> lock(mutex);
                tank.push(v);
            }
            cv.notify_one();
        }
        {
            // done is shared state like the queue, so it changes under the lock
            std::lock_guard<std::mutex> lock(mutex);
            done = true;
        }
        cv.notify_all();
    });

    std::thread consumer([&] {
        while (true) {
            std::unique_lock<std::mutex> lock(mutex);
            // sleeps until there is a value or the producer has finished
            cv.wait(lock, [&] { return !tank.empty() || done; });
            if (tank.empty()) {
                return;  // empty and done: nothing more is coming
            }
            long long v = tank.front();
            tank.pop();
            lock.unlock();
            std::cout << v * 2 << '\n';
            ++consumed;
        }
    });

    producer.join();
    consumer.join();
    std::cout << "CONSUMED " << consumed << '\n';
}
'''
hints = [
  "After the producer's loop: lock, set done = true, unlock, cv.notify_all(). Four lines, and the program terminates.",
  "done is read inside the wait predicate under the mutex, so it must be written under the mutex too — a flag written without the lock is a data race.",
  "cv.wait takes a std::unique_lock, not a lock_guard, because wait has to unlock and relock it; the predicate is re-checked on every wakeup.",
]

