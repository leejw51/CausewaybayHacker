# ---------------------------------------------------------------- 02
[[quest]]
id          = "cpp.advanced.02.references"
node        = 2
title       = "A COPY IS NOT THE THING"
difficulty  = 2
story       = "The winch operator on the Yacht Club slipway writes each load onto a copy of the sheet, and the sheet on the wall never changes."
concepts    = ["pointers", "functions", "mutability"]
requires    = ["cpp.advanced.01.getline"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Push every value onto one `std::vector<long long>` through a function `load`,
then print three lines: `LOADED <how many>`, `TOTAL <sum>` from a function
`total` that only reads, and `FIRST <value>` — or `FIRST NONE` when there is
nothing.

```
input:  3
        4 8 15
output: LOADED 3
        TOTAL 27
        FIRST 4
```

The starter compiles and prints `LOADED 0`. `load` takes the vector **by
value**, so every call gets its own copy, pushes onto that, and throws it away
on return. C++ copies unless you say otherwise.

Say otherwise with `&`: a parameter of type `std::vector<long long>&` is a
reference to the caller's vector, not a copy of it. `total` should take a
`const std::vector<long long>&` — it needs to look, it does not need to touch,
and `const` is how you say that in the signature so the compiler holds you to
it.

`FIRST` is a pointer: `long long* first` is either the address of the first
element or `nullptr`, and `nullptr` is the one value you must test for before
you follow it. That is the whole of this land in one line.
'''
starter     = '''
#include <iostream>
#include <vector>

// takes a copy, pushes onto the copy, and the copy dies here
void load(std::vector<long long> sheet, long long value) {
    sheet.push_back(value);
}

long long total(std::vector<long long> sheet) {
    long long sum = 0;
    for (long long v : sheet) {
        sum += v;
    }
    return sum;
}

int main() {
    int n = 0;
    std::cin >> n;

    std::vector<long long> sheet;
    for (int i = 0; i < n; ++i) {
        long long value = 0;
        std::cin >> value;
        load(sheet, value);
    }

    std::cout << "LOADED " << sheet.size() << '\n';
    std::cout << "TOTAL " << total(sheet) << '\n';

    long long* first = nullptr;
    // point first at the first element if there is one, then print it
    std::cout << "FIRST NONE\n";
    (void)first;
}
'''
solution    = '''
#include <iostream>
#include <vector>

// a reference: this IS the caller's vector, not a copy of it
void load(std::vector<long long>& sheet, long long value) {
    sheet.push_back(value);
}

// const&: no copy, and the compiler refuses any line that would change it
long long total(const std::vector<long long>& sheet) {
    long long sum = 0;
    for (long long v : sheet) {
        sum += v;
    }
    return sum;
}

int main() {
    int n = 0;
    std::cin >> n;

    std::vector<long long> sheet;
    for (int i = 0; i < n; ++i) {
        long long value = 0;
        std::cin >> value;
        load(sheet, value);
    }

    std::cout << "LOADED " << sheet.size() << '\n';
    std::cout << "TOTAL " << total(sheet) << '\n';

    long long* first = sheet.empty() ? nullptr : &sheet.front();
    if (first != nullptr) {
        std::cout << "FIRST " << *first << '\n';
    } else {
        std::cout << "FIRST NONE\n";
    }
}
'''
hints = [
  "One character fixes load: std::vector<long long>& sheet. The call site does not change; a reference binds to the argument as written.",
  "total should take const std::vector<long long>& — the const is a promise, and the compiler checks it.",
  "&sheet.front() is the address of the first element and only makes sense when there is one; test for nullptr before you write *first.",
]

