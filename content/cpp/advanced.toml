Line one is `n t`. Line two is `n` integers.

Remove every value below `t` from the vector, **in place**, and print what is
left on one line (or `-` if nothing is), then `REMOVED <k>`.

```
input:  6 3
        1 1 2 5 1 4
output: 5 4
        REMOVED 4
```

The starter is the bug everyone writes once: it walks by index, erases at
`i`, and then does `++i` — and the element that slid into slot `i` is never
looked at. Two adjacent small values, and the second one survives. That bug
is at least well-defined. Its iterator twin is not: `erase(it)` invalidates
`it` and every iterator after it, so `for (auto it = v.begin(); ...; ++it)`
with an `erase` inside is **undefined behaviour** — it usually walks off the
end and sometimes appears to work, which is worse.

`erase` returns the iterator to the element after the one removed. Use it:
`it = v.erase(it)` on a hit, `++it` on a miss, and never both. C++20 also has
`std::erase_if(v, predicate)`, which does the whole job in one call and is
the answer to give first; the loop is the answer to give when they ask what
`erase_if` does.
'''
