[[quest]]
id          = "cpp.advanced.05.scoped-lock"
node        = 5
title       = "TWO LOCKS, ONE ORDER"
difficulty  = 4
story       = "Two sluice gates under the fountain, two locks, two threads, and both pumps stopped in the same second."
concepts    = ["deadlock", "raii", "shared-state"]
requires    = ["cpp.advanced.04.counter"]
map          = { x = 0.716, y = 0.137, kind = "quest" }
brief       = '''
Two tanks, `A` and `B`, each a `long long` with its own `std::mutex`.

Standard input is the starting levels on line one, a count `n` on line two,
and then `n` lines of `<FROM> <TO> <AMOUNT>` with `FROM`/`TO` in `{A, B}`.

Run every transfer on its own thread, join them all, then print
`A <level>`, `B <level>`, `MOVED <n>`.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

Two things are wrong with the starter and only one shows in the output. It
debits the source and never credits the destination — that is the visible
bug. The other is the shape: locking *the source first* means two opposite
transfers can each hold one lock and wait for the other, forever. That is
deadlock, and it does not show in a test; it shows at 12:00 on a Tuesday.

Take both locks in **one global order** and the cycle cannot form. C++17 gives
you the order for free: `std::scoped_lock lock(a_mutex, b_mutex)` acquires
any number of mutexes with a deadlock-avoiding algorithm, and releases them
all in its destructor. Two `lock_guard`s always taken `A` then `B` is the
same answer written by hand.
'''
starter     = '''
#include <iostream>
#include <mutex>
#include <string>
#include <thread>
#include <vector>

struct Tank {
    long long level = 0;
    std::mutex mutex;
};

void transfer(Tank& a, Tank& b, bool from_a, long long amount) {
    // locks whichever side the water leaves, and only that side
    if (from_a) {
        std::lock_guard<std::mutex> lock(a.mutex);
        a.level -= amount;
    } else {
        std::lock_guard<std::mutex> lock(b.mutex);
        b.level -= amount;
    }
}

int main() {
    Tank a;
    Tank b;
    int n = 0;
    std::cin >> a.level >> b.level >> n;

    std::vector<std::thread> threads;
    for (int i = 0; i < n; ++i) {
        std::string from, to;
        long long amount = 0;
        std::cin >> from >> to >> amount;
        threads.emplace_back([&a, &b, from, amount] {
            transfer(a, b, from == "A", amount);
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    std::cout << "A " << a.level << '\n';
    std::cout << "B " << b.level << '\n';
    std::cout << "MOVED " << n << '\n';
}
'''
solution    = '''
#include <iostream>
#include <mutex>
#include <string>
#include <thread>
#include <vector>

struct Tank {
    long long level = 0;
    std::mutex mutex;
};

void transfer(Tank& a, Tank& b, bool from_a, long long amount) {
    // both locks, taken together by an algorithm that cannot deadlock,
    // and released together when lock goes out of scope
    std::scoped_lock lock(a.mutex, b.mutex);
    if (from_a) {
        a.level -= amount;
        b.level += amount;
    } else {
        b.level -= amount;
        a.level += amount;
    }
}

int main() {
    Tank a;
    Tank b;
    int n = 0;
    std::cin >> a.level >> b.level >> n;

    std::vector<std::thread> threads;
    for (int i = 0; i < n; ++i) {
        std::string from, to;
        long long amount = 0;
        std::cin >> from >> to >> amount;
        threads.emplace_back([&a, &b, from, amount] {
            transfer(a, b, from == "A", amount);
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    std::cout << "A " << a.level << '\n';
    std::cout << "B " << b.level << '\n';
    std::cout << "MOVED " << n << '\n';
}
'''
hints = [
  "Lock both tanks before you touch either level. std::scoped_lock lock(a.mutex, b.mutex); does it in one line and in a safe order.",
  "The direction of the water decides which level gets the minus, not which lock is taken first.",
  "Two std::lock_guard objects, always A's mutex then B's, is the same answer; the rule is that every thread agrees on the order.",
]

