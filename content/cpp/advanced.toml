    std::cout << "DONE\n";
}
'''
solution    = '''
#include <cctype>
#include <iostream>
#include <string>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);
    std::vector<std::string> lines(n);
    for (std::string& line : lines) {
        std::getline(std::cin, line);
    }

    {
        // a jthread joins itself when it is destroyed: the closing brace of
        // this block is the join, for every thread in the vector
        std::vector<std::jthread> threads;
        for (int i = 0; i < n; ++i) {
            threads.emplace_back([i, &lines] {
                for (char& c : lines[i]) {
                    c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
                }
            });
        }
    }

    for (const std::string& line : lines) {
        std::cout << line << '\n';
    }
    std::cout << "DONE\n";
}
'''
