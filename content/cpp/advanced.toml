[[quest]]
id          = "cpp.advanced.02.join"
node        = 2
title       = "NOBODY LEAVES WITHOUT SIGNING OUT"
difficulty  = 3
story       = "A pump thread finishes its shift and the foreman walks out of the room without signing it off, and the whole building's power goes."
concepts    = ["concurrency", "raii", "closures"]
requires    = ["cpp.advanced.01.threads"]
map          = { x = 0.275, y = 0.058, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of text.

Start one thread per line that uppercases it into its own slot. Join them
all, print the lines in order, then `DONE`.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

The starter compiles, starts the threads, and aborts. It never joins them, and
a `std::thread` that is still **joinable** when its destructor runs calls
`std::terminate`. That is not a bug in the library. A thread that outlives the
function that started it would be running against stack variables that no
longer exist, and the standard decided that an abort you can see is better
than a read from freed memory you cannot.

So every `std::thread` is joined (or detached, which is almost never what you
want) before it goes out of scope. C++20 has `std::jthread`, which joins in
its destructor — RAII for threads, the same idea as `lock_guard` for locks —
and it is the type to reach for by default. Both spellings pass here.
'''
starter     = '''
#include <cctype>
#include <iostream>
#include <string>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);
    std::vector<std::string> lines(n);
    for (std::string& line : lines) {
        std::getline(std::cin, line);
    }

    std::vector<std::thread> threads;
    for (int i = 0; i < n; ++i) {
        threads.emplace_back([i, &lines] {
            for (char& c : lines[i]) {
                c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
            }
        });
    }

    // the threads are never joined: their destructors call std::terminate
    for (const std::string& line : lines) {
        std::cout << line << '\n';
    }
    std::cout << "DONE\n";
}
'''
solution    = '''
#include <cctype>
#include <iostream>
#include <string>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);
    std::vector<std::string> lines(n);
    for (std::string& line : lines) {
        std::getline(std::cin, line);
    }

    {
        // a jthread joins itself when it is destroyed: the closing brace of
        // this block is the join, for every thread in the vector
        std::vector<std::jthread> threads;
        for (int i = 0; i < n; ++i) {
            threads.emplace_back([i, &lines] {
                for (char& c : lines[i]) {
                    c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
                }
            });
        }
    }

    for (const std::string& line : lines) {
        std::cout << line << '\n';
    }
    std::cout << "DONE\n";
}
'''
hints = [
  "The smallest fix is a loop: for (std::thread& t : threads) t.join(); before anything is printed.",
  "The better fix is the type: std::vector<std::jthread>, and let the destructor do the joining when the vector goes out of scope.",
  "Put the jthread vector in its own block so the joins happen at the closing brace, before the print loop reads the lines.",
]

