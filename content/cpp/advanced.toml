value**, and `std::atomic` has no copy constructor. That is deliberate. An
atomic is a location that several threads agree to update one instruction at
a time; a copy of it would be a different location, and the sharing would be
gone. Capture them by reference.

An atomic is not a cheaper mutex; it is a different tool, for one machine
word read-modify-written in a single instruction. `fetch_add` is that
instruction. The moment two fields have to agree with each other, the lock
comes back — there is no atomic for "these two things, together", which is
why the previous quest's `Counter` had a mutex and this one does not.

