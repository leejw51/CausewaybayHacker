'''
solution    = '''
#include <iostream>
#include <memory>
#include <vector>

struct Entry {
    long long cents;
    std::unique_ptr<Entry> next;
};

// the tail of a chain is another chain, so the walk is the type's own shape;
// a raw pointer here is a view, and owns nothing
long long sum(const Entry* chain) {
    if (chain == nullptr) {
        return 0;
    }
    return chain->cents + sum(chain->next.get());
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> amounts(n);
    for (long long& v : amounts) {
        std::cin >> v;
    }

    // built back to front, so the finished chain reads in arrival order:
    // each new head takes ownership of the old one
    std::unique_ptr<Entry> head;
    for (auto it = amounts.rbegin(); it != amounts.rend(); ++it) {
        head = std::make_unique<Entry>(Entry{*it, std::move(head)});
    }

    if (!head) {
        std::cout << "-\n";
    } else {
        bool first = true;
        for (const Entry* walk = head.get(); walk != nullptr; walk = walk->next.get()) {
            std::cout << (first ? "" : " ") << walk->cents;
            first = false;
        }
        std::cout << '\n';
    }

    std::cout << "SUM " << sum(head.get()) << '\n';

    const Entry* last = head.get();
    while (last != nullptr && last->next) {
        last = last->next.get();
    }
    if (last == nullptr) {
        std::cout << "LAST NONE\n";
    } else {
        std::cout << "LAST " << last->cents << '\n';
    }
}
'''
hints = [
