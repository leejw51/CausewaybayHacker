solution    = '''
#include <iostream>
#include <sstream>
#include <string>
#include <vector>

template <typename T>
class Ring {
public:
    explicit Ring(std::size_t cap) : slots_(cap), head_(0), count_(0) {}

    void push(const T& item) {
        slots_[head_] = item;
        head_ = (head_ + 1) % slots_.size();
        if (count_ < slots_.size()) {
            ++count_;
        } else {
            ++dropped_;
        }
    }

    std::size_t dropped() const { return dropped_; }

    // walks from the oldest item to the newest, wrapping round the buffer
    class iterator {
    public:
        iterator(const Ring& ring, std::size_t offset) : ring_(ring), offset_(offset) {}

        const T& operator*() const {
            std::size_t oldest = (ring_.head_ + ring_.slots_.size() - ring_.count_) % ring_.slots_.size();
            return ring_.slots_[(oldest + offset_) % ring_.slots_.size()];
        }
        iterator& operator++() {
            ++offset_;
            return *this;
        }
        bool operator!=(const iterator& other) const { return offset_ != other.offset_; }

    private:
        const Ring& ring_;
        std::size_t offset_;
    };

    iterator begin() const { return iterator(*this, 0); }
    iterator end() const { return iterator(*this, count_); }

private:
    std::vector<T> slots_;
    std::size_t head_;
    std::size_t count_;
    std::size_t dropped_ = 0;
};

template <typename T>
void print(const Ring<T>& ring) {
    bool first = true;
    for (const T& item : ring) {
        std::cout << (first ? "" : " ") << item;
        first = false;
    }
    std::cout << '\n';
}

int main() {
    std::size_t cap = 0;
    std::cin >> cap;
    std::string line;
    std::getline(std::cin, line);

    std::getline(std::cin, line);
    std::istringstream ints(line);
    Ring<long long> numbers(cap);
    long long v = 0;
    while (ints >> v) {
        numbers.push(v);
    }

    std::getline(std::cin, line);
    std::istringstream text(line);
    Ring<std::string> words(cap);
    std::string w;
    while (text >> w) {
        words.push(w);
    }

    print(numbers);
    print(words);
    std::cout << "DROPPED " << numbers.dropped() + words.dropped() << '\n';
}
'''
hints = [
  "template <typename T> above the class, std::vector<T> for the slots, const T& for push. Then Ring<long long> and Ring<std::string> at the two points of use.",
  "The oldest item sits at (head + cap - count) % cap; item k in arrival order is (oldest + k) % cap. The iterator only needs to carry k.",
  "A function template print(const Ring<T>&) deduces T from the argument, so one printer serves both rings.",
]

