# ---------------------------------------------------------------- 01
[[quest]]
id          = "cpp.advanced.01.threads"
node        = 1
title       = "TWO PUMPS, ONE SUMP"
difficulty  = 3
story       = "Victoria Park's pump room starts its second pump at noon and the sump finally drains. Nothing else about the room changed."
concepts    = ["concurrency", "closures", "slices"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one `std::thread` per value that computes its square and writes it into
`out[i]` — its own slot, so no two threads touch the same element. Join them
all, then print each result on its own line, then `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

The threads finish in whatever order the scheduler likes. Writing by index
and printing after the joins is what makes the output the same every run. A
thread that printed for itself would not be, and a thread that captured the
loop variable by reference would be reading a variable that had already moved
on — capture `i` by value, and `out` by reference.
'''
starter     = '''
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> out(n, 0);
    std::vector<std::thread> threads;

    // one thread per value writing out[i], join them all, print
    (void)nums;
    (void)out;
}
'''
solution    = '''
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> out(n, 0);
    std::vector<std::thread> threads;
    for (int i = 0; i < n; ++i) {
        // i by value, out by reference: each thread owns exactly one slot
        threads.emplace_back([i, &nums, &out] {
            out[i] = nums[i] * nums[i];
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    for (long long v : out) {
        std::cout << v << '\n';
    }
    std::cout << "THREADS " << n << '\n';
}
'''
hints = [
  "threads.emplace_back(lambda) constructs the thread in place and starts it immediately.",
  "Capture [i, &nums, &out]: the index by value so each thread keeps its own, the vectors by reference so the writes land in main's copy.",
  "Join every thread before you read out. join() blocks until that thread has finished, and after it the writes are visible.",
]

