solution    = '''
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int k = 0;
    int n = 0;
    std::cin >> k >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> partial(k, 0);
    std::vector<std::thread> threads;
    for (int i = 0; i < k; ++i) {
        // 64-bit arithmetic on the bounds, so i * n cannot overflow an int
        std::size_t begin = static_cast<std::size_t>(i) * n / k;
        std::size_t end = static_cast<std::size_t>(i + 1) * n / k;
        threads.emplace_back([i, begin, end, &nums, &partial] {
            long long sum = 0;
            for (std::size_t j = begin; j < end; ++j) {
                sum += nums[j];
            }
            partial[i] = sum;
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    long long total = 0;
    for (int i = 0; i < k; ++i) {
        std::cout << "CHUNK " << i << ' ' << partial[i] << '\n';
        total += partial[i];
    }
    std::cout << "TOTAL " << total << '\n';
}
'''
