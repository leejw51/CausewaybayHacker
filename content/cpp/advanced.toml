# C++ LAND — ADVANCED. The pump room under Victoria Park's fountain, and
# everything in it running at once. std::thread and join, mutex and
# lock_guard, scoped_lock, condition_variable, atomics, a producer/consumer
# queue, async and promise, unique_ptr / shared_ptr / weak_ptr, move
# semantics, a class template, iterator invalidation, undefined behaviour
# made visible, jthread and stop_token, and THE DANGLING at the bottom.
#
# Every quest here has a deterministic answer on purpose: results are written
# by index and joined before printing, or handed through a FIFO queue. A quest
# whose output depends on the scheduler is a quest that fails CI at random,
# and that is not a lesson. Nothing here relies on undefined behaviour to
# produce its expected output either — where UB is the subject, the program
# detects the condition rather than committing it.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Toolchain: c++ -std=c++20 -O2 -pthread (clang on macOS, gcc on Linux).

pack = "cpp.advanced"
