this map: each thread reads its own range and writes its own slot, so there is
no lock, no atomic, nothing shared but the input. The formula for the chunk
bounds is what makes the split exact — the last chunk always ends at `n`, and
a chunk may be empty when `k > n`, which one of the hidden cases arranges.
