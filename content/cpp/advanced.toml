[[quest]]
id          = "cpp.advanced.17.segfault"
node        = 17
title       = "THE WRONG ADDRESS"
difficulty  = 4
story       = "12:00:00. The Noon Day Gun fires at an address nobody owns, and the whole waterfront goes quiet."
concepts    = ["pointers", "undefined-behaviour", "slices", "error-handling"]
