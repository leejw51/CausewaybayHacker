[[quest]]
id          = "cpp.advanced.12.lambdas"
node        = 12
title       = "THE DOOR COUNT"
difficulty  = 3
story       = "The Yacht Club turnstile counts who walks in and who walks out, and the manager wants the number at closing whatever happened in between."
concepts    = ["closures", "functions", "control-flow"]
requires    = ["cpp.advanced.11.templates"]
map          = { x = 0.396, y = 0.276, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each `IN` or `OUT`.

Keep a running count that never drops below zero and print it after every
command. Then print `INS <k>` — how many commands were `IN`, counted with
`std::count_if` and a lambda — and `CLOSED <final>`.

```
input:  4
        IN
        IN
        OUT
        IN
output: 1
        2
        1
        2
        INS 3
        CLOSED 2
```

The counter is a closure: `make_counter` returns a lambda that owns its own
total. A lambda captures by copy by default, and a copy is `const` inside the
body — `mutable` after the parameter list is what lets the captured total
change between calls. An **init-capture**, `[total = 0LL]`, declares the
captured variable right there in the brackets rather than in the enclosing
scope, so there is nothing outside the lambda for anyone else to touch.

The other capture, `[&]`, takes everything by reference. Both are written in
this quest; knowing which one you meant is what an interviewer listens for.
'''
starter     = '''
#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

auto make_counter() {
    // return a lambda that keeps a total between calls, clamped at zero
    return [](long long delta) {
        (void)delta;
        return 0LL;
    };
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<std::string> commands(n);
    for (std::string& c : commands) {
        std::cin >> c;
    }

    auto count = make_counter();
    long long last = 0;
    for (const std::string& c : commands) {
        last = count(c == "IN" ? 1 : -1);
        std::cout << last << '\n';
    }

    // INS via std::count_if with a lambda
    std::cout << "INS 0\n";
    std::cout << "CLOSED " << last << '\n';
}
'''
solution    = '''
#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

auto make_counter() {
    // total lives inside the closure object; mutable lets each call change it
    return [total = 0LL](long long delta) mutable {
        total += delta;
        if (total < 0) {
            total = 0;
        }
        return total;
    };
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<std::string> commands(n);
    for (std::string& c : commands) {
        std::cin >> c;
    }

    auto count = make_counter();
    long long last = 0;
    for (const std::string& c : commands) {
        last = count(c == "IN" ? 1 : -1);
        std::cout << last << '\n';
    }

    const std::string in = "IN";
    // [&] captures `in` by reference; the lambda reads it and owns nothing
    long long ins = std::count_if(commands.begin(), commands.end(),
        [&](const std::string& c) { return c == in; });

    std::cout << "INS " << ins << '\n';
    std::cout << "CLOSED " << last << '\n';
}
'''
