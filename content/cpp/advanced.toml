# ---------------------------------------------------------------- 17  BOSS
[[quest]]
id          = "cpp.advanced.17.dangling"
node        = 17
title       = "THE DANGLING"
difficulty  = 5
story       = "Victoria Park's pump room, two floors under the fountain. A pump thread is still reading a buffer that the room freed when the shift ended."
concepts    = ["raii", "smart-pointers", "concurrency", "undefined-behaviour"]
requires    = ["cpp.advanced.16.jthread", "cpp.advanced.11.shared-ptr"]
map          = { x = 0.719, y = 0.950, kind = "boss" }
brief       = '''
Line one is `w n`: `w` pumps and `n` readings. Line two is the readings.

`pump(w, buffer)` starts `w` threads; thread `i` sums the readings from
`i * n / w` up to `(i + 1) * n / w` into `partial[i]`, and `pump` returns
the partials. `main` prints `PUMP <i> <sum>` for each, `TOTAL <sum>`, and
then `FREED yes` if the buffer has been released by the time everything is
done — observed through a `std::weak_ptr`.

```
input:  2 4
        1 2 3 4
output: PUMP 0 3
        PUMP 1 7
        TOTAL 10
        FREED yes
```

The starter aborts. `pump` builds its threads in a local vector and returns
while they are still joinable, so the vector's destructor calls
`std::terminate`. Read what it was about to do instead: those threads hold a
**reference** to `buffer`, and `pump`'s caller is about to let `buffer` die.
A thread reading a vector after its destructor ran is reading freed memory.
Sometimes it gets the old numbers. Sometimes it gets the next allocation.
Sometimes the allocator has already handed the pages back and it segfaults.
It is undefined behaviour, and it is the most expensive kind, because it does
not fail where the mistake is.

Fix the ownership, not the symptom. The buffer is a
`std::shared_ptr<const std::vector<long long>>`, every thread captures **its
own copy of the handle**, and the buffer lives exactly as long as the last
thread holding it — however `pump` returns and whatever order the threads
finish in. Join before you return. `main` keeps a `weak_ptr` and, after
`pump` has returned and dropped its own handle, `expired()` is the proof: the
readings were freed, once, by whichever pump finished last, and nobody was
still reading.

That is the whole land in one program. Nothing checked you. You made the
lifetime match the use, and the tools that do it — the smart pointer that
counts, the join that waits — are the same RAII you met on the basic road.
'''
starter     = '''
#include <iostream>
#include <memory>
#include <thread>
#include <vector>

// starts w pumps over the buffer and returns their partial sums
std::vector<long long> pump(int w, std::shared_ptr<const std::vector<long long>> buffer) {
    const std::vector<long long>& readings = *buffer;
    std::size_t n = readings.size();
    std::vector<long long> partial(w, 0);

    std::vector<std::thread> pumps;
    for (int i = 0; i < w; ++i) {
        std::size_t begin = static_cast<std::size_t>(i) * n / w;
        std::size_t end = static_cast<std::size_t>(i + 1) * n / w;
        // the thread holds a reference to readings, which is about to die
        pumps.emplace_back([i, begin, end, &readings, &partial] {
            long long sum = 0;
            for (std::size_t j = begin; j < end; ++j) {
                sum += readings[j];
            }
            partial[i] = sum;
        });
    }

    // pumps is destroyed here with every thread still joinable
    return partial;
}

int main() {
    int w = 0;
    int n = 0;
    std::cin >> w >> n;
    auto buffer = std::make_shared<std::vector<long long>>(n);
    for (long long& v : *buffer) {
        std::cin >> v;
    }
    std::weak_ptr<const std::vector<long long>> watch = buffer;

    std::vector<long long> partial = pump(w, std::move(buffer));

    long long total = 0;
    for (int i = 0; i < w; ++i) {
        std::cout << "PUMP " << i << ' ' << partial[i] << '\n';
        total += partial[i];
    }
    std::cout << "TOTAL " << total << '\n';
    std::cout << "FREED " << (watch.expired() ? "yes" : "no") << '\n';
}
'''
solution    = '''
#include <iostream>
#include <memory>
#include <thread>
#include <vector>

// starts w pumps over the buffer and returns their partial sums
std::vector<long long> pump(int w, std::shared_ptr<const std::vector<long long>> buffer) {
    std::size_t n = buffer->size();
    std::vector<long long> partial(w, 0);

    {
        std::vector<std::jthread> pumps;
        for (int i = 0; i < w; ++i) {
            std::size_t begin = static_cast<std::size_t>(i) * n / w;
            std::size_t end = static_cast<std::size_t>(i + 1) * n / w;
            // each thread owns a handle to the readings; the vector cannot
            // be freed while any of them is still running
            pumps.emplace_back([i, begin, end, buffer, &partial] {
                long long sum = 0;
                for (std::size_t j = begin; j < end; ++j) {
                    sum += (*buffer)[j];
                }
                partial[i] = sum;
            });
        }
        // every pump is joined at this brace, before partial is read or returned
    }

    return partial;
    // pump's own handle dies here; the threads' handles died when they finished
}

int main() {
    int w = 0;
    int n = 0;
    std::cin >> w >> n;
    auto buffer = std::make_shared<std::vector<long long>>(n);
    for (long long& v : *buffer) {
        std::cin >> v;
    }
    std::weak_ptr<const std::vector<long long>> watch = buffer;

    std::vector<long long> partial = pump(w, std::move(buffer));

    long long total = 0;
    for (int i = 0; i < w; ++i) {
        std::cout << "PUMP " << i << ' ' << partial[i] << '\n';
        total += partial[i];
    }
    std::cout << "TOTAL " << total << '\n';
    // main gave its handle away, pump's is gone, the threads' are gone
    std::cout << "FREED " << (watch.expired() ? "yes" : "no") << '\n';
}
'''
hints = [
  "Two changes in pump: capture buffer (the shared_ptr) by value instead of readings by reference, and join every thread before return — a std::vector<std::jthread> in its own block does the joining at the closing brace.",
  "The lambda's copy of the shared_ptr is what keeps the vector alive; it is released when the thread function returns, not when pump does. That is the difference between a reference and an owner.",
  "partial is still captured by reference, and that is correct: pump owns it, pump joins before returning it, and each thread writes only its own slot.",
  "main moves its handle into pump on purpose. If it had kept one, FREED would be no — the buffer would be alive because main was still holding it, and that is the other answer this boss accepts you being able to explain.",
]

