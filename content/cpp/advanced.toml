[[quest]]
id          = "cpp.advanced.05.classes"
node        = 5
title       = "THE SLIPWAY LEDGER"
difficulty  = 3
story       = "The Yacht Club slipway charges every haul-out and keeps the lines in one place, or it did before the suggestion replaced the class with a comment."
concepts    = ["structs", "functions", "mutability"]
requires    = ["cpp.advanced.04.strings"]
map          = { x = 0.604, y = 0.137, kind = "quest" }
brief       = '''
Line one is `<BOAT> <n>`. The next `n` lines are `<ITEM> <CENTS>`.

Build a `Ledger` for the boat that collects the items, then print each item
back as `<ITEM> <CENTS>` in the order it arrived, then `TOTAL <sum>`, then
`BOAT <name> <count>`.

```
input:  KWAN 2
        HAUL 600
        WASH 2800
output: HAUL 600
        WASH 2800
        TOTAL 3400
        BOAT KWAN 2
```

`n` may be `0`, and then the output is the last two lines only.

A `class` is a `struct` whose members are private unless you say `public:`.
The constructor runs before the body has a chance to, so members are set in
the **initialiser list** — `Ledger(std::string boat) : boat_(std::move(boat)) {}`
— and not by assignment inside the braces. `total()` changes nothing, so it is
declared `const`, which is the only reason it can be called on a
`const Ledger&`.
'''
starter     = '''
#include <iostream>
#include <string>
#include <utility>
#include <vector>

class Ledger {
public:
    explicit Ledger(std::string boat) {
        (void)boat;
        // what does a ledger have to remember?
    }

    void add(const std::string& item, long long cents) {
        (void)item;
        (void)cents;
    }

    long long total() const {
        return 0;
    }

    // items() and boat() and count() are missing
};

int main() {
    std::string boat;
    int n = 0;
    std::cin >> boat >> n;

    Ledger ledger(boat);
    for (int i = 0; i < n; ++i) {
        std::string item;
        long long cents = 0;
        std::cin >> item >> cents;
        ledger.add(item, cents);
    }

    // print each item, then TOTAL, then BOAT <name> <count>
    std::cout << "TOTAL " << ledger.total() << '\n';
}
'''
solution    = '''
#include <iostream>
#include <string>
#include <utility>
#include <vector>

class Ledger {
public:
    explicit Ledger(std::string boat) : boat_(std::move(boat)) {}

    void add(const std::string& item, long long cents) {
        items_.emplace_back(item, cents);
    }

    long long total() const {
        long long sum = 0;
        for (const auto& [item, cents] : items_) {
            sum += cents;
        }
        return sum;
    }

    const std::vector<std::pair<std::string, long long>>& items() const {
        return items_;
    }

    const std::string& boat() const { return boat_; }
    std::size_t count() const { return items_.size(); }

private:
    std::string boat_;
    std::vector<std::pair<std::string, long long>> items_;
};

int main() {
    std::string boat;
    int n = 0;
    std::cin >> boat >> n;

    Ledger ledger(boat);
    for (int i = 0; i < n; ++i) {
        std::string item;
        long long cents = 0;
        std::cin >> item >> cents;
        ledger.add(item, cents);
    }

    for (const auto& [item, cents] : ledger.items()) {
        std::cout << item << ' ' << cents << '\n';
    }
    std::cout << "TOTAL " << ledger.total() << '\n';
    std::cout << "BOAT " << ledger.boat() << ' ' << ledger.count() << '\n';
}
'''
hints = [
  "A std::vector<std::pair<std::string, long long>> is enough. The class is there so the ledger owns its own lines.",
  "The initialiser list — : boat_(std::move(boat)) — sets the member as it is constructed; assigning inside the braces builds an empty string first and then overwrites it.",
  "Return the items as a const reference so main can walk them without copying the vector, and mark every method that does not modify the ledger const.",
]

