[[quest]]
id          = "cpp.advanced.11.templates"
node        = 11
title       = "WRITE IT ONCE"
difficulty  = 3
story       = "The pump room's gauge board has largest written four times — for litres, for minutes, for pumps and for pump names — and the fifth is due before the tide turns."
concepts    = ["generics", "types", "mutability"]
