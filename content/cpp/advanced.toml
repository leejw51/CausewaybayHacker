[[quest]]
id          = "cpp.advanced.04.counter"
node        = 4
title       = "A COUNTER THAT LOCKS ITSELF"
difficulty  = 4
story       = "The turnstile at Victoria Park's east gate keeps two numbers that have to agree with each other, and two people are reading them at the same time."
concepts    = ["shared-state", "structs", "mutability"]
requires    = ["cpp.advanced.03.mutex"]
map          = { x = 0.602, y = 0.065, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Finish the `Counter`: `add` takes the lock, adds to the total and bumps the
hit count; `snapshot` takes the lock and returns both together. Start one
thread per value, join them, then print `TOTAL <sum>` and `HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

The mutex lives **inside** the class, next to the fields it guards, and every
method that touches them takes it. That is the shape: the lock is part of the
object, not something callers are trusted to remember.

The starter does not compile, and the reason is worth a minute. `snapshot()`
is `const` — it changes no field the caller can see — but locking a mutex
*changes the mutex*, and inside a `const` method every member is `const`.
The fix is `mutable std::mutex`: `mutable` marks a member that is allowed to
change even through a `const` object, precisely for bookkeeping like this
that is not part of the value. It is the only place `mutable` is routinely
correct, and an interviewer who asks about it wants to hear this example.
'''
starter     = '''
#include <iostream>
#include <mutex>
#include <thread>
#include <utility>
#include <vector>

class Counter {
public:
    void add(long long value) {
        std::lock_guard<std::mutex> lock(mutex_);
        total_ += value;
        ++hits_;
    }

    // const, so mutex_ is const here, and a const mutex cannot be locked
    std::pair<long long, int> snapshot() const {
        std::lock_guard<std::mutex> lock(mutex_);
        return {total_, hits_};
    }

private:
    std::mutex mutex_;
    long long total_ = 0;
    int hits_ = 0;
};

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    Counter counter;
    std::vector<std::thread> threads;
    for (long long value : nums) {
        threads.emplace_back([&counter, value] { counter.add(value); });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    auto [total, hits] = counter.snapshot();
    std::cout << "TOTAL " << total << '\n';
    std::cout << "HITS " << hits << '\n';
}
'''
solution    = '''
#include <iostream>
#include <mutex>
#include <thread>
#include <utility>
#include <vector>

class Counter {
public:
    void add(long long value) {
        std::lock_guard<std::mutex> lock(mutex_);
        total_ += value;
        ++hits_;
    }

    // reading both under one lock is what makes the pair consistent
    std::pair<long long, int> snapshot() const {
        std::lock_guard<std::mutex> lock(mutex_);
        return {total_, hits_};
    }

private:
    // mutable: the lock may change even when the Counter is const
    mutable std::mutex mutex_;
    long long total_ = 0;
    int hits_ = 0;
};

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    Counter counter;
    std::vector<std::thread> threads;
    for (long long value : nums) {
        threads.emplace_back([&counter, value] { counter.add(value); });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    auto [total, hits] = counter.snapshot();
    std::cout << "TOTAL " << total << '\n';
    std::cout << "HITS " << hits << '\n';
}
'''
hints = [
  "One word fixes the compile error: mutable std::mutex mutex_;",
  "Dropping the const from snapshot() also compiles, and is the wrong answer — the method really does not change the value, and the signature should say so.",
  "A std::mutex cannot be copied or moved, so a class holding one cannot be either; pass Counter by reference, which the lambda already does.",
]

