map          = { x = 0.474, y = 0.314, kind = "quest" }
brief       = '''
Standard input is two lines: integers on the first, words on the second.

Write **one** `largest` that works on both, and a class template `Pair<T>`
with `larger()` and `smaller()`.

Print the largest integer, the largest word, then
`PAIR <larger> <smaller>` for a `Pair` of the first two integers. A tie counts
as `a` being the larger.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

The starter does not compile: `largest` is nailed to `long long`, so passing
it the words is *no matching function*. A **function template**,
`template <typename T> T largest(const std::vector<T>& xs)`, is stamped out
once per type it is called with — `T` is deduced from the argument, and the
only thing the body demands of `T` is that `>` works on it.

`Pair<T>` is the same idea for a class. Its methods are `const`, because they
read and do not write, and they return `const T&` rather than a copy, because
the caller only wants to look. Both signatures say what they promise, and the
compiler holds them to it.
'''
starter     = '''
#include <iostream>
#include <sstream>
#include <string>
#include <vector>

long long largest(const std::vector<long long>& xs) {
    long long best = xs[0];
    for (long long x : xs) {
        if (x > best) {
            best = x;
        }
    }
    return best;
}

// Pair<T> goes here, with larger() and smaller()

int main() {
    std::string line;
    std::getline(std::cin, line);
    std::istringstream ints(line);
    std::vector<long long> nums;
    long long v = 0;
    while (ints >> v) {
        nums.push_back(v);
    }

    std::getline(std::cin, line);
    std::istringstream text(line);
    std::vector<std::string> words;
    std::string w;
    while (text >> w) {
        words.push_back(w);
    }

    std::cout << largest(nums) << '\n';
    std::cout << largest(words) << '\n';
    std::cout << "PAIR " << nums[0] << ' ' << nums[1] << '\n';
}
'''
solution    = '''
#include <iostream>
#include <sstream>
#include <string>
#include <vector>

// one definition, instantiated once per T it is used with
template <typename T>
T largest(const std::vector<T>& xs) {
    T best = xs[0];
    for (const T& x : xs) {
        if (x > best) {
            best = x;
        }
    }
    return best;
}

template <typename T>
class Pair {
public:
    Pair(T a, T b) : a_(std::move(a)), b_(std::move(b)) {}

    const T& larger() const { return a_ >= b_ ? a_ : b_; }
    const T& smaller() const { return a_ >= b_ ? b_ : a_; }

private:
    T a_;
    T b_;
};

int main() {
    std::string line;
    std::getline(std::cin, line);
    std::istringstream ints(line);
    std::vector<long long> nums;
    long long v = 0;
    while (ints >> v) {
        nums.push_back(v);
    }

    std::getline(std::cin, line);
    std::istringstream text(line);
    std::vector<std::string> words;
    std::string w;
    while (text >> w) {
        words.push_back(w);
    }

    std::cout << largest(nums) << '\n';
    std::cout << largest(words) << '\n';

    Pair<long long> pair(nums[0], nums[1]);
    std::cout << "PAIR " << pair.larger() << ' ' << pair.smaller() << '\n';
}
'''
hints = [
  "template <typename T> in front of largest, and T in place of long long everywhere inside it. The calls do not change; T is deduced.",
  "std::string already has operator>, so the same template body compiles for the words with nothing added.",
  "Pair<T> is a class template; you name the type at the point of use — Pair<long long> — and the methods are const because they only compare.",
]

