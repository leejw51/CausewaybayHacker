solution    = '''
#include <future>
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<std::future<long long>> squares;
    for (long long value : nums) {
        squares.push_back(std::async(std::launch::async, [value] {
            return value * value;
        }));
    }
    for (std::future<long long>& f : squares) {
        std::cout << f.get() << '\n';
    }

    std::promise<int> count;
    std::future<int> ready = count.get_future();
    std::thread reporter([&count, n] {
        count.set_value(n);
    });
    std::cout << "READY " << ready.get() << '\n';
    reporter.join();
}
'''
