[[quest]]
id          = "cpp.advanced.06.enum-class"
node        = 6
title       = "WHO IS AT THE HELM"
difficulty  = 3
story       = "The Yacht Club gate charges every card the member rate, including the ones that are not members and the one that is not a card."
concepts    = ["enums", "pattern-matching", "functions"]
requires    = ["cpp.advanced.05.classes"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <HOURS>`.

The base rate is `500 + 100 * HOURS` cents. For each line print one of:

* `MEMBER` — the base rate
* `CREW` — half the base rate, integer division
* `JUNIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        MEMBER 4
        CREW 4
        JUNIOR 4
output: 900
        450
        200
```

Model the card as an `enum class Card` with four values, one of them
`Other`. An `enum class` value does not convert to an `int` behind your back
and does not leak its names into the enclosing scope — both of which a plain
`enum` does, and both of which are why it is the one to write.

A C++ enum cannot carry a payload, so the unrecognised tag travels beside it:
a small `struct Tag { Card card; std::string raw; }`. Decide the fare with one
`switch`. Cover every enumerator and the compiler has nothing to warn about;
leave one out and `-Wall` will tell you which.
'''
starter     = '''
#include <iostream>
#include <string>

enum class Card {
    Member,
    Crew,
    Junior,
    // one more value, for the tag it did not recognise
};

struct Tag {
    Card card;
    std::string raw;
};

Tag classify(const std::string& raw) {
    // MEMBER / CREW / JUNIOR / anything else
    return Tag{Card::Member, raw};
}

std::string fare(const Tag& tag, long long hours) {
    long long base = 500 + 100 * hours;
    (void)tag;
    (void)base;
    // one switch over tag.card
    return "?";
}

int main() {
    int n = 0;
    std::cin >> n;
    for (int i = 0; i < n; ++i) {
        std::string raw;
        long long hours = 0;
        std::cin >> raw >> hours;
        std::cout << fare(classify(raw), hours) << '\n';
    }
}
'''
solution    = '''
#include <iostream>
#include <string>

enum class Card {
    Member,
    Crew,
    Junior,
    Other,
};

struct Tag {
    Card card;
    std::string raw;
};

Tag classify(const std::string& raw) {
    if (raw == "MEMBER") return Tag{Card::Member, raw};
    if (raw == "CREW") return Tag{Card::Crew, raw};
    if (raw == "JUNIOR") return Tag{Card::Junior, raw};
    return Tag{Card::Other, raw};
}

std::string fare(const Tag& tag, long long hours) {
    long long base = 500 + 100 * hours;
    switch (tag.card) {
        case Card::Member: return std::to_string(base);
        case Card::Crew: return std::to_string(base / 2);
        case Card::Junior: return "200";
        case Card::Other: return "UNKNOWN " + tag.raw;
    }
    return "?";  // unreachable once every enumerator is covered
}

int main() {
    int n = 0;
    std::cin >> n;
    for (int i = 0; i < n; ++i) {
        std::string raw;
        long long hours = 0;
        std::cin >> raw >> hours;
        std::cout << fare(classify(raw), hours) << '\n';
    }
}
'''
hints = [
  "Card::Other is the fourth enumerator; the string it did not recognise lives in Tag::raw next to it.",
  "switch (tag.card) with a case per enumerator, and return from inside each case — no break needed when every arm returns.",
  "std::to_string turns the number into a std::string; the UNKNOWN line is a string concatenation with +.",
]

