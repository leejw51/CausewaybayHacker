#include <cctype>
#include <iostream>
#include <string>
#include <utility>
#include <vector>

int copies = 0;
int moves = 0;

struct Docket {
    std::string text;

    explicit Docket(std::string t) : text(std::move(t)) {}
    Docket(const Docket& other) : text(other.text) { ++copies; }
    Docket(Docket&& other) noexcept : text(std::move(other.text)) { ++moves; }
};

int main() {
    int n = 0;
    std::cin >> n;
    std::string rest;
    std::getline(std::cin, rest);

    std::vector<Docket> pile;
    pile.reserve(n);
    for (int i = 0; i < n; ++i) {
        std::string line;
        std::getline(std::cin, line);
        pile.emplace_back(line);
    }

    std::vector<Docket> sent;
    sent.reserve(n);
    for (Docket& d : pile) {
        // std::move casts d to an rvalue, so push_back picks the move
        // constructor and steals the string's buffer; d is now valid but
        // unspecified, and this program never reads it again
        sent.push_back(std::move(d));
    }

    for (Docket& d : sent) {
        for (char& c : d.text) {
            c = static_cast<char>(std::toupper(static_cast<unsigned char>(c)));
        }
        std::cout << d.text << '\n';
    }
    std::cout << "SENT " << sent.size() << '\n';
    std::cout << "COPIES " << copies << '\n';
    std::cout << "MOVES " << moves << '\n';
}
'''
