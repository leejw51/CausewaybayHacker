[[quest]]
id          = "cpp.advanced.03.mutex"
node        = 3
title       = "ONE SUMP, EIGHT PUMPS"
difficulty  = 4
story       = "Every pump adds what it drained to one total on the wall, and at the end of the hour the wall disagrees with all of them."
concepts    = ["shared-state", "concurrency", "data-races"]
requires    = ["cpp.advanced.02.join"]
map          = { x = 0.389, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Start one thread per value that adds it to **one shared total**. Join them
all, then print `TOTAL <sum>` and `THREADS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

The starter compiles and prints `TOTAL 0`. The lambda captures `total` by
value — `[total, value]` with `mutable` — so every thread adds to its own
private copy and throws it away. Capture it by reference and you have a
different bug, the one that does not show up in a test this small: `total +=
value` from several threads at once is a **data race**, which in C++ is
undefined behaviour, not merely a wrong number.

A `std::mutex` next to the total, and a `std::lock_guard` in every thread
that touches it, is the answer. The guard locks in its constructor and
unlocks in its destructor, so there is no unlock to forget and an exception
thrown mid-update still releases it.
'''
starter     = '''
#include <iostream>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    long long total = 0;
    std::vector<std::thread> threads;
    for (long long value : nums) {
        // total is captured by value: every thread gets a private copy
        threads.emplace_back([total, value]() mutable {
            total += value;
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    std::cout << "TOTAL " << total << '\n';
    std::cout << "THREADS " << n << '\n';
}
'''
solution    = '''
#include <iostream>
#include <mutex>
#include <thread>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    long long total = 0;
    std::mutex total_mutex;
    std::vector<std::thread> threads;
    for (long long value : nums) {
        threads.emplace_back([&total, &total_mutex, value] {
            // locked from here to the closing brace, whatever happens in between
            std::lock_guard<std::mutex> lock(total_mutex);
            total += value;
        });
    }
    for (std::thread& t : threads) {
        t.join();
    }

    std::cout << "TOTAL " << total << '\n';
    std::cout << "THREADS " << n << '\n';
}
'''
hints = [
  "Capture total by reference — [&total, &total_mutex, value] — and drop the mutable; the thread should change main's total, not its own.",
  "std::lock_guard<std::mutex> lock(total_mutex); is one line, and the unlock is the end of the block.",
  "Reading total after every join is safe without the lock: join() is a synchronisation point, and no thread is left to write.",
]

