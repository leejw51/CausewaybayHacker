# C++ LAND — ADVANCED. The morning walk turns into the noon gun. First the
# language's own machinery — references, vectors, strings, classes, enum
# class, maps, sets, algorithms, templates, lambdas, optional/variant,
# exceptions, iterators, RAII, and the SEGFAULT at the gun — and then the
# pump room under Victoria Park, where everything happens at once: threads,
# mutexes, condition variables, atomics, async, smart pointers, moves, and
# THE DANGLING. The grammar drills live on the BASIC road now.
#
# Every quest here has a deterministic answer on purpose: results are joined in
# order, collected and sorted, or piped. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

