brief       = '''
Standard input is a count `n`, then `n` lines of text.

Start one thread per line that uppercases it into its own slot. Join them
all, print the lines in order, then `DONE`.

```
input:  2
        lucky mac
        percival
output: LUCKY MAC
        PERCIVAL
        DONE
```

The starter compiles, starts the threads, and aborts. It never joins them, and
a `std::thread` that is still **joinable** when its destructor runs calls
`std::terminate`. That is not a bug in the library. A thread that outlives the
function that started it would be running against stack variables that no
longer exist, and the standard decided that an abort you can see is better
than a read from freed memory you cannot.

So every `std::thread` is joined (or detached, which is almost never what you
want) before it goes out of scope. C++20 has `std::jthread`, which joins in
its destructor — RAII for threads, the same idea as `lock_guard` for locks —
and it is the type to reach for by default. Both spellings pass here.
'''
