[[quest]]
id          = "cpp.cheatsheet_advanced.01.auto-params"
node        = 1
title       = "ANY TWO WILL DO"
difficulty  = 3
story       = "The money changer on Hennessy Road adds a fare in dollars to a tip in cents and does not want a separate function for every pair of types."
concepts    = ["generics", "functions", "types"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
Define `add` in **one** definition so that `add(1, 2.5)` compiles and
returns `3.5`, and `add(std::string("a"), "b")` compiles too. C++20.
'''
solution    = 'auto add(auto a, auto b) { return a + b; }'
hints = [
  "Since C++20 a placeholder in a parameter list makes the function a template by itself — and each placeholder is its own type.",
]

[quest.quiz]
choices = [
  'template <typename T> T add(T a, T b) { return a + b; }',
  'auto add(auto a, auto b) { return a + b; }',
  'template <auto T> T add(T a, T b) { return a + b; }',
  'auto add(a, b) { return a + b; }',
]
answer  = 1

