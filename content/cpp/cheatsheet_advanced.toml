# C++ LAND — CHEATSHEET ADVANCED. The second page of the cheatsheet, asked:
# one question per thing an interviewer uses to tell a fluent C++20 hand from
# one who only knows the grammar — abbreviated templates, concepts, what a
# lambda captures, a lambda that calls itself, moving a unique_ptr, locking a
# weak_ptr, a move constructor that leaves the source safe, try_emplace,
# optional and string_view, visit, span, a views pipeline, a hash for a pair,
# a heap with its own order, erasing one copy, splitting on a delimiter,
# erase_if, popcount, a stopwatch, jthread, async, scoped_lock, atomics and a
# condition variable. Four lines, one right. Nothing is typed and nothing is
# compiled — the pick is the submission, and the server judges it against the
# quiz (SPEC §0). The three wrong lines are near-misses: a missing `mutable`,
# a `static_cast` where a `dynamic_cast` was meant, a lock that deadlocks, a
# comparator that builds the other heap.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
# Every line was compiled with clang (C++20, libc++) before it was written down.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "cpp.cheatsheet_advanced"
land     = "cpp"
category = "cheatsheet_advanced"
version  = 1

