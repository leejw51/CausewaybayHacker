brief       = '''
```cpp
struct Buf {
  int* data; int n;
  explicit Buf(int n) : data(new int[n]), n(n) {}
  ~Buf() { delete[] data; }
  Buf(const Buf&) = delete;
  Buf& operator=(const Buf&) = delete;
  // the move constructor goes here
};
```

Add the move constructor: `Buf b(std::move(a));` must take over `a`'s
array, and the moved-from `a` must be **safe to destroy**. `<utility>` is
included.
'''
solution    = 'Buf(Buf&& o) noexcept : data(std::exchange(o.data, nullptr)), n(o.n) {}'
hints = [
  "The parameter is an rvalue reference, and it cannot be `const` if you are going to empty it. One utility stores a new value and hands back the old one in a single expression.",
]

[quest.quiz]
choices = [
  'Buf(Buf&& o) noexcept : data(std::exchange(o.data, nullptr)), n(o.n) {}',
  'Buf(Buf&& o) noexcept : data(o.data), n(o.n) {}',
  'Buf(Buf& o) noexcept : data(std::exchange(o.data, nullptr)), n(o.n) {}',
  'Buf(const Buf&& o) noexcept : data(std::exchange(o.data, nullptr)), n(o.n) {}',
