[[quest]]
id          = "cpp.cheatsheet.17.ordering"
node        = 17
title       = "A SEAT IN THE SET"
difficulty  = 3
story       = "Every sampan in the typhoon shelter is a (row, column) berth, and the harbour office keeps them in a std::set — which refuses anything it cannot order."
concepts    = ["structs", "sorting", "collections"]
requires    = ["cpp.cheatsheet.16.sort-by"]
map         = { x = 0.74, y = 0.53, kind = "quest" }
brief       = '''
```cpp
struct Pt { int r, c; };
std::set<Pt> taken;
```

This does not compile yet. Add **one member** inside `Pt` so that `taken`
works and orders by `r`, then by `c` to break ties. C++20, `<tuple>` is
included.
'''
solution    = 'bool operator<(const Pt& o) const { return std::tie(r, c) < std::tie(o.r, o.c); }'
hints = [
  "The set compares `const` elements, and a lexicographic order means the second field only matters when the first one ties.",
]

[quest.quiz]
choices = [
  'bool operator<(const Pt& o) const { return r < o.r; }',
  'bool operator<(const Pt& o) const { return r < o.r && c < o.c; }',
  'bool operator<(const Pt& o) { return std::tie(r, c) < std::tie(o.r, o.c); }',
  'bool operator<(const Pt& o) const { return std::tie(r, c) < std::tie(o.r, o.c); }',
]
answer  = 3

