# C++ LAND — CHEATSHEET. The grammar off the page, asked: one question per
# section of a modern C++ (17/20) live-coding cheatsheet — fast I/O, a whole
# line, fixed decimals, a wide product, a loop that writes back, a grid, a
# sort, a tally, a lookup, a heap, an erase, a failed parse. Four lines, one
# right. Nothing is typed and nothing is compiled — the pick is the
# submission, and the server judges it against the quiz (SPEC §0). The three
# wrong lines are near-misses: another language's spelling, a copy where a
# reference was meant, a call that compiles and does the wrong thing.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "cpp.cheatsheet"
land = "cpp"
category = "cheatsheet"
version = 1

