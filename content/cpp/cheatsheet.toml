[[quest]]
id          = "cpp.cheatsheet.01.fast-io"
node        = 1
title       = "OPEN THE FLOODGATE"
difficulty  = 1
story       = "06:00, the typhoon shelter. A million fish prices arrive at once, and the default streams are too polite to keep up."
concepts    = ["io", "types"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
First thing in `main`, before any I/O: stop `cin`/`cout` from syncing with
C's stdio, and untie `cin` from `cout` so reading does not flush output.

Which line is it?
'''
solution    = 'std::ios::sync_with_stdio(false); std::cin.tie(nullptr);'
hints = [
  "Sync off is `false`; `tie` takes a pointer to the stream to flush, and `nullptr` means none.",
]

[quest.quiz]
choices = [
  'std::ios::sync_with_stdio(true); std::cin.tie(nullptr);',
  'std::cin.tie(std::cout); std::ios::sync_with_stdio(false);',
  'std::ios::fast_io(true);',
  'std::ios::sync_with_stdio(false); std::cin.tie(nullptr);',
]
answer  = 3

