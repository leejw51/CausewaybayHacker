  "std::istringstream ss(line); while (std::getline(ss, w, ' ')) words.push_back(w);",
  "for (auto& t : line.split(' ')) words.push_back(t);",
  'std::istringstream ss(line); while (ss >> w) words.push_back(w);',
  'std::istringstream ss(line); while (ss >> w) words.push(w);',
]
answer  = 2

