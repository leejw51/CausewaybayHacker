brief       = '''
`<cstdint>` names integers by their width: `int32_t` and `int64_t` are signed,
`uint32_t` and `uint64_t` are unsigned. A value moves between widths with
`static_cast<...>`, which says out loud that a conversion is happening.
`std::numeric_limits<T>::max()` from `<limits>` is the largest value a
width can hold.

```
uint64_t b = static_cast<uint64_t>(a);
std::cout << std::numeric_limits<uint64_t>::max() << '\n';
```

`a` is read as an `int32_t`. Type the cast line at the first `// FILL`, and
the second print line at the second.

```
input:  7
output: 7
        2147483647
        18446744073709551615
```
'''
starter     = '''
#include <cstdint>
#include <iostream>
#include <limits>

int main() {
    int32_t a = 0;
    std::cin >> a;

    uint64_t b = 0;  // FILL: b is a, widened with static_cast<uint64_t>
    // ANSWER: uint64_t b = static_cast<uint64_t>(a);
    std::cout << b << '\n';
    std::cout << std::numeric_limits<int32_t>::max() << '\n';
    std::cout << 0 << '\n';  // FILL: the largest uint64_t, from std::numeric_limits
    // ANSWER: std::cout << std::numeric_limits<uint64_t>::max() << '\n';
}
'''
solution    = '''
#include <cstdint>
#include <iostream>
#include <limits>

int main() {
    int32_t a = 0;
    std::cin >> a;

    uint64_t b = static_cast<uint64_t>(a);
    std::cout << b << '\n';
    std::cout << std::numeric_limits<int32_t>::max() << '\n';
    std::cout << std::numeric_limits<uint64_t>::max() << '\n';
}
'''
