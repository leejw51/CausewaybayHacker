        DISTINCT 3
```

Neither container gives you this on its own, and that is the whole quest.

`std::map` is a tree: iterating it hands the names back **sorted**, which is
not the order they answered in. `std::unordered_map` is a hash table: lookup
is O(1) on average instead of O(log n), but iterating it hands them back in
**no specified order at all** — not sorted, not insertion, and not necessarily
the same order twice. The standard does not promise one, so a program that
prints an `unordered_map` by walking it is a program whose output depends on
the library it was built against. The starter does exactly that, and it even
passes the cases with only one distinct name — which is the tell: a test that
cannot tell the orders apart is not evidence the order is right.

Keep the two jobs in two containers: a `std::vector<std::string>` remembers
the order a name was first seen, and a `std::unordered_map<std::string, long
long>` counts. Walk the vector to print.
'''
starter     = '''
#include <iostream>
#include <string>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::unordered_map<std::string, long long> count;
    for (int i = 0; i < n; ++i) {
        std::string name;
        std::cin >> name;
        ++count[name];
    }

    // Walking the hash table. The names come out in whatever order its
    // buckets happen to be in, which is not the order they arrived.
    for (const auto& [name, c] : count) {
        std::cout << name << ' ' << c << '\n';
    }
    std::cout << "DISTINCT " << count.size() << '\n';
}
'''
solution    = '''
#include <iostream>
#include <string>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;

    std::vector<std::string> order;
    std::unordered_map<std::string, long long> count;
    for (int i = 0; i < n; ++i) {
        std::string name;
        std::cin >> name;
        // The insert happens once per distinct name: `count[name]` default
        // constructs to 0, so a fresh name is exactly the one whose count
        // was 0 before the increment.
        if (count[name]++ == 0) order.push_back(name);
    }

    for (const std::string& name : order) {
        std::cout << name << ' ' << count[name] << '\n';
    }
    std::cout << "DISTINCT " << order.size() << '\n';
}
'''
