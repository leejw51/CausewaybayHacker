[[quest]]
id          = "cpp.basic.03.getline"
node        = 3
title       = "THE SAMPAN LOG"
difficulty  = 2
story       = "The typhoon shelter's harbour master logs every sampan as one line: its name, then whatever it landed, however many numbers that turns out to be."
concepts    = ["io", "strings", "iteration"]
requires    = ["cpp.basic.02.bindings"]
map          = { x = 0.389, y = 0.132, kind = "quest" }
brief       = '''
Line one is a count `n`. Each of the next `n` lines is a boat name followed by
zero or more integers, separated by spaces.

Print one line per boat as `<NAME> <how many numbers> <their sum>`, then
`BOATS <n>`.

```
input:  2
        KWAN 3 4 5
        LEE
output: KWAN 3 12
        LEE 0 0
        BOATS 2
```

The line is the unit here, not the token. `std::cin >> x` stops at whitespace
and does not care about newlines, so it cannot tell you where one boat ends
and the next begins. `std::getline` gives you the whole line; an
`std::istringstream` over that line then gives you `>>` again, but only within
it.

One thing bites everyone once: after `std::cin >> n` the newline at the end of
that first line is still waiting in the stream, and the first `getline` reads
it as an empty line.
'''
starter     = '''
#include <iostream>
#include <sstream>
#include <string>

int main() {
    int n = 0;
    std::cin >> n;

    for (int i = 0; i < n; ++i) {
        std::string line;
        // read one whole line, split it with an istringstream,
        // print <NAME> <count> <sum>
    }
    std::cout << "BOATS " << n << '\n';
}
'''
solution    = '''
#include <iostream>
#include <sstream>
#include <string>

int main() {
    int n = 0;
    std::cin >> n;
    // consume the rest of the first line, or the first getline gets ""
    std::string rest;
    std::getline(std::cin, rest);

    for (int i = 0; i < n; ++i) {
        std::string line;
        std::getline(std::cin, line);

        std::istringstream fields(line);
        std::string name;
        fields >> name;

        long long value = 0;
        long long count = 0;
        long long sum = 0;
        while (fields >> value) {
            ++count;
            sum += value;
        }
        std::cout << name << ' ' << count << ' ' << sum << '\n';
    }
    std::cout << "BOATS " << n << '\n';
}
'''
hints = [
  "One std::getline(std::cin, junk) after reading n throws away the newline that >> left behind.",
  "std::istringstream fields(line); fields >> name; then while (fields >> value) walks the rest — the loop ends when there is nothing left to parse.",
  "The name is the first token of the line, and a line with only a name gives 0 0, no special case needed.",
]

