[[quest]]
id          = "cpp.basic.04.strings"
node        = 7
title       = "THE SAMPAN'S NAME"
difficulty  = 1
story       = "A sampan's name is painted on the bow in capitals and on the stern back to front, and the harbour master's log has it in neither."
