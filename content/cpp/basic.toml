# ---------------------------------------------------------------- 18  BOSS
[[quest]]
id          = "cpp.basic.18.segfault"
node        = 19
title       = "SEGFAULT"
difficulty  = 4
story       = "12:00:00. The Noon Day Gun fires at an address nobody owns, and the whole waterfront goes quiet."
concepts    = ["pointers", "undefined-behaviour", "slices", "error-handling"]
requires    = ["cpp.basic.17.raii", "cpp.basic.04.references"]
map          = { x = 0.949, y = 0.868, kind = "boss" }
brief       = '''
Line one is `n`. The next `n` lines are the firing table, `<NAME> <SECONDS>`.
Then a line `q`, and `q` names to look up.

For each name print `<NAME> FIRES AT <seconds>` or `<NAME> UNKNOWN`. Then
print `LOADED <n> CHECKSUM <sum of every SECONDS in the table>`.

```
input:  2
        GUN 3
        HORN 7
        3
        GUN
        BELL
        HORN
output: GUN FIRES AT 3
        BELL UNKNOWN
        HORN FIRES AT 7
        LOADED 2 CHECKSUM 10
```

The starter compiles cleanly and crashes twice, for two different reasons, and
you have to find both.

The first is the checksum loop. It walks `1..n` and reads `table.at(i)`, and
`at` **checks**: index `n` is one past the end, so it throws
`std::out_of_range`, nothing catches it, and the process aborts. Fix the loop.
Then understand what `at` bought you: the same loop written with `table[i]`
would not have thrown. It would have read whatever happened to be at that
address — the next object on the heap, or nothing — and printed a checksum
that was wrong by an amount nobody could reproduce. `[]` on a vector does not
check. That is the deal in this land: it is fast, and it is your job.

The second is `lookup`. It returns a `Shell*`, and when the name is not in the
table it returns `nullptr` — and the caller writes `->seconds` on it without
looking. Reading through a null pointer is undefined behaviour; on every
machine this runs on it is also a segmentation fault, which is the kindest
form undefined behaviour takes, because at least it stops. Test the pointer.
That is the whole boss, and it is the question every C++ interview is really
asking: *what is at that address right now, and who said you could read it?*
'''
starter     = '''
#include <iostream>
#include <string>
#include <vector>

struct Shell {
    std::string name;
    long long seconds;
};

// the address of the matching shell, or nullptr if there is none
Shell* lookup(std::vector<Shell>& table, const std::string& name) {
    for (Shell& shell : table) {
        if (shell.name == name) {
            return &shell;
        }
    }
    return nullptr;
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<Shell> table;
    for (int i = 0; i < n; ++i) {
        Shell shell;
        std::cin >> shell.name >> shell.seconds;
        table.push_back(shell);
    }

    int q = 0;
    std::cin >> q;
    for (int i = 0; i < q; ++i) {
        std::string name;
        std::cin >> name;
        // follows the pointer without asking whether there is anything there
        std::cout << name << " FIRES AT " << lookup(table, name)->seconds << '\n';
    }

    // one past the end: at() throws, [] would have read garbage
    long long checksum = 0;
    for (std::size_t i = 1; i <= table.size(); ++i) {
        checksum += table.at(i).seconds;
    }
    std::cout << "LOADED " << n << " CHECKSUM " << checksum << '\n';
}
'''
solution    = '''
#include <iostream>
#include <string>
#include <vector>

struct Shell {
    std::string name;
    long long seconds;
};

// the address of the matching shell, or nullptr if there is none
Shell* lookup(std::vector<Shell>& table, const std::string& name) {
    for (Shell& shell : table) {
        if (shell.name == name) {
            return &shell;
        }
    }
    return nullptr;
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<Shell> table;
    for (int i = 0; i < n; ++i) {
        Shell shell;
        std::cin >> shell.name >> shell.seconds;
        table.push_back(shell);
    }

    int q = 0;
    std::cin >> q;
    for (int i = 0; i < q; ++i) {
        std::string name;
        std::cin >> name;
        // a pointer that may be null is tested before it is followed, every time
        if (Shell* shell = lookup(table, name)) {
            std::cout << name << " FIRES AT " << shell->seconds << '\n';
        } else {
            std::cout << name << " UNKNOWN\n";
        }
    }

    // 0..size-1 is the whole vector; size is one past the end
    long long checksum = 0;
    for (std::size_t i = 0; i < table.size(); ++i) {
        checksum += table[i].seconds;
    }
    std::cout << "LOADED " << n << " CHECKSUM " << checksum << '\n';
}
'''
hints = [
  "Bind the lookup result to a name and test it: if (Shell* shell = lookup(...)) { ... } else { UNKNOWN }. The pointer is the answer and the question at once.",
  "Valid indices run from 0 to size() - 1. The loop that starts at 1 and runs to size() is off by one at both ends, and only the top end crashes.",
  "at() throws std::out_of_range and [] does not check at all; the crash you got is the good outcome. The one you did not get is the boss.",
  "A segmentation fault is the OS refusing a read of an address the process does not own. Address 0 is always one of those, which is why nullptr crashes reliably and a stale pointer into freed memory does not.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",   stdin = "2\nGUN 3\nHORN 7\n3\nGUN\nBELL\nHORN\n", expect = "GUN FIRES AT 3\nBELL UNKNOWN\nHORN FIRES AT 7\nLOADED 2 CHECKSUM 10\n", visible = true },
  { name = "empty",    stdin = "0\n1\nGUN\n",                            expect = "GUN UNKNOWN\nLOADED 0 CHECKSUM 0\n",                                   visible = false },
  { name = "twice",    stdin = "1\nGUN 12\n2\nGUN\nGUN\n",               expect = "GUN FIRES AT 12\nGUN FIRES AT 12\nLOADED 1 CHECKSUM 12\n",             visible = false },
  { name = "no-query", stdin = "3\nA 1\nB 2\nC 3\n0\n",                  expect = "LOADED 3 CHECKSUM 6\n",                                                visible = false },
]
