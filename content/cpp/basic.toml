[[quest]]
id          = "cpp.basic.11.algorithms"
node        = 12
title       = "ONE PASS DOWN THE SLIPWAY"
difficulty  = 4
story       = "The winch log is a column of loads. Alex says three for loops. Mei says the standard library already wrote them."
concepts    = ["iteration", "closures", "sorting"]
requires    = ["cpp.basic.10.set-and-pair"]
map          = { x = 0.222, y = 0.514, kind = "quest" }
brief       = '''
Standard input is one line of integers separated by spaces.

Print four lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are
4. `FIRST_BIG <i>` — the 0-based index of the first value greater than `10`,
   or `-1`

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
        FIRST_BIG 4
```

Use `<algorithm>` and `<numeric>`, not index loops: `std::accumulate` with a
lambda for line one, `std::copy_if` and `std::transform` for line two,
`std::sort` then `std::unique` for line three, `std::find_if` for line four.
Every one of them takes an iterator pair and, where it needs a decision, a
lambda. The point is not that the loop is hard to write; it is that the name
says what the loop is for.
'''
starter     = '''
#include <algorithm>
#include <iostream>
#include <numeric>
#include <vector>

int main() {
    std::vector<long long> nums;
    long long v = 0;
    while (std::cin >> v) {
        nums.push_back(v);
    }

    // 1. accumulate the even ones
    // 2. copy_if the ones over 10, transform them doubled, print or "-"
    // 3. sort + unique for the distinct count
    // 4. find_if for the first over 10
    (void)nums;
    std::cout << "0\n-\n0\nFIRST_BIG -1\n";
}
'''
solution    = '''
#include <algorithm>
#include <iostream>
#include <iterator>
#include <numeric>
#include <vector>

int main() {
    std::vector<long long> nums;
    long long v = 0;
    while (std::cin >> v) {
        nums.push_back(v);
    }

    // 1. the lambda is the "add this one only if" rule
    long long even_sum = std::accumulate(nums.begin(), nums.end(), 0LL,
        [](long long acc, long long x) { return x % 2 == 0 ? acc + x : acc; });
    std::cout << even_sum << '\n';

    // 2. select, then map
    std::vector<long long> big;
    std::copy_if(nums.begin(), nums.end(), std::back_inserter(big),
        [](long long x) { return x > 10; });
    std::transform(big.begin(), big.end(), big.begin(),
        [](long long x) { return x * 2; });
    if (big.empty()) {
        std::cout << "-\n";
    } else {
        for (std::size_t i = 0; i < big.size(); ++i) {
            std::cout << (i ? " " : "") << big[i];
        }
        std::cout << '\n';
    }

    // 3. unique only removes adjacent duplicates, so sort first
    std::vector<long long> sorted = nums;
    std::sort(sorted.begin(), sorted.end());
    auto last = std::unique(sorted.begin(), sorted.end());
    std::cout << last - sorted.begin() << '\n';

    // 4. find_if returns end() when nothing matches
    auto hit = std::find_if(nums.begin(), nums.end(),
        [](long long x) { return x > 10; });
    std::cout << "FIRST_BIG " << (hit == nums.end() ? -1 : hit - nums.begin()) << '\n';
}
'''
