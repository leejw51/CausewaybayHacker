  "std::unique moves the duplicates to the end and returns an iterator to where they start; the distance from begin() is the distinct count. It only sees adjacent duplicates, so sort a copy first.",
  "find_if hands back end() on a miss, and iterator minus begin() is the index on a hit.",
]

