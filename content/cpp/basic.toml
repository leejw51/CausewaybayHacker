[[quest]]
id          = "cpp.basic.06.strings"
node        = 6
title       = "BYTES ARE NOT LETTERS"
difficulty  = 2
story       = "The typhoon shelter noticeboard truncates 銅鑼灣 at three bytes and gets one character."
concepts    = ["strings", "iteration", "types"]
requires    = ["cpp.basic.05.vector"]
map          = { x = 0.962, y = 0.054, kind = "quest" }
brief       = '''
Read one line. Print three lines:

1. its length in **bytes**
2. its length in **characters** — UTF-8 code points
3. the line with its characters reversed

```
input:  causeway
output: 8
        8
        yawesuac
```

The line may contain characters outside ASCII, and then the first two numbers
are not the same. `std::string::size()` is bytes. It always was. `std::string`
knows nothing about encodings; it is a sequence of `char`, and a `char` is a
byte.

UTF-8 is easy to count without decoding it: every code point starts with a
byte that is **not** of the form `10xxxxxx`, and every continuation byte is.
So a byte `c` begins a character exactly when `(c & 0xC0) != 0x80`. Reverse
the characters, not the bytes — `std::reverse` on the string itself would cut
`銅` into three pieces and print them backwards.
'''
starter     = '''
#include <algorithm>
#include <iostream>
#include <string>

int main() {
    std::string line;
    std::getline(std::cin, line);

    std::cout << line.size() << '\n';
    // this is the byte count again, not the character count
    std::cout << line.size() << '\n';
    // reverse the characters, not the bytes: std::reverse on the string
    // itself would cut a three-byte character into three broken bytes
    std::cout << line << '\n';
}
'''
solution    = '''
#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

// true for the first byte of a UTF-8 sequence, false for a continuation byte
bool starts_char(unsigned char c) {
    return (c & 0xC0) != 0x80;
}

int main() {
    std::string line;
    std::getline(std::cin, line);

    std::cout << line.size() << '\n';

    // cut the string into one std::string per character
    std::vector<std::string> chars;
    for (unsigned char c : line) {
        if (starts_char(c)) {
            chars.emplace_back(1, static_cast<char>(c));
        } else {
            chars.back().push_back(static_cast<char>(c));
        }
    }
    std::cout << chars.size() << '\n';

    std::reverse(chars.begin(), chars.end());
    std::string reversed;
    for (const std::string& ch : chars) {
        reversed += ch;
    }
    std::cout << reversed << '\n';
}
'''
hints = [
  "Loop over the bytes as unsigned char; a plain char may be signed, and then the bit test on anything above 0x7F goes wrong.",
  "Collect each character as its own small std::string, reverse the vector of them, and join.",
  "Counting the bytes for which (c & 0xC0) != 0x80 is the character count without decoding anything.",
]

