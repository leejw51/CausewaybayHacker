'''
solution    = '''
#include <iostream>
#include <sstream>
#include <string>
#include <vector>

int main() {
    std::string line;
    std::getline(std::cin, line);
    std::istringstream in(line);
    std::vector<long long> v;
    long long x = 0;
    while (in >> x) v.push_back(x);

    std::vector<long long> part(v.begin() + 1, v.begin() + 3);
    part.insert(part.end(), v.begin(), v.end());

    for (size_t i = 0; i < part.size(); ++i) {
        std::cout << part[i] << (i + 1 < part.size() ? ' ' : '\n');
    }
}
