[[quest]]
id          = "cpp.basic.16.iterators"
node        = 17
title       = "YOUR OWN FOR LOOP"
difficulty  = 3
story       = "The pump room's gauge ticks through every reading from the start to the end of the shift and stores none of them anywhere."
concepts    = ["iteration", "structs", "functions"]
requires    = ["cpp.basic.15.exceptions"]
map          = { x = 0.619, y = 0.868, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Give `Stops` an iterator so that a range-`for` over it yields `count` values
beginning at `start` and advancing by `step`. Print each on its own line, then
`SUM <total>` computed by `std::accumulate` over the same `begin()`/`end()`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

The starter does not compile: a range-`for` is rewritten by the compiler into
a call to `begin()` and `end()`, and `Stops` has neither. There is no trait to
inherit from and no interface to declare; the loop asks for three things by
name — `operator*`, prefix `operator++`, `operator!=` — on whatever `begin()`
returns, and if they are there, it works. That is the entire contract, and it
is the same contract `std::accumulate` and every other algorithm use.
'''
starter     = '''
#include <iostream>
#include <numeric>

struct Stops {
    long long start;
    long long step;
    long long count;

    // an iterator type, and begin() / end() that return it
};

int main() {
    long long start = 0, step = 0, count = 0;
    std::cin >> start >> step >> count;

    Stops stops{start, step, count};
    for (long long value : stops) {
        std::cout << value << '\n';
    }
    std::cout << "SUM " << std::accumulate(stops.begin(), stops.end(), 0LL) << '\n';
}
'''
solution    = '''
#include <iostream>
#include <numeric>

struct Stops {
    long long start;
    long long step;
    long long count;

    struct iterator {
        long long value;
        long long step;
        long long left;

        long long operator*() const { return value; }

        iterator& operator++() {
            value += step;
            --left;
            return *this;
        }

        bool operator!=(const iterator& other) const { return left != other.left; }
        bool operator==(const iterator& other) const { return left == other.left; }
    };

    iterator begin() const { return iterator{start, step, count}; }
    iterator end() const { return iterator{start, step, 0}; }
};

int main() {
    long long start = 0, step = 0, count = 0;
    std::cin >> start >> step >> count;

    Stops stops{start, step, count};
    for (long long value : stops) {
        std::cout << value << '\n';
    }
    std::cout << "SUM " << std::accumulate(stops.begin(), stops.end(), 0LL) << '\n';
}
'''
hints = [
  "The iterator is a small struct of its own: the current value, the step, and how many are left.",
  "end() is the iterator with nothing left; operator!= compares only the countdown, so the value inside end() does not matter.",
  "std::accumulate walks the same three operators the for loop does — once begin()/end() exist, both work without another line.",
]

