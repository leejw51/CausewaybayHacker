  { name = "negative", stdin = "2\n-5 -6\n",       expect = "LOADED 2\nTOTAL -11\nFIRST -5\n",  visible = false },
  { name = "single",   stdin = "1\n42\n",          expect = "LOADED 1\nTOTAL 42\nFIRST 42\n",   visible = false },
