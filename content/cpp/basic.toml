#include <algorithm>
#include <iostream>
#include <map>
#include <string>
#include <vector>

int main() {
    std::map<std::string, long long> counts;

    std::string word;
    while (std::cin >> word) {
        counts[word]++;
    }

    std::vector<std::pair<std::string, long long>> rows(counts.begin(), counts.end());
    std::sort(rows.begin(), rows.end(), [](const auto& a, const auto& b) {
        if (a.second != b.second) {
