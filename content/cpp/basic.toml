brief       = '''
Print exactly:

```
hello, causewaybay
```

Lowercase, one comma, one space, one line. Nothing else.

`std::cout` lives in `<iostream>`, and `'\n'` is the newline. `std::endl` also
works and also flushes, which you do not need here and will not want later.
'''
starter     = '''
#include <iostream>

int main() {
    // your code here
    // ANSWER: std::cout << "hello, causewaybay\n";
