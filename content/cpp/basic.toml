[[quest]]
id          = "cpp.basic.05.vector"
node        = 5
title       = "THE MIDDLE OF THE RAFT"
difficulty  = 2
story       = "Forty sampans rafted up in the typhoon shelter. The harbour master can see the outermost and the innermost and nothing in between."
concepts    = ["slices", "iteration", "control-flow"]
requires    = ["cpp.basic.04.references"]
map          = { x = 0.716, y = 0.137, kind = "quest" }
brief       = '''
Standard input is a count `n` on the first line and then `n` integers on the
second, separated by spaces. `n` is at least `1`.

Print three lines: the first value, the last value, and the sum of everything
strictly between them. With fewer than three values that sum is `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

`std::vector` is the sequence. `front()` and `back()` are the ends;
`begin() + 1` to `end() - 1` is the middle, and `std::accumulate` over that
range is the sum — as long as the starting value you hand it is a
`long long`. `std::accumulate(first, last, 0)` sums in `int`, because `0` is
an `int`, and one of the hidden cases has a middle that does not fit.
'''
starter     = '''
#include <iostream>
#include <numeric>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    // print nums.front(), nums.back(), then the sum of the middle
    (void)nums;
}
'''
solution    = '''
#include <iostream>
#include <numeric>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::cout << nums.front() << '\n';
    std::cout << nums.back() << '\n';

    long long middle = 0;
    if (nums.size() > 2) {
        // 0LL, not 0: the type of the initial value is the type of the sum
        middle = std::accumulate(nums.begin() + 1, nums.end() - 1, 0LL);
    }
    std::cout << middle << '\n';
}
'''
hints = [
  "nums.begin() + 1 and nums.end() - 1 are iterators, and an iterator pair is how <numeric> and <algorithm> name a range.",
  "With one or two values that range is empty or backwards — guard it with an if on nums.size() before you build it.",
  "The 0LL matters: accumulate deduces its result type from the initial value, and a plain 0 is an int.",
]

