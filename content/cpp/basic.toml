solution    = '''
#include <algorithm>
#include <iostream>
#include <sstream>
#include <string>

struct Node {
    long long val;
    Node* left = nullptr;
    Node* right = nullptr;
};

Node* insert(Node* n, long long v) {
    if (!n) return new Node{v};
    if (v < n->val) {
        n->left = insert(n->left, v);
    } else {
        n->right = insert(n->right, v);
    }
    return n;
}

void inorder(const Node* n) {
    if (!n) return;
    inorder(n->left);
    std::cout << n->val << ' ';
    inorder(n->right);
}

int height(const Node* n) {
    if (!n) return 0;
    return 1 + std::max(height(n->left), height(n->right));
}

int main() {
    std::string line;
    std::getline(std::cin, line);
    std::istringstream in(line);
    Node* root = nullptr;
    long long x = 0;
    while (in >> x) root = insert(root, x);

    inorder(root);
    std::cout << '\n' << height(root) << '\n';
}
'''
