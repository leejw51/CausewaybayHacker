brief       = '''
A `std::string` knows its own length (`size()`), can be walked with
`<algorithm>`, and can be built from any pair of iterators. `std::transform`
applies a function to every character and writes the result back;
`::toupper` from `<cctype>` is the function. `rbegin()` and `rend()` walk
the string backwards, so a string built from them is the reverse.

```
std::transform(upper.begin(), upper.end(), upper.begin(), ::toupper);
std::string rev(line.rbegin(), line.rend());
```

`upper` is a copy of the line and `rev` is a placeholder. Type those two
lines at `// FILL`, replacing the placeholder `rev`.

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
starter     = '''
#include <algorithm>
#include <cctype>
#include <iostream>
#include <string>

int main() {
    std::string line;
    std::getline(std::cin, line);

    std::string upper = line;
    // FILL: upper-case every character of upper, in place
    // ANSWER: std::transform(upper.begin(), upper.end(), upper.begin(), ::toupper);
    std::string rev = line;  // FILL: build rev from line's rbegin() and rend() instead
    // ANSWER: std::string rev(line.rbegin(), line.rend());

    std::cout << line.size() << '\n';
    std::cout << upper << '\n';
    std::cout << rev << '\n';
}
'''
solution    = '''
#include <algorithm>
#include <cctype>
#include <iostream>
#include <string>

int main() {
    std::string line;
    std::getline(std::cin, line);

    std::string upper = line;
    std::transform(upper.begin(), upper.end(), upper.begin(), ::toupper);
    std::string rev(line.rbegin(), line.rend());

    std::cout << line.size() << '\n';
    std::cout << upper << '\n';
    std::cout << rev << '\n';
}
'''
