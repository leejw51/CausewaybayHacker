[[quest]]
id          = "cpp.basic.15.exceptions"
node        = 16
title       = "AN ERROR OF YOUR OWN"
difficulty  = 3
story       = "Four layers of the mooring fee service each throw something different and nothing above them catches any of it."
concepts    = ["error-handling", "panics", "structs"]
requires    = ["cpp.basic.14.optional-variant"]
map          = { x = 0.391, y = 0.950, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each meant to be a distance in
km.

`fare(text)` parses with `std::stoll` — which **throws**
`std::invalid_argument` on `xx` — and rejects a negative distance by throwing
your own `NegativeDistance`, a class derived from `std::runtime_error` whose
`what()` reads `negative distance: <km>`. Otherwise it returns
`500 + 100 * km`.

Print one line per input line: the fare, or `not a number` when it does not
parse, or the `NegativeDistance`'s `what()` when the distance is negative.
Then print `ERRORS <k>`, how many lines failed.

The parse failure prints your words and not the exception's, because
`std::invalid_argument::what()` is whatever the library felt like saying —
`stoll` on libstdc++, `stoll: no conversion` on libc++ — and an expected
output cannot depend on that.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative distance: -2
        ERRORS 2
```

The starter compiles and dies on `xx`: an exception nobody catches reaches the
top of `main` and the runtime calls `std::terminate`, which is the abort you
see. A `try` block with two `catch` arms fixes it — the more specific type
first, because arms are tried in order and `std::runtime_error` would swallow
`NegativeDistance` if it came first. Catch by `const&`, always: catching by
value slices a derived exception down to its base and loses the message you
threw.
'''
starter     = '''
#include <iostream>
#include <stdexcept>
#include <string>

struct NegativeDistance : std::runtime_error {
    explicit NegativeDistance(long long km)
        : std::runtime_error("negative distance: " + std::to_string(km)) {}
};

long long fare(const std::string& text) {
    long long km = std::stoll(text);
    if (km < 0) {
        throw NegativeDistance(km);
    }
    return 500 + 100 * km;
}

int main() {
    int n = 0;
    std::cin >> n;

    int errors = 0;
    for (int i = 0; i < n; ++i) {
        std::string text;
        std::cin >> text;
        // nothing catches what fare throws
        std::cout << fare(text) << '\n';
    }
    std::cout << "ERRORS " << errors << '\n';
}
'''
solution    = '''
#include <iostream>
#include <stdexcept>
#include <string>

struct NegativeDistance : std::runtime_error {
    explicit NegativeDistance(long long km)
        : std::runtime_error("negative distance: " + std::to_string(km)) {}
};

long long fare(const std::string& text) {
    long long km = std::stoll(text);  // throws std::invalid_argument on junk
    if (km < 0) {
        throw NegativeDistance(km);
    }
    return 500 + 100 * km;
}

int main() {
    int n = 0;
    std::cin >> n;

    int errors = 0;
    for (int i = 0; i < n; ++i) {
        std::string text;
        std::cin >> text;
        try {
            std::cout << fare(text) << '\n';
        } catch (const NegativeDistance& e) {
            // the derived type first, or the arm below takes it
            ++errors;
            std::cout << e.what() << '\n';
        } catch (const std::invalid_argument&) {
            ++errors;
            std::cout << "not a number\n";
        }
    }
    std::cout << "ERRORS " << errors << '\n';
}
'''
hints = [
  "Wrap the call in try { ... } and add catch (const NegativeDistance& e) then catch (const std::invalid_argument&) — in that order.",
  "e.what() is the message you built in the constructor; std::runtime_error stores it for you.",
  "Uncaught exceptions call std::terminate, which aborts the process with no output flushed beyond what already went out. That is what the starter does on line two.",
]

