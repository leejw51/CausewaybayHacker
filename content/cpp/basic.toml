iterators — `begin() + 1` up to but not including `begin() + 3` — and it
is a **copy** (`std::span` from `<span>` is the view that does not copy).
`insert(where, first, last)` appends a whole range when `where` is `end()`.

```
std::vector<long long> part(v.begin() + 1, v.begin() + 3);
part.insert(part.end(), v.begin(), v.end());
```

`v` holds the line's integers (at least three). Type those two lines at
`// FILL`, replacing the placeholder `part`.

```
input:  1 2 3 4
output: 2 3 1 2 3 4
```
'''
