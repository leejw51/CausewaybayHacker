[[quest]]
id          = "cpp.basic.17.raii"
node        = 18
title       = "IT CLEANS UP AFTER ITSELF"
difficulty  = 3
story       = "The pump room logbook closes itself when the shift ends, in the right order, whether or not anyone remembered to."
concepts    = ["raii", "structs", "functions"]
requires    = ["cpp.basic.16.iterators"]
map          = { x = 0.719, y = 0.950, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Declare two `Guard` values at the **top** of `main`, named `first` and
`second`, whose destructor prints `DROP <name>`. Inside a nested block, feed
the values into a `Tally` whose destructor prints `TALLY <count> <sum>`. After
the block print `DONE`. Nothing else is printed by `main` itself.

```
input:  3
        1 2 3
output: TALLY 3 6
        DONE
        DROP second
        DROP first
```

Every line but `DONE` is printed by a destructor. `Tally` dies at the closing
brace of its block, so `TALLY` comes before `DONE`; the two guards die when
`main` returns, in **reverse** declaration order, so `second` goes before
`first`. None of it is scheduled by you. It is scheduled by scope.

That is RAII, and the name is worse than the idea: a resource is tied to an
object's lifetime, and the destructor is the release. `std::lock_guard`
unlocks this way, `std::unique_ptr` frees this way, `std::ofstream` closes
this way, and an early `return` or a thrown exception runs every one of them
exactly the same. You will meet all three in the next map.
'''
starter     = '''
#include <iostream>
#include <string>

struct Guard {
    std::string name;
    // needs a destructor that prints DROP <name>
};

struct Tally {
    long long count = 0;
    long long sum = 0;

    void add(long long v) {
        ++count;
        sum += v;
    }
    // needs a destructor that prints TALLY <count> <sum>
};

int main() {
    Guard first{"first"};
    Guard second{"second"};

    int n = 0;
    std::cin >> n;
    {
        Tally tally;
        for (int i = 0; i < n; ++i) {
            long long v = 0;
            std::cin >> v;
            tally.add(v);
        }
    }
    std::cout << "DONE\n";
}
'''
solution    = '''
#include <iostream>
#include <string>

struct Guard {
    std::string name;

    ~Guard() {
        std::cout << "DROP " << name << '\n';
    }
};

struct Tally {
    long long count = 0;
    long long sum = 0;

    void add(long long v) {
        ++count;
        sum += v;
    }

    // runs at the closing brace of whatever block owns the Tally
    ~Tally() {
        std::cout << "TALLY " << count << ' ' << sum << '\n';
    }
};

int main() {
    Guard first{"first"};
    Guard second{"second"};

    int n = 0;
    std::cin >> n;
    {
        Tally tally;
        for (int i = 0; i < n; ++i) {
            long long v = 0;
            std::cin >> v;
            tally.add(v);
        }
    }
    std::cout << "DONE\n";
}
'''
hints = [
  "A destructor is ~Guard() { ... } — no return type, no parameters, and you never call it; the scope does.",
  "The inner braces are the whole reason TALLY prints before DONE. Remove them and it prints after.",
  "Destruction is reverse construction, always, which is why second goes first and why a lock taken second is released first.",
]

