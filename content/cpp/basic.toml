[[quest]]
id          = "cpp.basic.04.int-types"
node        = 4
title       = "THE REGISTER WIDTHS"
difficulty  = 1
story       = "The gun's firing register is 32 bits wide and the harbour clock's is 64; a count copied from one to the other keeps its value only if somebody says so."
