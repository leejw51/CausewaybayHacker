# C++ LAND — BASIC. Noon on the waterfront: the Noon Day Gun, the typhoon
# shelter, the Yacht Club slipway. The grammar road, and grammar practice
# only: every node explains one construct, shows how it is written, and
# hands over a whole program with a hole of one or two lines in it. The
# player types the idiom; nothing here is a problem to solve, and nothing
# here is timed.
#
# The topics, in order: printing, bindings, types and conversion, integer
# widths, a 32-byte integer, double and float, strings, string slices,
# vector slices, byte slices (each: slice, copy, append), loops, functions,
# structs, enum class, vector, std::list, map, unordered_map, set, stack and
# queue, sorting, reverse, sorting by a key, lambdas that capture, lambdas in
# <algorithm>, threads, and a binary search tree for the boss — the first
# time on this road that a pointer points at nothing.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5), with the same
# line the runner uses: c++ -std=c++20 -O2 -pthread. verify_pack also
# holds every basic solution to BASIC_MAX_ADDED lines over its starter.

pack = "cpp.basic"
land = "cpp"
category = "basic"
version = 2

