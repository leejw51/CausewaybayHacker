[[quest]]
id           = "cpp.hacker.04.grid"
node         = 4
title        = "OUT OF THE BUILDING"
difficulty   = 5
time_limit_s = 1200
story        = "A floor plan on the whiteboard, a fire door at the far corner, and the interviewer watching the clock rather than the marker."
concepts     = ["graphs", "stacks-queues", "complexity"]
requires     = ["cpp.hacker.03.intervals"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one.
'''
starter      = '''
#include <deque>
#include <iostream>
#include <string>
#include <vector>

int main() {
    int rows = 0;
    int cols = 0;
    std::cin >> rows >> cols;
    std::vector<std::string> grid(rows);
    for (std::string& row : grid) {
        std::cin >> row;
    }

    std::deque<std::pair<int, int>> queue;
    (void)queue;

    // print the shortest step count or -1, then REACHED <k>
    std::cout << "-1\nREACHED 0\n";
}
'''
solution     = '''
#include <deque>
#include <iostream>
#include <string>
#include <vector>

int main() {
    int rows = 0;
    int cols = 0;
    std::cin >> rows >> cols;
    std::vector<std::string> grid(rows);
    for (std::string& row : grid) {
        std::cin >> row;
    }

    // the distance grid doubles as the visited set: -1 means not seen yet
    std::vector<std::vector<int>> dist(rows, std::vector<int>(cols, -1));
    std::deque<std::pair<int, int>> queue;
    int reached = 0;

    if (grid[0][0] == '.') {
        dist[0][0] = 0;
        queue.emplace_back(0, 0);
        reached = 1;
    }

    const int dr[4] = {-1, 1, 0, 0};
    const int dc[4] = {0, 0, -1, 1};

    while (!queue.empty()) {
        auto [r, c] = queue.front();
        queue.pop_front();
        for (int k = 0; k < 4; ++k) {
            int nr = r + dr[k];
            int nc = c + dc[k];
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) {
                continue;
            }
            if (grid[nr][nc] != '.' || dist[nr][nc] >= 0) {
                continue;
            }
            dist[nr][nc] = dist[r][c] + 1;
            ++reached;
            queue.emplace_back(nr, nc);
        }
    }

    std::cout << dist[rows - 1][cols - 1] << '\n';
    std::cout << "REACHED " << reached << '\n';
}
'''
hints = [
  "A std::deque used as a queue — push_back, pop_front — is the whole difference between BFS and DFS here.",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
  "Two small arrays of the four offsets beat four copies of the body. Do the bounds check in int before you index: rows and cols are ints here on purpose, so r - 1 at r == 0 is -1 and not a wrapped size_t.",
]

