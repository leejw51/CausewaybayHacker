brief        = '''
Line one is `cap q`. The next `q` lines are `PUT <key> <value>` or
`GET <key>`.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The textbook answer is a hash map into a **doubly linked list**, and C++ has
the real thing: `std::list`, whose iterators stay valid when other elements
are inserted, erased or spliced — the one guarantee `std::vector` cannot
make, and the whole reason the map can hold a `std::list::iterator` as its
value. `push_front`, `splice` to the front, `back` and `pop_back` are all
O(1), so every operation here is O(1) and you can say so without hedging.

Two things to get right that the Rust interview did not ask of you. The list
node holds the key **as well as** the value, because eviction starts from the
list and has to know which map entry to erase. And the order of the two
erases matters: read the key out of `back()` first, erase it from the map,
*then* `pop_back` — the other way round is a read through an iterator to a
node that no longer exists, and that is the thing this land has been about
since the Noon Day Gun.

The cases here are small and the clock is not measuring speed: four operations
cannot tell a `std::list` apart from a `std::vector` you scan from the front.
The `O(1)` in the paragraph above is the sentence you say out loud in the
room, so it has to be true of the code you wrote rather than of the code that
happened to clear four cases.
'''
starter      = '''
