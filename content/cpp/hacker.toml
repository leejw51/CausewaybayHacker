solution     = '''
#include <algorithm>
#include <cstdint>
#include <iostream>
#include <limits>
#include <vector>

const long long P = 1000000007LL;

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

int main() {
    std::size_t rows = 0;
    std::size_t cols = 0;
    std::uint64_t pct = 0;
    std::uint64_t seed = 0;
    std::cin >> rows >> cols >> pct >> seed;

    Rng rng{seed};
    std::vector<std::vector<bool>> open(rows, std::vector<bool>(cols, true));
    std::vector<std::vector<long long>> cost(rows, std::vector<long long>(cols, 0));
    for (std::size_t i = 0; i < rows; ++i) {
        for (std::size_t j = 0; j < cols; ++j) {
            std::uint64_t a = rng.next();
            std::uint64_t b = rng.next();
            bool corner = (i == 0 && j == 0) || (i == rows - 1 && j == cols - 1);
            if (!corner && a % 100 < pct) {
                open[i][j] = false;
            }
            cost[i][j] = static_cast<long long>(b % 9 + 1);
        }
    }

    const long long INF = std::numeric_limits<long long>::max();
    std::vector<std::vector<long long>> ways(rows, std::vector<long long>(cols, 0));
    std::vector<std::vector<long long>> best(rows, std::vector<long long>(cols, INF));

    for (std::size_t i = 0; i < rows; ++i) {
        for (std::size_t j = 0; j < cols; ++j) {
            if (!open[i][j]) {
                continue;
            }
            if (i == 0 && j == 0) {
                ways[0][0] = 1;
                best[0][0] = cost[0][0];
                continue;
            }
            long long routes = 0;
            long long cheapest = INF;
            if (i > 0 && open[i - 1][j]) {
                routes = (routes + ways[i - 1][j]) % P;
                cheapest = std::min(cheapest, best[i - 1][j]);
            }
            if (j > 0 && open[i][j - 1]) {
                routes = (routes + ways[i][j - 1]) % P;
                cheapest = std::min(cheapest, best[i][j - 1]);
            }
            ways[i][j] = routes;
            // INF + cost would overflow, which is undefined: guard it
            best[i][j] = cheapest == INF ? INF : cheapest + cost[i][j];
        }
    }

    std::cout << "PATHS " << ways[rows - 1][cols - 1] << '\n';
    long long answer = best[rows - 1][cols - 1];
    std::cout << "MIN " << (answer == INF ? -1 : answer) << '\n';
}
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
  "An open cell with no open neighbour above or left is reachable by zero routes and has no best cost; keep INF meaning unreachable and guard the addition, because INF plus anything is signed overflow.",
  "The destination can be open and still unreachable, which is exactly when PATHS is 0 and MIN is -1. One of the hidden cases is that.",
]

