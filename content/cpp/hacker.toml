brief        = '''
Line one is `n`. The next `n` lines are `<start> <end>` with `start <= end`.

Merge every pair that overlaps or touches, and print the result in increasing
order, one `<start> <end>` per line, then `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Touching counts as overlapping: `1 4` and `4 5` merge into `1 5`.
'''
starter      = '''
#include <algorithm>
#include <iostream>
#include <utility>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<std::pair<long long, long long>> spans(n);
    for (auto& [start, end] : spans) {
        std::cin >> start >> end;
    }

    // sort, sweep, merge, print, then COUNT <k>
    std::cout << "COUNT " << spans.size() << '\n';
}
'''
solution     = '''
#include <algorithm>
#include <iostream>
#include <utility>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<std::pair<long long, long long>> spans(n);
    for (auto& [start, end] : spans) {
        std::cin >> start >> end;
    }
    std::sort(spans.begin(), spans.end());

    std::vector<std::pair<long long, long long>> merged;
    for (const auto& [start, end] : spans) {
        if (!merged.empty() && start <= merged.back().second) {
            merged.back().second = std::max(merged.back().second, end);
        } else {
            merged.emplace_back(start, end);
        }
    }

    for (const auto& [start, end] : merged) {
        std::cout << start << ' ' << end << '\n';
    }
    std::cout << "COUNT " << merged.size() << '\n';
}
'''
hints = [
  "Sort by start first — std::sort on a vector of pairs already does that. After it one left-to-right pass is enough.",
  "Extend the last merged interval when the new start is <= its end; otherwise push a new one.",
  "Extend to max(last.end, end) — a short interval swallowed by a long one must not shrink it.",
]

