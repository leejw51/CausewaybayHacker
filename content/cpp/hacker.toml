solution     = '''
#include <cstdint>
#include <iostream>
#include <utility>
#include <vector>

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

// Fenwick tree, 1-based internally. add and prefix are both O(log n).
class Fenwick {
public:
    explicit Fenwick(std::size_t n) : tree_(n + 1, 0) {}

    void add(std::size_t index, long long delta) {
        for (long long i = static_cast<long long>(index) + 1; i < static_cast<long long>(tree_.size()); i += i & -i) {
            tree_[i] += delta;  // step up by the lowest set bit
        }
    }

    long long prefix(std::size_t upto) const {
        long long sum = 0;
        for (long long i = static_cast<long long>(upto); i > 0; i -= i & -i) {
            sum += tree_[i];
        }
        return sum;
    }

    long long range(std::size_t l, std::size_t r) const {
        return prefix(r + 1) - prefix(l);
    }

private:
    std::vector<long long> tree_;
};

int main() {
    std::size_t n = 0;
    std::size_t q = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> q >> seed;

    Rng rng{seed};
    Fenwick fenwick(n);
    for (std::size_t i = 0; i < n; ++i) {
        fenwick.add(i, static_cast<long long>(rng.next() % 1000));
    }

    long long total = 0;
    std::size_t updates = 0;
    for (std::size_t k = 0; k < q; ++k) {
        std::uint64_t a = rng.next();
        std::uint64_t b = rng.next();
        std::uint64_t c = rng.next();
        if (a % 2 == 0) {
            fenwick.add(b % n, static_cast<long long>(c % 1000 + 1));
            ++updates;
        } else {
            std::size_t l = b % n;
            std::size_t r = c % n;
            if (l > r) std::swap(l, r);
            total += fenwick.range(l, r);
        }
    }

    std::cout << total << '\n';
    std::cout << "UPDATES " << updates << '\n';
}
'''
