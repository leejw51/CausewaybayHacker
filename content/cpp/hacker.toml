[[quest]]
id           = "cpp.hacker.24.inversions"
node         = 24
title        = "THE ONE THE CLOCK CATCHES"
difficulty   = 5
time_limit_s = 1500
story        = "First question of the afternoon round. The naive answer is correct, and it is the wrong answer — and in this language it is fast enough to fool a smaller test."
concepts     = ["sorting", "complexity", "recursion"]
requires     = ["cpp.hacker.23.prefix-sums"]
map          = { x = 0.666, y = 0.676, kind = "quest" }
brief        = '''
Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in `std::uint64_t` arithmetic,
which wraps by definition:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Count the **inversions**: pairs `i < j` where `a[i] > a[j]`. Print the count,
then `MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**This quest enforces its complexity, and it is the only kind that can.** The
starter is the `O(n²)` double loop, and in C++ it is a trap with a twist: at
`-O2`, with no bounds checks in the way, the compiler vectorises it, and at
`n = 200000` — the size the Rust and Go versions of this interview use — it
finishes in **1.5 s**, inside the five second run limit. So the C++ hidden
case is `n = 1000000`. There the double loop is `5 × 10^11` comparisons and
takes **38 s**. Counting inversions during a merge sort is `O(n log n)` and
takes **0.05 s**. Measured, on this machine, with these two programs.

Two other things the big case decides for you. The answer for `n = 1000000`
is `250046540838`, which does not fit in an `int` — an accumulator of the
wrong width is silently wrong, not slow. And the generator must wrap rather
than overflow: `std::uint64_t` wraps by definition, a signed `long long`
would be undefined behaviour, and the compiler would be entitled to do
anything at all with it.
'''
starter      = '''
#include <cstdint>
#include <iostream>
#include <vector>

std::vector<long long> generate(std::size_t n, std::uint64_t seed) {
    std::uint64_t x = seed;
    std::vector<long long> values;
    values.reserve(n);
    for (std::size_t i = 0; i < n; ++i) {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        values.push_back(static_cast<long long>((x >> 33) % 1000000007ULL));
    }
    return values;
}

int main() {
    std::size_t n = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> seed;

    std::vector<long long> values = generate(n, seed);
    long long max = 0;
    for (long long v : values) {
        if (v > max) max = v;
    }

    // correct, and far too slow: this is what the big hidden case rejects
    long long inversions = 0;
    for (std::size_t i = 0; i < n; ++i) {
        for (std::size_t j = i + 1; j < n; ++j) {
            if (values[i] > values[j]) {
                ++inversions;
            }
        }
    }

    std::cout << inversions << '\n';
    std::cout << "MAX " << max << '\n';
}
'''
solution     = '''
#include <cstdint>
#include <iostream>
#include <vector>

std::vector<long long> generate(std::size_t n, std::uint64_t seed) {
    std::uint64_t x = seed;
    std::vector<long long> values;
    values.reserve(n);
    for (std::size_t i = 0; i < n; ++i) {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        values.push_back(static_cast<long long>((x >> 33) % 1000000007ULL));
    }
    return values;
}

// Merge sort over values[lo, hi), returning how many inversions it removed.
long long sort_count(std::vector<long long>& values, std::vector<long long>& scratch, std::size_t lo, std::size_t hi) {
    if (hi - lo < 2) {
        return 0;
    }
    std::size_t mid = (lo + hi) / 2;
    long long inversions = sort_count(values, scratch, lo, mid) + sort_count(values, scratch, mid, hi);

    std::size_t left = lo, right = mid, out = lo;
    while (left < mid && right < hi) {
        if (values[left] <= values[right]) {
            scratch[out++] = values[left++];
        } else {
            // values[left, mid) are all greater than values[right]
            inversions += static_cast<long long>(mid - left);
            scratch[out++] = values[right++];
        }
    }
    while (left < mid) scratch[out++] = values[left++];
    while (right < hi) scratch[out++] = values[right++];
    for (std::size_t i = lo; i < hi; ++i) {
        values[i] = scratch[i];
    }
    return inversions;
}

int main() {
    std::size_t n = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> seed;

    std::vector<long long> values = generate(n, seed);
    long long max = 0;
    for (long long v : values) {
        if (v > max) max = v;
    }

    std::vector<long long> scratch(n);
    long long inversions = sort_count(values, scratch, 0, n);

    std::cout << inversions << '\n';
    std::cout << "MAX " << max << '\n';
}
'''
hints = [
  "Take the max before you sort, or sort a copy. The merge sort reorders the array under you.",
  "When the right-hand value wins the merge, every remaining element of the left half is greater than it — that is mid - left inversions in one go, and it is the whole trick.",
  "A Fenwick tree over the compressed values is the other O(n log n) answer and is worth naming in the room; merge sort is less code under a clock.",
]

