#include <cstdint>
#include <functional>
#include <iostream>
#include <limits>
#include <queue>
#include <utility>
#include <vector>

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

using Graph = std::vector<std::vector<std::pair<std::size_t, long long>>>;

Graph build(std::size_t n, std::size_t m, std::uint64_t seed) {
    Rng rng{seed};
    Graph graph(n);
    for (std::size_t i = 1; i < n; ++i) {
        std::size_t p = rng.next() % i;
        long long w = static_cast<long long>(rng.next() % 1000 + 1);
        graph[p].emplace_back(i, w);
        graph[i].emplace_back(p, w);
    }
    for (std::size_t e = n - 1; e < m; ++e) {
        std::size_t a = rng.next() % n;
        std::size_t b = rng.next() % n;
        long long w = static_cast<long long>(rng.next() % 1000 + 1);
        graph[a].emplace_back(b, w);
        graph[b].emplace_back(a, w);
    }
    return graph;
}

int main() {
    std::size_t n = 0;
    std::size_t m = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> m >> seed;

    const long long INF = std::numeric_limits<long long>::max();
    Graph graph = build(n, m, seed);
    std::vector<long long> dist(n, INF);
    dist[0] = 0;

    // (distance, node), smallest distance on top
    using Entry = std::pair<long long, std::size_t>;
    std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>> heap;
    heap.emplace(0, 0);
    while (!heap.empty()) {
        auto [d, u] = heap.top();
        heap.pop();
        // a stale entry: we already found a shorter way to u
        if (d > dist[u]) {
            continue;
        }
        for (const auto& [v, w] : graph[u]) {
            if (d + w < dist[v]) {
                dist[v] = d + w;
                heap.emplace(dist[v], v);
            }
        }
    }

    long long sum = 0;
    long long max = 0;
    for (long long d : dist) {
        if (d < INF) {
            sum += d;
            if (d > max) max = d;
        }
    }
    std::cout << sum << '\n';
    std::cout << "MAX " << max << '\n';
}
'''
