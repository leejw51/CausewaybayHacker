'''
solution     = '''

#include <algorithm>
#include <cstdint>
#include <iostream>
#include <vector>

std::vector<long long> generate(std::size_t n, std::uint64_t seed) {
    std::uint64_t x = seed;
    std::vector<long long> values;
    values.reserve(n);
    for (std::size_t i = 0; i < n; ++i) {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        values.push_back(static_cast<long long>((x >> 33) % 1000000007ULL));
    }
    return values;
}

int main() {
    std::size_t n = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> seed;

    std::vector<long long> values = generate(n, seed);

    // tails[i] = the smallest value an increasing subsequence of length i+1
    // can end on. It is sorted, always, which is what makes the search legal.
    std::vector<long long> tails;
    for (long long value : values) {
        auto slot = std::lower_bound(tails.begin(), tails.end(), value);
        if (slot == tails.end()) {
            tails.push_back(value);
        } else {
            *slot = value;
        }
    }

    std::cout << tails.size() << '\n';
    std::cout << "TAILS " << tails.size() << '\n';
}
'''
