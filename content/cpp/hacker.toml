solution     = '''
#include <algorithm>
#include <iostream>
#include <utility>
#include <vector>

int main() {
    int n = 0;
    int cap = 0;
    std::cin >> n >> cap;
    std::vector<std::pair<int, long long>> items(n);
    for (auto& [weight, value] : items) {
        std::cin >> weight >> value;
    }

    std::vector<long long> best(cap + 1, 0);
    for (const auto& [weight, value] : items) {
        // downwards, so this item cannot be picked up twice in one pass
        for (int room = cap; room >= weight; --room) {
            best[room] = std::max(best[room], best[room - weight] + value);
        }
    }

    // ratio compared without dividing: b.value * a.weight vs a.value * b.weight
    std::vector<std::pair<int, long long>> order = items;
    std::sort(order.begin(), order.end(), [](const auto& a, const auto& b) {
        long long left = b.second * a.first;
        long long right = a.second * b.first;
        if (left != right) {
            return left < right;  // a's ratio is larger
        }
        return a.first < b.first;
    });
    int room = cap;
    long long greedy = 0;
    for (const auto& [weight, value] : order) {
        if (weight <= room) {
            room -= weight;
            greedy += value;
        }
    }

    std::cout << best[cap] << '\n';
    std::cout << "GREEDY " << greedy << '\n';
}
'''
