brief        = '''
Line one is `n`. Line two is `n` integers, in order.

Build a singly linked list from them — `std::unique_ptr<Node>` for the links,
no vector in the answer — then print three lines:

1. the list reversed, space separated
2. the value at the middle node (for an even `n`, the second of the two)
3. `LEN <n>` counted by walking the list, not by trusting the input

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

The middle is the runner: one pointer one step at a time, one two steps at a
time, and when the fast one runs out the slow one is there. One pass.

The reversal is where `unique_ptr` earns its keep: a node can have exactly one
owner, so moving a node from one list to the other is `std::move` on its
`next`, and there is no moment at which two lists both think they own it.
A raw `Node*` for the *walk* is still right — it looks and owns nothing.
'''
starter      = '''
#include <iostream>
#include <memory>
#include <vector>

struct Node {
    long long value;
    std::unique_ptr<Node> next;
};

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> values(n);
    for (long long& v : values) {
        std::cin >> v;
    }

    std::unique_ptr<Node> head;
    (void)head;

    // build the list, reverse it, find the middle by walking twice as fast
    std::cout << "?\n0\nLEN 0\n";
}
'''
solution     = '''
#include <iostream>
#include <memory>
#include <vector>

struct Node {
    long long value;
    std::unique_ptr<Node> next;
};

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> values(n);
    for (long long& v : values) {
        std::cin >> v;
    }

    // build it back to front, so each new node owns what we had
    std::unique_ptr<Node> head;
    for (auto it = values.rbegin(); it != values.rend(); ++it) {
        head = std::make_unique<Node>(Node{*it, std::move(head)});
    }

    // walk it to count, and run a second pointer at half speed for the middle
    long long length = 0;
    const Node* slow = head.get();
    const Node* fast = head.get();
    while (fast != nullptr) {
        ++length;
        fast = fast->next.get();
        if (fast != nullptr) {
            ++length;
            fast = fast->next.get();
            slow = slow->next.get();
        }
    }
    long long middle = slow ? slow->value : 0;

    // reverse by moving nodes off the front of one list onto the front of another
    std::unique_ptr<Node> reversed;
    while (head) {
        std::unique_ptr<Node> node = std::move(head);
        head = std::move(node->next);
        node->next = std::move(reversed);
        reversed = std::move(node);
    }

    bool first = true;
    for (const Node* walk = reversed.get(); walk != nullptr; walk = walk->next.get()) {
        std::cout << (first ? "" : " ") << walk->value;
        first = false;
    }
    std::cout << '\n';
    std::cout << middle << '\n';
    std::cout << "LEN " << length << '\n';
}
'''
hints = [
  "Building back to front is the easy direction: each new node takes the old head as its next, with std::move because a unique_ptr cannot be copied.",
