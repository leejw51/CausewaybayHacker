brief        = '''
Standard input is `n buckets seed`. Build `n` riders, where rider `i` has
index `i` and a score:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Sort the riders by score **descending**. Riders with the same score must keep
the order they arrived in. Print their indices, space separated, then
`TIES <k>` — how many adjacent pairs in your sorted order have equal scores.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` is small, so almost everything is a tie, and the answer is almost
entirely decided by what happens to them.

**This is the quest about knowing which sort you are holding.** `std::sort`
is **not stable** — it makes no promise about the order of equal elements,
and on a real input it visibly will not keep it: it is an introsort, and its
partition step swaps equal elements across the pivot as a matter of course.
`std::stable_sort` is stable, is a merge sort, and costs some memory for the
promise. The starter uses `std::sort` with a comparator that looks only at
the score, and the hidden cases are large enough that it demonstrably
scrambles them. (At `n = 8` the library falls back to an insertion sort and
happens to keep the order — which is why a small test would have proved
nothing, and why the small case here is the *visible* one rather than the
one that judges you.)

There are two correct answers and you should be able to give both. Use
`std::stable_sort`. **Or** keep `std::sort` and make the comparison
**total** — score descending, then index ascending — so no two elements ever
compare equal and stability stops being a question. The second is what to
reach for by default; an unstable sort has nothing to prove when the order is
fully specified.
'''
