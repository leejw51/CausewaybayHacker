title        = "THE LONGEST RUN UP"
difficulty   = 5
time_limit_s = 1200
story        = "Daily takings, as many as they care to name, and you make them yourself from a seed. They want the longest stretch of improving days, and they do not have to be consecutive."
concepts     = ["dynamic-programming", "binary-search", "complexity"]
requires     = ["cpp.hacker.16.union-find"]
map          = { x = 0.327, y = 0.554, kind = "quest" }
brief        = '''
Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in `std::uint64_t` arithmetic,
which wraps by definition:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (wrapping)
    next value = (x >> 33) % 1000000007
```

Print the length of the longest **strictly increasing subsequence** — the
values keep their order but need not be adjacent. Then print
`TAILS <k>` where `k` is that same length, read off the patience-sorting pile
count.

```
input:  8 1
output: 3
        TAILS 3
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`,
and the longest run up inside it is `93944146 392341189 822192870`. Check your
generator against that line before you go looking for a bug in your algorithm.

**This quest enforces its complexity.** The starter is the `O(n²)` table — the
answer you should be able to write cold, and it is not wrong. At `n = 200000`
it prints the same `881` the fast one prints. It prints it **32.6 s** after it
starts, against a five second run limit, so what you see is a timeout and not
a wrong answer. That is the failure this question exists to produce.

The `O(n log n)` one keeps, for each length, the smallest value a subsequence
of that length can end on — a list that is always sorted, so the position of a
new value is a binary search, and `std::lower_bound` is that search. It does
`n = 200000` in **0.006 s**. Both measured on this machine, with the two
programs that ship in this quest.

One note on widths, because it is the half of this question C++ adds. Every
generated value is below `2^30` and the answer is at most `n`, so `int` would
hold both — but the generator's `x` must be `std::uint64_t` and nothing else.
Unsigned overflow wraps by definition; **signed** overflow is undefined
behaviour, so a `long long` there leaves the compiler entitled to do anything
at all, and `>> 33` on it would be an arithmetic shift rather than the logical
one this generator means. Generate unsigned, convert after the modulus.
'''
starter      = '''

#include <algorithm>
#include <cstdint>
#include <iostream>
#include <vector>

std::vector<long long> generate(std::size_t n, std::uint64_t seed) {
    std::uint64_t x = seed;
    std::vector<long long> values;
    values.reserve(n);
    for (std::size_t i = 0; i < n; ++i) {
