solution     = '''
#include <algorithm>
#include <cstdint>
#include <iostream>
#include <utility>
#include <vector>

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

int main() {
    std::size_t n = 0;
    std::uint64_t buckets = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> buckets >> seed;

    Rng rng{seed};
    // (score, original index)
    std::vector<std::pair<long long, std::size_t>> riders;
    riders.reserve(n);
    for (std::size_t i = 0; i < n; ++i) {
        riders.emplace_back(static_cast<long long>(rng.next() % buckets), i);
    }

    // std::stable_sort keeps equal scores in the order they arrived in.
    // The equally correct alternative keeps std::sort and makes the
    // comparison total:
    //     return a.first != b.first ? a.first > b.first : a.second < b.second;
    std::stable_sort(riders.begin(), riders.end(), [](const auto& a, const auto& b) {
        return a.first > b.first;
    });

    std::size_t ties = 0;
    for (std::size_t i = 0; i < n; ++i) {
        std::cout << (i ? " " : "") << riders[i].second;
        if (i > 0 && riders[i - 1].first == riders[i].first) {
            ++ties;
        }
    }
    std::cout << '\n';
    std::cout << "TIES " << ties << '\n';
}
'''
