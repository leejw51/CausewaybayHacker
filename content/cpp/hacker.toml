solution     = '''
#include <algorithm>
#include <iostream>
#include <vector>

bool present(const std::vector<long long>& tree, std::size_t i) {
    return i < tree.size() && tree[i] != -1;
}

void walk(const std::vector<long long>& tree, std::size_t i, int order, std::vector<long long>& out) {
    if (!present(tree, i)) {
        return;
    }
    if (order == 0) out.push_back(tree[i]);
    walk(tree, 2 * i + 1, order, out);
    if (order == 1) out.push_back(tree[i]);
    walk(tree, 2 * i + 2, order, out);
    if (order == 2) out.push_back(tree[i]);
}

int depth(const std::vector<long long>& tree, std::size_t i) {
    if (!present(tree, i)) {
        return 0;
    }
    return 1 + std::max(depth(tree, 2 * i + 1), depth(tree, 2 * i + 2));
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> tree(n);
    for (long long& v : tree) {
        std::cin >> v;
    }

    for (int order = 0; order < 3; ++order) {
        std::vector<long long> out;
        walk(tree, 0, order, out);
        for (std::size_t i = 0; i < out.size(); ++i) {
            std::cout << (i ? " " : "") << out[i];
        }
        std::cout << '\n';
    }
    std::cout << "DEPTH " << depth(tree, 0) << '\n';
}
'''
