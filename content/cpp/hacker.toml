solution     = '''
#include <iostream>
#include <limits>
#include <vector>

bool present(const std::vector<long long>& tree, std::size_t i) {
    return i < tree.size() && tree[i] != -1;
}

bool valid(const std::vector<long long>& tree, std::size_t i, long long low, long long high) {
    if (!present(tree, i)) {
        return true;
    }
    long long value = tree[i];
    if (value <= low || value >= high) {
        return false;
    }
    return valid(tree, 2 * i + 1, low, value) && valid(tree, 2 * i + 2, value, high);
}

// the depth at which target sits, or 0 if it is not in the tree
int find(const std::vector<long long>& tree, long long target) {
    std::size_t i = 0;
    int depth = 1;
    while (present(tree, i)) {
        if (tree[i] == target) {
            return depth;
        }
        i = target < tree[i] ? 2 * i + 1 : 2 * i + 2;
        ++depth;
    }
    return 0;
}

int main() {
    int n = 0;
    int q = 0;
    std::cin >> n >> q;
    std::vector<long long> tree(n);
    for (long long& v : tree) {
        std::cin >> v;
    }

    std::cout << (valid(tree, 0, std::numeric_limits<long long>::min(), std::numeric_limits<long long>::max()) ? "VALID" : "INVALID") << '\n';
    for (int k = 0; k < q; ++k) {
        long long target = 0;
        std::cin >> target;
        int depth = find(tree, target);
        if (depth > 0) {
            std::cout << target << " FOUND " << depth << '\n';
        } else {
            std::cout << target << " ABSENT\n";
        }
    }
}
'''
