solution     = '''
#include <iostream>
#include <limits>
#include <vector>

int main() {
    int n = 0;
    int target = 0;
    std::cin >> n >> target;
    std::vector<int> coins(n);
    for (int& c : coins) {
        std::cin >> c;
    }

    const long long unreachable = std::numeric_limits<long long>::max();
    std::vector<long long> best(target + 1, unreachable);
    best[0] = 0;

    for (int amount = 1; amount <= target; ++amount) {
        for (int coin : coins) {
            if (coin <= amount && best[amount - coin] != unreachable) {
                long long candidate = best[amount - coin] + 1;
                if (candidate < best[amount]) {
                    best[amount] = candidate;
                }
            }
        }
    }

    if (best[target] == unreachable) {
        std::cout << "-1\n";
    } else {
        std::cout << best[target] << '\n';
    }
    int reach = 0;
    for (long long v : best) {
        if (v != unreachable) {
            ++reach;
        }
    }
    std::cout << "REACH " << reach << '\n';
}
'''
