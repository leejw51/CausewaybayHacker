solution     = '''
#include <iostream>
#include <string>
#include <vector>

int main() {
    int commands = 0;
    std::cin >> commands;

    std::vector<long long> items;

    for (int i = 0; i < commands; ++i) {
        std::string command;
        std::cin >> command;
        if (command == "ADD") {
            // the argument is a second token of the same command
            long long cents = 0;
            std::cin >> cents;
            items.push_back(cents);
        } else if (command == "VOID") {
            if (!items.empty()) {
                items.pop_back();
            }
        } else if (command == "TOTAL") {
            long long sum = 0;
            for (long long v : items) sum += v;
            std::cout << sum << '\n';
        } else if (command == "CLEAR") {
            items.clear();
        }
    }

    std::cout << "COMMANDS " << commands << '\n';
    std::cout << "ITEMS " << items.size() << '\n';
}
'''
