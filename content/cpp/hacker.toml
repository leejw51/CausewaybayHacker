solution     = '''
#include <array>
#include <iostream>
#include <string>
#include <vector>

struct Node {
    std::array<int, 26> children;
    int through = 0;
    bool terminal = false;
    Node() { children.fill(-1); }
};

int main() {
    int n = 0;
    int q = 0;
    std::cin >> n >> q;

    std::vector<Node> nodes(1);

    for (int i = 0; i < n; ++i) {
        std::string word;
        std::cin >> word;
        int at = 0;
        for (char ch : word) {
            int slot = ch - 'a';
            if (nodes[at].children[slot] == -1) {
                // push_back may reallocate, so the index is taken first and
                // nodes[at] is re-read after, never held across the push
                nodes.push_back(Node());
                nodes[at].children[slot] = static_cast<int>(nodes.size()) - 1;
            }
            at = nodes[at].children[slot];
            nodes[at].through++;
        }
        nodes[at].terminal = true;
    }

    for (int i = 0; i < q; ++i) {
        std::string kind;
        std::string text;
        std::cin >> kind >> text;

        int at = 0;
        for (char ch : text) {
            if (at == -1) break;
            at = nodes[at].children[ch - 'a'];
        }

        if (kind == "WORD") {
