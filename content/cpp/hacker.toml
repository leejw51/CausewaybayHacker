#include <functional>
#include <iostream>
#include <queue>
#include <vector>

int main() {
    int n = 0;
    int m = 0;
    std::cin >> n >> m;

    std::vector<std::vector<int>> after(n);
    std::vector<int> waiting(n, 0);
    for (int e = 0; e < m; ++e) {
        int a = 0;
        int b = 0;
        std::cin >> a >> b;
        after[a].push_back(b);
        waiting[b]++;
    }

    std::priority_queue<int, std::vector<int>, std::greater<int>> ready;
    for (int task = 0; task < n; ++task) {
        if (waiting[task] == 0) {
            ready.push(task);
        }
    }

    std::vector<int> order;
    while (!ready.empty()) {
        int task = ready.top();
        ready.pop();
        order.push_back(task);
        for (int next : after[task]) {
            if (--waiting[next] == 0) {
                ready.push(next);
            }
        }
    }

    if (static_cast<int>(order.size()) < n) {
        std::cout << "CYCLE\n";
    } else {
        for (std::size_t i = 0; i < order.size(); ++i) {
            std::cout << (i ? " " : "") << order[i];
        }
        std::cout << '\n';
    }
    std::cout << "DONE " << order.size() << '\n';
}
'''
