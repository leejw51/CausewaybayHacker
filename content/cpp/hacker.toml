brief        = '''
Line one is `n k`. Line two is `n` words separated by spaces.

Print the `k` most frequent words, most frequent first, ties broken by the
word ascending, one per line. If there are fewer than `k` distinct words,
print all of them. Then print `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Count with a hash map, then rank. The tie-break is not decoration. A
`std::unordered_map` hands its entries out in whatever order its buckets
happen to be in — an order that differs between libstdc++ and libc++, and
between two runs with different insertions — so a comparator that looks only
at the count leaves equal-count words in that order, and the same program
prints a different answer on the next machine. `std::sort` is not stable
either, so it would not save you even if the input order were meaningful.
Making the comparison **total** — count descending, then the word ascending —
is what fixes it, and it is the answer the interviewer is listening for.

The cases here are small and the clock is not measuring speed. That is the
right way round for this question — counting and ranking is `O(n log n)`
however you write it, and the thing that actually fails a candidate here is
the comparator, which the `ties` case checks and a big case would not.
'''
starter      = '''
