[[quest]]
id           = "cpp.hacker.02.window"
node         = 2
title        = "NO REPEATS"
difficulty   = 4
time_limit_s = 900
story        = "The second question is on the board before you have put the marker down."
concepts     = ["two-pointers", "strings", "complexity"]
requires     = ["cpp.hacker.01.two-sum"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief        = '''
One line of text, no spaces.

Print the length of the longest run of characters with no repeat in it, then
the run itself. If several runs tie, print the leftmost.

```
input:  abcabcbb
output: 3
        abc
```

The window only ever moves right. If you find yourself rescanning from the
start after a repeat, you have written the quadratic one.

The cases here are small, and the clock is not measuring speed. Nor could it:
on a random string the rescanning version never has more than a few characters
to rescan before it hits a repeat, so it finishes as fast as the window does
at any size — measured on this machine at `n = 200000`, not assumed. What
these four cases check is the length, the leftmost tie-break and the run
itself. Write the window anyway. It is `O(n)` on every input rather than on
most of them, and the input a real screen hands you is chosen to be unkind.
'''
starter      = '''
#include <iostream>
#include <string>
#include <unordered_map>

int main() {
    std::string text;
    std::cin >> text;

    std::unordered_map<char, std::size_t> last;
    (void)last;

    // print the best length, then the run itself
    std::cout << "0\n?\n";
}
'''
solution     = '''
#include <iostream>
#include <string>
#include <unordered_map>

int main() {
    std::string text;
    std::cin >> text;

    std::unordered_map<char, std::size_t> last;
    std::size_t start = 0;
    std::size_t best_len = 0;
    std::size_t best_start = 0;

    for (std::size_t i = 0; i < text.size(); ++i) {
        auto previous = last.find(text[i]);
        if (previous != last.end() && previous->second >= start) {
            start = previous->second + 1;
        }
        last[text[i]] = i;
        std::size_t len = i - start + 1;
        if (len > best_len) {
            best_len = len;
            best_start = start;
        }
    }

    std::cout << best_len << '\n';
    std::cout << text.substr(best_start, best_len) << '\n';
}
'''
hints = [
  "Keep the index where each character was last seen, and the index the window starts at.",
  "A repeat only matters if its last position is inside the current window — that is the previous >= start test.",
  "Record the best length and where it started, or you cannot print the run at the end; substr(start, len) does the rest.",
]

