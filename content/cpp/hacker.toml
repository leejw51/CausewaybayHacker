# C++ LAND — HACKER. HKU, Chow Yei Ching Building, Room 7-32, the third time.
# The same thirty-four questions as the Rust and Go interviews, in the same
# order, with the same input and the same expected output wherever the problem
# is the same problem — so a player can sit the same interview in any land.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
#
# Two big cases are larger than their Rust and Go twins, and the briefs say
# so: C++ at -O2 has no bounds checks and vectorises the naive inversion count
# into 1.5 s at n = 200000, and the linear-scan Dijkstra sits right on the
# five second line at n = 100000. Neither would reject the slow answer, so the
# C++ cases are n = 1000000 and n = 200000, where the slow answers take 38 s
# and 35 s and the right ones take under a tenth of a second. All measured on
# the machine this pack was written on, with the programs that ship in it.
#
# Node 17, the longest run up, was converted to that same generator afterwards
# and needed no such enlargement: its O(n^2) table does not vectorise, and at
# the shared n = 200000 it takes 32.6 s against the right answer's 0.006 s. Its
# stdin and its expected output are byte for byte the other three lands'.
#
# Nine other briefs claimed a bar their cases could not hold, and now say so
# instead. Some of those problems cannot be generated at this size at all — a
# random string has no long repeat-free run in it, a pairs-plus-one array is
# constructed rather than generated — and a brief that admits that is worth
# more than a hidden case that proves nothing.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "cpp.hacker"
land = "cpp"
category = "hacker"
version = 1

