#include <algorithm>
#include <iostream>
#include <string>
#include <vector>

int main() {
    std::string a;
    std::string b;
    std::getline(std::cin, a);
    std::getline(std::cin, b);
    std::size_t la = a.size();
    std::size_t lb = b.size();

    std::vector<std::vector<int>> edit(la + 1, std::vector<int>(lb + 1, 0));
    for (std::size_t i = 0; i <= la; ++i) edit[i][0] = static_cast<int>(i);
    for (std::size_t j = 0; j <= lb; ++j) edit[0][j] = static_cast<int>(j);
    for (std::size_t i = 1; i <= la; ++i) {
        for (std::size_t j = 1; j <= lb; ++j) {
            if (a[i - 1] == b[j - 1]) {
                edit[i][j] = edit[i - 1][j - 1];
            } else {
                edit[i][j] = 1 + std::min({edit[i - 1][j - 1], edit[i - 1][j], edit[i][j - 1]});
            }
        }
    }

    std::vector<std::vector<int>> lcs(la + 1, std::vector<int>(lb + 1, 0));
    for (std::size_t i = 1; i <= la; ++i) {
        for (std::size_t j = 1; j <= lb; ++j) {
