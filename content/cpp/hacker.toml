solution     = '''
#include <cstdint>
#include <iostream>
#include <string>

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

int main() {
    long long n = 0;
    std::uint64_t alphabet = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> alphabet >> seed;

    Rng rng{seed};
    std::string s;
    for (long long i = 0; i < n; ++i) {
        s.push_back(static_cast<char>('a' + rng.next() % alphabet));
    }

    long long best_len = 0;
    long long best_start = 0;
    // i and j walk outwards from a centre and stop one step too far each way
    auto expand = [&](long long i, long long j) {
        while (i >= 0 && j < n && s[i] == s[j]) {
            --i;
            ++j;
        }
        long long len = j - i - 1;
        if (len > best_len) {
            best_len = len;
            best_start = i + 1;
        }
    };

    for (long long centre = 0; centre < n; ++centre) {
        expand(centre, centre);      // odd length: one character at the middle
        expand(centre, centre + 1);  // even length: the gap to the right of it
    }

    std::cout << best_len << '\n';
    std::cout << "AT " << best_start << '\n';
}
'''
