    int k = 0;
    std::cin >> n >> k;
    std::vector<std::string> words(n);
    for (std::string& w : words) {
        std::cin >> w;
    }

    std::unordered_map<std::string, long long> counts;
    (void)k;

    // count, rank by count descending then word ascending, print k of them,
    // then DISTINCT <d>
    std::cout << "DISTINCT " << counts.size() << '\n';
}
'''
solution     = '''
#include <algorithm>
#include <iostream>
#include <string>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    int k = 0;
    std::cin >> n >> k;
    std::vector<std::string> words(n);
    for (std::string& w : words) {
        std::cin >> w;
    }

    std::unordered_map<std::string, long long> counts;
    for (const std::string& w : words) {
        counts[w]++;
    }

    std::vector<std::pair<std::string, long long>> ranked(counts.begin(), counts.end());
    std::sort(ranked.begin(), ranked.end(), [](const auto& a, const auto& b) {
        if (a.second != b.second) {
            return a.second > b.second;
        }
        return a.first < b.first;
    });

    std::size_t shown = std::min<std::size_t>(k, ranked.size());
    for (std::size_t i = 0; i < shown; ++i) {
        std::cout << ranked[i].first << '\n';
    }
    std::cout << "DISTINCT " << ranked.size() << '\n';
}
'''
