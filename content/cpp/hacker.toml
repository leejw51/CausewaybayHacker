solution     = '''
#include <iostream>
#include <set>

int main() {
    int cases = 0;
    std::cin >> cases;

    for (int t = 0; t < cases; ++t) {
        // fresh for every case
        std::set<long long> distinct;

        int n = 0;
        std::cin >> n;
        for (int i = 0; i < n; ++i) {
            long long value = 0;
            std::cin >> value;
            distinct.insert(value);
        }

        if (distinct.size() < 2) {
            std::cout << "NONE\n";
        } else {
            // rbegin is the largest; one step further back is the second
            std::cout << *std::next(distinct.rbegin()) << '\n';
        }
    }
    std::cout << "CASES " << cases << '\n';
}
'''
