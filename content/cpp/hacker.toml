[[quest]]
id           = "cpp.hacker.23.prefix-sums"
node         = 23
title        = "HOW MANY WAYS TO HIT THE TARGET"
difficulty   = 5
time_limit_s = 1200
story        = "A day of takings and a number the auditor wants to see. How many runs of consecutive hours add up to exactly that."
concepts     = ["prefix-sums", "hashing", "complexity"]
requires     = ["cpp.hacker.22.trie"]
map          = { x = 0.750, y = 0.724, kind = "quest" }
brief        = '''
Line one is `n k`. Line two is `n` integers, which may be negative.

Print how many contiguous runs sum to exactly `k`, then `RANGE <s>`, the sum
of the whole list, read off the last prefix sum rather than by adding again.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

Negative values kill the sliding window — a window that is too big cannot be
fixed by shrinking it. What survives is prefix sums: a run `i..j` sums to `k`
exactly when `prefix[j] - prefix[i] == k`, so count how many earlier prefixes
equal `prefix[j] - k`. Seed the map with `0 → 1` for runs that start at the
beginning.

The cases here are small and the clock is not measuring speed, and there is no
case here that would reject the `O(n²)` double loop — at a real `n` there
would be. That same double loop over 200000 values is `2 × 10^10` additions
and takes about six seconds on this machine, against a five second run limit
and against a hash map's single pass in a hundredth of that. What these four
check is the negatives and the runs that start at the beginning, which are the
two places this answer actually goes wrong. The complexity is on your honour.
'''
starter      = '''
#include <iostream>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    long long k = 0;
    std::cin >> n >> k;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::unordered_map<long long, long long> seen;
    seen[0] = 1;
    (void)k;

    // running prefix; for each one, how many earlier prefixes were prefix - k
    std::cout << "0\nRANGE 0\n";
}
'''
solution     = '''
#include <iostream>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    long long k = 0;
    std::cin >> n >> k;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::unordered_map<long long, long long> seen;
    seen[0] = 1;

    long long prefix = 0;
    long long runs = 0;
    for (long long value : nums) {
        prefix += value;
        auto earlier = seen.find(prefix - k);
        if (earlier != seen.end()) {
            runs += earlier->second;
        }
        seen[prefix]++;
    }

    std::cout << runs << '\n';
    std::cout << "RANGE " << prefix << '\n';
}
'''
