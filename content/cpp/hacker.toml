[[quest]]
id           = "cpp.hacker.01.two-sum"
node         = 1
title        = "TWO FARES"
difficulty   = 3
time_limit_s = 600
story        = "Room 7-32, third time. The first question is the one everybody gets, and this time the compiler will not tell you when you are wrong."
concepts     = ["hashing", "complexity", "slices"]
requires     = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` integers.

Print the **1-based** indices `i j` of two different entries that add up to
`target`, as `i j` with `i < j`. If more than one pair works, give the one
whose second index is smallest; if that still ties, the smallest first index.
If no pair works, print `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

The hidden cases here are small: they check the tie-break and the
no-answer case, not your speed. The question is still the linear one — one
pass, one `std::unordered_map` — because a real `n` is 200000 and the nested
loop is what this question exists to weed out. Write the answer the question
is asking for, not the one that happens to clear these four cases.
'''
starter      = '''
#include <iostream>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    long long target = 0;
    std::cin >> n >> target;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::unordered_map<long long, int> seen;
    (void)seen;
    std::cout << "-1\n";
}
'''
solution     = '''
#include <iostream>
#include <unordered_map>
#include <vector>

int main() {
    int n = 0;
    long long target = 0;
    std::cin >> n >> target;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    // value -> the first index it was seen at
    std::unordered_map<long long, int> seen;
    for (int j = 0; j < n; ++j) {
        auto hit = seen.find(target - nums[j]);
        if (hit != seen.end()) {
            std::cout << hit->second + 1 << ' ' << j + 1 << '\n';
            return 0;
        }
        seen.emplace(nums[j], j);
    }
    std::cout << "-1\n";
}
'''
hints = [
  "One pass. For each value ask whether target minus it has already been seen.",
  "seen.emplace(x, j) does nothing if x is already there, which keeps the first index of a repeated value — the tie-break the statement asks for.",
  "Print and return the moment you find it — the first hit as you scan is already the smallest second index.",
]

