    std::size_t n = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> seed;

    std::vector<long long> values = generate(n, seed);

    // correct, and far too slow: this is what the big hidden case rejects.
    // best[i] is the longest increasing subsequence ending at i.
    std::vector<int> best(n, 1);
    int longest = n > 0 ? 1 : 0;
    for (std::size_t i = 0; i < n; ++i) {
        for (std::size_t j = 0; j < i; ++j) {
            if (values[j] < values[i] && best[j] + 1 > best[i]) {
                best[i] = best[j] + 1;
            }
        }
        if (best[i] > longest) {
            longest = best[i];
        }
    }

    std::cout << longest << '\n';
    std::cout << "TAILS " << longest << '\n';
