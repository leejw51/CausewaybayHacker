#include <iostream>
#include <string>
#include <vector>

void build(const std::vector<long long>& nums, std::size_t at, std::vector<long long>& chosen, std::vector<std::string>& out) {
    if (at == nums.size()) {
        if (chosen.empty()) {
            out.push_back("-");
        } else {
            std::string line;
            for (std::size_t i = 0; i < chosen.size(); ++i) {
                line += (i ? " " : "") + std::to_string(chosen[i]);
            }
            out.push_back(line);
        }
        return;
    }

    chosen.push_back(nums[at]);
    build(nums, at + 1, chosen, out);
    chosen.pop_back();  // the undo in try-recurse-undo

    build(nums, at + 1, chosen, out);
}

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> chosen;
    std::vector<std::string> out;
    build(nums, 0, chosen, out);

    for (const std::string& line : out) {
        std::cout << line << '\n';
    }
    std::cout << "SUBSETS " << out.size() << '\n';
}
