#include <list>
#include <string>
#include <unordered_map>
#include <utility>

int main() {
    std::size_t capacity = 0;
    int q = 0;
    std::cin >> capacity >> q;

    // front is the most recently used; each node is (key, value)
    std::list<std::pair<long long, long long>> recent;
    std::unordered_map<long long, std::list<std::pair<long long, long long>>::iterator> where;
    int evicted = 0;

    for (int i = 0; i < q; ++i) {
        std::string op;
        long long key = 0;
        std::cin >> op >> key;
        if (op == "GET") {
            std::cout << "-1\n";
            continue;
        }
        long long value = 0;
        std::cin >> value;
    }

    (void)capacity;
    (void)recent;
    (void)where;
    std::cout << "-\n";
    std::cout << "EVICTED " << evicted << '\n';
}
'''
solution     = '''
#include <iostream>
#include <list>
#include <string>
#include <unordered_map>
#include <utility>

int main() {
    std::size_t capacity = 0;
    int q = 0;
    std::cin >> capacity >> q;

    // front is the most recently used; each node is (key, value)
    using Node = std::pair<long long, long long>;
    std::list<Node> recent;
    std::unordered_map<long long, std::list<Node>::iterator> where;
    int evicted = 0;

    for (int i = 0; i < q; ++i) {
        std::string op;
        long long key = 0;
        std::cin >> op >> key;

        if (op == "GET") {
            auto hit = where.find(key);
            if (hit == where.end()) {
                std::cout << "-1\n";
                continue;
            }
            // move the node to the front without invalidating its iterator
            recent.splice(recent.begin(), recent, hit->second);
            std::cout << hit->second->second << '\n';
            continue;
        }

        long long value = 0;
        std::cin >> value;

        auto hit = where.find(key);
        if (hit != where.end()) {
            hit->second->second = value;
            recent.splice(recent.begin(), recent, hit->second);
            continue;
        }
        if (recent.size() == capacity) {
            // read the key before the node is gone, then erase in that order
            long long oldest = recent.back().first;
            where.erase(oldest);
            recent.pop_back();
            ++evicted;
        }
        recent.emplace_front(key, value);
        where[key] = recent.begin();
    }

    if (recent.empty()) {
        std::cout << "-\n";
    } else {
        bool first = true;
        for (const Node& node : recent) {
            std::cout << (first ? "" : " ") << node.first;
            first = false;
        }
        std::cout << '\n';
    }
    std::cout << "EVICTED " << evicted << '\n';
}
'''
hints = [
  "recent.splice(recent.begin(), recent, it) moves the node it points at to the front, in O(1), and it still points at the same node afterwards. That is the operation the whole design rests on.",
  "Overwriting a key that is already present is not an eviction — check the map before you decide the cache is full.",
  "Eviction: take back().first, erase that key from the map, then pop_back. After pop_back the iterator the map held is dangling, so the map entry has to go first.",
  "Walking the list front to back is already most-recent-first, so the last line needs no sort.",
]

