  "Pass an open interval (low, high) down. The root gets the whole range; a left child gets (low, node), a right child gets (node, high).",
  "A missing node is vacuously valid — that is the base case, and it returns true, not false.",
  "The lookup is the binary search: smaller goes left, otherwise right, and the depth is how many hops it took.",
]

