[[quest]]
id           = "cpp.hacker.16.union-find"
node         = 16
title        = "WHO IS CONNECTED TO WHOM"
difficulty   = 5
time_limit_s = 1200
story        = "The tram network, the MTR and the minibus routes on one sheet. How many separate networks are there really."
concepts     = ["disjoint-set", "graphs", "complexity"]
requires     = ["cpp.hacker.15.topo-sort"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief        = '''
Line one is `n m`: `n` stops numbered `0..n-1`, `m` undirected links. The next
`m` lines are `<a> <b>`.

Print three lines: how many separate networks there are, the size of the
largest, and `REDUNDANT <k>` — how many of the links joined two stops that
were already connected.

```
input:  6 4
        0 1
        1 2
        3 4
        0 2
output: 3
        3
        REDUNDANT 1
```

Union-find: every stop points at a parent, `find` walks to the root, `union`
points one root at the other. Compress the path on the way back out of `find`
and the whole thing is effectively constant time per query.

The cases here are small and the clock is not measuring speed — a `find` that
walks without compressing would clear all four, and so would rescanning the
whole array for each query. Compress anyway. The paragraph above is a claim
about a hundred thousand stops and a hundred thousand links, and it is the
claim you will be asked to defend, not these four lines.
'''
starter      = '''
#include <iostream>
#include <numeric>
#include <vector>

int find(std::vector<int>& parent, int x) {
    // walk to the root, and flatten what you walked over
    (void)parent;
    return x;
}

int main() {
    int n = 0;
    int m = 0;
    std::cin >> n >> m;

    std::vector<int> parent(n);
    std::iota(parent.begin(), parent.end(), 0);
    std::vector<int> size(n, 1);
    int redundant = 0;

    for (int e = 0; e < m; ++e) {
        int a = 0;
        int b = 0;
        std::cin >> a >> b;
        (void)find(parent, a);
        (void)find(parent, b);
    }

    std::cout << n << "\n1\nREDUNDANT " << redundant << '\n';
    (void)size;
}
'''
solution     = '''
#include <algorithm>
#include <iostream>
#include <numeric>
#include <vector>

int find(std::vector<int>& parent, int x) {
    int root = x;
    while (parent[root] != root) {
        root = parent[root];
    }
    // path compression: point everything we walked over straight at the root
    while (parent[x] != root) {
        int next = parent[x];
        parent[x] = root;
        x = next;
    }
    return root;
}

int main() {
    int n = 0;
    int m = 0;
    std::cin >> n >> m;

    std::vector<int> parent(n);
    std::iota(parent.begin(), parent.end(), 0);
    std::vector<int> size(n, 1);
    int groups = n;
    int redundant = 0;

    for (int e = 0; e < m; ++e) {
        int a = 0;
        int b = 0;
        std::cin >> a >> b;
        a = find(parent, a);
        b = find(parent, b);
        if (a == b) {
            ++redundant;
            continue;
        }
        // hang the smaller tree under the bigger one
        if (size[a] < size[b]) {
            std::swap(a, b);
        }
        parent[b] = a;
        size[a] += size[b];
        --groups;
    }

    int largest = 0;
    for (int x = 0; x < n; ++x) {
        if (parent[x] == x) {
            largest = std::max(largest, size[x]);
        }
    }

    std::cout << groups << '\n';
    std::cout << largest << '\n';
    std::cout << "REDUNDANT " << redundant << '\n';
}
'''
hints = [
  "Start with every stop as its own parent — std::iota — and n groups; each successful union drops the count by one.",
