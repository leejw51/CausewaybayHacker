    }
};

long long power(long long base, long long exp) {
    long long result = 1;
    base %= P;
    while (exp > 0) {
        if (exp & 1) result = result * base % P;
        base = base * base % P;
        exp >>= 1;
    }
    return result;
}

int main() {
    std::uint64_t n = 0;
    std::uint64_t q = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> q >> seed;

    Rng rng{seed};
    long long sum = 0;
    long long last = 0;
    for (std::uint64_t k = 0; k < q; ++k) {
        std::uint64_t a = rng.next() % (n + 1);
        std::uint64_t b = rng.next() % (a + 1);

        // correct, and far too slow: b multiplications and a modular inverse
        // for every single query
        long long numerator = 1;
        long long denominator = 1;
        for (std::uint64_t i = 0; i < b; ++i) {
            numerator = numerator * (static_cast<long long>(a - i) % P) % P;
            denominator = denominator * (static_cast<long long>(i + 1) % P) % P;
        }
        long long value = numerator * power(denominator, P - 2) % P;

        sum = (sum + value) % P;
        last = value;
    }

    std::cout << sum << '\n';
    std::cout << "LAST " << last << '\n';
}
'''
solution     = '''
#include <cstdint>
#include <iostream>
#include <vector>

const long long P = 1000000007LL;

struct Rng {
    std::uint64_t x;
    std::uint64_t next() {
        x = x * 6364136223846793005ULL + 1442695040888963407ULL;
        return x >> 33;
    }
};

// base^exp mod P, by repeated squaring: about 30 steps for a 30-bit exponent.
long long power(long long base, long long exp) {
    long long result = 1;
    base %= P;
    while (exp > 0) {
        if (exp & 1) result = result * base % P;
        base = base * base % P;
        exp >>= 1;
    }
    return result;
}

// P is prime, so Fermat gives v^(P-2) as the inverse of v.
long long inverse(long long v) {
    return power(v, P - 2);
}

int main() {
    std::uint64_t n = 0;
    std::uint64_t q = 0;
    std::uint64_t seed = 0;
    std::cin >> n >> q >> seed;

    // one shared factorial table for every query
    std::vector<long long> factorial(n + 1, 1);
    for (std::uint64_t i = 1; i <= n; ++i) {
        factorial[i] = factorial[i - 1] * static_cast<long long>(i) % P;
    }

    Rng rng{seed};
    long long sum = 0;
    long long last = 0;
    for (std::uint64_t k = 0; k < q; ++k) {
        std::uint64_t a = rng.next() % (n + 1);
        std::uint64_t b = rng.next() % (a + 1);

        long long value = factorial[a] * inverse(factorial[b]) % P * inverse(factorial[a - b]) % P;

        sum = (sum + value) % P;
        last = value;
    }

    std::cout << sum << '\n';
    std::cout << "LAST " << last << '\n';
}
'''
hints = [
  "Reduce after every multiplication, never at the end. long long holds the product of two values below P; it does not hold a factorial.",
  "inverse(v) is power(v, P - 2), and it only works because P is prime — that is the whole content of Fermat's little theorem here.",
  "Precomputing inverse factorials as well, backwards from inverse(factorial[n]), removes the two power() calls per query. Not needed to pass, and worth saying out loud.",
]

