solution     = '''
#include <functional>
#include <iostream>
#include <queue>
#include <tuple>
#include <vector>

int main() {
    int k = 0;
    std::cin >> k;
    std::vector<std::vector<long long>> lists(k);
    for (auto& list : lists) {
        int count = 0;
        std::cin >> count;
        list.resize(count);
        for (long long& v : list) {
            std::cin >> v;
        }
    }

    // (value, which list, how far into it); std::greater makes it a min-heap
    using Entry = std::tuple<long long, int, std::size_t>;
    std::priority_queue<Entry, std::vector<Entry>, std::greater<Entry>> heap;
    for (int which = 0; which < k; ++which) {
        if (!lists[which].empty()) {
            heap.emplace(lists[which][0], which, 0);
        }
    }

    std::vector<long long> out;
    while (!heap.empty()) {
        auto [value, which, at] = heap.top();
        heap.pop();
        out.push_back(value);
        if (at + 1 < lists[which].size()) {
            heap.emplace(lists[which][at + 1], which, at + 1);
        }
    }

    for (std::size_t i = 0; i < out.size(); ++i) {
        std::cout << (i ? " " : "") << out[i];
    }
    std::cout << '\n';
    std::cout << "POPS " << out.size() << '\n';
}
'''
