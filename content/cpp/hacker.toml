#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<unsigned long long> nums(n);
    for (unsigned long long& v : nums) {
        std::cin >> v;
    }

    unsigned long long alone = 0;
    for (unsigned long long v : nums) {
        alone ^= v;
    }

    int bits = 0;
    for (unsigned long long walk = alone; walk != 0; walk &= walk - 1) {
        ++bits;
    }

    bool power_of_two = alone != 0 && (alone & (alone - 1)) == 0;
    unsigned long long cleared = alone == 0 ? 0 : alone & (alone - 1);

    std::cout << alone << '\n';
    std::cout << bits << '\n';
    std::cout << "POW2 " << (power_of_two ? "YES" : "NO") << '\n';
    std::cout << cleared << '\n';
}
'''
