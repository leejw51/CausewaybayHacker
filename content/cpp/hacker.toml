[[quest]]
id           = "cpp.hacker.26.statistics"
node         = 26
title        = "SIX DECIMAL PLACES"
difficulty   = 3
time_limit_s = 900
story        = "They want the numbers rounded the way the spec says, not the way your language happens to print them."
concepts     = ["math", "sorting", "types"]
requires     = ["cpp.hacker.25.test-cases"]
map          = { x = 0.394, y = 0.686, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

Print three lines, each to **six decimal places**: the mean, the **population**
standard deviation (divide by `n`, not `n - 1`), and the median — which for an
even `n` is the average of the two middle values.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

This quest is judged with `match = "float:1e-6"`, so the comparison is
numeric: `3.8` and `3.800000` both pass, and a value that is off by `1e-7`
passes too. That is deliberate — the point is not your formatter, it is that
`sum / n` in integer arithmetic gives `3`, and that the even-length median is
a boundary people get wrong under a clock.

`std::cout << std::fixed << std::setprecision(6)` from `<iomanip>` is the
formatter; `printf("%.6f")` is the other one and is just as correct.
Population, not sample. Read the statement twice; on a real screen the
difference between `/ n` and `/ (n - 1)` is the whole submission.
'''
starter      = '''
#include <algorithm>
#include <iomanip>
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> values(n);
    for (long long& v : values) {
        std::cin >> v;
    }

    // integer division, so the mean is wrong before anything else is
    long long sum = 0;
    for (long long v : values) sum += v;
    long long mean = sum / n;
    std::sort(values.begin(), values.end());

    std::cout << std::fixed << std::setprecision(6);
    std::cout << static_cast<double>(mean) << '\n';
    std::cout << 0.0 << '\n';
    std::cout << static_cast<double>(values[n / 2]) << '\n';
}
'''
solution     = '''
#include <algorithm>
#include <cmath>
#include <iomanip>
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> values(n);
    for (long long& v : values) {
        std::cin >> v;
    }

    double count = static_cast<double>(n);
    double sum = 0.0;
    for (long long v : values) sum += static_cast<double>(v);
    double mean = sum / count;

    double variance = 0.0;
    for (long long v : values) {
        double delta = static_cast<double>(v) - mean;
        variance += delta * delta;
    }
    variance /= count;

    std::sort(values.begin(), values.end());
    int middle = n / 2;
    double median = n % 2 == 1
        ? static_cast<double>(values[middle])
        : (static_cast<double>(values[middle - 1]) + static_cast<double>(values[middle])) / 2.0;

    std::cout << std::fixed << std::setprecision(6);
    std::cout << mean << '\n';
    std::cout << std::sqrt(variance) << '\n';
    std::cout << median << '\n';
}
'''
hints = [
  "Cast to double before you divide, not after. sum / n on two integers has already thrown the fraction away.",
