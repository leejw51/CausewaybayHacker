solution     = '''
#include <algorithm>
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<std::vector<long long>> grid(n, std::vector<long long>(n));
    for (auto& row : grid) {
        for (long long& v : row) {
            std::cin >> v;
        }
    }
    // the spiral wants the original, so keep a copy before rotating in place
    std::vector<std::vector<long long>> original = grid;

    for (int r = 0; r < n; ++r) {
        for (int c = r + 1; c < n; ++c) {
            std::swap(grid[r][c], grid[c][r]);
        }
    }
    for (auto& row : grid) {
        std::reverse(row.begin(), row.end());
    }
    for (const auto& row : grid) {
        for (int c = 0; c < n; ++c) {
            std::cout << (c ? " " : "") << row[c];
        }
        std::cout << '\n';
    }

    std::vector<long long> spiral;
    int top = 0, bottom = n - 1, left = 0, right = n - 1;
    while (top <= bottom && left <= right) {
        for (int c = left; c <= right; ++c) spiral.push_back(original[top][c]);
        ++top;
        for (int r = top; r <= bottom; ++r) spiral.push_back(original[r][right]);
        --right;
        if (top <= bottom) {
            for (int c = right; c >= left; --c) spiral.push_back(original[bottom][c]);
            --bottom;
        }
        if (left <= right) {
            for (int r = bottom; r >= top; --r) spiral.push_back(original[r][left]);
            ++left;
        }
    }
    for (std::size_t i = 0; i < spiral.size(); ++i) {
        std::cout << (i ? " " : "") << spiral[i];
    }
    std::cout << '\n';
}
'''
