[[quest]]
id           = "cpp.hacker.06.stack"
node         = 6
title        = "THE NEXT BIGGER ONE"
difficulty   = 4
time_limit_s = 900
story        = "A column of fares on the board and one question: for each of them, which is the next one after it that is bigger."
concepts     = ["stacks-queues", "slices", "complexity"]
requires     = ["cpp.hacker.05.binary-search"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

For each entry print the first entry **to its right** that is strictly
greater, or `-1` if there is none. Put them on one line, space separated. Then
print `NONE <k>`, how many of them were `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Keep a stack of positions whose answer is still unknown, and it stays
decreasing from the bottom up. Each position is pushed once and popped once,
so the whole thing is one pass however it looks.

The cases here are small and the clock is not measuring speed, and on this
question a big case would not help. Scanning right from each position until
something bigger turns up finds its answer within a couple of steps on random
values and beats any clock at any size — `n = 200000` in well under a
hundredth of a second, measured. What a big case would reject is a descending
array, which is the one input that makes that scan quadratic. The stack is
still the answer: it is one pass on *every* input rather than on most of them.
'''
starter      = '''
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> answer(n, -1);
    std::vector<int> pending;
    (void)pending;

    for (int i = 0; i < n; ++i) {
        std::cout << (i ? " " : "") << answer[i];
    }
    std::cout << '\n';
    std::cout << "NONE " << n << '\n';
}
'''
solution     = '''
#include <iostream>
#include <vector>

int main() {
    int n = 0;
    std::cin >> n;
    std::vector<long long> nums(n);
    for (long long& v : nums) {
        std::cin >> v;
    }

    std::vector<long long> answer(n, -1);
    std::vector<int> pending;  // indices still waiting for their answer

    for (int i = 0; i < n; ++i) {
        while (!pending.empty() && nums[pending.back()] < nums[i]) {
            answer[pending.back()] = nums[i];
            pending.pop_back();
        }
        pending.push_back(i);
    }

    int none = 0;
    for (int i = 0; i < n; ++i) {
        std::cout << (i ? " " : "") << answer[i];
        if (answer[i] == -1) {
            ++none;
        }
    }
    std::cout << '\n';
    std::cout << "NONE " << none << '\n';
}
'''
hints = [
  "The stack holds indices that are still waiting for their answer, not values. A std::vector with push_back and pop_back is the stack.",
  "When the new value beats the value at the top of the stack, that index's answer is the new value — and keep popping, it may beat several.",
  "Strictly greater, so equal values do not resolve each other; they stack up and resolve together later.",
]

