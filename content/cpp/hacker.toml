solution     = '''
#include <iostream>
#include <string>
#include <vector>

bool search(std::vector<std::string>& grid, int r, int c, const std::string& word, std::size_t at) {
    if (grid[r][c] != word[at]) {
        return false;
    }
    if (at + 1 == word.size()) {
        return true;
    }

    char here = grid[r][c];
    grid[r][c] = '#';

    // || short-circuits, so the first direction that spells the rest of the
    // word stops the other three from being tried at all
    int rows = static_cast<int>(grid.size());
    int cols = static_cast<int>(grid[0].size());
    bool found = (r > 0 && search(grid, r - 1, c, word, at + 1))
        || (r + 1 < rows && search(grid, r + 1, c, word, at + 1))
        || (c > 0 && search(grid, r, c - 1, word, at + 1))
        || (c + 1 < cols && search(grid, r, c + 1, word, at + 1));

    grid[r][c] = here;
    return found;
}

int main() {
    int rows = 0;
    int cols = 0;
    std::cin >> rows >> cols;
    std::vector<std::string> grid(rows);
    for (std::string& row : grid) {
        std::cin >> row;
    }
    std::string word;
    std::cin >> word;

    // count the starting letters before any cell is marked
    int starts = 0;
    for (const std::string& row : grid) {
        for (char cell : row) {
            if (cell == word[0]) {
                ++starts;
            }
        }
    }

    bool found = false;
    for (int r = 0; r < rows && !found; ++r) {
        for (int c = 0; c < cols && !found; ++c) {
            found = search(grid, r, c, word, 0);
        }
    }

    std::cout << (found ? "FOUND" : "ABSENT") << '\n';
    std::cout << "STARTS " << starts << '\n';
}
'''
