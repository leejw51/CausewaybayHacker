[[quest]]
id           = "cpp.hacker.12.heap"
node         = 12
title        = "K SORTED QUEUES"
difficulty   = 5
time_limit_s = 1200
story        = "Every branch sends its dockets already in order. Merge them into one line without sorting the lot again."
concepts     = ["heaps", "sorting", "complexity"]
requires     = ["cpp.hacker.11.bst"]
map          = { x = 0.396, y = 0.276, kind = "quest" }
brief        = '''
Line one is `k`. Then `k` lines, each a count followed by that many integers,
already sorted ascending.

Print all of them merged into one ascending line, space separated, then
`POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

`std::priority_queue` is a **max**-heap. To use it as a min-heap, give it
`std::greater<>` as its third template argument — and its second, the
container, has to be spelled out to get there:
`std::priority_queue<T, std::vector<T>, std::greater<T>>`. That is the whole
C++-specific trick, and it is what the question is checking.

The heap holds one entry per list, not one per element, so it stays at size
`k` however long the lists are.

The cases here are small and the clock is not measuring speed, and on this
question no case could. Pouring every list into one `std::vector` and calling
`std::sort` passes these, and would pass a big one too: `O(N log N)` against
the heap's `O(N log k)` is not a gap a run limit can see. What is being checked
is that you can spell the min-heap. What the interviewer is listening for is
the one-entry-per-list invariant, which is the part that matters when the
lists do not fit in memory at once.
'''
starter      = '''
#include <functional>
#include <iostream>
#include <queue>
#include <tuple>
