[[quest]]
id          = "cpp.verybasic.03.floats"
node        = 3
title       = "THE TIDE IN DECIMALS"
difficulty  = 1
story       = "The tide table divides one reading by another and prints whole numbers where the harbour master wanted two decimals."
concepts    = ["types", "io"]
requires    = ["cpp.verybasic.02.int-types"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Read two positive integers `a` and `b`. The program needs `q`, the quotient
as a `double` — one integer divided by another is an integer unless one of
them is converted first.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  7 2
output: 3.50
```
'''
starter     = '''
#include <iomanip>
#include <iostream>

int main() {
    long long a = 0, b = 0;
    std::cin >> a >> b;
    double q = 0;  // FILL: a divided by b, as a double
    std::cout << std::fixed << std::setprecision(2) << q << '\n';
}
'''
solution    = '''
#include <iomanip>
#include <iostream>

int main() {
    long long a = 0, b = 0;
    std::cin >> a >> b;
    double q = static_cast<double>(a) / b;
    std::cout << std::fixed << std::setprecision(2) << q << '\n';
}
'''
hints = [
  "`double q = static_cast<double>(a) / b;` — convert one side before dividing.",
  "`a / b` with two integers rounds down to an integer before it becomes a double.",
]

[quest.quiz]
choices = [

  "double q = static_cast<double>(a) / b;",
  "double q = a / b;",
  "double q = a / b.0;",
  "float q = a / static_cast<float>(b)",
]
answer  = 0

