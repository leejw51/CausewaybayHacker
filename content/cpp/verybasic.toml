struct Node {
    long long val;
    Node* left = nullptr;
    Node* right = nullptr;
};

Node* insert(Node* n, long long v) {
    if (!n) return new Node{v};
    // FILL: send v down the correct side, storing what comes back
    if (v < n->val) n->left = insert(n->left, v); else n->right = insert(n->right, v);
    return n;
}

void inorder(const Node* n, std::vector<long long>& out) {
    if (!n) return;
    inorder(n->left, out);
    out.push_back(n->val);
    inorder(n->right, out);
}

int main() {
    std::string line;
    std::getline(std::cin, line);
    std::istringstream in(line);
    Node* root = nullptr;
    long long x = 0;
    while (in >> x) root = insert(root, x);
    std::vector<long long> out;
    inorder(root, out);
    for (size_t i = 0; i < out.size(); ++i) {
        std::cout << out[i] << (i + 1 < out.size() ? ' ' : '\n');
    }
}
