brief       = '''
Read one word, `island` or `tsuenwan`. The program needs `line`, a `Line`
enumerator chosen by the word; the `switch` that prints the colour is
written. An `enum class` enumerator is always written with its type.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  tsuenwan
output: red
```
'''
starter     = '''
#include <iostream>
#include <string>

enum class Line { Island, TsuenWan };

int main() {
    std::string word;
    std::cin >> word;
    Line line = Line::Island;  // FILL: Island for "island", TsuenWan otherwise
    switch (line) {
        case Line::Island: std::cout << "blue\n"; break;
        case Line::TsuenWan: std::cout << "red\n"; break;
    }
}
'''
solution    = '''
#include <iostream>
#include <string>

enum class Line { Island, TsuenWan };

int main() {
    std::string word;
    std::cin >> word;
    Line line = word == "island" ? Line::Island : Line::TsuenWan;
    switch (line) {
        case Line::Island: std::cout << "blue\n"; break;
        case Line::TsuenWan: std::cout << "red\n"; break;
    }
}
'''
