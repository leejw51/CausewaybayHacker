# C++ LAND — VERY BASIC. The typhoon shelter at first light. The grammar
# asked as a question first: each node is one construct — a type, a string,
# a loop, a function, a struct, an enum, a vector, a list, a map, a hash
# table, a set, a stack, a queue, a heap, a sort, a lambda, a thread, a
# mutex, a tree — with four candidate lines, one right. Pick it, then type it
# where the `// FILL` comment is. One line, every time; the answer is given
# away nowhere but the quiz, and verify_pack swaps every wrong choice into the
# solution to prove it fails. The road for the grammar a live coding test
# leans on.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "cpp.verybasic"
land = "cpp"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "cpp.verybasic.01.print"
node        = 1
title       = "THE GUN'S FIRST WORD"
difficulty  = 1
story       = "12:00 at the Noon Day Gun. The firing log is meant to open with one line and the line is missing."
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
The program must print exactly `hello, causewaybay` and a newline. In C++
that is one statement sent to the standard output stream.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  (nothing)
output: hello, causewaybay
```
'''
starter     = '''
#include <iostream>

int main() {
    // FILL: print the greeting
}
'''
solution    = '''
#include <iostream>

int main() {
    // FILL: print the greeting
    std::cout << "hello, causewaybay" << '\n';
}
'''
hints = [
  "`std::cout << \"hello, causewaybay\" << '\\n';` — the stream, the string, the newline, the semicolon.",
  "Single quotes make a character constant; a string needs double quotes.",
]

[quest.quiz]
choices = [

  "std::cout << \"hello, causewaybay\" << '\\n';",
  "std::cout << \"hello, causewaybay\"",
  "std::cout << \"hello causewaybay\" << '\\n';",
  "std::cout << 'hello, causewaybay' << '\\n';",
]
answer  = 0

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
  { name = "ignores-input", stdin = "12\n", expect = "hello, causewaybay\n", visible = false },
  { name = "twice-ignored", stdin = "a b\n", expect = "hello, causewaybay\n", visible = false },
]

