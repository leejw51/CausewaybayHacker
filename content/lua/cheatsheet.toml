# LUA LAND — CHEATSHEET. The grammar off the page, asked: thirty of the Lua
# lines a live-coding test leans on and a hand forgets — io.read, `~=`, `#t`,
# `local`, `..`, ipairs, string.format, a table.sort comparator, a closure
# that keeps its count, setmetatable, the `:` call and pcall, then
# table.remove, gmatch + tonumber, 1-based sub, pairs vs ipairs,
# select("#", ...), table.concat, math.floor and `%` below zero,
# string.byte/char, and the ten that close the core grammar: table.insert,
# a numeric for with a step, `(x or 0) + 1`, a local function, two return
# values caught at once, `#t == 0`, the one-line swap, error(), the
# `and … or` conditional and a list copy through unpack — in Tai Hang on
# fire-dragon night. Four lines, one right. Nothing is typed and nothing is
# run — the pick is the submission, and the server judges it against the quiz
# (SPEC §0). The three wrong lines are near-misses: another language's
# spelling, a `.` where a `:` goes, a call made outside the protection.
#
# Every right answer here means the same thing in Lua 5.1 (the land's LuaJIT
# runtime) and Lua 5.4, except node 30, the one deliberate 5.1-ism: `unpack`
# is a global there and table.unpack does not exist. Nothing leans on `//`.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "lua.cheatsheet"
land = "lua"
category = "cheatsheet"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "lua.cheatsheet.01.read-line"
node        = 1
title       = "THE FIRST LINE"
difficulty  = 1
story       = "21:00 on Wun Sha Street. The crew list comes in one line at a time."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
Read one line of standard input into `line`, as a string, without its
newline.
'''
solution    = 'local line = io.read("*l")'
hints = [
  "io.read takes a format: one for a line, one for a number, one for all of it.",
]

[quest.quiz]
choices = [
  'local line = io.read("*n")',
  'local line = io.readline()',
  'local line = input()',
  'local line = io.read("*l")',
]
answer  = 3

