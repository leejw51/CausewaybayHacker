  local results = {}
  for i = 1, #nums do results[i] = 0 end

  local function square(i)
    coroutine.yield()
    results[i] = nums[i] * nums[i]
  end

  local workers = {}
  for i = 1, #nums do workers[i] = coroutine.create(function() square(i) end) end
  for _, co in ipairs(workers) do
    -- FILL: start it: run it to its first yield
    -- ANSWER: coroutine.resume(co)
  end
  for _, co in ipairs(workers) do
    -- FILL: wait for it: resume until its status is "dead"
    -- ANSWER: while coroutine.status(co) ~= "dead" do coroutine.resume(co) end
  end
  local total = 0
  for _, r in ipairs(results) do total = total + r end
  print(table.concat(results, " "))
