becomes a new `Node`; otherwise the value goes down one side, and whatever
comes back is stored as that child again, because the child may have been
`nil` a moment ago — a missing key is nil, and nil is not an error until it
is followed. Following `.left` on a `nil` is the crash this whole road is
named after; the `nil` check comes first, and it is written.

```
if v < n.val then
  n.left = insert(n.left, v)
else
  n.right = insert(n.right, v)
end
