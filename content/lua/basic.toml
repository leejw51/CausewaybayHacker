[[quest]]
id          = "lua.basic.09.int-slices"
node        = 9
title       = "TWO OFF THE TOP"
difficulty  = 1
story       = "The route board wants the second and third segment numbers copied out, the last two tacked on after them, and the original list left exactly as written."
concepts    = ["slices", "collections"]
requires    = ["lua.basic.08.string-slices"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''Lua has no slice; the nearest is `unpack(v, i, j)`, which returns the values
at `i` through `j` as separate values, and `{ ... }` around it collects them
into a **new table** — changing it never changes `v`. Positions count from 1
and both ends are included, so the second and third values are `2, 3`.
`table.insert(t, x)` appends `x`; `#v` is the last position, so `v[#v - 1]`
and `v[#v]` are the last two.

```
local part = { unpack(v, 2, 3) }
table.insert(part, v[#v - 1]); table.insert(part, v[#v])
```

`v` holds the line's integers and both prints are written. Type the two
lines above in place of the two placeholders.

```
input:  1 2 3 4 5
output: 2 3 4 5
        1 2 3 4 5
```
'''
starter     = '''local function read_nums()
  local xs = {}
  for t in io.read("*l"):gmatch("%S+") do xs[#xs + 1] = tonumber(t) end
  return xs
end

local function main()
  local v = read_nums()
  local part = {}  -- FILL: a copy of the values at positions 2 and 3
  -- ANSWER: local part = { unpack(v, 2, 3) }
  -- FILL: append the last two values of v to part
  -- ANSWER: table.insert(part, v[#v - 1]); table.insert(part, v[#v])
  print(table.concat(part, " "))
  print(table.concat(v, " "))
end

main()
'''
solution    = '''local function read_nums()
  local xs = {}
  for t in io.read("*l"):gmatch("%S+") do xs[#xs + 1] = tonumber(t) end
  return xs
end

local function main()
  local v = read_nums()
  local part = { unpack(v, 2, 3) }
  table.insert(part, v[#v - 1]); table.insert(part, v[#v])
  print(table.concat(part, " "))
  print(table.concat(v, " "))
