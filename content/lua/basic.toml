brief       = '''
Print exactly:

```
hello, causewaybay
```

Lowercase, one comma, one space, one line. Nothing else.

`print` adds the newline for you. It also puts a **tab** between arguments,
which is the first thing about it that people get wrong: `print("hello,",
"causewaybay")` has a tab in it, not a space. One string, one argument.
'''
starter     = '''
local function main()
  -- your code here
  -- ANSWER: print("hello, causewaybay")
end

main()
'''
solution    = '''
local function main()
  print("hello, causewaybay")
end

main()
'''
hints = [
  "print(\"hello, causewaybay\") is the whole program.",
  "The string is exact: lowercase, one comma, one space after it.",
  "Leave the `main()` call at the bottom. A function that is never called prints nothing, and the starter is exactly that.",
]

[quest.tests]
