[[quest]]
id          = "lua.basic.04.int-types"
node        = 4
title       = "FOUR BYTES WIDE"
difficulty  = 1
story       = "The drum controller on the lorry keeps each beat count in four bytes and prints the biggest number it can hold on its little screen, and the screen is dark."
concepts    = ["types", "bindings"]
requires    = ["lua.basic.03.types"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''A Lua number has no integer width, but the `bit` library does: every one of
its operations works on **32 bits**. `bit.tohex(n, 8)` shows `n` as those
four bytes, eight hex digits, most significant first, so `bit.tohex(-1, 8)`
is `ffffffff`. The largest signed 32-bit value is `2^31 - 1` (`^` is the
power operator; there is no `<<`, that is `bit.lshift`). Exact counting in
a double stops at `2^53`; past that LuaJIT has 64-bit literals with an
`LL` or `ULL` suffix, which print with the suffix on.

```
print(bit.tohex(n, 8))
print(2^31 - 1)
```

`n` is read and the unsigned 64-bit maximum is printed last, from a `ULL`
literal with its suffix stripped. Type the two lines above in place of the
two `-- FILL` markers.

```
input:  7
output: 00000007
        2147483647
        18446744073709551615
```
'''
starter     = '''local function main()
  local n = tonumber(io.read("*l"))
  -- FILL: print n as four big-endian bytes, in hex
  -- ANSWER: print(bit.tohex(n, 8))
  -- FILL: print the largest signed 32-bit integer
  -- ANSWER: print(2^31 - 1)
  print((tostring(18446744073709551615ULL):gsub("ULL$", "")))
end

main()
'''
solution    = '''local function main()
  local n = tonumber(io.read("*l"))
  print(bit.tohex(n, 8))
  print(2^31 - 1)
  print((tostring(18446744073709551615ULL):gsub("ULL$", "")))
end

main()
'''
hints = [
  "print(bit.tohex(n, 8)) — the second argument is how many hex digits; 8 digits are 4 bytes.",
  "2^31 - 1 is 2147483647: a double holds it exactly and print shows it without a decimal point.",
]

