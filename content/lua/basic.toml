[[quest]]
id          = "lua.basic.02.segment-count"
node        = 2
title       = "THE SEGMENT COUNT"
difficulty  = 1
story       = "The dragon's head handler shouts the segment count down the lane, and the tally board under the banyan shows a zero where the count, the count doubled and the count squared should be."
concepts    = ["io", "bindings", "types"]
requires    = ["lua.basic.01.first-incense"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''`io.read("*l")` reads one line from standard input, newline stripped, and
gives it back as a **string**. `tonumber()` turns the text into a number
(and `nil` if it is not one). Lua would quietly coerce `"12" * 2` for you,
but `"12" .. 1` is `"121"` and `"12" < 1` is an error, so a number is
converted at the door and stays a number after it.

```
local n = tonumber(io.read("*l"))
```

The three `print` lines are written. Type the first line of `main` as
shown, so `n` is the number on the line, not the `0` it starts as.

```
input:  12
output: 12
        24
        144
```
'''
starter     = '''local function main()
  local n = 0  -- FILL: read the line as a number
  -- ANSWER: local n = tonumber(io.read("*l"))
  print(n)
  print(n * 2)
  print(n * n)
end

main()
'''
solution    = '''local function main()
  local n = tonumber(io.read("*l"))
  print(n)
  print(n * 2)
  print(n * n)
end

main()
'''
hints = [
  "The starter prints 0 three times: n was never read. The line is still sitting in standard input.",
  "local n = tonumber(io.read(\"*l\")) reads and converts in one go. tonumber ignores the spaces around the digits for you.",
  "A negative n squared is positive. The test knows.",
]

