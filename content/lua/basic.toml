brief       = '''A Lua number is a 64-bit double — `f64` in other lands. There is no 32-bit
float type, but LuaJIT's `ffi` can make one: `ffi.new("float[1]", x)` is a
C array of one `float` holding `x`, and reading `[0]` out of it gives `x`
back rounded to the nearest `f32`. `string.format` with `%.3f` prints three
decimals; `%.10f` prints enough to see the rounding. (Where Python packs
and unpacks a `struct`, Lua goes through a C type.)

```
local x = tonumber(s)
local y = ffi.new("float[1]", x)[0]
```

`ffi` is required, `s` is read and both prints are written. Type the two
lines above in place of the two placeholders.

```
input:  0.1
output: 0.100
        0.1000000015
```
'''
starter     = '''local ffi = require("ffi")

local function main()
  local s = io.read("*l")
  local x = 0  -- FILL: the text as a number (f64)
  -- ANSWER: local x = tonumber(s)
  local y = 0  -- FILL: x round-tripped through a 32-bit float
  -- ANSWER: local y = ffi.new("float[1]", x)[0]
  print(string.format("%.3f", x))
  print(string.format("%.10f", y))
end

main()
'''
solution    = '''local ffi = require("ffi")

local function main()
  local s = io.read("*l")
  local x = tonumber(s)
  local y = ffi.new("float[1]", x)[0]
  print(string.format("%.3f", x))
  print(string.format("%.10f", y))
end

main()
'''
