brief       = '''Lua has one number type, a 64-bit double, and one division: `7 / 2` is
`3.5`, and `6 / 2` is `3` and prints as `3`. Integer division is
`math.floor(a / b)`, and `%` is the remainder. To print a number with a
fixed count of decimals, hand it to `string.format` with a `%.2f` — two
digits after the point — and print the string that comes back. (Where
Python writes an f-string, Lua writes `string.format` with the values after
the pattern.)

```
print(math.floor(a / b))
print(a % b)
print(string.format("%.2f", a / b))
```

`a` and `b` are read with `io.read("*n", "*n")` — two numbers off the input
— and the first two prints are written. Type the third `print` line
exactly as shown.

```
input:  7 2
output: 3
        1
        3.50
```
'''
starter     = '''local function main()
  local a, b = io.read("*n", "*n")
  print(math.floor(a / b))
  print(a % b)
  print("?")  -- FILL: a / b with two decimals
  -- ANSWER: print(string.format("%.2f", a / b))
end

main()
'''
solution    = '''local function main()
  local a, b = io.read("*n", "*n")
  print(math.floor(a / b))
  print(a % b)
  print(string.format("%.2f", a / b))
end

main()
'''
hints = [
  "print(string.format(\"%.2f\", a / b)) — the pattern first, then the value it formats.",
  "%.2f is a C format: f for a float, .2 for two digits after the point. print(a / b) alone would print 3.5, one digit short.",
]

