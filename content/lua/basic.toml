# LUA LAND — BASIC. The grammar road: Tai Hang on the fifteenth night of the
# eighth month, from the 21:00 lighting of the incense to the fire dragon's
# last turn into Wun Sha Street, one construct per node. This is grammar
# practice, not a quiz: the brief explains one thing and shows how it is
# written, the starter is the whole program, and the player types the one or
# two lines that use it — tonumber and io.read, string.format, bit.tohex and
# a 64-bit literal, a 256-bit number kept as digits, a float through the ffi,
# string methods, sub and .., unpack as the slice, bytes as numbers, a
# numeric for, a function, a metatable class, a table of named constants as
# the enum, table.insert/remove/sort, a table edited at both ends, a table as
# the map and as the hash table and as the set, a stack and a queue, sort
# with a comparator, a swap in one assignment, a closure, anonymous functions
# through map and filter, coroutines, and the two recursive lines of a binary
# search tree for the boss. Everything is a table, the segments start at 1,
# and a missing key is nil. Nothing here is timed, and verify_pack refuses a
# basic solution that adds more than four lines over its starter (two on
# every node but the container drills).
#
# Every program is one main.lua, syntax-checked by `luajit -b main.lua
# main.luac` and run as `luajit main.lua`. The runtime is LuaJIT 2.1 — Lua
# 5.1 plus LuaJIT's extensions: `6 / 2` prints `3`, `unpack` is global, bits
# are `bit.*`, and a 64-bit integer is an `LL`/`ULL` literal. Standard input
# is read with `io.read("*l")` (one line, newline stripped), `io.read("*n")`
# (one number) or `io.read("*a")` (all of it); output goes through `print`,
# which puts a TAB between arguments, so a space-separated line is built
# with `..` or `table.concat(t, " ")`.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "lua.basic"
land = "lua"
category = "basic"
version = 1

