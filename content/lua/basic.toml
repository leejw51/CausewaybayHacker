brief       = '''LuaJIT has no threads; a coroutine is the nearest thing — a function with
its own stack that runs when it is resumed and stops at each `yield`.
`coroutine.create(f)` makes one and runs nothing. `coroutine.resume(co)`
starts it, or continues it from its last yield, and returns when it yields
again or finishes. `coroutine.status(co)` is `"dead"` once it has finished,
so a join is resuming until it is. Start every runner first, then finish
every runner — a finish inside the start loop would run them one at a time.

```
for _, co in ipairs(workers) do
  coroutine.resume(co)
end
for _, co in ipairs(workers) do
  while coroutine.status(co) ~= "dead" do coroutine.resume(co) end
end
```

