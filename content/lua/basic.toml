  print(height(root))
end

main()
'''
solution    = '''local Node = {}
Node.__index = Node

function Node.new(val)
  return setmetatable({ val = val }, Node)
end

local function insert(n, v)
  if n == nil then return Node.new(v) end
  if v < n.val then
    n.left = insert(n.left, v)
  else
    n.right = insert(n.right, v)
  end
  return n
end

local function inorder(n, out)
  if n == nil then return end
  inorder(n.left, out)
  out[#out + 1] = n.val
  inorder(n.right, out)
end

local function height(n)
  if n == nil then return 0 end
  return 1 + math.max(height(n.left), height(n.right))
end

local function main()
  local root = nil
  for tok in io.read("*l"):gmatch("%S+") do
    root = insert(root, tonumber(tok))
  end
  local out = {}
  inorder(root, out)
  print(table.concat(out, " "))
  print(height(root))
end

main()
'''
