map         = { x = 0.90, y = 0.33, kind = "quest" }
brief       = '''
`counts` was made as

```
local counts = setmetatable({}, {__index = function() return 0 end})
```

so any missing key reads as `0`. Open an `if` that is true only when `k`
has **really** been stored in `counts` — a stored `0` counts as stored, a
never-written key does not.
'''
solution    = 'if rawget(counts, k) ~= nil then'
hints = [
  "A normal read goes through the default; the read that skips the metatable is a global function, not a method.",
]

[quest.quiz]
choices = [
  'if counts[k] ~= nil then',
  'if counts[k] ~= 0 then',
  'if counts:rawget(k) ~= nil then',
  'if rawget(counts, k) ~= nil then',
]
answer  = 3

