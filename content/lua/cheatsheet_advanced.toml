solution    = 'local out, n = s:gsub("%f[%w]the%f[%W]", "")'
hints = [
  "Lua patterns have no `\\b`; the frontier item matches the empty transition into or out of a character class, including at the ends of the string.",
]

[quest.quiz]
choices = [
  'local out, n = s:gsub("the", "")',
  'local out, n = s:gsub("\\bthe\\b", "")',
  'local out, n = s:gsub("[^%w]the[^%w]", "")',
  'local out, n = s:gsub("%f[%w]the%f[%W]", "")',
]
answer  = 3

