# LUA LAND — CHEATSHEET ADVANCED. The grammar past the napkin, asked: thirty
# of the Lua lines an interviewer uses to tell a fluent hand from one who only
# knows the basics — `__index` and the class pattern, inheritance through a
# second metatable, `__lt`/`__eq`/`__call`, `rawset` inside `__newindex`,
# `rawget` past a default, the `__len` that LuaJIT ignores, a closure per
# loop iteration, `select(2, ...)`, `unpack(t, 1, n)`, `(f())` truncation,
# `coroutine.wrap`/`resume` with values both ways, `error` with a table,
# `xpcall` + `debug.traceback`, gmatch captures, gsub with a table and its
# count, the `%f` frontier, `%-10s|%5.2f|%03d`, the `>=` comparator that
# raises, `next(t) == nil`, `%d` for sixteen digits, `bit.band`, the ffi's
# `int[?]`, `goto continue`, `local function` recursion, a weak-keyed cache
# and `setfenv` — in Tai Hang on fire-dragon night. Four lines, one right.
# Nothing is typed and nothing is run — the pick is the submission, and the
# server judges it against the quiz (SPEC §0). The three wrong lines are
# near-misses: the `__call` on the wrong table, `t[k] = v` inside the
# handler that fires on `t[k] = v`, the `and … or` that swallows `false`.
#
# Every right answer here is LuaJIT 2.1's Lua — 5.1 plus `bit`, `ffi` and
# `goto` — the land's runtime (the one the LÖVE client ships). Nothing on
# this road leans on `//`, native bitwise operators, `continue`,
# `table.unpack` or a `__len` on a table; where one of those is offered it
# is a wrong line. The BASIC road (`lua.cheatsheet`) is the core grammar;
# none of its questions is repeated here.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "lua.cheatsheet_advanced"
land     = "lua"
category = "cheatsheet_advanced"
version  = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "lua.cheatsheet_advanced.01.class-index"
node        = 1
title       = "THE TABLE THAT ANSWERS"
difficulty  = 3
story       = "21:00 on Wun Sha Street. Every dragon segment is a table, and Mei wants the methods kept in one place."
concepts    = ["structs", "dispatch"]
requires    = []
map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
`Dragon` is a table of methods (`Dragon.length`, …) and its constructor is
already written:

```
function Dragon.new(n)
  return setmetatable({n = n}, Dragon)
end
```

Write the one line, placed before the constructor, that makes
`Dragon.new(3):length()` find `Dragon.length`.
'''
solution    = 'Dragon.__index = Dragon'
hints = [
  "An instance's metatable is `Dragon`; a missing key is looked up in whatever that metatable's lookup field points at — and it can point at the class itself.",
]

[quest.quiz]
choices = [
  'Dragon.__index = Dragon.new',
  'Dragon.__index = Dragon',
  'Dragon.index = Dragon',
  'setmetatable(Dragon, Dragon)',
]
answer  = 1

# ---------------------------------------------------------------- 02
[[quest]]
id          = "lua.cheatsheet_advanced.02.inherit"
node        = 2
title       = "THE SEGMENT UNDER THE LANTERN"
difficulty  = 3
story       = "A lantern is a segment with a flame on top; what it cannot do itself, the segment underneath does."
concepts    = ["structs", "dispatch"]
requires    = ["lua.cheatsheet_advanced.01.class-index"]
map         = { x = 0.24, y = 0.10, kind = "quest" }
brief       = '''
`Segment` is a plain table of functions (`Segment.burn`, …) with no
metatable fields of its own. `Lantern` is a class in the usual pattern
(`Lantern.__index = Lantern`, instances made with `setmetatable({}, Lantern)`).
Write the one line that makes a lantern fall back to `Segment` for any
method `Lantern` does not define — while keeping `Lantern`'s own methods.
'''
solution    = 'setmetatable(Lantern, {__index = Segment})'
hints = [
  "The class itself needs a metatable; `Segment` has no lookup field, so it cannot be that metatable as it stands.",
]

[quest.quiz]
choices = [
  'setmetatable(Lantern, Segment)',
  'Lantern.__index = Segment',
  'setmetatable(Lantern, {__index = Segment})',
  'Lantern.__base = Segment',
]
answer  = 2

