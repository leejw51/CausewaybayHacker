[[quest]]
id          = "lua.cheatsheet_advanced.03.lt-sort"
node        = 3
title       = "THEY LINE UP THEMSELVES"
difficulty  = 3
story       = "The drum teams are scored; the marshal wants them sorted without writing a comparator every time."
concepts    = ["structs", "dispatch", "sorting"]
requires    = ["lua.cheatsheet_advanced.02.inherit"]
map         = { x = 0.42, y = 0.11, kind = "quest" }
brief       = '''
`Score` is a class (`Score.__index = Score`); each instance has a number
field `v`. `scores` is a list of them. Write the metamethod line so that
`table.sort(scores)` — **no comparator** — orders them smallest `v` first.
'''
solution    = 'Score.__lt = function(a, b) return a.v < b.v end'
hints = [
  "Without a comparator, sort compares with `<`, and `<` on two tables asks their metatable for one specific field.",
]

[quest.quiz]
choices = [
  'Score.__lt = function(a, b) return a.v < b.v end',
  'Score.__cmp = function(a, b) return a.v - b.v end',
  'Score.__lt = function(a, b) return a.v > b.v end',
  'Score.__sort = function(a, b) return a.v < b.v end',
]
answer  = 0

# ---------------------------------------------------------------- 04
[[quest]]
id          = "lua.cheatsheet_advanced.04.eq"
node        = 4
title       = "SAME POINT, TWO TABLES"
difficulty  = 4
story       = "Two runners mark the same spot on Tai Hang Road in two separate tables, and the map must call them equal."
concepts    = ["structs", "dispatch"]
requires    = ["lua.cheatsheet_advanced.03.lt-sort"]
map         = { x = 0.60, y = 0.10, kind = "quest" }
brief       = '''
`P` is a class (`P.__index = P`) whose instances have number fields `x` and
`y`. `a` and `b` are two **different** instances with equal fields. Write the
metamethod line that makes `a == b` true.
'''
solution    = 'P.__eq = function(a, b) return a.x == b.x and a.y == b.y end'
hints = [
  "Inside the metamethod, `a == b` on the two tables calls the metamethod again; compare the fields, not the tables.",
]

[quest.quiz]
choices = [
  'P.__eq = function(a, b) return rawequal(a, b) end',
  'P.__eq = function(a, b) return a == b end',
  'P.eq = function(a, b) return a.x == b.x and a.y == b.y end',
  'P.__eq = function(a, b) return a.x == b.x and a.y == b.y end',
]
answer  = 3

