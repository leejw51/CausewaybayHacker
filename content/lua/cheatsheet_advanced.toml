`log` is a list. `t` is an empty table whose metatable has:

```
__newindex = function(t, k, v)
  log[#log + 1] = k
  -- ____
end
```

Fill the blank so the value is really stored in `t` (a later `t[k]` reads
it back) **without** running this handler a second time.
'''
solution    = 'rawset(t, k, v)'
