[[quest]]
id          = "lua.cheatsheet_advanced.25.bit-test"
node        = 25
title       = "IS THE FLAG UP"
difficulty  = 4
story       = "Each segment's state is one number of flags; the marshal checks the one bit for `lit`."
concepts    = ["bit-manipulation", "control-flow"]
requires    = ["lua.cheatsheet_advanced.24.big-digits"]
map         = { x = 0.06, y = 0.92, kind = "quest" }
brief       = '''
`flags` is a number used as a row of bits and `i` is a bit position
counted from `0`; LuaJIT's `bit` library is loaded as `bit`. Open an `if`
that is true exactly when bit `i` of `flags` is set.
'''
solution    = 'if bit.band(flags, bit.lshift(1, i)) ~= 0 then'
hints = [
  "LuaJIT has no operator for this — it is two library calls — and `0` is true in Lua, so the result still has to be compared.",
]

[quest.quiz]
choices = [
  'if bit.band(flags, bit.lshift(1, i)) then',
  'if flags & (1 << i) ~= 0 then',
  'if bit.band(flags, bit.lshift(1, i)) ~= 0 then',
  'if bit.band(flags, bit.lshift(i, 1)) ~= 0 then',
]
answer  = 2

