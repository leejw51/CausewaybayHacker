[[quest]]
id          = "lua.cheatsheet_advanced.07.rawget-default"
node        = 7
title       = "WAS IT EVER WRITTEN"
difficulty  = 4
story       = "The count table answers zero for any name; the marshal wants to know which names were actually entered."
concepts    = ["collections", "zero-values", "dispatch"]
