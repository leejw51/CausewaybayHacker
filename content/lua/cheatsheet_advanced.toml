[[quest]]
id          = "lua.cheatsheet_advanced.26.goto-continue"
node        = 26
title       = "SKIP THIS ONE"
difficulty  = 3
story       = "Even-numbered segments rest this lap; the loop walks on past them without nesting the whole body in an `if`."
concepts    = ["control-flow", "iteration"]
requires    = ["lua.cheatsheet_advanced.25.bit-test"]
map         = { x = 0.27, y = 0.88, kind = "quest" }
brief       = '''
```
for _, v in ipairs(t) do
  -- ____
  io.write(v, " ")
  ::continue::
end
```

Fill the blank so even values are skipped and the loop carries on
(LuaJIT 2.1).
'''
solution    = 'if v % 2 == 0 then goto continue end'
hints = [
  "Lua has no `continue` keyword; LuaJIT does have the 5.2 jump statement, and the label at the end of the body is its target.",
]

[quest.quiz]
choices = [
  'if v % 2 == 0 then continue end',
  'if v % 2 == 0 then goto continue end',
  'if v % 2 == 0 then goto ::continue:: end',
  'if v % 2 == 0 then break end',
]
answer  = 1

