[[quest]]
id          = "lua.cheatsheet_advanced.22.sort-strict"
node        = 22
title       = "TIES WITHOUT A CRASH"
difficulty  = 4
story       = "Forty drum teams, most on the same score, and the sort raised `invalid order function` in front of the judges."
