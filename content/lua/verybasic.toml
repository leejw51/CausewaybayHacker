`pay(laps)` must return the pay: the first ten laps at 5 each, every lap after the tenth at 3. A function hands a value back with one keyword; a function that only prints hands back `nil`.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
input:  3
output: 15
```
