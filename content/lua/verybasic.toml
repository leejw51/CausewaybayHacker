[[quest]]
id          = "lua.verybasic.09.struct-method"
node        = 9
title       = "THE LINE TOTAL"
difficulty  = 1
story       = '''Price times quantity is one line of every order at the lantern-fair noodle stall, and the method that should say it says nothing.'''
concepts    = ["structs", "functions"]
requires    = ["lua.verybasic.08.structs"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''
`Stall:total()` must return price times quantity. A method declared with a colon has a hidden first parameter, `self`, and the object's fields are reached through it; `price` on its own is a global that was never set.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
input:  tofu 12 3
output: tofu: 36
```
'''
starter     = '''
local Stall = {}
Stall.__index = Stall

function Stall.new(name, price, qty)
  local self = setmetatable({}, Stall)
  self.name = name
  self.price = price
  self.qty = qty
  return self
end

function Stall:total()
  -- FILL: price times quantity
end

local name, price, qty = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
local s = Stall.new(name, tonumber(price), tonumber(qty))
print(s.name .. ": " .. s:total())
'''
solution    = '''
local Stall = {}
Stall.__index = Stall

function Stall.new(name, price, qty)
  local self = setmetatable({}, Stall)
  self.name = name
  self.price = price
  self.qty = qty
  return self
end

function Stall:total()
  return self.price * self.qty
end

local name, price, qty = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
local s = Stall.new(name, tonumber(price), tonumber(qty))
print(s.name .. ": " .. s:total())
'''
hints = [
  "return self.price * self.qty — both fields through self.",
  "price on its own is a global, nil, and nil cannot be multiplied.",
]

[quest.quiz]
choices = ["return price * qty", "return self.price * self.qty", "return self.price + self.qty", "return self.price * qty"]
answer  = 1

