[[quest]]
id          = "lua.verybasic.02.int-types"
node        = 2
title       = "THE INCENSE SPLIT"
difficulty  = 1
story       = '''The incense bundles are shared out across the dragon's segments at the Lin Fa Kung gate; the tally has to say how many each segment gets and how many are left over, and it says nothing.'''
concepts    = ["types", "io"]
requires    = ["lua.verybasic.01.print"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
`a` and `b` are integers. The program must print the whole-number quotient and the remainder on one line, separated by ONE space. LuaJIT has one number type and no integer-division operator: `/` gives the fraction, `math.floor` drops it, and `%` is the remainder. `print` puts a TAB between its arguments, so the two go into one string with `..` first.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
input:  7 2
output: 3 1
```
'''
starter     = '''
local a, b = io.read("*n", "*n")
-- FILL: quotient and remainder
'''
solution    = '''
local a, b = io.read("*n", "*n")
print(math.floor(a / b) .. " " .. a % b)
'''
hints = [
  "print(math.floor(a / b) .. \" \" .. a % b) — floor the division, then join with a space.",
  "a / b is 3.5, not 3. // is not an operator in LuaJIT. And print(x, y) separates with a tab, not a space.",
]

[quest.quiz]
choices = ["print(a / b .. \" \" .. a % b)", "print(math.floor(a / b) .. \" \" .. a % b)", "print(a // b .. \" \" .. a % b)", "print(math.floor(a / b), a % b)"]
answer  = 1

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "seven-two", stdin = "7 2\n", expect = "3 1\n", visible = true },
  { name = "ten-four", stdin = "10 4\n", expect = "2 2\n", visible = false },
  { name = "nine-three", stdin = "9 3\n", expect = "3 0\n", visible = false },
]

