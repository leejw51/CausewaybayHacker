Lua's standard library has no heap, so the starter carries a small `MinHeap` class: `push` adds a value and sifts it up, `pop` takes the smallest. Each `x` must go in through the heap's own method, called with a colon so the heap passes itself, so that `pop` later returns the smallest first. Writing into `items` directly skips the sift and breaks the order.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
input:  5 1 4 2 3
output: 1 2 3 4 5
```
'''
starter     = '''
local MinHeap = {}
MinHeap.__index = MinHeap

function MinHeap.new()
  return setmetatable({ items = {} }, MinHeap)
end

function MinHeap:push(v)
  local a = self.items
  a[#a + 1] = v
  local i = #a
  while i > 1 do
    local p = math.floor(i / 2)
    if a[p] <= a[i] then break end
    a[p], a[i] = a[i], a[p]
    i = p
  end
end

function MinHeap:pop()
  local a = self.items
  if #a == 0 then return nil end
  local top = a[1]
  local last = table.remove(a)
  if #a > 0 then
    a[1] = last
    local i = 1
    while true do
      local l, r, m = 2 * i, 2 * i + 1, i
      if l <= #a and a[l] < a[m] then m = l end
      if r <= #a and a[r] < a[m] then m = r end
      if m == i then break end
      a[m], a[i] = a[i], a[m]
      i = m
    end
  end
  return top
end

function MinHeap:size()
  return #self.items
end

local heap = MinHeap.new()
for tok in io.read("*l"):gmatch("%S+") do
  local x = tonumber(tok)
  -- FILL: push x, keeping the heap order
end
local out = {}
while heap:size() > 0 do
  out[#out + 1] = heap:pop()
end
print(table.concat(out, " "))
'''
solution    = '''
local MinHeap = {}
MinHeap.__index = MinHeap

function MinHeap.new()
  return setmetatable({ items = {} }, MinHeap)
end

function MinHeap:push(v)
  local a = self.items
  a[#a + 1] = v
  local i = #a
  while i > 1 do
    local p = math.floor(i / 2)
    if a[p] <= a[i] then break end
    a[p], a[i] = a[i], a[p]
    i = p
  end
end

function MinHeap:pop()
  local a = self.items
  if #a == 0 then return nil end
  local top = a[1]
  local last = table.remove(a)
  if #a > 0 then
    a[1] = last
    local i = 1
    while true do
      local l, r, m = 2 * i, 2 * i + 1, i
      if l <= #a and a[l] < a[m] then m = l end
      if r <= #a and a[r] < a[m] then m = r end
      if m == i then break end
      a[m], a[i] = a[i], a[m]
      i = m
    end
  end
  return top
end

function MinHeap:size()
  return #self.items
end

local heap = MinHeap.new()
for tok in io.read("*l"):gmatch("%S+") do
  local x = tonumber(tok)
  heap:push(x)
end
local out = {}
while heap:size() > 0 do
  out[#out + 1] = heap:pop()
end
print(table.concat(out, " "))
'''
