brief       = '''
One coroutine runs at a time, and still a race: each worker reads `counter`, yields, and writes it back, and the other three run in the gap. Lua has no mutex; `lock` is a small cooperative one, and its `acquire` yields until the lock is free and then takes it. Before the read, each worker must TAKE the lock through that method — with a colon, so the lock passes itself; the release is already written after the write.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
input:  1000
output: 4000
```
'''
starter     = '''
local Lock = {}
Lock.__index = Lock

function Lock.new()
  return setmetatable({ held = false }, Lock)
end

function Lock:acquire()
  while self.held do coroutine.yield() end
  self.held = true
end

function Lock:release()
  if not self.held then error("release of an unheld lock") end
  self.held = false
end

local counter = 0
local lock = Lock.new()

local function work(n)
  for _ = 1, n do
    -- FILL: take the lock
    local seen = counter
    coroutine.yield()
    counter = seen + 1
    lock:release()
  end
end

local n = tonumber(io.read("*l"))
local workers = {}
for i = 1, 4 do
  workers[i] = coroutine.create(function() work(n) end)
end
local running = true
while running do
  running = false
  for _, co in ipairs(workers) do
    if coroutine.status(co) ~= "dead" then
      running = true
      local ok, err = coroutine.resume(co)
      if not ok then error(err, 0) end
    end
  end
end
print(counter)
'''
solution    = '''
local Lock = {}
Lock.__index = Lock

function Lock.new()
  return setmetatable({ held = false }, Lock)
end

function Lock:acquire()
  while self.held do coroutine.yield() end
  self.held = true
end

function Lock:release()
  if not self.held then error("release of an unheld lock") end
  self.held = false
end

local counter = 0
local lock = Lock.new()

local function work(n)
  for _ = 1, n do
    lock:acquire()
    local seen = counter
    coroutine.yield()
    counter = seen + 1
    lock:release()
  end
end

local n = tonumber(io.read("*l"))
local workers = {}
for i = 1, 4 do
  workers[i] = coroutine.create(function() work(n) end)
end
local running = true
while running do
  running = false
  for _, co in ipairs(workers) do
    if coroutine.status(co) ~= "dead" then
      running = true
      local ok, err = coroutine.resume(co)
      if not ok then error(err, 0) end
    end
  end
end
print(counter)
'''
