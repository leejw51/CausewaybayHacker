# LUA LAND — VERY BASIC. The grammar as a question first: four lines, one of
# them right, and then that line typed. Types, tables, a stack, a queue, a
# heap, a metatable class, a coroutine, a lock — the constructs a HackerRank-
# style live coding test leans on, one per node, in Tai Hang on the fifteenth
# night of the eighth month, from the first lantern on Wun Sha Street at 21:00
# to the fire dragon's head, which is numbered 1 and not 0. Everything here is
# a table: a list is a table from 1, a set is a table whose keys are the
# values, a class is a table with a metatable behind it, and a key that is not
# there is `nil` — not an error until it is followed. Every quest carries a
# [quest.quiz]: the choices are code and never translated; the question is
# the brief. verify_pack swaps each wrong choice into the solution and
# refuses the quest if it passes, so the quiz has one right answer.
#
# Every program is one main.lua, checked by `luajit -b main.lua main.luac`
# (a syntax error is the compile error) and run as `luajit main.lua`. The
# runtime is LuaJIT 2.1 — Lua 5.1 plus LuaJIT's extensions, not 5.4: one
# number type, `6 / 2` prints `3`, no `//`, `unpack` not `table.unpack`.
# Standard input is read with `io.read("*l")` (one line), `io.read("*n")`
# (one number) or `io.read("*a")` (all of it); output goes through `print`,
# which puts a TAB between its arguments, so two values on one line are
# joined with `..` first.
#
# There are no threads: the concurrency nodes are coroutines, one of which
# runs at a time, and a lock that yields until it is free.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "lua.verybasic"
land = "lua"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "lua.verybasic.01.print"
node        = 1
title       = "THE FIRST LANTERN"
difficulty  = 1
story       = '''21:00 on Wun Sha Street. The lantern board over the dragon's shed is dark, and the first line of the night is Mei's to type.'''
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
The program must print exactly `hello, causewaybay` on one line. One built-in writes its arguments and a newline to standard output.

Pick the line that does it, then type it where the `-- FILL` comment is.

```
output: hello, causewaybay
```
'''
starter     = '''
local function main()
  -- FILL: greet
end

main()
'''
solution    = '''
local function main()
  print("hello, causewaybay")
end

main()
'''
hints = [
  "print(\"hello, causewaybay\") — parentheses, and the comma inside the string.",
  "print \"hello causewaybay\" is legal Lua — a string literal may follow a call without parentheses — but the comma is missing. io.write writes no newline, and puts is not a name Lua knows.",
]

[quest.quiz]
choices = ["print \"hello causewaybay\"", "puts(\"hello, causewaybay\")", "print(\"hello, causewaybay\")", "io.write(\"hello causewaybay\")"]
answer  = 2

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
]

