    while i <= #running do
      local co = running[i]
      local ok, err = coroutine.resume(co)
      if not ok then
        error(err)
      end
      if coroutine.status(co) == "dead" then
        results[#results + 1] = co
        table.remove(running, i)
      else
        i = i + 1
      end
    end
  end
  return results
end

local function main()
  local data = {}
  for token in io.read("*a"):gmatch("%S+") do
    data[#data + 1] = tonumber(token)
  end
  local workers, n = data[1], data[2]
  local jobs = {}
  for i = 1, n do
    jobs[i] = { index = i - 1, value = data[2 + i] }
  end

  local results = pool(workers, jobs)
  table.sort(results, function(a, b) return a[1] < b[1] end)
  for _, result in ipairs(results) do
    print(result[1] .. " " .. result[2])
  end
  print("WORKERS " .. workers)
end

main()
'''
solution    = '''
local function square(index, value)
  coroutine.yield()              -- the porter walks the crate over
  return index, value * value
end

local function pool(workers, jobs)
  local results = {}
  local running = {}
  local next_job = 1
  while next_job <= #jobs or #running > 0 do
    -- top up: at most `workers` in flight
    while #running < workers and next_job <= #jobs do
      local job = jobs[next_job]
      next_job = next_job + 1
      running[#running + 1] = coroutine.create(function()
        return square(job.index, job.value)
      end)
    end
    -- one turn each; the resume that finishes a job returns its result
    local i = 1
    while i <= #running do
      local co = running[i]
      local ok, index, value = coroutine.resume(co)
      if not ok then
        error(index)
      end
      if coroutine.status(co) == "dead" then
        results[#results + 1] = { index, value }
        table.remove(running, i)
      else
        i = i + 1
      end
    end
  end
  return results
end

local function main()
  local data = {}
  for token in io.read("*a"):gmatch("%S+") do
    data[#data + 1] = tonumber(token)
  end
  local workers, n = data[1], data[2]
  local jobs = {}
  for i = 1, n do
    jobs[i] = { index = i - 1, value = data[2 + i] }
  end

  local results = pool(workers, jobs)
  table.sort(results, function(a, b) return a[1] < b[1] end)
  for _, result in ipairs(results) do
    print(result[1] .. " " .. result[2])
  end
  print("WORKERS " .. workers)
end

main()
'''
