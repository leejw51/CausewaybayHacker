Standard input is a count `n` and then `n` integers.

Create one coroutine per value that adds it to **one shared total** and
bumps a shared hit count, and drive them all round-robin — every runner
gets a turn until every runner is dead. Then print `TOTAL <sum>` and
`HITS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
```

The starter prints `TOTAL 4`, deterministically, on the sample. Every
runner reads the drawer, **yields**, and then writes back what it read plus
its own value. By the time the first one writes, all four have read `0`,
and the last write wins: one stall's money and four hits. That is the lost
update, and it happened on one thread, with no lock in the language to
forget.

There is no `Lock` in Lua because there is no preemption. A coroutine runs
until it says `coroutine.yield()`, and nothing else runs in between. The
critical section is any stretch of code with no yield in it, and the bug is
a yield between the read and the write. Move the yield out of the middle —
wait for the floor first, then read, add and write in one stretch — and
the drawer is right. When the update genuinely has to yield in the middle
(waiting on a socket, say), the lock is a flag: `while busy do
coroutine.yield() end`, set it, work, clear it. That is a mutex, spelled
out.

The scheduler is written in the program: a loop over the runners resuming
each one that is not `dead`, until a whole round finds none alive.
