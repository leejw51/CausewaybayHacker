brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Run a **pool** of `w` porters: at most `w` coroutines in flight at once,
each carrying one job that yields once on the way and then returns
`(index, value * value)`. Collect the results as the jobs **finish**,
sort by index, print `<index> <value>` one per line, then `WORKERS <w>`.

```
input:  2 3
        2 3 4
output: 0 4
        1 9
        2 16
        WORKERS 2
```

A coroutine is not a result. `coroutine.resume(co)` returns `true` and then
whatever the job yielded or returned — that is the only door the value
comes out of, and it opens on the resume that finishes the job, which is
whichever turn of the pool that happens to be. The starter collects the
finished coroutines themselves — `thread: 0x...` values — and the sort
tries to index one.

Carrying the index in the result is what makes the output the same every
run; sorting on it is the last line of the answer, not the first. The pool
is the scheduler from the drawer quest with a cap: top up to `w` running,
give each one turn, retire the dead, repeat until the jobs and the running
are both empty.
