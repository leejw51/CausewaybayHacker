# ---------------------------------------------------------------- 09
[[quest]]
id          = "lua.advanced.09.comprehensions"
node        = 9
title       = "ONE PASS DOWN WUN SHA STREET"
difficulty  = 3
story       = "Alex says you can do it with three for loops. The lane is one dragon wide and the incense is lit; you get one pass."
concepts    = ["comprehensions", "iteration", "collections"]
requires    = ["lua.advanced.08.exceptions"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief       = '''
Standard input is one line of integers separated by spaces.

Print three lines:

1. the sum of the even values (`0` if there are none)
2. every value greater than `10`, doubled, in order, joined by single spaces —
   or `-` if there are none
3. how many distinct values there are

```
input:  1 2 3 4 12 12 30
output: 60
        24 24 60
        6
```

Lua has no comprehensions; the nearest thing is a function that builds a
table from a table, and this node teaches those. Write `filter(list, keep)`
and `map(list, f)` once — each is a loop that fills a new table — and the
three lines become calls: `sum(filter(nums, even))`, `map(filter(nums,
big), double)`, and a set built from the values, counted. The predicate and
the transform are functions passed as arguments, which is what the `if` and
the expression of a comprehension are.

`table.concat` takes numbers as well as strings, so the second line does not
need a conversion; it does need the `-` when the list is empty, because
`table.concat({}, " ")` is the empty string.
'''
starter     = '''
local function main()
  local nums = {}
  for token in io.read("*a"):gmatch("%S+") do
    nums[#nums + 1] = tonumber(token)
  end

  -- 1. sum of the even ones
  -- 2. the ones over 10, doubled, joined by spaces, or "-"
  -- 3. how many distinct values
  print(0)
  print("-")
  print(#nums)
end

main()
'''
solution    = '''
local function filter(list, keep)
  local out = {}
  for _, value in ipairs(list) do
    if keep(value) then
      out[#out + 1] = value
    end
  end
  return out
end

local function map(list, f)
  local out = {}
  for i, value in ipairs(list) do
    out[i] = f(value)
  end
  return out
end

local function sum(list)
  local total = 0
  for _, value in ipairs(list) do
    total = total + value
  end
  return total
end

local function main()
  local nums = {}
  for token in io.read("*a"):gmatch("%S+") do
    nums[#nums + 1] = tonumber(token)
  end

  print(sum(filter(nums, function(v) return v % 2 == 0 end)))

  local big = map(filter(nums, function(v) return v > 10 end), function(v) return v * 2 end)
  print(#big > 0 and table.concat(big, " ") or "-")

  local distinct = {}
  for _, v in ipairs(nums) do
    distinct[v] = true
  end
  local count = 0
  for _ in pairs(distinct) do
    count = count + 1
  end
  print(count)
end

main()
'''
hints = [
  "filter(nums, function(v) return v % 2 == 0 end) keeps the evens; sum of that is line one.",
  "map(filter(nums, big), double) — filter first, transform second, same as the if at the back and the expression at the front of a comprehension.",
  "A set is a table keyed by the values; #set does not count keys, a pairs loop does.",
]

