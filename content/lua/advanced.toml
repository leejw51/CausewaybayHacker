      return double(value)
    end)
  end
  return tasks
end

local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  local results = run(nums)
  local total = 0
  for _, value in ipairs(results) do
    print(value)
    total = total + value
  end
  print("SUM " .. total)
  print("TASKS " .. #nums)
end

main()
'''
solution    = '''
local function double(value)
  coroutine.yield()
  return value * 2
end

local function gather(tasks)
  -- the loop: round after round, every task that is not dead gets a turn,
  -- and the resume that finishes one carries its return value
  local results = {}
  local live = #tasks
  while live > 0 do
    live = 0
    for i, co in ipairs(tasks) do
      if coroutine.status(co) ~= "dead" then
        local ok, value = coroutine.resume(co)
        if not ok then
          error(value)
        end
        if coroutine.status(co) == "dead" then
          results[i] = value
        else
          live = live + 1
        end
      end
    end
  end
  return results
end

local function run(nums)
  local tasks = {}
  for i, value in ipairs(nums) do
    tasks[i] = coroutine.create(function()
      return double(value)
    end)
  end
  return gather(tasks)
end

local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  local results = run(nums)
  local total = 0
  for _, value in ipairs(results) do
    print(value)
    total = total + value
  end
  print("SUM " .. total)
  print("TASKS " .. #nums)
end

main()
'''
