[[quest]]
id          = "lua.advanced.10.functools"
node        = 27
title       = "REMEMBER WHAT YOU WORKED OUT"
difficulty  = 4
story       = "The incense stall works out the same night's price from the same two numbers eleven thousand times before the dragon passes, from scratch, every time."
concepts    = ["decorators", "recursion", "functions", "closures"]
requires    = ["lua.advanced.09.itertools"]
map          = { x = 0.199, y = 0.742, kind = "quest" }
brief       = '''
Standard input is `n k bits`: two integers and a string of binary digits.

Print four lines:

1. `FIB <fib(n)>` — from a **recursive** `fib`, wrapped by `memoize`
2. `PRODUCT <k!>` — `reduce` with a multiply over `1..k`, with an initial
   value so `k = 0` gives `1`
3. `BIN <value>` — `bits` parsed by a `partial` of a base-taking parser
   with the base bound to `2`
4. `MISSES <m>` — `fib.misses`, how many times the recursion actually ran
   the body

```
input:  10 5 1010
output: FIB 55
        PRODUCT 120
        BIN 10
        MISSES 11
```

`n` is at most `400`, which is nothing to LuaJIT's stack. Without the
cache, `fib(35)` is about thirty million calls and `fib(90)` does not
finish. With it, every `fib(i)` runs once and `MISSES` is `n + 1`.
`memoize` is the wrapper from the WRAPPED quest with a cache in its
closure: a callable table, so `fib.misses` is a field, and `fib =
memoize(function ... end)` so the recursion inside goes through the cache
too. The starter's `fib` is a plain function, and its last line dies on
`fib.misses`.

`fib(90)` and `20!` are past 2^53, and a Lua number is a double: past
that, digits are lost silently. The starter carries `big`, a number as a
list of base-10^7 limbs, with `add`, `mul_small` and `tostring`; `fib`
adds bigs and the product multiplies one by a small number. `partial`
freezes some leading arguments of a function and gives you a new one;
`reduce` folds a two-argument function across an iterator. Neither is
clever. Both are asked about.
'''
starter     = '''
-- big: a non-negative integer as base-10^7 limbs, least significant first
local BASE = 10000000
local big = {}

function big.from(n)
  local limbs = {}
  repeat
    limbs[#limbs + 1] = n % BASE
    n = math.floor(n / BASE)
  until n == 0
  return limbs
end

function big.add(a, b)
  local out, carry = {}, 0
  for i = 1, math.max(#a, #b) do
    local sum = (a[i] or 0) + (b[i] or 0) + carry
    out[i] = sum % BASE
    carry = math.floor(sum / BASE)
  end
  if carry > 0 then
    out[#out + 1] = carry
  end
  return out
end

function big.mul_small(a, m)
  local out, carry = {}, 0
  for i = 1, #a do
    local product = a[i] * m + carry
    out[i] = product % BASE
    carry = math.floor(product / BASE)
  end
  while carry > 0 do
    out[#out + 1] = carry % BASE
    carry = math.floor(carry / BASE)
  end
  return out
end

function big.tostring(a)
  local parts = { tostring(a[#a]) }
  for i = #a - 1, 1, -1 do
    parts[#parts + 1] = string.format("%07d", a[i])
  end
  return table.concat(parts)
end

local function fib(n)
  if n < 2 then
    return big.from(n)
  end
  return big.add(fib(n - 1), fib(n - 2))
end

local function main()
  local n, k, bits = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  n, k = tonumber(n), tonumber(k)

  print("FIB " .. big.tostring(fib(n)))

  local product = big.from(1)
  for i = 1, k do
    product = big.mul_small(product, i)
  end
  print("PRODUCT " .. big.tostring(product))

  print("BIN " .. tonumber(bits, 2))
  print("MISSES " .. fib.misses)
end

main()
'''
solution    = '''
-- big: a non-negative integer as base-10^7 limbs, least significant first
local BASE = 10000000
local big = {}

function big.from(n)
  local limbs = {}
  repeat
    limbs[#limbs + 1] = n % BASE
    n = math.floor(n / BASE)
  until n == 0
  return limbs
end

function big.add(a, b)
  local out, carry = {}, 0
  for i = 1, math.max(#a, #b) do
    local sum = (a[i] or 0) + (b[i] or 0) + carry
    out[i] = sum % BASE
    carry = math.floor(sum / BASE)
  end
  if carry > 0 then
    out[#out + 1] = carry
  end
  return out
end

function big.mul_small(a, m)
  local out, carry = {}, 0
  for i = 1, #a do
    local product = a[i] * m + carry
    out[i] = product % BASE
    carry = math.floor(product / BASE)
  end
  while carry > 0 do
    out[#out + 1] = carry % BASE
    carry = math.floor(carry / BASE)
  end
  return out
end

function big.tostring(a)
  local parts = { tostring(a[#a]) }
  for i = #a - 1, 1, -1 do
    parts[#parts + 1] = string.format("%07d", a[i])
  end
  return table.concat(parts)
end

local function memoize(func)
  -- a callable table: the cache lives in the closure, the miss count on the table
  local cache = {}
  local wrapper = { misses = 0 }
  return setmetatable(wrapper, {
    __call = function(self, n)
      local hit = cache[n]
      if hit ~= nil then
        return hit
      end
      self.misses = self.misses + 1
      local value = func(n)
      cache[n] = value
      return value
    end,
  })
end

local function reduce(f, iter, init)
  local acc = init
  for value in iter do
    acc = f(acc, value)
  end
  return acc
end

local function range(lo, hi)
  local i = lo - 1
  return function()
    i = i + 1
    if i <= hi then
      return i
    end
  end
end

local function partial(f, ...)
  local bound = { ... }
  local count = select("#", ...)
  return function(...)
    return f(unpack(bound, 1, count), ...)
  end
end

-- declared first so the body's recursive fib is the wrapped one
local fib
fib = memoize(function(n)
  if n < 2 then
    return big.from(n)
  end
  return big.add(fib(n - 1), fib(n - 2))
end)

local function main()
  local n, k, bits = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  n, k = tonumber(n), tonumber(k)

  print("FIB " .. big.tostring(fib(n)))

  local product = reduce(big.mul_small, range(1, k), big.from(1))
  print("PRODUCT " .. big.tostring(product))

  local function parse(base, text)
    return tonumber(text, base)
  end
  local from_binary = partial(parse, 2)
  print("BIN " .. from_binary(bits))

  print("MISSES " .. fib.misses)
end

main()
'''
