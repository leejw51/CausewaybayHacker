without asking. And `cheapest` has no `return` on its way out, so it
returns nothing, which the caller receives as `nil` and does the same thing
to.

A key nobody wrote is `nil`. A function that falls off the end returns
`nil`. Neither is an error at the time; both become one later. The fix is
the same both times: the code that can receive a `nil` checks for it, with
`== nil`, before it indexes. (In Lua only `nil` and `false` are false, so
`if not stall` would also be right here — a stall with a price of `0` is
still a table — but `== nil` says what you mean.)

