map          = { x = 0.055, y = 0.556, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` weights in kg.

`price(kg)` is `500 + 100 * kg`. Wrap it with `counted` so that every call
is counted without `price` knowing. Print one price per weight, then
`CALLS <n>`, then `NAME <price.name>` — which must say `price`.

```
input:  3
        1 2 3
output: 600
        700
        800
        CALLS 3
        NAME price
```

Lua has no decorators; the nearest thing is a function that takes a
function and returns something callable in its place, and this node
teaches that. `price = counted(price, "price")` rebinds the name to what
`counted` returned — exactly what `@counted` above a `def` does.

Where does the count live? A Lua function cannot carry a field, so the
wrapper is a **table** — `{ calls = 0 }` — made callable with a `__call`
metamethod that bumps the count and calls the original. `price(kg)` then
goes through `__call`, and `price.calls` is a plain field read.

A Lua function has no name of its own either. The wrapper has to be told
the one it is standing in for; the starter never tells it, and the last
line says `NAME wrapper`. That is `functools.wraps`, done by hand: the
identity of the thing wrapped, copied onto the thing that replaced it.
'''
