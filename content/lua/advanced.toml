[[quest]]
id          = "lua.advanced.14.iterator"
node        = 31
title       = "NEXT, UNTIL IT STOPS"
difficulty  = 4
story       = "The ticket machine at the Victoria Park lantern gate hands out numbers from a start in fixed steps and keeps no list of them, and the queue board wants to loop over it like any list."
concepts    = ["iteration", "duck-typing", "structs"]
