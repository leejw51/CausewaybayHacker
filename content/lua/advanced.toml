brief       = '''
Standard input is a count `n`, then `n` lines of `<STALL> <CENTS>` — the
stalls that have opened — then a count `q` and `q` stall names to look up.

For each query print `<STALL> <cents>`, or `<STALL> NONE` if that stall is
not open. Then print `MISSING <k>` and `CHEAPEST <STALL>` — the open stall
with the lowest price, ties by name — or `CHEAPEST NONE` if nothing is open.

```
input:  2
        LAM 1200
        WONG 900
        3
        WONG
        CHAN
        LAM
output: WONG 900
        CHAN NONE
        LAM 1200
        MISSING 1
        CHEAPEST WONG
```

The starter crashes on `CHAN`:

```
attempt to index local 'stall' (a nil value)
```

That line is the boss of this stretch of road. It never points at the bug.
It points at the place where a `nil` was finally *followed*, which can be
any distance from the place it was *made* — and in the starter it was made
in two different places. `lookup` returns `board[name]`, which is `nil` for
