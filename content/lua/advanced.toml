[[quest]]
id          = "lua.advanced.05.dicts"
node        = 5
title       = "WHAT THE LANE SHOUTS"
difficulty  = 3
story       = "Wun Sha Street at nine: every stall calling something, and the board at the School Street end wants the ranking."
concepts    = ["collections", "sorting", "iteration"]
requires    = ["lua.advanced.04.strings"]
map          = { x = 0.604, y = 0.137, kind = "quest" }
brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, and ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```

A table keyed by word is the counter, and `counts[word] + 1` is an error
the first time — `attempt to perform arithmetic on a nil value` — because a
key nobody wrote is `nil`. `(counts[word] or 0) + 1` supplies the zero.

`pairs` walks the keys in **no order at all**, and the order changes from
run to run. Copy the keys into a list, `table.sort` it with a comparator
that says count descending and then word ascending, and print from the
list. The comparator returns `true` when its first argument goes first.
'''
starter     = '''
local function main()
  local counts = {}
  for word in io.read("*a"):gmatch("%S+") do
    counts[word] = counts[word] + 1
  end

  for word, count in pairs(counts) do
    print(word .. " " .. count)
  end
end

main()
'''
solution    = '''
local function main()
  local counts = {}
  for word in io.read("*a"):gmatch("%S+") do
    counts[word] = (counts[word] or 0) + 1
  end

  local words = {}
  for word in pairs(counts) do
    words[#words + 1] = word
  end
  table.sort(words, function(a, b)
    if counts[a] ~= counts[b] then
      return counts[a] > counts[b]
    end
    return a < b
  end)

  for _, word in ipairs(words) do
    print(word .. " " .. counts[word])
  end
end

main()
'''
hints = [
  "The starter dies on the first word: counts[word] + 1 reads before it writes, and there is nothing to read. (counts[word] or 0) supplies the zero.",
  "Collect the keys with pairs into a list, then table.sort the list. The table itself has no order to fix.",
  "function(a, b) if counts[a] ~= counts[b] then return counts[a] > counts[b] end return a < b end — count descending, then word ascending, and never true for equal arguments.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "tram",   stdin = "tram tram bus\n", expect = "tram 2\nbus 1\n", visible = true },
  { name = "ties",   stdin = "a b a c b a\n",   expect = "a 3\nb 2\nc 1\n", visible = false },
  { name = "single", stdin = "one\n",           expect = "one 1\n",         visible = false },
]

