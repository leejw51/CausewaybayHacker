[[quest]]
id          = "lua.advanced.07.functions"
node        = 7
title       = "PER CATTY"
difficulty  = 2
story       = "Every price tag on Wun Sha Street is per catty unless it says otherwise, and the tag printer at the incense stall insists on being told every time."
concepts    = ["functions", "strings", "types"]
requires    = ["lua.advanced.06.sets"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<NAME> <CENTS>` or
`<NAME> <CENTS> <UNIT>`.

Write `tag(name, cents, unit)` returning `<NAME> $<dollars>/<unit>` with two
decimals, where a missing `unit` means `catty`, and print one tag per line.

```
input:  3
        CHOISUM 1200
        EGG 250 each
        GARLIC 800
output: CHOISUM $12.00/catty
        EGG $2.50/each
        GARLIC $8.00/catty
```

Lua has no default arguments. A parameter the caller left out is `nil`, and
the starter's `tag` concatenates it: `attempt to concatenate local 'unit'
(a nil value)`. The idiom is the first line of the function —
`unit = unit or "catty"` — because `or` returns its left side unless that
is `nil` or `false`. It is the whole of Lua's default-argument mechanism,
and it is part of the function's contract as much as a `def` line would be.

Split the line into a list of tokens and hand the pieces over with
`tag(unpack(parts))` after converting the cents. `unpack` spreads a list
into arguments, so a two-element list and a three-element list both fit
the one signature.
'''
starter     = '''
local function tag(name, cents, unit)
  return string.format("%s $%d.%02d/%s", name, math.floor(cents / 100), cents % 100, unit)
end

local function split(line)
  local parts = {}
  for token in line:gmatch("%S+") do
    parts[#parts + 1] = token
  end
  return parts
end

local function main()
  local n = tonumber(io.read("*l"))
  for _ = 1, n do
    local parts = split(io.read("*l"))
    parts[2] = tonumber(parts[2])
    print(tag(unpack(parts)))
  end
end

main()
'''
solution    = '''
local function tag(name, cents, unit)
  unit = unit or "catty"
  return string.format("%s $%d.%02d/%s", name, math.floor(cents / 100), cents % 100, unit)
end

local function split(line)
  local parts = {}
  for token in line:gmatch("%S+") do
    parts[#parts + 1] = token
  end
  return parts
end

local function main()
  local n = tonumber(io.read("*l"))
  for _ = 1, n do
    local parts = split(io.read("*l"))
    parts[2] = tonumber(parts[2])
    print(tag(unpack(parts)))
  end
end

main()
'''
hints = [
