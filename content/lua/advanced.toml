# LUA LAND — ADVANCED. The walk through Tai Hang turns into the dragon's
# run. First the language's own machinery — one name rebound, loops, tables
# as lists, strings as bytes, tables as maps and sets, defaults, pcall,
# functions that build tables, sorting with a comparator, metatables as
# classes, a dispatch table, coroutines as generators, a function that wraps
# a function, methods as the only contract, and NIL on the price board — and
# then 21:00 on Wun Sha Street, where everything happens in turn: coroutines
# for the runners, a shared drawer with a yield in the wrong place, a hatch
# with a sentinel, a pool of porters, a hand-written scheduler, a queue that
# must be told it is done, a shutter that closes on every path, iterator
# pipelines, a toolbox built from coroutines, memoisation, protocols by
# method name, frozen tables, error objects, the iterator protocol, the
# right container, cancellation by resume, and THE COROUTINE. The grammar
# drills live on the BASIC road now.
#
# The land is about tables and what a table does when nothing is at a key:
# a missing value is nil and is not an error until it is followed, and the
# stack trace points at the place it was followed, never at the place it
# was lost. Several starters here run to the end and print `nil`, and that
# is the lesson, not an accident.
#
# Every quest here has a deterministic answer on purpose: results are joined
# in order, collected and sorted, or piped, and the coroutine quests use a
# round-robin scheduler written in the program, so the order is the
# program's and never the runtime's. A quest whose output depends on
# `pairs` order is a quest that fails CI at random, and that is not a lesson.
#
# Toolchain: one `main.lua`, syntax-checked with `luajit -b main.lua
# main.luac`, run as `luajit main.lua` with the case on stdin. LuaJIT 2.1 is
# Lua 5.1: `unpack`, not `table.unpack`; `math.floor(a / b)`, no `//`; no
# integer subtype, so `6 / 2` prints `3` and anything past 2^53 needs limbs;
# `bit.band` and friends for bits; `io.read("*a")` reads all of stdin.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "lua.advanced"
land = "lua"
category = "advanced"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "lua.advanced.01.conversions"
node        = 1
title       = "THREE SHAPES, ONE NAME"
difficulty  = 2
story       = "The incense stall on Wun Sha Street keeps the price as text, as a number and as dollars, in one notebook, under one name."
concepts    = ["bindings", "types", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Read one line: an amount in cents, as digits.

Print three lines:

1. how many characters the stripped text has
2. the amount as a number
3. the amount as dollars with exactly two decimals

```
input:  1234
output: 4
        1234
        12.34
```

The amount is non-negative. Do it with **one name**, rebound three times —
a string, then a number, then a string again. A Lua local holds anything
and changes its mind on assignment; the price is that nothing tells you
what `cents` is right now except reading the line above.

Do not go through division for the dollars. `1234 / 100` is `12.34` today
and `0.1 + 0.2` is `0.3` when printed and not when compared. `math.floor`
and `%` give you the two halves exactly, and `string.format("%02d", ...)`
pads the second one. `tonumber` is the conversion; `#cents` is the length
of the string while it is still a string.
'''
starter     = '''
local function main()
  local cents = io.read("*l"):match("^%s*(.-)%s*$")

  -- 1. the character count of `cents`
  -- 2. rebind `cents` to its number value, and print it
  -- 3. rebind `cents` to the formatted dollars, and print it
  print(cents)
end

main()
'''
solution    = '''
local function main()
  local cents = io.read("*l"):match("^%s*(.-)%s*$")
  print(#cents)

  cents = tonumber(cents)
  print(cents)

  cents = string.format("%d.%02d", math.floor(cents / 100), cents % 100)
  print(cents)
end

main()
'''
hints = [
  "#cents while cents is still a string is the first line.",
  "cents = tonumber(cents) is not a conversion in place; it is a new value bound to the old name. The string is gone after it.",
  "%02d inside string.format is width two, zero padded, decimal. 5 cents is 0.05, not 0.5.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "dollars",    stdin = "1234\n", expect = "4\n1234\n12.34\n", visible = true },
  { name = "five-cents", stdin = "5\n",    expect = "1\n5\n0.05\n",     visible = false },
  { name = "round",      stdin = "100\n",  expect = "3\n100\n1.00\n",   visible = false },
]

# ---------------------------------------------------------------- 02
[[quest]]
id          = "lua.advanced.02.control-flow"
node        = 2
title       = "WHICH LANE"
difficulty  = 2
story       = "The lane numbers are chalked on the road for the dragon's route, and the marshal's board at Lin Fa Kung is supposed to say what each lane holds. It says the number, every time, and starts from zero."
concepts    = ["control-flow", "io", "functions"]
requires    = ["lua.advanced.01.conversions"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
Read one integer `n`. For every `i` from `1` to `n`, print one line:

* `FISHVEG` if `i` divides by both 3 and 5
* `FISH` if `i` divides by 3
* `VEG` if `i` divides by 5
* otherwise `i` itself

Then keep reading integers, one per line, until you read `0`, and print
`SKIPPED <k>`, how many non-zero lines you read on the way.

```
input:  5
        7
        8
        0
output: 1
        2
        FISH
        4
        VEG
        SKIPPED 2
```

Two loops, two kinds. The first knows how many times it runs before it
starts: `for i = 1, n do`. The second does not: `while true do` with a
`break`, because the count is decided by what you read. Lua's numeric `for`
is **inclusive** at both ends — `for i = 1, n` runs `n` times — and the
starter begins at `0`, which is the off-by-one this land is named for.
'''
starter     = '''
local function label(i)
  -- FISHVEG / FISH / VEG / i
  return i
end

local function main()
  local n = tonumber(io.read("*l"))
  for i = 0, n - 1 do
    print(label(i))
  end

  local skipped = 0
  -- read lines until a 0, counting the non-zero ones
  print("SKIPPED " .. skipped)
end

main()
'''
solution    = '''
local function label(i)
  if i % 15 == 0 then
    return "FISHVEG"
  end
  if i % 3 == 0 then
    return "FISH"
  end
  if i % 5 == 0 then
    return "VEG"
  end
  return i
end

local function main()
  local n = tonumber(io.read("*l"))
  for i = 1, n do
    print(label(i))
  end

  local skipped = 0
  while true do
    local value = tonumber(io.read("*l"))
    if value == 0 then
      break
    end
    skipped = skipped + 1
  end
  print("SKIPPED " .. skipped)
end

main()
'''
hints = [
  "Check the both-case first, or it never fires. Divisible by 3 and 5 is divisible by 15.",
  "for i = 0, n - 1 starts one early and stops one early. The starter has that bug; the first line of its output is FISHVEG, because 0 divides by everything.",
  "while true do ... break is how Lua spells a loop whose exit is in the middle. There is also repeat ... until, which tests at the bottom.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "five",    stdin = "5\n7\n8\n0\n",  expect = "1\n2\nFISH\n4\nVEG\nSKIPPED 2\n", visible = true },
  { name = "fifteen", stdin = "15\n0\n",      expect = "1\n2\nFISH\n4\nVEG\nFISH\n7\n8\nFISH\nVEG\n11\nFISH\n13\n14\nFISHVEG\nSKIPPED 0\n", visible = false },
  { name = "one",     stdin = "1\n5\n5\n5\n0\n", expect = "1\nSKIPPED 3\n", visible = false },
]

