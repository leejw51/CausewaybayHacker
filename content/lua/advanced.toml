[[quest]]
id          = "lua.advanced.04.strings"
node        = 4
title       = "BYTES ARE NOT LETTERS"
difficulty  = 2
story       = "The lantern order form at the Victoria Park stall cuts 銅鑼灣 at three bytes and prints one character and a question mark."
concepts    = ["strings", "types", "slices"]
requires    = ["lua.advanced.03.lists"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''
Read one line. Print three lines:

1. its length in **bytes**, encoded as UTF-8
2. its length in **characters**
3. the line with its characters reversed

```
input:  causeway
output: 8
        8
        yawesuac
```

The line may contain characters outside ASCII, and then the first two numbers
are not the same. A Lua string is a sequence of **bytes** and knows nothing
else: `#s` is the byte count and `s:reverse()` reverses bytes, which cuts
every multi-byte character in half. Characters are something you define.
In UTF-8 a character is one lead byte followed by any number of
continuation bytes — `[^\128-\191][\128-\191]*` as a pattern — so counting
the lead bytes is the character count, and walking the characters with
`gmatch` and stacking them is the reversal.

The starter prints the byte count twice and the line as it came. Do not
reach for `line:reverse()` to fix the third line: on `causeway` it is
right, and on the sample everyone actually types it prints bytes that are
not a string in any encoding.
'''
starter     = '''
local function main()
  local line = io.read("*l")

  -- 1. bytes, 2. characters, 3. the characters reversed
  print(#line)
  print(#line)
  print(line)
end

main()
'''
solution    = '''
local CHAR = "[^\128-\191][\128-\191]*"

local function main()
  local line = io.read("*l")

  print(#line)

  local _, chars = line:gsub(CHAR, "")
  print(chars)

  local reversed = {}
  for ch in line:gmatch(CHAR) do
    table.insert(reversed, 1, ch)
  end
  print(table.concat(reversed))
end

main()
'''
hints = [
  "#line is bytes. The characters have to be counted: gsub returns the number of matches as its second result, and a match per character is a count of characters.",
  "A continuation byte is 128..191 (10xxxxxx). A character is one byte that is not that, followed by zero or more that are: \"[^\\128-\\191][\\128-\\191]*\".",
  "table.insert(reversed, 1, ch) pushes at the front, so the last character ends up first. table.concat joins with no separator.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "ascii",     stdin = "causeway\n",  expect = "8\n8\nyawesuac\n",  visible = true },
  { name = "cantonese", stdin = "銅鑼灣\n",    expect = "9\n3\n灣鑼銅\n",    visible = false },
  { name = "spaced",    stdin = "Lucky Mac\n", expect = "9\n9\ncaM ykcuL\n", visible = false },
]

