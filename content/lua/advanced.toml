solution    = '''
local function squares(values)
  return coroutine.wrap(function()
    for _, value in ipairs(values) do
      coroutine.yield(value * value)
    end
  end)
end

local function running(stream)
  return coroutine.wrap(function()
    local total = 0
    for value in stream do
      total = total + value
      coroutine.yield(value, total)
    end
  end)
end

local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  local count = 0
  for square, total in running(squares(nums)) do
    print(square .. " " .. total)
    count = count + 1
  end
  print("PIPE " .. count)
end

main()
'''
