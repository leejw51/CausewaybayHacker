  local rejected = 0
  for _ = 1, n do
    local stall, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    local ok = pcall(opened, stall, function()
      total = total + parse_cents(cents)
    end)
    if not ok then
      rejected = rejected + 1
      print("BAD " .. stall)
    end
  end
