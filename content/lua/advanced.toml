[[quest]]
id          = "lua.advanced.12.classes"
node        = 12
title       = "THE STALL'S NOTEBOOK"
difficulty  = 3
story       = "Every stall on Wun Sha Street keeps its own notebook of the night's sales, and the incense stall's has every line written in the shared one on the committee's desk."
concepts    = ["structs", "functions", "mutability"]
requires    = ["lua.advanced.11.sorting"]
map          = { x = 0.396, y = 0.276, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<ITEM> <CENTS>`.

Build a `Notebook` class that collects the items, then print each item back
as `<ITEM> <CENTS>`, in the order it arrived, then `TOTAL <sum>`, and
finally the notebook itself through `print(book)` — its `__tostring`
metamethod must produce `Notebook(items=<n>, total=<sum>)`.

```
input:  2
        TOFU 600
        SET 2800
output: TOFU 600
        SET 2800
        TOTAL 3400
        Notebook(items=2, total=3400)
```

`n` may be `0`, and then the lines are `TOTAL 0` and
`Notebook(items=0, total=0)`.

A Lua class is a table of methods set as the metatable of every instance,
with `__index` pointing back at itself: a key the instance does not have is
looked up in the class. That lookup is the bug this quest is named for. The
starter puts `items = {}` in the **class table**, so `self.items` on any
notebook falls through to the one list every notebook shares, and the
scratch notebook's `PENCIL` turns up in the real one. Anything created in
`new` and stored on the instance belongs to the instance; anything on the
class belongs to every instance there will ever be.

`print(book)` calls `tostring`, and `tostring` looks for `__tostring` in the
metatable. Without it you get `table: 0x...`, which is the starter's last
line.
'''
starter     = '''
local Notebook = {}
Notebook.__index = Notebook
Notebook.items = {}

function Notebook.new()
  return setmetatable({}, Notebook)
end

function Notebook:add(name, cents)
  self.items[#self.items + 1] = { name = name, cents = cents }
end

function Notebook:total()
  local sum = 0
  for _, entry in ipairs(self.items) do
    sum = sum + entry.cents
  end
  return sum
end

local function main()
  local n = tonumber(io.read("*l"))
  local book = Notebook.new()
  local scratch = Notebook.new()
  scratch:add("PENCIL", 0)
  for _ = 1, n do
    local name, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    book:add(name, tonumber(cents))
  end

  for _, entry in ipairs(book.items) do
    print(entry.name .. " " .. entry.cents)
  end
  print("TOTAL " .. book:total())
  print(book)
end

main()
'''
solution    = '''
local Notebook = {}
Notebook.__index = Notebook

function Notebook.new()
  -- one list per notebook; a list on the class table would be shared
  return setmetatable({ items = {} }, Notebook)
end

function Notebook:add(name, cents)
  self.items[#self.items + 1] = { name = name, cents = cents }
end

function Notebook:total()
  local sum = 0
  for _, entry in ipairs(self.items) do
    sum = sum + entry.cents
  end
  return sum
end

function Notebook:__tostring()
  return string.format("Notebook(items=%d, total=%d)", #self.items, self:total())
end

local function main()
  local n = tonumber(io.read("*l"))
  local book = Notebook.new()
  local scratch = Notebook.new()
  scratch:add("PENCIL", 0)
  for _ = 1, n do
    local name, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    book:add(name, tonumber(cents))
  end

  for _, entry in ipairs(book.items) do
    print(entry.name .. " " .. entry.cents)
  end
  print("TOTAL " .. book:total())
  print(book)
end

main()
'''
