solution    = '''
local tools = {}

function tools.accumulate(list)
  return coroutine.wrap(function()
    local total = 0
    for _, value in ipairs(list) do
      total = total + value
      coroutine.yield(total)
    end
  end)
end

function tools.groupby(list)
  -- yields (value, run) for every run of adjacent equal values
  return coroutine.wrap(function()
    local i = 1
    while i <= #list do
      local value, run = list[i], {}
      while i <= #list and list[i] == value do
        run[#run + 1] = list[i]
        i = i + 1
      end
      coroutine.yield(value, run)
    end
  end)
end

function tools.combinations(list, r)
  -- yields every r-subset of list, in order, as r values
  return coroutine.wrap(function()
    local chosen = {}
    local function pick(start, depth)
      if depth > r then
        coroutine.yield(unpack(chosen, 1, r))
        return
      end
      for i = start, #list do
        chosen[depth] = list[i]
        pick(i + 1, depth + 1)
      end
    end
    pick(1, 1)
  end)
end

local function collect(iter)
  local out = {}
  for value in iter do
    out[#out + 1] = value
  end
  return out
end

local function main()
  local nums = {}
  for token in io.read("*a"):gmatch("%S+") do
    nums[#nums + 1] = tonumber(token)
  end

  print("SUMS " .. table.concat(collect(tools.accumulate(nums)), " "))

  local runs = {}
  for value, run in tools.groupby(nums) do
    runs[#runs + 1] = value .. "x" .. #run
  end
  print("RUNS " .. table.concat(runs, " "))

  local seen, distinct = {}, {}
  for _, value in ipairs(nums) do
    if not seen[value] then
      seen[value] = true
      distinct[#distinct + 1] = value
    end
  end
  table.sort(distinct)
  local pairs_count = 0
  for _ in tools.combinations(distinct, 2) do
    pairs_count = pairs_count + 1
  end
  print("PAIRS " .. pairs_count)
end

main()
'''
hints = [
  "tools.accumulate(nums) yields the running total after each element; collect it into a list for table.concat.",
  "for value, run in tools.groupby(nums) do — the run is a list of that run's members, and #run is its length.",
  "tools.combinations(distinct, 2) yields each unordered pair once. Counting them is n*(n-1)/2, and checking that by hand is how you know you have the right n.",
]

