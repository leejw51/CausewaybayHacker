brief       = '''
Standard input is a count `n` and then `n` integers.

One producer coroutine pushes each value multiplied by ten onto a queue,
yielding after each, then pushes a **sentinel**. The main loop takes from
the queue until it sees the sentinel, printing each value and keeping a
total, then prints `SUM <total>` and `CLOSED`.

```
input:  3
        1 2 3
output: 10
        20
        30
        SUM 60
        CLOSED
```

A queue is a table with a head and a tail, and a table has no `close`.
Nothing on it can tell the consumer that there will be no more; that has
to be an item. And the item cannot be `nil`, because `nil` in a table is
the absence of an item. The sentinel is a value of its own — `local CLOSED
= {}`, a table nobody else holds — and `value == CLOSED` is true only for
that one table, because `==` on tables is identity.

The starter never pushes it. `take` resumes the kitchen until something is
in the queue, and when the kitchen is dead and the queue is empty it gives
up and returns `nil`; the loop prints the word `nil`, and then adds it to
the total and dies. In a language with blocking queues this would be a
hang. In Lua it is a `nil`, followed.

The producer pushes the sentinel. Never the consumer — the side that knows
the stream is over is the side that ends it.
'''
starter     = '''
local CLOSED = {}   -- the sentinel: a table nobody else has a reference to

local function new_queue()
  return { head = 1, tail = 0 }
end

local function push(queue, value)
  queue.tail = queue.tail + 1
  queue[queue.tail] = value
end

local function pop(queue)
  local value = queue[queue.head]
  queue[queue.head] = nil
  queue.head = queue.head + 1
  return value
end

local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  local hatch = new_queue()

  local kitchen = coroutine.create(function()
    for _, value in ipairs(nums) do
      push(hatch, value * 10)
      coroutine.yield()
    end
    -- the hatch is still open
  end)

  local function take()
    while hatch.head > hatch.tail do
      if coroutine.status(kitchen) == "dead" then
        return nil
      end
      coroutine.resume(kitchen)
    end
    return pop(hatch)
  end

  local total = 0
  while true do
    local value = take()
    if value == CLOSED then
      break
    end
    print(value)
    total = total + value
  end

  print("SUM " .. total)
  print("CLOSED")
end

main()
'''
