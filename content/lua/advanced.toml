local function counted(func, name)
  local wrapper = { calls = 0, name = name or "wrapper" }
  return setmetatable(wrapper, {
    __call = function(self, ...)
      self.calls = self.calls + 1
      return func(...)
    end,
  })
end

local function price(kg)
  return 500 + 100 * kg
end
price = counted(price)

local function main()
  local n = tonumber(io.read("*l"))
  local weights = {}
  for token in (io.read("*l") or ""):gmatch("%S+") do
    weights[#weights + 1] = tonumber(token)
  end
  for i = 1, n do
    print(price(weights[i]))
  end
  print("CALLS " .. price.calls)
  print("NAME " .. price.name)
end

main()
'''
solution    = '''
local function counted(func, name)
  local wrapper = { calls = 0, name = name or "wrapper" }
  return setmetatable(wrapper, {
    __call = function(self, ...)
      self.calls = self.calls + 1
      return func(...)
    end,
  })
end

local function price(kg)
  return 500 + 100 * kg
end
-- the name is rebound to the wrapper, and the wrapper is told whose name it wears
price = counted(price, "price")

local function main()
  local n = tonumber(io.read("*l"))
  local weights = {}
  for token in (io.read("*l") or ""):gmatch("%S+") do
    weights[#weights + 1] = tonumber(token)
  end
  for i = 1, n do
    print(price(weights[i]))
  end
  print("CALLS " .. price.calls)
  print("NAME " .. price.name)
end

main()
'''
