[[quest]]
id          = "lua.advanced.08.exceptions"
node        = 8
title       = "THE LINE THAT IS NOT A NUMBER"
difficulty  = 3
story       = "The scale at the pomelo stall prints a column of weights with somebody's phone number in the middle of it."
concepts    = ["error-handling", "control-flow", "types"]
requires    = ["lua.advanced.07.functions"]
map          = { x = 0.953, y = 0.263, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, where the total is the sum of the values
you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

`tonumber("xx")` is `nil`, quietly; `tonumber("1.5")` is `1.5`, which is
not an integer; and the starter's `double` raises for both with `error`.
`error` is how a Lua function refuses — there is no `Result`, no
`(value, ok)` from the function itself — and the caller that expected a
number has to say what it does about it with `pcall`: it calls the function
for you and returns `true, result` or `false, message` instead of letting
the error climb.

Keep the `pcall` around the one call that can fail. Wrapping the whole loop
body would swallow a typo in your own `print` too, which is how programs
learn to fail silently.
'''
starter     = '''
local function double(text)
  if not text:match("^%-?%d+$") then
    error("not an integer: " .. text)
  end
  return tonumber(text) * 2
end

local function main()
  local n = tonumber(io.read("*l"))
  local total = 0
  for _ = 1, n do
    local line = io.read("*l"):match("^%s*(.-)%s*$")
    local value = double(line)
    print(value)
    total = total + value
  end
  print("SUM " .. total)
end

main()
'''
solution    = '''
local function double(text)
  if not text:match("^%-?%d+$") then
    error("not an integer: " .. text)
  end
  return tonumber(text) * 2
end

local function main()
  local n = tonumber(io.read("*l"))
  local total = 0
  for _ = 1, n do
    local line = io.read("*l"):match("^%s*(.-)%s*$")
    local ok, value = pcall(double, line)
    if ok then
      print(value)
      total = total + value
    else
      print("BAD " .. line)
    end
  end
  print("SUM " .. total)
end

main()
'''
hints = [
  "The starter dies on xx with main.lua:3: not an integer: xx. That message is what pcall hands you as its second result instead of crashing.",
  "local ok, value = pcall(double, line) — pcall takes the function and its arguments separately; pcall(double(line)) would call double first and crash before pcall ever ran.",
  "When ok is false, value is the message. Print BAD and move on; the bad line adds nothing to the total.",
]

