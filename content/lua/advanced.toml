[[quest]]
id          = "lua.advanced.14.generators"
node        = 14
title       = "YOUR OWN FOR LOOP"
difficulty  = 3
story       = "The incense stall's ticker lists every price from the opening one up in fixed steps, and keeps no list of them anywhere."
concepts    = ["generators", "iteration", "functions"]
requires    = ["lua.advanced.13.dataclasses"]
map          = { x = 0.119, y = 0.272, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Write `ticker(start, step, count)` as a **coroutine** — `coroutine.wrap`
around a function that yields `count` values beginning at `start` and
advancing by `step`. Print each on its own line, then `SUM <total>`
computed by handing a second ticker to `sum`.

```
input:  5 2 4
output: 5
        7
        9
        11
        SUM 32
        generator
```

The last line is what `main` calls the thing `ticker` returns — `list` for
a table, `generator` for the function `coroutine.wrap` gives back — printed
by the starter's `main` as it stands. Right now it says `list`, one line
after `for value in ticker(...)` has already failed with `attempt to call a
table value`: the generic `for` calls its first operand, and a list is not
callable.

`coroutine.wrap(f)` does not run `f`. It returns a function, and each call
of that function runs `f` until its next `coroutine.yield(value)`, and hands
that value back. When `f` returns, the function returns nothing, and the
`for` sees `nil` and stops. That is why `for` works on it, why `sum` works
on it, and why it can produce a million values without a list of a million
values ever existing.

The starter builds the list and returns it. Turn the append into a `yield`
and delete the list.
'''
starter     = '''
local function ticker(start, step, count)
  local values = {}
  for i = 0, count - 1 do
    values[#values + 1] = start + i * step
  end
  return values
end

local function sum(iter)
  local total = 0
  for value in iter do
    total = total + value
  end
  return total
end

local KIND = { table = "list", ["function"] = "generator" }

local function main()
  local start, step, count = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  start, step, count = tonumber(start), tonumber(step), tonumber(count)

  for value in ticker(start, step, count) do
    print(value)
  end
  print("SUM " .. sum(ticker(start, step, count)))
  print(KIND[type(ticker(start, step, count))])
end

main()
'''
solution    = '''
local function ticker(start, step, count)
  return coroutine.wrap(function()
    local value = start
    for _ = 1, count do
      coroutine.yield(value)
      value = value + step
    end
  end)
end

local function sum(iter)
  local total = 0
  for value in iter do
    total = total + value
  end
  return total
end

local KIND = { table = "list", ["function"] = "generator" }

local function main()
  local start, step, count = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  start, step, count = tonumber(start), tonumber(step), tonumber(count)

  for value in ticker(start, step, count) do
    print(value)
  end
  print("SUM " .. sum(ticker(start, step, count)))
  print(KIND[type(ticker(start, step, count))])
end

main()
'''
hints = [
  "return coroutine.wrap(function() ... end) — the body yields; the wrap turns it into a function the for can call.",
  "coroutine.yield(value), then advance. The body pauses at the yield and resumes after it on the next call.",
  "A wrapped coroutine can be consumed once, and calling it after it is dead is an error. That is why main builds a fresh ticker for the sum instead of reusing the one the loop drained.",
]

