[[quest]]
id          = "lua.advanced.10.dict-comprehensions"
node        = 10
title       = "THE SAME PASS, KEYED"
difficulty  = 2
story       = "The incense stall's prices are on scraps of red paper in the order they were written. Auntie wants them as one board, and she wants it twice."
concepts    = ["comprehensions", "collections", "sorting"]
requires    = ["lua.advanced.09.comprehensions"]
map          = { x = 0.671, y = 0.280, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<ITEM> <PRICE>`. `PRICE` is
a whole number of cents. An item appears at most once, and `n` is at least
`1` — there is always a cheapest item to name.

Print three lines:

1. every item priced **strictly over 100**, as `ITEM=PRICE`, sorted by item,
   joined by single spaces — or `-` if there are none
2. every item with its price **halved by integer division**, same format,
   sorted by item
3. `CHEAPEST <item>` — the lowest price, ties broken by the item ascending

```
input:  3
        LAI-SEE 120
        CHOY 80
        BOK-CHOY 250
output: BOK-CHOY=250 LAI-SEE=120
        BOK-CHOY=125 CHOY=40 LAI-SEE=60
        CHEAPEST CHOY
```

The keyed version of the last node. Lua has no dict comprehension; the
nearest thing is `filter_pairs(t, keep)` and `map_values(t, f)`, each a
`pairs` loop that fills a new table by the same keys. The first line keeps
the pairs where the value is over 100; the second transforms every value
with `math.floor(v / 2)` and keeps every key. Neither is a comprehension,
and both are one function each, written once.

`pairs` has no order, so `sorted_keys(t)` — the keys in a list, sorted — is
the third helper, and every printed line goes through it. For the cheapest,
walk the sorted keys and keep the first strictly lower price: because the
keys come in alphabetical order, the first of equal prices is the tie-break.
'''
starter     = '''
local function main()
  local n = tonumber(io.read("*l"))
  local prices = {}
  for _ = 1, n do
    local item, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    prices[item] = tonumber(cents)
  end

  -- 1. the ones over 100, as ITEM=PRICE, sorted, or "-"
  -- 2. every price halved, same format, sorted
  -- 3. CHEAPEST <item>, ties alphabetical
  print("-")
  print("-")
  print("CHEAPEST")
end

main()
'''
solution    = '''
local function sorted_keys(t)
  local keys = {}
  for key in pairs(t) do
    keys[#keys + 1] = key
  end
  table.sort(keys)
  return keys
end

local function filter_pairs(t, keep)
  local out = {}
  for key, value in pairs(t) do
    if keep(key, value) then
      out[key] = value
    end
  end
  return out
end

local function map_values(t, f)
  local out = {}
  for key, value in pairs(t) do
    out[key] = f(value)
  end
  return out
end

local function board(t)
  local parts = {}
  for _, key in ipairs(sorted_keys(t)) do
    parts[#parts + 1] = key .. "=" .. t[key]
  end
  return #parts > 0 and table.concat(parts, " ") or "-"
end

local function main()
  local n = tonumber(io.read("*l"))
  local prices = {}
  for _ = 1, n do
    local item, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    prices[item] = tonumber(cents)
  end

  local dear = filter_pairs(prices, function(_, price) return price > 100 end)
  print(board(dear))

  local half = map_values(prices, function(price) return math.floor(price / 2) end)
  print(board(half))

  local cheapest
  for _, item in ipairs(sorted_keys(prices)) do
    if cheapest == nil or prices[item] < prices[cheapest] then
      cheapest = item
    end
  end
  print("CHEAPEST " .. cheapest)
end

main()
'''
hints = [
  "filter_pairs keeps a key when keep(key, value) is true; map_values writes f(value) at every key. Both fill a fresh table — never write into the one you are walking.",
  "sorted_keys(t) is the only way to print a keyed table in a fixed order. Every line here goes through it, including the cheapest.",
  "Walk the sorted keys and replace the best only on a strictly lower price: the first of equal prices is alphabetically first, so the tie settles itself.",
]

