brief       = '''
Standard input is a count `n` and then `n` integers.

Create one **coroutine** per value that computes its square and stores it
in `results[i]` — its own slot, so no two runners write the same place.
Resume every one of them, then print the results **in index order**, one
per line, then `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Lua has no threads; it has coroutines, and `type(co)` for one of them is
the string `thread`, which is the count on the last line. `coroutine.create(f)`
does not run `f`. `coroutine.resume(co, ...)` runs it, with the arguments
becoming `f`'s parameters on the **first** resume, until it yields or
returns — and `square` never yields, so one resume is the whole job. The
result has to be written somewhere `main` can read afterwards; the
slot-per-runner table is the simplest such place.

The starter's runners all crash the moment they start, and the program
still finishes and prints. `coroutine.resume(co)` with no arguments calls
`square(nil, nil)`, the arithmetic on `nil` lands inside the coroutine, and
`resume` reports it as a return value — `false` and the message — that the
starter throws away. `results` stays empty and every line says `nil`. A
coroutine that dies takes only itself with it — read `resume`'s second
result, or you will never know.
'''
starter     = '''
local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end
  local results = {}

  local function square(index, value)
    results[index] = value * value
  end

  local runners = {}
  for i = 1, #nums do
    local co = coroutine.create(square)
    runners[i] = co
    coroutine.resume(co)
  end

  for i = 1, #nums do
    print(results[i])
  end
  print("THREADS " .. #nums)
end

main()
'''
solution    = '''
local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end
  local results = {}

  local function square(index, value)
