[[quest]]
id          = "lua.advanced.16.timeouts"
node        = 33
title       = "STOP WAITING"
difficulty  = 4
story       = "The marshal's board pings every stall on the lane for its wait time, and the stall whose card reader is down never answers, so the board never redraws."
concepts    = ["async", "cancellation", "error-handling"]
