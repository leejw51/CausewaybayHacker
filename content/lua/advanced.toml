map          = { x = 0.114, y = 0.663, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each either

* `STALL <NAME> <AISLE>` — renders as `<NAME> / A<AISLE>`
* `COUNTER <NUMBER>` — renders as `COUNTER <NUMBER>`

Declare a protocol `Sign` as a list of method names — `{ "render" }` —
and `implements(object, protocol)`, which is true when the object has a
function at every one of them. Write `Stall` and `Counter` as plain
classes — **no mention of `Sign`** — and a single function `show(sign)`
that prints the rendering. Print every sign, then `SIGNS <n>` counted with
`implements(x, Sign)`, then `STALLS <k>` counted with `is_a(x, Stall)`,
which compares metatables.

```
input:  3
        STALL LAM 4
        COUNTER 2
        STALL WONG 1
output: LAM / A4
        COUNTER 2
        WONG / A1
        SIGNS 3
        STALLS 2
```

A protocol is a **structural** type: a class satisfies it by having the
methods, not by saying so. Lua has no name for that because it is the only
kind of type Lua has. The check is a lookup by name, at run time, and it
has to be the **same lookup the call makes**: `object[name]`, which goes
through `__index` to the class where the methods live. The starter checks
with `rawget`, which looks only in the instance itself, finds no `render`
on any of them, and reports `SIGNS 0`.

`show` dispatches at run time by that lookup — `sign:render()` finds
whichever `render` the metatable chain has. There is no static dispatch to
choose instead; Lua has one mechanism and this is it.
