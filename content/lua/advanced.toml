function Price.new(name, cents)
  return setmetatable({ name = name, cents = cents }, Price)
end

local Tally = {}
Tally.__index = Tally

function Tally.new()
  return setmetatable({ count = 0 }, Tally)
end

local function main()
  local n = tonumber(io.read("*l"))
  local prices = {}
  for _ = 1, n do
    local name, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    prices[#prices + 1] = Price.new(name, tonumber(cents))
  end

  for _, price in ipairs(prices) do
    local ok = pcall(function() price.cents = 0 end)
    if ok then
      print("MUTATED " .. price.name)
    else
      print("FROZEN " .. price.name)
    end
  end

  local tally = Tally.new()
  tally.count = n
  local ok = pcall(function() tally.cuont = 0 end)
  print(ok and "SLOTS NO" or "SLOTS YES")

  local set, members = {}, 0
  for _, price in ipairs(prices) do
    if not set[price] then
      set[price] = true
      members = members + 1
    end
  end
  print("IN_SET " .. members)

  local total = 0
  for _, price in ipairs(prices) do
    total = total + price.cents
  end
  print("TOTAL " .. total)
end

main()
'''
solution    = '''
local Price = {}
Price.__index = Price

function Price.new(name, cents)
  -- the fields live here, behind the proxy; the proxy itself stays empty
  local fields = setmetatable({ name = name, cents = cents }, Price)
  return setmetatable({}, {
    __index = fields,
    __newindex = function(_, key)
      error("frozen: cannot set " .. key, 2)
    end,
  })
end

function Price:key()
  -- a value key: two records with the same fields are one member
  return self.name .. ":" .. self.cents
end

local Tally = {}
Tally.__index = Tally
local SLOTS = { count = true }

function Tally.new()
  return setmetatable({}, {
    __index = Tally,
    __newindex = function(self, key, value)
      if not SLOTS[key] then
        error("no slot " .. key, 2)
      end
      rawset(self, key, value)
    end,
  })
end

local function main()
  local n = tonumber(io.read("*l"))
  local prices = {}
  for _ = 1, n do
    local name, cents = io.read("*l"):match("(%S+)%s+(%S+)")
    prices[#prices + 1] = Price.new(name, tonumber(cents))
  end

  for _, price in ipairs(prices) do
    local ok = pcall(function() price.cents = 0 end)
    if ok then
      print("MUTATED " .. price.name)
    else
      print("FROZEN " .. price.name)
    end
  end

  local tally = Tally.new()
  tally.count = n
  local ok = pcall(function() tally.cuont = 0 end)
  print(ok and "SLOTS NO" or "SLOTS YES")

  local set, members = {}, 0
  for _, price in ipairs(prices) do
    if not set[price:key()] then
      set[price:key()] = true
      members = members + 1
    end
  end
  print("IN_SET " .. members)

  local total = 0
  for _, price in ipairs(prices) do
    total = total + price.cents
  end
  print("TOTAL " .. total)
end

main()
'''
