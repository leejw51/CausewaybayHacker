    end
  end

  local total = 0
  local hits = 0

  local function pay(value)
    local drawer = total          -- read the drawer
    coroutine.yield()             -- hand the floor to the next stall
    total = drawer + value        -- write it back
    hits = hits + 1
  end

  local runners = {}
  for i = 1, #nums do
    runners[i] = coroutine.create(pay)
  end

  -- round robin: every runner that is not dead gets a turn, until none is left
  local live = #runners
  while live > 0 do
    live = 0
    for i, co in ipairs(runners) do
      if coroutine.status(co) ~= "dead" then
        local ok, err = coroutine.resume(co, nums[i])
        if not ok then
          error(err)
        end
        if coroutine.status(co) ~= "dead" then
          live = live + 1
        end
      end
    end
  end

  print("TOTAL " .. total)
  print("HITS " .. hits)
end

main()
'''
