map          = { x = 0.605, y = 0.932, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<STALL> <SECONDS>`, where
`SECONDS` is `0` for a stall that answers at once and `1` for one that does
not answer in time.

Time here is **ticks**: a tenth of a second is one `coroutine.yield()`, and
`fetch(stall, seconds)` yields ten times per second before it returns
`<STALL> OK`. For each stall, run its `fetch` as a coroutine under
`wait_for(task, 2)` — a deadline of two ticks, 0.2 seconds — and print
`<STALL> OK` or `<STALL> TIMEOUT`, in input order. Then start a `watch()`
coroutine that loops forever, give it one turn, cancel it by **resuming it
with `"cancel"`**, and let it print `CANCELLED` from its handler and
`CLEANUP` from the code that runs on every path. Last, print
`TIMEOUTS <k>`.

```
input:  3
        LAM 0
        WONG 1
        CHAN 0
output: LAM OK
        WONG TIMEOUT
        CHAN OK
        CANCELLED
        CLEANUP
        TIMEOUTS 1
```

`wait_for` resumes the task at most `ticks` times and reports whether it
finished; if it is still `suspended` after its last turn, that is the
timeout, and the task is simply never resumed again. The starter resumes
`fetch` to the end instead, so `WONG` takes all ten ticks and then says
`OK`.

Cancelling a coroutine is delivering a value to the yield it is parked on.
`watch` yields inside a `pcall`, and when the yield returns `"cancel"` it
raises; the `pcall` catches that — the handler that prints `CANCELLED` —
and then the cleanup line runs, and then the error is raised again, so the
resume that delivered the cancel gets `false, "cancelled"` back. The
starter creates the watcher, gives it a turn, and drops it: a coroutine
nobody resumes again runs nothing, ever, and neither line prints. Re-raise
after handling — swallowing the cancel is how a task becomes
uncancellable.
'''
starter     = '''
-- a tenth of a second is one yield
local function fetch(stall, seconds)
  for _ = 1, seconds * 10 do
    coroutine.yield()
  end
  return stall .. " OK"
end

local function run_to_end(task)
  local value
  repeat
    local ok, result = coroutine.resume(task)
    if not ok then
      error(result, 0)
    end
    value = result
  until coroutine.status(task) == "dead"
  return value
end

local function watch()
  local ok, err = pcall(function()
    while true do
      local signal = coroutine.yield()
      if signal == "cancel" then
        error("cancelled", 0)
      end
    end
  end)
  if not ok then
    print("CANCELLED")
  end
  print("CLEANUP")
  if not ok then
    error(err, 0)
  end
end

local function run(stalls)
  local timeouts = 0
  for _, stall in ipairs(stalls) do
    local task = coroutine.create(function()
      return fetch(stall.name, stall.seconds)
    end)
    print(run_to_end(task))
  end

  local watcher = coroutine.create(watch)
  coroutine.resume(watcher)
  watcher = nil   -- cancelled, surely
  print("TIMEOUTS " .. timeouts)
end

local function main()
  local n = tonumber(io.read("*l"))
  local stalls = {}
  for _ = 1, n do
    local name, seconds = io.read("*l"):match("(%S+)%s+(%S+)")
    stalls[#stalls + 1] = { name = name, seconds = tonumber(seconds) }
  end
  run(stalls)
end

main()
'''
solution    = '''
-- a tenth of a second is one yield
local function fetch(stall, seconds)
  for _ = 1, seconds * 10 do
    coroutine.yield()
  end
  return stall .. " OK"
end

-- at most `ticks` turns; returns true and the result, or false on the deadline
local function wait_for(task, ticks)
  for _ = 1, ticks do
    local ok, result = coroutine.resume(task)
    if not ok then
      error(result, 0)
    end
    if coroutine.status(task) == "dead" then
      return true, result
    end
  end
  return false
end

local function watch()
  local ok, err = pcall(function()
    while true do
      local signal = coroutine.yield()
      if signal == "cancel" then
        error("cancelled", 0)
      end
    end
  end)
  if not ok then
    print("CANCELLED")    -- the handler
  end
  print("CLEANUP")        -- runs on every path
  if not ok then
    error(err, 0)         -- re-raise: the canceller sees false, "cancelled"
  end
end

local function run(stalls)
  local timeouts = 0
  for _, stall in ipairs(stalls) do
    local task = coroutine.create(function()
      return fetch(stall.name, stall.seconds)
    end)
    local done, result = wait_for(task, 2)
    if done then
      print(result)
    else
      timeouts = timeouts + 1
      print(stall.name .. " TIMEOUT")
    end
  end

  local watcher = coroutine.create(watch)
  coroutine.resume(watcher)              -- one turn: it parks on its first yield
  local ok, err = coroutine.resume(watcher, "cancel")
  if ok or err ~= "cancelled" then
    error("the watcher did not cancel: " .. tostring(err), 0)
  end
  print("TIMEOUTS " .. timeouts)
end

local function main()
  local n = tonumber(io.read("*l"))
  local stalls = {}
  for _ = 1, n do
    local name, seconds = io.read("*l"):match("(%S+)%s+(%S+)")
    stalls[#stalls + 1] = { name = name, seconds = tonumber(seconds) }
  end
  run(stalls)
end

main()
'''
hints = [
  "wait_for(task, 2): resume up to twice, return true and the result if the task went dead, false otherwise. A task that timed out is just never resumed again.",
  "coroutine.resume(watcher, \"cancel\") — the string is what the watcher's yield returns, and its own code turns that into an error. Setting the variable to nil cancels nothing; it only forgets the coroutine.",
  "The first resume after create gives the watcher its turn to start and park on the yield, so the cancel has a yield to land on and not a function that has not begun.",
]

