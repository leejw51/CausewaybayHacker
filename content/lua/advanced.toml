[[quest]]
id          = "lua.advanced.12.frozen"
node        = 29
title       = "IT DOES NOT CHANGE"
difficulty  = 4
story       = "The printed price list for the night is handed to every stall at 18:00, and by 21:30 three of them have written on it and one has added a column that is not there."
concepts    = ["structs", "mutability", "error-handling"]
requires    = ["lua.advanced.11.protocol"]
map          = { x = 0.059, y = 0.950, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<NAME> <CENTS>`.

Build each line into a **frozen** record `Price.new(name, cents)`. Then,
for each price, try to overwrite its `cents` and print `FROZEN <NAME>` when
the attempt raises. Next, a `Tally` class with one declared slot, `count`:
set `tally.count`, then try to set a misspelt `tally.cuont` and print
`SLOTS YES` when *that* raises. Finally `IN_SET <k>`, the size of a set
of the prices keyed by **value**, and `TOTAL <sum>`.

```
input:  3
        LAM 1200
        WONG 900
        LAM 1200
output: FROZEN LAM
        FROZEN WONG
        FROZEN LAM
        SLOTS YES
        IN_SET 2
        TOTAL 3300
```

A Lua table is writable, always; freezing one is a metatable trick. Keep
the fields in a table the caller never sees, hand back an **empty proxy**
whose `__index` is the fields — every read falls through — and whose
`__newindex` raises: every write to a key the proxy does not have goes
there, and the proxy has none. `pcall` around the assignment is how the
attempt is made without dying.

The set is the other half. Tables are keys **by identity**: two records
with the same fields are two keys, and the starter's `IN_SET` says `3`.
A frozen record can stand for its value only if the key is made from the
fields — `price:key()` — and that is safe precisely because the fields
cannot change under it.

`Tally`'s slot is `__newindex` again, allowing only declared names:
`rawset` for `count`, an error for anything else. A typo in an attribute
name becomes an error at the assignment instead of a silent new field
nobody reads.
'''
starter     = '''
