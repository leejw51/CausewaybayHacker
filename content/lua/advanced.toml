  "local fib; fib = memoize(function(n) ... end) — declare the name first, so the fib inside the body is the upvalue that ends up holding the wrapper. The starter dies on the last line because a plain function has no misses field.",
  "reduce(big.mul_small, range(1, k), big.from(1)) — the third argument is the starting value, and it is what makes the empty range give 1.",
  "partial(parse, 2) returns a function that supplies the base itself and takes the text. unpack(bound, 1, count) puts the bound arguments first; select(\"#\", ...) counts them even if one is nil.",
]

