[[quest]]
id          = "lua.advanced.03.lists"
node        = 3
title       = "THE MIDDLE OF THE DRAGON"
difficulty  = 2
story       = "Sixty-seven metres of straw on the shoulders of a line of carriers, and the marshal at the head can see the first carrier and the last and nothing in between."
concepts    = ["slices", "iteration", "control-flow"]
requires    = ["lua.advanced.02.control-flow"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief       = '''
Standard input is a count `n` on the first line and then `n` integers on the
second, separated by spaces. `n` is at least `1`, so there is always a first
value and a last value to print.

Print three lines: the first value, the last value, and the sum of everything
strictly between them. With fewer than three values that sum is `0`.

```
input:  5
        4 8 15 16 23
output: 4
        23
        39
```

A Lua list is a table with the keys `1..n`, and `#nums` is `n`. The first
element is `nums[1]`; the last is `nums[#nums]`. There is no `nums[-1]` —
a negative key is just a key nothing was stored at, and reading it gives
`nil` without complaint — and there is no slice: the middle is a loop from
`2` to `#nums - 1`, which runs zero times when there is no middle, so the
guard other languages need is free here.

The starter prints `nums[0]`. That is not an error in Lua. It is `nil`, and
`print` writes the word `nil`, and the program exits 0. The land is named
for this.
'''
starter     = '''
local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  -- print nums[1], the last element, then the sum of the middle
  print(nums[0])
end

main()
'''
solution    = '''
local function main()
  local nums = {}
  local first = true
  for token in io.read("*a"):gmatch("%S+") do
    if first then
      first = false
    else
      nums[#nums + 1] = tonumber(token)
    end
  end

  print(nums[1])
  print(nums[#nums])

  local middle = 0
  for i = 2, #nums - 1 do
    middle = middle + nums[i]
  end
  print(middle)
end

main()
'''
hints = [
  "nums[#nums] is the last element; nums[#nums - 1] is the one before it. Nothing negative works.",
  "for i = 2, #nums - 1 is everything except the first and last, and with one value it is for i = 2, 0, which runs zero times on its own.",
  "io.read(\"*a\") reads everything at once and gmatch(\"%S+\") walks the tokens, so the line breaks stop mattering. The first token is the count; skip it.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "five",   stdin = "5\n4 8 15 16 23\n", expect = "4\n23\n39\n", visible = true },
  { name = "single", stdin = "1\n7\n",            expect = "7\n7\n0\n",   visible = false },
  { name = "pair",   stdin = "2\n3 9\n",          expect = "3\n9\n0\n",   visible = false },
]

