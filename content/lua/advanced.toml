```
input:  tofu egg tofu egg fish
        1 3 3 5 8
        3
output: TOP egg 2
        BISECT 1 3
        SMALLEST3 1 3 3
        GROUPS e:2 f:1 t:2
```

Lua ships one container, and every other one is a table plus a discipline.
The starter's `TOP` keeps the first word to reach the top count, which is
`tofu`, in **insertion order**, and the statement says `egg`: sort the
