'''
solution    = '''
local function split(line)
  local parts = {}
  for token in line:gmatch("%S+") do
    parts[#parts + 1] = token
  end
  return parts
end

local function sorted_keys(t)
  local keys = {}
  for key in pairs(t) do
    keys[#keys + 1] = key
  end
  table.sort(keys)
  return keys
end

-- first position (0-based) whose value is not below x
local function bisect_left(list, x)
  local lo, hi = 1, #list + 1
  while lo < hi do
    local mid = math.floor((lo + hi) / 2)
    if list[mid] < x then
      lo = mid + 1
    else
      hi = mid
    end
  end
  return lo - 1
end

-- first position (0-based) whose value is above x
local function bisect_right(list, x)
  local lo, hi = 1, #list + 1
  while lo < hi do
    local mid = math.floor((lo + hi) / 2)
    if list[mid] <= x then
      lo = mid + 1
    else
      hi = mid
    end
  end
  return lo - 1
end

-- a binary min-heap in a list: the parent of i is floor(i / 2)
local Heap = {}
Heap.__index = Heap

function Heap.new()
  return setmetatable({ items = {} }, Heap)
end

function Heap:push(value)
  local items = self.items
  items[#items + 1] = value
  local i = #items
  while i > 1 do
    local parent = math.floor(i / 2)
    if items[parent] <= items[i] then
      break
    end
    items[parent], items[i] = items[i], items[parent]
    i = parent
  end
end

function Heap:pop()
  local items = self.items
  local n = #items
  if n == 0 then
    return nil
  end
  local top = items[1]
  items[1] = items[n]
  items[n] = nil
  n = n - 1
  local i = 1
  while true do
    local left, right, smallest = 2 * i, 2 * i + 1, i
    if left <= n and items[left] < items[smallest] then
      smallest = left
    end
    if right <= n and items[right] < items[smallest] then
      smallest = right
    end
    if smallest == i then
      break
    end
    items[i], items[smallest] = items[smallest], items[i]
    i = smallest
  end
  return top
end

local function main()
  local words = split(io.read("*l"))
  local nums = {}
  for _, token in ipairs(split(io.read("*l"))) do
    nums[#nums + 1] = tonumber(token)
  end
  local x = tonumber(io.read("*l"))

  local counts = {}
  for _, word in ipairs(words) do
    counts[word] = (counts[word] or 0) + 1
  end
  -- walk the words in sorted order and replace only on a strictly higher
  -- count: the first of equal counts is alphabetically first
  local top
  for _, word in ipairs(sorted_keys(counts)) do
    if top == nil or counts[word] > counts[top] then
      top = word
    end
  end
  print("TOP " .. top .. " " .. counts[top])

  print("BISECT " .. bisect_left(nums, x) .. " " .. bisect_right(nums, x))

  local heap = Heap.new()
  for _, value in ipairs(nums) do
    heap:push(value)
  end
  local smallest = {}
  for _ = 1, 3 do
    local value = heap:pop()
    if value == nil then
      break
    end
    smallest[#smallest + 1] = value
  end
  print("SMALLEST3 " .. table.concat(smallest, " "))

  -- a table that makes the list on the first read of a missing key
  local groups = setmetatable({}, {
    __index = function(t, key)
      local list = {}
      rawset(t, key, list)
      return list
    end,
  })
  for _, word in ipairs(words) do
    local bucket = groups[word:sub(1, 1)]
    bucket[#bucket + 1] = word
  end
  local parts = {}
  for _, letter in ipairs(sorted_keys(groups)) do
    parts[#parts + 1] = letter .. ":" .. #groups[letter]
  end
  print("GROUPS " .. table.concat(parts, " "))
end

main()
'''
hints = [
  "Walk sorted_keys(counts) instead of words and replace the top only on a strictly greater count; the tie then goes to the alphabetically first, which is egg.",
  "bisect_left and bisect_right never raise; the starter's index_of returns nil when x is absent and one of the hidden cases is exactly that. Both are the same loop with < swapped for <=.",
  "The heap is a list where the parent of i is floor(i / 2): push appends and swims up, pop moves the last item to the top and sinks it. Three pops are the three smallest, whatever n is.",
  "The __index metamethod runs only for a missing key; rawset inside it stores the new list so the next read is a plain hit. Sort the keys before printing — a table with a metatable is still in no order.",
]

