solution    = '''
local Bag = {}
Bag.__index = Bag

function Bag.new(goods)
  return setmetatable({ goods = goods }, Bag)
end

function Bag:len()
  return #self.goods
end

function Bag:iter()
  local i = 0
  return function()
    i = i + 1
    return self.goods[i]
  end
end

function Bag:has(item)
  for _, good in ipairs(self.goods) do
    if good == item then
      return true
    end
  end
  return false
end

local function longest(container)
  local best
  for item in container:iter() do
    if best == nil or #item > #best then
      best = item
    end
  end
  return best
end

local function main()
  local goods = {}
  for token in io.read("*l"):gmatch("%S+") do
    goods[#goods + 1] = token
  end
  local bag = Bag.new(goods)
  local word = io.read("*l"):match("^%s*(.-)%s*$")

  print("LEN " .. bag:len())
  for item in bag:iter() do
    print(item)
  end
  print("HAS " .. word .. " " .. (bag:has(word) and "YES" or "NO"))
  print("LONGEST " .. longest(bag))
end

main()
'''
