  { name = "exactly-100",  stdin = "1\nEDGE 100\n",                              expect = "-\nEDGE=50\nCHEAPEST EDGE\n",                                              visible = false },
  { name = "tie",      stdin = "3\nZUCCHINI 30\nAUBERGINE 30\nMELON 90\n",     expect = "-\nAUBERGINE=15 MELON=45 ZUCCHINI=15\nCHEAPEST AUBERGINE\n",               visible = false },
  { name = "odd",      stdin = "2\nODD 101\nONE 1\n",                           expect = "ODD=101\nODD=50 ONE=0\nCHEAPEST ONE\n",                                    visible = false },
