brief       = '''
Three lines of standard input: a line of words, a line of integers already
**sorted ascending**, and one integer `x`.

Print four lines:

1. `TOP <word> <count>` — the most frequent word, ties by the word ascending
   — from a table of counts
2. `BISECT <l> <r>` — `bisect_left` and `bisect_right` of `x` in the sorted
