[[quest]]
id          = "lua.advanced.13.dataclasses"
node        = 13
title       = "WHO IS BUYING"
difficulty  = 3
story       = "The rice counter by Lin Fa Kung charges every ticket the full price, including the ones that are not adults and the one that is not a ticket."
concepts    = ["types", "pattern-matching", "structs"]
requires    = ["lua.advanced.12.classes"]
map          = { x = 0.185, y = 0.313, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <KG>`.

The base price is `500 + 100 * KG` cents. For each line print one of:

* `ADULT` — the base price
* `STUDENT` — half the base price, integer division
* `SENIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

Model the line as a record — `Order.new(kind, kg)` — and decide the price
with **one dispatch table**: a table keyed by the kind whose values are
functions, looked up once, with a fallthrough when the key is not there.
Lua has no `match`; a table of arms keyed by the tag is the nearest thing
it has, and `arms[order.kind]` being `nil` is the wildcard case.

The starter's table has one arm, and every other kind — the three it is
supposed to know included — falls through to `UNKNOWN`. Each arm is a
function of the order; each returns a string, because `450` and `"450"`
print the same and the `UNKNOWN` line is text either way.
'''
starter     = '''
local Order = {}
Order.__index = Order

function Order.new(kind, kg)
  return setmetatable({ kind = kind, kg = kg }, Order)
end

function Order:base()
  return 500 + 100 * self.kg
end

local ARMS = {
