main()
'''
solution    = '''
local function lookup(board, name)
  -- board[name] is nil for a missing key; that nil is the contract,
  -- and the comment says so out loud
  return board[name]
end

local function cheapest(board)
  -- a stall, or nil when the board is empty
  local best
  for _, stall in pairs(board) do
    if best == nil or stall.cents < best.cents
        or (stall.cents == best.cents and stall.name < best.name) then
      best = stall
    end
  end
  return best
end

local function main()
  local tokens = io.read("*a"):gmatch("%S+")
  local n = tonumber(tokens())
  local board = {}
  for _ = 1, n do
    local name, cents = tokens(), tonumber(tokens())
    board[name] = { name = name, cents = cents }
  end

  local q = tonumber(tokens())
  local missing = 0
  for _ = 1, q do
    local name = tokens()
    local stall = lookup(board, name)
    if stall == nil then
      missing = missing + 1
      print(name .. " NONE")
    else
      print(name .. " " .. stall.cents)
    end
  end

  print("MISSING " .. missing)
  local best = cheapest(board)
  print("CHEAPEST " .. (best ~= nil and best.name or "NONE"))
end

main()
'''
