brief       = '''
Standard input is a count `n` and then `n` integers.

Write `double(value)` so that it yields to the scheduler once —
`coroutine.yield()` — and returns the value doubled. Make one coroutine per
value, run them all with `gather`, print each result in input order, then
`SUM <total>` and `TASKS <n>`.

```
input:  3
        1 2 3
output: 2
        4
        6
        SUM 12
        TASKS 3
```

`coroutine.create(f)` does not run `f`. It builds a **coroutine object** and
hands it back, and nothing inside happens until something resumes it. The
starter's `run` returns three of them, unresumed, and the output is three
lines of `thread: 0x...` followed by `attempt to perform arithmetic on a
thread value`.

`gather` is the event loop, and here you write it: a `while` over the
tasks that resumes each one that is not dead, in order, round after round,
until none is left, keeping each task's **return value** in that task's
slot. The results come out in the order you passed the tasks in, whatever
order they finished in. That is the whole reason to reach for it over a
loop that resumes one task to death before touching the next: that loop
would be correct and sequential, and `gather` is correct and interleaved.

There is exactly one thread here. `coroutine.yield()` is the point at which
a task hands the thread back to the loop so another can use it. Nothing
runs in parallel; things run **in turn**, at the places they said they
could stop.
