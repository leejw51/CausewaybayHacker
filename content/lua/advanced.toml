map          = { x = 0.335, y = 0.936, kind = "quest" }
brief       = '''
Standard input is three integers: `start`, `step`, `count`.

Write a class `Tickets` that implements the **iterator protocol by hand**:
`next` returns the next value, or `nil` when `count` values have been
handed out, and `iter` returns what a generic `for` needs. Print each
value on its own line, then `SUM <total>` computed by handing a second
`Tickets` to `sum`.

```
input:  2 3 5
output: 2
        5
        8
        11
        14
        SUM 40
```

This is what `coroutine.wrap` writes for you. A generic `for` takes three
things — a function `f`, a state `s`, and a control value — and calls
`f(s, control)` before every turn, stopping when the first result is `nil`.
`Tickets.next` already has that shape: its `self` is the state, and its
second parameter is a control value it can ignore. So `iter` is one line:
`return Tickets.next, self`. `sum`, `collect` and `for` all do the same
dance, and none of them cares what the state is.

The starter has `next` and no `iter`, and the `for` says `attempt to call
method 'iter' (a nil value)`. A `nil` from `next` is `StopIteration`
here; it is why a ticket can never be `nil`, and why `0` is a fine ticket
— `0` is not `nil`.

`iter` returning `self` as the state is the mark of an **iterator**: it
can be walked once and is then spent. A **container** returns a fresh
state from `iter` each time and can be walked repeatedly; `Bag` from
earlier on this road was one. Say which you are writing; the difference
shows up the second time somebody loops.
'''
starter     = '''
local Tickets = {}
Tickets.__index = Tickets

function Tickets.new(start, step, count)
  return setmetatable({ current = start, step = step, left = count }, Tickets)
end

function Tickets:next()
  if self.left == 0 then
    return nil
  end
  local value = self.current
  self.current = self.current + self.step
  self.left = self.left - 1
  return value
end

local function sum(iterable)
  local total = 0
  for value in iterable:iter() do
    total = total + value
  end
  return total
end

local function main()
  local start, step, count = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  start, step, count = tonumber(start), tonumber(step), tonumber(count)

  for value in Tickets.new(start, step, count):iter() do
    print(value)
  end
  print("SUM " .. sum(Tickets.new(start, step, count)))
end

main()
'''
solution    = '''
local Tickets = {}
Tickets.__index = Tickets

function Tickets.new(start, step, count)
  return setmetatable({ current = start, step = step, left = count }, Tickets)
end

function Tickets:next()
  if self.left == 0 then
    return nil
  end
  local value = self.current
  self.current = self.current + self.step
  self.left = self.left - 1
  return value
end

function Tickets:iter()
  -- the iterator protocol: the function, then the state it is called with;
  -- the for calls Tickets.next(self, previous) until it returns nil
  return Tickets.next, self
end

local function sum(iterable)
  local total = 0
  for value in iterable:iter() do
    total = total + value
  end
  return total
end

local function main()
  local start, step, count = io.read("*l"):match("(%S+)%s+(%S+)%s+(%S+)")
  start, step, count = tonumber(start), tonumber(step), tonumber(count)

  for value in Tickets.new(start, step, count):iter() do
    print(value)
  end
  print("SUM " .. sum(Tickets.new(start, step, count)))
end

main()
'''
