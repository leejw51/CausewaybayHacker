[[quest]]
id          = "lua.advanced.13.exceptions"
node        = 30
title       = "AN ERROR OF YOUR OWN"
difficulty  = 4
story       = "Four layers of the rice counter's pricing each raise their own thing, and the counter's front end catches one of them and is taken down by the others."
concepts    = ["error-handling", "structs", "control-flow"]
requires    = ["lua.advanced.12.frozen"]
map          = { x = 0.260, y = 0.857, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each meant to be a weight in
kg.

Define an error hierarchy of **tables**: `PriceError` as the base, with
`NotANumber` and `Negative` made from it by `class(PriceError)`. `Negative`
carries the weight and its message is `negative weight: <kg>`;
`NotANumber`'s message is `not a number`. `price(text)` converts the text,
raising `NotANumber` with the parse failure kept as its `cause`, rejects
a negative weight, and otherwise returns `500 + 100 * kg`.

Print each price or the error's message, then `ERRORS <k>`. Catch the
**base class**, once, with `is_a`.

```
input:  3
        4
        xx
        -2
output: 900
        not a number
        negative weight: -2
        ERRORS 2
```

`error` raises any value, and a table is the one that can carry a message,
a cause and a class. The class is its metatable; `is_a(err, cls)` walks
`parent` links up from it, and one `if is_a(err, PriceError)` catches every
member of the hierarchy. The starter catches `Negative` and nothing else,
so the `xx` line takes the program down with an uncaught table:
`(error object is not a string)`.

`print(err)` prints `tostring(err)`, and `tostring` looks for `__tostring`
**in the metatable, directly** — metamethods are not found through
`__index` chains — so `class` has to put one on every class it makes. The
`cause` is the string `pcall` handed back from the failed parse; nothing
here prints it, and a debugger would show both, one above the other. That
chain is the reason to keep it.
'''
starter     = '''
local function class(parent)
  local c = {}
  c.__index = c
  c.__tostring = function(self) return self.message end
  c.parent = parent
  return setmetatable(c, { __index = parent })
end

local function is_a(err, cls)
  local c = getmetatable(err)
  while c ~= nil do
    if c == cls then
      return true
    end
    c = c.parent
  end
  return false
end

local PriceError = class(nil)

local NotANumber = class(PriceError)
function NotANumber.new(cause)
  return setmetatable({ message = "not a number", cause = cause }, NotANumber)
end

local Negative = class(PriceError)
function Negative.new(kg)
  return setmetatable({ message = "negative weight: " .. kg, kg = kg }, Negative)
end

local function parse_kg(text)
  if not text:match("^%-?%d+$") then
    error("bad integer: " .. text, 0)
  end
  return tonumber(text)
end

local function price(text)
  local ok, kg = pcall(parse_kg, text)
  if not ok then
    error(NotANumber.new(kg))
  end
  if kg < 0 then
    error(Negative.new(kg))
  end
  return 500 + 100 * kg
end

local function main()
  local n = tonumber(io.read("*l"))
  local errors = 0
  for _ = 1, n do
    local line = io.read("*l"):match("^%s*(.-)%s*$")
    local ok, result = pcall(price, line)
    if ok then
      print(result)
    elseif is_a(result, Negative) then
      errors = errors + 1
      print(result)
    else
      error(result, 0)
    end
  end
  print("ERRORS " .. errors)
end

main()
'''
solution    = '''
local function class(parent)
  local c = {}
  c.__index = c
  -- set on every class: tostring reads the metatable directly, never through __index
  c.__tostring = function(self) return self.message end
  c.parent = parent
  return setmetatable(c, { __index = parent })
end

local function is_a(err, cls)
  local c = getmetatable(err)
  while c ~= nil do
    if c == cls then
      return true
    end
    c = c.parent
  end
  return false
end

local PriceError = class(nil)

local NotANumber = class(PriceError)
function NotANumber.new(cause)
  return setmetatable({ message = "not a number", cause = cause }, NotANumber)
end

local Negative = class(PriceError)
function Negative.new(kg)
  return setmetatable({ message = "negative weight: " .. kg, kg = kg }, Negative)
end

local function parse_kg(text)
  if not text:match("^%-?%d+$") then
    error("bad integer: " .. text, 0)
  end
  return tonumber(text)
end

local function price(text)
  local ok, kg = pcall(parse_kg, text)
  if not ok then
    -- the parse failure becomes the cause; the caller sees our type
    error(NotANumber.new(kg))
  end
  if kg < 0 then
    error(Negative.new(kg))
  end
  return 500 + 100 * kg
end

local function main()
  local n = tonumber(io.read("*l"))
  local errors = 0
  for _ = 1, n do
    local line = io.read("*l"):match("^%s*(.-)%s*$")
    local ok, result = pcall(price, line)
