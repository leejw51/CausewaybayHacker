[[quest]]
id          = "lua.advanced.06.sets"
node        = 6
title       = "WHAT BOTH STALLS HAVE"
difficulty  = 2
story       = "Two lantern stalls, one on each side of Ormsby Street, and a customer who wants to know what she can get from either without crossing the dragon's route twice."
concepts    = ["collections", "iteration", "strings"]
requires    = ["lua.advanced.05.dicts"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief       = '''
Two lines of standard input, each a stall's goods separated by spaces. A
stall may list the same thing twice; that counts once.

Print three lines:

1. `BOTH` followed by everything on both lists, sorted, space separated — or
   `BOTH -` if there is nothing
2. `ONLY_A <k>`: how many things are on the first list and not the second
3. `ALL <k>`: how many distinct things are on either list

```
input:  choisum tofu gailan tofu
        gailan egg
output: BOTH gailan
        ONLY_A 2
        ALL 4
```

Lua has no set type. A set is a table whose **keys** are the members and
whose values are `true`: writing `tofu` twice writes the same key twice,
and the duplicate disappears on the way in. Membership is `a[x]`, which is
`true` or `nil`. Intersection, difference and union are three loops over
the keys of one set asking the other — write them as functions and the
three lines are three calls.

`#` does not count a set's keys; it counts the list part, which is empty.
Count with a loop over `pairs`, and sort the members into a list before
printing, because `pairs` has no order.
'''
starter     = '''
local function to_set(line)
  local set = {}
  for word in line:gmatch("%S+") do
    set[word] = true
  end
  return set
end

local function main()
  local a = to_set(io.read("*l"))
  local b = to_set(io.read("*l"))

  -- both: the keys in a that are in b, sorted; only_a: in a and not b; all: in either
  print("BOTH -")
  print("ONLY_A " .. #a)
  print("ALL " .. (#a + #b))
end

main()
'''
solution    = '''
local function to_set(line)
  local set = {}
  for word in line:gmatch("%S+") do
    set[word] = true
  end
  return set
end

local function keys(set)
  local list = {}
  for key in pairs(set) do
    list[#list + 1] = key
  end
  table.sort(list)
  return list
end

local function intersection(a, b)
  local out = {}
  for key in pairs(a) do
    if b[key] then
      out[key] = true
    end
  end
  return out
end

local function difference(a, b)
  local out = {}
  for key in pairs(a) do
    if not b[key] then
      out[key] = true
    end
  end
  return out
end

local function union(a, b)
  local out = {}
  for key in pairs(a) do
    out[key] = true
  end
  for key in pairs(b) do
    out[key] = true
  end
  return out
end

local function main()
  local a = to_set(io.read("*l"))
  local b = to_set(io.read("*l"))

  local both = keys(intersection(a, b))
  print("BOTH " .. (#both > 0 and table.concat(both, " ") or "-"))
  print("ONLY_A " .. #keys(difference(a, b)))
  print("ALL " .. #keys(union(a, b)))
end

main()
'''
hints = [
  "set[word] = true for every token builds the set; the duplicate tofu is the same key written twice.",
  "Intersection is a loop over pairs(a) keeping the keys where b[key] is true. Difference keeps the keys where it is nil. Union writes both sets' keys into one table.",
  "#set is 0 for a table with only string keys. Copy the keys into a list with pairs, table.sort it, and #list is the count and table.concat(list, \" \") is the line.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",   stdin = "choisum tofu gailan tofu\ngailan egg\n", expect = "BOTH gailan\nONLY_A 2\nALL 4\n",  visible = true },
  { name = "disjoint", stdin = "fish\ntofu\n",                          expect = "BOTH -\nONLY_A 1\nALL 2\n",       visible = false },
  { name = "same",     stdin = "egg egg egg\negg\n",                    expect = "BOTH egg\nONLY_A 0\nALL 1\n",     visible = false },
  { name = "many",     stdin = "d c b a\na b c d e\n",                  expect = "BOTH a b c d\nONLY_A 0\nALL 5\n", visible = false },
]

