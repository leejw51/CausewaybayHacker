id          = "lua.advanced.06.async-queue"
node        = 23
title       = "WHO SAYS IT IS DONE"
difficulty  = 4
story       = "Three runners clear the ticket queue at the Victoria Park lantern gate and the marshal waits for the queue to say it is empty. It never says so, because nobody told it a ticket was finished."
concepts    = ["async", "channels", "concurrency", "deadlock"]
requires    = ["lua.advanced.05.asyncio"]
map          = { x = 0.750, y = 0.724, kind = "quest" }
brief       = '''
Standard input is two integers `w` and `n`, then `n` values.

Put `{ index, value }` jobs on a queue that counts what is pending. Start
`w` consumer coroutines that loop forever taking a job, writing
`value * 10` into `results[index]`, and calling `task_done`. The main
function runs `join` — the scheduler that resumes the consumers until every
`put` has had its `task_done` — then cancels the consumers, then prints the
results in index order and `CONSUMERS <w>`.

```
input:  3 4
        1 2 3 4
output: 10
        20
        30
        40
        CONSUMERS 3
```

`join` returns when the pending count is `0`, and only `task_done` lowers
it. The starter's consumers never call it, so every job is handled and the
count still says `4`, every consumer is parked in `get` on an empty queue,
and there is nothing left that could change anything. A loop with no
detector would spin there until the runner killed the program. This one
detects it: a full round in which no consumer lowered the count is a
deadlock, and `join` says so with `error`. Same hang as the hatch quest,
different spelling — and the fix is again one line, on the consumer side.

The consumers are `while true` loops. They end because main cancels them
after the join, and cancelling here means **resuming with a signal**:
`get` yields while the queue is empty, and when the resume that wakes it
passes `"cancel"`, `get` returns `nil` and the consumer returns. A
coroutine parked on a yield is stopped by the value it wakes up to.
'''
starter     = '''
local function new_queue()
  return { head = 1, tail = 0, pending = 0 }
end

local function put(queue, item)
  queue.tail = queue.tail + 1
  queue[queue.tail] = item
  queue.pending = queue.pending + 1
end

local function get(queue)
  -- yields while the queue is empty; a resume carrying "cancel" makes it return nil
  while queue.head > queue.tail do
    local signal = coroutine.yield("idle")
    if signal == "cancel" then
      return nil
    end
  end
  local item = queue[queue.head]
  queue[queue.head] = nil
  queue.head = queue.head + 1
  return item
end

local function task_done(queue)
  queue.pending = queue.pending - 1
end

local function consumer(queue, results)
  while true do
    local job = get(queue)
    if job == nil then
      return
    end
    results[job.index] = job.value * 10
  end
end

local function join(queue, tasks)
  -- resume every consumer in turn until every put has had a task_done;
  -- a full round in which nobody lowered the count is a deadlock
  while queue.pending > 0 do
    local progressed = false
    for _, co in ipairs(tasks) do
      if coroutine.status(co) == "suspended" then
        local before = queue.pending
        local ok, err = coroutine.resume(co)
        if not ok then
          error(err)
        end
        if queue.pending < before then
          progressed = true
        end
      end
    end
    if not progressed then
      error("deadlock: every consumer is idle and " .. queue.pending .. " tasks are not done")
    end
  end
end

local function run(workers, nums)
  local queue = new_queue()
  local results = {}
  for i, value in ipairs(nums) do
    put(queue, { index = i, value = value })
  end

  local tasks = {}
  for w = 1, workers do
    tasks[w] = coroutine.create(function()
      consumer(queue, results)
    end)
  end
  join(queue, tasks)

  for _, co in ipairs(tasks) do
    coroutine.resume(co, "cancel")
  end
  return results
end

local function main()
  local data = {}
  for token in io.read("*a"):gmatch("%S+") do
    data[#data + 1] = tonumber(token)
  end
  local workers, n = data[1], data[2]
  local nums = {}
  for i = 1, n do
    nums[i] = data[2 + i]
  end

  for _, value in ipairs(run(workers, nums)) do
    print(value)
  end
  print("CONSUMERS " .. workers)
end

main()
'''
solution    = '''
local function new_queue()
  return { head = 1, tail = 0, pending = 0 }
end

local function put(queue, item)
  queue.tail = queue.tail + 1
  queue[queue.tail] = item
  queue.pending = queue.pending + 1
end

local function get(queue)
  -- yields while the queue is empty; a resume carrying "cancel" makes it return nil
  while queue.head > queue.tail do
    local signal = coroutine.yield("idle")
    if signal == "cancel" then
      return nil
    end
  end
  local item = queue[queue.head]
  queue[queue.head] = nil
  queue.head = queue.head + 1
  return item
end

local function task_done(queue)
  queue.pending = queue.pending - 1
end

local function consumer(queue, results)
  while true do
    local job = get(queue)
    if job == nil then
      return
    end
    results[job.index] = job.value * 10
    task_done(queue)
  end
end

local function join(queue, tasks)
  -- resume every consumer in turn until every put has had a task_done;
  -- a full round in which nobody lowered the count is a deadlock
  while queue.pending > 0 do
    local progressed = false
    for _, co in ipairs(tasks) do
      if coroutine.status(co) == "suspended" then
        local before = queue.pending
        local ok, err = coroutine.resume(co)
        if not ok then
          error(err)
        end
        if queue.pending < before then
          progressed = true
        end
      end
    end
    if not progressed then
      error("deadlock: every consumer is idle and " .. queue.pending .. " tasks are not done")
    end
  end
end

local function run(workers, nums)
  local queue = new_queue()
  local results = {}
  for i, value in ipairs(nums) do
    put(queue, { index = i, value = value })
  end

  local tasks = {}
  for w = 1, workers do
    tasks[w] = coroutine.create(function()
      consumer(queue, results)
    end)
  end
  join(queue, tasks)

  -- every consumer is parked in get; the signal wakes it up to a nil job
  for _, co in ipairs(tasks) do
    coroutine.resume(co, "cancel")
  end
  return results
end

local function main()
  local data = {}
  for token in io.read("*a"):gmatch("%S+") do
    data[#data + 1] = tonumber(token)
  end
  local workers, n = data[1], data[2]
  local nums = {}
  for i = 1, n do
    nums[i] = data[2 + i]
  end

  for _, value in ipairs(run(workers, nums)) do
    print(value)
  end
  print("CONSUMERS " .. workers)
end

main()
