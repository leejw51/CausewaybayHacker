solution    = '''
local function split(line)
  local parts = {}
  for token in line:gmatch("%S+") do
    parts[#parts + 1] = token
  end
  return parts
end

local function main()
  local names = split(io.read("*l"))
  local prices = split(io.read("*l"))

  local stalls = {}
  for i = 1, #names do
    stalls[i] = { name = names[i], price = tonumber(prices[i]) }
  end
  table.sort(stalls, function(a, b)
    if a.price ~= b.price then
      return a.price < b.price
    end
    return a.name < b.name
  end)

  for rank, stall in ipairs(stalls) do
    print(rank .. ". " .. stall.name .. " " .. stall.price)
  end
  print("CHEAPEST " .. stalls[1].name)
end

main()
'''
