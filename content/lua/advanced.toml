The starter fails for a reason that has nothing to do with timing.
`local part = coroutine.resume(co, lo, hi)` keeps the **first** result of
`resume`, which is `true`, and the answer that followed it is dropped on
the floor; the first `CHUNK` line is `attempt to concatenate local 'part'
(a boolean value)`. That is the small bug. Fix it the way the drawer quest
did: a shared total updated with no yield between the read and the write,
the per-chunk slot written by exactly one runner, and the scheduler from
the lock quest — every runner that is not dead gets a turn, until none is
left.

The sums pass 2^53 on the big case, and a Lua number is a double: past
that point `+` rounds. Carry each sum as two limbs — a low part under 10^9
and a high part of the rest — and print them as `%d%09d`.

The big thing is the boss, and it is not a bug you can fix. Run this with
`k = 4` and `n = 4000000` and time it, then run it with `k = 1`. They take
the same time. Then delete the yield from the loop and run it again: the
same output, the same time, and no error. A coroutine holds the floor
until it says `yield`; a runner that never says it runs to the end while
the other three wait, and nothing tells you, because nothing else needed
the floor. That is the dragon stopped on one segment with the drums still
going. Four coroutines on four cores sum the squares in turn, on one core,
plus the cost of switching. LuaJIT has no threads. A coroutine is a place
to stop, not a second core; the run is **in turn**, at the places each
runner said it could pause. Parallel work is a second process — `io.popen`
— or the LÖVE client's `love.thread`, which is a separate Lua state that
shares nothing and talks through a channel.

The output is deterministic because the chunks are printed by index and
the total is the sum of the chunks, not the order the runners finished in.
Print `TOTAL` from the shared total, not from summing the slots — the
update with no yield in it is the thing this map is about, and the two
have to agree.
'''
starter     = '''
local function work(lo, hi)
  -- sum of i*i for i in lo..hi, as a plain loop on purpose
  local part = 0
  for i = lo, hi do
    part = part + i * i
  end
  return part
end

local function main()
  local k, n = io.read("*l"):match("(%S+)%s+(%S+)")
  k, n = tonumber(k), tonumber(n)

  local runners = {}
  for i = 0, k - 1 do
    runners[i + 1] = coroutine.create(work)
  end

  local total = 0
  for i = 0, k - 1 do
    local lo = math.floor(n * i / k) + 1
    local hi = math.floor(n * (i + 1) / k)
    local part = coroutine.resume(runners[i + 1], lo, hi)
    print("CHUNK " .. i .. " " .. part)
    total = total + part
  end

  print("TOTAL " .. total)
  print("THREADS " .. k)
end

main()
'''
solution    = '''
-- a sum past 2^53 as two limbs: hi * 10^9 + lo, both exact doubles
local BASE = 1000000000

local function new_sum()
  return { hi = 0, lo = 0 }
end

local function add_small(sum, x)
  sum.lo = sum.lo + x
  if sum.lo >= BASE then
    local carry = math.floor(sum.lo / BASE)
    sum.hi = sum.hi + carry
    sum.lo = sum.lo - carry * BASE
  end
end

local function add_sum(sum, other)
  sum.hi = sum.hi + other.hi
  add_small(sum, other.lo)
end

local function show(sum)
  if sum.hi == 0 then
    return string.format("%d", sum.lo)
  end
  return string.format("%d%09d", sum.hi, sum.lo)
end

local function main()
  local k, n = io.read("*l"):match("(%S+)%s+(%S+)")
  k, n = tonumber(k), tonumber(n)

  local chunks = {}
  local total = new_sum()

  local function work(index, lo, hi)
    -- sum of i*i for i in lo..hi, as a plain loop on purpose: this is the
    -- CPU-bound work that runs in turn however many coroutines carry it
    local part = new_sum()
    for i = lo, hi do
      add_small(part, i * i)
      if i % 100000 == 0 then
        coroutine.yield()      -- hand the floor over; delete this and nothing changes
      end
    end
    chunks[index] = part
    -- read, add, write with no yield between: the update cannot be lost
    add_sum(total, part)
  end

  local runners = {}
  for i = 0, k - 1 do
    local lo = math.floor(n * i / k) + 1
    local hi = math.floor(n * (i + 1) / k)
    runners[i + 1] = coroutine.create(function()
      work(i, lo, hi)
    end)
  end

  -- round robin until every runner is dead
  local live = k
  while live > 0 do
    live = 0
    for _, co in ipairs(runners) do
      if coroutine.status(co) ~= "dead" then
        local ok, err = coroutine.resume(co)
        if not ok then
          error(err, 0)
        end
        if coroutine.status(co) ~= "dead" then
          live = live + 1
        end
      end
    end
  end

  for i = 0, k - 1 do
    print("CHUNK " .. i .. " " .. show(chunks[i]))
  end
  print("TOTAL " .. show(total))
  print("THREADS " .. k)
end

main()
'''
hints = [
  "resume returns ok first and the values after it. Better: give work an index and a slot to write, and a shared total to add into, and let the scheduler resume until dead; then nothing has to come out of resume at all.",
  "Resume all, round after round, then print. Printing inside the runners would interleave; printing after the loop, from the slots, cannot.",
  "Two limbs: lo under 10^9 with the carry moved to hi on every add. 41666791666750000 is hi 41666791 and lo 666750000, printed as %d%09d.",
  "n*(n+1)*(2n+1)/6 is the closed form for the total. Check TOTAL against it once and you know the chunk boundaries are right. Then time k=1 against k=4 on a big n: when they match, you have met the coroutine.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 10000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",   stdin = "3 10\n",       expect = "CHUNK 0 14\nCHUNK 1 77\nCHUNK 2 294\nTOTAL 385\nTHREADS 3\n", visible = true },
  { name = "one",      stdin = "1 4\n",        expect = "CHUNK 0 30\nTOTAL 30\nTHREADS 1\n",                           visible = false },
  { name = "idle",     stdin = "3 2\n",        expect = "CHUNK 0 0\nCHUNK 1 1\nCHUNK 2 4\nTOTAL 5\nTHREADS 3\n",       visible = false },
  { name = "big",      stdin = "4 2000000\n",  expect = "CHUNK 0 41666791666750000\nCHUNK 1 291667041666750000\nCHUNK 2 791667291666750000\nCHUNK 3 1541667541666750000\nTOTAL 2666668666667000000\nTHREADS 4\n", visible = false },
]
