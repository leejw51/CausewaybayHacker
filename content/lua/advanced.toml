  { name = "empty",     stdin = "0\n",                             expect = "TOTAL 0\nNotebook(items=0, total=0)\n",                                   visible = false },
  { name = "repeats",   stdin = "3\nTEA 1200\nTEA 1200\nPIE 900\n", expect = "TEA 1200\nTEA 1200\nPIE 900\nTOTAL 3300\nNotebook(items=3, total=3300)\n", visible = false },
