[[quest]]
id           = "lua.hacker.30.range-queries"
node         = 29
title        = "TOTALS THAT KEEP CHANGING"
difficulty   = 5
time_limit_s = 1500
story        = "Three hundred thousand till operations from one night across every stall in the park, half of them corrections, and somebody wants the running totals."
concepts     = ["prefix-sums", "complexity", "collections"]
requires     = ["lua.hacker.29.dijkstra"]
map          = { x = 0.059, y = 0.950, kind = "quest" }
brief        = '''
Standard input is `n q seed`. Build an array of `n` values and then run `q`
operations, all from the same generator, in 64-bit arithmetic that wraps
(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

values[i] = next() % 1000            for i in 0..n

for each of the q operations:
    a = next(); b = next(); c = next()
    if a % 2 == 0:   UPDATE  values[b % n] += (c % 1000) + 1
    else:            QUERY   l = b % n, r = c % n, swap them if l > r,
                             and add sum(values[l..r]) to a running total
```

Print the running total of every query answer, then `UPDATES <k>`.

```
input:  8 6 1
output: 4112
        UPDATES 3
```

**The complexity here is enforced.** The big hidden case is `n = 500000,
q = 300000`. The starter is the answer from node 23: a prefix-sum table,
which makes every query `O(1)` — and which every update breaks, so the
starter rebuilds it, `O(n)` per update, a hundred and fifty thousand times.
On this machine that took **57 seconds** against a ten second run limit.
(Summing the range with a plain loop instead is no better in kind and only
a little better in practice: it is `O(n)` per *query* rather than per
update, and it took about 14 seconds here.) A Fenwick tree does the whole
thing in a few hundredths of a second. All measured, with the programs in
this quest.

(The Rust and Go versions of this quest run four million operations. This
land keeps Python's three hundred thousand, because the cases are the
reference's — and the point is to separate the right structure from the
wrong one, not one runtime from another.)

The lesson is the one an interviewer is fishing for: *point update, range sum*
is the exact shape a Fenwick tree exists for. Three short functions — add,
prefix, and range as the difference of two prefixes — and `bit.band(i, -i)`
is how you step by the lowest set bit: the `bit` library treats `-i` as a
two's-complement 32-bit integer, which is what makes that trick work.

The running total passes `10^13`. A Lua number holds every integer up to
`2^53` exactly, and `print` shows all fourteen digits of it; that is the
margin you have, and knowing it is part of the answer.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local values = {}
for i = 0, n - 1 do values[i] = nxt() % 1000 end

-- prefix sums, as on node 23: prefix[i] is the sum of values[0..i-1]
local prefix = { [0] = 0 }
local function rebuild()
  for i = 0, n - 1 do prefix[i + 1] = prefix[i] + values[i] end
end
rebuild()

local total, updates = 0, 0
for _ = 1, q do
  local a, b, c = nxt(), nxt(), nxt()
  if a % 2 == 0 then
    values[b % n] = values[b % n] + c % 1000 + 1
    updates = updates + 1
    -- correct, and far too slow: every update rebuilds the whole table
    rebuild()
  else
    local l, r = b % n, c % n
    if l > r then l, r = r, l end
    total = total + prefix[r + 1] - prefix[l]
  end
end

print(total)
print("UPDATES " .. updates)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local band = bit.band

-- Fenwick tree, 1-based: tree[i] covers the band(i, -i) values ending at i
local tree = {}
for i = 1, n do tree[i] = 0 end

local function add(index, delta)
  local i = index + 1
  while i <= n do
    tree[i] = tree[i] + delta
    i = i + band(i, -i)  -- step up by the lowest set bit
  end
end

local function prefix(upto)
  local i, sum = upto, 0
  while i > 0 do
    sum = sum + tree[i]
    i = i - band(i, -i)
  end
  return sum
end

local function range(l, r)
  return prefix(r + 1) - prefix(l)
end

for i = 0, n - 1 do add(i, nxt() % 1000) end

local total, updates = 0, 0
for _ = 1, q do
  local a, b, c = nxt(), nxt(), nxt()
  if a % 2 == 0 then
    add(b % n, c % 1000 + 1)
    updates = updates + 1
  else
    local l, r = b % n, c % n
    if l > r then l, r = r, l end
    total = total + range(l, r)
  end
end

print(total)
print("UPDATES " .. updates)
'''
hints = [
  "Build the tree by calling add once per initial value. The O(n) bottom-up build is a nice optimisation and is not what the clock is testing.",
  "bit.band(i, -i) isolates the lowest set bit — the bit library sees -i as two's complement. Adding it walks up the tree; subtracting it walks down.",
  "range(l, r) is prefix(r + 1) - prefix(l), and getting that pair of off-by-ones right is most of the debugging. Binding bit.band to a local is the only micro-optimisation this quest needs, and LuaJIT barely needs that.",
]

