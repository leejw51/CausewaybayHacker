[[quest]]
id           = "lua.hacker.14.word-search"
node         = 14
title        = "IS THE WORD IN THE GRID"
difficulty   = 5
time_limit_s = 1200
story        = "A board of letters and a name off a lantern riddle. They want to know whether the name is written in it, and they want the count of dead ends."
concepts     = ["backtracking", "matrix", "graphs"]
requires     = ["lua.hacker.13.backtracking"]
map          = { x = 0.119, y = 0.272, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are a grid of lowercase letters. The
last line is the word.

The word is in the grid if you can spell it by moving up, down, left or right
between **adjacent** cells, never using the same cell twice in one attempt.

Print `FOUND` or `ABSENT`, then `STARTS <k>`: how many cells hold the word's
first letter.

```
input:  3 4
        abce
        sfcs
        adee
        abcced
output: FOUND
        STARTS 2
```

Mark the cell used on the way in and **unmark it on the way out**. A cell
that stays marked after a failed branch makes later branches fail for a reason
that is not in the grid. A Lua string cannot be marked in place — it is
immutable, and `s:sub` only ever makes a new one — so each row becomes a
table of one-character strings first, and the mark is a write into that
table.

`or` short-circuits in Lua exactly as it does elsewhere, so chaining the four
directions with `or` stops at the first one that spells the rest of the word.
'''
starter      = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local rows, cols = tonumber(tokens[1]), tonumber(tokens[2])

-- grid[r][c] is a one-character string, so a cell can be overwritten
local grid = {}
for r = 1, rows do
  grid[r] = {}
  local line = tokens[2 + r]
  for c = 1, cols do grid[r][c] = line:sub(c, c) end
end
local word = tokens[3 + rows]
local letters = {}
for i = 1, #word do letters[i] = word:sub(i, i) end

local function search(r, c, at)
  return false
end

local starts = 0

print("ABSENT")
print("STARTS " .. starts)
'''
solution     = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local rows, cols = tonumber(tokens[1]), tonumber(tokens[2])

-- grid[r][c] is a one-character string, so a cell can be overwritten
local grid = {}
for r = 1, rows do
  grid[r] = {}
  local line = tokens[2 + r]
  for c = 1, cols do grid[r][c] = line:sub(c, c) end
end
local word = tokens[3 + rows]
local letters = {}
for i = 1, #word do letters[i] = word:sub(i, i) end

local function search(r, c, at)
  if grid[r][c] ~= letters[at] then return false end
  if at == #letters then return true end

  local here = grid[r][c]
  grid[r][c] = "#"

  -- `or` short-circuits, so the first direction that spells the rest of the
  -- word stops the other three from being tried at all
  local found = (r > 1 and search(r - 1, c, at + 1))
    or (r < rows and search(r + 1, c, at + 1))
    or (c > 1 and search(r, c - 1, at + 1))
    or (c < cols and search(r, c + 1, at + 1))

  grid[r][c] = here
  return found
end

-- count the starting letters before any cell is marked
local starts = 0
for r = 1, rows do
  for c = 1, cols do
    if grid[r][c] == letters[1] then starts = starts + 1 end
  end
end

-- stop at the first cell the word spells out from
local found = false
for r = 1, rows do
  for c = 1, cols do
    if not found and search(r, c, 1) then found = true end
  end
end

if found then print("FOUND") else print("ABSENT") end
print("STARTS " .. starts)
'''
hints = [
  "Overwrite the cell with a character the word cannot contain, recurse, then put the original back.",
  "Count the starting letters in a separate pass before you search, or the '#' marks will confuse the count.",
  "The success base case is `at == #letters` — checked after matching this cell, not before.",
  "Chain the four directions with `or` rather than four ifs and a `found` flag: `or` already stops at the first branch that succeeds. Carrying on after a hit is work you were asked not to do.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "3 4\nabce\nsfcs\nadee\nabcced\n", expect = "FOUND\nSTARTS 2\n",  visible = true },
  { name = "absent",  stdin = "3 4\nabce\nsfcs\nadee\nabcb\n",   expect = "ABSENT\nSTARTS 2\n", visible = false },
  { name = "reuse",   stdin = "1 3\naba\naba\n",                 expect = "FOUND\nSTARTS 2\n",  visible = false },
  { name = "single",  stdin = "1 1\na\na\n",                     expect = "FOUND\nSTARTS 1\n",  visible = false },
