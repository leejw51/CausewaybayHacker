[[quest]]
id           = "lua.hacker.26.statistics"
node         = 26
title        = "SIX DECIMAL PLACES"
difficulty   = 3
time_limit_s = 900
story        = "The lantern stall's takings, five nights of them. They want the numbers rounded the way the spec says, not the way your language happens to print them — and this language prints 4 for 4.0."
concepts     = ["math", "sorting", "types"]
requires     = ["lua.hacker.25.test-cases"]
map          = { x = 0.394, y = 0.686, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

Print three lines, each to **six decimal places**: the mean, the **population**
standard deviation (divide by `n`, not `n - 1`), and the median — which for an
even `n` is the average of the two middle values.

```
input:  5
        2 4 4 4 5
output: 3.800000
        0.979796
        4.000000
```

This quest is judged with `match = "float:1e-6"`, so the comparison is
numeric: `3.8` and `3.800000` both pass, and a value that is off by `1e-7`
passes too. That is deliberate — the point is not your formatter, it is that
the mean has to be a mean and that the even-length median is a boundary
people get wrong under a clock.

Lua has one number type. `19 / 5` is `3.8` and `print` shows it as `3.8`;
`20 / 5` is `4` and `print` shows it as `4`, not `4.0` — so the six places
come from `string.format("%.6f", v)`, and `%d` on `3.8` is an error, not a
rounding. Population, not sample: there is no `statistics` module to reach
for, so the loop is yours — the mean of the squared deviations, then
`math.sqrt`. Read the statement twice; on a real screen the difference
between `n` and `n - 1` is the whole submission.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local values = {}
for i = 2, #data do values[#values + 1] = data[i] end
table.sort(values)
local n = #values

local sum = 0
for _, v in ipairs(values) do sum = sum + v end

-- floored, so the mean is wrong before anything else is
local mean = math.floor(sum / n)

print(string.format("%.6f", mean))
print("0.000000")
print(string.format("%.6f", values[math.floor(n / 2) + 1]))
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local values = {}
for i = 2, #data do values[#values + 1] = data[i] end
table.sort(values)
local n = #values

local sum = 0
for _, v in ipairs(values) do sum = sum + v end
local mean = sum / n

-- population: divide by n, not n - 1
local squares = 0
for _, v in ipairs(values) do squares = squares + (v - mean) * (v - mean) end
local deviation = math.sqrt(squares / n)

local median
if n % 2 == 1 then
  median = values[(n + 1) / 2]
else
  median = (values[n / 2] + values[n / 2 + 1]) / 2
end

print(string.format("%.6f", mean))
print(string.format("%.6f", deviation))
print(string.format("%.6f", median))
'''
hints = [
  "`/` is real division, always: sum / n is already the mean, and the starter's math.floor is what threw the fraction away.",
