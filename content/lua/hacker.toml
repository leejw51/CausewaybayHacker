[[quest]]
id           = "lua.hacker.31.palindrome"
node         = 30
title        = "THE SAME BACKWARDS"
difficulty   = 4
time_limit_s = 1200
story        = "Top-twenty question, asked in some form in most screens, and the one most people have written once and never understood. The dragon reads the same from the tail, the interviewer says, and does not smile."
concepts     = ["strings", "two-pointers", "complexity"]
requires     = ["lua.hacker.30.range-queries"]
map          = { x = 0.260, y = 0.857, kind = "quest" }
brief        = '''
Standard input is `n alphabet seed`. Build the string yourself, in 64-bit
arithmetic that wraps (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

s[i] = 'a' + (next() % alphabet)      for i in 0..n
```

Print the length of the longest palindromic substring, then `AT <index>` — the
0-based start of the **leftmost** one of that length.

```
input:  12 3 5
output: 5
        AT 1
```

Expand around each centre. There are `2n - 1` centres, not `n`: every
character is a centre for the odd-length palindromes, and every gap between
two characters is a centre for the even-length ones. Forgetting the gaps is
why a correct-looking solution returns `1` on `abba` — and it is what the
starter does.

You never need the string as a string. Keep the draws in a table of small
numbers — `s[i] = next() % alphabet` — and compare numbers; `..` on twenty
thousand one-character strings makes twenty thousand strings first. The
table is 1-based and the statement's `AT` is 0-based, so the index you print
is one less than the index you found.

**What the tests do and do not enforce**, plainly. The hidden case that does
the work is `n = 8000` over a **one**-letter alphabet. It is the worst case
for expand-around-centre — every centre runs to the end of the string — so
the right answer does its full `O(n²)` there, thirty-two million comparisons,
and LuaJIT does them in a few hundredths of a second. It also rejects
check-every-substring-and-test-each-one, which is cubic — on the order of
`10^11` comparisons here — and far outside the ten second limit.

The other big case, `n = 20000` over a two-letter alphabet, is a
**correctness** case and not a speed one: on a random binary string the
palindrome test fails after a character or two. It checks that your generator
and your leftmost-index tie-break agree with ours at scale.

So: the tests reject cubic and accept quadratic. They do **not** demand
Manacher's algorithm, which is the `O(n)` answer. Know that it exists and what
it does, because "and can you do better than quadratic?" is the follow-up this
question is usually asked to set up.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, alphabet, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local s = {}
for i = 1, n do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  s[i] = tonumber(bit.rshift(x, 33)) % alphabet
end

-- only the odd centres, so every even-length palindrome is invisible
local best_len, best_start = 0, 0
for centre = 1, n do
  local i, j = centre, centre
  while i >= 1 and j <= n and s[i] == s[j] do
    i = i - 1
    j = j + 1
  end
  local length = j - i - 1
  if length > best_len then
    best_len = length
    best_start = i
  end
end

print(best_len)
print("AT " .. best_start)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, alphabet, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local s = {}
for i = 1, n do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  s[i] = tonumber(bit.rshift(x, 33)) % alphabet
end

local best_len, best_start = 0, 0
for centre = 1, n do
  -- gap 0: one character at the middle, odd length; gap 1: the space to the
  -- right of it, even length
  for gap = 0, 1 do
    local i, j = centre, centre + gap
    while i >= 1 and j <= n and s[i] == s[j] do
      i = i - 1
      j = j + 1
    end
    -- i and j have each stepped one too far; i is the 0-based start
    local length = j - i - 1
    if length > best_len then
      best_len = length
      best_start = i
    end
  end
end

print(best_len)
print("AT " .. best_start)
'''
hints = [
  "Two expansions per centre: (c, c) for odd lengths and (c, c + 1) for even ones. The starter is missing the second.",
  "When the loop stops, i and j have both moved one past the palindrome — so its length is j - i - 1, and in a 1-based table i is already the 0-based start.",
  "Only update on a strictly longer palindrome, and the leftmost of each length is the one you keep, which is what AT is asking for. s[0] is nil, not a wrapped character, and nil == s[j] is simply false — the `i >= 1` check is still the honest one to write.",
]

