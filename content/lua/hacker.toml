[[quest]]
id           = "lua.hacker.08.top-k"
node         = 8
title        = "FIVE MOST ASKED"
difficulty   = 4
time_limit_s = 900
story        = "Warm-up round. They ask for the five words that came up most on last year's lantern riddles, and they time it anyway."
concepts     = ["hashing", "sorting", "complexity"]
requires     = ["lua.hacker.07.coins", "lua.hacker.01.two-sum"]
map          = { x = 0.953, y = 0.263, kind = "quest" }
brief        = '''
Line one is `n k`. Line two is `n` words separated by spaces.

Print the `k` most frequent words, most frequent first, ties broken by the
word ascending, one per line. If there are fewer than `k` distinct words,
print all of them. Then print `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Count in a table keyed by the word, then rank. The tie-break is not
decoration, and in Lua it is the whole quest: **`pairs` walks a table in no
order at all** — not insertion order, not alphabetical, and not the same
order from one run to the next. So the words come out of the count table into
a sequence, and the sequence is sorted with a comparison that is **total**:
count descending, then the word ascending, which is what `table.sort` needs
to give one answer and what the interviewer is listening for.

The four cases here are a handful of words, and the clock is not measuring
speed on them: counting by scanning the whole list once per distinct word is
`O(n²)` and clears all four. On a year of riddles it would not. What these
cases check is the tie-break, which is the part people actually get wrong.
'''
starter      = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local k = tonumber(tokens[2])

local counts = {}
local words = {}

-- count, collect the distinct words into `words`, sort them by count
-- descending then word ascending, print k of them, then DISTINCT <d>
print("DISTINCT " .. #words)
'''
solution     = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local k = tonumber(tokens[2])

local counts = {}
local words = {}
for i = 3, #tokens do
  local word = tokens[i]
  if counts[word] == nil then
    counts[word] = 0
    words[#words + 1] = word
  end
  counts[word] = counts[word] + 1
end

-- a total order: pairs has none, and table.sort promises nothing about ties
table.sort(words, function(a, b)
  if counts[a] ~= counts[b] then return counts[a] > counts[b] end
  return a < b
end)

for i = 1, math.min(k, #words) do
  print(words[i])
end
print("DISTINCT " .. #words)
'''
hints = [
  "One table for the counts, and a second, sequence-shaped one that gets the word appended the first time it is seen — that second table is what you sort, because you cannot sort a table you walk with pairs.",
  "The comparator returns counts[a] > counts[b] when they differ, and a < b when they do not. Strings compare with < in Lua, byte by byte, which is the ascending the statement asks for.",
  "math.min(k, #words) is the loop bound — running the loop to k on a shorter list prints nil.",
]

