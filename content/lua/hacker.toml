[[quest]]
id           = "lua.hacker.33.grid-paths"
node         = 32
title        = "ACROSS THE BLOCK, NEVER BACKWARDS"
difficulty   = 5
time_limit_s = 1200
story        = "The Tai Hang grid with three lanes closed for the dragon. How many ways across, and which way is cheapest."
concepts     = ["dynamic-programming", "matrix", "math"]
requires     = ["lua.hacker.32.modular"]
map          = { x = 0.538, y = 0.857, kind = "quest" }
brief        = '''
Standard input is `r c pct seed`. Build the grid yourself, in row-major order,
drawing **two** values for every cell, in 64-bit arithmetic that wraps
(`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 0..r, for j in 0..c:
    a = next(); b = next()
    the cell is BLOCKED if  a % 100 < pct,
        except (0,0) and (r-1,c-1), which are never blocked
    the cell costs  (b % 9) + 1
```

Move only **right** or **down**, through open cells. Print:

1. `PATHS <k>` — how many distinct routes from `(0,0)` to `(r-1,c-1)`, modulo
   `1000000007`
2. `MIN <cost>` — the smallest total cost of a route, counting both endpoints,
   or `-1` if there is no route

```
input:  3 4 30 2
output: PATHS 9
        MIN 27
```

One pass in row-major order does both: a cell's routes are the sum of the
routes into it from above and from the left, and its best cost is its own cost
plus the cheaper of those two. Because you only ever move right or down, the
two cells you need are always already finished — which is why this needs no
recursion and no visited set. A memoised recursion would also be linear in
the cells, and on the `1000 × 1000` case it would also be two thousand
frames deep — under LuaJIT's roof, as it happens, but the loop is the answer
here for the usual reason: the shape of the problem is a table filled in
order.

The `PATHS` count is taken modulo `1000000007` for the usual reason: on the
`1000 × 1000` hidden case the true number has over six hundred digits, and a
double would have turned it into `inf` long before. Reduce as you add — two
residues added together stay under `2^31`, so this is the one place on this
road where plain `+` and `%` are enough.

An unreachable cell has **no** best cost: `nil`, and `nil` is tested with
`~= nil` before anything is added to it or compared with it. A `1000 × 1000`
table of tables is a million entries and LuaJIT does not mind.

**What the big case enforces:** it rejects any answer that enumerates routes.
There are more of them than there are lanterns in the park.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local rows, cols, pct, seed = data[1], data[2], data[3], data[4]
local P = 1000000007

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local open_cell, cost = {}, {}
for i = 0, rows - 1 do
  open_cell[i], cost[i] = {}, {}
  for j = 0, cols - 1 do
    local a = nxt()
    local b = nxt()
    local corner = (i == 0 and j == 0) or (i == rows - 1 and j == cols - 1)
    open_cell[i][j] = corner or a % 100 >= pct
    cost[i][j] = b % 9 + 1
  end
end

-- fill `ways` and `best` in row-major order; a missing `best` is unreachable
local ways, best = {}, {}

print("PATHS 0")
print("MIN -1")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local rows, cols, pct, seed = data[1], data[2], data[3], data[4]
local P = 1000000007

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local open_cell, cost = {}, {}
for i = 0, rows - 1 do
  open_cell[i], cost[i] = {}, {}
  for j = 0, cols - 1 do
    local a = nxt()
    local b = nxt()
    local corner = (i == 0 and j == 0) or (i == rows - 1 and j == cols - 1)
    open_cell[i][j] = corner or a % 100 >= pct
    cost[i][j] = b % 9 + 1
  end
end

-- nil in `best` means unreachable; a cell with no open neighbour above or
-- left stays that way
local ways, best = {}, {}
for i = 0, rows - 1 do
  ways[i], best[i] = {}, {}
  for j = 0, cols - 1 do
    ways[i][j] = 0
    if open_cell[i][j] then
      if i == 0 and j == 0 then
        ways[0][0] = 1
        best[0][0] = cost[0][0]
      else
        local routes, cheapest = 0, nil
        if i > 0 and best[i - 1][j] ~= nil then
          routes = routes + ways[i - 1][j]
          cheapest = best[i - 1][j]
        end
        if j > 0 and best[i][j - 1] ~= nil then
          routes = routes + ways[i][j - 1]
          if cheapest == nil or best[i][j - 1] < cheapest then
            cheapest = best[i][j - 1]
          end
        end
        ways[i][j] = routes % P
        if cheapest ~= nil then best[i][j] = cheapest + cost[i][j] end
      end
    end
  end
end

print("PATHS " .. ways[rows - 1][cols - 1])
local final = best[rows - 1][cols - 1]
if final == nil then print("MIN -1") else print("MIN " .. final) end
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
  "An open cell with no open neighbour above or left is reachable by zero routes and has no best cost; nil is the honest `unreachable`, and `~= nil` is the guard before you compare or add.",
  "The destination can be open and still unreachable, which is exactly when PATHS is 0 and MIN is -1. One of the hidden cases is that.",
]

