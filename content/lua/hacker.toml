ones waiting on nothing, and when you take a task, decrement its dependents.
If you finish with tasks left over, those tasks are the cycle. The ready set
is a min-heap of numbers — the one from node 12 with the comparison down to
`<` — so "lowest numbered" costs `log n` rather than a scan. The tasks are
numbered from `0`, and `after[0]` and `waiting[0]` are ordinary entries in a
