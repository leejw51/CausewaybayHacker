[[quest]]
id           = "lua.hacker.20.bits"
node         = 20
title        = "THE ONE THAT IS ALONE"
difficulty   = 4
time_limit_s = 600
story        = "Every incense docket is scanned twice except one. They will not let you use a table and they will not let you sort."
concepts     = ["bit-manipulation", "math", "complexity"]
requires     = ["lua.hacker.19.knapsack"]
map          = { x = 0.801, y = 0.447, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` non-negative integers, in which every value
appears exactly twice except one.

Print four lines:

1. the value that appears once, found with **xor** and constant extra space
2. how many `1` bits are set in it
3. `POW2 YES` if it is a power of two, `POW2 NO` otherwise (`0` is not)
4. the value with its lowest set bit cleared, or `0` if it has none

```
input:  5
        4 1 2 1 2
output: 4
        1
        POW2 YES
        0
```

`x ^ x == 0` and `x ^ 0 == x`, and xor does not care what order it happens in.
That is the whole first line. `x & (x - 1)` clears the lowest set bit, which
gives you the third and fourth lines for free.

Lua 5.1 has no bit operators — `^` is **exponentiation** here, and `4 ^ 4` is
`256`. The bits live in the `bit` library: `bit.bxor(a, b)`, `bit.band(a,
b)`, `bit.bor`, `bit.lshift`, `bit.rshift`. They work on 32-bit integers and
hand back a signed one, so a value at or above `2^31` would come back
negative; the values here are small. Write the bit-count loop, because the
loop is what they ask for.

The four cases here are five numbers at most, and the clock is not measuring
speed on them: a count table clears every one, and so would sorting. Nor would
a bigger case change that, because the bar this question sets is **space** —
one accumulator and nothing else — and no run limit can tell a constant-space
answer from a table. That one is on your honour, and on the interviewer, who
will ask.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

local band, bxor = bit.band, bit.bxor
local alone = 0

-- xor everything together, then read the bits off the result
print(alone)
print(0)
print("POW2 NO")
print(0)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

local band, bxor = bit.band, bit.bxor
local alone = 0
for _, value in ipairs(nums) do
  alone = bxor(alone, value)
end

local bits = 0
local walk = alone
while walk ~= 0 do
  walk = band(walk, walk - 1)
  bits = bits + 1
end

local power_of_two = alone ~= 0 and band(alone, alone - 1) == 0
local cleared = 0
if alone ~= 0 then cleared = band(alone, alone - 1) end

print(alone)
print(bits)
if power_of_two then print("POW2 YES") else print("POW2 NO") end
print(cleared)
'''
hints = [
  "The pairs cancel themselves out whatever order they arrive in, so one fold over the list with bit.bxor is enough.",
  "Counting bits by clearing the lowest one each time — walk = bit.band(walk, walk - 1) — runs once per set bit, not once per bit width.",
  "A power of two has exactly one bit set, so clearing the lowest one leaves zero — and zero itself has to be excluded by hand.",
]

