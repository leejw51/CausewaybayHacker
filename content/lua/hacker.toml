# LUA LAND — HACKER. The eighth interview. HKU, Chow Yei Ching Building,
# Room 7-32 again, a clock on the wall, and outside the window the fifteenth
# night of the eighth month: the fire dragon going through Tai Hang, the
# lanterns in Victoria Park, the full moon over all of it. Lua is the moon.
#
# Every quest here carries `time_limit_s` — the player's clock for the whole
# quest, not the per-run `timeout_ms` — and at least one hidden case.
# See docs/decisions.md, 2026-09-11, for where that key lives in the TOML.
#
# The 34 problems port content/python/hacker.toml node for node — same
# concepts, difficulty, map, route, clock and test cases, byte for byte — so
# a player can sit the same interview in any land. The ids mirror too: the
# LRU boss is `lua.hacker.28.lru` at node 34, exactly as it is in the other
# lands, because SPEC §12 makes the id an identity and `node` the position.
# Node 16, `16.union-find`, takes the `n m seed` input Python converted it
# to, with the same four cases. The two hidden cases Python shrank for its
# interpreter — range-queries at 300000 operations and the one-letter
# palindrome at 8000 characters — are kept at Python's size: this is a port
# of the Python pack, and the cases are the reference's.
#
# Every program is one main.lua, syntax-checked with `luajit -b` and run as
# `luajit main.lua`. It is LuaJIT 2.1 — Lua 5.1 plus LuaJIT's extensions —
# and not Lua 5.4: one number type, doubles, so `6 / 2` prints `3`, there is
# no `//`, a product past 2^53 loses digits, and `bit.*` is how bits are
# done. Standard input is read whole with `io.read("*a")` and split with
# `gmatch("%S+")`.
#
# The generator every big case is built from is 64-bit arithmetic that
# wraps, and LuaJIT has that as a value: `0ULL + seed` is an unsigned 64-bit
# integer, `*` and `+` on it wrap at 2^64 exactly as the statement asks,
# `bit.rshift` takes it, and `tonumber` brings the 31-bit result back to a
# plain number. No mask is written by hand in this pack; the type is the
# mask. `32.modular` does not multiply two residues with `*`: their product
# passes 2^53, so it carries a 16-bit split `mulmod`, and its solution
# precomputes inverse factorials so a query is two of them.
#
# Where a starter is rejected by the clock, that was measured here against
# the 10 s run limits: union-find's walk-per-link had not finished after
# 25 s, the O(n²) inversion count had not finished after 25 s, and modular's
# per-query product had not finished after 25 s. Two of Python's slow
# starters were not slow enough on LuaJIT — the O(V²) Dijkstra scan and the
# per-query slice sum both cleared in about 14 s, which is rejected here and
# would not be on a faster machine — so those two starters are a slower
# honest shape instead: `29.dijkstra` keeps the unvisited stops in a set
# and scans it with `pairs` (32.6 s), and `30.range-queries` is node 23's
# prefix-sum table, rebuilt after every update (57 s). Both print the right
# answer on every case they finish.
#
# Two starters fail for a reason of this language's own. `34.stable-sort`
# calls `table.sort` with a plain descending comparator, and `table.sort` is
# a quicksort with no promise about ties — the sample comes out scrambled,
# which is the lesson, inverted from Python's. The boss, THE MOON, is not
# the recursion limit: a proper tail call costs no frame in Lua, so its
# starter walks the two thousand operations recursively and gets through.
# It is wrong instead about what a table remembers — a `GET` reads the
# value and moves nothing, so the cache evicts first-in rather than
# least-recently-used, and `GET 2` on the sample prints `20`. Same problem,
# same cases, same concepts; the recursion is in the room as the thing that
# turned out not to be the trap.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

#
# **Which quests enforce their complexity differs by land, and that is a
# measurement rather than an oversight.** All the packs hold the same problems
# in the same order under the same ids, and the small cases are identical
# wherever the problem is the same problem. What differs is the big case that
# rejects a correct-but-slow answer: it is sized per land, and in several
# quests it exists in one land and not another. Whether a generated input can
# punish the naive answer is a fact about the language and its runtime, and
# each land measured it rather than assuming it. Lua keeps Python's enforced
# set — union-find, inversions, dijkstra, range-queries, palindrome, modular,
# grid-paths — and leaves `06.stack` alone for the reason Python gives: the
# naive next-greater scan is only quadratic on near-descending input, which
# this generator never produces.

pack = "lua.hacker"
land = "lua"
category = "hacker"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id           = "lua.hacker.01.two-sum"
node         = 1
title        = "TWO LANTERNS"
difficulty   = 3
time_limit_s = 600
story        = "Room 7-32, eighth time, the moon over the ridge and the drums starting down in Tai Hang. The first question is the one everybody gets, and the clock starts on the way in."
concepts     = ["hashing", "complexity", "collections"]
requires     = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` integers.

Print the **1-based** indices `i j` of two different entries that add up to
`target`, as `i j` with `i < j`. If more than one pair works, give the one
whose second index is smallest; if that still ties, the smallest first index.
If no pair works, print `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

The hidden cases here are small: they check the tie-break and the
no-answer case, not your speed. The question is still the linear one — one
pass, one table — because a real `n` is 200000 and the nested loop is what
this question exists to weed out. Write the answer the question is asking for,
not the one that happens to clear these four cases.

A Lua table is the hash map. `seen[target - x]` is `nil` when the key was
never written, and `nil` is the miss — test it with `~= nil`, and write a key
only the first time you see it, so a repeated value keeps its first index.
The list is 1-based, which for once is the index the statement wants.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, target = data[1], data[2]
local nums = {}
for i = 1, n do nums[i] = data[2 + i] end

local seen = {}

-- one pass: for each value, has target - value been seen already?
print(-1)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, target = data[1], data[2]
local nums = {}
for i = 1, n do nums[i] = data[2 + i] end

local seen = {}
for j = 1, n do
  local x = nums[j]
  local i = seen[target - x]
  -- nil is the miss; a stored index is never nil, so this is the whole test
  if i ~= nil then
    print(i .. " " .. j)
    return
  end
  -- keep the first index of a repeated value: that is the tie-break
  if seen[x] == nil then seen[x] = j end
end
print(-1)
'''
hints = [
  "One pass. For each value ask whether target minus it has already been seen.",
  "Only write a key the first time — `if seen[x] == nil then seen[x] = j end` keeps the first index of a repeat, which is the tie-break the statement asks for.",
  "Print and `return` the moment you find it — a `return` at the top level of the chunk ends the program, and the first hit as you scan is already the smallest second index.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "4 9\n2 7 11 15\n",      expect = "1 2\n",  visible = true },
  { name = "late",    stdin = "5 10\n1 2 3 4 6\n",     expect = "4 5\n",  visible = false },
  { name = "none",    stdin = "3 100\n1 2 3\n",        expect = "-1\n",   visible = false },
  { name = "signed",  stdin = "6 0\n-3 4 3 90 -1 1\n", expect = "1 3\n",  visible = false },
]

# ---------------------------------------------------------------- 02
[[quest]]
id           = "lua.hacker.02.window"
node         = 2
title        = "NO REPEATS"
difficulty   = 4
time_limit_s = 900
story        = "The second question is on the board before you have put the marker down. Through the window a line of incense goes past, one stick per segment, no two alike."
concepts     = ["two-pointers", "strings", "complexity"]
requires     = ["lua.hacker.01.two-sum"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief        = '''
One line of text, no spaces.

Print the length of the longest run of characters with no repeat in it, then
the run itself. If several runs tie, print the leftmost.

```
input:  abcabcbb
output: 3
        abc
```

The window only ever moves right. If you find yourself rescanning from the
start after a repeat, you have written the quadratic one.

The four cases here are a dozen characters at most, and the clock is not
measuring speed on them — the quadratic one clears them too. There is no big
hidden case because there is no honest one to build: on text with a small
alphabet the longest run is bounded by the alphabet, so rescanning costs a
constant factor and not a quadratic one, and the input that would punish it
is not text any more. Write the one-pass answer because it is the answer, not
because these four cases force it.

A Lua string is not a table: `text[i]` is `nil`, not a character. The
character at `i` is `text:sub(i, i)` (or `text:byte(i)` as a number), and the
run is `text:sub(start, start + length - 1)` — both ends **inclusive**, and
1-based, which is where the off-by-one lives here.
'''
starter      = '''
local text = io.read("*a"):match("%S+") or ""

local last = {}

-- print the best length, then the run itself
print(0)
print("?")
'''
solution     = '''
local text = io.read("*a"):match("%S+") or ""

local last = {}
local start = 1
local best_len = 0
local best_start = 1

for i = 1, #text do
  local c = text:sub(i, i)
  local previous = last[c]
  if previous ~= nil and previous >= start then start = previous + 1 end
  last[c] = i
  local length = i - start + 1
  if length > best_len then
    best_len = length
    best_start = start
  end
end

print(best_len)
print(text:sub(best_start, best_start + best_len - 1))
'''
hints = [
  "Keep the index where each character was last seen in a table keyed by the character, and the index the window starts at.",
  "A repeat only matters if its last position is inside the current window — that is the `previous ~= nil and previous >= start` test.",
  "Record the best length *and* where it started, or you cannot print the run at the end. `text:sub(start, start + length - 1)` is the run; `sub` includes both ends.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "abcabcbb\n",    expect = "3\nabc\n",      visible = true },
  { name = "one",     stdin = "bbbbb\n",       expect = "1\nb\n",        visible = false },
  { name = "middle",  stdin = "pwwkew\n",      expect = "3\nwke\n",      visible = false },
  { name = "street",  stdin = "causewaybay\n", expect = "7\nusewayb\n",  visible = false },
]

# ---------------------------------------------------------------- 03
[[quest]]
id           = "lua.hacker.03.intervals"
node         = 3
title        = "THE DRUM ROTA"
difficulty   = 4
time_limit_s = 900
story        = "They hand you the drummers' rota for the three nights of the dragon and ask which hours actually have somebody on the drum."
concepts     = ["intervals", "sorting", "complexity"]
requires     = ["lua.hacker.02.window"]
map          = { x = 0.333, y = 0.132, kind = "quest" }
brief        = '''
Line one is `n`. The next `n` lines are `<start> <end>` with `start <= end`.

Merge every pair that overlaps or touches, and print the result in increasing
order, one `<start> <end>` per line, then `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Touching counts as overlapping: `1 4` and `4 5` merge into `1 5`.

The four cases here are three or four intervals each, and the clock is not
measuring speed on them. Sorting and sweeping is `O(n log n)`; a version that
rescans the merged list for every interval is `O(n²)` and clears these four
just as easily. The bar is real on a real rota. It is not what these cases
check.

`table.sort` takes a comparator, and it needs one here: the intervals are
tables, and two tables have no order of their own — `{1, 3} < {2, 6}` is an
error, not a guess. The comparator is `function(p, q) return p[1] < q[1] end`,
and the merged list is a table of tables, so `merged[#merged][2] = e` extends
the last one in place.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local spans = {}
for i = 1, n do spans[i] = { data[2 * i], data[2 * i + 1] } end

-- sort, sweep, merge, print, then COUNT <k>
print("COUNT " .. #spans)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local spans = {}
for i = 1, n do spans[i] = { data[2 * i], data[2 * i + 1] } end

-- a comparator, always: two tables cannot be compared with <
table.sort(spans, function(p, q)
  if p[1] ~= q[1] then return p[1] < q[1] end
  return p[2] < q[2]
end)

local merged = {}
for _, span in ipairs(spans) do
  local top = merged[#merged]
  if top ~= nil and span[1] <= top[2] then
    if span[2] > top[2] then top[2] = span[2] end
  else
    merged[#merged + 1] = { span[1], span[2] }
  end
end

for _, span in ipairs(merged) do
  print(span[1] .. " " .. span[2])
end
print("COUNT " .. #merged)
'''
hints = [
  "Sort by start first, with a comparator. After that one left-to-right pass is enough and you never look backwards more than one interval.",
  "Extend the last merged interval when the new start is <= its end; otherwise append a new one. `merged[#merged]` is the last one, and it is a table, so writing `top[2] = e` changes it in place.",
  "Extend to the larger of the two ends — a short interval swallowed by a long one must not shrink it.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",   stdin = "4\n1 3\n2 6\n8 10\n15 18\n", expect = "1 6\n8 10\n15 18\nCOUNT 3\n", visible = true },
  { name = "touching", stdin = "2\n1 4\n4 5\n",              expect = "1 5\nCOUNT 1\n",              visible = false },
  { name = "point",    stdin = "1\n5 5\n",                   expect = "5 5\nCOUNT 1\n",              visible = false },
  { name = "unsorted", stdin = "3\n5 6\n1 2\n3 4\n",         expect = "1 2\n3 4\n5 6\nCOUNT 3\n",    visible = false },
]

