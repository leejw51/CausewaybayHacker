brief        = '''
Line one is `n`. Line two is `n` distinct integers **already in ascending
order**.

Print every subset, one per line, values space separated, the empty subset as
`-`. Order them the way the obvious recursion produces them: at each position,
first the branch that **takes** the element, then the branch that skips it.
Then print `SUBSETS <2^n>`.

```
input:  3
        1 2 3
output: 1 2 3
        1 2
        1 3
        1
        2 3
        2
        3
        -
        SUBSETS 8
```

Push, recurse, **pop**. The pop is the part people leave out, and the symptom
is every line after the first being too long. In Lua the push is
`chosen[#chosen + 1] = v` and the pop is `chosen[#chosen] = nil` — assigning
`nil` to the last slot is how a sequence gets shorter, and `#chosen` follows
it down. There is no `itertools` here to give you the subsets in some other
order; the order is the recursion's own, and that is what is being checked.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

local out = {}

local function build(at, chosen)
  -- past the end of the list, record `chosen`; otherwise take it, recurse,
  -- undo, then skip it and recurse
end

build(1, {})

for _, line in ipairs(out) do print(line) end
print("SUBSETS " .. #out)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

local out = {}

local function build(at, chosen)
  if at > #nums then
    if #chosen > 0 then
      out[#out + 1] = table.concat(chosen, " ")
    else
      out[#out + 1] = "-"
    end
    return
  end

  chosen[#chosen + 1] = nums[at]
  build(at + 1, chosen)
  chosen[#chosen] = nil

  build(at + 1, chosen)
end

build(1, {})

for _, line in ipairs(out) do print(line) end
print("SUBSETS " .. #out)
'''
