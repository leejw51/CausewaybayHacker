print("CYCLE")
print("DONE 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, m = data[1], data[2]

local after, waiting = {}, {}
for task = 0, n - 1 do
  after[task] = {}
  waiting[task] = 0
end
for e = 0, m - 1 do
  local a, b = data[3 + 2 * e], data[4 + 2 * e]
  after[a][#after[a] + 1] = b
  waiting[b] = waiting[b] + 1
end

-- a binary min-heap of numbers
local ready = {}

local function push(value)
  local i = #ready + 1
  ready[i] = value
  while i > 1 do
    local parent = math.floor(i / 2)
    if ready[parent] <= ready[i] then break end
    ready[i], ready[parent] = ready[parent], ready[i]
    i = parent
  end
end

local function pop()
  local top = ready[1]
  local last = ready[#ready]
  ready[#ready] = nil
  local size = #ready
  if size > 0 then
    ready[1] = last
    local i = 1
    while true do
      local l, r, smallest = 2 * i, 2 * i + 1, i
      if l <= size and ready[l] < ready[smallest] then smallest = l end
      if r <= size and ready[r] < ready[smallest] then smallest = r end
      if smallest == i then break end
      ready[i], ready[smallest] = ready[smallest], ready[i]
      i = smallest
    end
  end
  return top
end

for task = 0, n - 1 do
  if waiting[task] == 0 then push(task) end
end

local order = {}
while #ready > 0 do
  local task = pop()
  order[#order + 1] = task
  for _, nxt in ipairs(after[task]) do
    waiting[nxt] = waiting[nxt] - 1
    if waiting[nxt] == 0 then push(nxt) end
  end
end

if #order < n then
  print("CYCLE")
else
  print(table.concat(order, " "))
end
print("DONE " .. #order)
'''
