  { name = "sample", stdin = "8 6 1\n",           expect = "4112\nUPDATES 3\n",            visible = true },
  { name = "no-ups", stdin = "5 4 9\n",           expect = "4458\nUPDATES 0\n",            visible = false },
  { name = "mid",    stdin = "1000 2000 3\n",     expect = "249603264\nUPDATES 987\n",     visible = false },
  { name = "big",    stdin = "500000 300000 7\n", expect = "14403406318963\nUPDATES 149814\n", visible = false },
