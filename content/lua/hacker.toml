[[quest]]
id           = "lua.hacker.12.heap"
node         = 12
title        = "K SORTED QUEUES"
difficulty   = 5
time_limit_s = 1200
story        = "Every lane the dragon passes through sends its lantern numbers already in order. Merge them into one list without sorting the lot again."
concepts     = ["heaps", "sorting", "complexity"]
requires     = ["lua.hacker.11.bst"]
map          = { x = 0.396, y = 0.276, kind = "quest" }
brief        = '''
Line one is `k`. Then `k` lines, each a count followed by that many integers,
already sorted ascending.

Print all of them merged into one ascending line, space separated, then
`POPS <total count>`.

```
input:  3
        3 1 4 5
        2 1 3
        2 2 6
output: 1 1 2 3 4 5 6
        POPS 7
```

There is no `heapq` in Lua. A binary min-heap is a table and two functions —
`push` sifts the new last element up, `pop` moves the last element to the
top and sifts it down — and the starter carries one, two functions of
fifteen lines each, so the loop is the question here and not the heap. Read it once; you will write it
yourself further along this road.

The entry is `{ value, which list, how far into it }`, and the heap orders
entries by `value` first and by the list index on a tie — which is fine,
because it only has to be *some* order, and it has to be a **total** one,
because the heap's comparison is written by you and a comparison that says
"equal" both ways is not a mistake Lua will report.

The heap holds one entry per list, not one per element, so it stays at size
`k` however long the lists are.

The four cases here are a handful of numbers across two or three lists, and
the clock is not measuring speed on them: pouring everything into one table
and `table.sort`ing it clears all four, and so does rescanning all `k` heads
on every step. The heap is what keeps it `O(N log k)` when `k` is large, and
that is a promise about input these cases do not contain.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local k = data[1]

local lists = {}
local at = 2
for which = 1, k do
  local count = data[at]
  at = at + 1
  local items = {}
  for i = 1, count do
    items[i] = data[at]
    at = at + 1
  end
  lists[which] = items
end

-- a binary min-heap of { value, which, at } entries, ordered by value then
-- by which
local heap = {}

local function less(a, b)
  if a[1] ~= b[1] then return a[1] < b[1] end
  return a[2] < b[2]
end

local function push(entry)
  local i = #heap + 1
  heap[i] = entry
  while i > 1 do
    local parent = math.floor(i / 2)
    if not less(heap[i], heap[parent]) then break end
    heap[i], heap[parent] = heap[parent], heap[i]
    i = parent
  end
end

local function pop()
  local top = heap[1]
  local last = heap[#heap]
  heap[#heap] = nil
  local size = #heap
  if size > 0 then
    heap[1] = last
    local i = 1
    while true do
      local l, r, smallest = 2 * i, 2 * i + 1, i
      if l <= size and less(heap[l], heap[smallest]) then smallest = l end
      if r <= size and less(heap[r], heap[smallest]) then smallest = r end
      if smallest == i then break end
      heap[i], heap[smallest] = heap[smallest], heap[i]
      i = smallest
    end
  end
  return top
end

-- seed the heap with the head of each list, then pop and refill
print("?")
print("POPS 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local k = data[1]

local lists = {}
local at = 2
for which = 1, k do
  local count = data[at]
  at = at + 1
  local items = {}
  for i = 1, count do
    items[i] = data[at]
    at = at + 1
  end
  lists[which] = items
end

-- a binary min-heap of { value, which, at } entries, ordered by value then
-- by which
local heap = {}

local function less(a, b)
  if a[1] ~= b[1] then return a[1] < b[1] end
  return a[2] < b[2]
end

local function push(entry)
  local i = #heap + 1
  heap[i] = entry
  while i > 1 do
    local parent = math.floor(i / 2)
    if not less(heap[i], heap[parent]) then break end
    heap[i], heap[parent] = heap[parent], heap[i]
    i = parent
  end
end

local function pop()
  local top = heap[1]
  local last = heap[#heap]
  heap[#heap] = nil
  local size = #heap
  if size > 0 then
    heap[1] = last
    local i = 1
    while true do
      local l, r, smallest = 2 * i, 2 * i + 1, i
      if l <= size and less(heap[l], heap[smallest]) then smallest = l end
      if r <= size and less(heap[r], heap[smallest]) then smallest = r end
      if smallest == i then break end
      heap[i], heap[smallest] = heap[smallest], heap[i]
      i = smallest
    end
  end
  return top
end

-- one entry per list: its head
for which, items in ipairs(lists) do
  if #items > 0 then push({ items[1], which, 1 }) end
end

local out = {}
while #heap > 0 do
  local entry = pop()
  out[#out + 1] = entry[1]
  local items = lists[entry[2]]
  if entry[3] < #items then
    push({ items[entry[3] + 1], entry[2], entry[3] + 1 })
  end
end

print(table.concat(out, " "))
print("POPS " .. #out)
'''
