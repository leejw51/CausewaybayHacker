[[quest]]
id           = "lua.hacker.04.grid"
node         = 4
title        = "OUT OF THE BUILDING"
difficulty   = 5
time_limit_s = 1200
story        = "A floor plan of the Chow Yei Ching Building on the whiteboard, a fire door at the far corner, and the interviewer watching the clock rather than the marker while the drums come up from Tai Hang."
concepts     = ["graphs", "stacks-queues", "complexity"]
requires     = ["lua.hacker.03.intervals"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one. And there is no queue in the standard
library: a table is one, **if** you read it with a moving head index.
`table.remove(queue, 1)` shifts every remaining element down by one, which
is `O(n)`, and turns the whole search quadratic.

A table can have any key, so `open[0]` is a real row and `open[-1]` is simply
`nil` — no error, and no wrap to the last row either. The error comes one
step later, when `open[-1][c]` follows the `nil`: `attempt to index a nil
value`. A missing key is not a mistake until it is followed; check the bounds
before the read, not after.
'''
starter      = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local rows, cols = tonumber(tokens[1]), tonumber(tokens[2])

-- open[r][c] is true where the floor is '.', rows and columns counted from 0
local open = {}
for r = 0, rows - 1 do
  open[r] = {}
  local line = tokens[3 + r]
  for c = 0, cols - 1 do open[r][c] = line:sub(c + 1, c + 1) == "." end
end

local queue, head = {}, 1

-- print the shortest step count or -1, then REACHED <k>
print(-1)
print("REACHED 0")
'''
solution     = '''
local tokens = {}
for token in io.read("*a"):gmatch("%S+") do tokens[#tokens + 1] = token end
local rows, cols = tonumber(tokens[1]), tonumber(tokens[2])

-- open[r][c] is true where the floor is '.', rows and columns counted from 0
local open = {}
for r = 0, rows - 1 do
  open[r] = {}
  local line = tokens[3 + r]
  for c = 0, cols - 1 do open[r][c] = line:sub(c + 1, c + 1) == "." end
end

-- -1 means not seen yet, so the distance grid is the visited set too
local dist = {}
for r = 0, rows - 1 do
  dist[r] = {}
  for c = 0, cols - 1 do dist[r][c] = -1 end
end

local queue, head = {}, 1
local reached = 0
if open[0][0] then
  dist[0][0] = 0
  queue[1] = { 0, 0 }
  reached = 1
end

local steps = { { -1, 0 }, { 1, 0 }, { 0, -1 }, { 0, 1 } }
while head <= #queue do
  local r, c = queue[head][1], queue[head][2]
  head = head + 1
  local nxt = dist[r][c] + 1
  for _, d in ipairs(steps) do
    local nr, nc = r + d[1], c + d[2]
    -- open[-1] is nil and open[-1][nc] is an error: the bounds come first
    if nr >= 0 and nr < rows and nc >= 0 and nc < cols
        and open[nr][nc] and dist[nr][nc] < 0 then
      dist[nr][nc] = nxt
      reached = reached + 1
      queue[#queue + 1] = { nr, nc }
    end
  end
end

print(dist[rows - 1][cols - 1])
print("REACHED " .. reached)
'''
hints = [
  "A head index that only moves forward is the whole difference between a queue and a stack here; `queue[#queue + 1] = cell` pushes, `queue[head]` with `head = head + 1` pops from the front in O(1).",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
  "`open[nr]` is nil off the top or bottom of the floor, and indexing it is a runtime error. Check `nr >= 0 and nr < rows` before you read `open[nr][nc]` — or read `open[nr] and open[nr][nc]`, which is the same check said in Lua.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "3 3\n...\n.#.\n...\n",              expect = "4\nREACHED 8\n",   visible = true },
  { name = "blocked", stdin = "2 2\n.#\n#.\n",                     expect = "-1\nREACHED 1\n",  visible = false },
  { name = "single",  stdin = "1 1\n.\n",                          expect = "0\nREACHED 1\n",   visible = false },
  { name = "maze",    stdin = "4 5\n.....\n###.#\n.....\n.#.#.\n", expect = "7\nREACHED 14\n",  visible = false },
]

