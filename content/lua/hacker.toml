[[quest]]
id           = "lua.hacker.22.trie"
node         = 22
title        = "THE PREFIX BOX"
difficulty   = 5
time_limit_s = 1500
story        = "Autocomplete for the stop board on the tram — the honest kind, that only completes what is actually on the list."
concepts     = ["tries", "strings", "collections"]
requires     = ["lua.hacker.21.matrix"]
map          = { x = 0.953, y = 0.667, kind = "quest" }
brief        = '''
Line one is `n q`. The next `n` lines are lowercase words to insert. The next
`q` lines are queries, each `WORD <s>` or `PREFIX <s>`.

Build a trie — a tree of nodes each holding a map from letter to child —
and answer:

* `WORD <s>` → `YES` if `s` was inserted, `NO` otherwise
* `PREFIX <s>` → how many of the `n` inserted words start with `s`

The `n` words are not promised to be distinct, and `PREFIX` counts
**insertions**, not distinct words: insert `tram` twice and `PREFIX tram` is
`2`. `NODES` counts nodes, so the second insertion adds none.

Then print `NODES <k>`, the number of nodes in the trie including the root.

```
input:  3 3
        tram
        tramway
        train
        WORD tram
        PREFIX tra
        WORD tra
output: YES
        3
        NO
        NODES 10
```

Keep a count on every node of how many inserted words pass through it, and
`PREFIX` is a walk with no counting at the end. A node is a table — `{
children = {}, through = 0, terminal = false }` — and `children` is a table
keyed by the one-character string, because a 26-slot array is the C answer
and the table is the Lua one. A child that is not there is `nil`, and `nil`
is the signal both to create one on insert and to stop on lookup. The
letters of a word come from `word:gmatch(".")`, one at a time.
'''
starter      = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end
local n, q = lines[1]:match("(%d+)%s+(%d+)")
n, q = tonumber(n), tonumber(q)

local function new_node()
  return { children = {}, through = 0, terminal = false }
end

local root = new_node()
local nodes = 1

for i = 1, n do
  local word = lines[1 + i]:match("%S+") or ""
  -- walk down, creating nodes as needed, bumping `through`
end

for i = 1, q do
  local kind, text = lines[1 + n + i]:match("(%S+)%s*(%S*)")
  print("NO")
end
print("NODES " .. nodes)
'''
solution     = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end
local n, q = lines[1]:match("(%d+)%s+(%d+)")
n, q = tonumber(n), tonumber(q)

local function new_node()
  return { children = {}, through = 0, terminal = false }
end

local root = new_node()
local nodes = 1

for i = 1, n do
  local word = lines[1 + i]:match("%S+") or ""
  local at = root
  for letter in word:gmatch(".") do
    local child = at.children[letter]
    if child == nil then
      child = new_node()
      at.children[letter] = child
      nodes = nodes + 1
    end
    child.through = child.through + 1
    at = child
  end
  at.terminal = true
end

for i = 1, q do
  local kind, text = lines[1 + n + i]:match("(%S+)%s*(%S*)")

  local at = root
  for letter in text:gmatch(".") do
    at = at.children[letter]
    if at == nil then break end
  end

  if kind == "WORD" then
    if at ~= nil and at.terminal then print("YES") else print("NO") end
  else
    if at ~= nil then print(at.through) else print(0) end
  end
end

print("NODES " .. nodes)
'''
hints = [
  "children[letter] is nil for a missing child, and nil is the signal both to create one on insert and to stop on lookup.",
  "`through` is bumped on the node you step *onto*, so the root never counts itself.",
  "A query that falls off the trie leaves `at` as nil, and nil answers NO and 0 — but only if you test `at ~= nil` before you read a field off it; `nil.terminal` is a runtime error.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample",  stdin = "3 3\ntram\ntramway\ntrain\nWORD tram\nPREFIX tra\nWORD tra\n", expect = "YES\n3\nNO\nNODES 10\n", visible = true },
  { name = "missing", stdin = "1 2\nmtr\nPREFIX z\nWORD mtr\n",                              expect = "0\nYES\nNODES 4\n",     visible = false },
  { name = "nested",  stdin = "2 2\na\nab\nPREFIX a\nWORD a\n",                              expect = "2\nYES\nNODES 3\n",     visible = false },
  { name = "empty-q", stdin = "2 1\nhku\nhk\nPREFIX hk\n",                                   expect = "2\nNODES 4\n",          visible = false },
  { name = "twice",   stdin = "3 3\ntram\ntram\ntrap\nPREFIX tram\nPREFIX tra\nWORD tram\n",  expect = "2\n3\nYES\nNODES 6\n", visible = false },
]

# ---------------------------------------------------------------- 23
[[quest]]
id           = "lua.hacker.23.prefix-sums"
node         = 23
title        = "HOW MANY WAYS TO HIT THE TARGET"
difficulty   = 5
time_limit_s = 1200
story        = "A night of takings, hour by hour, and a number the committee's auditor wants to see. How many runs of consecutive hours add up to exactly that."
concepts     = ["prefix-sums", "hashing", "complexity"]
requires     = ["lua.hacker.22.trie"]
map          = { x = 0.750, y = 0.724, kind = "quest" }
brief        = '''
Line one is `n k`. Line two is `n` integers, which may be negative.

Print how many contiguous runs sum to exactly `k`, then `RANGE <s>`, the sum
of the whole list, read off the last prefix sum rather than by adding again.

```
input:  5 3
        1 2 3 -3 3
output: 5
        RANGE 6
```

Negative values kill the sliding window — a window that is too big cannot be
fixed by shrinking it. What survives is prefix sums: a run `i..j` sums to `k`
exactly when `prefix[j] - prefix[i] == k`, so count how many earlier prefixes
equal `prefix[j] - k`. Seed the table with `[0] = 1` for runs that start at
the beginning.

A count that was never written is `nil`, and `nil + 1` is an error, not `1`.
`(seen[key] or 0) + 1` is the Lua for "zero if absent" — the `or` is the
`defaultdict`.

The four cases here are five numbers at most, and the clock is not measuring
speed on them: the `O(n²)` double loop over every start and every end clears
all four. The bar is real — on a night of takings that double loop is
minutes — and it is not what these cases check. What they check is the part
that is easy to get wrong: the `[0] = 1` seed, and looking up before
recording.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, k = data[1], data[2]
local nums = {}
for i = 1, n do nums[i] = data[2 + i] end

local seen = { [0] = 1 }

-- running prefix; for each one, how many earlier prefixes were prefix - k
print(0)
print("RANGE 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, k = data[1], data[2]
local nums = {}
for i = 1, n do nums[i] = data[2 + i] end

local seen = { [0] = 1 }

local prefix, runs = 0, 0
for _, value in ipairs(nums) do
  prefix = prefix + value
  -- look up first, then record: a run of length zero must not count itself
  runs = runs + (seen[prefix - k] or 0)
  seen[prefix] = (seen[prefix] or 0) + 1
end

print(runs)
print("RANGE " .. prefix)
'''
hints = [
  "Look the earlier prefix up *before* you record the current one, or a run of length zero counts itself when k is 0.",
  "seen = { [0] = 1 } up front is what lets a run that starts at index 1 be found at all.",
  "The final prefix is the total, so the second line costs nothing extra. (seen[key] or 0) is how a missing count reads as zero.",
]

