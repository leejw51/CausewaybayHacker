[[quest]]
id           = "lua.hacker.34.stable-sort"
node         = 33
title        = "TIES KEEP THEIR PLACE"
difficulty   = 4
time_limit_s = 900
story        = "Two runners finished the dragon's circuit on the same score and the leaderboard puts them in a different order every time it redraws."
concepts     = ["sorting", "slices", "complexity"]
requires     = ["lua.hacker.33.grid-paths"]
map          = { x = 0.605, y = 0.932, kind = "quest" }
brief        = '''
Standard input is `n buckets seed`. Build `n` riders, where rider `i` has
index `i` and a score, in 64-bit arithmetic that wraps (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Sort the riders by score **descending**. Riders with the same score must keep
the order they arrived in. Print their indices, space separated, then
`TIES <k>` — how many adjacent pairs in your sorted order have equal scores.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` is small, so almost everything is a tie, and the answer is almost
entirely decided by what happens to them.

**This is the quest about knowing which sort you are holding.** `table.sort`
is **not stable**. It is a quicksort, it promises nothing about the order of
elements that compare equal, and it keeps that non-promise: on the sample,
sorted with a plain `a.score > b.score`, the ties come out `5 1 6 0 4 3 2 7`
— which is what the starter does. Nothing raises. The answer is simply a
different answer, on this input, and on a real input it always will be.

There is one correct answer here, and it is the one to reach for by default
in every language: make the comparison **total**. Sort by `(-score, index)`
— score descending, then index ascending — so no two riders ever compare
equal and stability stops being a question. A total order has nothing to
prove. (The other answer the Python interview accepts, "the sort is stable,
lean on it", is not available in this room, and knowing that is the point.)

The clock is not measuring speed here, and there is nothing for it to
measure: `table.sort` is `table.sort` whichever comparator you hand it.
These four cases are decided entirely by what happens to the ties.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, buckets, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local riders = {}
for i = 0, n - 1 do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  riders[#riders + 1] = { score = tonumber(bit.rshift(x, 33)) % buckets, index = i }
end

-- descending by score, and nothing said about the ties — so table.sort
-- puts them wherever its quicksort leaves them
table.sort(riders, function(a, b) return a.score > b.score end)

local out = {}
for i, rider in ipairs(riders) do out[i] = rider.index end
print(table.concat(out, " "))

local ties = 0
for i = 2, #riders do
  if riders[i].score == riders[i - 1].score then ties = ties + 1 end
end
print("TIES " .. ties)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, buckets, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local riders = {}
for i = 0, n - 1 do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  riders[#riders + 1] = { score = tonumber(bit.rshift(x, 33)) % buckets, index = i }
end

-- a total order: score descending, then arrival ascending. No two riders
-- compare equal, so the sort's silence about ties cannot matter.
table.sort(riders, function(a, b)
  if a.score ~= b.score then return a.score > b.score end
  return a.index < b.index
end)

local out = {}
for i, rider in ipairs(riders) do out[i] = rider.index end
print(table.concat(out, " "))

local ties = 0
for i = 2, #riders do
  if riders[i].score == riders[i - 1].score then ties = ties + 1 end
end
print("TIES " .. ties)
'''
hints = [
  "Add the second half to the comparator: when the scores are equal, return a.index < b.index. That is the whole fix.",
