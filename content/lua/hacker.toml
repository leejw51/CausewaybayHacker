[[quest]]
id           = "lua.hacker.06.stack"
node         = 6
title        = "THE NEXT TALLER ONE"
difficulty   = 4
time_limit_s = 900
story        = "A column of lantern heights on the board and one question: for each of them, which is the next one after it that is taller."
concepts     = ["stacks-queues", "slices", "complexity"]
requires     = ["lua.hacker.05.binary-search"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

For each entry print the first entry **to its right** that is strictly
greater, or `-1` if there is none. Put them on one line, space separated. Then
print `NONE <k>`, how many of them were `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Keep a stack of positions whose answer is still unknown, and it stays
decreasing from the bottom up. Each position is pushed once and popped once,
so the whole thing is one pass however it looks. A Lua table is the stack:
`pending[#pending + 1] = i` pushes, `pending[#pending]` is the top, and
`pending[#pending] = nil` pops — all `O(1)`, because `#` on a sequence with
no holes is a length, not a count.

The five cases here are six numbers at most, and the clock is not measuring
speed on them. Nor would a bigger one, and that is worth knowing: the naive
answer — for each entry, walk right until something bigger turns up — is
quadratic only on input that is already close to descending. On random input
it stops after about `ln(n)` steps on average, so no run limit separates it
from the stack. The stack is still the answer, because it is `O(n)` on every
input including the descending one — but on this quest that is a claim you
have to take on the argument rather than on the clock.

`table.concat(answer, " ")` joins numbers as well as strings, and it is the
way to print a line of values — `print(a, b)` puts a **tab** between them.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local nums = {}
for i = 1, n do nums[i] = data[1 + i] end

local answer = {}
for i = 1, n do answer[i] = -1 end
local pending = {}

print(table.concat(answer, " "))
print("NONE " .. n)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local nums = {}
for i = 1, n do nums[i] = data[1 + i] end

local answer = {}
for i = 1, n do answer[i] = -1 end
local pending = {}

for i = 1, n do
  local value = nums[i]
  -- the stack holds indices still waiting; the new value answers every top
  -- it beats
  while #pending > 0 and nums[pending[#pending]] < value do
    answer[pending[#pending]] = value
    pending[#pending] = nil
  end
  pending[#pending + 1] = i
end

local none = 0
for i = 1, n do
  if answer[i] == -1 then none = none + 1 end
end

print(table.concat(answer, " "))
print("NONE " .. none)
'''
hints = [
  "The stack holds indices that are still waiting for their answer, not values.",
  "When the new value beats the value at the top of the stack, that index's answer is the new value — and keep popping, it may beat several. `pending[#pending] = nil` is the pop.",
  "Strictly greater, so equal values do not resolve each other; they stack up and resolve together later.",
]

