[[quest]]
id           = "lua.hacker.11.bst"
node         = 11
title        = "IS IT ACTUALLY A BST"
difficulty   = 4
time_limit_s = 900
story        = "The follow-up, same tree of lantern numbers. Everyone checks the two children and everyone is wrong the first time."
concepts     = ["trees", "recursion", "binary-search"]
requires     = ["lua.hacker.10.tree-walk"]
map          = { x = 0.474, y = 0.314, kind = "quest" }
brief        = '''
Same level-order encoding as the last quest: `-1` is a missing node, children
of `i` are `2i+1` and `2i+2`.

Line one is `n q`. Line two is the `n` tree values. Line three is `q` query
values.

Print `VALID` or `INVALID` — is this a binary search tree, with every value in
the left subtree strictly smaller than the node and every value in the right
strictly larger? Then one line per query: `<value> FOUND <depth>` if it is in
the tree, `<value> ABSENT` if not, where the root is depth 1.

```
input:  7 2
        4 2 6 1 3 5 7
        3 8
output: VALID
        3 FOUND 3
        8 ABSENT
```

Checking `left < node < right` at each node **is not enough** — a value deep
in the left subtree can still be larger than an ancestor. Carry the open
interval down instead. Lua has no smallest integer to start from; the bounds
start as `nil`, meaning "no bound yet", and `nil` needs its own check because
`value <= nil` is `attempt to compare number with nil`, a runtime error, not
a false.

A query is answered by the **descent**: compare with the node, go left when
you are smaller and right otherwise, and report `ABSENT` when you fall off
the tree. That matters because the tree is not promised to be a BST, and in
one that is not, a value can sit in the array somewhere the descent never
looks. It is `ABSENT` — you are being asked what the lookup does, not what a
scan of the array would find.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q = data[1], data[2]
local tree = {}
for i = 0, n - 1 do tree[i] = data[3 + i] end
local queries = {}
for i = 1, q do queries[i] = data[2 + n + i] end

local function present(i)
  return i < n and tree[i] ~= -1
end

local function valid(i, low, high)
  -- the node must sit strictly inside (low, high), and each child
  -- inherits a narrower window; nil means no bound on that side
  return true
end

if valid(0, nil, nil) then print("VALID") else print("INVALID") end
for _, target in ipairs(queries) do
  print(target .. " ABSENT")
end
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q = data[1], data[2]
local tree = {}
for i = 0, n - 1 do tree[i] = data[3 + i] end
local queries = {}
for i = 1, q do queries[i] = data[2 + n + i] end

local function present(i)
  return i < n and tree[i] ~= -1
end

local function valid(i, low, high)
  if not present(i) then return true end
  local value = tree[i]
  -- nil is "no bound": it has to be tested before it is compared
  if low ~= nil and value <= low then return false end
  if high ~= nil and value >= high then return false end
  return valid(2 * i + 1, low, value) and valid(2 * i + 2, value, high)
end

local function find(target)
  local i, depth = 0, 1
  while present(i) do
    if tree[i] == target then return depth end
    if target < tree[i] then i = 2 * i + 1 else i = 2 * i + 2 end
    depth = depth + 1
  end
  return nil
end

if valid(0, nil, nil) then print("VALID") else print("INVALID") end
for _, target in ipairs(queries) do
  local depth = find(target)
  if depth == nil then
    print(target .. " ABSENT")
  else
    print(target .. " FOUND " .. depth)
  end
end
'''
hints = [
