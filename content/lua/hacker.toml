  { name = "takes-all", stdin = "3 10\n1 1\n2 2\n3 3\n",  expect = "6\nGREEDY 6\n",   visible = false },
  { name = "one",       stdin = "1 4\n4 9\n",             expect = "9\nGREEDY 9\n",   visible = false },
]

