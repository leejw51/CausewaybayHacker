[[quest]]
id           = "lua.hacker.07.coins"
node         = 7
title        = "EXACT CHANGE"
difficulty   = 5
time_limit_s = 1200
story        = "The incense stall at the mouth of Wun Sha Street has three coin trays and a customer who will not take a note."
concepts     = ["dynamic-programming", "complexity", "slices"]
requires     = ["lua.hacker.06.stack"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` coin values. Every coin is available
in unlimited quantity.

Print the smallest number of coins that makes `target` exactly, or `-1` if it
cannot be made. Then print `REACH <k>`: how many of the amounts `0..target`
can be made at all, counting `0`.

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

The hidden cases are small, so what they catch is wrongness rather than
slowness — and one of them catches the usual wrong answer. Greedy, taking the
biggest coin that fits and repeating, makes `6` out of `3 4` by grabbing the
`4` and then failing, and there is a case for exactly that. The other bad
answer, plain recursion with no table, is not caught here and still is not
the one to write: `target` is 100000 in the real thing, and the same amount
gets recomputed thousands of times.

The table runs from `0` to `target`, and a Lua table is happy to start at
`0` — `best[0] = 0` is a real entry. An amount that cannot be made is simply
**absent**: `best[amount]` is `nil`, and `nil` is the honest "unreachable"
here. Test it with `~= nil` before you add one to it, because `nil + 1` is
`attempt to perform arithmetic on a nil value`. And never use `#best` to
count anything in a table with holes in it: `#` is a border, not a count.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, target = data[1], data[2]
local coins = {}
for i = 1, n do coins[i] = data[2 + i] end

-- best[amount] is the fewest coins for that amount; nil means unreachable
local best = { [0] = 0 }

-- fill the table bottom up, then print the answer and REACH <k>
print(-1)
print("REACH 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, target = data[1], data[2]
local coins = {}
for i = 1, n do coins[i] = data[2 + i] end

-- best[amount] is the fewest coins for that amount; nil means unreachable
local best = { [0] = 0 }

for amount = 1, target do
  for _, coin in ipairs(coins) do
    if coin <= amount and best[amount - coin] ~= nil then
      local candidate = best[amount - coin] + 1
      if best[amount] == nil or candidate < best[amount] then
        best[amount] = candidate
      end
    end
  end
end

-- count the entries by walking 0..target; # would stop at the first hole
local reach = 0
for amount = 0, target do
  if best[amount] ~= nil then reach = reach + 1 end
end

if best[target] == nil then print(-1) else print(best[target]) end
print("REACH " .. reach)
'''
hints = [
  "best[0] = 0, and best[a] is one more than the cheapest best[a - coin] over every coin that fits.",
  "nil is the honest `unreachable` in Lua — an amount nobody has made has no entry at all. Check `~= nil` before you add one, or the addition itself is the error.",
  "REACH is how many of 0..target have an entry — walk the range and count; `#best` is a border on a table with holes and can be anything.",
]

