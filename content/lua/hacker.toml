[[quest]]
id           = "lua.hacker.21.matrix"
node         = 21
title        = "TURN THE FLOOR PLAN"
difficulty   = 4
time_limit_s = 1200
story        = "The plan of the lantern fair is the wrong way up and there is no room on the table for a second copy of it."
concepts     = ["matrix", "slices", "iteration"]
requires     = ["lua.hacker.20.bits"]
map          = { x = 0.901, y = 0.543, kind = "quest" }
brief        = '''
Line one is `n`. The next `n` lines are an `n × n` grid of integers.

Print the grid rotated **90° clockwise**, `n` lines of space-separated values.
Then print its values in **spiral order** — outer ring clockwise from the top
left, inwards — on one line.

```
input:  3
        1 2 3
        4 5 6
        7 8 9
output: 7 4 1
        8 5 2
        9 6 3
        1 2 3 6 9 8 7 4 5
```

The rotation is the one to do in place: transpose, then reverse each row.
Naming that out loud is half the question. Lua's multiple assignment is the
swap — `grid[r][c], grid[c][r] = grid[c][r], grid[r][c]` — with no temporary,
because the right-hand side is evaluated in full before anything is stored.
There is no `zip(*grid)` one-liner here and nothing to reverse a row for you;
both are loops, and you should be able to say why each one works.

The spiral wants the **original** grid, and a table is a reference: `copy =
grid` is two names for one table, and `{unpack(grid)}` copies the outer table
and shares every row. Copy the rows one by one.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local grid = {}
for r = 1, n do
  grid[r] = {}
  for c = 1, n do grid[r][c] = data[1 + (r - 1) * n + c] end
end

-- transpose, reverse each row, print; then walk the spiral
for _ = 1, n do print("?") end
print("?")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local original, grid = {}, {}
for r = 1, n do
  original[r], grid[r] = {}, {}
  for c = 1, n do
    original[r][c] = data[1 + (r - 1) * n + c]
    grid[r][c] = original[r][c]
  end
end

-- transpose: swap across the diagonal, above it only
for r = 1, n do
  for c = r + 1, n do
    grid[r][c], grid[c][r] = grid[c][r], grid[r][c]
  end
end
-- then reverse every row, and that is the clockwise turn
for r = 1, n do
  local row = grid[r]
  for i = 1, math.floor(n / 2) do
    row[i], row[n + 1 - i] = row[n + 1 - i], row[i]
  end
  print(table.concat(row, " "))
end

local spiral = {}
local top, bottom, left, right = 1, n, 1, n
while top <= bottom and left <= right do
  for c = left, right do spiral[#spiral + 1] = original[top][c] end
  top = top + 1
  for r = top, bottom do spiral[#spiral + 1] = original[r][right] end
  right = right - 1
  if top <= bottom then
    for c = right, left, -1 do spiral[#spiral + 1] = original[bottom][c] end
    bottom = bottom - 1
  end
  if left <= right then
    for r = bottom, top, -1 do spiral[#spiral + 1] = original[r][left] end
    left = left + 1
  end
end
print(table.concat(spiral, " "))
'''
hints = [
  "Transpose by swapping only above the diagonal — c starting at r + 1 — or you swap everything back. Multiple assignment swaps without a temporary.",
  "The spiral wants the original grid, so copy it row by row before you rotate in place: a table is a reference, and `copy = grid` copies nothing.",
  "The two `if` guards inside the spiral loop are what stop a single middle row or column being walked twice.",
]

[quest.tests]
