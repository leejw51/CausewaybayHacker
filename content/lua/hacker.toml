[[quest]]
id           = "lua.hacker.16.union-find"
node         = 16
title        = "WHO IS CONNECTED TO WHOM"
difficulty   = 5
time_limit_s = 1200
story        = "The tram, the MTR and the minibus routes on one sheet, and every lane the dragon closes tonight. How many separate networks are there really."
concepts     = ["disjoint-set", "graphs", "complexity"]
requires     = ["lua.hacker.15.topo-sort"]
map          = { x = 0.255, y = 0.468, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops numbered `0..n-1`, `m` undirected
links. There are no links in the input — you build them, with **exactly** this
generator, in 64-bit arithmetic that wraps:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the m links, in order:
    a = next() % n
    b = next() % n
    link a — b
```

Print three lines: how many separate networks there are, the size of the
largest, and `REDUNDANT <k>` — how many of the links joined two stops that
were already connected. A link from a stop to itself is one of those.

```
input:  8 5 1
output: 4
        5
        REDUNDANT 1
```

For `8 5 1` the five links are `6—1`, `4—6`, `2—3`, `2—6`, `1—2`. The last one
joins two stops already in the same network, so it is the redundant one, and
what is left is `{1,2,3,4,6}` plus stops `0`, `5` and `7` on their own.

A Lua number is a double, and a double holds 53 bits: multiply two of those
constants in it and the low bits are gone before the `+` happens. LuaJIT has
the type the statement is written in. `0ULL + seed` is an unsigned 64-bit
integer, `*` and `+` on it wrap at `2^64` — no mask, the type *is* the mask —
`bit.rshift(x, 33)` takes it, and `tonumber(...)` brings the 31-bit result
back to a plain number that `%` is happy with. Every big case on this road
uses that same four-line generator.

**The complexity here is enforced.** One hidden case is `n = 200000` with
`m = 200000` links. The obvious answer that is not union-find — walk the
network out from `a` and see whether `b` is already in it, once per link — is
correct, and it is `O(n)` per link and so `O(n·m)` in total: on this machine
it had not finished after **25 seconds**, against a ten second run limit.
That is what the starter is. Union-find with path compression and union by
size does the same 200000 links in **0.01 seconds**, measured here with the
solution that ships in this quest.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer on
the sample and on both of the small hidden cases. It is rejected only for
arriving far too late.

Union-find: every stop points at a parent, `find` walks to the root, `union`
points one root at the other. Compress the path on the way back out of `find`
and the whole thing is effectively constant time per query.

Write `find` as a loop. The recursive one is the textbook version and it is
a `stack overflow` on a chain twenty thousand long — which is exactly the
shape union-by-size exists to prevent, and exactly the shape a hostile input
has before the first `find` ever compresses it.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, m, seed = data[1], data[2], data[3]

-- 64-bit arithmetic that wraps: LuaJIT's unsigned 64-bit integer
local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local links = {}
for stop = 0, n - 1 do links[stop] = {} end
local redundant = 0

for _ = 1, m do
  local a = nxt() % n
  local b = nxt() % n

  -- correct, and far too slow: walk the whole network out from a to see
  -- whether b is already in it. This is what the big hidden case rejects.
  local seen = { [a] = true }
  local queue, head = { a }, 1
  local found = a == b
  while head <= #queue and not found do
    local at = queue[head]
    head = head + 1
    for _, nx in ipairs(links[at]) do
      if not seen[nx] then
        if nx == b then
          found = true
          break
        end
        seen[nx] = true
        queue[#queue + 1] = nx
      end
    end
  end
  if found then redundant = redundant + 1 end
  links[a][#links[a] + 1] = b
  links[b][#links[b] + 1] = a
end

local groups, largest = 0, 0
local seen = {}
for start = 0, n - 1 do
  if not seen[start] then
    groups = groups + 1
    seen[start] = true
    local queue, head, count = { start }, 1, 0
    while head <= #queue do
      local at = queue[head]
      head = head + 1
      count = count + 1
      for _, nx in ipairs(links[at]) do
        if not seen[nx] then
          seen[nx] = true
          queue[#queue + 1] = nx
        end
      end
    end
    if count > largest then largest = count end
  end
end

print(groups)
print(largest)
print("REDUNDANT " .. redundant)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, m, seed = data[1], data[2], data[3]

-- 64-bit arithmetic that wraps: LuaJIT's unsigned 64-bit integer
local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

local parent, size = {}, {}
for stop = 0, n - 1 do
  parent[stop] = stop
  size[stop] = 1
end

local function find(v)
  local root = v
  while parent[root] ~= root do root = parent[root] end
  -- path compression: point everything we walked over straight at the root
  while parent[v] ~= root do
    parent[v], v = root, parent[v]
  end
  return root
end

local groups, redundant = n, 0
for _ = 1, m do
  local a = find(nxt() % n)
  local b = find(nxt() % n)
  if a == b then
    redundant = redundant + 1
  else
    -- hang the smaller tree under the bigger one
    if size[a] < size[b] then a, b = b, a end
    parent[b] = a
    size[a] = size[a] + size[b]
    groups = groups - 1
  end
end

-- only a root's size entry means anything
local largest = 0
for stop = 0, n - 1 do
  if parent[stop] == stop and size[stop] > largest then largest = size[stop] end
end

print(groups)
print(largest)
print("REDUNDANT " .. redundant)
'''
hints = [
  "Draw the two endpoints as you go — one generator step each, in that order — rather than building a list of links first. Nothing here needs the links twice.",
  "Start with every stop as its own parent and n groups; each successful union drops the count by one. Only a root's size entry is meaningful afterwards, so read the largest off the roots, not off every index.",
  "A link whose two ends already have the same root is the redundant one — count it and move on. A self-link, a == b, falls out of that test on its own.",
  "parent[v], v = root, parent[v] compresses in one line: Lua evaluates the whole right-hand side before it assigns anything, so the old parent[v] is read before it is overwritten.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 10000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample", stdin = "8 5 1\n",               expect = "4\n5\nREDUNDANT 1\n",              visible = true },
  { name = "single", stdin = "1 2 7\n",               expect = "1\n1\nREDUNDANT 2\n",              visible = false },
  { name = "dozen",  stdin = "12 9 99\n",             expect = "5\n5\nREDUNDANT 2\n",              visible = false },
  { name = "big",    stdin = "200000 200000 12345\n", expect = "32158\n159720\nREDUNDANT 32158\n", visible = false },
]

