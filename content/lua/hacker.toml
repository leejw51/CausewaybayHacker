[[quest]]
id           = "lua.hacker.25.test-cases"
node         = 25
title        = "T TEST CASES FOLLOW"
difficulty   = 3
time_limit_s = 900
story        = "The shape every screen uses, and the bug every candidate writes at least once: the second case remembers the first, the way the second night of the dragon remembers the incense of the first."
concepts     = ["io", "collections", "control-flow", "sorting"]
requires     = ["lua.hacker.24.inversions"]
map          = { x = 0.472, y = 0.739, kind = "quest" }
brief        = '''
Line one is `T`, the number of independent test cases. Each case is a line
with `n`, then a line with `n` integers — and when `n` is `0` that second line
is empty.

For each case print the **second largest distinct** value, or `NONE` if there
are fewer than two distinct values. After all of them print `CASES <T>`.

```
input:  3
        5
        3 1 4 1 5
        3
        7 7 7
        0

output: 4
        NONE
        NONE
        CASES 3
```

This is the standard competitive-screen wrapper and it fails candidates for
one reason: state that should have been per-case was declared before the
loop. Every accumulator, every set, every `best` goes **inside** the `for` —
a `local` declared inside the loop body is a fresh variable on every turn.

Read by whitespace token rather than by line, and the empty line for `n = 0`
stops being a special case at all — which is the second thing this shape
teaches. The set is a table with the values as keys; to rank them, copy the
keys out with `pairs` into a sequence and `table.sort` it, because `pairs`
has no order and the second largest is a question about order.
'''
starter      = '''
local next_token = io.read("*a"):gmatch("%S+")
local cases = tonumber(next_token())

-- declared once, reused for every case — this is the bug
local distinct = {}

for _ = 1, cases do
  local n = tonumber(next_token())
  for _ = 1, n do
    distinct[tonumber(next_token())] = true
  end
  local ranked = {}
  for value in pairs(distinct) do ranked[#ranked + 1] = value end
  table.sort(ranked)
  if #ranked >= 2 then print(ranked[#ranked - 1]) else print("NONE") end
end
print("CASES " .. cases)
'''
solution     = '''
local next_token = io.read("*a"):gmatch("%S+")
local cases = tonumber(next_token())

for _ = 1, cases do
  -- fresh for every case
  local distinct = {}

  local n = tonumber(next_token())
  for _ = 1, n do
    distinct[tonumber(next_token())] = true
  end

  local ranked = {}
  for value in pairs(distinct) do ranked[#ranked + 1] = value end
  table.sort(ranked)
  if #ranked >= 2 then print(ranked[#ranked - 1]) else print("NONE") end
end
print("CASES " .. cases)
'''
hints = [
  "Move the `local distinct = {}` inside the loop. That is the entire fix, and it is the entire quest.",
  "A table keyed by the values de-duplicates; pairs gets the keys back out in no particular order, and table.sort puts them in one, so ranked[#ranked - 1] is the second largest distinct value.",
  "ranked[#ranked - 1] on a sequence of one is ranked[0], which is nil and prints as `nil` rather than raising — which is why the length check comes first, and why a missing key is not an error until it is followed.",
]

