[[quest]]
id           = "lua.hacker.29.dijkstra"
node         = 28
title        = "NOT EVERY STREET IS THE SAME LENGTH"
difficulty   = 5
time_limit_s = 1500
story        = "Every map you have cleared so far counted hops. The tram does not care how many stops there are; it cares how long they take — and tonight every lane in Tai Hang takes longer."
concepts     = ["graphs", "heaps", "complexity"]
requires     = ["lua.hacker.27.commands"]
map          = { x = 0.114, y = 0.663, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops, `m` undirected weighted edges. Build
the graph yourself, with **exactly** this generator, in 64-bit arithmetic that
wraps (`0ULL + seed`, as on node 16):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Print the sum of the shortest distances from stop `0` to every reachable stop
(including `0` itself, which is `0`), then `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**The complexity here is enforced.** One hidden case is `n = 100000`,
`m = 200000`. Dijkstra is the right algorithm either way; what the clock
decides is the priority queue. The starter keeps the unvisited stops in a
set — a table with the stop as the key — and finds the nearest one by
walking the set with `pairs`, which is `O(V)` per step and `O(V²)` in all:
on this machine, **32 seconds** against a ten second run limit. A binary
heap makes it `O((V + E) log V)` and it finishes in about a sixth of a
second. Both measured on this machine, with the two programs that ship in
this quest.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer. It
is rejected only for arriving far too late.

There is no `heapq` here: the heap is the one you were handed on node 12,
holding `{ distance, stop }` entries and comparing on the distance, and it
is yours to write this time. It has no decrease-key, and you do not need
one: push the improved distance as a new entry and skip any entry you pop
whose distance is already worse than the one you have recorded. That
"stale entry" skip is the line people forget, and without it the heap
grows without bound. `math.huge` is the honest `unreached`: it compares
greater than every number and needs no `nil` check in the relaxation.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, m, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

-- graph[u] is a sequence of { v, w } edges
local graph = {}
for u = 0, n - 1 do graph[u] = {} end
local function edge(a, b, w)
  graph[a][#graph[a] + 1] = { b, w }
  graph[b][#graph[b] + 1] = { a, w }
end
for i = 1, n - 1 do
  local p = nxt() % i
  local w = nxt() % 1000 + 1
  edge(p, i, w)
end
for _ = 1, math.max(0, m - (n - 1)) do
  local a = nxt() % n
  local b = nxt() % n
  local w = nxt() % 1000 + 1
  edge(a, b, w)
end

local dist = {}
local remaining = {}
for u = 0, n - 1 do
  dist[u] = math.huge
  remaining[u] = true
end
dist[0] = 0

-- correct, and far too slow: the nearest unvisited stop is found by walking
-- the whole set of them
while true do
  local best, best_dist = nil, math.huge
  for u in pairs(remaining) do
    if dist[u] < best_dist then
      best_dist = dist[u]
      best = u
    end
  end
  if best == nil then break end
  remaining[best] = nil
  for _, e in ipairs(graph[best]) do
    local v, w = e[1], e[2]
    if best_dist + w < dist[v] then dist[v] = best_dist + w end
  end
end

local total, largest = 0, 0
for u = 0, n - 1 do
  if dist[u] < math.huge then
    total = total + dist[u]
    if dist[u] > largest then largest = dist[u] end
  end
end
print(total)
print("MAX " .. largest)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, m, seed = data[1], data[2], data[3]

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

-- graph[u] is a sequence of { v, w } edges
local graph = {}
for u = 0, n - 1 do graph[u] = {} end
local function edge(a, b, w)
  graph[a][#graph[a] + 1] = { b, w }
  graph[b][#graph[b] + 1] = { a, w }
end
for i = 1, n - 1 do
  local p = nxt() % i
  local w = nxt() % 1000 + 1
  edge(p, i, w)
end
for _ = 1, math.max(0, m - (n - 1)) do
  local a = nxt() % n
  local b = nxt() % n
  local w = nxt() % 1000 + 1
  edge(a, b, w)
end

-- a binary min-heap of { distance, stop }, ordered by distance
local heap = {}

local function push(d, v)
  local i = #heap + 1
  heap[i] = { d, v }
  while i > 1 do
    local parent = math.floor(i / 2)
    if heap[parent][1] <= heap[i][1] then break end
    heap[i], heap[parent] = heap[parent], heap[i]
    i = parent
  end
end

local function pop()
  local top = heap[1]
  local last = heap[#heap]
  heap[#heap] = nil
  local size = #heap
  if size > 0 then
    heap[1] = last
    local i = 1
    while true do
      local l, r, smallest = 2 * i, 2 * i + 1, i
      if l <= size and heap[l][1] < heap[smallest][1] then smallest = l end
      if r <= size and heap[r][1] < heap[smallest][1] then smallest = r end
      if smallest == i then break end
      heap[i], heap[smallest] = heap[smallest], heap[i]
      i = smallest
    end
  end
  return top[1], top[2]
end

local dist = {}
for u = 0, n - 1 do dist[u] = math.huge end
dist[0] = 0

push(0, 0)
while #heap > 0 do
  local d, u = pop()
  -- a stale entry: we already found a shorter way to u
  if d <= dist[u] then
    for _, e in ipairs(graph[u]) do
      local v, w = e[1], e[2]
      local candidate = d + w
      if candidate < dist[v] then
        dist[v] = candidate
        push(candidate, v)
      end
    end
  end
end

local total, largest = 0, 0
for u = 0, n - 1 do
  if dist[u] < math.huge then
    total = total + dist[u]
    if dist[u] > largest then largest = dist[u] end
  end
end
print(total)
print("MAX " .. largest)
'''
hints = [
  "{ distance, stop } entries in a min-heap keyed on the first field: the heap from node 12 with `less` reduced to comparing [1].",
  "Skipping an entry whose distance is greater than dist[u] is the stale-entry skip. Without it the algorithm is still correct and the heap fills with obsolete entries.",
  "math.huge is the honest `unreached`: it compares greater than every number and needs no nil check in the relaxation. The spanning-tree half of the generator guarantees every stop is reachable, so the final filter never removes anything — keep it anyway, because the version of this question with an unreachable stop is the follow-up.",
]

