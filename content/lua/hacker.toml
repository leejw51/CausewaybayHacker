map          = { x = 0.671, y = 0.280, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` values in **level order**, where `-1` means
"no node here" — so the tree is stored the way a heap is: the children of
index `i` are `2i+1` and `2i+2`.

Print four lines: the **preorder**, **inorder** and **postorder** walks, each
space separated, and then `DEPTH <d>` — the number of nodes on the longest
root-to-leaf path.

```
input:  5
        1 2 3 -1 4
output: 1 2 4 3
        2 4 1 3
        4 2 3 1
        DEPTH 3
```

Preorder is node, left, right. Inorder is left, node, right. Postorder is
left, right, node. The recursion is the same three lines each time and only
the position of the append moves. The recursion here is as deep as the tree,
which for a heap-shaped array is `log n`, so the stack is not a concern — say
that out loud, because it will be asked.

The formula wants the root at index `0`, and a Lua table can have a `0` key:
store the values as `tree[0] .. tree[n-1]` and `2i+1` works unchanged. Off
the end of the table `tree[i]` is `nil`, and so is the test for it. A
`local function walk(...)` can call itself; a plain `local walk = function`
cannot, because the name is not in scope inside its own body yet.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local tree = {}
for i = 0, n - 1 do tree[i] = data[2 + i] end

local function walk(i, order, out)
  -- order 0 = preorder, 1 = inorder, 2 = postorder
end

local function depth(i)
  return 0
end

for order = 0, 2 do
  local out = {}
  walk(0, order, out)
  print(table.concat(out, " "))
end
print("DEPTH " .. depth(0))
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n = data[1]
local tree = {}
for i = 0, n - 1 do tree[i] = data[2 + i] end

local function present(i)
  return i < n and tree[i] ~= -1
end

local function walk(i, order, out)
  if not present(i) then return end
  if order == 0 then out[#out + 1] = tree[i] end
  walk(2 * i + 1, order, out)
  if order == 1 then out[#out + 1] = tree[i] end
  walk(2 * i + 2, order, out)
  if order == 2 then out[#out + 1] = tree[i] end
end

local function depth(i)
  if not present(i) then return 0 end
  return 1 + math.max(depth(2 * i + 1), depth(2 * i + 2))
end

for order = 0, 2 do
  local out = {}
  walk(0, order, out)
  print(table.concat(out, " "))
end
print("DEPTH " .. depth(0))
'''
hints = [
  "One recursive function with the append in three possible places beats three near-identical functions.",
  "The base case is both conditions at once: past the end of the array, or sitting on a -1.",
  "Depth is 1 + the deeper of the two children, and 0 for a missing node.",
]

