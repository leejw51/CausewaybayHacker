[[quest]]
id           = "lua.hacker.18.edit-distance"
node         = 18
title        = "HOW FAR APART"
difficulty   = 5
time_limit_s = 1200
story        = "Two spellings of the same lane on two different street signs. How many single-character edits between them."
concepts     = ["dynamic-programming", "strings", "matrix"]
requires     = ["lua.hacker.17.lis"]
map          = { x = 0.529, y = 0.468, kind = "quest" }
brief        = '''
Two lines, one word each, lowercase. Either line may be **empty**, and then
the answer is the length of the other one.

Print the **edit distance**: the fewest single-character insertions,
deletions or substitutions that turn the first into the second. Then print
`LCS <k>`, the length of their longest common subsequence.

```
input:  horse
        ros
output: 3
        LCS 2
```

Two tables over the same two strings, and both are the same three-line
recurrence with a different tie-break. Fill row by row; the answer is the far
corner. Row `0` and column `0` are not zero for the edit table — they are the
cost of deleting or inserting everything.

An empty first line means `gmatch("%S+")` would hand you the second word as
the first. Read by lines, not by tokens, on this one — `gmatch("(.-)\n")`
walks the lines and hands back an empty string for an empty one.

A `(len(a)+1) × (len(b)+1)` table is a table of tables, and every row must
be its **own** table: build each one in the loop with `{}`. One row table
assigned to every index is one row, written over from every direction, and
the answer at the far corner is nonsense that looks plausible.
'''
starter      = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end
local a = (lines[1] or ""):match("^%s*(.-)%s*$")
local b = (lines[2] or ""):match("^%s*(.-)%s*$")

-- edit[i][j] and lcs[i][j] over the prefixes a[1..i] and b[1..j]
local edit, lcs = {}, {}
for i = 0, #a do
  edit[i], lcs[i] = {}, {}
  for j = 0, #b do
    edit[i][j] = 0
    lcs[i][j] = 0
  end
end

-- fill both tables; the answers are the bottom-right corners
print(0)
print("LCS 0")
'''
solution     = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end
local a = (lines[1] or ""):match("^%s*(.-)%s*$")
local b = (lines[2] or ""):match("^%s*(.-)%s*$")

-- edit[i][j] and lcs[i][j] over the prefixes a[1..i] and b[1..j]
local edit, lcs = {}, {}
for i = 0, #a do
  edit[i], lcs[i] = {}, {}
  for j = 0, #b do
    edit[i][j] = 0
    lcs[i][j] = 0
  end
end

for i = 0, #a do edit[i][0] = i end
for j = 0, #b do edit[0][j] = j end
for i = 1, #a do
  for j = 1, #b do
    if a:byte(i) == b:byte(j) then
      edit[i][j] = edit[i - 1][j - 1]
    else
      edit[i][j] = 1 + math.min(edit[i - 1][j - 1], edit[i - 1][j], edit[i][j - 1])
    end
  end
end

for i = 1, #a do
  for j = 1, #b do
    if a:byte(i) == b:byte(j) then
      lcs[i][j] = lcs[i - 1][j - 1] + 1
    else
      lcs[i][j] = math.max(lcs[i - 1][j], lcs[i][j - 1])
    end
  end
end

print(edit[#a][#b])
print("LCS " .. lcs[#a][#b])
'''
hints = [
  "edit[i][0] = i and edit[0][j] = j: turning a prefix into nothing costs one deletion per character.",
  "Matching characters cost nothing and step diagonally; a mismatch costs one and takes the cheapest of the three neighbours. a:byte(i) == b:byte(j) compares the characters without making two new strings.",
  "LCS is the same walk with max instead of min, and no diagonal step on a mismatch. And build every row with its own {} inside the loop — one shared row table is the bug that prints a plausible wrong number.",
]

[quest.tests]
