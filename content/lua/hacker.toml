[[quest]]
id           = "lua.hacker.28.lru"
node         = 34
title        = "THE MOON"
difficulty   = 5
time_limit_s = 1800
story        = "Room 7-32, last question, eighth time. The interviewer turns the monitor off, and the only light on the whiteboard is the moon through the window: one table type for every structure, and the clock."
concepts     = ["collections", "linked-lists", "recursion", "complexity"]
requires     = ["lua.hacker.34.stable-sort", "lua.hacker.24.inversions"]
map          = { x = 0.818, y = 0.870, kind = "boss" }
brief        = '''
Line one is `cap q`, and then either `q` lines of operations, each
`PUT <key> <value>` or `GET <key>` — or, when line one carries a **third**
number `seed`, no further lines at all, and the `q` operations come from the
generator below.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key. A `PUT` of a
key the cache already holds replaces its value and makes it the most recent —
it adds no entry, so it evicts nothing however full the cache is.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The generated form, in 64-bit arithmetic that wraps (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q operations:
    a   = next()
    key = next() % (2 * cap)
    if a % 4 == 0:   GET key
    else:            PUT key (next() % 100)        # the value is a third draw
```

**The starter is wrong, and the sample shows it.** It keeps the cache in two
tables — `cache[key]` for the values and `order`, a sequence of keys, oldest
first — and it evicts `order[1]`. A `PUT` of a new key appends to `order`. A
`GET` reads `cache[key]` and does nothing else, because reading a table
moves nothing in it: the table remembers what is at a key, not when you last
looked. So the cache evicts the key that came in **first**, not the one used
**least recently**, and on the sample `GET 2` prints `20`.

That is the boss. Everything in this land is a table, and a table has no
memory of being read. Recency is a thing you have to *write* — on every hit
and every overwrite, not only on insert — and the structure that makes that
write `O(1)` is the textbook one: a hash table into a doubly linked list.
There is no `OrderedDict` with the pointers hidden. Here the pointers are
fields: a node is `{ key = k, value = v, prev = p, next = n }`, `nodes[key]`
finds it, unlinking it and relinking it at the hot end is four assignments,
and the cold end is `head.next`. Two sentinel tables at the ends mean no
`nil` check anywhere in the list code. Every operation is `O(1)`, and you can
say so without hedging.

The starter's `table.remove(order, 1)` is `O(cap)` on top of being wrong,
and its `order` is the tell: a sequence can say who came first, but moving a
key to the end on every touch is a search and a shift, and the linked list
is what "move to the end in constant time" looks like when you build it
yourself.

(In the Python version of this interview the boss was the recursion limit,
and the two-thousand-operation hidden case is still here. The starter walks
the operations recursively — `return step(i + 1)` at the end of `step` — and
it gets through, because that is a **proper tail call**: Lua reuses the frame,
and a tail call costs nothing however many there are. Twenty thousand or so
non-tail frames is where `stack overflow` lives. Know both facts; the
recursion was never the shape of this problem, and a sequence of operations
is a `for` loop.)
'''
starter      = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end

local header = {}
for token in lines[1]:gmatch("%S+") do header[#header + 1] = tonumber(token) end
local cap, q = header[1], header[2]

-- ops[i] is { kind = "GET" | "PUT", key = k, value = v }
local ops = {}
if #header == 3 then
  local x = 0ULL + header[3]
  local function nxt()
    x = x * 6364136223846793005ULL + 1442695040888963407ULL
    return tonumber(bit.rshift(x, 33))
  end
  for _ = 1, q do
    local a = nxt()
    local key = nxt() % (2 * cap)
    if a % 4 == 0 then
      ops[#ops + 1] = { kind = "GET", key = key }
    else
      ops[#ops + 1] = { kind = "PUT", key = key, value = nxt() % 100 }
    end
  end
else
  for i = 1, q do
    local kind, key, value = lines[1 + i]:match("(%S+)%s+(%S+)%s*(%S*)")
    ops[#ops + 1] = { kind = kind, key = tonumber(key), value = tonumber(value) }
  end
end

local cache = {}   -- key -> value
local order = {}   -- keys, oldest first
local evicted = 0
local out = {}

local function step(i)
  if i > #ops then return end
  local op = ops[i]
  if op.kind == "GET" then
    local value = cache[op.key]
    -- reading a table moves nothing in it
    if value == nil then out[#out + 1] = "-1" else out[#out + 1] = tostring(value) end
  else
    if cache[op.key] == nil then
      if #order == cap then
        local coldest = table.remove(order, 1)
        cache[coldest] = nil
        evicted = evicted + 1
      end
      order[#order + 1] = op.key
    end
    cache[op.key] = op.value
  end
  -- a proper tail call: no frame, however many operations there are
  return step(i + 1)
end
step(1)

for _, line in ipairs(out) do print(line) end
if #order == 0 then
  print("-")
else
  local survivors = {}
  for i = #order, 1, -1 do survivors[#survivors + 1] = order[i] end
  print(table.concat(survivors, " "))
end
print("EVICTED " .. evicted)
'''
solution     = '''
local input = io.read("*a")
local lines = {}
for line in (input .. "\n"):gmatch("(.-)\r?\n") do lines[#lines + 1] = line end

local header = {}
for token in lines[1]:gmatch("%S+") do header[#header + 1] = tonumber(token) end
local cap, q = header[1], header[2]

-- ops[i] is { kind = "GET" | "PUT", key = k, value = v }
local ops = {}
if #header == 3 then
  local x = 0ULL + header[3]
  local function nxt()
    x = x * 6364136223846793005ULL + 1442695040888963407ULL
    return tonumber(bit.rshift(x, 33))
  end
  for _ = 1, q do
    local a = nxt()
    local key = nxt() % (2 * cap)
    if a % 4 == 0 then
      ops[#ops + 1] = { kind = "GET", key = key }
    else
      ops[#ops + 1] = { kind = "PUT", key = key, value = nxt() % 100 }
    end
  end
else
  for i = 1, q do
    local kind, key, value = lines[1 + i]:match("(%S+)%s+(%S+)%s*(%S*)")
    ops[#ops + 1] = { kind = kind, key = tonumber(key), value = tonumber(value) }
  end
end

-- a hash table into a doubly linked list: nodes[key] finds the node, the
-- list holds the order. Two sentinels: head.next is the coldest entry,
-- tail.prev the hottest, and neither end is ever nil.
local head, tail = {}, {}
head.next, tail.prev = tail, head
local nodes = {}
local count, evicted = 0, 0
local out = {}

local function unlink(node)
  node.prev.next = node.next
  node.next.prev = node.prev
end

local function link_hot(node)
  node.prev = tail.prev
  node.next = tail
  tail.prev.next = node
  tail.prev = node
end

-- a sequence of operations is a for loop, however it was handed to you
for _, op in ipairs(ops) do
  local node = nodes[op.key]
  if op.kind == "GET" then
    if node == nil then
      out[#out + 1] = "-1"
    else
      -- the touch: recency is written, not remembered
      unlink(node)
      link_hot(node)
      out[#out + 1] = tostring(node.value)
    end
  elseif node ~= nil then
    -- an overwrite is a touch, not an insert: nothing is evicted
    node.value = op.value
    unlink(node)
    link_hot(node)
  else
    if count >= cap and count > 0 then
      local coldest = head.next
      unlink(coldest)
      nodes[coldest.key] = nil
      count = count - 1
      evicted = evicted + 1
    end
    node = { key = op.key, value = op.value }
    nodes[op.key] = node
    link_hot(node)
    count = count + 1
  end
end

for _, line in ipairs(out) do print(line) end
local survivors = {}
local walk = tail.prev
while walk ~= head do
  survivors[#survivors + 1] = walk.key
  walk = walk.prev
end
if #survivors == 0 then print("-") else print(table.concat(survivors, " ")) end
print("EVICTED " .. evicted)
'''
hints = [
  "Trace the sample on the starter: GET 1 reads cache[1] and order is still { 1, 2 }, so PUT 3 evicts 1 and GET 2 finds 20. The touch has to move the key, and a GET is a touch.",
  "A node is { key, value, prev, next }; unlink is two assignments and link-at-the-hot-end is four. With a head and a tail sentinel there is no nil at either end and no special case for an empty list.",
  "Overwriting a key that is already present is a touch, not an insert — check nodes[key] before you decide the cache is full, or the overwrite case evicts something it should not.",
  "The survivors are the list read from the hot end: walk tail.prev back to head. No sort, no stamps, and never pairs — pairs has no order to give you.",
]

