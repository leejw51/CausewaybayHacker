[[quest]]
id           = "lua.hacker.32.modular"
node         = 31
title        = "MODULO ONE BILLION AND SEVEN"
difficulty   = 5
time_limit_s = 1500
story        = "The phrase appears at the bottom of the statement and half the room does not know what it is asking them to do. In this room it is asking one more thing: a number that holds fifty-three bits, multiplied twice."
concepts     = ["math", "complexity", "recursion"]
requires     = ["lua.hacker.31.palindrome"]
map          = { x = 0.335, y = 0.936, kind = "quest" }
brief        = '''
Standard input is `n q seed`. Generate `q` queries, in 64-bit arithmetic that
wraps (`0ULL + seed`):

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407   (mod 2^64)
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

For each query compute the binomial coefficient `C(a, b)` **modulo
1000000007**. Print the sum of all `q` answers, itself modulo `1000000007`,
then `LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` has hundreds of thousands of digits at these sizes, and nothing in
Lua will hold it. Every multiplication is reduced as you go. The problem is
the division: `a! / (b! (a-b)!)` has no meaning in modular arithmetic. What
replaces it is the **modular inverse**, and because `1000000007` is prime,
Fermat's little theorem gives it to you: `inverse(v) = v^(p-2) mod p`, by
repeated squaring — `^` here is a floating-point power and cannot do it, so
the loop is yours.

So: precompute `factorial[0..n]` once, and answer each query as
`f[a] * inv(f[b]) * inv(f[a-b])`.

**And the multiplication itself is the trap in this language.** Two residues
are each under `2^30`; their product is under `2^60`, and a Lua number is a
double that holds `2^53`. `(a * b) % P` is wrong past that point — not an
error, not an overflow, just the low bits gone and a residue that is off by a
little. The honest `mulmod` splits one factor into a high and a low 16-bit
half, so each partial product stays under `2^46`, and reduces between the
halves. It is five lines and the starter carries it; every product on this
node goes through it.

**The complexity here is enforced.** One hidden case is `n = 200000`,
`q = 200000`. Computing each coefficient independently — multiply `b` terms,
divide by `b` terms, one modular inverse each — had not finished after
**25 seconds** against the ten second run limit; that is the starter. One
shared factorial table, with the inverse factorials precomputed backwards
from one `powmod`, answers every query in two `mulmod`s and finishes in a few
hundredths of a second. Both measured on this machine.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q, seed = data[1], data[2], data[3]
local P = 1000000007

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

-- a * b mod P without ever passing 2^53: split a into 16-bit halves
local function mulmod(a, b)
  local high = math.floor(a / 65536)
  local low = a - high * 65536
  return ((high * b) % P * 65536 + low * b) % P
end

-- base^e mod P by repeated squaring; e is at most P - 2
local function powmod(base, e)
  local result = 1
  while e > 0 do
    if e % 2 == 1 then result = mulmod(result, base) end
    base = mulmod(base, base)
    e = math.floor(e / 2)
  end
  return result
end

local total, last = 0, 0
for _ = 1, q do
  local a = nxt() % (n + 1)
  local b = nxt() % (a + 1)

  -- correct, and far too slow: b multiplications and a modular inverse
  -- for every single query
  local numerator, denominator = 1, 1
  for k = 0, b - 1 do
    numerator = mulmod(numerator, a - k)
    denominator = mulmod(denominator, k + 1)
  end
  local value = mulmod(numerator, powmod(denominator, P - 2))

  total = (total + value) % P
  last = value
end

print(total)
print("LAST " .. last)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, q, seed = data[1], data[2], data[3]
local P = 1000000007

local x = 0ULL + seed
local function nxt()
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  return tonumber(bit.rshift(x, 33))
end

-- a * b mod P without ever passing 2^53: split a into 16-bit halves
local function mulmod(a, b)
  local high = math.floor(a / 65536)
  local low = a - high * 65536
  return ((high * b) % P * 65536 + low * b) % P
end

-- base^e mod P by repeated squaring; e is at most P - 2
local function powmod(base, e)
  local result = 1
  while e > 0 do
    if e % 2 == 1 then result = mulmod(result, base) end
    base = mulmod(base, base)
    e = math.floor(e / 2)
  end
  return result
end

-- one shared factorial table, and the inverse factorials walked backwards
-- from a single Fermat inverse: inv(k-1)! = inv(k!) * k
local factorial = { [0] = 1 }
for i = 1, n do factorial[i] = mulmod(factorial[i - 1], i) end
local inv_factorial = {}
inv_factorial[n] = powmod(factorial[n], P - 2)
for i = n, 1, -1 do inv_factorial[i - 1] = mulmod(inv_factorial[i], i) end

local total, last = 0, 0
for _ = 1, q do
  local a = nxt() % (n + 1)
  local b = nxt() % (a + 1)

  local value = mulmod(mulmod(factorial[a], inv_factorial[b]), inv_factorial[a - b])

  total = (total + value) % P
  last = value
end

print(total)
print("LAST " .. last)
'''
hints = [
  "Reduce after every multiplication, and multiply only through mulmod: a plain a * b of two residues is past 2^53 and silently wrong.",
  "powmod(v, P - 2) is the modular inverse, and it only works because P is prime — that is the whole content of Fermat's little theorem here.",
  "Precompute inverse factorials as well, backwards from powmod(factorial[n], P - 2): inv_factorial[i - 1] = inv_factorial[i] * i. Then a query is two mulmods and no powmod at all.",
]

