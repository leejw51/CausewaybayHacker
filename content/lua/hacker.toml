  { name = "even",   stdin = "4\n7 8 9 10\n",  expect = "10 9 8 7\n9\nLEN 4\n",  visible = false },
  { name = "single", stdin = "1\n42\n",        expect = "42\n42\nLEN 1\n",       visible = false },
  { name = "signed", stdin = "3\n-1 0 1\n",    expect = "1 0 -1\n0\nLEN 3\n",    visible = false },
]

