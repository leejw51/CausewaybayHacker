[[quest]]
id           = "lua.hacker.17.lis"
node         = 17
title        = "THE LONGEST RUN UP"
difficulty   = 5
time_limit_s = 1200
story        = "A year of nightly takings at the lantern stall. They want the longest stretch of improving nights, and they do not have to be consecutive."
concepts     = ["dynamic-programming", "binary-search", "complexity"]
requires     = ["lua.hacker.16.union-find"]
map          = { x = 0.327, y = 0.554, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

Print the length of the longest **strictly increasing subsequence** — the
values keep their order but need not be adjacent. Then print
`TAILS <k>` where `k` is that same length, read off the patience-sorting pile
count.

```
input:  8
        10 9 2 5 3 7 101 18
output: 4
        TAILS 4
```

The `O(n²)` table is the answer you should be able to write cold. The `O(n log n)`
one keeps, for each length, the smallest value a subsequence of that length can
end on — a table that is always sorted, so the position of a new value is a
binary search. There is no `bisect` in Lua; the search is six lines, written
by hand, and it finds the **first** tail that is `>= value` — the left one,
not the right one, because strictly increasing means an equal value replaces
rather than extends. Either answer passes here; the cases are small and say
so. Write the second one anyway, because the follow-up is always "and
faster?".

Writing `tails[#tails + 1] = value` appends; writing `tails[at] = value` for
an `at` inside the sequence replaces. The binary search hands you `at`, and
when it lands one past the end the same assignment does the append.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

local tails = {}

-- for each value, find where it belongs among the pile tops and put it there
print(0)
print("TAILS 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local nums = {}
for i = 2, #data do nums[#nums + 1] = data[i] end

-- tails[i] = the smallest value an increasing subsequence of length i can
-- end on. It is sorted, always.
local tails = {}
for _, value in ipairs(nums) do
  -- the first tail >= value, or #tails + 1 if there is none
  local low, high = 1, #tails + 1
  while low < high do
    local mid = math.floor((low + high) / 2)
    if tails[mid] < value then
      low = mid + 1
    else
      high = mid
    end
  end
  tails[low] = value
end

print(#tails)
print("TAILS " .. #tails)
'''
hints = [
  "tails is not a subsequence. Its length is the answer; its contents are only the best ending values.",
  "Strictly increasing means you replace the first tail that is >= value, which is what the search with `tails[mid] < value` finds. Searching for the first tail > value would give you non-decreasing instead.",
  "Running off the end of tails — low == #tails + 1 — means this value extends the longest run so far, and `tails[low] = value` is then an append.",
]

