[[quest]]
id           = "lua.hacker.24.inversions"
node         = 24
title        = "THE ONE THE CLOCK CATCHES"
difficulty   = 5
time_limit_s = 1500
story        = "First question of the evening round. The naive answer is correct, and it is the wrong answer."
concepts     = ["sorting", "complexity", "recursion"]
requires     = ["lua.hacker.23.prefix-sums"]
map          = { x = 0.666, y = 0.676, kind = "quest" }
brief        = '''
Standard input is two integers, `n` and `seed`. There is no array in the input
— you build it, with **exactly** this generator, in 64-bit arithmetic that
wraps:

```
x = seed
repeat n times:
    x = x * 6364136223846793005 + 1442695040888963407    (mod 2^64)
    next value = (x >> 33) % 1000000007
```

Count the **inversions**: pairs `i < j` where `a[i] > a[j]`. Print the count,
then `MAX <largest value>`.

```
input:  8 1
output: 19
        MAX 908834774
```

For `8 1` the array is
`908834774 93944146 392341189 822192870 708211027 74839788 189567123 140486902`.

**This quest enforces its complexity, and it is the only kind that can.** One
hidden case is `n = 200000`. The `O(n²)` double loop — which is what the
starter is — is `2 × 10^10` comparisons, and on this machine it had not
finished after **25 seconds** against the ten second run limit. Counting
inversions during a merge sort is `O(n log n)` and finishes in a few
hundredths of a second. Measured, on this machine, with these two programs.

Two things this language decides differently. The generator runs in
LuaJIT's 64-bit integer — `0ULL + seed`, and the constants with `ULL` on the
end — because a plain number is a double and the product would lose its low
bits; `tonumber(bit.rshift(x, 33))` brings each draw back to a number. And
the answer, `9990744366`, is over `2^32` and well under `2^53`, so a double
holds it exactly and `print` shows every digit; saying *why* that is safe,
and where it would stop being, is part of the answer.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, seed = data[1], data[2]

local x = 0ULL + seed
local values = {}
local largest = 0
for i = 1, n do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  local value = tonumber(bit.rshift(x, 33)) % 1000000007
  values[i] = value
  if value > largest then largest = value end
end

-- correct, and far too slow: this is what the big hidden case rejects
local inversions = 0
for i = 1, n do
  local left = values[i]
  for j = i + 1, n do
    if left > values[j] then inversions = inversions + 1 end
  end
end

print(inversions)
print("MAX " .. largest)
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, seed = data[1], data[2]

local x = 0ULL + seed
local values = {}
local largest = 0
for i = 1, n do
  x = x * 6364136223846793005ULL + 1442695040888963407ULL
  local value = tonumber(bit.rshift(x, 33)) % 1000000007
  values[i] = value
  if value > largest then largest = value end
end

-- merge sort of a[lo..hi] in place through one shared buffer, returning how
-- many inversions it removed
local buffer = {}
local function sort_count(a, lo, hi)
  if hi - lo < 1 then return 0 end
  local mid = math.floor((lo + hi) / 2)
  local inversions = sort_count(a, lo, mid) + sort_count(a, mid + 1, hi)

  local i, j, k = lo, mid + 1, lo
  while i <= mid and j <= hi do
    if a[i] <= a[j] then
      buffer[k] = a[i]
      i = i + 1
    else
      -- a[i..mid] are all greater than a[j]
      inversions = inversions + (mid - i + 1)
      buffer[k] = a[j]
      j = j + 1
    end
    k = k + 1
  end
  while i <= mid do
    buffer[k] = a[i]
    i = i + 1
    k = k + 1
  end
  while j <= hi do
    buffer[k] = a[j]
    j = j + 1
    k = k + 1
  end
  for p = lo, hi do a[p] = buffer[p] end
  return inversions
end

print(sort_count(values, 1, n))
print("MAX " .. largest)
'''
hints = [
  "Take the max as you generate, or off the original table before you sort — this merge sort works in place.",
  "When the right-hand value wins the merge, every remaining element of the left half is greater than it — that is `mid - i + 1` inversions in one go, and it is the whole trick.",
  "The recursion is log2(200000), about eighteen frames deep — nowhere near LuaJIT's roof. A Fenwick tree over the compressed values is the other O(n log n) answer and is worth naming in the room.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 10000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "sample", stdin = "8 1\n",          expect = "19\nMAX 908834774\n",          visible = true },
  { name = "single", stdin = "1 7\n",          expect = "0\nMAX 59165271\n",            visible = false },
  { name = "dozen",  stdin = "12 99\n",        expect = "33\nMAX 998275676\n",          visible = false },
  { name = "big",    stdin = "200000 12345\n", expect = "9990744366\nMAX 999991076\n",  visible = false },
]

