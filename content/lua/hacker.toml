  { name = "zeroes",   stdin = "3 0\n0 0 0\n",       expect = "6\nRANGE 0\n",  visible = false },
  { name = "none",     stdin = "3 9\n1 1 1\n",       expect = "0\nRANGE 3\n",  visible = false },
  { name = "negative", stdin = "4 -2\n-1 -1 2 -2\n", expect = "3\nRANGE -2\n", visible = false },
]

