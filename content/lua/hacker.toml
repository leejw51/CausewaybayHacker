[[quest]]
id           = "lua.hacker.09.linked-list"
node         = 9
title        = "THE CHAIN"
difficulty   = 4
time_limit_s = 900
story        = "They want it without a sequence. Tables that point at tables, the way the dragon's segments hold on to the one in front, because that is the shape the question is really about."
concepts     = ["linked-lists", "two-pointers", "structs"]
requires     = ["lua.hacker.08.top-k"]
map          = { x = 0.753, y = 0.338, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers, in order.

Build a singly linked list from them — a node is a table with `value` and
`next` — and then answer from the nodes. The reversal, the middle and the
length all come from walking the chain, not from the sequence you read the
input into; collecting the output in a sequence to `table.concat` it at the
end is fine. Print three lines:

1. the list reversed, space separated
2. the value at the middle node (for an even `n`, the second of the two)
3. `LEN <n>` counted by walking the list, not by trusting the input

```
input:  5
        1 2 3 4 5
output: 5 4 3 2 1
        3
        LEN 5
```

The middle is the runner: one pointer one step at a time, one two steps at a
time, and when the fast one runs out the slow one is there. One pass.

A node is `{ value = v, next = head }`, and the end of the chain is `next`
being `nil` — which is not a field set to nothing, it is the field not being
there at all. `while cursor ~= nil do` is the walk. Reverse it with a loop:
the recursive reverse is three pretty lines, and LuaJIT's stack does hold a
few thousand of them, but the version of this question with a hundred
thousand nodes is the one that gets asked, and that one is `stack overflow`.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local values = {}
for i = 2, #data do values[#values + 1] = data[i] end

local head = nil

-- build the list, reverse it, find the middle by walking twice as fast
print("?")
print(0)
print("LEN 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local values = {}
for i = 2, #data do values[#values + 1] = data[i] end

-- build it back to front, so each new node points at what we had
local head = nil
for i = #values, 1, -1 do
  head = { value = values[i], next = head }
end

-- walk it to count, and run a second pointer at half speed for the middle
local length = 0
local slow, fast = head, head
while fast ~= nil do
  length = length + 1
  fast = fast.next
  if fast ~= nil then
    length = length + 1
    fast = fast.next
    slow = slow.next
  end
end
local middle = 0
if slow ~= nil then middle = slow.value end

-- reverse by moving nodes off the front of one list onto the front of another
local reversed_head = nil
local cursor = head
while cursor ~= nil do
  local following = cursor.next
  cursor.next = reversed_head
  reversed_head = cursor
  cursor = following
end

local out = {}
local walk = reversed_head
while walk ~= nil do
  out[#out + 1] = walk.value
  walk = walk.next
end

print(table.concat(out, " "))
print(middle)
print("LEN " .. length)
'''
hints = [
  "Building back to front is the easy direction: each new node takes the old head as its next, and the first node built has next = nil.",
  "Save cursor.next before you overwrite it. Once cursor.next points backwards, the rest of the old list is unreachable.",
  "For the middle, advance slow only on the steps where fast managed two.",
]

