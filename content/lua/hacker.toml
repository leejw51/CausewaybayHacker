[[quest]]
id           = "lua.hacker.19.knapsack"
node         = 19
title        = "WHAT FITS IN THE BAG"
difficulty   = 5
time_limit_s = 1200
story        = "One runner, one bag of incense, and a board of stalls each with a weight and a price. Greedy picks the wrong ones."
concepts     = ["dynamic-programming", "greedy", "slices"]
requires     = ["lua.hacker.18.edit-distance"]
map          = { x = 0.619, y = 0.533, kind = "quest" }
brief        = '''
Line one is `n cap`. The next `n` lines are `<weight> <value>`. Each item can
be taken at most **once**.

Print the best total value that fits in `cap`, then `GREEDY <v>`: what you
would get by repeatedly taking the item with the best value-per-weight that
still fits. On equal value-per-weight, the lighter item goes first.

```
input:  3 10
        6 10
        5 7
        5 7
output: 14
        GREEDY 10
```

The two numbers being different is the whole point of the quest, and the
sample shows it: the best value-per-weight is the `6 10` item at `1.67`, and
taking it leaves four units of room that nothing fits into. Passing on it and
taking both `5 7` items is worth `14`. The hidden cases are small, so what
they check is that you got both numbers right, not that the table is fast.

Compare the ratios exactly. Lua has one number type and it is a double, so
`value / weight` is a float, and two ratios that are equal on paper can come
out a bit apart in binary. There is no `Fraction` here; there is
cross-multiplication: `p.value * q.weight > q.value * p.weight` is the same
comparison with no division in it, and the products are integers a double
holds exactly.
'''
starter      = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, cap = data[1], data[2]
local items = {}
for i = 1, n do items[i] = { weight = data[1 + 2 * i], value = data[2 + 2 * i] } end

local best = {}
for room = 0, cap do best[room] = 0 end

-- one row per item, capacities walked downwards so each item is used once
print(0)
print("GREEDY 0")
'''
solution     = '''
local data = {}
for token in io.read("*a"):gmatch("%S+") do data[#data + 1] = tonumber(token) end
local n, cap = data[1], data[2]
local items = {}
for i = 1, n do items[i] = { weight = data[1 + 2 * i], value = data[2 + 2 * i] } end

local best = {}
for room = 0, cap do best[room] = 0 end
for _, item in ipairs(items) do
  -- downwards, so this item cannot be picked up twice in one pass
  for room = cap, item.weight, -1 do
    local candidate = best[room - item.weight] + item.value
    if candidate > best[room] then best[room] = candidate end
  end
end

-- best ratio first, lighter first on a tie; cross-multiplied, so it is exact
local order = {}
for i, item in ipairs(items) do order[i] = item end
table.sort(order, function(p, q)
  local lhs, rhs = p.value * q.weight, q.value * p.weight
  if lhs ~= rhs then return lhs > rhs end
  return p.weight < q.weight
end)

local room, greedy = cap, 0
for _, item in ipairs(order) do
  if item.weight <= room then
    room = room - item.weight
    greedy = greedy + item.value
  end
end

print(best[cap])
print("GREEDY " .. greedy)
'''
hints = [
  "for room = cap, weight, -1 walks the capacities downwards, which is what makes it 0/1 instead of unbounded. Upwards lets the same item be reused.",
  "p.value * q.weight > q.value * p.weight is the ratio comparison with no division in it; put it in the comparator and the sort is exact.",
  "The greedy pass is a straight loop over the sorted items — no backtracking, which is exactly why it is wrong.",
]

