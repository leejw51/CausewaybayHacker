[[quest]]
id           = "lua.hacker.27.commands"
node         = 27
title        = "THE INPUT IS THE PROBLEM"
difficulty   = 4
time_limit_s = 1200
story        = "The incense stall's till log comes off the machine wrapped at eighty columns, and the count at the top is a count of commands, not of words."
concepts     = ["io", "stacks-queues", "control-flow"]
requires     = ["lua.hacker.26.statistics"]
map          = { x = 0.199, y = 0.742, kind = "quest" }
brief        = '''
Line one is `k`, the number of **commands** that follow. The commands are
whitespace-separated tokens packed across the remaining lines however they
happened to wrap — any number per line, any amount of spacing, possibly a
trailing blank line.

| command | tokens | effect |
| --- | --- | --- |
| `ADD <cents>` | two | push an item |
| `VOID` | one | remove the last item, or do nothing if there is none |
| `TOTAL` | one | print the current sum |
| `CLEAR` | one | remove everything |

After the `k` commands, print `COMMANDS <k>` and `ITEMS <how many are left>`.

```
input:  5
        ADD 600 ADD 2800 TOTAL VOID TOTAL
output: 3400
        600
        COMMANDS 5
        ITEMS 1
```

`k` counts commands, and `ADD` is one command made of two tokens — so a loop
that runs `k` times and reads one token per turn stops in the wrong place.
Read `k` commands, pulling the argument only when the command has one — and
the tool for "pull the next token when I ask for it" is the **iterator**
`gmatch` hands back: `local next_token = input:gmatch("%S+")`, and every
`next_token()` is one more token, or `nil` once the input is spent, so the
end of input is a value and not an error.

`VOID` on an empty till and `TOTAL` before anything was added both have to
work. There is no line in the statement saying they cannot happen, and on a
real screen that silence is the specification. `items[#items] = nil` on an
empty table writes `items[0] = nil`, which does nothing — Lua is forgiving
here where other languages raise — and knowing that it is, and saying so, is
the answer when it is asked.
'''
starter      = '''
local next_token = io.read("*a"):gmatch("%S+")
local commands = tonumber(next_token())

local items = {}

-- one token per command — which is wrong for ADD
for _ = 1, commands do
  local command = next_token() or ""
  if command == "TOTAL" then
    local sum = 0
    for _, v in ipairs(items) do sum = sum + v end
    print(sum)
  end
end

print("COMMANDS " .. commands)
print("ITEMS " .. #items)
'''
solution     = '''
local next_token = io.read("*a"):gmatch("%S+")
local commands = tonumber(next_token())

local items = {}

for _ = 1, commands do
  local command = next_token() or ""
  if command == "ADD" then
    -- the argument is a second token of the same command
    items[#items + 1] = tonumber(next_token()) or 0
  elseif command == "VOID" then
    if #items > 0 then items[#items] = nil end
  elseif command == "TOTAL" then
    local sum = 0
    for _, v in ipairs(items) do sum = sum + v end
    print(sum)
  elseif command == "CLEAR" then
    items = {}
  end
end

print("COMMANDS " .. commands)
print("ITEMS " .. #items)
'''
