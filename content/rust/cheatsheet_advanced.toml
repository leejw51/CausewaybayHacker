map         = { x = 0.10, y = 0.14, kind = "quest" }
brief       = '''
`Greet` already requires `name`. Add `hello` to the trait so that
`impl Greet for Shop` writes **only** `name`, and `Shop.hello()` still
compiles and returns whatever `name` returns.

```
trait Greet {
    fn name(&self) -> String;
    // ____
}
impl Greet for Shop { fn name(&self) -> String { "Sogo".into() } }
```
'''
solution    = "fn hello(&self) -> String { self.name() }"
hints = [
  "A trait method with a body is optional for implementors; one with only a signature is not. There is no keyword for it — the body is the whole signal.",
]

[quest.quiz]
