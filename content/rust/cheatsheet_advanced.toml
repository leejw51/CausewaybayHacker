# RUST LAND — CHEATSHEET ADVANCED. The part of the cheatsheet an interviewer
# uses to tell a fluent candidate from one who only knows the grammar: traits
# and trait objects, bounds, closures and what they capture, lifetimes, the
# smart pointers, threads, channels, the iterator adaptors, custom errors and
# the traps that bite under time pressure (overflow, a `const` that is a copy,
# a float that will not sort). Four lines, one right. Nothing is typed and
# nothing is compiled — the pick is the submission (SPEC §0). The wrong lines
# are near-misses: `Fn` for `FnMut`, `..` for `..=`, `Rc` where `Arc` is
# needed, an `Into` where `?` wants a `From`.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
# Every line was compiled against rustc 1.98 (edition 2024) before it was kept.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack     = "rust.cheatsheet_advanced"
land     = "rust"
category = "cheatsheet_advanced"
version  = 1

