brief       = '''
Standard input is a count `n` and then `n` integers.

Build a two-stage pipeline with two `mpsc` channels and two threads:

1. stage one sends each value squared
2. stage two receives those, keeps a running total, and sends `(square, total)`

`main` prints each pair it receives as `<square> <total>`, then `PIPE <n>`.

```
input:  3
        1 2 3
output: 1 1
        4 5
        9 14
        PIPE 3
```

Each stage's sender is **moved into** its thread, so it is dropped when the
thread ends, so the next stage's `for` loop finishes. Keep a copy anywhere and
the program hangs.
'''
starter     = '''
use std::io::Read;
use std::sync::mpsc;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();
    let count = nums.len();

    let (tx1, rx1) = mpsc::channel::<i64>();
    let (tx2, rx2) = mpsc::channel::<(i64, i64)>();

    // stage one: square each value and send it on tx1
    // stage two: receive from rx1, keep a running total, send (square, total) on tx2
    // main: print each pair from rx2, then PIPE <n>
    let _ = (nums, count, tx1, rx1, tx2, rx2);
}
'''
solution    = '''
use std::io::Read;
use std::sync::mpsc;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();
    let count = nums.len();

    let (tx1, rx1) = mpsc::channel::<i64>();
    let (tx2, rx2) = mpsc::channel::<(i64, i64)>();

    let squarer = thread::spawn(move || {
        for value in nums {
            tx1.send(value * value).unwrap();
        }
    });

    let running = thread::spawn(move || {
        let mut total = 0i64;
        for square in rx1 {
            total += square;
            tx2.send((square, total)).unwrap();
        }
    });

    for (square, total) in rx2 {
        println!("{} {}", square, total);
    }

    squarer.join().unwrap();
    running.join().unwrap();
    println!("PIPE {}", count);
}
'''
hints = [
  "Take the count before you move nums into the first thread.",
  "for square in rx1 inside the second thread is a receive loop that ends when stage one drops tx1.",
  "main's loop over rx2 ends when the second thread ends, which is why joining afterwards does not hang.",
]

