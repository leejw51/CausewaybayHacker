'''
solution    = '''
use std::io::Read;

enum Rider {
    Adult,
    Student,
    Senior,
    Other(String),
}

fn classify(tag: &str) -> Rider {
    match tag {
        "ADULT" => Rider::Adult,
        "STUDENT" => Rider::Student,
        "SENIOR" => Rider::Senior,
        other => Rider::Other(other.to_string()),
    }
}

fn fare(rider: &Rider, km: i64) -> String {
    let base = 500 + 100 * km;
    match rider {
        Rider::Adult => base.to_string(),
        Rider::Student => (base / 2).to_string(),
        Rider::Senior => "200".to_string(),
        Rider::Other(tag) => format!("UNKNOWN {}", tag),
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let tag = parts.next().unwrap();
        let km: i64 = parts.next().unwrap().parse().unwrap();
        println!("{}", fare(&classify(tag), km));
    }
}
'''
hints = [
  "A variant can carry data: Other(String) holds the tag that did not match.",
  "The last arm of a match on &str binds everything left over: `other => ...`.",
  "Matching on &Rider gives you &String in the Other arm — format! is happy with that.",
]

