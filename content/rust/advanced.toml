solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut moved = 0i64;
    for _ in 0..n {
        let line = lines.next().unwrap_or("");
        let parts: Vec<&str> = line.split_whitespace().collect();

        match parts.as_slice() {
            ["GO", arg] if arg.parse::<i64>().unwrap_or(0) > 0 => {
                let steps: i64 = arg.parse().unwrap_or(0);
                moved += steps;
                println!("FORWARD {}", steps);
            }
            ["GO", _] => println!("STAY"),
            ["STOP"] => println!("HALT"),
            [command, ..] => println!("UNKNOWN {}", command),
            [] => println!("UNKNOWN"),
        }
    }
    println!("MOVED {}", moved);
}
'''
hints = [
  "parts.as_slice() is what turns the Vec into something a slice pattern can match against.",
  "An `if` after the pattern is a match guard — it separates two arms that share a shape.",
  "`[command, ..]` binds the first element and ignores the rest; `[]` is the empty line you still have to cover.",
]

