brief       = '''
Read one line: a customer name. Print two lines:

```
input:  MEI
output: RECEIPT: MEI
        THANK YOU, MEI
```

The starter does not compile. `receipt` takes the name **by value**, so after
the call `main` no longer owns it and cannot print it again.

Fix it by letting `receipt` *look at* the name instead of taking it. Do not
clone.
'''
starter     = '''
use std::io::Read;

fn receipt(name: String) {
    println!("RECEIPT: {}", name);
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let name = input.trim().to_string();

    receipt(name);
    println!("THANK YOU, {}", name);
}
'''
solution    = '''
use std::io::Read;

fn receipt(name: &str) {
    println!("RECEIPT: {}", name);
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let name = input.trim().to_string();

    receipt(&name);
    println!("THANK YOU, {}", name);
}
'''
hints = [
  "The error is E0382: borrow of moved value. The move happened at the call, not at the print.",
  "A parameter of type &str borrows; a parameter of type String takes.",
  "Change the signature first, then the call site needs an &.",
]

