  { name = "overdraw",   stdin = "0 0\n1\nA B 5\n",                        expect = "A -5\nB 5\nMOVED 1\n",    visible = false },
  { name = "round-trip", stdin = "50 50\n4\nA B 1\nB A 1\nA B 1\nB A 1\n", expect = "A 50\nB 50\nMOVED 4\n",   visible = false },
