# RUST LAND — ADVANCED. The morning walk turns into the lunch rush. First the
# language's own machinery — ownership, slices, strings, structs, enums,
# collections, errors, iterators, modules, smart pointers, traits — and then
# 12:30, when everything happens at once: threads, move closures, channels,
# Arc<Mutex>, RwLock, lifetimes, generics, a pipeline, and DEADLOCK in the
# Times Square plant room. The grammar drills live on the BASIC road now.
#
# Every quest here has a deterministic answer on purpose: results are joined in
# order, collected and sorted, or piped. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "rust.advanced"
land = "rust"
