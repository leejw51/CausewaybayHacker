[[quest]]
id          = "rust.advanced.17.deadlock"
node        = 17
title       = "DEADLOCK"
difficulty  = 5
story       = "The Times Square plant room, two floors down. Two locks, two threads, and both escalators stopped in the same second."
concepts    = ["deadlock", "shared-state", "concurrency", "smart-pointers"]
requires    = ["rust.advanced.16.closure-kinds", "rust.advanced.04.mutex"]
map          = { x = 0.719, y = 0.950, kind = "boss" }
brief       = '''
Two accounts, `A` and `B`, each an `Arc<Mutex<i64>>`.

Standard input is the starting balances on line one, a count `n` on line two,
and then `n` lines of `<FROM> <TO> <AMOUNT>` with `FROM`/`TO` in `{A, B}`.

Run every transfer on its own thread, join them all, then print
`A <balance>`, `B <balance>`, `MOVED <n>`.

```
input:  100 100
        2
        A B 30
        B A 10
output: A 80
        B 120
        MOVED 2
```

Two things are wrong with the starter and only one of them shows up in the
output. It debits the source and never credits the destination — that is the
visible bug. The other is the shape: locking *the source first* means two
opposite transfers can each hold one lock and wait for the other, forever.

Take both locks, **always in the same global order** — `A` then `B`,
whichever way the money is going — and the cycle cannot form.
'''
starter     = '''
use std::io::Read;
use std::sync::{Arc, Mutex};
use std::thread;

fn transfer(a: &Arc<Mutex<i64>>, b: &Arc<Mutex<i64>>, from_a: bool, amount: i64) {
    // locks whichever side the money leaves, and only that side
    if from_a {
        let mut source = a.lock().unwrap();
        *source -= amount;
    } else {
        let mut source = b.lock().unwrap();
        *source -= amount;
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut first = lines.next().unwrap().split_whitespace();
    let a0: i64 = first.next().unwrap().parse().unwrap();
    let b0: i64 = first.next().unwrap().parse().unwrap();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let a = Arc::new(Mutex::new(a0));
    let b = Arc::new(Mutex::new(b0));

    let mut handles = Vec::new();
    for _ in 0..n {
        let line = lines.next().unwrap().to_string();
        let a = Arc::clone(&a);
        let b = Arc::clone(&b);
        handles.push(thread::spawn(move || {
            let mut parts = line.split_whitespace();
            let from = parts.next().unwrap().to_string();
            let _to = parts.next().unwrap();
            let amount: i64 = parts.next().unwrap().parse().unwrap();
            transfer(&a, &b, from == "A", amount);
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("A {}", *a.lock().unwrap());
    println!("B {}", *b.lock().unwrap());
    println!("MOVED {}", n);
}
'''
solution    = '''
use std::io::Read;
use std::sync::{Arc, Mutex};
use std::thread;

fn transfer(a: &Arc<Mutex<i64>>, b: &Arc<Mutex<i64>>, from_a: bool, amount: i64) {
    // A is always locked before B, whichever direction the money goes.
    // One global order over the locks, so no cycle, so no deadlock.
    let mut guard_a = a.lock().unwrap();
    let mut guard_b = b.lock().unwrap();
    if from_a {
        *guard_a -= amount;
        *guard_b += amount;
    } else {
        *guard_b -= amount;
        *guard_a += amount;
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut first = lines.next().unwrap().split_whitespace();
    let a0: i64 = first.next().unwrap().parse().unwrap();
    let b0: i64 = first.next().unwrap().parse().unwrap();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let a = Arc::new(Mutex::new(a0));
    let b = Arc::new(Mutex::new(b0));

    let mut handles = Vec::new();
    for _ in 0..n {
        let line = lines.next().unwrap().to_string();
        let a = Arc::clone(&a);
        let b = Arc::clone(&b);
        handles.push(thread::spawn(move || {
            let mut parts = line.split_whitespace();
            let from = parts.next().unwrap().to_string();
            let _to = parts.next().unwrap();
            let amount: i64 = parts.next().unwrap().parse().unwrap();
            transfer(&a, &b, from == "A", amount);
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("A {}", *a.lock().unwrap());
    println!("B {}", *b.lock().unwrap());
    println!("MOVED {}", n);
}
'''
hints = [
  "Lock both accounts before you touch either balance, and always in the same order.",
  "The direction of the money decides which guard gets the minus, not which lock is taken first.",
  "The two guards drop at the end of transfer, in reverse order, which is fine — it is the acquire order that matters.",
]

