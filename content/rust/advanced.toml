    cents: i64,
    next: Option<Box<Entry>>,
}
```

Print three lines:

1. the amounts in order, space separated, or `-` if there are none
2. `SUM <total>`, from a **recursive** function over the chain
3. `LAST <cents>` — the amount on the final node — or `LAST NONE`

```
