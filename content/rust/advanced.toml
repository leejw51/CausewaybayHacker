id          = "rust.advanced.13.interior-mutability"
node        = 13
title       = "MUTATING THROUGH A SHARED REFERENCE"
difficulty  = 4
story       = "The counter on the door has to go up while four different bits of code are only looking at it."
concepts    = ["interior-mutability", "smart-pointers", "mutability"]
requires    = ["rust.advanced.12.dispatch"]
map          = { x = 0.045, y = 0.931, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Print four lines:

1. `CELL <k>` — a `Cell<usize>` bumped once per value, read back with `.get()`,
   all through a plain `&` reference
2. `REF <sum>` — a ledger filled with the values and summed
3. `RC <k>` — the ledger is an `Rc<RefCell<Vec<i64>>>` and you hold **two**
   handles to it; print `Rc::strong_count` while both are alive
4. `DOUBLE panic` — take two `borrow_mut()` on the same `RefCell` at the same
   time, deliberately, and catch the panic with `std::panic::catch_unwind`

```
input:  3
        1 2 3
output: CELL 3
        REF 6
        RC 2
        DOUBLE panic
```

`&T` normally means nobody can change it. `Cell` and `RefCell` are the
sanctioned exception, and they pay for it in different currency: `Cell` only
moves whole values in and out, so it needs no checking at all; `RefCell` hands
out real references and therefore has to enforce the borrow rules — at run
time, with a panic, instead of at compile time with an error.

`Rc<RefCell<T>>` is the pair everyone eventually reaches for, and it is worth
being able to say what each half does. `Rc` gives the value more than one
owner — a non-atomic refcount, so it is not `Send` and does not cross a thread
(that was the `send-sync` map). `RefCell` gives those owners the right to
mutate. Neither is a `Mutex`. Shared **and** mutable is exactly what the
borrow checker refuses at compile time, so this pattern buys it back at run
time and charges you a panic when you get it wrong.

That panic is not a bug in the quest. It is the price, and seeing it once is
the point.
'''
starter     = '''
use std::cell::{Cell, RefCell};
use std::io::Read;
use std::panic::{catch_unwind, AssertUnwindSafe};
use std::rc::Rc;

fn bump(counter: &Cell<usize>) {
    let _ = counter;
    // increment through a shared reference
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let counter = Cell::new(0usize);
    let ledger: Rc<RefCell<Vec<i64>>> = Rc::new(RefCell::new(Vec::new()));

    // take a second handle to the ledger, fill it, then report on both
    let _ = (&counter, &ledger, &nums, bump);
    let _ = catch_unwind(AssertUnwindSafe(|| {}));
    println!("CELL 0");
    println!("REF 0");
    println!("RC 0");
    println!("DOUBLE ok");
}
'''
solution    = '''
use std::cell::{Cell, RefCell};
use std::io::Read;
use std::panic::{catch_unwind, AssertUnwindSafe};
use std::rc::Rc;

fn bump(counter: &Cell<usize>) {
    counter.set(counter.get() + 1);
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let counter = Cell::new(0usize);
    let ledger: Rc<RefCell<Vec<i64>>> = Rc::new(RefCell::new(Vec::new()));
    // a second owner of the same ledger; the clone is the handle, not the data
    let mirror = Rc::clone(&ledger);

    for &value in &nums {
        bump(&counter);
        ledger.borrow_mut().push(value);
    }

    println!("CELL {}", counter.get());
    // read through the other handle: same Vec, same contents
    println!("REF {}", mirror.borrow().iter().sum::<i64>());
    println!("RC {}", Rc::strong_count(&ledger));

    let outcome = catch_unwind(AssertUnwindSafe(|| {
        let _first = ledger.borrow_mut();
        let _second = mirror.borrow_mut();
    }));
    println!("DOUBLE {}", if outcome.is_err() { "panic" } else { "ok" });
}
'''
hints = [
  "Cell has no borrow(): you get() a copy out and set() a whole value in. That is why it needs no runtime bookkeeping.",
  "ledger.borrow_mut().push(v) as one statement lets the guard drop at the semicolon, which is what keeps the loop legal.",
  "catch_unwind needs AssertUnwindSafe around the closure because it captures a &RefCell; the panic message still goes to stderr, which the tests do not read.",
  "Rc::clone(&ledger) is spelled that way rather than .clone() so a reader can see it copies a handle and not the Vec. Rc::strong_count reads 2 while both handles are alive, and the two borrow_mut() in the panic test can come one from each handle — they are the same RefCell, and it counts them together.",
]

