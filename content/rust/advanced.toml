brief       = '''
Standard input is a count `n` and then `n` integers.

Spawn one thread per value. Each sends `(index, value * 10)` down a single
`mpsc` channel. The main thread receives all of them, sorts by index, prints
`<index> <value>` one per line, then `RECV <n>`.

```
input:  3
        1 2 3
output: 0 10
        1 20
        2 30
        RECV 3
```

Receiving by iterating `rx` ends when **every** sender has been dropped — and
the one `main` is still holding counts. Drop it, or the program never finishes.
'''
starter     = '''
use std::io::Read;
use std::sync::mpsc;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let (tx, rx) = mpsc::channel::<(usize, i64)>();

    // spawn a thread per value that sends (index, value * 10),
    // drop the sender main is holding, then collect, sort and print
    let _ = (nums, tx, rx);
}
'''
solution    = '''
use std::io::Read;
use std::sync::mpsc;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let (tx, rx) = mpsc::channel::<(usize, i64)>();
    for (index, value) in nums.into_iter().enumerate() {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send((index, value * 10)).unwrap();
        });
    }
    drop(tx);

    let mut received: Vec<(usize, i64)> = rx.iter().collect();
    received.sort();

    for (index, value) in &received {
        println!("{} {}", index, value);
    }
    println!("RECV {}", received.len());
}
'''
hints = [
  "Each thread needs its own Sender: tx.clone() before the move closure.",
  "drop(tx) after the loop. Without it the receiver waits forever for a sender that is sitting in main.",
  "rx.iter() yields until the channel is closed, so collect() is the whole receive loop.",
]

