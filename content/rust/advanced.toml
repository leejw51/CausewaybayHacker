solution    = '''
use std::fmt;
use std::io::Read;
use std::num::ParseIntError;

#[derive(Debug)]
enum FareError {
    NotANumber,
    Negative(i64),
}

impl fmt::Display for FareError {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        match self {
            FareError::NotANumber => write!(f, "not a number"),
            FareError::Negative(km) => write!(f, "negative distance: {}", km),
        }
    }
}

impl std::error::Error for FareError {}

impl From<ParseIntError> for FareError {
    fn from(_: ParseIntError) -> FareError {
        FareError::NotANumber
    }
}

fn fare(text: &str) -> Result<i64, FareError> {
    let km: i64 = text.trim().parse()?;
    if km < 0 {
        return Err(FareError::Negative(km));
    }
    Ok(500 + 100 * km)
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut errors = 0usize;
    for _ in 0..n {
        match fare(lines.next().unwrap_or("")) {
            Ok(value) => println!("{}", value),
            Err(err) => {
                errors += 1;
                println!("{}", err);
            }
        }
    }
    println!("ERRORS {}", errors);
}
'''
hints = [
  "The error is E0277 on the `?`: the trait From<ParseIntError> is not implemented for FareError.",
  "Six lines: impl From<ParseIntError> for FareError with fn from returning FareError::NotANumber.",
  "Display is what {} prints; Debug is what {:?} prints; the Error trait is what lets it go into a Box<dyn Error>. All three are worth having and only one is needed here.",
]

