node        = 8
title       = "THE LINE THAT IS NOT A NUMBER"
difficulty  = 3
story       = "The Victoria Park meter reader hands in a column of numbers with somebody's lunch order in the middle of it."
concepts    = ["error-handling", "pattern-matching", "types"]
requires    = ["rust.advanced.07.maps"]
map          = { x = 0.953, y = 0.263, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, where the total is the sum of the values
you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Write a `fn double(text: &str) -> Result<i64, ParseIntError>` that uses `?`,
and handle the two outcomes with a `match` in `main`.
'''
starter     = '''
use std::io::Read;
use std::num::ParseIntError;

fn double(text: &str) -> Result<i64, ParseIntError> {
    let _ = text;
    todo!()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let sum = 0i64;
    for _ in 0..n {
        let line = lines.next().unwrap_or("");
        let _ = (line, &double);
        // print the doubled value or BAD <line>, and keep a running total
    }
    println!("SUM {}", sum);
}
'''
solution    = '''
use std::io::Read;
use std::num::ParseIntError;

fn double(text: &str) -> Result<i64, ParseIntError> {
    let n: i64 = text.trim().parse()?;
    Ok(n * 2)
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut sum = 0i64;
    for _ in 0..n {
        let line = lines.next().unwrap_or("");
        match double(line) {
            Ok(value) => {
                println!("{}", value);
                sum += value;
            }
            Err(_) => println!("BAD {}", line.trim()),
        }
    }
    println!("SUM {}", sum);
}
'''
hints = [
  "`?` on a Result returns the error out of the function for you, so double's body is two lines.",
  "match double(line) has exactly two arms, Ok(value) and Err(_).",
  "SUM is the sum of what you printed — the doubled values, not the originals.",
]

