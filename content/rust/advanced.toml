[[quest]]
id          = "rust.advanced.01.threads"
node        = 1
title       = "TWO TILLS, ONE COUNTER"
difficulty  = 3
story       = "The Times Square branch opens its second till at noon and the queue finally moves. Nothing else about the shop changed."
concepts    = ["concurrency", "closures", "ownership"]
requires    = []
map         = { x = 0.12, y = 0.18, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Spawn one thread per value that computes its square. Join them **in the order
you spawned them** and print each result on its own line, then `THREADS <n>`.

```
input:  3
        2 3 4
output: 4
        9
        16
        THREADS 3
```

Joining in order is what makes the output the same every run. A thread that
prints for itself would not be.
'''
starter     = '''
use std::io::Read;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let handles: Vec<thread::JoinHandle<i64>> = Vec::new();

    // spawn one thread per value, then join them in order and print
    let _ = (nums, handles);
}
'''
solution    = '''
use std::io::Read;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let mut handles: Vec<thread::JoinHandle<i64>> = Vec::new();
    for value in nums {
        handles.push(thread::spawn(move || value * value));
    }

    let count = handles.len();
    for handle in handles {
        println!("{}", handle.join().unwrap());
    }
    println!("THREADS {}", count);
}
'''
hints = [
  "thread::spawn returns a JoinHandle<T> where T is whatever the closure returns.",
  "join() gives you Result<T, _> — the Err is the panic, and unwrap is honest here.",
  "Take the count before the loop; the Vec is consumed by iterating it by value.",
]

