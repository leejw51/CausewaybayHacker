[[quest]]
id          = "rust.advanced.15.atomics"
node        = 15
title       = "ONE WORD, NO LOCK"
difficulty  = 4
story       = "The turnstile count does not need a lock. Everything else in the plant room does, and telling them apart is the job."
concepts    = ["shared-state", "thread-safety", "ownership"]
requires    = ["rust.advanced.14.custom-error"]
map          = { x = 0.391, y = 0.950, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Spawn one thread per value. Each adds its value to a shared `AtomicI64` and
bumps a shared `AtomicUsize` by one — no `Mutex` anywhere. Join them all and
print `TOTAL <sum>` and `HITS <n>`.

Then: declare two `Guard` values at the **top** of `main`, named `first` and
`second`, whose `Drop` prints `DROP <name>`. They run at the end of `main`,
after everything else, in reverse declaration order.

```
input:  4
        1 2 3 4
output: TOTAL 10
        HITS 4
        DROP second
        DROP first
```

An atomic is not a cheaper mutex; it is a different tool, for one machine word
read-modify-written in a single instruction. The moment you need two fields to
agree with each other, the lock comes back — there is no atomic for "these two
things, together".

`Ordering::Relaxed` is enough here because nothing depends on *when* these
increments become visible relative to any other write, only that none are
lost. That sentence is the follow-up question, and it is the whole of what
`Relaxed` means.
'''
starter     = '''
use std::io::Read;
use std::sync::atomic::{AtomicI64, AtomicUsize, Ordering};
use std::sync::Arc;
use std::thread;

struct Guard {
    name: &'static str,
}

// Guard needs a Drop that prints DROP <name>

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let _first = Guard { name: "first" };
    let _second = Guard { name: "second" };

    let total = Arc::new(AtomicI64::new(0));
    let hits = Arc::new(AtomicUsize::new(0));

    // one thread per value; add to total, bump hits, join them all
    let _ = (&total, &hits, nums, Ordering::Relaxed, thread::yield_now);

    println!("TOTAL {}", total.load(Ordering::Relaxed));
    println!("HITS {}", hits.load(Ordering::Relaxed));
}
'''
solution    = '''
use std::io::Read;
use std::sync::atomic::{AtomicI64, AtomicUsize, Ordering};
use std::sync::Arc;
use std::thread;

struct Guard {
    name: &'static str,
}

impl Drop for Guard {
    fn drop(&mut self) {
        println!("DROP {}", self.name);
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let _first = Guard { name: "first" };
    let _second = Guard { name: "second" };

    let total = Arc::new(AtomicI64::new(0));
    let hits = Arc::new(AtomicUsize::new(0));

    let mut handles = Vec::new();
    for value in nums {
        let total = Arc::clone(&total);
        let hits = Arc::clone(&hits);
        handles.push(thread::spawn(move || {
            total.fetch_add(value, Ordering::Relaxed);
            hits.fetch_add(1, Ordering::Relaxed);
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("TOTAL {}", total.load(Ordering::Relaxed));
    println!("HITS {}", hits.load(Ordering::Relaxed));
}
'''
hints = [
  "fetch_add returns the previous value and applies the addition atomically; there is no lock and no guard.",
  "The Arc is still needed — the atomic makes the *access* safe, not the *sharing*.",
  "Drop runs in reverse declaration order, so `second` goes first. Binding them as _first and _second keeps them alive to the end of main; a bare `_` would drop them immediately.",
]

