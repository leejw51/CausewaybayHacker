solution    = '''
use std::io::Read;
use std::sync::mpsc;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let (tx, rx) = mpsc::channel::<(usize, i64)>();
    for (index, value) in nums.into_iter().enumerate() {
        let tx = tx.clone();
        thread::spawn(move || {
            tx.send((index, value * 10)).unwrap();
        });
    }
    drop(tx);

    let mut received: Vec<(usize, i64)> = rx.iter().collect();
    received.sort();

    for (index, value) in &received {
        println!("{} {}", index, value);
    }
    println!("RECV {}", received.len());
}
'''
