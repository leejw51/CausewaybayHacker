solution    = '''
use std::io::Read;

trait Sign {
    /// Required: no body here, so every implementor has to supply one.
    fn render(&self) -> String;

    /// Provided: an implementor gets this unless it says otherwise.
    fn tag(&self) -> &'static str {
        "SIGN"
    }
}

struct Shop {
    name: String,
    floor: i64,
}

struct Stop {
    route: i64,
}

impl Sign for Shop {
    fn render(&self) -> String {
        format!("{} / F{}", self.name, self.floor)
    }
    // tag is not written here, so Shop uses the default
}

impl Sign for Stop {
    fn render(&self) -> String {
        self.route.to_string()
    }

    fn tag(&self) -> &'static str {
        "TRAM"
    }
}

/// One function, two types. The bound is everything it knows about T.
fn show<T: Sign>(sign: &T) {
    println!("{} {}", sign.tag(), sign.render());
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "SHOP" => {
                let name = parts.next().unwrap().to_string();
                let floor: i64 = parts.next().unwrap().parse().unwrap();
                show(&Shop { name, floor });
            }
            _ => {
                let route: i64 = parts.next().unwrap().parse().unwrap();
                show(&Stop { route });
            }
        }
    }

    println!("SIGNS {}", n);
}
'''
hints = [
  "impl Sign for Shop goes outside the struct. The trait says what; the impl says how; and the compiler will not infer the second from the first.",
  "Leave tag out of Shop's impl entirely and it takes the trait's version. Write it in Stop's impl and Stop's wins. That is the whole of what a default method is.",
  "show<T: Sign>(sign: &T) is generic, so the type has to be known where it is called — which is inside the match arm, while you can still see what you just built.",
  "A single Vec holding both would need Box<dyn Sign>, and that is a different mechanism with a run-time lookup. You are not being asked for it, and reaching for it here would be the wrong answer to a question about traits.",
]

