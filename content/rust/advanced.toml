solution    = '''
use std::io::Read;

trait Sign {
    fn render(&self) -> String;
}

struct Shop {
    name: String,
    floor: i64,
}

struct Stop {
    route: String,
}

impl Sign for Shop {
    fn render(&self) -> String {
        format!("{} / F{}", self.name, self.floor)
    }
}

impl Sign for Stop {
    fn render(&self) -> String {
        format!("TRAM {}", self.route)
    }
}

fn render_static<T: Sign>(sign: &T) {
    println!("{}", sign.render());
}

fn render_dynamic(sign: &dyn Sign) {
    println!("{}", sign.render());
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut signs: Vec<Box<dyn Sign>> = Vec::new();
    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "SHOP" => {
                let name = parts.next().unwrap().to_string();
                let floor: i64 = parts.next().unwrap().parse().unwrap();
                let shop = Shop { name, floor };
                // the concrete type is known here, and only here
                render_static(&shop);
                signs.push(Box::new(shop));
            }
            _ => {
                let route = parts.next().unwrap().to_string();
                let stop = Stop { route };
                render_static(&stop);
                signs.push(Box::new(stop));
            }
        }
    }

    for sign in &signs {
        render_dynamic(sign.as_ref());
    }
    println!("DYNAMIC {}", signs.len());
}
'''
