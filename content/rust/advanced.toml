brief       = '''
Standard input is two lines: integers on the first, words on the second.

Write **one** `largest` that works on both, and a generic `Pair<T>` with
`larger()` and `smaller()`.

Print the largest integer, the largest word, then
`PAIR <larger> <smaller>` for a `Pair` of the first two integers. A tie counts
as `a` being the larger.

```
input:  4 8 15 16
        tram bus mtr
output: 16
        tram
        PAIR 8 4
```

The starter does not compile: `largest` is nailed to `i64`, so passing it the
words is E0308.
'''
starter     = '''
use std::io::Read;

fn largest(xs: &[i64]) -> i64 {
    let mut best = xs[0];
    for &x in xs {
        if x > best {
            best = x;
        }
    }
    best
}

struct Pair<T> {
    a: T,
    b: T,
}

impl<T> Pair<T> {
    fn larger(&self) -> &T {
        &self.a
    }

    fn smaller(&self) -> &T {
        &self.b
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let nums: Vec<i64> = lines
        .next()
        .unwrap()
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let words: Vec<&str> = lines.next().unwrap().split_whitespace().collect();

    println!("{}", largest(&nums));
    println!("{}", largest(&words));

    let pair = Pair { a: nums[0], b: nums[1] };
    println!("PAIR {} {}", pair.larger(), pair.smaller());
