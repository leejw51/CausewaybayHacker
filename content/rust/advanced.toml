solution    = '''
use std::collections::HashSet;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();

    let even_sum: i64 = nums.iter().filter(|&&n| n % 2 == 0).sum();
    println!("{}", even_sum);

    let big: Vec<String> = nums
        .iter()
        .filter(|&&n| n > 10)
        .map(|n| (n * 2).to_string())
        .collect();
    if big.is_empty() {
        println!("-");
    } else {
        println!("{}", big.join(" "));
    }

    let distinct: HashSet<&i64> = nums.iter().collect();
    println!("{}", distinct.len());
}
'''
