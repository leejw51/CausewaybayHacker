use std::io::Read;
use std::sync::{Arc, RwLock};
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let words: Vec<String> = input
        .split_whitespace()
        .skip(1)
        .map(|w| w.to_string())
        .collect();

    let counts: Arc<RwLock<HashMap<String, i64>>> = Arc::new(RwLock::new(HashMap::new()));
    let mut handles = Vec::new();
    for word in words {
        let counts = Arc::clone(&counts);
        handles.push(thread::spawn(move || {
            let guard = counts.read().unwrap();
            *guard.entry(word).or_insert(0) += 1;
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    // read the map once, print it sorted, then TOTAL
}
'''
solution    = '''
use std::collections::HashMap;
use std::io::Read;
use std::sync::{Arc, RwLock};
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let words: Vec<String> = input
        .split_whitespace()
        .skip(1)
        .map(|w| w.to_string())
        .collect();

    let counts: Arc<RwLock<HashMap<String, i64>>> = Arc::new(RwLock::new(HashMap::new()));
    let mut handles = Vec::new();
    for word in words {
        let counts = Arc::clone(&counts);
        handles.push(thread::spawn(move || {
            let mut guard = counts.write().unwrap();
            *guard.entry(word).or_insert(0) += 1;
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    let guard = counts.read().unwrap();
    let mut rows: Vec<(&String, &i64)> = guard.iter().collect();
    rows.sort();

    for (word, count) in &rows {
        println!("{} {}", word, count);
    }
    let total: i64 = rows.iter().map(|(_, count)| **count).sum();
    println!("TOTAL {}", total);
}
'''
hints = [
  "write() returns a guard that derefs to &mut; read() returns one that only derefs to &.",
  "Sorting Vec<(&String, &i64)> sorts by the word first, which is what the output wants.",
  "Hold the read guard in a binding while you iterate it, or the temporary is dropped before you are done with it.",
]

