solution    = '''
use std::future::Future;
use std::io::Read;
use std::pin::Pin;
use std::sync::Arc;
use std::task::{Context, Poll, Wake, Waker};

struct Nudge;

impl Wake for Nudge {
    fn wake(self: Arc<Self>) {}
}

/// Returns Pending the first time and Ready after that.
struct YieldOnce {
    done: bool,
}

impl Future for YieldOnce {
    type Output = ();

    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
        let this = self.get_mut();
        if this.done {
            return Poll::Ready(());
        }
        this.done = true;
        cx.waker().wake_by_ref();
        Poll::Pending
    }
}

async fn double(value: i64) -> i64 {
    YieldOnce { done: false }.await;
    value * 2
}

fn block_on<F: Future>(future: F) -> (F::Output, usize) {
    let waker = Waker::from(Arc::new(Nudge));
    let mut cx = Context::from_waker(&waker);
    let mut future = Box::pin(future);

    let mut polls = 0usize;
    loop {
        polls += 1;
        match future.as_mut().poll(&mut cx) {
            Poll::Ready(value) => return (value, polls),
            Poll::Pending => continue,
        }
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let (sum, polls) = block_on(async move {
        let mut sum = 0i64;
        for value in nums {
            let doubled = double(value).await;
            println!("{}", doubled);
            sum += doubled;
        }
        sum
    });

    println!("SUM {}", sum);
    println!("POLLS {}", polls);
}
'''
hints = [
  "Box::pin gives you a Pin<Box<F>> without any unsafe, and .as_mut() turns it into the Pin<&mut F> that poll wants.",
  "Context::from_waker(&waker) is the whole ceremony — the Waker is what a real runtime would use to reschedule you.",
  "This executor busy-loops on Pending. A real one would park the thread until the waker fired, and that is the only interesting difference.",
]

