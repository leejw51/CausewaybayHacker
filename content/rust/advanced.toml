  "parse::<i64>() needs the turbofish here, because nothing downstream pins the type for the compiler.",
  ".ok() throws the error away on purpose — you are not reporting why it failed, only that it did.",
  "find_map runs the closure until one returns Some, so it stops at the first line that parses.",
]

