# ---------------------------------------------------------------- 01
[[quest]]
id          = "rust.advanced.01.shadowing"
node        = 1
title       = "THREE NAMES, ONE NAME"
difficulty  = 2
story       = "The Sogo crossing kiosk holds the price as text, as a number and as money, and it calls all three of them price."
concepts    = ["bindings", "types", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Read one line: an amount in cents, as digits.

Print three lines:

1. how many characters the trimmed text has
2. the amount as a number
3. the amount as dollars with exactly two decimals

```
input:  1234
output: 4
        1234
        12.34
```

The amount is non-negative and fits in an `i64`. Do it with one name,
shadowed twice — `&str`, then `i64`, then `String`.
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let cents = input.trim();

    // 1. the character count of `cents`
    // 2. shadow `cents` with its i64 value, and print it
    // 3. shadow `cents` again with the formatted dollars, and print it
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();

    let cents = input.trim();
    println!("{}", cents.chars().count());

    let cents: i64 = cents.parse().unwrap();
    println!("{}", cents);

    let cents = format!("{}.{:02}", cents / 100, cents % 100);
    println!("{}", cents);
}
'''
hints = [
  "A second `let cents = ...` does not assign; it makes a new binding that hides the old one, and it may have a different type.",
  "That is why shadowing is not `mut`: `mut` keeps the type, shadowing does not.",
  "Two decimals with a leading zero is the {:02} width flag.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "dollars",  stdin = "1234\n", expect = "4\n1234\n12.34\n", visible = true },
  { name = "five-cents", stdin = "5\n",  expect = "1\n5\n0.05\n",     visible = false },
  { name = "round",    stdin = "100\n",  expect = "3\n100\n1.00\n",   visible = false },
]

