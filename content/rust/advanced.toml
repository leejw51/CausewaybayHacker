solution    = '''
use std::io::Read;

struct Stops {
    current: i64,
    step: i64,
    left: usize,
}

impl Iterator for Stops {
    type Item = i64;

    fn next(&mut self) -> Option<i64> {
        if self.left == 0 {
            return None;
        }
        let value = self.current;
        self.current += self.step;
        self.left -= 1;
        Some(value)
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let parts: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (start, step, count) = (parts[0], parts[1], parts[2] as usize);

    for value in (Stops { current: start, step, left: count }) {
        println!("{}", value);
    }
    let sum: i64 = (Stops { current: start, step, left: count }).sum();
    println!("SUM {}", sum);
}
'''
hints = [
  "next returns None when there is nothing left, and that None is what ends the for loop.",
  "Save the value you are about to return before you advance, or you are off by one step.",
  "left is the countdown; decrement it every time you hand a value out.",
]

