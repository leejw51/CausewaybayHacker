solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();
    let rows: Vec<&str> = (0..n).map(|_| lines.next().unwrap_or("")).collect();

    for row in &rows {
        let doubled = row.trim().parse::<i64>().ok().map(|v| v * 2).unwrap_or(-1);
        println!("{}", doubled);
    }

    let parsed = rows
        .iter()
        .filter(|row| row.trim().parse::<i64>().is_ok())
        .count();
    println!("SOME {}", parsed);

    let first = rows.iter().find_map(|row| row.trim().parse::<i64>().ok());
    match first {
        Some(value) => println!("FIRST {}", value),
        None => println!("FIRST NONE"),
    }
}
'''
