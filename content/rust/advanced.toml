```

`n` may be `0`, and then the only line is `TOTAL 0`.
'''
starter     = '''
use std::io::Read;

struct Till {
    // what does a till have to remember?
}

impl Till {
    fn new() -> Till {
        todo!()
    }

    fn add(&mut self, name: &str, cents: i64) {
        let _ = (name, cents);
        todo!()
    }

    fn total(&self) -> i64 {
