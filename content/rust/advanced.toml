id          = "rust.advanced.07.maps"
node        = 7
title       = "WHAT THE BAZAAR SHOUTS"
difficulty  = 3
story       = "Jardine's Bazaar at nine: every stall calling something, and the sign board wants the ranking."
concepts    = ["collections", "imports", "iteration", "sorting"]
