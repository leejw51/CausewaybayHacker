map          = { x = 0.222, y = 0.514, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Sum them across two threads through one shared total, then print:

```
input:  4
        1 2 3 4
output: TOTAL 10
        SEND ARC OK
        SYNC MUTEX OK
```

The last two lines are printed only if `assert_send` and `assert_sync` accept
the handle — and those two functions do nothing at runtime. They are
`fn assert_send<T: Send>(_: &T) {}`: the check is the bound, and it happens at
compile time or not at all.

The starter does not compile, and the error is the lesson. `Rc` is not `Send`
because its refcount is a plain non-atomic integer — two threads cloning one
`Rc` would race on it, so the compiler refuses to let an `Rc` cross a thread
boundary at all. `Arc` is the same thing with an atomic count, and is `Send`.

`Sync` is the other half: `T` is `Sync` when `&T` is `Send`. `Mutex<T>` is
`Sync` for any `T: Send`, because the lock is what makes shared access safe.
'''
starter     = '''
use std::io::Read;
use std::rc::Rc;
use std::sync::Mutex;
use std::thread;

fn assert_send<T: Send>(_: &T) {}
fn assert_sync<T: Sync>(_: &T) {}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let total = Rc::new(Mutex::new(0i64));
    let mid = nums.len() / 2;
    let (left, right) = (nums[..mid].to_vec(), nums[mid..].to_vec());

    let mut handles = Vec::new();
    for half in [left, right] {
        let total = Rc::clone(&total);
        handles.push(thread::spawn(move || {
            let mut guard = total.lock().unwrap();
            for value in half {
                *guard += value;
            }
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("TOTAL {}", *total.lock().unwrap());
    assert_send(&total);
    println!("SEND ARC OK");
    assert_sync(&*total);
    println!("SYNC MUTEX OK");
}
'''
solution    = '''
use std::io::Read;
use std::sync::{Arc, Mutex};
use std::thread;

fn assert_send<T: Send>(_: &T) {}
fn assert_sync<T: Sync>(_: &T) {}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let total = Arc::new(Mutex::new(0i64));
    let mid = nums.len() / 2;
    let (left, right) = (nums[..mid].to_vec(), nums[mid..].to_vec());

    let mut handles = Vec::new();
    for half in [left, right] {
        let total = Arc::clone(&total);
        handles.push(thread::spawn(move || {
            let mut guard = total.lock().unwrap();
            for value in half {
                *guard += value;
            }
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("TOTAL {}", *total.lock().unwrap());
    assert_send(&total);
    println!("SEND ARC OK");
    assert_sync(&*total);
    println!("SYNC MUTEX OK");
}
'''
hints = [
  "The error is E0277: `Rc<Mutex<i64>>` cannot be sent between threads safely. One type name changes, and one import with it.",
  "Rc's refcount is a plain usize; Arc's is an AtomicUsize. That single difference is the whole of why one is Send and the other is not.",
  "assert_sync(&*total) asks about the Mutex itself rather than the Arc around it — Mutex<T> is Sync whenever T is Send.",
]

