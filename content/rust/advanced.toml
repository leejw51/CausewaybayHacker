[[quest]]
id          = "rust.advanced.06.lifetimes"
node        = 6
title       = "HOW LONG IS THAT GOOD FOR"
difficulty  = 4
story       = "The departures board keeps a view of the timetable rather than a copy of it, and nobody wrote down when the timetable gets thrown away."
concepts    = ["lifetimes", "borrowing", "structs", "strings"]
requires    = ["rust.advanced.05.rwlock"]
map         = { x = 0.74, y = 0.32, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines.

Build a `Board` that holds **borrowed** `&str` slices of the input — no
`String`, no copy — and give it `longest()` (first line wins a tie) and
`bytes()`.

Print the longest line, then how many lines there are, then their total byte
length.

```
input:  3
        tram
        percival street
        mtr
output: percival street
        3
        22
```

The starter does not compile: a struct that holds a reference must say how
long that reference is good for. That is E0106, and the fix is a lifetime
parameter on the struct, on the `impl`, and on what `longest` returns.
'''
starter     = '''
use std::io::Read;

struct Board {
    lines: Vec<&str>,
}

impl Board {
    fn new(text: &str, n: usize) -> Board {
        Board {
            lines: text.lines().skip(1).take(n).collect(),
        }
    }

    fn longest(&self) -> &str {
        let mut best = self.lines[0];
        for line in &self.lines {
            if line.len() > best.len() {
                best = *line;
            }
        }
        best
    }

    fn bytes(&self) -> usize {
        self.lines.iter().map(|line| line.len()).sum()
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let n: usize = input.lines().next().unwrap().trim().parse().unwrap();

    let board = Board::new(&input, n);
    println!("{}", board.longest());
    println!("{}", board.lines.len());
    println!("{}", board.bytes());
}
'''
solution    = '''
use std::io::Read;

struct Board<'a> {
    lines: Vec<&'a str>,
}

impl<'a> Board<'a> {
    fn new(text: &'a str, n: usize) -> Board<'a> {
        Board {
            lines: text.lines().skip(1).take(n).collect(),
        }
    }

    fn longest(&self) -> &'a str {
        let mut best = self.lines[0];
        for line in &self.lines {
            if line.len() > best.len() {
                best = *line;
            }
        }
        best
    }

    fn bytes(&self) -> usize {
        self.lines.iter().map(|line| line.len()).sum()
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let n: usize = input.lines().next().unwrap().trim().parse().unwrap();

    let board = Board::new(&input, n);
    println!("{}", board.longest());
    println!("{}", board.lines.len());
    println!("{}", board.bytes());
}
'''
hints = [
  "struct Board<'a> { lines: Vec<&'a str> } — the struct is now generic over a lifetime.",
  "impl<'a> Board<'a> — declare it before you use it, the same as a type parameter.",
  "longest returns &'a str, not &str: the answer outlives the borrow of self, it belongs to the input.",
]

