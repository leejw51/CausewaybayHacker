map          = { x = 0.602, y = 0.065, kind = "quest" }
brief       = '''
Standard input is a count `n` and then `n` integers.

Spawn one thread per value that adds it to **one shared total**. Join them all,
then print `TOTAL <sum>` and `THREADS <n>`.

```
input:  4
        1 2 3 4
output: TOTAL 10
        THREADS 4
```

The starter compiles and is wrong: `i64` is `Copy`, so each `move` closure got
its own private total and threw it away. Share one, and lock it.
'''
starter     = '''
use std::io::Read;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();
    let count = nums.len();

    let mut total = 0i64;
    let mut handles = Vec::new();
    for value in nums {
        handles.push(thread::spawn(move || {
            total += value;
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("TOTAL {}", total);
    println!("THREADS {}", count);
}
'''
solution    = '''
use std::io::Read;
use std::sync::{Arc, Mutex};
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();
    let count = nums.len();

    let total = Arc::new(Mutex::new(0i64));
    let mut handles = Vec::new();
    for value in nums {
        let total = Arc::clone(&total);
        handles.push(thread::spawn(move || {
            let mut guard = total.lock().unwrap();
            *guard += value;
        }));
    }
    for handle in handles {
        handle.join().unwrap();
    }

    println!("TOTAL {}", *total.lock().unwrap());
    println!("THREADS {}", count);
}
'''
hints = [
  "Arc is the shared ownership; Mutex is the exclusive access. You need both, in that order: Arc<Mutex<i64>>.",
  "Arc::clone(&total) inside the loop, before the move closure — the clone is what each thread takes.",
  "The guard from lock() derefs to the value; *guard += value, and the guard unlocks when it goes out of scope.",
]

