map          = { x = 0.255, y = 0.468, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines, each either

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` — `ROUTE` is a number

Print one line per sign as `<tag> <rendering>`, then `SIGNS <n>`:

* a `Shop` renders as `<NAME> / F<FLOOR>` and its tag is `SIGN`
* a `Stop` renders as its route number and its tag is `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

Declare one trait and implement it for two different structs:

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` is a **default method**. `Shop` says nothing about it and gets `SIGN`;
`Stop` writes its own and gets `TRAM`. That is the half of traits people forget
in an interview: a trait is not only a list of signatures, it can carry
behaviour, and overriding is opt-in.

Print through **one** function, `fn show<T: Sign>(sign: &T)`. The bound is the
contract — `show` knows nothing about `Shop` or `Stop`, only that whatever it
was handed has `render` and `tag`. The compiler stamps out one copy of `show`
per concrete type and the calls are direct.

The starter does not compile. The trait is declared and the structs exist, and
that buys you nothing on its own: `show(&Shop { .. })` is E0277, *the trait
bound `Shop: Sign` is not satisfied*. Declaring a trait and implementing it are
two separate acts, and in Rust the second one is always written out.

Both signs in one `Vec` would be a different mechanism — `Box<dyn Sign>`, a
pointer plus a vtable, looked up at run time. You do not need it here, because
at every call site the concrete type is still visible. That is the next map's
question, and knowing which of the two you are holding is what it asks.
'''
