input:  2
        sogo 500
        luckymac 3800
        sogo 1200
        tsuiwah 4500
        luckymac 200
output: luckymac 4000 2
        sogo 1700 2
        tsuiwah 4500 1
        PAYMENTS 5
```

Use `parking_lot::Mutex`. Its `lock()` cannot fail, so it hands back the
guard itself — there is no `.unwrap()`, no poisoning, and `into_inner()` is
the value, not a `Result`. Spawn the tills with `std::thread::scope` so they
can borrow the ledger without an `Arc`. The starter is the `std::sync` version
and merges each till's figures into the ledger in a way that drops what the
other tills already wrote — read the merge, not the lock.
