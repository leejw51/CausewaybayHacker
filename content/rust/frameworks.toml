solution    = '''
use std::io::Read;

use rand::rngs::StdRng;
use rand::seq::SliceRandom;
use rand::{RngExt, SeedableRng};

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let seed_text = lines.next().unwrap_or("").trim();
    let seed: u64 = match seed_text.parse() {
        Ok(seed) => seed,
        Err(_) => {
            println!("ERROR: bad seed {seed_text}");
            return;
        }
    };
    let mut rest = lines.next().unwrap_or("").split_whitespace();
    let n: usize = rest.next().unwrap().parse().unwrap();
    let k: usize = rest.next().unwrap().parse().unwrap();

    let mut rng = StdRng::seed_from_u64(seed);
    let mut deck: Vec<String> = (1..=n).map(|i| format!("M{i:02}")).collect();
    deck.shuffle(&mut rng);
    println!("DECK {}", deck.join(" "));
    for _ in 0..k {
        let draw: u32 = rng.random_range(1..=100);
        println!("DRAW {draw}");
    }
    println!("CHECK {}", &deck[0]);
}
'''
