solution    = '''
use std::collections::BTreeMap;
use std::io::Read;
use std::sync::Arc;

use anyhow::{anyhow, bail, Context, Result};
use chrono::NaiveDate;
use serde::Deserialize;
use tokio::sync::Mutex;

#[derive(Debug, Deserialize)]
struct Transfer {
    from: String,
    to: String,
    cents: i64,
}

#[derive(Debug, Deserialize)]
struct Settlement {
    date: String,
    transfers: Vec<Transfer>,
}

type Book = Arc<Mutex<BTreeMap<String, i64>>>;

async fn post(book: Book, transfer: Transfer) -> Result<()> {
    if transfer.cents <= 0 {
        bail!("nothing to move");
    }
    if transfer.from == transfer.to {
        bail!("{} pays itself", transfer.from);
    }
    let mut book = book.lock().await;
    *book.entry(transfer.from).or_insert(0) -= transfer.cents;
    *book.entry(transfer.to).or_insert(0) += transfer.cents;
    Ok(())
}

async fn settle(input: &str) -> Result<String> {
    let settlement: Settlement =
        serde_json::from_str(input).map_err(|_| anyhow!("not a settlement"))?;
    let date = NaiveDate::parse_from_str(&settlement.date, "%Y-%m-%d")
        .map_err(|_| anyhow!("bad date {}", settlement.date))?;

    let book: Book = Arc::new(Mutex::new(BTreeMap::new()));
    let handles: Vec<_> = settlement
        .transfers
        .into_iter()
        .map(|transfer| tokio::spawn(post(Arc::clone(&book), transfer)))
        .collect();
    let moved = handles.len();
    for (i, handle) in handles.into_iter().enumerate() {
        handle
            .await
            .context("a task panicked")?
            .with_context(|| format!("transfer {}", i + 1))?;
    }

    let mut out = format!("SETTLEMENT {}\n", date.format("%a %d %b %Y"));
    for (account, net) in book.lock().await.iter() {
        out.push_str(&format!("{account} {net}\n"));
    }
    out.push_str(&format!("MOVED {moved}"));
    Ok(out)
}

#[tokio::main]
async fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    match settle(&input).await {
        Ok(report) => println!("{report}"),
        Err(err) => println!("ERROR: {err:#}"),
    }
}
'''
hints = [
  "Four crates, one program. `serde_json::from_str::<Settlement>` for the shape, `NaiveDate::parse_from_str(&s, \"%Y-%m-%d\")` for the date, `date.format(\"%a %d %b %Y\")` to print it.",
  "The errors are `anyhow`: `.map_err(|_| anyhow!(\"not a settlement\"))` where the crate's own message must not leak, `bail!(...)` inside the task, `.with_context(|| format!(\"transfer {}\", i + 1))` as you join — and `{err:#}` prints `context: cause`.",
  "Each task is `tokio::spawn(post(Arc::clone(&book), transfer))` returning `anyhow::Result<()>`; `handle.await` gives you a `Result<Result<()>, JoinError>`, so it is two `?`s — the first with a context of its own.",
  "Join the handles **in the order you spawned them** and stop at the first `Err`: that is what makes `transfer 2` the one reported when transfers 2 and 3 are both bad. The map is a `BTreeMap`, so the accounts come out sorted for free.",
]

