solution    = '''
use std::io::{Read, Write};

use log::{debug, error, info, trace, warn, LevelFilter, Log, Metadata, Record};

/// Every record at or above the max level, one line each, on stdout.
struct StdoutLogger;

impl Log for StdoutLogger {
    fn enabled(&self, metadata: &Metadata) -> bool {
        // Error is the smallest Level; a record passes when it is no
        // further down than the filter
        metadata.level() <= log::max_level()
    }

    fn log(&self, record: &Record) {
        if self.enabled(record.metadata()) {
            println!("[{}] {}: {}", record.level(), record.target(), record.args());
        }
    }

    fn flush(&self) {
        std::io::stdout().flush().ok();
    }
}

static LOGGER: StdoutLogger = StdoutLogger;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let word = lines.next().unwrap_or("").trim();
    let Ok(level) = word.parse::<LevelFilter>() else {
        println!("unknown level {word}");
        return;
    };
    log::set_logger(&LOGGER).expect("no logger was set before this one");
    log::set_max_level(level);

    let mut total = 0i64;
    for (i, raw) in lines.enumerate() {
        let n = i + 1;
        trace!(target: "io", "read {raw:?}");
        let mut parts = raw.split_whitespace();
        let account = parts.next().unwrap_or("");
        let amount = parts.next().unwrap_or("");
        let cents: i64 = match amount.parse() {
            Ok(c) => c,
            Err(_) => {
                error!(target: "settle", "line {n}: not a number: {amount}");
                continue;
            }
        };
        info!(target: "settle", "line {n}: {account} {cents}");
        if cents > 100_000 {
            warn!(target: "settle", "line {n}: large amount {cents}");
        }
        total += cents;
        debug!(target: "settle", "total so far {total}");
    }
    log::logger().flush();
    println!("TOTAL {total}");
}
'''
