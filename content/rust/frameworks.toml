[[quest]]
id          = "rust.frameworks.16.crossbeam-hatch"
node        = 16
title       = "THE HATCH CLOSES"
difficulty  = 3
story       = "Three Yee Wo Street terminals post into one hatch at the Gloucester Road office, and nothing tells the hatch they have gone home. The night batch is still waiting at six in the morning."
concepts    = ["channels", "cancellation", "concurrency"]
requires    = ["rust.frameworks.15.parking-lot-ledger"]
map          = { x = 0.567, y = 0.546, kind = "quest" }
brief       = '''
Line one is `<PRODUCERS>`, `1 <= PRODUCERS <= 8`. Every line after it is a
payment slip, `<CARD> <CENTS>`. Slip `i` (0-based, slips only) belongs to
producer `i % PRODUCERS`. A slip that is not exactly two fields, or whose
cents is not an `i64`, is a bad slip: the producer skips it and sends
nothing.

Each producer is a thread that sends its good slips, one message each, down
**one** `crossbeam::channel::bounded(4)` channel. One consumer — the main
thread — reads the channel with `for msg in rx` until every sender is gone,
then prints:

* `MESSAGES <n>` — messages received
* `TOTAL <sum of cents>`
* `LARGEST <CARD> <CENTS>` — the single largest slip; on a tie, the smaller
  card id (string order). With no messages, `LARGEST -`.

```
input:  3
        K1 1200
        K2 350
        K3 oops
        K4 1200
        K5 90
output: MESSAGES 4
        TOTAL 2840
        LARGEST K1 1200
```

`for msg in rx` ends only when the **last** `Sender` is dropped. Each
producer gets a `tx.clone()`, and those drop when the threads finish — but
the original `tx` is still sitting in `main`, so the loop never ends and the
run is a timeout. Drop it before you start reading. The starter does not.
'''
starter     = '''
use std::io::Read;
use std::thread;

use crossbeam::channel::bounded;

struct Slip {
    card: String,
    cents: i64,
}

fn parse(line: &str) -> Option<Slip> {
    let mut parts = line.split_whitespace();
    let card = parts.next()?.to_string();
    let cents = parts.next()?.parse().ok()?;
    if parts.next().is_some() {
        return None;
    }
    Some(Slip { card, cents })
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let producers: usize = lines.next().expect("producer count").trim().parse().expect("producer count");
    let slips: Vec<&str> = lines.filter(|l| !l.trim().is_empty()).collect();

    let (tx, rx) = bounded::<Slip>(4);
    let mut count = 0usize;
    let mut total = 0i64;
    let mut largest: Option<(i64, String)> = None;

    thread::scope(|s| {
        for p in 0..producers {
            let tx = tx.clone();
            let slips = &slips;
            s.spawn(move || {
                for line in slips.iter().skip(p).step_by(producers) {
                    if let Some(slip) = parse(line) {
                        tx.send(slip).expect("consumer alive");
                    }
                }
            });
        }

        for slip in rx {
            count += 1;
            total += slip.cents;
            let better = match &largest {
                None => true,
                Some((c, card)) => slip.cents > *c || (slip.cents == *c && slip.card < *card),
            };
            if better {
                largest = Some((slip.cents, slip.card));
            }
        }
    });

    println!("MESSAGES {count}");
    println!("TOTAL {total}");
    match largest {
        Some((cents, card)) => println!("LARGEST {card} {cents}"),
        None => println!("LARGEST -"),
    }
}
