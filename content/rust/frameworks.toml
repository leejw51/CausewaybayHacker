[[quest]]
id          = "rust.frameworks.01.anyhow-context"
node        = 1
title       = "ONE QUESTION MARK"
difficulty  = 2
story       = "First morning back on the payment path. The settlement reader off Gloucester Road dies on line 3 of a 4,000-line file and says only 'invalid digit found in string'."
concepts    = ["error-handling", "imports", "io"]
requires    = []
map          = { x = 0.134, y = 0.25, kind = "quest" }
brief       = '''
Read lines of `<ACCOUNT> <CENTS>` from standard input and print the total in
cents, as `TOTAL <n>`.

If a line is not two fields, or the cents will not parse as an `i64`, print
one line instead and exit normally:

```
ERROR: line 3: invalid digit found in string
```

That is `anyhow`'s own rendering of an error with one layer of context:
`format!("{:#}", err)` prints the context, a colon, and the cause. The
context is `line <n>` (1-based). Nothing else is printed in the error case.

```
input:  A 100
        B 250
        C 7
output: TOTAL 357
```

Use `anyhow::Result` as the return type of the function that does the work,
`?` to propagate, and `.with_context(|| ...)` to say which line. The starter
unwraps and panics, which prints a stack trace and exits with 101 — not a
message anybody on the floor can read.
'''
starter     = '''
use std::io::Read;

fn total(input: &str) -> i64 {
    let mut sum = 0;
    for line in input.lines() {
        let mut parts = line.split_whitespace();
        let _account = parts.next().unwrap();
        let cents: i64 = parts.next().unwrap().parse().unwrap();
        sum += cents;
    }
    sum
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    println!("TOTAL {}", total(&input));
}
'''
solution    = '''
use std::io::Read;

use anyhow::{anyhow, Context, Result};

fn total(input: &str) -> Result<i64> {
    let mut sum = 0;
    for (i, line) in input.lines().enumerate() {
        let n = i + 1;
        let mut parts = line.split_whitespace();
        let _account = parts
            .next()
            .ok_or_else(|| anyhow!("empty line"))
            .with_context(|| format!("line {n}"))?;
        let cents: i64 = parts
            .next()
            .ok_or_else(|| anyhow!("missing amount"))
            .with_context(|| format!("line {n}"))?
            .parse()
            .with_context(|| format!("line {n}"))?;
        sum += cents;
    }
    Ok(sum)
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    match total(&input) {
        Ok(sum) => println!("TOTAL {sum}"),
        Err(err) => println!("ERROR: {err:#}"),
    }
}
'''
hints = [
  "`use anyhow::{Context, Result};` — `Result<T>` is `Result<T, anyhow::Error>`, and `?` converts any `std::error::Error` into it.",
  "`.with_context(|| format!(\"line {n}\"))` works on a `Result` *and* on an `Option` (the `Option` becomes an error with that message). Attach it before the `?`.",
  "`{:#}` on an `anyhow::Error` prints `context: cause` on one line; plain `{}` prints the outermost context only.",
  "A missing field is `None`, not a parse error: turn it into an error with `.ok_or_else(|| anyhow!(\"missing amount\"))` and give it the same `line n` context.",
]

