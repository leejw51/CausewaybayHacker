# RUST LAND — FRAMEWORKS. The job. The interview at HKU is over and Mei is
# back on the payment path at the fintech off Gloucester Road, where nothing
# is written from scratch and every file starts with `use`. This road is the
# crates every Rust codebase on the street is built on — anyhow, thiserror,
# serde, serde_json, toml, clap, regex, chrono, itertools, indexmap, rand,
# rayon, parking_lot, crossbeam, tokio, futures, log — one or two per node,
# each the way it is actually used: a brief, a whole program, hidden cases,
# untimed. ADVANCED's shape with a dependency in it.
#
# Every quest here names `crates` in its test spec (SPEC §5.1, §5.2). That is
# what sends it to cargo instead of `rustc`: it is built against the crate
# shelf in `backend/runner/shelf/`, offline, with the shelf's lockfile — so
# the versions are the pinned ones and the build is the warm one. A machine
# that has not run `cwbhacker warm` refuses the road with that command in the
# message rather than handing a correct answer a `timeout`.
#
# Every quest has a deterministic answer on purpose. Random numbers are
# seeded, dates are parsed and never read off the clock, tasks are joined in
# spawn order or their results sorted, and a timeout is a hundred times
# longer than the thing it waits for. A quest whose output depends on the
# scheduler is a quest that fails CI at random, and that is not a lesson.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.

pack = "rust.frameworks"
land = "rust"
category = "frameworks"
version = 1

