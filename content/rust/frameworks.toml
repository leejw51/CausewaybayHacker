solution    = '''
use std::io::Read;

use rayon::prelude::*;

fn fee(cents: i64) -> i64 {
    (cents * 15 + 999) / 1000 + 30
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let payments: Vec<(&str, i64)> = input
        .lines()
        .filter(|l| !l.trim().is_empty())
        .map(|l| {
            let (card, cents) = l.trim().split_once(' ').expect("card and cents");
            (card, cents.trim().parse().expect("cents"))
        })
        .collect();

    let mut fees: Vec<(&str, i64)> = payments
        .par_iter()
        .map(|&(card, cents)| (card, fee(cents)))
        .collect();
    fees.par_sort_unstable();
    let total: i64 = fees.par_iter().map(|&(_, f)| f).sum();

    for (card, f) in &fees {
        println!("{card} {f}");
    }
    println!("TOTAL {total}");
}
'''
hints = [
  "`use rayon::prelude::*;` puts `par_iter()` on every `Vec` and slice. The closure you already have does not change; `.map(...).collect()` and `.map(...).sum()` exist on the parallel iterator too.",
  "Rounding up in integers is `(x + 999) / 1000`, not `x / 1000`. The starter rounds down, and the hidden cases have amounts whose 1.5% is not a whole cent.",
  "A parallel `collect()` into a `Vec` keeps input order, but the brief wants card order: `fees.par_sort_unstable()` (or plain `sort()`) before the print loop, which stays sequential.",
  "`let total: i64 = fees.par_iter().map(|&(_, f)| f).sum();` — the type on the left tells `sum` what to add into.",
]

