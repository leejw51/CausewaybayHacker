  "`static LOGGER: StdoutLogger = StdoutLogger; log::set_logger(&LOGGER).unwrap(); log::set_max_level(level);` — `set_logger` wants a `&'static dyn Log`, which is why it is a `static`, not a `let`.",
  "`Level` orders `Error < Warn < Info < Debug < Trace`, so a record is wanted when `record.level() <= log::max_level()`. The macros already check `max_level()` before they call you.",
