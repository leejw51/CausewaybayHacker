solution    = '''
use std::io::Read;
use std::time::Duration;

async fn tag(merchant: &str) -> String {
    merchant.to_uppercase()
}

async fn fee(cents: i64) -> i64 {
    cents * 15 / 1000
}

async fn check(merchant: String, cents: i64) -> (String, i64, i64) {
    // the acquirer's round trip
    tokio::time::sleep(Duration::from_millis((cents % 5) as u64 * 50)).await;
    let (tag, fee) = tokio::join!(tag(&merchant), fee(cents));
    (tag, cents, fee)
}

#[tokio::main]
async fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut handles = Vec::new();
    for line in input.lines() {
        let mut parts = line.split_whitespace();
        let Some(merchant) = parts.next() else { continue };
        let cents: i64 = parts.next().unwrap().parse().unwrap();
        handles.push(tokio::spawn(check(merchant.to_string(), cents)));
    }
    let (mut total, mut fees) = (0, 0);
    for (i, handle) in handles.into_iter().enumerate() {
        let (tag, cents, fee) = handle.await.expect("task panicked");
        total += cents;
        fees += fee;
        println!("{} {tag} {cents} {fee}", i + 1);
    }
    println!("TOTAL {total} {fees}");
}
