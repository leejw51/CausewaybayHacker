solution    = '''
use std::io::Read;
use std::thread;
use std::time::Duration;

use crossbeam::channel::{after, bounded, select};

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut approved = 0usize;
    let mut timed_out = 0usize;

    for line in input.lines().filter(|l| !l.trim().is_empty()) {
        let (card, ms) = line.trim().split_once(' ').expect("card and ms");
        let card = card.to_string();
        let ms: u64 = ms.trim().parse().expect("ms");

        // A channel per card: a late answer lands in a channel nobody
        // reads any more, instead of in the next card's.
        let (tx, rx) = bounded::<String>(1);
        let issuer_card = card.clone();
        thread::spawn(move || {
            thread::sleep(Duration::from_millis(ms));
            let _ = tx.send(issuer_card);
        });

        let timeout = after(Duration::from_millis(300));
        select! {
            recv(rx) -> answer => {
                let answer = answer.expect("worker sent before dropping");
                approved += 1;
                println!("{answer} APPROVED");
            }
            recv(timeout) -> _ => {
                timed_out += 1;
                println!("{card} TIMEOUT");
            }
        }
    }
    println!("APPROVED {approved} TIMEOUT {timed_out}");
    // Slow workers are still asleep. Returning from main ends them.
}
'''
