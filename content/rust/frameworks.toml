use std::io::Read;

fn rank(level: &str) -> u8 {
    match level {
        "off" => 0,
        "error" => 1,
        "warn" => 2,
        "info" => 3,
        "debug" => 4,
        "trace" => 5,
        _ => 3,
    }
}

fn emit(min: u8, level: &str, target: &str, message: String) {
    // show everything at least as high as the chosen level
    if rank(level) >= min {
        println!("[{}] {target}: {message}", level.to_uppercase());
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let word = lines.next().unwrap_or("").trim().to_lowercase();
    let min = rank(&word);

    let mut total = 0i64;
    for (i, raw) in lines.enumerate() {
        let n = i + 1;
        emit(min, "trace", "io", format!("read {raw:?}"));
        let mut parts = raw.split_whitespace();
        let account = parts.next().unwrap_or("");
        let amount = parts.next().unwrap_or("");
        let cents: i64 = match amount.parse() {
            Ok(c) => c,
            Err(_) => {
                emit(min, "error", "settle", format!("line {n}: not a number: {amount}"));
                continue;
            }
        };
        emit(min, "info", "settle", format!("line {n}: {account} {cents}"));
        if cents > 100_000 {
            emit(min, "warn", "settle", format!("line {n}: large amount {cents}"));
        }
        total += cents;
        emit(min, "debug", "settle", format!("total so far {total}"));
    }
    println!("TOTAL {total}");
}
