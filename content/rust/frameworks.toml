solution    = '''
use std::io::Read;

use itertools::Itertools;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let transfers: Vec<(&str, i64)> = input
        .lines()
        .filter(|line| !line.trim().is_empty())
        .map(|line| {
            let (account, cents) = line.trim().split_once(' ').expect("account and cents");
            (account, cents.trim().parse().expect("cents are an integer"))
        })
        .collect();

    let accounts = transfers.iter().map(|(account, _)| account).unique().count();
    let mut total = 0i64;
    let grouped = transfers
        .iter()
        .sorted_by_key(|(account, _)| *account)
        .chunk_by(|(account, _)| *account);
    for (account, group) in &grouped {
        let amounts: Vec<i64> = group.map(|(_, cents)| *cents).collect();
        let sum: i64 = amounts.iter().sum();
        total += sum;
        println!("{account} {}={sum}", amounts.iter().join("+"));
    }
    println!("{accounts} accounts, {total} cents");
}
'''
hints = [
  "`use itertools::Itertools;` puts `sorted_by_key`, `chunk_by`, `join` and `unique` on every iterator.",
  "`transfers.iter().sorted_by_key(|(account, _)| *account)` returns an iterator over the sorted items — stable, so two transfers of one account keep their order — and `.chunk_by(|(account, _)| *account)` on that groups the runs.",
  "`ChunkBy` is iterated by reference: `let grouped = ...chunk_by(...); for (account, group) in &grouped { ... }`. `group` is an iterator over that account's transfers.",
  "Inside the loop: `let amounts: Vec<i64> = group.map(|(_, cents)| *cents).collect();` then `println!(\"{account} {}={}\", amounts.iter().join(\"+\"), amounts.iter().sum::<i64>())`.",
]

