  "`#[command(name = \"till\", disable_help_subcommand = true)]` on the struct — otherwise clap adds a `help` subcommand of its own, and the line `help` prints `DisplayHelp` instead of `InvalidSubcommand`.",
  "After `try_parse_from`, match on `cli.command`: `Command::Refund { id, reason: Some(why) } => ...` and `Command::Refund { id, reason: None } => ...` are two arms of one match.",
]

