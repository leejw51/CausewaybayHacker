difficulty  = 3
story       = "The support desk pastes customer emails into refund tickets and the amounts sit in the prose. The scanner that pulls them out stops at the first comma, so a customer charged HK$1,234.50 at SOGO has been offered a dollar back."
concepts    = ["strings", "iteration", "types"]
requires    = ["rust.frameworks.08.clap-subcommands"]
map          = { x = 0.58, y = 0.45, kind = "quest" }
brief       = '''
Standard input is free text, one ticket line per line. Find every Hong Kong
dollar amount in it. An amount is `HK$` followed directly by a whole-dollar
part and an optional cents part:

* whole dollars: either plain digits (`80`, `1234`) or digits grouped in
  threes with commas (`1,234`, `12,345,678` — one to three digits, then one
  or more `,ddd` groups);
* cents: a `.` and exactly two digits (`.50`). A `.` with no two digits after
  it is not part of the amount (`HK$38.` is 38 dollars).

Anything else — `US$9.99`, a bare `HK$` — is not an amount.

For every amount, in reading order, print `<line> <text> <cents>`: the
1-based line number, the amount exactly as it appeared in the text, and its
value in cents as an integer. After the last line print `TOTAL <cents>`.
A ticket with no amounts prints only the total; empty input prints `TOTAL 0`.

```
input:  Charged HK$1,234.50 twice at SOGO; the second HK$1,234.50 is a duplicate.
        Refund HK$80 and the HK$12.05 fee. The US$9.99 line is not ours.
output: 1 HK$1,234.50 123450
        1 HK$1,234.50 123450
        2 HK$80 8000
        2 HK$12.05 1205
        TOTAL 256105
```

Build one `regex::Regex` with named groups for the dollars and the cents,
compile it **once** before the loop (compiling is the expensive part; a
`Regex` in a loop body is the classic mistake), and walk each line with
`captures_iter`. Work in integer cents: `f64` dollars times 100 is how
`HK$0.29` becomes 28 cents. The starter scans by hand, stops at the first
comma, and multiplies floats.
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut total = 0i64;
    for (i, line) in input.lines().enumerate() {
        for (at, _) in line.match_indices("HK$") {
            let rest = &line[at + 3..];
            let end = rest.find(|c: char| !c.is_ascii_digit() && c != '.').unwrap_or(rest.len());
            let number = rest[..end].trim_end_matches('.');
            if number.is_empty() {
                continue;
            }
            let value: f64 = match number.parse() {
                Ok(v) => v,
                Err(_) => continue,
            };
            let amount = (value * 100.0) as i64;
            total += amount;
            println!("{} HK${} {}", i + 1, number, amount);
        }
    }
    println!("TOTAL {total}");
}
'''
solution    = '''
use std::io::Read;

use regex::Regex;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let re = Regex::new(r"HK\$(?P<dollars>\d{1,3}(?:,\d{3})+|\d+)(?:\.(?P<cents>\d{2}))?").unwrap();
    let mut total = 0i64;
    for (i, line) in input.lines().enumerate() {
        for caps in re.captures_iter(line) {
            let dollars: i64 = caps["dollars"].replace(',', "").parse().unwrap();
            let cents: i64 = caps.name("cents").map_or(0, |m| m.as_str().parse().unwrap());
            let amount = dollars * 100 + cents;
            total += amount;
            println!("{} {} {}", i + 1, &caps[0], amount);
        }
    }
    println!("TOTAL {total}");
}
'''
hints = [
  "`use regex::Regex;` and `let re = Regex::new(r\"...\").unwrap();` once, above the loop. `re.captures_iter(line)` yields one `Captures` per match, left to right.",
  "Named groups: `(?P<dollars>...)` and `(?P<cents>...)`. In the pattern, `\\$` is a literal dollar sign and the grouped form must come first in the alternation with a `+` on the comma groups, or `HK$1234.50` matches as `HK$123` — the regex crate takes the first alternative that matches, not the longest.",
  "The pattern: `HK\\$(?P<dollars>\\d{1,3}(?:,\\d{3})+|\\d+)(?:\\.(?P<cents>\\d{2}))?`. `&caps[0]` is the whole match, `caps[\"dollars\"]` the group text, and `caps.name(\"cents\")` is an `Option<Match>` because the group may not have taken part.",
  "`let dollars: i64 = caps[\"dollars\"].replace(',', \"\").parse().unwrap();` then `let cents: i64 = caps.name(\"cents\").map_or(0, |m| m.as_str().parse().unwrap());` and the amount is `dollars * 100 + cents`.",
]

