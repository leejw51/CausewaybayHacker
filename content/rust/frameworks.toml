solution    = '''
use std::collections::HashMap;
use std::io::Read;
use std::thread;

use parking_lot::Mutex;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let tills: usize = lines.next().expect("till count").trim().parse().expect("till count");
    let payments: Vec<(&str, i64)> = lines
        .filter(|l| !l.trim().is_empty())
        .map(|l| {
            let (merchant, cents) = l.trim().split_once(' ').expect("merchant and cents");
            (merchant, cents.trim().parse().expect("cents"))
        })
        .collect();

    let ledger: Mutex<HashMap<String, (i64, u32)>> = Mutex::new(HashMap::new());
    thread::scope(|s| {
        for till in 0..tills {
            let ledger = &ledger;
            let payments = &payments;
            s.spawn(move || {
                let mut local: HashMap<String, (i64, u32)> = HashMap::new();
                for &(merchant, cents) in payments.iter().skip(till).step_by(tills) {
                    let entry = local.entry(merchant.to_string()).or_insert((0, 0));
                    entry.0 += cents;
                    entry.1 += 1;
                }
                // One lock per till, held only for the merge: the guard
                // drops at the end of this block.
                let mut shared = ledger.lock();
                for (merchant, (cents, count)) in local {
                    let entry = shared.entry(merchant).or_insert((0, 0));
                    entry.0 += cents;
                    entry.1 += count;
                }
            });
        }
    });

    let ledger = ledger.into_inner();
    let mut rows: Vec<(String, (i64, u32))> = ledger.into_iter().collect();
    rows.sort();
    for (merchant, (total, count)) in &rows {
        println!("{merchant} {total} {count}");
    }
    println!("PAYMENTS {}", payments.len());
}
'''
