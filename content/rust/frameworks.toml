  "`stream::iter(&rows).map(|&(_, c)| bucket(c)).buffer_unordered(4).collect::<Vec<_>>().await` keeps four futures running and yields each as it finishes; `.sort_unstable()` afterwards makes the order yours again.",
  "`try_join_all(..).await` is `Ok(Vec<T>)` when every future is `Ok`, or the first `Err` — `check` never awaits anything, so the first in input order is the first to be polled.",
  "`let scores = join_all(rows.iter().map(|&(id, c)| score(id, c))).await;` then `rows.iter().zip(&scores)` to print.",
]

