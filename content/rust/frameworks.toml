use std::io::Read;

use tokio::sync::mpsc;

#[tokio::main]
async fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let tills: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut queues: Vec<Vec<i64>> = vec![Vec::new(); tills];
    for line in lines {
        let mut parts = line.split_whitespace();
        let (Some(till), Some(cents)) = (parts.next(), parts.next()) else { continue };
        let till: usize = till.parse().unwrap();
        let cents: i64 = cents.parse().unwrap();
        if (1..=tills).contains(&till) {
            queues[till - 1].push(cents);
        }
    }

    let (tx, mut rx) = mpsc::channel::<(usize, i64)>(4);
    for (i, queue) in queues.into_iter().enumerate() {
        let tx = tx.clone();
        tokio::spawn(async move {
            for cents in queue {
                tx.send((i + 1, cents)).await.expect("consumer is listening");
            }
            // `tx` (this till's clone) is dropped here, when the till closes
        });
    }
    // the clones are with the tills; this one would keep the channel open
    drop(tx);

    let mut count = vec![0usize; tills];
    let mut sum = vec![0i64; tills];
    while let Some((till, cents)) = rx.recv().await {
        count[till - 1] += 1;
        sum[till - 1] += cents;
    }
    for k in 0..tills {
        println!("TILL {} {} {}", k + 1, count[k], sum[k]);
    }
    println!("TOTAL {} {}", count.iter().sum::<usize>(), sum.iter().sum::<i64>());
}
