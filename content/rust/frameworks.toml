map          = { x = 0.267, y = 0.139, kind = "quest" }
brief       = '''
Two accounts, `A` and `B`, start with the balances on line one. Then `n` on
line two, then `n` transfers `<FROM> <TO> <CENTS>`.

Apply them in order. For each print `OK <FROM> <TO> <CENTS>`, or the error —
and the errors are a `thiserror` enum with three variants, whose `Display`
is exactly:

* `unknown account X` — `FROM` or `TO` is not `A` or `B` (check `FROM` first)
* `insufficient funds in A: need 300, have 100`
* `nothing to move` — the amount is zero or negative

After the transfers print `A <balance>` and `B <balance>`.

```
input:  100 100
        3
        A B 30
        B C 5
        A B 300
output: OK A B 30
        unknown account C
        insufficient funds in A: need 300, have 70
        A 70
        B 130
```

Define the enum with `#[derive(Debug, thiserror::Error)]` and put each
message in its `#[error("...")]` attribute, with the fields interpolated —
`{0}` for a tuple variant, `{need}` for a named field. `transfer` returns
`Result<(), TransferError>`, and `main` prints with `{}`. The starter has the
logic and prints `bad transfer` for everything.
'''
starter     = '''
use std::io::Read;

fn transfer(a: &mut i64, b: &mut i64, from: &str, to: &str, cents: i64) -> Result<(), String> {
    if cents <= 0 {
        return Err("bad transfer".to_string());
    }
    let (src, dst) = match (from, to) {
        ("A", "B") => (a, b),
        ("B", "A") => (b, a),
        _ => return Err("bad transfer".to_string()),
    };
    if *src < cents {
        return Err("bad transfer".to_string());
    }
    *src -= cents;
    *dst += cents;
    Ok(())
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut first = lines.next().unwrap().split_whitespace();
    let mut a: i64 = first.next().unwrap().parse().unwrap();
    let mut b: i64 = first.next().unwrap().parse().unwrap();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();
    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let from = parts.next().unwrap();
        let to = parts.next().unwrap();
        let cents: i64 = parts.next().unwrap().parse().unwrap();
        match transfer(&mut a, &mut b, from, to, cents) {
            Ok(()) => println!("OK {from} {to} {cents}"),
            Err(e) => println!("{e}"),
        }
    }
    println!("A {a}");
    println!("B {b}");
}
'''
solution    = '''
use std::io::Read;

use thiserror::Error;

#[derive(Debug, Error)]
enum TransferError {
    #[error("unknown account {0}")]
    UnknownAccount(String),
    #[error("insufficient funds in {account}: need {need}, have {have}")]
    Insufficient { account: String, need: i64, have: i64 },
    #[error("nothing to move")]
    NothingToMove,
}

fn transfer(a: &mut i64, b: &mut i64, from: &str, to: &str, cents: i64) -> Result<(), TransferError> {
    for name in [from, to] {
        if name != "A" && name != "B" {
            return Err(TransferError::UnknownAccount(name.to_string()));
        }
    }
    if cents <= 0 {
        return Err(TransferError::NothingToMove);
    }
    let (src, dst) = if from == "A" { (a, b) } else { (b, a) };
    if *src < cents {
        return Err(TransferError::Insufficient {
            account: from.to_string(),
            need: cents,
            have: *src,
        });
    }
    *src -= cents;
    *dst += cents;
    Ok(())
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut first = lines.next().unwrap().split_whitespace();
    let mut a: i64 = first.next().unwrap().parse().unwrap();
    let mut b: i64 = first.next().unwrap().parse().unwrap();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();
    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let from = parts.next().unwrap();
        let to = parts.next().unwrap();
        let cents: i64 = parts.next().unwrap().parse().unwrap();
        match transfer(&mut a, &mut b, from, to, cents) {
            Ok(()) => println!("OK {from} {to} {cents}"),
            Err(e) => println!("{e}"),
        }
    }
    println!("A {a}");
    println!("B {b}");
}
'''
hints = [
  "`#[derive(Debug, thiserror::Error)]` on an enum, and `#[error(\"...\")]` on each variant, is the whole of `impl Display` and `impl std::error::Error`.",
  "`{0}` in the attribute is the first field of a tuple variant; `{need}` and `{have}` are named fields of a struct variant.",
  "Check the two account names before the amount, and `FROM` before `TO`: the hidden cases send `C B 0`, and the brief says which error wins.",
  "The signature changes to `Result<(), TransferError>`; `println!(\"{e}\")` in `main` then prints the attribute's text.",
]

