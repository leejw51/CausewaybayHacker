brief       = '''
`till` is a command-line tool with three subcommands:

* `pay <TO> <CENTS>` — `TO` a string, `CENTS` an unsigned integer; prints
  `PAY <CENTS> to <TO>`
* `refund <ID> [--reason <WORD>]` — prints `REFUND <ID>`, or
  `REFUND <ID> because <WORD>` when a reason is given
* `balance [ACCOUNT]` — `ACCOUNT` defaults to `main`; prints
  `BALANCE <ACCOUNT>`

As before, the harness passes no arguments: each non-empty line of standard
input is one command line, split on whitespace, without the tool's name. One
output line per command line. On failure print `ERROR: ` and the `Debug`
form of clap's `ErrorKind`: an unknown first word is
`ERROR: InvalidSubcommand`; a subcommand missing a positional is
`ERROR: MissingRequiredArgument`; a `CENTS` that is not an integer is
`ERROR: ValueValidation`; an option the subcommand does not have is
`ERROR: UnknownArgument`.

```
input:  pay yw-07 3800
        refund r-1041 --reason duplicate
        balance
        topup yw-07 100
output: PAY 3800 to yw-07
        REFUND r-1041 because duplicate
        BALANCE main
        ERROR: InvalidSubcommand
```

Use `#[derive(Parser)]` on a struct with one field marked
`#[command(subcommand)]` whose type is an enum with
`#[derive(Subcommand)]`; each variant's fields are that subcommand's
arguments, and the variant name lowercased is the word on the line. Put
`#[command(disable_help_subcommand = true)]` on the struct so `help` is not a
fourth verb. Do not send `--help`. The starter matches on the first word and
indexes the rest.
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        let words: Vec<&str> = line.split_whitespace().collect();
        if words.is_empty() {
            continue;
        }
        match words[0] {
            "pay" => {
                let cents: u64 = words[2].parse().unwrap();
                println!("PAY {cents} to {}", words[1]);
            }
            "refund" => {
                if words.len() >= 4 && words[2] == "--reason" {
                    println!("REFUND {} because {}", words[1], words[3]);
                } else {
                    println!("REFUND {}", words[1]);
                }
            }
            "balance" => {
                let account = words.get(1).copied().unwrap_or("main");
                println!("BALANCE {account}");
            }
            _ => println!("ERROR: InvalidSubcommand"),
        }
    }
}
'''
solution    = '''
use std::io::Read;

use clap::{Parser, Subcommand};

#[derive(Debug, Parser)]
#[command(name = "till", disable_help_subcommand = true)]
struct Cli {
    #[command(subcommand)]
    command: Command,
}

#[derive(Debug, Subcommand)]
enum Command {
    /// Pay a merchant.
    Pay { to: String, cents: u64 },
    /// Reverse a settled payment.
    Refund {
        id: String,
        #[arg(long)]
        reason: Option<String>,
    },
    /// Show an account's balance.
    Balance {
        #[arg(default_value = "main")]
        account: String,
    },
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        if line.trim().is_empty() {
            continue;
        }
        let words = line.split_whitespace();
        match Cli::try_parse_from(std::iter::once("till").chain(words)) {
            Ok(cli) => match cli.command {
                Command::Pay { to, cents } => println!("PAY {cents} to {to}"),
                Command::Refund { id, reason: Some(why) } => println!("REFUND {id} because {why}"),
                Command::Refund { id, reason: None } => println!("REFUND {id}"),
                Command::Balance { account } => println!("BALANCE {account}"),
            },
            Err(e) => println!("ERROR: {:?}", e.kind()),
        }
    }
}
'''
