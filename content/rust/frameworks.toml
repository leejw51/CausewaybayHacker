use std::io::Read;
use std::time::Duration;

use tokio::time::sleep;

async fn primary(id: u64, speed: &str) -> u64 {
    let wait = if speed == "slow" { Duration::from_secs(3) } else { Duration::from_millis(10) };
    sleep(wait).await;
    id * 37 % 1000
