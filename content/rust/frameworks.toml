solution    = '''
use std::io::Read;
use std::time::Duration;

use futures::future::{join_all, try_join_all};
use futures::stream::{self, StreamExt};
use tokio::time::sleep;

const LIMIT: i64 = 500_000;

async fn score(id: i64, cents: i64) -> i64 {
    sleep(Duration::from_millis(100)).await;
    (id * 7 + cents) % 100
}

async fn bucket(cents: i64) -> i64 {
    sleep(Duration::from_millis(20)).await;
    cents / 10_000
}

async fn check(id: i64, cents: i64) -> Result<i64, i64> {
    if cents > LIMIT { Err(id) } else { Ok(cents) }
}

fn parse(input: &str) -> Vec<(i64, i64)> {
    input
        .lines()
        .filter_map(|line| {
            let mut parts = line.split_whitespace();
            let id = parts.next()?.parse().ok()?;
            let cents = parts.next()?.parse().ok()?;
            Some((id, cents))
        })
        .collect()
}

#[tokio::main]
async fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let rows = parse(&input);

    // all at once; the Vec comes back in the order the futures went in
    let scores = join_all(rows.iter().map(|&(id, cents)| score(id, cents))).await;
    for (&(id, _), s) in rows.iter().zip(&scores) {
        println!("{id} {s}");
    }

    // four in flight, results in completion order — so sort before printing
    let mut buckets: Vec<i64> = stream::iter(&rows)
        .map(|&(_, cents)| bucket(cents))
        .buffer_unordered(4)
        .collect()
        .await;
    buckets.sort_unstable();
    let list: Vec<String> = buckets.iter().map(|b| b.to_string()).collect();
    println!("{}", ["BUCKETS".to_string()].into_iter().chain(list).collect::<Vec<_>>().join(" "));

    // the first Err wins and the rest are dropped
    match try_join_all(rows.iter().map(|&(id, cents)| check(id, cents))).await {
        Ok(amounts) => println!("OK {}", amounts.iter().sum::<i64>()),
        Err(id) => println!("REJECTED {id}"),
    }
}
'''
