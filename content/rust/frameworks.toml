brief       = '''
`settle` is a command-line tool with:

* one required positional `BATCH` (a string)
* `--limit <N>`, an unsigned integer, default `100`
* `--dry-run`, a flag

The harness passes no arguments, so the command lines come from standard
input: each non-empty line is one command line, split on whitespace (the
tool's own name is not on the line). For each, print one line:

* on success, `batch=<BATCH> limit=<N> dry-run=<true|false>`
* on failure, `ERROR: ` and the `Debug` form of clap's `ErrorKind` —
  `ERROR: MissingRequiredArgument`, `ERROR: ValueValidation`,
  `ERROR: UnknownArgument`, `ERROR: InvalidValue` (an option with no value
  after it)

```
input:  2024-06-01 --limit 50
        --dry-run 2024-06-02
        2024-06-03 --limit ten
output: batch=2024-06-01 limit=50 dry-run=false
        batch=2024-06-02 limit=100 dry-run=true
        ERROR: ValueValidation
```

Declare the interface as a struct with `#[derive(clap::Parser)]` —
`#[arg(long, default_value_t = 100)]` and `#[arg(long)]` on a `bool` — and
parse each line with
`Cli::try_parse_from(std::iter::once("settle").chain(words))`. `Err(e)`
carries `e.kind()`. Options may come before or after the positional, and
`--limit=7` is the same as `--limit 7`. Do not send `--help`. The starter
is a hand-rolled loop that accepts anything.
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        if line.trim().is_empty() {
            continue;
        }
        let mut batch = String::new();
        let mut limit: u32 = 100;
        let mut dry_run = false;
        let mut words = line.split_whitespace();
        while let Some(word) = words.next() {
            match word {
                "--dry-run" => dry_run = true,
                "--limit" => limit = words.next().unwrap().parse().unwrap(),
                _ => batch = word.to_string(),
            }
        }
        println!("batch={batch} limit={limit} dry-run={dry_run}");
    }
}
'''
solution    = '''
use std::io::Read;

use clap::Parser;

#[derive(Debug, Parser)]
#[command(name = "settle")]
struct Cli {
    /// The settlement batch to run.
    batch: String,
    /// Most records to settle in one run.
    #[arg(long, default_value_t = 100)]
    limit: u32,
    /// Report what would be settled and move nothing.
    #[arg(long)]
    dry_run: bool,
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        if line.trim().is_empty() {
            continue;
        }
        let words = line.split_whitespace();
        match Cli::try_parse_from(std::iter::once("settle").chain(words)) {
            Ok(cli) => println!(
                "batch={} limit={} dry-run={}",
                cli.batch, cli.limit, cli.dry_run
            ),
            Err(e) => println!("ERROR: {:?}", e.kind()),
        }
    }
}
'''
hints = [
  "`use clap::Parser;` and `#[derive(Parser)]` on a struct: a bare field is a positional, `#[arg(long)]` makes `--field-name`, and the field's type is the value parser — `u32` refuses `ten` for you.",
  "`#[arg(long, default_value_t = 100)] limit: u32` is the default as a typed value; `#[arg(long)] dry_run: bool` is a flag, present or not, spelled `--dry-run` on the line.",
  "`Cli::parse()` reads the real argv, which is empty here. `Cli::try_parse_from(iter)` takes any iterator of strings whose first item is the program name: `std::iter::once(\"settle\").chain(line.split_whitespace())`.",
  "`Err(e) => println!(\"ERROR: {:?}\", e.kind())` — `ErrorKind` is a plain enum, and its `Debug` is the variant name.",
]

