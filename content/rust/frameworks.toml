        BANK 16000
        LUCKYMAC -3500
        SOGO -12500
        MOVED 3
```

The first line is the date formatted `%a %d %b %Y`. Then one line per
account that appears anywhere, **sorted by name**, with its net: everything
it received minus everything it paid. Then `MOVED <number of transfers>`.

Or one `ERROR:` line and nothing else, checked in this order:

* the input is not that shape at all — `ERROR: not a settlement`
* the date will not parse — `ERROR: bad date 2026-13-01`
* then each transfer in order, 1-based — `ERROR: transfer 2: nothing to move`
  for a `cents` that is zero or negative, `ERROR: transfer 1: BANK pays itself`
  when `from` equals `to`

Build it from the road behind you: `serde` for the shape, `chrono` for the
date, `anyhow` with context for the errors, and `tokio` — one task per
transfer that validates it and posts both sides into an
`Arc<tokio::sync::Mutex<BTreeMap<String, i64>>>`, joined **in order** so the
first bad transfer is the one reported. The starter parses and spawns but
credits only the receiving side, never validates, and prints the date as it
came.
'''
