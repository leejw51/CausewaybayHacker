brief       = '''
Standard input is a service config in TOML:

* top level: `name` (string, required), `port` (integer, default `8080`)
* table `[limits]` (required): `max_cents` (integer, required), `retries`
  (integer, default `3`)
* array of tables `[[upstream]]`, zero or more, each with `name` and `url`
  (strings, required) and `timeout_ms` (integer, default `1000`)

Print the summary — one `SERVICE` line, one `LIMIT` line, then one
`UPSTREAM` line per table in file order:

```
input:  name = 'settlement'
        port = 9000

        [limits]
        max_cents = 500000

        [[upstream]]
        name = 'clearing'
        url = 'https://clearing.example/settle'
        timeout_ms = 2000

        [[upstream]]
        name = 'fallback'
        url = 'https://fallback.example/settle'
output: SERVICE settlement on port 9000
        LIMIT 500000 cents, 3 retries
        UPSTREAM clearing https://clearing.example/settle 2000 ms
        UPSTREAM fallback https://fallback.example/settle 1000 ms
```

If the input is not valid TOML, or does not have that shape (a required key
missing, a value of the wrong type), print exactly `ERROR: config rejected`
as the only line and exit normally. Do not print toml's own message.

Describe the shape as structs — `Config`, `Limits`, `Upstream` — each
`#[derive(Deserialize)]`, the defaults with `#[serde(default)]` or
`#[serde(default = "fn_name")]`, and read it with
`toml::from_str::<Config>(&input)`, matching on the `Result`. The starter
reads a `toml::Table` and indexes into it, which works for a complete file
and panics on everything else.
'''
starter     = '''
use std::io::Read;

use toml::Table;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let cfg: Table = toml::from_str(&input).expect("config is TOML");
    let name = cfg["name"].as_str().unwrap();
    let port = cfg["port"].as_integer().unwrap();
    println!("SERVICE {name} on port {port}");
    let limits = cfg["limits"].as_table().unwrap();
    let max_cents = limits["max_cents"].as_integer().unwrap();
    let retries = limits["retries"].as_integer().unwrap();
    println!("LIMIT {max_cents} cents, {retries} retries");
    for up in cfg["upstream"].as_array().unwrap() {
        let name = up["name"].as_str().unwrap();
        let url = up["url"].as_str().unwrap();
        let timeout_ms = up["timeout_ms"].as_integer().unwrap();
        println!("UPSTREAM {name} {url} {timeout_ms} ms");
    }
}
'''
solution    = '''
use std::io::Read;

use serde::Deserialize;

#[derive(Debug, Deserialize)]
struct Config {
    name: String,
    #[serde(default = "default_port")]
    port: u16,
    limits: Limits,
    #[serde(default)]
    upstream: Vec<Upstream>,
}

#[derive(Debug, Deserialize)]
struct Limits {
    max_cents: i64,
    #[serde(default = "default_retries")]
    retries: u32,
}

#[derive(Debug, Deserialize)]
struct Upstream {
    name: String,
    url: String,
    #[serde(default = "default_timeout_ms")]
    timeout_ms: u64,
}

fn default_port() -> u16 {
    8080
}

fn default_retries() -> u32 {
    3
}

fn default_timeout_ms() -> u64 {
    1000
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let cfg: Config = match toml::from_str(&input) {
        Ok(cfg) => cfg,
        Err(_) => {
            println!("ERROR: config rejected");
            return;
        }
    };
    println!("SERVICE {} on port {}", cfg.name, cfg.port);
    println!("LIMIT {} cents, {} retries", cfg.limits.max_cents, cfg.limits.retries);
    for up in &cfg.upstream {
        println!("UPSTREAM {} {} {} ms", up.name, up.url, up.timeout_ms);
    }
}
'''
hints = [
  "`use serde::Deserialize;` — toml is a serde format like serde_json, so `toml::from_str::<Config>(&input)` builds the same kind of derived struct. A `[table]` is a struct field; `[[array_of_tables]]` is a `Vec<Struct>` field.",
  "A default that is not the type's `Default` is a function: `#[serde(default = \"default_port\")]` with `fn default_port() -> u16 { 8080 }`. Plain `#[serde(default)]` on the `Vec` makes a missing `[[upstream]]` an empty list.",
  "`toml::from_str` returns `Result<Config, toml::de::Error>`; a missing required key, a wrong type and a syntax error all land in `Err`. Match on it and print your own line — never `{}` the error.",
  "`match toml::from_str::<Config>(&input) { Ok(cfg) => cfg, Err(_) => { println!(\"ERROR: config rejected\"); return; } }`.",
]

