[[quest]]
id          = "rust.frameworks.03.serde-derive"
node        = 3
title       = "THE SHAPE OF THE WIRE"
difficulty  = 2
story       = "The card terminals on Yee Wo Street post their orders as JSON. The old reader found the amounts by counting commas, and a merchant with a comma in its name has been getting paid in the wrong column."
concepts    = ["serialization", "structs", "imports"]
requires    = ["rust.frameworks.02.thiserror-enum"]
map          = { x = 0.423, y = 0.242, kind = "quest" }
brief       = '''
Standard input is one JSON array of orders. Each order is an object with
`"id"` (a number), `"merchant"` (a string) and `"cents"` (a number).

Print one line per order, in the order they came, `<id> <merchant> <cents>`,
then `TOTAL <sum of cents>`.

```
input:  [{"id": 1, "merchant": "Lucky Mac", "cents": 3800},
         {"id": 2, "merchant": "Tsui Wah, Causeway Bay", "cents": 12500}]
output: 1 Lucky Mac 3800
        2 Tsui Wah, Causeway Bay 12500
        TOTAL 16300
```

Define `struct Order` with those three fields, `#[derive(Deserialize)]` it,
and let `serde_json::from_str::<Vec<Order>>` do the reading. The starter
splits on commas. Objects may have their keys in any order and any amount of
whitespace, and a string may contain a comma — that is the point.
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut total = 0i64;
    for item in input.split('}') {
        let item = item.trim().trim_start_matches(['[', ',']).trim().trim_start_matches('{');
        if item.is_empty() || item == "]" {
            continue;
        }
        let mut id = String::new();
        let mut merchant = String::new();
        let mut cents = 0i64;
        for field in item.split(',') {
            let (key, value) = field.split_once(':').unwrap();
            let value = value.trim().trim_matches('"');
            match key.trim().trim_matches('"') {
                "id" => id = value.to_string(),
                "merchant" => merchant = value.to_string(),
                "cents" => cents = value.parse().unwrap_or(0),
                _ => {}
            }
        }
        total += cents;
        println!("{id} {merchant} {cents}");
    }
    println!("TOTAL {total}");
}
'''
solution    = '''
use std::io::Read;

use serde::Deserialize;

#[derive(Debug, Deserialize)]
struct Order {
    id: u64,
    merchant: String,
    cents: i64,
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let orders: Vec<Order> = serde_json::from_str(&input).expect("orders are JSON");
    let mut total = 0i64;
    for order in &orders {
        total += order.cents;
        println!("{} {} {}", order.id, order.merchant, order.cents);
    }
    println!("TOTAL {total}");
}
'''
hints = [
  "`use serde::Deserialize;` and `#[derive(Deserialize)]` on the struct — the field names are the JSON keys, and the types say what each must be.",
  "`let orders: Vec<Order> = serde_json::from_str(&input)?;` — the type on the left is what tells serde what to build.",
  "Key order and whitespace are JSON's business, not yours; serde reads any object with those three keys. Printing is the same loop as before.",
]

