  "Step with `date.checked_add_days(Days::new(1)).unwrap()` until `!matches!(day.weekday(), Weekday::Sat | Weekday::Sun)`; the gap is `settles.signed_duration_since(value).num_days()`.",
  "`value.format(\"%d %b %Y %a\")` prints `02 Oct 2026 Fri` straight into `println!` — `%a` is the weekday's three-letter name.",
]

