id          = "rust.frameworks.04.serde-attributes"
node        = 4
title       = "WHAT THE BANK READS"
difficulty  = 3
story       = "The bank bounces the Yee Wo Street settlement file twice a week: every card that was never authorised goes out as `\"authCode\":null`, and the one terminal that posts no fee stops the reader before the file is written at all."
concepts    = ["serialization", "structs", "zero-values"]
requires    = ["rust.frameworks.03.serde-derive"]
map          = { x = 0.568, y = 0.131, kind = "quest" }
brief       = '''
Standard input is one JSON array of settlement records from the terminals.
Each record has `"terminalId"` (string), `"merchant"` (string),
`"amountCents"` (number), and may or may not have `"feeCents"` (number) and
`"authCode"` (string). Keys may come in any order.

Print one line per record, in input order: the record as the bank wants it,
compact JSON from `serde_json::to_string`, keys in this order and spelled
exactly so — `terminalId`, `merchant`, `amountCents`, `feeCents`, `authCode`.
A missing `feeCents` is written as `0`; a missing `authCode` is **left out**,
never written as `null`. Then `NET <sum of amountCents minus feeCents>`.

```
input:  [{"terminalId": "YW-07", "merchant": "Lucky Mac", "amountCents": 3800, "feeCents": 40, "authCode": "A1B2"},
         {"terminalId": "PS-02", "merchant": "Tsui Wah", "amountCents": 12500}]
output: {"terminalId":"YW-07","merchant":"Lucky Mac","amountCents":3800,"feeCents":40,"authCode":"A1B2"}
        {"terminalId":"PS-02","merchant":"Tsui Wah","amountCents":12500,"feeCents":0}
        NET 16260
```

One struct does both directions: `#[derive(Serialize, Deserialize)]` with
snake_case fields, `#[serde(rename_all = "camelCase")]` on the struct,
`#[serde(default)]` on `fee_cents`, and `auth_code: Option<String>` with
`#[serde(skip_serializing_if = "Option::is_none")]`. `to_string` writes the
fields in the order the struct declares them, so the output is exact. The
starter renames every field by hand, cannot read a record without a fee, and
writes `null`.
'''
starter     = '''
use std::io::Read;

use serde::{Deserialize, Serialize};

#[derive(Debug, Serialize, Deserialize)]
struct Settlement {
    #[serde(rename = "terminalId")]
    terminal_id: String,
    merchant: String,
    #[serde(rename = "amountCents")]
    amount_cents: i64,
    #[serde(rename = "feeCents")]
    fee_cents: i64,
    #[serde(rename = "authCode")]
    auth_code: Option<String>,
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let records: Vec<Settlement> = serde_json::from_str(&input).expect("records are JSON");
    let mut net = 0i64;
    for record in &records {
        net += record.amount_cents - record.fee_cents;
        println!("{}", serde_json::to_string(record).unwrap());
    }
    println!("NET {net}");
}
'''
solution    = '''
use std::io::Read;

use serde::{Deserialize, Serialize};

#[derive(Debug, Serialize, Deserialize)]
#[serde(rename_all = "camelCase")]
struct Settlement {
    terminal_id: String,
    merchant: String,
    amount_cents: i64,
    #[serde(default)]
    fee_cents: i64,
    #[serde(skip_serializing_if = "Option::is_none")]
    auth_code: Option<String>,
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let records: Vec<Settlement> = serde_json::from_str(&input).expect("records are JSON");
    let mut net = 0i64;
    for record in &records {
        net += record.amount_cents - record.fee_cents;
        println!("{}", serde_json::to_string(record).unwrap());
    }
    println!("NET {net}");
}
'''
hints = [
  "`use serde::{Deserialize, Serialize};` — one struct, both derives. `#[serde(rename_all = \"camelCase\")]` on the struct replaces every per-field `rename`.",
  "`#[serde(default)]` on `fee_cents: i64` fills a missing key with `i64::default()`, which is `0`. Without it a record with no fee is a deserialize error.",
  "An `Option<String>` already reads a missing key as `None`; it is the *writing* that needs `#[serde(skip_serializing_if = \"Option::is_none\")]`, or it serializes as `null`.",
  "`serde_json::to_string(record)` gives compact JSON with the struct's field order; `println!` it, one record per line.",
]

