[[quest]]
id          = "rust.frameworks.05.json-value-walk"
node        = 5
title       = "EVERY LEAF A LINE"
difficulty  = 3
story       = "A new terminal vendor on Percival Street posts a nested object nobody has written a struct for, and the support desk wants to see what is in it today, not after the struct."
concepts    = ["serialization", "recursion", "pattern-matching", "enums"]
requires    = ["rust.frameworks.04.serde-attributes"]
map          = { x = 0.724, y = 0.233, kind = "quest" }
brief       = '''
Standard input is one JSON document whose top level is an object or an
array. Print every leaf value as `<path> = <value>`, one per line.

* An object's keys are visited in **sorted order** (byte order of the key —
  which is how `serde_json::Value::Object` iterates); an array's elements in
  index order.
* The path is the keys joined with `.`, and `[i]` for an array index:
  `terminal.id`, `orders[0].cents`, `[1][0]` for an array inside a root
  array. Keys contain no dots or brackets.
* A string prints without its quotes. A number, `true`, `false` and `null`
  print as JSON writes them (`1.5` stays `1.5`, `null` is the word `null`).
* An empty object or empty array has no leaves and prints nothing.

```
input:  {"batch": "2024-06-01", "terminal": {"id": "YW-07", "online": true},
         "orders": [{"cents": 3800, "merchant": "Lucky Mac"}, {"cents": 250}], "note": null}
output: batch = 2024-06-01
        note = null
        orders[0].cents = 3800
        orders[0].merchant = Lucky Mac
        orders[1].cents = 250
        terminal.id = YW-07
        terminal.online = true
```

Parse with `serde_json::from_str::<serde_json::Value>` and write a recursive
`walk(path: &str, value: &Value)` that matches `Value::Object`,
`Value::Array` and the rest. The starter walks the top level only and prints
whatever it finds there, so a nested object comes out as one line of JSON
and a root array is a panic.
'''
starter     = '''
use std::io::Read;

use serde_json::Value;

fn show(value: &Value) -> String {
    match value.as_str() {
        Some(s) => s.to_string(),
        None => value.to_string(),
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let doc: Value = serde_json::from_str(&input).expect("input is JSON");
    let top = doc.as_object().expect("top level is an object");
    for (key, value) in top {
        println!("{key} = {}", show(value));
    }
}
'''
solution    = '''
use std::io::Read;

use serde_json::Value;

fn walk(path: &str, value: &Value) {
    match value {
        Value::Object(map) => {
            for (key, child) in map {
                let next = if path.is_empty() { key.clone() } else { format!("{path}.{key}") };
                walk(&next, child);
            }
        }
        Value::Array(items) => {
            for (i, child) in items.iter().enumerate() {
                walk(&format!("{path}[{i}]"), child);
            }
        }
        Value::String(s) => println!("{path} = {s}"),
        other => println!("{path} = {other}"),
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let doc: Value = serde_json::from_str(&input).expect("input is JSON");
    walk("", &doc);
}
'''
hints = [
  "`use serde_json::Value;` and `let doc: Value = serde_json::from_str(&input)?;` — `Value` is an enum: `Null`, `Bool`, `Number`, `String`, `Array(Vec<Value>)`, `Object(Map<String, Value>)`.",
  "Recursion carries the path: `fn walk(path: &str, value: &Value)`. For an object, `for (key, child) in map` is already in sorted key order; for an array, `iter().enumerate()` gives the index.",
  "The path grows one piece per level: `format!(\"{path}.{key}\")` unless `path` is empty (then just the key), and `format!(\"{path}[{i}]\")` for an index.",
  "`Value::String(s) => println!(\"{path} = {s}\")` prints a string bare; `other => println!(\"{path} = {other}\")` uses `Value`'s own `Display`, which is compact JSON — `null`, `true`, `1.5`.",
]

