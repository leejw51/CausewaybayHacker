cases = [
  { name = "tuesday", stdin = "{\"date\": \"2026-10-06\", \"transfers\": [\n  {\"from\": \"LUCKYMAC\", \"to\": \"BANK\", \"cents\": 3800},\n  {\"from\": \"SOGO\", \"to\": \"BANK\", \"cents\": 12500},\n  {\"from\": \"BANK\", \"to\": \"LUCKYMAC\", \"cents\": 300}]}\n", expect = "SETTLEMENT Tue 06 Oct 2026\nBANK 16000\nLUCKYMAC -3500\nSOGO -12500\nMOVED 3\n", visible = true },
  { name = "nothing-to-move", stdin = "{\"date\": \"2026-10-07\", \"transfers\": [{\"from\": \"A\", \"to\": \"B\", \"cents\": 5}, {\"from\": \"B\", \"to\": \"A\", \"cents\": 0}, {\"from\": \"C\", \"to\": \"C\", \"cents\": 1}]}", expect = "ERROR: transfer 2: nothing to move\n", visible = false },
  { name = "pays-itself", stdin = "{\"date\": \"2026-10-07\", \"transfers\": [{\"from\": \"BANK\", \"to\": \"BANK\", \"cents\": 10}]}", expect = "ERROR: transfer 1: BANK pays itself\n", visible = false },
  { name = "bad-date", stdin = "{\"date\": \"2026-13-01\", \"transfers\": [{\"from\": \"A\", \"to\": \"A\", \"cents\": 0}]}", expect = "ERROR: bad date 2026-13-01\n", visible = false },
  { name = "not-a-settlement", stdin = "[1, 2, 3]\n", expect = "ERROR: not a settlement\n", visible = false },
  { name = "empty-day", stdin = "{\"date\": \"2026-02-28\", \"transfers\": []}", expect = "SETTLEMENT Sat 28 Feb 2026\nMOVED 0\n", visible = false },
  { name = "many-accounts-net-zero", stdin = "{\"date\": \"2026-01-01\", \"transfers\": [{\"from\": \"X\", \"to\": \"Y\", \"cents\": 100}, {\"from\": \"Y\", \"to\": \"Z\", \"cents\": 100}, {\"from\": \"Z\", \"to\": \"X\", \"cents\": 100}, {\"from\": \"A\", \"to\": \"Z\", \"cents\": 1}]}", expect = "SETTLEMENT Thu 01 Jan 2026\nA -1\nX 0\nY 0\nZ 1\nMOVED 4\n", visible = false },
