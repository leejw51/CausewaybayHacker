Line one is `<TILLS>`, `1 <= TILLS <= 8`. Every line after it is a payment,
`<MERCHANT> <CENTS>` (a merchant token with no spaces, `CENTS > 0`). There
may be no payments at all.

Payment `i` (0-based, counting payment lines only) belongs to till
`i % TILLS`. Each till is a thread; each adds its payments into **one shared
ledger**, a `Mutex<HashMap<String, (i64, u32)>>` of total cents and count
