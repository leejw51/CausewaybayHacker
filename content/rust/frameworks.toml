map          = { x = 0.416, y = 0.337, kind = "quest" }
brief       = '''
Each line of standard input is a value date as `YYYY-MM-DD`. Blank lines are
ignored. For every date print one line:

```
<value date> -> <settlement date> +<days>
```

where the settlement date is the first day **after** the value date that is
a Monday to Friday (a Friday settles on Monday, a Saturday on Monday, a
Sunday on Monday), `<days>` is the number of calendar days between the two,
and both dates are printed as `%d %b %Y %a` — `03 Oct 2026 Sat`.

A line that is not a real date in that format — `2026-13-01`, `2026-02-29`,
`2026-04-31`, `yesterday` — prints `ERROR: bad date <line>` with the line's
text trimmed, and the program goes on to the next line.

```
input:  2026-10-02
        2026-10-03
        2026-10-07
        2026-13-01
output: 02 Oct 2026 Fri -> 05 Oct 2026 Mon +3
        03 Oct 2026 Sat -> 05 Oct 2026 Mon +2
        07 Oct 2026 Wed -> 08 Oct 2026 Thu +1
        ERROR: bad date 2026-13-01
```

Use `chrono::NaiveDate`: `parse_from_str` to read, `weekday()` to test,
`checked_add_days` to step, `signed_duration_since(...).num_days()` for the
gap, and `format` to print. Never read the clock. The starter has its own
month table and its own weekday formula, and one of them is wrong in leap
years.
'''
starter     = '''
use std::io::Read;

const MONTHS: [&str; 12] = [
    "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec",
];
const DAYS_IN_MONTH: [u32; 12] = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const WEEKDAYS: [&str; 7] = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

#[derive(Clone, Copy)]
struct Date {
    year: i32,
    month: u32,
    day: u32,
}

fn parse(text: &str) -> Option<Date> {
    let mut parts = text.split('-');
    let year = parts.next()?.parse().ok()?;
    let month = parts.next()?.parse().ok()?;
    let day = parts.next()?.parse().ok()?;
    if parts.next().is_some() || !(1..=12).contains(&month) || day == 0 {
        return None;
    }
    Some(Date { year, month, day })
}

// Zeller's congruence: 0 = Sunday.
fn weekday(d: Date) -> usize {
    let (mut y, mut m) = (d.year, d.month as i32);
    if m < 3 {
        m += 12;
        y -= 1;
    }
    let k = y % 100;
    let j = y / 100;
    let h = (d.day as i32 + 13 * (m + 1) / 5 + k + k / 4 + j / 4 + 5 * j) % 7;
    ((h + 6) % 7) as usize
}

fn next_day(d: Date) -> Date {
    if d.day < DAYS_IN_MONTH[d.month as usize - 1] {
        Date { day: d.day + 1, ..d }
    } else if d.month < 12 {
        Date { year: d.year, month: d.month + 1, day: 1 }
    } else {
        Date { year: d.year + 1, month: 1, day: 1 }
    }
}

fn show(d: Date) -> String {
    format!("{:02} {} {} {}", d.day, MONTHS[d.month as usize - 1], d.year, WEEKDAYS[weekday(d)])
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        let text = line.trim();
        if text.is_empty() {
            continue;
        }
        let Some(value) = parse(text) else {
            println!("ERROR: bad date {text}");
            continue;
        };
        let mut settles = next_day(value);
        let mut gap = 1;
        while weekday(settles) == 0 || weekday(settles) == 6 {
            settles = next_day(settles);
            gap += 1;
        }
        println!("{} -> {} +{}", show(value), show(settles), gap);
    }
}
'''
solution    = '''
use std::io::Read;

use chrono::{Datelike, Days, NaiveDate, Weekday};

fn next_business_day(value: NaiveDate) -> NaiveDate {
    let mut day = value;
    loop {
        day = day.checked_add_days(Days::new(1)).expect("date in range");
        if !matches!(day.weekday(), Weekday::Sat | Weekday::Sun) {
            return day;
        }
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        let text = line.trim();
        if text.is_empty() {
            continue;
        }
        let value = match NaiveDate::parse_from_str(text, "%Y-%m-%d") {
            Ok(date) => date,
            Err(_) => {
                println!("ERROR: bad date {text}");
                continue;
            }
        };
        let settles = next_business_day(value);
        let gap = settles.signed_duration_since(value).num_days();
        println!(
            "{} -> {} +{}",
            value.format("%d %b %Y %a"),
            settles.format("%d %b %Y %a"),
            gap
        );
    }
}
'''
