id          = "rust.frameworks.02.thiserror-enum"
node        = 2
title       = "AN ERROR WITH A NAME"
difficulty  = 2
story       = "The transfer service answers every refusal with the same string, 'bad transfer', and the support desk two floors up has started phoning the engineers to ask which kind."
concepts    = ["error-handling", "enums", "traits"]
