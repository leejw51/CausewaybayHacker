brief       = '''
Standard input is transfers, one per line, `<ACCOUNT> <CENTS>` — the account
is one token with no spaces, the cents a non-negative integer. Blank lines
are ignored. Transfers for one account may appear anywhere in the input.

Print one line per account, accounts in ascending string order, as
`<ACCOUNT> <a>+<b>+...=<sum>` — the amounts in the order they appeared in the
input, joined with `+`, then `=` and their sum (a single transfer prints as
`C-031 80=80`). Then one footer line, `<k> accounts, <total> cents`, with the
number of distinct accounts and the sum of everything. Empty input prints
only `0 accounts, 0 cents`.

```
input:  B-204 500
        A-117 1200
        B-204 250
        C-031 80
        A-117 60
output: A-117 1200+60=1260
        B-204 500+250=750
        C-031 80=80
        3 accounts, 2090 cents
```

This is `itertools::Itertools`: `sorted_by_key` to bring each account's
transfers together (it is a stable sort, so the amounts keep their input
order), `chunk_by` to walk the runs, `join` to print them, `unique` to count
the accounts. `chunk_by` only groups *adjacent* equal keys — that is the
whole reason the sort comes first. The starter does the adjacent grouping
by hand on the unsorted input.
'''
