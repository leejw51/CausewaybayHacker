solution    = '''
use std::io::Read;

use indexmap::IndexMap;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut counts: IndexMap<&str, u64> = IndexMap::new();
    for line in input.lines() {
        let merchant = line.trim();
        if merchant.is_empty() {
            continue;
        }
        *counts.entry(merchant).or_insert(0) += 1;
    }
    for (merchant, count) in &counts {
        println!("{merchant} {count}");
    }
    println!("DISTINCT {}", counts.len());
    if let Some((first, _)) = counts.get_index(0) {
        println!("FIRST {first}");
    }
    let mut top: Option<(&str, u64)> = None;
    for (merchant, count) in &counts {
        if top.map_or(true, |(_, best)| *count > best) {
            top = Some((merchant, *count));
        }
    }
    if let Some((merchant, count)) = top {
        println!("TOP {merchant} {count}");
    }
}
'''
