spaces, unique) and an amount in cents, `0 <= CENTS <= 10_000_000_000`.

The fee on one payment is **1.5% of the amount, rounded up to the next
whole cent, plus 30 cents flat**. In integers: `(cents * 15 + 999) / 1000 + 30`.
A 199-cent payment is 2.985 cents of rate, rounded up to 3, plus 30 — a fee
of 33. A zero-cent payment still pays the flat 30.

