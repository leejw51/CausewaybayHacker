solution    = '''
use std::io::Read;
use std::time::Duration;

use tokio::time::{sleep, timeout};

async fn primary(id: u64, speed: &str) -> u64 {
    let wait = if speed == "slow" { Duration::from_secs(3) } else { Duration::from_millis(10) };
    sleep(wait).await;
    id * 37 % 1000
}

async fn backup(id: u64, speed: &str) -> u64 {
    let wait = if speed == "slow" { Duration::from_secs(3) } else { Duration::from_millis(100) };
    sleep(wait).await;
    id * 37 % 1000
}

/// Whichever acquirer answers first; the other future is dropped.
async fn authorise(id: u64, primary_speed: &str, backup_speed: &str) -> (&'static str, u64) {
    tokio::select! {
        code = primary(id, primary_speed) => ("primary", code),
        code = backup(id, backup_speed) => ("backup", code),
    }
}

#[tokio::main]
async fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    for line in input.lines() {
        let mut parts = line.split_whitespace();
        let Some(id) = parts.next() else { continue };
        let id: u64 = id.parse().unwrap();
        let primary_speed = parts.next().unwrap();
        let backup_speed = parts.next().unwrap();
        match timeout(Duration::from_secs(1), authorise(id, primary_speed, backup_speed)).await {
            Ok((who, code)) => println!("DONE {id} {who} {code}"),
            Err(_elapsed) => println!("TIMEOUT {id}"),
        }
    }
}
'''
hints = [
  "`use tokio::time::{sleep, timeout};` — `timeout(Duration::from_secs(1), fut).await` gives `Result<T, Elapsed>`, and dropping the inner future is what cancels it.",
  "`tokio::select! { a = fut_a => ..., b = fut_b => ... }` polls both and runs the arm of the first to finish; the other future is dropped there and then.",
  "Put the `select!` in an `async fn authorise(...) -> (&'static str, u64)` and wrap *that* in the timeout, so one deadline covers both acquirers.",
  "`match timeout(..).await { Ok((who, code)) => println!(\"DONE {id} {who} {code}\"), Err(_) => println!(\"TIMEOUT {id}\") }`.",
]

