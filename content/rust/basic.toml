solution    = '''
use std::io::Read;

struct Till {
    items: Vec<(String, i64)>,
}

impl Till {
    fn new() -> Till {
        Till { items: Vec::new() }
    }

    fn add(&mut self, name: &str, cents: i64) {
        self.items.push((name.to_string(), cents));
    }

    fn total(&self) -> i64 {
        self.items.iter().map(|(_, cents)| cents).sum()
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut till = Till::new();
    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let name = parts.next().unwrap();
        let cents: i64 = parts.next().unwrap().parse().unwrap();
        till.add(name, cents);
    }

    for (name, cents) in &till.items {
        println!("{} {}", name, cents);
    }
    println!("TOTAL {}", till.total());
}
'''
hints = [
  "A Vec of (String, i64) is enough. The struct is there so the till owns its own lines.",
  "add changes the till, so it takes &mut self; total only reads, so it takes &self.",
  "Iterating &till.items borrows, which is what you want — printing should not empty the till.",
]

