# RUST LAND — BASIC. The morning walk, Jardine's Bazaar to the Percival Street
# kiosk. The grammar road, second half: VERY BASIC asked the plain grammar
# (types, containers, a struct, a closure, a thread); this road drills the
# grammar that is Rust's own and that a live coding screen assumes you have
# in your fingers — ownership and the move, `&` and `&mut`, the exchange
# (`mem::swap`, `mem::take`), slices, `String` against `&str`, chars and
# bytes, `Option`, `Result` and `?`, `match`, iterator chains, the entry API,
# comparators, a min-heap through `Reverse`, a derived `Ord`, fast stdin,
# formatted stdout, overflow, lifetimes on a function and on a struct, a
# trait, a generic bound, `Box<dyn Trait>`, `Rc<RefCell>`, closure kinds —
# and then the concurrency grammar: threads, `Arc<Mutex>`, atomics and
# `RwLock`, an `mpsc` channel, many producers and one consumer, and a worker
# pool at the boss: producers, consumers, one hatch.
#
# Every node explains one construct, shows its syntax the way a cheat-sheet
# card would, and hands over a whole program with a hole of one to four
# lines where that construct goes. The player types the idiom; the tests
# only check that it ran. Nothing here is timed, and nothing here is long:
# verify_pack refuses a basic solution that adds more than four lines over
# its starter. Applying this grammar to whole programs is the ADVANCED road;
# doing it under a clock is HACKER.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "rust.basic"
land = "rust"
category = "basic"
version = 3

