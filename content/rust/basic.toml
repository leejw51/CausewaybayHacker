[[quest]]
id          = "rust.basic.05.exchange"
node        = 5
title       = "THE EXCHANGE"
difficulty  = 2
story       = "Two tills at Jardine's Bazaar swap drawers at the shift change, and the old drawer is lifted out and an empty one dropped in its place. Nothing is copied; things change hands."
concepts    = ["ownership", "mutability", "borrowing"]
requires    = ["rust.basic.04.clone"]
map          = { x = 0.752, y = 0.075, kind = "quest" }
brief       = '''
`std::mem` exchanges values without copying them. `swap(&mut a, &mut b)`
trades what two names hold. `take(&mut a)` moves the value out and leaves
the type's default behind — an empty `String`, an empty `Vec`, `0` — so
you can own something that lives inside a `&mut`. `replace(&mut a, v)`
is the same with a value of your choosing left behind.

```
std::mem::swap(&mut a, &mut b);
let taken = std::mem::take(&mut a);
```

Two lines are read into `a` and `b`. Type the swap and the take where the
`// FILL` comments are.

```
input:  LEFT
        RIGHT
output: RIGHT LEFT
        [RIGHT] []
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut a = lines.next().unwrap_or("").trim().to_string();
    let mut b = lines.next().unwrap_or("").trim().to_string();

    // FILL: exchange a and b, no third variable, no clone
    // ANSWER: std::mem::swap(&mut a, &mut b);
    println!("{} {}", a, b);

    // FILL: take a out, leaving an empty String behind
    // ANSWER: let taken = std::mem::take(&mut a);
    let taken = String::new();
    println!("[{}] [{}]", taken, a);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut a = lines.next().unwrap_or("").trim().to_string();
    let mut b = lines.next().unwrap_or("").trim().to_string();

    std::mem::swap(&mut a, &mut b);
    println!("{} {}", a, b);

    let taken = std::mem::take(&mut a);
    println!("[{}] [{}]", taken, a);
}
'''
hints = [
  "std::mem::swap(&mut a, &mut b); then let taken = std::mem::take(&mut a);",
  "Both take &mut: the values stay where they are and only the contents move. After take, a is an empty String, not a moved-out one — it is still usable.",
]

