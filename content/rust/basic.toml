brief       = '''
Two integers divided give an integer: `7 / 2` is `3`, and `7 % 2` is the
remainder, `1`. To get a decimal you convert first — `as f64` turns an
integer into a floating-point number — and `{:.2}` in the format string
prints it with exactly two digits after the point.

```
println!("{:.2}", a as f64 / b as f64);
```

`a` and `b` are read and the integer division and the remainder are
printed. Type that line where the `// FILL` comment is.

```
input:  7 2
output: 3
        1
        3.50
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();
    let (a, b) = (nums[0], nums[1]);

    println!("{}", a / b);
    println!("{}", a % b);
    // FILL: print a divided by b as an f64, with two decimals
    // ANSWER: println!("{:.2}", a as f64 / b as f64);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();
    let (a, b) = (nums[0], nums[1]);

    println!("{}", a / b);
    println!("{}", a % b);
    println!("{:.2}", a as f64 / b as f64);
}
'''
hints = [
  "println!(\"{:.2}\", a as f64 / b as f64);",
  "Convert both sides with `as f64` before dividing, or the division is done on integers and the decimals are already gone.",
]

