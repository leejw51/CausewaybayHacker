use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    println!("{}", nums[0]);
    println!("{}", nums[nums.len() - 1]);

    let middle: i64 = if nums.len() > 2 {
