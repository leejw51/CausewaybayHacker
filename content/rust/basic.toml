        1 2 3 4 5
output: 1 2 3 4 5
        SUM 15
        LAST 5
```

The starter does not compile, and the error is the reason `Box` exists. Write
`next: Option<Entry>` and the compiler has to lay `Entry` out in memory: it
needs `8` bytes for `cents` plus however big an `Entry` is — which is the
thing it is trying to work out. E0072, *recursive type has infinite size*.

A `Box<Entry>` is a pointer to a heap allocation, and a pointer has a size the
compiler already knows. It owns what it points at: exactly one owner, freed
when the `Box` is dropped, no counting and nothing shared. `Option<Box<Entry>>`
is the end of the chain and a node in it, in one pointer-sized value — the
`None` is stored as the null address rather than as an extra tag byte, so it
costs nothing over the `Box` alone.
'''
