brief       = '''
`&` lends. A function that takes `name: &str` only *looks* at the string;
the caller keeps it and can use it afterwards. `&names[i]` is a borrow of
one element, and a `&String` turns into a `&str` on its own at the call.

```
total += width(&names[i]);
```

`width` and both `println!`s are written. Type the call where the `// FILL`
comment is, lending each name with `&`. The second line proves the names
are still yours after the loop.

```
input:  MEI
        BO
        ALEX
output: 9
        MEI,BO,ALEX
```
'''
starter     = '''
use std::io::Read;

fn width(name: &str) -> usize {
    name.chars().count()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let names: Vec<String> = input
        .lines()
        .map(|l| l.trim().to_string())
        .filter(|l| !l.is_empty())
        .collect();

    let mut total = 0;
    for i in 0..names.len() {
        // FILL: add the width of names[i], lending it with &
        // ANSWER: total += width(&names[i]);
        let _ = i;
    }
    println!("{}", total);
    println!("{}", names.join(","));
}
'''
solution    = '''
use std::io::Read;

fn width(name: &str) -> usize {
    name.chars().count()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let names: Vec<String> = input
        .lines()
        .map(|l| l.trim().to_string())
        .filter(|l| !l.is_empty())
        .collect();

    let mut total = 0;
    for i in 0..names.len() {
        total += width(&names[i]);
    }
    println!("{}", total);
    println!("{}", names.join(","));
}
'''
hints = [
  "total += width(&names[i]); — the ampersand goes on the argument.",
  "width wants a &str; a &String coerces to one at the call, so &names[i] is enough.",
]

