the original `v` is never changed.

```
let mut middle: Vec<i64> = v[1..3].to_vec();
middle.extend_from_slice(&v);
```

`v` is read from the input. Type those two lines in place of the two
placeholders.

```
input:  1 2 3 4
output: 2 3 1 2 3 4
        6
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let v: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    // FILL: middle is a copy of v[1..3]
    // ANSWER: let mut middle: Vec<i64> = v[1..3].to_vec();
    let mut middle: Vec<i64> = Vec::new();
