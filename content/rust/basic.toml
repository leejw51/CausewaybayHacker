brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <KM>`.

The base fare is `500 + 100 * KM` cents. For each line print one of:

* `ADULT` — the base fare
* `STUDENT` — half the base fare, integer division
* `SENIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

Model the rider as an `enum` with four variants, one of which carries the
unrecognised tag, and decide the fare with a single `match`.
'''
starter     = '''
use std::io::Read;

enum Rider {
    Adult,
    Student,
    Senior,
    // one more variant, and it has to carry the tag it did not recognise
}

fn classify(tag: &str) -> Rider {
    let _ = tag;
    todo!()
}

fn fare(rider: &Rider, km: i64) -> String {
    let _base = 500 + 100 * km;
    let _ = rider;
    todo!()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let tag = parts.next().unwrap();
        let km: i64 = parts.next().unwrap().parse().unwrap();
