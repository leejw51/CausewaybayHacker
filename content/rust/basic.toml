  "parts.as_slice() is what turns the Vec into something a slice pattern can match against.",
  "An `if` after the pattern is a match guard — it separates two arms that share a shape.",
  "`[command, ..]` binds the first element and ignores the rest; `[]` is the empty line you still have to cover.",
]

