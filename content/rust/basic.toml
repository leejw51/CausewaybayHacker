node        = 27
title       = "THE AUTOCOMPLETE"
difficulty  = 4
story       = "The Percival Street phone kiosk, and the ghost text is back, offering a tree it has seen a thousand times. It has no completion for one you grow yourself, node by node, and the tree stays empty until you do."
concepts    = ["trees", "recursion", "structs"]
requires    = ["rust.basic.17.threads"]
map          = { x = 0.818, y = 0.870, kind = "boss" }
brief       = '''
A binary search tree is a `Node` with a value and two optional children,
`Option<Box<Node>>`: `None` is an empty subtree, `Some(Box::new(…))` a
real one. Inserting is recursive — an empty subtree becomes a new leaf; a
real one hands the value down the side it belongs on and stores the
subtree that comes back. `.take()` moves a child out of its `Option` so
it can be handed to the recursive call and put back.

```
if value < n.value {
    n.left = insert(n.left.take(), value);
} else {
    n.right = insert(n.right.take(), value);
}
```

`Node`, `inorder`, `height`, `main` and the shape of `insert` are written,
down to that `if … else`. Type the two assignment lines where the `// FILL`
comments are.

```
input:  5 3 8 1 4
output: 1 3 4 5 8
        3
```
'''
starter     = '''
use std::io::Read;

struct Node {
    value: i64,
    left: Option<Box<Node>>,
    right: Option<Box<Node>>,
}

fn insert(root: Option<Box<Node>>, value: i64) -> Option<Box<Node>> {
    match root {
        None => Some(Box::new(Node { value, left: None, right: None })),
        Some(mut n) => {
            if value < n.value {
                // FILL: insert into the left child, and store what comes back
                // ANSWER: n.left = insert(n.left.take(), value);
            } else {
                // FILL: the same on the right
                // ANSWER: n.right = insert(n.right.take(), value);
            }
            Some(n)
        }
    }
}

fn inorder(node: &Option<Box<Node>>, out: &mut Vec<i64>) {
    if let Some(n) = node {
        inorder(&n.left, out);
        out.push(n.value);
        inorder(&n.right, out);
    }
}

fn height(node: &Option<Box<Node>>) -> i64 {
    match node {
        None => 0,
        Some(n) => 1 + height(&n.left).max(height(&n.right)),
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let mut root: Option<Box<Node>> = None;
    for &x in &nums {
        root = insert(root, x);
    }

    let mut out = Vec::new();
    inorder(&root, &mut out);
    let line: Vec<String> = out.iter().map(|x| x.to_string()).collect();
    println!("{}", line.join(" "));
    println!("{}", height(&root));
}
'''
solution    = '''
use std::io::Read;

struct Node {
    value: i64,
    left: Option<Box<Node>>,
    right: Option<Box<Node>>,
}

fn insert(root: Option<Box<Node>>, value: i64) -> Option<Box<Node>> {
    match root {
        None => Some(Box::new(Node { value, left: None, right: None })),
        Some(mut n) => {
            if value < n.value {
                n.left = insert(n.left.take(), value);
            } else {
                n.right = insert(n.right.take(), value);
            }
            Some(n)
        }
    }
}

fn inorder(node: &Option<Box<Node>>, out: &mut Vec<i64>) {
    if let Some(n) = node {
        inorder(&n.left, out);
        out.push(n.value);
        inorder(&n.right, out);
    }
}

fn height(node: &Option<Box<Node>>) -> i64 {
    match node {
        None => 0,
        Some(n) => 1 + height(&n.left).max(height(&n.right)),
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let mut root: Option<Box<Node>> = None;
    for &x in &nums {
        root = insert(root, x);
    }

    let mut out = Vec::new();
    inorder(&root, &mut out);
    let line: Vec<String> = out.iter().map(|x| x.to_string()).collect();
    println!("{}", line.join(" "));
    println!("{}", height(&root));
}
'''
hints = [
  "n.left = insert(n.left.take(), value); — and n.right = insert(n.right.take(), value);",
  "`take()` leaves `None` behind and gives you the child to pass down; assigning the call's result puts the grown subtree back.",
]

