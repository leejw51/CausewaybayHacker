# ---------------------------------------------------------------- 18  BOSS
[[quest]]
id          = "rust.basic.18.traits"
node        = 18
title       = "THE AUTOCOMPLETE"
difficulty  = 4
story       = "The Percival Street phone kiosk finishes every line before you have one. It has no completion for a trait you named yourself."
concepts    = ["traits", "structs", "generics"]
requires    = ["rust.basic.17.testing", "rust.basic.13.combinators"]
map          = { x = 0.949, y = 0.868, kind = "boss" }
brief       = '''
Standard input is a count `n`, then `n` lines, each either

* `SHOP <NAME> <FLOOR>`
* `STOP <ROUTE>` — `ROUTE` is a number

Print one line per sign as `<tag> <rendering>`, then `SIGNS <n>`:

* a `Shop` renders as `<NAME> / F<FLOOR>` and its tag is `SIGN`
* a `Stop` renders as its route number and its tag is `TRAM`

```
input:  3
        SHOP HYSAN 4
        STOP 2
        SHOP SOGO 1
output: SIGN HYSAN / F4
        TRAM 2
        SIGN SOGO / F1
        SIGNS 3
```

Declare one trait and implement it for two different structs:

```
trait Sign {
    fn render(&self) -> String;      // required: no body, every implementor writes one
    fn tag(&self) -> &'static str { "SIGN" }   // provided: an implementor gets this free
}
```

`tag` is a **default method**. `Shop` says nothing about it and gets `SIGN`;
`Stop` writes its own and gets `TRAM`. That is the half of traits people forget
in an interview: a trait is not only a list of signatures, it can carry
behaviour, and overriding is opt-in.

Print through **one** function, `fn show<T: Sign>(sign: &T)`. The bound is the
contract — `show` knows nothing about `Shop` or `Stop`, only that whatever it
was handed has `render` and `tag`. The compiler stamps out one copy of `show`
per concrete type and the calls are direct.

The starter does not compile. The trait is declared and the structs exist, and
that buys you nothing on its own: `show(&Shop { .. })` is E0277, *the trait
bound `Shop: Sign` is not satisfied*. Declaring a trait and implementing it are
two separate acts, and in Rust the second one is always written out.

Both signs in one `Vec` would be a different mechanism — `Box<dyn Sign>`, a
pointer plus a vtable, looked up at run time. You do not need it here, because
at every call site the concrete type is still visible. That is the next map's
question, and knowing which of the two you are holding is what it asks.
'''
starter     = '''
use std::io::Read;

trait Sign {
    fn render(&self) -> String;

    fn tag(&self) -> &'static str {
        "SIGN"
    }
}

struct Shop {
    name: String,
    floor: i64,
}

struct Stop {
    route: i64,
}

// impl Sign for Shop { ... }
// impl Sign for Stop { ... }   and Stop does not want the default tag

fn show<T: Sign>(sign: &T) {
    println!("{} {}", sign.tag(), sign.render());
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "SHOP" => {
                let name = parts.next().unwrap().to_string();
                let floor: i64 = parts.next().unwrap().parse().unwrap();
                show(&Shop { name, floor });
            }
            _ => {
                let route: i64 = parts.next().unwrap().parse().unwrap();
                show(&Stop { route });
            }
        }
    }

    println!("SIGNS {}", n);
}
'''
solution    = '''
use std::io::Read;

trait Sign {
    /// Required: no body here, so every implementor has to supply one.
    fn render(&self) -> String;

    /// Provided: an implementor gets this unless it says otherwise.
    fn tag(&self) -> &'static str {
        "SIGN"
    }
}

struct Shop {
    name: String,
    floor: i64,
}

struct Stop {
    route: i64,
}

impl Sign for Shop {
    fn render(&self) -> String {
        format!("{} / F{}", self.name, self.floor)
    }
    // tag is not written here, so Shop uses the default
}

impl Sign for Stop {
    fn render(&self) -> String {
        self.route.to_string()
    }

    fn tag(&self) -> &'static str {
        "TRAM"
    }
}

/// One function, two types. The bound is everything it knows about T.
fn show<T: Sign>(sign: &T) {
    println!("{} {}", sign.tag(), sign.render());
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "SHOP" => {
                let name = parts.next().unwrap().to_string();
                let floor: i64 = parts.next().unwrap().parse().unwrap();
                show(&Shop { name, floor });
            }
            _ => {
                let route: i64 = parts.next().unwrap().parse().unwrap();
                show(&Stop { route });
            }
        }
    }

    println!("SIGNS {}", n);
}
'''
hints = [
  "impl Sign for Shop goes outside the struct. The trait says what; the impl says how; and the compiler will not infer the second from the first.",
  "Leave tag out of Shop's impl entirely and it takes the trait's version. Write it in Stop's impl and Stop's wins. That is the whole of what a default method is.",
  "show<T: Sign>(sign: &T) is generic, so the type has to be known where it is called — which is inside the match arm, while you can still see what you just built.",
  "A single Vec holding both would need Box<dyn Sign>, and that is a different mechanism with a run-time lookup. You are not being asked for it, and reaching for it here would be the wrong answer to a question about traits.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "three-signs", stdin = "3\nSHOP HYSAN 4\nSTOP 2\nSHOP SOGO 1\n", expect = "SIGN HYSAN / F4\nTRAM 2\nSIGN SOGO / F1\nSIGNS 3\n", visible = true },
  { name = "one-stop",    stdin = "1\nSTOP 116\n",                            expect = "TRAM 116\nSIGNS 1\n",                                  visible = false },
  { name = "two-shops",   stdin = "2\nSHOP LUCKYMAC 0\nSHOP TIMES 9\n",      expect = "SIGN LUCKYMAC / F0\nSIGN TIMES / F9\nSIGNS 2\n",      visible = false },
  { name = "none",        stdin = "0\n",                                       expect = "SIGNS 0\n",                                             visible = false },
]
