id          = "rust.basic.02.bindings"
node        = 2
title       = "THE FARE BOARD"
difficulty  = 1
story       = "The tram-stop board on Percival Street shows one number and then two blanks where the day rate and the monthly used to be."
concepts    = ["io", "bindings", "types"]
requires    = ["rust.basic.01.first-light"]
map          = { x = 0.247, y = 0.058, kind = "quest" }
brief       = '''
A `let` gives a value a name. The type can be written after a colon, and
`println!("{}", …)` prints whatever is in the braces, followed by a newline.
Arithmetic on an `i64` is written the way it is on paper.

```
println!("{}", n * n);
```

`n` is read and the first two lines are printed for you. Type that line
where the `// FILL` comment is: the third `println!`, `n` times itself.

```
input:  12
output: 12
        24
        144
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let n: i64 = input.trim().parse().unwrap();

    println!("{}", n);
    println!("{}", n * 2);
    // FILL: print n multiplied by itself
    // ANSWER: println!("{}", n * n);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let n: i64 = input.trim().parse().unwrap();

    println!("{}", n);
    println!("{}", n * 2);
    println!("{}", n * n);
}
'''
hints = [
  "println!(\"{}\", n * n);",
  "The two lines above it are the same shape; only the expression in the second argument changes.",
]

