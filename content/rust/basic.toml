use std::io::Read;
use std::num::ParseIntError;

fn parse_all(line: &str) -> Result<Vec<i64>, ParseIntError> {
    let mut out = Vec::new();
    for tok in line.split_whitespace() {
        out.push(tok.parse::<i64>()?);
    }
    Ok(out)
}

