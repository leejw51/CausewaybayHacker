solution    = '''
use std::io::Read;
use std::thread;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let mut handles = Vec::new();
    for &x in &nums {
        handles.push(thread::spawn(move || x * x));
    }

    let mut squares: Vec<i64> = Vec::new();
    for h in handles {
        squares.push(h.join().unwrap());
    }

    let out: Vec<String> = squares.iter().map(|x| x.to_string()).collect();
    println!("{}", out.join(" "));
    println!("{}", squares.iter().sum::<i64>());
}
'''
