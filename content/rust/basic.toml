brief       = '''
A `&str` can be sliced by byte range: `&s[..3]` is the first three bytes,
borrowed from `s`, not copied. `String::from(head)` makes an owned copy that
can grow, and `push_str` appends to it in place. (Ranges are in bytes, so
this is for ASCII text; a range that cuts a multi-byte character panics.)

```
let head: &str = &s[..3];
t.push_str("-lane");
```

`s` is the trimmed input and `t` is made from `head`. Type the slice where
the first `// FILL` is and the append where the second is.

```
input:  percival
output: per
        per-lane
        8
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let s = input.trim();

    // FILL: head is the first three bytes of s
    // ANSWER: let head: &str = &s[..3];
    let head: &str = "";
    let mut t = String::from(head);
    // FILL: append "-lane" to t
    // ANSWER: t.push_str("-lane");
    println!("{}", head);
    println!("{}", t);
    println!("{}", s.len());
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let s = input.trim();

    let head: &str = &s[..3];
    let mut t = String::from(head);
    t.push_str("-lane");
    println!("{}", head);
    println!("{}", t);
    println!("{}", s.len());
}
'''
hints = [
