brief       = '''
Standard input is a count `n`, then `n` lines of `<TYPE> <KM>`.

The base fare is `500 + 100 * KM` cents. For each line print one of:

* `ADULT` — the base fare
* `STUDENT` — half the base fare, integer division
* `SENIOR` — always `200`
* anything else — `UNKNOWN <TYPE>`

```
input:  3
        ADULT 4
        STUDENT 4
        SENIOR 4
output: 900
        450
        200
```

Model the rider as an `enum` with four variants, one of which carries the
unrecognised tag, and decide the fare with a single `match`.
'''
starter     = '''
