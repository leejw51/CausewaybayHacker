    let board: Arc<RwLock<Vec<i64>>> = Arc::new(RwLock::new(Vec::new()));

    let mut handles = Vec::new();
    for &x in &nums {
        let hits = Arc::clone(&hits);
        let board = Arc::clone(&board);
        handles.push(thread::spawn(move || {
            hits.fetch_add(1, Ordering::SeqCst);
            board.write().unwrap().push(x);
        }));
    }
    for h in handles {
        h.join().unwrap();
    }

    let mut seen = board.read().unwrap().clone();
    seen.sort();
    let out: Vec<String> = seen.iter().map(|x| x.to_string()).collect();
    println!("{}", out.join(" "));
    println!("{}", hits.load(Ordering::SeqCst));
}
'''
