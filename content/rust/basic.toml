[[quest]]
id          = "rust.basic.03.mut-borrow"
node        = 3
title       = "LENT TO BE CHANGED"
difficulty  = 1
story       = "The Lucky Mac kiosk raises every price on the board by the same amount. The board never leaves the wall; the hand that changes it is borrowed."
concepts    = ["borrowing", "mutability", "functions"]
requires    = ["rust.basic.02.borrow"]
map          = { x = 0.422, y = 0.069, kind = "quest" }
brief       = '''
`&mut` lends for changing. A function that takes `prices: &mut Vec<i64>`
can alter the caller's vector in place; the caller writes `&mut prices`
at the call, and `prices` itself must be `let mut`. Inside, `iter_mut()`
hands out `&mut i64`s, and `*p` is the number behind one.

```
*p += by;
bump(&mut prices, by);
```

`bump` and the printing are written. Type the two lines where the `// FILL`
comments are: the change inside `bump`, and the call that lends the vector.

```
input:  3
        10 20 30
output: 13 23 33
```
'''
starter     = '''
use std::io::Read;

fn bump(prices: &mut Vec<i64>, by: i64) {
    for p in prices.iter_mut() {
        // FILL: add by to the number p points at
        // ANSWER: *p += by;
        let _ = p;
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut it = input.split_whitespace().map(|t| t.parse::<i64>().unwrap());
    let by = it.next().unwrap();
    let mut prices: Vec<i64> = it.collect();

    // FILL: lend prices mutably to bump, with by
    // ANSWER: bump(&mut prices, by);
    let _ = by;

    let out: Vec<String> = prices.iter().map(|p| p.to_string()).collect();
    println!("{}", out.join(" "));
}
'''
solution    = '''
use std::io::Read;

fn bump(prices: &mut Vec<i64>, by: i64) {
    for p in prices.iter_mut() {
        *p += by;
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut it = input.split_whitespace().map(|t| t.parse::<i64>().unwrap());
    let by = it.next().unwrap();
    let mut prices: Vec<i64> = it.collect();

    bump(&mut prices, by);

    let out: Vec<String> = prices.iter().map(|p| p.to_string()).collect();
    println!("{}", out.join(" "));
}
'''
hints = [
  "*p += by; inside the loop, then bump(&mut prices, by); in main.",
  "p is a &mut i64: the star reaches through it. The call needs &mut, not &, and prices was declared mut for exactly this.",
]

