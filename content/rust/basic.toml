solution    = '''
use std::io::Read;

trait Sign {
    fn render(&self) -> String;
}

struct Shop {
    name: String,
    floor: i64,
}

struct Stop {
    route: String,
}

impl Sign for Shop {
    fn render(&self) -> String {
        format!("{} / F{}", self.name, self.floor)
    }
}

impl Sign for Stop {
    fn render(&self) -> String {
        format!("TRAM {}", self.route)
    }
}

fn show(signs: &[Box<dyn Sign>]) {
    for sign in signs {
        println!("{}", sign.render());
    }
    println!("SIGNS {}", signs.len());
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let n: usize = lines.next().unwrap().trim().parse().unwrap();

    let mut signs: Vec<Box<dyn Sign>> = Vec::new();
    for _ in 0..n {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "SHOP" => {
                let name = parts.next().unwrap().to_string();
                let floor: i64 = parts.next().unwrap().parse().unwrap();
                signs.push(Box::new(Shop { name, floor }));
            }
            _ => {
                let route = parts.next().unwrap().to_string();
                signs.push(Box::new(Stop { route }));
            }
        }
    }

    show(&signs);
}
'''
hints = [
  "impl Sign for Shop goes outside the struct; the trait says what, the impl says how.",
  "Box<dyn Sign> is how two different types live in one Vec — the size is the box's, not theirs.",
  "show does not need to know which is which. That is the whole reason the trait is there.",
]

