}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let amounts: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    // build the chain in arrival order, walk it, then sum it recursively
    let head: Option<Entry> = None;
    let _ = (head, amounts, sum);

    println!("-");
    println!("SUM 0");
    println!("LAST NONE");
