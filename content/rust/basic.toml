brief       = '''
`&v[a..b]` is a slice: a borrowed window onto part of a `Vec`, from `a`
up to but not including `b`, with no copy made. Its type is `&[i64]`, and
a function that takes `&[i64]` accepts a whole vector (`&nums`) or any
window of one the same way. `..` on its own is everything; `a..` runs to
the end.

```
let middle = &nums[1..nums.len() - 1];
```

`total` and the three `println!`s are written. Type the slice where the
`// FILL` comment is.

```
input:  5 1 2 3 9
output: 6
        20
        3
```
'''
starter     = '''
use std::io::Read;

fn total(xs: &[i64]) -> i64 {
    xs.iter().sum()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    // FILL: the middle of nums — everything but the first and the last
    // ANSWER: let middle = &nums[1..nums.len() - 1];
    let middle: &[i64] = &[];

    println!("{}", total(middle));
    println!("{}", total(&nums));
    println!("{}", middle.len());
}
'''
solution    = '''
use std::io::Read;

fn total(xs: &[i64]) -> i64 {
    xs.iter().sum()
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let middle = &nums[1..nums.len() - 1];

    println!("{}", total(middle));
    println!("{}", total(&nums));
    println!("{}", middle.len());
}
'''
hints = [
  "let middle = &nums[1..nums.len() - 1];",
  "The range end is exclusive, so len() - 1 stops just before the last element. The & in front makes it a borrow rather than a move out of the vector.",
]

