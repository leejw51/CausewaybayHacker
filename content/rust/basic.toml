brief       = '''
The worker pool is two channels and a lock. Jobs go down `job_tx`; the
workers share one `job_rx` behind `Arc<Mutex<…>>`, and each takes a job
with `job_rx.lock().unwrap().recv()` — the lock is a temporary, so it is
released at the end of that statement and the cooking happens **outside**
it. `recv()` returns `Err` once every `job_tx` is dropped, and that is
how a worker knows to stop. Results come back on `done_tx`, and the pass
collects until every `done_tx` — the workers' clones *and* main's own —
is gone.

```
let job = job_rx.lock().unwrap().recv();
drop(job_tx);
drop(done_tx);
```

The pool, the loop and the collection are written. Type the locked
receive inside the worker and the two drops in `main`, where the
`// FILL` comments are. Either drop missing is a deadlock.

```
input:  1 2 3
output: 0 2
        1 5
        2 10
```
'''
starter     = '''
use std::io::Read;
use std::sync::mpsc;
use std::sync::{Arc, Mutex};
use std::thread;

fn cook(x: i64) -> i64 {
    x * x + 1
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let (job_tx, job_rx) = mpsc::channel::<(usize, i64)>();
    let (done_tx, done_rx) = mpsc::channel::<(usize, i64)>();
    let job_rx = Arc::new(Mutex::new(job_rx));

    let mut workers = Vec::new();
    for _ in 0..3 {
        let job_rx = Arc::clone(&job_rx);
        let done_tx = done_tx.clone();
        workers.push(thread::spawn(move || loop {
            // FILL: take one job under the lock; the lock goes before the cooking
            // ANSWER: let job = job_rx.lock().unwrap().recv();
            let job: Result<(usize, i64), mpsc::RecvError> = Err(mpsc::RecvError);
            match job {
                Ok((i, x)) => done_tx.send((i, cook(x))).unwrap(),
                Err(_) => break,
            }
        }));
    }

    for (i, x) in nums.into_iter().enumerate() {
        job_tx.send((i, x)).unwrap();
    }
    // FILL: no more jobs — close the pad so recv() starts returning Err
    // ANSWER: drop(job_tx);
    // FILL: main's own done sender, or done_rx.iter() never ends
    // ANSWER: drop(done_tx);

    for w in workers {
        w.join().unwrap();
    }
    let mut results: Vec<(usize, i64)> = done_rx.iter().collect();
    results.sort();
    for (i, v) in &results {
        println!("{} {}", i, v);
    }
}
'''
solution    = '''
use std::io::Read;
use std::sync::mpsc;
use std::sync::{Arc, Mutex};
use std::thread;

fn cook(x: i64) -> i64 {
    x * x + 1
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input.split_whitespace().map(|t| t.parse().unwrap()).collect();

    let (job_tx, job_rx) = mpsc::channel::<(usize, i64)>();
    let (done_tx, done_rx) = mpsc::channel::<(usize, i64)>();
    let job_rx = Arc::new(Mutex::new(job_rx));

    let mut workers = Vec::new();
    for _ in 0..3 {
        let job_rx = Arc::clone(&job_rx);
        let done_tx = done_tx.clone();
        workers.push(thread::spawn(move || loop {
            let job = job_rx.lock().unwrap().recv();
            match job {
                Ok((i, x)) => done_tx.send((i, cook(x))).unwrap(),
                Err(_) => break,
            }
        }));
    }

    for (i, x) in nums.into_iter().enumerate() {
        job_tx.send((i, x)).unwrap();
    }
    drop(job_tx);
    drop(done_tx);

    for w in workers {
        w.join().unwrap();
    }
    let mut results: Vec<(usize, i64)> = done_rx.iter().collect();
    results.sort();
    for (i, v) in &results {
        println!("{} {}", i, v);
    }
}
'''
hints = [
  "let job = job_rx.lock().unwrap().recv(); in the worker; drop(job_tx); and drop(done_tx); after the sends.",
  "The guard from lock() is a temporary in that let, so it is dropped at the semicolon and the other workers can take the next job while this one cooks. Holding it across the cook() would serialise the pool.",
  "drop(job_tx) is what turns recv() into Err for the workers; drop(done_tx) is what lets done_rx.iter() finish once the workers have dropped theirs. Forget either and the program waits forever.",
]

