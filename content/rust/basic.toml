brief       = '''
Read the whole of standard input and split it on whitespace.

Print each distinct word once, as `<word> <count>`, ordered by count
descending, and ties broken by the word ascending.

```
input:  tram tram bus
output: tram 2
        bus 1
```
'''
starter     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();

    let counts: HashMap<&str, i64> = HashMap::new();

    // count every word, then print them ranked
    let _ = counts;
}
'''
solution    = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();

    let mut counts: HashMap<&str, i64> = HashMap::new();
    for word in input.split_whitespace() {
        *counts.entry(word).or_insert(0) += 1;
    }

    let mut rows: Vec<(&str, i64)> = counts.into_iter().collect();
    rows.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(b.0)));

    for (word, count) in rows {
        println!("{} {}", word, count);
    }
}
'''
hints = [
  "*counts.entry(word).or_insert(0) += 1 is the whole counting loop.",
  "A HashMap has no order. Collect it into a Vec before you print.",
  "Ordering::then chains the tie-break: count descending, then word ascending.",
]

