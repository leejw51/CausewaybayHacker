use std::io::Read;

fn fare(km: i64) -> i64 {
    500 + 100 * km
}

const CASES: [(&str, i64, i64); 4] = [
    ("zero", 0, 500),
    ("one", 1, 600),
    ("four", 4, 900),
    ("ten", 10, 1500),
];

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let km: i64 = input.trim().parse().unwrap();

    let mut passed = 0;
    for (name, arg, want) in CASES {
        let got = fare(arg);
        if got == want {
            passed += 1;
            println!("{} ok", name);
        } else {
            println!("{} FAIL got {} want {}", name, got, want);
        }
    }
    println!("PASSED {}/{}", passed, CASES.len());
    println!("FARE {}", fare(km));
}
