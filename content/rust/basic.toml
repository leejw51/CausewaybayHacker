[[quest]]
id          = "rust.basic.03.types"
node        = 3
title       = "THE SPLIT BILL"
difficulty  = 1
story       = "Two coffees, one note at the Percival Street kiosk. The till says how many each, what is left over, and the exact share, and today all three lines are blank."
