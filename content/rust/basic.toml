`f64` is a 64-bit floating-point number, the one to use unless something
says otherwise; `f32` is half the width and about seven digits of precision.
`parse()` reads either from text once the type is named, `as f32` narrows an
`f64`, and a `{:.3}` in the format string prints three digits after the
point.

```
let x: f64 = s.parse().unwrap();
let y = x as f32;
```

`s` is the trimmed input. Type those two lines in place of the two
placeholders.

```
input:  3.14159265358979
output: 3.141593
        3.142
        6.3
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let s = input.trim();

    // FILL: x is s parsed as an f64
    // ANSWER: let x: f64 = s.parse().unwrap();
    let x: f64 = 0.0;
    // FILL: y is x narrowed to an f32
    // ANSWER: let y = x as f32;
    let y: f32 = 0.0;
    println!("{:.6}", x);
    println!("{:.3}", y);
    println!("{:.1}", x * 2.0);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let s = input.trim();

    let x: f64 = s.parse().unwrap();
    let y = x as f32;
    println!("{:.6}", x);
    println!("{:.3}", y);
    println!("{:.1}", x * 2.0);
}
'''
hints = [
  "let x: f64 = s.parse().unwrap(); then let y = x as f32;",
