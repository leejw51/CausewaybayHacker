[[quest]]
id          = "rust.basic.01.the-move"
node        = 1
title       = "ONE OWNER"
difficulty  = 1
story       = "06:40 above Jardine's Bazaar. One receipt on the counter, and the rule of the whole street on it: a thing has one owner, and handing it over is handing it over."
concepts    = ["ownership", "bindings"]
requires    = []
map          = { x = 0.049, y = 0.052, kind = "quest" }
brief       = '''
A `String` has exactly one owner. `let kept = receipt;` does not copy it:
it **moves** it, and from that line on `receipt` is not a name you can
use — the compiler refuses with E0382, borrow of moved value. The value
is where it went, under its new name.

```
let kept = receipt;
```

The receipt is made and the two `println!`s are written. Type the move
where the `// FILL` comment is, so that `kept` owns the string.

```
output: one receipt, one owner
        22
```
'''
starter     = '''
fn main() {
    let receipt = String::from("one receipt, one owner");
    // FILL: move receipt into a new owner named kept
    // ANSWER: let kept = receipt;
    let kept = String::new();
    println!("{}", kept);
    println!("{}", kept.len());
}
'''
solution    = '''
fn main() {
    let receipt = String::from("one receipt, one owner");
    let kept = receipt;
    println!("{}", kept);
    println!("{}", kept.len());
}
'''
hints = [
  "let kept = receipt; — a let with the old name on the right.",
  "No clone: the string is not copied, it changes hands. Using receipt after this line is E0382.",
]

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "moves", stdin = "", expect = "one receipt, one owner\n22\n", visible = true },
]

