'''
solution    = '''
use std::io::Read;

struct Entry {
    cents: i64,
    next: Option<Box<Entry>>,
}

/// The tail of a chain is another chain, so the walk is the type's own shape.
fn sum(chain: &Option<Box<Entry>>) -> i64 {
    match chain {
        Some(entry) => entry.cents + sum(&entry.next),
        None => 0,
    }
}

fn last(chain: &Option<Box<Entry>>) -> Option<i64> {
    let entry = chain.as_ref()?;
    if entry.next.is_none() {
        return Some(entry.cents);
    }
    last(&entry.next)
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let amounts: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    // built back to front, so the finished chain reads in arrival order
    let mut head: Option<Box<Entry>> = None;
    for &cents in amounts.iter().rev() {
        head = Some(Box::new(Entry { cents, next: head }));
    }

    let mut parts: Vec<String> = Vec::with_capacity(amounts.len());
    let mut walk = head.as_ref();
    while let Some(entry) = walk {
        parts.push(entry.cents.to_string());
        walk = entry.next.as_ref();
    }
    if parts.is_empty() {
        println!("-");
    } else {
        println!("{}", parts.join(" "));
    }

    println!("SUM {}", sum(&head));
    match last(&head) {
        Some(cents) => println!("LAST {}", cents),
        None => println!("LAST NONE"),
    }
}
'''
hints = [
  "One word fixes the compile error: Option<Entry> becomes Option<Box<Entry>>, and the constructor gains a Box::new.",
  "Build it back to front — iterate the amounts in reverse and give each new node the chain you already had as its next. Building front to back needs a cursor into the tail, and that is a borrow fight you do not need yet.",
  "To walk without consuming, hold an Option<&Box<Entry>>: head.as_ref() to start, and entry.next.as_ref() to step. .as_ref() turns &Option<T> into Option<&T>, which is the move that keeps the chain intact.",
  "The recursive sum needs no mut and no loop: Some(entry) => entry.cents + sum(&entry.next), None => 0.",
]

