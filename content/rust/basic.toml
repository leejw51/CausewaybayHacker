map          = { x = 0.898, y = 0.144, kind = "quest" }
brief       = '''
A `String` knows its own length with `.len()` and makes an upper-case copy
with `.to_uppercase()`. There is no `.reverse()`: you walk the characters
with `.chars()`, turn the walk around with `.rev()`, and `.collect()` them
into a new `String`. The type on the `let` tells `collect` what to build.

```
let rev: String = line.chars().rev().collect();
```

The line is read and its length and upper-case form are printed. Type that
`let` in place of the placeholder `let rev` under the `// FILL` comment.

```
input:  kwan lee
output: 8
        KWAN LEE
        eel nawk
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let line = input.trim_end_matches('\n').to_string();

    println!("{}", line.len());
    println!("{}", line.to_uppercase());
    // FILL: let rev: String = the characters of line, reversed, collected
    // ANSWER: let rev: String = line.chars().rev().collect();
    let rev: String = String::new();
    println!("{}", rev);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let line = input.trim_end_matches('\n').to_string();

    println!("{}", line.len());
    println!("{}", line.to_uppercase());
    let rev: String = line.chars().rev().collect();
    println!("{}", rev);
}
'''
hints = [
  "let rev: String = line.chars().rev().collect();",
  "`.chars()` is an iterator over the characters, `.rev()` walks it backwards, and `.collect()` builds the `String` the `let` asks for.",
]

