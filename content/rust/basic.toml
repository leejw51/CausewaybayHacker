[[quest]]
id          = "rust.basic.04.int-types"
node        = 4
title       = "THE COUNTER WIDTHS"
difficulty  = 1
story       = "The tram-stop counter on Percival Street holds its number in a 32-bit cell and the day's total in a 64-bit one, and the line that copies one into the other is missing."
concepts    = ["types", "bindings"]
requires    = ["rust.basic.03.types"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief       = '''
An integer has a width. `i32` is 32 bits and signed; `u64` is 64 bits and
never negative. Rust does not convert between them on its own: `as` does it,
and you say the target type. Every width knows its own limit — `i32::MAX`,
`u64::MAX` — as a constant.

```
let b: u64 = a as u64;
println!("{}", u64::MAX);
```

`a` is read as an `i32`. Type the cast where the first `// FILL` is and the
`u64::MAX` line where the second is.

```
input:  21
output: 21
        42
        2147483647
        18446744073709551615
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let a: i32 = input.trim().parse().unwrap();

    // FILL: b is a, widened to a u64
    // ANSWER: let b: u64 = a as u64;
    let b: u64 = 0;
    println!("{}", a);
    println!("{}", b * 2);
    println!("{}", i32::MAX);
    // FILL: print the largest u64
    // ANSWER: println!("{}", u64::MAX);
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let a: i32 = input.trim().parse().unwrap();

    let b: u64 = a as u64;
    println!("{}", a);
    println!("{}", b * 2);
    println!("{}", i32::MAX);
    println!("{}", u64::MAX);
}
'''
hints = [
  "let b: u64 = a as u64; — then println!(\"{}\", u64::MAX); on the last line.",
  "`as` is the only way from one integer width to another; without it `let b: u64 = a;` does not compile.",
]

