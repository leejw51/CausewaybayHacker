node        = 10
title       = "THE LINE THAT IS NOT A NUMBER"
difficulty  = 3
story       = "The Victoria Park meter reader hands in a column of numbers with somebody's lunch order in the middle of it."
concepts    = ["error-handling", "pattern-matching", "types"]
requires    = ["rust.basic.09.maps"]
map         = { x = 0.70, y = 0.40, kind = "quest" }
brief       = '''
Standard input is a count `n`, then `n` lines. Each line is supposed to be an
integer.

For each line print either the value doubled, or `BAD <line>` if it does not
parse. Finally print `SUM <total>`, where the total is the sum of the values
you printed.

```
input:  3
        21
        xx
        -4
output: 42
        BAD xx
        -8
        SUM 34
```

Write a `fn double(text: &str) -> Result<i64, ParseIntError>` that uses `?`,
and handle the two outcomes with a `match` in `main`.
'''
starter     = '''
use std::io::Read;
