[[quest]]
id          = "rust.basic.04.strings"
node        = 7
title       = "THE SHOP SIGN"
difficulty  = 1
story       = "The sign painter on Jardine's Bazaar needs the name three ways: how many letters to price it, in capitals for the board, and mirrored for the inside of the glass."
concepts    = ["strings", "iteration"]
