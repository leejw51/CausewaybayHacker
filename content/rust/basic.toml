# RUST LAND — BASIC. The morning walk, Jardine's Bazaar to the Percival Street
# kiosk. The grammar road: grammar practice, not a quiz. Every node explains
# one construct, shows its syntax the way a cheat-sheet card would, and hands
# over a whole program with a hole of one or two lines where that construct
# goes. The player types the idiom; the tests only check that it ran. Types
# and conversion, integer widths, a 32-byte word, f64 and f32, strings and
# string slices, integer and byte slices (slice, copy, append), loops,
# functions, a struct, an enum, Vec, LinkedList, BTreeMap, HashMap, BTreeSet,
# a stack and a queue, sorting (plain and by key) and reversing, closures,
# iterator chains, threads, and a binary search tree at the boss. Nothing here
# is timed, and nothing here is long: verify_pack refuses a basic solution
# that adds more than two lines over its starter.
#
# The bigger quests that used to sit here — ownership, errors, iterators,
# modules, smart pointers, traits — are the first half of the ADVANCED road.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tools/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "rust.basic"
land = "rust"
category = "basic"
version = 2

# ---------------------------------------------------------------- 01
[[quest]]
id          = "rust.basic.01.first-light"
node        = 1
title       = "FIRST LIGHT"
difficulty  = 1
story       = "06:40 above Jardine's Bazaar. The cursor sits there and the grey text is gone. Whatever you can still type from memory is yours."
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Print exactly:

```
hello, causewaybay
```

Lowercase, one comma, one space, one line. Nothing else.
'''
starter     = '''
fn main() {
    // your code here
    // ANSWER: println!("hello, causewaybay");
}
'''
solution    = '''
fn main() {
    println!("hello, causewaybay");
}
'''
hints = [
  "println! is a macro, so it keeps the exclamation mark.",
  "The string is exact: lowercase, one comma, one space after it.",
]

[quest.tests]
