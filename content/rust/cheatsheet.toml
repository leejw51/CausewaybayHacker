# RUST LAND — CHEATSHEET. The grammar off the page, asked: one question per
# section of the Rust live-coding cheatsheet (~/vivid/Cheatsheet,
# rust_cheatsheet.html), four lines, one right. Nothing is typed and nothing
# is compiled — the pick is the submission, and the server judges it against
# the quiz (SPEC §0). The three wrong lines are near-misses: another
# language's spelling, a missing `mut`, a borrow that is not one.
#
# The answer is never in the brief. `solution` is the right choice, verbatim.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Checked by tests/content/verify_pack.py (no build).

pack = "rust.cheatsheet"
land = "rust"
category = "cheatsheet"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "rust.cheatsheet.01.read-all"
node        = 1
title       = "THE WHOLE TAPE"
difficulty  = 1
story       = "06:30, Jardine's Bazaar. The kiosk's input arrives all at once, and it wants all of it."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.06, y = 0.1, kind = "quest" }
brief       = '''
Read **all** of stdin into `s` in one call.

```
use std::io::{self, Read};
let mut s = String::new();
// ____
```

Which line is it?
'''
solution    = 'io::stdin().read_to_string(&mut s).unwrap();'
hints = [
  "`read_to_string` takes a `&mut String` and fills it; it returns a Result, so unwrap it.",
]

[quest.quiz]
choices = [
  'io::stdin().read_line(s);',
  'io::stdin().read_to_string(&mut s).unwrap();',
  'let s = io::stdin().read_all();',
  'io::stdin().read_to_string(s).unwrap();',
]
answer  = 1

