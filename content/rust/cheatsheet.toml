[[quest]]
id          = "rust.cheatsheet.24.read-vec"
node        = 24
title       = "THE WHOLE LINE"
difficulty  = 4
story       = "The last till on Jardine's Bazaar hands over one line of space-separated numbers, newline and all; everything upstream depends on this one parse."
concepts    = ["io", "strings", "iteration", "error-handling"]
requires    = ["rust.cheatsheet.23.pow"]
map         = { x = 0.06, y = 0.70, kind = "quest" }
brief       = '''
`line` came from `read_line`, so the `\n` is still on it, and the numbers
may be separated by **more than one space**. Turn it into a `Vec<i64>`
without panicking on a well-formed line.

```
let v: Vec<i64> = ____;
```

Which expression fills the blank?
'''
solution    = 'line.split_whitespace().map(|x| x.parse().unwrap()).collect()'
hints = [
  "Split on runs of whitespace (that also eats the newline), parse each token and unwrap it, then gather — a Vec<i64> cannot be gathered from Results.",
]

[quest.quiz]
choices = [
  'line.split_whitespace().map(|x| x.parse()).collect()',
  'line.split_whitespace().map(|x| x.parse().unwrap()).collect()',
  "line.split(' ').map(|x| x.parse().unwrap()).collect()",
  'line.split_whitespace().map(|x| x.parse().unwrap())',
]
answer  = 1

# ---------------------------------------------------------------- 25
[[quest]]
id          = "rust.cheatsheet.25.let-mut"
node        = 25
title       = "THE COUNTER STARTS AT TEN"
difficulty  = 1
story       = "The egg-waffle stall on Jardine's Bazaar keeps a running count of orders, and the count has to be allowed to change."
concepts    = ["bindings", "types", "mutability"]
requires    = ["rust.cheatsheet.24.read-vec"]
map         = { x = 0.06, y = 0.92, kind = "quest" }
brief       = '''
Declare `y` as an **unsigned 64-bit** integer holding 10, so that the
next line compiles:

```
// ____
y += 1;
```

Which line is it?
'''
solution    = 'let mut y: u64 = 10;'
hints = [
  "Two things to get right: the binding must be allowed to change, and a binding is set with one `=`, not the comparison.",
]

[quest.quiz]
choices = [
  'let y: u64 = 10;',
  'let mut y: u64 == 10;',
  'let mut y: u64 = 10.0;',
  'let mut y: u64 = 10;',
]
answer  = 3

