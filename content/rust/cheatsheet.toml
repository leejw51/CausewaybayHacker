[[quest]]
id          = "rust.cheatsheet.30.char-count"
node        = 30
title       = "COUNT THE NEON"
difficulty  = 3
story       = "The sign over Lockhart Road reads 銅鑼灣 in three characters, and Mei's first count came back far too high."
concepts    = ["strings", "types", "iteration"]
requires    = ["rust.cheatsheet.29.pop-front"]
map         = { x = 0.93, y = 0.88, kind = "boss" }
brief       = '''
`s: &str` contains Chinese characters. `n` is the number of
**characters** in `s` — so for `"銅鑼灣"` it is 3, not 9.

```
let n = ____;
```

Which expression fills the blank?
'''
solution    = 's.chars().count()'
hints = [
  "A `&str` measures itself in bytes, and a Chinese character is three of them. Measure the characters, not the bytes — and the character iterator cannot report its length up front, only how many steps it took.",
]

[quest.quiz]
choices = [
  's.chars().count()',
  's.len()',
  's.chars().len()',
  's.bytes().count()',
]
answer  = 0
