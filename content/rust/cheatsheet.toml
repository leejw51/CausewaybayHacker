# ---------------------------------------------------------------- 27
[[quest]]
id          = "rust.cheatsheet.27.sub-slice"
node        = 27
title       = "TWO OUT OF THE MIDDLE"
difficulty  = 2
story       = "Five trams sit in the depot off Percival Street; Mei only wants to look at the second and the third, and the depot keeps all five."
concepts    = ["slices", "borrowing"]
requires    = ["rust.cheatsheet.26.fn-add"]
map         = { x = 0.39, y = 0.86, kind = "quest" }
brief       = '''
`v: Vec<i32>` has at least four elements. `w` is a `&[i32]` that borrows
**exactly** the elements at indices 1 and 2 — two elements, no copy.

```
let w: &[i32] = ____;
```

Which expression fills the blank?
'''
solution    = '&v[1..3]'
hints = [
  "A range index on a Vec gives a slice, and a slice has to be borrowed to be held. The end of `a..b` is not included; the end of `a..=b` is.",
]

[quest.quiz]
choices = [
  'v[1..3]',
  '&v[1..=3]',
  '&v[1..3]',
  '&v[1:3]',
]
answer  = 2

# ---------------------------------------------------------------- 28
[[quest]]
id          = "rust.cheatsheet.28.unwrap-or"
node        = 28
title       = "OR NOTHING"
difficulty  = 2
story       = "The locker board at Causeway Bay station may have no entry for a number, and the display still has to show something."
concepts    = ["error-handling", "zero-values", "enums"]
requires    = ["rust.cheatsheet.27.sub-slice"]
map         = { x = 0.58, y = 0.92, kind = "quest" }
brief       = '''
`o: Option<i32>`. `n` is an `i32`: the value inside `o`, or 0 if `o` is
`None` — and the line must **never panic**.
'''
solution    = 'let n = o.unwrap_or(0);'
hints = [
  "There is a method that unwraps with a fallback; the fallback is a plain value of the inner type, not another Option.",
]

[quest.quiz]
choices = [
  'let n = o.unwrap();',
  'let n = o.unwrap_or(0);',
  'let n = o.or(0);',
  'let n = o.unwrap_or(Some(0));',
]
answer  = 1

