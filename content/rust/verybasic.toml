solution    = '''
use std::io::Read;

struct Node {
    value: i64,
    left: Option<Box<Node>>,
    right: Option<Box<Node>>,
}

fn insert(root: Option<Box<Node>>, value: i64) -> Option<Box<Node>> {
    match root {
        None => Some(Box::new(Node { value, left: None, right: None })),
        Some(mut n) => {
            // FILL: smaller goes left, larger goes right, assigned back
            if value < n.value { n.left = insert(n.left.take(), value); } else { n.right = insert(n.right.take(), value); }
            Some(n)
        }
    }
}

fn inorder(node: &Option<Box<Node>>, out: &mut Vec<i64>) {
    if let Some(n) = node {
        inorder(&n.left, out);
        out.push(n.value);
        inorder(&n.right, out);
    }
}

fn height(node: &Option<Box<Node>>) -> i64 {
    match node {
        None => 0,
        Some(n) => 1 + height(&n.left).max(height(&n.right)),
    }
}

fn main() {
