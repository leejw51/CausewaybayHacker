# RUST LAND — VERY BASIC. The quiz before the walk: the same grammar BASIC
# activates, asked first. Every node shows a program with one hole and four
# lines that might fill it; three are near-misses that do not compile, do the
# wrong thing or are another language's spelling. Pick the right one, then
# type it. Types, containers, a stack, a queue, a heap, structs, closures, a
# thread, a mutex, and THE AUTOCOMPLETE over a tree at the end — the grammar
# a HackerRank-style live coding test leans on.
#
# The answer is never in the starter or the brief: the quiz is the answer.
# verify_pack swaps each wrong choice into the solution and proves it fails.
#
# Story bible: docs/story.md. Concept vocabulary: docs/concepts.md.
# Format: SPEC §12. Every solution and starter in this file is run by
# tests/content/verify_pack.py and by CI (SPEC §9.4, §9.5).

pack = "rust.verybasic"
land = "rust"
category = "verybasic"
version = 1

# ---------------------------------------------------------------- 01
[[quest]]
id          = "rust.verybasic.01.print"
node        = 1
title       = "FIRST LIGHT"
difficulty  = 1
story       = "06:40 above Jardine's Bazaar. The kiosk knows the customer's name and greets nobody."
concepts    = ["io", "strings"]
requires    = []
map          = { x = 0.044, y = 0.146, kind = "quest" }
brief       = '''
Read one line, a name. Print `hello, ` and the name on one line.
`println!` is the macro that prints a line; `{}` is where a value goes.

Pick the line that does it, then type it where the `// FILL` comment is.

```
input:  mei
output: hello, mei
```
'''
starter     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let name = input.trim();
    // FILL: print hello, then the name
}
'''
solution    = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let name = input.trim();
    // FILL: print hello, then the name
    println!("hello, {}", name);
}
'''
hints = [
  "println!(\"hello, {}\", name); — the macro keeps its !, and {} takes name.",
  "Without the ! it is a function that does not exist; without the argument the {} has nothing to print.",
]

[quest.quiz]
choices = [
  'println("hello, {}", name);',
  'println!("hello, {}", name);',
  'println!("hello, {}");',
  'print!("hello {}", name);',
]
answer  = 1

[quest.tests]
harness    = "stdio"
timeout_ms = 5000
compile_timeout_ms = 30000
max_stdout_bytes = 262144
match      = "trim"
cases = [
  { name = "mei", stdin = "mei\n", expect = "hello, mei\n", visible = true },
  { name = "alex", stdin = "alex\n", expect = "hello, alex\n", visible = false },
  { name = "long", stdin = "causewaybay\n", expect = "hello, causewaybay\n", visible = false },
]

