solution     = '''
use std::io::Read;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, buckets, seed) = (p[0] as usize, p[1], p[2]);

    let mut rng = Rng(seed);
    // (score, original index)
    let mut riders: Vec<(i64, usize)> = (0..n)
        .map(|i| ((rng.next() % buckets) as i64, i))
        .collect();

    // sort_by_key is stable, so equal scores keep the order they arrived in.
    // The equally correct alternative is
    //     riders.sort_unstable_by_key(|r| (std::cmp::Reverse(r.0), r.1));
    // which makes the comparison total and so needs no stability at all.
    riders.sort_by_key(|r| std::cmp::Reverse(r.0));

    let order: Vec<String> = riders.iter().map(|r| r.1.to_string()).collect();
    let ties = riders.windows(2).filter(|w| w[0].0 == w[1].0).count();
    println!("{}", order.join(" "));
    println!("TIES {}", ties);
}
