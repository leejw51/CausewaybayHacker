brief        = '''
Line one is `n`. The next `n` lines are `<start> <end>` with `start <= end`.

Merge every pair that overlaps or touches, and print the result in increasing
order, one `<start> <end>` per line, then `COUNT <k>`.

```
input:  4
        1 3
        2 6
        8 10
        15 18
output: 1 6
        8 10
        15 18
        COUNT 3
```

Touching counts as overlapping: `1 4` and `4 5` merge into `1 5`.
'''
starter      = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;

    let mut spans: Vec<(i64, i64)> = Vec::with_capacity(n);
    for i in 0..n {
        spans.push((values[1 + 2 * i], values[2 + 2 * i]));
    }

    // sort, sweep, merge, print, then COUNT <k>
    println!("COUNT {}", spans.len());
}
'''
solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;

    let mut spans: Vec<(i64, i64)> = Vec::with_capacity(n);
    for i in 0..n {
        spans.push((values[1 + 2 * i], values[2 + 2 * i]));
    }
    spans.sort();

    let mut merged: Vec<(i64, i64)> = Vec::new();
    for (start, end) in spans {
        match merged.last_mut() {
            Some(last) if start <= last.1 => {
                if end > last.1 {
                    last.1 = end;
                }
            }
            _ => merged.push((start, end)),
        }
    }

    for (start, end) in &merged {
        println!("{} {}", start, end);
    }
    println!("COUNT {}", merged.len());
}
'''
hints = [
  "Sort by start first. After that one left-to-right pass is enough and you never look backwards more than one interval.",
  "Extend the last merged interval when the new start is <= its end; otherwise push a new one.",
  "Extend to max(last.end, end) — a short interval swallowed by a long one must not shrink it.",
]

