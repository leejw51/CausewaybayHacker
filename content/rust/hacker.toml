solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let cap = values[1] as usize;
    let items: Vec<(usize, i64)> = (0..n)
        .map(|i| (values[2 + 2 * i] as usize, values[3 + 2 * i]))
        .collect();

    let mut best = vec![0i64; cap + 1];
    for &(weight, value) in &items {
        // downwards, so this item cannot be picked up twice in one pass
        for room in (weight..=cap).rev() {
            let candidate = best[room - weight] + value;
            if candidate > best[room] {
                best[room] = candidate;
            }
        }
    }

    let mut order: Vec<(usize, i64)> = items.clone();
    order.sort_by(|a, b| {
        let left = b.1 * a.0 as i64;
        let right = a.1 * b.0 as i64;
        left.cmp(&right).then(a.0.cmp(&b.0))
    });
    let mut room = cap;
    let mut greedy = 0i64;
    for &(weight, value) in &order {
        if weight <= room {
            room -= weight;
            greedy += value;
        }
    }

    println!("{}", best[cap]);
    println!("GREEDY {}", greedy);
}
'''
