[[quest]]
id           = "rust.hacker.28.lru"
node         = 34
title        = "THE WHITEBOARD"
difficulty   = 5
time_limit_s = 1800
story        = "Room 7-32, last question, and the interviewer turns the monitor off. No highlighting, no completion, a clock."
concepts     = ["collections", "linked-lists", "complexity"]
