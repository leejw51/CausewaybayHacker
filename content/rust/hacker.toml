solution     = '''
use std::io::Read;

fn build(nums: &[i64], at: usize, chosen: &mut Vec<i64>, out: &mut Vec<String>) {
    if at == nums.len() {
        if chosen.is_empty() {
            out.push("-".to_string());
        } else {
            let parts: Vec<String> = chosen.iter().map(|v| v.to_string()).collect();
            out.push(parts.join(" "));
        }
        return;
    }

    chosen.push(nums[at]);
    build(nums, at + 1, chosen, out);
    chosen.pop();

    build(nums, at + 1, chosen, out);
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let mut chosen: Vec<i64> = Vec::new();
    let mut out: Vec<String> = Vec::new();
    build(&nums, 0, &mut chosen, &mut out);

    for line in &out {
        println!("{}", line);
    }
    println!("SUBSETS {}", out.len());
}
'''
