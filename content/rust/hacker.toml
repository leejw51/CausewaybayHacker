    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut values = input.split_whitespace().map(|t| t.parse::<i64>().unwrap());
    let k = values.next().unwrap() as usize;

    let mut lists: Vec<Vec<i64>> = Vec::with_capacity(k);
    for _ in 0..k {
        let count = values.next().unwrap() as usize;
        lists.push((0..count).map(|_| values.next().unwrap()).collect());
    }

    let heap: BinaryHeap<Reverse<(i64, usize, usize)>> = BinaryHeap::new();

    // seed the heap with the head of each list, then pop and refill
