brief        = '''
Standard input is `n buckets seed`. Build `n` riders, where rider `i` has
index `i` and a score:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

score[i] = next() % buckets           for i in 0..n
```

Sort the riders by score **descending**. Riders with the same score must keep
the order they arrived in. Print their indices, space separated, then
`TIES <k>` — how many adjacent pairs in your sorted order have equal scores.

```
input:  8 3 5
output: 1 5 6 0 2 3 4 7
        TIES 6
```

`buckets` is small, so almost everything is a tie, and the answer is almost
entirely decided by what happens to them.

**This is the quest about knowing which sort you are holding.**
`sort_by_key` is **stable** — equal elements keep their relative order.
`sort_unstable_by_key` is not, and on a real input it visibly will not: it is
pattern-defeating quicksort, it is usually faster, and it makes no promise
about ties whatsoever. The starter uses it, and the hidden cases are large
enough that it demonstrably scrambles them. (At `n = 8` it happens not to —
which is why a small test would have proved nothing, and why the small case
here is the *visible* one rather than the one that judges you.)

There are two correct answers and you should be able to give both. Use a
stable sort. **Or** use the unstable one and make the comparison **total** —
sort by `(Reverse(score), index)` so no two elements ever compare equal and
stability stops being a question. The second is what to reach for by default;
an unstable sort has nothing to prove when the order is fully specified.
'''
