map          = { x = 0.818, y = 0.870, kind = "boss" }
brief        = '''
Line one is `cap q`. The next `q` lines are `PUT <key> <value>` or
`GET <key>`.

Implement a fixed-capacity cache that evicts the **least recently used** entry
when it is full. A `GET` and a `PUT` both count as using a key.

For each `GET` print the value, or `-1` if it is not there. At the end print
the surviving keys, most-recently-used first, space separated — or `-` if the
cache is empty — and then `EVICTED <k>`.

```
input:  2 6
        PUT 1 10
        PUT 2 20
        GET 1
        PUT 3 30
        GET 2
        GET 3
output: 10
        -1
        30
        3 1
        EVICTED 1
```

Follow the sample through: `GET 1` makes `1` recent again, so when `PUT 3`
needs room it is `2` that goes. `GET 2` misses. `GET 3` hits and makes `3` the
most recent, which is why the survivors print as `3 1`.

The textbook answer is a hash map into a doubly linked list. In Rust, without
`unsafe` or `Rc<RefCell<_>>`, the honest version is a `HashMap<i64, (i64, u64)>`
carrying a monotonically increasing stamp, and eviction scans for the oldest.
That is O(cap) per eviction rather than O(1), and saying so out loud is worth
more in the room than pretending otherwise.
'''
starter      = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let cap: usize = header.next().unwrap().parse().unwrap();
    let q: usize = header.next().unwrap().parse().unwrap();

    // key -> (value, last used stamp)
    let mut cache: HashMap<i64, (i64, u64)> = HashMap::new();
    let evicted = 0usize;

    for _ in 0..q {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        match parts.next().unwrap() {
            "GET" => println!("-1"),
            _ => {}
        }
    }

    let _ = (&mut cache, cap);
    println!("-");
    println!("EVICTED {}", evicted);
}
'''
solution     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let cap: usize = header.next().unwrap().parse().unwrap();
    let q: usize = header.next().unwrap().parse().unwrap();

    // key -> (value, the clock reading when it was last used)
    let mut cache: HashMap<i64, (i64, u64)> = HashMap::new();
    let mut clock = 0u64;
    let mut evicted = 0usize;

    for _ in 0..q {
        clock += 1;
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let op = parts.next().unwrap();
        let key: i64 = parts.next().unwrap().parse().unwrap();

        if op == "GET" {
            match cache.get_mut(&key) {
                Some(entry) => {
                    entry.1 = clock;
                    println!("{}", entry.0);
                }
                None => println!("-1"),
            }
            continue;
        }

        let value: i64 = parts.next().unwrap().parse().unwrap();
        if !cache.contains_key(&key) && cache.len() == cap {
            let oldest = cache
                .iter()
                .min_by_key(|(_, entry)| entry.1)
                .map(|(k, _)| *k)
                .unwrap();
            cache.remove(&oldest);
            evicted += 1;
        }
        cache.insert(key, (value, clock));
    }

    let mut alive: Vec<(i64, u64)> = cache.iter().map(|(k, e)| (*k, e.1)).collect();
    alive.sort_by(|a, b| b.1.cmp(&a.1));
    if alive.is_empty() {
        println!("-");
    } else {
        let line: Vec<String> = alive.iter().map(|(k, _)| k.to_string()).collect();
        println!("{}", line.join(" "));
    }
    println!("EVICTED {}", evicted);
}
'''
hints = [
  "One clock that ticks per operation, and every touched key records the reading. Recency is then just a number to sort on.",
  "Overwriting a key that is already present is not an eviction — check contains_key before you decide the cache is full.",
  "The final line is sorted by stamp descending, so the key touched last comes first.",
]

