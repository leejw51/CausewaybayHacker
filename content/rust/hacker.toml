brief        = '''
One line of text, no spaces.

Print the length of the longest run of characters with no repeat in it, then
the run itself. If several runs tie, print the leftmost.

```
input:  abcabcbb
output: 3
        abc
```

The window only ever moves right. If you find yourself rescanning from the
start after a repeat, you have written the quadratic one.
'''
starter      = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let chars: Vec<char> = input.trim().chars().collect();

    let _last: HashMap<char, usize> = HashMap::new();
    let _ = chars;

    // print the best length, then the run itself
    println!("0");
    println!("?");
}
'''
solution     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let chars: Vec<char> = input.trim().chars().collect();

    let mut last: HashMap<char, usize> = HashMap::new();
    let mut start = 0usize;
    let mut best_len = 0usize;
    let mut best_start = 0usize;

    for (i, &c) in chars.iter().enumerate() {
        if let Some(&previous) = last.get(&c) {
            if previous >= start {
                start = previous + 1;
            }
        }
        last.insert(c, i);
        let len = i - start + 1;
        if len > best_len {
            best_len = len;
            best_start = start;
        }
    }

    println!("{}", best_len);
    let run: String = chars[best_start..best_start + best_len].iter().collect();
    println!("{}", run);
}
'''
hints = [
  "Keep the index where each character was last seen, and the index the window starts at.",
  "A repeat only matters if its last position is inside the current window — that is the `previous >= start` test.",
  "Record the best length *and* where it started, or you cannot print the run at the end.",
]

