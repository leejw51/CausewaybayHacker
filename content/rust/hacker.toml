'''
solution     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let tokens: Vec<&str> = input.split_whitespace().collect();
    let k: usize = tokens[1].parse().unwrap();
    let words = &tokens[2..];

    let mut counts: HashMap<&str, i64> = HashMap::new();
    for word in words {
        *counts.entry(word).or_insert(0) += 1;
    }

    let mut ranked: Vec<(&str, i64)> = counts.into_iter().collect();
    ranked.sort_by(|a, b| b.1.cmp(&a.1).then(a.0.cmp(b.0)));

    for (word, _) in ranked.iter().take(k) {
        println!("{}", word);
    }
    println!("DISTINCT {}", ranked.len());
}
'''
hints = [
  "One pass to count, one sort to rank. Do not try to keep the ranking up to date while counting.",
  "b.1.cmp(&a.1) is count descending; .then(a.0.cmp(b.0)) is the word ascending tie-break.",
  "take(k) is safe when there are fewer than k — it stops at the end instead of panicking.",
]

