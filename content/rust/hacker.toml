solution     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let k = values[1];
    let nums = &values[2..2 + n];

    let mut seen: HashMap<i64, i64> = HashMap::new();
    seen.insert(0, 1);

    let mut prefix = 0i64;
    let mut runs = 0i64;
    for &value in nums {
        prefix += value;
        runs += *seen.get(&(prefix - k)).unwrap_or(&0);
        *seen.entry(prefix).or_insert(0) += 1;
    }

    println!("{}", runs);
    println!("RANGE {}", prefix);
}
'''
