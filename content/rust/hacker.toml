        edit[i][0] = i;
    }
    for j in 0..=b.len() {
        edit[0][j] = j;
    }
    for i in 1..=a.len() {
        for j in 1..=b.len() {
            edit[i][j] = if a[i - 1] == b[j - 1] {
                edit[i - 1][j - 1]
            } else {
                1 + edit[i - 1][j - 1].min(edit[i - 1][j]).min(edit[i][j - 1])
            };
        }
    }

    let mut lcs = vec![vec![0usize; b.len() + 1]; a.len() + 1];
    for i in 1..=a.len() {
        for j in 1..=b.len() {
            lcs[i][j] = if a[i - 1] == b[j - 1] {
                lcs[i - 1][j - 1] + 1
            } else {
                lcs[i - 1][j].max(lcs[i][j - 1])
            };
        }
    }

    println!("{}", edit[a.len()][b.len()]);
    println!("LCS {}", lcs[a.len()][b.len()]);
}
'''
