solution     = '''
use std::io::Read;

const P: i64 = 1_000_000_007;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (rows, cols, pct, seed) = (p[0] as usize, p[1] as usize, p[2], p[3]);

    let mut rng = Rng(seed);
    let mut open = vec![vec![true; cols]; rows];
    let mut cost = vec![vec![0i64; cols]; rows];
    for i in 0..rows {
        for j in 0..cols {
            let a = rng.next();
            let b = rng.next();
            let corner = (i == 0 && j == 0) || (i == rows - 1 && j == cols - 1);
            if !corner && a % 100 < pct {
                open[i][j] = false;
            }
            cost[i][j] = (b % 9 + 1) as i64;
        }
    }

    let mut ways = vec![vec![0i64; cols]; rows];
    let mut best = vec![vec![i64::MAX; cols]; rows];

    for i in 0..rows {
        for j in 0..cols {
            if !open[i][j] {
                continue;
            }
            if i == 0 && j == 0 {
                ways[0][0] = 1;
                best[0][0] = cost[0][0];
                continue;
            }
            let mut routes = 0i64;
            let mut cheapest = i64::MAX;
            if i > 0 && open[i - 1][j] {
                routes = (routes + ways[i - 1][j]) % P;
                cheapest = cheapest.min(best[i - 1][j]);
            }
            if j > 0 && open[i][j - 1] {
                routes = (routes + ways[i][j - 1]) % P;
                cheapest = cheapest.min(best[i][j - 1]);
            }
            ways[i][j] = routes;
            best[i][j] = if cheapest == i64::MAX {
                i64::MAX
            } else {
                cheapest + cost[i][j]
            };
        }
    }

    println!("PATHS {}", ways[rows - 1][cols - 1]);
    println!(
        "MIN {}",
        if best[rows - 1][cols - 1] == i64::MAX {
            -1
        } else {
            best[rows - 1][cols - 1]
        }
    );
}
'''
hints = [
  "Draw both values for every cell, including the two corners — the generator does not skip them, it only refuses to block them.",
  "An open cell with no open neighbour above or left is reachable by zero routes and has no best cost; keep i64::MAX meaning `unreachable` and guard the addition.",
  "The destination can be open and still unreachable, which is exactly when PATHS is 0 and MIN is -1. One of the hidden cases is that.",
]

