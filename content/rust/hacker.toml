solution     = '''
use std::io::Read;

struct Node {
    children: [Option<usize>; 26],
    through: usize,
    terminal: bool,
}

fn blank() -> Node {
    Node { children: [None; 26], through: 0, terminal: false }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let n: usize = header.next().unwrap().parse().unwrap();
    let q: usize = header.next().unwrap().parse().unwrap();

    let mut nodes: Vec<Node> = vec![blank()];

    for _ in 0..n {
        let word = lines.next().unwrap().trim();
        let mut at = 0usize;
        for byte in word.bytes() {
            let slot = (byte - b'a') as usize;
            let next = match nodes[at].children[slot] {
                Some(index) => index,
                None => {
                    nodes.push(blank());
                    let index = nodes.len() - 1;
                    nodes[at].children[slot] = Some(index);
                    index
                }
            };
            nodes[next].through += 1;
            at = next;
        }
        nodes[at].terminal = true;
    }

    for _ in 0..q {
        let line = lines.next().unwrap();
        let mut parts = line.split_whitespace();
        let kind = parts.next().unwrap();
        let text = parts.next().unwrap_or("");

        let mut at = Some(0usize);
        for byte in text.bytes() {
            let slot = (byte - b'a') as usize;
            at = at.and_then(|index| nodes[index].children[slot]);
        }

        match kind {
            "WORD" => {
                let hit = at.map(|index| nodes[index].terminal).unwrap_or(false);
                println!("{}", if hit { "YES" } else { "NO" });
            }
            _ => {
                println!("{}", at.map(|index| nodes[index].through).unwrap_or(0));
            }
        }
    }

    println!("NODES {}", nodes.len());
}
'''
hints = [
  "Store the nodes in one Vec and let children hold indices. Box-per-node fights the borrow checker for no benefit here.",
  "`through` is bumped on the node you step *onto*, so the root never counts itself.",
  "A query that falls off the trie gives None, and None answers NO and 0 without a special case.",
]

