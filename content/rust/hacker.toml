solution     = '''
use std::io::Read;

fn present(tree: &[i64], i: usize) -> bool {
    i < tree.len() && tree[i] != -1
}

fn walk(tree: &[i64], i: usize, order: usize, out: &mut Vec<i64>) {
    if !present(tree, i) {
        return;
    }
    if order == 0 {
        out.push(tree[i]);
    }
    walk(tree, 2 * i + 1, order, out);
    if order == 1 {
        out.push(tree[i]);
    }
    walk(tree, 2 * i + 2, order, out);
    if order == 2 {
        out.push(tree[i]);
    }
}

fn depth(tree: &[i64], i: usize) -> usize {
    if !present(tree, i) {
        return 0;
    }
    1 + depth(tree, 2 * i + 1).max(depth(tree, 2 * i + 2))
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let tree: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    for order in 0..3 {
        let mut out: Vec<i64> = Vec::new();
        walk(&tree, 0, order, &mut out);
        let line: Vec<String> = out.iter().map(|v| v.to_string()).collect();
        println!("{}", line.join(" "));
    }
    println!("DEPTH {}", depth(&tree, 0));
}
'''
