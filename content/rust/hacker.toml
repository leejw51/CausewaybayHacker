brief        = '''
Line one is `n target`. Line two is `n` integers.

Print the **1-based** indices `i j` of two different entries that add up to
`target`, as `i j` with `i < j`. If more than one pair works, give the one
whose second index is smallest; if that still ties, the smallest first index.
If no pair works, print `-1`.

```
input:  4 9
        2 7 11 15
output: 1 2
```

`n` goes to 200000. The nested loop is the wrong answer here even when it
prints the right numbers: the hidden cases are sized so that it does not
finish.
'''
starter      = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let target = values[1];
    let nums = &values[2..2 + n];

    let _seen: HashMap<i64, usize> = HashMap::new();
    let _ = (nums, target);
    println!("-1");
}
'''
solution     = '''
use std::collections::HashMap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let target = values[1];
    let nums = &values[2..2 + n];

    let mut seen: HashMap<i64, usize> = HashMap::new();
    for (j, &x) in nums.iter().enumerate() {
        if let Some(&i) = seen.get(&(target - x)) {
            println!("{} {}", i + 1, j + 1);
            return;
        }
        seen.entry(x).or_insert(j);
    }
    println!("-1");
}
'''
hints = [
  "One pass. For each value ask whether target minus it has already been seen.",
  "entry(x).or_insert(j) keeps the first index of a repeated value, which is the tie-break the statement asks for.",
  "Print and return the moment you find it — the first hit as you scan is already the smallest second index.",
]

