solution     = '''
use std::io::Read;

struct Node {
    value: i64,
    next: Option<Box<Node>>,
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    // build it back to front, so each new node points at what we had
    let mut head: Option<Box<Node>> = None;
    for &value in values.iter().rev() {
        head = Some(Box::new(Node { value, next: head }));
    }

    // walk it to count, and run a second pointer at half speed for the middle
    let mut length = 0usize;
    let mut slow: Option<&Box<Node>> = head.as_ref();
    let mut fast: Option<&Box<Node>> = head.as_ref();
    while let Some(node) = fast {
        length += 1;
        fast = node.next.as_ref();
        if let Some(node) = fast {
            length += 1;
            fast = node.next.as_ref();
            slow = slow.and_then(|s| s.next.as_ref());
        }
    }
    let middle = slow.map(|node| node.value).unwrap_or(0);

    // reverse by moving nodes off the front of one list onto the front of another
    let mut reversed: Option<Box<Node>> = None;
    let mut cursor = head;
    while let Some(mut node) = cursor {
        cursor = node.next.take();
        node.next = reversed;
        reversed = Some(node);
    }

    let mut out: Vec<String> = Vec::new();
    let mut walk = reversed.as_ref();
    while let Some(node) = walk {
        out.push(node.value.to_string());
        walk = node.next.as_ref();
    }

    println!("{}", out.join(" "));
    println!("{}", middle);
    println!("LEN {}", length);
}
'''
