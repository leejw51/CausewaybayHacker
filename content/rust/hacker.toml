'''
solution     = '''
use std::io::Read;

fn find(parent: &mut Vec<usize>, x: usize) -> usize {
    let mut root = x;
    while parent[root] != root {
        root = parent[root];
    }
    // path compression: point everything we walked over straight at the root
    let mut walk = x;
    while parent[walk] != root {
        let next = parent[walk];
        parent[walk] = root;
        walk = next;
    }
    root
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<usize> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0];
    let m = values[1];

    let mut parent: Vec<usize> = (0..n).collect();
    let mut size = vec![1usize; n];
    let mut groups = n;
    let mut redundant = 0usize;

    for e in 0..m {
        let a = find(&mut parent, values[2 + 2 * e]);
        let b = find(&mut parent, values[3 + 2 * e]);
        if a == b {
            redundant += 1;
            continue;
        }
        // hang the smaller tree under the bigger one
        let (big, small) = if size[a] >= size[b] { (a, b) } else { (b, a) };
        parent[small] = big;
        size[big] += size[small];
        groups -= 1;
    }

    let largest = (0..n)
        .filter(|&x| parent[x] == x)
        .map(|x| size[x])
        .max()
        .unwrap_or(0);

    println!("{}", groups);
    println!("{}", largest);
    println!("REDUNDANT {}", redundant);
}
'''
hints = [
