solution     = '''
use std::cmp::Reverse;
use std::collections::BinaryHeap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<usize> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0];
    let m = values[1];

    let mut after: Vec<Vec<usize>> = vec![Vec::new(); n];
    let mut waiting = vec![0usize; n];
    for e in 0..m {
        let a = values[2 + 2 * e];
        let b = values[3 + 2 * e];
        after[a].push(b);
        waiting[b] += 1;
    }

    let mut ready: BinaryHeap<Reverse<usize>> = BinaryHeap::new();
    for task in 0..n {
        if waiting[task] == 0 {
            ready.push(Reverse(task));
        }
    }

    let mut order: Vec<usize> = Vec::new();
    while let Some(Reverse(task)) = ready.pop() {
        order.push(task);
        for &next in &after[task] {
            waiting[next] -= 1;
            if waiting[next] == 0 {
                ready.push(Reverse(next));
            }
        }
    }

    if order.len() < n {
        println!("CYCLE");
    } else {
        let line: Vec<String> = order.iter().map(|v| v.to_string()).collect();
        println!("{}", line.join(" "));
    }
    println!("DONE {}", order.len());
}
'''
