starter      = '''
use std::io::Read;

fn find(parent: &mut Vec<usize>, x: usize) -> usize {
    // walk to the root, and flatten what you walked over
    let _ = parent;
    x
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<usize> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0];
    let m = values[1];

    let mut parent: Vec<usize> = (0..n).collect();
    let mut size = vec![1usize; n];
    let redundant = 0usize;

    for e in 0..m {
        let a = values[2 + 2 * e];
        let b = values[3 + 2 * e];
        let _ = (find(&mut parent, a), find(&mut parent, b), &mut size);
    }

