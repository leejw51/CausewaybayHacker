[[quest]]
id           = "rust.hacker.04.grid"
node         = 4
title        = "OUT OF THE BUILDING"
difficulty   = 5
time_limit_s = 1200
story        = "A floor plan on the whiteboard, a fire door at the far corner, and the interviewer watching the clock rather than the marker."
concepts     = ["graphs", "stacks-queues", "complexity"]
requires     = ["rust.hacker.03.intervals"]
map          = { x = 0.518, y = 0.065, kind = "quest" }
brief        = '''
Line one is `r c`. The next `r` lines are the floor: `.` is open, `#` is wall.

Start at the top-left `(0,0)` and reach the bottom-right `(r-1, c-1)`, moving
up, down, left or right through open cells only.

Print the number of **steps** on a shortest route, or `-1` if there is none.
Then print `REACHED <k>`: how many open cells are reachable from the start,
counting the start itself.

```
input:  3 3
        ...
        .#.
        ...
output: 4
        REACHED 8
```

Breadth first, not depth first. A depth-first walk finds *a* route; the
question asks for the shortest one.
'''
starter      = '''
use std::collections::VecDeque;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let rows: usize = header.next().unwrap().parse().unwrap();
    let cols: usize = header.next().unwrap().parse().unwrap();
    let grid: Vec<Vec<u8>> = (0..rows)
        .map(|_| lines.next().unwrap().as_bytes().to_vec())
        .collect();

    let _queue: VecDeque<(usize, usize)> = VecDeque::new();
    let _ = (grid, cols);

    // print the shortest step count or -1, then REACHED <k>
    println!("-1");
    println!("REACHED 0");
}
'''
solution     = '''
use std::collections::VecDeque;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let rows: usize = header.next().unwrap().parse().unwrap();
    let cols: usize = header.next().unwrap().parse().unwrap();
    let grid: Vec<Vec<u8>> = (0..rows)
        .map(|_| lines.next().unwrap().as_bytes().to_vec())
        .collect();

    let mut dist = vec![vec![-1i64; cols]; rows];
    let mut queue: VecDeque<(usize, usize)> = VecDeque::new();
    let mut reached = 0usize;

    if grid[0][0] == b'.' {
        dist[0][0] = 0;
        queue.push_back((0, 0));
        reached = 1;
    }

    while let Some((r, c)) = queue.pop_front() {
        let here = dist[r][c];
        let mut step = |nr: usize, nc: usize, q: &mut VecDeque<(usize, usize)>,
                        d: &mut Vec<Vec<i64>>, seen: &mut usize| {
            if grid[nr][nc] == b'.' && d[nr][nc] < 0 {
                d[nr][nc] = here + 1;
                *seen += 1;
                q.push_back((nr, nc));
            }
        };
        if r > 0 {
            step(r - 1, c, &mut queue, &mut dist, &mut reached);
        }
        if r + 1 < rows {
            step(r + 1, c, &mut queue, &mut dist, &mut reached);
        }
        if c > 0 {
            step(r, c - 1, &mut queue, &mut dist, &mut reached);
        }
        if c + 1 < cols {
            step(r, c + 1, &mut queue, &mut dist, &mut reached);
        }
    }

    println!("{}", dist[rows - 1][cols - 1]);
    println!("REACHED {}", reached);
}
'''
hints = [
  "A VecDeque used as a queue is the whole difference between BFS and DFS here.",
  "Mark a cell when you push it, not when you pop it, or it goes into the queue several times.",
  "The distance grid doubles as the visited set: -1 means not seen yet, so you need no second structure.",
]

