[[quest]]
id           = "rust.hacker.07.coins"
node         = 7
title        = "EXACT CHANGE"
difficulty   = 5
time_limit_s = 1200
story        = "The Percival Street till has three coin trays and a customer who will not take a note."
concepts     = ["dynamic-programming", "complexity", "slices"]
requires     = ["rust.hacker.06.stack"]
map          = { x = 0.898, y = 0.144, kind = "quest" }
brief        = '''
Line one is `n target`. Line two is `n` coin values. Every coin is available
in unlimited quantity.

Print the smallest number of coins that makes `target` exactly, or `-1` if it
cannot be made. Then print `REACH <k>`: how many of the amounts `0..=target`
can be made at all, counting `0`.

```
input:  3 11
        1 2 5
output: 3
        REACH 12
```

The hidden cases are small, so what they catch is wrongness rather than
slowness — and one of them catches the usual wrong answer. Greedy, taking the
biggest coin that fits and repeating, makes `6` out of `3 4` by grabbing the
`4` and then failing, and there is a case for exactly that. The other bad
answer, plain recursion with no table, is not caught here and still is not the
one to write: `target` is 100000 in the real thing and the same amount gets
recomputed thousands of times.
'''
starter      = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let target = values[1] as usize;
    let coins = &values[2..2 + n];

    let best = vec![i64::MAX; target + 1];
    let _ = coins;

    // fill the table bottom up, then print the answer and REACH <k>
    let _ = best;
    println!("-1");
    println!("REACH 0");
}
'''
solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let target = values[1] as usize;
    let coins = &values[2..2 + n];

    let unreachable = i64::MAX;
    let mut best = vec![unreachable; target + 1];
    best[0] = 0;

    for amount in 1..=target {
        for &coin in coins {
            let coin = coin as usize;
            if coin <= amount && best[amount - coin] != unreachable {
                let candidate = best[amount - coin] + 1;
                if candidate < best[amount] {
                    best[amount] = candidate;
                }
            }
        }
    }

    if best[target] == unreachable {
        println!("-1");
    } else {
        println!("{}", best[target]);
    }
    println!("REACH {}", best.iter().filter(|v| **v != unreachable).count());
}
'''
