solution     = '''
use std::io::Read;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

/// Fenwick tree, 1-based internally. `add` and `prefix` are both O(log n).
struct Fenwick {
    tree: Vec<i64>,
}

impl Fenwick {
    fn new(n: usize) -> Fenwick {
        Fenwick { tree: vec![0; n + 1] }
    }

    fn add(&mut self, index: usize, delta: i64) {
        let mut i = index + 1;
        while i < self.tree.len() {
            self.tree[i] += delta;
            i += i & i.wrapping_neg(); // step up by the lowest set bit
        }
    }

    fn prefix(&self, upto: usize) -> i64 {
        let mut i = upto;
        let mut sum = 0;
        while i > 0 {
            sum += self.tree[i];
            i -= i & i.wrapping_neg();
        }
        sum
    }

    fn range(&self, l: usize, r: usize) -> i64 {
        self.prefix(r + 1) - self.prefix(l)
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, q, seed) = (p[0] as usize, p[1] as usize, p[2]);

    let mut rng = Rng(seed);
    let mut fenwick = Fenwick::new(n);
    for i in 0..n {
        fenwick.add(i, (rng.next() % 1000) as i64);
    }

    let mut total = 0i64;
    let mut updates = 0usize;
    for _ in 0..q {
        let (a, b, c) = (rng.next(), rng.next(), rng.next());
        if a % 2 == 0 {
            fenwick.add((b as usize) % n, (c % 1000 + 1) as i64);
            updates += 1;
        } else {
            let (mut l, mut r) = ((b as usize) % n, (c as usize) % n);
            if l > r {
                std::mem::swap(&mut l, &mut r);
            }
            total += fenwick.range(l, r);
        }
    }

    println!("{}", total);
    println!("UPDATES {}", updates);
}
'''
hints = [
  "Build the tree by calling add once per initial value. The O(n) bottom-up build is a nice optimisation and is not what the clock is testing.",
  "i & i.wrapping_neg() isolates the lowest set bit. Adding it walks up the tree; subtracting it walks down.",
  "range(l, r) is prefix(r + 1) - prefix(l), and getting that pair of off-by-ones right is most of the debugging.",
]

