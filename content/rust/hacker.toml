solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<i64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    // tails[i] = the smallest value an increasing subsequence of length i+1
    // can end on. It is sorted, always.
    let mut tails: Vec<i64> = Vec::new();
    for &value in &nums {
        let mut low = 0usize;
        let mut high = tails.len();
        while low < high {
            let mid = low + (high - low) / 2;
            if tails[mid] < value {
                low = mid + 1;
            } else {
                high = mid;
            }
        }
        if low == tails.len() {
            tails.push(value);
        } else {
            tails[low] = value;
        }
    }

    println!("{}", tails.len());
    println!("TAILS {}", tails.len());
}
'''
