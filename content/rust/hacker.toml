solution     = '''
use std::io::Read;

fn generate(n: usize, seed: u64) -> Vec<i64> {
    let mut x = seed;
    let mut values = Vec::with_capacity(n);
    for _ in 0..n {
        x = x
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        values.push(((x >> 33) % 1_000_000_007) as i64);
    }
    values
}

/// Merge sort over values[lo..hi], returning how many inversions it removed.
fn sort_count(values: &mut Vec<i64>, scratch: &mut Vec<i64>, lo: usize, hi: usize) -> i64 {
    if hi - lo < 2 {
        return 0;
    }
    let mid = (lo + hi) / 2;
    let mut inversions = sort_count(values, scratch, lo, mid)
        + sort_count(values, scratch, mid, hi);

    let (mut left, mut right, mut out) = (lo, mid, lo);
    while left < mid && right < hi {
        if values[left] <= values[right] {
            scratch[out] = values[left];
            left += 1;
        } else {
            // values[left..mid] are all greater than values[right]
            inversions += (mid - left) as i64;
            scratch[out] = values[right];
            right += 1;
        }
        out += 1;
    }
    while left < mid {
        scratch[out] = values[left];
        left += 1;
        out += 1;
    }
    while right < hi {
        scratch[out] = values[right];
        right += 1;
        out += 1;
    }
    values[lo..hi].copy_from_slice(&scratch[lo..hi]);
    inversions
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let parts: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, seed) = (parts[0] as usize, parts[1]);

    let mut values = generate(n, seed);
    let max = *values.iter().max().unwrap_or(&0);

    let mut scratch = vec![0i64; n];
    let inversions = sort_count(&mut values, &mut scratch, 0, n);

    println!("{}", inversions);
    println!("MAX {}", max);
}
'''
hints = [
  "Take the max before you sort, or sort a copy. The merge sort reorders the array under you.",
  "When the right-hand value wins the merge, every remaining element of the left half is greater than it — that is `mid - left` inversions in one go, and it is the whole trick.",
  "A Fenwick tree over the compressed values is the other O(n log n) answer and is worth naming in the room; merge sort is less code under a clock.",
]

