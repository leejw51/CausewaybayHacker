solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let nums: Vec<u64> = input
        .split_whitespace()
        .skip(1)
        .map(|t| t.parse().unwrap())
        .collect();

    let mut alone: u64 = 0;
    for &value in &nums {
        alone ^= value;
    }

    let mut bits = 0u32;
    let mut walk = alone;
    while walk != 0 {
        walk &= walk - 1;
        bits += 1;
    }

    let power_of_two = alone != 0 && alone & (alone - 1) == 0;
    let cleared = if alone == 0 { 0 } else { alone & (alone - 1) };

    println!("{}", alone);
    println!("{}", bits);
    println!("POW2 {}", if power_of_two { "YES" } else { "NO" });
    println!("{}", cleared);
}
'''
