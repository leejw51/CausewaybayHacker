solution     = '''
use std::io::Read;

fn search(grid: &mut Vec<Vec<u8>>, r: usize, c: usize, word: &[u8], at: usize) -> bool {
    if grid[r][c] != word[at] {
        return false;
    }
    if at + 1 == word.len() {
        return true;
    }

    let here = grid[r][c];
    grid[r][c] = b'#';

    let rows = grid.len();
    let cols = grid[0].len();
    let mut found = false;
    if r > 0 && search(grid, r - 1, c, word, at + 1) {
        found = true;
    }
    if !found && r + 1 < rows && search(grid, r + 1, c, word, at + 1) {
        found = true;
    }
    if !found && c > 0 && search(grid, r, c - 1, word, at + 1) {
        found = true;
    }
    if !found && c + 1 < cols && search(grid, r, c + 1, word, at + 1) {
        found = true;
    }

    grid[r][c] = here;
    found
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut lines = input.lines();
    let mut header = lines.next().unwrap().split_whitespace();
    let rows: usize = header.next().unwrap().parse().unwrap();
    let cols: usize = header.next().unwrap().parse().unwrap();
    let mut grid: Vec<Vec<u8>> = (0..rows)
        .map(|_| lines.next().unwrap().as_bytes().to_vec())
        .collect();
    let word = lines.next().unwrap().as_bytes().to_vec();

    let mut starts = 0usize;
    let mut found = false;
    for r in 0..rows {
        for c in 0..cols {
            if grid[r][c] == word[0] {
                starts += 1;
            }
        }
    }
    for r in 0..rows {
        for c in 0..cols {
            if search(&mut grid, r, c, &word, 0) {
                found = true;
            }
        }
    }

    println!("{}", if found { "FOUND" } else { "ABSENT" });
    println!("STARTS {}", starts);
}
'''
