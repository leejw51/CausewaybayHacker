solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let original: Vec<Vec<i64>> = (0..n)
        .map(|r| (0..n).map(|c| values[1 + r * n + c]).collect())
        .collect();

    let mut grid = original.clone();
    for r in 0..n {
        for c in (r + 1)..n {
            let swap = grid[r][c];
            grid[r][c] = grid[c][r];
            grid[c][r] = swap;
        }
    }
    for row in grid.iter_mut() {
        row.reverse();
    }
    for row in &grid {
        let line: Vec<String> = row.iter().map(|v| v.to_string()).collect();
        println!("{}", line.join(" "));
    }

    let mut spiral: Vec<String> = Vec::new();
    let (mut top, mut bottom) = (0isize, n as isize - 1);
    let (mut left, mut right) = (0isize, n as isize - 1);
    while top <= bottom && left <= right {
        for c in left..=right {
            spiral.push(original[top as usize][c as usize].to_string());
        }
        top += 1;
        for r in top..=bottom {
            spiral.push(original[r as usize][right as usize].to_string());
        }
        right -= 1;
        if top <= bottom {
            for c in (left..=right).rev() {
                spiral.push(original[bottom as usize][c as usize].to_string());
            }
            bottom -= 1;
        }
        if left <= right {
            for r in (top..=bottom).rev() {
                spiral.push(original[r as usize][left as usize].to_string());
            }
            left += 1;
        }
    }
    println!("{}", spiral.join(" "));
}
'''
hints = [
  "Transpose by swapping only above the diagonal — c starting at r + 1 — or you swap everything back.",
  "The spiral wants the original grid, so keep a copy before you rotate in place.",
  "The two `if` guards inside the spiral loop are what stop a single middle row or column being walked twice.",
]

