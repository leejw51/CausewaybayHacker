requires     = ["rust.hacker.31.palindrome"]
map          = { x = 0.335, y = 0.936, kind = "quest" }
brief        = '''
Standard input is `n q seed`. Generate `q` queries, in wrapping `u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for each of the q queries:
    a = next() % (n + 1)
    b = next() % (a + 1)          # so 0 <= b <= a <= n
```

For each query compute the binomial coefficient `C(a, b)` **modulo
1000000007**. Print the sum of all `q` answers, itself modulo `1000000007`,
then `LAST <the final query's answer>`.

```
input:  10 5 3
output: 209
        LAST 1
```

`C(a, b)` has hundreds of thousands of digits at these sizes, so it is never
computed and then reduced — every multiplication is reduced as you go. The
problem is the division: `a! / (b! (a-b)!)` has no meaning in modular
arithmetic. What replaces it is the **modular inverse**, and because
`1000000007` is prime, Fermat's little theorem gives it to you:
`inverse(v) = v^(p-2) mod p`, computed by fast exponentiation in about thirty
squarings.

So: precompute `factorial[0..=n]` once, and answer each query as
`f[a] * inv(f[b]) * inv(f[a-b])`.

**The complexity here is enforced.** One hidden case is `n = 200000`,
`q = 200000`. Computing each coefficient independently — multiply `b` terms,
divide by `b` terms, one modular inverse each — does not finish in the five
second run limit; that is the starter. One shared factorial table finishes in
about forty milliseconds. Both measured on this machine.

Every intermediate is a product of two values below `2^30`, so it fits in an
`i64` and nothing overflows. In a language with 32-bit `int` it would not, and
that is the other half of why this question gets asked.
'''
starter      = '''
use std::io::Read;

const P: i64 = 1_000_000_007;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn power(mut base: i64, mut exp: i64) -> i64 {
    let mut result = 1i64;
    base %= P;
    while exp > 0 {
        if exp & 1 == 1 {
            result = result * base % P;
        }
        base = base * base % P;
        exp >>= 1;
    }
    result
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, q, seed) = (p[0] as usize, p[1] as usize, p[2]);

    let mut rng = Rng(seed);
    let (mut sum, mut last) = (0i64, 0i64);
    for _ in 0..q {
        let a = (rng.next() as usize) % (n + 1);
        let b = (rng.next() as usize) % (a + 1);

        // correct, and far too slow: b multiplications and a modular inverse
        // for every single query
        let mut numerator = 1i64;
        let mut denominator = 1i64;
        for k in 0..b {
            numerator = numerator * (((a - k) as i64) % P) % P;
            denominator = denominator * (((k + 1) as i64) % P) % P;
        }
        let value = numerator * power(denominator, P - 2) % P;

        sum = (sum + value) % P;
        last = value;
    }

    println!("{}", sum);
    println!("LAST {}", last);
}
'''
solution     = '''
use std::io::Read;

const P: i64 = 1_000_000_007;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

/// base^exp mod P, by repeated squaring: about 30 steps for a 30-bit exponent.
fn power(mut base: i64, mut exp: i64) -> i64 {
    let mut result = 1i64;
    base %= P;
    while exp > 0 {
        if exp & 1 == 1 {
            result = result * base % P;
        }
        base = base * base % P;
        exp >>= 1;
    }
    result
}

/// P is prime, so Fermat gives v^(P-2) as the inverse of v.
fn inverse(v: i64) -> i64 {
    power(v, P - 2)
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, q, seed) = (p[0] as usize, p[1] as usize, p[2]);

    // one shared factorial table for every query
    let mut factorial = vec![1i64; n + 1];
    for i in 1..=n {
        factorial[i] = factorial[i - 1] * (i as i64) % P;
    }

    let mut rng = Rng(seed);
    let (mut sum, mut last) = (0i64, 0i64);
    for _ in 0..q {
        let a = (rng.next() as usize) % (n + 1);
        let b = (rng.next() as usize) % (a + 1);

        let value = factorial[a] * inverse(factorial[b]) % P * inverse(factorial[a - b]) % P;

        sum = (sum + value) % P;
        last = value;
    }

    println!("{}", sum);
    println!("LAST {}", last);
}
'''
hints = [
  "Reduce after every multiplication, never at the end. i64 holds the product of two values below P; it does not hold a factorial.",
  "inverse(v) is power(v, P - 2), and it only works because P is prime — that is the whole content of Fermat's little theorem here.",
  "Precomputing inverse factorials as well, backwards from inverse(factorial[n]), removes the two power() calls per query. Not needed to pass, and worth saying out loud.",
]

