use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut tokens = input.split_whitespace();
    let commands: usize = tokens.next().unwrap().parse().unwrap();

    let mut items: Vec<i64> = Vec::new();

    for _ in 0..commands {
        match tokens.next().unwrap_or("") {
            "ADD" => {
                // the argument is a second token of the same command
                let cents: i64 = tokens.next().unwrap_or("0").parse().unwrap_or(0);
                items.push(cents);
            }
            "VOID" => {
                items.pop();
            }
            "TOTAL" => println!("{}", items.iter().sum::<i64>()),
            "CLEAR" => items.clear(),
            _ => {}
        }
    }

    println!("COMMANDS {}", commands);
    println!("ITEMS {}", items.len());
}
