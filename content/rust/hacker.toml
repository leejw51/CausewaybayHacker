solution     = '''
use std::io::Read;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, alphabet, seed) = (p[0] as usize, p[1], p[2]);

    let mut rng = Rng(seed);
    let s: Vec<u8> = (0..n)
        .map(|_| b'a' + (rng.next() % alphabet) as u8)
        .collect();

    let (mut best_len, mut best_start) = (0usize, 0usize);
    let mut expand = |mut i: i64, mut j: i64, best_len: &mut usize, best_start: &mut usize| {
        while i >= 0 && (j as usize) < n && s[i as usize] == s[j as usize] {
            i -= 1;
            j += 1;
        }
        // i and j have each stepped one too far
        let start = (i + 1) as usize;
        let len = (j - i - 1) as usize;
        if len > *best_len {
            *best_len = len;
            *best_start = start;
        }
    };

    for centre in 0..n {
        // odd length: one character at the middle
        expand(centre as i64, centre as i64, &mut best_len, &mut best_start);
        // even length: the gap to the right of it
        expand(centre as i64, centre as i64 + 1, &mut best_len, &mut best_start);
    }

    println!("{}", best_len);
    println!("AT {}", best_start);
}
'''
