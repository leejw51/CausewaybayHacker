input:  3 11
        1 2 5
output: 3
        REACH 12
```

`target` goes to 100000. The greedy answer — take the biggest coin that fits,
repeat — is wrong on `3 6 / 3 4`, and the recursive answer without a table
recomputes the same amount thousands of times.
'''
starter      = '''
