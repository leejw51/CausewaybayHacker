map          = { x = 0.114, y = 0.663, kind = "quest" }
brief        = '''
Standard input is `n m seed`: `n` stops, `m` undirected weighted edges. Build
the graph yourself, with **exactly** this generator, in wrapping `u64`:

```
x = seed
next():  x = x * 6364136223846793005 + 1442695040888963407
         return x >> 33

for i in 1..n:                  # a spanning tree first, so it is connected
    p = next() % i
    w = next() % 1000 + 1
    edge (p, i, w)
for the remaining m - (n-1) edges:
    a = next() % n
    b = next() % n
    w = next() % 1000 + 1
    edge (a, b, w)
```

Print the sum of the shortest distances from stop `0` to every reachable stop
(including `0` itself, which is `0`), then `MAX <the largest of them>`.

```
input:  6 8 1
output: 4594
        MAX 1582
```

**The complexity here is enforced.** One hidden case is `n = 100000`,
`m = 200000`. Dijkstra is the right algorithm either way; what the clock
decides is the priority queue. Scanning every unvisited node for the minimum
is `O(V²)`, and it takes **about sixteen seconds** against a five second run
limit. A binary heap makes it `O((V + E) log V)` and it finishes in **about
fifty milliseconds**. Both numbers measured on this machine, with the two
programs that ship in this quest: the starter is the scanning version.

Worth seeing clearly, because it is the most common way to fail a timed
screen: **the starter is not wrong.** It prints exactly the right answer. It
is rejected only for arriving three times too late.

`std::collections::BinaryHeap` is a max-heap, so push `Reverse((distance,
node))`. It has no decrease-key, and you do not need one: push the improved
distance as a new entry and skip any entry you pop whose distance is already
worse than the one you have recorded. That "stale entry" skip is the line
people forget, and without it the heap grows without bound.
'''
starter      = '''
use std::io::Read;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn build(n: usize, m: usize, seed: u64) -> Vec<Vec<(usize, i64)>> {
    let mut rng = Rng(seed);
    let mut graph: Vec<Vec<(usize, i64)>> = vec![Vec::new(); n];
    for i in 1..n {
        let p = (rng.next() as usize) % i;
        let w = (rng.next() % 1000 + 1) as i64;
        graph[p].push((i, w));
        graph[i].push((p, w));
    }
    for _ in 0..m.saturating_sub(n - 1) {
        let a = (rng.next() as usize) % n;
        let b = (rng.next() as usize) % n;
        let w = (rng.next() % 1000 + 1) as i64;
        graph[a].push((b, w));
        graph[b].push((a, w));
    }
    graph
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, m, seed) = (p[0] as usize, p[1] as usize, p[2]);

    let graph = build(n, m, seed);
    let mut dist = vec![i64::MAX; n];
    let mut done = vec![false; n];
    dist[0] = 0;

    // correct, and far too slow: the minimum is found by scanning every node
    for _ in 0..n {
        let mut best = usize::MAX;
        let mut best_dist = i64::MAX;
        for u in 0..n {
            if !done[u] && dist[u] < best_dist {
                best_dist = dist[u];
                best = u;
            }
        }
        if best == usize::MAX {
            break;
        }
        done[best] = true;
        for &(v, w) in &graph[best] {
            if best_dist + w < dist[v] {
                dist[v] = best_dist + w;
            }
        }
    }

    let reached: Vec<i64> = dist.into_iter().filter(|&d| d < i64::MAX).collect();
    println!("{}", reached.iter().sum::<i64>());
    println!("MAX {}", reached.iter().max().cloned().unwrap_or(0));
}
'''
solution     = '''
use std::cmp::Reverse;
use std::collections::BinaryHeap;
use std::io::Read;

struct Rng(u64);

impl Rng {
    fn next(&mut self) -> u64 {
        self.0 = self
            .0
            .wrapping_mul(6364136223846793005)
            .wrapping_add(1442695040888963407);
        self.0 >> 33
    }
}

fn build(n: usize, m: usize, seed: u64) -> Vec<Vec<(usize, i64)>> {
    let mut rng = Rng(seed);
    let mut graph: Vec<Vec<(usize, i64)>> = vec![Vec::new(); n];
    for i in 1..n {
        let p = (rng.next() as usize) % i;
        let w = (rng.next() % 1000 + 1) as i64;
        graph[p].push((i, w));
        graph[i].push((p, w));
    }
    for _ in 0..m.saturating_sub(n - 1) {
        let a = (rng.next() as usize) % n;
        let b = (rng.next() as usize) % n;
        let w = (rng.next() % 1000 + 1) as i64;
        graph[a].push((b, w));
        graph[b].push((a, w));
    }
    graph
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let p: Vec<u64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let (n, m, seed) = (p[0] as usize, p[1] as usize, p[2]);

    let graph = build(n, m, seed);
    let mut dist = vec![i64::MAX; n];
    dist[0] = 0;

    let mut heap: BinaryHeap<Reverse<(i64, usize)>> = BinaryHeap::new();
    heap.push(Reverse((0, 0)));
    while let Some(Reverse((d, u))) = heap.pop() {
        // a stale entry: we already found a shorter way to u
        if d > dist[u] {
            continue;
        }
        for &(v, w) in &graph[u] {
            if d + w < dist[v] {
                dist[v] = d + w;
                heap.push(Reverse((d + w, v)));
            }
        }
    }

    let reached: Vec<i64> = dist.into_iter().filter(|&d| d < i64::MAX).collect();
    println!("{}", reached.iter().sum::<i64>());
    println!("MAX {}", reached.iter().max().cloned().unwrap_or(0));
}
'''
