solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let target = values[1] as usize;
    let coins = &values[2..2 + n];

    let unreachable = i64::MAX;
    let mut best = vec![unreachable; target + 1];
    best[0] = 0;

    for amount in 1..=target {
        for &coin in coins {
            let coin = coin as usize;
            if coin <= amount && best[amount - coin] != unreachable {
                let candidate = best[amount - coin] + 1;
                if candidate < best[amount] {
                    best[amount] = candidate;
                }
            }
        }
    }

    if best[target] == unreachable {
        println!("-1");
    } else {
        println!("{}", best[target]);
    }
    println!("REACH {}", best.iter().filter(|v| **v != unreachable).count());
}
'''
hints = [
  "best[0] = 0, and best[a] is one more than the cheapest best[a - coin] over every coin that fits.",
  "Guard against reading an unreachable cell before you add one to it, or it overflows.",
  "REACH is just how many cells of the finished table are not still marked unreachable.",
]

