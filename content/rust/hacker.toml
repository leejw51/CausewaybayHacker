solution     = '''
use std::cmp::Reverse;
use std::collections::BinaryHeap;
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let mut values = input.split_whitespace().map(|t| t.parse::<i64>().unwrap());
    let k = values.next().unwrap() as usize;

    let mut lists: Vec<Vec<i64>> = Vec::with_capacity(k);
    for _ in 0..k {
        let count = values.next().unwrap() as usize;
        lists.push((0..count).map(|_| values.next().unwrap()).collect());
    }

    // (value, which list, how far into it)
    let mut heap: BinaryHeap<Reverse<(i64, usize, usize)>> = BinaryHeap::new();
    for (which, list) in lists.iter().enumerate() {
        if let Some(&first) = list.first() {
            heap.push(Reverse((first, which, 0)));
        }
    }

    let mut out: Vec<String> = Vec::new();
    while let Some(Reverse((value, which, at))) = heap.pop() {
        out.push(value.to_string());
        if at + 1 < lists[which].len() {
            heap.push(Reverse((lists[which][at + 1], which, at + 1)));
        }
    }

    println!("{}", out.join(" "));
    println!("POPS {}", out.len());
}
'''
