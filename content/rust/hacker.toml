id           = "rust.hacker.06.stack"
node         = 6
title        = "THE NEXT BIGGER ONE"
difficulty   = 4
time_limit_s = 900
story        = "A column of fares on the board and one question: for each of them, which is the next one after it that is bigger."
concepts     = ["stacks-queues", "slices", "complexity"]
requires     = ["rust.hacker.05.binary-search"]
map          = { x = 0.822, y = 0.054, kind = "quest" }
brief        = '''
Line one is `n`. Line two is `n` integers.

For each entry print the first entry **to its right** that is strictly
greater, or `-1` if there is none. Put them on one line, space separated. Then
print `NONE <k>`, how many of them were `-1`.

```
input:  4
        2 1 2 4
output: 4 2 4 -1
        NONE 1
```

Keep a stack of positions whose answer is still unknown, and it stays
decreasing from the bottom up. Each position is pushed once and popped once,
so the whole thing is one pass however it looks.
'''
starter      = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let nums = &values[1..1 + n];

    let answer = vec![-1i64; n];
    let _pending: Vec<usize> = Vec::new();
    let _ = nums;

    let line: Vec<String> = answer.iter().map(|v| v.to_string()).collect();
    println!("{}", line.join(" "));
    println!("NONE {}", n);
}
'''
solution     = '''
use std::io::Read;

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let nums = &values[1..1 + n];

    let mut answer = vec![-1i64; n];
    let mut pending: Vec<usize> = Vec::new();

    for i in 0..n {
        while let Some(&top) = pending.last() {
            if nums[top] < nums[i] {
                answer[top] = nums[i];
                pending.pop();
            } else {
                break;
            }
        }
        pending.push(i);
    }

    let line: Vec<String> = answer.iter().map(|v| v.to_string()).collect();
    println!("{}", line.join(" "));
    println!("NONE {}", answer.iter().filter(|v| **v == -1).count());
}
'''
hints = [
  "The stack holds indices that are still waiting for their answer, not values.",
  "When the new value beats the value at the top of the stack, that index's answer is the new value — and keep popping, it may beat several.",
  "Strictly greater, so equal values do not resolve each other; they stack up and resolve together later.",
]

