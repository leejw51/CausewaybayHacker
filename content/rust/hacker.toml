solution     = '''
use std::io::Read;

fn present(tree: &[i64], i: usize) -> bool {
    i < tree.len() && tree[i] != -1
}

fn valid(tree: &[i64], i: usize, low: i64, high: i64) -> bool {
    if !present(tree, i) {
        return true;
    }
    let value = tree[i];
    if value <= low || value >= high {
        return false;
    }
    valid(tree, 2 * i + 1, low, value) && valid(tree, 2 * i + 2, value, high)
}

fn find(tree: &[i64], target: i64) -> Option<usize> {
    let mut i = 0usize;
    let mut depth = 1usize;
    while present(tree, i) {
        if tree[i] == target {
            return Some(depth);
        }
        i = if target < tree[i] { 2 * i + 1 } else { 2 * i + 2 };
        depth += 1;
    }
    None
}

fn main() {
    let mut input = String::new();
    std::io::stdin().read_to_string(&mut input).unwrap();
    let values: Vec<i64> = input
        .split_whitespace()
        .map(|t| t.parse().unwrap())
        .collect();
    let n = values[0] as usize;
    let q = values[1] as usize;
    let tree = &values[2..2 + n];
    let queries = &values[2 + n..2 + n + q];

    println!("{}", if valid(tree, 0, i64::MIN, i64::MAX) { "VALID" } else { "INVALID" });
    for &target in queries {
        match find(tree, target) {
            Some(depth) => println!("{} FOUND {}", target, depth),
            None => println!("{} ABSENT", target),
        }
    }
}
'''
