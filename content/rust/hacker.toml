brief        = '''
Line one is `n k`. Line two is `n` words separated by spaces.

Print the `k` most frequent words, most frequent first, ties broken by the
word ascending, one per line. If there are fewer than `k` distinct words,
print all of them. Then print `DISTINCT <d>`.

```
input:  6 2
        tram tram bus bus bus mtr
output: bus
        tram
        DISTINCT 3
```

Count with a hash map, then rank. The tie-break is not decoration — a sort
that is not stable on it gives a different answer on a different machine, and
this is the question where that gets noticed.
'''
starter      = '''
