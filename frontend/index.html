<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <title>Causewaybay Hacker</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CWB Hacker" />
    <!-- Installable: Add to Home Screen opens it full screen, with the status
         bar drawn over the page's own indigo (the layers keep clear of it,
         see the safe-area insets in style.css). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1030" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three stacked layers, all the same size and all driven by one Layout:
         the WebGL parallax behind, the pixel-art 2D canvas over it, and the DOM
         overlay on top for the things a canvas is bad at — the editor, and any
         field somebody has to paste twelve words into. -->
    <canvas id="fx"></canvas>
    <canvas id="game"></canvas>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
