# Causewaybay Hacker — the art, and how to make it again
#
# Every file in art/ came out of art/tools/gen.sh, which calls
# art/tools/grok_image.sh (Grok / xAI, model grok-imagine-image) and then
# art/tools/process.py. This file is the recipe for the whole set: change the
# direction, edit a prompt, re-run, and the set is re-rolled.
#
#     art/tools/gen.sh map_rust bg 3:2 1152 768 center "..."
#
# Conventions inherited from CausewaybayGolang, which shipped this pipeline:
#
#   * BACKGROUNDS are 3:2 (or 2:3 for the portrait variants) and carry a flat,
#     level ground line across the bottom fifth of the frame, because the world
#     code pins the ground there. Delivered as JPEG at 1152x768 / 768x1152.
#   * SPRITES are 1:1 on a SOLID MAGENTA field. process.py runs the same
#     border-seeded flood fill love2d/src/assets.lua runs, so the magenta
#     becomes transparency and pink *inside* the sprite survives. Delivered as
#     PNG with binary alpha (0 or 255 — the engine scales by an integer factor
#     and a soft edge becomes mud).
#   * NEVER ask for lettering. Grok cannot spell. Every word the player reads
#     is printed by the engine in Press Start 2P, over the art, including the
#     word on the CLEARED stamp — see docs/design-review.md.
#   * NEVER ask for magenta, hot pink, fuchsia or rose IN THE ARTWORK of a
#     sprite. Learned the hard way on `neon_signs` and `fg_wires`: asked for a
#     hot pink sign, Grok painted it in (252,35,176) — the studio backdrop's
#     own colour — and the knockout removed it, because those are the same
#     pixels and no predicate can tell them apart. A sprite that wants a pink
#     uses crimson or violet, or the whole thing is shot on the lime backdrop
#     that process.py also keys (`is_bg`). Backgrounds are unaffected: they are
#     never keyed.
#   * A STRIP is one render, cut up afterwards. `walk_mei` is four figures in a
#     single 3:2 image; art/tools/strip.py takes the largest N ink components
#     left to right and bottom-aligns them on a common row. Asking Grok for a
#     neat grid does not work; asking for "a row, evenly spaced, never
#     touching, identical height and colours" does.
#
# `rerolls` is how many generations that asset took before one was accepted.
# It is the useful number for whoever runs the next batch.

