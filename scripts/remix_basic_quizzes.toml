# REMIX LAND — BASIC: the quiz on every quest. scripts/remix_pack.py reads
# this file and writes each entry as the quest's [quest.quiz] in
# content/remix/basic.toml, so edit the quizzes here, not there.
#
# One table per quest id. `answer` is the 0-based index of the right
# choice, which is a contiguous run of the quest's solution lines, verbatim
# (indentation aside) and found there exactly once: the server cuts it out
# and the player picks which of the four fills the hole. Each wrong choice,
# swapped in, must make the program fail its tests — verify_pack runs that.
# Choices are dedented to the hole; Go keeps its tabs.

