# A throwaway pack for the backend's own tests: the Go land exists in the
# content and cannot be judged by this build, which is the case the server has
# to refuse cleanly. NOT the shipped content.
pack = "go.basic"
land = "go"
category = "basic"
version = 1

[[quest]]
id          = "go.basic.01.hello"
node        = 1
title       = "ANOTHER STREET"
difficulty  = 1
story       = "A different alphabet, the same city."
concepts    = ["io", "strings"]
requires    = []
map         = { x = 0.15, y = 0.70, kind = "quest" }
brief       = '''
Print `hello, causewaybay` and nothing else.
'''
starter     = '''
package main

func main() {
	// your code here
}
'''
solution    = '''
package main

import "fmt"

func main() {
	fmt.Println("hello, causewaybay")
}
'''
hints = [
  "`fmt.Println` adds the newline for you.",
]

[quest.tests]
harness      = "stdio"
timeout_ms   = 5000
match        = "trim"
cases = [
  { name = "greets", stdin = "", expect = "hello, causewaybay\n", visible = true },
]

[[quest]]
id          = "go.basic.02.testing"
node        = 2
title       = "A HARNESS FROM THE WRONG LAND"
difficulty  = 1
story       = "Some doors are drawn on the map before they are cut."
concepts    = ["functions", "error-handling"]
requires    = []
map         = { x = 0.25, y = 0.66, kind = "quest" }
brief       = '''
This quest declares the `cargo` harness on a Go quest, which no build will
ever run. It exists so the "refuse without recording anything" rule stays
tested whatever the current set of built harnesses happens to be — the rule is
about what the server writes when it cannot judge, not about which gap.
'''
starter     = '''
package main

func main() {}
'''
solution    = '''
package main

func main() {}
'''
hints = []

[quest.tests]
harness      = "cargo"
timeout_ms   = 5000
match        = "trim"
cases = [
  { name = "runs", stdin = "", expect = "ok\n", visible = true },
]
