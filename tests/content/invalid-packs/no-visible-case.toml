# SPEC §12: at least one case must be visible, so a player is never guessing
# blind about the output format.
pack = "rust.basic"
land = "rust"
category = "basic"
version = 1

[[quest]]
id = "rust.basic.01.hidden"
node = 1
title = "BLIND"
difficulty = 1
concepts = ["io"]
requires = []
map = { x = 0.1, y = 0.1, kind = "quest" }
brief = "Print it."
starter = '''fn main() {}
'''
solution = '''fn main() { println!("a"); }
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "a", stdin = "", expect = "a\n", visible = false } ]
