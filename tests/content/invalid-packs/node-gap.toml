# SPEC §12: node is 1-based and contiguous. A gap is an error, because the map
# draws a path through them.
pack = "rust.basic"
land = "rust"
category = "basic"
version = 1

[[quest]]
id = "rust.basic.01.hello"
node = 1
title = "FIRST LIGHT"
difficulty = 1
concepts = ["io"]
requires = []
map = { x = 0.12, y = 0.74, kind = "quest" }
brief = "Print it."
starter = '''fn main() {}
'''
solution = '''fn main() { println!("a"); }
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "a", stdin = "", expect = "a\n", visible = true } ]

[[quest]]
id = "rust.basic.03.third"
node = 3
title = "THIRD"
difficulty = 1
concepts = ["io"]
requires = ["rust.basic.01.hello"]
map = { x = 0.3, y = 0.6, kind = "quest" }
brief = "Print it."
starter = '''fn main() {}
'''
solution = '''fn main() { println!("b"); }
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "b", stdin = "", expect = "b\n", visible = true } ]
