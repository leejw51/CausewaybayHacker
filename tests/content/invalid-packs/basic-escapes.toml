# SPEC §12, as amended: code fields use TOML LITERAL strings ('''), because
# """ processes backslash escapes and silently rewrites a '\n' inside quest
# source into a real newline. This pack uses """ for `starter`, so the
# backslash-n below is no longer two characters by the time it reaches rustc,
# and the quest's own lesson is destroyed on import.
#
# An importer that accepts this is one that will corrupt a player's starter
# code without anything looking wrong.
pack = "rust.basic"
land = "rust"
category = "basic"
version = 1

[[quest]]
id = "rust.basic.01.escapes"
node = 1
title = "ESCAPES"
difficulty = 1
concepts = ["io"]
requires = []
map = { x = 0.1, y = 0.1, kind = "quest" }
brief = "Print a literal backslash-n."
starter = """
fn main() {
    // print the two characters '\n', not a newline
}
"""
solution = '''fn main() {
    println!("{}", "\\n");
}
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "a", stdin = "", expect = "\\n\n", visible = true } ]
