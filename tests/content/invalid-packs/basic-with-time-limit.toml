# The other direction: a non-hacker quest carrying `time_limit_s`. The clock
# is the hacker category's whole identity; a timer on a grammar drill is a
# content mistake, not a feature.
pack = "rust.basic"
land = "rust"
category = "basic"
version = 1

[[quest]]
id = "rust.basic.01.timed"
node = 1
title = "TIMED"
difficulty = 1
time_limit_s = 300
concepts = ["io"]
requires = []
map = { x = 0.1, y = 0.1, kind = "quest" }
brief = "Print it."
starter = '''fn main() {}
'''
solution = '''fn main() { println!("a"); }
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "a", stdin = "", expect = "a\n", visible = true } ]
