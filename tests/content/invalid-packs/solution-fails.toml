# SPEC §9.4: a quest whose own reference answer does not pass is a broken
# quest, and there is no other way to find out.
pack = "rust.basic"
land = "rust"
category = "basic"
version = 1

[[quest]]
id = "rust.basic.01.broken"
node = 1
title = "BROKEN"
difficulty = 1
concepts = ["io"]
requires = []
map = { x = 0.1, y = 0.1, kind = "quest" }
brief = "Print it."
starter = '''fn main() {}
'''
solution = '''fn main() {
    println!("the wrong thing");
}
'''
[quest.tests]
harness = "stdio"
timeout_ms = 5000
match = "trim"
cases = [ { name = "a", stdin = "", expect = "a\n", visible = true } ]
