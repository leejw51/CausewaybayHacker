# CI — what `make check` runs, split so a failure names itself.
#
# The parts are independent programs with their own toolchains, so each gets
# its own job and fails separately:
#
#   backend   the Rust workspace (core, runner, server, cli) — fmt, clippy, tests.
#             The runner tests compile and run real Rust and Go programs, so
#             both toolchains are installed even though only Rust is built.
#   cli       the terminal client, its own crate with its own conformance suite.
#   frontend  tsc, vitest, and the production build the server ships.
#   love2d    the LÖVE client: the key library (Rust), the headless suite under
#             LuaJIT (no window — the layout cases skip themselves and say so),
#             and the .love archive, checked for every module and painting.
#   love2d-window
#             the same client with a window, under Xvfb: the layout and scene
#             cases, and the type sweep — every type step in both orientations
#             through a real RUN against the server built from this checkout.
#   content   the slow gate: every reference solution is accepted and no starter
#             is, and every §7.1 mistake fixture still compiles to what it claims.
#
# Two more only build: `package-server` on every run, because a tarball that
# cannot start outside a checkout is the kind of break that is otherwise found
# after a tag; and `package-gui` on macOS once a change has landed on main,
# because the app needs a macOS runner and a pull request should not pay for
# one. Both are dry runs of `make package` — the release workflow is where the
# artifacts are signed for real and attached to a release.
#
# Not here: the browser suite (e2e/), the §8 smoke and the shared-vector
# regeneration. All three need the sibling CausewaybayWallet binary, which a
# checkout of this repository does not have. `make test-all` runs them on a
# machine that does, and says exactly what it skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, declared rather than inherited. Nothing here publishes anything —
# the release workflow is where write access belongs — and on a public
# repository an undeclared block takes whatever the repository default happens
# to be, which is not a thing to leave to a setting.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned to the version development happens on, so clippy and rustfmt can
  # never disagree with a local `make check`. The crates' own floor is the
  # `rust-version` in each Cargo.toml.
  RUST_TOOLCHAIN: "1.97.1"
  # What the runner hands submitted Go programs to; matches `make doctor`.
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap, and it is the number a tag will later be compared against: the
      # four manifests (backend, cli, love2d/ffi, frontend) have to agree.
      - name: Every manifest agrees on one version
        run: make version

  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # The runner tests hand real programs to `go build` and `go test`
      # (backend/runner/src/go.rs), so a runner without Go fails them for a
      # reason that has nothing to do with the code under test.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - run: cd backend && cargo fmt --check
      - run: cd backend && cargo clippy --all-targets --workspace -- -D warnings
      - run: cd backend && cargo test --workspace

  cli:
    name: CLI (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      # `make -C cli check` is fmt-check, lint and test; listed separately so
      # a formatting nit does not read as a failing conformance suite.
      - run: make -C cli fmt-check
      - run: make -C cli lint
      - run: make -C cli test

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      # The bundle the server serves. `make art` first, so the build carries
      # the same paintings a checkout does rather than whatever was last
      # copied into public/.
      - run: make art
      - run: cd frontend && npm run build

  love2d:
    name: LÖVE client (key library, headless suite, archive)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: love2d/ffi

      # LÖVE embeds LuaJIT, so LuaJIT is what the client runs on. Testing
      # against plain Lua would test a language the client never uses — and
      # could not, since only LuaJIT has the `ffi` module the key library
      # needs.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit zip rsync

      - run: cd love2d/ffi && cargo fmt --check
      - run: cd love2d/ffi && cargo clippy --all-targets -- -D warnings
      # Listed separately so a Rust build failure does not read as a Lua
      # test failure. `test-headless` loads the library `ffi` just built.
      - run: make -C love2d ffi
      - run: make -C love2d ffi-test
      - run: make -C love2d lint
      - run: make -C love2d test-headless
      # The archive a release ships, checked for every module and painting.
      - run: make -C love2d love-file

  # The LÖVE client with a window — the layout and scene cases the headless
  # job has to skip, and the type sweep: every type step in both orientations
  # through lands → categories → map → quest, with a real RUN against a real
  # server and the geometry asserted. Ubuntu's `love` package is 11.5, the
  # version the client is written for; Xvfb is the window server the runner
  # does not have, and SDL's dummy audio driver stands in for the sound card
  # it does not have either. The server is the one built from this checkout,
  # started on a temporary home with the content packs imported.
  love2d-window:
    name: LÖVE client (windowed suite and type sweep, under Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # The sweep RUNs a Go program, so the server needs Go to compile it.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            backend
            love2d/ffi

      - name: Install LÖVE, LuaJIT and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends love luajit xvfb zip rsync
          love --version

      - run: make -C love2d ffi
      - run: cd backend && cargo build -p cwbhacker

      - name: Start the server
        run: |
          home=$(mktemp -d)
          echo "CWBH_HOME=$home" >> "$GITHUB_ENV"
          nohup backend/target/debug/cwbhacker serve --bind 127.0.0.1:5390 \
            --home "$home" --content content --strict-content \
            > "$home/server.log" 2>&1 &
          # No frontend build here, so `/` is a 404 by design; `/art/` is
          # served from the checkout and is what says the server is up.
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5390/art/manifest.json >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:5390/art/manifest.json >/dev/null || { cat "$home/server.log"; exit 1; }
          grep -q "content imported" "$home/server.log" || { cat "$home/server.log"; exit 1; }

      - name: The suite, with a window
        env:
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a -s "-screen 0 1280x800x24" make -C love2d test

      - name: The type sweep, against the server
        env:
          SDL_AUDIODRIVER: dummy
          CWBH_SERVER: ws://127.0.0.1:5390/ws
        run: >
          xvfb-run -a -s "-screen 0 1280x1000x24"
          make -C love2d drive SCRIPT=tests/drive/typesweep.lua ARGS="--home $(mktemp -d)"

      - name: The story and title drives
        env:
          SDL_AUDIODRIVER: dummy
          CWBH_SERVER: ws://127.0.0.1:5390/ws
        run: |
          home=$(mktemp -d)
          xvfb-run -a make -C love2d drive SCRIPT=tests/drive/story.lua ARGS="--home $home"
          xvfb-run -a make -C love2d drive SCRIPT=tests/drive/story.lua ARGS="--home $home"

      - name: Server log
        if: always()
        run: tail -50 "$CWBH_HOME/server.log" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: love2d-screens
          path: ~/.local/share/love/causewaybay-hacker/*.png
          if-no-files-found: ignore
          retention-days: 7

  content:
    name: Content (solutions, starters, mistake fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The data-race fixture is checked with `go run -race`, and the first
      # `-race` build on a fresh runner instruments the standard library from
      # scratch — minutes of work that blew the generator's per-run timeout
      # before the fixture itself was even compiled. Warmed once here, into
      # the cache the generator is then told to share (it builds under a
      # temporary cache of its own otherwise, which is right for a laptop
      # and wrong for a runner).
      # ThreadSanitizer, which Go's race runtime is built on, assumes the
      # address-space layout the kernel's default ASLR entropy gives it.
      # Ubuntu's runner images raise `vm.mmap_rnd_bits` to 32, and under
      # that a `-race` binary can hang or die with "unexpected memory
      # mapping" — which is what a ten-minute `go run -race` of a
      # twenty-line fixture was. 28 is the value TSan was written for.
      - name: Give ThreadSanitizer the address space it expects
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Warm the race-instrumented standard library
        run: |
          go build -race std
          echo "CWBH_GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # The data-race fixture on its own first, with its stderr in the log,
      # so a race runtime that cannot start on this runner says why here
      # rather than as a timeout inside the generator.
      - name: The race fixture, alone, in the generator's own environment
        run: |
          d=$(mktemp -d) && cp tests/vectors/mistakes/go/data-race.go "$d/main.go"
          cd "$d"
          # Exactly what tests/vectors/mistakes/generate.py hands `go`: its
          # own GOPATH and module cache, -mod=mod, no proxy, and stdout and
          # stderr through pipes. `-x` prints every command `go` runs, so a
          # stall names the command it stalled on. `go run -race` exits 66
          # when it finds the race it is here to find, and the step's shell
          # runs with -e: the report is the point, the exit status is not.
          export GOCACHE="$CWBH_GOCACHE" GOMODCACHE="$d/gomodcache" GOPATH="$d/gopath" GOFLAGS=-mod=mod GOPROXY=off
          go env GOCACHE GOMODCACHE GOPATH GOFLAGS GOPROXY CGO_ENABLED CC
          { time timeout 120 go run -x -race main.go 2>&1 | tail -60 | cat; } || echo "exit=$?"
          echo "--- and once more, warm:"
          { time timeout 120 go run -race main.go 2>&1 | tail -5 | cat; } || echo "exit=$?"

      # Every §7.1 taxonomy fixture still compiles to the code it claims.
      - run: python3 tests/vectors/mistakes/generate.py --check

      # Every reference solution is accepted and no starter is (SPEC §9.4,
      # §9.5); a brief's worked example matches a visible case; and
      # `--complete` fails on a concept no mistake kind can reach.
      - run: >
          python3 tests/content/verify_pack.py --complete
          content/rust/basic.toml content/rust/advanced.toml content/rust/hacker.toml
          content/go/basic.toml content/go/advanced.toml content/go/hacker.toml

  # A dry run of the server tarball, on every push and pull request. It is the
  # whole release path minus signing: the frontend and both binaries are
  # built, staged with the content beside them, and the staged server is
  # started from outside the checkout to prove it can find its own frontend
  # and import its own packs. That is exactly what `make start` never tests.
  package-server:
    name: Package the server (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            backend
            cli

      - run: make package-server

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: server-linux-unsigned
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The LÖVE app, once a change has landed on main. macOS only, because that
  # is what the bundle is, and not on pull requests, because a macOS runner is
  # the expensive one. Ad-hoc signed — the release workflow does it for real.
  package-gui:
    name: Package the LÖVE app (dry run, macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: love2d/ffi

      # The smoke test starts the bundle and waits for a frame, and a runner
      # has no window server to draw into. `verify-archive` still runs and
      # catches the missing-module class of fault deterministically.
      - run: make package-gui SKIP_SMOKE=1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: love2d-macos-unsigned
          path: |
            dist/*.zip
            dist/*.love
          if-no-files-found: error
          retention-days: 7
