# CI — what `make check` runs, split so a failure names itself.
#
# The parts are independent programs with their own toolchains, so each gets
# its own job and fails separately:
#
#   backend   the Rust workspace (core, runner, server, cli) — fmt, clippy, tests.
#             The runner tests compile and run real Rust, Go, C++ and Python
#             programs, so all four toolchains are present even though only
#             Rust is built: Go and Python are installed, and the C++ compiler
#             is the one ubuntu-24.04 ships (g++ 13); only clang-format, which
#             the C++ format tests need, has to be added by hand.
#   cli       the terminal client, its own crate with its own conformance suite.
#   frontend  tsc, vitest, and the production build the server ships.
#   content   the slow gate: every reference solution is accepted and no starter
#             is, and every §7.1 mistake fixture still compiles to what it claims.
#
# Two more only build: `package-server` on every run, because a tarball that
# cannot start outside a checkout is the kind of break that is otherwise found
# after a tag; and `package-tauri`, the desktop app, on macOS once a change has
# landed on main, because the app needs a macOS runner and a pull request
# should not pay for one. Both are dry runs of `make package` — the release workflow is where the
# artifacts are signed for real and attached to a release.
#
#   browser   one slice of the browser suite: the playground's draft surviving a
#             closed tab, and a save on one device reaching another — asking
#             which to keep when the other has unsaved typing. `make test-sync`,
#             which builds the server and the e2e bundle and starts its own
#             server. It signs in with a published fixture key, so it needs
#             no wallet and, saving rather than running, no compiler.
#
# Not here: the rest of the browser suite (e2e/), the §8 smoke and the
# shared-vector regeneration. All three need the sibling CausewaybayWallet
# binary, which a checkout of this repository does not have. `make test-all`
# runs them on a machine that does, and says exactly what it skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, declared rather than inherited. Nothing here publishes anything —
# the release workflow is where write access belongs — and on a public
# repository an undeclared block takes whatever the repository default happens
# to be, which is not a thing to leave to a setting.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned to the version development happens on, so clippy and rustfmt can
  # never disagree with a local `make check`. The crates' own floor is the
  # `rust-version` in each Cargo.toml.
  RUST_TOOLCHAIN: "1.97.1"
  # What the runner hands submitted Go programs to; matches `make doctor`.
  GO_VERSION: "1.27"
  # What the runner hands submitted Python programs to (SPEC §5.1 needs 3.10+;
  # this is the version development happens on).
  PYTHON_VERSION: "3.13"
  # What PyTorch Land's quests import, pinned like every other toolchain here.
  # The reason is sharper than for the rest, because a pack's expected output
  # is a number: `pytorch.hacker.18.adam` prints `-0.123053` for four steps of
  # a float32 Adam, and a bump that changes a kernel, a default or the RNG
  # would turn a green suite red in a way that reads like broken content.
  #
  # The content is in fact robust to this — every case of all 122 quests was
  # re-verified byte for byte on torch 2.8.0 / python 3.9 and again on
  # 2.14.0 / python 3.13, both on macOS arm64, which is a different arch, a
  # different interpreter and six minor versions apart — so the pin is not
  # load-bearing for correctness. It is here so that the day one of them does
  # move, it moves in a diff someone wrote on purpose.
  #
  # The CPU index is ~200MB against the default build's ~2GB of CUDA that no
  # runner here has a card for. `numpy` is imported by no quest and installed
  # anyway: without it torch writes "Failed to initialize NumPy" to stderr on
  # every import, which is every run of every node, into `attempts.stderr`
  # and in front of the player.
  TORCH_VERSION: "2.14.0"
  TORCH_INDEX: "https://download.pytorch.org/whl/cpu"
  # The C++ compiler is not installed but pinned by the runner image: `c++`
  # on ubuntu-24.04 is g++ 13, which has all of C++20 the quests use. This
  # records the expectation so a runner-image bump that changes it is a
  # deliberate edit here, not a surprise in a fixture diff.
  #
  # The vendor and the major version, and deliberately **not** the program
  # name. GCC's driver prints the name it was invoked as, so `c++ --version`
  # opens with `c++ (Ubuntu 13.3.0-...)` and `g++ --version` with `g++ (Ubuntu
  # 13.3.0-...)` — the same compiler, two different first words. The check
  # below runs `c++` because that is what the runner and `verify_pack.py` hand
  # the quests to, so pinning `g++` there failed on a correct image.
  CXX_EXPECTED: "(Ubuntu 13"
  NODE_VERSION: "24"
  # TypeScript Land's compiler (SPEC §5.1). Pinned, because a quest's
  # starter is asserted to *fail* and a newer checker can find a new reason
  # for it to — or stop finding the old one. The same version the frontend
  # locks (frontend/package-lock.json), so the content gate on a laptop
  # and here check with one tsc and format with one prettier.
  TYPESCRIPT_VERSION: "5.9.3"
  PRETTIER_VERSION: "3.9.6"
  # Zig Land's compiler (SPEC §5.1). Pinned harder than most: the `std` API
  # moves between releases (0.16 renamed the whole I/O layer), so a pack
  # verified on one version is not known to compile on the next. The same
  # version `make doctor` names and the runner's hint asks for.
  ZIG_VERSION: "0.16.0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap, and it is the number a tag will later be compared against: the
      # four manifests (backend, cli, frontend, desktop) have to agree.
      - name: Every manifest agrees on one version
        run: make version

  backend:
    name: Backend (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # The runner tests hand real programs to `go build` and `go test`
      # (backend/runner/src/go.rs), so a runner without Go fails them for a
      # reason that has nothing to do with the code under test.
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The runner also hands programs to `c++` and `python3`. The compiler is
      # the image's own (pinned above by expectation, checked here); Python
      # is installed to the version the fixtures were captured with; and
      # clang-format is the one piece the image does not carry, needed by
      # the C++ `code.format` tests.
      - name: Check the image's C++ compiler and install clang-format
        run: |
          c++ --version | head -1
          c++ --version | head -1 | grep -F "$CXX_EXPECTED"
          sudo apt-get update -q && sudo apt-get install -y -q clang-format
          clang-format --version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `black` is the Python land's formatter (backend/runner/src/format.rs),
      # and `code.format` is a wire feature, not a convenience — so a runner
      # that cannot format Python is a runner this job has to fail on. It is
      # a pip install into the interpreter the tests already need; nothing
      # else in the image provides it.
      - name: Install black, the Python formatter
        run: |
          python3 -m pip install --quiet --disable-pip-version-check black
          python3 -m black --version

      # PyTorch Land is the fifth land (SPEC §0) and `torch` is the one thing
      # its 122 quests cannot run without. Version, index and the numpy
      # beside it are all explained at TORCH_VERSION above. `python3 -I` —
      # which is how the runner starts a program (SPEC §5.1) — drops
      # PYTHONPATH and the user site directory but not the interpreter's own
      # site-packages, which is where pip puts this, so the import is checked
      # the way a quest will actually do it, and the way `doctor` asks
      # (runner/src/format.rs: TORCH_PROBE).
      - name: Install torch, the PyTorch land's toolchain
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            --index-url ${{ env.TORCH_INDEX }} torch==${{ env.TORCH_VERSION }} numpy
          python3 -I -c "import torch, numpy; print(torch.__version__)"
          test -z "$(python3 -I -c 'import torch' 2>&1)" \
            || { echo "importing torch writes to stderr; it lands in every attempt"; exit 1; }

      # TypeScript Land is the sixth land: `tsc` checks `main.ts` and `node`
      # runs what it emits (runner/src/typescript.rs). Installed globally,
      # because the runner looks for both on PATH exactly as the server does
      # on a player's machine; prettier is the land's `code.format`.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tsc and prettier, the TypeScript land's toolchain
        run: |
          npm install --global --no-fund --no-audit \
            typescript@${{ env.TYPESCRIPT_VERSION }} prettier@${{ env.PRETTIER_VERSION }}
          tsc --version
          prettier --version

      # Zig Land is the eighth land (runner/src/zig.rs) and Lua Land the
      # ninth (runner/src/lua.rs). `zig` is pinned to the version the packs
      # were verified on; `luajit` is Ubuntu's LuaJIT 2.1, the one the Lua
      # packs were verified on. Neither is a plain `lua`.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install LuaJIT, the Lua land's interpreter
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends luajit
          zig version
          luajit -v

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - run: cd backend && cargo fmt --check
      - run: cd backend && cargo clippy --all-targets --workspace -- -D warnings
      - run: cd backend && cargo test --workspace

  cli:
    name: CLI (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli

      # `make -C cli check` is fmt-check, lint and test; listed separately so
      # a formatting nit does not read as a failing conformance suite.
      - run: make -C cli fmt-check
      - run: make -C cli lint
      - run: make -C cli test

  frontend:
    name: Frontend (tsc, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm test
      # The bundle the server serves. `make art` first, so the build carries
      # the same paintings a checkout does rather than whatever was last
      # copied into public/.
      - run: make art
      - run: cd frontend && npm run build

  browser:
    name: Browser (playground sync, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - run: cd frontend && npm ci
      - run: cd e2e && npm ci
      # Chromium and the system libraries it needs; `make test-sync` only
      # fetches the browser, and a bare runner has neither.
      - run: cd e2e && npx playwright install --with-deps chromium
      - run: make test-sync
        env:
          CI: "1"

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  content:
    name: Content (solutions, starters, mistake fixtures)
    runs-on: ubuntu-24.04
    # Every wrong quiz choice is swapped into its hole and built too —
    # three more builds a quest; `verify_pack.py` judges quests in parallel.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The runner also hands programs to `c++` and `python3`. The compiler is
      # the image's own (pinned above by expectation, checked here); Python
      # is installed to the version the fixtures were captured with; and
      # clang-format is the one piece the image does not carry, needed by
      # the C++ `code.format` tests.
      - name: Check the image's C++ compiler and install clang-format
        run: |
          c++ --version | head -1
          c++ --version | head -1 | grep -F "$CXX_EXPECTED"
          sudo apt-get update -q && sudo apt-get install -y -q clang-format
          clang-format --version

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PyTorch Land is the fifth land (SPEC §0) and `torch` is the one thing
      # its 122 quests cannot run without. Version, index and the numpy
      # beside it are all explained at TORCH_VERSION above. `python3 -I` —
      # which is how the runner starts a program (SPEC §5.1) — drops
      # PYTHONPATH and the user site directory but not the interpreter's own
      # site-packages, which is where pip puts this, so the import is checked
      # the way a quest will actually do it, and the way `doctor` asks
      # (runner/src/format.rs: TORCH_PROBE).
      - name: Install torch, the PyTorch land's toolchain
        run: |
          python3 -m pip install --quiet --disable-pip-version-check \
            --index-url ${{ env.TORCH_INDEX }} torch==${{ env.TORCH_VERSION }} numpy
          python3 -I -c "import torch, numpy; print(torch.__version__)"
          test -z "$(python3 -I -c 'import torch' 2>&1)" \
            || { echo "importing torch writes to stderr; it lands in every attempt"; exit 1; }

      # TypeScript Land is the sixth land: `tsc` checks `main.ts` and `node`
      # runs what it emits (runner/src/typescript.rs). Installed globally,
      # because the runner looks for both on PATH exactly as the server does
      # on a player's machine; prettier is the land's `code.format`.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install tsc and prettier, the TypeScript land's toolchain
        run: |
          npm install --global --no-fund --no-audit \
            typescript@${{ env.TYPESCRIPT_VERSION }} prettier@${{ env.PRETTIER_VERSION }}
          tsc --version
          prettier --version

      # Zig Land is the eighth land (runner/src/zig.rs) and Lua Land the
      # ninth (runner/src/lua.rs). `zig` is pinned to the version the packs
      # were verified on; `luajit` is Ubuntu's LuaJIT 2.1, the one the Lua
      # packs were verified on. Neither is a plain `lua`.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install LuaJIT, the Lua land's interpreter
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends luajit
          zig version
          luajit -v

      # The data-race fixture is checked with `go run -race`, and the first
      # `-race` build on a fresh runner instruments the standard library from
      # scratch — minutes of work that blew the generator's per-run timeout
      # before the fixture itself was even compiled. Warmed once here, into
      # the cache the generator is then told to share (it builds under a
      # temporary cache of its own otherwise, which is right for a laptop
      # and wrong for a runner).
      # ThreadSanitizer, which Go's race runtime is built on, assumes the
      # address-space layout the kernel's default ASLR entropy gives it.
      # Ubuntu's runner images raise `vm.mmap_rnd_bits` to 32, and under
      # that a `-race` binary can hang or die with "unexpected memory
      # mapping" — which is what a ten-minute `go run -race` of a
      # twenty-line fixture was. 28 is the value TSan was written for.
      - name: Give ThreadSanitizer the address space it expects
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Warm the race-instrumented standard library
        run: |
          go build -race std
          echo "CWBH_GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"

      # The data-race fixture on its own first, with its stderr in the log,
      # so a race runtime that cannot start on this runner says why here
      # rather than as a timeout inside the generator.
      - name: The race fixture, alone, in the generator's own environment
        run: |
          d=$(mktemp -d) && cp tests/vectors/mistakes/go/data-race.go "$d/main.go"
          cd "$d"
          # Exactly what tests/vectors/mistakes/generate.py hands `go`: its
          # own GOPATH and module cache, -mod=mod, no proxy, and stdout and
          # stderr through pipes. `-x` prints every command `go` runs, so a
          # stall names the command it stalled on. `go run -race` exits 66
          # when it finds the race it is here to find, and the step's shell
          # runs with -e: the report is the point, the exit status is not.
          export GOCACHE="$CWBH_GOCACHE" GOMODCACHE="$d/gomodcache" GOPATH="$d/gopath" GOFLAGS=-mod=mod GOPROXY=off
          go env GOCACHE GOMODCACHE GOPATH GOFLAGS GOPROXY CGO_ENABLED CC
          { time timeout 120 go run -x -race main.go 2>&1 | tail -60 | cat; } || echo "exit=$?"
          echo "--- and once more, warm:"
          { time timeout 120 go run -race main.go 2>&1 | tail -5 | cat; } || echo "exit=$?"

      # Every §7.1 taxonomy fixture still compiles to the code it claims.
      - run: python3 tests/vectors/mistakes/generate.py --check

      # Every reference solution is accepted and no starter is (SPEC §9.4,
      # §9.5); a brief's worked example matches a visible case; and
      # `--complete` fails on a concept no mistake kind can reach.
      - run: >
          python3 tests/content/verify_pack.py --complete
          content/rust/basic.toml content/rust/advanced.toml content/rust/hacker.toml
          content/rust/frameworks.toml
          content/go/basic.toml content/go/advanced.toml content/go/hacker.toml
          content/cpp/basic.toml content/cpp/advanced.toml content/cpp/hacker.toml
          content/python/basic.toml content/python/advanced.toml content/python/hacker.toml
          content/pytorch/verybasic.toml content/pytorch/basic.toml
          content/pytorch/advanced.toml content/pytorch/hacker.toml
          content/remix/verybasic.toml content/remix/basic.toml
          content/zig/verybasic.toml content/zig/basic.toml
          content/zig/advanced.toml content/zig/hacker.toml
          content/lua/verybasic.toml content/lua/basic.toml
          content/lua/advanced.toml content/lua/hacker.toml
          content/rust/cheatsheet.toml content/go/cheatsheet.toml
          content/cpp/cheatsheet.toml content/python/cheatsheet.toml
          content/pytorch/cheatsheet.toml content/typescript/cheatsheet.toml
          content/zig/cheatsheet.toml content/lua/cheatsheet.toml
          content/remix/cheatsheet.toml

      # A printed zero must be an exact zero. `pytorch.advanced.17.layernorm`
      # prints the mean of a normalised row: zero by construction, `1.49e-08`
      # in float32, and negative that on this runner — so `round(..., 4)` gave
      # `-0.0` here and `0.0` on the arm64 Mac the pack was verified on, and
      # the step above went red for a reason that was not in the content. The
      # check runs each solution twice with the sign of such zeros flipped and
      # fails if the output changes. Pytorch only: it is the one land whose
      # answers are floats.
      - run: python3 tests/content/zero_sign.py content/pytorch/*.toml

      # Every translation file under content/i18n/<locale>/ that EXISTS keeps
      # every rule of SPEC §12.1: real quest ids, matching hint counts, '''
      # strings, and the English brief's fenced code blocks verbatim. A
      # language, and since 2026-09-28 every pack in every language, is
      # complete: --require-complete fails the job on a quest left untranslated.
      #
      # That split is deliberate. Translating 207 quests into five languages
      # is incremental, and a gate that only goes green on the last one is red
      # for months and so tells nobody anything — while the defects that
      # actually matter (a half-written file left by an interrupted session, a
      # hint dropped so every later hint is off by one) are exactly the ones
      # this catches today. `--require-complete` is for the final sweep.
      #
      # `content/i18n` is a directory of translations, not a pack, so the
      # packs are named land by land rather than with `content/*/*.toml`.
      - run: >
          python3 tests/content/verify_pack.py --i18n --require-complete
          content/rust/*.toml content/go/*.toml content/cpp/*.toml content/python/*.toml
          content/pytorch/*.toml content/typescript/*.toml content/remix/*.toml
          content/zig/*.toml content/lua/*.toml

  # A dry run of the server tarball, on every push and pull request. It is the
  # whole release path minus signing: the frontend and both binaries are
  # built, staged with the content beside them, and the staged server is
  # started from outside the checkout to prove it can find its own frontend
  # and import its own packs. That is exactly what `make start` never tests.
  package-server:
    name: Package the server (dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            backend
            cli

      - run: make package-server

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: server-linux-unsigned
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The desktop app, once a change has landed on main: macOS only, and not on
  # pull requests, because a macOS runner is the expensive one. Ad-hoc signed; the release workflow
  # signs and notarises it for real. Its fmt check runs here rather than in
  # `backend`, because desktop/ is its own crate outside that workspace.
  package-tauri:
    name: Package the desktop app (dry run, Tauri, macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop

      - run: cd desktop && cargo fmt --check
      - run: make tauri APPLE_SIGNING_IDENTITY=-
      - run: make tauri-gatekeeper

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-macos-unsigned
          path: dist/CausewaybayHacker-Desktop-*.zip
          if-no-files-found: error
          retention-days: 7
